<script>
const MAX=50;
const $=id=>document.getElementById(id);
const host=location.hostname;

const REAL=ON_KAIFUN && /^sub\./.test(host);               // on an actual sub.* host -> depth comes from the hostname
const realUrl=n=> n===0? "https://kaifun.fun/sub.html" : "https://"+"sub.".repeat(n)+"kaifun.fun/";
let depth= REAL? (host.match(/sub\./g)||[]).length : Math.max(0,Math.min(MAX,parseInt((location.hash||"#0").slice(1))||0));
let best=+(localStorage.getItem("sub_best")||0);
const B='<button class="sub btn" id="subBtn">GO SUB ▼</button>';
const U='<button class="up" id="upBtn">▲ surface</button>';
// ---------- shared helpers ----------
function mul32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let AC=null; function tone(f,d,type,vol){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.type=type||"square"; o.frequency.value=f; g.gain.value=vol||0.08; g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+(d||0.15)); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+(d||0.15)); }catch(e){} }
function save(k,v){ try{ localStorage.setItem("sub_"+k,JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v=JSON.parse(localStorage.getItem("sub_"+k)); return v===null||v===undefined? d : v; }catch(e){ return d; } }
function goLevel(n){ n=Math.max(0,Math.min(MAX,n)); if(n>best){ best=n; localStorage.setItem("sub_best",best); } if(ON_KAIFUN){ location.href=realUrl(n); return; } depth=n; render(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function levelLink(n){ return ON_KAIFUN? realUrl(n) : "#"+n; }
// ---------- THE FIFTY ----------
const T=[];
// 0 — surface
T[0]={c:`#site{padding:40px 16px;text-align:center;} h1{font-size:clamp(30px,8vw,70px);font-weight:900;word-break:break-all;line-height:1;} p{max-width:520px;margin:14px auto;line-height:1.6;}
  .sub{border:3px solid #141414;border-radius:14px;background:#f5b829;font-weight:900;font-size:30px;padding:16px 40px;box-shadow:5px 5px 0 #141414;}

 h:`<h1>SUBSUBSUBSUBSUBSUB…</h1><p>fifty subdomains. fifty completely different websites, each with something to actually do. the button goes one deeper.</p>${B}<div class="map" id="map"></div><p style="font-size:12px;opacity:.6">the map fills in as you visit levels. yellow = been there.</p>`,

T[1]={c:`#site{background:#fff;font-family:"Times New Roman",serif;padding:16px;} h1{font-size:24px;} hr{margin:8px 0;} .sub{color:#00e;text-decoration:underline;background:none;border:0;font-size:16px;font-family:inherit;}
  input,textarea{font-family:inherit;border:1px solid #888;padding:3px;} .gb{border:1px dashed #888;padding:8px;margin-top:8px;font-size:14px;} .gb div{border-bottom:1px dotted #aaa;padding:4px 0;}`,
 h:`<h1>Welcome to my Home Page</h1><hr><p>This is sub #1. You are visitor number <b id="hits">0</b>. Best viewed at 800x600.</p><p><b>Links:</b></p><ul><li>${B}</li><li>${U}</li></ul><hr>

T[2]={c:`#site{background:#000;color:#0f0;font-family:"Courier New",monospace;padding:16px;font-size:14px;line-height:1.5;} #out div{white-space:pre-wrap;} #cmd{background:none;border:0;color:#0f0;font-family:inherit;font-size:14px;outline:none;width:70%;} .sub,.up{display:none;}`,

 js:()=>{ const out=$("out"), inp=$("cmd"); const p=t=>{ const d=document.createElement("div"); d.textContent=t; out.appendChild(d); window.scrollTo(0,document.body.scrollHeight); };

  const C={help:()=>p("commands: help ls cat whoami date echo fortune sub up clear level <n>"),ls:()=>p("README  button.sh  surface.sh  secrets/"),cat:a=>p(a==="README"?"there is nothing here except the way down.":a.startsWith("secrets")?"nice try.":"cat: "+a+": no such file"),whoami:()=>p("a visitor. two levels down."),date:()=>p(new Date().toString()),echo:a=>p(a),fortune:()=>p(rnd(F)),sub:()=>goLevel(depth+1),up:()=>goLevel(depth-1),clear:()=>out.innerHTML="",level:a=>goLevel(+a||0)};
  inp.onkeydown=e=>{ if(e.key!=="Enter") return; const line=inp.value.trim(); p("kai@sub2:~$ "+line); inp.value=""; const [c,...a]=line.split(" "); if(!c) return; (C[c]||(()=>p(c+": command not found")))(a.join(" ")); }; inp.focus(); $("site").onclick=()=>inp.focus(); }};

T[3]={c:`#site{background:#f4efe4;color:#222;font-family:Georgia,serif;padding:20px 16px;} .mast{font-family:"Times New Roman",serif;font-size:clamp(28px,7vw,56px);font-weight:900;text-align:center;border-bottom:3px double #222;padding-bottom:6px;letter-spacing:2px;}
  .cols{columns:2;column-gap:22px;max-width:720px;margin:14px auto;font-size:14px;line-height:1.6;text-align:justify;} h2{font-size:20px;column-span:all;margin:8px 0 4px;cursor:pointer;} h2:hover{text-decoration:underline;} .art{display:none;} .art.open{display:block;} .sub{font-family:inherit;border:2px solid #222;background:#fff;padding:8px 16px;font-weight:700;} .box{border:1px solid #222;padding:8px;font-size:13px;margin:8px 0;break-inside:avoid;}`,
 h:`<div class="mast">THE DAILY SUB</div><div style="text-align:center;font-size:12px;border-bottom:1px solid #222;padding:4px">Level Three · price: one click · click a headline to read</div><div class="cols" id="paper"></div>`,

  const H=["you will press exactly one button today.","a stranger will hand you a subdomain.","avoid level 26 after dark.","your lucky number is "+(1+Math.floor(Math.random()*50))+".","something you clicked will click back."];
  $("paper").innerHTML=arts.map((a,i)=>'<h2 data-i="'+i+'">'+a[0]+'</h2><p class="art" id="a'+i+'">'+a[1]+'</p>').join("")+'<div class="box"><b>HOROSCOPE</b><br><span id="horo">'+rnd(H)+'</span><br><button class="btn" id="hb" style="font-family:inherit;font-size:12px;margin-top:4px">another</button></div><p style="text-align:center;column-span:all">'+B+' '+U+'</p>';
  document.querySelectorAll("#paper h2").forEach(h=>h.onclick=()=>$("a"+h.dataset.i).classList.toggle("open")); $("hb").onclick=()=>$("horo").textContent=rnd(H); }};
// 4 — WINDOWS 95: a working desktop
T[4]={c:`#site{background:#008080;font-family:Tahoma,Arial,sans-serif;font-size:12px;overflow:hidden;height:calc(100vh - 42px);user-select:none;}
  .ico{position:absolute;width:74px;text-align:center;color:#fff;cursor:pointer;text-shadow:1px 1px 0 #000;} .ico div{font-size:32px;} .ico:hover{background:#00008022;}

  textarea{width:260px;height:150px;font-family:"Courier New",monospace;font-size:12px;border:2px inset #888;} .calc{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:170px;} .calc .w95b{padding:6px 0;} .cd{grid-column:1/5;background:#fff;border:2px inset #888;text-align:right;padding:4px;font-family:"Courier New",monospace;font-size:16px;height:26px;}

  #paintcv{background:#fff;border:2px inset #888;cursor:crosshair;} .pal{display:flex;gap:2px;margin-top:4px;} .pal div{width:16px;height:16px;border:1px solid #000;cursor:pointer;}
  .sub,.up{display:none;}`,
 h:`<div class="ico" style="left:12px;top:12px" data-w="np"><div>📝</div>Notepad</div><div class="ico" style="left:12px;top:92px" data-w="calc"><div>🧮</div>Calculator</div><div class="ico" style="left:12px;top:172px" data-w="ms"><div>💣</div>Minesweeper</div><div class="ico" style="left:12px;top:252px" data-w="paint"><div>🎨</div>Paint</div><div class="ico" style="left:12px;top:332px" data-w="subexe"><div>🕳</div>sub.exe</div><div class="ico" style="left:12px;top:412px" data-w="bin"><div>🗑</div>Recycle Bin</div>
  <div class="win" id="w-np" style="left:120px;top:30px"><div class="tb">Untitled - Notepad<span data-x="np">✕</span></div><div class="bd"><textarea id="npt" placeholder="type here. it saves."></textarea></div></div>
  <div class="win" id="w-calc" style="left:160px;top:80px"><div class="tb">Calculator<span data-x="calc">✕</span></div><div class="bd"><div class="calc" id="calc"><div class="cd" id="cd">0</div></div></div></div>
  <div class="win" id="w-ms" style="left:200px;top:60px"><div class="tb">Minesweeper<span data-x="ms">✕</span></div><div class="bd"><div id="msmsg" style="margin-bottom:4px">8×8, 10 mines. right-click to flag.</div><div class="ms" id="ms"></div><button class="w95b" id="msnew" style="margin-top:6px">New game</button></div></div>
  <div class="win" id="w-paint" style="left:240px;top:40px"><div class="tb">untitled - Paint<span data-x="paint">✕</span></div><div class="bd"><canvas id="paintcv" width="280" height="180"></canvas><div class="pal" id="pal"></div></div></div>
  <div class="win" id="w-subexe" style="left:180px;top:120px"><div class="tb">sub.exe<span data-x="subexe">✕</span></div><div class="bd"><p>⚠️ You are about to go one subdomain deeper.</p><p style="margin:8px 0">Are you sure?</p><button class="w95b" id="w95sub">OK</button> <button class="w95b" id="w95up">Go up instead</button></div></div>
  <div class="win" id="w-bin" style="left:220px;top:150px"><div class="tb">Recycle Bin<span data-x="bin">✕</span></div><div class="bd">🗑 jobsim.html<br>🗑 frameperfects.html<br>🗑 scanify.html<br><small>(they live at deleted.fun now)</small></div></div>
  <div id="menu"><div data-w="np">📝 Notepad</div><div data-w="calc">🧮 Calculator</div><div data-w="ms">💣 Minesweeper</div><div data-w="paint">🎨 Paint</div><div data-w="subexe">🕳 sub.exe</div><div id="shut">⏻ Shut Down (surface)</div></div>
  <div id="task"><button class="w95b" id="start">⊞ Start</button><span id="tasks"></span><span id="clock"></span></div>`,
 js:()=>{ let z=10; const open=w=>{ const el=$("w-"+w); el.classList.add("on"); el.style.zIndex=++z; $("menu").style.display="none"; if(w==="ms"&&!$("ms").children.length) newMs(); };
  document.querySelectorAll("[data-w]").forEach(e=>e.onclick=()=>open(e.dataset.w)); document.querySelectorAll("[data-x]").forEach(e=>e.onclick=(ev)=>{ev.stopPropagation(); $("w-"+e.dataset.x).classList.remove("on");});
  $("start").onclick=()=>$("menu").style.display= $("menu").style.display==="block"?"none":"block"; $("shut").onclick=()=>goLevel(depth-1);
  // drag windows
  document.querySelectorAll(".tb").forEach(tb=>{ tb.onpointerdown=e=>{ if(e.target.dataset.x) return; const w=tb.parentElement; w.style.zIndex=++z; const sx=e.clientX-w.offsetLeft, sy=e.clientY-w.offsetTop; const mv=ev=>{ w.style.left=(ev.clientX-sx)+"px"; w.style.top=(ev.clientY-sy)+"px"; }; const up=()=>{ removeEventListener("pointermove",mv); removeEventListener("pointerup",up); }; addEventListener("pointermove",mv); addEventListener("pointerup",up); }; });
  setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),1000); $("clock").textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  // notepad
  $("npt").value=load("np","");  $("npt").oninput=()=>save("np",$("npt").value);
  // calculator
  let cv="0", acc=null, op=null, fresh=true; const disp=()=>$("cd").textContent=cv;
  "789/456*123-0.=+C".split("").forEach(k=>{ const b=document.createElement("button"); b.className="w95b"; b.textContent=k; b.onclick=()=>{ if(k==="C"){cv="0";acc=null;op=null;fresh=true;} else if("+-*/".includes(k)){ acc=parseFloat(cv); op=k; fresh=true; } else if(k==="="){ if(op!==null){ const b2=parseFloat(cv); cv=String(op==="+"?acc+b2:op==="-"?acc-b2:op==="*"?acc*b2:b2===0?"nope":acc/b2); op=null; fresh=true; } } else { if(fresh||cv==="0"){ cv=k==="."?"0.":k; fresh=false; } else if(!(k==="."&&cv.includes("."))) cv+=k; } disp(); }; $("calc").appendChild(b); });
  // minesweeper
  let mines=[], open_=[], flag=[], dead=false; const idx=(x,y)=>y*8+x;
  function newMs(){ mines=new Array(64).fill(0); open_=new Array(64).fill(0); flag=new Array(64).fill(0); dead=false; let n=0; while(n<10){ const i=Math.floor(Math.random()*64); if(!mines[i]){mines[i]=1;n++;} } $("msmsg").textContent="8×8, 10 mines. right-click to flag."; drawMs(); }
  const near=i=>{ const x=i%8,y=(i-x)/8; let c=0; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const nx=x+dx,ny=y+dy; if(nx>=0&&ny>=0&&nx<8&&ny<8&&mines[idx(nx,ny)]) c++; } return c; };

  function drawMs(){ const g=$("ms"); g.innerHTML=""; let left=0; for(let i=0;i<64;i++){ const d=document.createElement("div"); if(open_[i]){ d.className="o"+(mines[i]?" m":""); d.textContent=mines[i]?"💣":(near(i)||""); d.style.color=["","#00f","#080","#f00","#008","#800","#088","#000","#888"][near(i)]; } else { d.textContent=flag[i]?"🚩":""; left++; }
    d.onclick=()=>{ if(dead) return; reveal(i); drawMs(); }; d.oncontextmenu=e=>{ e.preventDefault(); if(dead||open_[i]) return; flag[i]=1-flag[i]; drawMs(); }; g.appendChild(d); }

      g.fillStyle=f.c; g.beginPath(); g.ellipse(f.x,f.y,f.s,f.s*0.55,0,0,7); g.fill(); g.beginPath(); const d=f.vx>0?-1:1; g.moveTo(f.x+d*f.s,f.y); g.lineTo(f.x+d*f.s*1.6,f.y-f.s*0.5); g.lineTo(f.x+d*f.s*1.6,f.y+f.s*0.5); g.fill(); g.fillStyle="#000"; g.beginPath(); g.arc(f.x-d*f.s*0.5,f.y-2,2,0,7); g.fill(); }); food=food.filter(f=>f.y<360); },30); }};

T[18]={c:`#site{background:#fff;font-family:Arial,sans-serif;font-size:12px;padding:8px;} table{border-collapse:collapse;} td,th{border:1px solid #ccc;min-width:80px;height:24px;padding:0;} th{background:#f3f3f3;font-weight:400;color:#666;text-align:center;} td input{width:100%;height:100%;border:0;padding:3px 6px;font-family:inherit;font-size:12px;} td input:focus{outline:2px solid #1a73e8;} .fb{font-family:"Courier New",monospace;color:#555;margin:6px 0;} .sub{font-family:inherit;font-size:12px;border:1px solid #1a73e8;background:#e8f0fe;padding:4px 10px;margin-top:8px;}`,

  const val=(k,seen)=>{ seen=seen||{}; if(seen[k]) return "#LOOP"; seen[k]=1; const v=cells[k]||""; if(!v.startsWith("=")) return isNaN(parseFloat(v))? v : parseFloat(v); let ex=v.slice(1).toUpperCase(); ex=ex.replace(/SUM\(([A-F])(\d+):([A-F])(\d+)\)/g,(m,c1,r1,c2,r2)=>{ let s=0; for(let c=L.indexOf(c1);c<=L.indexOf(c2);c++) for(let r=+r1;r<=+r2;r++){ const x=val(L[c]+r,Object.assign({},seen)); if(typeof x==="number") s+=x; } return s; }); ex=ex.replace(/[A-F]\d+/g,m=>{ const x=val(m,Object.assign({},seen)); return typeof x==="number"? x : 0; }); if(!/^[\d.+\-*/() ]+$/.test(ex)) return "#ERR"; try{ const r=Function("return ("+ex+")")(); return isFinite(r)? Math.round(r*1000)/1000 : "#DIV"; }catch(e){ return "#ERR"; } };

T[33]={c:`#site{background:#e5ddd5;padding:20px 12px;font-family:"Segoe UI",Arial,sans-serif;} #chat{max-width:360px;margin:0 auto;} .m{padding:10px 14px;border-radius:14px;background:#fff;font-size:14px;box-shadow:0 1px 1px #0002;margin:8px 0;max-width:85%;} .m.me{background:#dcf8c6;margin-left:auto;} .in{display:flex;gap:6px;margin-top:10px;} .in input{flex:1;border:1px solid #ccc;border-radius:999px;padding:10px 14px;font-family:inherit;font-size:14px;} .in button{background:#25d366;color:#fff;border:0;border-radius:999px;padding:0 16px;cursor:pointer;} .sub{background:#25d366;color:#fff;border:0;border-radius:999px;padding:8px 18px;font-family:inherit;margin-top:10px;} .up{margin-left:10px;}`,

 h:`<p>arrows / WASD to move. reach the stairs <b>&gt;</b>. the key <b>k</b> opens the door <b>+</b>.</p><pre id="dg"></pre><div class="pad"><button class="btn" data-d="0,-1">▲</button><br><button class="btn" data-d="-1,0">◀</button><button class="btn" data-d="0,1">▼</button><button class="btn" data-d="1,0">▶</button></div><p id="dgm"></p>`,
 js:()=>{ const M=["########################","#......#.......#.......#","#..@...+...k...+...>...#","#......#.......#.......#","#...####.......###.....#","#........$.............#","########################"].map(r=>r.split("")); let px=3,py=2,key=false,gold=0,won=false; const draw=()=>{ $("dg").textContent=M.map((r,y)=>r.map((c,x)=>x===px&&y===py?"@":c==="@"?".":c).join("")).join("\n"); }; draw();
  const mv=(dx,dy)=>{ if(won) return; const nx=px+dx, ny=py+dy, c=M[ny][nx]; if(c==="#") return; if(c==="+"&&!key){ $("dgm").textContent="the door is locked. find the key."; return; } if(c==="k"){ key=true; M[ny][nx]="."; $("dgm").textContent="you found the key! 🔑"; tone(700,0.1,"square",0.05); } if(c==="$"){ gold++; M[ny][nx]="."; $("dgm").textContent="gold! (it's worth 0)"; } if(c==="+"){ M[ny][nx]="."; $("dgm").textContent="the door creaks open."; } px=nx; py=ny; draw(); tone(200,0.03,"square",0.02); if(c===">"){ won=true; $("dgm").textContent="stairs down! descending…"; tone(1000,0.3,"square",0.06); setTimeout(()=>goLevel(depth+1),900); } };
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ const [x,y]=b.dataset.d.split(",").map(Number); mv(x,y); }); window._subkey=e=>{ const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key]; if(k){ e.preventDefault(); mv(k[0],k[1]); } }; }};
// 47 — greeting card you can send
T[47]={c:`#site{background:#fce4ec;padding:40px 16px;display:flex;justify-content:center;perspective:1000px;} .gc{width:320px;height:380px;position:relative;transform-style:preserve-3d;transition:transform 1s;cursor:pointer;} .gc.open{transform:rotateY(-160deg);} .face{position:absolute;inset:0;background:#fff;border-radius:12px;box-shadow:0 8px 24px #0002;padding:24px;text-align:center;font-family:"Brush Script MT","Comic Sans MS",cursive;font-size:24px;color:#880e4f;backface-visibility:hidden;} .back{transform:rotateY(180deg);font-size:16px;} textarea{width:100%;height:120px;font-family:inherit;font-size:16px;border:1px dashed #880e4f;padding:8px;color:#880e4f;} .sub{font-family:"Trebuchet MS",sans-serif;font-size:14px;background:#880e4f;color:#fff;border:0;border-radius:999px;padding:8px 18px;margin-top:8px;} .send{font-family:"Trebuchet MS",sans-serif;font-size:13px;background:#fff;color:#880e4f;border:1px solid #880e4f;border-radius:999px;padding:6px 14px;cursor:pointer;margin-top:6px;}`,
 h:`<div class="gc" id="gc"><div class="face">💐<br>Congratulations on reaching<br><b>Sub 47</b><br><span style="font-size:14px;font-family:'Trebuchet MS'">(click to open)</span></div><div class="face back"><div id="cardmsg"></div><button class="send btn" id="sendc">🔗 copy link to this card</button><div>${B}<br>${U}</div></div></div>`,
 js:()=>{ const gc=$("gc"); const params=new URLSearchParams(location.search); const from=params.get("card"); $("cardmsg").innerHTML= from? '<p style="font-family:Trebuchet MS;font-size:14px">someone sent you this from sub 47:</p><p style="font-size:20px">'+esc(decodeURIComponent(from)).slice(0,200)+'</p>' : '<textarea id="cardt" placeholder="write your message inside the card…"></textarea>'; gc.onclick=e=>{ if(["TEXTAREA","BUTTON"].includes(e.target.tagName)) return; gc.classList.toggle("open"); }; if($("cardt")) $("cardt").onkeydown=e=>e.stopPropagation();
  $("sendc").onclick=e=>{ e.stopPropagation(); const t=$("cardt")? $("cardt").value.trim() : from; const url=(ON_KAIFUN? realUrl(47) : location.origin+location.pathname)+"?card="+encodeURIComponent(t||"three more and it's over.")+(ON_KAIFUN?"":"#47"); navigator.clipboard&&navigator.clipboard.writeText(url); $("sendc").textContent="copied! send it to someone."; }; }};
// 48 — glitch: stabilize the signal
T[48]={c:`#site{background:#000;color:#fff;font-family:"Courier New",monospace;padding:40px 16px;text-align:center;} h1{font-size:60px;position:relative;display:inline-block;} h1::before,h1::after{content:"SUB 48";position:absolute;left:0;right:0;} h1::before{color:#f0f;transform:translate(calc(var(--g) * -1px),0);clip-path:inset(0 0 60% 0);} h1::after{color:#0ff;transform:translate(calc(var(--g) * 1px),0);clip-path:inset(60% 0 0 0);} input[type=range]{width:min(400px,90%);} .sub{background:#fff;color:#000;border:0;font-family:inherit;padding:8px 16px;margin-top:20px;} .sub:disabled{opacity:.3;} p{min-height:22px;}`,
 h:`<h1 style="--g:12">SUB 48</h1><p>the signal is corrupted. find the frequency that stabilizes it. it drifts.</p><input id="freq" type="range" min="0" max="1000" value="500"><p id="gm48">drift: ???</p>${B}<br><br>${U}`,
 js:()=>{ let target=Math.floor(Math.random()*1000), stable=0; const sb=$("subBtn"); sb.disabled=true; const iv=setInterval(()=>{ const f=$("freq"); if(!f){clearInterval(iv);return;} target+=Math.round((Math.random()-0.5)*8); target=Math.max(0,Math.min(1000,target)); const d=Math.abs(+f.value-target); document.querySelector("h1").style.setProperty("--g",Math.min(30,d/10)); const txt=document.querySelector("h1"); txt.style.opacity= d<40? 1 : 0.6+Math.random()*0.4; if(d<25){ stable++; $("gm48").textContent="locked… "+Math.min(100,stable*4)+"%"; if(stable>=25){ sb.disabled=false; $("gm48").textContent="stabilized. the button works again."; clearInterval(iv); } } else { stable=Math.max(0,stable-1); $("gm48").textContent= d<80? "close. hold it steady." : d<200? "warmer" : "static. keep searching."; } },100); }};
// 49 — almost: the confirmations
T[49]={c:`#site{background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:"Trebuchet MS",sans-serif;text-align:center;padding:20px;} h1{font-size:clamp(30px,8vw,70px);font-weight:900;} p{max-width:440px;margin:10px auto;line-height:1.6;} .sub{border:3px solid #141414;border-radius:14px;background:#f5b829;font-weight:900;font-size:30px;padding:16px 40px;box-shadow:5px 5px 0 #141414;font-family:inherit;animation:br 1.4s infinite;} @keyframes br{50%{transform:scale(1.05)}} .box{border:2px solid #141414;border-radius:12px;padding:16px;max-width:400px;margin:14px auto;box-shadow:4px 4px 0 #141414;} .box button{font-family:inherit;border:2px solid #141414;background:#fff;padding:8px 16px;margin:6px;cursor:pointer;font-weight:700;}`,
 h:`<h1>SUB 49</h1><p>one more. the address is now 200 characters long and every part of it is the word sub.</p><div id="conf"></div>${B}<br><br>${U}`,
 js:()=>{ const Q=["are you sure?","are you REALLY sure?","there's no coming back. (there is. the up button.) sure?","your finger. is it ready?","last one. do you accept the bottom?"]; let i=0; const sb=$("subBtn"); sb.style.display="none"; const ask=()=>{ if(i>=Q.length){ $("conf").innerHTML="<div class='box'>ok. it's yours.</div>"; sb.style.display="inline-block"; return; } $("conf").innerHTML="<div class='box'><b>"+Q[i]+"</b><br><button class='btn' id='y'>yes</button><button class='btn' id='n'>no</button></div>"; $("y").onclick=()=>{ i++; tone(500+i*100,0.1,"square",0.05); ask(); }; $("n").onclick=()=>{ i=0; $("conf").innerHTML="<div class='box'>fair. <button class='btn' id='again'>ask me again</button></div>"; $("again").onclick=ask; }; }; ask(); }};
// 50 — the bottom: certificate
T[50]={c:`#site{background:#141414;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;font-family:"Trebuchet MS",sans-serif;} h1{font-size:clamp(34px,8vw,72px);font-weight:900;color:#f5b829;} p{max-width:480px;margin:10px auto;line-height:1.6;color:#ccc;} .up{font-size:16px;opacity:1;color:#f5b829;} .addr{font-family:"Courier New",monospace;font-size:11px;word-break:break-all;color:#777;max-width:520px;margin:16px auto;} canvas{max-width:100%;border:2px solid #f5b829;margin:10px 0;} input{background:#000;color:#fff;border:1px solid #f5b829;padding:8px;font-family:inherit;font-size:15px;text-align:center;} .dl{background:#f5b829;color:#141414;border:0;font-family:inherit;font-weight:900;padding:10px 20px;cursor:pointer;border-radius:8px;margin:6px;}`,
 h:`<h1>THE BOTTOM.</h1><p>sub #50. there is no button. a web address can't hold a fifty-first sub.</p><input id="cn50" placeholder="your name" maxlength="24"><br><canvas id="cert" width="600" height="380"></canvas><br><button class="dl btn" id="dl50">⬇ download certificate</button><div class="addr">${"sub.".repeat(50)}kaifun.fun</div>${U}`,
 js:()=>{ const c=$("cert"), g=c.getContext("2d"); const draw=()=>{ const n=$("cn50").value.trim()||"a very tired visitor"; g.fillStyle="#fff8e1"; g.fillRect(0,0,600,380); g.strokeStyle="#f5b829"; g.lineWidth=10; g.strokeRect(12,12,576,356); g.strokeStyle="#141414"; g.lineWidth=2; g.strokeRect(24,24,552,332); g.fillStyle="#141414"; g.textAlign="center"; g.font="bold 30px Georgia"; g.fillText("CERTIFICATE OF DESCENT",300,80); g.font="16px Georgia"; g.fillText("this certifies that",300,125); g.font="italic bold 34px Georgia"; g.fillText(n,300,175); g.font="16px Georgia"; g.fillText("visited fifty completely different websites",300,215); g.fillText("and reached the bottom of SUBSUBSUBSUBSUBSUB…",300,240); g.font="13px Courier New"; g.fillText("sub.".repeat(20)+"…kaifun.fun",300,280); g.font="14px Georgia"; g.fillText(new Date().toLocaleDateString()+" · signed, Kai 🏆",300,330); }; draw(); $("cn50").oninput=draw; $("cn50").onkeydown=e=>e.stopPropagation(); $("dl50").onclick=()=>{ const a=document.createElement("a"); a.download="sub-certificate.png"; a.href=c.toDataURL(); a.click(); }; }};

// ---------- render ----------
function render(){
  if(window._subcleanup){ try{window._subcleanup();}catch(e){} window._subcleanup=null; }
  window._subkey=null; window._submove=null;
  const t=T[Math.min(depth,MAX)];
  $("themeCss").textContent=t.c;
  $("site").innerHTML=t.h;
  const subs="sub.".repeat(Math.min(depth,40));
  $("url").querySelector(".subs").textContent=depth>40? "…"+subs : subs;
  $("url").querySelector(".cnt").textContent=depth? "sub ×"+depth+"/50" : "surface";
  document.title=(depth? "sub.".repeat(Math.min(depth,5))+(depth>5?"(×"+depth+").":"") : "")+"kaifun.fun";
  const sb=$("subBtn"), ub=$("upBtn");
  if(sb) sb.onclick=sub;
  if(ub) ub.onclick=up;
  if(t.js){ try{ t.js(); }catch(e){ console.error(e); } }
  $("best").textContent= best? "deepest: sub ×"+best : "";
  if(!REAL) location.hash= depth? "#"+depth : "";
  window.scrollTo(0,0);
}
function sub(){ if(depth>=MAX) return; goLevel(depth+1); }
function up(){ if(depth<=0) return; goLevel(depth-1); }
addEventListener("keydown",e=>{
  if(window._subkey){ window._subkey(e); return; }
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) return;
  if(e.key==="Enter"||e.key===" "||e.key==="ArrowDown"){ e.preventDefault(); sub(); }
  if(e.key==="ArrowUp"){ e.preventDefault(); up(); }
});
addEventListener("mousemove",e=>{ if(window._submove) window._submove(e); });
addEventListener("hashchange",()=>{ if(REAL) return; const d=Math.max(0,Math.min(MAX,parseInt(location.hash.slice(1))||0)); if(d!==depth){ depth=d; render(); } });
if(depth>best){ best=depth; localStorage.setItem("sub_best",best); }
render();
</script>
