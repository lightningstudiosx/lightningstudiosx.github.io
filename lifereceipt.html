"use strict";
// ===== util.js =====
{
const LR = window.LR = { stats: [], depts: [], mute: false };
const DAY = 86400000, YR = 365.2425;
LR.DAY = DAY; LR.YR = YR;
LR.life = (days, segs) => {
  let t = 0;
  for (let i = 0; i < segs.length; i++) {
    const a = segs[i][0] * YR, b = i + 1 < segs.length ? segs[i + 1][0] * YR : Infinity;
    if (days > a) t += (Math.min(days, b) - a) * segs[i][1];
  }
  return t;
};
LR.lifeInv = (target, segs) => {
  let lo = 0, hi = 200 * YR;
  if (LR.life(hi, segs) < target) return Infinity;
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (LR.life(m, segs) < target) lo = m; else hi = m; }
  return hi;
};
LR.dept = (key, name) => LR.depts.push({ key, name });
LR.S = (d, q, dec, u, l, p, o) => LR.stats.push(Object.assign({ d, q, dec, u, l, p }, o || {}));
LR.segsOf = s => typeof s.q === 'number' ? [[0, s.q]] : s.q;
LR.val = (s, c) => typeof s.q === 'function' ? s.q(c) : LR.life(c.days, LR.segsOf(s));
LR.startAge = s => Array.isArray(s.q) ? s.q[0][0] : 0;
const BIG = [[1e24, 'SEPTILLION'], [1e21, 'SEXTILLION'], [1e18, 'QUINTILLION'], [1e15, 'QUADRILLION'], [1e12, 'TRILLION']];
LR.fmt = (n, dec) => {
  if (!isFinite(n)) return '∞';
  for (const [v, w] of BIG) if (n >= v) return (n / v).toFixed(n / v >= 100 ? 0 : 1) + ' ' + w;
  const d = dec || 0;
  return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
};
LR.esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
LR.age = (b, n) => {
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a;
};
LR.hash = str => { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
LR.rng = seed => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
LR.dstr = d => MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
let ac = null, noise = null;
LR.audioOn = () => {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noise = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate);
    const ch = noise.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length) * (i % 37 < 20 ? 1 : 0.3);
  } catch (e) { ac = null; }
};
LR.tick = (len, vol) => {
  if (!ac || LR.mute) return;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noise; s.playbackRate.value = 0.8 + Math.random() * 0.5;
  f.type = 'bandpass'; f.frequency.value = 2400 + Math.random() * 1600; f.Q.value = 1.4;
  g.gain.value = vol || 0.12;
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start(); s.stop(ac.currentTime + (len || 0.035));
};
LR.tear = () => { for (let i = 0; i < 6; i++) setTimeout(() => LR.tick(0.05, 0.18), i * 22); };
LR.toast = msg => {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(LR._tt); LR._tt = setTimeout(() => t.classList.remove('on'), 2200);
};
LR.zig = (teeth, depth, both) => {
  const pts = [], d = depth + 'px';
  if (both) for (let i = 0; i <= teeth * 2; i++) pts.push((i * 50 / teeth).toFixed(3) + '% ' + (i % 2 ? d : '0'));
  else pts.push('0 0', '100% 0');
  for (let i = teeth * 2; i >= 0; i--) pts.push((i * 50 / teeth).toFixed(3) + '% calc(100% - ' + (i % 2 ? d : '0px') + ')');
  return 'polygon(' + pts.join(',') + ')';
};
}

// ===== receipt.js =====
{
const LR = window.LR, { esc, fmt } = LR;
const WD = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
const STONE = ['GARNET', 'AMETHYST', 'AQUAMARINE', 'DIAMOND', 'EMERALD', 'PEARL', 'RUBY', 'PERIDOT', 'SAPPHIRE', 'OPAL', 'TOPAZ', 'TURQUOISE'];
function calCounts(b, n) {
  const k = { mon: 0, wkd: 0, f13: 0, leap: 0, jan1: 0 };
  const d = new Date(b.getFullYear(), b.getMonth(), b.getDate(), 12);
  while (d <= n) {
    const w = d.getDay(), m = d.getMonth(), dd = d.getDate();
    if (w === 1) k.mon++;
    if (w === 0 || w === 6) k.wkd++;
    if (w === 5 && dd === 13) k.f13++;
    if (m === 1 && dd === 29) k.leap++;
    if (m === 0 && dd === 1 && d > b) k.jan1++;
    d.setDate(dd + 1);
  }
  return k;
}
LR.ctx = (birth, now, cal) => ({ birth, now, days: Math.max(0, (now - birth) / LR.DAY), ageY: LR.age(birth, now), cal: cal || calCounts(birth, now) });
function value(s, c) {
  let v = LR.val(s, c);
  if (s.cap) v = Math.min(v, s.cap);
  return Math.max(0, s.dec ? v : Math.floor(v));
}
LR.rowHtml = (s, i, c) => {
  const v = value(s, c), soon = v === 0 && LR.startAge(s) > c.days / LR.YR;
  const price = soon ? 'PRE-ORDER' : (typeof s.p === 'function' ? s.p(c) : s.p);
  return '<div class="ln row"><span class="l"><b class="q' + (s.live ? ' live' : '') + '" data-i="' + i + '">' + fmt(v, s.dec) +
    (s.u ? ' ' + s.u : '') + '</b> ' + esc(s.l) + '</span><span class="p' + (soon ? ' soft' : '') + '">' + esc(price) + '</span></div>';
};
LR.build = (birth, name) => {
  const now = new Date(), c = LR.ctx(birth, now), L = [], ln = (h, cls) => L.push('<div class="ln ' + (cls || '') + '">' + h + '</div>');
  const yrs = (c.days / LR.YR).toFixed(1);
  ln('<h1 class="store">KAI.FUN PHARMACY &amp; EXISTENCE</h1>');
  ln('STORE #0001 • MILKY WAY GALAXY', 'c');
  ln('REGISTER: PLANET EARTH • CASHIER: THE UNIVERSE', 'c');
  ln(LR.dstr(now) + ' • ' + now.toTimeString().slice(0, 5), 'c');
  ln('CUSTOMER: ' + esc(name || 'VALUED HUMAN'), 'c');
  ln('MEMBER SINCE ' + LR.dstr(birth) + ' (A ' + WD[birth.getDay()] + ')', 'c');
  ln('BIRTHSTONE: ' + STONE[birth.getMonth()], 'c');
  ln('DAYS ALIVE: ' + fmt(Math.floor(c.days)) + ' (' + yrs + ' YRS)', 'c');
  LR.depts.forEach(dp => {
    ln('', 'dash');
    ln('<span>' + dp.name + '</span>', 'dept');
    LR.stats.forEach((s, i) => { if (s.d === dp.key) L.push(LR.rowHtml(s, i, c)); });
  });
  ln('', 'dash');
  ln('<span>SUBTOTAL</span><span>$0.00</span>', 'row big');
  ln('<span>GRAVITY TAX (9.8 <span class="nocase">m/s²</span>)</span><span>$0.00</span>', 'row sm');
  ln('<span>OXYGEN SURCHARGE</span><span>WAIVED</span>', 'row sm');
  ln('<span>BODY HEATING (98.6°F)</span><span>INCLUDED</span>', 'row sm');
  ln('<span>TOTAL</span><span>$0.00</span>', 'row big');
  ln('<span>PAID WITH</span><span>TIME</span>', 'row sm');
  ln('<span>AMOUNT TENDERED</span><span>' + fmt(Math.floor(c.days)) + ' DAYS</span>', 'row sm');
  ln('<span>CHANGE DUE</span><span>YOU, PROBABLY</span>', 'row sm');
  ln('<span>ITEMS</span><span>' + LR.stats.length + '</span>', 'row sm');
  ln('', 'dash');
  LR.specials(c).forEach(h => ln(h, h.indexOf('class="ms') >= 0 ? '' : 'dept'));
  LR.coupons(birth).forEach(h => ln(h));
  ln('<canvas class="bar" width="520" height="128" data-seed="' + (birth.getTime() / 864e5 | 0) + '"></canvas>');
  ln('THANK YOU FOR EXISTING. NO REFUNDS.<br>RETURNS ACCEPTED WITHIN 0 DAYS.<br>HOW WAS YOUR LIFE SO FAR? ★★★★★', 'thx');
  return { html: L.join(''), c };
};
LR.startLive = birth => {
  clearInterval(LR._live);
  const els = [...document.querySelectorAll('#paper .q.live')], cal = LR._cal;
  LR._live = setInterval(() => {
    const c = LR.ctx(birth, new Date(), cal);
    els.forEach(el => { const s = LR.stats[+el.dataset.i]; el.textContent = fmt(Math.floor(LR.val(s, c)), 0) + (s.u ? ' ' + s.u : ''); });
  }, 200);
};
LR.print = (birth, name, done) => {
  const paper = document.getElementById('paper'), pr = document.querySelector('.printer'), r = LR.build(birth, name);
  LR._cal = r.c.cal;
  paper.innerHTML = r.html;
  LR.drawBars(paper);
  const lines = [...paper.querySelectorAll('.ln')];
  lines.forEach(l => l.classList.add('h'));
  pr.classList.add('busy');
  let i = 0, fast = false, t;
  const skip = () => { fast = true; };
  document.addEventListener('pointerdown', skip, { once: true });
  const step = () => {
    const n = fast ? lines.length : i + 1;
    for (; i < n && i < lines.length; i++) lines[i].classList.remove('h');
    if (!fast) { LR.tick(); const last = lines[i - 1]; if (last) { const rb = last.getBoundingClientRect(); if (rb.bottom > innerHeight - 40) scrollBy(0, rb.bottom - innerHeight + 40); } }
    if (i < lines.length) { t = setTimeout(step, 34); return; }
    document.removeEventListener('pointerdown', skip);
    pr.classList.remove('busy'); LR.tear(); LR.startLive(birth); done && done(fast);
  };
  step();
};
}

{
const LR = window.LR;
const $ = id => document.getElementById(id);
const paper = $('paper'), entryHtml = paper.innerHTML;
paper.style.clipPath = LR.zig(28, 10, false);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
let cur = null;   // { birth, iso, name }
function parseIso(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getMonth() === +m[2] - 1 ? d : null;
}
function validate(d) {
  if (!d) return 'PLEASE ENTER YOUR BIRTHDAY';
  if (d > new Date()) return 'YOU HAVEN\'T BEEN BORN YET. COME BACK LATER!';
  if (d.getFullYear() < 1900) return 'SORRY, OUR RECORDS START IN 1900';
  return '';
}
function run(birth, name) {
  cur = { birth, iso: isoOf(birth), name: (name || '').toUpperCase().slice(0, 18) };
  $('acts').classList.add('hide');
  $('skipHint').classList.remove('hide');
  scrollTo(0, 0);
  LR.print(birth, cur.name, () => {
    $('skipHint').classList.add('hide');
    $('acts').classList.remove('hide');
    window.LR_DONE = true;
  });
}
function bindForm() {
  const inp = $('bday');

    e.preventDefault();

    const d = parseIso(inp.value), err = validate(d);
    $('err').textContent = err;
    if (!err) run(d, $('nm').value.trim());
  });
  $('rnd').addEventListener('click', () => {
    const now = Date.now(), t = now - (3 + Math.random() * 70) * LR.YR * LR.DAY;
    inp.value = isoOf(new Date(t));

}

  clearInterval(LR._live);

  scrollTo({ top: 0, behavior: 'smooth' });
}
$('save').addEventListener('click', () => LR.saveImage());

$('again').addEventListener('click', reset);
$('snd').addEventListener('click', () => {
