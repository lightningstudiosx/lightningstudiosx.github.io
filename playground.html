<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>things i made</title>
<style>
  :root{
    --ink:#181410;
    --paper:#faf6ee;
    --sun:#ffcf3f;
    --sky:#6bc3e0;
    --coral:#ff6b5e;
    --moss:#7bbf6a;
    --grape:#a988e0;
    --line:#181410;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
    background-image:radial-gradient(var(--ink) 1px,transparent 1px);
    background-size:26px 26px;
    background-position:-13px -13px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  header{
    text-align:center;
    margin:24px 0 48px;
  }
  .logo{
    display:inline-block;
    font-size:clamp(48px,11vw,104px);
    font-weight:900;
    line-height:.9;
    letter-spacing:-2px;
    transform:rotate(-3deg);
    background:var(--paper);
    padding:6px 18px;
    border:4px solid var(--line);
    border-radius:18px;
    box-shadow:6px 6px 0 var(--line);
  }
  .logo b:nth-child(1){color:var(--coral);}
  .logo b:nth-child(2){color:var(--sky);}
  .logo b:nth-child(3){color:var(--moss);}
  .logo b:nth-child(4){color:var(--grape);}
  .logo b:nth-child(5){color:var(--sun);-webkit-text-stroke:1.5px var(--ink);}
  .tag{
    margin-top:18px;
    font-size:18px;
    opacity:.75;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:18px;
  }
  .tile{
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    min-height:150px;
    padding:16px;
    border:4px solid var(--line);
    border-radius:16px;
    background:var(--tile,#fff);
    box-shadow:5px 5px 0 var(--line);
    text-decoration:none;
    color:var(--ink);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    overflow:hidden;
  }
  .tile:hover, .tile:focus-visible{
    transform:translate(-2px,-2px) rotate(var(--tilt,-1deg));
    box-shadow:8px 8px 0 var(--line);
    outline:none;
  }
  .tile .emoji{
    position:absolute;
    top:10px;
    left:14px;
    font-size:40px;
    filter:drop-shadow(2px 2px 0 rgba(0,0,0,.15));
  }
  .tile h2{
    font-size:22px;
    line-height:1.05;
  }
  .tile p{
    font-size:13px;
    opacity:.8;
    margin-top:4px;
  }
  .tile .badge{
    position:absolute;
    top:12px;right:12px;
    font-size:11px;
    font-weight:700;
    background:var(--ink);
    color:var(--paper);
    padding:3px 8px;
    border-radius:20px;
  }

  /* tile color themes */
  .t-coral{--tile:#ffe3e0;--tilt:-2deg;}
  .t-sky{--tile:#dff2f9;--tilt:1.5deg;}
  .t-moss{--tile:#e4f4df;--tilt:-1.5deg;}
  .t-grape{--tile:#efe6fb;--tilt:2deg;}
  .t-sun{--tile:#fff4d6;--tilt:-1deg;}

  footer{
    text-align:center;
    margin-top:56px;
    font-size:14px;
    opacity:.6;
  }
  footer a{color:var(--ink);}

  @media (prefers-reduced-motion:reduce){
    .tile{transition:none;}
    .tile:hover,.tile:focus-visible{transform:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo"><b>t</b><b>h</b><b>i</b><b>n</b><b>g</b><span style="letter-spacing:-2px">s</span></div>
      <p class="tag">a pile of stuff i made. click around.</p>
    </header>

    <main class="grid" id="grid">
      <!-- Tiles are generated below so you can edit them in one place -->
    </main>

    <footer>
      built by you &middot; add your own tiles in the <code>PROJECTS</code> list
    </footer>
  </div>

<script>
  // ===== EDIT YOUR PROJECTS HERE =====
  // Each tile: emoji, title, blurb, link (use "#" if not ready), theme, optional badge.
  // themes: t-coral, t-sky, t-moss, t-grape, t-sun
  const PROJECTS = [
    { emoji:"🌳", title:"land.",            blurb:"a backrooms-style world you fall through", link:"#", theme:"t-moss",  badge:"roblox" },
    { emoji:"🎃", title:"Pumpkin Carve",    blurb:"carve a custom face onto any pumpkin",     link:"#", theme:"t-coral", badge:"mod" },
    { emoji:"🖥️", title:"RoComputer 64",    blurb:"a shared retro desktop everyone uses",     link:"#", theme:"t-sky" },
    { emoji:"🎮", title:"Xbox Mouse",       blurb:"run your whole PC from a controller",      link:"#", theme:"t-grape", badge:"script" },
    { emoji:"🔊", title:"Volume 1000",      blurb:"turn it up way past what's wise",          link:"#", theme:"t-sun" },
    { emoji:"🧊", title:"Noob Collector",   blurb:"collect, mutate, rebirth, repeat",         link:"#", theme:"t-sky",   badge:"roblox" },
    { emoji:"🎨", title:"Avatar RNG",       blurb:"roll real catalog gear for glory",         link:"#", theme:"t-coral", badge:"roblox" },
    { emoji:"🔫", title:"Gun Builder",      blurb:"weld your own weird firearm",              link:"#", theme:"t-moss",  badge:"roblox" },
    { emoji:"➕", title:"add your own",      blurb:"edit the PROJECTS list to add a tile",     link:"#", theme:"t-grape" },
  ];

  const grid = document.getElementById("grid");
  for(const p of PROJECTS){
    const a = document.createElement("a");
    a.className = "tile " + (p.theme||"t-sky");
    a.href = p.link || "#";
    if(p.link && p.link!=="#") a.target = "_blank";
    a.innerHTML = `
      <span class="emoji">${p.emoji||"⭐"}</span>
      ${p.badge?`<span class="badge">${p.badge}</span>`:""}
      <h2>${p.title||"untitled"}</h2>
      ${p.blurb?`<p>${p.blurb}</p>`:""}
    `;
    grid.appendChild(a);
  }
</script>
</body>
</html>
