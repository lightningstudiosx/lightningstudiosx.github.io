<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Citizenship · KAIISM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kai.css">
<style>
.c-wrap{max-width:860px;margin:0 auto}
.c-intro{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:22px;align-items:center}
.c-intro ul{margin:10px 0 0;padding-left:22px}
.c-intro li{margin:4px 0}
.c-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.c-row .k-input{flex:1 1 220px;min-height:48px;font-size:18px}
.c-row .k-btn{min-height:48px}
.c-flag{display:block;border:2px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
.c-flag svg{display:block;width:100%;height:auto}
.c-best{margin-top:12px;font-size:15px;color:var(--ink2)}
/* quiz */
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.c-dots{display:flex;gap:5px;flex-wrap:wrap}
.c-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.c-dots i.done{background:var(--teal)}
.c-dots i.cur{background:var(--sun);transform:scale(1.2)}
.c-cat{font:800 12px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.c-q{font:800 clamp(24px,3.6vw,34px)/1.15 var(--display);margin:10px 0 18px;text-wrap:balance}
.c-q .k-kai{white-space:nowrap}
.c-opts{display:grid;gap:10px}
.c-opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:12px 14px;font:700 18px/1.3 var(--body);cursor:pointer;box-shadow:3px 3px 0 var(--ink);min-height:56px;transition:transform .08s}
.c-opt:hover{transform:translate(-1px,-1px)}
.c-opt b{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);font:800 15px/1 var(--display);background:var(--paper)}
.c-opt.sel{background:var(--sun)}
.c-opt.sel b{background:var(--ink);color:var(--paper)}
.c-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.c-nav .k-btn{min-height:48px}
/* results */
.c-score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.c-big{font:800 clamp(64px,12vw,120px)/.9 var(--display);letter-spacing:-.04em}
.c-big small{font-size:.35em;color:var(--muted)}
.c-verdict{font:800 clamp(26px,4vw,38px)/1.1 var(--display)}
.c-pass{color:var(--good)}
.c-fail{color:var(--bad)}
.c-review{display:grid;gap:10px;margin-top:14px}
.c-rv{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;background:#fff}
.c-rv .q{font:800 17px/1.25 var(--display)}
.c-rv .a{margin-top:6px;font-size:15.5px}
.c-rv .a .no{color:var(--bad);text-decoration:line-through}
.c-rv .a .yes{color:var(--good);font-weight:700}
.c-rv .x{margin-top:4px;color:var(--ink2);font-size:14.5px}
.c-ok{color:var(--good);font-weight:700}
/* certificate */
.cert-wrap{container-type:inline-size;margin-top:18px}
.cert{position:relative;aspect-ratio:7/5;background:#fffaf0;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:6px;overflow:hidden;color:var(--ink);text-align:center}
.cert::before{content:"";position:absolute;inset:2.2cqw;border:.6cqw double var(--red);border-radius:.8cqw;pointer-events:none}
.cert::after{content:"";position:absolute;inset:3.4cqw;border:.25cqw solid var(--ink);border-radius:.5cqw;pointer-events:none}
.cert .band{position:absolute;left:0;right:0;bottom:0;height:3.2cqw;background:var(--teal)}
.cert .in{position:absolute;inset:5.2cqw 6cqw 6cqw;display:flex;flex-direction:column;align-items:center}
.cert .kick{font:800 1.6cqw/1 var(--display);letter-spacing:.35em;text-transform:uppercase;color:var(--red)}
.cert .ti{font:800 3.9cqw/1 var(--display);margin-top:1.4cqw;letter-spacing:-.02em;max-width:62cqw}
.cert .rules{display:flex;gap:1.4cqw;justify-content:center;flex-wrap:wrap;margin-top:2.2cqw}
.cert .rules span{border:.2cqw solid var(--ink);border-radius:99px;padding:.5cqw 1.4cqw;font:400 1.5cqw/1.2 var(--body);background:var(--paper)}
.cert .rules b{font-family:var(--display);color:var(--red-d)}
.cert .lead{font:400 1.9cqw/1.3 var(--body);margin-top:2.4cqw;color:var(--ink2)}
.cert .nm{font:800 6cqw/1.05 var(--display);margin-top:.8cqw;color:var(--red-d);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:.3cqw solid var(--ink);padding:0 3cqw .6cqw}
.cert .sc{margin-top:1.4cqw;height:4.2cqw;display:flex;align-items:center;justify-content:center;max-width:80%}
.cert .sc svg{height:100%;width:auto;max-width:100%}
.cert .body{font:400 1.9cqw/1.35 var(--body);margin-top:1.6cqw;max-width:70%}
.cert .body b{font-family:var(--display)}
.cert .meta{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:2cqw}
.cert .meta .col{font:400 1.5cqw/1.3 var(--body);text-align:left;color:var(--ink2)}
.cert .meta .col b{display:block;font:800 1.9cqw/1.2 var(--display);color:var(--ink)}
.cert .meta .col.r{text-align:right}
.cert .flagc{position:absolute;top:5.6cqw;left:6.4cqw;width:10cqw;border:.25cqw solid var(--ink)}
.cert .flagc svg{display:block;width:100%;height:auto}
.cert .seal{position:absolute;right:5.4cqw;top:4.6cqw;width:13cqw;height:13cqw;transform:rotate(-10deg)}
.cert .seal svg{width:100%;height:100%}
.c-certctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.c-certctl .k-input{flex:1 1 200px;min-height:48px}
.c-certctl .k-btn{min-height:48px}
@media (max-width:700px){.c-intro{grid-template-columns:minmax(0,1fr)} .c-intro .c-flag{max-width:180px}}
@media (max-width:640px){.c-opt{font-size:16px;padding:10px 12px}}
</style>
</head>
<body>
<header id="kai-nav"></header>
<main class="k-page">
  <div class="c-wrap">
    <section class="k-hero">
      <div class="k-kicker">KAIISM · <span class="k-kai" id="kaitenoWord"></span></div>
      <h1 class="k-title">Become a citizen</h1>
      <p class="k-lede">Pass the citizenship test of Kaiya, the Land of Fun, and get your own certificate. No forms, no queues, no grown-ups with clipboards.</p>
    </section>

    <!-- start -->
    <section class="k-card" id="scrStart">
      <div class="c-intro">
        <div>
          <h2 style="font-size:28px">How it works</h2>
          <ul id="rulesList"></ul>
          <div class="c-row">
            <label for="nameIn" class="k-muted" style="width:100%;font-size:14px;margin-bottom:-4px">Your name (for the certificate)</label>
            <input id="nameIn" class="k-input" maxlength="30" placeholder="Your name" autocomplete="off">
            <button class="k-btn red" id="startBtn">Start the test</button>
          </div>
          <div class="c-best" id="best"></div>
        </div>
        <div class="c-flag" id="flagBox"></div>
      </div>
    </section>

    <!-- quiz -->
    <section class="k-card" id="scrQuiz" hidden>
      <div class="c-top"><span class="c-cat" id="qCat"></span><span class="k-mono" id="qNum"></span></div>
      <div class="c-dots" id="dots"></div>
      <h2 class="c-q" id="qText"></h2>
      <div class="c-opts" id="opts" role="radiogroup" aria-labelledby="qText"></div>
      <div class="c-nav">
        <button class="k-btn" id="backBtn">← Back</button>
        <button class="k-btn teal" id="nextBtn" disabled>Next →</button>
      </div>
    </section>

    <!-- results -->
    <section id="scrResult" hidden>
      <div class="k-card">
        <div class="c-score">
          <div class="c-big" id="score"></div>
          <div>
            <div class="c-verdict" id="verdict"></div>
            <p id="verdictText" style="margin:6px 0 0"></p>
          </div>
        </div>
        <div class="c-row">
          <button class="k-btn sun" id="againBtn">Take a new test</button>
          <a class="k-btn" href="pedia.html">Study on Kaipedia</a>
        </div>
      </div>
      <div id="certBox" hidden>
        <h2 style="font-size:32px;margin-top:30px">Your certificate</h2>
        <div class="c-certctl">
          <label for="certName" class="k-muted" style="width:100%;font-size:14px;margin-bottom:-4px">Name on the certificate</label>
          <input id="certName" class="k-input" maxlength="30" autocomplete="off">
          <button class="k-btn red" id="dlBtn">Download PNG</button>
          <a id="dlLink" hidden></a>
        </div>
        <div class="cert-wrap"><div class="cert" id="cert"></div></div>
      </div>
      <div class="k-card" style="margin-top:24px" id="reviewCard">
        <h2 style="font-size:26px" id="reviewTitle"></h2>
        <div class="c-review" id="review"></div>
      </div>
    </section>
  </div>
</main>
<script src="kai-core.js"></script>
<script>
(function () {
'use strict';
KAI.mountNav('test');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const T = KAI.TIME;
const NQ = 15, PASS = 12;
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uniq = a => [...new Set(a)];
const K = w => `<span class="k-kai">${esc(w)}</span>`;

/* ================= facts from KAI ================= */
const DAYMS = 86400000;
const atT = ms => KAI.toKaiTime(new Date(2001, 0, 1, 0, 0, 0, ms));
const KPD = atT(DAYMS - 1).kai + 1, kaiMs = DAYMS / KPD, BPK = atT(kaiMs - 1).bits + 1;
const NOON = atT(DAYMS / 2).text;
const kaiToLocal = (y, m, d) => { const u = KAI.fromKaiDate(y, m, d); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), 12); };
const MONTHLEN = Math.round((kaiToLocal(1, 2, 1) - kaiToLocal(1, 1, 1)) / DAYMS);
const fmtLong = d => d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
const epochDate = new Date(T.epoch.y, T.epoch.m - 1, T.epoch.d, 12);
const dur = ms => { const h = Math.floor(ms / 3600000), m = Math.round(ms % 3600000 / 60000); return `${h} hour${h === 1 ? '' : 's'}${m ? ` ${m} minutes` : ''}`; };
const G = id => KAI.GRAMMAR.find(g => g.id === id);
const byEn = en => KAI.DICT.find(d => d.en === en);

/* ================= question bank (generated from KAI) =================
   {cat, q (html), a (answer text), pool (wrong answers to pick from), x (explanation)} */
const BANK = [];
const add = (cat, q, a, pool, x) => { pool = uniq(pool.filter(p => p !== a)); if (pool.length >= 3) BANK.push({ cat, q, a: String(a), pool: pool.map(String), x }); };
const clean = en => en.replace(/\s*\(.*?\)/g, '').trim();

// 1. word meanings (Kaihana → English)
const nounsAdjVerbs = KAI.DICT.filter(d => ['n', 'v', 'adj', 'interj'].includes(d.pos) && !/^[A-Z]/.test(d.kai));
['miwa', 'tosu', 'monke', 'takan', 'awana', 'kaiyo', 'arima', 'yosen', 'mosa', 'kaimo', 'hemi', 'siki', 'lumo', 'sipa', 'manuya', 'kaiteno', 'kaiwen', 'yami'].forEach(w => {
  const e = KAI.lookupKai(w); if (!e) return;
  add('Words', `What does the Kaihana word ${K(e.kai)} mean?`, e.en, nounsAdjVerbs.filter(d => d.pos === e.pos && d.kai !== e.kai).map(d => d.en), `${e.kai} = ${e.en}.`);
});
// 2. English → Kaihana
['dog', 'water', 'friend', 'happy', 'book', 'fire', 'tree', 'big', 'school', 'thank you'].forEach(en => {
  const e = KAI.lookupEn(en) || KAI.lookupEn(en.split(' ')[0]); if (!e) return;
  add('Words', `How do you say “${esc(en)}” in Kaihana?`, e.kai, nounsAdjVerbs.filter(d => d.pos === e.pos && d.kai !== e.kai).map(d => d.kai), `“${en}” is ${e.kai}.`);
});
// 3. grammar examples
const EXS = [];
KAI.GRAMMAR.filter(g => !['sounds', 'words', 'numbers'].includes(g.id)).forEach(g => g.ex.forEach(([k, e]) => EXS.push({ k, e, g })));
const exEn = EXS.map(x => x.e);
EXS.forEach(x => add('Grammar', `What does ${K(x.k)} mean?`, x.e, exEn.filter(e => e !== x.e && !e.includes(x.e) && !x.e.includes(e)), `Rule “${x.g.title}”: ${x.g.rule}`));
// 4. grammar ideas
const particles = KAI.DICT.filter(d => d.cat === 'grammar' && d.pos === 'part').map(d => d.kai);
const pq = (q, en, why) => { const e = byEn(en); if (e) add('Grammar', q, e.kai, particles, why); };
pq('Which little word goes at the END of a sentence to make it a yes/no question?', '(question: end of a sentence)', G('question').rule);
pq('Which word goes before a verb to put it in the PAST?', '(past tense: before the verb)', G('tense').rule);
pq('Which word goes before a verb to put it in the FUTURE?', '(future tense: before the verb)', G('tense').rule);
{ const e = KAI.lookupEn('not'); add('Grammar', 'Which word means “not”?', e.kai, particles.concat(['mo', 'ka']), G('not').rule); }
{ const e = KAI.lookupEn('very'); add('Grammar', 'Which word means “very”?', e.kai, particles.concat(['ka', 'ola']), G('adj').rule); }
{ const e = KAI.lookupKai('sa'); add('Grammar', 'Which word means “is / am / are”?', e.kai, particles.concat(['mo']), G('be').rule); }
{ const e = KAI.lookupEn('of'); add('Grammar', 'Which word shows who owns something (“X ___ Y” = Y’s X)?', e.kai, particles.concat(['ka', 'temu', 'lo']), G('own').rule); }
// word endings, read straight from the official word-building rule
const ENDS = [...G('words').rule.matchAll(/-(\w+) = ([\w ]+?)(?:,|\.| —|$)/g)].map(m => ({ end: '-' + m[1], what: m[2].trim() }));
const pl = /add (-\w+)/i.exec(G('plural').rule)[1];
const endPool = ENDS.map(e => e.end).concat([pl, '-mo', '-emo']);
ENDS.forEach(e => add('Grammar', `Which word ending means “${esc(e.what)}”?`, e.end, endPool, G('words').rule));
add('Grammar', 'Which ending makes a noun plural (more than one)?', pl, endPool, G('plural').rule);
{ const cat = KAI.lookupEn('cat').kai; add('Grammar', 'How do you say “cats” in Kaihana?', cat + pl.slice(1), [cat, cat + 'ya', cat + 'to', cat + 'ko', 'mo ' + cat], G('plural').rule); }
add('Grammar', 'In Kaihana, where do describing words (like big or red) go?', /AFTER/.test(G('adj').rule) ? 'After the noun' : 'Before the noun', ['Before the noun', 'After the noun', 'At the start of the sentence', 'At the very end of the sentence'], G('adj').rule);
add('Grammar', 'How do you translate “the” into Kaihana?', 'You just leave it out', [KAI.lookupKai('si').kai, KAI.lookupKai('so').kai, 'ta', 'You just leave it out'], G('no-articles').rule);
// 5. numbers
const numQs = [7, 10, 23, 105, 48, 1000];
numQs.forEach(n => {
  const w = KAI.numberToKai(n), near = uniq([n + 1, n - 1, n * 10, Math.floor(n / 10) + (n % 10) * 10, n + 10, n + 100].filter(v => v > 0 && v !== n));
  add('Numbers', `What number is ${K(w)}?`, n, near, `${w} = ${n}. ${G('numbers').rule}`);
});
[12, 36, 2026].forEach(n => {
  const near = uniq([n + 1, n - 1, n + 10, Math.floor(n / 10) + (n % 10) * 10, n * 10].filter(v => v > 0 && v !== n)).map(v => KAI.numberToKai(v));
  add('Numbers', `How do you say the number ${n} in Kaihana?`, KAI.numberToKai(n), near, G('numbers').rule);
});
// 6. calendar & time
const monthNames = T.months.map(m => m.kai);
[2, 3, 4, 6, 9, 10].forEach(i => { const m = T.months[i - 1]; add('Calendar', `Which Kai month is the “${esc(m.en)}”?`, m.kai, monthNames, `${m.kai} means ${m.en}; it is month ${i}.`); });
const wdNames = T.weekdays.map(w => w.kai);
add('Calendar', `What is the rest day (Funday) of the Kai week called?`, T.weekdays[T.weekdays.length - 1].kai, wdNames, T.weekdays.map(w => `${w.kai} = ${w.en}`).join(', ') + '.');
add('Calendar', `What is the first day of the Kai week called?`, T.weekdays[0].kai, wdNames, T.weekdays.map(w => `${w.kai} = ${w.en}`).join(', ') + '.');
add('Calendar', 'How many days are in every Kai month?', MONTHLEN, [28, 30, 31, 40, 24, 32], `Every Kai month has ${MONTHLEN} days (${MONTHLEN / T.weekdays.length} weeks of ${T.weekdays.length}).`);
add('Calendar', 'How many months are in a Kai year?', T.months.length, [12, 13, 9, 8, 6], `There are ${T.months.length} months, then the Kaidays.`);
add('Calendar', 'How many days are in a Kai week?', T.weekdays.length, [5, 7, 8, 10], `The Kai week has ${T.weekdays.length} days.`);
add('Calendar', 'How many Kaidays (festival days) come after the last month in a normal year?', T.kaidays.length - 1, [3, 4, 7, 10, T.kaidays.length], `${T.kaidays.length - 1} Kaidays, or ${T.kaidays.length} in a leap year.`);
add('Calendar', 'Year 1 KE began on which date — the day Kai.fun went live?', fmtLong(epochDate), [new Date(2026, 0, 1), new Date(2025, 7, 24), new Date(2026, 6, 4), new Date(2026, 9, 31), new Date(2027, 7, 24)].map(fmtLong), `Year 1 KE began on ${fmtLong(epochDate)}.`);
add('Time', 'How many kai are in one day?', KPD, [24, 12, 100, 8, 20], `A day has ${KPD} kai, each with ${BPK} bits.`);
add('Time', 'How many bits are in one kai?', BPK, [60, 10, 24, 1000], `Each kai has ${BPK} bits.`);
add('Time', 'What time is noon in Kai Time?', NOON, ['12:00', '6:00', '10:00', '1:00', '0:00'], `Noon is ${NOON}, halfway through the ${KPD}-kai day.`);
add('Time', 'How long is one kai in normal time?', dur(kaiMs), ['1 hour', '2 hours', '1 hour 30 minutes', '3 hours 12 minutes', '2 hours 40 minutes'], `1 kai = ${dur(kaiMs)}.`);
// 7. holidays
const holWhen = h => `${h.d} ${T.months[h.m - 1].kai}`;
const holDates = T.holidays.map(holWhen).concat(['1 Rikin', '30 Siken', '15 Yenun', '6 Miwan']);
T.holidays.forEach(h => add('Holidays', `When is ${esc(h.name)}?`, holWhen(h), holDates, `${h.name} is on ${holWhen(h)}: ${h.about}`));
add('Holidays', 'Which holiday is New Year’s Day in Kaiya?', T.holidays[0].name, T.holidays.map(h => h.name).concat(['Kaiyo Day']), `${T.holidays[0].name}: ${T.holidays[0].about}`);
{ const h = T.holidays.find(x => /toast/i.test(x.name)); if (h) add('Holidays', `On which holiday does everyone make toast?`, h.name, T.holidays.map(x => x.name), `${h.name}: ${h.about}`); }
// 8. flag — parsed from KAI.FLAG_MEANING
const FM = KAI.FLAG_MEANING;
const firstSentence = FM.split('. ')[0];
const parts = firstSentence.split(/, /).map(p => { const m = /^(.*?) for (.*)$/.exec(p.trim()); return m ? { what: /^the /i.test(m[1]) ? m[1].toLowerCase() : 'the colour ' + m[1].toLowerCase(), means: m[2].replace(/\.$/, '') } : null; }).filter(Boolean);
const isParts = [...FM.matchAll(/The ([^.]+?) (is|are) ([^.]+)\./g)].map(m => ({ what: 'the ' + m[1], verb: m[2], means: m[3] }));
const flagMeans = parts.map(p => p.means).concat(isParts.map(p => p.means));
parts.forEach(p => add('Flag', `On the flag of Kaiya, what does ${esc(p.what)} stand for?`, p.means, flagMeans.concat(['the toast of Kaiya', 'the mountains']), FM));
isParts.forEach(p => add('Flag', `On the flag of Kaiya, what ${p.verb} ${esc(p.what)}?`, p.means, flagMeans.concat(['a slice of toast', 'the letter o in Kaiscript']), FM));
// 9. rules & motto
const fakeRules = ['Win every game.', 'Never say sorry.', 'Always eat toast first.', 'Stay inside all day.'];
KAI.RULES.forEach(r => add('Rules', `What does the Kai rule ${K(r.kai)} mean?`, r.en, KAI.RULES.map(x => x.en).concat(fakeRules), `The Three Rules: ${KAI.RULES.map(x => `${x.kai} (${x.en})`).join(', ')}.`));
add('Rules', 'Which of these is one of the Three Rules of Kaiya?', KAI.RULES[rnd(KAI.RULES.length)].en, fakeRules, `The Three Rules: ${KAI.RULES.map(x => x.en).join(' ')}`);
add('Rules', 'What is the motto of Kaiya?', KAI.MOTTO.kai, EXS.filter(x => x.k.split(' ').length === 3 && x.k.includes(' sa ')).map(x => x.k).concat(['kai nai sa yosa', 'mi sa kai']), `${KAI.MOTTO.kai} = “${KAI.MOTTO.en}”`);
add('Rules', `What does the motto ${K(KAI.MOTTO.kai)} mean?`, KAI.MOTTO.en, ['Fun is bad.', 'Play every day.', 'Good luck!', 'We love toast.'], `${KAI.MOTTO.kai} = “${KAI.MOTTO.en}”`);
// 10. the KAI board game (rules from the kai.html spec)
const KAIG = 'KAI: 7×7 board, the Spot is d4, pieces step and hop, sandwich captures; win by capturing the Kai, starting your turn with your Kai on the Spot, taking all enemy Kins, or leaving the other player with no legal moves.';
add('KAI game', 'How big is the board in the game KAI?', '7 × 7', ['8 × 8', '6 × 6', '9 × 9', '10 × 10'], KAIG);
add('KAI game', 'In KAI, what is the centre square called?', 'the Spot', ['the Throne', 'the Toaster', 'the Hole', 'the Sun'], KAIG);
add('KAI game', 'Which square is the Spot on a KAI board?', 'd4', ['a1', 'e5', 'g7', 'c3'], KAIG);
add('KAI game', 'In KAI, what do you call trapping an enemy piece between two of yours?', 'a sandwich', ['a toast', 'a pancake', 'a burrito', 'a hug'], KAIG);
add('KAI game', 'Your most important piece in KAI is called the…', 'Kai', ['Kin', 'Spot', 'Boss', 'Monke'], KAIG);
const wins = ['Capture the other player’s Kai', 'Start your turn with your Kai on the Spot', 'The other player has no Kins left', 'The other player has no legal moves'];
const notWins = ['Have the most toast', 'Roll a six', 'Shout “KAI!” first', 'Move every piece once'];
add('KAI game', 'Which of these wins a game of KAI?', wins[rnd(wins.length)], notWins, KAIG);
add('KAI game', 'Which of these does NOT win a game of KAI?', notWins[rnd(notWins.length)], wins, KAIG);

window.__bank = BANK;

/* ================= quiz flow ================= */
const store = KAI.store('test');
let quiz = [], answers = [], cur = 0;
function pickQuestions() {
  const cats = shuffle(uniq(BANK.map(b => b.cat)));
  const left = new Map(cats.map(c => [c, shuffle(BANK.filter(b => b.cat === c))]));
  const out = [];
  while (out.length < NQ) { for (const c of cats) { const l = left.get(c); if (l.length && out.length < NQ) out.push(l.pop()); } }
  return shuffle(out).map(b => ({ ...b, opts: shuffle([b.a].concat(shuffle(b.pool).slice(0, 3))) }));
}
function show(id) { ['scrStart', 'scrQuiz', 'scrResult'].forEach(s => { $(s).hidden = s !== id; }); window.scrollTo(0, 0); }
function start() {
  const n = $('nameIn').value.trim();
  if (n) KAI.passport.setName(n);
  quiz = pickQuestions(); answers = new Array(NQ).fill(null); cur = 0;
  show('scrQuiz'); renderQ();
}
function renderQ() {
  const Q = quiz[cur];
  $('qCat').textContent = Q.cat;
  $('qNum').textContent = `Question ${cur + 1} of ${NQ}`;
  $('dots').innerHTML = quiz.map((_, i) => `<i class="${i === cur ? 'cur' : answers[i] != null ? 'done' : ''}"></i>`).join('');
  $('qText').innerHTML = Q.q;
  $('opts').innerHTML = Q.opts.map((o, i) => `<button class="c-opt${answers[cur] === o ? ' sel' : ''}" role="radio" aria-checked="${answers[cur] === o}" data-o="${esc(o)}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('');
  $('backBtn').disabled = cur === 0;
  $('nextBtn').disabled = answers[cur] == null;
  $('nextBtn').textContent = cur === NQ - 1 ? 'Finish ✓' : 'Next →';
  $('scrQuiz').dataset.q = cur;
}
$('opts').addEventListener('click', e => {
  const b = e.target.closest('.c-opt'); if (!b) return;
  answers[cur] = b.dataset.o;
  renderQ();
  $('nextBtn').focus({ preventScroll: true });
});
$('nextBtn').onclick = () => { if (answers[cur] == null) return; if (cur < NQ - 1) { cur++; renderQ(); } else finish(); };
$('backBtn').onclick = () => { if (cur > 0) { cur--; renderQ(); } };
document.addEventListener('keydown', e => {
  if ($('scrQuiz').hidden || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const i = 'abcd1234'.indexOf(e.key.toLowerCase());
  if (i >= 0) { const b = $('opts').querySelectorAll('.c-opt')[i % 4]; if (b) b.click(); }
  else if (e.key === 'Enter' && answers[cur] != null && document.activeElement === document.body) $('nextBtn').click();
});

function finish() {
  const right = quiz.filter((q, i) => answers[i] === q.a).length;
  const passed = right >= PASS;
  const best = Math.max(store.get('best', 0), right);
  store.set('best', best);
  if (passed) store.set('passed', true);
  show('scrResult');
  $('score').innerHTML = `${right}<small>/${NQ}</small>`;
  $('scrResult').dataset.score = right;
  $('scrResult').dataset.passed = passed ? '1' : '0';
  $('verdict').className = 'c-verdict ' + (passed ? 'c-pass' : 'c-fail');
  $('verdict').textContent = passed ? `${KAI.lookupKai('kaiyo').kai.replace(/^./, c => c.toUpperCase())}, citizen!` : 'Not quite yet';
  $('verdictText').innerHTML = passed
    ? `You passed (you needed ${PASS}). You are now a ${K(KAI.lookupKai('kaiteno').kai)} — a citizen of Kaiya. Your certificate is below.`
    : `You needed ${PASS} out of ${NQ}. Look at the answers below, read a bit of <a href="pedia.html">Kaipedia</a>, and try again — every test has different questions. That is rule three: ${esc(KAI.RULES[2].en.toLowerCase())}`;
  const wrong = quiz.map((q, i) => ({ q, a: answers[i] })).filter(x => x.a !== x.q.a);
  $('reviewTitle').textContent = wrong.length ? `Your mistakes (${wrong.length})` : 'No mistakes at all!';
  $('review').innerHTML = wrong.length ? wrong.map(({ q, a }) => `<div class="c-rv"><div class="q">${q.q}</div><div class="a">You said: <span class="no">${esc(a)}</span> · Answer: <span class="yes">${esc(q.a)}</span></div><div class="x">${esc(q.x)}</div></div>`).join('')
    : `<p class="c-ok" style="margin:0">Perfect score. Even Humo Sisi, the KAI champion, would say “${esc(KAI.lookupKai('arima').kai)}”.</p>`;
  $('certBox').hidden = !passed;
  if (passed) {
    $('certName').value = KAI.passport.getName() || $('nameIn').value.trim();
    renderCert();
    KAI.passport.give('citizen');
  }
}
$('againBtn').onclick = () => { show('scrStart'); renderStart(); };
$('startBtn').onclick = start;
$('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });

/* ================= certificate ================= */
function sealSVG() {
  const txt = ' KAIYA · KAITENO · KAIYA · KAITENO ·';
  const chars = [...txt].map((c, i) => { const a = i / txt.length * 360; return `<text x="60" y="13" transform="rotate(${a.toFixed(1)} 60 60)" font-family="Arial Black, sans-serif" font-weight="900" font-size="9.5" fill="#b8301e" text-anchor="middle">${esc(c)}</text>`; }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><circle cx="60" cy="60" r="57" fill="#f2b632" stroke="#b8301e" stroke-width="3"/><circle cx="60" cy="60" r="45" fill="none" stroke="#b8301e" stroke-width="2" stroke-dasharray="3 2.4"/>${chars}<circle cx="60" cy="60" r="34" fill="#e5432d" stroke="#191512" stroke-width="2.5"/><g stroke="#f6efe0" stroke-width="6" stroke-linecap="round"><line x1="47" y1="47" x2="73" y2="47"/><line x1="60" y1="47" x2="60" y2="73"/><line x1="47" y1="73" x2="73" y2="73"/></g></svg>`;
}
function certData() {
  const name = ($('certName').value || '').trim() || 'A Kaiist';
  const k = KAI.toKaiDate(new Date());
  return { name, k, kaiDate: k.text, normal: fmtLong(new Date()), weekday: `${k.weekday.kai} (${k.weekday.en})`, score: +$('scrResult').dataset.score || 0 };
}
function renderCert() {
  const d = certData();
  $('cert').innerHTML = `
    <div class="band"></div>
    <div class="flagc">${KAI.flagSVG(120)}</div>
    <div class="seal">${sealSVG()}</div>
    <div class="in">
      <div class="kick">Kaiya · the Land of Fun</div>
      <div class="ti">Certificate of Citizenship</div>
      <div class="lead">This is to certify that</div>
      <div class="nm" id="certNm">${esc(d.name)}</div>
      <div class="sc">${KAI.scriptSVG(d.name, { size: 40, color: '#191512' })}</div>
      <div class="body">passed the citizenship test with <b>${d.score} out of ${NQ}</b> and is now a <b>${esc(KAI.lookupKai('kaiteno').kai)}</b>, a citizen of Kaiya, with every right to play every day, help their friends and learn something new.</div>
      <div class="rules">${KAI.RULES.map(r => `<span><b>${esc(r.kai)}</b> · ${esc(r.en)}</span>`).join('')}</div>
      <div class="meta">
        <div class="col"><b>${esc(d.kaiDate)}</b>${esc(d.weekday)} · ${esc(d.normal)}</div>
        <div class="col r"><b>${esc(KAI.MOTTO.kai)}</b>“${esc(KAI.MOTTO.en)}”</div>
      </div>
    </div>`;
  $('cert').dataset.name = d.name;
}
$('certName').addEventListener('input', () => { KAI.passport.setName($('certName').value.trim()); renderCert(); });

function svgImage(svg, pixelStrokes) {
  return new Promise((res, rej) => {
    // make strokes pixel-based like on the page, then load as an image
    svg = svg.replace(/<svg([^>]*)>/, (m, a) => `<svg${/xmlns=/.test(a) ? '' : ' xmlns="http://www.w3.org/2000/svg"'}${a}>${pixelStrokes ? '<style>line,circle,path{vector-effect:non-scaling-stroke}</style>' : ''}`);
    const img = new Image();
    img.onload = () => res(img); img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}
function fitText(c, text, font, max) {
  let size = font.size;
  do { c.font = `${font.weight} ${size}px ${font.family}`; size -= 2; } while (c.measureText(text).width > max && size > 12);
}
async function drawCert() {
  const d = certData(), W = 1400, H = 1000;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const DISP = '"Bricolage Grotesque","Arial Black",Arial,sans-serif', BODY = '"Atkinson Hyperlegible",Arial,sans-serif';
  c.fillStyle = '#fffaf0'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#127a73'; c.fillRect(0, H - 24, W, 24);
  c.strokeStyle = '#e5432d'; c.lineWidth = 4; c.strokeRect(30, 30, W - 60, H - 60); c.strokeRect(40, 40, W - 80, H - 80);
  c.strokeStyle = '#191512'; c.lineWidth = 3; c.strokeRect(50, 50, W - 100, H - 100);
  const [flag, seal, script] = await Promise.all([svgImage(KAI.flagSVG(300)), svgImage(sealSVG()), svgImage(KAI.scriptSVG(d.name, { size: 60, color: '#191512', weight: 6 }), true)]);
  c.drawImage(flag, 90, 80, 150, 100); c.lineWidth = 3; c.strokeRect(90, 80, 150, 100);
  c.save(); c.translate(W - 175, 170); c.rotate(-10 * Math.PI / 180); c.drawImage(seal, -95, -95, 190, 190); c.restore();
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillStyle = '#e5432d'; c.font = `800 22px ${DISP}`;
  c.fillText('K A I Y A   ·   T H E   L A N D   O F   F U N', W / 2, 110);
  c.fillStyle = '#191512'; fitText(c, 'Certificate of Citizenship', { weight: 800, size: 72, family: DISP }, 860); c.fillText('Certificate of Citizenship', W / 2, 190);
  c.fillStyle = '#4b4238'; c.font = `400 28px ${BODY}`; c.fillText('This is to certify that', W / 2, 270);
  c.fillStyle = '#b8301e'; fitText(c, d.name, { weight: 800, size: 88, family: DISP }, 1000); c.fillText(d.name, W / 2, 365);
  c.strokeStyle = '#191512'; c.lineWidth = 4; c.beginPath(); c.moveTo(W / 2 - 380, 392); c.lineTo(W / 2 + 380, 392); c.stroke();
  const sw = Math.min(900, script.width * (60 / script.height)), sh = sw / script.width * script.height;
  c.drawImage(script, W / 2 - sw / 2, 412, sw, sh);
  c.fillStyle = '#191512'; c.font = `400 27px ${BODY}`;
  const lines = [`passed the citizenship test with ${d.score} out of ${NQ} and is now a ${KAI.lookupKai('kaiteno').kai},`, 'a citizen of Kaiya, with every right to play every day,', 'help their friends and learn something new.'];
  lines.forEach((l, i) => c.fillText(l, W / 2, 540 + i * 40));
  // the three rules as little pills
  c.font = `400 22px ${BODY}`;
  const pills = KAI.RULES.map(r => ({ k: r.kai, e: ' · ' + r.en }));
  const pw = pills.map(p => { c.font = `800 22px ${DISP}`; const a = c.measureText(p.k).width; c.font = `400 22px ${BODY}`; return a + c.measureText(p.e).width + 36; });
  const gap = 16, total = pw.reduce((a, b) => a + b, 0) + gap * (pills.length - 1);
  let x = W / 2 - total / 2;
  pills.forEach((p, i) => {
    c.fillStyle = '#f6efe0'; c.strokeStyle = '#191512'; c.lineWidth = 2.5;
    c.beginPath(); c.roundRect(x, 690, pw[i], 46, 23); c.fill(); c.stroke();
    c.textAlign = 'left'; c.font = `800 22px ${DISP}`; c.fillStyle = '#b8301e'; c.fillText(p.k, x + 18, 720);
    const kw = c.measureText(p.k).width; c.font = `400 22px ${BODY}`; c.fillStyle = '#191512'; c.fillText(p.e, x + 18 + kw, 720);
    x += pw[i] + gap;
  });
  c.textAlign = 'left'; c.fillStyle = '#191512'; c.font = `800 34px ${DISP}`; c.fillText(d.kaiDate, 100, 840);
  c.fillStyle = '#4b4238'; c.font = `400 24px ${BODY}`; c.fillText(`${d.weekday} · ${d.normal}`, 100, 878);
  c.textAlign = 'right'; c.fillStyle = '#191512'; c.font = `800 34px ${DISP}`; c.fillText(KAI.MOTTO.kai, W - 100, 840);
  c.fillStyle = '#4b4238'; c.font = `400 24px ${BODY}`; c.fillText(`“${KAI.MOTTO.en}”`, W - 100, 878);
  c.textAlign = 'center'; c.fillStyle = '#857a6b'; c.font = `400 20px ${BODY}`; c.fillText('kaifun.fun/kaiism · Kaiya is a pretend country made for fun', W / 2, 925);
  return cv;
}
$('dlBtn').onclick = async () => {
  $('dlBtn').disabled = true;
  try {
    const cv = await drawCert();
    const url = cv.toDataURL('image/png');
    const a = $('dlLink');
    a.href = url; a.download = `kaiya-citizen-${(certData().name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'kaiist')}.png`;
    a.click();
    KAI.toast('Certificate saved as a picture.');
  } catch (e) {
    KAI.toast('Sorry, the picture could not be made in this browser.');
  }
  $('dlBtn').disabled = false;
};
window.__drawCert = drawCert;

/* ================= start screen ================= */
function renderStart() {
  $('nameIn').value = KAI.passport.getName();
  const best = store.get('best', 0);
  $('best').innerHTML = KAI.passport.has('citizen') ? `You are already a citizen (best score ${best}/${NQ}). You can take the test again any time for a new certificate.` : best ? `Your best score so far: ${best}/${NQ}.` : '';
}
$('kaitenoWord').textContent = KAI.lookupKai('kaiteno').kai;
$('flagBox').innerHTML = KAI.flagSVG(220);
$('rulesList').innerHTML = [
  `<b>${NQ} questions</b>, picked at random from a bank of ${BANK.length}.`,
  `Get <b>${PASS} or more</b> right to pass.`,
  `Topics: Kaihana words and grammar, numbers, the calendar and Kai Time, holidays, the flag, the Three Rules, the motto and the board game KAI.`,
  `Stuck? Everything is explained in <a href="pedia.html">Kaipedia</a>.`
].map(l => `<li>${l}</li>`).join('');
renderStart();
})();
</script>
