  $('#closed').addEventListener('click', e => { if (e.target.id !== 'open') JD.UI.open(); });
  $('#rummage').addEventListener('click', () => { if (!opened) JD.UI.open(); JD.UI.close(); JD.Phys.rummage(); });
  $('#catBtn').addEventListener('click', () => JD.Cat.toggle());
  $('#snd').addEventListener('click', () => JD.Snd.toggle()); $('#snd').textContent = JD.Snd.muted() ? '♪ OFF' : '♪ ON';
  let rt = 0; const refit = () => { clearTimeout(rt); rt = setTimeout(() => { JD.Render.resize(); JD.UI.follow(); }, 60); };
  window.addEventListener('resize', refit); if (window.ResizeObserver) new ResizeObserver(refit).observe($('#stage'));
  try { document.fonts.ready.then(refit); } catch (e) { }
  if (JD.Q.has('open')) { opened = true; $('#closed').classList.add('hide'); }
  requestAnimationFrame(JD.Render.loop);

};
JD.clickPoint = id => {
  const it = JD.byId(id), v = W.visiblePixels(it); if (!v.length) return null;
  v.sort((a, b) => Math.hypot(a.x - it.x, a.y - it.y) - Math.hypot(b.x - it.x, b.y - it.y));
  return JD.Render.toClient(v[0].x, v[0].y);
};
}
// ===== catalog.js =====
{
const JD = window.JD, $ = JD.$;
const thumb = (it, on) => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  const s = Math.max(1, Math.floor(62 / Math.max(it.GW, it.GH))), w = it.GW * s, h = it.GH * s, ox = (64 - w) >> 1, oy = (64 - h) >> 1;
  if (on) x.drawImage(it.cv[0], ox, oy, w, h);
  else { x.drawImage(it.sil, ox, oy, w, h); x.globalCompositeOperation = 'source-atop'; x.fillStyle = '#5c3b25'; x.fillRect(0, 0, 64, 64); }
  return c;
};
let built = false;
JD.Cat = {
  init() {
    $('#catX').addEventListener('click', () => JD.Cat.close());
    $('#cat').addEventListener('click', e => { if (e.target.id === 'cat') JD.Cat.close(); });
  },
  build() {
    const grid = $('#catGrid'), f = JD.UI.foundMap(); grid.innerHTML = '';
    JD.ITEMS.forEach(it => {
      const on = !!f[it.id], d = document.createElement('button'); d.className = 'cc' + (on ? '' : ' no'); d.dataset.id = it.id;
      d.appendChild(thumb(it, on)); const s = document.createElement('span'); s.textContent = on ? it.name : (it.hidden ? '??? (hiding)' : '???'); d.appendChild(s);
      d.setAttribute('aria-label', on ? it.name : 'Not found yet');
      if (on) d.addEventListener('click', () => {
        grid.querySelectorAll('.sel').forEach(n => n.classList.remove('sel')); d.classList.add('sel');
        const det = $('#catDetail'); det.innerHTML = ''; const b = document.createElement('b'); b.textContent = it.name; det.appendChild(b); det.appendChild(document.createElement('br')); const ds = document.createElement('span'); JD.zText(ds, it.desc); det.appendChild(ds);
        JD.sfx(it.sfx);
      });
      grid.appendChild(d);
    });
    const n = Object.keys(f).length, hid = JD.ITEMS.filter(it => it.hidden), hf = hid.filter(it => f[it.id]).length;
    $('#catSum').textContent = n + '/' + JD.ITEMS.length + ' found · under-junk ' + hf + '/' + hid.length;
    built = true;
  },
  open() { JD.Cat.build(); $('#cat').classList.remove('hide'); JD.UI.close(); JD.sfx('click'); },
  close() { $('#cat').classList.add('hide'); },
  toggle() { if ($('#cat').classList.contains('hide')) JD.Cat.open(); else JD.Cat.close(); },
  built: () => built
};
}
// ===== sheet.js =====
{
const JD = window.JD;
JD.Sheet = {
  show() {
    document.body.classList.add('sheetMode'); const S = JD.$('#sheet'); S.classList.remove('hide');
    const sc = +(JD.Q.get('sheet') || 4) || 4;
    JD.ITEMS.forEach(it => {
      const d = document.createElement('div'); d.className = 'sc'; d.dataset.id = it.id;
      const c = document.createElement('canvas'); c.width = it.GW * sc; c.height = it.GH * sc;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(it.cv[0], 0, 0, c.width, c.height);
      const p = document.createElement('p'); p.textContent = it.name;
      d.appendChild(c); d.appendChild(p); S.appendChild(d);
    });
    window.SHEET_READY = true;
  }
};
}
// ===== tile.js =====
{
const JD = window.JD, W = JD.World;
JD.Tile = {
  show() {
    document.body.classList.add('tileMode'); const T = JD.$('#tile'); T.classList.remove('hide');
    const c = document.createElement('canvas'); c.width = 1640; c.height = 820; T.appendChild(c); const X = c.getContext('2d'); X.imageSmoothingEnabled = false;
    const S = 5, r = JD.rng(23), keep = Math.random; Math.random = r;
    const all = JD.ITEMS; JD.ITEMS = JD.shuffle(all.filter(it => !it.txt && !it.hidden), r).slice(0, 100);
    W.setSize(S, 328, 164, 1); W.avoid = { x: 52, y: 64, w: 224, h: 36 }; W.layout({}); W.avoid = null;
    JD.ITEMS = all; Math.random = keep;
    X.drawImage(W.bg, 1, 1, W.W, W.H, 0, 0, W.W * S, W.H * S);
    const pick = W.order.filter(it => !it.txt && !it.hidden);
    pick.forEach(it => {
      const px = Math.round(it.x * S), py = Math.round(it.y * S);
      X.save(); X.translate(px + 7, py + 10); X.rotate(it.ang); X.scale(S, S); X.globalAlpha = 0.34; X.drawImage(it.sil, -it.GW / 2, -it.GH / 2); X.restore();
      X.save(); X.translate(px, py); X.rotate(it.ang); X.scale(S, S); X.drawImage(it.cv[0], -it.GW / 2, -it.GH / 2); X.restore();
    });
    const tw = 150, th = 30, tp = new JD.G(tw, th), tr = JD.rng(5);
    tp.r(0, 2, tw, th - 4, 'a');
    for (let x = 0; x < tw; x++) { if (tr() < 0.5) tp.p(x, 1, 'a'); if (tr() < 0.5) tp.p(x, th - 2, 'a'); }
    for (let y = 0; y < th; y++) { const e = Math.floor(tr() * 3); for (let i = 0; i < e; i++) { tp.p(i, y, '.'); tp.p(tw - 1 - i, y, '.'); } }
    tp.dith(0, 0, tw, th, 'd', 1); for (let i = 0; i < 40; i++) tp.p(tr() * tw, tr() * th, 'A');
    tp.shade(); tp.outline('N');
    const tc = JD.toCanvas(tp), ts = 8, tcx = 820, tcy = 410;
    X.save(); X.translate(tcx + 10, tcy + 14); X.rotate(-0.03); X.globalAlpha = 0.4; X.drawImage(JD.toCanvas(tp, true), -tc.width * ts / 2, -tc.height * ts / 2, tc.width * ts, tc.height * ts); X.restore();
    X.save(); X.translate(tcx, tcy); X.rotate(-0.03); X.drawImage(tc, -tc.width * ts / 2, -tc.height * ts / 2, tc.width * ts, tc.height * ts); X.restore();
    const txt = 'JUNK DRAWER', g = new JD.G(132, 18);
    g.big(txt, 1, 3, 'O', 2); g.big(txt, 1, 2, 'O', 2); g.big(txt, 1, 0, 'y', 2);
    g.shade(); g.outline();
    for (let y = 0; y < g.H; y++) for (let x = 0; x < g.W; x++) if (g.a[y * g.W + x] === 'y' && y % 2 === 0 && x % 2) g.a[y * g.W + x] = 'y';
    const gc = JD.toCanvas(g), gs = 8;
    X.save(); X.translate(tcx, tcy); X.rotate(-0.03); X.drawImage(gc, Math.round(-gc.width * gs / 2), Math.round(-gc.height * gs / 2) + 4, gc.width * gs, gc.height * gs); X.restore();
    window.TILE_READY = true;
  }
};
}
// ===== main.js =====
{
const JD = window.JD;
JD.ITEMS.forEach(JD.bake);
if (JD.Q.has('sheet')) JD.Sheet.show();
else if (JD.Q.has('tile')) JD.Tile.show();
else JD.boot();
}
