<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GRAVITY IS A RUMOUR · Kai.fun</title>
<meta name="description" content="GRAVITY IS A RUMOUR - in the village of Lower Wobbling the laws of physics only work while enough villagers believe in them. Whisper rumours, steer the gossip, and use the chaos to solve 26 picture-book puzzles.">
<meta name="theme-color" content="#f3e6c8">
<script src="bdp.js" defer></script>
<style>
/* style_main.css - GRAVITY IS A RUMOUR, "Gouache & Linocut": cream paper, inky outlines, rust and sage gouache. */
:root {
--paper: #fbf3e0; --paper2: #f3e6c8; --paper3: #e8d6ae; --ink: #3a2a22; --ink2: #6a5646; --rust: #c8553d; --rustD: #9a3a28;
--sage: #7f9f6a; --sageD: #5a7a4a; --sky: #8ab4d8; --plum: #8a5cb8; --gold: #e0b040; --good: #3e8a4e; --bad: #c8323a;
--serif: Georgia, 'Palatino Linotype', 'Book Antiqua', serif; --sans: 'Trebuchet MS', 'Segoe UI', sans-serif;
--shadow: 3px 4px 0 rgba(58, 42, 34, .25);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper2); color: var(--ink); max-width: 100vw; }
body { font-family: var(--sans); font-size: 14px; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; cursor: pointer; font-size: inherit; }
.hide { display: none !important; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; max-width: 100vw; }
#top { flex: 0 0 auto; height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--ink); color: var(--paper); z-index: 50;
border-bottom: 3px solid var(--rust); }
#kai { color: var(--paper); text-decoration: none; font-weight: 700; padding: 3px 9px; border-radius: 14px; background: rgba(255, 255, 255, .12); white-space: nowrap; }
#kai:hover { background: rgba(255, 255, 255, .25); }
#topT { font-family: var(--serif); font-weight: 900; letter-spacing: 1.5px; white-space: nowrap; font-size: 14px; color: #ffe8b8; }
#topMid { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #d8c8a8; font-size: 12px; font-style: italic; font-family: var(--serif); }
.tb { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .25); border-radius: 8px; color: #fff; min-width: 34px; height: 28px; }
#main { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow: hidden; }
/* buttons: chunky picture-book tabs */
.pb { background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px 10px 14px 10px; padding: 9px 16px; box-shadow: var(--shadow); font-weight: 700;
font-family: var(--serif); transition: transform .08s; display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.pb:hover { transform: translateY(-2px) rotate(-.5deg); background: #fffaf0; }
.pb:active { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(58, 42, 34, .3); }
.pb.big { font-size: 20px; padding: 12px 26px; background: var(--rust); color: #fff8ea; }
.pb.big:hover { background: #d8664a; }
.pb small { font-family: var(--sans); font-weight: 400; font-size: 12px; opacity: .85; }
.pb.alt { background: var(--sage); color: #fff; }
.pb:disabled { opacity: .45; cursor: default; transform: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
/* toasts */
#toasts { position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 7px 14px; box-shadow: var(--shadow); font-family: var(--serif); font-size: 14px; animation: tIn .25s; text-align: center; }
.toast.good { background: #e6f2d8; } .toast.bad { background: #f8dcd4; } .toast.book { background: #efe2fa; }
.toast.out { opacity: 0; transition: opacity .4s; }
@keyframes tIn { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
/* modal */
#modal { position: fixed; inset: 0; z-index: 300; background: rgba(40, 28, 20, .45); display: flex; align-items: center; justify-content: center; padding: 14px; }
#modalIn { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px 12px 18px 12px; box-shadow: 6px 8px 0 rgba(40, 28, 20, .35); padding: 18px 20px;
width: min(560px, 100%); max-height: 88vh; overflow-y: auto; position: relative; }
#modalIn h2 { font-family: var(--serif); margin: 0 0 6px; font-size: 24px; }
#modalIn p { line-height: 1.45; margin: 8px 0; }
.mClose { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 22px; }
.stars { font-size: 34px; letter-spacing: 6px; text-align: center; margin: 6px 0; }
.stars .off { opacity: .2; }
.chip { display: inline-block; border: 1.5px solid var(--ink); border-radius: 10px; padding: 1px 8px; margin: 2px; background: var(--paper2); font-size: 12px; }
.lawChip { display: inline-flex; align-items: center; gap: 4px; border-radius: 10px; padding: 2px 8px; color: #fff; font-size: 12px; font-weight: 700; margin: 2px; }
.pageIn { position: absolute; inset: 0; overflow-y: auto; padding: 18px 16px 40px; background: var(--paper2);
background-image: radial-gradient(rgba(120, 90, 50, .08) 1px, transparent 1.2px); background-size: 7px 7px; }
.pageIn h1 { font-family: var(--serif); text-align: center; margin: 4px 0 2px; font-size: 30px; }
.pageIn .sub { text-align: center; color: var(--ink2); font-style: italic; font-family: var(--serif); margin-bottom: 14px; }
.backRow { display: flex; justify-content: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
/* style_game.css - the play screen: village stage, HUD, goal card, whisper card, side panel (board, graph, chronicle). */
#game { display: flex; }
#stage { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; background: #8ab4d8; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
#panel { flex: 0 0 330px; display: flex; flex-direction: column; background: var(--paper); border-left: 3px solid var(--ink); min-height: 0; }
#tabs { display: flex; border-bottom: 2px solid var(--ink); background: var(--paper2); }
#tabs button { flex: 1; border: 0; background: none; padding: 8px 2px; font-weight: 700; font-size: 12px; border-right: 1px solid var(--paper3); }
#tabs button.on { background: var(--paper); color: var(--rustD); box-shadow: inset 0 -3px 0 var(--rust); }
#tabBody { flex: 1; overflow-y: auto; padding: 10px; min-height: 0; }
#hud { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; align-items: center; z-index: 5; flex-wrap: wrap; justify-content: flex-end; }
#hud > * { background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 2px 3px 0 rgba(40, 28, 20, .3); }
#clock { padding: 2px 10px; display: flex; flex-direction: column; align-items: center; line-height: 1.05; font-family: var(--serif); }
#clock b { font-size: 17px; } #clock small { font-size: 10px; color: var(--ink2); }
#speeds { display: flex; overflow: hidden; }
#speeds button { border: 0; background: none; padding: 5px 8px; font-size: 13px; border-right: 1px solid var(--paper3); }
#speeds button.on { background: var(--rust); color: #fff; }
#wh { padding: 5px 10px; font-weight: 700; font-size: 15px; }
#wh.empty { background: #f0d0c8; }
.tb2 { padding: 4px 9px; font-size: 15px; }
#goalCard { position: absolute; top: 8px; left: 8px; z-index: 5; background: rgba(251, 243, 224, .95); border: 2px solid var(--ink); border-radius: 14px 10px 14px 10px;
box-shadow: 2px 3px 0 rgba(40, 28, 20, .3); padding: 7px 11px; max-width: min(360px, 60%); font-size: 12.5px; }
#goalCard h3 { margin: 0 0 3px; font-family: var(--serif); font-size: 15px; }
#goalCard .g { display: flex; gap: 6px; align-items: baseline; margin: 2px 0; }
#goalCard .g .ck { width: 14px; flex: 0 0 14px; }
#goalCard .g.done { color: var(--good); text-decoration: line-through; text-decoration-color: rgba(62, 138, 78, .5); }
#goalCard .g.wait { opacity: .55; }
#goalCard .g small { color: var(--ink2); margin-left: auto; white-space: nowrap; padding-left: 6px; }
#goalCard .hg { font-size: 11px; color: var(--ink2); margin-top: 3px; }
#goalCard.min .g, #goalCard.min .hg { display: none; }
#lawStrip { position: absolute; left: 8px; bottom: 8px; z-index: 5; display: flex; gap: 5px; flex-wrap: wrap; max-width: calc(100% - 16px); pointer-events: none; }
.ls { background: rgba(251, 243, 224, .92); border: 2px solid var(--ink); border-radius: 10px; padding: 2px 7px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 4px; }
.ls.bad { background: #f6d6cc; } .ls.gone { background: #e8c8f0; }
#pickHint { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); background: rgba(58, 42, 34, .8); color: #fff; padding: 4px 12px; border-radius: 12px;
font-size: 12px; pointer-events: none; z-index: 4; transition: opacity .5s; white-space: nowrap; }
/* the whisper card */
#whisperCard { position: absolute; z-index: 8; left: 50%; bottom: 8px; transform: translateX(-50%); width: min(470px, calc(100% - 16px)); background: var(--paper);
border: 3px solid var(--ink); border-radius: 18px 12px 18px 12px; box-shadow: 4px 6px 0 rgba(40, 28, 20, .35); padding: 10px 12px; max-height: 70%; overflow-y: auto; }
.wcHead { display: flex; gap: 10px; align-items: center; }
.wcFace { width: 54px; height: 54px; flex: 0 0 54px; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper2); }

.wcHead .kind { font-size: 12px; color: var(--rustD); font-weight: 700; }

.wcX { margin-left: auto; align-self: flex-start; border: 0; background: none; font-size: 20px; }

.traits { display: flex; flex-wrap: wrap; gap: 3px; margin: 4px 0; }
.trait { font-size: 10.5px; border-radius: 8px; padding: 1px 6px; background: var(--paper2); border: 1px solid var(--paper3); }
.bel { display: grid; grid-template-columns: 22px 1fr 36px; gap: 4px; align-items: center; font-size: 12px; margin: 2px 0; }
.bar { height: 9px; background: #e0d2b4; border-radius: 5px; overflow: hidden; border: 1px solid rgba(58, 42, 34, .35); position: relative; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.bar u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55; }
.rums { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.rb { border: 2px solid var(--ink); border-radius: 12px 8px 12px 8px; padding: 6px 8px; text-align: left; font-size: 12px; line-height: 1.25; background: #fff8ea; box-shadow: 2px 2px 0 rgba(40, 28, 20, .25); }
.rb b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.rb.d { background: #fbe8e2; } .rb.d b { color: var(--rustD); }
.rb.a { background: #e8f2df; } .rb.a b { color: var(--sageD); }
.rb:disabled { opacity: .45; }
.rb:hover:not(:disabled) { transform: translateY(-1px); }
.wcNote { font-size: 11.5px; color: var(--ink2); margin-top: 6px; }
.heard { font-size: 11.5px; margin-top: 6px; padding: 5px 7px; background: var(--paper2); border-radius: 8px; }
/* board */
.lawRow { border: 2px solid var(--ink); border-radius: 12px; padding: 6px 8px; margin-bottom: 7px; background: #fffaf0; }
.lawRow.off { opacity: .45; }
.lawRow .lt { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.lawRow .lt .pc { margin-left: auto; font-family: var(--serif); font-size: 18px; }
.lawRow .say { font-size: 11px; color: var(--ink2); font-style: italic; }
.lawRow .bar { height: 12px; margin: 4px 0 2px; }
.lawRow .mood { font-size: 10.5px; color: var(--ink2); }
.pbNote { font-size: 11.5px; color: var(--ink2); margin: 6px 2px; line-height: 1.35; }
#graphCv { width: 100%; aspect-ratio: 1 / 1; display: block; border: 2px solid var(--ink); border-radius: 12px; background: #fffaf0; }
.glaw { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0; }
.glaw button { border: 1.5px solid var(--ink); border-radius: 9px; background: var(--paper2); padding: 2px 7px; font-size: 12px; }
.glaw button.on { background: var(--ink); color: #fff; }
.logE { font-size: 12px; padding: 4px 6px; border-bottom: 1px dashed var(--paper3); line-height: 1.3; }
.logE time { color: var(--ink2); font-size: 10.5px; margin-right: 4px; font-family: var(--serif); }
.logE.whisper { color: #6a3aa8; } .logE.mutate { color: #a0622a; } .logE.sceptic { color: #3a6a8a; } .logE.good, .logE.goal, .logE.win { color: var(--good); font-weight: 700; }
.logE.bad, .logE.lose, .logE.chaos, .logE.break, .logE.panic { color: var(--bad); }
.logE.mayor, .logE.crier, .logE.pamphlet, .logE.paper { background: #fff2c8; }
.pp { display: flex; gap: 6px; align-items: center; padding: 4px; border-bottom: 1px dashed var(--paper3); cursor: pointer; font-size: 12px; }
.pp:hover { background: var(--paper2); }
.pp .nm { flex: 1; min-width: 0; } .pp .nm small { display: block; color: var(--ink2); font-size: 10.5px; }
@media (max-width: 760px) {
#game { flex-direction: column; }
#stage { flex: 0 0 56%; }
#panel { flex: 1 1 auto; border-left: 0; border-top: 3px solid var(--ink); }
#topT { font-size: 12px; letter-spacing: .5px; }
#topMid { display: none; }
#goalCard { max-width: calc(100% - 16px); top: 44px; font-size: 11.5px; padding: 5px 8px; }
#hud { left: 8px; right: 8px; justify-content: flex-start; }
#hud > * { box-shadow: none; }
#speeds button { padding: 4px 7px; }
.rums { grid-template-columns: 1fr 1fr; gap: 4px; }
.rb { font-size: 11px; padding: 4px 6px; }
.wcBio, .traits, .wcHeard { display: none; }
.wcFace { width: 40px; height: 40px; flex-basis: 40px; }
#whisperCard { max-height: 88%; bottom: 4px; }
#lawStrip { bottom: 4px; }
}
/* style_pages.css - home screen, level map (chapters as storybook pages), the Book of Rumours, settings. */
#home { background: #f3d6a8; }
#homeCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#homeUi { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 14px 14px; pointer-events: none; }
#homeSpace { flex: 1 1 auto; }
#homeBtns { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }

<div id="app">
  <header id="top">
    <a id="kai" href="index.html">← Kai.fun</a>
    <span id="topT">GRAVITY IS A RUMOUR</span>
    <span id="topMid"></span>
    <button class="tb" id="snd" title="Sound on / off" aria-label="Sound">🔊</button>
    <button class="tb" id="homeBtn" title="Back to the title page" aria-label="Home">⌂</button>
  </header>
  <main id="main">
    <section id="home" class="screen">
      <canvas id="homeCv" aria-label="Gravity is a Rumour: the village of Lower Wobbling wakes up"></canvas>
      <div id="homeUi">
        <div id="homeSpace"></div>
        <div id="homeBtns">
          <button class="pb big" id="hPlay"><b>▶ The Campaign</b><small id="hSub">26 puzzles in five seasons</small></button>
          <div class="row"><button class="pb" id="hSand">∞ Sandbox</button><button class="pb" id="hBook">📖 Book of Rumours</button><button class="pb" id="hSet">⚙ Settings</button></div>
        </div>
        <div id="homeFoot">In Lower Wobbling, the laws of physics only work if enough people believe in them. You are a whisper.</div>
      </div>
    </section>
    <section id="levels" class="screen hide"><div class="pageIn" id="levelsIn"></div></section>
    <section id="book" class="screen hide"><div class="pageIn" id="bookIn"></div></section>
    <section id="game" class="screen hide">
      <div id="stage">
        <canvas id="cv" aria-label="The village"></canvas>
        <div id="hud">
          <div id="clock"><b id="clkT">6:00</b><small id="clkD">Day 1</small></div>
          <div id="speeds"><button data-sp="0" title="Pause (Space)">⏸</button><button data-sp="1" class="on" title="Normal (1)">▶</button><button data-sp="3" title="Fast (2)">⏩</button><button data-sp="8" title="Very fast (3)">⏭</button></div>
          <div id="wh" title="Whispers left">🤫 <b id="whN">3</b></div>
          <button id="hintB" class="tb2" title="Hint">💡</button>
          <button id="restartB" class="tb2" title="Restart level (R)">↺</button>
        </div>
        <div id="goalCard"></div>
        <div id="lawStrip"></div>
        <div id="whisperCard" class="hide"></div>

      <aside id="panel">
        <div id="tabs"><button data-tab="board" class="on">Belief Board</button><button data-tab="graph">Gossip Graph</button><button data-tab="log">Chronicle</button><button data-tab="people">Villagers</button></div>
        <div id="tabBody"></div>
      </aside>
    </section>
  </main>
  <div id="modal" class="hide"><div id="modalIn"></div></div>
  <div id="toasts"></div>

<script>
"use strict";
// ===== util.js =====
const GR = window.GR = {};
GR.$ = id => document.getElementById(id);
GR.qs = (s, r) => (r || document).querySelector(s);
GR.qsa = (s, r) => Array.from((r || document).querySelectorAll(s));
GR.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
GR.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
GR.lerp = (a, b, t) => a + (b - a) * t;
GR.sat = v => v < 0 ? 0 : v > 1 ? 1 : v;
GR.smooth = (a, b, x) => { const t = GR.sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
GR.now = () => performance.now() / 1000;

lv.goals.forEach((g, i) => { if (!g.id) g.id = 'g' + i; });
lv.idx = GR.LEVELS.length; lv.n = lv.idx + 1;
if (!lv.season) lv.season = GR.CHAPTERS[lv.ch - 1].season;
GR.LEVELS.push(lv);
};
GR.addLevel({ id: 'cat', ch: 1, title: 'The Cat on the Clocktower', laws: ['gravity'], budget: 3, par: 1, days: 1.5, start: 6, absent: ['agnes'],
intro: 'Whiskers has climbed the clocktower and won\'t come down: it\'s far too high to jump. If gravity were just a little weaker, the jump would be a gentle one...',
tip: 'Click a villager, then whisper a rumour. Gossip spreads where people meet: the Well in the morning, the Market at noon, the Tavern at night. But careful: below 50% the cat will float UP.',
props: [{ k: 'cat', id: 'cat', x: 1385, y: 218, anchor: { law: 'gravity', below: 0.72 }, breakTxt: 'Whiskers lands with a dreadful THUMP. (Fine, but furious, and back up the tower out of spite.)' }],
goals: [{ t: 'flag', f: 'catDown', latch: true, txt: 'Get Whiskers down from the clocktower, safely' }],
fail: [{ t: 'lost', p: 'cat', txt: 'Whiskers floated up into the clouds. Gravity got far too weak!' }, { t: 'broken', p: 'cat', txt: 'Whiskers jumped while gravity was still too strong. Ouch.' }],
winTxt: 'Whiskers is down! Pip is delighted. Nobody can explain why the jump looked so floaty.' });
GR.addLevel({ id: 'cart', ch: 1, title: 'The Runaway Apple Cart', laws: ['gravity', 'friction'], budget: 4, par: 2, days: 2, start: 6,
intro: 'Rosa\'s apple cart is chocked at the top of the Hill and the market is today. If the chocks could just... slip, it would roll all the way down. Then it has to STOP at the market.',
tip: 'Low friction lets the cart slide; the hay bales at the far end of the market will catch it. But on ice it will never stay put: bring friction back afterwards.',
props: [{ k: 'cart', id: 'cart', x: 70, anchor: { law: 'friction', below: 0.32 }, kick: [12, 0], relTxt: 'The chocks slip! Rosa\'s apple cart rolls off down the Hill!' }],
goals: [{ t: 'rest', p: 'cart', x: [846, 1000], txt: 'Park the apple cart in the Market' },
{ t: 'law', law: 'friction', min: 0.6, txt: 'Friction back above 60% so it stays parked' }],
fail: [{ t: 'lost', p: 'cart', txt: 'The cart floated away!' }],
winTxt: 'The cart glides into the Market and stops dead against the hay. Apples for everyone!' });
GR.addLevel({ id: 'bread', ch: 1, title: 'Old Agnes Doesn\'t Buy It', laws: ['gravity', 'friction'], budget: 4, par: 2, days: 2, start: 6,
intro: 'Bertram Crust wants his bread to RISE. Literally: up past the bakery chimney, for the Spring Fair photograph. Then back down onto the sill, please. Watch out for Agnes: she scoffs at every rumour and spreads the opposite.',
tip: 'Agnes is at the Well at dawn and the Market mid-morning. A sceptic who hears a doubting rumour starts a counter-rumour. Whisper where she isn\'t. Or use her later, to put gravity back.',
props: [{ k: 'bread', id: 'bread', n: 4, x: 1182, dx: 12, y: 426 }],
goals: [{ t: 'above', k: 'bread', y: 360, n: 3, latch: true, txt: 'Three loaves rise above the bakery chimney' },
{ t: 'restN', k: 'bread', x: [1150, 1250], n: 3, after: 'g0', txt: 'Three loaves land back at the bakery' },
{ t: 'law', law: 'gravity', min: 0.6, after: 'g0', txt: 'Gravity back above 60%' }],
fail: [{ t: 'gone', k: 'bread', max: 1, txt: 'The bread floated off into the clouds. The birds are thrilled.' }],
winTxt: 'The loaves rose, posed for the photograph, and settled back on the sill. Best bread in the valley.' });
GR.addLevel({ id: 'putback', ch: 1, title: 'Put It All Back', laws: ['gravity', 'friction'], budget: 5, par: 3, days: 1, start: 7,
init: { gravity: 0.34 },
intro: 'Somebody (you) had a busy night. Gravity is down to a third, crates are drifting over the lanes and people are starting to notice. Notice too much, and they stop believing altogether. Restore order before the roofs come off.',
tip: 'Seeing is believing: villagers who SEE floating crates lose faith fast. Affirming rumours ("Apples still fall") push back. Sceptics like Agnes are powerful allies for restoring a law.',
props: [{ k: 'crate', id: 'crate', n: 5, x: 560, dx: 150, y: 430 }],
goals: [{ t: 'law', law: 'gravity', min: 0.85, txt: 'Gravity restored above 85%' },
{ t: 'restN', k: 'crate', x: [0, 1800], n: 3, txt: 'At least three crates back on the ground' }],
fail: [{ t: 'roofs', txt: 'A roof came loose and floated away. That is the opposite of order.' }, { t: 'gone', k: 'crate', max: 2, txt: 'Too many crates floated off into the sky.' }],
winTxt: 'Crates thump down, people shrug, and by lunch everyone agrees it was a funny dream.' });
GR.addLevel({ id: 'eggs', ch: 1, title: 'Eggs for the Fair', laws: ['gravity', 'friction', 'breaking'], budget: 4, par: 2, days: 1, start: 5,
intro: 'At four in the afternoon the hens on the barn roof will kick over the egg basket (they always do). Ten eggs will roll off and drop. Rosa needs seven whole eggs for the fair cake. Then, by half past eleven, things must break again: the Tavern\'s Plate-Smashing Dance depends on it.',
tip: 'New law: Breaking. Below 50%, dropped things stop breaking. Timing matters: the eggs fall at 16:00 sharp.',
props: [{ k: 'egg', id: 'egg', n: 10, x: 438, dx: 4, y: 386, at: 16, vx0: 120, spawnTxt: 'The hens kick over the basket! Eggs roll off the barn roof!' }],
goals: [{ t: 'eggs', k: 'egg', n: 7, latch: true, txt: 'At least 7 of the 10 eggs survive the drop' },
{ t: 'law', law: 'breaking', min: 0.7, after: 'g0', by: [1, 23.5], txt: 'Breaking back above 70% by 23:30' }],
fail: [{ t: 'eggs', k: 'egg', max: 3, txt: 'Too many eggs cracked. No fair cake this year.' }],
winTxt: 'Seven perfect eggs, one magnificent cake, and the plates smashed beautifully at the Dance.' });

GR.addLevel({ id: 'boat', ch: 2, title: 'The Stranded Boat', laws: ['water', 'gravity'], budget: 4, par: 2, days: 2, start: 6,
intro: 'Fenn\'s boat is stuck in the pond below the dam and the regatta is in the reservoir above it. Boats can\'t climb dams. But rivers can, if nobody tells them otherwise.',
tip: 'Below 40% belief the river runs UPHILL, east over the dam, carrying the boat. Fenn ties it to the jetty when it arrives. Then put water back the way it was.',
props: [{ k: 'boat', id: 'boat', x: 1585, y: 524 }],
goals: [{ t: 'flag', f: 'boatMoored', latch: true, txt: 'Float Fenn\'s boat up over the dam to the jetty' },

fail: [{ t: 'lost', p: 'boat', txt: 'The boat floated off into the sky. Fenn is speechless.' }],
winTxt: 'The boat bobs at the reservoir jetty and the river trickles politely downhill again. Regatta on!' });

goals: [{ t: 'flagN', f: 'fishUp', n: 3, latch: true, txt: 'Three salmon over the dam' },
{ t: 'law', law: 'water', min: 0.65, after: 'g0', txt: 'River back to normal (above 65%)' }],
fail: [],

intro: 'Juniper wants to paint the waterfall over the dam, but it never holds still. She paints between 13:00 and 18:00. Slow time right down for her (below 35%) for a good twelve seconds, then get time ticking properly before the village gets stuck in syrup.',
tip: 'New law: Time. Villagers keep their own pace, but everything that falls, flows or drifts slows down. Juniper is at the dam in the afternoon; the Professor is her aunt.',
props: [],
goals: [{ t: 'lawFor', law: 'time', max: 0.35, secs: 12, win: [1, 13, 18], txt: 'Time below 35% for 12 s while Juniper paints (13:00-18:00)' },

GR.addLevel({ id: 'pamphlet', ch: 2, title: 'The Professor\'s Pamphlet', laws: ['friction', 'gravity'], budget: 2, par: 1, days: 2.5, start: 6, inst: ['pamphlet'],
intro: 'The Great Cheese of Lower Wobbling sits chocked on the Hill and must roll to the Market for the Cheese Festival. Two whispers won\'t reach enough people. But one person in this village prints her opinions.',
mech: 'Prof. Quill writes a pamphlet every morning at 8:00 about the law she believes least in (or one she has seen come back). Everyone who visits the Market from 11:00 to 15:00 reads it.',
tip: 'Quill believes her eyes more than gossip, but a whisper still works on her. She\'s at the Well at 7:30. Mind: she reports what she SEES the next day, too.',
props: [{ k: 'cheese', id: 'cheese', x: 80, anchor: { law: 'friction', below: 0.32 }, kick: [12, 0], relTxt: 'The chocks slip and the Great Cheese thunders down the Hill!' }],
goals: [{ t: 'rest', p: 'cheese', x: [846, 1000], txt: 'The Great Cheese parked in the Market' },
{ t: 'law', law: 'friction', min: 0.6, txt: 'Friction back above 60%' }],
fail: [{ t: 'lost', p: 'cheese', txt: 'The Great Cheese floated off. It is now a moon.' }],
winTxt: 'The Cheese rolls into the Market to applause. Prof. Quill is already writing "On the Return of Friction".' });
GR.addLevel({ id: 'pottery', ch: 2, title: 'The Pottery Fair', laws: ['breaking', 'time', 'gravity'], budget: 4, par: 2, days: 1, start: 5, inst: ['pamphlet'],
intro: 'At 11:00 Marigold\'s pottery cart hits the famous Market pothole and six pots fly into the air. They will smash, unless they don\'t. Save four. Then, by 21:00, breaking and time must both be back to normal for the glass-blowers\' evening.',
tip: 'Two ways to save a pot: make breaking unbelievable, or slow time so they land gently. Or both. Restoring two laws at once is the hard part.',
props: [{ k: 'pot', id: 'pot', n: 6, x: 885, dx: 11, y: 440, at: 11, vy0: -260, vx0: 25, spawnTxt: 'BANG! The pottery cart hits the pothole. Pots everywhere!' }],
goals: [{ t: 'eggs', k: 'pot', n: 4, latch: true, txt: 'At least 4 of 6 pots survive' },
{ t: 'law', law: 'breaking', min: 0.7, after: 'g0', by: [1, 21], txt: 'Breaking above 70% by 21:00' },
{ t: 'law', law: 'time', min: 0.75, after: 'g0', by: [1, 21], txt: 'Time above 75% by 21:00' }],
fail: [{ t: 'eggs', k: 'pot', max: 2, txt: 'Too many pots smashed. Marigold is sweeping up the Market.' }],
winTxt: 'Four pots bounce, wobble and stand. The glass-blowers\' evening goes off with a satisfying tinkle.' });

props: [{ k: 'pumpkin', id: 'pumpkin', x: 75, anchor: { law: 'friction', below: 0.32 }, kick: [12, 0], relTxt: 'The pumpkin wobbles free of its chocks and rolls!' }],

fail: [{ t: 'lost', p: 'pumpkin', txt: 'The pumpkin drifted off into the sky.' }],

GR.addLevel({ id: 'bell', ch: 3, title: 'The Fallen Bell', laws: ['heavy', 'gravity', 'sound'], budget: 4, par: 2, days: 2, start: 6, inst: ['crier'],
intro: 'The church bell fell out of the belfry and is far too heavy to haul back up. Hollis tries every afternoon (15:00-18:00). If heavy things weren\'t quite so heavy... But a bell that weighs nothing won\'t ring: make it heavy again by 18:00 tomorrow.',
tip: 'New law: Heaviness. Below about 35%, Hollis can lift the bell. Rumours about sound won\'t help here, unless you want everyone to stop listening to Hollis.',
props: [{ k: 'bell', id: 'bell', x: 1385 }],
goals: [{ t: 'flag', f: 'bellUp', latch: true, txt: 'Hollis hauls the bell back into the belfry' },

winTxt: 'BONG. The bell rings out, heavy and true, and every pigeon in the valley takes off at once.' });

GR.addLevel({ id: 'anvil', ch: 3, title: 'Anvil in the Well', laws: ['heavy', 'water', 'gravity'], budget: 3, par: 2, days: 2, start: 6, inst: ['crier'],

goals: [{ t: 'flag', f: 'anvilOut', latch: true, txt: 'Fish the anvil out of the well' },

winTxt: 'The anvil bobs up, Ivo hauls it out, and by evening it\'s as heavy as ever. Tobias is banned from the well.' });
GR.addLevel({ id: 'weighoff', ch: 3, title: 'The Great Weigh-Off', laws: ['heavy', 'gravity'], budget: 2, par: 1, days: 2, start: 6, inst: ['paper', 'crier'],
intro: 'At 16:00 tomorrow the Harvest Festival judges weigh the pumpkins. The rival from Upper Wobbling has stuffed his with iron. Make heavy things light enough that the iron counts for nothing, but keep gravity working, or the scales show zero for everyone. Then put weight back by 22:00.',
mech: 'The Pigeon Post prints the most widespread rumour in the village every morning at 7:00. Everyone at the Well or the Market reads it. Including the duds.',

goals: [{ t: 'lawAt', law: 'heavy', max: 0.6, at: [2, 16], latch: true, txt: 'At 16:00 tomorrow: heaviness below 60%', failTxt: 'The iron pumpkin wins the ribbon. Rosa is livid.' },
{ t: 'lawAt', law: 'gravity', min: 0.7, at: [2, 16], latch: true, txt: 'At 16:00 tomorrow: gravity above 70%', failTxt: 'The scales read nothing at all. The judges cancel the contest.' },

winTxt: 'Rosa\'s pumpkin wins by a mile. The iron one weighs about as much as a sigh. Weight returns by supper.' });

GR.addLevel({ id: 'avalanche', ch: 4, title: 'Avalanche!', laws: ['snow', 'gravity', 'friction'], budget: 4, par: 2, days: 2, start: 5,

GR.addLevel({ id: 'badger', ch: 4, title: 'The Badger\'s Shadow', laws: ['shadows', 'sound'], budget: 3, par: 2, days: 2, start: 6,
intro: 'At noon tomorrow Old Brock the badger comes out of his sett in the Meadow. If he sees his shadow, it\'s six more weeks of winter. Make sure his shadow has wandered off by then. And by 20:00 tomorrow, everyone\'s shadow should be back where it belongs: loose shadows frighten people.',
tip: 'New law: Shadows. Below 45% shadows wander off on their own. People who see that get spooked, and spooked people run home and stop gossiping.',
props: [{ k: 'crate', id: 'brock', x: 300, badger: true, anchor: { law: 'gravity', below: -1 } }],
goals: [{ t: 'lawAt', law: 'shadows', max: 0.45, at: [2, 12], latch: true, txt: 'At noon tomorrow: shadows below 45%', failTxt: 'Brock saw his shadow. Six more weeks of winter. Everyone sighs.' },
{ t: 'law', law: 'shadows', min: 0.7, after: 'g0', by: [2, 20], txt: 'Shadows following people again (above 70%) by 20:00' }],
winTxt: 'Brock blinks, sees no shadow, and declares spring. By evening every shadow has slunk home, a bit sheepish.' });

GR.addLevel({ id: 'zeno', ch: 5, title: 'Zeno Doubts Everything', laws: ['gravity', 'friction'], budget: 5, par: 3, days: 2, start: 6, zeno: { arrive: 8 },

winTxt: '"I have SEEN it," says Zeno, watching a crate drift past. "Gravity is merely a habit!" He is unbearable about it.' });

tip: 'Garblers: Pip, Tobias, Hazel, Dot. Zeno arrives tomorrow morning and will put a stop to rabbit talk.',
props: [],
goals: [{ t: 'holders', r: 'gr_d5', n: 6, latch: true, txt: 'Six people spreading "A rabbit stole gravity…"' }],
fail: [{ t: 'roofs', txt: 'Roofs are floating off. The rabbit has gone too far.' }],

GR.Solver = {};
GR.Solver.cast = lv => {
const c = GR.VILLAGERS.filter(d => !(lv.absent || []).includes(d.id)).map(d => d.id);
if (lv.zeno) c.push('zeno');
return c;
};
GR.Solver.ids = lv => { const ids = []; for (const l of lv.laws) ids.push(GR.RUM_ROOT[l].doubt, GR.RUM_ROOT[l].affirm); return ids; };
GR.Solver.who = (lv, r, rid, cast) => {
const doubt = GR.RUM[rid].dir < 0;
if (r.chance(0.75)) {
const pool = cast.filter(id => { const d = id === 'zeno' ? GR.VISITOR : GR.VILLAGERS.find(x => x.id === id); return doubt ? d.t.g * d.t.ch > 0.3 : d.t.sc + d.t.ch > 0.9 || d.t.ch > 0.75; });
if (pool.length) return r.pick(pool);
}
return r.pick(cast);
};
GR.Solver.randomPlan = (lv, r, k) => {
const plan = [], cast = GR.Solver.cast(lv), ids = GR.Solver.ids(lv);
const hours = Math.max(2, Math.floor((lv.days || 2) * 24 - 2));
for (let i = 0; i < k; i++) {
let t = r.int(hours) * GR.TPH + (r.chance(0.5) ? GR.TPH / 2 : 0);
if (i === 0 && r.chance(0.6)) t = r.int(Math.min(hours, 10)) * GR.TPH;
let rid = r.pick(ids);
if (lv.focus && r.chance(0.6)) rid = r.pick(lv.focus);
if (i === 0 && r.chance(0.6)) rid = GR.RUM_ROOT[r.pick(lv.laws)].doubt;
plan.push({ t, v: GR.Solver.who(lv, r, rid, cast), r: rid });
}
return plan.sort((a, b) => a.t - b.t);
};
GR.Solver.score = (lv, res) => {
if (res.won) return 1000 + res.stars * 10 - res.used;
const n = Object.keys(res.latch).length;
return n * 100 + Math.min(50, 50 * res.tick / (lv.days * GR.TPD));
};
GR.Solver.mutate = (lv, r, plan) => {
const p = plan.map(a => Object.assign({}, a)), cast = GR.Solver.cast(lv), ids = GR.Solver.ids(lv);
const m = r.int(5), i = r.int(p.length);
if (m === 0) p[i].t = Math.max(0, p[i].t + (r.int(7) - 3) * GR.TPH / 2);
else if (m === 1) p[i].v = GR.Solver.who(lv, r, p[i].r, cast);
else if (m === 2) p[i].r = r.pick(ids);
else if (m === 3 && p.length < (lv.budget || 4)) p.push(GR.Solver.randomPlan(lv, r, 1)[0]);
else if (m === 4 && p.length > 1) p.splice(i, 1);
return p.sort((a, b) => a.t - b.t);
};
GR.Solver.search = (lv, tries, seed, maxK) => {
const r = GR.rng(seed || 7), K = Math.min(maxK || lv.budget || 4, lv.budget || 4);
let best = null, bestS = -1, n = 0;
const evalP = plan => { const res = GR.Sim.run(lv, plan); n++; const s = GR.Solver.score(lv, res); if (s > bestS) { bestS = s; best = { plan, res }; } return s; };
const explore = Math.ceil(tries * 0.5);
for (let i = 0; i < explore && bestS < 1000; i++) evalP(GR.Solver.randomPlan(lv, r, 1 + r.int(K)));
while (n < tries && bestS < 1030) evalP(GR.Solver.mutate(lv, r, best.plan));
const out = { won: bestS >= 1000, tries: n, plan: best.plan, stars: best.res.stars, score: bestS, reason: best.res.reason, laws: best.res.laws };
return out;
};
GR.Solver.verify = lv => {
const sol = GR.SOLUTIONS && GR.SOLUTIONS[lv.id];

const res = GR.Sim.run(lv, sol);
delete res.S;
return res;
};

};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) GR.Rend.cam.x += e.deltaX / GR.Rend.cam.z; else GIn.zoomTo(GR.Rend.cam.z * (e.deltaY < 0 ? 1.1 : 0.9), e.offsetX); }, { passive: false });
addEventListener('keydown', GIn.key);
};
GIn.zoomTo = (z, sx) => {
const R = GR.Rend, wx = R.cam.x + sx / R.cam.z;
R.zoom = GR.clamp(z, Math.max(R.H / 600, R.W / GR.W), 2.4); R.cam.z = R.zoom;
R.cam.x = wx - sx / R.cam.z;
};
GIn.key = e => {
if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
if (e.key === 'Escape') { if (GR.Pages.isOpen()) GR.Pages.close(); else GR.Whisper.close(); return; }
if (GR.ui.screen !== 'game' || GR.Pages.isOpen()) return;
const G = GR.Game, R = GR.Rend, k = e.key.toLowerCase();
if (k === ' ') { e.preventDefault(); G.setSpeed(G.speed ? 0 : 1); }
else if (k === '1') G.setSpeed(1); else if (k === '2') G.setSpeed(3); else if (k === '3') G.setSpeed(8);
else if (k === 'arrowleft' || k === 'a') R.cam.x -= 80 / R.cam.z;
else if (k === 'arrowright' || k === 'd') R.cam.x += 80 / R.cam.z;
else if (k === '+' || k === '=') GIn.zoomTo(R.cam.z * 1.15, R.W / 2);
else if (k === '-') GIn.zoomTo(R.cam.z / 1.15, R.W / 2);
else if (k === 'tab') { e.preventDefault(); const S = G.S, n = S.V.length; let i = G.sel; for (let k2 = 0; k2 < n; k2++) { i = (i + (e.shiftKey ? n - 1 : 1)) % n; if (!S.V[i].away) break; } GR.Whisper.open(i); GIn.focus(S.V[i].x); }
else if (k === 'b') GR.Panel.show('board'); else if (k === 'g') GR.Panel.show('graph'); else if (k === 'l') GR.Panel.show('log');
else if (k === 'r') G.restart();
};
// ===== sandbox.js =====
GR.Sandbox = { season: 'spring' };
GR.Sandbox.level = season => ({
id: 'sandbox', ch: 1, n: 0, title: 'Sandbox', sandbox: true, laws: GR.LAWS.map(l => l.id), start: 6, days: 9999, season, night: true,
inst: ['pamphlet', 'paper', 'crier'], zeno: { arrive: 30 }, festival: { day: 3, from: 17, to: 21 }, goals: [], budget: null,
props: [
{ k: 'cat', id: 'cat', x: 1385, y: 218, anchor: { law: 'gravity', below: 0.72 } },
{ k: 'cart', id: 'cart', x: 70, anchor: { law: 'friction', below: 0.32 }, kick: [12, 0] },
{ k: 'bread', id: 'bread', n: 3, x: 1186, dx: 13, y: 426 },
{ k: 'crate', id: 'crate', n: 3, x: 900, dx: 40 },
{ k: 'boat', id: 'boat', x: 1580, y: 520 },
{ k: 'fish', id: 'fish', n: 3, x: 1556, dx: 18, y: 560 },
{ k: 'bell', id: 'bell', x: 1385 },
{ k: 'anvil', id: 'anvil', x: 790, y: 548 },
{ k: 'sheep', id: 'sheep', n: 4, x: 362, dx: 14 },
{ k: 'pot', id: 'pot', n: 4, x: 940, dx: 8, y: 440 },
{ k: 'boulder', id: 'boulder', x: 600 },
{ k: 'lantern', id: 'lantern', n: 3, x: 870, dx: 40, y: 455, anchor: { law: 'gravity', below: 0.5 } }
].concat(season === 'winter' ? [{ k: 'snowball', id: 'snow', n: 8, x: 20, dx: 9, y: 230, quiet: true }] : [])
});
GR.Sandbox.start = season => {
GR.Sandbox.season = season || GR.Sandbox.season;
GR.Game.start(GR.Sandbox.level(GR.Sandbox.season), { quiet: true });
GR.Sandbox.tools();
GR.toast('∞ Sandbox: whisper as much as you like. Zeno the philosopher arrives tomorrow.', 'good', 4000);
};
GR.Sandbox.tools = () => {
const card = GR.$('goalCard');
const add = () => {
if (!GR.Game.lv || !GR.Game.lv.sandbox || card.querySelector('.sbx')) return;
const d = GR.el('div', 'row sbx');
d.style.justifyContent = 'flex-start'; d.style.marginTop = '4px'; d.style.gap = '4px';
d.innerHTML = ['spring', 'summer', 'autumn', 'winter'].map(s => '<button class="chip" data-s="' + s + '">' + { spring: '🌸', summer: '☀️', autumn: '🍂', winter: '❄️' }[s] + '</button>').join('') +
'<button class="chip" data-d="1">📜 Decree normality</button>';
d.querySelectorAll('[data-s]').forEach(b => b.onclick = e => { e.stopPropagation(); GR.Sandbox.start(b.dataset.s); });
d.querySelector('[data-d]').onclick = e => { e.stopPropagation(); const S = GR.Game.S; S.inst.lastProcl = -1e9; GR.Evid.proclaim(S); };
card.appendChild(d);
};
clearInterval(GR.Sandbox._iv); GR.Sandbox._iv = setInterval(() => { if (GR.ui.screen === 'game' && GR.Game.lv && GR.Game.lv.sandbox) add(); else clearInterval(GR.Sandbox._iv); }, 250);
};
// ===== main.js =====
GR.T = { fast: false, noIntro: false, all: false };
GR.opts = { thoughts: true };
GR.ui.wire = () => {
GR.$('hPlay').onclick = () => { GR.A.click(); const nxt = GR.LEVELS.find(l => !GR.S.done[l.id]); if (!Object.keys(GR.S.done).length) GR.Game.start(GR.LEVELS[0]); else GR.Pages.levels(); void nxt; };
GR.$('hSand').onclick = () => { GR.A.click(); GR.Sandbox.start(); };
GR.$('hBook').onclick = () => { GR.A.click(); GR.Book.page(); };
GR.$('hSet').onclick = () => { GR.A.click(); GR.Settings.open(); };
GR.$('snd').onclick = () => { GR.A.init(); GR.S.opts.sound = !GR.S.opts.sound; GR.Settings.apply(); GR.Save.write(); };
GR.$('homeBtn').onclick = () => { GR.A.click(); GR.Pages.close(); GR.Whisper.close(); GR.ui.show('home'); GR.Home.refresh(); };
GR.$('modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') GR.Pages.close(); });
};
GR.boot = () => {
const q = location.search;
if (q.includes('reset')) GR.store.del('save');
GR.Save.load();
if (q.includes('test')) { GR.T.fast = true; GR.T.noIntro = true; }
if (q.includes('all')) GR.T.all = true;
GR.bus.on('discover', (id, S) => GR.Book.record(id, S));
GR.bus.on('roof', (p, S) => { if (!S.headless) GR.toast('🏠 A roof floats away!', 'bad'); });
const origLog = GR.Sim.log;
GR.Sim.log = (S, kind, txt, x) => { origLog(S, kind, txt, x); if (!S.headless && GR.S && (kind === 'mayor' || kind === 'pamphlet' || kind === 'crier' || kind === 'paper')) { GR.S.seen[kind] = 1; } };
GR.ui.wire(); GR.Hud.wire(); GR.Panel.wire(); GR.Input.wire();
GR.Settings.apply();
const gest = () => { GR.A.init(); GR.Settings.apply(); if (GR.ui.screen !== 'game') GR.M.play('home'); };
addEventListener('pointerdown', gest, { once: true }); addEventListener('keydown', gest, { once: true });
GR.Home.start();
GR.last = performance.now();
requestAnimationFrame(GR.loop);
window.GRAVITY = true;
};
GR.loop = () => {
requestAnimationFrame(GR.loop);
const now = performance.now(), dt = Math.min(0.1, (now - GR.last) / 1000); GR.last = now;
try {
if (GR.ui.screen === 'home') GR.Home.frame(dt);
else if (GR.ui.screen === 'game') GR.Game.frame(dt);
} catch (e) { GR.err(e); }
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', GR.boot); else GR.boot();
</script>
</body>
