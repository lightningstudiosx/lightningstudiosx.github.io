<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Bubble Gum Inventor · Kai.fun</title>
<meta name="description" content="Invent new bubble gum flavours by mixing 200+ real food chemicals. Every gum is named after exactly what is in it. Discover grape, cola, cut grass and old library book.">
<meta name="theme-color" content="#ff6fae">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff6fae;--pink2:#ff9cc8;--pinkD:#d63f86;--berry:#6a1f52;--ink:#4a2140;--ink2:#8a5a7c;--mint:#bff0de;--mint2:#7fdcc0;--mintD:#2fa88a;
--cream:#fff6e6;--cream2:#ffeccc;--butter:#ffd97a;--sky:#9ad8ff;--card:#fffaf1;--sh:0 3px 0 rgba(106,31,82,.18),0 10px 26px rgba(60,10,50,.18);
--f:"Nunito","Trebuchet MS",system-ui,sans-serif;--fc:"Chewy","Comic Sans MS","Trebuchet MS",cursive}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#ffd6e9}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font-family:inherit;color:inherit}
.hide{display:none!important}
#kai{position:fixed;left:10px;top:10px;z-index:45;font-weight:800;font-size:14px;color:var(--berry);text-decoration:none;background:var(--card);padding:8px 12px 8px 10px;border-radius:999px;box-shadow:var(--sh);line-height:1}
#kai:hover{background:#fff}
.screen{position:fixed;inset:0}
/* candy buttons */
.cbtn{font-family:var(--fc);font-size:20px;letter-spacing:.5px;padding:10px 18px;border-radius:16px;background:#fff;color:var(--berry);box-shadow:0 4px 0 rgba(106,31,82,.35),0 8px 18px rgba(60,10,50,.18);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(106,31,82,.35),0 4px 10px rgba(60,10,50,.18)}
.cbtn.big{font-size:26px;padding:12px 26px;border-radius:20px}
.cbtn.pink{background:linear-gradient(#ff8cc0,#ff5ea4);color:#fff;text-shadow:0 2px 0 rgba(150,20,80,.45)}
.cbtn.mint{background:linear-gradient(#a8f0d8,#5fd3b0);color:#0f5b4a}
.cbtn.butter{background:linear-gradient(#ffe7a3,#ffc94d);color:#6b4300}
.cbtn.sky{background:linear-gradient(#c4ebff,#7cc8f5);color:#0c4a72}
.cbtn.ghost{background:rgba(255,255,255,.82);font-size:16px;padding:8px 12px}
.cbtn.small{font-size:16px;padding:7px 12px;border-radius:12px}
.cbtn[disabled]{opacity:.45;pointer-events:none}
.cbtn.wrap{white-space:normal;line-height:1.15}
.cbtn.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
/* title */
#title{background:#ffb3d4;z-index:40}
#tcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#tBtns{position:absolute;left:50%;bottom:7vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;width:min(92vw,520px)}
.tRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#tStats{font-weight:800;color:var(--berry);background:rgba(255,255,255,.7);padding:6px 14px;border-radius:999px;font-size:14px;text-align:center}
/* lab layout */
#lab{display:flex;flex-direction:column;background:var(--mint)}
#top{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 118px;background:linear-gradient(#ff86bb,#ff6fae);box-shadow:0 3px 0 var(--pinkD);z-index:5;min-height:54px}
#logo{font-family:var(--fc);font-size:26px;color:#fff;text-shadow:0 2px 0 var(--pinkD),0 0 10px rgba(255,255,255,.4);white-space:nowrap}
#logo b{font-weight:400;color:var(--butter)}
#stats{display:flex;gap:8px;margin-left:auto}
.pill{background:#fff;border-radius:999px;padding:5px 12px;font-weight:900;font-size:15px;box-shadow:0 2px 0 rgba(106,31,82,.25);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill i{font-style:normal;color:var(--ink2);font-size:12px}
.pill em{display:block;width:44px;height:7px;border-radius:9px;background:#f4d6e6;overflow:hidden}
.pill em u{display:block;height:100%;width:0;background:var(--pink);border-radius:9px;transition:width .4s}
#nav{display:flex;gap:6px}
.nb{position:relative;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 10px;font-weight:900;font-size:14px;box-shadow:0 3px 0 rgba(106,31,82,.3)}
.nb span{font-size:18px}.nb i{font-style:normal}
.nb:active{transform:translateY(2px)}
.nb sup{position:absolute;top:-6px;right:-6px;background:var(--butter);color:#6b4300;border-radius:999px;font-size:12px;padding:1px 6px;font-weight:900;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.nb sup:empty{display:none}
#bench{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,30vw) minmax(0,1fr);grid-template-rows:1fr auto;gap:0}
#shelf{grid-row:1/3;display:flex;flex-direction:column;min-height:0;background:linear-gradient(90deg,#8b5a3c,#a86f4b 8%,#9a6343);border-right:4px solid #6e4129;position:relative}
#shelfHead{padding:8px 8px 6px;background:#6e4129;box-shadow:0 3px 0 rgba(0,0,0,.2);z-index:2}
#cats{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cat{flex:0 0 auto;background:#fff6e6;border-radius:10px;padding:4px 8px;font-weight:900;font-size:13px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25);opacity:.8}
.cat.on{background:var(--butter);opacity:1;transform:translateY(-1px)}
#shelfTools{display:flex;gap:6px;align-items:center}
#search{flex:1;min-width:0;border:0;border-radius:10px;padding:7px 10px;font-weight:800;font-size:14px;background:#fff6e6;outline:none}
.seg{display:flex;background:#4f2c1a;border-radius:11px;padding:2px;gap:2px}
.seg button{font-weight:900;font-size:13px;padding:5px 8px;border-radius:9px;color:#ffe3c4}
.seg button.on{background:var(--pink);color:#fff;box-shadow:0 2px 0 var(--pinkD)}
#jars{flex:1;overflow-y:auto;padding:8px 6px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:2px 4px;align-content:start;touch-action:pan-y;
background:repeating-linear-gradient(180deg,transparent 0 118px,#6e4129 118px 128px,#5a3420 128px 130px)}
.jar{position:relative;display:flex;flex-direction:column;align-items:center;height:128px;padding-top:4px;cursor:grab;touch-action:pan-y}
.jar img{width:58px;height:70px;pointer-events:none;transition:transform .15s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.jar:hover img{transform:translateY(-4px) rotate(-3deg)}
.jar b{font-size:10.5px;line-height:1.05;text-align:center;color:#fff8ec;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.5);max-height:34px;overflow:hidden;padding:2px 1px 0;word-break:break-word}
.jar.in::after{content:attr(data-n);position:absolute;top:2px;right:6px;background:var(--pink);color:#fff;font-weight:900;font-size:11px;border-radius:99px;padding:0 5px;box-shadow:0 1px 0 var(--pinkD)}
.jar.base b{color:#bff0de}
.jar.locked{cursor:pointer}.jar.locked img{filter:grayscale(1) brightness(.55) drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.jar.locked b{color:#d9b9a2}
.jar.locked::before{content:"🔒 " attr(data-cost);position:absolute;top:30px;left:50%;transform:translateX(-50%);background:rgba(40,20,10,.85);color:#ffd97a;font-weight:900;font-size:11px;border-radius:8px;padding:2px 6px;white-space:nowrap;z-index:1}
.jarCatHead{grid-column:1/-1;font-family:var(--fc);color:var(--butter);font-size:18px;padding:4px 4px 0;text-shadow:0 2px 0 rgba(0,0,0,.35);height:34px}
#stageWrap{position:relative;min-height:0;overflow:hidden;background:#cfeee3}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#stageBtns{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:10px;pointer-events:none;flex-wrap:wrap;padding:0 8px}
#stageBtns .cbtn{pointer-events:auto}
#dropHint{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--fc);font-size:22px;color:#fff;background:var(--pink);padding:6px 16px;border-radius:999px;box-shadow:var(--sh);opacity:0;transition:opacity .2s;pointer-events:none}
#stageWrap.dragging #dropHint{opacity:1}
#orderChip{position:absolute;left:10px;top:10px;max-width:min(330px,60%);background:#fffaf1;border-radius:14px;padding:7px 10px;font-weight:800;font-size:13px;box-shadow:var(--sh);display:flex;gap:8px;align-items:center;cursor:pointer}
#orderChip .face{font-size:26px}
#shiftBar{position:absolute;right:10px;top:10px;background:#2b1630;color:#fff;border-radius:14px;padding:6px 12px;font-weight:900;font-size:14px;box-shadow:var(--sh)}
#tape{grid-column:2;background:#fffaf1;border-top:4px solid var(--pink);padding:6px 10px 8px;min-width:0}
#tapeHead{font-size:12px;font-weight:900;color:var(--ink2);display:flex;gap:8px}
#tapeHead span{margin-left:auto}
#tapeView{overflow:hidden;white-space:nowrap;height:30px;position:relative;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
#tapeText{display:inline-block;font-family:var(--fc);font-size:22px;color:var(--berry);padding-left:100%;animation:tape linear infinite;will-change:transform}
#tapeText .new{color:#fff;background:var(--pink);border-radius:8px;padding:0 4px}
#tapeText .bump{color:var(--pinkD);text-decoration:underline wavy}
@keyframes tape{to{transform:translateX(-100%)}}
#liveProf{display:flex;gap:6px;align-items:flex-end;margin-top:4px;flex-wrap:wrap}
.lp{display:flex;flex-direction:column;align-items:center;width:44px}
.lp i{display:block;width:16px;height:30px;border-radius:5px;background:#f3e3ec;position:relative;overflow:hidden}
.lp i u{position:absolute;left:0;right:0;bottom:0;border-radius:5px;transition:height .35s}
.lp b{font-size:10px;font-weight:900;color:var(--ink2)}
.lpx{display:flex;align-items:center;gap:6px;font-weight:900;font-size:12px;margin-left:auto;color:var(--ink2)}
.swatch{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
/* modals */
#modal{position:fixed;inset:0;z-index:50;background:rgba(74,20,60,.45);display:flex;align-items:center;justify-content:center;padding:14px;animation:fadeIn .2s}
#modalCard{position:relative;background:var(--card);border-radius:24px;box-shadow:0 6px 0 rgba(106,31,82,.35),0 20px 60px rgba(40,0,30,.4);width:min(860px,100%);max-height:100%;overflow:hidden;display:flex;flex-direction:column;animation:popIn .28s cubic-bezier(.2,1.4,.4,1)}
#modalCard.narrow{width:min(520px,100%)}
@keyframes popIn{from{transform:scale(.85);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
.mHead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(#ff8cc0,#ff6fae);color:#fff}
.mHead h2{font-family:var(--fc);font-weight:400;font-size:28px;text-shadow:0 2px 0 var(--pinkD);flex:1}
.mHead .x{font-size:22px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--pinkD);font-weight:900;box-shadow:0 2px 0 rgba(106,31,82,.3)}
.mBody{padding:14px 16px 18px;overflow-y:auto;min-height:0}
.tabs{display:flex;gap:6px;padding:8px 16px 0;background:#ffe3ef;flex-wrap:wrap}
.tab{font-weight:900;font-size:14px;padding:8px 14px;border-radius:12px 12px 0 0;background:#ffd0e4;color:var(--ink2)}
.tab.on{background:var(--card);color:var(--berry)}
h3{font-family:var(--fc);font-weight:400;font-size:21px;color:var(--berry);margin:10px 0 6px}
p.sm{font-size:13px;color:var(--ink2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
/* chem card popover */
#chemCard{position:fixed;z-index:45;width:min(340px,94vw);background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px 14px 14px;animation:popIn .2s cubic-bezier(.2,1.4,.4,1)}
#chemCard .cc1{display:flex;gap:10px;align-items:center}
#chemCard img{width:54px;height:64px}
#chemCard h4{font-family:var(--fc);font-weight:400;font-size:22px;line-height:1.05;color:var(--berry)}
#chemCard .ccat{font-size:12px;font-weight:900;color:var(--ink2)}
#chemCard .smell{margin:8px 0 4px;font-weight:900;font-size:14px}
#chemCard .fact{font-size:13.5px;font-weight:700;line-height:1.35;color:#5e3a55}
#chemCard .notes{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.note{font-size:11px;font-weight:900;border-radius:99px;padding:2px 8px;color:#fff}
#chemCard .adds{display:flex;gap:6px;margin-top:8px}
#chemCard .adds .cbtn{flex:1;font-size:16px;padding:8px 4px}
#chemCard .ccx{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#ffe3ef;font-weight:900;color:var(--pinkD)}
#chemCard .inNow{font-size:12px;font-weight:900;color:var(--pinkD);margin-top:6px}
/* toasts */
#toasts{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(94vw,480px)}
.toast{background:#2b1630;color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:14px;box-shadow:var(--sh);animation:toastIn .3s cubic-bezier(.2,1.4,.4,1);text-align:center}
.toast.gold{background:linear-gradient(#ffe08a,#ffc23d);color:#5b3600}
.toast.pink{background:linear-gradient(#ff8cc0,#ff5ea4)}
.toast.out{opacity:0;transform:translateY(-10px);transition:all .3s}
@keyframes toastIn{from{transform:translateY(-14px) scale(.9);opacity:0}}
#flyLayer{position:fixed;inset:0;pointer-events:none;z-index:48}
#flyLayer img{position:fixed;width:58px;height:70px;left:0;top:0;will-change:transform;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
/* result card */
.res{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.res canvas{width:100%;border-radius:16px;background:#ffeef6;display:block}
.bigName{position:relative;height:190px;overflow:hidden;background:#fff;border:3px dashed var(--pink2);border-radius:16px;padding:0 12px}
.bigName div{font-family:var(--fc);font-size:24px;line-height:1.18;color:var(--berry);padding:10px 0}
.bigName div.scroll{animation:scrollUp linear infinite alternate}
.bigName:hover div{animation-play-state:paused}
@keyframes scrollUp{0%,6%{transform:translateY(0)}94%,100%{transform:translateY(var(--sh,-100px))}}
.stamp{display:inline-block;font-family:var(--fc);font-size:26px;color:#d81b60;border:4px solid #d81b60;border-radius:10px;padding:2px 12px;transform:rotate(-6deg);margin:6px 0;background:rgba(255,255,255,.6);animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both}
.stamp.weird{color:#5d3fd3;border-color:#5d3fd3;transform:rotate(4deg);font-size:21px}
.stamp.legend{color:#b8860b;border-color:#b8860b;background:#fff7d6}
.stamp .nw{font-size:14px;vertical-align:top;background:#ffd97a;color:#6b4300;border-radius:6px;padding:0 4px;margin-left:4px}
@keyframes stamp{from{transform:scale(3) rotate(-20deg);opacity:0}}
.stars{font-size:28px;letter-spacing:2px;color:#ffb400;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.quote{font-weight:800;font-size:15px;background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.quote small{display:block;font-size:11px;color:var(--ink2);font-weight:900}
.ai{background:#eef5ff;border:2px solid #9ec5ff}
b.tag{font-size:10px;background:#3d7bff;color:#fff;border-radius:6px;padding:1px 5px;margin-right:4px;vertical-align:middle}
.profBars{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 10px;margin:6px 0}
.pb{font-size:11px;font-weight:900;color:var(--ink2)}
.pb i{display:block;height:8px;border-radius:9px;background:#f3e3ec;overflow:hidden;margin-top:2px}.pb i u{display:block;height:100%;border-radius:9px}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.fact1{background:#fff;border-radius:12px;padding:5px 10px;font-weight:900;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.rowBtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* book / shop cards */
.fcard{background:#fff;border-radius:16px;padding:10px;box-shadow:0 3px 0 rgba(106,31,82,.12);text-align:center;position:relative;min-height:118px}
.fcard .em{font-size:34px;line-height:1.1}
.fcard b{display:block;font-family:var(--fc);font-weight:400;font-size:18px;color:var(--berry)}
.fcard p{font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.25;margin-top:3px}
.fcard.lock{background:#f4e6ee}.fcard.lock .em{filter:grayscale(1) brightness(.2);opacity:.35}
.fcard .chemName{font-size:10px;max-height:44px;overflow:hidden;color:#7a5a70;margin-top:4px}
.fcard .cbtn{margin-top:6px}
.inv{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 rgba(106,31,82,.12);margin-bottom:10px;display:flex;gap:10px;align-items:center}
.inv canvas{width:96px;height:54px;flex:0 0 auto}
.inv .nm{font-size:12px;font-weight:800;color:var(--berry);max-height:48px;overflow:hidden;flex:1}
.inv .bt{display:flex;flex-direction:column;gap:4px}
.ord{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 rgba(106,31,82,.12);margin-bottom:10px;display:flex;gap:12px;align-items:center}
.ord .face{font-size:40px}
.ord .wd{flex:1}.ord .wd b{font-family:var(--fc);font-weight:400;font-size:19px;color:var(--berry)}
.ord .wd p{font-weight:800;font-size:14px}
.ord .rw{font-weight:900;color:#a46b00;font-size:13px}
.ord .pat{height:6px;border-radius:9px;background:#f3e3ec;margin-top:5px;overflow:hidden}.ord .pat u{display:block;height:100%;background:#ff9a3d}
.ord.daily{background:linear-gradient(#fff7d6,#fff)}
.ord.active{outline:3px solid var(--pink)}
.field{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-weight:900;font-size:13px;color:var(--ink2)}
.field input,.field textarea{border:2px solid #f3c7dc;border-radius:12px;padding:8px 10px;font-weight:800;font-size:15px;background:#fff;outline:none;user-select:text;-webkit-user-select:text}
.field textarea{min-height:70px;resize:vertical;font-family:monospace;font-size:13px}
.swRow{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:10px;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.sw.on{outline:3px solid var(--berry)}
.pt{padding:6px 10px;border-radius:10px;background:#fff;font-weight:900;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.pt.on{background:var(--pink);color:#fff}.pt.lk{opacity:.5}
.prog{height:14px;border-radius:9px;background:#f3e3ec;overflow:hidden;margin:8px 0}.prog u{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cc8f5,#3d7bff);transition:width .2s}
/* AI nose gadget */
#aiNose{position:absolute;right:10px;bottom:76px;max-width:min(300px,70%);background:#eef5ff;border:2px solid #9ec5ff;border-radius:14px;padding:6px 10px 6px 34px;font-weight:800;font-size:13px;box-shadow:var(--sh);min-height:34px}
#aiNose i{position:absolute;left:8px;top:6px;font-style:normal;font-size:18px}
#aiNose i::before{content:"👃"}
#aiNose.think i{animation:sniff .5s ease-in-out infinite}
@keyframes sniff{50%{transform:scale(1.25) translateY(-2px)}}
/* phone / narrow */
@media (max-width:760px),(max-aspect-ratio:1/1){
  #top{padding:6px 6px 6px 104px;gap:6px;min-height:46px;flex-wrap:wrap}
  #logo{display:none}
  #stats{margin-left:0}
  .pill{font-size:13px;padding:4px 8px}.pill em{width:28px}
  #nav{margin-left:auto}
  .nb i{display:none}.nb{padding:6px 8px}
  #bench{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto 262px}
  #shelf{grid-row:3;border-right:0;border-top:4px solid #6e4129}
  #stageWrap{grid-row:1}
  #tape{grid-column:1;grid-row:2;padding:4px 8px 6px}

<script>
"use strict";

// util.js - tiny helpers shared by every module: DOM, maths, seeded random, safe storage, modal + toasts

// colour helpers
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

const store = {

// ===== audio.js =====

const SFX = (() => {

    const t = ac.currentTime + (when || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = fType || 'bandpass'; f.frequency.setValueAtTime(f0 || 1000, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 1;

    tap() { tone('sine', 660, 880, 0.06, 0.12); },

    plop() { tone('sine', 180, 520, 0.09, 0.35); tone('sine', 900, 300, 0.12, 0.08, 0.04); noise(0.15, 0.08, 'lowpass', 1600, 300); },
    blip() { tone('sine', 400 + Math.random() * 500, 900 + Math.random() * 600, 0.05, 0.05); },
    stir() { noise(0.22, 0.12, 'bandpass', 380, 900, 0, 3); tone('sine', 120, 90, 0.2, 0.06); },

    chop() { noise(0.06, 0.3, 'highpass', 3000); tone('triangle', 300, 120, 0.08, 0.15); },

// load a recipe into the kettle (only chemicals you own, unless it came from a friend's code)

// share.js - turn a gum into a short code (recipe + wrapper) and back, so friends can taste each other's inventions
function b64urlEncode(str) { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); }); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlDecode(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s), bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function encodeGum(rec) {
  const w = rec.w || SAVE.wrap;
  return 'GUM1-' + b64urlEncode(JSON.stringify([rec.r[0], rec.r[1], [w.paper, w.ink, w.pat, w.brand, w.emo], rec.stamp || '']));
}
// returns {r: recipe, w: wrapper} or null. Unknown chemicals are skipped; amounts are clamped.
function decodeGum(code) {
  try {
    code = String(code || '').trim().replace(/\s+/g, ''); if (!code.startsWith('GUM1-')) return null;
    const d = JSON.parse(b64urlDecode(code.slice(5))); if (!Array.isArray(d) || !Array.isArray(d[1])) return null;
    const base = BASE[d[0]] ? d[0] : 'classic', list = [];
    for (const x of d[1].slice(0, 300)) if (Array.isArray(x) && CHEM[x[0]] && +x[1] > 0) list.push([x[0], clamp(Math.round(+x[1]), 1, 99)]);
    const ww = Array.isArray(d[2]) ? d[2] : [], okCol = (c, f) => /^#[0-9a-f]{6}$/i.test(c || '') ? c : f;
    const w = { paper: okCol(ww[0], '#ff7eb6'), ink: okCol(ww[1], '#ffffff'), pat: PATTERNS.some((p) => p[0] === ww[2]) ? ww[2] : 'stripes',
      brand: String(ww[3] || 'GUM').slice(0, 14), emo: EMOS.includes(ww[4]) ? ww[4] : '🫧' };
    return { r: [base, list], w, stamp: nmClean(d[3]) };
  } catch (e) { return null; }
}
function openShare(rec) {
  const code = encodeGum(rec), b = el('div');
  b.innerHTML = '<p style="font-weight:800">Send this code to a friend. They paste it into <b>Menu → Taste a friend\'s gum</b> to load your exact recipe (and wrapper).</p>' +
    '<label class="field">Gum code<textarea id="shCode" readonly>' + esc(code) + '</textarea></label><div class="rowBtns"><button class="cbtn pink" id="shCopy">Copy code</button><button class="cbtn" id="shOk">Done</button></div>' +
    '<p class="sm"><b>\u201c' + esc(rec.stamp || '') + '\u201d</b> - full name: ' + esc(rec.name) + '</p>';
  const prevClose = _modalClose; const c = openModal('Share your gum', b, { narrow: true, onClose: prevClose });
  $('#shCopy', c).onclick = () => {
    const ta = $('#shCode', c); ta.select();
    const done = () => { toast('📋 Code copied!', 'pink'); SFX.play('coin'); };
    try { if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, () => { document.execCommand('copy'); done(); }); else { document.execCommand('copy'); done(); } } catch (e) { toast('Select the code and copy it by hand'); }
  };
  $('#shOk', c).onclick = closeModal;
}
function openImport() {
  const b = el('div');
  b.innerHTML = '<p style="font-weight:800">Paste a friend\'s gum code (it starts with <b>GUM1-</b>). Their recipe goes straight into your kettle - even jars you haven\'t unlocked, just this once.</p>' +
    '<label class="field">Gum code<textarea id="imCode" placeholder="GUM1-..."></textarea></label><div class="rowBtns"><button class="cbtn pink" id="imGo">Load it into the kettle</button></div><p class="sm" id="imMsg"></p>';

// ===== ai.js =====
// ai.js - OPTIONAL in-browser AI "nose": a tiny open language model (SmolLM2, Apache-2.0) run by transformers.js inside a
// Web Worker on the player's own device (WebGPU if available, else WebAssembly). No keys, no server - the only network
// traffic is the one-time download of the library + model from public CDNs, cached by the browser for next time.
// If it's off, unsupported, slow or broken, the built-in guesser (localGuess in quotes.js) is used instead.
const AI_LIB = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
const AI_MODELS = {
  tiny: { id: 'HuggingFaceTB/SmolLM2-135M-Instruct', name: 'Tiny nose (SmolLM2 135M)', mb: { webgpu: 143, wasm: 162 } },
  big: { id: 'HuggingFaceTB/SmolLM2-360M-Instruct', name: 'Big nose (SmolLM2 360M, smarter)', mb: { webgpu: 298, wasm: 390 } }
};
const AI_DTYPE = { webgpu: 'q4f16', wasm: 'q8' }, AI_FILE = { webgpu: 'model_q4f16.onnx', wasm: 'model_quantized.onnx' };
const AI = { state: 'off', backend: null, worker: null, loaded: 0, total: 0, err: '', jobs: {}, seq: 0, onChange: null };
const AI_WORKER_SRC = `
import { pipeline, env } from '${AI_LIB}';
env.allowLocalModels = false;
let gen = null;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === 'load') {
    try {
      const files = {};
      gen = await pipeline('text-generation', m.model, { device: m.device, dtype: m.dtype, progress_callback: (p) => {
        if (p.status === 'progress' && p.total) { files[p.file] = [p.loaded, p.total]; let l = 0, t = 0; for (const k in files) { l += files[k][0]; t += files[k][1]; }
          self.postMessage({ type: 'progress', loaded: l, total: t }); } } });
      self.postMessage({ type: 'ready' });
    } catch (err) { self.postMessage({ type: 'error', error: String((err && err.message) || err) }); }
  } else if (m.type === 'gen') {
    try {
      const out = await gen(m.messages, { max_new_tokens: m.max || 32, do_sample: true, temperature: m.temp || 0.6, top_p: 0.9, repetition_penalty: 1.15 });
      const g = out[0].generated_text, text = Array.isArray(g) ? g[g.length - 1].content : String(g);
      self.postMessage({ type: 'out', id: m.id, text });
    } catch (err) { self.postMessage({ type: 'out', id: m.id, error: String((err && err.message) || err) }); }
  }
};`;
function aiSupported() { return typeof Worker !== 'undefined' && typeof WebAssembly !== 'undefined' && typeof Blob !== 'undefined' && typeof TextEncoder !== 'undefined'; }
async function aiBackend() {
  try { if (navigator.gpu) { const ad = await navigator.gpu.requestAdapter(); if (ad) return 'webgpu'; } } catch (e) { /* no webgpu */ }
  return 'wasm';
}
function aiSet(state, err) { AI.state = state; if (err != null) AI.err = err; if (AI.onChange) try { AI.onChange(); } catch (e) { /* panel closed */ } }
async function aiStart(force) {
  if (!aiSupported()) { aiSet('unsupported'); return; }
  if (AI.worker) return;
  AI.backend = AI.backend || await aiBackend();
  const model = AI_MODELS[SAVE.set.aiModel] || AI_MODELS.tiny;
  if (!force && !(await aiCached())) { aiSet('off'); return; }        // never download without the player asking
  let w;
  try { w = new Worker(URL.createObjectURL(new Blob([AI_WORKER_SRC], { type: 'text/javascript' })), { type: 'module' }); }
  catch (e) { aiSet('error', 'Your browser can\'t run the AI worker.'); return; }
  AI.worker = w; AI.loaded = 0; AI.total = 0; aiSet('loading', '');
  w.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'progress') { AI.loaded = m.loaded; AI.total = m.total; aiSet('loading'); }
    else if (m.type === 'ready') { aiSet('ready'); SAVE.set.ai = true; saveSoon(); toast('👃 AI nose ready - it runs on your device', 'pink'); }
    else if (m.type === 'error') { aiStop(); aiSet('error', m.error); }
    else if (m.type === 'out') { const j = AI.jobs[m.id]; delete AI.jobs[m.id]; if (AI.state === 'busy') aiSet('ready'); if (j) j(m.error ? null : m.text); }
  };
  w.onerror = (e) => { aiStop(); aiSet('error', (e && e.message) || 'The AI worker crashed.'); };
  w.postMessage({ type: 'load', model: model.id, device: AI.backend, dtype: AI_DTYPE[AI.backend] });
}
function aiStop() { if (AI.worker) { try { AI.worker.terminate(); } catch (e) { /* ignore */ } } AI.worker = null; for (const k in AI.jobs) { AI.jobs[k](null); delete AI.jobs[k]; } aiSet('off'); }
async function aiCached() {
  try {
    const be = AI.backend || await aiBackend(), m = AI_MODELS[SAVE.set.aiModel] || AI_MODELS.tiny;
    const c = await caches.open('transformers-cache');
    return !!(await c.match('https://huggingface.co/' + m.id + '/resolve/main/onnx/' + AI_FILE[be]));
  } catch (e) { return false; }
}
// keep the prompt tight: only what the player added (the base is always "gum base"), the top taste notes, the lab's best match
function aiMessages(a) {
  const added = a.gum.items.filter((i) => i.you > 0).slice(0, 12).map((i) => CHEM[i.id].name + ' (' + CHEM[i.id].smell + ')');
  const notes = topNotes(a.p, 3).map(([k]) => NOTE_NAMES[k]).join(', ') || 'mild';
  const near = a.disc.real ? a.disc.real.name : (closestFlavours(a.gum, 1)[0] || {}).f;
  const hint = a.disc.real ? a.disc.real.name : near && near.name ? near.name + '-ish' : 'mystery';
  // few-shot examples keep tiny models on task: one funny "Tastes like ..." sentence and nothing else
  return [
    { role: 'system', content: 'You invent funny one-sentence flavour descriptions for a bubble gum game for kids. Always answer with ONE short sentence that starts with "Tastes like".' },
    { role: 'user', content: 'Gum with: isoamyl acetate (banana), citric acid (zingy sour). Taste: fruity, sour. Colour: yellow. Closest: Banana.' },
    { role: 'assistant', content: 'Tastes like a banana that went to a lemon party.' },
    { role: 'user', content: 'Gum with: menthol (peppermint), capsaicin (chilli heat). Taste: minty, spicy. Colour: white. Closest: Peppermint-ish.' },
    { role: 'assistant', content: 'Tastes like a candy cane that learned to breathe fire.' },
    { role: 'user', content: 'Gum with: ' + (added.join(', ') || 'nothing extra') + '. Taste: ' + notes + '. Colour: ' + a.colName + '. Closest: ' + hint + '.' }
  ];
}
const AI_BAD = /\b(fuck|shit|bitch|cunt|dick|piss|bastard|damn|hell|sex|kill|die|dead|drug|beer|wine|vodka|alcohol|blood|stupid|idiot|hate|ugly)\w*/i;
function aiFilter(t, a) {
  if (!t) return null;
  t = String(t).replace(/<[^>]*>/g, ' ').replace(/[*_`#"“”]/g, '').replace(/\s+/g, ' ').trim();
  // keep ONE on-topic sentence: from "tastes/smells like" if present, else the first sentence that talks about flavour
  const lo = t.toLowerCase(), at = Math.max(lo.indexOf('tastes like'), lo.indexOf('smells like'));
  const keys = [' like a', ' like an', ' like the', 'taste', 'flavo', 'smell', 'sweet', 'sour', 'mint', 'fruit'].concat(a ? closestFlavours(a.gum, 2).map((x) => x.f.name.toLowerCase().split(' ')[0]).concat(a.disc.real ? [a.disc.real.name.toLowerCase()] : []) : []);
  const sents = (at >= 0 ? t.slice(at) : t).split(/(?<=[.!?])\s/).map((x) => x.trim());
  t = sents.find((x) => x.split(' ').length >= 4 && keys.some((k) => x.toLowerCase().includes(k))) || '';
  if (!t) return null;                                                   // off-task rambling -> built-in guess instead
  let w = t.split(' ').filter(Boolean); if (w.length < 3) return null;
  if (w.length > 25) w = w.slice(0, 25);
  t = w.join(' ').replace(/[^\p{L}\p{N}\p{P}\p{Zs}]/gu, '').slice(0, 170).trim();
  if (AI_BAD.test(t) || !/[a-z]/i.test(t)) return null;
  if (!/[.!?]$/.test(t)) t += '.';
  return capFirst(t);
}
// returns a Promise of the AI's sentence, or null (caller then keeps the built-in guess). Never throws, never blocks.
function aiGuessFor(a) {
  if (AI.state !== 'ready' || !AI.worker) return Promise.resolve(null);
  const id = ++AI.seq; aiSet('busy'); showNose(LAB.localGuess || '', false, true);
  return new Promise((res) => {
    const to = setTimeout(() => { if (AI.jobs[id]) { delete AI.jobs[id]; if (AI.state === 'busy') aiSet('ready'); res(null); } }, 30000);
    AI.jobs[id] = (txt) => { clearTimeout(to); res(aiFilter(txt, a)); };
    AI.worker.postMessage({ type: 'gen', id, messages: aiMessages(a) });
  });
}
// ---- AI stamp names: 1-3 words, very few tokens, sanitised; one retry, then the caller keeps the built-in name ----
function aiNameMessages(a) {
  const added = a.gum.items.filter((i) => i.you > 0).slice(0, 10).map((i) => CHEM[i.id].smell.split('/')[0].trim()).filter((x) => !/^nothing/.test(x));
  const notes = topNotes(a.p, 3).map(([k]) => NOTE_NAMES[k]).join(', ') || 'mild';
  return [
    { role: 'system', content: 'You invent catchy names for new bubble gum flavours. Reply with the name only: one to three words, no quotes.' },
    { role: 'user', content: 'Smells: marshmallow, vanilla, smoke. Taste: sweet, creamy. Colour: brown.' }, { role: 'assistant', content: 'Burnt Marshmallow' },
    { role: 'user', content: 'Smells: grape candy, chilli heat. Taste: fruity, spicy. Colour: purple.' }, { role: 'assistant', content: 'Purple Thunder' },
    { role: 'user', content: 'Smells: lemon, bitter. Taste: sour, bitter. Colour: yellow.' }, { role: 'assistant', content: 'Sad Lemon' },
    { role: 'user', content: 'Smells: ' + (added.join(', ') || 'plain gum') + '. Taste: ' + notes + '. Colour: ' + a.colName + '.' + (a.disc.real ? ' It tastes like ' + a.disc.real.name + '.' : '') }
  ];
}
function aiRaw(messages, max, temp) {
  return new Promise((res) => {
    if (!AI.worker || (AI.state !== 'ready' && AI.state !== 'busy')) { res(null); return; }
    const id = ++AI.seq, to = setTimeout(() => { if (AI.jobs[id]) { delete AI.jobs[id]; res(null); } }, 20000);
    AI.jobs[id] = (txt) => { clearTimeout(to); res(txt); };
    AI.worker.postMessage({ type: 'gen', id, messages, max, temp });
  });
}
async function aiNameFor(a, taken) {
  if (AI.state !== 'ready' && AI.state !== 'busy') return null;
  for (let tryN = 0; tryN < 2; tryN++) {
    const n = aiNameFilter(await aiRaw(aiNameMessages(a), 8, tryN ? 0.9 : 0.7), a);
    if (n && !(taken || []).includes(n)) return n;
  }
  return null;
}

    state: () => ({ stage: LAB.stage, name: gumName(LAB.gum), an: LAB.an && { stars: LAB.an.stars, real: LAB.an.disc.real && LAB.an.disc.real.id, weird: LAB.an.disc.weird && LAB.an.disc.weird.id, col: LAB.an.colName, bubble: LAB.an.bubble } })
  };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
