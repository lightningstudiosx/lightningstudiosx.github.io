<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather Channel</title>
<meta name="description" content="Be the TV weather forecaster. Read the satellite, radar and pressure charts, call tomorrow's weather for every town, then go live on air. Climb from small-town local news to prime time, and call the hurricane.">
<meta name="theme-color" content="#06225a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&family=VT323&display=swap">
<style>
/* Weather Channel: "Doppler-Vision '94". Local-TV weather: royal blue gradients, emerald maps, chunky yellow
   chyrons with black outlines, CRT scanlines, smooth jazz. */
:root {
  --navy: #06225a; --royal: #0f47b8; --sky: #3b8bff; --sun: #ffd23a; --orange: #ff9f1a; --red: #ff3b3b; --green: #2fd36b;
  --ink: #05060f; --paper: #f4f8ff; --muted: #9db4e0; --panel: rgba(6, 22, 70, .86);
  --display: "Lilita One", Impact, "Arial Black", sans-serif; --body: "Fredoka", "Segoe UI", system-ui, sans-serif; --mono: "VT323", "Consolas", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; min-height: 100%; color: var(--paper); font-family: var(--body);
  background: radial-gradient(ellipse at 50% -10%, #1d5be0 0%, #0b2f86 38%, #041640 100%) fixed; -webkit-tap-highlight-color: transparent }
body { overflow-x: hidden }
button { font: inherit; color: inherit; cursor: pointer }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px); mix-blend-mode: multiply }

/* ---------- top bar ---------- */
#bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; background: linear-gradient(180deg, rgba(4,20,64,.97), rgba(4,20,64,.88)); border-bottom: 3px solid var(--ink); box-shadow: 0 3px 0 var(--sun) }
.home { font: 600 12px var(--body); color: var(--ink); text-decoration: none; padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); white-space: nowrap }
.home:hover { background: var(--sun) }
.logo { display: flex; align-items: center; gap: 8px; font: 22px var(--display); letter-spacing: .5px; text-shadow: 2px 2px 0 var(--ink) }
.logo .ch { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--red); border: 3px solid var(--ink); font-size: 18px; box-shadow: 2px 2px 0 var(--ink) }
.stats { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap }
.stat { font: 600 13px var(--body); padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.18) }
.stat b { font-family: var(--display); font-weight: 400; color: var(--sun); font-size: 16px }
.ib { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 2px 2px 0 var(--ink); font-size: 16px }
.ib:hover { background: var(--sun) }

main { max-width: 1320px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left)) 40px }
.screen { animation: fadeIn .35s ease }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px) } }

/* ---------- buttons, cards ---------- */
.btn { font: 20px var(--display); letter-spacing: .4px; padding: 12px 22px; border-radius: 14px; border: 3px solid var(--ink); background: var(--sun); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); transition: transform .08s }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink) }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink) }
.btn.red { background: var(--red); color: #fff } .btn.blue { background: var(--sky); color: #fff } .btn.ghost { background: var(--paper) }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none }
.card { background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 5px 5px 0 rgba(0,0,0,.55); padding: 16px }
.chyron { display: inline-block; font: 30px var(--display); color: var(--ink); background: var(--sun); padding: 4px 16px; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); transform: skewX(-8deg) }
.chyron span { display: inline-block; transform: skewX(8deg) }
.sub { color: var(--muted); font-size: 15px }
h2 { font: 30px var(--display); margin: 0 0 8px; text-shadow: 3px 3px 0 var(--ink) }

/* ---------- title ---------- */
#title { display: grid; place-items: center; min-height: calc(100vh - 120px); text-align: center }
.tv { position: relative; width: min(820px, 94vw); aspect-ratio: 16 / 10; border-radius: 34px; background: #1b1b22; border: 6px solid var(--ink); box-shadow: 10px 10px 0 rgba(0,0,0,.6), inset 0 0 0 10px #2a2a33; padding: 26px }
.tv .glass { position: absolute; inset: 26px; border-radius: 22px; overflow: hidden; background: #0a2f86 }
.tv canvas { width: 100%; height: 100%; display: block }
.tv .glass::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.18), transparent 50%), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5)); pointer-events: none }
.tlogo { position: absolute; left: 0; right: 0; top: 18%; font: clamp(36px, 8vw, 84px)/0.95 var(--display); color: var(--sun); -webkit-text-stroke: 3px var(--ink); text-shadow: 6px 6px 0 var(--ink); transform: rotate(-3deg) }
.tlogo small { display: block; font-size: .36em; color: #fff; -webkit-text-stroke: 2px var(--ink); margin-top: 8px }
.menu { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 26px }
.tagline { margin-top: 14px; color: var(--muted); max-width: 640px }

/* ---------- desk ---------- */
.desk { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start }
@media (max-width: 1020px) { .desk { grid-template-columns: 1fr } }
.mapwrap { position: relative; border: 4px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 6px 6px 0 rgba(0,0,0,.55); background: #06225a }
.mapwrap canvas { display: block; width: 100%; height: auto }
.maptag { position: absolute; left: 10px; top: 10px; font: 20px var(--mono); background: rgba(0,0,0,.6); padding: 2px 10px; border-radius: 6px; letter-spacing: 1px }
.maptag.r { left: auto; right: 10px }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 8px }
.tool { font: 600 14px var(--body); padding: 7px 12px; border-radius: 10px; border: 2px solid var(--ink); background: rgba(255,255,255,.1); box-shadow: 2px 2px 0 var(--ink) }
.tool.on { background: var(--sun); color: var(--ink) }
.tool.locked { opacity: .45 }
.loop { display: flex; align-items: center; gap: 10px; font: 18px var(--mono) }
.loop input { flex: 1; accent-color: var(--sun) }
.notes { margin-top: 12px; font-size: 15px; line-height: 1.45 }
.notes .n { padding: 8px 12px; border-left: 4px solid var(--sun); background: rgba(255,255,255,.06); border-radius: 0 8px 8px 0; margin-bottom: 8px }
.fcs { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 220px); overflow-y: auto; padding-right: 4px }
@media (max-width: 1020px) { .fcs { max-height: none } }
.fc { background: var(--panel); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 12px; box-shadow: 4px 4px 0 rgba(0,0,0,.5) }
.fc.hl { border-color: var(--sun) }
.fc .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px }
.fc .nm { font: 19px var(--display); flex: 1 }
.fc .now { font: 17px var(--mono); color: var(--muted) }
.icons { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px }
.ico { padding: 2px; border-radius: 9px; border: 2px solid transparent; background: rgba(255,255,255,.06); display: grid; place-items: center }
.ico:hover { background: rgba(255,255,255,.16) }
.ico.on { border-color: var(--sun); background: rgba(255,210,58,.22) }
.trow { display: flex; align-items: center; gap: 8px; margin-top: 8px }
.trow .tv2 { font: 26px var(--display); color: var(--sun); min-width: 58px; text-align: center; text-shadow: 2px 2px 0 var(--ink) }
.step { width: 34px; height: 30px; border-radius: 8px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 700 }
.bold { margin-left: auto; font: 600 13px var(--body); padding: 5px 10px; border-radius: 999px; border: 2px solid var(--ink); background: rgba(255,255,255,.1) }
.bold.on { background: var(--red); color: #fff }
.evac { font: 600 13px var(--body); padding: 5px 10px; border-radius: 999px; border: 2px solid var(--ink); background: rgba(255,255,255,.1) }
.evac.on { background: #ff8a00; color: var(--ink) }
.golive { position: sticky; bottom: 10px; display: flex; gap: 10px; align-items: center; margin-top: 12px; padding: 10px; border-radius: 14px; background: rgba(4,20,64,.92); border: 3px solid var(--ink) }
.golive .btn { flex: 1 }
.clock { font: 22px var(--mono); color: var(--sun) }

/* ---------- on air ---------- */
.air { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px }
@media (max-width: 1020px) { .air { grid-template-columns: 1fr } }
.studio { position: relative; border: 5px solid var(--ink); border-radius: 16px; overflow: hidden; box-shadow: 8px 8px 0 rgba(0,0,0,.6); background: #000; aspect-ratio: 16 / 9 }
.studio canvas { width: 100%; height: 100%; display: block }
.onair { position: absolute; left: 14px; top: 12px; font: 20px var(--display); background: var(--red); padding: 3px 12px; border-radius: 8px; border: 3px solid var(--ink); animation: blink 1s steps(2) infinite }
@keyframes blink { 50% { opacity: .55 } }
.prompter { position: relative; margin-top: 12px; height: 78px; overflow: hidden; border-radius: 12px; border: 4px solid var(--ink); background: #000; cursor: pointer; user-select: none }
.prompter .strip { position: absolute; top: 14px; white-space: nowrap; font: 44px var(--mono); color: #e8e8e8; will-change: transform }
.prompter .cue { color: var(--sun) }
.prompter .cue.hit { color: var(--green) } .prompter .cue.miss { color: var(--red); text-decoration: line-through }
.prompter .mark { position: absolute; left: 30%; top: 0; bottom: 0; width: 4px; background: var(--red); box-shadow: 0 0 12px var(--red) }
.prompter .help { position: absolute; right: 10px; top: 2px; font: 13px var(--body); color: var(--muted) }
.feedback { height: 26px; margin-top: 6px; font: 20px var(--display); text-align: center }
.chat { display: flex; flex-direction: column; height: min(560px, 60vh); background: var(--panel); border: 3px solid var(--ink); border-radius: 14px; overflow: hidden }
.chat h3 { margin: 0; padding: 8px 12px; font: 18px var(--display); background: var(--red); border-bottom: 3px solid var(--ink) }
.chat .log { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; gap: 5px; font-size: 14px }
.chat .m { animation: fadeIn .25s ease; line-height: 1.3 } .chat .m b { color: var(--sun) }
.meter { margin: 10px; height: 18px; border-radius: 99px; background: rgba(255,255,255,.1); border: 2px solid var(--ink); overflow: hidden }
.meter i { display: block; height: 100%; width: 50%; background: linear-gradient(90deg, var(--red), var(--sun), var(--green)); transition: width .4s }
.adlib { position: absolute; inset: auto 0 0 0; padding: 14px; background: rgba(4,20,64,.94); border-top: 4px solid var(--sun); display: flex; flex-direction: column; gap: 8px }
.adlib b { font: 22px var(--display); color: var(--sun) }
.adlib button { text-align: left; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 600 }
.adlib button:hover { background: var(--sun) }

/* ---------- results ---------- */
.res { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; align-items: start }
@media (max-width: 1020px) { .res { grid-template-columns: 1fr } }
.rcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 12px }
.rc { perspective: 600px; height: 132px }
.rc .in { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d }
.rc.flip .in { transform: rotateY(180deg) }
.rc .f, .rc .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; border: 3px solid var(--ink); padding: 8px 10px; background: var(--panel) }
.rc .b { transform: rotateY(180deg) }
.rc .b.good { background: linear-gradient(160deg, #0f7a3f, #0a4a2a) } .rc .b.ok { background: linear-gradient(160deg, #8a6a0a, #4a3a06) } .rc .b.bad { background: linear-gradient(160deg, #8a1a1a, #4a0a0a) }
.rc .nm { font: 17px var(--display) } .rc .row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted) }
.rc .pts { position: absolute; right: 10px; bottom: 6px; font: 24px var(--display); color: var(--sun); text-shadow: 2px 2px 0 var(--ink) }
.summary .big { font: 64px var(--display); color: var(--sun); text-shadow: 4px 4px 0 var(--ink); line-height: 1 }
.calls { display: flex; flex-direction: column; gap: 8px; margin-top: 10px }
.call { padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.07); border-left: 4px solid var(--sky); font-size: 15px }
.call i { color: var(--muted) }
.unlock { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255,210,58,.15); border: 2px dashed var(--sun) }

/* ---------- shop / book ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px }
.item { display: flex; flex-direction: column; gap: 6px }
.item .nm { font: 20px var(--display) } .item .d { font-size: 14px; color: var(--muted); flex: 1 }
.item .pr { font: 18px var(--display); color: var(--sun) }
.item.owned { border-color: var(--green) }
.item canvas { align-self: center }
.tabs { display: flex; gap: 8px; margin: 12px 0 }
.tabs button { font: 18px var(--display); padding: 8px 16px; border-radius: 12px 12px 0 0; border: 3px solid var(--ink); background: rgba(255,255,255,.08) }
.tabs button.on { background: var(--sun); color: var(--ink) }
.entry.locked { filter: grayscale(1) brightness(.5) }
.entry .q { font: 40px var(--display); text-align: center; color: var(--muted) }
.letter { background: #fdf6e3; color: #3a2a1a; font-family: Georgia, serif; border-radius: 6px; padding: 14px 16px; box-shadow: 4px 4px 0 rgba(0,0,0,.4); transform: rotate(var(--r, 0deg)) }
.letter .from { margin-top: 8px; text-align: right; font-style: italic }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; padding: 12px 20px; border-radius: 14px; background: var(--sun); color: var(--ink); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font: 18px var(--display); animation: fadeIn .3s ease }
.shake { animation: shake .4s }
@keyframes shake { 20% { transform: translate(-6px, 3px) } 40% { transform: translate(5px, -4px) } 60% { transform: translate(-4px, 2px) } 80% { transform: translate(3px, -2px) } }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; transition: opacity .5s }
</style>
</head>
<body>
<div id="bar">
  <a class="home" href="index.html">← Kai.fun</a>
  <div class="logo"><span class="ch" id="chNum">7</span><span id="stationName">WEATHER CHANNEL</span></div>
  <div class="stats" id="stats"></div>
  <button class="ib" id="muteBtn" title="Sound">🔊</button>
</div>
<main id="app"></main>
<div id="flash"></div>
<script>
/* ============================================================================================
   THE ATMOSPHERE OF ISOBARIA
   Every bit of weather comes from a handful of pressure systems drifting on the jet stream.
   Lows bring cloud, rain and fronts; highs bring sun and, on calm coastal mornings, fog.
   The map, the satellite loop, the radar, the model and tomorrow's real weather are all read
   from the same systems, so careful forecasters really can see tomorrow coming.
   ============================================================================================ */
const MAP_W = 1000, MAP_H = 620, GX = 50, GY = 31, CELL = 20;

class RNG {
  constructor(a) { this.a = a | 0; }
  next() { let a = this.a = this.a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
}
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

const LAND = [[150,0],[1000,0],[1000,600],[930,604],[860,585],[780,540],[700,575],[600,590],[520,560],[430,585],[330,575],[250,540],[190,480],[160,400],[120,340],[150,280],[110,220],[140,150],[120,80],[135,30]];
const LAKE = [[540,232],[585,220],[618,240],[612,272],[575,286],[538,270]];
const MOUNTAINS = [[640,100],[668,128],[690,160],[706,192],[726,222],[745,252]];

const CITIES = [
  { id: 'pockett',   name: 'Pockett',          x: 420, y: 300, coast: 0, elev: 0, m: 0 },
  { id: 'drizzle',   name: 'Drizzleford',      x: 318, y: 222, coast: 0, elev: 0, m: 0 },
  { id: 'sunny',     name: 'Little Sunnyvale', x: 470, y: 420, coast: 0, elev: 0, m: 0 },
  { id: 'mudbury',   name: 'Mudbury',          x: 556, y: 330, coast: 0, elev: 0, m: 0, lake: 1 },
  { id: 'portgale',  name: 'Port Gale',        x: 180, y: 300, coast: 1, elev: 0, m: 1 },
  { id: 'fogmouth',  name: 'Fogmouth',         x: 236, y: 498, coast: 1, elev: 0, m: 1 },
  { id: 'hail',      name: 'Hailington',       x: 690, y: 196, coast: 0, elev: 2, m: 1 },
  { id: 'frost',     name: 'Frostwick',        x: 486, y: 84,  coast: 0, elev: 1, m: 1 },
  { id: 'tempest',   name: 'Cape Tempest',     x: 742, y: 548, coast: 1, elev: 0, m: 2 },
  { id: 'swelter',   name: 'Saint Swelter',    x: 432, y: 560, coast: 1, elev: 0, m: 2 },
  { id: 'breeze',    name: 'Breezewater',      x: 862, y: 336, coast: 0, elev: 0, m: 2 },
  { id: 'gustavia',  name: 'Gustavia',         x: 884, y: 140, coast: 0, elev: 0, m: 2 },
];

const ICONS = ['sunny', 'partly', 'cloudy', 'fog', 'rain', 'storm', 'snow'];
const ICON_NAME = { sunny: 'Sunny', partly: 'Partly cloudy', cloudy: 'Cloudy', fog: 'Fog', rain: 'Rain', storm: 'Storms', snow: 'Snow' };
const NEAR = { sunny: ['partly'], partly: ['sunny', 'cloudy'], cloudy: ['partly', 'fog', 'rain'], fog: ['cloudy'], rain: ['cloudy', 'storm', 'snow'], storm: ['rain'], snow: ['rain'] };

function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

/* ---------- the atmosphere ---------- */
class Atmosphere {
  constructor(seed, season) {
    this.rng = new RNG(seed);
    this.season = season;           // { base, sea, name, amp, hurricane?: {day} }
    this.t = 0;                     // hours since the sim started
    this.sys = [];
    this.nextLow = 4; this.nextHigh = 18;
    this.jetPhase = this.r() * Math.PI * 2;
    this.jetSpeed = 9 + this.r() * 3;
    this.hurricaneSpawned = false;
    this.history = [];              // hourly snapshots, for the satellite / radar loop
    // seed a few systems already on the map
    this.spawn('L', 200 + this.r() * 250, 150 + this.r() * 320, 0.5);
    this.spawn('H', 560 + this.r() * 250, 160 + this.r() * 300, 0.6);
    if (this.r() < 0.6) this.spawn('L', 760 + this.r() * 200, 120 + this.r() * 360, 0.3);
  }
  r() { return this.rng.next(); }
  jet() {
    const ph = this.t / 70 * Math.PI * 2 + this.jetPhase;
    return { x: this.jetSpeed + Math.sin(ph * 0.5) * 1.5, y: Math.sin(ph) * 3.2 };
  }
  spawn(kind, x, y, ageFrac = 0) {
    const L = kind === 'L';
    const life = L ? 60 + this.r() * 34 : 100 + this.r() * 50;
    const s = {
      kind, x, y, vx: this.jetSpeed * (L ? 1 : 0.6), vy: (this.r() - 0.5) * 3,
      peak: L ? 0.55 + this.r() * 0.45 : 0.6 + this.r() * 0.4,
      r: L ? 150 + this.r() * 90 : 190 + this.r() * 110,
      life, age: life * ageFrac, front: L && this.r() < 0.8, tropical: false, cold: 0,
      id: Math.floor(this.r() * 1e9),
    };
    if (L && this.season.coldLows && this.r() < 0.55) s.cold = 1;      // arctic lows: blizzard makers
    this.sys.push(s);
    return s;
  }
  spawnHurricane() {
    const s = { kind: 'L', x: 640 + this.r() * 180, y: 820, vx: -2.5 - this.r() * 2, vy: -7.2, peak: 1.55, r: 92, life: 140, age: 30,
      front: false, tropical: true, cold: 0, id: Math.floor(this.r() * 1e9), name: 'Hurricane ' + ['Gloria', 'Barnaby', 'Delphine', 'Mortimer', 'Ophelia'][Math.floor(this.r() * 5)] };
    this.sys.push(s);
    this.hurricaneSpawned = true;
    return s;
  }
  strength(s) {
    if (s.tropical) return s.peak * Math.min(1, 0.6 + s.age / 80);
    const u = Math.min(1, Math.max(0, s.age / s.life));
    return s.peak * Math.pow(Math.sin(Math.PI * u), 0.55);
  }
  /* one hour; noise=false is the computer model's idea of the future */
  step(noise = true) {
    const jet = this.jet();
    const rnd = noise ? () => this.r() - 0.5 : () => 0;
    for (const s of this.sys) {
      s.age += 1;

/* ---------- reading the weather at a point from a snapshot ---------- */
function seasonBase(season, day) { return season.base + (season.trend || 0) * day; }

function cityTempAdjust(city, season, T) {
  let t = T - city.elev * 3.2;
  if (city.coast) t = t * 0.7 + season.sea * 0.3;

}

/* ---------- a city's whole day: what the weather "was" ---------- */
function cityDay(city, snapsByHour, season, day) {
  // snapsByHour: array of {hour, snap} for hours 6..21 of the day
  let maxRain = 0, cloudSum = 0, tmax = -99, tmin = 99, maxWind = 0, rainHourT = 99, maxStr = 0, fog = 0, morningRain = 0, lateClear = 0, tropicalHit = 0, n = 0, stormT = 0;
  for (const { hour, snap } of snapsByHour) {
    const f = fieldAt(snap, city.x, city.y, season, day, hour);
    const T = cityTempAdjust(city, season, f.T);
    n++;
    cloudSum += f.cloud;
    tmax = Math.max(tmax, T); tmin = Math.min(tmin, T);
    maxWind = Math.max(maxWind, f.wind);
    if (f.rain > maxRain) { maxRain = f.rain; rainHourT = T; maxStr = f.maxStr; stormT = T; }
    if (f.tropical && f.lowInfl > 0.55) tropicalHit = 1;
    if (hour <= 10) {
      const calm = Math.max(0, 1 - f.wind / 9);
      const wet = city.coast ? 1 : city.lake ? 0.8 : 0.45;
      const fg = f.hInfl * calm * wet * (T > -4 && T < 18 ? 1 : 0.2) * (1 - f.rain);
      fog = Math.max(fog, fg);
      if (f.rain > 0.25) morningRain = 1;
    }
    if (hour >= 15 && f.cloud < 0.35 && f.rain < 0.05) lateClear = 1;
  }

  let icon;

  else if (maxRain > 0.24) icon = rainHourT <= 1.2 ? 'snow' : 'rain';
  else if (fog > 0.26 + (season.fogBias || 0)) icon = 'fog';
  else if (meanCloud > 0.58) icon = 'cloudy';
  else if (meanCloud > 0.3) icon = 'partly';
  else icon = 'sunny';
  const tags = [];

  if (icon === 'storm' && stormT >= 8 && stormT <= 21 && maxStr > 0.86) tags.push('hail');
  if (tmax >= 31) tags.push('heatwave');
  if (tmax <= -6) tags.push('coldsnap');
  if (maxWind >= 46) tags.push('gale');
  if (morningRain && lateClear) tags.push('rainbow');
  if (tropicalHit) tags.push('hurricane');
  if (icon === 'snow' && maxRain > 0.7) tags.push('blizzard');

}

function scoreCity(fc, actual) {
  let icon = 0;
  if (fc.icon === actual.icon) icon = 100;
  else if ((NEAR[fc.icon] || []).includes(actual.icon)) icon = 45;
  const err = Math.abs(fc.high - actual.high);
  const temp = Math.max(0, 100 - err * 14);
  let pts = icon + temp * 0.5;

function tempColor(t) {
  const stops = [[-15, [120, 60, 220]], [-5, [60, 110, 255]], [3, [70, 200, 255]], [10, [80, 220, 120]], [17, [240, 230, 70]], [24, [255, 150, 40]], [32, [240, 50, 40]], [40, [170, 0, 60]]];

const Audio = {
  ctx: null, master: null, music: null, on: true, playing: false, next: 0, beat: 0, timer: null, level: 0.5,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 0.8 : 0; this.master.connect(this.ctx.destination);
    this.music = this.ctx.createGain(); this.music.gain.value = 0.0; this.music.connect(this.master);
  },
  toggle() { this.on = !this.on; if (this.master) this.master.gain.value = this.on ? 0.8 : 0; $('#muteBtn').textContent = this.on ? '🔊' : '🔇'; },
  tone(f, t, d, type = 'sine', g = 0.2, dest) {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), a = c.createGain(); o.type = type; o.frequency.value = f;
    a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t + 0.01); a.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(a); a.connect(dest || this.master); o.start(t); o.stop(t + d + 0.05);
  },
  noise(t, d, g = 0.2, f = 6000, dest, type = 'highpass') {
    const c = this.ctx; if (!c) return;
    const n = c.createBuffer(1, Math.ceil(c.sampleRate * d), c.sampleRate), data = n.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = n; const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f;
    const a = c.createGain(); a.gain.setValueAtTime(g, t); a.gain.exponentialRampToValueAtTime(0.0008, t + d);
    s.connect(fl); fl.connect(a); a.connect(dest || this.master); s.start(t);
  },
  sfx(name) {
    this.init(); const c = this.ctx; if (!c) return; const t = c.currentTime;
    if (name === 'click') this.tone(880, t, 0.06, 'square', 0.05);
    if (name === 'pick') { this.tone(660, t, 0.08, 'triangle', 0.12); this.tone(990, t + 0.05, 0.1, 'triangle', 0.1); }
    if (name === 'good') [523, 659, 784, 1046].forEach((f, i) => this.tone(f, t + i * 0.07, 0.25, 'triangle', 0.12));
    if (name === 'ok') [523, 587].forEach((f, i) => this.tone(f, t + i * 0.08, 0.2, 'triangle', 0.1));
    if (name === 'bad') { this.tone(220, t, 0.35, 'sawtooth', 0.08); this.tone(207, t + 0.18, 0.4, 'sawtooth', 0.08); }
    if (name === 'hit') this.tone(1318, t, 0.12, 'sine', 0.12);
    if (name === 'miss') this.tone(140, t, 0.2, 'square', 0.06);
    if (name === 'thunder') { this.noise(t, 2.2, 0.5, 300, null, 'lowpass'); this.noise(t + 0.05, 0.3, 0.3, 1200, null, 'lowpass'); }
    if (name === 'cash') [1046, 1318, 1568, 2093].forEach((f, i) => this.tone(f, t + i * 0.05, 0.15, 'square', 0.04));
    if (name === 'jingle') [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => this.tone(f, t + i * 0.12, 0.3, 'triangle', 0.1));
    if (name === 'laugh') for (let i = 0; i < 6; i++) this.noise(t + i * 0.11, 0.08, 0.15, 900 + i * 60, null, 'bandpass');
    if (name === 'siren') for (let i = 0; i < 4; i++) { this.tone(700, t + i * 0.5, 0.25, 'sawtooth', 0.05); this.tone(950, t + i * 0.5 + 0.25, 0.25, 'sawtooth', 0.05); }
  },
  // Dm9 - G13 - Cmaj9 - A7b9, laid-back swing at 88 bpm
  startMusic(level = 0.5) {
    this.init(); if (!this.ctx) return; this.level = level;
    this.music.gain.cancelScheduledValues(this.ctx.currentTime); this.music.gain.linearRampToValueAtTime(level * 0.55, this.ctx.currentTime + 1);
    if (this.playing) return;
    this.playing = true; this.next = this.ctx.currentTime + 0.1; this.beat = 0;
    const CH = [[62, 65, 69, 72, 76], [55, 65, 69, 71, 76], [60, 64, 67, 71, 74], [57, 61, 64, 67, 70]], BASS = [[38, 41, 45, 43], [31, 35, 38, 40], [36, 40, 43, 45], [33, 37, 40, 34]];
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12), spb = 60 / 88;
    this.timer = setInterval(() => {
      const c = this.ctx;
      while (this.next < c.currentTime + 0.3) {
        const bar = Math.floor(this.beat / 4) % 4, b = this.beat % 4, t = this.next;
        if (b === 0 || b === 2.5) CH[bar].forEach((m, i) => { this.tone(hz(m + 12), t + i * 0.012, spb * 2.2, 'sine', 0.035, this.music); this.tone(hz(m + 24), t + i * 0.012, spb * 0.6, 'sine', 0.008, this.music); });
        if (b === 1) CH[bar].slice(1, 4).forEach(m => this.tone(hz(m + 12), t + spb * 0.66, spb * 0.5, 'sine', 0.025, this.music));
        this.tone(hz(BASS[bar][b]), t, spb * 0.9, 'triangle', 0.16, this.music);
        this.noise(t, 0.06, 0.03, 7000, this.music); this.noise(t + spb * 0.66, 0.05, 0.02, 7000, this.music);
        if (b === 1 || b === 3) this.noise(t, 0.12, 0.035, 2500, this.music, 'bandpass');
        if (Math.random() < 0.18) { const m = CH[bar][Math.floor(Math.random() * 5)] + 24; this.tone(hz(m), t + spb * 0.33, spb * 0.4, 'sine', 0.03, this.music); }
        this.next += spb; this.beat++;
      }
    }, 80);
  },
  musicLevel(level) { if (!this.ctx) return; this.music.gain.linearRampToValueAtTime(level * 0.55, this.ctx.currentTime + 0.6); },
};

/* ---------- the world of one market ---------- */
let W = null;   // { atm, snaps: Map, market, season }
function buildWorld(run) {
  const m = MARKETS[run.market];
  const atm = new Atmosphere(run.seed, m.season);
  const snaps = new Map();
  const target = T_OF(run.day);
  snaps.set(atm.t, atm.snapshot());
  while (atm.t < target) { atm.step(); snaps.set(atm.t, atm.snapshot()); }
  W = { atm, snaps, market: m, season: m.season };
}
function prune() { for (const k of W.snaps.keys()) if (k < W.atm.t - 40) W.snaps.delete(k); }
function cities() { return CITIES.filter(c => c.m <= S.run.market); }
function hourOf(t) { return ((t - 66 + 18) % 24 + 24) % 24; }

/* the real tomorrow, worked out with the atmosphere's own dice */
function realTomorrow() {
  const a = W.atm.clone(true), hours = [];
  for (let k = 1; k <= 27; k++) { a.step(); if (k >= 12) hours.push({ hour: hourOf(a.t), snap: a.snapshot() }); }
  const actual = {};
  for (const c of cities()) actual[c.id] = cityDay(c, hours, W.season, S.run.day + 1);
  return { actual, hours };
}

function kneeSays(peek) {
  const icons = Object.values(peek.actual).map(a => a.icon);
  const truth = icons.some(i => i === 'rain' || i === 'storm' || i === 'snow');
  const honest = Math.random() < 0.75;
  const says = honest ? truth : !truth;
  if (icons.some(i => i === 'storm') && honest) return 'Oh, my knee is THROBBING, dear. Something nasty tomorrow.';
  return says ? pick(['My knee aches. Rain somewhere tomorrow, mark my words.', 'Knee\'s creaky. Wet weather coming.', 'I can feel it in my knee. Get the brolly out.']) : pick(['Knee feels lovely. Dry as a biscuit tomorrow.', 'Not a twinge! Nice and dry.', 'My knee says sunshine. My hip says nothing, as usual.']);
}

/* ---------- ON AIR ---------- */
function showAir(fc, evac, peek) {
  clearLoop(); setBar(); app.innerHTML = '';
  const r = S.run, m = W.market, now = T_OF(r.day), snap = W.snaps.get(now), cs = cities();
  Audio.startMusic(0.75);
  const studio = h('canvas'); studio.width = 1280; studio.height = 720;
  const sx = studio.getContext('2d');
  const mapCv = document.createElement('canvas'); const mv = new MapView(mapCv, 1280);
  const fields = gridFields(snap, W.season, r.day, 18);
  const look = lookOf(), suitDef = SUITS.find(s => s.id === S.look.suit);
  const log = h('div', { class: 'log' }), meterI = h('i');
  const chat = h('div', { class: 'chat' }, h('h3', {}, '💬 Live viewers'), log, h('div', { class: 'meter' }, meterI));
  const strip = h('div', { class: 'strip' }), fb = h('div', { class: 'feedback' });
  const prompter = h('div', { class: 'prompter', title: 'Press SPACE or tap here when a yellow word crosses the red line' }, strip, h('div', { class: 'mark' }), h('div', { class: 'help' }, 'SPACE / tap on the yellow words'));
  const studioWrap = h('div', { class: 'studio' }, studio, h('div', { class: 'onair' }, '● ON AIR'));
  app.append(h('div', { class: 'screen' }, h('div', { class: 'air' }, h('div', {}, studioWrap, prompter, fb), chat)));

  // the script
  const tokens = [];   // {text, cue, city, adlib}
  const say = (txt, city) => txt.split(' ').forEach(w => { const cue = w.startsWith('*'); tokens.push({ text: cue ? w.slice(1) : w, cue, city }); });
  say(`Good evening, ${m.name}! Here's your forecast for tomorrow.`, null);
  const phrase = { sunny: '*SUNSHINE all day', partly: 'a mix of sun and *CLOUDS', cloudy: 'grey *OVERCAST skies', fog: 'thick morning *FOG', rain: 'steady *RAIN', storm: '*THUNDERSTORMS rolling through', snow: 'falling *SNOW' };
  cs.forEach((c, i) => {

    const city = '*' + c.name.toUpperCase().replace(/ /g, ' ');
    say(`${i === 0 ? 'Starting in' : pick(['Over in', 'Down in', 'Up in', 'Meanwhile in', 'Folks in'])} ${city}, expect ${phrase[f.icon]}, high of *${f.high}.`, c.id);
    if (f.bold) say('And I\'ll say it *BOLDLY!', c.id);
    if (evac[c.id]) say(`${c.name.toUpperCase()}: *EVACUATE tonight!`, c.id);
    if (i === Math.floor(cs.length / 2) - 1) tokens.push({ text: '★', adlib: true });
  });
  say(`That's your weather. Back to you, *DOUG!`, null);
  tokens.forEach((t, i) => { t.el = h('span', { class: t.cue ? 'cue' : '' }, t.text + ' '); strip.append(t.el); });

  let x0 = null, speed = 165, paused = false, done = false, cityNow = null, pop = {}, rating = 0.5, hits = 0, cues = tokens.filter(t => t.cue).length, perfect = 0, misses = 0, waves = 0, jokeQ = 0;
  const marker = () => prompter.clientWidth * 0.3;
  const tokPos = () => tokens.forEach(t => { t.cx = t.el.offsetLeft + t.el.offsetWidth / 2 - 6; t.x = t.el.offsetLeft; });
  requestAnimationFrame(tokPos);
  let x = prompter.clientWidth * 0.75;

  const pushChat = (kind, vars = {}) => {
    const lines = CHAT[kind]; if (!lines) return;
    let t = pick(lines); for (const [k, v] of Object.entries(vars)) t = t.replaceAll('{' + k + '}', v);
    log.append(h('div', { class: 'm' }, h('b', {}, pick(NAMES) + ': '), t));
    while (log.children.length > 18) log.firstChild.remove();
  };
  const bump = (d) => { rating = clamp(rating + d, 0, 1); meterI.style.width = (rating * 100) + '%'; };
  pushChat('hello'); pushChat('hello');
  if (r.prevGood === true) pushChat('goodPrev'); if (r.prevGood === false) { pushChat('badPrev'); pushChat('badPrev'); }
  if (suitDef.green) setTimeout(() => { pushChat('green'); pushChat('green'); }, 1500);
  if (S.look.prop === 'frog') setTimeout(() => pushChat('frog'), 2500);

  const press = () => {
    if (done || paused) return;
    let best = null, bd = 1e9;
    for (const t of tokens) if (t.cue && !t.res) { const d = Math.abs(x + t.cx - marker()); if (d < bd) { bd = d; best = t; } }
    if (best && bd < 70) {
      best.res = bd < 26 ? 'perfect' : 'good'; best.el.classList.add('hit'); hits++; if (best.res === 'perfect') perfect++;
      fb.textContent = best.res === 'perfect' ? '★ PERFECT' : 'Good'; fb.style.color = best.res === 'perfect' ? 'var(--sun)' : 'var(--green)';

    } else {
      waves++; fb.textContent = 'flails arms'; fb.style.color = 'var(--muted)'; bump(-0.02); if (Math.random() < 0.4) pushChat('wave');
    }
  };
  const key = (e) => { if (e.code === 'Space') { e.preventDefault(); press(); } };
  document.addEventListener('keydown', key);
  prompter.addEventListener('pointerdown', press);
  studio.addEventListener('pointerdown', press);

  const adlib = () => {
    paused = true;
    const opts = [...JOKES].sort(() => Math.random() - 0.5).slice(0, 3);
    let left = 7;
    const box = h('div', { class: 'adlib' }, h('b', {}, '🎤 AD-LIB! Pick a joke for the folks at home (' + left + ')'));
    const end = (j) => {
      if (!box.isConnected) return; box.remove(); clearInterval(tm);
      if (j) {
        jokeQ = j.q + (Math.random() < 0.25 ? 1 : 0) - (Math.random() < 0.2 ? 1 : 0);
        fb.textContent = '"' + j.t + '"'; fb.style.color = 'var(--paper)';
        if (jokeQ >= 2) { Audio.sfx('laugh'); pushChat('jokeGood'); pushChat('jokeGood'); bump(0.1); } else { pushChat('jokeBad'); pushChat('jokeBad'); bump(-0.04); }
      } else { jokeQ = 0; fb.textContent = '...awkward silence...'; pushChat('jokeBad'); bump(-0.06); }
      setTimeout(() => { paused = false; }, 1600);
    };
    opts.forEach(j => box.append(h('button', { onclick: () => { Audio.sfx('pick'); end(j); } }, j.t)));
    studioWrap.append(box);
    const tm = setInterval(() => { left--; box.firstChild.textContent = '🎤 AD-LIB! Pick a joke for the folks at home (' + left + ')'; if (left <= 0) end(null); }, 1000);
  };

  let tick = 0, talkT = 0, blinkT = 3, ticker = 0;
  const tickerText = `   ★ ${pick(SPONSORS).toUpperCase()}: TODAY'S WEATHER IS BROUGHT TO YOU BY US   ★ ${pick(HEADLINES)}   ★ ${pick(HEADLINES)}   ★ ${pick(SPONSORS).toUpperCase()}: WE'RE OPEN RAIN OR SHINE   `;
  setLoop((dt, time) => {
    tick += dt;
    if (!paused && !done) {
      x -= speed * dt;
      // which word is at the marker
      for (const t of tokens) {
        if (t.adlib && !t.fired && x + t.cx < marker()) { t.fired = true; adlib(); }
        if (t.cue && !t.res && x + t.cx < marker() - 70) { t.res = 'miss'; t.el.classList.add('miss'); misses++; fb.textContent = 'uhh...'; fb.style.color = 'var(--red)'; Audio.sfx('miss'); bump(-0.05); if (Math.random() < 0.5) pushChat('miss'); }
        if (t.city && x + t.x < marker() && t.city !== cityNow && tokens.indexOf(t) >= 0) {

          }

      }
      if (x + strip.scrollWidth < marker() - 40) { done = true; setTimeout(finish, 900); }
      talkT += dt;
    }
    for (const k in pop) if (pop[k] < 1) pop[k] = Math.min(1, pop[k] + dt * 2.2);
    strip.style.transform = `translateX(${x}px)`;

    // ---- draw the studio ----

    mv.render({ snap, fields, layers: new Set(['sat', 'pressure']), cities: cs, forecasts: fc, pop, highlight: cityNow, time, evac });
    sx.drawImage(mapCv, 0, -40, 1280, 1280 * MAP_H / MAP_W);

    if (cityNow) { const c = CITIES.find(c => c.id === cityNow); const cx = c.x * 1.28, cy = c.y * 1.28 - 40; ang = Math.atan2(cy - 420, cx - 260); ang = clamp(ang, -1.3, 1.2); }
    blinkT -= dt; const blink = blinkT < 0.12; if (blinkT < 0) blinkT = 2 + Math.random() * 3;
    const talking = !paused && !done ? Math.abs(Math.sin(talkT * 11)) : 0;

    drawPresenter(sx, 200, 470, 1.25, look, { point: ang, talk: talking, blink, sweat: uneasy, bob: Math.sin(tick * 2) * 2 });

    sx.fillStyle = '#05060f'; sx.font = '34px "Lilita One", Impact, sans-serif'; sx.fillText(`${m.call}-${m.channel} FORECAST · ${m.name.toUpperCase()}`, 50, 632);
    sx.fillStyle = '#0f47b8'; sx.fillRect(30, 650, 520, 30); sx.strokeRect(30, 650, 520, 30);
    sx.fillStyle = '#fff'; sx.font = '600 20px Fredoka, sans-serif'; sx.fillText(`with YOU, Chief Meteorologist · Day ${r.day}`, 44, 672);
    // ticker
    sx.fillStyle = '#05060f'; sx.fillRect(0, 690, 1280, 30);
    sx.fillStyle = '#ffd23a'; sx.font = '24px VT323, monospace'; ticker = (ticker + dt * 110) % 2400;
    sx.fillText(tickerText, 1280 - ticker, 712); sx.fillText(tickerText, 1280 - ticker + 2400, 712);

    sx.fillStyle = '#fff'; sx.font = '46px "Lilita One", Impact, sans-serif'; sx.textAlign = 'center'; sx.fillText(m.channel, 1210, 86); sx.textAlign = 'left';
    sx.font = '26px VT323, monospace'; sx.fillStyle = '#fff'; sx.fillText('6:0' + Math.min(9, Math.floor(tick / 6)) + ' PM', 1140, 140);
  });

  function finish() {

/* ---------- THE NEXT DAY ---------- */
function showResults(fc, evac, peek, show) {
  clearLoop(); setBar(); app.innerHTML = '';
  Audio.musicLevel(0.25);
  const r = S.run, m = W.market, cs = cities();
  const actual = peek.actual;
  // advance the real atmosphere to tomorrow's broadcast
  for (let k = 0; k < 24; k++) { W.atm.step(); W.snaps.set(W.atm.t, W.atm.snapshot()); }
  prune();
  // score
  let sum = 0, max = 0, iconsRight = 0, boldDelta = 0, perfectCity = false;
  const rows = cs.map(c => {
    const sc = scoreCity(fc[c.id], actual[c.id]);
    sum += sc.icon + sc.temp * 0.5; max += 150;
    if (sc.icon === 100) iconsRight++;
    if (fc[c.id].bold) boldDelta += sc.icon === 100 ? 0.35 : -0.5;
    if (sc.icon === 100 && sc.err <= 1) perfectCity = true;
    return { c, sc };
  });
  const acc = Math.round(sum / max * 100);
  // hurricane
  let saved = 0, missed = 0, wasted = 0;
  for (const c of cs) { const hit = actual[c.id].tropicalHit; if (hit && evac[c.id]) saved++; else if (hit) missed++; else if (evac[c.id]) wasted++; }
  // ratings
  const su = SUITS.find(s => s.id === S.look.suit), pr = PROPS.find(p => p.id === S.look.prop), hr = HAIRS.find(x => x.id === S.look.hair);
  const rainyCall = Object.values(fc).filter(f => ['rain', 'storm', 'snow'].includes(f.icon)).length > cs.length / 2;
  const sunnyCall = Object.values(fc).filter(f => f.icon === 'sunny').length > cs.length / 2;
  let style = (su.bonus || 0) + (pr.bonus || 0) + (hr.bonus || 0);
  if (W.season.name === 'Summer') style += su.summer || 0; if (W.season.name === 'Winter') style += su.winter || 0;
  if (rainyCall) style += (su.rainy || 0) + (pr.rainy || 0); if (sunnyCall) style += pr.sunny || 0;
  const dRating = (acc - 58) / 16 + (show.delivery - 0.5) * 1.2 + (show.jokeQ - 1.5) * 0.25 + style + boldDelta + saved * 1.2 - missed * 2.5 - wasted * 0.3;
  const oldRating = r.rating;
  r.rating = clamp(r.rating + dRating, 0.5, 20);
  const pay = Math.max(20, Math.round(r.rating * 45 * m.pay - wasted * 120));
  S.money += pay; S.shows++;
  r.acc.push(acc); r.prevGood = acc >= 60;
  S.streak = acc >= 70 ? S.streak + 1 : 0;

  // collections
  const newAlm = [];
  for (const c of cs) { const a = actual[c.id]; [a.icon, ...a.tags].forEach(id => { if (ALMANAC.find(x => x.id === id) && !S.almanac[id]) { S.almanac[id] = 1; newAlm.push(id); } }); }
  const newMail = [];
  const mail = (id) => { if (!S.mail[id]) { S.mail[id] = 1; newMail.push(id); } };
  mail('first');
  if (perfectCity) mail('perfectCity');
  if (iconsRight === cs.length) mail('perfectDay');
  if (S.streak >= 3) mail('streak');
  if (acc < 35) mail('badDay');
  if (boldDelta > 0) mail('boldRight'); if (rows.some(x => fc[x.c.id].bold && x.sc.icon < 100)) mail('boldWrong');
  if (su.green) mail('green'); if (S.look.prop === 'frog') mail('frog');
  if (rows.some(x => fc[x.c.id].icon === 'sunny' && actual[x.c.id].icon === 'storm')) mail('missedStorm');
  if (rows.some(x => actual[x.c.id].icon === 'fog' && x.sc.icon === 100)) mail('fog');
  if (rows.some(x => actual[x.c.id].icon === 'snow' && x.sc.icon === 100)) mail('snow');
  if (saved > 0 && missed === 0) mail('saved');

  const last = r.day >= m.days;
  if (!last) r.day++;
  save();

  // ---- layout ----
  const cv = h('canvas'); const view = new MapView(cv); resizeHandler = () => view.resize();
  const clock = h('div', { class: 'maptag' }), tag = h('div', { class: 'maptag r' }, 'TOMORROW, AS IT HAPPENED');
  const cards = h('div', { class: 'rcards' });
  const sumBox = h('div', { class: 'card summary', style: 'opacity:0;transition:opacity .5s' });
  app.append(h('div', { class: 'screen' }, h('div', { class: 'res' },
    h('div', {}, h('div', { class: 'mapwrap' }, cv, clock, tag), cards), sumBox)));
  view.resize();
  rows.forEach(({ c, sc }) => {
    const a = actual[c.id], f = fc[c.id];
    const cls = sc.icon === 100 ? 'good' : sc.icon > 0 ? 'ok' : 'bad';
    const back = h('div', { class: 'b ' + cls }, h('div', { class: 'nm' }, c.name),
      h('div', { class: 'row' }, 'You: ', iconCanvas(f.icon, 30), `${f.high}°`, f.bold ? ' BOLD' : ''),
      h('div', { class: 'row' }, 'Real: ', iconCanvas(a.icon, 30), `${a.high}°`, a.tags.includes('hurricane') ? ' 🌀' : ''),
      h('div', { class: 'pts' }, (sc.pts >= 0 ? '+' : '') + Math.round(sc.pts)));
    const el = h('div', { class: 'rc' }, h('div', { class: 'in' }, h('div', { class: 'f' }, h('div', { class: 'nm' }, c.name), h('div', { class: 'row' }, 'You said: ', iconCanvas(f.icon, 30), `${f.high}°`)), back));
    el._sc = sc; cards.append(el);
  });

  // replay tomorrow: 6 AM to 9 PM in about seven seconds
  const hours = peek.hours.filter(x => x.hour >= 6 && x.hour <= 21);
  let i = 0, acc2 = 0, fields = gridFields(hours[0].snap, W.season, r.day, hours[0].hour), revealed = false, flipIdx = 0, flipT = 0;
  const shown = {};
  setLoop((dt, time) => {
    acc2 += dt;
    if (i < hours.length - 1 && acc2 > 0.42) { acc2 = 0; i++; fields = gridFields(hours[i].snap, W.season, r.day, hours[i].hour); if (hours[i].snap.sys.some(s => s.tropical) && i % 4 === 0) shake(); }
    if (i >= hours.length - 1 && !revealed) { revealed = true; }
    if (revealed && flipIdx < cards.children.length) {
      flipT += dt;
      if (flipT > 0.28) {
        flipT = 0; const el = cards.children[flipIdx++]; el.classList.add('flip');
        const sc = el._sc; Audio.sfx(sc.icon === 100 ? 'good' : sc.icon > 0 ? 'ok' : 'bad');
        shown[rows[flipIdx - 1].c.id] = true;
        if (flipIdx === cards.children.length) setTimeout(summary, 500);
      }
    }
    const hh = hours[i];
    clock.textContent = `${String(hh.hour).padStart(2, '0')}:00`;
    const act = {}; for (const id in shown) act[id] = actual[id];
    view.render({ snap: hh.snap, fields, layers: new Set(['sat', 'radar']), cities: cs, actual: act, forecasts: null, time, evac });
  });

  function summary() {
    const avg = Math.round(r.acc.reduce((a, b) => a + b, 0) / r.acc.length);
    const calls = [];
    rows.forEach(({ c, sc }) => {
      const a = actual[c.id], f = fc[c.id];
      if (a.tropicalHit && !evac[c.id]) calls.push([c.name, `${a.icon === 'storm' ? 'The hurricane came straight through' : 'The hurricane hit'} and nobody told us to leave. My house is in the lake now.`]);
      else if (a.tropicalHit && evac[c.id]) calls.push([c.name, 'We evacuated like you said. The storm flattened the boardwalk but everyone is safe. Thank you.']);
      else if (sc.icon === 0 && f.icon === 'sunny' && ['rain', 'storm', 'snow'].includes(a.icon)) calls.push([c.name, `You said sunny. It did NOT do sunny. I am calling from inside a wet sock.`]);
      else if (sc.icon === 0 && ['rain', 'storm'].includes(f.icon) && ['sunny', 'partly'].includes(a.icon)) calls.push([c.name, 'Cancelled the barbecue because you said rain. It was gorgeous. My sausages are in mourning.']);
      else if (sc.icon === 100 && sc.err <= 1) calls.push([c.name, `Bang on! ${a.high}° and ${ICON_NAME[a.icon].toLowerCase()}, just like you said. My whole street watches you now.`]);
    });
    if (wasted) calls.push(['Transit Authority', `We bused ${wasted} town${wasted > 1 ? 's' : ''} away from a hurricane that never came. That's $${wasted * 120} in bus hire.`]);
    sumBox.append(...[
      h('div', { class: 'chyron' }, h('span', {}, last ? 'SEASON FINALE' : `DAY ${last ? r.day : r.day - 1} SCORECARD`)),
      h('div', { style: 'display:flex;gap:18px;align-items:end;margin:14px 0' }, h('div', {}, h('div', { class: 'sub' }, 'Accuracy'), h('div', { class: 'big' }, acc + '%')),
        h('div', {}, h('div', { class: 'sub' }, 'Season average'), h('div', { class: 'big', style: 'font-size:40px' }, avg + '%'), h('div', { class: 'sub' }, `goal ${m.goal}%`))),
      h('div', {}, `Rating ${oldRating.toFixed(1)} → `, h('b', { style: 'color:var(--sun)' }, r.rating.toFixed(1)), ` · delivery ${Math.round(show.delivery * 100)}%`, show.jokeQ >= 2 ? ' · the joke landed' : ' · the joke did not land'),
      h('div', { style: 'margin-top:6px' }, `Sponsors paid `, h('b', { style: 'color:var(--sun)' }, '$' + pay), ` · cash $${S.money}`),
      saved || missed ? h('div', { class: 'unlock' }, `🌀 Hurricane: ${saved} town${saved === 1 ? '' : 's'} evacuated in time${missed ? `, ${missed} caught by surprise` : ''}.`) : null,
      h('div', { class: 'calls' }, calls.slice(0, 4).map(([who, t]) => h('div', { class: 'call' }, h('i', {}, `📞 Caller from ${who}: `), t))),
      newAlm.length ? h('div', { class: 'unlock' }, '📖 New in the almanac: ' + newAlm.map(id => ALMANAC.find(x => x.id === id).name).join(', ')) : null,
      newMail.length ? h('div', { class: 'unlock' }, '✉ Fan mail: ' + newMail.length + ' new letter' + (newMail.length > 1 ? 's' : '')) : null,
      h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;margin-top:14px' },
        last ? h('button', { class: 'btn', onclick: () => seasonEnd() }, 'Season results →') : h('button', { class: 'btn', onclick: () => { Audio.sfx('pick'); showDesk(); } }, `Day ${r.day}: back to the desk →`),
        h('button', { class: 'btn ghost', onclick: () => showShop(() => (last ? seasonEnd() : showDesk())) }, '🛍 Shop'),
        newMail.length ? h('button', { class: 'btn blue', onclick: () => showBook('mail', () => (last ? seasonEnd() : showDesk())) }, '✉ Read mail') : null)].filter(Boolean));
    sumBox.style.opacity = 1;
    Audio.sfx(acc >= 70 ? 'jingle' : 'cash');
    if (acc >= 85) confetti();
    setBar();
  }
}

function seasonEnd() {
  clearLoop(); setBar(); app.innerHTML = '';
  const r = S.run, m = W.market, avg = Math.round(r.acc.reduce((a, b) => a + b, 0) / r.acc.length);
  const won = avg >= m.goal;
  S.best[m.id] = Math.max(S.best[m.id] || 0, avg);
  let text, mailId = null;
  if (won && r.market < MARKETS.length - 1) { S.unlocked = Math.max(S.unlocked, r.market + 1); text = `${MARKETS[r.market + 1].call}-${MARKETS[r.market + 1].channel} saw your tapes. You're hired!`; mailId = r.market === 0 ? 'wiso' : 'kfun'; }
  else if (won) { S.done = true; text = 'You went from four towns and a cow to prime time. You are a weather legend.'; mailId = 'legend'; }
  else text = 'The station did not renew your contract. Your averages were... cloudy. Try the season again: you keep your cash and gear.';
  if (mailId) S.mail[mailId] = 1;
  const bonus = won ? 300 * (r.market + 1) : 0; S.money += bonus;
  S.run = null; save(); setBar();
  if (won) { Audio.sfx('jingle'); confetti(); } else Audio.sfx('bad');
  app.append(h('div', { class: 'screen', style: 'display:grid;place-items:center;min-height:70vh' }, h('div', { class: 'card', style: 'max-width:620px;text-align:center' },
    h('div', { class: 'chyron' }, h('span', {}, won ? 'SEASON WON' : 'CONTRACT NOT RENEWED')),
    h('div', { class: 'big', style: 'font:72px var(--display);color:var(--sun);text-shadow:4px 4px 0 var(--ink);margin:12px 0' }, avg + '%'),
    h('p', { style: 'font-size:19px' }, text), bonus ? h('p', {}, `Season bonus: $${bonus}`) : null,
    h('div', { class: 'menu' }, h('button', { class: 'btn', onclick: showStations }, 'Stations →'), h('button', { class: 'btn ghost', onclick: () => showShop(showStations) }, '🛍 Shop'), mailId ? h('button', { class: 'btn blue', onclick: () => showBook('mail', showStations) }, '✉ New letter') : null))));
}

function confetti() {
  const cv = h('canvas', { style: 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70' }); document.body.append(cv);
  cv.width = innerWidth; cv.height = innerHeight; const x = cv.getContext('2d');
  const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * 300, vy: 2 + Math.random() * 4, vx: (Math.random() - 0.5) * 2, r: Math.random() * 6, c: pick(['#ffd23a', '#ff3b3b', '#3b8bff', '#2fd36b', '#fff']), a: Math.random() * 6 }));
  let n = 0; const f = () => { x.clearRect(0, 0, cv.width, cv.height); for (const p of ps) { p.y += p.vy; p.x += p.vx; p.a += 0.1; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-5, -3, 10, 6); x.restore(); } if (++n < 220) requestAnimationFrame(f); else cv.remove(); }; f();
}

/* ---------- SHOP ---------- */
function showShop(back, tab = 'tools') {
  clearLoop(); setBar(); app.innerHTML = '';
  const tabs = h('div', { class: 'tabs' });
  const grid = h('div', { class: 'grid' });
  const preview = h('canvas', { width: 260, height: 300, style: 'width:200px;height:230px' });
  const drawPrev = () => { const x = preview.getContext('2d'); x.clearRect(0, 0, 260, 300); x.fillStyle = '#00b04a'; x.fillRect(0, 0, 260, 300); drawPresenter(x, 110, 110, 0.75, lookOf(), { point: -0.4, talk: 0.3 }); };
  const sets = { tools: TOOLS, suits: SUITS, hair: HAIRS, props: PROPS };
  const names = { tools: '🛰 Gear', suits: '👔 Suits', hair: '💇 Hair', props: '🐸 Props' };
  const slot = { suits: 'suit', hair: 'hair', props: 'prop' };
  const draw = () => {
    tabs.innerHTML = ''; grid.innerHTML = '';
    for (const k in sets) tabs.append(h('button', { class: k === tab ? 'on' : '', onclick: () => { tab = k; Audio.sfx('click'); draw(); } }, names[k]));
    for (const it of sets[tab]) {
      const have = owned(it.id), equipped = slot[tab] && S.look[slot[tab]] === it.id;
      const blocked = it.needs && !owned(it.needs);
      const b = have ? (slot[tab] ? h('button', { class: 'btn ' + (equipped ? 'ghost' : 'blue'), disabled: equipped, onclick: () => { S.look[slot[tab]] = it.id; save(); Audio.sfx('pick'); draw(); drawPrev(); } }, equipped ? 'Wearing' : 'Wear') : h('button', { class: 'btn ghost', disabled: true }, 'Owned ✓'))
        : h('button', { class: 'btn', disabled: S.money < it.price || blocked, onclick: () => { S.money -= it.price; S.owned[it.id] = 1; if (slot[tab]) S.look[slot[tab]] = it.id; save(); Audio.sfx('cash'); setBar(); draw(); drawPrev(); } }, blocked ? 'Needs BLOBCAST' : `Buy $${it.price}`);
      let art = null;
      if (tab === 'suits') { art = h('canvas', { width: 120, height: 120, style: 'width:90px;height:90px' }); const x = art.getContext('2d'); drawPresenter(x, 60, 52, 0.32, { ...lookOf(), suit: it.suit, tie: it.tie, shirt: it.shirt }, { point: 1.9 }); }
      grid.append(h('div', { class: 'card item' + (have ? ' owned' : '') }, art, h('div', { class: 'nm' }, it.name), h('div', { class: 'd' }, it.desc), have ? null : h('div', { class: 'pr' }, '$' + it.price), b));
    }
  };
  app.append(h('div', { class: 'screen' }, h('div', { style: 'display:flex;gap:16px;align-items:center;flex-wrap:wrap' }, preview, h('div', {}, h('h2', {}, 'Wardrobe & gear'), h('p', { class: 'sub' }, `Cash: $${S.money}. Better gear shows you more of the sky. Better outfits make viewers like you (ratings = sponsor money).`),
    h('button', { class: 'btn ghost', onclick: () => back() }, '← Done'))), tabs, grid));
  drawPrev(); draw();
}

/* ---------- THE BOOKS ---------- */
function showBook(kind, back = showTitle) {
  clearLoop(); setBar(); app.innerHTML = '';
  const grid = h('div', { class: 'grid' });
  if (kind === 'almanac') {
    for (const a of ALMANAC) {
      const got = S.almanac[a.id];
      grid.append(h('div', { class: 'card item entry' + (got ? '' : ' locked') }, got ? iconCanvas(a.icon, 64) : h('div', { class: 'q' }, '?'), h('div', { class: 'nm' }, got ? a.name : '???'), h('div', { class: 'd' }, got ? a.text : 'Not seen yet. It has to really happen in one of your towns.')));
    }
  } else {
    let k = 0;
    for (const [id, l] of Object.entries(MAIL)) {
      const got = S.mail[id];
      grid.append(got ? h('div', { class: 'letter', style: `--r:${(k++ % 3 - 1) * 1.2}deg` }, l.text, h('div', { class: 'from' }, '— ' + l.from)) : h('div', { class: 'card item entry locked' }, h('div', { class: 'q' }, '✉'), h('div', { class: 'd' }, 'A letter you haven\'t earned yet.')));
    }
  }
  const n = kind === 'almanac' ? Object.keys(S.almanac).length + '/' + ALMANAC.length : Object.keys(S.mail).length + '/' + Object.keys(MAIL).length;
  app.append(h('div', { class: 'screen' }, h('h2', {}, kind === 'almanac' ? `📖 The Weather Almanac (${n})` : `✉ Fan mail (${n})`),
    h('p', { class: 'sub' }, kind === 'almanac' ? 'Every kind of weather you have seen happen in your towns.' : 'Letters from viewers. Some are nice.'),
    grid, h('div', { style: 'margin-top:16px' }, h('button', { class: 'btn ghost', onclick: () => back() }, '← Back'))));
}

/* ---------- go ---------- */
if (location.hash === '#test') window.__wx = { S, W: () => W, buildWorld, realTomorrow, cities, startMarket, showDesk };
showTitle();
