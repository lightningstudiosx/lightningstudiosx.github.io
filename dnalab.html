<style>

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.strip { font-size: 11px; letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: clip; color: var(--dim); line-height: 1.3; }

.bA { color: var(--A); } .bC { color: var(--C); } .bG { color: var(--G); } .bT { color: var(--T); }
.base { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #04121f; }

<body>
<div id="app">
  <header id="top">
    <a id="kai" href="index.html">&larr; Kai.fun</a>

    </div>
    <input id="orgName" maxlength="24" aria-label="Specimen name" spellcheck="false">
    <div id="topBtns">
      <button class="ib" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -6)"/></svg></button>
      <button class="ib" id="bRedo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12h2" transform="translate(0 -6)"/></svg></button>
      <button class="ib" id="bGloss" title="Science words on/off" aria-label="Glossary">?</button>
      <button class="ib" id="bSnd" title="Sound on/off" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="ib" id="bGear" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>
    </div>
  </header>
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="viewSw" class="seg small"><button data-v="org">Creature</button><button data-v="helix">Helix</button></div>
    <div id="chips"></div>
    <div id="stageBtns"></div>
    <div id="mutBox">
      <button class="btn rad" id="bMut" title="Zap the genome with random mutations"><i>☢</i> Mutate</button>
      <label class="rate" title="Mutations per zap"><input type="range" id="mutRate" min="1" max="60" value="8"><b id="mutN">8</b></label>
    </div>
    <div id="helixInfo" class="hide"></div>
  </main>
  <aside id="panel">
    <nav id="tabs" role="tablist">
      <button data-t="traits">Traits</button><button data-t="genes">Genes</button><button data-t="dna">DNA</button>
      <button data-t="breed">Breed</button><button data-t="lab">Gallery</button><button data-t="goals">Goals</button>
    </nav>
    <section class="pane" id="p-traits"></section>
    <section class="pane" id="p-genes"></section>
    <section class="pane" id="p-dna"></section>
    <section class="pane" id="p-breed"></section>
    <section class="pane" id="p-lab"></section>
    <section class="pane" id="p-goals"></section>
  </aside>

  <div id="tip" class="hide" role="tooltip"></div>
  <div id="modal" class="hide" role="dialog"><div class="card" id="modalCard"></div></div>
  <div id="boot"><div class="bootLogo"><span class="dna">DNA</span><span class="lab">LAB</span></div><p id="bootMsg">Unzipping chromosomes...</p></div>
</div>
<script>
"use strict";
// ===== util.js =====
{
const DL = window.DL = {};
const Q = new URLSearchParams(location.search);
DL.Q = Q;
DL.TEST = Q.has('test');
DL.TILE = Q.has('tile');
DL.$ = (id) => document.getElementById(id);
DL.h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
DL.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
DL.lerp = (a, b, t) => a + (b - a) * t;
DL.smooth = (a, b, x) => { const t = DL.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
DL.damp = (a, b, k, dt) => b + (a - b) * Math.exp(-k * dt);
DL.isPhone = () => innerWidth < 760;
DL.now = () => performance.now() / 1000;
DL.fmt = (n) => Math.round(n).toLocaleString('en-US');
DL.esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
DL.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const subs = {};
DL.on = (n, f) => { (subs[n] = subs[n] || []).push(f); };
DL.emit = (n, a, b) => { for (const f of subs[n] || []) { try { f(a, b); } catch (e) { console.error(e); } } };
DL.store = {
  get(k, d) { try { const v = localStorage.getItem('dnalab.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dnalab.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('dnalab.' + k); } catch (e) { /* blocked */ } },
};
if (Q.has('reset')) { try { for (const k of Object.keys(localStorage)) if (k.startsWith('dnalab.')) localStorage.removeItem(k); } catch (e) { /* blocked */ } }
DL.rng = (seed) => {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
};
DL.hash = (s) => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; };
DL.rand = DL.rng(Q.has('seed') ? +Q.get('seed') : (Date.now() & 0xffffff));
DL.pick = (arr, r) => arr[((r || DL.rand)() * arr.length) | 0];
DL.newSeed = () => 1 + ((DL.rand() * 0x7ffffff0) | 0);
DL.css = (h, s, l) => 'hsl(' + Math.round(((h % 1) + 1) % 1 * 360) + ',' + Math.round(s * 100) + '%,' + Math.round(l * 100) + '%)';
DL.col = (h, s, l) => new THREE.Color().setHSL(((h % 1) + 1) % 1, DL.clamp(s, 0, 1), DL.clamp(l, 0, 1));
DL.toast = (html, cls, ms) => {
  const box = DL.$('toasts'); if (!box) return;
  const t = DL.h('div', 'toast ' + (cls || ''), html); box.appendChild(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(() => t.classList.add('out'), ms || 3200); setTimeout(() => t.remove(), (ms || 3200) + 500);
};
DL.fire = (el, type) => el && el.dispatchEvent(new Event(type || 'click'));
}
// ===== code.js =====
{
const C = DL.Code = {};
const B = 'TCAG', AA = 'FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const bi = new Int8Array(128).fill(-1);
bi[84] = 0; bi[67] = 1; bi[65] = 2; bi[71] = 3;
C.BASES = 'ACGT';
C.COMP = { A: 'T', T: 'A', C: 'G', G: 'C', N: 'N' };
C.TABLE = {};
for (let i = 0; i < 64; i++) C.TABLE[B[i >> 4] + B[(i >> 2) & 3] + B[i & 3]] = AA[i];
C.aaAt = (s, i) => {
  const a = bi[s.charCodeAt(i)], b = bi[s.charCodeAt(i + 1)], c = bi[s.charCodeAt(i + 2)];
  return (a < 0 || b < 0 || c < 0) ? 'X' : AA[a * 16 + b * 4 + c];
};
C.aa = (codon) => C.TABLE[codon] || 'X';
C.translate = (s, i, max) => {
  let out = '', k = 0;
  for (; k < max; k++, i += 3) {
    if (i + 3 > s.length) return { aa: out, stop: false, end: i };
    const a = C.aaAt(s, i);
    if (a === '*') return { aa: out, stop: true, end: i + 3 };
    out += a;
  }
  return { aa: out, stop: false, capped: true, end: i };
};
C.isStop = (codon) => C.TABLE[codon] === '*';
C.SYN = {};
for (const k in C.TABLE) (C.SYN[C.TABLE[k]] = C.SYN[C.TABLE[k]] || []).push(k);
C.ORDER = 'IVLFCMAGTSWYPHEQDNKR';
C.W = {};
for (let i = 0; i < 20; i++) C.W[C.ORDER[i]] = 1 - i / 19;
C.W.X = 0.5;
C.byW = C.ORDER.split('').map((a) => [a, C.W[a]]);
C.nearestAA = (w) => { let best = 'A', d = 9; for (const [a, x] of C.byW) { const e = Math.abs(x - w); if (e < d) { d = e; best = a; } } return best; };
C.hamming = (a, b) => { let d = 0; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) d++; return d; };
C.closestCodon = (aa, old, r) => {
  let best = null, d = 9;
  for (const c of C.SYN[aa]) { const e = old ? C.hamming(c, old) : (r ? r() * 3 : 0); if (e < d) { d = e; best = c; } }
  return best;
};
C.revcomp = (s) => { let o = ''; for (let i = s.length - 1; i >= 0; i--) o += C.COMP[s[i]] || 'N'; return o; };
C.comp = (s) => { let o = ''; for (let i = 0; i < s.length; i++) o += C.COMP[s[i]] || 'N'; return o; };
C.NAMES = { A: 'Alanine', R: 'Arginine', N: 'Asparagine', D: 'Aspartate', C: 'Cysteine', E: 'Glutamate', Q: 'Glutamine', G: 'Glycine', H: 'Histidine', I: 'Isoleucine',
  L: 'Leucine', K: 'Lysine', M: 'Methionine', F: 'Phenylalanine', P: 'Proline', S: 'Serine', T: 'Threonine', W: 'Tryptophan', Y: 'Tyrosine', V: 'Valine', X: '?', '*': 'STOP' };
C.SHORT = { A: 'Ala', R: 'Arg', N: 'Asn', D: 'Asp', C: 'Cys', E: 'Glu', Q: 'Gln', G: 'Gly', H: 'His', I: 'Ile', L: 'Leu', K: 'Lys', M: 'Met', F: 'Phe', P: 'Pro', S: 'Ser', T: 'Thr', W: 'Trp', Y: 'Tyr', V: 'Val', X: '???', '*': 'STOP' };
C.BASECOL = { A: '#3ddc84', T: '#ff5a6e', G: '#ffc93c', C: '#4aa8ff', N: '#888' };
C.aaCol = (a) => (a === '*' ? '#ff3b3b' : a === 'M' ? '#7dffb0' : DL.css(0.62 - 0.55 * (C.W[a] == null ? 0.5 : C.W[a]), 0.75, 0.62));
C.TATA = 'TATAAAAG';
C.GCBOX = 'GGGCGG';
C.TATA_E = [0, 0, 0, 0, 0.04, 0.16, 0.42, 0.74, 1];
C.promoter = (win) => {
  let best = 0, at = -1;
  for (let o = 0; o + 8 <= win.length; o++) {
    let m = 0; for (let k = 0; k < 8; k++) if (win.charCodeAt(o + k) === C.TATA.charCodeAt(k)) m++;
    if (m > best) { best = m; at = o; }
  }
  const gc = win.indexOf(C.GCBOX);
  return { score: best, at, gc, expr: C.TATA_E[best] * (gc >= 0 ? 1.3 : 1) };
};
}
// ===== reg_blob.js =====
{
const RG = DL.Reg = { genes: {}, list: [], CHR: {}, KIND: { blob: 'b', plant: 'p' } };
RG.g = (k, id, c, n, t, m, d, w, o) => {
  const def = Object.assign({ k, id, c, n, t, m, d, w, ko: 0, L: 20 + (DL.hash('L' + id) % 15), pr: 0, gc: DL.hash('gc' + id) % 4 === 0 }, o || {});
  RG.genes[id] = def; RG.list.push(def); return def;
};
RG.CHR.blob = ['Body', 'Colour', 'Face', 'Limbs', 'Armour & Glow', 'Mind'];
const g = (...a) => RG.g('blob', ...a);
g('SIZE', 0, 'Body Size', 'How big the blob grows.', 'd', 'bl', [0.25, 0.8], { st: 0.5, ko: 0.08, e: ['Tiny', 'Huge'], ic: '📏' });
g('SQSH', 0, 'Squishiness', 'How jiggly and wobbly the body is.', 's', 'bl', [0.2, 0.95], { st: 0.7, ko: 0.1, e: ['Firm', 'Jelly'], ic: '🍮' });
g('TRAN', 0, 'See-Through', 'How transparent the skin is. See the organs inside!', 'd', 'rec', [0, 0.35], { st: 0.06, p: 0.15, e: ['Solid', 'Glassy'], ic: '🫥' });
g('SHAP', 0, 'Body Shape', 'Squat and flat, round, or tall like a gumdrop.', 's', 'bl', [0.2, 0.8], { st: 0.45, ko: 0.5, e: ['Flat', 'Tall'], ic: '🥚' });
g('SKIN', 0, 'Skin Texture', 'Smooth, bumpy or warty skin.', 'd', 'rec', [0, 0.55], { st: 0.12, e: ['Smooth', 'Warty'], ic: '🐸' });
g('GLOS', 0, 'Glossiness', 'Matte like clay or shiny like a jelly bean.', 's', 'bl', [0.15, 0.95], { st: 0.7, ko: 0.1, e: ['Matte', 'Shiny'], ic: '✨' });
g('BELY', 0, 'Belly Patch', 'A paler patch on the tummy.', 'd', 'dom', [0, 0.9], { st: 0.55, e: ['None', 'Big'], ic: '🫃' });
g('PIGM', 1, 'Pigment Master', 'A regulator: switches on all the colour genes. Break it and the blob turns albino.', 's', 'dom', [0.55, 0.9], { st: 0.75, reg: ['SAT', 'PATT', 'PHUE', 'PSCL'], ic: '🎛️' });
g('HUE', 1, 'Body Colour', 'The main colour of the skin (red, orange, yellow, green, blue, purple...).', 's', 'bl', [0, 1], { st: 0.94, ko: 0.08, hue: 1, ic: '🎨' });
g('SAT', 1, 'Colour Strength', 'Pastel or super vivid.', 'd', 'bl', [0.35, 0.95], { st: 0.72, e: ['Grey', 'Vivid'], ic: '🌈' });
g('LUM', 1, 'Brightness', 'Dark and moody or light and bright.', 's', 'bl', [0.25, 0.8], { st: 0.62, ko: 0.6, e: ['Dark', 'Light'], ic: '💡' });
g('PATT', 1, 'Pattern', 'Spots, stripes, a gradient or a whole galaxy.', 's', 'dom', [0, 1], { st: 0.2, lab: ['Plain', 'Spots', 'Stripes', 'Gradient', 'Galaxy', 'Patches', 'Swirl'], ic: '🐆' });
g('PHUE', 1, 'Pattern Colour', 'The colour of the spots or stripes.', 's', 'bl', [0, 1], { st: 0.8, ko: 0.1, hue: 1, ic: '🖌️' });
g('PSCL', 1, 'Pattern Size', 'Tiny freckles or giant blotches.', 's', 'bl', [0.2, 0.8], { st: 0.45, ko: 0.5, e: ['Fine', 'Bold'], ic: '🔍' });
g('RAIN', 1, '???', 'A secret gene...', 's', 'dom', [0.6, 0.8], { sec: 'Rainbow Shimmer', st: 0.7, ic: '🦄', hint: 'Wakes up in a glowing galaxy.' });
g('EYEN', 2, 'Eye Number', 'How many eyes. Up to seven!', 'd', 'bl', [0.1, 0.6], { st: 2 / 7, cnt: [0, 7], ic: '👀' });
g('EYES', 2, 'Eye Size', 'Beady little eyes or huge cartoon eyes.', 'd', 'bl', [0.25, 0.85], { st: 0.55, ko: 0.1, e: ['Beady', 'Huge'], ic: '👁️' });
g('EYEP', 2, 'Eye Placement', 'Eyes close together, wide apart, or all around the body.', 's', 'bl', [0.1, 0.7], { st: 0.3, ko: 0.3, e: ['Close', 'All around'], ic: '🎯' });
g('IRIS', 2, 'Iris Colour', 'The colour in the middle of the eye.', 's', 'bl', [0, 1], { st: 0.55, ko: 0.08, hue: 1, ic: '🔵' });
g('MOUT', 2, 'Mouth', 'What kind of mouth: smile, grin, fangs, a beak...', 's', 'dom', [0, 1], { st: 0.07, lab: ['Smile', 'Grin', 'Ooh', 'Fangs', 'Beak', 'Tongue', 'Frown'], ic: '👄' });
g('MSIZ', 2, 'Mouth Size', 'A tiny smile or a mouth from ear to ear.', 'd', 'bl', [0.25, 0.75], { st: 0.45, ko: 0.2, e: ['Tiny', 'Huge'], ic: '😮' });
g('BLSH', 2, 'Blush', 'Rosy cheeks.', 'd', 'dom', [0, 0.9], { st: 0.6, e: ['None', 'Rosy'], ic: '😊' });
g('LASH', 2, 'Eyelashes', 'Long fluttery eyelashes.', 'd', 'rec', [0, 0.6], { st: 0.15, p: 0.25, e: ['None', 'Long'], ic: '🪶' });
g('MUST', 2, '???', 'A secret gene...', 's', 'dom', [0.6, 0.8], { sec: 'Grand Moustache', st: 0.7, ic: '🥸', hint: 'Only a grumpy, furry blob grows this.' });
g('HOX', 3, 'Limb Master', 'A regulator (like real Hox genes): switches on legs, tentacles, wings, tail and antennae.', 's', 'dom', [0.55, 0.9], { st: 0.75, reg: ['LEGN', 'LEGL', 'TENN', 'TENL', 'WING', 'TAIL', 'ANTN', 'ANTL'], ic: '🧭' });
g('LEGN', 3, 'Leg Number', 'Little stubby legs. More legs, more scuttling.', 'd', 'bl', [0, 0.07], { st: 0, cnt: [0, 6], p: 0.3, ic: '🦵' });
g('LEGL', 3, 'Leg Length', 'Stubby or long and stilty.', 'd', 'bl', [0.2, 0.7], { st: 0.35, ko: 0.1, e: ['Stubby', 'Stilts'], ic: '📐' });
g('TENN', 3, 'Tentacles', 'Wiggly tentacles, like an octopus.', 'd', 'bl', [0, 0.05], { st: 0, cnt: [0, 8], p: 0.25, ic: '🐙' });

const helix = (x, W, H, cy, amp, t) => {

    const cols = ['#3ddc84', '#ff5a6e', '#ffc93c', '#4aa8ff'], c1 = cols[i % 4], c2 = cols[(i + 1) % 4];
    x.globalAlpha = 0.5 + 0.3 * Math.abs(depth); x.lineWidth = 9; x.lineCap = 'round';
    x.strokeStyle = c1; x.beginPath(); x.moveTo(px, y1); x.lineTo(px, (y1 + y2) / 2); x.stroke();
    x.strokeStyle = c2; x.beginPath(); x.moveTo(px, (y1 + y2) / 2); x.lineTo(px, y2); x.stroke();
  }

  }
};

  };

{
const fail = (msg) => { const b = DL.$('bootMsg'); if (b) b.innerHTML = msg; };
let last = 0, time = 0;
const frame = (now) => {
  requestAnimationFrame(frame);
  const ms = last ? now - last : 16.7; last = now;
  const dt = Math.min(0.05, ms / 1000); time += dt;
  if (!document.hidden) DL.R.mark(ms);
  const c0 = performance.now();
  DL.Orbit.update(dt);
  DL.Stage.update(dt, time);
  DL.Stage.render();
  DL.R.cpu.push(performance.now() - c0); if (DL.R.cpu.length > 240) DL.R.cpu.shift();
  if (!window.DL_READY) { window.DL_READY = true; const b = DL.$('boot'); if (b) { b.classList.add('out'); setTimeout(() => b.remove(), 700); } DL.emit('ready'); }
};
const boot = () => {
  if (!window.THREE) return fail('Could not load the 3D engine. Check your connection and refresh.');
  DL.restore();
  if (!DL.R.init()) return fail('Your browser could not start WebGL (3D graphics). Try another browser.');
  DL.Orbit.init();
  DL.Stage.init();
  if (DL.UI) DL.UI.init();

  if (DL.TILE && DL.Tile) DL.Tile.setup();

};
