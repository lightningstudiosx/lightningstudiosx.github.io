<script>
"use strict";
// ===== util.js =====
{
const HMF = window.HMF = {};
HMF.Q = new URLSearchParams(location.search);
HMF.$ = (id) => document.getElementById(id);
HMF.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
HMF.clamp = (x, a, b) => x < a ? a : x > b ? b : x;
HMF.lerp = (a, b, t) => a + (b - a) * t;
HMF.ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
HMF.smooth = (t) => t * t * (3 - 2 * t);
HMF.isTouch = () => matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
HMF.isPhone = () => Math.min(innerWidth, innerHeight) < 560 || (HMF.isTouch() && Math.max(innerWidth, innerHeight) < 1000);
HMF.esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
HMF.hash = (s) => { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; };
HMF.rng = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const KEY = 'howmanyfit.v1';
HMF.S = { muted: false, seen: {}, streak: 0, best: 0, guesses: 0, daily: {}, total: 0 };
HMF.load = () => {
if (HMF.Q.has('reset')) { try { localStorage.removeItem(KEY); } catch (e) { } return; }
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) Object.assign(HMF.S, s); } catch (e) { }
};
HMF.save = () => { try { localStorage.setItem(KEY, JSON.stringify(HMF.S)); } catch (e) { } };
let toastT = 0;
HMF.toast = (msg, ms) => {
const t = HMF.$('toast'); t.textContent = msg; t.classList.add('on');
clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2200);
};
HMF.todayKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
HMF.ringArea = (a, b) => Math.PI * a * b;
HMF.profileVolume = (prof, y1) => {
let v = 0;
for (let i = 0; i < prof.length - 1; i++) {

{
const F = HMF.F = {};
const NAMES = ['', 'thousand', 'million', 'billion', 'trillion', 'quadrillion', 'quintillion', 'sextillion', 'septillion', 'octillion',

F.commas = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
F.count = (n) => {
if (!isFinite(n)) return '∞';
if (n < 1e15) return F.commas(n);

F.words = (n, dp) => {

const v = n / Math.pow(10, k * 3), d = dp != null ? dp : v < 10 ? 2 : v < 100 ? 1 : 0;

F.short = (n) => {
if (n < 1000) return F.commas(n);
if (n < 1e6) return (+(n / 1e3).toPrecision(3)) + 'k';
if (n < 1e9) return (+(n / 1e6).toPrecision(3)) + 'M';
if (n < 1e12) return (+(n / 1e9).toPrecision(3)) + 'B';
if (n < 1e15) return (+(n / 1e12).toPrecision(3)) + 'T';
return F.sci(n);
};
F.sci = (n, p) => { const e = Math.floor(Math.log10(n)), m = n / Math.pow(10, e); return (+m.toFixed(p == null ? 2 : p)) + '×10' + F.sup(e); };
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
F.sup = (e) => String(e).split('').map((c) => SUP[c]).join('');
F.approx = (n) => {
if (n < 1) return '0';
if (n < 100) return F.commas(Math.floor(n));
const e = Math.floor(Math.log10(n)), p = Math.pow(10, e - 2), r = Math.round(n / p) * p;
return n < 1e6 ? F.commas(r) : F.words(r);
};
F.len = (m) => {
const a = Math.abs(m);
if (a < 0.01) return +(m * 1000).toPrecision(2) + ' mm';
if (a < 1) return +(m * 100).toPrecision(3) + ' cm';
if (a < 1000) return +m.toPrecision(3) + ' m';
if (a < 1e9) return F.big(m / 1000) + ' km';
if (a < 9.46e15 * 0.1) return F.big(m / 1.496e11) + ' AU';

F.big = (x) => x < 1e4 ? (+x.toPrecision(3)).toLocaleString('en-US') : x < 1e6 ? F.commas(Math.round(x / 10) * 10) : F.words(x);

if (m3 < 1e-6) return +(m3 * 1e9).toPrecision(3) + ' mm³';
if (m3 < 1e-3) return +(m3 * 1e6).toPrecision(3) + ' cm³';
if (m3 < 1) return +(m3 * 1000).toPrecision(3) + ' L';
if (m3 < 1e7) return F.big(m3) + ' m³';
return F.big(m3 / 1e9) + ' km³';
};
F.area = (m2) => {
if (m2 < 1e-4) return +(m2 * 1e6).toPrecision(3) + ' mm²';
if (m2 < 1) return +(m2 * 1e4).toPrecision(3) + ' cm²';
if (m2 < 1e6) return F.big(m2) + ' m²';
return F.big(m2 / 1e6) + ' km²';
};
F.dur = (s) => {
if (s < 120) return Math.round(s) + ' seconds';
if (s < 7200) return Math.round(s / 60) + ' minutes';
if (s < 172800) return Math.round(s / 3600) + ' hours';

F.plural = (n, one, many) => (Math.round(n) === 1 ? one : many);

{
const M = HMF.M = {};
const F = HMF.F;
M.footprint = (it) => {
if (it.id === 'person') return 0.25;
const s = it.size.slice().sort((a, b) => b - a);
if (it.body === 'box') return s[0] * s[1];
if (it.body === 'cylz') return Math.PI * (it.size[0] / 2) ** 2;
if (it.body === 'cyl') return Math.PI * (it.size[0] / 2) ** 2;
const d = (s[0] + s[1]) / 2; return Math.PI * d * d / 4;
};
M.phi2 = (it, ord) => it.body === 'box' ? (ord ? 1.0 : 0.9) : (ord ? 0.9069 : 0.82);
M.depth = (c) => c.shape === 'box' ? c.h : c.shape === 'prof' ? c.top - c.y0 : 1e9;
M.calc = (c, it, ord) => {
const r = { c, it, ord: !!ord, n: 0, raw: 0, phi: 0, mode: 'vol', lines: [], note: '' };
const cn = '<b>' + HMF.esc(c.name) + '</b>', inm = HMF.esc(it.name);
if (it.stand && (c.shape === 'area' || c.shape === 'sphere' || M.depth(c) >= 1.75)) {
r.mode = 'stand'; r.phi = it.stand; r.raw = c.floor * it.stand; r.n = Math.floor(r.raw);
const what = c.shape === 'sphere' ? 'surface' : c.shape === 'area' ? 'land' : 'floor';
r.lines.push(cn + ' ' + what + ' ' + F.area(c.floor) + ' × ' + it.stand + ' people per m²');
r.lines.push('= <b>' + F.approx(r.n) + '</b> people standing <span class="c">(packed tight, not dangerous)</span>');
return r;
}
if (c.shape === 'area') {
r.mode = 'area'; const fp = M.footprint(it); r.phi = M.phi2(it, ord); r.raw = c.A / fp; r.n = Math.floor(r.raw * r.phi);
r.lines.push(cn + ' ' + F.area(c.A) + ' × ' + r.phi.toFixed(2) + ' ÷ ' + inm + ' footprint ' + F.area(fp));
r.lines.push('= <b>' + F.approx(r.n) + '</b> <span class="c">in one layer, ' + (ord ? 'neatly tiled' : 'scattered edge to edge') + '</span>');
if (it.dmin > 1000) { r.n = 0; r.note = 'big'; }
return r;
}
r.phi = ord ? it.ord : it.phi; r.raw = c.vol / it.vol;
if (it.dmin > c.inner * 0.98) { r.n = 0; r.note = 'big'; }
else r.n = Math.floor(r.raw * r.phi);
if (r.n < 1 && !r.note) r.note = 'big';
r.lines.push(cn + ' inside ' + F.vol(c.vol) + ' × ' + r.phi.toFixed(2) + ' ÷ ' + inm + ' ' + F.vol(it.vol));
r.lines.push('= <b>' + (r.n ? F.approx(r.n) : '0') + '</b> <span class="c">' + (ord ? (it.ordLabel || 'stacked neatly') : 'poured in at random') + '</span>');
return r;
};
M.byVolume = (c, it) => c.shape === 'area' ? c.A / M.footprint(it) : c.vol / it.vol;
M.flip = (c, it) => {
const cv = c.shape === 'area' ? null : c.vol;
return cv ? it.vol / cv : null;
};
M.funLines = (r) => {
const out = [], n = r.n, it = r.it;
if (n < 1) return out;
const [cn, cl] = HMF.nearest(HMF.COUNTS, n), ratio = n / cn;
out.push(ratio > 0.85 && ratio < 1.18 ? 'About as many as the ' + cl + '.' :
ratio >= 1.25 ? 'That is ' + M.times(ratio) + '× the number of ' + cl + ' (' + F.short(cn) + ').' :
'That is ' + Math.round(ratio * 100) + '% of the ' + F.short(cn) + ' ' + cl + '.');
const line = n * it.d, [lm, ll] = HMF.nearest(HMF.LENGTHS, line);
out.push('In a single line they would stretch ' + F.len(line) + (line / lm > 0.7 && line / lm < 1.5 ? ' (about ' + ll + ')' :
line > lm ? ' (' + M.times(line / lm) + '× ' + ll + ')' : ' (' + Math.round(line / lm * 100) + '% of ' + ll + ')') + '.');
const kg = n * it.kg, [mk, ml] = HMF.nearest(HMF.MASSES, kg);
out.push('Together they weigh ' + M.mass(kg) + ', ' + (kg / mk > 0.7 && kg / mk < 1.5 ? 'about the same as ' + ml : kg > mk ? M.times(kg / mk) + '× ' + ml : Math.round(kg / mk * 100) + '% of ' + ml) + '.');
out.push('Counting them at one per second would take ' + F.dur(n) + '.');
const h = HMF.hash(r.c.id + it.id), a = h % 4, b = (a + 1 + (h >>> 3) % 3) % 4;
return [out[a], out[b]];
};
M.times = (x) => x < 10 ? (+x.toFixed(1)).toString() : F.approx(x);
M.mass = (kg) => kg < 1 ? Math.round(kg * 1000) + ' g' : kg < 1000 ? (+kg.toPrecision(3)) + ' kg' : kg < 1e9 ? F.big(kg / 1000) + ' tonnes' : F.words(kg / 1000) + ' tonnes';
M.score = (guess, ans) => {
if (ans < 1) return { pts: guess < 1 ? 100 : 0, err: guess < 1 ? 0 : 9, x: 0 };
const err = Math.abs(Math.log10(Math.max(1, guess) / ans));

};
M.verdict = (s) => s.err < 0.04 ? 'BULLSEYE!' : s.err < 0.1761 ? 'Within 1.5×. Superb.' : s.err < 0.30103 ? 'Within 2×. Great guess.' :
s.err < 0.699 ? 'Within 5×. Not bad.' : s.err < 1 ? 'Within 10×. Right ballpark.' : s.err < 2 ? 'Off by ' + F.approx(s.x) + '×.' : 'Way off: ' + F.short(s.x) + '× out.';

const list = HMF.CONTS.map((c) => ({ c, r: M.calc(c, it) })).sort((a, b) => (a.c.vol || a.c.A * 1) - (b.c.vol || b.c.A * 1));

const win = vols.find((x) => x.r.n >= N) || null;
const need = N * it.vol / it.phi, cube = Math.cbrt(need);
return { list: vols, win, need, cube, N, it, frac: win ? N / win.r.n : 1 };

R.clearWorld(); R.W = 1; R.world.scale.setScalar(1); R.setScene('studio'); R.scene.fog = null; R.scene.background = new THREE.Color(0x15110d);
R.envIntensity = 0.9; R.sun.intensity = 3.2; R.sunDir.set(-0.35, 1, 0.55).normalize();
const s = 0.0034, m = TL.mask(W, H), rnd = HMF.rng(2026), at = (x, y) => m[(Math.round(y) * W + Math.round(x)) * 4] > 128;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W * s * 1.6, H * s * 1.6), HMF.C.pbrMat(fl, [7, 3.5], { roughness: 0.7, color: 0x6b4a32 }));

const pick = (x, y) => y < 400 ? (x < 745 ? 0 : 1) : (x < 1075 ? 3 : 2); // HOW lemons, MANY apples, FIT golf balls, ? limes
const lists = kits.map(() => []), e = new THREE.Euler(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1);
for (let layer = 0; layer < 3; layer++) {
for (let k = 0; k < 70000; k++) {
const x = rnd() * W, y = rnd() * H; if (!at(x, y)) continue;
let ki = pick(x, y); if (ki === 1 && rnd() < 0.18) ki = 4; if (ki === 3 && rnd() < 0.08) ki = 5;
const it = its[ki], dpx = it.d / s, inner = at(x - dpx * 0.5, y) && at(x + dpx * 0.5, y) && at(x, y - dpx * 0.5) && at(x, y + dpx * 0.5);
if (layer > 0 && !inner) continue;
const px = (x - W / 2) * s, pz = (y - H / 2) * s, list = lists[ki];
if (list.some((o) => (o.x - px) ** 2 + (o.z - pz) ** 2 < (it.d * 0.8) ** 2 && Math.abs(o.l - layer) < 1)) continue;
e.set(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28); q.setFromEuler(e);
list.push({ x: px, z: pz, l: layer, m: new THREE.Matrix4().compose(new THREE.Vector3(px, it.d * (0.48 + layer * 0.62), pz), q, one) });
}
}
kits.forEach((kit, i) => { const inst = HMF.K.instanced(kit, Math.max(1, lists[i].length)); lists[i].forEach((o, j) => inst.set(j, o.m)); inst.count(lists[i].length); R.world.add(inst.group); });
TL.counts = lists.map((l) => l.length);
R.ctl.enabled = false; R.ctl.autoRotate = false;
const fov = 30, d = (H * s / 2) / Math.tan(fov / 2 * Math.PI / 180) * 1.02;
R.cam.fov = fov; R.cam.aspect = W / H; R.cam.updateProjectionMatrix();
R.camTo(new THREE.Vector3(0, 0, 0.02), d, 0, 78, true);
R.cam.lookAt(0, 0, 0.02);
setTimeout(() => { window.TILE_READY = true; }, 1200);
});
};
TL.render = () => { HMF.R.renderer.render(HMF.R.scene, HMF.R.cam); return HMF.R.renderer.domElement.toDataURL('image/png'); };
}
// ===== thumbmaker.js =====
{

for (let y = 0; y < PX * 2; y++) im.data.set(px.subarray((PX * 2 - 1 - y) * PX * 8, (PX * 2 - y) * PX * 8), y * PX * 8);
bx.putImageData(im, 0, 0);

TH.item = (it) => HMF.K.get(it).then((kit) => {

sc.add(new THREE.HemisphereLight(0xffffff, 0x303030, 0.6)); const dl = new THREE.DirectionalLight(0xfff1dd, 3); dl.position.set(1, 2, 1.5); sc.add(dl);

TH.cont = (c) => {

R.world.scale.setScalar(R.W); R.setScene(c.scene); R.world.add(b.group);

const v = HMF.FL.views(c), cam = new THREE.PerspectiveCamera(36, 1, 0.01, 1e6);

if (b.cut) HMF.C.updateCutaway(b.group);

});
};
TH.run = () => {
const out = {}; let chain = Promise.resolve();
HMF.ITEMS.forEach((it) => { chain = chain.then(() => TH.item(it)).then((u) => { out['i:' + it.id] = u; }); });
HMF.CONTS.forEach((c) => { chain = chain.then(() => TH.cont(c)).then((u) => { out['c:' + c.id] = u; }); });
return chain.then(() => out);
};
}

{
