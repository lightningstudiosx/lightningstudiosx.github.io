<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Domino Architect · Kai.fun</title>
<meta name="description" content="Design enormous domino runs on a blueprint table: paths, spirals, stairs, bridges, bells, see-saws, catapults, buckets, towers and pixel-art walls. Push the first domino and watch the chain reaction. 18 puzzles, an endless commission mode, a sandbox, a gallery and share codes.">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Architects+Daughter&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
/* ART DIRECTION: "Blueprint Atelier" - an architect's drafting table at night.
   The board is a cyanotype blueprint sheet; dominoes are glossy candy lacquer;
   the interface is vellum paper, drafting tape and ink, with buttons shaped like domino tiles. */
:root{
  --ink:#16345f;--ink2:#2d5a94;--bp:#1d4f8f;--bp2:#123766;--bp3:#0b2343;
  --vellum:#f7f1e3;--vellum2:#efe6d0;--tape:#ffd45c;--tape2:#ffb84a;
  --red:#ff4f45;--red2:#d8322b;--mint:#2fd3a0;--sky:#57c3ff;--gold:#ffc93c;
  --lac:#1c1d26;--lac2:#2c2e3c;--pip:#f4efe3;
  --txt:#13294d;--dim:#5c6f8f;
  --ui:"Nunito",system-ui,"Segoe UI",sans-serif;--disp:"Bungee","Nunito",system-ui,sans-serif;--hand:"Architects Daughter","Nunito",cursive;
  --sh:0 2px 0 rgba(10,25,50,.25),0 8px 22px rgba(3,12,30,.35);
  --safeb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bp3)}
body{font-family:var(--ui);color:var(--txt);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;font-weight:700}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;font-weight:800;-webkit-tap-highlight-color:transparent;cursor:pointer}
svg{display:block}
/* back link */
#kai{position:fixed;left:10px;top:10px;z-index:40;font-weight:900;font-size:14px;color:var(--ink);text-decoration:none;background:var(--vellum);padding:8px 13px 8px 11px;border-radius:10px;box-shadow:var(--sh);line-height:1;border:2px solid var(--ink)}
#kai:hover{background:var(--tape)}
/* domino-tile buttons */
.tb{appearance:none;border:0;background:var(--lac);color:var(--pip);border-radius:12px;font-size:16px;padding:10px 18px;min-height:46px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14),var(--sh);transition:transform .1s,background .2s;line-height:1.1;letter-spacing:.02em;position:relative}
.tb:hover{background:var(--lac2);transform:translateY(-1px)}
.tb:active{transform:translateY(1px)}
.tb:disabled{opacity:.4;cursor:default;transform:none}
.tb.red{background:linear-gradient(180deg,#ff6a5c,var(--red2));color:#fff}
.tb.gold{background:linear-gradient(180deg,#ffe07a,#f2a922);color:#3a2200}
.tb.mint{background:linear-gradient(180deg,#55e8b8,#1aa97c);color:#06301f}
.tb.paper{background:var(--vellum);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(20,40,80,.18),0 0 0 2px var(--ink),var(--sh)}
.tb.paper:hover{background:#fff7dc}
.tb.big{font-size:20px;padding:14px 26px;min-height:58px;border-radius:15px}
/* tiny pips decoration on tile buttons */
.tb .pp{position:absolute;right:7px;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(2,4px);gap:3px;opacity:.55}
.tb .pp i{width:4px;height:4px;border-radius:50%;background:currentColor;display:block}
/* ---------- title ---------- */
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none;padding:60px 12px 22px;background:radial-gradient(ellipse at 50% 42%,rgba(6,20,45,.0) 0%,rgba(6,20,45,.0) 35%,rgba(4,14,32,.55) 100%)}
#tWord{display:flex;flex-direction:column;align-items:center;gap:8px;filter:drop-shadow(0 10px 18px rgba(0,8,25,.55))}
.tRow{display:flex;gap:6px;perspective:700px}
.tL{width:62px;height:96px;border-radius:9px;background:linear-gradient(180deg,#2a2c39,#15161e);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.5),0 3px 0 #07080c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-size:46px;color:var(--pip);position:relative;transform-origin:50% 100%;transform-style:preserve-3d}
.tL::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:2px;background:rgba(244,239,227,.16)}
.tL b{position:relative;z-index:1;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.tL.c1{color:#ff7a6c}.tL.c2{color:#ffd45c}.tL.c3{color:#5fe0b5}.tL.c4{color:#7cc8ff}.tL.c5{color:#ff9ad0}
.tL.fall{animation:topple 3.6s cubic-bezier(.5,0,.75,0) infinite}
@keyframes topple{0%,58%{transform:rotateX(0)}70%{transform:rotateX(-62deg)}76%{transform:rotateX(-54deg)}88%{transform:rotateX(-54deg)}100%{transform:rotateX(0)}}
.tRow.small .tL{width:50px;height:78px;font-size:36px}
.tsub{font-family:var(--hand);font-size:21px;color:#dcecff;text-shadow:0 2px 8px rgba(0,0,0,.8);text-align:center;letter-spacing:.02em}
.tmenu{display:grid;grid-template-columns:1fr 1fr;gap:12px;pointer-events:auto;width:min(520px,92vw)}
.tmenu .tb.red{grid-column:1/-1}
.tfoot{font-family:var(--hand);font-size:15px;color:#bcd3f2;text-shadow:0 1px 6px #000;text-align:center;opacity:.9}
/* ---------- HUD ---------- */
#chip{position:fixed;top:10px;left:112px;z-index:30;background:var(--vellum);border:2px solid var(--ink);border-radius:10px;padding:6px 14px 6px 12px;box-shadow:var(--sh);max-width:calc(100vw - 560px);min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--disp);font-size:15px;color:var(--ink);line-height:1.25;cursor:default}
#chip small{display:block;font-family:var(--hand);font-size:13px;color:var(--dim);letter-spacing:0;line-height:1.1}
#topR{position:fixed;top:8px;right:8px;z-index:30;display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.ib{appearance:none;border:0;background:var(--vellum);color:var(--ink);min-width:42px;height:42px;border-radius:11px;box-shadow:inset 0 -3px 0 rgba(20,40,80,.16),0 0 0 2px var(--ink),var(--sh);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 9px;font-size:14px;transition:transform .1s,background .2s}
.ib:hover{background:#fff7dc}.ib:active{transform:translateY(1px)}
.ib:disabled{opacity:.38;cursor:default}
.ib.on{background:var(--tape)}
.ib svg{width:22px;height:22px;flex:none}
.ib .lbl{font-size:13px}
.sep{width:4px}
#mute.off .wave{display:none}#mute .x{display:none}#mute.off .x{display:block}
/* goals card - looks like a drafting note taped on */
#goals{position:fixed;top:62px;left:10px;z-index:25;width:250px;background:var(--vellum);border-radius:6px;box-shadow:var(--sh);padding:12px 14px 10px;font-size:14px;color:var(--ink);transform:rotate(-.6deg)}
#goals::before{content:"";position:absolute;left:50%;top:-9px;width:70px;height:18px;margin-left:-35px;background:rgba(255,212,92,.85);transform:rotate(2deg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
#goals h4{font-family:var(--hand);font-size:17px;margin-bottom:4px;line-height:1.15}
#goals .gl{display:flex;gap:7px;align-items:center;margin:4px 0;font-size:14px;line-height:1.2}
#goals .ck{width:18px;height:18px;border:2px solid var(--ink);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff}
#goals .gl.done .ck{background:var(--mint);border-color:#108a62}
#goals .par{font-family:var(--hand);font-size:14px;color:var(--dim);margin-top:6px;border-top:1px dashed rgba(22,52,95,.3);padding-top:5px}
#goals .gx{position:absolute;right:6px;top:4px;border:0;background:none;font-size:16px;color:var(--dim);padding:2px 6px}
#goals.min{width:auto;padding:8px 34px 8px 12px}#goals.min .gbody{display:none}
/* run readout */
#readout{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:24;display:flex;gap:8px;pointer-events:none}
.rd{background:rgba(12,30,58,.82);color:#e8f3ff;border-radius:10px;padding:6px 14px;font-size:15px;box-shadow:0 0 0 2px rgba(150,200,255,.35),var(--sh);white-space:nowrap;font-variant-numeric:tabular-nums}
.rd b{font-family:var(--disp);font-size:20px;color:var(--tape);font-weight:400}
.rd.ok b{color:#6dffc6}
/* GO + run controls */
#goWrap{position:fixed;right:16px;bottom:calc(112px + var(--safeb));z-index:26;display:flex;flex-direction:column;align-items:center;gap:8px}
#go{width:86px;height:86px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 32%,#ff8a7c,#ff3b31 55%,#b8211b);color:#fff;font-family:var(--disp);font-size:26px;box-shadow:0 7px 0 #7d140f,0 12px 26px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s;letter-spacing:.02em}
#go:active{transform:translateY(5px);box-shadow:0 2px 0 #7d140f,0 6px 16px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.35)}
#go.reset{background:radial-gradient(circle at 40% 32%,#fff3c2,#ffc93c 55%,#d18a00);color:#4a2b00;box-shadow:0 7px 0 #8a5a00,0 12px 26px rgba(0,0,0,.45),inset 0 3px 0 rgba(255,255,255,.5);font-size:19px}
#runCtl{display:flex;flex-direction:column;gap:6px}
#runCtl .ib{width:86px}
/* properties strip */
#props{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--safeb));z-index:26;display:flex;gap:10px;align-items:center;background:rgba(247,241,227,.96);border-radius:12px;padding:6px 10px;box-shadow:0 0 0 2px var(--ink),var(--sh);max-width:calc(100vw - 140px);overflow-x:auto;scrollbar-width:none}
#props::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--vellum2);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:none;border-radius:7px;padding:6px 10px;font-size:13px;color:var(--ink);min-height:34px;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--vellum)}
.sw{display:flex;gap:4px;flex:none}
.sw button{width:26px;height:26px;border-radius:7px;border:2px solid rgba(0,0,0,.25);padding:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.sw button.on{outline:3px solid var(--ink);outline-offset:1px}
.sw button.rb{background:conic-gradient(#ff5a4e,#ffd23f,#8fdc4a,#33d6a6,#3fb8ff,#9b5cff,#ff6fb5,#ff5a4e)}
.pl{font-family:var(--hand);font-size:14px;color:var(--dim);white-space:nowrap;flex:none}
.pb{border:0;background:var(--lac);color:var(--pip);border-radius:9px;min-height:34px;min-width:34px;padding:0 9px;font-size:13px;display:flex;align-items:center;gap:5px;flex:none;white-space:nowrap}
.pb svg{width:18px;height:18px}
.pb.on{background:var(--tape);color:var(--ink)}
.pb:disabled{opacity:.35}
/* dock */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safeb));z-index:27;display:flex;gap:6px;align-items:stretch;background:var(--lac);border-radius:16px;padding:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px #07080c,var(--sh);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.tool{border:0;background:var(--lac2);color:var(--pip);border-radius:11px;width:62px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;position:relative;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.4);transition:background .15s,transform .1s;padding:4px 2px}
.tool svg{width:28px;height:28px}
.tool:hover{background:#3a3d50}
.tool.on{background:var(--vellum);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(20,40,80,.25),0 0 0 2px var(--tape)}
.tool .cnt{position:absolute;top:2px;right:3px;background:var(--tape);color:#3a2600;border-radius:8px;font-size:10.5px;padding:1px 5px;line-height:1.3;font-weight:900}
.tool .cnt.z{background:#6b6f80;color:#ddd}
.tool:disabled{opacity:.35}
.dsep{width:2px;background:rgba(255,255,255,.1);border-radius:2px;margin:6px 2px;flex:none}
/* parts sheet */
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--safeb));z-index:29;width:min(640px,calc(100vw - 20px));max-height:min(62vh,520px);overflow-y:auto;background:var(--vellum);border-radius:14px;box-shadow:0 0 0 2px var(--ink),var(--sh);padding:12px}
#sheet h5{font-family:var(--hand);font-size:17px;color:var(--ink2);margin:4px 2px 6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px;margin-bottom:8px}
.part{border:0;background:#fff;border-radius:11px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink);box-shadow:inset 0 -3px 0 rgba(20,40,80,.12),0 0 0 2px rgba(22,52,95,.25);position:relative}
.part svg{width:34px;height:34px}
.part:hover{background:#fff7dc}
.part.on{box-shadow:0 0 0 3px var(--ink)}
.part .cnt{position:absolute;top:3px;right:4px;background:var(--ink);color:#fff;border-radius:8px;font-size:10.5px;padding:0 5px}
.part:disabled{opacity:.35}
.part small{font-family:var(--hand);font-size:11px;color:var(--dim);line-height:1.1;text-align:center}
/* modal */
#modal{position:fixed;inset:0;z-index:60;background:rgba(4,14,32,.62);display:flex;align-items:center;justify-content:center;padding:14px}
.card{background:var(--vellum);border-radius:14px;box-shadow:0 0 0 3px var(--ink),0 20px 60px rgba(0,0,0,.5);width:min(760px,100%);max-height:calc(100vh - 28px);overflow-y:auto;padding:20px 20px 18px;position:relative;
  background-image:linear-gradient(rgba(29,79,143,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(29,79,143,.07) 1px,transparent 1px);background-size:22px 22px}
.card.sm{width:min(440px,100%)}
.card h2{font-family:var(--disp);font-size:26px;color:var(--ink);font-weight:400;margin-bottom:4px;line-height:1.1}
.card .note{font-family:var(--hand);font-size:16px;color:var(--dim);margin-bottom:12px;line-height:1.3}
.card .x{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-size:20px;color:var(--ink);line-height:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lv{border:0;text-align:left;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:inset 0 -3px 0 rgba(20,40,80,.12),0 0 0 2px rgba(22,52,95,.3);color:var(--ink);display:flex;flex-direction:column;gap:3px;min-height:86px;position:relative}
.lv:hover{background:#fff7dc}
.lv .n{font-family:var(--disp);font-size:22px;color:var(--ink2);line-height:1}
.lv .t{font-size:14px;line-height:1.15}
.lv .s{font-size:15px;color:#c9c2ad;letter-spacing:2px}.lv .s .on{color:#f2a922}
.lv.lock{opacity:.5;cursor:default}.lv.lock .n::after{content:" 🔒";font-size:14px}
.stars{font-size:52px;letter-spacing:6px;text-align:center;color:#d8d0b8;margin:6px 0 2px;line-height:1}
.stars .on{color:#f2a922;text-shadow:0 3px 0 #b57400;display:inline-block;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
.stars .on:nth-child(2){animation-delay:.18s}.stars .on:nth-child(3){animation-delay:.36s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
.stat{display:flex;justify-content:center;gap:18px;font-size:15px;margin:8px 0 14px;flex-wrap:wrap}
.stat b{font-family:var(--disp);font-weight:400;color:var(--ink2)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gi{background:#fff;border-radius:12px;box-shadow:0 0 0 2px rgba(22,52,95,.3);overflow:hidden;display:flex;flex-direction:column}
.gi img,.gi .ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--bp)}
.gi .ph{display:flex;align-items:center;justify-content:center;color:#cfe3ff;font-family:var(--hand);font-size:15px}
.gi .gm{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.gi .gn{font-size:15px;line-height:1.15;word-break:break-word}
.gi .gd{font-family:var(--hand);font-size:13px;color:var(--dim)}
.gi .row{gap:6px}.gi .tb{min-height:36px;padding:6px 11px;font-size:13px;border-radius:9px}
textarea,input[type=text]{font-family:ui-monospace,Consolas,monospace;font-size:13px;width:100%;border:2px solid var(--ink);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);resize:vertical;user-select:text;-webkit-user-select:text}
input[type=text]{font-family:var(--ui);font-size:16px;font-weight:700}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;line-height:1.25}
.kbd b{font-family:ui-monospace,Consolas,monospace;background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:1px 6px;font-size:12.5px;white-space:nowrap;justify-self:start}
.pics{display:flex;gap:6px;flex:none}
.pics button{width:34px;height:34px;border-radius:8px;border:2px solid rgba(0,0,0,.2);background:#fff;padding:2px}
.pics button.on{outline:3px solid var(--ink)}
.pics canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
/* toast */
#toast{position:fixed;left:50%;top:112px;transform:translateX(-50%) translateY(-8px);z-index:70;background:var(--lac);color:var(--pip);padding:10px 18px;border-radius:12px;font-size:15px;box-shadow:0 0 0 2px var(--tape),var(--sh);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100vw - 30px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* finish banner */
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:45;font-family:var(--disp);font-size:54px;color:var(--tape);text-shadow:0 4px 0 #8a5a00,0 0 30px rgba(255,200,60,.6);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* phone */
@media (max-width:760px){
  #chip{left:10px;top:56px;max-width:calc(100vw - 20px);font-size:13px;padding:5px 10px}
  #chip small{font-size:12px}
  #topR{gap:4px;right:6px;top:8px}
  .ib{min-width:36px;height:38px;padding:0 6px;border-radius:9px}
  .ib svg{width:19px;height:19px}
  .ib .lbl{display:none}
  .sep{width:0}
  #goals{top:100px;width:200px;font-size:12.5px;padding:9px 11px 8px}
  #goals h4{font-size:15px}#goals .gl{font-size:12.5px}
  #readout{top:100px}
  .rd{font-size:13px;padding:5px 10px}.rd b{font-size:16px}
  #goWrap{right:10px;bottom:calc(164px + var(--safeb))}
  #go{width:72px;height:72px;font-size:22px}
  #go.reset{font-size:16px}
  #runCtl .ib{width:72px}
  #props{left:10px;right:10px;transform:none;max-width:none;bottom:calc(84px + var(--safeb));gap:8px;padding:5px 8px}
  #dock{left:10px;right:10px;transform:none;max-width:none;bottom:calc(8px + var(--safeb));padding:5px;gap:5px}
  .tool{width:56px;min-height:54px;font-size:10.5px}.tool svg{width:25px;height:25px}
  #sheet{bottom:calc(134px + var(--safeb));max-height:52vh}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
  .tL{width:40px;height:64px;font-size:30px;border-radius:7px}
  .tRow.small .tL{width:33px;height:52px;font-size:24px}
  .tRow{gap:4px}
  .tsub{font-size:17px}
  .tb.big{font-size:18px;min-height:52px;padding:12px 16px}
  #banner{font-size:34px}

<script>
'use strict';
/* =====================================================================
   DOMINO ARCHITECT - core: helpers, storage, sound, pieces, terrain, world
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const D2R = Math.PI / 180, TAU = Math.PI * 2;
const q2 = v => Math.round(v * 100) / 100;
const qa = v => { v = Math.round(v * 2) / 2 % 360; return v < 0 ? v + 360 : v; };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------------- storage ---------------- */
const Store = {
  key: 'dominoArchitect.v1', d: null,
  load() {
    let d = null; try { d = JSON.parse(localStorage.getItem(this.key) || 'null'); } catch (e) { d = null; }
    this.d = Object.assign({ stars: {}, gallery: [], mute: false, sandbox: null, endless: 0, endlessSeed: 1, seen: {} }, d || {});
    return this.d;
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.d)); return true; } catch (e) { return false; } }
};

/* ---------------- palette & sizes ---------------- */
const PAL = ['#f4efe3', '#ff5a4e', '#ff9a2e', '#ffd23f', '#8fdc4a', '#33d6a6', '#3fb8ff', '#4f6bff', '#9b5cff', '#ff6fb5', '#2b2d3a', '#8a5a3c'];
const PAL_NAMES = ['Ivory', 'Coral', 'Tangerine', 'Sunflower', 'Lime', 'Mint', 'Sky', 'Royal', 'Grape', 'Bubblegum', 'Charcoal', 'Walnut'];
const RAINBOW = [1, 2, 3, 4, 5, 6, 7, 8, 9];
const SZ = [{ h: .62, w: .31, t: .1, n: 'Tiny' }, { h: 1, w: .5, t: .16, n: 'Normal' }, { h: 1.8, w: .9, t: .29, n: 'Giant' }];
const SPACING = .58;           // centre-to-centre spacing along a path, as a fraction of height
const STEP_RISE = .25, STEP_DEPTH = .6;

/* ---------------- piece types ----------------
   every piece: {t, x, z, a(deg), ...}  s=size c=colour k=param f=flags(1 start, 2 pixel, 4 locked)  w,d = water rect */
const PT = {
  d:  { n: 'Domino', foot: p => [SZ[p.s].w / 2, SZ[p.s].t / 2], ht: p => SZ[p.s].h, body: 1 },
  pl: { n: 'Sweeper plank', foot: p => [p.k / 2, .1], ht: () => 1, body: 1 },
  tw: { n: 'Tower', foot: () => [.5, .5], ht: () => 3.2, body: 1 },
  b:  { n: 'Ball', foot: () => [.3, .3] },
  bl: { n: 'Bell', foot: () => [.42, .3], hit: 1.3 },
  gg: { n: 'Gong', foot: () => [.85, .22], hit: 1.9 },
  rp: { n: 'Ramp', foot: () => [.6, 1.5], solid: 1 },
  st: { n: 'Step', foot: () => [.6, STEP_DEPTH / 2], solid: 1 },
  wl: { n: 'Wall', foot: p => [p.k / 2, .15], solid: 1 },
  br: { n: 'Bridge', foot: () => [.7, 2], solid: 1 },
  ss: { n: 'See-saw', foot: () => [.32, 1.25] },
  ct: { n: 'Catapult', foot: () => [.45, .85] },
  bk: { n: 'Bucket', foot: () => [.2, .2] },
  cp: { n: 'Cup', foot: () => [.45, .45], hit: .55 },
  tr: { n: 'Trophy', foot: () => [.36, .36], hit: 1.35 },
  fl: { n: 'Finish flag', foot: () => [.22, .22], hit: 2.4 },
  wt: { n: 'Water', foot: p => [p.w / 2, p.d / 2] }
};
const TYPES = Object.keys(PT);
const invKey = p => p.t === 'd' ? 'd' + p.s : p.t;
const isLocked = p => !!(p.f & 4);
const isStart = p => !!(p.f & 1);
// launch settings for the throwing gadgets: local launch point (along, up) and velocity (along, up)
const LAUNCH = { ss: { lz: 1.05, y: .55, vz: 3.2, vy: 8.6 }, ct: { lz: .55, y: .78, vz: 7.4, vy: 9.6 }, bk: { lz: 1.15, y: 2.25, vz: 1.4, vy: 0 } };
const GRAV = 120, BALLG = 25, BALL_R = .3;

function pieceAxes(p) { const a = p.a * D2R, s = Math.sin(a), c = Math.cos(a); return { fx: s, fz: c, rx: c, rz: -s }; }
function toLocal(p, x, z) { const A = pieceAxes(p), dx = x - p.x, dz = z - p.z; return [dx * A.rx + dz * A.rz, dx * A.fx + dz * A.fz]; }
function toWorld(p, lx, lz) { const A = pieceAxes(p); return [p.x + A.rx * lx + A.fx * lz, p.z + A.rz * lx + A.fz * lz]; }
function footOf(p) { return p.t === 'wt' ? [p.w / 2, p.d / 2] : PT[p.t].foot(p); }
function obbOf(p, grow = 0) { const [hx, hz] = footOf(p), A = p.t === 'wt' ? { fx: 0, fz: 1, rx: 1, rz: 0 } : pieceAxes(p); return { x: p.x, z: p.z, A, hx: hx + grow, hz: hz + grow }; }
function obbHit(P, Q) {
  const axes = [[P.A.rx, P.A.rz], [P.A.fx, P.A.fz], [Q.A.rx, Q.A.rz], [Q.A.fx, Q.A.fz]], dx = Q.x - P.x, dz = Q.z - P.z;
  for (const [ax, az] of axes) {
    const rp = P.hx * Math.abs(P.A.rx * ax + P.A.rz * az) + P.hz * Math.abs(P.A.fx * ax + P.A.fz * az);
    const rq = Q.hx * Math.abs(Q.A.rx * ax + Q.A.rz * az) + Q.hz * Math.abs(Q.A.fx * ax + Q.A.fz * az);
    if (Math.abs(dx * ax + dz * az) > rp + rq) return false;
  }
  return true;
}
function inOBB(p, x, z, grow = 0) { const [hx, hz] = footOf(p); if (p.t === 'wt') return Math.abs(x - p.x) <= hx + grow && Math.abs(z - p.z) <= hz + grow; const [lx, lz] = toLocal(p, x, z); return Math.abs(lx) <= hx + grow && Math.abs(lz) <= hz + grow; }

/* ---------------- terrain: solids give a height field, water is a no-build zone ---------------- */
const Ter = {
  solids: [], water: [], grid: new Map(), C: 2,
  key(ix, iz) { return (ix + 2000) * 4096 + iz + 2000; },
  build(pieces) {
    this.solids = []; this.water = []; this.grid.clear();
    for (const p of pieces) {
      if (p.t === 'wt') { this.water.push(p); continue; }
      if (!PT[p.t].solid) continue;
      const A = pieceAxes(p), [hx, hz] = footOf(p), ex = Math.abs(A.rx) * hx + Math.abs(A.fx) * hz, ez = Math.abs(A.rz) * hx + Math.abs(A.fz) * hz;
      const s = { p, A, hx, hz }; this.solids.push(s);
      for (let ix = Math.floor((p.x - ex) / this.C); ix <= Math.floor((p.x + ex) / this.C); ix++)
        for (let iz = Math.floor((p.z - ez) / this.C); iz <= Math.floor((p.z + ez) / this.C); iz++) {
          const k = this.key(ix, iz); let l = this.grid.get(k); if (!l) this.grid.set(k, l = []); l.push(s);
        }
    }
  },
  solidH(s, x, z) {
    const dx = x - s.p.x, dz = z - s.p.z, lx = dx * s.A.rx + dz * s.A.rz, lz = dx * s.A.fx + dz * s.A.fz;
    if (Math.abs(lx) > s.hx || Math.abs(lz) > s.hz) return 0;
    switch (s.p.t) {
      case 'st': return s.p.k * STEP_RISE;
      case 'wl': return 1.6;
      case 'rp': return (s.hz - lz) / (2 * s.hz);
      case 'br': { const a = Math.abs(lz); return a <= 1 ? .6 : .6 * (2 - a); }
    }
    return 0;
  },
  heightAt(x, z, skip) {
    const l = this.grid.get(this.key(Math.floor(x / this.C), Math.floor(z / this.C))); if (!l) return 0;
    let h = 0; for (const s of l) { if (s.p === skip) continue; const v = this.solidH(s, x, z); if (v > h) h = v; } return h;
  },
  waterAt(x, z) { for (const w of this.water) if (Math.abs(x - w.x) <= w.w / 2 && Math.abs(z - w.z) <= w.d / 2) return true; return false; },
  bridgeAt(x, z) { const l = this.grid.get(this.key(Math.floor(x / this.C), Math.floor(z / this.C))); if (l) for (const s of l) if (s.p.t === 'br' && this.solidH(s, x, z) > 0) return true; return false; }
};

/* ---------------- the world being edited ---------------- */
const W = {
  pieces: [], bw: 80, bd: 80, level: null, name: 'Untitled run',
  inBoard(x, z, m = 0) { return Math.abs(x) <= this.bw / 2 - m && Math.abs(z) <= this.bd / 2 - m; },
  changed() { Ter.build(this.pieces); },
  invLeft(key) {
    if (!this.level) return Infinity;
    const lim = this.level.inv[key] || 0; let used = 0;
    for (const p of this.pieces) if (!isLocked(p) && invKey(p) === key) used++;
    return lim - used;
  },
  dominoCount(playerOnly) { let n = 0; for (const p of this.pieces) if ((p.t === 'd' || p.t === 'pl') && (!playerOnly || !isLocked(p))) n++; return n; },
  // why a piece cannot go here (or '' if it can); `others` lets builders test against pending pieces too
  blocked(p, others) {
    const [hx, hz] = footOf(p);
    if (!this.inBoard(p.x, p.z, Math.min(hx, hz) * .5)) return 'off the board';
    const def = PT[p.t];
    if (!def.solid && p.t !== 'wt') {
      if (Ter.waterAt(p.x, p.z) && !Ter.bridgeAt(p.x, p.z)) return 'in the water';
    }
    const A = obbOf(p, -.012);
    const test = q => {
      if (q === p || q.t === 'wt') return false;
      const qs = !!PT[q.t].solid, ps = !!def.solid;
      if (qs !== ps) { // a solid only clashes with gadgets that cannot stand on it
        if (ps && (q.t === 'd' || q.t === 'pl' || q.t === 'b')) return false;
        if (!ps && (p.t === 'd' || p.t === 'pl' || p.t === 'b' || p.t === 'tr' || p.t === 'fl' || p.t === 'bl' || p.t === 'cp')) return false;
      }
      return obbHit(A, obbOf(q, -.012));
    };
    for (const q of this.pieces) if (test(q)) return 'overlaps something';
    if (others) for (const q of others) if (test(q)) return 'overlaps something';
    return '';
  },
  pieceAt(x, z, grow = .12) {
    let best = null, bs = 1e9;
    for (let i = this.pieces.length - 1; i >= 0; i--) {
      const p = this.pieces[i]; if (p.t === 'wt') continue;
      if (inOBB(p, x, z, grow)) { const sc = Math.hypot(p.x - x, p.z - z) + (PT[p.t].solid ? 2 : 0); if (sc < bs) { bs = sc; best = p; } }
    }
    return best;
  }
};

/* ---------------- share codes: compact arrays -> JSON -> lz-string ---------------- */
const Code = {
  pieceArr(p) {
    const a = [TYPES.indexOf(p.t), Math.round(p.x * 100), Math.round(p.z * 100), p.a || 0, p.s || 0, p.c || 0, p.f || 0, p.k || 0, p.w || 0, p.d || 0];
    while (a.length > 4 && !a[a.length - 1]) a.pop();
    return a;
  },
  arrPiece(a) {
    const t = TYPES[a[0]]; if (!t) return null;
    const p = { t, x: (a[1] || 0) / 100, z: (a[2] || 0) / 100, a: +a[3] || 0 };
    if (t === 'd') { p.s = clamp(a[4] | 0, 0, 2); p.c = clamp(a[5] | 0, 0, PAL.length - 1); }
    else if (a[5]) p.c = clamp(a[5] | 0, 0, PAL.length - 1);
    if (a[6]) p.f = a[6] | 0;
    if (t === 'st') p.k = clamp(a[7] | 0 || 1, 1, 12);
    if (t === 'wl' || t === 'pl') p.k = clamp(+a[7] || 3, .5, 40);
    if (t === 'wt') { p.w = +a[8] || 1; p.d = +a[9] || 1; }
    if (!isFinite(p.x) || !isFinite(p.z)) return null;
    return p;
  },
  encode(pieces, extra) {
    const o = { v: 1, b: [W.bw, W.bd], n: (extra && extra.name) || W.name, p: pieces.map(p => this.pieceArr(p)) };
    return 'DA1.' + LZString.compressToBase64(JSON.stringify(o));
  },
  decode(str) {
    str = String(str || '').trim().replace(/\s+/g, '');
    if (!str.startsWith('DA1.')) return null;
    let o; try { o = JSON.parse(LZString.decompressFromBase64(str.slice(4)) || 'null'); } catch (e) { return null; }
    if (!o || !Array.isArray(o.p)) return null;
    const pieces = o.p.map(a => Array.isArray(a) ? this.arrPiece(a) : null).filter(Boolean);
    return { pieces, bw: clamp(+(o.b && o.b[0]) || 80, 8, 200), bd: clamp(+(o.b && o.b[1]) || 80, 8, 200), name: String(o.n || 'Shared run').slice(0, 40) };
  }
};

/* ---------------- sound: everything synthesised with WebAudio ---------------- */
const Snd = {
  ctx: null, on: true, master: null, noiseBuf: null, win: 0, winN: 0, rollG: null,
  init() {
    if (this.ctx) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = this.on ? .8 : 0;
      const comp = this.ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      const n = this.ctx.sampleRate * .06 | 0, b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
      this.noiseBuf = b;
      const ln = this.ctx.sampleRate * 1.5 | 0, lb = this.ctx.createBuffer(1, ln, this.ctx.sampleRate), ld = lb.getChannelData(0);
      for (let i = 0; i < ln; i++) ld[i] = Math.random() * 2 - 1;
      this.longNoise = lb;
    } catch (e) { this.ctx = null; }
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setOn(v) { this.on = v; if (this.master) this.master.gain.setTargetAtTime(v ? .8 : 0, this.ctx.currentTime, .02); },
  ok() { return this.ctx && this.on && this.ctx.state === 'running'; },
  env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); },
  osc(type, f, t, a, peak, dec, dest) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    this.env(g, t, a, peak, dec); o.connect(g); g.connect(dest || this.master); o.start(t); o.stop(t + a + dec + .05); return o;
  },
  noise(t, f, q, peak, dec, rate) {
    const s = this.ctx.createBufferSource(), bp = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf; s.playbackRate.value = rate || 1; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    this.env(g, t, .001, peak, dec); s.connect(bp); bp.connect(g); g.connect(this.master); s.start(t);
  },
  // the domino clack: brighter and higher the faster the wave is travelling
  clack(speed, size) {
    if (!this.ok()) return;
    const now = this.ctx.currentTime;
    if (now - this.win > .03) { this.win = now; this.winN = 0; }
    if (++this.winN > 3) return;
    const sp = clamp(speed / 16, 0, 1.6), sf = [1.55, 1, .58][size == null ? 1 : size] || 1;
    const f = (1150 + 1500 * sp) * sf * (.92 + Math.random() * .16), vol = clamp(.12 + sp * .2, .1, .38) * (size === 2 ? 1.3 : 1);
    this.noise(now, f, 3.5, vol, .045, .9 + sp * .5);
    this.osc('triangle', f * .34, now, .001, vol * .55, .035);
  },
  tap(size) { if (!this.ok()) return; const t = this.ctx.currentTime, sf = [1.4, 1, .6][size] || 1; this.noise(t, 700 * sf, 2, .07, .05, .7); },
  bell(pitch) {
    if (!this.ok()) return; const t = this.ctx.currentTime, f = 880 * (pitch || 1);
    [[1, .22, 1.6], [2.01, .12, 1.0], [2.76, .08, .7], [5.43, .05, .35], [.5, .07, 1.8]].forEach(([m, v, d]) => this.osc('sine', f * m, t, .002, v, d));
  },
  gong() {
    if (!this.ok()) return; const t = this.ctx.currentTime;
    [[1, .3, 3.2], [1.48, .16, 2.6], [2.1, .12, 2.2], [2.93, .07, 1.6], [3.72, .05, 1.2], [.5, .14, 3.5]].forEach(([m, v, d]) => {
      const o = this.osc('sine', 98 * m, t, .01, v, d); o.frequency.exponentialRampToValueAtTime(98 * m * .985, t + d);
    });
    this.noise(t, 400, .7, .18, .6, .4);
  },
  thunk() { if (!this.ok()) return; const t = this.ctx.currentTime; const o = this.osc('sine', 160, t, .002, .35, .18); o.frequency.exponentialRampToValueAtTime(60, t + .18); this.noise(t, 500, 1.2, .15, .08, .6); },
  boing() { if (!this.ok()) return; const t = this.ctx.currentTime; const o = this.osc('triangle', 220, t, .005, .25, .4); o.frequency.exponentialRampToValueAtTime(700, t + .12); o.frequency.exponentialRampToValueAtTime(330, t + .4); },
  whoosh() {
    if (!this.ok()) return; const t = this.ctx.currentTime, s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.longNoise; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2400, t + .35);
    this.env(g, t, .08, .2, .45); s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + .6);
  },
  splash() {
    if (!this.ok()) return; const t = this.ctx.currentTime, s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.longNoise; f.type = 'lowpass'; f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(300, t + .5);
    this.env(g, t, .01, .3, .6); s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + .7);
  },
  rattle() { if (!this.ok()) return; const t = this.ctx.currentTime; for (let i = 0; i < 7; i++) this.noise(t + i * .035 + Math.random() * .02, 900 + Math.random() * 900, 3, .12, .05); },
  plop() { if (!this.ok()) return; const t = this.ctx.currentTime; const o = this.osc('sine', 500, t, .002, .25, .15); o.frequency.exponentialRampToValueAtTime(140, t + .15); },
  place() { if (!this.ok()) return; const t = this.ctx.currentTime; this.noise(t, 2200, 4, .08, .03); },
  erase() { if (!this.ok()) return; const t = this.ctx.currentTime; const o = this.osc('square', 300, t, .002, .04, .08); o.frequency.exponentialRampToValueAtTime(120, t + .08); },
  ui() { if (!this.ok()) return; const t = this.ctx.currentTime; this.osc('triangle', 660, t, .002, .06, .06); },
  win() {
    if (!this.ok()) return; const t = this.ctx.currentTime;
    [523, 659, 784, 1047, 1319].forEach((f, i) => { this.osc('triangle', f, t + i * .09, .005, .16, .5); this.osc('sine', f * 2, t + i * .09, .005, .05, .3); });
  },
  fail() { if (!this.ok()) return; const t = this.ctx.currentTime; [392, 330].forEach((f, i) => this.osc('triangle', f, t + i * .16, .01, .12, .3)); },
  rollLevel(v) {
    if (!this.ok()) { if (this.rollG) this.rollG.gain.value = 0; return; }

    $('bSlow').onclick = () => { App.slow = !App.slow; $('bSlow').classList.toggle('on', App.slow); };

  updMute() { $('mute').classList.toggle('off', !!Store.d.mute); },
  updFollow() { const b = $('bFollow'); if (b) b.classList.toggle('on', Cam.follow); },
  setSnap(v) { Tools.snap = v; $('bSnap').classList.toggle('on', v); this.toast(v ? 'Grid snap on: straight lines & 15° turns' : 'Grid snap off: freehand'); },
  updUndo() { if (!$('bUndo')) return; $('bUndo').disabled = Hist.i <= 0 || App.mode !== 'build'; $('bRedo').disabled = Hist.i >= Hist.st.length - 1 || App.mode !== 'build'; },
  toast(msg, ms = 2200) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('show'), ms); },
  banner(msg, ms = 1800) { const b = $('banner'); b.textContent = msg; b.classList.add('show'); clearTimeout(this._bt); this._bt = setTimeout(() => b.classList.remove('show'), ms); },
  // ---------- dock ----------
  dockTools() {
    const base = [['path', 'Path', IC.path], ['single', 'Domino', IC.domino], ['select', 'Select', IC.select], ['erase', 'Erase', IC.erase], ['pan', 'Move', IC.hand]];
    return base;
  },
  updDock() {
    const lv = W.level, cur = Tools.cur;
    let h = this.dockTools().map(([id, n, ic]) => `<button class="tool${cur === id ? ' on' : ''}" data-t="${id}">${ic}<span>${n}</span>${(id === 'path' || id === 'single') && lv ? this.cntBadge(this.domLeft()) : ''}</button>`).join('');
    h += '<span class="dsep"></span>';
    if (lv) {
      for (const [k, n] of Object.entries(lv.inv)) { if (k[0] === 'd') continue; const left = W.invLeft(k); h += `<button class="tool${cur === k ? ' on' : ''}" data-t="${k}">${IC[k] || IC.parts}<span>${(PARTS.find(p => p[0] === k) || [0, PT[k].n])[1]}</span>${this.cntBadge(left)}</button>`; }
      for (const k of lv.builders || []) h += `<button class="tool${cur === k ? ' on' : ''}" data-t="${k}">${IC[k]}<span>${PARTS.find(p => p[0] === k)[1]}</span></button>`;
    } else {
      const pi = PARTS.find(p => p[0] === cur);
      h += `<button class="tool${pi ? ' on' : ''}" data-t="__parts">${pi ? IC[pi[0]] : IC.parts}<span>${pi ? pi[1] : 'Parts'}</span></button>`;
      if (pi) h += `<button class="tool" data-t="__parts">${IC.parts}<span>Parts</span></button>`;
    }
    if (Sel.clip) h += `<button class="tool${cur === 'paste' ? ' on' : ''}" data-t="paste">${IC.copy}<span>Paste</span></button>`;
    $('dock').innerHTML = h;
    $('dock').querySelectorAll('.tool').forEach(b => b.onclick = () => { Snd.resume(); Snd.ui(); const t = b.dataset.t; if (t === '__parts') this.toggleSheet(); else Tools.set(t); });
  },
  cntBadge(n) { return n === Infinity ? '' : `<span class="cnt${n <= 0 ? ' z' : ''}">${n}</span>`; },
  domLeft() { if (!W.level) return Infinity; return W.invLeft('d0') + W.invLeft('d1') + W.invLeft('d2'); },
  updInv() { if (W.level) this.updDock(); this.updProps(); this.updGoals(); },
  toggleSheet() {
    const s = $('sheet');
    if (!s.classList.contains('hidden')) { this.closeSheet(); return; }
    const card = ([id, n, note]) => `<button class="part${Tools.cur === id ? ' on' : ''}" data-t="${id}">${IC[id]}<span>${n}</span><small>${note}</small></button>`;
    s.innerHTML = `<h5>Gadgets</h5><div class="pgrid">${PARTS.filter(p => p[3] === 'g').map(card).join('')}</div><h5>Builders</h5><div class="pgrid">${PARTS.filter(p => p[3] === 'b').map(card).join('')}</div>`;
    s.classList.remove('hidden');
    s.querySelectorAll('.part').forEach(b => b.onclick = () => { Snd.ui(); Tools.set(b.dataset.t); });
  },
  closeSheet() { $('sheet').classList.add('hidden'); },
  // ---------- properties strip ----------
  updProps() {
    const t = Tools.cur, P = $('props'); if (!P) return;
    const parts = [];
    const sizeSeg = () => {
      const lv = W.level, b = [0, 1, 2].map(s => { const left = W.invLeft('d' + s), dis = lv && left <= 0; return `<button data-s="${s}" class="${Tools.size === s ? 'on' : ''}" ${dis ? 'disabled style="opacity:.35"' : ''}>${SZ[s].n}${lv && left !== Infinity ? ' ·' + Math.max(0, left) : ''}</button>`; }).join('');
      return `<div class="seg" id="pSize">${b}</div>`;
    };
    const swatch = () => `<div class="sw" id="pCol">${PAL.map((c, i) => `<button title="${PAL_NAMES[i]}" data-c="${i}" class="${Tools.col === i ? 'on' : ''}" style="background:${c}"></button>`).join('')}<button class="rb${Tools.col < 0 ? ' on' : ''}" data-c="-1" title="Rainbow"></button></div>`;
    const rot = () => `<button class="pb" id="pRL" title="Rotate left (Shift+R)">${IC.rotL}</button><span class="pl" id="pRot">${Math.round(Tools.rot)}°</span><button class="pb" id="pRR" title="Rotate right (R)">${IC.rotR}</button>`;
    if (t === 'path') parts.push(sizeSeg(), swatch(), `<span class="pl">drag to lay a run · tap for one</span>`);
    else if (t === 'single') parts.push(sizeSeg(), swatch(), rot());
    else if (t === 'spiral') parts.push(sizeSeg(), swatch(), rot());
    else if (t === 'stairs') parts.push(`<div class="seg" id="pStair">${[['up', 'Up'], ['updown', 'Up & down'], ['down', 'Down']].map(([k, n]) => `<button data-m="${k}" class="${Tools.stairMode === k ? 'on' : ''}">${n}</button>`).join('')}</div>`, swatch(), rot());
    else if (t === 'split') parts.push(swatch(), rot());
    else if (t === 'pixel') parts.push(`<div class="pics" id="pPic">${Object.keys(PICS).map(k => `<button data-p="${k}" class="${Tools.pic === k ? 'on' : ''}" title="${k}"><canvas width="13" height="11" data-pic="${k}"></canvas></button>`).join('')}</div>`, rot());
    else if (t === 'text') parts.push(`<input type="text" id="pText" maxlength="16" value="${esc(Tools.text)}" style="width:140px;min-height:34px;padding:4px 8px">`, swatch(), rot());
    else if (t === 'wl') parts.push(`<div class="seg" id="pWall">${[2, 3, 5, 8].map(k => `<button data-k="${k}" class="${Tools.wallLen === k ? 'on' : ''}">${k} long</button>`).join('')}</div>`, rot());
    else if (t === 'b' || t === 'tw') parts.push(swatch(), rot());
    else if (PT[t]) parts.push(rot(), `<span class="pl">${(PARTS.find(p => p[0] === t) || [])[2] || ''} · drag to aim</span>`);
    else if (t === 'paste') parts.push(rot(), `<span class="pl">tap to paste ${Sel.clip ? Sel.clip.length : 0} pieces</span>`, `<button class="pb" id="pCancel">${IC.x} Done</button>`);
    else if (t === 'select') {
      const n = Sel.set.size;
      parts.push(`<span class="pl">${n ? n + ' selected' : 'tap a piece or drag a box'}</span>`);
      if (n) parts.push(`<button class="pb" id="pCopy">${IC.copy} Copy</button><button class="pb" id="pDel">${IC.trash} Delete</button><button class="pb" id="pSRL">${IC.rotL}</button><button class="pb" id="pSRR">${IC.rotR}</button>${W.level ? '' : `<button class="pb" id="pStart">${IC.start} First</button>`}`, swatch());

    P.innerHTML = parts.join('');
    P.classList.toggle('hidden', App.mode !== 'build' || !parts.length);
    const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
    P.querySelectorAll('#pSize button').forEach(b => b.onclick = () => { Tools.size = +b.dataset.s; this.updProps(); Tools.refreshGhost(); });
    P.querySelectorAll('#pCol button').forEach(b => b.onclick = () => { Tools.col = +b.dataset.c; if (Tools.cur === 'select') Sel.recolor(Tools.col); this.updProps(); Tools.refreshGhost(); });
    P.querySelectorAll('#pStair button').forEach(b => b.onclick = () => { Tools.stairMode = b.dataset.m; this.updProps(); });
    P.querySelectorAll('#pWall button').forEach(b => b.onclick = () => { Tools.wallLen = +b.dataset.k; this.updProps(); });
    P.querySelectorAll('#pPic button').forEach(b => b.onclick = () => { Tools.pic = b.dataset.p; this.updProps(); });
    P.querySelectorAll('canvas[data-pic]').forEach(c => drawPic(c, PICS[c.dataset.pic]));
    const ti = $('pText'); if (ti) { ti.oninput = () => { Tools.text = ti.value.replace(/[^A-Za-z0-9!+\- ]/g, '') || 'KAI'; }; ti.onkeydown = e => e.stopPropagation(); }
    on('pRL', () => { Tools.rot = qa(Tools.rot - 15); this.updProps(); Tools.refreshGhost(); }); on('pRR', () => { Tools.rot = qa(Tools.rot + 15); this.updProps(); Tools.refreshGhost(); });
    on('pCopy', () => Sel.copy()); on('pDel', () => { Edit.remove(Sel.list()); Sel.clear(); });
    on('pSRL', () => Sel.rotate(-15)); on('pSRR', () => Sel.rotate(15)); on('pStart', () => Sel.setStart()); on('pCancel', () => Tools.set('select'));
  },
  // ---------- goals card ----------
  updGoals() {
    const lv = W.level, g = $('goals');

    const s = App.mode === 'run' ? Sim.goals() : null, used = W.dominoCount(true);

      if (k === 'cup') { txt = 'Land the ball in the cup'; done = s && s.filled === s.cups; }

  levelsDlg() {

  saveDlg() {

/* ---------------- endless commissions: generated briefs ---------------- */
function makeCommission(seed) {
  const R = mulberry(seed * 7919 + 13), r = (a, b) => a + R() * (b - a), pieces = [], goals = ['finish'];
  const bw = 22, bd = 14, sz = r(-4, 4);
  pieces.push(Lp.start(-9.5, q2(sz)));
  const tz = r(-5, 5), tr = Lp.tr(9, q2(tz)); pieces.push(tr);
  const nb = R() < .35 ? 0 : R() < .7 ? 1 : 2, targets = [[9, tz]];
  for (let i = 0; i < nb; i++) { const x = r(-2, 6), z = (i ? -1 : 1) * r(2.5, 5.5); pieces.push(Lp.bell(q2(x), q2(z), 90)); targets.push([x, z]); }
  if (nb) goals.push('bells');
  const inv = { d1: 0 };
  const kind = R();
  if (kind < .33) { pieces.push(Lp.water(q2(r(-4, 0)), 0, 2.1, bd)); inv.br = 1; }
  else if (kind < .66) { const wz = r(-2, 2); pieces.push(Lp.wall(q2(r(-3, 3)), q2(wz), q2(r(5, 8)), 90)); }
  else { pieces.push(Lp.wall(q2(r(-4, 2)), q2(r(-6, -3)), q2(r(4, 7)), 0)); pieces.push(Lp.wall(q2(r(-1, 5)), q2(r(3, 6)), q2(r(4, 7)), 0)); }
  if (R() < .4) { const z = r(-5, 5); pieces.push(Lp.ball(q2(r(-6, -3)), q2(z))); }
  let est = 0; let px = -9.5, pz = sz; targets.slice().sort((a, b) => a[0] - b[0]).forEach(([x, z]) => { est += Math.hypot(x - px, z - pz); });
  const n = Math.ceil(est / SPACING * 1.25) + 10 + (nb ? 9 : 0) + (kind >= .33 ? 10 : 0);
  inv.d1 = n + 12;
  return { id: 'c' + seed, endless: true, title: `Commission #${seed}`, note: ['A client wants it done by Friday.', 'Budget is tight. Spacing is free.', 'Make it ring, make it land.', 'The trophy is for the client. Probably.'][seed % 4], bw, bd, goals, inv, builders: nb ? ['split'] : [], par: [n, Math.ceil(n * .8)], pieces: pieces.map(p => Object.assign(p, { f: (p.f || 0) | 4 })) };
}

  },

  },
  skip() { if (this.mode !== 'run') return; Sim.fastForward(90); for (const d of Sim.D) d.dirty = true; V.sync(0); this.updReadout(); this.checkGoals(); },
  tapRun(cx, cy) {

  },
  starsFor(used) { const lv = W.level; return 1 + (used <= lv.par[0] ? 1 : 0) + (used <= lv.par[1] ? 1 : 0); },

  },

    $('rdFall').classList.toggle('ok', Sim.fallen === Sim.total && Sim.total > 0); $('rdTime').classList.toggle('ok', Sim.done);
  },
  focus() {

    for (const b of Sim.balls) if (b.st === 'move') { x += b.x * 4; z += b.z * 4; n += 4; }
    for (const k of Sim.debris) if (!k.sleep) { x += k.x; z += k.z; n++; }

  },
  loop(t) {

        Cam.yaw += dt * .04;
      }

  }
};
function mapThumb(pieces) {

    else { x.fillStyle = PT[p.t].solid ? 'rgba(255,255,255,.5)' : '#ffd45c'; const [hx, hz] = footOf(p); x.fillRect(-hx * s, -hz * s, hx * 2 * s, hz * 2 * s); }
    x.restore();
  }

}
