<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Bottle Flip Legends · Kai.fun</title>
<meta name="description" content="Flick a sloshing water bottle and stick the landing. 50+ named tricks, a collectible Trickdex, your own custom tricks, combos, six rooms and a rooftop.">
<meta name="theme-color" content="#14123a">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#1d1840;--ink2:#6b6690;--card:rgba(255,253,247,.94);--sh:0 3px 0 rgba(20,14,60,.18),0 8px 24px rgba(10,8,40,.28);
--aq:#22c8ff;--pk:#ff4f8b;--yl:#ffd23f;--gr:#3ee08f;--or:#ff8a3d;--h:"Lilita One","Trebuchet MS",Impact,sans-serif;--f:"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#14123a}
body{font-family:var(--f);font-weight:700;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#cv:active{cursor:grabbing}
button{font-family:var(--f);font-weight:800;color:var(--ink);cursor:pointer;border:0}
.hide{display:none!important}
#kai{position:fixed;left:12px;top:12px;z-index:40;font-weight:800;font-size:15px;color:var(--ink);text-decoration:none;background:var(--card);padding:9px 14px 9px 12px;border-radius:999px;box-shadow:var(--sh);line-height:1}
#kai:hover{background:#fff}
#hud{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#scoreBox{text-align:center}
#score{font-family:var(--h);font-size:44px;line-height:1;color:#fff;letter-spacing:.02em;text-shadow:0 3px 0 rgba(20,10,60,.5),0 0 18px rgba(0,0,40,.4);transition:transform .12s}
#score.bump{transform:scale(1.18)}
#modeLine{font-size:13px;color:#fff;opacity:.92;text-shadow:0 1px 4px rgba(0,0,40,.8);letter-spacing:.04em;text-transform:uppercase}
#comboBox{display:flex;align-items:center;gap:8px;background:rgba(20,14,60,.72);padding:5px 12px 5px 8px;border-radius:999px;position:relative;transition:opacity .2s,transform .2s}
#comboBox.off{opacity:0;transform:scale(.8)}
#comboMult{font-family:var(--h);font-size:24px;color:var(--yl);min-width:44px;text-align:center;line-height:1}
#comboBar{width:120px;height:9px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
#comboBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--yl),var(--or),var(--pk));border-radius:9px;transform-origin:left}
#comboFire{position:absolute;left:-6px;right:-6px;top:-22px;height:26px;pointer-events:none;opacity:0;transition:opacity .3s;
 background:radial-gradient(ellipse at 20% 100%,rgba(255,170,40,.9),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(255,90,30,.95),transparent 62%),radial-gradient(ellipse at 80% 100%,rgba(255,200,60,.9),transparent 60%);filter:blur(2px);animation:fire .35s infinite alternate}
#comboBox.hot #comboFire{opacity:1}
#comboBox.hot{box-shadow:0 0 22px rgba(255,120,40,.8)}
@keyframes fire{from{transform:scaleY(.8) translateY(3px)}to{transform:scaleY(1.15)}}
#target{background:var(--card);border-radius:14px;padding:7px 14px;box-shadow:var(--sh);font-size:14px;display:flex;align-items:center;gap:8px;max-width:86vw}
#target .tn{font-family:var(--h);font-size:18px;font-weight:400}
#target .st{color:#f0a500;letter-spacing:-1px}
#topR{position:fixed;right:12px;top:12px;z-index:40;display:flex;gap:7px;align-items:center}
.rb{background:var(--card);height:42px;border-radius:999px;box-shadow:var(--sh);padding:0 14px 0 10px;display:flex;align-items:center;gap:6px;font-size:15px;transition:transform .15s}
.rb.sq{width:42px;padding:0;justify-content:center;font-size:18px}
.rb:hover{transform:translateY(-1px);background:#fff}.rb:active{transform:scale(.94)}
.rb b{font-size:18px}
#ctrl{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;gap:7px;align-items:center;flex-wrap:nowrap}
.seg{display:flex;background:var(--card);border-radius:999px;box-shadow:var(--sh);padding:3px}
.seg button{background:transparent;height:34px;padding:0 11px;border-radius:999px;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.cb{background:var(--card);height:40px;border-radius:999px;box-shadow:var(--sh);padding:0 13px;display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.cb.on{background:var(--ink);color:#fff}
#waterBox input{width:86px;accent-color:var(--aq)}
#waterBox b{min-width:34px;font-size:13px}
#hint{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:15;color:#fff;text-align:center;font-size:17px;text-shadow:0 2px 8px rgba(0,0,40,.85);pointer-events:none;transition:opacity .5s;line-height:1.35}
#hint small{font-size:13px;opacity:.85}
#hint.fade{opacity:0}
#blind{position:fixed;inset:0;z-index:12;background:radial-gradient(circle at 50% 50%,rgba(5,4,20,.9),#05040f);opacity:0;pointer-events:none;transition:opacity .15s}
#blind.on{opacity:1}
#flash{position:fixed;inset:0;z-index:13;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,240,160,.0),rgba(255,200,40,.55))}
#flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#pops{position:fixed;left:0;right:0;top:15%;z-index:25;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.pop{font-family:var(--h);color:#fff;text-align:center;text-shadow:0 4px 0 rgba(20,10,60,.55),0 0 24px rgba(0,0,40,.5);animation:pop 2.1s cubic-bezier(.2,1.6,.4,1) forwards;white-space:nowrap}
.pop.t1{font-size:54px}.pop.t2{font-size:30px;color:var(--yl)}.pop.t3{font-size:20px;color:#bff3ff}.pop.t4{font-size:72px;color:var(--yl)}
.pop.fail{color:#ffb0c4;font-size:44px}
.pop.leg{font-size:86px;background:linear-gradient(180deg,#fff7c0,#ffcc2e 55%,#ff8a1d);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 5px 0 rgba(90,40,0,.6)) drop-shadow(0 0 22px rgba(255,180,40,.8))}
@keyframes pop{0%{transform:scale(.2) rotate(-6deg);opacity:0}12%{transform:scale(1.12) rotate(2deg);opacity:1}22%{transform:scale(1) rotate(0)}80%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-34px) scale(.95)}}
#toasts{position:fixed;left:50%;top:118px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--card);padding:8px 16px;border-radius:999px;box-shadow:var(--sh);font-size:14.5px;animation:toast 3.4s forwards;white-space:nowrap}
.toast.gold{background:linear-gradient(90deg,#fff2b0,#ffd23f)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#timer{position:fixed;right:14px;top:66px;z-index:20;font-family:var(--h);font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(20,10,60,.5)}
#timer.low{color:#ff6b8f;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#kbAim{position:fixed;left:14px;bottom:76px;z-index:20;background:rgba(20,14,60,.78);color:#fff;border-radius:14px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:6px;min-width:210px}
.kbRow{display:flex;align-items:center;gap:8px}.kbRow span{width:44px;opacity:.8;letter-spacing:.05em}
.kbBar{flex:1;height:10px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.kbBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gr),var(--yl),var(--pk))}
.kbPips{display:flex;gap:4px}.kbPips i{width:16px;height:9px;border-radius:4px;background:rgba(255,255,255,.18)}.kbPips i.on{background:var(--aq)}
.kbKeys{opacity:.65;font-size:11px}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(12,10,40,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:14px}
#menu{background:radial-gradient(ellipse at 50% 30%,rgba(40,30,110,.35),rgba(10,8,34,.8))}
.menuIn{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
.logo{text-align:center;font-family:var(--h);line-height:.9;transform:rotate(-3deg);margin-bottom:4px}
.logo .l1{font-size:62px;color:#fff;text-shadow:0 5px 0 #2a1d7a,0 9px 0 rgba(0,0,0,.25)}
.logo .l2{font-size:76px;letter-spacing:.06em;background:linear-gradient(180deg,#fff6b8,#ffd23f 50%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #7a2d10)}
#menuStats{color:#fff;font-size:14px;opacity:.9;text-align:center}
#menuStats b{color:var(--yl)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mb{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--sh);text-align:left;display:flex;flex-direction:column;gap:3px;transition:transform .15s}
.mb b{font-family:var(--h);font-weight:400;font-size:22px}
.mb small{font-size:12.5px;color:var(--ink2)}
.mb.big{grid-column:1/3;background:linear-gradient(135deg,#ffe36b,#ffb13d);text-align:center;align-items:center}
.mb.big b{font-size:32px}
.mb:hover{transform:translateY(-2px)}.mb:active{transform:scale(.97)}
.menuRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mb2{background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:10px 15px;font-size:14.5px;border:2px solid rgba(255,255,255,.22)}
.mb2:hover{background:rgba(255,255,255,.24)}
.menuFoot{color:#fff;opacity:.55;font-size:12px;text-align:center}
#mResume{background:var(--gr);border-radius:999px;padding:11px 26px;font-size:17px;box-shadow:var(--sh)}
.book{width:min(980px,100%);height:min(720px,100%);background:#fff8ea;border-radius:22px;box-shadow:0 12px 50px rgba(0,0,0,.45),inset 0 0 0 6px #f1e2c2;display:flex;flex-direction:column;overflow:hidden;position:relative}
.bookHead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;background:linear-gradient(180deg,#3a2d8f,#2a1f72);color:#fff}
.bookTitle{font-family:var(--h);font-size:28px;letter-spacing:.04em}
.bookTitle small{font-family:var(--f);font-size:13px;opacity:.8;margin-left:8px;letter-spacing:0}
.x{background:rgba(255,255,255,.16);color:#fff;width:36px;height:36px;border-radius:50%;font-size:16px}
.tabs{display:flex;gap:6px;padding:8px 14px;background:#2a1f72;overflow-x:auto;scrollbar-width:none}
.tabs button{background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 13px;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--yl);color:var(--ink)}
.bookBody{flex:1;overflow-y:auto;padding:14px;position:relative;-webkit-overflow-scrolling:touch}
#dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tc{background:#fff;border-radius:14px;padding:8px;box-shadow:0 2px 0 #eadcbc,0 3px 10px rgba(60,40,0,.08);text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;transition:transform .12s;border:2px solid transparent}
.tc:hover{transform:translateY(-2px)}
.tc canvas{width:100%;height:84px;border-radius:10px;display:block}
.tc .nm{font-family:var(--h);font-weight:400;font-size:16px;line-height:1.05}
.tc .st{color:#f0a500;font-size:12px;letter-spacing:-1px}
.tc .bd{position:absolute;right:8px;top:8px;font-size:10px;padding:2px 7px;border-radius:999px;background:#ece6ff;color:#5a4aa8}
.tc.landed{border-color:#9fe6c3}.tc.landed .bd{background:var(--gr);color:#063}
.tc.mastered{border-color:#ffd23f;background:linear-gradient(180deg,#fffbe6,#fff)}.tc.mastered .bd{background:var(--yl);color:#6a4700}
.tc.locked{opacity:.55;filter:grayscale(.7)}.tc.locked .bd{background:#ddd;color:#666}
#dexDetail{display:grid;grid-template-columns:minmax(260px,1fr) 1.2fr;gap:18px}
#dexDetail canvas{width:100%;aspect-ratio:16/10;border-radius:16px;background:#20195a;display:block}
.dd h2{font-family:var(--h);font-weight:400;font-size:34px;line-height:1}
.dd .st{color:#f0a500;font-size:20px}
.dd p{font-weight:600;line-height:1.45;margin:8px 0;color:#3d3866}
.dd .how{background:#efe9ff;border-radius:12px;padding:10px 12px;font-size:14px}
.dd .stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.dd .stats div{background:#fff;border-radius:12px;padding:7px 12px;box-shadow:0 2px 0 #eadcbc;font-size:12px;color:var(--ink2)}
.dd .stats b{display:block;font-size:18px;color:var(--ink)}
.btn{background:var(--ink);color:#fff;border-radius:999px;padding:11px 20px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.btn.y{background:linear-gradient(135deg,#ffe36b,#ffb13d);color:var(--ink)}
.btn.g{background:var(--gr);color:#053}
.btn.ghost{background:#ece6ff;color:#3a2d8f;box-shadow:none}
.btnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sect{font-family:var(--h);font-size:20px;margin:6px 0 8px;color:#3a2d8f;grid-column:1/-1}
.ed{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.edf{display:flex;flex-direction:column;gap:8px}
.er{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:7px 10px;box-shadow:0 2px 0 #eadcbc;flex-wrap:wrap}
.er>span{width:112px;font-size:13px;color:var(--ink2)}
.er select,.er input[type=text]{flex:1;min-width:120px;font-family:var(--f);font-weight:700;font-size:14px;border:2px solid #e6dcc6;border-radius:9px;padding:6px 8px;background:#fffdf7;color:var(--ink)}
.stp{display:flex;align-items:center;gap:6px}.stp button{width:30px;height:30px;border-radius:50%;background:#ece6ff;font-size:16px}.stp b{min-width:26px;text-align:center}
.chk{display:flex;gap:6px;flex-wrap:wrap}.chk label{background:#f3efe4;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer}.chk label.on{background:var(--ink);color:#fff}.chk input{display:none}
.sw{display:flex;gap:6px}.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 2px #ddd}.sw i.on{box-shadow:0 0 0 3px var(--ink)}
.edp{display:flex;flex-direction:column;gap:10px}
.edp canvas{width:100%;aspect-ratio:16/10;border-radius:16px;background:#20195a}
.diff{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 0 #eadcbc}
.diff b{font-family:var(--h);font-weight:400;font-size:26px}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:#20195a;color:#bff3ff;padding:8px 10px;border-radius:10px;word-break:break-all;user-select:text;-webkit-user-select:text}
.mine{display:flex;flex-direction:column;gap:6px}
.mi{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 10px;box-shadow:0 2px 0 #eadcbc}
.mi i{width:16px;height:16px;border-radius:50%}.mi b{flex:1}.mi button{background:#ece6ff;border-radius:999px;padding:5px 10px;font-size:12px}
.lk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.li{background:#fff;border-radius:16px;padding:10px;box-shadow:0 2px 0 #eadcbc;text-align:center;border:3px solid transparent;display:flex;flex-direction:column;gap:4px;align-items:center}
.li canvas{width:100%;height:110px;border-radius:10px}
.li.on{border-color:var(--aq)}.li.lockd{opacity:.5}
.li b{font-family:var(--h);font-weight:400;font-size:18px}.li small{color:var(--ink2);font-size:12px}
@media (max-width:760px){
  #score{font-size:34px}#modeLine{font-size:11px}#hud{top:56px}#comboBar{width:80px}
  #kai{font-size:13px;padding:8px 10px;top:10px;left:8px}
  #topR{right:8px;top:8px;gap:5px}.rb{height:38px;padding:0 10px 0 8px;font-size:13px}.rb.sq{width:38px}.rb span{display:none}
  #ctrl{left:6px;right:6px;transform:none;flex-wrap:wrap;justify-content:center;gap:5px}
  .seg button{height:30px;padding:0 8px;font-size:12px}.cb{height:36px;padding:0 10px;font-size:12.5px}#bBlind span{display:none}
  #waterBox input{width:64px}
  #hint{bottom:118px;font-size:15px;width:92vw}
  #toasts{top:150px}.toast{font-size:13px}
  .pop.t1{font-size:38px}.pop.t4{font-size:48px}.pop.leg{font-size:50px}.pop.t2{font-size:22px}.pop.fail{font-size:32px}
  .logo .l1{font-size:44px}.logo .l2{font-size:54px}.mb b{font-size:18px}.mb.big b{font-size:26px}
  #dexDetail,.ed{grid-template-columns:1fr}#dexGrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .book{border-radius:16px}.ov{padding:6px}.er>span{width:90px}
  #kbAim{bottom:120px}
}
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<div id="blind"></div>
<div id="flash"></div>
<a id="kai" href="index.html">← Kai.fun</a>
<div id="hud">
  <div id="scoreBox"><div id="score">0</div><div id="modeLine">Free Flip</div></div>
  <div id="comboBox" class="off"><div id="comboMult">x1</div><div id="comboBar"><i></i></div><div id="comboFire"></div></div>
  <div id="target" class="hide"></div>
</div>
<div id="topR">
  <button class="rb" id="bDex" title="Trickdex (T)"><b>📖</b><span>Trickdex</span></button>
  <button class="rb sq" id="bMute" title="Sound (M)">🔊</button>
  <button class="rb sq" id="bMenu" title="Menu (Esc)">☰</button>
</div>
<div id="pops"></div>
<div id="toasts"></div>
<div id="hint">Swipe <b>up</b> to flick the bottle<br><small>faster flick = more spin · curve it to twirl · or hold <b>Space</b></small></div>
<div id="kbAim" class="hide">
  <div class="kbRow"><span>POWER</span><div class="kbBar" id="kbPow"><i></i></div></div>
  <div class="kbRow"><span>SPIN</span><div class="kbPips" id="kbSpin"></div></div>
  <div class="kbRow"><span>TWIRL</span><div class="kbPips" id="kbTwist"></div></div>
  <div class="kbKeys">←→ aim · ↑↓ arc · W/S spin · A/D twirl · release Space</div>
</div>
<div id="ctrl">
  <div class="seg" id="styleSeg" title="Throw style">
    <button data-s="front" class="on" title="Front flip">Front</button><button data-s="back" title="Backhand: the bottle flips backwards">Back</button><button data-s="btb" title="Behind the back: released from behind your head">BTB</button>
  </div>
  <div class="seg" id="arcSeg" title="Arc">
    <button data-a="40">Low</button><button data-a="58" class="on">Mid</button><button data-a="74">High</button>
  </div>
  <button class="cb" id="bBlind" title="No-look: the screen goes dark while the bottle flies (B)">🙈 <span>No-look</span></button>
  <label class="cb" id="waterBox" title="Water level"><span>💧</span><input id="water" type="range" min="0" max="100" value="33"><b id="waterVal">33%</b></label>
  <button class="cb" id="bReset" title="Grab the bottle again (R)">↺</button>
</div>
<div id="timer" class="hide"></div>

<div id="menu" class="ov">
  <div class="menuIn">
    <div class="logo"><div class="l1">BOTTLE FLIP</div><div class="l2">LEGENDS</div></div>
    <div id="menuStats"></div>
    <div class="modes">
      <button class="mb big" data-m="free"><b>Free Flip</b><small>sandbox · build combos</small></button>
      <button class="mb" data-m="challenge"><b>Trick Challenges</b><small>pick a trick from the Trickdex</small></button>
      <button class="mb" data-m="attack"><b>Combo Attack</b><small>90 seconds · chain everything</small></button>
      <button class="mb" data-m="daily"><b>Daily Trick</b><small id="dailyName">today's trick</small></button>
    </div>
    <div class="menuRow">
      <button class="mb2" id="mWorlds">🏠 Worlds</button>
      <button class="mb2" id="mLocker">🧴 Bottles</button>
      <button class="mb2" id="mEditor">🛠️ Trick Lab</button>
      <button class="mb2" id="mDex">📖 Trickdex</button>

// main.js - boot, frame loop, and a small window.BF hook for automated tests
(function boot() {
  loadSave();
  SCENE.init(); initFX(); buildHand(); buildArc();
  HUD.init(); MENU.init(); initInput();
  const qs = new URLSearchParams(location.search);
  if (qs.has('unlock')) GAME.debugUnlock = true;
  if (!isWorldOpen(WORLD[SAVE.set.world] || WORLDS[0])) SAVE.set.world = 'kitchen';
  if (!isBottleOpen(BOTTLE[SAVE.set.bottle] || BOTTLES[0])) SAVE.set.bottle = 'water';
  if (qs.get('world') && WORLD[qs.get('world')]) SAVE.set.world = qs.get('world');
  MODES.mode = 'free'; GAME.loadWorld(SAVE.set.world); HUD.mode(); HUD.syncCtrl();
  if (SAVE.seenHint) $('#hint').classList.add('fade');
  try { document.fonts.ready.then(() => { if (GAME.state === 'ready') GAME.setBottle(true); }); } catch (e) {}
  if (qs.has('play')) { MENU.started = true; MENU.close(); } else MENU.open();
  let last = performance.now(), acc = 0, frames = 0, fps = 60;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt; frames++; if (acc > 0.5) { fps = frames / acc; acc = 0; frames = 0; }
    if (!BF.manual) GAME.frame(dt);
    SCENE.render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.BF = Object.assign(window.BF || {}, {
    ready: true, GAME, PHYS, TRACK, MODES, SAVE, TRICKS, WORLDS, COLL, FX, DEX, EDITOR,
    fps: () => Math.round(fps),
    state: () => GAME.state,
    flick(p) { return GAME.throwNow(Object.assign({ power: 1.2, elev: 58, yaw: 0, spin: 21, twist: 0, style: SAVE.set.style, blind: GAME.blind, src: 'test' }, p || {})); },
    sim(sec, step) { step = step || 1 / 60; const n = Math.round(sec / step); for (let i = 0; i < n; i++) GAME.frame(step); return GAME.state; },
    simUntil(st, maxSec) { let t = 0; while (GAME.state !== st && t < (maxSec || 10)) { GAME.frame(1 / 60); t += 1 / 60; } return GAME.state === st; },
    result: () => GAME.lastResult, award: () => GAME.lastAward,
    unlockAll() { GAME.debugUnlock = true; },
    world(id) { SAVE.set.world = id; MODES.start('free'); },
    bottle(id, water) { SAVE.set.bottle = id; if (water != null) SAVE.set.water = water; HUD.syncCtrl(); GAME.regrip(); },
    pose() { const B = PHYS.B; return { p: B.pos.toArray(), up: bodyAxis(B).toArray(), v: B.v.length(), w: B.w.length() }; }
  });
})();

</script>
