<style>

<body>
<canvas id="cv" tabindex="0" aria-label="The Last Letter game world"></canvas>

<div id="hud" class="hide">
  <div id="pagettl"><span id="pch"></span><span id="ppg"></span></div>
  <div id="hbtn">
    <button class="rb" id="bHint" title="Hint (H)" aria-label="Hint">?</button>
    <button class="rb" id="bUndo" title="Rewind your last edit (Z)" aria-label="Rewind">&#x21B6;</button>
    <button class="rb" id="bJour" title="The alphabet: who trusts you (J)" aria-label="Alphabet journal">Aa</button>
    <button class="rb" id="bMenu" title="Menu (Esc)" aria-label="Menu">&#x2630;</button>
  </div>
</div>
<div id="caption" class="hide"><b id="capw"></b><span id="capg"></span></div>

<div id="touch">
  <div class="tl"><button data-b="left" aria-label="left">&#x25C0;</button><button data-b="down" aria-label="down / get off">&#x25BC;</button><button data-b="right" aria-label="right">&#x25B6;</button></div>
  <div class="tr"><button data-b="up" class="sm" aria-label="climb up">&#x25B2;</button><button data-b="edit" class="ed" aria-label="edit nearest word">edit</button><button data-b="jump" class="jp" aria-label="jump">jump</button></div>

<script>
"use strict";
// ===== util.js =====
// util.js - shared helpers for THE LAST LETTER. Everything hangs off window.LL.
const LL = window.LL = { V: '1.0', DEBUG: /[?&]debug/.test(location.search) };
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeBack = t => { t = clamp(t, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const VOWELS = 'AEIOU';
const isVowel = c => VOWELS.indexOf(c) >= 0;
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

// deterministic string hash (FNV-1a) and seeded rng
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
// smooth 1D value noise
function noise1(x, seed) {
  const i = Math.floor(x), f = x - i, h = n => { const v = Math.sin((n + (seed || 0) * 131.7) * 127.1) * 43758.5453; return v - Math.floor(v); };
  const u = f * f * (3 - 2 * f); return lerp(h(i), h(i + 1), u) * 2 - 1;
}
function noise2(x, y, seed) {
  const h = (a, b) => { const v = Math.sin(a * 127.1 + b * 311.7 + (seed || 0) * 74.7) * 43758.5453; return v - Math.floor(v); };
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(h(ix, iy), h(ix + 1, iy), ux), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), ux), uy) * 2 - 1;
}
// safe storage (private windows / blocked storage throw)
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const $ = id => document.getElementById(id);
function el(tag, cls, html, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function shuffle(a, r) { r = r || Math.random; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a, r) { return a[Math.floor((r || Math.random)() * a.length)]; }
// colour helpers: '#rrggbb' <-> [r,g,b]
function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a) { const [r, g, b] = hex2rgb(h); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }
function mixHex(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); }
LL.events = {};
LL.on = (n, f) => (LL.events[n] = LL.events[n] || []).push(f);
LL.emit = (n, a, b) => { const l = LL.events[n]; if (l) for (const f of l) { try { f(a, b); } catch (e) { console.error(e); } } };
LL.now = () => performance.now() / 1000;

// ===== lexicon.js =====
// lexicon.js - the roles a real word can play in the world. Each role has a physics behaviour,
// a default typographic recipe (how its letters are arranged into its shape), an ink colour and a gloss.
LL.ROLES = {
  tree:    { rec: 'tree',   ink: '#2f4a2a', wash: '#9cc58a', gloss: 'a tree. You can stand in its crown.' },
  flora:   { rec: 'flower', ink: '#7a3550', wash: '#f3a9b8', gloss: 'a little growing thing.' },

LL.LEX = {};
(function () {
  for (const line of LL.WORDLIST.trim().split('\n')) {
    const m = line.match(/^(\w+):\s*(.*)$/); if (!m) continue;
    for (const tok of m[2].trim().split(/\s+/)) {
      const [w, rec] = tok.split('/'); const pre = LL.LEX[w], isIdea = m[1] === 'idea';
      // on role lines "/x" is a recipe; on idea lines "/x" assigns a role. Idea lines never overwrite a concrete word.
      let role = m[1], recipe = null;
      if (rec) { if (isIdea && LL.ROLES[rec]) role = rec; else recipe = rec; }
      if (pre && isIdea) { if (rec && LL.ROLES[rec] && pre.role !== rec) { pre.role = rec; pre.rec = LL.ROLES[rec].rec; } continue; }
      LL.LEX[w] = { role, rec: recipe || LL.ROLES[role].rec };
    }
  }
  // a few words with special glosses
  const G = {
    TEE: 'a golf tee. A tiny peg to stand on.', BOLDER: 'a bolder boulder - still solid, and rather pleased with itself.',
    HEART: 'a heart. It beats, and it can bring a broken word back to life.', OLDER: 'an idea - older than you think.',
    IRE: 'an idea - anger, floating about.', ATE: 'an idea - something already eaten.', ICE: 'frozen solid. Slippery, and it floats.',
    LOUD: 'LOUD! Fierce creatures nearby flee from it.', HUSH: 'shhh. Creatures nearby fall fast asleep.',
    RIDGE: 'a ridge of land. It settles where it falls.', CROWN: 'a crown. Heavy with importance, light in the hand.',
    INK: 'a pool of ink - deep, dark and wet.', TIME: 'time itself. While it passes, clockwork moves.',
  };
  for (const k in G) if (LL.LEX[k]) LL.LEX[k].gloss = G[k];
  const REC = { TEE: 'tee', HEART: 'heart', TIME: 'clock', CROWN: 'crown', SEED: 'seed', ACORN: 'seed', EGG: 'seed', NUT: 'seed', BEAN: 'seed', PEA: 'seed', POD: 'seed', KEY: 'key', BELL: 'bell', GONG: 'bell', CHIME: 'bell', DRUM: 'drum', HORN: 'horn', TRUMPET: 'horn', BUGLE: 'horn', WHISTLE: 'horn' };
  for (const k in REC) if (LL.LEX[k]) LL.LEX[k].rec = REC[k];
  for (const k in LL.LEX) { const e = LL.LEX[k]; if (e.role === 'sound' && e.rec === 'bell' && !REC[k]) e.rec = 'shout'; }
})();

// A recipe takes o = { t, tiles:[chars], span, depth, scale, ink, wash, seed } and returns a layout:
// { g:[glyph], w, h, top?, draw?(ctx,o,t) } with glyph = { c, x, y, s, r, sx, sy, col, fk, a, sway, bob, flick, ph, hole }

const REC = LL.REC = {};
const S0 = 46;

REC.row = row;
const holeOK = c => c !== '_';
// ---------- TREE: the first letter is the trunk (a T is already a tree), the rest make the crown ----------
REC.tree = function (o) {

// ---------- FLOWER: a stem with the first letter as the bloom and the rest as petals ----------

REC.hill = function (o) {

// ===== recipes2.js =====
// recipes2.js - boxes, planks, bridges, ladders, ropes, stairs, water, ice, fire and light.

// ===== physics.js =====
// physics.js - Z's controller: run, jump (coyote time + jump buffer + variable height), climb, ride, float in wind.

const PH = LL.PH = { G: 1500, RUN: 250, JUMP: 565, RIDE_JUMP: 820, RIDE_RUN: 330, SPRING: 930, ZW: 24, ZH: 42 };

// talk.js - speech bubbles lettered in each speaker's own voice, typed out like a typewriter; level talk triggers.
const TALK = LL.TALK = { q: [], cur: null, amb: [] };

// a scene line blocks nothing but queues; short lines are ambient and replace each other
LL.on('say', m => {
  const b = { who: m.who, text: m.text, voice: TALK.voiceOf(m.who), t: 0, shown: 0, at: m.at, refuse: m.refuse };
  b.dur = 1.6 + b.text.length * 0.045;

  else TALK.q.push(b);
});
TALK.scene = function (lines, done) { for (const [who, text] of lines) TALK.q.push({ who, text, voice: TALK.voiceOf(who), t: 0, shown: 0, dur: 1.8 + text.length * 0.05, scene: 1 }); if (done) TALK.q.push({ cb: done }); };

TALK.update = function (dt) {

// ===== story.js =====
// story.js - chapter cards, and the end of every chapter: THE SPACE comes, and a letter goes extinct.
const ST = LL.STORY = { space: 0, spaceX: 0, eat: [], cut: false };
LL.CHAPTERS = {
  1: { num: 'Chapter One', sub: 'Where every noun is a thing you can hold.', letter: 'R' },
  2: { num: 'Chapter Two', sub: 'Where the doing-words live, and do.', letter: 'S' },
  3: { num: 'Chapter Three', sub: 'Every word that was ever written down is kept here.', letter: 'L' },
  4: { num: 'Chapter Four', sub: 'A, E, I, O, U - the tide comes in, the tide goes out.', letter: 'E' },
  5: { num: 'Chapter Five', sub: 'The edges of the page, where the Space lives.', letter: 'A' },
  6: { num: 'Chapter Six', sub: 'Nothing left but the last word.', letter: '' },
};
ST.card = function (a, b, c, ms) { const el = $('card'); el.classList.add('hide'); void el.offsetWidth; el.querySelector('.cnum').textContent = a || ''; el.querySelector('.cttl').textContent = b || ''; el.querySelector('.csub').textContent = c || ''; el.style.animationDuration = (ms || 3600) + 'ms'; el.classList.remove('hide'); clearTimeout(ST._ct); ST._ct = setTimeout(() => el.classList.add('hide'), ms || 3600); };
LL.on('levelstart', L => {
  const first = LL.LEVELS.find(x => x.ch === L.ch) === L;
  GM.talkHold = 0.6; if (first && !ST.cut && !LL.NOEXIT) { const C = LL.CHAPTERS[L.ch]; ST.card(C.num, LL.THEMES[L.ch].name, C.sub, 4200); GM.talkHold = 4.3; }
  ST.space = 0; ST.eat = [];
});
ST.onExit = function (L) {
  LL.PROG.done[L.id] = true; LL.PROG.deaths += GM.deaths; LL.SAVE.save();
  if (L.finale) ST.extinction(L.finale); else if (L.ending) LL.ENDING && LL.ENDING.start(); else MAIN.next();
};
ST.LINES = {
  R: [['R', 'There. Can you feel it? The page has gone very quiet.'], ['SPACE', 'shhh.'], ['SPACE', 'so many words. so much noise.'], ['Z', 'Who... what are you?'], ['SPACE', 'i am what is between. the gap you never read. the quiet after every word.'], ['SPACE', 'every word ends in me. i would like them all to end.'], ['R', 'Z! Keep the garden growing. Whatever is left of it!']],
  S: [['S', 'Ssssomething is ssslipping...'], ['SPACE', 'one fewer. one quieter.'], ['Z', 'Leave them alone! What did the letters ever do to you?'], ['SPACE', 'they talk. all of them, all the time. they crowd me out.'], ['S', 'Ssstay brave, little Z. Ssssay something for ussss.']],
  L: [['L', 'Listen. Shelve this somewhere safe: I loved every one of these words.'], ['SPACE', 'a library is only a place for silence that forgot itself.'], ['Z', 'You are not silence. You are just... empty.'], ['SPACE', 'yes. and soon, so will you be.']],
  E: [['E', 'Oh dear. Oh, I am in nearly every word. This will hurt them all.'], ['SPACE', 'the most common letter. the loudest.'], ['Z', 'Without E, half the world falls apart!'], ['SPACE', 'then half the world will finally be quiet.'], ['E', 'Be brave, dear. Even without me, words find a way.']],
  A: [['A', 'I was first. I always thought I would be the last to go.'], ['SPACE', 'first, last. it is all the same to the blank.'], ['Z', 'Then I will be the last. And I will not be quiet.'], ['SPACE', 'z. the least of them. we shall see.']],
};
ST.extinction = function (c) {
  ST.cut = true; GM.mode = 'cut'; ED.close(); GM.z.vx = 0; GM.camFocus = GM.z.x; LL.emit('spacecome', c);
  ST.space = 0.001; ST.spaceX = GM.z.x + 120; ST.letter = c;
  TALK.q = []; TALK.cur = null; TALK.scene(ST.LINES[c] || [['SPACE', 'shhh.']], () => ST.eatLetter(c));
};
ST.eatLetter = function (c) {
  LL.emit('extinct', c);
  // every visible instance of the letter flies up into the Space
  for (const o of GM.objs) for (const q of o.lay.g) if (q.c === c || (q.c === c.toLowerCase() && q.deco)) { const p = OBJ.letterPos(o, q, GM.t); ST.eat.push({ c: q.c, x: o.x + p.x, y: o.y + p.y, s: p.s, t: -Math.random() * 0.8 }); }
  for (const l of GM.S.loose) if (l.c === c && !l.taken) { ST.eat.push({ c, x: l.x, y: l.y - 18, s: 34, t: 0 }); l.taken = true; }
  const saved = (LL.trust[c] || 0) >= 2;
  GM.S.inv = GM.S.inv.filter((x, i) => { if (x !== c) return true; ST.eat.push({ c, x: GM.trail[i].x, y: GM.trail[i].y, s: 30, t: 0 }); return false; });
  for (const id in GM.S.words) GM.S.words[id].t = GM.S.words[id].t.split(c).join('_');
  CORE.settle(GM.S); setTimeout(() => GM.sync(), 500);
  if (LL.PROG.ext.indexOf(c) < 0) LL.PROG.ext += c; if (saved && LL.PROG.kept.indexOf(c) < 0) LL.PROG.kept += c;
  LL.SAVE.save();
  setTimeout(() => {
    const left = 26 - LL.PROG.ext.length;
    ST.card('', c + ' is gone.', 'Every word with ' + (isVowel(c) ? 'an ' : 'a ') + c + ' in it now has a hole. ' + left + ' letters remain.' + (saved ? '  ...but one ' + c + ' trusted you enough to hide in your scarf.' : ''), 5600);
  }, 2600);
  setTimeout(() => { ST.space = -1; }, 4200);
  setTimeout(() => { ST.cut = false; GM.camFocus = null; GM.mode = 'play'; MAIN.next(); }, 8600);
};
ST.update = function (dt) {
  if (ST.space > 0) ST.space = Math.min(1, ST.space + dt * 0.35); else if (ST.space < 0) ST.space = Math.min(0, ST.space + dt * 0.8);
  for (const e of ST.eat) e.t += dt;
  ST.eat = ST.eat.filter(e => e.t < 2.6);
};
// THE SPACE: a hole in the page with a dotted edge, slowly breathing. It has no face. That is the scary part.
ST.drawWorld = function (ctx, t) {
  ST.update(1 / 60);
  const a = ST.space > 0 ? ease(ST.space) : ST.space < 0 ? -ST.space : 0; const x = ST.spaceX, y = 150;
  if (a > 0.01) {
    ctx.save(); const R = 190 * a + Math.sin(t * 1.3) * 8;
    const g = ctx.createRadialGradient(x, y, R * 0.2, x, y, R * 1.6); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.6, 'rgba(255,255,255,0.92)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, R * 1.7, R * 1.15, 0, 0, TAU); ctx.fill();
    ctx.setLineDash([2, 9]); ctx.lineDashOffset = t * 10; ctx.strokeStyle = 'rgba(150,150,165,' + 0.6 * a + ')'; ctx.lineWidth = 1.5;
    ctx.beginPath(); for (let i = 0; i <= 40; i++) { const u = i / 40 * TAU, r = R * (1 + 0.08 * Math.sin(u * 5 + t)); i ? ctx.lineTo(x + Math.cos(u) * r * 1.4, y + Math.sin(u) * r * 0.85) : ctx.moveTo(x + Math.cos(u) * r * 1.4, y + Math.sin(u) * r * 0.85); } ctx.stroke(); ctx.restore();

  G.drawWash(ctx, '#ffd98a', x0, 220, w + 200, 220, 7, 0.7 * k);
  let x = x0 - w / 2; [...b.w].forEach((c, i) => { const a = clamp(k * b.w.length - i, 0, 1), cw = G.adv(c, s, 'ital') * 0.95; G.draw(ctx, c, x + cw / 2, 220 + Math.sin(t * 1.2 + i) * 4 - (1 - a) * 30, s, { col: '#1c2340', fk: 'ital', a }); x += cw; });
};

// ===== main.js =====
// main.js - boot, the fixed-step loop, and the glue between input, the page, the story and the screen.
const MAIN = LL.MAIN = { acc: 0, last: 0, fps: 60, frames: 0, fpsT: 0, paused: false, ready: false };
const STEP = 1 / 120;
MAIN.boot = async function () {
  window.addEventListener('error', e => { $('err').textContent = 'Error: ' + (e.message || e); });
  LL.SAVE.load();
  IN.init(); RD.init(); ED.bind();
  try { await Promise.race([document.fonts && document.fonts.ready, new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  G.reset(); RD.paper = null;
  LL.UI && LL.UI.init && LL.UI.init();
  const q = location.search, m = q.match(/[?&]level=([\d-]+)/);
  if (m && LL.LV[m[1]]) MAIN.play(m[1], true);
  else if (LL.UI && LL.UI.title) LL.UI.title();
  else MAIN.play('1-1', true);
  MAIN.ready = true; MAIN.last = performance.now(); requestAnimationFrame(MAIN.loop);
};
MAIN.play = function (id, instant) {
  const L = LL.LV[id]; if (!L) return;
  const go = () => {
    ED.close(); TALK.q = []; TALK.cur = null; TALK.amb = [];
    GM.load(L); LL.PROG.cur = id; LL.PROG.started = true; LL.SAVE.save();
    if (L.startLent) { const r = CORE.lend(GM.S, L.startLent[0], L.startLent[1]); if (r.ok) { GM.S = r.S; CORE.settle(GM.S); GM.sync(true); GM.z.inside = L.startLent[0]; GM.z.hidden = true; } }
    $('hud').classList.remove('hide'); $('pch').textContent = 'Chapter ' + L.ch + ' · ' + LL.THEMES[L.ch].name; $('ppg').textContent = L.name;
    RD.paper = null; LL.emit('levelstart', L);
  };
  if (instant) go(); else MAIN.fade(go);
};
MAIN.fade = function (mid) { const f = $('fade'); f.classList.add('on'); setTimeout(() => { mid(); setTimeout(() => f.classList.remove('on'), 80); }, 520); };
MAIN.next = function () {
  const i = LL.LEVELS.indexOf(GM.L), n = LL.LEVELS[i + 1];
  LL.PROG.done[GM.L.id] = true; LL.SAVE.save();
  if (n) MAIN.play(n.id); else LL.UI && LL.UI.title && LL.UI.title();
};
LL.on('exit', L => { if (LL.NOEXIT) return; if (LL.STORY && LL.STORY.onExit) LL.STORY.onExit(L); else MAIN.next(); });
MAIN.handle = function (inp) {
  const z = GM.z;
  if (z.inside && (inp.jumpP || inp.edit || inp.downP)) { GM.unlendIfInside(); if (TALK.cur && TALK.cur.scene) TALK.skip(); return; }
  if (TALK.cur && TALK.cur.scene && GM.mode !== 'edit' && (inp.skipKey || (inp.edit && !GM.targets().length && !(GM.L.bells || []).some(b => Math.abs(z.x - b.x) < 70)))) { TALK.skip(); inp.edit = false; }
  if (inp.menu && LL.UI && LL.UI.menu) { LL.UI.menu(); return; }
  if (z.inside) { if (inp.jumpP || inp.edit || inp.downP) { GM.unlendIfInside(); } return; }
  const tg = GM.targets(); if (MAIN.cycleIdx && !inp.cycle) { /* keep */ }
  if (inp.cycle && tg.length > 1) MAIN.cycleIdx = ((MAIN.cycleIdx || 0) + 1) % tg.length; if (!tg.length) MAIN.cycleIdx = 0;
  GM.target = tg.length ? tg[Math.min(MAIN.cycleIdx || 0, tg.length - 1)] : null;
  const bell = (GM.L.bells || []).find(b => Math.abs(z.x - b.x) < 70 && Math.abs(z.y - b.y) < 80);
  if (inp.edit && bell && !GM.target) { GM.doOp(['tide']); GM.bellT = GM.t; FX.ring(bell.x, bell.y - 110, '#1d4a66', 140); LL.emit('caption', { word: 'THE TIDE', kind: 'real', gloss: 'every vowel in the water shifts along: A to E to I to O to U, and round again.' }); return; }
  if (inp.edit && GM.target) ED.openFor(GM.target.o);
  else if (inp.edit && !GM.target) GM.say('Z', 'No word close enough to edit.', null, { short: 1 });
  if (inp.undo) GM.doUndo();
  if (inp.restart) MAIN.play(GM.L.id);
  if (inp.drop && GM.S.inv.length) { const k = GM.S.inv.length - 1; GM.doOp(['drop', k, z.x + z.face * 30, z.y - 10, MAIN.zoneOf(z.x)]); }
  if (inp.hint && LL.UI && LL.UI.hint) LL.UI.hint();
};
MAIN.zoneOf = function (x) { const L = GM.L, ch = L.checks || []; let zz = 0; ch.forEach((c, i) => { if (x > c[0]) zz = i + 1; }); return zz; };
MAIN.loop = function (now) {
  let dt = Math.min(0.1, (now - MAIN.last) / 1000); MAIN.last = now;
  MAIN.frames++; MAIN.fpsT += dt; if (MAIN.fpsT > 1) { MAIN.fps = MAIN.frames / MAIN.fpsT; MAIN.frames = 0; MAIN.fpsT = 0; }
  if (LL.UI && UI.open) UI.padNav(IN.pad());
  if (GM.L && !MAIN.paused) {
    if (ED.open) ED.pad(IN.pad());
    MAIN.acc += dt; let n = 0;
    while (MAIN.acc >= STEP && n < 12) { let inp = ED.open || (LL.UI && UI.open) ? { ax: 0 } : (LL.AUTO && LL.AUTO.active ? LL.AUTO.input(STEP) : IN.poll()); if (GM.mode !== 'play' && !ED.open) { if (inp.skip && TALK.cur) TALK.skip(); if (inp.menu && LL.UI) LL.UI.menu(); inp = { ax: 0 }; } if (!ED.open && GM.mode === 'play' && !(LL.AUTO && LL.AUTO.active)) MAIN.handle(inp); GM.step(STEP, inp); MAIN.acc -= STEP; n++; }
    if (n >= 12) MAIN.acc = 0;
    GM.updateFlights(dt); TALK.update(dt);
  }
  LL.AUDIO && LL.AUDIO.frame && LL.AUDIO.frame(dt);
  try { RD.frame(GM.t, dt); } catch (e) { $('err').textContent = 'Render: ' + e.message; console.error(e); }
  requestAnimationFrame(MAIN.loop);
};
// test hook: run the simulation fast without rendering
MAIN.sim = function (sec, inpF) { const n = Math.round(sec / STEP); for (let i = 0; i < n; i++) { const inp = inpF ? inpF(i * STEP) : (LL.AUTO && LL.AUTO.active ? LL.AUTO.input(STEP) : { ax: 0 }); GM.step(STEP, inp); GM.updateFlights(STEP); TALK.update(STEP); } };
LL.fps = () => MAIN.fps;
addEventListener('load', () => MAIN.boot());

</script>
