<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>calculations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#fbfbf8; --ink:#1d1f24; --blue:#2456d8; --red:#c62828; --green:#2e7d32;
    --alu1:#e4e6ea; --alu2:#b9bec6; --alu3:#8d939c;
    --hand:"Patrick Hand","Comic Sans MS","Comic Neue","Trebuchet MS",cursive;
    --marker:"Permanent Marker","Comic Sans MS","Trebuchet MS",cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--board);color:var(--ink);font-family:var(--hand);}
  #scroller{position:fixed;inset:0;overflow:auto;cursor:grab;overscroll-behavior:contain;}
  #scroller.panning{cursor:grabbing;}
  #board{display:block;}
  /* aluminium whiteboard frame (decorative, never blocks the board) */
  #frame{
    position:fixed;inset:0;pointer-events:none;z-index:4;
    box-shadow:
      inset 0 0 0 9px var(--alu2),
      inset 0 0 0 10px var(--alu3),
      inset 0 0 0 11px #fff,
      inset 0 6px 22px rgba(0,0,0,.10);
  }
  /* ---------- header card ---------- */
  #barWrap{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:5;
    width:min(640px,calc(100vw - 36px));
    background:#fff;border:2.5px solid var(--ink);border-radius:18px;
    box-shadow:5px 6px 0 rgba(29,31,36,.85);
    padding:14px 18px 12px;
  }
  #ttl{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-bottom:12px;}
  #ttl h1{
    font-family:var(--marker);font-weight:400;font-size:40px;line-height:1;letter-spacing:.5px;
    position:relative;padding-bottom:6px;
  }
  #ttl h1 .eq{color:var(--red);}
  #ttl h1 svg{position:absolute;left:-4px;bottom:-6px;width:calc(100% + 8px);height:14px;overflow:visible;}
  #ttl .tag{font-size:18px;color:#7a7d85;margin-bottom:6px;white-space:nowrap;}
  #barRow{display:flex;gap:8px;}
  #bar{
    flex:1;min-width:0;height:52px;padding:0 16px;font-family:var(--hand);font-size:22px;color:var(--ink);
    border:2.5px solid var(--ink);border-radius:12px;background:#fff;outline:none;
  }
  #bar::placeholder{color:#a3a6ad;}
  #bar:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(36,86,216,.14);}
  #solve{
    height:52px;padding:0 22px;border:2.5px solid var(--ink);border-radius:12px;cursor:pointer;
    background:var(--red);color:#fff;font-family:var(--marker);font-size:20px;letter-spacing:.5px;
    box-shadow:3px 3px 0 var(--ink);transition:transform .08s, box-shadow .08s;
  }
  #solve:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  #solve:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  #lvlRow{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;}
  #lvlRow .k{font-family:var(--marker);font-size:16px;color:var(--ink);}
  #lvlLab{justify-self:end;font-size:19px;white-space:nowrap;}
  #lvlLab b{font-family:var(--marker);font-weight:400;color:var(--red);margin-right:7px;}
  #lvlLab i{font-style:normal;color:var(--ink);}
  #lvlSlide{grid-column:1 / -1;position:relative;}
  #lvl{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;cursor:pointer;display:block;}
  #lvl::-webkit-slider-runnable-track{
    height:10px;border-radius:99px;border:2px solid var(--ink);
    background:linear-gradient(90deg,#1d1f24 0%,var(--blue) 35%,#8a3fd1 65%,var(--red) 100%);
  }
  #lvl::-moz-range-track{
    height:6px;border-radius:99px;border:2px solid var(--ink);
    background:linear-gradient(90deg,#1d1f24 0%,var(--blue) 35%,#8a3fd1 65%,var(--red) 100%);
  }
  #lvl::-webkit-slider-thumb{
    -webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;
    background:#fff;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
  }
  #lvl::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);}
  #lvl:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(36,86,216,.25),2px 2px 0 var(--ink);}
  #ticks{display:flex;justify-content:space-between;padding:0 8px;margin-top:-4px;font-size:15px;color:#9a9da4;}
  #ticks span{width:20px;text-align:center;cursor:pointer;line-height:1.2;}
  #ticks span.on{color:var(--red);font-family:var(--marker);}
  #tries{margin-top:10px;padding-top:10px;border-top:2px dashed #e3e4e8;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:18px;color:#7a7d85;}
  #tries button{
    font-family:var(--hand);font-size:19px;color:var(--blue);background:transparent;cursor:pointer;
    border:2px dashed #c7cad1;border-radius:10px;padding:2px 12px;min-height:40px;
  }
  #barWrap.compact #ttl,#barWrap.compact #tries{display:none;}
  #barWrap.compact{padding-top:12px;}
  #tries button:hover{border-color:var(--blue);background:rgba(36,86,216,.06);}
  /* ---------- marker ledge ---------- */
  #ledge{
    position:fixed;left:0;right:0;bottom:0;height:16px;z-index:6;pointer-events:none;
    background:linear-gradient(var(--alu1),var(--alu2) 60%,var(--alu3));
    border-top:1px solid #fff;box-shadow:0 -3px 10px rgba(0,0,0,.08);
  }
  .mk{position:absolute;bottom:12px;height:12px;width:78px;border-radius:3px 6px 6px 3px;box-shadow:0 2px 3px rgba(0,0,0,.25);}
  .mk::after{content:"";position:absolute;right:-12px;top:2px;width:14px;height:8px;border-radius:2px 5px 5px 2px;background:inherit;filter:brightness(.75);}
  .mk.b{right:200px;background:var(--blue);} .mk.r{right:110px;background:var(--red);} .mk.g{right:300px;background:var(--green);width:66px;}
  .eraser{position:absolute;right:28px;bottom:12px;width:56px;height:18px;border-radius:4px;background:#2b2e35;box-shadow:inset 0 -6px 0 #d9d2c3,0 2px 3px rgba(0,0,0,.25);}
  #home{
    position:fixed;bottom:28px;left:26px;z-index:7;
    display:inline-flex;align-items:center;min-height:44px;padding:8px 14px 8px 12px;
    background:#fff27a;color:#3b3a1e;text-decoration:none;font-family:var(--hand);font-size:19px;
    box-shadow:2px 4px 8px rgba(0,0,0,.14);transform:rotate(-3deg);border-radius:2px;
  }
  #home:hover{transform:rotate(-1deg) translateY(-2px);color:#000;}
  @media (max-width:640px){
    #barWrap{top:16px;padding:12px 12px 10px;border-radius:16px;box-shadow:4px 4px 0 rgba(29,31,36,.85);}
    #ttl{margin-bottom:10px;}
    #ttl h1{font-size:31px;}
    #ttl .tag{display:none;}
    #bar{height:48px;font-size:20px;padding:0 12px;}
    #solve{height:48px;padding:0 14px;font-size:18px;}
    #lvlRow{margin-top:8px;gap:0 10px;}
    #lvlLab{font-size:16px;}
    #ticks{font-size:13px;padding:0 5px;}
    #tries{margin-top:6px;padding-top:6px;font-size:15px;gap:4px;}
    #tries button{font-size:16px;padding:1px 8px;}
    .mk.g,.mk.b{display:none;}
    #home{bottom:26px;left:16px;font-size:17px;}
    #frame{box-shadow:inset 0 0 0 6px var(--alu2),inset 0 0 0 7px var(--alu3),inset 0 4px 16px rgba(0,0,0,.08);}
  }
</style>
</head>
<body>
<div id="scroller"><canvas id="board"></canvas></div>
<div id="frame"></div>
<div id="barWrap">
  <div id="ttl">
    <h1>calc<span class="eq">u</span>lations<svg viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true"><path d="M2 9 C 50 3, 110 13, 198 5" fill="none" stroke="#c62828" stroke-width="4" stroke-linecap="round"/></svg></h1>
    <span class="tag">the long way round</span>
  </div>
  <div id="barRow">
    <input id="bar" placeholder="type any equation… like 2+2" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="equation">
    <button id="solve" type="button">solve</button>
  </div>
  <div id="lvlRow">
    <span class="k">expansion</span>
    <span id="lvlLab">expansion: 5</span>
    <div id="lvlSlide">
      <input type="range" id="lvl" min="1" max="10" value="5" aria-label="expansion level">
      <div id="ticks"></div>
    </div>
  </div>
  <div id="tries">try <button type="button">2+2</button><button type="button">(3+4)*2</button><button type="button">2^10/8</button><button type="button">7/3</button></div>
</div>
<div id="ledge"><span class="mk g"></span><span class="mk b"></span><span class="mk r"></span><span class="eraser"></span></div>
<a id="home" href="index.html">&larr; Kai.fun</a>

<script>
// ============ SAFE MATH PARSER ============
function evalExpr(src){
  let i=0; const s=src.replace(/\s+/g,"").replace(/=+$/,"").replace(/×/g,"*").replace(/÷/g,"/");
  if(!s) throw "empty";
  if(/[^0-9+\-*/^().]/.test(s)) throw "letters";
  function peek(){ return s[i]; }
  function num(){
    let st=i;
    while(i<s.length && /[0-9.]/.test(s[i])) i++;
    if(st===i) throw "syntax";
    const v=parseFloat(s.slice(st,i));
    if(isNaN(v)) throw "syntax";
    return v;
  }
  function factor(){
    if(peek()==="-"){ i++; return -factor(); }
    if(peek()==="+"){ i++; return factor(); }
    if(peek()==="("){
      i++; const v=expr();
      if(peek()!==")") throw "syntax";
      i++; return pow(v);
    }
    return pow(num());
  }
  function pow(base){
    if(peek()==="^"){ i++; return Math.pow(base, factor()); }
    return base;
  }
  function term(){
    let v=factor();
    while(peek()==="*"||peek()==="/"){
      const op=s[i++]; const r=factor();
      if(op==="/"){ if(r===0) throw "divzero"; v/=r; }
      else v*=r;
    }
    return v;
  }
  function expr(){
    let v=term();
    while(peek()==="+"||peek()==="-"){
      const op=s[i++]; const r=term();
      v = op==="+"? v+r : v-r;
    }
    return v;
  }
  const v=expr();
  if(i<s.length) throw "syntax";
  if(!isFinite(v)) throw "divzero";
  return {value:v, clean:s};
}
function fmt(n){
  if(Math.abs(n-Math.round(n))<1e-9) return String(Math.round(n));
  return String(Math.round(n*10000)/10000);
}
const HAND="'Comic Sans MS','Comic Neue','Patrick Hand',cursive";
const SUP="⁰¹²³⁴⁵⁶⁷⁸⁹", SUB="₀₁₂₃₄₅₆₇₈₉";
function sup(n){ return String(n).split("").map(c=>c==="-"?"⁻":c==="."?"·":SUP[+c]||c).join(""); }
function sub(n){ return String(n).split("").map(c=>SUB[+c]||c).join(""); }

// ============ THE COMPLICATOR ============
function toRoman(n){
  if(n<=0||n>=4000||Math.round(n)!==n) return null;
  const R=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],
    [50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let out=""; let v=Math.round(n);
  for(const [k,r] of R){ while(v>=k){ out+=r; v-=k; } }
  return out;
}
function complicate(nStr, depth){
  const n=parseFloat(nStr);
  const isInt = Math.abs(n-Math.round(n))<1e-9 && Math.abs(n)<50 && n>=0;
  const forms=[];
  forms.push(["√("+nStr+sup(2)+")","square roots build character"]);
  forms.push(["ln(e"+sup(nStr)+")","e is always watching"]);
  forms.push(["log₁₀(10"+sup(nStr)+")","logs never lie"]);
  forms.push([nStr+"·(sin"+sup(2)+"θ+cos"+sup(2)+"θ)","that bracket is 1. look it up"]);
  forms.push(["-e^(iπ)·"+nStr,"euler made me do it"]);
  forms.push(["det[ "+nStr+" 0 ; 0 1 ]","a matrix. for no reason"]);
  forms.push(["("+fmt(n*10)+")/10","big number energy"]);
  if(isInt && n>=1){
    forms.push(["Σ"+sub("i=1")+sup(String(Math.round(n)))+" 1","counting, but fancy"]);
    forms.push(["∫"+sub(0)+sup(String(Math.round(n)))+" dx","calculus for a "+nStr]);
  }
  if(isInt && n>=2 && n<=6){
    forms.push([Math.round(n)+"!/"+(Math.round(n)-1)+"!","factorials cancel. trust"]);
  }
  let [form, note] = forms[Math.floor(Math.random()*forms.length)];
  if(depth>1 && form.includes(nStr)){
    const inner = complicate(nStr, depth-1);
    form = form.replace(nStr, "("+inner[0]+")");
    note = note+" — and yes, that "+nStr+" is also complicated";
  }
  return [form, note];
}
function buildSteps(clean, value, L, target){
  const steps=[];
  const say=(t,c)=>steps.push({t, c:c||"#1a1a1a"});
  const therefore=()=>steps.push({t:"THEREFORE:  "+clean+" = "+fmt(value), c:"#c62828", big:true});
  const iv=Math.round(value);
  const isInt=Math.abs(value-iv)<1e-9;

  if(L<=1){                              // level 1: just the answer.
    steps.push({t:clean+" = "+fmt(value), c:"#1a1a1a", big:true});
    return steps;
  }
  say("problem:  "+clean);
  if(L===2){ therefore(); say("done. level 2 doesn't mess around.","#8a8a8a"); return steps; }

  const allNums=[...new Set((clean.match(/\d+(\.\d+)?/g)||[]))];
  const nSubs = L>=7? Math.min(3,allNums.length) : L>=5? Math.min(2,allNums.length) : Math.min(1,allNums.length);
  const depth = L>=9? 2 : 1;
  let rewritten=clean;
  allNums.slice(0,nSubs).forEach(nm=>{
    const [form, note]=complicate(nm, depth);
    say("note that "+nm+" = "+form, "#2456d8");
    say("   ("+note+")", "#8a8a8a");
    rewritten=rewritten.split(nm).join("("+form+")");
  });
  if(nSubs) say("so really:  "+rewritten);

  const oneForms=[["(7/7)","seven sevenths of pure power"],
    ["(sin"+sup(2)+"θ+cos"+sup(2)+"θ)","the identity strikes again"],
    ["(0! )","zero factorial. it's 1. don't argue"],
    ["(-e^(iπ))","euler's identity, working overtime"]];
  const mulCount = L>=8? 2 : L>=4? 1 : 0;
  const used=[];
  for(let i2=0;i2<mulCount;i2++){
    let pick;
    do{ pick=Math.floor(Math.random()*oneForms.length); }while(used.includes(pick));
    used.push(pick);
    say("multiply everything by "+oneForms[pick][0]+"  ["+oneForms[pick][1]+"]", "#2456d8");
  }
  if(L>=5)
    say("add (φ"+sup(2)+"−φ−1). that's zero. the golden ratio says hi.", "#8a8a8a");
  if(L>=5){
    say("let x = all of that. then:");
    say("10x = "+fmt(value*10));
    say("x = "+fmt(value));
  }
  if(L>=6 && isInt && iv>=0 && iv<1024)
    say("(= "+iv.toString(2)+sub(2)+" for the robots)", "#8a8a8a");
  if(L>=7){
    const rom=toRoman(value);
    if(rom) say("(= "+rom+" in ancient times)", "#8a8a8a");
    say("sanity check: "+fmt(value)+" = "+fmt(value)+"  ✓", "#8a8a8a");
  }
  if(L>=8){
    say("suppose "+clean+" ≠ "+fmt(value)+".");
    say("that would be embarrassing. contradiction. ∎", "#8a8a8a");
    say("derivative check: d/dx("+fmt(value)+") = 0. constant. stable. good.", "#8a8a8a");
  }
  if(L>=9 && isInt && iv>=0)
    say("(= "+iv.toString(7)+"₇ if you think in weeks)", "#8a8a8a");

  // levels 7+ pad with lemmas until the board is suitably full
  let li=1;
  while(L>=7 && target && steps.length < target-2 && li<40){
    const k=Math.floor(Math.random()*9)+1;
    const [f,note]=complicate(String(k), L>=10?2:1);
    say("lemma "+li+":  "+k+" = "+f, li%2? "#1a1a1a" : "#2456d8");
    if(steps.length < target-2) say("   ("+note+")", "#8a8a8a");
    li++;
  }
  therefore();
  const outro=["that was the easy way","level "+L+" complete","the whiteboard is satisfied","never doubt the process"];
  say("Q.E.D. ∎  ("+outro[Math.floor(Math.random()*outro.length)]+")", "#8a8a8a");
  return steps;
}

// ============ WHITEBOARD ============
// drawing ops are recorded so growth/resize can replay them instantly
let ops=[];
function record(fn){ ops.push(fn); fn(); }
function replay(){ const o=ops; ops=[]; o.forEach(fn=>{ ops.push(fn); fn(); }); }
const cv=document.getElementById("board");
const scroller=document.getElementById("scroller");
const ctx=cv.getContext("2d");
const DPR=Math.min(devicePixelRatio||1, 1.5);
let W=0, H=0;                 // virtual whiteboard size (bigger than the screen)
function setupCanvas(){
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", ()=>{
  if(innerWidth>W){ W=innerWidth; setupCanvas(); replay(); }
});
// drag to pan (mouse); touch uses native scrolling
let pan=null;
scroller.addEventListener("pointerdown",(e)=>{
  if(e.pointerType!=="mouse") return;
  pan={x:e.clientX,y:e.clientY,sl:scroller.scrollLeft,st:scroller.scrollTop};
  scroller.classList.add("panning");
});
addEventListener("pointermove",(e)=>{
  if(!pan) return;
  scroller.scrollLeft=pan.sl-(e.clientX-pan.x);
  scroller.scrollTop=pan.st-(e.clientY-pan.y);
});
addEventListener("pointerup",()=>{ pan=null; scroller.classList.remove("panning"); });
// remember when the human scrolls so auto-follow backs off
let lastUserScroll=0, lastAutoScroll=0;
scroller.addEventListener("scroll",()=>{
  if(performance.now()-lastAutoScroll>80) lastUserScroll=performance.now();
  // tuck the title + examples away once the board scrolls, so the working stays visible
  document.getElementById("barWrap").classList.toggle("compact", scroller.scrollTop>60);
});
function smudgesBand(y0,y1){
  for(let i=0;i<8;i++){
    const px=Math.random()*W, py=y0+Math.random()*(y1-y0);
    const rot=(Math.random()-0.5)*0.6, al=0.045+Math.random()*0.03;
    const fs=16+Math.random()*20, txt=["x=","∴","(2)","dx","≈","??","=0","∞"][i%8];
    record(()=>{
      ctx.save(); ctx.globalAlpha=al; ctx.translate(px,py); ctx.rotate(rot);
      ctx.fillStyle="#555"; ctx.font=fs+"px "+HAND; ctx.fillText(txt,0,0);
      ctx.restore();
    });
  }
  for(let i=0;i<5;i++){
    const px=Math.random()*W, py=y0+Math.random()*(y1-y0);
    const rot=(Math.random()-0.5)*1;
    record(()=>{
      ctx.save(); ctx.globalAlpha=0.05; ctx.fillStyle="#999";
      ctx.translate(px,py); ctx.rotate(rot); ctx.fillRect(-60,-9,120,18);
      ctx.restore();
    });
  }
}
function wipe(){
  ops=[];
  record(()=>{                      // background + faint grid, sized dynamically
    ctx.fillStyle="#f9f8f4";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="rgba(20,20,20,.05)";
    for(let gy=100; gy<H; gy+=100)
      for(let gx=60; gx<W; gx+=100)
        ctx.fillRect(gx,gy,2,2);
  });
  smudgesBand(0,H);
}
function growBoard(){
  const old=H;
  H+=900;
  setupCanvas();
  replay();
  smudgesBand(old,H);
}



function marker(ch, x, y, size, color){
  record(()=>{
    ctx.save();
    ctx.translate(x+(Math.random()-0.5)*1.2, y+(Math.random()-0.5)*2.4);
    ctx.rotate((Math.random()-0.5)*0.09);
    ctx.font="bold "+(size+(Math.random()-0.5)*2)+"px "+HAND;
    ctx.fillStyle=color;
    ctx.globalAlpha=0.82+Math.random()*0.15;
    ctx.fillText(ch,0,0);
    if(Math.random()<0.12){ ctx.globalAlpha=0.25; ctx.fillText(ch,0.8,0.6); }
    ctx.restore();
  });
}
function wobblyOval(cx,cy,rx,ry,color,loops){
  const segs=[];
  const n=40*loops;
  for(let i=0;i<=n;i++){
    const a=i/40*Math.PI*2 - 0.4;
    segs.push([
      cx+Math.cos(a)*(rx+(Math.random()-0.5)*7)+(i/n)*4,
      cy+Math.sin(a)*(ry+(Math.random()-0.5)*5),
    ]);
  }
  return segs.map((p,i)=> i? {a:segs[i-1], b:p, color} : null).filter(Boolean);
}
function strokeSeg(sg){
  record(()=>{
    ctx.save();
    ctx.strokeStyle=sg.color; ctx.lineWidth=3.2; ctx.lineCap="round";
    ctx.globalAlpha=0.85;
    ctx.beginPath(); ctx.moveTo(sg.a[0],sg.a[1]); ctx.lineTo(sg.b[0],sg.b[1]); ctx.stroke();
    ctx.restore();
  });
}

// ============ ANIMATION QUEUE ============
let tasks=[], penY=90, colX=40, colW=0, epoch=0;
function layoutCol(){
  const vw=Math.min(innerWidth, W||innerWidth);
  colW=Math.min(vw-64, 900);
  colX=Math.max(32, Math.round((vw-colW)/2));
  const bw=document.getElementById("barWrap");
  bw.classList.remove("compact");
  const hb=bw.getBoundingClientRect().bottom;
  penY=Math.round(hb+56);
}
function measure(t,size){
  ctx.font="bold "+size+"px "+HAND;
  return ctx.measureText(t).width;
}
function queueLine(step){
  const myEpoch=epoch;
  tasks.push({run:()=>{
    if(myEpoch!==epoch) return;
    let size = step.big? 30 : 21;
    // shrink to fit column
    while(size>13 && measure(step.t,size) > colW-20) size-=1;
    // wrap if still too long
    const words=step.t.split(" ");
    const lines=[]; let cur="";
    words.forEach(w=>{
      if(measure(cur+" "+w,size) > colW-20 && cur){ lines.push(cur); cur=w; }
      else cur = cur? cur+" "+w : w;
    });
    lines.push(cur);
    lines.forEach(ln=>{
      let x=colX + (Math.random()*14);
      const y0=penY;
      for(const ch of ln){
        const w=measure(ch,size);
        const yy=y0+(Math.random()-0.5)*1.5;
        const chX=x;   // snapshot! (capturing x itself drew every char at line end)
        tasks.push({d:16, run:()=>{ if(myEpoch===epoch) marker(ch,chX,yy,size,step.c); }});
        x+=w*0.98+ (ch===" "?2:0.4);
      }
      penY += size*1.55;
      tasks.push({d:60, run:()=>{}});
    });
    if(step.big){
      const wTot=Math.min(measure(step.t,size)+50, colW);
      const cx=colX+wTot/2-10, cy=penY - size*1.55 - size*0.35;
      wobblyOval(cx,cy,wTot/2+16,size*1.15,"#c62828",2).forEach(sg=>{
        tasks.push({d:6, run:()=>{ if(myEpoch===epoch) strokeSeg(sg); }});
      });
      penY += 16;
    }
    // board running out below -> grow the whiteboard (scroll to explore)
    if(penY > H-280) growBoard();
  }});
}
let lastT=0;
function pump(now){
  requestAnimationFrame(pump);
  if(!tasks.length) return;
  if(now-lastT < (tasks[0].d||0)) return;
  lastT=now;
  let n=0;
  while(tasks.length && n<3){
    const t=tasks.shift();
    t.run(); n++;
    if(tasks.length && tasks[0].d>30) break;
  }
  if(tasks.length && performance.now()-lastUserScroll>1600){
    const want=Math.max(0, penY-innerHeight*0.62);
    if(Math.abs(scroller.scrollTop-want)>30){
      lastAutoScroll=performance.now();
      scroller.scrollTop=want;
    }
  }
}
requestAnimationFrame(pump);

// ============ GO ============
function calculate(src){
  epoch++;
  tasks=[]; ops=[];
  wipe();
  layoutCol();
  scroller.scrollTo(0,0); lastUserScroll=0;
  let parsed;
  try{ parsed=evalExpr(src); }
  catch(e){
    const msg = e==="divzero" ? [
      {t:"you tried to divide by zero.", c:"#c62828"},
      {t:"the board refuses.", c:"#c62828", big:true},
      {t:"(╯°□°)╯  try something else", c:"#8a8a8a"},
    ] : [
      {t:"hmm. that's not math i recognize.", c:"#1a1a1a"},
      {t:"try something like:  (3+4)*2   or   2^10/8", c:"#2456d8"},
    ];
    msg.forEach(queueLine);
    return;
  }
  const L=+document.getElementById("lvl").value;
  const capScreen=Math.max(6, Math.floor((innerHeight-150)/33));
  const frac={7:0.9, 8:1.4, 9:2.0, 10:2.8}[L];
  const target=frac? Math.floor(capScreen*frac) : 0;
  buildSteps(parsed.clean, parsed.value, L, target).forEach(queueLine);
}
const lvlEl=document.getElementById("lvl");
const lvlLab=document.getElementById("lvlLab");
try{ const sv=localStorage.getItem("calc_level"); if(sv) lvlEl.value=sv; }catch(e){}
function lvlText(){
  const names={1:"just answer it",2:"barely",3:"a little",4:"noticeable",5:"standard nonsense",
    6:"getting silly",7:"academic",8:"unhinged",9:"thesis mode",10:"THE WHOLE BOARD"};
  lvlLab.innerHTML="<b>"+lvlEl.value+"</b><i>"+names[+lvlEl.value]+"</i>";
  lvlLab.title="expansion "+lvlEl.value+": "+names[+lvlEl.value];
  document.querySelectorAll("#ticks span").forEach((t,i)=>t.classList.toggle("on", i+1===+lvlEl.value));
}
document.getElementById("ticks").innerHTML=Array.from({length:10},(_,i)=>"<span>"+(i+1)+"</span>").join("");
document.querySelectorAll("#ticks span").forEach((t,i)=>t.onclick=()=>{ lvlEl.value=i+1; lvlEl.oninput(); });
lvlEl.oninput=()=>{ lvlText(); try{ localStorage.setItem("calc_level", lvlEl.value); }catch(e){} };
lvlText();
const bar=document.getElementById("bar");
if(innerWidth<520) bar.placeholder="any equation… like 2+2";
bar.addEventListener("keydown",(e)=>{
  if(e.key==="Enter" && bar.value.trim()){
    calculate(bar.value.trim());
    bar.select();
  }
});
document.getElementById("solve").onclick=()=>{
  if(bar.value.trim()) calculate(bar.value.trim()); else bar.focus();
};
document.querySelectorAll("#tries button").forEach(b=>b.onclick=()=>{
  bar.value=b.textContent; calculate(bar.value);
});
W=Math.max(1600, innerWidth); H=1400;
setupCanvas();
wipe();
layoutCol();
// opening doodle
[{t:"the whiteboard is ready.", c:"#1a1a1a"},
 {t:"give me an equation. the slider decides how much worse it gets.", c:"#2456d8"}].forEach(queueLine);
</script>
