<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WikiConnect · Kai.fun</title>
<style>
  :root{
    --ink:#141414; --paper:#ffffff; --muted:#8a8a8a; --line:#e2e2e2;
    --coral:#ff6b5e; --sky:#4aa9d8; --moss:#6fb85c; --grape:#9b7fd4; --sun:#f5b829;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Trebuchet MS",system-ui,sans-serif;
    min-height:100vh; padding:28px 16px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  .back{display:inline-block;text-decoration:none;color:var(--muted);font-size:15px;margin-bottom:18px;}
  .back:hover{color:var(--ink);}
  header{text-align:center;margin-bottom:28px;}
  .wordmark{
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
    font-weight:900; font-size:clamp(40px,8vw,72px);
    transform:rotate(-1.5deg); display:inline-block; line-height:.95;
  }
  .wordmark .w1{color:var(--sky);} .wordmark .w2{color:var(--ink);}
  .subtitle{color:var(--muted);margin-top:10px;font-size:16px;}
  .card{
    border:2px solid var(--ink); border-radius:14px; background:#fff;
    box-shadow:5px 5px 0 var(--ink); padding:18px; margin-bottom:18px;
  }
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
  .row:last-child{margin-bottom:0;}
  .row input, .row select{
    flex:1;min-width:200px;padding:12px;border:2px solid var(--ink);
    border-radius:10px;font-family:inherit;font-size:15px;background:#fff;
  }
  .row input:focus, .row select:focus{outline:none;border-color:var(--sky);}
  .row button{
    padding:12px 22px;border:2px solid var(--ink);border-radius:10px;
    background:var(--sun);color:var(--ink);font-family:inherit;font-weight:700;
    font-size:15px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .row button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink);}
  .row button:disabled{opacity:.5;cursor:default;}
  #customRow{display:none;}
  #customRow.show{display:flex;}
  #wikiTag{font-size:12px;color:var(--muted);margin-top:2px;}
  #status{font-size:14px;color:var(--muted);min-height:22px;margin-top:10px;}
  #pathBar{display:none;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;margin-bottom:18px;}
  .chip{border:2px solid var(--ink);border-radius:20px;padding:4px 12px;background:#fff;}
  .chip.here{background:var(--sun);font-weight:700;}
  .chip.done{background:#e4f4df;border-color:var(--moss);}
  .arrow{color:var(--muted);}
  #browser{display:none;border:2px solid var(--ink);border-radius:14px;
    box-shadow:5px 5px 0 var(--ink);overflow:hidden;background:#fff;}
  #urlbar{
    display:flex;align-items:center;gap:8px;
    border-bottom:2px solid var(--ink);padding:9px 12px;background:#f6f6f6;
    font-size:13px;color:#444;
  }
  #urlbar .dots{display:flex;gap:5px;}
  #urlbar .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);}
  #urlbar .d1{background:var(--coral);} #urlbar .d2{background:var(--sun);} #urlbar .d3{background:var(--moss);}
  #urlText{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:8px;
    padding:5px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #article{
    height:60vh;overflow-y:auto;padding:20px 24px;
    font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.55;
  }
  #article h1.wc-title{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:6px;
    margin-bottom:12px;font-family:Georgia,serif;font-weight:400;}
  #article a{color:#3366cc;text-decoration:none;cursor:default;}
  #article img{max-width:100%;height:auto;}
  #article table{max-width:100%;font-size:12px;border-collapse:collapse;margin:8px 0;}
  #article table td,#article table th{border:1px solid var(--line);padding:3px 6px;}
  #article .infobox{float:right;max-width:270px;margin:0 0 12px 14px;background:#f8f9fa;}
  #article p{margin-bottom:10px;}
  #article h2,#article h3{margin:16px 0 8px;font-family:Georgia,serif;font-weight:400;
    border-bottom:1px solid var(--line);padding-bottom:3px;}
  #article ul,#article ol{margin:0 0 10px 24px;}
  #article .mw-editsection{display:none;}
  .wc-target{
    background:var(--sun); outline:3px solid var(--coral); border-radius:3px;
    padding:0 3px; animation:pulse 0.8s ease infinite alternate;
    color:var(--ink) !important; font-weight:700;
  }
  @keyframes pulse{from{outline-offset:0;}to{outline-offset:4px;}}
  #doneCard{display:none;margin-top:18px;text-align:center;font-size:18px;}
  #doneCard.ok{border-color:var(--moss);box-shadow:5px 5px 0 var(--moss);}
  #doneCard.bad{border-color:var(--coral);box-shadow:5px 5px 0 var(--coral);}
  #doneCard .big{font-size:26px;font-weight:900;margin-bottom:6px;}
  .foot{margin-top:22px;font-size:12px;color:var(--muted);text-align:center;}
  .foot a{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Kai.fun</a>
  <header>
    <div class="wordmark"><span class="w1">Wiki</span><span class="w2">Connect</span></div>
    <div class="subtitle">two pages. one bot. any wiki.</div>
  </header>

  <div class="card">
    <div class="row">
      <select id="wikiSel">
        <option value="https://en.wikipedia.org">English Wikipedia</option>
        <option value="https://simple.wikipedia.org">Simple Wikipedia</option>
        <option value="https://en.wiktionary.org">Wiktionary</option>
        <option value="https://en.wikiquote.org">Wikiquote</option>
        <option value="https://en.wikivoyage.org">Wikivoyage</option>
        <option value="https://en.wikibooks.org">Wikibooks</option>
        <option value="https://species.wikimedia.org">Wikispecies</option>
        <option value="https://meta.wikioasis.org">WikiOasis Meta</option>
        <option value="custom">Custom wiki (Miraheze, WikiOasis, etc.)&hellip;</option>
      </select>
    </div>
    <div class="row" id="customRow">
      <input id="customIn" placeholder="paste a wiki URL, e.g. something.miraheze.org or something.wikioasis.org">
      <button id="useBtn">USE</button>
    </div>
    <div id="wikiTag">wiki: en.wikipedia.org</div>
    <div class="row" style="margin-top:10px;">
      <input id="startIn" placeholder="start page (URL or title)">
      <input id="endIn" placeholder="target page (URL or title)">
      <button id="goBtn">CONNECT</button>
    </div>
    <div id="status">ready.</div>
  </div>

  <div id="pathBar"></div>

  <div id="browser">
    <div id="urlbar">
      <div class="dots"><span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span></div>
      <div id="urlText"></div>
    </div>
    <div id="article"></div>
  </div>

  <div class="card" id="doneCard"></div>

  <div class="foot">
    article content from the selected wiki, used under its free license
    &middot; a Kai.fun experiment
  </div>
</div>

<script>
// ============ THE ACTIVE WIKI ============
// Every MediaWiki site exposes the same API; only the address differs.
let WIKI = {
  host: "en.wikipedia.org",
  api: "https://en.wikipedia.org/w/api.php",
  articlePath: "/wiki/",      // from siteinfo, e.g. "/wiki/$1" -> "/wiki/"
};

const statusEl = document.getElementById("status");
const goBtn = document.getElementById("goBtn");
const browser = document.getElementById("browser");
const articleEl = document.getElementById("article");
const urlText = document.getElementById("urlText");
const pathBar = document.getElementById("pathBar");
const doneCard = document.getElementById("doneCard");
const wikiTag = document.getElementById("wikiTag");

function say(m){ statusEl.textContent = m; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function toTitle(input){
  input = (input||"").trim();
  // accept a full article URL from the active wiki (or any /wiki/-style URL)
  const m = input.match(/https?:\/\/[^\/]+\/(?:wiki\/|index\.php\?title=)([^#?&]+)/i);
  if(m) input = decodeURIComponent(m[1]);
  return input.replace(/_/g," ").trim();
}

// ============ WIKI SWITCHING ============
async function probeApi(base){
  // standard MediaWiki lives at /w/api.php; some installs use /api.php
  for(const path of ["/w/api.php", "/api.php"]){
    const ctl = new AbortController();
    const killer = setTimeout(()=>ctl.abort(), 8000);
    try{
      const url = base + path + "?" + new URLSearchParams({
        action:"query", meta:"siteinfo", siprop:"general", format:"json", origin:"*"});
      const res = await fetch(url, {signal: ctl.signal});
      clearTimeout(killer);
      if(!res.ok) continue;
      const data = await res.json();
      const gen = data?.query?.general;
      if(gen && gen.articlepath){
        return { api: base + path, gen };
      }
    }catch(e){ /* try next */ }
    finally{ clearTimeout(killer); }
  }
  return null;
}

async function setWiki(base){
  base = base.trim().replace(/\/+$/,"");
  if(!/^https?:\/\//i.test(base)) base = "https://" + base;
  try{ base = new URL(base).origin; }catch(e){ say("that's not a valid URL."); return false; }
  say("checking wiki\u2026");
  const found = await probeApi(base);
  if(!found){
    say("couldn't reach a MediaWiki API there. the wiki may block cross-site use, or the URL is off.");
    return false;
  }
  WIKI = {
    host: new URL(base).host,
    api: found.api,
    articlePath: found.gen.articlepath.replace("$1",""),
  };
  wikiTag.textContent = "wiki: " + WIKI.host + " (" + (found.gen.sitename||"") + ")";
  say("ready \u2014 connected to " + (found.gen.sitename || WIKI.host) + ".");
  return true;
}

document.getElementById("wikiSel").addEventListener("change", async (e)=>{
  const v = e.target.value;
  const customRow = document.getElementById("customRow");
  if(v === "custom"){
    customRow.classList.add("show");
    say("paste a wiki URL and hit USE.");
  }else{
    customRow.classList.remove("show");
    await setWiki(v);
  }
});
document.getElementById("useBtn").onclick = ()=>setWiki(document.getElementById("customIn").value);
document.getElementById("customIn").addEventListener("keydown", e=>{
  if(e.key==="Enter") setWiki(e.target.value);
});

// ============ API LAYER ============
let apiCalls = 0;
const REQ_TIMEOUT = 10000;   // no single request may hang longer than 10s
async function api(params, tries=3){
  for(let t=1;;t++){
    const ctl = new AbortController();
    const killer = setTimeout(()=>ctl.abort(), REQ_TIMEOUT);
    try{
      apiCalls++;
      const url = WIKI.api + "?" + new URLSearchParams({format:"json", origin:"*", ...params});
      const res = await fetch(url, {signal: ctl.signal});
      if(!res.ok) throw new Error("HTTP "+res.status);
      return await res.json();
    }catch(e){
      if(t>=tries) throw e;
      await sleep(300*t);
    }finally{
      clearTimeout(killer);
    }
  }
}

async function linksFast(title){
  try{
    const data = await api({action:"query", prop:"links", titles:title,
      pllimit:"500", plnamespace:"0", redirects:"1"});
    const pages = data?.query?.pages || {};
    const out = [];
    for(const id in pages) for(const l of (pages[id].links||[])) out.push(l.title);
    return out;
  }catch(e){ return []; }
}
async function backlinksFast(title){
  try{
    const data = await api({action:"query", prop:"linkshere", titles:title,
      lhlimit:"500", lhnamespace:"0", lhshow:"!redirect"});
    const pages = data?.query?.pages || {};
    const out = [];
    for(const id in pages) for(const l of (pages[id].linkshere||[])) out.push(l.title);
    return out;
  }catch(e){ return []; }
}

async function resolve(title){
  const data = await api({action:"query", titles:title, redirects:"1"});
  const pages = data?.query?.pages || {};
  for(const id in pages){ if(id==="-1") return null; return pages[id].title; }
  return null;
}

// ============ DEEP BIDIRECTIONAL SEARCH ============
const MAX_CALLS = 220;
const CONCURRENCY = 12;
const LEVEL_SAMPLE = 60;
const TIME_LIMIT = 60000;

async function findPath(start, end){
  apiCalls = 0;
  const t0 = performance.now();
  say("resolving pages\u2026");
  const S = await resolve(start), E = await resolve(end);
  if(!S) throw new Error("start page not found: "+start);
  if(!E) throw new Error("target page not found: "+end);
  if(S === E) return [S];

  const fwdSeen = new Map([[S.toLowerCase(), S]]);
  const bwdSeen = new Map([[E.toLowerCase(), E]]);
  const fwdParent = new Map();
  const bwdNext = new Map();
  let fwdFrontier = [S];
  let bwdFrontier = [E];
  let depthF = 0, depthB = 0;

  function buildPath(meetLower){
    const meetF = fwdSeen.get(meetLower);
    const left = [];
    let cur = meetF, guard = 0;
    while(cur && guard++ < 60){ left.unshift(cur); cur = fwdParent.get(cur.toLowerCase()); }
    const right = [];
    cur = bwdNext.get(meetLower); guard = 0;
    while(cur && guard++ < 60){ right.push(cur); cur = bwdNext.get(cur.toLowerCase()); }
    return left.concat(right);
  }

  async function expandWave(frontier, isFwd){
    const nodes = frontier.length > LEVEL_SAMPLE
      ? frontier.slice().sort(()=>Math.random()-0.5).slice(0, LEVEL_SAMPLE)
      : frontier.slice();
    const nextFrontier = [];
    let meetLower = null;

    for(let i=0; i<nodes.length && !meetLower; i+=CONCURRENCY){
      if(apiCalls >= MAX_CALLS || performance.now()-t0 > TIME_LIMIT) break;
      const batch = nodes.slice(i, i+CONCURRENCY);
      const settled = await Promise.allSettled(batch.map(n =>
        isFwd ? linksFast(n) : backlinksFast(n)));
      const results = settled.map(r => r.status==="fulfilled" ? r.value : []);
      for(let j=0;j<batch.length;j++){
        const from = batch[j];
        for(const t of results[j]){
          const lower = t.toLowerCase();
          const seen = isFwd ? fwdSeen : bwdSeen;
          if(seen.has(lower)) continue;
          seen.set(lower, t);
          if(isFwd) fwdParent.set(lower, from);
          else bwdNext.set(lower, from);
          nextFrontier.push(t);
          if((isFwd ? bwdSeen : fwdSeen).has(lower)){ meetLower = lower; break; }
        }
        if(meetLower) break;
      }
      say((isFwd?"exploring outward":"exploring backward")
        +" \u00b7 depth "+(isFwd?depthF+1:depthB+1)
        +" \u00b7 "+(fwdSeen.size+bwdSeen.size).toLocaleString()+" pages mapped"
        +" \u00b7 "+apiCalls+" requests");
    }
    return {nextFrontier, meetLower};
  }

  while(apiCalls < MAX_CALLS && performance.now()-t0 < TIME_LIMIT){
    await sleep(1);   // guaranteed breather so the page can never lock up
    // expand the smaller frontier, but NEVER an empty one (that spun forever)
    let fwdTurn = fwdFrontier.length <= bwdFrontier.length;
    if(fwdTurn && fwdFrontier.length === 0) fwdTurn = false;
    if(!fwdTurn && bwdFrontier.length === 0) fwdTurn = true;
    if((fwdTurn ? fwdFrontier : bwdFrontier).length === 0) break;  // both empty: done
    const r = await expandWave(fwdTurn ? fwdFrontier : bwdFrontier, fwdTurn);
    if(r.meetLower) return buildPath(r.meetLower);
    const FRONTIER_CAP = 5000;
    let nf = r.nextFrontier;
    if(nf.length > FRONTIER_CAP){
      nf = nf.sort(()=>Math.random()-0.5).slice(0, FRONTIER_CAP);
    }
    if(fwdTurn){ fwdFrontier = nf; depthF++; }
    else{ bwdFrontier = nf; depthB++; }
  }
  return null;
}

// ============ ARTICLE RENDERING ============
async function renderArticle(title){
  urlText.textContent = WIKI.host + WIKI.articlePath + title.replace(/ /g,"_");
  articleEl.innerHTML = '<p style="color:#888">loading article\u2026</p>';
  let data = null;
  try{
    data = await api({action:"parse", page:title, prop:"text",
      redirects:"1", disableeditsection:"1"});
  }catch(e){ /* handled below */ }
  let html = data?.parse?.text?.["*"] || "<p style='color:#888'>(couldn't load this article \u2014 moving on)</p>";
  // very large articles can lock the tab while rendering; trim the monster ones
  if(html.length > 900000) html = html.slice(0, 900000) + "<p style='color:#888'>(article trimmed for the demo)</p>";
  articleEl.innerHTML = '<h1 class="wc-title">'+esc(data?.parse?.title||title)+'</h1>' + html;
  articleEl.querySelectorAll("script").forEach(s=>s.remove());
  articleEl.querySelectorAll("img").forEach(im=>{ im.loading = "lazy"; });
  articleEl.querySelectorAll("a").forEach(a=>{
    a.addEventListener("click", e=>e.preventDefault());
    a.removeAttribute("target");
  });
  articleEl.scrollTop = 0;
}

function findAnchor(next){
  const want = next.toLowerCase();
  const prefix = WIKI.articlePath;   // e.g. "/wiki/"
  const anchors = articleEl.querySelectorAll('a[href*="'+prefix+'"]');
  for(const a of anchors){
    let href = a.getAttribute("href") || "";
    const idx = href.indexOf(prefix);
    if(idx === -1) continue;
    let t = href.slice(idx + prefix.length);
    try{ t = decodeURIComponent(t); }catch(e){}
    t = t.split("#")[0].split("?")[0].replace(/_/g," ").toLowerCase();
    if(t === want) return a;
    if((a.getAttribute("title")||"").toLowerCase() === want) return a;
  }
  return null;
}

function showPath(path, at){
  pathBar.style.display = "flex";
  pathBar.innerHTML = path.map((t,i)=>{
    const cls = i<at ? "chip done" : (i===at ? "chip here" : "chip");
    return '<span class="'+cls+'">'+esc(t)+'</span>' + (i<path.length-1?'<span class="arrow">\u2192</span>':"");
  }).join("");
}

async function playDemo(path){
  browser.style.display = "block";
  for(let i=0;i<path.length;i++){
    const here = path[i], next = path[i+1];
    showPath(path, i);
    say("reading \u201C"+here+"\u201D\u2026");
    try{ await renderArticle(here); }catch(e){ /* keep the demo moving */ }
    await sleep(1500);
    if(!next) break;
    const anchor = findAnchor(next);
    if(anchor){
      say("found the link to \u201C"+next+"\u201D \u2014 scrolling to it\u2026");
      anchor.scrollIntoView({behavior:"smooth", block:"center"});
      await sleep(1600);
      anchor.classList.add("wc-target");
      say("clicking \u201C"+next+"\u201D\u2026");
      await sleep(1700);
    }else{
      say("the link to \u201C"+next+"\u201D is tucked in a template \u2014 clicking it anyway\u2026");
      await sleep(1800);
    }
  }
  showPath(path, path.length-1);
}

// if the user pastes article links from another wiki, switch to it automatically
async function maybeAutoSwitch(rawStart, rawEnd){
  const found = [];
  for(const raw of [rawStart, rawEnd]){
    const m = (raw||"").match(/https?:\/\/([^\/\s]+)\//i);
    if(m) found.push({host: m[1].toLowerCase(), origin: "https://"+m[1]});
  }
  if(found.length === 2 && found[0].host !== found[1].host){
    say("those two links are from different wikis \u2014 both pages need to be on the same wiki.");
    return false;
  }
  if(found.length && found[0].host !== WIKI.host){
    say("that link is from "+found[0].host+" \u2014 switching wiki\u2026");
    const ok = await setWiki(found[0].origin);
    if(!ok) return false;
    // reflect the switch in the picker UI
    const sel = document.getElementById("wikiSel");
    let matched = false;
    for(const opt of sel.options){
      if(opt.value !== "custom" && opt.value.includes(found[0].host)){ sel.value = opt.value; matched = true; break; }
    }
    if(!matched){
      sel.value = "custom";
      document.getElementById("customRow").classList.add("show");
      document.getElementById("customIn").value = found[0].origin;
    }
  }
  return true;
}

goBtn.onclick = async () => {
  const rawStart = document.getElementById("startIn").value;
  const rawEnd = document.getElementById("endIn").value;
  if(!(await maybeAutoSwitch(rawStart, rawEnd))) return;
  const start = toTitle(rawStart);
  const end = toTitle(rawEnd);
  doneCard.style.display = "none";
  browser.style.display = "none";
  pathBar.style.display = "none";
  if(!start || !end){ say("enter both pages."); return; }
  goBtn.disabled = true;
  try{
    const t0 = performance.now();
    const path = await findPath(start, end);
    if(!path){
      doneCard.className = "card bad"; doneCard.style.display = "block";
      doneCard.innerHTML = '<div class="big">no path found</div>searched deep on both ends and never met. these two might be true strangers.';
      say(""); return;
    }
    const secs = ((performance.now()-t0)/1000).toFixed(1);
    say("path found in "+secs+"s ("+apiCalls+" requests) \u2014 running the demo\u2026");
    await playDemo(path);
    doneCard.className = "card ok"; doneCard.style.display = "block";
    doneCard.innerHTML = '<div class="big">connected! \uD83C\uDF89</div>'
      + esc(path[0]) + " \u2192 " + esc(path[path.length-1])
      + " in " + (path.length-1) + " click" + ((path.length-1)===1?"":"s")
      + " \u00B7 found in " + secs + "s \u00B7 on " + esc(WIKI.host);
    say("");
  }catch(e){
    say("error: " + (e.message||e) + " \u2014 try again, the wiki hiccuped.");
  }finally{
    goBtn.disabled = false;
  }
};
</script>
</body>
</html>
