<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monke Tycoon: Banana Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --banana:#FFD23F; --banana-d:#D99A00; --coin:#FF9F43; --coin-d:#C96A12; --res:#5CE1E6; --res-d:#2A9FA6;
  --good:#8BD450; --bad:#FF6B5B;
  --c0:#B7C9B0; --c1:#3FC6CC; --c2:#B07CFF; --c3:#FFC21A;
  --ink:#3A2A18; --ink2:#5A4630; --dim:#8A7358;
  --panel:#FFF4DC; --panel2:#FBE8C2; --panel3:#F2D9A8; --line:#E2C58E; --edge:#C9923E; --shadow:#D1AE72;
  --banana-t:#9A6200; --coin-t:#B0520A; --res-t:#0F7880; --good-t:#3A7F1B; --bad-t:#BF3A2B; --focus:#1E8C9A;
  --drawer:390px; --hudH:70px; --sheetPx:0px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#FFF6DE; --ink2:#D8E9D0; --dim:#94B3AB;
    --panel:#0F2E35; --panel2:#15404A; --panel3:#1D5160; --line:#2C6573; --edge:#F3D9A0; --shadow:#07191D;
    --banana-t:#FFD23F; --coin-t:#FF9F43; --res-t:#5CE1E6; --good-t:#8BD450; --bad-t:#FF7B6B; --focus:#FFD23F;
  }
}
:root[data-theme="dark"]{
  --ink:#FFF6DE; --ink2:#D8E9D0; --dim:#94B3AB;
  --panel:#0F2E35; --panel2:#15404A; --panel3:#1D5160; --line:#2C6573; --edge:#F3D9A0; --shadow:#07191D;
  --banana-t:#FFD23F; --coin-t:#FF9F43; --res-t:#5CE1E6; --good-t:#8BD450; --bad-t:#FF7B6B; --focus:#FFD23F;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:#0B4A58;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#world.drag{cursor:grabbing}
#world.pointer{cursor:pointer}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:var(--drawer);z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.res{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:6px 12px 6px 9px;box-shadow:0 4px 0 var(--shadow);min-height:54px}
.res .ico{font-size:22px;line-height:1}
.res .val{font-family:'Lilita One',sans-serif;font-size:21px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.res .val.small{font-size:16px}
.res .sub{font-size:12px;font-weight:800;color:var(--dim);white-space:nowrap}
.res.banana .val{color:var(--banana-t)} .res.coin .val{color:var(--coin-t)} .res.resr .val{color:var(--res-t)} .res.price .val{color:var(--coin-t)}
.bar{height:6px;width:118px;border-radius:4px;background:var(--panel3);overflow:hidden;margin:3px 0 2px}
.bar i{display:block;height:100%;width:0;background:var(--banana);border-radius:4px;transition:width .2s}
.bar i.full{background:var(--bad)}
button.res{cursor:pointer;text-align:left}
.arrow{font-size:12px;margin-left:5px;font-family:'Nunito',sans-serif;font-weight:900}
.arrow.up{color:var(--good-t)} .arrow.down{color:var(--bad-t)}
#spark{width:72px;height:28px;display:block}
.spacer{flex:1}
.iconBtn{width:54px;height:54px;border-radius:16px;border:2px solid var(--line);background:var(--panel);box-shadow:0 4px 0 var(--shadow);font-size:22px;cursor:pointer;display:grid;place-items:center}
.iconBtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--shadow)}

/* ---------- drawer ---------- */
.drawer{position:fixed;z-index:25;top:0;right:0;bottom:0;width:var(--drawer);display:flex;flex-direction:column;background:var(--panel);border-left:4px solid var(--edge);box-shadow:-10px 0 30px #0005;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:10px 8px 8px;border-bottom:2px solid var(--line);background:var(--panel2)}
.tabs button{position:relative;border:none;background:none;border-radius:12px;padding:6px 0 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim)}
.tabs button span{font-size:21px;line-height:1}
.tabs button b{font-size:10.5px;font-weight:900}
.tabs button[aria-selected="true"]{background:var(--panel3);color:var(--ink)}
.tabs .dot{position:absolute;top:3px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--panel2)}
.pane{flex:1;overflow-y:auto;padding:16px 16px 30px;overscroll-behavior:contain;-webkit-user-select:text;user-select:text}
.pane h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:28px;margin:0 0 4px;color:var(--banana-t);line-height:1.1}
.pane h3{font-family:'Lilita One',sans-serif;font-weight:400;font-size:19px;margin:0 0 6px}
.lead{margin:0 0 14px;color:var(--ink2);line-height:1.45;font-size:14.5px;max-width:60ch}
.note{color:var(--dim);font-size:13px;line-height:1.45;margin:8px 0 0}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.empty{text-align:center;padding:26px 12px;color:var(--ink2)}
.empty .big{font-size:48px}

/* build cards */
.bcard{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 12px 10px 8px;margin-bottom:8px;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.bcard:hover{background:var(--panel3)}
.bcard .ic{font-size:30px;text-align:center}
.bcard .nm{font-weight:900;font-size:15.5px}
.bcard .ds{font-size:12.5px;color:var(--ink2);line-height:1.35;margin-top:1px}
.bcard .tg{font-size:11.5px;color:var(--dim);font-weight:800;margin-top:4px;line-height:1.35}
.bcard .cost{font-family:'Lilita One',sans-serif;font-size:17px;color:var(--coin-t);text-align:right;white-space:nowrap}
.bcard .own{font-size:11.5px;color:var(--dim);font-weight:800;text-align:right;white-space:nowrap}
.bcard.poor .cost{color:var(--bad-t)}
.bcard.locked{cursor:not-allowed;opacity:.55}
.bcard.active{border-color:var(--banana);box-shadow:0 0 0 3px #FFD23F66}

/* buttons */
.btn{border:none;border-radius:12px;padding:10px 14px;font-weight:900;font-size:14.5px;cursor:pointer;background:var(--banana);color:#3A2508;box-shadow:0 4px 0 var(--banana-d);transition:transform .06s}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 2px 0 var(--banana-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.coin{background:var(--coin);box-shadow:0 4px 0 var(--coin-d);color:#3A1C04}
.btn.res{background:var(--res);box-shadow:0 4px 0 var(--res-d);color:#062E30}
.btn.ghost{background:var(--panel3);color:var(--ink);box-shadow:0 4px 0 var(--shadow)}
.btn.danger{background:var(--bad);box-shadow:0 4px 0 #A33A2E;color:#2A0804}
.btn.wide{width:100%}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.row2 .btn{flex:1}

/* market */
.bigPrice{font-family:'Lilita One',sans-serif;font-size:46px;color:var(--coin-t);line-height:1}
.bigPrice small{font-family:'Nunito',sans-serif;font-size:14px;color:var(--dim);font-weight:800}
.mEvent{min-height:22px;margin:6px 0 10px;font-weight:900;color:var(--good-t)}
.mEvent.bad{color:var(--bad-t)}
#chart{width:100%;height:150px;display:block;border-radius:12px;background:var(--panel2);border:2px solid var(--line)}
.sellRow{display:flex;gap:8px;margin-top:12px}
.sellRow .btn{flex:1;padding:12px 6px}
input[type=range]{width:100%;accent-color:var(--coin);margin-top:6px}
.switch{display:flex;gap:10px;align-items:center;font-weight:800;margin:6px 0 10px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--coin)}

/* research */
.rwrap{overflow-x:auto}
.rtree{position:relative;width:340px;height:560px;margin:10px auto 0}
.rtree svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rnode{position:absolute;width:104px;height:78px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);padding:6px 5px;text-align:center;cursor:pointer;box-shadow:0 3px 0 var(--shadow);font-size:11.5px;line-height:1.15}
.rnode .ri{font-size:21px;display:block}
.rnode b{display:block;font-size:12px;margin:2px 0 3px}
.rnode .rc{font-weight:900;color:var(--res-t)}
.rnode.done{background:var(--res);color:#062E30;border-color:var(--res-d)} .rnode.done .rc{color:#062E30}
.rnode.lock{opacity:.42}
.rnode.ready{border-color:var(--res);box-shadow:0 0 0 3px #5CE1E666,0 3px 0 var(--shadow)}
.rnode.sel{outline:3px solid var(--banana);outline-offset:2px}

/* voyages */
.vcard{display:grid;grid-template-columns:44px 1fr;gap:10px;background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.vcard .ic{font-size:30px;text-align:center}
.vcard .nm{font-weight:900;font-size:15.5px}
.vcard .ds{font-size:12.5px;color:var(--ink2);line-height:1.4;margin:2px 0 8px}
.prog{height:10px;border-radius:6px;background:var(--panel3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--res),var(--good));width:0;transition:width .3s}
.log{font-size:13px;color:var(--ink2);line-height:1.45;border-top:1px dashed var(--line);padding:7px 0}

/* relics + trophies */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.relic{border-radius:14px;border:2px solid var(--line);background:var(--panel2);padding:10px 6px;text-align:center;font-size:12px;line-height:1.3}
.relic .ri{font-size:30px;display:block;margin-bottom:3px}
.relic b{display:block;font-size:12.5px}
.relic.r0{border-color:var(--c0)} .relic.r1{border-color:var(--c1)} .relic.r2{border-color:var(--c2)} .relic.r3{border-color:var(--c3);box-shadow:0 0 14px #FFC21A55}
.relic.unk{opacity:.5} .relic.unk .ri{filter:grayscale(1) brightness(.35)}
.rar{font-size:10.5px;font-weight:900;text-transform:none}
.rar.r0{color:var(--dim)} .rar.r1{color:var(--c1)} .rar.r2{color:var(--c2)} .rar.r3{color:var(--banana-t)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.tgrid div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--panel3);border:2px solid var(--line)}
.tgrid div.got{background:#FFD23F33;border-color:var(--banana)}
.tgrid div:not(.got){filter:grayscale(1);opacity:.35}

/* quests */
.qcard{background:var(--panel2);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.qcard .qt{display:flex;gap:10px;align-items:center;font-weight:900}
.qcard .qi{font-size:24px}
.qcard .qr{font-size:12.5px;color:var(--dim);font-weight:800;margin-top:4px}
.qcard.done{border-color:var(--good)}

/* stats rows */
.srow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.srow span:last-child{font-weight:900}

/* ---------- inspector ---------- */
.insp{position:fixed;z-index:22;left:84px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:340px;max-width:calc(100vw - 100px - var(--drawer));background:var(--panel);border:2px solid var(--line);border-top:5px solid var(--edge);border-radius:18px;padding:14px;box-shadow:0 12px 30px #0007;max-height:calc(100dvh - var(--hudH) - 40px);overflow:auto}
.insp .ihead{display:flex;gap:10px;align-items:center}
.insp .iic{font-size:34px}
.insp .inm{font-family:'Lilita One',sans-serif;font-size:22px;line-height:1}
.insp .ilv{font-size:12.5px;font-weight:800;color:var(--dim);margin-top:2px}
.insp .x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:none;background:var(--panel3);cursor:pointer;font-size:15px;flex:none}
.insp .iprod{font-family:'Lilita One',sans-serif;font-size:26px;color:var(--banana-t);margin:10px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 8px}
.chip{font-size:11.5px;font-weight:900;border-radius:999px;padding:3px 8px;background:var(--panel3)}
.chip.g{color:var(--good-t)} .chip.b{color:var(--bad-t)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin-top:8px}
.quick button{border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:6px 4px;cursor:pointer;font-size:11.5px;font-weight:900;line-height:1.25}
.quick button span{display:block;font-size:22px}
.quick button[disabled]{opacity:.42;cursor:not-allowed}

/* ---------- floating bits ---------- */
.mapCenter{position:fixed;z-index:21;left:calc((100vw - var(--drawer)) / 2);transform:translateX(-50%)}
.placing{top:calc(var(--hudH) + 8px);display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--banana);border-radius:999px;padding:6px 6px 6px 16px;font-weight:900;box-shadow:0 6px 20px #0006;white-space:nowrap;max-width:94vw}
.placing span{overflow:hidden;text-overflow:ellipsis}
.shipOffer{top:calc(var(--hudH) + 60px);border:2px solid var(--coin);background:var(--panel);border-radius:16px;padding:9px 14px;font-weight:900;box-shadow:0 6px 20px #0006;cursor:pointer;max-width:min(92vw,460px);text-align:center;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #FF9F4344,0 6px 20px #0006}}
.toasts{top:calc(var(--hudH) + 8px);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(460px,92vw)}
.toast{background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--banana);border-radius:14px;padding:9px 14px;font-weight:800;font-size:14px;box-shadow:0 8px 20px #0006;line-height:1.35;animation:tin .25s ease-out;transition:opacity .3s,transform .3s}
.toast.good{border-left-color:var(--good)} .toast.bad{border-left-color:var(--bad)} .toast.gold{border-left-color:var(--coin)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.hint{bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--panel);border:2px solid var(--res);border-radius:16px;padding:10px 12px 10px 14px;font-weight:800;font-size:14px;box-shadow:0 8px 24px #0007;max-width:min(560px,calc(100vw - var(--drawer) - 190px));display:flex;gap:10px;align-items:center;line-height:1.35}
.hint .hstep{background:var(--res);color:#062E30;border-radius:8px;padding:2px 7px;font-size:11.5px;font-weight:900;white-space:nowrap}
.hint .hskip{border:none;background:none;color:var(--dim);font-weight:800;cursor:pointer;white-space:nowrap;text-decoration:underline}
.golden{position:fixed;z-index:30;width:84px;height:84px;border:none;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 0 16px #FFD23F);animation:bob 1.3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-12px) rotate(10deg)}}
.zoomCtl{position:fixed;z-index:19;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.zoomCtl .iconBtn{width:48px;height:48px;font-size:20px;font-weight:900}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#02141acc;padding:18px}
.mcard{width:min(470px,100%);max-height:88dvh;overflow:auto;background:var(--panel);border:3px solid var(--line);border-top:6px solid var(--edge);border-radius:22px;padding:22px;box-shadow:0 20px 60px #000a;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.mcard .mic{font-size:50px;line-height:1}
.mcard h2{font-family:'Lilita One',sans-serif;font-weight:400;font-size:30px;margin:8px 0 8px;color:var(--banana-t);line-height:1.1}
.mcard p{line-height:1.55;color:var(--ink2);margin:0 0 10px}
.mcard ul{padding-left:20px;line-height:1.6;color:var(--ink2);margin:6px 0 14px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--shadow)}
.choice small{display:block;color:var(--dim);font-weight:700;font-size:13px;margin-top:3px}
.choice:hover{border-color:var(--banana)}

/* ---------- phone ---------- */
@media (max-width:820px){
  :root{--drawer:0px}
  .hud{right:0;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0}
  .res{min-height:44px;padding:4px 9px 4px 7px;border-radius:13px;gap:6px}
  .res .val{font-size:17px} .res .ico{font-size:18px} .res .sub{font-size:11px}
  .bar{width:74px}
  #spark,.hideM{display:none!important}
  .iconBtn{width:44px;height:44px;font-size:19px}
  .drawer{top:auto;left:0;width:auto;height:48dvh;border-left:none;border-top:4px solid var(--edge);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px #0006}
  .drawer.min{height:auto}
  .drawer.min .pane{display:none!important}
  .tabs{border-radius:16px 16px 0 0;padding-top:8px}
  .insp{left:8px;right:8px;width:auto;max-width:none;bottom:calc(var(--sheetPx) + 8px);max-height:42dvh}
  .hint{bottom:calc(var(--sheetPx) + 10px);max-width:calc(100vw - 20px)}
  .zoomCtl{top:auto;bottom:calc(var(--sheetPx) + 14px);transform:none;left:auto;right:10px}
  .zoomCtl .iconBtn{width:42px;height:42px}
  .mapCenter{left:50%}
  .shipOffer{top:calc(var(--hudH) + 56px)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="world" aria-label="Your banana island. Drag to move around, scroll or pinch to zoom, tap things to use them."></canvas>

<header class="hud" id="hud">
  <div class="res banana" title="Bananas in storage">
    <span class="ico" aria-hidden="true">🍌</span>
    <div><div class="val" id="vBan">0</div><div class="bar"><i id="barBan"></i></div><div class="sub"><span id="vBps">0</span>/s <span class="hideM">of <span id="vCap">0</span> max</span></div></div>
  </div>
  <div class="res coin" title="Coins">
    <span class="ico" aria-hidden="true">🪙</span>
    <div><div class="val" id="vCoin">0</div><div class="sub hideM">about <span id="vInc">0</span>/s</div></div>
  </div>
  <div class="res resr" id="resPill" title="Research points" hidden>
    <span class="ico" aria-hidden="true">🔬</span>
    <div><div class="val" id="vRes">0</div><div class="sub"><span id="vRps">0</span>/s</div></div>
  </div>
  <button class="res price" id="pricePill" title="Banana price. Open the market">
    <span class="ico" aria-hidden="true">📈</span>
    <div><div class="val"><span id="vPrice">1.00</span><span class="arrow" id="vArrow"></span></div><div class="sub hideM">coins per banana</div></div>
    <canvas id="spark" width="144" height="56"></canvas>
  </button>
  <div class="spacer"></div>
  <div class="res" title="Time of day and weather"><span class="ico" id="vSky" aria-hidden="true">☀️</span><div><div class="val small" id="vWeather">Sunny</div><div class="sub" id="vWeatherSub">Day</div></div></div>
  <button class="iconBtn" id="bSound" aria-label="Sound on. Tap to mute">🔊</button>
</header>

<aside class="drawer" id="drawer">

function mulberry(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash2(x,y,s){ let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul((s|0)+1,1442695041); h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function easeOutBack(k){ const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2); }
function niceNum(n){ if(n<10) return Math.max(1,Math.ceil(n)); const e=Math.pow(10,Math.floor(Math.log10(n))-1); return Math.ceil(n/e)*e; }
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td'];
function fmt(n){
  if(n===Infinity) return '∞';
  if(typeof n!=='number'||!isFinite(n)) return '0';
  const neg=n<0; n=Math.abs(n); let s;
  if(n<1000) s=(n<10&&n%1>0.05)? n.toFixed(1) : Math.floor(n).toLocaleString('en-US');
  else { const e=Math.min(SUF.length-1,Math.floor(Math.log10(n)/3)); const v=n/Math.pow(1000,e); s=(v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2))+SUF[e]; }
  return (neg?'−':'')+s;
}
function fmtP(n){ return n<100? n.toFixed(2) : fmt(n); }
function fmtT(s){ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? h+'h '+m+'m' : m? m+'m '+(x<10?'0':'')+x+'s' : x+'s'; }

/* ================= island generation ================= */
function genMap(seed){
  const R=mulberry(seed>>>0), rr=(a,b)=>a+R()*(b-a);
  let land=new Array(G*G).fill(false);
  const blobs=[]; for(let i=0;i<6;i++) blobs.push({x:rr(1.5,G-2.5),y:rr(1.5,G-2.5),r:rr(1.6,3.4),s:R()<0.55?1:-1});
  for(let y=0;y<G;y++) for(let x=0;x<G;x++){
    let d=Math.hypot(x-C,y-C)/(G/2);
    for(const b of blobs){ const bd=Math.hypot(x-b.x,y-b.y); if(bd<b.r) d-=b.s*0.16*(1-bd/b.r); }
    d+=(R()-0.5)*0.14;
    land[y*G+x]=d<0.8;
  }
  for(let pass=0;pass<2;pass++){
    const nl=land.slice();
    for(let y=0;y<G;y++) for(let x=0;x<G;x++){
      let n=0;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const nx=x+dx,ny=y+dy; if(nx>=0&&ny>=0&&nx<G&&ny<G&&land[ny*G+nx]) n++; }
      const i=y*G+x; if(land[i]&&n<=2) nl[i]=false; else if(!land[i]&&n>=5) nl[i]=true;
    }
    land=nl;
  }
  for(let y=0;y<G;y++) for(let x=0;x<G;x++){ const i=y*G+x;
    if(x===0||y===0||x===G-1||y===G-1) land[i]=false;
    if(Math.abs(x-C)<=2&&Math.abs(y-C)<=2) land[i]=true; }
  const tiles=[]; for(let i=0;i<G*G;i++) tiles.push({t:land[i]?'grass':'water',b:null});
  const isW=(x,y)=>x<0||y<0||x>=G||y>=G||!land[y*G+x];
  for(let y=0;y<G;y++) for(let x=0;x<G;x++){ if(!land[y*G+x]) continue; if(isW(x+1,y)||isW(x-1,y)||isW(x,y+1)||isW(x,y-1)) tiles[y*G+x].t='sand'; }
  const ang=R()*Math.PI*2; let spread=0.7;
  for(let tries=0;tries<4;tries++){
    for(let y=0;y<G;y++) for(let x=0;x<G;x++){ const t=tiles[y*G+x]; if(t.t!=='grass') continue;
      const dx=x-C, dy=y-C; if(Math.hypot(dx,dy)<2.3) continue;
      let a=Math.atan2(dy,dx)-ang; a=Math.atan2(Math.sin(a),Math.cos(a));
      if(Math.abs(a)<spread) t.t='rock'; }
    if(tiles.filter(t=>t.t==='rock').length>=4) break;
    spread+=0.35;
  }
  const free=new Set();
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) free.add((C+dy)*G+(C+dx));
  const cand=[]; for(let y=0;y<G;y++) for(let x=0;x<G;x++){ const i=y*G+x; if(tiles[i].t==='grass'&&!free.has(i)&&Math.hypot(x-C,y-C)<3.6) cand.push(i); }
  for(let k=0;k<5&&cand.length;k++){ const j=(R()*cand.length)|0; free.add(cand[j]); cand.splice(j,1); }
  for(let i=0;i<G*G;i++) if(tiles[i].t==='grass'&&!free.has(i)) tiles[i].t='jungle';
  tiles[C*G+C]={t:'grass',b:{id:'hq',lvl:1,cd:0}};
  return tiles;
}

function hqLvl(){ return S.tiles[C*G+C].b.lvl; }
function lvlF(l){ return l*Math.pow(2,Math.floor(l/10)); }
function relicEff(k){ let s=0; for(const r of RELICS){ const l=S.relics[r.id]||0; if(l&&r.eff[k]) s+=r.eff[k]*l; } return s; }
function nbCount(x,y){ const n={}; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const t=T(x+dx,y+dy); if(t&&t.b) n[t.b.id]=(n[t.b.id]||0)+1; } return n; }
function templesNear(x,y){ let n=0; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ if(!dx&&!dy) continue; const t=T(x+dx,y+dy); if(t&&t.b&&t.b.id==='temple') n++; } return n; }
function waterNb(x,y){ const dirs=[[1,0],[0,1],[-1,0],[0,-1]]; for(const [dx,dy] of dirs){ const t=T(x+dx,y+dy); if(!t||t.t==='water') return {x:x+dx,y:y+dy,dx,dy}; } return null; }
function isNight(){ return S.dayT>0.72||S.dayT<0.03; }
function darkness(){ const d=S.dayT; if(d<0.03) return 1; if(d<0.1) return 1-(d-0.03)/0.07; if(d<0.64) return 0; if(d<0.72) return (d-0.64)/0.08; return 1; }
function shedCap(l){ return 600*l*l*Math.pow(2,Math.floor(l/10)); }

function placeCost(id){ return Math.ceil(B[id].cost*Math.pow(1.32,CACHE.cnt[id]||0)); }

function refundFor(id){ return Math.floor(B[id].cost*Math.pow(1.32,Math.max(0,(CACHE.cnt[id]||1)-1))*0.4); }
function isUnlocked(id){ const u=UNLOCK[id]; if(!u) return true; if((CACHE.cnt[id]||0)>0) return true; if(u.res&&!has(u.res)) return false; if(u.coins&&S.runCoins<u.coins) return false; return true; }
function unlockText(id){ const u=UNLOCK[id]; const parts=[]; if(u.res&&!has(u.res)) parts.push('Research '+RESEARCH.find(r=>r.id===u.res).name); if(u.coins&&S.runCoins<u.coins) parts.push(`Earn ${fmt(u.coins)} coins on this island (${fmt(S.runCoins)} so far)`); return parts.join(', then ')||'Locked'; }
function terrainText(d){ if(d.water) return 'Goes on a beach tile touching the sea'; const t=d.terrain; if(t.length===3) return 'Goes anywhere on land'; if(t[0]==='rock'&&t.length===1) return 'Goes on volcanic rock'; if(t.includes('rock')) return 'Goes on rock or grass'; if(t.includes('sand')) return 'Goes on grass or beach'; return 'Goes on grass'; }
function placeProblem(id,x,y){
  const t=T(x,y), d=B[id]; if(!t) return 'That\'s the open sea.';
  if(t.t==='water') return 'That\'s water. Monkes can\'t build on water.';
  if(t.b) return 'Something is already built there.';
  if(t.t==='jungle') return 'Clear the jungle first. Tap it to see the price.';
  if(!d.terrain.includes(t.t)) return d.name+'s can\'t go there. '+terrainText(d)+'.';
  if(t.t==='rock'&&!has('rock')) return 'Research Rock blasting to build on rock.';
  if(d.water&&!waterNb(x,y)) return 'Docks have to touch the sea.';
  return null;
}
function maxUps(b){ let c=S.coins, l=b.lvl, n=0; while(n<999){ const k=upCost(b.id,l); if(c<k) break; c-=k; l++; n++; } return n; }

/* ================= the production engine ================= */
const CACHE={bps:0,rps:0,cap:250,capMul:1,price:1,fair:1,priceMul:1,prod:{},cnt:{},tap:1,income:0,global:1,maxLvl:1};
function calc(){
  const now=Date.now(), night=isNight(), w=S.weather.id;
  const cnt={}; for(const k in B) cnt[k]=0;
  let maxLvl=1;
  for(const t of S.tiles) if(t.b){ cnt[t.b.id]++; if(t.b.id!=='hq'&&!B[t.b.id].noUp) maxLvl=Math.max(maxLvl,t.b.lvl); }
  CACHE.cnt=cnt; CACHE.maxLvl=maxLvl;
  const fest = now<S.fest.until? S.fest.mult : 1;
  const fren = now<S.frenzy.until? S.frenzy.mult : 1;
  const stormPen = (w==='storm' && now>S.shieldUntil)? (has('weather')?0.92:0.8) : 1;
  const global=(1+0.1*S.peels)*(1+0.05*cnt.portal)*(1+relicEff('all'))*(1+0.03*S.adopted)*(1+0.01*S.ach.length)
    *fest*fren*(has('sing')?2:1)*(w==='rainbow'?1.15:1)*stormPen;
  let bps=0, rps=0; const prod={};
  for(let y=0;y<G;y++) for(let x=0;x<G;x++){
    const t=S.tiles[y*G+x]; if(!t.b) continue;
    const b=t.b, d=B[b.id]; if(!d.base&&!d.res) continue;
    const n=nbCount(x,y);
    let syn=1+0.25*(n.hut||0)+0.1*templesNear(x,y);
    if(b.id==='tree') syn+=0.15*(n.tree||0);
    else if(b.id==='farm') syn+=0.2*(n.tree||0);
    else if(b.id==='factory') syn+=0.3*(n.farm||0);
    else if(b.id==='oven') syn+=0.25*(n.factory||0);
    else if(b.id==='moon') syn+=0.2*((n.tree||0)+(n.moon||0));
    else if(b.id==='rocket') syn+=0.15*(n.lab||0);
    else if(b.id==='lab') syn+=0.25*(n.lab||0);
    let env=1;
    if(b.id==='tree'||b.id==='farm'){ if(night&&!has('nightv')) env*=0.8; if(w==='rain') env*=1.5; if(w==='heat'&&b.id==='tree') env*=0.8; }
    if(b.id==='moon'&&night) env*=3;
    if(b.id==='oven'&&w==='heat') env*=2;
    let rm=1;
    if(b.id==='tree'&&has('soil')) rm*=1.25;
    if(b.id==='farm'&&has('rotation')) rm*=1.4;
    if((b.id==='factory'||b.id==='oven')&&has('assembly')) rm*=1.5;
    if(b.id==='moon'&&has('moonmagic')) rm*=1.5;
    rm*=1+relicEff(b.id);
    const lf=lvlF(b.lvl);
    if(d.res){ const r=d.res*lf*syn*(1+relicEff('res'))*(has('sing')?2:1)*fest; rps+=r; prod[y*G+x]={r,syn,env:1,rm:1+relicEff('res'),global:1,lf}; }
    else { const p=d.base*lf*syn*env*rm*global; bps+=p; prod[y*G+x]={p,syn,env,rm,global,lf}; }
  }
  const capMul=(has('crates')?2:1)*(1+relicEff('cap'));
  let cap=250*Math.pow(4,hqLvl()-1);
  for(const t of S.tiles) if(t.b&&t.b.id==='shed') cap+=shedCap(t.b.lvl);
  CACHE.capMul=capMul; CACHE.cap=cap*capMul;
  CACHE.priceMul=(1+0.1*cnt.dock)*(1+0.02*S.peels)*(1+relicEff('price'))*(has('trade')?1.15:1);
  CACHE.fair=CACHE.priceMul;
  priceNow();
  CACHE.bps=bps; CACHE.rps=rps; CACHE.prod=prod; CACHE.global=global;
  const tapM=(1+relicEff('tap'))*(now<S.frenzy.until?S.frenzy.tap:1)*(1+0.1*S.peels);
  CACHE.tap=(hqLvl()+bps*0.05)*tapM;
  CACHE.income=bps*CACHE.fair;
}
function priceNow(){ const now=Date.now(); const mm=now<S.mkt.until?S.mkt.mult:1, pump=now<S.pump.until?S.pump.mult:1; CACHE.price=S.price*mm*pump*CACHE.priceMul; return CACHE.price; }

/* ================= money moves ================= */
function addBananas(n){ const space=Math.max(0,CACHE.cap-S.bananas); if(n>space){ S.stats.wasted+=n-space; n=space; } S.bananas+=n; S.stats.bananasAll+=n; return n; }
function gainCoins(c){ S.coins+=c; S.runCoins+=c; S.stats.coinsAll+=c; }
function sell(n,auto){
  n=Math.min(n,S.bananas); if(n<=0) return 0;
  priceNow(); const c=n*CACHE.price; S.bananas-=n; gainCoins(c); S.stats.sold+=n;
  S.stats.highPrice=Math.max(S.stats.highPrice, CACHE.price/CACHE.fair);
  if(!auto){ SFX.coin(); floatAtHQ('+'+fmt(c)+' 🪙','#FF9F43'); }
  return c;
}
function rollRelic(w){
  const tot=w.reduce((a,b)=>a+b,0); let r=Math.random()*tot, rar=0;
  for(let i=0;i<w.length;i++){ if(r<w[i]){ rar=i; break; } r-=w[i]; }
  const pool=RELICS.filter(x=>x.rar===rar); const rel=pick(pool.length?pool:RELICS);
  S.relics[rel.id]=(S.relics[rel.id]||0)+1; S.stats.relics++; S.relicNew=true;
  return rel;
}
function peelsFor(){ return Math.floor(Math.sqrt(S.runCoins/1e6)); }

/* ================= save / load ================= */
function save(){ try{ S.last=Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  let raw=null; try{ raw=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
  if(raw&&raw.v===2&&Array.isArray(raw.tiles)&&raw.tiles.length===G*G&&raw.tiles[C*G+C]&&raw.tiles[C*G+C].b){
    const base=newRun(null);
    S=Object.assign(base, raw);
    S.stats=Object.assign(defaultStats(), raw.stats||{});
    S.settings=Object.assign({sound:true,ambient:true}, raw.settings||{});
    S.autosell=Object.assign({on:false,th:1.4}, raw.autosell||{});
    ['res','hist','voyages','voyLog','quests','ach'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
    if(!S.relics||typeof S.relics!=='object') S.relics={};
    ['mkt','fest','frenzy','pump','weather'].forEach(k=>{ if(!S[k]||typeof S[k]!=='object') S[k]=base[k]; });
    return Math.max(0,(Date.now()-(raw.last||Date.now()))/1000);
  }

}

/* ---------- drawing primitives ---------- */
function P(pts,fill){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); if(fill){ ctx.fillStyle=fill; ctx.fill(); } }
function dia(cx,cy,w,h){ ctx.beginPath(); ctx.moveTo(cx,cy-h/2); ctx.lineTo(cx+w/2,cy); ctx.lineTo(cx,cy+h/2); ctx.lineTo(cx-w/2,cy); ctx.closePath(); }
function box(x,y,hw,h,top,l,r){ const hh=hw/2;
  P([x-hw,y, x,y+hh, x,y+hh-h, x-hw,y-h], l);
  P([x+hw,y, x,y+hh, x,y+hh-h, x+hw,y-h], r);
  P([x,y-hh-h, x+hw,y-h, x,y+hh-h, x-hw,y-h], top); }
function roof(x,y,hw,ph,l,r){ const hh=hw/2; P([x-hw,y, x,y+hh, x,y-ph], l); P([x+hw,y, x,y+hh, x,y-ph], r); }
function fq(side,x,y,hw,t0,t1,z0,z1,col){ const s=side==='R'?1:-1, hh=hw/2; const ax=x+s*hw*t0, ay=y+hh*(1-t0), bx=x+s*hw*t1, by=y+hh*(1-t1); P([ax,ay-z0, bx,by-z0, bx,by-z1, ax,ay-z1], col); }
function circ(x,y,r,fill){ ctx.beginPath(); ctx.arc(x,y,Math.max(0.1,r),0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
function ell(x,y,rx,ry,fill){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
function leaf(len,w,col){ ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(len*0.5,-w,len,3); ctx.quadraticCurveTo(len*0.55,w*0.45,0,0); ctx.fillStyle=col; ctx.fill(); }
function nana(x,y,r,rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.beginPath(); ctx.arc(0,0,r,0.25,Math.PI-0.25); ctx.arc(0,-r*0.45,r*0.85,Math.PI-0.35,0.35,true); ctx.closePath(); ctx.fillStyle='#FFD23F'; ctx.fill(); ctx.restore(); }
function bush(x,y,r,c){ circ(x,y-r*0.6,r,c); circ(x-r*0.65,y-r*0.25,r*0.72,c); circ(x+r*0.65,y-r*0.25,r*0.72,c); circ(x-r*0.25,y-r*1.05,r*0.42,'rgba(255,255,255,0.09)'); }

/* ---------- picking ---------- */
function pickTile(sx,sy){
  const p=s2w(sx,sy);
  for(let s=2*(G-1);s>=0;s--) for(let x=Math.min(G-1,s);x>=Math.max(0,s-(G-1));x--){ const y=s-x, t=S.tiles[y*G+x]; if(!t.b) continue;
    const {cx,cy}=tc(x,y), h=HT[t.t], top=TOPH[t.b.id]||30;
    if(Math.abs(p.x-cx)<22&&p.y>cy-h-top&&p.y<cy-h+TH/2) return {x,y}; }
  for(let s=2*(G-1);s>=0;s--) for(let x=Math.min(G-1,s);x>=Math.max(0,s-(G-1));x--){ const y=s-x, t=S.tiles[y*G+x]; if(t.t==='water') continue;
    const {cx,cy}=tc(x,y), h=HT[t.t];
    if(Math.abs(p.x-cx)/(TW/2)+Math.abs(p.y-(cy-h))/(TH/2)<=1) return {x,y}; }

const ptrs=new Map(); let dragMoved=false, pinch=null, downPos=null;

function endPtr(e,cancel){

function startPlacing(id){

function tryPlace(id,x,y){
  const why=placeProblem(id,x,y); if(why){ toast(why,'bad'); SFX.err(); return false; }
  const c=placeCost(id); if(S.coins<c){ toast(`You need 🪙 ${fmt(c)} for that. Sell some bananas!`,'bad'); SFX.err(); return false; }
  S.coins-=c; T(x,y).b={id,lvl:1,cd:0}; S.stats.placed++; ANIM[y*G+x]={built:NOW_T};

}

  g.beginPath(); g.arc(X(hs.length-1),Y(hs[hs.length-1]),4,0,Math.PI*2); g.fillStyle=col; g.fill();

function drawSpark(){
  const c=$('spark'); if(!c||c.offsetParent===null) return; const g=c.getContext('2d'); if(!g) return; const w=c.width, h=c.height; g.clearRect(0,0,w,h);
  const hs=S.hist.slice(-40); if(hs.length<2) return; const mn=Math.min(...hs), mx=Math.max(...hs)+1e-9;
  g.beginPath(); hs.forEach((v,i)=>{ const x=4+i/(hs.length-1)*(w-8), y=h-6-(v-mn)/(mx-mn)*(h-12); i?g.lineTo(x,y):g.moveTo(x,y); });
  g.strokeStyle=cssv('--coin-t'); g.lineWidth=3; g.lineJoin='round'; g.stroke();
}

let AC=null, ambG=null, lfoG=null;
function audioInit(){
  if(AC){ if(AC.state==='suspended'&&AC.resume) AC.resume().catch(()=>{}); return; }
  const Ctor=window.AudioContext||window.webkitAudioContext; if(!Ctor) return;
  try{ AC=new Ctor(); }catch(e){ AC=null; return; }
  try{
    const len=AC.sampleRate*4, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; }
    const off=d[len-1]-d[0]; for(let i=0;i<len;i++) d[i]-=off*i/(len-1);
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
    ambG=AC.createGain(); ambG.gain.value=0;
    const lfo=AC.createOscillator(); lfo.frequency.value=0.11; lfoG=AC.createGain(); lfoG.gain.value=0;
    lfo.connect(lfoG); lfoG.connect(ambG.gain);
    src.connect(lp); lp.connect(ambG); ambG.connect(AC.destination); src.start(); lfo.start();
  }catch(e){}
  setAmbient();
}
function setAmbient(){ if(!AC||!ambG) return; const on=S.settings.sound&&S.settings.ambient, t=AC.currentTime; ambG.gain.setTargetAtTime(on?0.045:0,t,0.6); lfoG.gain.setTargetAtTime(on?0.02:0,t,0.6); }
function tone(f,d,type,g,slide){
  if(!AC||!S.settings.sound) return;
  try{ const t0=AC.currentTime, o=AC.createOscillator(), v=AC.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
    v.gain.setValueAtTime(g||0.05,t0); v.gain.exponentialRampToValueAtTime(0.0001,t0+d);
    o.connect(v); v.connect(AC.destination); o.start(t0); o.stop(t0+d+0.03); }catch(e){}
}

/* ================= monke walkers ================= */
function walkerTarget(w){
  const bs=[]; for(let i=0;i<S.tiles.length;i++){ const t=S.tiles[i]; if(t.b&&t.b.id!=='hq') bs.push(i); }
  let i;
  if(bs.length) i=pick(bs);
  else { const land=[]; for(let j=0;j<S.tiles.length;j++){ const t=S.tiles[j]; if(t.t!=='water'&&t.t!=='jungle'&&!t.b) land.push(j); } i=land.length?pick(land):C*G+C; }
  w.tx=(i%G)+0.4+rand(-0.15,0.15); w.ty=((i/G)|0)+0.4+rand(-0.15,0.15);
}
function syncWalkers(){
  const want=Math.min(40,2+2*(CACHE.cnt.hut||0)+S.adopted);
  while(walkers.length<want){ const w={gx:C+0.45+rand(-0.2,0.2),gy:C+0.45+rand(-0.2,0.2),tx:C,ty:C,carry:false,speed:rand(0.7,1.15),phase:Math.random()*6,wait:rand(0,2),face:1}; walkerTarget(w); walkers.push(w); }
  while(walkers.length>want) walkers.pop();
}
function updateWalkers(dt){
  for(const w of walkers){
    if(w.wait>0){ w.wait-=dt; continue; }
    const dx=w.tx-w.gx, dy=w.ty-w.gy, d=Math.hypot(dx,dy);
    if(d<0.04){
      if(w.carry){ w.carry=false; w.wait=rand(0.2,0.8); walkerTarget(w); }
      else { w.carry=true; w.wait=rand(0.4,1.2); w.tx=C+0.45+rand(-0.25,0.25); w.ty=C+0.45+rand(-0.25,0.25); }
      continue;
    }
    const st=Math.min(d,w.speed*dt); w.gx+=dx/d*st; w.gy+=dy/d*st; w.phase+=dt*11;
    const sdx=dx-dy; if(Math.abs(sdx)>0.01) w.face=sdx>0?1:-1;
  }
}

  if(!docks.length) return false;

  const e=g2w(x+wn.dx*1.8,y+wn.dy*1.8), c=g2w(C,C);

  ship={phase:'in',sx:e.x+vx*700-vy*rand(-150,150),sy:e.y+vy*420+vx*rand(-80,80),ex:e.x,ey:e.y,t:0,dur:14,prem:rand(1.6,2.6),max:0,until:0};

function leaveShip(){ if(!ship) return; ship.phase='out'; ship.t=0; ship.dur=12; updateShipOffer(); }

function resolveVoyages(now){

/* ================= quests ================= */
function plural(name){ const n=name.toLowerCase(); return n.endsWith('y')? n.slice(0,-1)+'ies' : n+'s'; }
function questTypes(){
  const t=['build','bps','sell','shake','coins','tap'];
  if(S.tiles.some(x=>x.t==='jungle')) t.push('clear');
  if(CACHE.cnt.dock) t.push('voyage');
  if(CACHE.cnt.lab&&RESEARCH.some(r=>!has(r.id))) t.push('research');
  if(S.tiles.some(x=>x.b&&x.b.id!=='hq'&&!B[x.b.id].noUp)) t.push('level');
  return t;
}
function makeQuest(type){
  const inc=CACHE.income, rw=k=>Math.round(Math.max(40,inc*rand(120,240))*(k||1));
  const q={type,qid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),base:0};
  if((CACHE.cnt.lab||0)>0&&Math.random()<0.35) q.rres=Math.round(Math.max(5,CACHE.rps*120));
  switch(type){
    case 'build': { const ids=ORDER.filter(id=>isUnlocked(id)&&B[id].base>0); const id=pick(ids.length?ids:['tree']); const have=CACHE.cnt[id]||0, n=have+(have<5?2:1);
      Object.assign(q,{id,target:n,text:`Have ${n} ${n>1?plural(B[id].name):B[id].name.toLowerCase()}`,icon:B[id].icon,reward:rw()}); break; }
    case 'bps': { const t=niceNum(Math.max(5,CACHE.bps*2.2)); Object.assign(q,{target:t,text:`Make ${fmt(t)} bananas per second`,icon:'⏱️',reward:rw(1.5)}); break; }
    case 'sell': { const t=niceNum(Math.max(60,CACHE.bps*150,CACHE.cap*0.5)); Object.assign(q,{base:S.stats.sold,target:t,text:`Sell ${fmt(t)} bananas`,icon:'💰',reward:rw()}); break; }
    case 'shake': { const t=pick([10,15,20]); Object.assign(q,{base:S.stats.shakes,target:t,text:`Shake your buildings ${t} times`,icon:'🫨',reward:rw()}); break; }
    case 'clear': { const t=pick([1,2,3]); Object.assign(q,{base:S.cleared,target:t,text:`Clear ${t} jungle tile${t>1?'s':''}`,icon:'🪓',reward:rw()}); break; }
    case 'coins': { const t=niceNum(Math.max(150,inc*300)); Object.assign(q,{base:S.runCoins,target:t,text:`Earn ${fmt(t)} coins`,icon:'🪙',reward:rw()}); break; }
    case 'voyage': Object.assign(q,{base:S.stats.voyages,target:1,text:'Finish a voyage',icon:'⛵',reward:rw(1.3)}); break;
    case 'level': { const t=CACHE.maxLvl+2; Object.assign(q,{target:t,text:`Get any building to level ${t}`,icon:'⬆️',reward:rw()}); break; }
    case 'research': Object.assign(q,{base:S.res.length,target:1,text:'Finish a research project',icon:'🔬',reward:rw()}); break;
    default: { const t=pick([50,100,150]); Object.assign(q,{type:'tap',base:S.stats.taps,target:t,text:`Tap your HQ ${t} times`,icon:'👆',reward:rw(0.8)}); }
  }
  return q;
}
function questProg(q){
  switch(q.type){
    case 'build': return CACHE.cnt[q.id]||0;
    case 'bps': return CACHE.bps;
    case 'sell': return S.stats.sold-q.base;
    case 'shake': return S.stats.shakes-q.base;
    case 'clear': return S.cleared-q.base;
    case 'coins': return S.runCoins-q.base;
    case 'voyage': return S.stats.voyages-q.base;
    case 'level': return CACHE.maxLvl;
    case 'research': return S.res.length-q.base;
    default: return S.stats.taps-q.base;
  }
}
function refillQuests(){
  S.quests=S.quests.filter(q=>q&&q.qid&&q.target);
  let guard=0;
  while(S.quests.length<3&&guard++<10){ const have=S.quests.map(q=>q.type), pool=questTypes().filter(t=>!have.includes(t)); if(!pool.length) break; S.quests.push(makeQuest(pick(pool))); }
}
function claimQuest(i){
  const q=S.quests[i]; if(!q||questProg(q)<q.target) return;
  gainCoins(q.reward); if(q.rres) S.research+=q.rres; S.stats.questsDone++;
  S.quests.splice(i,1); SFX.gold(); toast(`📜 Quest done! +🪙 ${fmt(q.reward)}${q.rres?` and +🔬 ${fmt(q.rres)}`:''}`,'gold');
  refillQuests(); PANE_KEY.quests=''; updateQuests();
}

  calc();
  const eff=sec>600?0.6:1, made=CACHE.bps*sec*eff, res=CACHE.rps*sec*eff;

  if(has('market')&&S.autosell.on){ earned=made*CACHE.fair*0.95; gainCoins(earned); S.stats.sold+=made; S.stats.bananasAll+=made; }
  else { const got=addBananas(made); lost=made-got; }
  S.research+=res; S.dayT=(S.dayT+sec/DAY_LEN)%1;
  const now=Date.now();
  if(S.weather.until&&S.weather.until<now){ S.weather={id:'sun',until:0}; S.forecast=rollWeather(); }
  S.nextWeather=Math.max(S.nextWeather,now+rand(40,120)*1000);
  S.nextGold=now+rand(20,60)*1000; S.nextShip=now+rand(30,80)*1000;
  S.nextEvent=Math.max(S.nextEvent,now+rand(90,180)*1000); S.nextMkt=Math.max(S.nextMkt,now+rand(30,90)*1000);
  ship=null; calc();
  if(report&&sec>=60&&(made>0||res>0)&&!MODAL) showOffline({sec,made,earned,res,lost});
}

/* ================= main loop ================= */
let lastFrame=0, lastWall=Date.now(), calcAcc=1, uiAcc=1, paneAcc=1, secAcc=0, saveAcc=0, fullWarned=false;
function goldenGap(){ return rand(60,150)*1000/(has('golden')?2:1)/(S.weather.id==='rainbow'?3:1); }
function tick(dt){
  S.dayT=(S.dayT+dt/DAY_LEN)%1;
  if(CACHE.bps>0) addBananas(CACHE.bps*dt);
  if(CACHE.rps>0) S.research+=CACHE.rps*dt;
  mktAcc+=dt; if(mktAcc>=0.5){ mktAcc=0; marketStep(); }
}
function everySecond(){
  const now=Date.now();
  if(S.weather.id!=='sun'&&S.weather.until&&now>=S.weather.until) endWeather();
  else if(S.weather.id==='sun'&&now>=S.nextWeather) startWeather(S.forecast||rollWeather());
  if(S.mkt.name&&now>=S.mkt.until){ toast(`${S.mkt.mult>1?'📉':'📈'} ${S.mkt.name} is over. Prices are back to normal.`); S.mkt={mult:1,until:0,name:''}; priceNow(); }
  if(now>=S.nextMkt&&!S.mkt.name) startMktEvent();
  const gd=$('golden');
  if(!gd.hidden&&now>goldenUntil) gd.hidden=true;
  if(now>=S.nextGold){ if(gd.hidden&&!MODAL) spawnGolden(); S.nextGold=now+goldenGap(); }
  if(!ship&&now>=S.nextShip){ if((CACHE.cnt.dock||0)>0&&S.weather.id!=='storm') spawnShip(); S.nextShip=now+rand(70,140)*1000/(has('trade')?2:1); }
  if(now>=S.nextEvent){ if(!MODAL&&!PLACING&&S.stats.placed>=3){ const pool=EVENTS.filter(e=>e.id!==S.lastEvent&&e.cond()); if(pool.length){ const ev=pick(pool); S.lastEvent=ev.id; showEvent(ev); } S.nextEvent=now+rand(200,360)*1000; } else S.nextEvent=now+20000; }
  resolveVoyages(now);
  if(has('market')&&S.autosell.on&&S.bananas>=1&&(CACHE.price>=CACHE.fair*S.autosell.th||S.bananas>=CACHE.cap*0.95)) sell(S.bananas,true);
  if(S.bananas>=CACHE.cap*0.999){ if(!fullWarned&&CACHE.bps>0){ fullWarned=true; toast('📦 Storage is full! Sell bananas, or upgrade your HQ or sheds.','bad'); } } else if(S.bananas<CACHE.cap*0.9) fullWarned=false;
  checkAch(); refillQuests();
  S.stats.bestBps=Math.max(S.stats.bestBps,CACHE.bps);
  ambientTick();
}
function frame(ts){
  const wall=Date.now(), gap=(wall-lastWall)/1000; lastWall=wall;
  if(gap>3) applyOffline(gap,gap>=60);
  const dt=lastFrame?clamp((ts-lastFrame)/1000,0,0.1):0.016; lastFrame=ts;
  calcAcc+=dt; if(calcAcc>=0.25){ calcAcc=0; calc(); }
  tick(dt); updateWalkers(dt); updateParticles(dt); updateShip(dt); updateWeatherFx(dt);
  try{ render(ts/1000); }catch(e){ if(!frame.err){ frame.err=1; console.error(e); } }
  uiAcc+=dt; if(uiAcc>=0.15){ uiAcc=0; updateHUD(); renderInspector(false); updateShipOffer(); if(PLACING) updatePlacingBar(); }
  paneAcc+=dt; if(paneAcc>=0.35){ paneAcc=0; updatePane(); updateDots(); updateHint(); }
  secAcc+=dt; if(secAcc>=1){ secAcc=0; everySecond(); }
  saveAcc+=dt; if(saveAcc>=15){ saveAcc=0; save(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
addEventListener('pagehide',save);

function init(){
  let hadSave=false; try{ hadSave=!!localStorage.getItem(SAVE_KEY); }catch(e){}
  const off=load();
  calc(); initPanes(); updateSoundBtn();
  if(isMobile()) $('drawer').classList.add('min');
  setTab('build'); layout(); fitCamera(); syncWalkers(); refillQuests();
  for(let i=0;i<40;i++) marketStep();
  if(!hadSave) showWelcome(); else if(off>2) applyOffline(off,true);
  lastWall=Date.now();
  requestAnimationFrame(frame);
}
init();
</script>
</body>
</html>
