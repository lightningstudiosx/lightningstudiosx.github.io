<body>
<header id="top">
  <a id="kai" href="index.html">← Kai.fun</a>
  <h1 id="ttl">THE FOREVER RACE</h1>
  <div id="clock" title="How long this race has been running. It started the first time you opened this page.">
    <span id="clockLbl">RACE TIME</span><b id="clockT" aria-live="off">00:00:00.0</b>
  </div>
  <nav id="btns">
    <button id="bStand" class="pbtn" title="Everyone's position and the gaps between them">STANDINGS</button>
    <button id="bCmp" class="pbtn alt" title="Compare any two racers">COMPARE</button>
    <button id="bLog" class="pbtn alt" title="Every milestone so far">LOG <i id="logN"></i></button>
    <button id="bW60" class="pbtn warp" title="Preview the future at 60x speed (does not change the real race)">⏩×60</button>
    <button id="bW3600" class="pbtn warp" title="Preview the future at 3600x speed (does not change the real race)">⏩×3600</button>
    <button id="bRestart" class="pbtn red" title="Start a brand new race (asks first)">RESTART</button>
  </nav>
</header>
<div id="warpBar" class="hide" role="status">
  <b>TIME-WARP PREVIEW <span id="warpK"></span></b><span id="warpTxt"></span><span class="wnote">Only a preview of the future: the real race is not changed.</span>
  <button id="warpOff" class="pbtn">BACK TO REAL TIME</button>
</div>
<section id="focus" class="hide" aria-label="Following one racer">
  <div id="fview"><canvas id="fcv" aria-hidden="true"></canvas></div>
  <div id="finfo">
    <div class="fcol">
      <div class="fh"><span id="fRank" class="badge"></span><h2 id="fName"></h2></div>
      <div id="fSpeed"></div>
      <div class="fodo"><b id="fDist">0</b> <span id="fUnit"></span></div>
      <div id="fSci"></div>
      <p id="fNextT"></p>
      <p id="fGap"></p>
    </div>
    <div class="fcol">
      <p id="fFact"></p>
      <p class="fsrc"><span id="fSrc"></span><br><span id="fScale"></span></p>
      <div class="fbtns">
        <button id="fPrev" class="pbtn alt" title="Follow the next slower racer (←)" aria-label="Slower racer">&lt; SLOWER</button>
        <button id="fNext" class="pbtn alt" title="Follow the next faster racer (→)" aria-label="Faster racer">FASTER &gt;</button>
        <button id="fCmp" class="pbtn alt">COMPARE</button>
        <button id="fGo" class="pbtn alt" title="Scroll the list to this lane">LANE</button>
        <button id="fClose" class="pbtn alt" aria-label="Stop following" title="Stop following (Esc)">✕</button>
      </div>
    </div>
  </div>
</section>
<main id="stage">
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="lanes" tabindex="0" aria-label="100 racing lanes, slowest at the top, light at the bottom. Tap a lane to follow that racer."><div id="spacer"></div></div>
  <button id="bFast" class="pbtn alt">JUMP TO LIGHT</button>
</main>
<p id="hint">100 racers at their real speeds · tap a lane to follow it · slowest at the top, light at the bottom</p>
<div id="modal" class="hide" role="dialog" aria-modal="true"><div id="modalIn"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="sheet" class="hide" aria-hidden="true"></div>
<div id="tile" class="hide" aria-hidden="true"></div>
<script>
"use strict";
// ===== core.js =====
{
const FR = window.FR = window.FR || {};
FR.Q = new URLSearchParams(location.search);
FR.$ = s => document.querySelector(s);
FR.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
FR.hash = (a, b, c) => { let h = (a * 374761393 + b * 668265263 + (c || 0) * 2147483647) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
FR.rng = seed => { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
FR.el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const PRE = 'kaifun.foreverrace.';
FR.store = {
  ok: true,
  get(k, d) { try { const v = localStorage.getItem(PRE + k); return v == null ? d : JSON.parse(v); } catch (e) { this.ok = false; return d; } },
  set(k, v) { try { localStorage.setItem(PRE + k, JSON.stringify(v)); } catch (e) { this.ok = false; } },
  del(k) { try { localStorage.removeItem(PRE + k); } catch (e) { } }
};
FR.R = [];
FR.add = (id, name, v, th, vb, fact, src, who) => FR.R.push({ id, name, v, th, vb: vb || 'travelled', fact, src, who: who || 'The ' + name.toLowerCase() });
FR.T = {
  start: 0, warp: 0, wRace: 0, wPerf: 0, fresh: false, base: 0, perf0: 0,
  init() {
    let s = FR.store.get('start', null);
    const now = Date.now();
    if (typeof s !== 'number' || !isFinite(s) || s > now + 60000 || s < 946684800000) { s = now; FR.store.set('start', s); this.fresh = true; }
    this.start = s; this.sync();
  },
  sync() { this.base = Date.now(); this.perf0 = performance.now(); },
  wall() { return this.base + (performance.now() - this.perf0); },
  real() { return Math.max(0, (this.wall() - this.start) / 1000); },
  now() { return this.warp ? this.wRace + (performance.now() - this.wPerf) / 1000 * this.warp : this.real(); },
  setWarp(k) { if (k) { this.wRace = this.now(); this.wPerf = performance.now(); } this.warp = k || 0; },
  restart() { this.warp = 0; this.start = Date.now(); this.sync(); FR.store.set('start', this.start); FR.store.set('seen', 0); }
};
FR.dist = (i, t) => FR.R[i].v * (t == null ? FR.T.now() : t);
FR.pxps = v => 150 * Math.pow(v / 29, 0.33);
FR.mPerPx = v => v / FR.pxps(v);
FR.compare = (a, b) => {
  const A = FR.R[a], B = FR.R[b], fast = A.v >= B.v ? a : b, slow = fast === a ? b : a;
  const vf = FR.R[fast].v, vs = FR.R[slow].v;
  return { fast, slow, metres: vf, secs: vf / vs, ratio: vf / vs };
};
FR.idx = id => FR.R.findIndex(r => r.id === id);
}
// ===== fmt.js =====
{
const FR = window.FR;
const LY = 9.4607304725808e15, AU = 1.495978707e11, EARTH = 4.0075e7;
FR.K = { LY, AU, EARTH, C: 299792458, YEAR: 31557600, MOON: 3.844e8, UNIVERSE: 13.8e9 * 31557600 };
const grp = s => { const [a, b] = s.split('.'); return a.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (b != null ? '.' + b : ''); };
FR.num = (v, sig) => {
  sig = sig || 3; if (!isFinite(v)) return '∞'; if (v === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(v))), dec = FR.clamp(sig - 1 - e, 0, 12);
  let s = v.toFixed(dec); if (Math.abs(+s) >= Math.pow(10, e + 1) && dec > 0) s = v.toFixed(dec - 1);
  return grp(s);
};
const DU = [
  [1e-6, 'nm', 1e-9], [1e-3, 'µm', 1e-6], [1e-2, 'mm', 1e-3], [1, 'cm', 1e-2], [1e3, 'm', 1], [EARTH, 'km', 1e3],
  [1e10, '× round Earth', EARTH], [1e13, 'AU', AU], [2.59020684e13, 'light-hours', 1.0792528488e12],
  [LY, 'light-days', 2.59020684e13], [Infinity, 'light-years', LY]
];
FR.distParts = (m, sig) => {
  m = Math.max(0, m); let u = DU[0];
  for (const d of DU) { u = d; if (m < d[0]) break; }
  return [FR.num(m / u[2], sig || 4), u[1]];
};
FR.fmtDist = (m, sig) => { const p = FR.distParts(m, sig); return p[0] + ' ' + p[1]; };
FR.lightTime = m => {
  const s = m / FR.K.C;

      m.appendChild(FR.el('p', 'big', 'The race has been running for ' + FR.fmtDur(FR.T.real(), 3) + '. Light has gone ' + FR.fmtDist(FR.R[FR.R.length - 1].v * FR.T.real(), 3) + ' and the houseplant ' + FR.fmtDist(FR.R[0].v * FR.T.real(), 3) + '.'));
      m.appendChild(FR.el('p', '', 'Restarting puts all 100 racers back on the start line. This cannot be undone.'));
      const row = FR.el('div', 'mrow'), yes = FR.el('button', 'pbtn red', 'YES, RESTART'), no = FR.el('button', 'pbtn', 'KEEP RACING');
      yes.id = 'restartYes'; no.id = 'restartNo';
      yes.onclick = () => { U.warp(0); FR.T.restart(); FR.Miles.init(0); FR.Miles.ptr = 0; FR.Miles.last = 0; U.close(); FR.toast('AND THEY\'RE OFF!', 'A brand new race has started. Come back tomorrow to see how far everyone got.', 'away'); };
      no.onclick = () => U.close(); row.appendChild(no); row.appendChild(yes); m.appendChild(row);
    }, 'small');
  },
  modal(title, build, cls, tick) {
    const M = $('modal'), I = $('modalIn'); I.innerHTML = ''; I.className = cls || '';
    const hd = FR.el('div', 'mhead'); hd.appendChild(FR.el('b', '', title)); const x = FR.el('button', 'pbtn alt mx', '✕'); x.setAttribute('aria-label', 'Close'); x.onclick = () => U.close(); hd.appendChild(x);
    I.appendChild(hd); const body = FR.el('div', 'mbody'); I.appendChild(body); build(body); modalFn = tick || null; M.classList.remove('hide');
  },
  close() { $('modal').classList.add('hide'); modalFn = null; $('modalIn').innerHTML = ''; },
  tick(t) { if (modalFn) modalFn(t); }
};
}
// ===== stand.js =====
{
const FR = window.FR, U = FR.UI;
const TICKS = [[1e-9, '1 nm'], [1e-6, '1 µm'], [1e-3, '1 mm'], [1, '1 m'], [1e3, '1 km'], [4.0075e7, 'Earth lap'], [3.844e8, 'Moon'], [1.496e11, 'Sun'], [5.9e12, 'Pluto'], [9.4607e15, '1 light-year'], [4.011e16, 'nearest star']];
const STARS = ['plant', 'snail', 'walker', 'cheetah', 'jet', 'iss', 'parker', 'light'];
function track(cv, t) {
  const dpr = Math.min(3, devicePixelRatio || 1), w = cv.clientWidth, h = 150; cv.width = Math.round(w * dpr); cv.height = h * dpr; cv.style.height = h + 'px';
  const X = cv.getContext('2d'), W = cv.width; X.imageSmoothingEnabled = false; X.scale(dpr, dpr);
  const t1 = Math.max(t, 1e-3), lo = Math.log10(FR.R[0].v * t1) - 0.6, hi = Math.log10(FR.R[FR.R.length - 1].v * t1) + 0.6, px = m => 10 + (Math.log10(m) - lo) / (hi - lo) * (w - 20);
  X.fillStyle = '#120f2a'; X.fillRect(0, 0, w, h); X.fillStyle = '#221c4a'; X.fillRect(0, 104, w, 3);
  X.font = '11px "Pixelify Sans", monospace'; X.textBaseline = 'top'; X.textAlign = 'center';
  TICKS.forEach(([m, s]) => { const x = px(m); if (x < 4 || x > w - 4) return; X.fillStyle = '#3a3172'; X.fillRect(Math.round(x), 8, 1, 96); X.fillStyle = '#b9b2d6'; X.fillText(s, x, 112); });
  const rows = new Array(Math.ceil(w / 6)).fill(0);
  FR.R.forEach((r, i) => { const x = px(r.v * t1), b = Math.max(0, Math.min(rows.length - 1, Math.floor(x / 6))), k = rows[b]++; X.fillStyle = ['#8fe0b0', '#7ad8f4', '#f5c842', '#ffa6c8'][i % 4]; X.fillRect(Math.round(x) - 2, 98 - (k % 16) * 6, 4, 4); });
  STARS.forEach(id => { const i = FR.idx(id), s = FR.S[id], x = px(FR.R[i].v * t1); if (!s.cv) return; const c = s.cv[0]; X.drawImage(c, Math.round(x - c.width / 2), 128 - 2 - (FR.hash(i, 2) < 0.5 ? 0 : 0), c.width, c.height); });
  X.textAlign = 'left'; X.fillStyle = '#fff6c0'; X.fillText('← slower   (each gridline is a giant jump in distance)   faster →', 10, 2);
}
U.standings = () => {
  let rows = [], cv = null, last = 0;
  U.modal('STANDINGS', m => {
    m.appendChild(FR.el('p', '', 'Where everyone is right now, on a squashed (logarithmic) track: each gridline is much farther than the last. Tap a racer to follow it.'));
    cv = FR.el('canvas', 'trackC'); m.appendChild(cv);
    const list = FR.el('div', 'stand'); m.appendChild(list);
    for (let i = FR.R.length - 1; i >= 0; i--) {
      const r = FR.R[i], row = FR.el('button', 'srow'); row.dataset.i = i;
      row.appendChild(FR.el('span', 'pos', 'P' + (FR.R.length - i))); row.appendChild(FR.icon(i, 1)); row.appendChild(FR.el('span', 'nm', r.name));
      const dd = FR.el('span', 'dd'), gp = FR.el('span', 'gp'); row.appendChild(dd); row.appendChild(gp);
      row.onclick = () => { U.close(); FR.follow(i, true); }; list.appendChild(row); rows.push([i, dd, gp]);
    }
  }, 'wide', t => {
    const now = performance.now(); if (now - last < 250) return; last = now;
    rows.forEach(([i, dd, gp]) => { const d = FR.R[i].v * t; dd.textContent = FR.fmtDist(d, 5); gp.textContent = i > 0 ? '+' + FR.fmtDist(d - FR.R[i - 1].v * t, 2) + ' on P' + (FR.R.length - i + 1) : 'last'; });
    track(cv, t);
  });
};
}
// ===== cmp.js =====
{
const FR = window.FR, U = FR.UI;
const AGE = FR.K.UNIVERSE;
function pick(sel, i) { FR.R.forEach((r, k) => { const o = FR.el('option', '', 'P' + (FR.R.length - k) + ' · ' + r.name); o.value = k; sel.appendChild(o); }); sel.value = i; }
U.compareText = (a, b) => {
  const c = FR.compare(a, b), F = FR.R[c.fast], S = FR.R[c.slow];
  if (a === b) return { head: 'Pick two different racers!', lines: ['A racer is always exactly as fast as itself.'], c };
  const fw = F.who.replace(/^The /, 'the '), sw = S.who.replace(/^The /, 'the ');
  const head = cap(sw) + ' needs ' + FR.fmtDur(c.secs, 3) + ' to match one second of ' + fw + '.';
  const lines = ['In 1 second, ' + fw + ' covers ' + FR.fmtDist(c.metres, 4) + '.', cap(fw) + ' is ' + FR.num(c.ratio, 4) + '× faster.'];
  if (c.secs > AGE) lines.push('That is ' + FR.num(c.secs / AGE, 3) + '× longer than the universe has existed (13.8 billion years)!');
  else if (c.secs > 80 * FR.K.YEAR) lines.push('That is longer than a whole human lifetime.');
  const t = FR.T.real(); if (t > 1) lines.push('So far in this race, ' + fw + ' has gone ' + FR.fmtDist(F.v * t, 3) + ' and ' + sw + ' ' + FR.fmtDist(S.v * t, 3) + '.');
  return { head, lines, c };
};
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
U.compare = (a, b) => {
  a = a == null || a < 0 ? FR.idx('snail') : a; b = b == null || b < 0 ? FR.idx('cheetah') : b;
  U.modal('COMPARE TWO RACERS', m => {
    const row = FR.el('div', 'crow'), s1 = FR.el('select'), s2 = FR.el('select'), sw = FR.el('button', 'pbtn alt', 'SWAP');
    s1.id = 'cmpA'; s2.id = 'cmpB'; s1.setAttribute('aria-label', 'First racer'); s2.setAttribute('aria-label', 'Second racer'); sw.title = 'Swap';
    pick(s1, a); pick(s2, b); row.appendChild(s1); row.appendChild(sw); row.appendChild(s2); m.appendChild(row);
    const pics = FR.el('div', 'cpics'), out = FR.el('div', 'cout'); out.id = 'cmpOut'; m.appendChild(pics); m.appendChild(out);
    const rnd = FR.el('button', 'pbtn alt', 'RANDOM PAIR'); m.appendChild(rnd);
    const show = () => {
      const A = +s1.value, B = +s2.value, T = U.compareText(A, B); pics.innerHTML = ''; out.innerHTML = '';
      [A, B].forEach((i, k) => { const d = FR.el('div', 'cpic'); d.appendChild(FR.icon(i, 3)); d.appendChild(FR.el('span', '', FR.R[i].name + ' · ' + FR.fmtSpeed(FR.R[i].v))); pics.appendChild(d); if (!k) pics.appendChild(FR.el('b', 'vs', 'VS')); });
      out.appendChild(FR.el('p', 'big', T.head)); T.lines.forEach(l => out.appendChild(FR.el('p', '', l)));
      out.dataset.secs = T.c.secs; out.dataset.fast = T.c.fast; out.dataset.slow = T.c.slow;
    };
    s1.onchange = show; s2.onchange = show; sw.onclick = () => { const v = s1.value; s1.value = s2.value; s2.value = v; show(); };
    rnd.onclick = () => { const r = FR.rng(Date.now()); s1.value = Math.floor(r() * 100); do s2.value = Math.floor(r() * 100); while (s2.value === s1.value); show(); };
    show();
  }, 'mid');
};
}
// ===== log.js =====
{
const FR = window.FR, U = FR.UI;
const SHOW = 400;
U.log = () => {
  let tab = 'done', list = null, last = 0, ups = [];
  U.modal('MILESTONE LOG', m => {
    const tabs = FR.el('div', 'tabs'), a = FR.el('button', 'pbtn', 'HAPPENED'), b = FR.el('button', 'pbtn alt', 'COMING UP');
    a.id = 'logDone'; b.id = 'logNext'; tabs.appendChild(a); tabs.appendChild(b); m.appendChild(tabs);
    const note = FR.el('p', 'note'); m.appendChild(note); list = FR.el('ol', 'log'); list.id = 'logList'; m.appendChild(list);
    const fill = () => {
      list.innerHTML = ''; ups = [];
      a.className = 'pbtn' + (tab === 'done' ? '' : ' alt'); b.className = 'pbtn' + (tab === 'next' ? '' : ' alt');
      if (tab === 'done') {
        const ev = FR.Miles.happened();
        note.textContent = ev.length ? ev.length.toLocaleString() + ' milestones so far in this race (counted on the real clock, never the time-warp preview).' : 'No milestones yet: the first one (light reaching the Moon) happens 1.28 seconds in.';
        ev.slice(0, SHOW).forEach(e => list.appendChild(item(e, FR.fmtClock(e.t).replace(/\.\d$/, ''))));
        if (ev.length > SHOW) list.appendChild(FR.el('li', 'more', '…and ' + (ev.length - SHOW).toLocaleString() + ' earlier milestones.'));
      } else {
        note.textContent = 'The next milestones on the real race clock.';
        FR.Miles.upcoming(30).forEach(e => { const li = item(e, ''); ups.push([li.firstChild, e]); list.appendChild(li); });
      }
    };
    a.onclick = () => { tab = 'done'; fill(); }; b.onclick = () => { tab = 'next'; fill(); }; fill();
  }, 'mid', () => {
    const now = performance.now(); if (now - last < 200) return; last = now;
    const t = FR.T.real(); ups.forEach(([s, e]) => { s.textContent = 'in ' + FR.fmtShort(e.t - t); });
  });
};
function item(e, when) {
  const li = FR.el('li'); li.appendChild(FR.el('span', 'when', when)); li.appendChild(FR.icon(e.i, 1)); li.appendChild(FR.el('span', 'what', e.text));
  li.onclick = () => { U.close(); FR.follow(e.i, true); }; return li;
}
}
// ===== sheet.js =====
{
const FR = window.FR;
FR.Sheet = {
  show() {
    document.body.classList.add('sheetMode'); const S = FR.$('#sheet'); S.classList.remove('hide');
    const sc = +(FR.Q.get('sheet') || 4) || 4;
    FR.R.forEach((r, i) => {
      const s = FR.S[r.id], th = FR.TH[r.th], d = FR.el('div', 'sc'), c = document.createElement('canvas');
      const fw = (s.w + 2) * sc, W = Math.max(fw * s.f + 8 * (s.f - 1), 64 * sc / 2); c.width = W; c.height = FR.ART_H * sc;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
      x.drawImage(th.farCv, 0, 0, W / sc, FR.ART_H, 0, 0, W, FR.ART_H * sc); x.drawImage(th.nearCv, 0, 0, W / sc, FR.ART_H, 0, 0, W, FR.ART_H * sc);
      const ay = s.a === 'g' ? th.gy - s.h : s.a === 'top' ? 2 : Math.floor((FR.ART_H - s.h) / 2);
      s.cv.forEach((f, k) => x.drawImage(f, k * (fw + 8), (ay + s.dy - 1) * sc, f.width * sc, f.height * sc));
      d.dataset.id = r.id; d.appendChild(c); d.appendChild(FR.el('p', '', (i + 1) + '. ' + r.name)); S.appendChild(d);
    });
    Object.keys(FR.TH).forEach(k => {
      const th = FR.TH[k], d = FR.el('div', 'sc'), c = document.createElement('canvas'); c.width = FR.TW * 2; c.height = FR.ART_H * 2;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(th.farCv, 0, 0, c.width, c.height); x.drawImage(th.nearCv, 0, 0, c.width, c.height);
      d.appendChild(c); d.appendChild(FR.el('p', '', 'scenery: ' + k)); S.appendChild(d);
    });
    window.SHEET_READY = true;
  }
};
}
// ===== tile.js =====
{
const FR = window.FR;
const TF = {
  T: '######/######/..##../..##../..##../..##../..##../..##..', H: '##..##/##..##/##..##/######/######/##..##/##..##/##..##',
  E: '######/######/##..../#####./#####./##..../######/######', F: '######/######/##..../#####./#####./##..../##..../##....',
  O: '.####./######/##..##/##..##/##..##/##..##/######/.####.', R: '#####./######/##..##/##..##/######/#####./##.###/##..##',
  V: '##..##/##..##/##..##/##..##/##..##/.####./.####./..##..', A: '.####./######/##..##/##..##/######/######/##..##/##..##',
  C: '.#####/######/##..../##..../##..../##..../######/.#####'
};
function word(s) {
  const cols = [...s].reduce((w, ch) => w + (ch === ' ' ? 3 : 7), -1), g = new FR.G(cols, 10, 0, 1);
  const put = (dy, c) => { let x = 0; for (const ch of s) { if (ch === ' ') { x += 3; continue; } TF[ch].split('/').forEach((row, j) => { for (let i = 0; i < 6; i++) if (row[i] === '#') g.p(x + i, j + dy, c); }); x += 7; } };
  put(2, 'R'); put(1, 'O'); put(0, 'y'); put(0, 'y'); g.shade();
  for (let i = 0; i < g.a.length; i++) if (g.a[i] === 'y' && Math.floor(i / g.W) <= 2) g.a[i] = 'z';
  g.outline('k'); return FR.toCanvas(g);
}
FR.Tile = {
  show() {
    document.body.classList.add('tileMode'); const T = FR.$('#tile'); T.classList.remove('hide');
    const c = document.createElement('canvas'); c.width = 1640; c.height = 820; T.appendChild(c); const X = c.getContext('2d'); X.imageSmoothingEnabled = false;
    const r = FR.rng(2026), px = (x, y, w, h, col) => { X.fillStyle = FR.PAL[col] || col; X.fillRect(x, y, w, h); };
    ['#07060f', '#0c0a1e', '#120f2a', '#181338', '#1e1846', '#241c52', '#2c205c'].forEach((b, i) => px(0, i * 50, 1640, 50, b));
    for (let i = 0; i < 260; i++) { const s = r() < 0.15 ? 8 : 4; px(Math.floor(r() * 410) * 4, Math.floor(r() * 84) * 4, s, s, r() < 0.2 ? '#fff6c0' : r() < 0.6 ? '#cfcad6' : '#7ad8f4'); }
    const put = (id, x, y, sc) => { const cv = FR.S[id].cv[0]; X.drawImage(cv, x, y, cv.width * sc, cv.height * sc); };
    put('sungal', 1508, 18, 5); put('earth', 34, 196, 4); put('moon', 250, 60, 3);
    const W1 = word('THE'), W2 = word('FOREVER RACE'), s1 = 10, s2 = 16;
    X.drawImage(W1, Math.round(820 - W1.width * s1 / 2), 26, W1.width * s1, W1.height * s1);
    X.drawImage(W2, Math.round(820 - W2.width * s2 / 2), 150, W2.width * s2, W2.height * s2);
    const P = 4, y0 = 340, startX = 520, ids = ['plant', 'snail', 'cheetah', 'jet', 'light'];
    ids.forEach((id, k) => {
      const i = FR.idx(id), s = FR.S[id];
      FR.drawLane(X, i, y0 + k * 96, 1640, P, 0.4, 0.15 + k * 0.11, { plate: 0, sprX: startX - s.w * P - 4, dpr: 1, noFlags: true });
    });
    for (let y = y0; y < 820; y += 12) for (let k = 0; k < 2; k++) px(startX + k * 12, y, 12, 12, ((y - y0) / 12 + k) % 2 ? '#1a1220' : '#ffffff');
    px(startX - 4, y0, 4, 480, '#1a1220'); px(startX + 24, y0, 4, 480, '#1a1220'); px(0, y0 - 6, 1640, 6, '#07060f');
    window.TILE_READY = true;
  }
};
}
// ===== main.js =====
{
const FR = window.FR;
FR.R.sort((a, b) => a.v - b.v);
FR.R.forEach((r, i) => {
  r.seed = Math.floor(FR.hash(i, 77) * FR.TW);
  if (!FR.S[r.id]) console.error('missing sprite: ' + r.id);
  if (!FR.TH[r.th]) console.error('missing scenery: ' + r.th + ' for ' + r.id);
});
Object.keys(FR.S).forEach(k => FR.bakeSprite(FR.S[k]));
Object.keys(FR.TH).forEach(k => {
  const th = FR.TH[k], f = new FR.G(FR.TW, FR.ART_H, 0, 0, true), n = new FR.G(FR.TW, FR.ART_H, 0, 0, true);
  th.far(f); th.near(n); th.farCv = FR.toCanvas(f); th.nearCv = FR.toCanvas(n);
});
FR.buildLandmarks();
FR.fps = 0;
function boot() {
  FR.T.init(); FR.Rend.init(); FR.Focus.init(); FR.UI.init();
  const t0 = FR.T.now(); FR.Miles.init(t0);
  if (FR.T.fresh) FR.toast("AND THEY'RE OFF!", 'The race just started and it never stops. Light reaches the Moon in 1.28 seconds; the houseplant needs a year for 1 cm.', 'away');
  if (!FR.store.ok) FR.toast('NO SAVING HERE', 'This browser blocks saving, so the race restarts each visit.', 'away');
  const save = () => FR.store.set('seen', FR.T.real()); // always the real clock, never a time-warp preview
  setInterval(save, 2000); addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { FR.T.sync(); if (document.hidden) save(); });
  let frames = 0, fpsT = performance.now(), syncT = performance.now();
  const loop = () => {
    const now = performance.now(), t = FR.T.now(), at = now / 1000;
    FR.Rend.frame(t, at); FR.Focus.frame(t, at); FR.UI.clock(t); FR.UI.tick(t); FR.Miles.tick(t);
    frames++; if (now - fpsT >= 1000) { FR.fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
    if (now - syncT > 10000) { FR.T.sync(); syncT = now; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => FR.Rend.layout());
  window.FR_READY = true;
}
if (FR.Q.has('sheet')) FR.Sheet.show();
else if (FR.Q.has('tile')) FR.Tile.show();
else boot();
}
