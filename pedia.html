<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaipedia · KAIISM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kai.css">
<style>
.p-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;align-items:start}
/* sidebar */
.p-side{display:grid;gap:14px;padding:2px 8px 8px 2px}
.p-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.p-globe{width:54px;height:54px;flex:none}
.p-logo b{display:block;font:800 26px/1 var(--display);letter-spacing:-.02em}
.p-logo span{display:block;font:400 12px/1.25 var(--body);color:var(--ink2)}
.p-search{position:relative}
.p-search .k-input{width:100%;min-height:44px}
.p-results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.p-results a{display:block;padding:9px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.p-results a:last-child{border-bottom:0}
.p-results a:hover,.p-results a.on{background:var(--sun)}
.p-results a b{display:block;font:800 15px/1.2 var(--display)}
.p-results a small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.3;margin-top:2px}
.p-results .none{padding:10px 12px;color:var(--ink2);font-size:14px}
.p-menu{display:grid;gap:2px}
.p-menu h4{font:800 11px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin:6px 0 6px}
.p-menu a,.p-menu button{display:block;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;color:var(--teal-d);text-decoration:none;font:700 15px/1.25 var(--body);cursor:pointer;min-height:36px}
.p-menu a:hover,.p-menu button:hover{background:var(--paper2)}
.p-menu .toc a{font-weight:400;font-size:14px;padding:5px 8px;min-height:30px}
.p-menu .toc a.l2{padding-left:20px}
.p-progress{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:var(--card);font-size:14px}
.p-progress .bar{height:10px;border:2px solid var(--ink);border-radius:99px;margin-top:6px;overflow:hidden;background:#fff}
.p-progress .bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
/* article */
.p-main{min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 26px 28px}
.p-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--ink);margin:-4px 0 16px;padding-bottom:10px;align-items:center}
.p-tabs .k-chip{background:var(--paper)}
.p-tabs .k-chip.on{background:var(--sun)}
.p-tabs .sp{margin-left:auto;font-size:13px;color:var(--muted)}
.p-title{font-size:clamp(34px,5vw,52px);font-weight:800;border-bottom:3px double var(--ink);padding-bottom:8px}
.p-from{color:var(--muted);font-size:14px;margin:8px 0 16px;font-style:italic}
.p-body{font-size:17px}
.p-body::after{content:"";display:block;clear:both}
.p-body h2{font-size:26px;margin:24px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.p-body p{margin:0 0 12px}
.p-body ul,.p-body ol{margin:0 0 12px;padding-left:24px}
.p-body li{margin:3px 0}
.p-body a.int{color:var(--teal-d);font-weight:700;text-decoration:none;border-bottom:2px solid rgba(18,122,115,.35)}
.p-body a.int:hover{border-bottom-color:var(--teal)}
.p-body a.ext{color:var(--plum);font-weight:700}
.p-body a.ext::after{content:" ↗";font-size:.8em}
.kg{font-family:var(--display);font-weight:800;color:var(--red-d);border-bottom:2px dotted var(--red);cursor:help}
.kg:focus{outline:2px solid var(--sky);outline-offset:1px;border-radius:3px}
.p-tip{position:fixed;z-index:120;max-width:min(280px,90vw);background:var(--ink);color:var(--paper);border:2px solid var(--sun);border-radius:10px;padding:7px 10px;font:400 14px/1.35 var(--body);box-shadow:3px 3px 0 var(--sun);pointer-events:none}
.p-tip b{color:var(--sun);font-family:var(--display)}
/* infobox */
.p-info{float:right;width:300px;margin:4px 0 16px 22px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);overflow:hidden;font-size:14.5px}
.p-info .ih{background:var(--ink);color:var(--paper);font:800 18px/1.15 var(--display);text-align:center;padding:10px}
.p-info .ih small{display:block;font:700 13px/1.2 var(--display);color:var(--sun);margin-top:3px}
.p-info .img{padding:12px;text-align:center;border-bottom:2px solid var(--ink);background:#fff}
.p-info .img svg{max-width:100%;height:auto}
.p-info .cap{font-size:12.5px;color:var(--ink2);margin-top:6px}
.p-info table{width:100%;border-collapse:collapse}
.p-info th,.p-info td{text-align:left;vertical-align:top;padding:7px 10px;border-top:1px solid var(--line)}
.p-info tr:first-child th,.p-info tr:first-child td{border-top:0}
.p-info th{width:40%;font:800 13px/1.3 var(--display)}
.p-data{margin:6px 0 14px}
.p-table{width:100%;border-collapse:collapse;border:2px solid var(--ink);border-radius:10px;overflow:hidden;font-size:15px;background:#fff}
.p-table th,.p-table td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.p-table th{background:var(--paper2);font:800 13px/1.2 var(--display)}
.p-tablewrap{overflow-x:auto;max-width:100%}
.p-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.p-letters div{border:2px solid var(--ink);border-radius:10px;background:#fff;text-align:center;padding:6px 4px;font:800 15px/1.1 var(--display)}
.p-letters svg{display:block;margin:0 auto 4px}
.p-flag{display:block;margin:4px 0 14px;max-width:100%;height:auto;border:2px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--ink)}
.p-flag svg{display:block;max-width:100%;height:auto}
.p-scriptline{display:block;margin:6px 0 14px;max-width:100%;overflow:hidden}
.p-scriptline svg{max-width:100%;height:auto}
.p-quote{border-left:5px solid var(--red);background:var(--paper);padding:10px 14px;border-radius:0 10px 10px 0;margin:0 0 14px;font-size:18px}
.p-see{margin-top:22px;border-top:2px solid var(--line);padding-top:12px}
.p-see h2{font-size:22px;margin:0 0 8px;border:0}
.p-see ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0}
.p-see a{display:inline-flex;align-items:center;min-height:40px}
.p-cats{margin-top:18px;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--ink2);background:var(--paper)}
.p-cats a{color:var(--teal-d);margin-right:8px}
.p-foot{margin-top:14px;font-size:13px;color:var(--muted)}
/* main page */
.p-home h1{font-size:clamp(34px,5vw,56px)}
.p-home .lede{font-size:18px;color:var(--ink2);margin:8px 0 18px}
.p-hgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.p-box{border:2px solid var(--ink);border-radius:12px;background:var(--paper);overflow:hidden}
.p-box h3{background:var(--teal);color:#fff;font:800 16px/1 var(--display);padding:10px 12px;letter-spacing:.02em}
.p-box.red h3{background:var(--red)}
.p-box.sun h3{background:var(--sun);color:var(--ink)}
.p-box .in{padding:12px 14px;font-size:15.5px}
.p-box .in p{margin:0 0 10px}
.p-box ul{margin:0;padding-left:20px}
.p-all{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.p-all a{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:8px 10px;text-decoration:none;color:var(--ink);font:700 15px/1.2 var(--display);min-height:44px}
.p-all a.read{background:#e8f4ee}
.p-all a.read::after{content:"✓";margin-left:auto;color:var(--good);font-weight:800}
.p-all a:hover{background:var(--sun)}
.p-mobilebar{display:none}
.p-featflag{float:right;margin:0 0 8px 12px;width:min(130px,40%)}
.p-featflag svg{display:block;width:100%;height:auto;border:2px solid var(--ink);border-radius:4px}
@media (max-width:900px){
  .p-wrap{grid-template-columns:minmax(0,1fr)}
  .p-side{padding:0}
  .p-side .p-menu.contents,.p-side .p-menu.links{display:none}
  .p-mobilebar{display:flex;gap:8px;flex-wrap:wrap}
  .p-info{float:none;width:auto;margin:0 0 16px}
  .p-hgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .p-main{padding:16px 14px 20px}
  .p-body{font-size:16px}
}
.p-drawer{border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:10px}
</style>
</head>
<body>
<header id="kai-nav"></header>
<main class="k-page">
  <div class="p-wrap">
    <aside class="p-side" aria-label="Kaipedia">
      <a class="p-logo" href="#main">
        <svg class="p-globe" viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="24" fill="#f2b632" stroke="#191512" stroke-width="3"/><path d="M8 20h38M5 32h44M27 3c-9 8-9 40 0 48M27 3c9 8 9 40 0 48" fill="none" stroke="#191512" stroke-width="2"/><g stroke="#e5432d" stroke-width="4" stroke-linecap="round"><line x1="19" y1="18" x2="35" y2="18"/><line x1="27" y1="18" x2="27" y2="36"/><line x1="19" y1="36" x2="35" y2="36"/></g></svg>
        <span><b>Kaipedia</b><span>The free encyclopedia of Kaiya</span></span>
      </a>
      <div class="p-search" role="search">
        <label for="q" class="k-muted" style="font-size:13px;display:block;margin-bottom:4px">Search Kaipedia</label>
        <input id="q" class="k-input" type="search" placeholder="Search, e.g. toast" autocomplete="off" aria-controls="results">
        <div class="p-results" id="results" hidden></div>
      </div>
      <div class="p-mobilebar">
        <a class="k-btn sm" href="#main">Main page</a>
        <button class="k-btn sm sun" data-random>Random article</button>
        <button class="k-btn sm" id="mContents" aria-expanded="false">Contents</button>
      </div>
      <div class="p-drawer" id="mDrawer" hidden></div>
      <nav class="p-menu links" aria-label="Kaipedia menu">
        <h4>Navigation</h4>
        <a href="#main">Main page</a>
        <button data-random>Random article</button>
        <a href="#all">All articles</a>
      </nav>
      <nav class="p-menu contents" id="tocBox" aria-label="Contents"></nav>
      <div class="p-progress" id="progress"></div>
    </aside>
    <article class="p-main" id="view" aria-live="polite"></article>
  </div>
</main>
<div class="p-tip" id="tip" role="tooltip" hidden></div>
<script src="kai-core.js"></script>
<script>
(function () {
'use strict';
KAI.mountNav('pedia');
const $ = id => document.getElementById(id);
const T = KAI.TIME;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DAYMS = 86400000;

/* ================= facts pulled from KAI ================= */
const atT = ms => KAI.toKaiTime(new Date(2001, 0, 1, 0, 0, 0, ms));
const KPD = atT(DAYMS - 1).kai + 1, kaiMs = DAYMS / KPD, BPK = atT(kaiMs - 1).bits + 1, bitMs = kaiMs / BPK, BLPB = atT(bitMs - 1).blinks + 1;
const kaiToLocal = (y, m, d) => { const u = KAI.fromKaiDate(y, m, d); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate(), 12); };
const MONTHLEN = Math.round((kaiToLocal(1, 2, 1) - kaiToLocal(1, 1, 1)) / DAYMS);
const fmtDate = d => d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
const epochDate = new Date(T.epoch.y, T.epoch.m - 1, T.epoch.d, 12);
const kdName = k => k.kaiday ? k.kaiday : `${k.day} ${k.monthName.kai}`;
const holWhen = h => `${h.d} ${T.months[h.m - 1].kai}`;
const stamp = id => KAI.STAMPS.find(s => s.id === id);
const fmtDur = ms => { const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), s = +(ms % 60000 / 1000).toFixed(3); return [h ? h + ' hours' : '', m ? m + ' minutes' : '', s ? s + ' seconds' : ''].filter(Boolean).join(' and '); };

/* ================= Kaihana glosses (always from KAI) ================= */
function glossOf(raw) {
  const w = String(raw).toLowerCase().replace(/[^a-z]/g, '');
  if (!w) return null;
  let e = KAI.lookupKai(w);
  if (e) return { word: e.kai, en: e.en };
  if (/li$/.test(w)) { e = KAI.lookupKai(w.slice(0, -2)); if (e && e.pos === 'n') return { word: w, en: `${e.en.replace(/,.*$/, '')} — more than one (${e.kai} + -li)` }; }
  const d = KAI.DIGITS.indexOf(w); if (d >= 0) return { word: w, en: `the number ${d}` };
  if (w === 'kaito') return { word: w, en: 'ten (10)' };
  if (w === 'honu') return { word: w, en: 'hundred (100)' };
  if (w === 'salu') return { word: w, en: 'thousand (1000)' };
  const mi = T.months.findIndex(m => m.kai.toLowerCase() === w); if (mi >= 0) return { word: T.months[mi].kai, en: `${T.months[mi].en} — Kai month ${mi + 1}` };
  const wi = T.weekdays.findIndex(m => m.kai.toLowerCase() === w); if (wi >= 0) return { word: T.weekdays[wi].kai, en: `${T.weekdays[wi].en} — day ${wi + 1} of the Kai week` };
  return null;
}
window.__kaipediaGloss = glossOf;
function glossSpan(text) {
  return text.split(/(\s+)/).map(part => {
    if (/^\s+$/.test(part) || !part) return part;
    const g = glossOf(part);
    return g ? `<span class="kg" tabindex="0" data-g="${esc(g.en)}" data-w="${esc(g.word)}">${esc(part)}</span>` : `<span class="kg bad">${esc(part)}</span>`;
  }).join('');
}

/* ================= dynamic blocks ================= */
const glossList = s => glossSpan(s);
const BLOCKS = {
  flag: () => `<div class="p-flag" style="width:min(360px,100%)">${KAI.flagSVG(360)}</div>`,
  flagmeaning: () => esc(KAI.FLAG_MEANING),
  rules: () => `<ol class="p-data">${KAI.RULES.map(r => `<li><b>${glossList(r.kai)}</b> — ${esc(r.en)}</li>`).join('')}</ol>`,
  motto: () => `<div class="p-quote p-data"><b>${glossList(KAI.MOTTO.kai)}</b> — “${esc(KAI.MOTTO.en)}”</div>`,
  mottokai: () => glossList(KAI.MOTTO.kai),
  mottoen: () => esc(KAI.MOTTO.en),
  months: () => `<div class="p-tablewrap p-data"><table class="p-table"><tr><th>#</th><th>Month</th><th>Meaning</th><th>Holiday</th></tr>${T.months.map((m, i) => `<tr><td>${i + 1}</td><td>${glossList(m.kai)}</td><td>${esc(m.en)}</td><td>${T.holidays.filter(h => h.m === i + 1).map(h => `${esc(h.name)} (day ${h.d})`).join(', ') || '—'}</td></tr>`).join('')}<tr><td>—</td><td>Kaidays</td><td>festival days</td><td>${T.kaidays.length - 1} days, ${T.kaidays.length} in leap years</td></tr></table></div>`,
  weekdays: () => `<ol class="p-data">${T.weekdays.map(w => `<li>${glossList(w.kai)} — ${esc(w.en)}</li>`).join('')}</ol>`,
  kaidays: () => `<ol class="p-data">${T.kaidays.map((n, i) => `<li>${esc(n)}${i === T.kaidays.length - 1 ? ' — leap years only' : ''}</li>`).join('')}</ol>`,
  holidays: () => `<div class="p-tablewrap p-data"><table class="p-table"><tr><th>Holiday</th><th>Kai date</th><th>What happens</th></tr>${T.holidays.map(h => `<tr><td><b>${esc(h.name)}</b></td><td>${h.d} ${glossList(T.months[h.m - 1].kai)}</td><td>${esc(h.about)}</td></tr>`).join('')}</table></div>`,
  stamps: () => `<div class="p-tablewrap p-data"><table class="p-table"><tr><th>Stamp</th><th>Meaning</th><th>How to get it</th><th>You</th></tr>${KAI.passport.all().map(s => `<tr><td><b class="k-kai">${esc(s.kai)}</b></td><td>${esc(s.en)}</td><td>${esc(s.how)}</td><td>${s.got ? '✓' : '—'}</td></tr>`).join('')}</table></div>`,
  nstamps: () => String(KAI.STAMPS.length),
  dictcount: () => String(KAI.DICT.length),
  lettercount: () => String(KAI.ALPHABET.length),
  alphabet: () => `<div class="p-letters p-data">${KAI.ALPHABET.map(l => `<div>${KAI.scriptSVG(l, { size: 34, color: '#191512' })}${l}</div>`).join('')}</div>`,
  vowels: () => KAI.VOWELS.join(', '),
  grammar: () => `<ol class="p-data">${KAI.GRAMMAR.map(g => `<li><b>${esc(g.title)}</b> — ${esc(g.rule)}</li>`).join('')}</ol>`,
  digits: () => `<div class="p-tablewrap p-data"><table class="p-table"><tr><th>Number</th><th>Kaihana</th><th>Number</th><th>Kaihana</th></tr>${[0, 1, 2, 3, 4].map(i => `<tr><td>${i}</td><td>${glossList(KAI.DIGITS[i])}</td><td>${i + 5}</td><td>${glossList(KAI.DIGITS[i + 5])}</td></tr>`).join('')}</table></div>`,
  numex: () => `<ul class="p-data">${[10, 12, 23, 100, 105, 365, 1000, 2026].map(n => `<li>${n} = <b>${glossList(KAI.numberToKai(n))}</b></li>`).join('')}</ul>`,
  kpd: () => String(KPD), bpk: () => String(BPK), blpb: () => String(BLPB), blinksday: () => (KPD * BPK * BLPB).toLocaleString('en-US'),
  kaidur: () => fmtDur(kaiMs), bitdur: () => fmtDur(bitMs), blinkdur: () => fmtDur(bitMs / BLPB),
  noon: () => atT(DAYMS / 2).text,
  now: () => `<b class="k-mono">${KAI.toKaiTime(new Date()).text}</b>`,
  timesys: () => `<div class="p-tablewrap p-data"><table class="p-table"><tr><th>Unit</th><th>How many</th><th>Normal time</th></tr><tr><td><b>kai</b></td><td>${KPD} in a day</td><td>${esc(fmtDur(kaiMs))}</td></tr><tr><td><b>bit</b></td><td>${BPK} in a kai</td><td>${esc(fmtDur(bitMs))}</td></tr><tr><td><b>blink</b></td><td>${BLPB} in a bit</td><td>${esc(fmtDur(bitMs / BLPB))}</td></tr></table></div>`,
  nmonths: () => String(T.months.length), monthlen: () => String(MONTHLEN), weeklen: () => String(T.weekdays.length),
  weeksmonth: () => String(MONTHLEN / T.weekdays.length), nkaidays: () => String(T.kaidays.length - 1), nkaidaysleap: () => String(T.kaidays.length),
  daysregular: () => String(T.months.length * MONTHLEN),
  epoch: () => esc(fmtDate(epochDate)),
  firstmonth: () => glossList(T.months[0].kai), lastmonth: () => glossList(T.months[T.months.length - 1].kai),
  restday: () => glossList(T.weekdays[T.weekdays.length - 1].kai),
  today: () => { const k = KAI.toKaiDate(new Date()); return `<b>${esc(kdName(k))}, ${esc(KAI.yearText(k.year))}</b> (${esc(k.weekday.kai)})`; },
  toastday: () => { const h = T.holidays.find(x => /toast/i.test(x.name)); return h ? `${esc(h.name)} (${h.d} ${glossList(T.months[h.m - 1].kai)})` : 'Toast Day'; },
  monkeday: () => { const h = T.holidays.find(x => /monke/i.test(x.name)); return h ? `${esc(h.name)} (${h.d} ${glossList(T.months[h.m - 1].kai)})` : 'Monke Day'; },
  splashday: () => { const h = T.holidays.find(x => /splash/i.test(x.name)); return h ? `${esc(h.name)} (${h.d} ${glossList(T.months[h.m - 1].kai)})` : 'Splash Day'; },
  codeday: () => { const h = T.holidays.find(x => /code/i.test(x.name)); return h ? `${esc(h.name)} (${h.d} ${glossList(T.months[h.m - 1].kai)})` : 'First Code Day'; },
  newyear: () => { const h = T.holidays[0]; return `${esc(h.name)} (${h.d} ${glossList(T.months[h.m - 1].kai)})`; },
  firsttoast: () => { const h = T.holidays.find(x => /toast/i.test(x.name)); return h ? esc(fmtDate(kaiToLocal(1, h.m, h.d))) : ''; },
  stampkaiwin: () => esc(stamp('kai-win').kai), stampanthem: () => esc(stamp('anthem').kai), stampcitizen: () => esc(stamp('citizen').kai), stamparrive: () => esc(stamp('arrive').kai),
  stamppedia: () => esc(stamp('pedia').kai)
};
function block(name) {
  const m = /^script:(.+)$/.exec(name);
  if (m) return `<span class="p-scriptline p-data">${KAI.scriptSVG(m[1], { size: 44, color: '#191512' })}</span>`;
  const f = BLOCKS[name];
  return f ? f() : `[missing ${esc(name)}]`;
}

/* ================= articles =================
   Markup:  [[id]] or [[id|text]] internal link · [page:file.html|text] KAIISM page · {kaihana words} glossed
