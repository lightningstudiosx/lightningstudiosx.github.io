const A = [];
function art(id, title, o, body) { A.push(Object.assign({ id, title, body: body.trim() }, o)); }

art('kaiya', 'Kaiya', { kai: 'Kaiya', cat: 'Places', box: () => [['img', BLOCKS.flag(), 'Flag of Kaiya'], ['Motto', BLOCKS.mottokai() + ` (“${BLOCKS.mottoen()}”)`], ['Capital', '<a class="int" href="#kaiya-lon">Kaiya Lon</a>'], ['Language', '<a class="int" href="#kaihana">Kaihana</a>'], ['Writing', '<a class="int" href="#kaiscript">Kaiscript</a>'], ['Anthem', '<a class="int" href="#anthem">Uso ni Mili</a>'], ['Founded', `1 ${BLOCKS.firstmonth()}, year 1 KE (${BLOCKS.epoch()})`], ['Population', 'You, and everyone else reading this'], ['National game', '<a class="int" href="#kai-game">KAI</a>'], ['National food', '<a class="int" href="#toast">Toast</a>'], ['National animal', '<a class="int" href="#monke">Monke</a>'], ['Money', 'None. Kaiists pay in high-fives.']], see: ['kaiism', 'history', 'kaiya-lon', 'citizenship'] }, `
Kaiya ({Kaiya}, "the Land of Fun") is a small, cheerful and completely made-up country that lives on the internet, inside the KAIISM corner of Kai.fun. It has no borders, no army and no homework. It does have its own [[kaihana|language]], its own [[kaiscript|alphabet]], its own [[kaicode|coding language]], its own [[kai-game|board game]], its own [[kai-calendar|calendar]] and a [[passport]] you can fill with stamps.

## Geography
Kaiya is shaped exactly like whatever screen you are reading this on. Experts agree this is very convenient. Its most famous places are the capital, [[kaiya-lon|Kaiya Lon]]; the tall and slightly wobbly [[mount-takan|Mount Takan]]; the [[kaiya-sea|Kaiya Sea]], which is teal on the [[flag]] and also teal in real life; and the hot, endless desert where [[bob|Bob the Stickman]] has been walking since forever.

## People
People who live the Kai way are called {kaitenoli} (Kaiists). Anyone can become one by passing the [[citizenship|citizenship test]]. Kaiists say {kaiyo} to say hello and {yosen} to say goodbye, and they try to follow [[three-rules|three simple rules]]. The national [[motto]] is "@@mottokai@@", which means "@@mottoen@@"

## Government
Kaiya does not really have a government. When something needs deciding, two Kaiists play a game of [[kai-game|KAI]] and the winner gets to pick. If nobody wants to decide, everyone has [[toast]] instead, and usually the problem goes away.

## Way of life
The way of life in Kaiya is called [[kaiism|Kaiism]]. It is not a religion — there is nothing to worship and nothing to pray to. It is more like a set of good habits that everyone agrees on: play, help, learn. Kaiya even has its own [[kai-time|way of telling the time]], because regular hours were felt to be "a bit much".
`);

art('kaiism', 'Kaiism', { kai: 'kaimu', cat: 'Culture', box: () => [['Kaihana', glossSpan('kaimu')], ['Meaning', 'the way of fun'], ['Followers', 'Kaiists (' + glossSpan('kaiteno') + ')'], ['Rules', '<a class="int" href="#three-rules">three</a>'], ['Motto', BLOCKS.mottokai()], ['Is it a religion?', 'No. It is a way of life, like being a good sport.']], see: ['three-rules', 'motto', 'famous-kaiists'] }, `
Kaiism ({kaimu}, "the way of fun") is the way of life in [[kaiya|Kaiya]]. It is not a religion and it has no gods, prayers or holy books. It is a friendly idea, like "be a good sport" or "share your snacks", that got slightly out of hand and ended up with its own [[flag]].

## The big idea
Kaiism says that fun is not a waste of time. Fun is how you learn things, make friends and stay curious. That is why the [[motto]] of Kaiya is "@@mottokai@@" — "@@mottoen@@" A Kaiist ({kaiteno}, literally a "fun-person") tries to make every day a bit more fun, both for themselves and for the people around them.

## The rules
Kaiism has just [[three-rules|three rules]], and they are short enough to fit on a sticky note: play every day, help your friends, and learn something new. The three dots on the [[flag]] stand for them.

## What Kaiism is not
Kaiism is not about winning all the time. A good Kaiist can lose a game of [[kai-game|KAI]], say "{arima}" (thank you) and ask for a rematch. Kaiism is also not about being loud. Quiet fun counts too, like reading a {puku} (book), drawing, or staring at {pumuli} (clouds) until one looks like a monke.

## Practising Kaiism
There is no wrong way to practise Kaiism, but popular ways include learning a word of [[kaihana|Kaihana]], writing your name in [[kaiscript|Kaiscript]], making toast on [[holidays|Toast Day]], and collecting stamps in your [[passport]]. Some Kaiists say "{kaiwen}" (good luck) before every game, even games they play alone.

## The word
The word {kaimu} grows out of {kai}, which means "fun". Other words from the same family are {kaimo} (game), {kaiku} (toy), {kaia} (to play) and of course {Kaiya}, the Land of Fun.
`);

art('three-rules', 'The Three Rules', { kai: '', cat: 'Culture', box: () => [['img', `<svg viewBox="0 0 120 40" width="200" height="66" aria-hidden="true"><circle cx="24" cy="20" r="12" fill="#e5432d" stroke="#191512" stroke-width="3"/><circle cx="60" cy="20" r="12" fill="#f2b632" stroke="#191512" stroke-width="3"/><circle cx="96" cy="20" r="12" fill="#127a73" stroke="#191512" stroke-width="3"/></svg>`, 'One dot for each rule'], ['Number of rules', String(KAI.RULES.length)], ['Language', 'Kaihana'], ['Found on', 'the flag, the anthem, sticky notes'], ['Punishment for breaking', 'None. Try again tomorrow.']], see: ['kaiism', 'flag', 'anthem'] }, `
The Three Rules are the heart of [[kaiism|Kaiism]]. They are written in [[kaihana|Kaihana]], and every Kaiist knows them by heart:

@@rules@@

## Rule one: play every day
The first rule does not say "play all day". It says every day. Even five minutes of a game, a doodle or a silly dance counts. Kaiists believe a day with zero fun in it is like toast with nothing on it: technically fine, but a bit sad. The rule uses {kaia}, "to play", and {nesi}, "day".

## Rule two: help your friends
{mosali} is the plural of {mosa} (friend). In Kaihana you add -li to make more than one. Helping can be anything: explaining a game, passing the ketchup, or letting someone else go first on the slide. The little word {ni} shows who something belongs to, so the friends in this rule are yours.

## Rule three: learn something new
{manu} means "to learn" and {nia} means "new". The word for school, {manuya}, is literally "learn-place", and a student is a {manuto}, a "learn-person". Kaiists think school is not the only learn-place. The whole world is one.

## The three dots
The [[flag]] of Kaiya has three cream dots in its top corner, one for each rule. The [[citizenship|citizenship test]] often asks about them, so they are worth learning now. The rules also appear in the second verse of the [[anthem]]: "{kaia, huma, manu}!" — play, help, learn!

## Breaking the rules
There is no punishment for breaking a rule. You just try again tomorrow. Kaiism is like that.
`);

art('motto', 'Motto of Kaiya', { kai: '', cat: 'Culture', box: () => [['Kaihana', BLOCKS.mottokai()], ['English', BLOCKS.mottoen()], ['Words', String(KAI.MOTTO.kai.split(' ').length)], ['Used in', 'the anthem, certificates, everyday chat']], see: ['three-rules', 'kaihana', 'anthem'] }, `
@@motto@@

The motto of [[kaiya|Kaiya]] is "@@mottokai@@", which means "@@mottoen@@" It is only three words long, which makes it one of the shortest national mottos anywhere, and the only one that is also a perfect [[kaihana|Kaihana]] grammar lesson.

## Grammar
Look at it word by word: {kai} means "fun", {sa} means "to be" (is, am, are) and {yosa} means "good". Kaihana puts the subject first, then the verb, then the rest, just like English. So: fun — is — good. To say "fun is very good", put {mo} ("very") in front of the describing word: {kai sa mo yosa}. To say the opposite, put {nai} ("not") in front of the verb: {kai nai sa yosa}. Kaiists agree that this last sentence is grammatically perfect and completely wrong.

## Where you will see it
The motto is sung in every chorus of the [[anthem]]. It is printed on every [[citizenship]] certificate. It is painted above the doors of the [[museum|Museum of Everything]], and legend says it was carved into the top of [[mount-takan|Mount Takan]] by a climber who forgot to bring a flag.

## Saying it
Kaihana words are stressed on the first syllable: KAI sa YO-sa. Kaiists often say it as a reply to {arima} (thank you), the way other people say "no problem". Some say it when they lose a game, to show they still had a good time.

## In Kaiscript
@@script:kai sa yosa@@
`);

art('flag', 'Flag of Kaiya', { kai: '', cat: 'Symbols', box: () => [['img', KAI.scriptSVG('k', { size: 70, color: '#191512' }), 'The letter k in Kaiscript, as it appears in the sun'], ['Shape', '3 wide × 2 tall'], ['Colours', 'red, sun yellow, cream, teal, black'], ['Middle mark', 'the letter k in Kaiscript'], ['Three dots', '<a class="int" href="#three-rules">The Three Rules</a>']], see: ['kaiscript', 'three-rules', 'kaiya-sea'] }, `
@@flag@@

The flag of [[kaiya|Kaiya]] is red, sun-yellow, cream and teal, with a black mark inside the sun and three dots in the corner. It was the very first official thing Kaiya ever owned. It flies over [[kaiya-lon|Kaiya Lon]] on windy days and sits in the top corner of every KAIISM page on every day.

## Meaning
The official explanation is: @@flagmeaning@@

## The k in the sun
The black mark in the sun looks a bit like a capital I, but it is really the letter k written in [[kaiscript|Kaiscript]]: a line across the top, a line down the middle and a line across the bottom. So the sun is saying "k" for {kai}, which means fun.

@@script:k@@

## Shape
The flag is 3 units wide for every 2 units tall. The sun sits to the left of the middle, so there is room for the three dots of the [[three-rules|Three Rules]].

## Flag manners
Kaiists have very few flag rules. You may draw the flag on your homework, on your toast, or on your arm in washable marker. You may not use the flag as a napkin, because then it becomes a napkin, and that is confusing for everyone. On Kai.fun Day (see [[holidays]]) people wave paper flags and shout "{kaiyo}!"

## Draw it yourself
Start with a red rectangle. Paint a teal stripe along the bottom with a thin cream line above it. Add a big yellow circle with a thick black outline on the left, draw the Kaiscript k inside it, and finish with three cream dots in the top right. Congratulations: you are now a flag expert.
`);

art('kaihana', 'Kaihana', { kai: 'Kaihana', cat: 'Language', box: () => [['Native name', glossSpan('Kaihana')], ['Spoken in', 'Kaiya'], ['Letters', BLOCKS.lettercount()], ['Words', BLOCKS.dictcount() + ' (and growing)'], ['Writing system', '<a class="int" href="#kaiscript">Kaiscript</a>'], ['Word order', 'subject – verb – object'], ['Learn it', '<a class="ext" href="lang.html">Kaihana lessons</a>']], see: ['kaiscript', 'kai-numbers', 'motto'] }, `
{Kaihana} is the language of [[kaiya|Kaiya]]. It was designed to be easy: it has only @@lettercount@@ letters, every letter always makes the same sound, and verbs never change. Its dictionary has @@dictcount@@ words so far, and new ideas are made by gluing old words together. The name itself means "the Kai language", from {hanaso} (language).

## Sounds
The vowels are @@vowels@@, said like the vowels in "father, bed, see, go, moon". Every syllable is a consonant plus a vowel, like ka or mi, sometimes ending in n, like kan or sen. The stress always falls on the first syllable.

## Grammar in a nutshell
Word order is subject, verb, object, like English: "{mi liko miwa}" means "I like cats". There is no word for "a" or "the". Describing words go after the noun, so {wuwa lon} is a big dog. Add -li for plurals ({miwali}, cats). Put {pa} before a verb for the past and {wo} for the future. Add {ke} to the end of a sentence to ask a yes/no question. Here is the whole official grammar:

@@grammar@@

## Building words
Kaihana makes new words with endings: -ya is a place, -to is a person who does it and -ko is a thing. So {manu} (to learn) gives {manuya} (school) and {manuto} (student). Even {kaiteno}, a Kaiist, is a "fun-person".

## Learning it
You can learn Kaihana step by step in the [page:lang.html|Kaihana lessons], which also have a dictionary and a translator. Start with {kaiyo} (hello), {arima} (thank you) and {kaiwen} (good luck), and you will already be more polite than most robots. For counting, see [[kai-numbers|Kai numbers]].
`);

art('kaiscript', 'Kaiscript', { kai: '', cat: 'Language', box: () => [['img', KAI.scriptSVG('kaiscript', { size: 40, color: '#191512' }), '“kaiscript” in Kaiscript'], ['Type', 'alphabet on a 3×3 dot grid'], ['Letters', BLOCKS.lettercount()], ['Direction', 'left to right'], ['Try it', '<a class="ext" href="script.html">Kaiscript writer</a>']], see: ['kaihana', 'flag', 'bob'] }, `
Kaiscript is the writing system of [[kaiya|Kaiya]]. Instead of copying the shapes of English letters, every [[kaihana|Kaihana]] letter is drawn on a tiny 3×3 grid of dots, using straight lines, dots and one circle. It looks a bit like a secret code, a bit like a circuit board, and a bit like a bug walked across your page with inky feet.

## How it works
Picture nine dots arranged in a square: three on top, three in the middle and three at the bottom. Each letter joins some of the dots. The letter t is a line across the top and down the right side. The letter l is a line down the left side and along the bottom. The letter o is simply a ring around the middle dot, which makes it the roundest letter in the alphabet. The vowels a, e and i are each a short line plus a single dot, which is why Kaiscript looks so dotty.

@@alphabet@@

## Foreign names
English has letters that Kaihana does not, like b, d and g. To write a foreign name, Kaiscript swaps each one for the closest Kaihana letter: b becomes p, d becomes t, g becomes k, and so on. So "Bob" is written "pop", which [[bob|Bob the Stickman]] says he is fine with, as long as nobody pops him.

## Numbers
Digits are dots on the same grid with a line underneath: one dot for 1, two dots for 2, all the way up to nine dots for 9.

## Where it is used
Kaiscript appears in the middle of the [[flag]] (the letter k), on every [[citizenship]] certificate, and on street signs all over [[kaiya-lon|Kaiya Lon]].

## Try it
You can write your own name in Kaiscript on the [page:script.html|Kaiscript page]. It even earns a stamp for your [[passport]].
`);

art('kaicode', 'Kaicode', { kai: 'kotu', cat: 'Language', box: () => [['Kaihana', glossSpan('kotu')], ['Kind', 'programming language'], ['Keywords', 'Kaihana words'], ['Can draw?', 'Yes, with a turtle'], ['Holiday', BLOCKS.codeday()], ['Try it', '<a class="ext" href="code.html">Kaicode IDE</a>']], see: ['kaihana', 'holidays', 'famous-kaiists'] }, `
Kaicode is the programming language of [[kaiya|Kaiya]]. Its name comes from {kotu}, the Kaihana word for code, and writing it is called {kotan} (to code). It was made so that kids can write real programs using [[kaihana|Kaihana]] words instead of English ones.

## What it can do
Kaicode can do maths, remember things in variables, make decisions, repeat things in loops and print messages. It can also drive a little turtle around the screen that leaves a line behind it, so you can draw squares, stars, spirals and very wobbly monkes.

## Why code in Kaihana?
Most programming languages use English words. Kaiists thought it would be fun to have one that uses their own words, and also a good way to practise the language. If you can tell a computer what to do in Kaihana, you can definitely order toast in it.

## First Code Day
Every year on @@codeday@@ — in the Code month — Kaiists celebrate by writing their first Kaicode program, or their first program of the new year. Traditionally it just says hello. In Kaiya, hello is {kaiyo}.

## Bugs
A mistake in a program is called a bug everywhere, and Kaihana is no exception: it is a {tiku}. Kaiists are kind to their tikus. They find them, fix them and say {arima} for the lesson, which is [[three-rules|rule three]] in action.

## Try it
The [page:code.html|Kaicode IDE] has docs, examples and challenges. Running a program, drawing with the turtle and solving every challenge each earn a stamp for your [[passport]].
`);

art('kai-game', 'KAI (board game)', { kai: 'kaimo', cat: 'Games', box: () => [['Players', '2'], ['Board', '7 × 7 (49 squares)'], ['Centre square', 'the Spot (d4)'], ['Pieces', 'one Kai and its Kins'], ['Capture', 'sandwich'], ['Play it', '<a class="ext" href="kai.html">KAI</a>']], see: ['famous-kaiists', 'kaiya-lon', 'passport'] }, `
KAI is the national board game of [[kaiya|Kaiya]] and the way most arguments in Kaiya get settled. Two players face each other on a 7×7 board, which is 49 squares in all. In Kaihana a game is a {kaimo}, but this one is so important that it is just called KAI.

## The board
The squares are named like a chessboard: letters along the bottom and numbers up the side. The very centre square, d4, is called the Spot. Whoever controls the Spot usually controls the game.

## The pieces
Each player has one Kai, the most important piece, and a team of Kins who protect it. Lose your Kai and you lose the game, so guard it like your last slice of [[toast]].

## Moving and capturing
Pieces move by stepping and hopping. The most famous capture is the sandwich: trap an enemy piece between two of yours and it is out. Good players plan sandwiches a few moves ahead. Very good players pretend they are not planning anything at all.

## How to win
There are four ways to win a game of KAI:
- capture the other player's Kai;
- start your turn with your Kai standing on the Spot;
- take all of the other player's Kins, so they have no Kins left;
- leave the other player with no legal moves.

## Manners
Before a game, Kaiists say "{kaiwen}" (good luck). After the game, both players say "{arima}" (thank you), whoever won. The winner then offers a rematch. That is rule two of the [[three-rules|Three Rules]] in action, and whoever lost has learned something new, which is rule three.

## Play it
You can play KAI against a friend or against bots on the [page:kai.html|KAI page]. Beating a bot earns the "@@stampkaiwin@@" stamp for your [[passport]]. {yusa} means "to win".
`);

art('kai-time', 'Kai Time', { kai: 'kaiyu', cat: 'Time', box: () => [['Kaihana', glossSpan('kaiyu')], ['Units', 'kai, bits, blinks'], ['Kai per day', BLOCKS.kpd()], ['Noon', BLOCKS.noon()], ['Right now', BLOCKS.now()], ['See it', '<a class="ext" href="time.html">Kai clock</a>']], see: ['kai-calendar', 'kai-numbers', 'museum'] }, `
Kai Time is how [[kaiya|Kaiya]] tells the time. Instead of 24 hours of 60 minutes of 60 seconds — numbers that nobody can remember choosing — the Kaiya day is split into nice round tens and hundreds.

@@timesys@@

## The units
A day has @@kpd@@ kai. Each kai has @@bpk@@ bits, and each bit has @@blpb@@ blinks. That makes @@blinksday@@ blinks in a day. One kai lasts @@kaidur@@. One bit is @@bitdur@@, and one blink is @@blinkdur@@, which is about how long a blink takes if you are very relaxed.

## Reading a Kai clock
Kai Time is written like 6:45, which means 6 kai and 45 bits. Midnight is 0:00 and noon is @@noon@@, right in the middle of the day. Dinner in Kaiya is usually around 7:50, and most young Kaiists are asleep by 8:75 (and their parents by 9:50).

## Why it is better
Want to know how much of the day is gone? Just read the clock: 3:00 means three tenths of the day are over. No sums needed. Kaiist scientists also point out that "five more bits" is a much more precise way to ask for a later bedtime.

## Time words
The Kaihana word for time is {kaiyu}. "Now" is {ima}, "today" is {imanesi}, "yesterday" is {panesi} and "tomorrow" is {wonesi}. Notice how yesterday starts with {pa}, the past word, and tomorrow starts with {wo}, the future word.

## See it live
The big clock on the [page:time.html|Kai Time page] shows Kai Time ticking in real life. Right now it is @@now@@. Days and years are counted with the [[kai-calendar|Kai calendar]].
`);

art('kai-calendar', 'Kai calendar', { kai: '', cat: 'Time', box: () => [['Months', BLOCKS.nmonths() + ` of ${MONTHLEN} days`], ['Week', `${T.weekdays.length} days`], ['Kaidays', `${BLOCKS.nkaidays()} (${BLOCKS.nkaidaysleap()} in leap years)`], ['Year 1 KE began', BLOCKS.epoch()], ['Today', BLOCKS.today()], ['Converter', '<a class="ext" href="time.html">Kai Time page</a>']], see: ['kai-time', 'holidays', 'kaidays', 'history'] }, `
The Kai calendar is how [[kaiya|Kaiya]] counts its days and years. It is much tidier than the normal calendar: every month is the same length, and every month starts on the same day of the week as the one before it.

## The year
A Kai year has @@nmonths@@ months of @@monthlen@@ days each, which adds up to @@daysregular@@ days. After the last month, @@lastmonth@@, come @@nkaidays@@ festival days called the [[kaidays|Kaidays]], which belong to no month at all. In a leap year there are @@nkaidaysleap@@. Years are counted from the founding of Kaiya: year 1 KE (Kai Era) began on @@epoch@@, the day Kai.fun went live. That day was 1 @@firstmonth@@. Anything earlier is BKE, "before the Kai era".

## The months
Every month is named after a Kaihana word. {Miwan} comes from {miwa} (cat), {Tosun} from {tosu} (toast) and {Kotun} from {kotu} (code).

@@months@@

## The week
The Kai week has @@weeklen@@ days, so each month is exactly @@weeksmonth@@ weeks long. The days are named after the numbers one to six. The last one, @@restday@@, is Funday, the rest day.

@@weekdays@@

## Today
Today is @@today@@. You can convert any date, including your birthday, on the [page:time.html|Kai Time page]. For the parties, see [[holidays|Holidays of Kaiya]].
`);

art('holidays', 'Holidays of Kaiya', { kai: '', cat: 'Time', box: () => [['Holidays', String(T.holidays.length) + ' + the Kaidays'], ['New Year', BLOCKS.newyear()], ['Most toasty', BLOCKS.toastday()], ['Calendar', '<a class="int" href="#kai-calendar">Kai calendar</a>']], see: ['kaidays', 'toast', 'monke', 'kaicode'] }, `
[[kaiya|Kaiya]] has a small number of holidays, which Kaiists say is fine because [[three-rules|rule one]] already tells you to play every day. The holidays are just days when everyone plays the same thing at the same time.

@@holidays@@

## Kai.fun Day
@@newyear@@ is New Year's Day in Kaiya and the country's birthday: it marks the day the first Kai.fun page went live and year 1 KE began. Kaiists wave paper [[flag|flags]], shout "{kaiyo}!" at each other and play their favourite Kai.fun game.

## Toast Day
On @@toastday@@, everyone makes [[toast]]. The official saying is "Nobody burns the sun", which means: watch your toaster, and do not make your toast as dark as a night with no moon. The sun on the flag is said to be the colour of perfect toast.

## Monke Day
@@monkeday@@ honours the national animal, the [[monke]]. Kaiists climb something, respectfully: a climbing frame, a tree or a hill is fine; furniture, parents and other people's cars are not.

## Splash Day
@@splashday@@ falls in {Wasun}, the water month. It is the day for water fights, paddling, and finally admitting the [[kaiya-sea|Kaiya Sea]] is a bit cold.

## First Code Day
On @@codeday@@ Kaiists write their first [[kaicode|Kaicode]] program of the year.

## The Kaidays
The year ends with a whole festival week called the [[kaidays|Kaidays]]. Some Kaiists say that counts as five more holidays. Nobody has argued with them yet.
`);

art('kaidays', 'Kaidays', { kai: '', cat: 'Time', box: () => [['When', 'after ' + BLOCKS.lastmonth()], ['How many', `${BLOCKS.nkaidays()} (${BLOCKS.nkaidaysleap()} in leap years)`], ['Month', 'none!'], ['Calendar', '<a class="int" href="#kai-calendar">Kai calendar</a>']], see: ['kai-calendar', 'holidays'] }, `
The Kaidays are the festival days at the end of the Kai year. Every [[kai-calendar|Kai month]] is exactly @@monthlen@@ days long, but a year is a bit longer than all the months put together, so the leftover days are gathered at the end into one long party. They come after @@lastmonth@@, the Code month, and they belong to no month at all.

@@kaidays@@

## Kaiyo Day
{kaiyo} means hello, so on Kaiyo Day you say hello to someone you have not talked to before. It is the friendliest day of the year and the most awkward, in a good way.

## Mosa Day
{mosa} means friend. Mosa Day is for doing something nice for a friend: make them a card, teach them a game, or give them the good half of your sandwich.

## Kaimo Day
{kaimo} means game. On Kaimo Day, Kaiists hold game tournaments. The biggest is the great [[kai-game|KAI]] tournament in [[kaiya-lon|Kaiya Lon]].

## Manu Day
{manu} means to learn. Kaiists pick one thing they want to learn next year, like a [[kaihana|Kaihana]] word, a card trick or how to whistle.

## Yosen Day
{yosen} means goodbye. On Yosen Day, Kaiists say goodbye to the old year. The next day is Kai.fun Day, the new year.

## Leap Day
In some years there is a sixth Kaiday, Leap Day. It happens when the Kai year has a February 29 inside it. It is a bonus day, and the tradition is to {hopu} (jump) at least once, just because you can.
`);

art('passport', 'The Passport', { kai: 'kaipasu', cat: 'Culture', box: () => [['Kaihana', glossSpan('kaipasu')], ['Stamps', BLOCKS.nstamps()], ['You have', `${KAI.passport.count()} of ${KAI.STAMPS.length}`], ['Issued by', 'the KAIISM hub'], ['Kept', 'in your browser']], see: ['citizenship', 'kaiya'] }, `
The Kaiya passport ({kaipasu}) is a little book of stamps that every visitor to [[kaiya|Kaiya]] gets for free. You do not need to fill in any forms: just open the KAIISM hub and you get your first stamp, "@@stamparrive@@", which means you have arrived.

## How stamps work
Each stamp is earned by doing something fun in Kaiya, such as playing a game of [[kai-game|KAI]], writing your name in [[kaiscript|Kaiscript]] or reading Kaipedia. There are @@nstamps@@ stamps in total. Here is the full list, and which ones you already have:

@@stamps@@

## Where it lives
Your passport is kept in your own web browser, on your own device. Nobody else can see it, and it does not go anywhere. That also means that if you clear your browser data, or switch to another computer, your passport starts again from the first page. Kaiists see this as a chance to collect everything a second time.

## The rarest stamp
The hardest stamps to earn are the ones for mastering [[kai-game|KAI]], finishing every [[kaihana|Kaihana]] lesson and solving every [[kaicode|Kaicode]] challenge. The most important one is "@@stampcitizen@@", which you get by passing the [[citizenship|citizenship test]]. It proves you are a real Kaiist.

## This page
Reading five different Kaipedia articles earns the "@@stamppedia@@" stamp ({rinu} means to read, and {maku} means a lot). You can see your progress on the left side of this page, or near the top on a phone.
`);

art('citizenship', 'Citizenship of Kaiya', { kai: 'kaiteno', cat: 'Culture', box: () => [['Citizens are called', glossSpan('kaiteno')], ['Test', '15 questions'], ['Pass mark', '12'], ['Reward', 'certificate + stamp'], ['Take it', '<a class="ext" href="test.html">Citizenship test</a>']], see: ['passport', 'kaiism', 'three-rules', 'kai-game'] }, `
Anyone, anywhere, of any age, can become a citizen of [[kaiya|Kaiya]]. You do not need to move house, learn to march or fill in a single form. You just need to pass the citizenship test, which proves you know a little about the Land of Fun.

## The test
The [page:test.html|citizenship test] has 15 questions, picked at random from a big bank, so no two tests are the same. You need 12 right to pass. Questions can be about [[kaihana|Kaihana]] words and grammar, [[kai-numbers|Kai numbers]], the [[kai-calendar|calendar]] and [[holidays]], the [[flag]], the [[three-rules|Three Rules]], the [[motto]] and the rules of [[kai-game|KAI]]. Reading Kaipedia first is an excellent idea. Some say it is the only idea.

## If you fail
Nothing bad happens. You see which questions you got wrong and what the right answers were, and then you try again. That is [[three-rules|rule three]]: learn something new.

## The certificate
When you pass, you get a certificate with your name on it, your name in [[kaiscript|Kaiscript]], the flag, today's Kai date and the official seal of Kaiya. You can save it as a picture. You also get the "@@stampcitizen@@" stamp in your [[passport]].

## Being a citizen
Citizens of Kaiya are called {kaitenoli} (one citizen is a {kaiteno}). A new citizen traditionally says "{mi sa kaiteno}!" — "I am a Kaiist!" — as loudly as is polite. There are no taxes, no jury duty and no voting, except voting for which toast topping is best, which happens every single day.

## Two countries
Being a citizen of Kaiya does not change anything about your real country. Kaiya is pretend, so you can belong to it as well as to wherever you live. Kaiya does not mind, and neither, as far as anyone knows, does any real country.
`);

art('anthem', 'Uso ni Mili (anthem)', { kai: 'uso ni mili', cat: 'Symbols', box: () => [['Kaihana title', glossSpan('uso ni mili')], ['English', 'Our Home'], ['Parts', '2 verses + chorus'], ['Music', 'original Kaiya melody'], ['Listen', '<a class="ext" href="anthem.html">Play the anthem</a>']], see: ['motto', 'three-rules', 'kaiya'] }, `
"{uso ni mili}" ("Our Home") is the national anthem of [[kaiya|Kaiya]]. It is sung entirely in [[kaihana|Kaihana]] to an original Kaiya tune, with two verses and a big chorus that comes round twice.

## The title
{uso} means home or house, {ni} shows who something belongs to and {mili} means we or us. In Kaihana, "X {ni} Y" means "Y's X", so {uso ni mili} is "the home of us": our home.

## The words
The first verse is about the warm sun, the green sea and everyone being one big family. The chorus starts "{Kaiya}, {Kaiya}, {uso ni mili}", then sings the [[motto]] — "@@mottokai@@" — twice, before "{mili kanta ka mili tanu}": we sing and we dance. The second verse borrows from the [[three-rules|Three Rules]], "{kaia, huma, manu}" (play, help, learn), and ends with everybody jumping to the stars.

## The tune
The melody was written specially for Kaiya, so it does not sound like any other country's anthem. It bounces along in a major key with a bass line, chords and a little drum beat, and it ends on a long, happy note. It takes about a minute and a half at the normal speed.

## How to sing it
There are no rules about standing up or hands on hearts. Most Kaiists sway, some dance ({tanu}), and at least one person always sings the last line far too loudly. All of these are correct.

## Listen
You can play the anthem with karaoke words and a [[kaiscript|Kaiscript]] version of every line on the [page:anthem.html|anthem page]. Listening all the way to the end earns the "@@stampanthem@@" stamp ({kanta} means to sing).
`);

art('toast', 'Toast', { kai: 'tosu', cat: 'Food', box: () => [['Kaihana', glossSpan('tosu')], ['Status', 'National food'], ['Holiday', BLOCKS.toastday()], ['Best topping', 'still being argued about'], ['Month', glossSpan('Tosun')]], see: ['holidays', 'famous-kaiists', 'kaiya-lon'] }, `
Toast is the national food of [[kaiya|Kaiya]]. In [[kaihana|Kaihana]] it is called {tosu} — and so is bread. Kaiist food experts say this proves that bread is simply toast that has not happened yet.

## Why toast?
Toast is easy to make, cheap, warm and goes with almost anything. You can make it in a toaster, under a grill or, if you are a very patient person, by holding bread up to the {hemi} (sun). It is also the colour of the sun on the [[flag]], which most people agree cannot be a coincidence. Kai.fun even has a game about it, "a simple game about toasting", which many Kaiists treat as official training.

## Toast Day
Every year on @@toastday@@, everyone in Kaiya makes toast. The saying for the day is "Nobody burns the sun": keep an eye on the toaster. The month is even named after it: {Tosun}, the Toast month.

## Toppings
The topping debate is the longest argument in Kaiya's history. Popular choices include {kesu} (cheese), {nana} (banana), {oyu} (egg) and butter with a sprinkle of sugar. Some daring Kaiists put {amasu} (candy) on toast, which is allowed but frowned upon by dentists.

## Toast manners
You must offer your friend a bite of your toast if they ask nicely with {puri} (please). That is [[three-rules|rule two]]. You must not take the last slice without saying {sumen} (sorry). That is just good sense.

## Useful sentences
"{mi wiso tosu}" — I want toast. "{tosu sa mo yosa}" — the toast is very good. "{mi pa yami tosu}" — I ate toast. "{tosu nai sa atu}" — the toast is not hot, which is the saddest sentence in Kaihana.
`);

art('monke', 'Monke', { kai: 'monke', cat: 'Animals', box: () => [['Kaihana', glossSpan('monke')], ['Status', 'National animal'], ['Holiday', BLOCKS.monkeday()], ['Favourite food', glossSpan('nana') + ' (banana)'], ['Lives', 'Mount Takan, games, everywhere']], see: ['mount-takan', 'holidays', 'kai-game'] }, `
The monke is the national animal of [[kaiya|Kaiya]]. The Kaihana word {monke} covers monkeys, apes and gorillas, and Kaiists say it with great respect, because the monke lives by [[three-rules|rule one]] better than anyone: it plays every single day.

## Why the monke?
Monkes climb, swing, jump and goof around, and they are smart too. They help their friends by picking bugs out of their hair, which is rule two (in a slightly gross way). They learn by copying each other, which is rule three. In short, the monke is the perfect Kaiist and does not even know it.

## Monkes on Kai.fun
Kai.fun is famously full of monke games, where monkes build banana businesses, dash through levels and even box. Kaiists treat these as important cultural studies.

## Monke Day
@@monkeday@@ is the national monke holiday, in {Monken}, the Monke month. Kaiists climb something, respectfully. The biggest crowds go to [[mount-takan|Mount Takan]], where wild monkes live near the top and watch the climbers with polite interest.

## Bananas
A monke's favourite food is {nana} (banana). On Monke Day it is traditional to put banana on your [[toast]], which combines two national treasures in one bite.

## Useful sentences
"{monke sa kewa}" — monke is awesome. "{monke pa hopu}" — the monke jumped. "{monkeli kaia temu nana}" — the monkes play with a banana. And for emergencies: "{monke pa kapa tosu ni mi}!" — the monke took my toast!
`);

art('kaiya-sea', 'Kaiya Sea', { kai: 'awana kai', cat: 'Places', box: () => [['Kaihana', glossSpan('awana kai')], ['Meaning', 'the fun sea'], ['Colour', 'teal'], ['On the flag', 'the teal band'], ['Holiday', BLOCKS.splashday()]], see: ['flag', 'kaiya-lon', 'holidays'] }, `
The Kaiya Sea, called {awana kai} ("the fun sea") in [[kaihana|Kaihana]], is the sea that surrounds [[kaiya|Kaiya]] on every side. It is the teal band at the bottom of the [[flag]], and the thin cream line above it is said to be the foam where the waves meet the beach.

## Water
The water ({wasu}) is clear, teal and, according to most swimmers, "a bit cold at first but fine once you are in". Every swimmer in the world says this, and Kaiists are no different. Kaiists love to {yuyu} (swim), splash about and build sandcastles shaped like the [[kaiscript|Kaiscript]] letter k.

## Wildlife
The sea is full of {yuloli} (fish). The best known is the toast fish, a flat golden fish that is not made of toast, no matter how many times children ask. Seabirds ({pirili}) circle overhead waiting for anyone who brings a sandwich to the beach.

## Splash Day
The busiest day at the seaside is @@splashday@@, in {Wasun}, the water month. Thousands of Kaiists have water fights on the beach, and the winner is whoever is still smiling at the end, which is usually everyone.

## Sailing
Kaiya has no navy, but it has a lot of small boats with names like "Fast Toast" and "Monke Business". Sailors say {kaiwen} (good luck) before leaving the harbour of [[kaiya-lon|Kaiya Lon]] and {kaiyo} (hello) to every other boat they pass.

## Useful sentences
"{awana sa mo yamia}" — the sea is very beautiful. "{mi kan yuyu}" — I can swim. "{wasu sa simu}" — the water is cold. "{mi wo yuyu wonesi}" — I will swim tomorrow, which is what everyone says when the water is cold.
`);

art('mount-takan', 'Mount Takan', { kai: 'takan lon', cat: 'Places', box: () => [['Kaihana', glossSpan('takan lon')], ['Means', '"Mount Mountain"'], ['Height', 'about 4,000 slices of toast'], ['Top', glossSpan('yuwi') + ' (snow)'], ['Residents', 'wild monkes']], see: ['monke', 'kaiya-lon', 'motto'] }, `
Mount Takan is the highest point in [[kaiya|Kaiya]]. In [[kaihana|Kaihana]], {takan} already means "mountain", so its English name, Mount Takan, actually means "Mount Mountain". Kaiists think this is very funny and refuse to change it. Locals usually call it {takan lon}, "the big mountain".

## Height
Mount Takan is about 4,000 slices of toast tall, if you stack them very carefully. It is so high that the top is covered in {yuwi} (snow) all year, even in {Kentan}, the Fire month. On a clear day you can see the whole [[kaiya-sea|Kaiya Sea]] from the top, and on a very clear day you can see someone in [[kaiya-lon|Kaiya Lon]] dropping their toast.

## Climbing
The busiest climbing day is @@monkeday@@, when Kaiists climb something, respectfully, and Mount Takan is the biggest something there is. The path has ten rest stops, one for each kai of the [[kai-time|Kai day]], and the fastest climbers reach the top before 5:00, which is noon.

## Monkes
Wild [[monke|monkes]] live near the top. They are friendly, curious and extremely interested in any banana you bring. Climbers are asked to share, which is [[three-rules|rule two]].

## The carving
Near the top there is a flat rock carved with the national [[motto]], "@@mottokai@@". Nobody knows who carved it. Some say it was a climber who forgot to bring a flag. Others say it was the monkes, but they are not saying.

## Useful sentences
"{takan sa mo lon}" — the mountain is very big. "{mi pa hopu}" — I jumped. "{mi sa suyun}" — I am tired, which is what everyone says at the top.
`);

art('kaiya-lon', 'Kaiya Lon', { kai: 'Kaiya lon', cat: 'Places', box: () => [['Kaihana', glossSpan('Kaiya lon')], ['Means', '"Big Kaiya"'], ['Status', 'Capital city'], ['Famous for', 'Museum of Everything, the Giant KAI Board'], ['Between', 'Mount Takan and the Kaiya Sea']], see: ['museum', 'kai-game', 'kaiya-sea', 'mount-takan'] }, `
Kaiya Lon is the capital city of [[kaiya|Kaiya]]. Its name is pure [[kaihana|Kaihana]]: {Kaiya} plus {lon}, which means big. Since describing words go after the noun in Kaihana, {Kaiya lon} means "big Kaiya". It sits between the snowy slopes of [[mount-takan|Mount Takan]] and the teal water of the [[kaiya-sea|Kaiya Sea]].

## The city
Kaiya Lon is the biggest city in Kaiya, which is easy, because it is also the only one. Its streets have signs in both English and [[kaiscript|Kaiscript]], and every front door has a little bell that rings "kaiyo" in a high voice. The tallest building is the [[museum|Museum of Everything]].

## The Giant KAI Board
The main square of Kaiya Lon is paved like a giant [[kai-game|KAI]] board, seven squares by seven, with a fountain on the Spot in the middle. On sunny days, Kaiists play life-size games where people stand in for the pieces. Being the Kai is a great honour. Being a Kin who gets sandwiched is a great way to get splashed by the fountain.

## Food
The Toast Market opens at 3:00 Kai Time and sells [[toast]] with every topping known to Kaiists, plus a few that should not be. The banana stall is run by a [[monke]], who is extremely good at business.

## Getting around
There are no cars in Kaiya Lon. People {pomo} (walk), {tasa} (run) or, on [[kaidays|Kaimo Day]], {hopu} (jump) from square to square of the giant board.

## Useful sentences
"{mi seyo ana Kaiya lon}" — I live in Kaiya Lon. "{tu ira remo}?" — where are you going? "{mi ira lo uso}" — I am going home.
`);

art('museum', 'Museum of Everything', { kai: 'uso ni kumi', cat: 'Places', box: () => [['Kaihana', glossSpan('uso ni kumi')], ['Means', '"the house of everything"'], ['Location', '<a class="int" href="#kaiya-lon">Kaiya Lon</a>'], ['Opening hours', '0:00 to 9:99 Kai Time'], ['Entry', 'free']], see: ['kaiya-lon', 'bob', 'history'] }, `
The Museum of Everything is the largest museum in [[kaiya|Kaiya]] and possibly in any made-up country. Its [[kaihana|Kaihana]] name is {uso ni kumi}, "the house of everything". It stands in the middle of [[kaiya-lon|Kaiya Lon]], and Kai.fun has its own Museum of Everything page, which Kaiists consider the museum's official website.

## The collection
The museum's goal is to have one of everything. So far it has one of a great many things: a {roka} (rock) that looks like a duck, a very old {sirinu} (pencil), a cloud in a jar (the jar is empty, but the label is very convincing), and the first slice of [[toast]] ever made on Toast Day, which is behind thick glass and smells amazing.

## Opening hours
The museum is open from 0:00 to 9:99 [[kai-time|Kai Time]]. Since 9:99 is the very last bit of the day, that means it never closes. The guards take turns sleeping in the Bed Room, which is a room full of beds from all over history.

## Famous rooms
The Small Room is full of {piku} (small) things and is itself very small. The Big Room is so large that visitors are given a snack before they enter. The Hall of Kaiists honours [[famous-kaiists|famous Kaiists]], and there is a whole room about [[bob|Bob the Stickman]], who has never visited because he is still walking.

## Visiting
Entry is free. Above the doors is the national [[motto]], "@@mottokai@@". Visitors are allowed to touch exactly one thing, chosen by them, and must say {arima} (thank you) to the guard on the way out.
`);

art('bob', 'Bob the Stickman', { kai: '', cat: 'People', box: () => [['img', `<svg viewBox="0 0 60 90" width="80" height="120" aria-hidden="true"><g fill="none" stroke="#191512" stroke-width="4" stroke-linecap="round"><circle cx="30" cy="16" r="10" fill="#fffaf0"/><line x1="30" y1="26" x2="30" y2="56"/><line x1="30" y1="36" x2="16" y2="48"/><line x1="30" y1="36" x2="44" y2="44"/><line x1="30" y1="56" x2="18" y2="80"/><line x1="30" y1="56" x2="42" y2="78"/></g><line x1="4" y1="84" x2="56" y2="84" stroke="#f2b632" stroke-width="5" stroke-linecap="round"/></svg>`, 'Bob, mid-step'], ['Known for', 'walking'], ['Location', 'the desert, ' + glossSpan('teru atu')], ['In Kaiscript', KAI.scriptSVG('Bob', { size: 24, color: '#191512' })], ['Status', 'still walking']], see: ['museum', 'kaiscript', 'famous-kaiists'] }, `
Bob the Stickman is the most famous walker in [[kaiya|Kaiya]]. He is a stickman — a circle for a head and five straight lines for the rest — and he walks across the great desert, which Kaiists call {teru atu} ("the hot ground"). Kai.fun has games about him, including "Bob the Stickman" and "Everlasting Bob".

## The walk
Nobody knows exactly when Bob started walking or where he is going. What everyone does know is that he has not stopped. In Kaihana: "Bob {nai pa tome}" — Bob did not stop. Some say he is walking to the edge of the desert. The desert has no edge. Bob does not seem to mind.

## Things Bob has passed
Over the years, Bob has walked past cactuses, sand dunes, a lost [[monke]], several very confused tourists and a sign reading "DESERT AHEAD", which was a little late. He also walked past the Desert Dessert Deli, which only sells ice cream and is therefore very popular.

## His name in Kaiscript
Kaihana has no letter b, so in [[kaiscript|Kaiscript]] Bob's name is written "pop". Bob has said he is fine with this, as long as nobody pops him.

## Bob and Kaiism
Bob is admired in Kaiya because he never gives up, and because he always seems to be having a nice time. He waves at everyone. Kaiists say that if you are having a hard day, "{pomo} like Bob": just keep walking, one step at a time.

## Visiting Bob
You cannot really visit Bob, since he will have moved on by the time you get there. The [[museum|Museum of Everything]] has a whole room about him instead, with a treadmill so you can see how it feels.
`);

art('famous-kaiists', 'Famous Kaiists', { kai: 'kaitenoli', cat: 'People', box: () => [['Kaihana', glossSpan('kaitenoli')], ['Real people?', 'No — all made up'], ['Hall of fame', '<a class="int" href="#museum">Museum of Everything</a>']], see: ['kaiism', 'museum', 'citizenship'] }, `
Kaiya is full of famous Kaiists ({kaitenoli}). Every one of them is made up, which is the only way to be famous in a made-up country. Their names are all built from [[kaihana|Kaihana]] words, so you can work out what they mean.

## Tosu Rasu
{tosu rasu} — "Toast Boss". The greatest toast-maker in Kaiya's history. Tosu Rasu has made toast on every single Toast Day since the very first one and has never burned a slice. Tosu Rasu's secret: "Watch the toaster. Do not talk to the toaster. The toaster does not like to be watched while it is talking."

## Piri Sipa
{piri sipa} — "Fast Bird". The fastest runner in Kaiya, who once ran to the top of [[mount-takan|Mount Takan]] and back before her toast was ready. She says the trick is to {tasa} (run) and not think about the hill.

## Humo Sisi
{humo sisi} — "Quiet Bear". The [[kai-game|KAI]] champion of Kaiya. Humo Sisi never says a word during a game except "{arima}" at the end, win or lose. Opponents describe playing him as "like being sandwiched by a library".

## Kero Teki
{kero teki} — "Smart Frog". A [[kaicode|Kaicode]] programmer who wrote the longest program in Kaiya. It is ten thousand lines long, and every line says {kaiyo}.

## Rira Kiwo
{rira kiwo} — "Yellow Flower". A painter whose huge picture "Toast at Sunset" hangs in the [[museum|Museum of Everything]]. Visitors often try to eat it.

## Nunu Ron
{nunu ron} — "Loud Baby". The loudest singer of the [[anthem]]. Nobody is sure if Nunu Ron is actually a baby, or just sings like one when excited.

## You?
Every citizen of Kaiya could be the next famous Kaiist. Pass the [[citizenship|citizenship test]] and you are already halfway there.
`);

art('history', 'History of Kaiya', { kai: '', cat: 'Places', box: () => [['Founded', BLOCKS.epoch()], ['Kai date', '1 ' + BLOCKS.firstmonth() + ', year 1 KE'], ['Founder', 'Kai, creator of Kai.fun'], ['Before that', 'the BKE years'], ['Today', BLOCKS.today()]], see: ['kaiya', 'kai-calendar', 'flag'] }, `
The history of [[kaiya|Kaiya]] is short, because Kaiya is young, but it is very busy.

## Before the Kai era
Kaiya historians call everything before the founding the BKE years, "before the Kai era". Very little happened in Kaiya during this time, mainly because there was no Kaiya. Dinosaurs, castles, the invention of the toaster and so on all happened in the BKE years, but they happened somewhere else.

## The founding
Kaiya was founded on @@epoch@@, the day the Kai.fun website went live. That day became 1 @@firstmonth@@, year 1 KE, the first day of the [[kai-calendar|Kai calendar]], and it is celebrated every year as Kai.fun Day (see [[holidays]]). The founder is Kai, the creator of Kai.fun, who had the idea that a website full of fun could be a whole country of fun.

## Year 1 KE
In its first year, Kaiya grew very quickly. It got a [[flag]], a way of life called [[kaiism|Kaiism]] and [[three-rules|Three Rules]] to go with it. [[kaihana|Kaihana]] got its first @@dictcount@@ words, its grammar and its own alphabet, [[kaiscript|Kaiscript]]. The national board game [[kai-game|KAI]] was invented, along with the coding language [[kaicode|Kaicode]], the [[kai-time|Kai clock]], the anthem "[[anthem|Uso ni Mili]]", the [[passport]], the [[citizenship|citizenship test]] and this encyclopedia.

## The first Toast Day
The very first Toast Day falls on @@firsttoast@@ (12 {Tosun}, year 1 KE). Historians are already arguing about which topping will win. Tosu Rasu, the most famous of the [[famous-kaiists|famous Kaiists]], has been practising.

## The future
Nobody knows what Kaiya will do next. That is part of the fun. As Kaiists say: "{mili wo mira}" — we will see.
`);

art('kai-numbers', 'Kai numbers', { kai: 'namu', cat: 'Language', box: () => [['Kaihana', glossSpan('namu')], ['Base', 'ten'], ['10', glossSpan('kaito')], ['100', glossSpan('honu')], ['1000', glossSpan('salu')], ['This year', glossSpan(KAI.numberToKai(KAI.toKaiDate(new Date()).year))]], see: ['kaihana', 'kai-time', 'kai-calendar'] }, `
Kai numbers ({namu} means number) are how [[kaiya|Kaiya]] counts. There are ten digit words, and everything else is built from them like Lego.

@@digits@@

## Big numbers
Ten is {kaito}, a hundred is {honu} and a thousand is {salu}. To make bigger numbers you just say them the way you would count them out: first the hundreds, then the tens, then the ones. So 23 is "two ten three" — {tawa kaito mito} — and 105 is "hundred five" — {honu pana}. You never need a special word like "eleven" or "twenty".

@@numex@@

## Counting things
Put the number before the thing you are counting. After a number you do not need the plural ending -li, because the number already tells you there is more than one: {tawa miwa} is two cats, not {tawa miwali}. To ask how many, use {namo}: "{tu ume namo miwa}?" — how many cats do you have?

## Numbers in Kaiscript
In [[kaiscript|Kaiscript]], digits are written as dots on the 3×3 grid with a line underneath. Three is three dots, nine fills the whole grid, and zero is a tiny empty ring.

## Numbers in daily life
Kai numbers are used for the [[kai-time|Kai clock]] (ten kai in a day, numbered from {zen} to {nomi}), for the days of the [[kai-calendar|Kai calendar]], and for the weekdays, whose names come from the numbers one to six. Kaiists also use them to count how many slices of [[toast]] they have eaten, though they often lose count around {kaito}.
`);

/* ================= rendering ================= */
const SHORT = { anthem: 'anthem', citizenship: 'citizenship', flag: 'flag', holidays: 'holidays', monke: 'monke', motto: 'motto', passport: 'passport', toast: 'toast' };
A.forEach(a => { if (SHORT[a.id]) a.short = SHORT[a.id]; });
const byId = new Map(A.map(a => [a.id, a]));
function inline(s) {
  return s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]|\[page:([^\]|]+)\|([^\]]+)\]|\{([^}]+)\}|@@([^@]+)@@/g, (m, id, txt, page, ptxt, kai, blk) => {
    if (id) { const a = byId.get(id); return a ? `<a class="int" href="#${id}">${esc(txt || a.short || a.title)}</a>` : `<a class="int broken" href="#${esc(id)}">${esc(txt || id)}</a>`; }
    if (page) return `<a class="ext" href="${esc(page)}">${esc(ptxt)}</a>`;
    if (kai) return glossSpan(kai);
    return block(blk);
  });
}
function renderBody(body) {
  const out = [], toc = [];
  for (const chunk of body.split(/\n\s*\n/)) {
    const c = chunk.trim(); if (!c) continue;
    if (c.startsWith('## ')) {
      const lines = c.split('\n'), h = lines[0].slice(3).trim(), hid = 's-' + h.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      toc.push({ h, hid });
      out.push(`<h2 id="${hid}">${esc(h)}</h2>`);
      const rest = lines.slice(1).join('\n').trim();
      if (rest) out.push(para(rest));
    } else out.push(para(c));
  }
  return { html: out.join('\n'), toc };
}
function para(c) {
  if (/^@@[^@]+@@$/.test(c)) return inline(c);
  if (c.split('\n').every(l => l.startsWith('- '))) return `<ul>${c.split('\n').map(l => `<li>${inline(l.slice(2))}</li>`).join('')}</ul>`;
  return `<p>${inline(c)}</p>`;
}
function infobox(a) {
  if (!a.box) return '';
  const rows = a.box();
  let img = '', trs = '';
  for (const r of rows) {
    if (r[0] === 'img') img = `<div class="img">${r[1]}${r[2] ? `<div class="cap">${esc(r[2])}</div>` : ''}</div>`;
    else trs += `<tr><th>${esc(r[0])}</th><td>${r[1]}</td></tr>`;
  }
  return `<aside class="p-info" aria-label="Infobox"><div class="ih">${esc(a.title)}${a.kai ? `<small>${glossSpan(a.kai)}</small>` : ''}</div>${img}<table>${trs}</table></aside>`;
}

/* ================= reading tracker ================= */
const store = KAI.store('pedia');
const NEED = 5;
let read = store.get('read', []);
if (!Array.isArray(read)) read = [];
function markRead(id) {
  if (!read.includes(id)) { read.push(id); store.set('read', read); }
  if (read.length >= NEED) KAI.passport.give('pedia');
  renderProgress();
}
function renderProgress() {
  const n = Math.min(read.length, NEED), got = KAI.passport.has('pedia');
  $('progress').innerHTML = got
    ? `<b>Stamp earned!</b> “${esc(stamp('pedia').kai)}” is in your passport. You have read ${read.length} of ${A.length} articles.<div class="bar"><i style="width:100%"></i></div>`
    : `<b>Reading stamp:</b> ${n} of ${NEED} articles read<div class="bar"><i style="width:${n / NEED * 100}%"></i></div>`;
  $('progress').dataset.read = read.length;
}

/* ================= views ================= */
const view = $('view');
const cats = [...new Set(A.map(a => a.cat))];
function tocHTML(a, toc) {
  return `<h4>Contents</h4><div class="toc"><a href="#${a.id}" data-top>(Top)</a>${toc.map(t => `<a href="#${a.id}" data-sec="${t.hid}">${esc(t.h)}</a>`).join('')}${a.see ? '<a href="#' + a.id + '" data-sec="p-see">See also</a>' : ''}</div>`;
}
function showArticle(a) {
  const { html, toc } = renderBody(a.body);
  view.innerHTML = `<div class="p-tabs"><span class="k-chip on">Article</span><span class="k-chip">${esc(a.cat)}</span><span class="sp">${read.includes(a.id) ? 'You have read this before' : 'New to you'}</span></div>
    <h1 class="p-title">${esc(a.title)}</h1>
    <div class="p-from">From Kaipedia, the free encyclopedia of Kaiya</div>
    <div class="p-body" data-id="${a.id}">${infobox(a)}<div class="p-text">${html}</div></div>
    ${a.see ? `<section class="p-see" id="p-see"><h2>See also</h2><ul>${a.see.map(id => byId.get(id)).filter(Boolean).map(s => `<li><a class="k-btn sm" href="#${s.id}">${esc(s.title)}</a></li>`).join('')}</ul></section>` : ''}
    <div class="p-cats">Category: <a href="#all">${esc(a.cat)}</a> · <a href="#all">All ${A.length} articles</a></div>
    <p class="p-foot">This page is part of a made-up country. Everything in Kaipedia is pretend, except the toast.</p>`;
  $('tocBox').innerHTML = tocHTML(a, toc);
  $('mDrawer').innerHTML = `<nav class="p-menu" aria-label="Contents (mobile)">${tocHTML(a, toc)}</nav>`;
  document.title = `${a.title} · Kaipedia`;
  markRead(a.id);
}
function allList() {
  return `<div class="p-all">${A.slice().sort((x, y) => x.title.localeCompare(y.title)).map(a => `<a href="#${a.id}" class="${read.includes(a.id) ? 'read' : ''}">${esc(a.title)}</a>`).join('')}</div>`;
}
function showMain() {
  const feat = byId.get('kaiya'), wod = KAI.wordOfDay(), today = KAI.toKaiDate(new Date());
  const dyk = [
    ['mount-takan', 'Mount Takan’s name means “Mount Mountain”'],
    ['toast', 'in Kaihana, bread and toast are the same word'],
    ['museum', 'the Museum of Everything is open from 0:00 to 9:99'],
    ['bob', '“Bob” is written “pop” in Kaiscript'],
    ['kaidays', 'the Kai year ends with a week of party days that belong to no month']
  ];
  view.innerHTML = `<div class="p-home">
    <div class="p-tabs"><span class="k-chip on">Main page</span><span class="sp">${A.length} articles · all of them true (in Kaiya)</span></div>
    <h1>Welcome to Kaipedia</h1>
    <p class="lede">The free encyclopedia of <a class="int" href="#kaiya" style="font-weight:700">Kaiya</a>, the Land of Fun, that anyone can read. Hover or tap any red Kaihana word to see what it means. Read ${NEED} articles to earn a passport stamp.</p>
    <div class="p-hgrid">
      <div class="p-box"><h3>Featured article</h3><div class="in"><div class="p-featflag">${KAI.flagSVG(130)}</div><p><b>Kaiya</b> (${glossSpan('Kaiya')}) is a small, cheerful and completely made-up country that lives on the internet. It has its own language, alphabet, coding language, board game, calendar and passport, and no homework at all.</p><p><a class="int" href="#kaiya" style="font-weight:700">Read more…</a></p></div></div>
      <div class="p-box sun"><h3>Today in Kaiya</h3><div class="in"><p>It is <b>${esc(kdName(today))}, ${esc(KAI.yearText(today.year))}</b>, a ${glossSpan(today.weekday.kai)} (${esc(today.weekday.en)}).${today.holiday ? ` It is <b>${esc(today.holiday.name)}</b>!` : ''}</p><p>Word of the day: ${glossSpan(wod.kai)} — ${esc(wod.en)}.</p><p><a class="int" href="#kai-calendar" style="font-weight:700">About the calendar…</a></p></div></div>
      <div class="p-box red"><h3>Did you know…</h3><div class="in"><ul>${dyk.map(([id, t]) => `<li>… that <a class="int" href="#${id}">${esc(t)}</a>?</li>`).join('')}</ul></div></div>
      <div class="p-box"><h3>Explore</h3><div class="in"><p>${cats.map(c => `<b>${esc(c)}:</b> ${A.filter(a => a.cat === c).map(a => `<a class="int" href="#${a.id}">${esc(a.title)}</a>`).join(', ')}`).join('<br>')}</p></div></div>
    </div>
    <h2 style="font-size:26px;margin:22px 0 4px">All articles</h2>${allList()}
  </div>`;
  $('tocBox').innerHTML = `<h4>Categories</h4><div class="toc">${cats.map(c => `<a href="#all">${esc(c)}</a>`).join('')}</div>`;
  $('mDrawer').innerHTML = `<nav class="p-menu"><h4>All articles</h4><div class="toc">${A.map(a => `<a href="#${a.id}">${esc(a.title)}</a>`).join('')}</div></nav>`;
  document.title = 'Kaipedia · KAIISM';
}
function showAll() {
  view.innerHTML = `<div class="p-tabs"><span class="k-chip on">Special page</span></div><h1 class="p-title">All articles</h1><p class="p-from">${A.length} articles. Ticked ones are the ones you have read.</p>${cats.map(c => `<h2 style="font-size:22px;margin:18px 0 6px">${esc(c)}</h2><div class="p-all">${A.filter(a => a.cat === c).map(a => `<a href="#${a.id}" class="${read.includes(a.id) ? 'read' : ''}">${esc(a.title)}</a>`).join('')}</div>`).join('')}`;
  $('tocBox').innerHTML = `<h4>Categories</h4><div class="toc">${cats.map(c => `<a href="#all">${esc(c)}</a>`).join('')}</div>`;
  $('mDrawer').innerHTML = '';
  document.title = 'All articles · Kaipedia';
}
function showMissing(id) {
  view.innerHTML = `<h1 class="p-title">No such article</h1><p class="p-from">Kaipedia does not have an article called “${esc(id)}” yet.</p><p>Try the search box, or pick from the list:</p>${allList()}`;
}
function route() {
  hideTip();
  const id = decodeURIComponent(location.hash.slice(1));
  $('mDrawer').hidden = true; $('mContents').setAttribute('aria-expanded', 'false');
  if (!id || id === 'main') showMain();
  else if (id === 'all') showAll();
  else if (byId.has(id)) showArticle(byId.get(id));
  else showMissing(id);
  view.dataset.view = id || 'main';
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* in-article contents links scroll without changing the route */
document.addEventListener('click', e => {
  const s = e.target.closest('a[data-sec],a[data-top]');
  if (!s) return;
  e.preventDefault();
  if (s.dataset.top !== undefined) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const t = document.getElementById(s.dataset.sec);
  if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('mDrawer').hidden = true; $('mContents').setAttribute('aria-expanded', 'false');
});
$('mContents').onclick = () => { const h = !$('mDrawer').hidden; $('mDrawer').hidden = h; $('mContents').setAttribute('aria-expanded', String(!h)); };

/* random article */
function randomArticle() {
  const cur = decodeURIComponent(location.hash.slice(1));
  const unread = A.filter(a => a.id !== cur && !read.includes(a.id));
  const pool = unread.length ? unread : A.filter(a => a.id !== cur);
  location.hash = pool[Math.floor(Math.random() * pool.length)].id;
}
document.querySelectorAll('[data-random]').forEach(b => b.addEventListener('click', randomArticle));

/* search */
const plain = a => a.body.replace(/\[\[[^\]|]+\|([^\]]+)\]\]/g, '$1').replace(/\[\[([^\]]+)\]\]/g, '$1').replace(/\[page:[^|]+\|([^\]]+)\]/g, '$1').replace(/[{}]/g, '').replace(/@@[^@]+@@/g, ' ').replace(/^## /gm, '').replace(/\s+/g, ' ');
const INDEX = A.map(a => ({ a, title: a.title.toLowerCase(), kai: (a.kai || '').toLowerCase(), text: plain(a) }));
function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  const words = q.split(/\s+/);
  const res = [];
  for (const it of INDEX) {
    const tl = it.text.toLowerCase();
    let score = 0;
    if (it.title === q) score += 100;
    if (it.title.includes(q)) score += 40;
    if (it.kai && it.kai.includes(q)) score += 30;
    let all = true;
    for (const w of words) { const n = tl.split(w).length - 1; if (!n && !it.title.includes(w)) all = false; score += Math.min(n, 6) * 2; }
    if (!all) continue;
    if (score > 0) {
      const i = tl.indexOf(words[0]);
      const snip = i >= 0 ? (i > 30 ? '…' : '') + it.text.slice(Math.max(0, i - 30), i + 70) + '…' : it.text.slice(0, 90) + '…';
      res.push({ a: it.a, score, snip });
    }
  }
  return res.sort((x, y) => y.score - x.score).slice(0, 8);
}
let hits = [], sel = 0;
function renderResults() {
  const q = $('q').value.trim();
  if (!q) { $('results').hidden = true; return; }
  hits = search(q); sel = 0;
  $('results').hidden = false;
  $('results').innerHTML = hits.length ? hits.map((h, i) => `<a href="#${h.a.id}" class="${i === sel ? 'on' : ''}"><b>${esc(h.a.title)}</b><small>${esc(h.snip)}</small></a>`).join('') : `<div class="none">No articles match “${esc(q)}”. Try “toast”, “monke” or “calendar”.</div>`;
}
$('q').addEventListener('input', renderResults);
$('q').addEventListener('focus', renderResults);
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!hits.length) return; sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; [...$('results').querySelectorAll('a')].forEach((x, i) => x.classList.toggle('on', i === sel)); }
  else if (e.key === 'Enter') { e.preventDefault(); if (hits[sel]) { location.hash = hits[sel].a.id; $('q').value = ''; $('results').hidden = true; $('q').blur(); } }
  else if (e.key === 'Escape') { $('results').hidden = true; }
});
$('results').addEventListener('click', () => { $('q').value = ''; $('results').hidden = true; });
document.addEventListener('click', e => { if (!e.target.closest('.p-search')) $('results').hidden = true; });

/* gloss tooltip (hover on desktop, tap on touch) */
const tip = $('tip');
let tipFor = null, shownAt = 0;
function showTip(el) {
  if (tipFor !== el || tip.hidden) shownAt = Date.now();
  tipFor = el;
  tip.innerHTML = `<b>${esc(el.dataset.w)}</b> — ${esc(el.dataset.g)}`;
  tip.hidden = false;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, W = document.documentElement.clientWidth;
  let x = r.left + r.width / 2 - tw / 2; x = Math.max(8, Math.min(W - tw - 8, x));
  let y = r.top - th - 8; if (y < 60) y = r.bottom + 8;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.hidden = true; tipFor = null; }
document.addEventListener('mouseover', e => { const k = e.target.closest('.kg[data-g]'); if (k) showTip(k); });
document.addEventListener('mouseout', e => { const k = e.target.closest('.kg[data-g]'); if (k && tipFor === k) hideTip(); });
document.addEventListener('focusin', e => { const k = e.target.closest('.kg[data-g]'); if (k) showTip(k); });
document.addEventListener('focusout', e => { if (e.target.closest('.kg[data-g]')) hideTip(); });
document.addEventListener('click', e => { const k = e.target.closest('.kg[data-g]'); if (k) { if (tipFor === k && !tip.hidden && Date.now() - shownAt > 450) hideTip(); else showTip(k); } });
window.addEventListener('scroll', () => { if (!tip.hidden && tipFor) showTip(tipFor); }, { passive: true });

window.__kaipedia = { articles: A, plain };
renderProgress();
route();
})();
</script>
</body>
</html>
