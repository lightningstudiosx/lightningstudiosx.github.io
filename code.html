<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaicode · KAIISM</title>
<meta name="description" content="Kaicode: a real programming language where every keyword is a Kaihana word. Editor, turtle drawing, docs, lessons and challenges.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kai.css">
<style>
:root{--ed-bg:#1e1a16;--ed-gut:#15120f;--ed-ink:#efe6d4;--lh:22px;--fs:15px}
.kc-hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:6px 40px;padding:12px 0 16px}
.kc-hero .k-kicker{grid-column:1/-1}
.kc-hero .k-title{font-size:clamp(46px,7vw,80px);margin-top:4px}
.kc-hero .k-lede{font-size:17.5px;margin:0 0 4px}
@media (max-width:900px){.kc-hero{grid-template-columns:minmax(0,1fr)}}
.kc-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.kc-words .k-chip{background:var(--card)}
.kc-words .k-chip b{font-family:var(--mono);color:var(--red-d)}
.kc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.kc-tab{cursor:pointer;border:2px solid var(--ink);border-radius:999px;background:var(--card);font:800 16px/1 var(--display);padding:11px 18px;min-height:44px;box-shadow:3px 3px 0 var(--ink)}
.kc-tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.kc-tab .kc-count{font:700 12px/1 var(--body);background:var(--sun);color:var(--ink);border-radius:999px;padding:3px 7px;margin-left:6px;vertical-align:2px}
/* code view */
.kc-code{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
.kc-side{display:grid;gap:16px;min-width:0}
.kc-work{min-width:0}
.kc-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.kc-bar .k-btn{min-height:42px}
.kc-bar select.k-input{min-height:42px;padding:8px 10px;max-width:100%;font:700 14px/1.1 var(--display);cursor:pointer}
.kc-bar .kc-grow{flex:1 1 auto}
.kc-kbd{font:700 11px/1 var(--mono);opacity:.8;border:1px solid currentColor;border-radius:5px;padding:2px 4px}
/* editor */
.kc-ed{display:grid;grid-template-columns:auto minmax(0,1fr);height:360px;background:var(--ed-bg);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;font:400 var(--fs)/var(--lh) var(--mono)}
.kc-ed:focus-within{box-shadow:0 0 0 3px var(--sun),5px 5px 0 var(--ink)}
.kc-gutter{background:var(--ed-gut);color:#7d7262;text-align:right;padding:12px 8px 12px 10px;overflow:hidden;user-select:none;min-width:42px;font-size:13px}
.kc-gutter div div{height:var(--lh)}
.kc-gutter .err{color:#fff;background:var(--red);border-radius:5px;padding:0 4px;margin-right:-4px}
.kc-area{position:relative;overflow:hidden;min-width:0}
.kc-layer{position:absolute;left:0;top:0;min-width:100%;will-change:transform}
.kc-hl{margin:0;padding:12px 14px;font:inherit;white-space:pre;tab-size:2;color:var(--ed-ink);pointer-events:none}
.kc-band{position:absolute;left:0;right:0;height:var(--lh);background:rgba(229,67,45,.28);border-left:4px solid var(--red);pointer-events:none}
textarea.kc-input{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:12px 14px;font:inherit;white-space:pre;tab-size:2;resize:none;border:0;outline:none;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--sun);overflow:auto;overflow-wrap:normal}
textarea.kc-input::selection{background:rgba(242,182,50,.38)}
.t-k{color:#ff8a73;font-weight:700}.t-t{color:#f2b632;font-weight:700}.t-b{color:#cfa9ff}.t-f{color:#ffd88a}.t-s{color:#74d8ca}.t-n{color:#93b6ff}.t-c{color:#94897a;font-style:italic}.t-o{color:#d9ccb3}
/* output row */
.kc-io{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:stretch}
.kc-pane{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.kc-pane-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:2px solid var(--ink);background:var(--paper2);font:800 15px/1.1 var(--display);min-height:44px}
.kc-pane-h .k-muted{font:400 13px/1.2 var(--body)}
.kc-pane-h .kc-sp{margin-left:auto}
.kc-speed{border:2px solid var(--ink);border-radius:999px;background:var(--card);font:700 13px/1 var(--display);padding:6px 10px;min-height:40px;cursor:pointer}
.kc-bar #kc-ex{flex:0 1 250px;min-width:0}
.kc-out{flex:1 1 0;min-height:260px;overflow:auto;margin:0;padding:12px 14px;font:400 14px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.kc-out .ln{min-height:1.5em}
.kc-out .sys{color:var(--muted);font-style:italic}
.kc-out .hd{color:var(--plum);font-weight:700;margin-top:6px}
.kc-err{margin:6px 0;border:2px solid var(--bad);background:#fdebe6;border-radius:10px;padding:9px 11px;font:400 14px/1.45 var(--body);color:var(--ink);white-space:normal}
.kc-err b{font-family:var(--display);color:var(--bad)}
.kc-err code,.kc-code-inline{font:700 13px/1 var(--mono);background:rgba(25,21,18,.08);padding:2px 5px;border-radius:5px}
.kc-err button{margin-top:6px;min-height:40px}
.kc-status{font:700 12px/1 var(--body);border:2px solid var(--ink);border-radius:999px;padding:4px 9px;background:var(--card);white-space:nowrap}
.kc-status.run{background:var(--sun)}.kc-status.ok{background:#d8f0df}.kc-status.bad{background:#fbd5cc}
.kc-cvwrap{position:relative;aspect-ratio:1/1;background:#fffdf7}
.kc-cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* side cards */
.kc-cheat h3,.kc-mission h3{font-size:22px}
.kc-cheat table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.kc-cheat td{padding:5px 4px;border-top:1px dashed var(--line);vertical-align:top}
.kc-cheat td:first-child{font:700 13px/1.4 var(--mono);color:var(--red-d);white-space:nowrap}
.kc-cheat .k-muted{font-size:13px}
.kc-mission .k-kicker{display:block;margin-bottom:6px}
.kc-mission .kc-body{font-size:15.5px}
.kc-mission .kc-body p{margin:8px 0}
.kc-task{margin:12px 0;padding:11px 12px;border:2px dashed var(--ink);border-radius:12px;background:#fff6dc;font-size:15.5px}
.kc-task b{font-family:var(--display)}
.kc-gets{font:400 13px/1.45 var(--mono);color:var(--ink2);margin-top:6px;overflow-wrap:anywhere}
.kc-mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.kc-mbtns .k-btn{min-height:42px}
.kc-results{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-size:14px}
.kc-results li{border:2px solid var(--ink);border-radius:10px;padding:7px 9px;background:#fff;overflow-wrap:anywhere}
.kc-results li.pass{background:#e2f4e7}.kc-results li.fail{background:#fde4de}
.kc-results .exp{font:400 12.5px/1.45 var(--mono);color:var(--ink2);white-space:pre-wrap;margin-top:3px}
.kc-done{margin-top:12px;padding:12px;border:3px double var(--good);border-radius:12px;background:#eaf7ee;font:800 17px/1.25 var(--display);color:var(--good)}
.kc-hint{margin-top:8px;font-size:14.5px;background:#f1eafa;border-radius:10px;padding:9px 11px;border:2px solid var(--plum)}
.kc-snip{margin:8px 0;padding:10px 12px;background:var(--ed-bg);color:var(--ed-ink);border-radius:10px;border:2px solid var(--ink);font:400 13.5px/1.55 var(--mono);white-space:pre;overflow-x:auto;tab-size:2}
/* lists */
.kc-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.kc-cardbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-height:150px;transition:transform .08s,box-shadow .08s}
.kc-cardbtn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.kc-cardbtn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.kc-cardbtn .num{font:800 12px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.kc-cardbtn h3{font-size:23px}
.kc-cardbtn p{margin:0;color:var(--ink2);font-size:15px}
.kc-cardbtn .foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:6px}
.kc-cardbtn.done{background:#eaf7ee}
.kc-cardbtn.done .num::after{content:"  ✓ done";color:var(--good)}
.kc-cardbtn.solved{background:#eaf7ee}
.kc-stars{color:var(--sun-d);font-size:15px;letter-spacing:1px}
.kc-progress{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px}
.kc-meter{flex:1 1 220px;height:18px;border:2px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.kc-meter i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s}
.kc-sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:6px 0 14px}
.kc-sec-h h2{font-size:clamp(30px,4.5vw,44px)}
/* docs */
.kc-docs{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px;align-items:start}
.kc-toc{position:sticky;top:70px;display:grid;gap:4px}
.kc-toc a{text-decoration:none;color:var(--ink);font:700 15px/1.2 var(--display);padding:8px 10px;border-radius:10px}
.kc-toc a:hover{background:var(--paper2)}
.kc-docs section{margin-bottom:30px}
.kc-docs h2{font-size:34px;margin-bottom:10px}
.kc-docs p{max-width:70ch}
.kc-kw{display:grid;gap:14px}
.kc-kwrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.kc-kwrow .k-card{padding:14px}
.kc-kwname{font:800 20px/1.1 var(--mono);color:var(--red-d)}
.kc-kwfrom{font-size:14px;color:var(--ink2);margin-top:6px}
.kc-kwfrom .k-kai{font-size:15px}
.kc-kwwhat{margin-top:6px;font-size:15.5px}
.kc-exout{font:400 13px/1.45 var(--mono);color:var(--ink2);background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.kc-exout::before{content:"output";display:block;font:800 10px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kc-table{width:100%;border-collapse:collapse;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;font-size:15px}
.kc-table th,.kc-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.kc-table th{background:var(--paper2);font:800 13px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase}
.kc-table td code{font:700 14px/1.3 var(--mono);color:var(--red-d);white-space:nowrap}
.kc-tablewrap{overflow-x:auto;border-radius:var(--r)}
.kc-swatch{display:inline-block;width:16px;height:16px;border:2px solid var(--ink);border-radius:50%;vertical-align:-3px;margin-right:6px}
.kc-colors{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.kc-ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.kc-ctrl .k-btn{min-height:40px}
/* share fallback */
.kc-sharebox{margin-top:12px}
.kc-sharebox textarea{width:100%;height:140px;font:400 13px/1.45 var(--mono)}
@media (max-width:1000px){
  .kc-code{grid-template-columns:minmax(0,1fr)}
  .kc-docs{grid-template-columns:minmax(0,1fr)}
  .kc-toc{position:static;display:flex;flex-wrap:wrap;gap:6px}
  .kc-toc a{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px}
}
@media (max-width:720px){
  .kc-io{grid-template-columns:minmax(0,1fr)}
  .kc-out{flex:none;min-height:180px;max-height:46vh}
  .kc-kwrow{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  :root{--lh:24px;--fs:16px}
  .kc-ed{height:320px}
  .kc-hero .k-lede{font-size:16.5px}
  .kc-tab{font-size:15px;padding:10px 14px}
  .kc-bar .k-btn{padding:10px 14px}
  .kc-hide-sm{display:none}
  .kc-bar .kc-grow{display:none}
  .kc-bar #kc-ex{flex:1 1 100%}
  .kc-cheat details summary{cursor:pointer}
}
</style>
</head>
<body>
<header id="kai-nav"></header>
<main class="k-page">
  <div class="kc-hero">
    <div class="k-kicker" id="kc-kicker">KAIISM · Kaicode</div>
    <h1 class="k-title">Kaicode</h1>
    <div>
      <p class="k-lede" id="kc-lede"></p>
      <div class="kc-words" id="kc-words"></div>
    </div>
  </div>

  <div class="kc-tabs" role="tablist" aria-label="Kaicode sections">
    <button class="kc-tab" role="tab" id="tab-code" data-view="code" aria-controls="view-code">Code</button>
    <button class="kc-tab" role="tab" id="tab-lessons" data-view="lessons" aria-controls="view-lessons">Lessons <span class="kc-count" id="kc-lcount"></span></button>
    <button class="kc-tab" role="tab" id="tab-challenges" data-view="challenges" aria-controls="view-challenges">Challenges <span class="kc-count" id="kc-ccount"></span></button>
    <button class="kc-tab" role="tab" id="tab-docs" data-view="docs" aria-controls="view-docs">Docs</button>
  </div>

  <!-- CODE -->
  <section id="view-code" role="tabpanel" aria-labelledby="tab-code">
    <div class="kc-code">
      <aside class="kc-side" id="kc-side">
        <div class="k-card kc-mission" id="kc-mission" hidden></div>
        <div class="k-card kc-cheat" id="kc-cheat"></div>
      </aside>
      <div class="kc-work">
        <div class="kc-bar">
          <button class="k-btn red" id="kc-run" title="Run (Ctrl+Enter)">▶ Run <span class="kc-kbd kc-hide-sm">Ctrl ↵</span></button>
          <button class="k-btn ink" id="kc-stop" disabled>■ Stop</button>
          <button class="k-btn" id="kc-clear">Clear</button>
          <button class="k-btn" id="kc-share">Share</button>
          <span class="kc-grow"></span>
          <select class="k-input" id="kc-ex" aria-label="Load an example program"></select>
        </div>
        <div class="kc-ed" id="kc-ed">
          <div class="kc-gutter" aria-hidden="true"><div id="kc-lines"></div></div>
          <div class="kc-area">
            <div class="kc-layer" id="kc-layer"><div class="kc-band" id="kc-band" hidden></div><pre class="kc-hl" aria-hidden="true"><code id="kc-hl"></code></pre></div>
            <textarea class="kc-input" id="kc-input" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Kaicode editor. Press Control Enter to run, Escape then Tab to leave."></textarea>
          </div>
        </div>
        <div class="kc-sharebox" id="kc-sharebox" hidden>
          <div class="k-card"><b>Copy your code:</b> select it all and copy.
            <textarea class="k-input" id="kc-sharetext" readonly aria-label="Your code as text"></textarea>
            <div class="kc-ctrl"><button class="k-btn sm" id="kc-shareclose">Done</button></div>
          </div>
        </div>
        <div class="kc-io">
          <div class="kc-pane">
            <div class="kc-pane-h">Console <span class="k-muted">hana</span><span class="kc-sp kc-status" id="kc-status">ready</span></div>
            <div class="kc-out" id="kc-out" role="log" aria-live="polite" tabindex="0"></div>
          </div>
          <div class="kc-pane">
            <div class="kc-pane-h">Turtle <span class="k-muted" id="kc-tpos"></span>
              <select class="kc-sp kc-speed" id="kc-speed" aria-label="Turtle speed">
                <option value="slow">slow</option>
                <option value="fast" selected>fast</option>
                <option value="instant">instant</option>
              </select></div>
            <div class="kc-cvwrap" id="kc-cvwrap"><canvas id="kc-cv" aria-label="Turtle drawing"></canvas><canvas id="kc-cvtop" aria-hidden="true"></canvas></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- LESSONS -->
  <section id="view-lessons" role="tabpanel" aria-labelledby="tab-lessons" hidden>
    <div class="kc-sec-h"><h2>Lessons</h2><span class="k-muted" id="kc-lsub"></span></div>
    <div class="kc-cards" id="kc-lessons"></div>
  </section>

  <!-- CHALLENGES -->
  <section id="view-challenges" role="tabpanel" aria-labelledby="tab-challenges" hidden>
    <div class="kc-sec-h"><h2>Challenges</h2><span class="k-muted">Each one is checked by hidden tests.</span></div>
    <div class="kc-progress"><b id="kc-ctext"></b><div class="kc-meter" aria-hidden="true"><i id="kc-cbar"></i></div></div>
    <div class="kc-cards" id="kc-chals"></div>
  </section>

  <!-- DOCS -->
  <section id="view-docs" role="tabpanel" aria-labelledby="tab-docs" hidden>
    <div class="kc-docs">
      <nav class="kc-toc" aria-label="Docs contents">
        <a href="#d-basics">Basics</a><a href="#d-keywords">Keywords</a><a href="#d-values">Values</a><a href="#d-ops">Operators</a><a href="#d-builtins">Built-ins</a><a href="#d-turtle">Turtle</a><a href="#d-errors">Errors</a>
      </nav>
      <div id="kc-docbody"></div>
    </div>
  </section>
</main>

<script src="kai-core.js"></script>
<script>
/*KAICODE-ENGINE-START*/
/* Kaicode engine: tokenizer -> parser (AST) -> tree-walking interpreter.
   The interpreter is written with generators so a page can run it in small chunks
   (it yields every ~12ms and on turtle moves), which keeps the page from ever freezing. */
const Kaicode = (function () {
'use strict';
const KEYWORDS = ['sa','hana','wen','ten','ola','tome','kumi','maku','pomo','ana','lo','teka','teyo','ka','nai','un','nu','naiko','ira','rota','sirinu','pinu','huru','sin'];
const KW = new Set(KEYWORDS);
const TURTLE = new Set(['ira','rota','sirinu','pinu','huru','sin']);
const STMT_WORDS = ['hana','wen','kumi','maku','pomo','teka','teyo','tome','ola','ira','rota','sirinu','pinu','huru','sin'];
const STEP_LIMIT = 2000000, MAX_DEPTH = 520, MAX_SEGS = 60000, MAX_OUT = 20000, MAX_LEN = 1000000;
// English words kids often try, and the Kaicode word to use instead.
const ENGLISH = { print:'hana', say:'hana', echo:'hana', puts:'hana', if:'wen', then:'ten', else:'ola', elif:'ola wen', elseif:'ola wen', end:'tome', endif:'tome', stop:'tome', while:'kumi wen', loop:'kumi wen', for:'pomo', foreach:'pomo', in:'ana', repeat:'maku', times:'maku', def:'teka', function:'teka', func:'teka', return:'teyo', and:'ka', or:'ola', not:'nai', true:'un', false:'nu', yes:'un', no:'nu', null:'naiko', none:'naiko', nil:'naiko', nothing:'naiko', forward:'ira', fd:'ira', go:'ira', right:'rota', left:'rota -', turn:'rota', color:'sirinu', colour:'sirinu', pen:'pinu', penup:'pinu nu', pendown:'pinu un', home:'sin', width:'huru', len:'namo', length:'namo', count:'namo', random:'kaiwen', push:'kema', append:'kema', add:'kema', pop:'kapa', remove:'kapa', round:'malu', floor:'teru', str:'woto', int:'namu', number:'namu', wait:'mata', sleep:'mata' };

class KaiError extends Error { constructor(line, msg) { super(msg); this.line = line; this.kai = true; } }
const fail = (line, msg) => { throw new KaiError(line, msg); };
const TICK = { tick: true };
class Ret { constructor(v) { this.v = v; } }
const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

/* ---------- values ---------- */
function fmtNum(n) {
  if (Object.is(n, -0)) return '0';
  if (Number.isInteger(n)) return String(n);
  if (!isFinite(n)) return String(n);
  return String(+n.toPrecision(12));
}
function show(v, nested, seen) {
  if (v === null || v === undefined) return 'naiko';
  if (v === true) return 'un';
  if (v === false) return 'nu';
  if (typeof v === 'number') return fmtNum(v);
  if (typeof v === 'string') return nested ? JSON.stringify(v) : v;
  if (Array.isArray(v)) {
    seen = seen || new Set();
    if (seen.has(v)) return '[...]';
    seen.add(v);
    const s = '[' + v.map(x => show(x, true, seen)).join(', ') + ']';
    seen.delete(v);
    return s;
  }
  if (v.fn || v.builtin) return 'teka ' + v.name;
  return String(v);
}
function aName(v) {
  if (v === null || v === undefined) return 'naiko (nothing)';
  if (v === true) return 'un (yes)';
  if (v === false) return 'nu (no)';
  if (typeof v === 'number') return 'the number ' + fmtNum(v);
  if (typeof v === 'string') return v.length > 24 ? 'some text' : (v === '' ? 'empty text ""' : 'the text ' + JSON.stringify(v));
  if (Array.isArray(v)) return v.length ? 'a list' : 'an empty list';
  if (v.fn || v.builtin) return 'the teka ' + v.name;

function mergeSegs(segs) {
  const out = [];
  const dir = s => Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
  const near = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by) < 1;

    if (Math.hypot(s.x2 - s.x1, s.y2 - s.y1) < 0.5) continue;
    const last = out[out.length - 1];
    if (last && near(last.x2, last.y2, s.x1, s.y1) && same(last, s)) { last.x2 = s.x2; last.y2 = s.y2; }
    else out.push({ x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2 });
  }
  if (out.length > 1) {
    const a = out[out.length - 1], b = out[0];
    if (near(a.x2, a.y2, b.x1, b.y1) && same(a, b)) { b.x1 = a.x1; b.y1 = a.y1; out.pop(); }
  }

  if (m.length !== k) return `I counted ${m.length} straight side${m.length === 1 ? '' : 's'}, but this shape needs exactly ${k}.`;
  for (let i = 0; i < k - 1; i++) if (!near(m[i].x2, m[i].y2, m[i + 1].x1, m[i + 1].y1)) return 'The sides are not joined up. Keep the pen down the whole time.';
  if (!near(m[k - 1].x2, m[k - 1].y2, m[0].x1, m[0].y1)) return "The shape doesn't close: the last side should end where the first one started.";
  const len = s => Math.hypot(s.x2 - s.x1, s.y2 - s.y1);
  const L0 = len(m[0]);
  if (L0 < minLen) return `Make it bigger: each side should be at least ${minLen} steps long.`;
  for (const s of m) if (Math.abs(len(s) - L0) > Math.max(1, L0 * 0.01)) return 'All the sides should be the same length.';

  for (let i = 0; i < k; i++) {
    const a = m[i], b = m[(i + 1) % k];

/* ---------- editor ---------- */
const ta = $('#kc-input'), hl = $('#kc-hl'), layer = $('#kc-layer'), lines = $('#kc-lines'), band = $('#kc-band');

let tabEscape = false, saveT = 0;
ta.addEventListener('input', () => {

ta.addEventListener('scroll', syncScroll);
ta.addEventListener('keydown', e => {

  if (e.key === 'Escape') { tabEscape = true; return; }

    const ls = v.lastIndexOf('\n', s - 1) + 1;

    let ind = (/^ */.exec(cur) || [''])[0];
    const code = cur.replace(/~~.*$/, '').trim();

});
function codeKey() { return S.mission ? (S.mission.type === 'lesson' ? 'l:' : 'c:') + S.mission.item.id : 'play'; }
function saveCode() { const all = store.get('drafts', {}) || {}; all[codeKey()] = ta.value; store.set('drafts', all); }

/* ---------- console ---------- */
const outEl = $('#kc-out'), statusEl = $('#kc-status');
const MAX_SHOW = 2000;
let shown = 0, pending = [], flushQ = false;
function clearOut() { outEl.innerHTML = ''; shown = 0; pending = []; }
function outLine(text, cls) {
  pending.push([text, cls]);
  if (!flushQ) { flushQ = true; requestAnimationFrame(flushOut); }
}
function flushOut() {
  flushQ = false;

  const frag = document.createDocumentFragment();
  for (const [text, cls] of pending) {
    if (shown >= MAX_SHOW) { if (shown === MAX_SHOW) { const d = document.createElement('div'); d.className = 'ln sys'; d.textContent = `(only the first ${MAX_SHOW} lines are shown)`; frag.appendChild(d); shown++; } continue; }
    const d = document.createElement('div'); d.className = 'ln' + (cls ? ' ' + cls : ''); d.textContent = text; frag.appendChild(d); shown++;
  }
  pending = [];

}
function outError(err) {

  d.setAttribute('role', 'alert');
  const where = err.inTest ? "In the checker's test code" : `Line ${err.line}`;
  d.innerHTML = `<b>${esc(SORRY)}!</b> ${where}: ${fmtMsg(err.message)}` + (err.inTest ? '' : `<br><button class="k-btn sm" type="button">Go to line ${err.line}</button>`);
  const b = d.querySelector('button');

function gotoLine(n) {
  const ls = ta.value.split('\n');
  let pos = 0; for (let i = 0; i < n - 1 && i < ls.length; i++) pos += ls[i].length + 1;
  ta.focus(); ta.setSelectionRange(pos, pos + (ls[n - 1] || '').length);

}
function setStatus(text, cls, state) {
  statusEl.textContent = text; statusEl.className = 'kc-sp kc-status' + (cls ? ' ' + cls : '');
  document.body.dataset.run = state || '';
}

/* ---------- turtle canvas ---------- */
const cv = $('#kc-cv'), cvTop = $('#kc-cvtop'), ctx = cv.getContext('2d'), tctx = cvTop.getContext('2d');
let scale = 1, sized = 0;
function sizeCanvas() {
  const r = $('#kc-cvwrap').getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const px = Math.max(100, Math.round(r.width * dpr));
  if (px === sized) return;
  sized = px; cv.width = cv.height = cvTop.width = cvTop.height = px;
  scale = px / 400;
  redrawAll();
}
function paintGrid() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#fffdf7'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#e4d9c1';
  for (let x = -200; x <= 200; x += 50) for (let y = -200; y <= 200; y += 50) { ctx.beginPath(); ctx.arc((x + 200) * scale, (200 - y) * scale, 1.6 * scale, 0, 7); ctx.fill(); }
  ctx.strokeStyle = 'rgba(133,122,107,.25)'; ctx.lineWidth = Math.max(1, scale);
  ctx.beginPath(); ctx.moveTo(200 * scale, 0); ctx.lineTo(200 * scale, 400 * scale); ctx.moveTo(0, 200 * scale); ctx.lineTo(400 * scale, 200 * scale); ctx.stroke();
}
function drawSeg(s) {
  ctx.strokeStyle = s.color; ctx.lineWidth = s.width * scale; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo((s.x1 + 200) * scale, (200 - s.y1) * scale); ctx.lineTo((s.x2 + 200) * scale, (200 - s.y2) * scale); ctx.stroke();
}
let spriteQ = false;
function drawSprite() {
  spriteQ = false;
  const T = S.T;
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, cvTop.width, cvTop.height);
  tctx.translate((T.x + 200) * scale, (200 - T.y) * scale); tctx.rotate(T.h * Math.PI / 180);
  const z = scale;
  tctx.beginPath(); tctx.moveTo(0, -13 * z); tctx.lineTo(9 * z, 9 * z); tctx.lineTo(0, 4 * z); tctx.lineTo(-9 * z, 9 * z); tctx.closePath();
  tctx.fillStyle = T.color === '#ffffff' ? '#f2b632' : T.color; tctx.fill();
  tctx.lineWidth = 2.2 * z; tctx.strokeStyle = '#191512'; tctx.lineJoin = 'round'; tctx.stroke();
  $('#kc-tpos').textContent = `x ${Math.round(T.x)} · y ${Math.round(T.y)} · ${Math.round(T.h)}°`;
}
function queueSprite() { if (!spriteQ) { spriteQ = true; requestAnimationFrame(drawSprite); } }
function redrawAll() { paintGrid(); for (const s of S.segs) drawSeg(s); drawSprite(); }
function resetTurtle() { S.segs = []; S.T = { x: 0, y: 0, h: 0, down: true, color: '#191512', width: 3 }; redrawAll(); }
function onTurtle(seg, T) {

if (window.ResizeObserver) new ResizeObserver(sizeCanvas).observe($('#kc-cvwrap')); else window.addEventListener('resize', sizeCanvas);

/* ---------- execution ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SPEED = { slow: [1, 60], fast: [3, 16], instant: [0, 0] };
// Runs a program in chunks so the page never freezes. Resolves to a result object.
async function execute(src, o = {}) {
  const res = { out: [], segs: [], error: null, stopped: false, globals: null, afterOut: null, steps: 0 };
  const [every, delay] = o.visible ? SPEED[$('#kc-speed').value] || SPEED.fast : [0, 0];
  let st;
  try {
    st = Kaicode.start(src, { vars: o.vars, after: o.after, async: true, limit: o.limit, turtleEvery: every, turtleDelay: delay,
      onOut: o.visible ? t => outLine(t) : null, onTurtle: o.visible ? onTurtle : null });
  } catch (e) { res.error = Kaicode.normalizeError(e); return res; }
  const { rt, gen } = st;
  const tok = S.token = { stopped: false };
  rt.lastYield = performance.now();
  for (;;) {
    if (tok.stopped) { try { gen.return(); } catch (e) { /* ignore */ } res.stopped = true; break; }
    let r;
    try { r = gen.next(); } catch (e) { res.error = Kaicode.normalizeError(e, rt); break; }
    if (r.done) break;
    const v = r.value;
    await sleep(v && v.wait ? v.wait : 0);
    rt.lastYield = performance.now();
  }
  res.out = rt.out; res.segs = rt.segs; res.steps = rt.steps; res.globals = rt.genv.v; res.T = rt.T;
  res.afterOut = rt.afterStart == null ? null : rt.out.slice(rt.afterStart);
  return res;
}
function setRunning(on) {

  document.querySelectorAll('[data-check]').forEach(b => { b.disabled = on; });
}
function stop() { if (S.token) S.token.stopped = true; }
function finishStamps(res, drew) {

    if (drew) setTimeout(() => KAI.passport.give('code-draw'), 900);
  }
}
// sample input for the mission (first test) when the kid presses Run
function missionVars() {
  const m = S.mission;

  return visibleVars(m.item.vars[0]);
}
const visibleVars = t => { const o = {}; for (const k in t) if (k[0] !== '_') o[k] = t[k]; return o; };
async function runVisible() {

  setRunning(true); setStatus('running…', 'run', 'running');
  const vars = missionVars();
  if (Object.keys(vars).length) outLine('given: ' + Object.entries(vars).map(([k, v]) => `${k} = ${Kaicode.show(Kaicode.fromJS(v), true)}`).join(', '), 'sys');
  const t0 = performance.now();
  showOutput();
  const res = await execute(src, { visible: true, vars });
  flushOut();
  if (res.error) { outError(res.error); setStatus('error', 'bad', 'error'); }
  else if (res.stopped) { outLine(`${W('stop')}! (stopped)`, 'sys'); flushOut(); setStatus('stopped', 'bad', 'stopped'); }
  else {
    if (!res.out.length && !res.segs.length) outLine('(the program finished without saying anything)', 'sys');
    else if (res.segs.length) outLine(`(the turtle drew ${res.segs.length} line${res.segs.length === 1 ? '' : 's'})`, 'sys');
    flushOut();
    setStatus(`done · ${res.steps.toLocaleString('en-US')} steps · ${((performance.now() - t0) / 1000).toFixed(2)}s`, 'ok', 'done');
  }
  S.T = Object.assign({}, res.T || S.T); queueSprite();

}
// if the console is below the screen, scroll so the kid can see what happens
function showOutput() {

}

function testLabel(t) {

function expHtml(r) {
  const e = r.expect.join('\n') || '(nothing)', g = r.got.join('\n') || '(nothing)';
  if (r.expect.length <= 1 && r.got.length <= 1) return `<div class="exp">expected: ${esc(e)} · you said: ${esc(g)}</div>`;
  return `<div class="exp">expected:\n${esc(e)}\n\nyou said:\n${esc(g)}</div>`;
}
const norm = lines => { const o = lines.map(l => l.replace(/\s+$/, '')); while (o.length && o[o.length - 1] === '') o.pop(); return o; };
async function checkMission() {
  const m = S.mission;
  if (!m || S.running) return;
  const it = m.item;
  saveCode();
  m.results = null; m.msg = null; m.done = false;
  let pass = false;
  if (it.vars) {
    // hidden tests: inject the inputs, compare what the program says
    clearOut(); resetTurtle(); markError(0);
    setRunning(true); setStatus('checking…', 'run', 'running'); renderMission();
    const results = [];
    let shownFail = false, firstErr = null, stopped = false;
    for (const t of it.vars) {
      const res = await execute(ta.value, { vars: visibleVars(t), after: t._after, limit: 2000000 });
      if (res.stopped) { stopped = true; break; }
      const got = norm(t._after ? (res.afterOut || []) : res.out);
      const expect = it.ref(t);
      const ok = !res.error && got.length === expect.length && got.every((l, i) => l === expect[i]);
      results.push({ pass: ok, label: testLabel(t), expect, got: res.error ? ['(error) ' + Kaicode.formatError(res.error)] : got });
      if (!ok && !shownFail) {
        shownFail = true;
        outLine(`Test ${results.length}: ${testLabel(t)}`, 'hd');
        for (const l of (t._after ? res.out : res.out).slice(0, 200)) outLine(l);
        if (res.error) firstErr = res.error;
      }
    }
    flushOut();
    setRunning(false);
    if (stopped) { setStatus('stopped', 'bad', 'stopped'); m.msg = 'Checking was stopped.'; renderMission(); return; }
    if (firstErr) outError(firstErr);
    m.results = results;
    pass = results.length && results.every(r => r.pass);
    if (pass) { outLine(`All ${results.length} tests passed!`, 'hd'); flushOut(); }
    setStatus(pass ? 'all tests pass' : 'not yet', pass ? 'ok' : 'bad', pass ? 'done' : 'error');
    if (pass) KAI.passport.give('code-run');
  } else {
    // drawing or free-form lesson: run it for real, then look at the result
    const res = await runVisible();
    if (!res || res.stopped) { m.msg = res ? 'Checking was stopped.' : null; renderMission(); return; }
    if (res.error) m.msg = 'Fix the error first, then check again.';
    else {
      const r = it.poly ? checkPolygon(res.segs, it.poly.k, it.poly.turn) : it.check(res);
      if (r === true) pass = true; else m.msg = r;
    }
    if (!res.error) setStatus(pass ? 'check passed' : 'not yet', pass ? 'ok' : 'bad', pass ? 'done' : 'error');
  }
  if (pass) {
    m.done = true;
    if (m.type === 'lesson') { S.lessonsDone[it.id] = Date.now(); store.set('lessons', S.lessonsDone); }
    else {
      S.solved[it.id] = Date.now(); store.set('solved', S.solved);
      if (CHALLENGES.every(c => S.solved[c.id])) setTimeout(() => KAI.passport.give('code-all'), 1200);
    }
    renderLists();
  }
  renderMission();
}

    <p>From first to last: things higher in the table happen first, just like in maths.</p>
    <div class="kc-tablewrap"><table class="kc-table"><thead><tr><th>Operator</th><th>What it does</th><th>Example → result</th></tr></thead><tbody>
    ${ops.map(o => `<tr><td><code>${esc(o[0])}</code></td><td>${esc(o[1])}</td><td><code>${esc(o[2])}</code> → <code>${esc(runOut('hana ' + o[2]))}</code></td></tr>`).join('')}
    </tbody></table></div>
    <p><code class="kc-code-inline">%</code> always gives a remainder of 0 or more for a positive divisor (<code class="kc-code-inline">-1 % 3</code> is ${esc(runOut('hana -1 % 3'))}). Text <code class="kc-code-inline">*</code> a whole number repeats it: <code class="kc-code-inline">"ha" * 3</code> → ${esc(runOut('hana "ha" * 3'))}. <code class="kc-code-inline">==</code> compares lists item by item.</p>
  </section>
  <section id="d-builtins"><h2>Built-in teka</h2>
    <p>Ready-made commands. Call them with brackets, like your own teka.</p>
    <div class="kc-kw">${BUILTIN_DOCS.map(b => `<div class="kc-kwrow"><div class="k-card"><div class="kc-kwname">${esc(b.sig)}</div><div class="kc-kwfrom">from ${wordFrom([BUILTIN_WORD[b.name]])}</div><div class="kc-kwwhat">${esc(b.what)}</div></div>
      <div>${snip(b.ex)}<div class="kc-exout">${esc(b.random ? runOut(b.ex) + '   (random — different each time)' : runOut(b.ex))}</div><div class="kc-ctrl">${tryBtn(b.ex)}</div></div></div>`).join('')}</div>
  </section>
  <section id="d-turtle"><h2>Turtle</h2>
    <p>The turtle is a pen on a 400 × 400 canvas. <b>(0, 0) is the middle</b>; x goes from -200 (left) to 200 (right), y from -200 (bottom) to 200 (top). It starts in the middle facing up, with the pen down, black, 3 thick.</p>
    <div class="kc-kw">${TURTLE_DOCS.map(kwRow).join('')}</div>
    <h3 style="margin-top:18px;font-size:22px">Colour words</h3>
    <div class="kc-colors">${colours}</div>
    ${snip('sirinu "' + CW('green') + '"\nhuru 6\nmaku 8 ten\n  ira 60\n  rota 45\ntome')}
    <div class="kc-ctrl">${tryBtn('sirinu "' + CW('green') + '"\nhuru 6\nmaku 8 ten\n  ira 60\n  rota 45\ntome')}</div>
  </section>
  <section id="d-errors"><h2>Friendly errors</h2>
    <p>When something goes wrong, Kaicode says <span class="k-kai">${esc(SORRY)}</span> (“${esc(M(SORRY))}”), tells you the line, and tries to guess what you meant. Click “Go to line” to jump there.</p>
    <div class="kc-kw">${errs.map(e => `<div class="kc-kwrow"><div>${snip(e)}</div><div class="kc-err" style="margin:8px 0">${fmtMsg(Kaicode.runSync(e, { limit: 20000 }).errorText || '').replace(/^(\w+!)/, '<b>$1</b>')}</div></div>`).join('')}</div>
  </section>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-try]');
  if (t) { e.preventDefault(); openPlayground(t.dataset.try); return; }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); showView(g.dataset.go); }
});

/* ---------- views ---------- */
const VIEWS = ['code', 'lessons', 'challenges', 'docs'];
let docsDone = false;
function showView(v) {
  if (!VIEWS.includes(v)) v = 'code';
  S.view = v;
  for (const x of VIEWS) {
    $('#view-' + x).hidden = x !== v;
    $('#tab-' + x).setAttribute('aria-selected', String(x === v));
    $('#tab-' + x).tabIndex = x === v ? 0 : -1;
  }
  if (v === 'docs' && !docsDone) { renderDocs(); docsDone = true; }
  if (v === 'code') { requestAnimationFrame(() => { sizeCanvas(); renderEditor(); }); }
  const h = v === 'code' ? '' : '#' + v;
  if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h);
  store.set('view', v);
}
document.querySelectorAll('.kc-tab').forEach(b => {
  b.addEventListener('click', () => { if (b.dataset.view === 'code' && !S.mission && S.view === 'code') return; showView(b.dataset.view); });
  b.addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const i = VIEWS.indexOf(b.dataset.view), j = (i + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1)) % VIEWS.length;
    showView(VIEWS[j]); $('#tab-' + VIEWS[j]).focus();
  });
});
window.addEventListener('hashchange', () => showView(location.hash.slice(1) || 'code'));
window.addEventListener('resize', () => { if (S.mission) $('#kc-cheat').hidden = window.innerWidth < 1000; });

/* ---------- hero ---------- */
function renderHero() {
  $('#kc-kicker').textContent = `KAIISM · ${W('code')} · Kaicode`;
  $('#kc-lede').innerHTML = `A real programming language where every keyword is a <span class="k-kai">Kaihana</span> word. Write it, run it, draw with the turtle, and solve challenges.`;
  const chips = [['hana', 'say'], ['wen', 'if'], ['ola', 'or / else'], ['pomo', 'walk'], ['teka', 'make'], ['tome', 'stop']];
  $('#kc-words').innerHTML = chips.map(([k, en]) => `<span class="k-chip"><b>${k}</b> ${esc(en)}</span>`).join('');
}

/* ---------- init ---------- */
KAI.mountNav('code');
renderHero();
renderCheat();
renderLists();
setCode(loadCode('play', EXAMPLES[0].code));
sizeCanvas(); resetTurtle();
const startView = location.hash.slice(1);
showView(VIEWS.includes(startView) ? startView : 'code');
// small hook used by the automated tests
window.KaicodeApp = { engine: Kaicode, examples: EXAMPLES, lessons: LESSONS, challenges: CHALLENGES, segs: () => S.segs.length, state: () => ({ view: S.view, mission: S.mission && S.mission.item.id, running: S.running }) };
})();
</script>
<script src="bdp.js" defer></script>
</body>
</html>
