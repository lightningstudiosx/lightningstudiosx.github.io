<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>INFINISTREAM · Kai.fun</title>
<meta name="description" content="LOOPY is an AI streamer who plays video games 24/7, forever. Everything on stream is a pure function of real time: come back later and he is further along, rewind to any moment, chat with whoever is watching right now.">
<meta name="theme-color" content="#0e0b1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b1f;--bg2:#120e28;--panel:#17122e;--panel2:#1f1940;--line:#2c2552;--text:#ece9ff;--dim:#9a93c9;--dim2:#6f68a0;--accent:#9b6bff;--live:#ff2e4d;--cyan:#66f6ff;--pink:#ff5fd2;--yel:#ffe066;--green:#5df06a;
--pix:"Press Start 2P",ui-monospace,monospace;--ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;--chatW:340px;--hdr:52px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:14px/1.4 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--cyan)}
.hidden{display:none!important}
.pix{font-family:var(--pix)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* header */
#hdr{height:var(--hdr);display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);position:relative;z-index:5}
#back{font-weight:800;font-size:13px;color:var(--text);text-decoration:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;white-space:nowrap}
#back:hover{background:var(--line)}
#logo{display:flex;align-items:center;gap:8px;font-family:var(--pix);font-size:14px;letter-spacing:1px;white-space:nowrap}
#logo canvas{width:28px;height:28px;image-rendering:pixelated}
#logo b{background:linear-gradient(90deg,var(--cyan),var(--pink),var(--yel));-webkit-background-clip:text;background-clip:text;color:transparent}
#hdr .sp{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.hbtn:hover{background:var(--line)}
#hereNow{color:var(--green)}
#hereNow i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
#hereNow.off{color:var(--dim)} #hereNow.off i{background:var(--dim);box-shadow:none}
/* layout */
#app{display:grid;grid-template-columns:minmax(0,1fr) var(--chatW);height:calc(100% - var(--hdr))}
#left{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#chatCol{border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
/* player */
#playerBox{background:#000;position:relative}
#player{position:relative;width:100%;max-width:calc((100vh - var(--hdr) - 150px) * 16 / 9);margin:0 auto;aspect-ratio:16/9;background:#05030c;user-select:none;-webkit-user-select:none}
#cv{width:100%;height:100%;display:block}
#cv.px{image-rendering:pixelated}
#ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:28px 10px 8px;background:linear-gradient(transparent,rgba(5,3,12,.92));opacity:0;transition:opacity .2s}
#player:hover #ctrl,#player.show #ctrl,#player:focus-within #ctrl{opacity:1}
.cb{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:17px;color:#fff}
.cb:hover{background:rgba(255,255,255,.12)}
.cb.on{color:var(--cyan)}
#liveBadge{font-weight:800;font-size:12px;padding:4px 9px;border-radius:5px;background:var(--live);color:#fff;letter-spacing:.06em;white-space:nowrap}
#liveBadge.vod{background:#3a3456;cursor:pointer}
#liveBadge.vod:hover{background:var(--live)}
#vol{width:84px;accent-color:var(--cyan)}
#ctrl .sp{flex:1}
#tAt{font-size:12px;color:#ddd;white-space:nowrap;font-variant-numeric:tabular-nums}
#tap{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;pointer-events:none}
#tap span{pointer-events:auto;background:rgba(14,11,31,.88);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer}
#capMob{display:none}
/* timeline */
#tl{padding:10px 14px 4px;background:var(--bg2);border-bottom:1px solid var(--line)}
#tlBar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
#tlBar .t{font-weight:800;font-size:13px;margin-right:6px}
.zb{padding:4px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--dim)}
.zb.on{color:#fff;border-color:var(--accent);background:#2a2060}
.zb:hover{color:#fff}
#tlDate{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px;color-scheme:dark}
#goLive{margin-left:auto;background:var(--live);color:#fff;border-radius:6px;padding:5px 11px;font-weight:800;font-size:12px}
#goLive.dim{background:var(--panel2);color:var(--dim)}
#tlWrap{position:relative}
#tlc{width:100%;height:96px;display:block;touch-action:none;cursor:pointer;border-radius:6px}
#tip{position:absolute;bottom:104px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;pointer-events:none;width:252px;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:4}
#tip canvas{width:240px;height:135px;display:block;border-radius:4px;image-rendering:pixelated;background:#000}
#tip .tt{font-size:12px;font-weight:700;margin-top:5px}
#tip .ts{font-size:11px;color:var(--dim)}
#tlHint{font-size:11px;color:var(--dim2);padding:4px 0 2px}
</style>
<style id="css2">
/* info row */
#info{display:flex;gap:14px;padding:14px;align-items:flex-start;border-bottom:1px solid var(--line)}
#ava{width:64px;height:64px;border-radius:50%;border:3px solid var(--live);image-rendering:pixelated;flex:none;background:#231f45}
#info .mid{flex:1;min-width:0}
#sName{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#sName .ver{font-size:11px;background:var(--accent);border-radius:4px;padding:2px 6px;font-weight:800}
#sTitle{font-weight:600;margin-top:3px;overflow-wrap:anywhere}
#sCat{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-weight:600}
.tag.cat{color:var(--cyan);border-color:#2b5b6b}
.tag.hl{color:var(--yel);border-color:#6b5b20}
#info .rt{text-align:right;flex:none}
#viewers{font-weight:800;color:var(--live);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
#viewers small{color:var(--green);font-weight:700;font-size:12px}
#uptime{font-size:12px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
#followBtn{margin-top:8px;background:var(--accent);color:#fff;border-radius:8px;padding:7px 14px;font-weight:800}
#followBtn.on{background:var(--panel2);color:var(--pink)}
/* tabs */
#tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.tab{padding:8px 12px;font-weight:700;color:var(--dim);border-bottom:3px solid transparent}
.tab.on{color:#fff;border-color:var(--accent)}
.pane{padding:14px;max-width:1100px}
.day{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel);overflow:hidden}
.dayH{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;width:100%;text-align:left}
.dayH:hover{background:var(--panel2)}
.dayH b{font-size:14px}
.dayH .ic{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.dayH .ic canvas{width:20px;height:20px;image-rendering:pixelated}
.segs{border-top:1px solid var(--line)}
.srow{display:flex;align-items:center;gap:10px;padding:7px 12px;width:100%;text-align:left;border-bottom:1px solid rgba(44,37,82,.5)}
.srow:hover{background:var(--panel2)}
.srow canvas{width:32px;height:32px;image-rendering:pixelated;flex:none;border-radius:4px;background:#0b0820}
.srow .tm{font-size:12px;color:var(--dim);width:92px;flex:none;font-variant-numeric:tabular-nums}
.srow .nm{font-weight:700;min-width:0;flex:1}
.srow .nm small{display:block;color:var(--dim);font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;background:#2a2060;color:var(--yel);white-space:nowrap}
.chip.rage{background:#4a1020;color:#ff8a9a}.chip.collab{background:#4a1040;color:#ff9ad0}.chip.million{background:#4a3a10;color:var(--yel)}
.more{display:block;margin:6px auto 20px;padding:8px 18px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:700}
.about h3{font-size:15px;margin:16px 0 6px}
.about p,.about li{color:#d8d4f4;max-width:720px}
.about ul{padding-left:18px}
.note{background:#231a4a;border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:10px 0;max-width:720px}
.emotes{display:flex;flex-wrap:wrap;gap:10px}
.emotes div{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--dim);width:72px}
.emotes img{width:40px;height:40px;image-rendering:pixelated}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:900px}
.glist div{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:700;font-size:12px}
.glist canvas{width:28px;height:28px;image-rendering:pixelated}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;max-width:900px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
</style>
<style id="css3">
/* chat */
#chatHead{display:flex;align-items:center;gap:8px;padding:0 10px;height:44px;border-bottom:1px solid var(--line);font-weight:800;font-size:12px;letter-spacing:.08em;flex:none}
#chatHead .sp{flex:1}
#chatMode{font-size:11px;font-weight:700;letter-spacing:0;color:var(--dim);background:var(--panel2);border-radius:999px;padding:2px 8px}
#chatMode.live{color:var(--green)}
#pin{flex:none}
#pin:empty{display:none}
#pin .pc{margin:8px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
#chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
.m{padding:3px 12px;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere;word-break:break-word}
.m:hover{background:rgba(255,255,255,.04)}
.m .u{font-weight:800;cursor:pointer}
.m .u:hover{text-decoration:underline}
.m .bd{display:inline-block;font-size:9px;font-weight:800;border-radius:3px;padding:1px 4px;margin-right:3px;vertical-align:2px;color:#fff}
.bd.mod{background:#1f9d55}.bd.bot{background:#0b7285}.bd.vip{background:#c2255c}.bd.sub{background:#6741d9}.bd.founder{background:#e67700}.bd.og{background:#495057}.bd.real{background:#ff2e4d}.bd.first{background:#f08c00}
.m img.e{width:26px;height:26px;vertical-align:-8px;image-rendering:pixelated}
.m .bleep{background:#ff2e7a;color:#fff;border-radius:3px;padding:0 3px;font-weight:800;font-size:11px;letter-spacing:.05em}
.m.del .tx{color:var(--dim2);font-style:italic}
.m.sys{background:linear-gradient(90deg,rgba(155,107,255,.2),transparent);border-left:3px solid var(--accent);margin:4px 0;font-weight:600}
.m.sys.raid{border-color:var(--live);background:linear-gradient(90deg,rgba(255,46,77,.22),transparent)}
.m.modm .tx{color:#9fe8ef}
.m.real{background:rgba(255,46,77,.07)}
.m.me{background:rgba(102,246,255,.08)}
.m.first{border-left:3px solid #f08c00}
.m.notice{color:var(--dim);font-size:12px;text-align:center;font-style:italic}
#moreBelow{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;background:var(--accent);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:6px 12px;z-index:3;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#chatCol{position:relative}
#chatIn{flex:none;padding:8px 10px 10px;border-top:1px solid var(--line)}
#toBox{background:#3a1020;border:1px solid var(--live);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;margin-bottom:6px;color:#ffb3bd}
#inRow{display:flex;gap:6px}
#msg{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;resize:none;height:40px}
#msg:disabled{opacity:.55}
#send{background:var(--accent);color:#fff;font-weight:800;border-radius:8px;padding:0 14px}
#send:disabled{opacity:.45;cursor:default}
#inMeta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--dim)}
#inMeta .sp{flex:1}
#nameChip{font-weight:800;cursor:pointer;color:var(--cyan)}
#emoBtn{font-size:16px;padding:0 6px}
#emoPick{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
#emoPick img{width:30px;height:30px;image-rendering:pixelated;cursor:pointer;border-radius:4px}
#emoPick img:hover{background:var(--panel2)}
/* popups */
.pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.6);padding:14px;width:290px;max-width:calc(100vw - 20px)}
.pop h4{font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pop .bio{color:var(--dim);font-size:13px;margin:8px 0}
.pop .kind{font-size:11px;font-weight:800;color:var(--dim2);letter-spacing:.06em}
.pop .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pbtn{padding:7px 11px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:12px}
.pbtn:hover{background:var(--line)}
.pbtn.red{background:#4a1020;border-color:#7a2030;color:#ffb3bd}
.pbtn.go{background:var(--accent);border-color:var(--accent);color:#fff}
.x{position:absolute;right:8px;top:6px;font-size:20px;color:var(--dim);width:30px;height:30px}
#shade{position:fixed;inset:0;background:rgba(5,3,12,.6);z-index:19}
#settings{width:420px;max-height:calc(100% - 40px);overflow:auto;left:50%;top:50%;transform:translate(-50%,-50%)}
#settings label{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
#settings input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;flex:1}
#settings h5{margin-top:14px;font-size:12px;letter-spacing:.08em;color:var(--dim)}
.blist{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px}
.blist div{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:12px;border-bottom:1px solid var(--line)}
.blist div span{flex:1;font-weight:700}
.blist .none{color:var(--dim);justify-content:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);border-radius:999px;padding:9px 16px;font-weight:700;z-index:30;pointer-events:none;transition:opacity .3s}
/* theater */
body.theater #hdr{display:none} body.theater #app{height:100%}
body.theater #player{max-width:calc((100vh - 4px) * 16 / 9)}
/* mobile tabs */
#mTabs{display:none}
@media (max-width:1100px){:root{--chatW:300px}}
@media (max-width:860px){
  :root{--hdr:46px}
  #hdr{gap:8px;padding:0 8px} #logo{font-size:11px} #logo canvas{width:22px;height:22px} .hide-s{display:none!important}
  #app{display:flex;flex-direction:column}
  #left{flex:none;overflow:visible}
  #player{max-width:none}
  #left>*:not(#playerBox){display:none}
  #capMob{display:block;padding:6px 12px;font-size:13px;background:var(--bg2);border-bottom:1px solid var(--line);min-height:32px;color:#d8d4f4}
  #capMob b{color:var(--cyan)}
  #mTabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
  #mTabs button{flex:1;padding:9px 4px;font-weight:800;font-size:12px;color:var(--dim);border-bottom:3px solid transparent}
  #mTabs button.on{color:#fff;border-color:var(--accent)}
  #chatCol{flex:1;border-left:0;min-height:0}
  #mPane{flex:1;overflow-y:auto;min-height:0}
  #mPane>*{display:block!important}
  #ctrl{opacity:1;padding:18px 6px 4px;gap:2px} .cb{width:32px;height:32px;font-size:15px} #vol{display:none}
  #tlc{height:84px}
  #tip{display:none}
  #info{padding:10px} #ava{width:48px;height:48px}
}
@media (max-width:520px){#bBack,#bFwd,#bTheater{display:none} #tAt{font-size:10px;overflow:hidden;text-overflow:ellipsis;min-width:0} #ctrl .sp{flex:0 1 4px}}
@media (max-width:860px) and (orientation:landscape) and (max-height:520px){
  #app{display:grid;grid-template-columns:minmax(0,1fr) 260px;grid-template-rows:auto auto 1fr}
  #left{grid-row:1/4;overflow-y:auto} #left>#playerBox{display:block}
  #player{max-width:calc((100vh - var(--hdr)) * 16 / 9)}
  #mTabs{grid-column:2} #chatCol{grid-column:2} #mPane{grid-column:2}
  #capMob{display:none}
}
</style>
</head>
<body>
<header id="hdr">
  <a id="back" href="index.html">← Kai.fun</a>
  <div id="logo"><canvas id="logoCv" width="14" height="14"></canvas><b>INFINISTREAM</b></div>
  <div class="sp"></div>
  <span id="hereNow" class="hbtn off" title="Real people watching on kaifun.fun right now"><i></i><span id="hereTxt">connecting…</span></span>
  <button id="setBtn" class="hbtn" title="Settings, bans and mutes" aria-label="Settings">⚙<span class="hide-s"> Settings</span></button>
</header>
<div id="app">
  <main id="left">
    <div id="playerBox">
      <div id="player" tabindex="0" aria-label="Stream player">
        <canvas id="cv" width="1280" height="720"></canvas>
        <div id="tap" class="hidden"><span id="tapTxt">🔊 Tap for sound</span></div>
        <div id="ctrl">
          <button class="cb" id="bPlay" title="Pause / play (space)" aria-label="Pause">❚❚</button>
          <button class="cb" id="bBack" title="Back 30 s (←)" aria-label="Back 30 seconds">↺</button>
          <button class="cb" id="bFwd" title="Forward 30 s (→)" aria-label="Forward 30 seconds">↻</button>
          <span id="liveBadge" title="Jump to live">LIVE</span>
          <span id="tAt"></span>
          <div class="sp"></div>
          <button class="cb" id="bMute" title="Mute (m)" aria-label="Sound">🔇</button>
          <input id="vol" type="range" min="0" max="100" value="60" aria-label="Volume">
          <button class="cb" id="bTTS" title="Text-to-speech voice for LOOPY (off by default)" aria-label="Voice">🗣</button>
          <button class="cb" id="bTheater" title="Theater mode (t)" aria-label="Theater mode">▭</button>
          <button class="cb" id="bFull" title="Fullscreen (f)" aria-label="Fullscreen">⛶</button>
        </div>
      </div>
      <div id="capMob"></div>
    </div>
    <section id="tl">
      <div id="tlBar">
        <span class="t">⏪ Rewind the stream</span>
        <button class="zb" data-z="3600000">1H</button><button class="zb on" data-z="21600000">6H</button><button class="zb" data-z="86400000">1D</button><button class="zb" data-z="604800000">1W</button><button class="zb" data-z="2592000000">30D</button>
        <button class="zb" id="prevSeg" title="Previous segment">⏮</button><button class="zb" id="nextSeg" title="Next segment">⏭</button>
        <input id="tlDate" type="datetime-local" step="60" aria-label="Jump to date and time">
        <button id="goLive">● LIVE</button>
      </div>
      <div id="tlWrap"><canvas id="tlc" height="96"></canvas>
        <div id="tip" class="hidden"><canvas id="tipCv" width="480" height="270"></canvas><div class="tt" id="tipT"></div><div class="ts" id="tipS"></div></div></div>

<script>
// ===== sim.js =====
// sim.js - game registry + deterministic round runner.
//
// GAME API (every src/games/g_*.js calls IS.defGame({...})):
//   id, name ('BLOCK DROP'), cat ('Puzzle'), color ('#7cf'), icon: 12 strings x 12 chars, pal: {char: colour} ('.' = clear)
//   dt      sim step in seconds (default 1/30). Keep step() cheap: a whole round (<=180 s) must simulate in < ~60 ms.
//   round   [minSec, maxSec] length of one round (default [70,160]). A game session = several rounds; every round
//           starts from init() with its own seed, so seeking only ever re-simulates one round.
//   score   true if a big numeric score makes sense (used for "1,000,000 points attempt" events)
//   init(R, o) -> state      plain JSON-able object (arrays/objects/numbers/strings/bools; no functions/Maps)
//   step(s, R, c)            advance one dt. Use ONLY R (seeded), IS.sin/IS.cos/IS.atan2 and plain arithmetic.
//                            Never Math.random/Math.sin/Math.cos/Math.atan2/Date. Emit events with c.ev(type, txt, v).
//                            When a game/attempt ends, show its game-over a few seconds then restart a new attempt
//                            yourself (keep s.best/s.attempt) - a round never idles.
//   draw(g, s, c)            render the 480x270 frame with the kit g (IS.Kit). Must not touch R or mutate s.
//                            Animate with c.T (seconds into the round) - never real time. Math.sin is fine here.
//   status(s) -> {score, line:'LINES 12  LV 3', danger:0..1, lives}   (read by commentary/chat/overlay)
//   quips: {start, die, big, win, danger, idle, over}: arrays of short lines the streamer says ({score},{best},{n} filled in)
//   o (round options): {seed, round, rounds, D, skill 0..1, tilt 0..1, hot, speedrun, base (score offset), best}
//   c (context): {T (seconds into round), D (round length), dt, n (step), wrap (last 10 s), o, ev(type, txt, v)}

<script>
