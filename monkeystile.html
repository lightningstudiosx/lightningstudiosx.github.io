<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monkeys Are Shakespeare</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#2a1a10}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script>
// Live home-page tile: monkeys at typewriters trying to type MONKEYS ARE SHAKESPEARE.
const PHRASE = 'MONKEYS ARE SHAKESPEARE', LINES = ['MONKEYS ARE', 'SHAKESPEARE'];
const W = 1640, H = 820, cv = document.getElementById('c'), x = cv.getContext('2d');
let scale = 1, ox = 0, oy = 0;
function fit() {
  const d = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  scale = Math.max(w / W, h / H) * d; ox = (cv.width - W * scale) / 2; oy = (cv.height - H * scale) / 2;
}
addEventListener('resize', fit); fit();
const rnd = (a, b) => a + Math.random() * (b - a);
const KEYS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const MONK = [];
const FUR = ['#7a4a26', '#8b5a2b', '#6b3f1f', '#9a6434', '#5e3a1c', '#84522a'];
const HATS = ['top', 'none', 'fez', 'bowler', 'none', 'crown', 'beret', 'none'];
for (let i = 0; i < 8; i++) MONK.push({ x: 120 + i * 200, y: 690 + (i % 2) * 18, fur: FUR[i % FUR.length], hat: HATS[i], ph: Math.random() * 6, hit: 0, next: rnd(.05, .4) });
let typed = 0, flying = [], stamps = [], hold = 0, confetti = [], t0 = performance.now(), last = t0, shake = 0;
const slot = [];   // screen position of each phrase character
(function layout() {
  x.font = '900 150px Georgia, "Times New Roman", serif';
  const cw = 104, ys = [205, 395];
  let k = 0;
  LINES.forEach((ln, li) => {
    const start = W / 2 - (ln.length * cw) / 2 + cw / 2;
    for (let i = 0; i < ln.length; i++) { slot.push({ ch: ln[i], x: start + i * cw, y: ys[li] }); k++; }
    if (li === 0) { slot.push({ ch: ' ', x: 0, y: 0, space: true }); }
  });
})();
// slot list now matches PHRASE character by character (the space between the lines has no box)
function nextNeeded() { while (typed < slot.length && (slot[typed].space || slot[typed].ch === ' ')) typed++; return typed < slot.length ? slot[typed].ch : null; }
function press(m) {
  const need = nextNeeded(); if (!need) return;
  // the monkeys get luckier as they go so a full run takes ~10 s
  const lucky = Math.random() < .05;
  const ch = lucky ? need : KEYS[(Math.random() * 26) | 0];
  m.hit = 1;
  if (ch === need) {
    const s = slot[typed]; typed++;
    stamps.push({ i: typed - 1, t: 0 }); shake = 4;
    flying.push({ ch, x: m.x, y: m.y - 70, tx: s.x, ty: s.y, t: 0, ok: true });
  } else {
    flying.push({ ch, x: m.x, y: m.y - 70, vx: rnd(-260, 260), vy: rnd(-520, -320), r: 0, vr: rnd(-8, 8), t: 0, ok: false });
  }
}
function monkey(m, t) {
  const bob = Math.sin(t * 9 + m.ph) * 3 * (m.hit > 0 ? 1 : .3), hx = m.x, hy = m.y - 88 + bob;
  // typewriter
  x.fillStyle = '#1d1712'; rr(m.x - 70, m.y - 30, 140, 58, 10); x.fill();
  x.fillStyle = '#c9a24a'; rr(m.x - 64, m.y - 26, 128, 8, 4); x.fill();
  x.fillStyle = '#efe6cf'; x.fillRect(m.x - 34, m.y - 74, 68, 46);
  x.fillStyle = '#3a2e22'; for (let r = 0; r < 2; r++) for (let k = 0; k < 6; k++) { x.beginPath(); x.arc(m.x - 50 + k * 20, m.y + 2 + r * 14, 6, 0, 7); x.fill(); }
  // arms hammering
  const arm = m.hit * 14;
  x.strokeStyle = m.fur; x.lineWidth = 16; x.lineCap = 'round';
  x.beginPath(); x.moveTo(hx - 30, hy + 50); x.lineTo(m.x - 40, m.y - 4 + (m.ph % 2 > 1 ? arm : 0)); x.stroke();
  x.beginPath(); x.moveTo(hx + 30, hy + 50); x.lineTo(m.x + 40, m.y - 4 + (m.ph % 2 > 1 ? 0 : arm)); x.stroke();
  // head
  x.fillStyle = m.fur; x.beginPath(); x.arc(hx - 40, hy, 16, 0, 7); x.arc(hx + 40, hy, 16, 0, 7); x.fill();
  x.fillStyle = '#e8c49a'; x.beginPath(); x.arc(hx - 40, hy, 8, 0, 7); x.arc(hx + 40, hy, 8, 0, 7); x.fill();
  x.fillStyle = m.fur; x.beginPath(); x.arc(hx, hy, 40, 0, 7); x.fill();
  x.fillStyle = '#e8c49a'; x.beginPath(); x.ellipse(hx, hy + 10, 28, 24, 0, 0, 7); x.fill();
  x.fillStyle = '#1a120c'; x.beginPath(); x.arc(hx - 12, hy - 2, 5, 0, 7); x.arc(hx + 12, hy - 2, 5, 0, 7); x.fill();
  x.strokeStyle = '#1a120c'; x.lineWidth = 3; x.beginPath(); x.arc(hx, hy + 14, 9, .2, Math.PI - .2); x.stroke();
  // hat
  x.fillStyle = '#1a1410';
  if (m.hat === 'top') { x.fillRect(hx - 24, hy - 78, 48, 44); x.fillRect(hx - 36, hy - 38, 72, 8); x.fillStyle = '#9c2a2a'; x.fillRect(hx - 24, hy - 46, 48, 8); }
  else if (m.hat === 'fez') { x.fillStyle = '#b3261e'; x.beginPath(); x.moveTo(hx - 20, hy - 34); x.lineTo(hx - 14, hy - 66); x.lineTo(hx + 14, hy - 66); x.lineTo(hx + 20, hy - 34); x.fill(); }
  else if (m.hat === 'bowler') { x.beginPath(); x.arc(hx, hy - 36, 24, Math.PI, 0); x.fill(); x.fillRect(hx - 34, hy - 38, 68, 7); }
  else if (m.hat === 'crown') { x.fillStyle = '#e0b43c'; x.beginPath(); x.moveTo(hx - 24, hy - 32); x.lineTo(hx - 24, hy - 58); x.lineTo(hx - 12, hy - 44); x.lineTo(hx, hy - 62); x.lineTo(hx + 12, hy - 44); x.lineTo(hx + 24, hy - 58); x.lineTo(hx + 24, hy - 32); x.fill(); }
  else if (m.hat === 'beret') { x.fillStyle = '#2f4a7a'; x.beginPath(); x.ellipse(hx + 6, hy - 36, 32, 12, -.15, 0, 7); x.fill(); }
}
function rr(a, b, w, h, r) { x.beginPath(); x.roundRect ? x.roundRect(a, b, w, h, r) : x.rect(a, b, w, h); }
function letterBox(s, done, k, t) {
  const st = stamps.find(q => q.i === k), pop = st ? Math.max(0, 1 - st.t * 4) : 0;
  x.save(); x.translate(s.x, s.y);
  x.fillStyle = done ? '#f6ecd2' : 'rgba(246,236,210,.16)'; x.strokeStyle = done ? '#2a1a10' : 'rgba(246,236,210,.35)'; x.lineWidth = 5;
  rr(-48, -88, 96, 124, 12); x.fill(); x.stroke();
  if (done) {
    x.scale(1 + pop * .5, 1 + pop * .5);
    x.font = '900 88px Georgia, "Times New Roman", serif'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    x.fillStyle = '#1b120b'; x.fillText(s.ch, 0, 16);
    if (pop > 0) { x.fillStyle = `rgba(179,38,30,${pop})`; x.beginPath(); x.arc(0, -26, 70 * (1 - pop) + 20, 0, 7); x.fill(); }
  } else if (k === typed) {
    x.fillStyle = `rgba(232,190,80,${.5 + .5 * Math.sin(t * 8)})`; x.fillRect(-30, 20, 60, 8);
  }
  x.restore();
}
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden || now - last < 32) return;
  const dt = Math.min(.1, (now - last) / 1000); last = now; const t = (now - t0) / 1000;
  // logic
  if (hold > 0) { hold -= dt; if (hold <= 0) { typed = 0; stamps = []; confetti = []; } }
  else {
    for (const m of MONK) { m.next -= dt; m.hit = Math.max(0, m.hit - dt * 5); if (m.next <= 0) { press(m); m.next = rnd(.12, .45); } }
    if (!nextNeeded()) { hold = 3.2; for (let i = 0; i < 90; i++) confetti.push({ x: rnd(0, W), y: rnd(-200, 0), vy: rnd(160, 380), vx: rnd(-60, 60), r: rnd(0, 6), c: ['#e0b43c', '#b3261e', '#f6ecd2', '#4a8a5c'][i % 4] }); }
  }
  for (const s of stamps) s.t += dt;
  flying = flying.filter(f => { f.t += dt; if (f.ok) return f.t < .35; f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.r += f.vr * dt; return f.y < H + 80; });
  for (const c of confetti) { c.y += c.vy * dt; c.x += c.vx * dt; c.r += dt * 4; }
  shake *= .8;
  // draw
  x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#2a1a10'; x.fillRect(0, 0, cv.width, cv.height);
  x.setTransform(scale, 0, 0, scale, ox + rnd(-shake, shake) * scale, oy + rnd(-shake, shake) * scale);
  // panelled wall + lamp glow
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#24452f'); g.addColorStop(.62, '#1a3323'); g.addColorStop(.63, '#4a2c18'); g.addColorStop(1, '#2e1b0f');
  x.fillStyle = g; x.fillRect(-40, -40, W + 80, H + 80);
  const lg = x.createRadialGradient(W / 2, 260, 40, W / 2, 260, 900); lg.addColorStop(0, 'rgba(255,214,140,.28)'); lg.addColorStop(1, 'rgba(255,214,140,0)'); x.fillStyle = lg; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 4; for (let i = 0; i < 9; i++) { x.strokeRect(30 + i * 180, 40, 160, 440); }
  // the phrase
  slot.forEach((s, k) => { if (!s.space && s.ch !== ' ') letterBox(s, k < typed, k, t); });
  // desks & monkeys
  x.fillStyle = '#5a361d'; x.fillRect(0, 700, W, 140); x.fillStyle = '#6e4423'; x.fillRect(0, 700, W, 12);
  for (const m of MONK) monkey(m, t);
  // flying letters
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const f of flying) {
    if (f.ok) { const k = Math.min(1, f.t / .35); x.globalAlpha = 1 - k; x.font = '900 60px Georgia, serif'; x.fillStyle = '#f6ecd2'; x.fillText(f.ch, f.x + (f.tx - f.x) * k, f.y + (f.ty - f.y) * k); x.globalAlpha = 1; }
    else { x.save(); x.translate(f.x, f.y); x.rotate(f.r); x.fillStyle = '#e9e0c8'; x.beginPath(); x.arc(0, 0, 24, 0, 7); x.fill(); x.strokeStyle = '#b8ac8e'; x.lineWidth = 3; x.stroke(); x.font = '900 28px Georgia, serif'; x.fillStyle = '#6b5a40'; x.fillText(f.ch, 0, 2); x.restore(); }
  }
  for (const c of confetti) { x.save(); x.translate(c.x, c.y); x.rotate(c.r); x.fillStyle = c.c; x.fillRect(-9, -5, 18, 10); x.restore(); }
}
requestAnimationFrame(frame);
// static frame for screenshots: ?done shows the finished phrase
if (location.search.includes('done')) { typed = slot.length; hold = 1e9; }
</script>
</body></html>
