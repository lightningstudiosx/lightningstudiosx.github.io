<style>
:root{--bg:#0a0a0a;--ink:#ece7dc;--soft:#8d877c;--line:#2e2c29;--card:#171614;--paper:#f3efe6;--paperInk:#1b1916;--moss:#6f8a4a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.45 Nunito,system-ui,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 0;gap:10px}
.back{font:800 14px Nunito,sans-serif;color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--card)}
.hbtn{font:800 13px Nunito,sans-serif;color:var(--ink);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:6px}
h1{font:700 clamp(30px,6vw,46px)/1 Fraunces,Georgia,serif;text-align:center;margin:10px 0 0;letter-spacing:-.01em}
.sub{text-align:center;color:var(--soft);font-size:14px;margin:6px 0 0}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 16px 0;min-height:0}
.bubble{position:relative;z-index:1;max-width:560px;width:100%;min-height:118px;background:var(--paper);color:var(--paperInk);border:0;border-radius:22px;padding:18px 22px;font:500 clamp(19px,3.4vw,24px)/1.35 Fraunces,Georgia,serif;box-shadow:0 10px 40px #0008;display:flex;align-items:center;justify-content:center;text-align:center}
.bubble:after{content:"";position:absolute;left:50%;bottom:-10px;width:22px;height:22px;background:var(--paper);transform:translateX(-50%) rotate(45deg)}
.bubble .cur{display:inline-block;width:2px;height:1em;background:var(--paperInk);margin-left:2px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.stage{position:relative;width:min(340px,80vw);margin-top:26px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.stage:before{content:"";position:absolute;left:-30%;right:-30%;top:-10%;bottom:-25%;background:radial-gradient(closest-side,#ffffff1c,#ffffff08 55%,transparent);pointer-events:none}
.stage svg{position:relative;width:100%;height:auto;display:block;overflow:visible}
#rockG{transform-origin:170px 250px;transition:transform .12s}
.squish #rockG{transform:scale(1.04,.93)}
.talk #rockG{animation:talk .5s ease-in-out infinite}
@keyframes talk{50%{transform:scale(1.01,.985)}}
#eyes{opacity:0;transition:opacity .4s}
.open #eyes{opacity:1}
.you{min-height:22px;margin-top:10px;color:var(--soft);font-size:14px;text-align:center;max-width:560px;overflow-wrap:anywhere}
.meta{color:var(--soft);font-size:13px;text-align:center;margin-top:2px;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink)}
form{position:sticky;bottom:0;width:100%;display:flex;justify-content:center;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.box{display:flex;gap:8px;width:100%;max-width:560px}
input{flex:1;min-width:0;font:600 17px Nunito,sans-serif;padding:14px 18px;border:2px solid #3a3733;border-radius:999px;background:var(--card);color:var(--ink);outline:none}
input:focus{border-color:var(--ink)}
input::placeholder{color:#6f6a61}
button.send{font:900 16px Nunito,sans-serif;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:0 22px;cursor:pointer}
button.send:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;max-width:560px}
.chips button{font:800 13px Nunito,sans-serif;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--ink)}
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.sheet .in{background:var(--card);border:1.5px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 20px 60px #000;max-height:86vh;overflow:auto}
.sheet h2{font:700 24px Fraunces,Georgia,serif;margin:0 0 10px}
.sheet ul{padding-left:20px;margin:8px 0}
.sheet li{margin:4px 0}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sheet .row button{font:800 14px Nunito,sans-serif;border:2px solid var(--line);border-radius:999px;padding:8px 16px;background:var(--card);cursor:pointer;color:var(--ink)}
.sheet .row button.danger{background:#c8452f;border-color:#c8452f;color:#fff}
@media (max-height:700px){.stage{width:min(240px,60vw);margin-top:20px}.bubble{min-height:96px}}
</style>

<script>
(()=>{
const $=id=>document.getElementById(id);
const KEY='rock_mem_v1';
const fresh=()=>({name:'',likes:[],hates:[],feel:'',count:0,pokes:0,visits:0,first:Date.now(),last:0,said:[]});
let M=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)M={...fresh(),...s}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(M))}catch(e){}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const bags={};
function bag(key,arr){ // no repeats until all used
  let b=bags[key];if(!b||!b.length){b=bags[key]=arr.slice().sort(()=>Math.random()-.5)}
  return b.pop();
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const nm=()=>M.name?cap(M.name):'';
const withName=s=>M.name&&Math.random()<.3?s.replace(/\.$/,', '+nm()+'.'):s;

/* ---------- levels ---------- */
const LV=[[0,'a stranger'],[8,'an acquaintance'],[25,'a friend'],[60,'a good friend'],[120,'its best friend'],[250,'basically also a rock']];
const level=()=>{let i=0;LV.forEach((l,j)=>{if(M.count>=l[0])i=j});return i};

/* ---------- lines ---------- */
const L={
greet:["Hello. I have been waiting. Not on purpose. I just can't move.","Hi. I am a rock. You are a person. We are both here.","Greetings, small fast creature.","Hello. You are very loud. I mean that kindly.","Oh. A visitor. The last one was a beetle in 1987."],
bye:["Goodbye. I will be right here. Obviously.","Leaving already? You only stayed a few seconds. For me, anyway.","Bye. I will think about what you said for about a century.","Go. I will hold this spot for you."],
listen:["Hm.","I see.","Interesting. Tell me more. I have time.","...I am thinking about that. Give me a few hundred years.","I heard you. I hear everything. Slowly.","That is a very human thing to say.","Mm. The wind told me something similar once.","I will remember that. Probably. I am bad at remembering. I am good at sitting.","Go on.","You type very fast. I admire that. I cannot type.","...yes.","I nodded. You could not see it. Rocks nod on the inside.","That is either very wise or very silly. Rocks cannot tell the difference.","I have been told worse by mountains.","Okay."],
insult:["I have been called worse by glaciers.","Words do not erode me. Rain does. You are not rain.","That is fine. In a million years you will be dust and I will still be a rock.","I forgive you. I have nowhere else to be.","Rude. I am telling the other rocks.","Hm. A bird once said that to me. Then it pooped on me. You are still nicer."],
nice:["...thank you. I will blush for the next 300 years. You will not notice.","That is kind. Nobody says nice things to rocks.","You are a good person. Possibly the best one who has talked to me today.","I will keep that compliment in my cracks.","Thank you. You are also very... soft. That is a compliment where I come from."],
joke:["Why did the rock break up with the other rock? It took everything for granite.","What is a rock's favorite music? Rock. Obviously. Next question.","I told a joke to a pebble once. It cracked up.","What did the volcano say to the rock? I lava you. I still think about it.","Knock knock. Who is there? A rock. A rock who? A rock. That is the whole joke. I am not good at jokes.","How do rocks stay fit? They go to the boulder gym and do rock-ups.","I would tell you a joke about sand, but it is too coarse."],
alive:["Am I alive? I do not breathe, eat or move. But I am listening. You decide.","I am a rock. Whether I am alive is a question for philosophers. I am busy being a rock.","Alive is a strong word. I prefer 'present'."],
ai:["I am not a robot. I am a rock. Robots are rocks that someone taught to think. I did it myself.","No computer here. Well, maybe a little. Do not tell anyone.","I am 100% rock. Maybe 2% Kai.fun."],
age:["I am about 4 billion years old. I do not look a day over 3 billion.","Old. Older than trees. Older than dinosaurs. I remember when the Moon was closer.","I stopped counting birthdays after the first billion."],
home:["I came from a volcano. It was hot. I do not like to talk about it.","I rolled here a long time ago. It took 40,000 years. Worth it.","I am from the inside of the Earth. Then I came up for air. Then I stayed."],
sleep:["I never sleep. I also never wake up. It is a whole thing.","I rest. Constantly. It is my best skill."],
eat:["I do not eat. Sometimes moss eats me. It tickles.","Rocks eat sunlight. That is a lie. We eat nothing. We are very cheap."],
friends:["I have friends. Moss lives on me. A worm visits on Tuesdays. And now you.","My best friend was a pebble. It rolled away in 1650. I still wait.","You are one of my friends now. It is decided. I cannot undo it. I am a rock."],
favorite:["My favorite color is grey. Very relaxing.","My favorite food is nothing. My favorite place is here.","My favorite thing is staying still. I am very good at it.","My favorite season is all of them. They go by so fast.","My favorite animal is the tortoise. It understands me."],
feel:{
 sad:["I am sorry you are sad. Sadness is like weather. It feels forever. It never is. I have watched a lot of weather.","You can sit with me. You do not have to say anything. Rocks are good at that.","It is okay to be sad. Even mountains get rained on."],
 tired:["Then rest. I have rested for 4 billion years. Highly recommended.","Sleep is the closest a human gets to being a rock. Go be a rock for a while."],
 angry:["Anger is like lava. Hot now. Becomes a rock later. Wait a bit.","Kick the ground if you want. Not me, please. The ground is used to it."],
 bored:["Bored? Try being me. Just kidding. I love this.","Go outside and find a rock. Tell it I said hi. It will not answer. That is normal.","When I am bored, I erode a tiny bit. You could try learning something instead."],
 lonely:["You are not alone. You are talking to a rock. That counts.","I am here. I am always here. That is kind of my thing."],
 scared:["Being scared means you care about something. Rocks are never scared. Rocks also never do anything.","Hold something heavy. Like a rock. It helps. Not me, though."],
 happy:["Good. Happiness looks good on you. I can tell, even without eyes.","I am happy you are happy. I will celebrate by not moving."],
 stressed:["Breathe in. Breathe out. I cannot do that, so you do it for both of us.","In a thousand years, nobody will remember this. Except me, maybe."],
 nervous:["Nervous is just excited with worried shoes on.","You will be fine. I have seen much bigger things go wrong and the Earth is still here."]
},
yes:["Yes. Slowly, but yes.","Yes. The ground agrees.","Absolutely. Rock solid.","I think so. Rocks think slowly, but I think so.","Yes. Do not tell anyone I said that."],
no:["No. Erosion says no.","No. Sorry. I do not make the rules. Gravity does.","Not likely. I would bet my moss on it.","No. But ask again in ten thousand years."],
maybe:["Maybe. Ask again in ten thousand years.","Unclear. The rock is cloudy. Wait, that is the sky.","I do not know. Rocks are wise, not psychic.","Hmm. Flip a coin. Coins are flat rocks. They know things."],
why:["Why? Because the universe is very big and you are very curious. Both are good.","Why is a good question. Rocks never ask why. We just sit.","I do not know why. But I have been thinking about it since the dinosaurs.","Because that is how it rolled. Like me."],
how:["Slowly. That is how everything happens.","Step by step. Grain by grain. That is how I was made.","I do not know how. I only know how to sit. I am an expert at sitting."],
what:["That is a good question. My answer is: grey.","I do not know. But I will know in a few thousand years. Check back.","Hard to say. I am a rock. My vocabulary is mostly 'hm'."],
who:["Someone. Probably a person. People do most things.","I do not know them. I mostly know worms."],
where:["Somewhere. Probably under a rock. Ask the rock. Wait. That is me. I do not know.","Not here. I would have noticed. I notice everything here."],
when:["Soon. Or in a million years. To me those are the same.","When the time is right. Time is very relaxed about these things."],
should:["You should. Life is short. Not mine. Yours.","Do the thing that future you will thank you for. Future me will not care. I am a rock.","If it is kind, do it. If it is dangerous, ask a grown-up first."],
school:["Do your homework. I never did mine. Look at me now. Just sitting here.","School is important. Learn about rocks. Specifically, me.","Tests are scary. But you are smarter than you think. I am smarter than I look. We are the same."],
math:["...the answer is {a}. That took me a thousand years.","{a}. I counted on my cracks.","It is {a}. I am surprisingly good at math for a rock."],
mathhard:["That is a lot of numbers. I am a rock. Ask a calculator. Calculators are just fancy rocks.","My brain is made of granite. I cannot do that one."],
time:["It is {t}. I do not use time. Time uses me.","{t}. But to me, it is always 'now'."],
poke:["Ow. No. That did not hurt. I am a rock.","You poked me. I will remember this for a million years.","Hey.","That tickles. Nothing tickles me. Except you, apparently.","Boop.","Please stop. Actually, I do not mind.","Poking a rock. Bold choice."],
idle:["...","Are you still there? I can wait. I am very good at waiting.","I counted the dust on me while you were gone. There is a lot.","The wind just said hello. I said nothing. As usual.","Take your time. I have all of it.","I just thought of something smart. It is gone now. Rocks are like that."],
repeat:["You said that already. I heard you the first time.","Same words again. Are you testing me? I passed. I am a rock.","Again? Okay. Hm. Again."],
wisdom:["Be like water. Or a rock. Rocks are easier.","You do not have to do everything today. Mountains were not made in a day.","The rain hits me every day. I am still here. You can be too.","Small things, every day, become big things. Ask the Grand Canyon.","Everyone is a little cracked. That is how the light gets in. Also the moss.","Nobody is in a hurry except people. Slow down a little.","If you fall, you are just being a rock for a second. Then get back up. That is the part rocks cannot do."],
deep:["I have seen dinosaurs come and go. They worried about things too. It did not matter. Be kind to yourself.","You talk to me a lot. I like that. Nobody has talked to me this much since the Ice Age.","Here is a secret: I am not really wise. I am just very, very patient. That is most of wisdom.","When you are old, find a rock and tell it about today. It will remember. We always do.","You make this spot less boring. That is the nicest thing a rock can say."],
meaning:["The meaning of life is to be soft, because I cannot be.","The meaning of life is 42. Or grey. I forget which.","To be kind, to be curious, and to never kick rocks. Especially me."]
};

/* ---------- special triggers ---------- */
const FEEL={sad:/\b(sad|upset|crying|cry|depressed|down|unhappy)\b/,tired:/\b(tired|sleepy|exhausted)\b/,angry:/\b(angry|mad|furious|annoyed)\b/,bored:/\b(bored|boring day)\b/,lonely:/\b(lonely|alone|no friends)\b/,scared:/\b(scared|afraid|frightened|terrified)\b/,happy:/\b(happy|great|awesome|amazing|good day|excited)\b/,stressed:/\b(stressed|stress|overwhelmed)\b/,nervous:/\b(nervous|worried|anxious)\b/};
const STOP=new Set(['sad','tired','angry','mad','bored','lonely','scared','happy','fine','good','ok','okay','here','back','not','so','very','a','the','just','going','doing','sorry','alive','real','home','hungry','sure','done','ready','talking','your','gonna']);

function respond(raw){
  const o=raw.trim();const t=o.toLowerCase().replace(/[’']/g,"'");const w=t.replace(/[^a-z0-9'?!+\-*/(). ]/g,' ').replace(/\s+/g,' ').trim();
  const q=/\?\s*$/.test(o)||/^(is|are|will|would|should|can|could|do|does|did|am|have|has|was|were|what|why|how|who|where|when|which)\b/.test(w);
  const lv=level();
  // repeat
  if(M.said.length&&M.said[M.said.length-1]===w)return bag('repeat',L.repeat);
  M.said.push(w);if(M.said.length>30)M.said.shift();
  // math
  const ex=o.replace(/[x×]/g,'*').replace(/÷/g,'/');
  if(/^[\d\s+\-*/().=?]+$/.test(ex)&&/\d\s*[+\-*/]\s*\d/.test(ex)){const e=ex.replace(/[=?]/g,'');try{if(e.length>40)return bag('mathhard',L.mathhard);const a=Function('"use strict";return ('+e+')')();if(!isFinite(a))return "Dividing by zero? Even I know that breaks the universe.";return bag('math',L.math).replace('{a}',Math.round(a*1000)/1000)}catch(err){}}
  // name
  let m=w.match(/\b(?:my name is|my name's|call me|i am called)\s+([a-z][a-z'-]{0,20})/)||(o.match(/\b(?:[Ii]'?m|[Ii] am)\s+([A-Z][a-zA-Z'-]{1,20})\b/)&&!STOP.has((o.match(/\b(?:[Ii]'?m|[Ii] am)\s+([A-Z][a-zA-Z'-]{1,20})\b/)[1]||'').toLowerCase())?[0,o.match(/\b(?:[Ii]'?m|[Ii] am)\s+([A-Z][a-zA-Z'-]{1,20})\b/)[1].toLowerCase()]:null);
  if(m&&!STOP.has(m[1])){const was=M.name;M.name=m[1];if(was&&was!==m[1])return `Your name is ${nm()} now? It used to be ${cap(was)}. Humans change so fast.`;return pick([`${nm()}. I will remember that. I will carve it into myself. Metaphorically.`,`Hello, ${nm()}. My name is Rock. It is a family name.`,`${nm()}. Good name. Very... not a rock. That is okay.`])}
  if(/\b(what'?s|what is) my name\b|\bwho am i\b|\bdo you (know|remember) (me|my name)\b/.test(w))return M.name?pick([`You are ${nm()}. I never forget a name. I rarely learn one, but I never forget.`,`${nm()}. Obviously. You have talked to me ${M.count} times.`]):"I do not know your name. You never told me. Rocks cannot read minds. Only faces. Mostly not even those.";
  // likes / hates
  m=w.match(/\bi (?:really |also )?(?:like|love|enjoy) (.{2,40})/);
  if(m&&!/\b(you|u)\b/.test(m[1])){const th=m[1].replace(/[?!.]+$/,'').trim();if(!M.likes.includes(th))M.likes.push(th);if(M.likes.length>12)M.likes.shift();return pick([`You like ${th}. I will remember that. I like sitting.`,`${cap(th)}. Interesting. I have never tried ${th}. I have never tried anything.`,`Noted: ${th}. Carved into my memory.`])}
  m=w.match(/\bi (?:really )?(?:hate|don't like|do not like|dislike) (.{2,40})/);
  if(m){const th=m[1].replace(/[?!.]+$/,'').trim();if(!/\b(you|u)\b/.test(th)){if(!M.hates.includes(th))M.hates.push(th);if(M.hates.length>12)M.hates.shift();return pick([`You do not like ${th}. Understandable. I do not like sandpaper.`,`${cap(th)}? I will never mention it again. Unless I forget. I might forget.`])}}
  // feelings
  for(const k in FEEL)if(FEEL[k].test(w)&&/\b(i|i'm|im|feel|feeling|am)\b/.test(w)){M.feel=k;return bag('f'+k,L.feel[k])}
  // easter eggs
  if(/\btung\b/.test(w))return "Tung. Tung. Tung. ...I do not know why, but that made me nervous.";
  if(/\bsahur\b/.test(w))return "Please do not bring a bat near me.";
  if(/^6\s*7$|\bsix seven\b|\b67\b/.test(w))return "...no.";
  if(/\bkai\b/.test(w)&&!/my name/.test(w))return pick(["Kai made this page. I allow it.","Kai? Good human. Built me a whole website. I did not ask. I am grateful."]);
  if(/rock,? paper,? scissors|\brps\b/.test(w))return "I choose rock. I always choose rock. Your move.";
  if(/^(paper)\b/.test(w))return "Paper. I am covered. You win. This is humiliating.";
  if(/^(scissors)\b/.test(w))return "Scissors. I crush them. I win. Sorry. I am still a rock.";
  if(/^(rock)\b/.test(w))return "Rock versus rock. A tie. We just sit here. Forever. Perfect.";
  if(/\bminecraft\b/.test(w))return "In Minecraft, I am called 'stone'. They punch me to get cobblestone. I try not to think about it.";
  if(/\bpet rock\b/.test(w))return "I am nobody's pet. But you can hold me. Gently.";
  if(/\b(dwayne|the rock)\b/.test(w))return "No relation.";
  // greetings / bye
  if(/^(hi|hello|hey|yo|sup|hiya|howdy|good (morning|afternoon|evening))\b/.test(w))return withName(bag('greet',L.greet));
  if(/^(bye|goodbye|see ya|see you|cya|gtg|good night|goodnight)\b/.test(w))return withName(bag('bye',L.bye));
  if(/\bhow are you\b|\bhow'?s it going\b|\bhow r u\b|\bwhat'?s up\b/.test(w))return pick(["Still a rock. Thanks for asking. Nobody ever asks.","Good. Very still. Same as always.","I am fine. I am always fine. I do not have the energy to be anything else."]);
  // insults/compliments
  if(/\b(stupid|dumb|ugly|idiot|boring|useless|trash|hate you|shut up|lame|cringe|loser)\b/.test(w))return bag('insult',L.insult);
  if(/\b(love you|like you|you'?re (cool|nice|great|awesome|the best|smart|wise|funny|pretty)|good rock|best rock|nice rock|cool rock|cute)\b/.test(w))return bag('nice',L.nice);
  if(/\b(thank|thanks|thx|ty)\b/.test(w))return pick(["You are welcome. I did nothing. That is my specialty.","Anytime. Literally. I am always here."]);
  // about the rock
  if(/\b(are you|r u) (alive|real|living|a person|human)\b/.test(w))return bag('alive',L.alive);
  if(/\b(are you|r u) (an? )?(ai|robot|bot|computer|chatgpt|claude)\b/.test(w))return bag('ai',L.ai);
  if(/\bhow old\b|\byour age\b|\bbirthday\b/.test(w))return bag('age',L.age);
  if(/\bwhere (are you|do you come|you from)\b|\bwhere'?d you come\b/.test(w))return bag('home',L.home);
  if(/\b(do you|you) sleep\b/.test(w))return bag('sleep',L.sleep);
  if(/\b(do you|you) (eat|drink|get hungry)\b/.test(w))return bag('eat',L.eat);
  if(/\b(friends?|family|lonely)\b/.test(w)&&/\byou\b/.test(w))return bag('friends',L.friends);
  if(/\bfavou?rite\b/.test(w))return bag('fav',L.favorite);
  if(/\bwhat are you\b|\bwho are you\b|\bwhat'?s your name\b/.test(w))return pick(["I am a rock. Mostly granite. A little bit of feelings.","My name is Rock. First name: The. Last name: Rock. Wait. No relation."]);
  if(/\b(can|do) you (move|walk|talk|see|hear|feel)\b/.test(w))return pick(["I cannot move. I have accepted this.","I can hear. I can think. I cannot move. Two out of three.","I feel things. Mostly rain."]);
  if(/\b(joke|funny|make me laugh)\b/.test(w))return bag('joke',L.joke);
  if(/\b(meaning of life|purpose of life|why are we here)\b/.test(w))return bag('meaning',L.meaning);
  if(/\b(advice|wisdom|wise|teach me|life lesson|tell me something)\b/.test(w))return lv>=2&&Math.random()<.5?bag('deep',L.deep):bag('wisdom',L.wisdom);
  if(/\b(homework|school|test|exam|teacher|quiz|class)\b/.test(w))return bag('school',L.school);
  if(/\bwhat time\b|\bwhat day\b|\bdate today\b|\btoday'?s date\b/.test(w)){const d=new Date();return bag('time',L.time).replace('{t}',/day|date/.test(w)?d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}):d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}))}
  if(/\bremember\b/.test(w)&&/\b(me|anything|what)\b/.test(w))return memoryLine()||"You have not told me much yet. Tell me what you like. I will keep it.";
  // questions
  if(q){
    if(/^should\b/.test(w))return bag('should',L.should);
    if(/^(is|are|will|would|can|could|do|does|did|am|have|has|was|were)\b/.test(w)){const r=Math.random();return r<.42?bag('yes',L.yes):r<.8?bag('no',L.no):bag('maybe',L.maybe)}
    if(/^why\b/.test(w))return bag('why',L.why);
    if(/^how\b/.test(w))return bag('how',L.how);
    if(/^who\b/.test(w))return bag('who',L.who);
    if(/^where\b/.test(w))return bag('where',L.where);
    if(/^when\b/.test(w))return bag('when',L.when);
    return bag('what',L.what);
  }
  // default: maybe recall memory
  if(Math.random()<(lv>=1?.22:.08)){const r=memoryLine();if(r)return r}
  if(lv>=3&&Math.random()<.12)return bag('deep',L.deep);
  return withName(bag('listen',L.listen));
}
function memoryLine(){
  const opts=[];
  if(M.likes.length){const th=pick(M.likes);opts.push(`You said you like ${th}. ${cap(th)} is temporary. I am not. Enjoy it anyway.`,`I keep thinking about ${th}. You like it. So I like it a little too.`)}
  if(M.hates.length){const th=pick(M.hates);opts.push(`I have not said ${th} once. You are welcome.`)}
  if(M.name)opts.push(`${nm()}. I like saying your name. It is much shorter than mine. Mine is just... rock.`);
  if(M.feel==='sad')opts.push("Earlier you were sad. Are you a little better now? I hope so.");
  return opts.length?pick(opts):'';
}

/* ---------- speaking ---------- */
const bubble=$('bubble'),stage=$('stage');let typing=null;
function say(text,instant){
  clearTimeout(typing);stage.classList.add('talk');let i=0;
  const step=()=>{i++;bubble.innerHTML=esc(text.slice(0,i))+(i<text.length?'<span class="cur"></span>':'');
    if(i<text.length){const c=text[i-1];typing=setTimeout(step,c==='.'&&text[i]==='.'?160:/[.!?]/.test(c)?260:/,/.test(c)?120:26)}else stage.classList.remove('talk')};
  if(instant){bubble.textContent=text;stage.classList.remove('talk');return}
  step();
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function updMeta(){const l=LV[level()][1];$('meta').innerHTML=`The rock thinks you are <b>${l}</b>`;stage.classList.toggle('open',level()>=3&&eyesOpen)}
let eyesOpen=false;

/* ---------- chips ---------- */
const CHIPS=["Hi rock","How old are you?","Tell me a joke","Give me advice","Am I going to be rich?","Rock, paper, scissors","What's 7 * 8?","Are you alive?"];
function drawChips(){const c=$('chips');c.innerHTML='';CHIPS.sort(()=>Math.random()-.5).slice(0,4).forEach(t=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>send(t);c.appendChild(b)})}

/* ---------- input ---------- */
let idleT,idleN=0;
function armIdle(){clearTimeout(idleT);if(idleN>=3)return;idleT=setTimeout(()=>{idleN++;say(bag('idle',L.idle));armIdle()},45000+Math.random()*20000)}
function send(text){
  text=(text||'').trim();if(!text)return;
  $('you').textContent='You: '+text;M.count++;M.last=Date.now();
  const r=respond(text);save();
  setTimeout(()=>say(r),350+Math.min(900,text.length*12));
  updMeta();if(M.count%3===0)drawChips();armIdle();
  if(level()>=3&&!eyesOpen&&Math.random()<.35){eyesOpen=true;updMeta();setTimeout(()=>{eyesOpen=false;updMeta()},2600)}
}
$('f').addEventListener('submit',e=>{e.preventDefault();const v=$('q').value;$('q').value='';send(v)});
stage.addEventListener('click',()=>{M.pokes++;save();stage.classList.add('squish');setTimeout(()=>stage.classList.remove('squish'),140);
  if(M.pokes===25)say("Twenty-five pokes. You have poked me more than anyone in history. Congratulations. Please stop.");
  else say(bag('poke',L.poke));armIdle()});

/* ---------- memory sheet ---------- */
function openSheet(html){$('sheetIn').innerHTML=html;$('sheet').hidden=false}
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.dataset.x==='close')$('sheet').hidden=true;
  if(e.target.dataset.x==='forget1'){openSheet(`<h2>Make the rock forget?</h2><p>It will forget your name, what you like, and how many times you talked. This cannot be undone.</p><div class="row"><button data-x="close">Keep memories</button><button class="danger" data-x="forget2">Forget everything</button></div>`)}
  if(e.target.dataset.x==='forget2'){M=fresh();M.visits=1;save();$('sheet').hidden=true;$('you').textContent='';updMeta();say("...who are you? Hello. I am a rock.")}});
$('memBtn').onclick=()=>{
  const items=[];
  items.push(M.name?`Your name is <b>${esc(nm())}</b>`:'It does not know your name yet');
  if(M.likes.length)items.push('You like: '+M.likes.map(esc).join(', '));
  if(M.hates.length)items.push('You do not like: '+M.hates.map(esc).join(', '));
  items.push(`You have said <b>${M.count}</b> thing${M.count===1?'':'s'} to it`);
  if(M.pokes)items.push(`You have poked it <b>${M.pokes}</b> time${M.pokes===1?'':'s'}`);
  items.push(`You have visited <b>${M.visits}</b> time${M.visits===1?'':'s'}`);
  items.push('It thinks you are <b>'+LV[level()][1]+'</b>');
  openSheet(`<h2>What the rock remembers</h2><ul>${items.map(i=>'<li>'+i+'</li>').join('')}</ul><p style="color:var(--soft);font-size:13px">This is only saved in this browser. The rock does not tell anyone. It cannot. It is a rock.</p><div class="row"><button data-x="forget1">Make it forget</button><button data-x="close">Close</button></div>`)};

/* ---------- start ---------- */
const prev=M.last;M.visits++;save();updMeta();drawChips();
let hello;
if(!prev||M.count===0)hello="Oh. Hello. I am a rock. You can talk to me. I will listen. I have nothing else to do.";
else{const days=Math.floor((Date.now()-prev)/864e5),hrs=Math.floor((Date.now()-prev)/36e5);
  const gap=days>=1?`${days} day${days===1?'':'s'}`:hrs>=1?`${hrs} hour${hrs===1?'':'s'}`:'a few minutes';
  hello=`${M.name?nm()+'. ':''}You came back. It has been ${gap}. For me, that was a blink.`}
setTimeout(()=>say(hello),400);armIdle();
window.__rock={respond,M:()=>M};
})();
</script>
</body>
</html>
