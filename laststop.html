<title>Last Stop</title>
<meta name="description" content="A 3D night-shift escape game. You stopped for gas at the end of the world, and the road keeps bringing you back through the front door. Solve the store to get out. Three endings, ten souvenirs.">

<style>
/* Last Stop: "Night Shift Neon". Near-black, fluorescent cream, neon pink and teal, a VT323 till readout. */
:root { --ink: #05060c; --pink: #ff4fa0; --teal: #2fe0c8; --cream: #fff3d6; --amber: #ffb84a; --muted: #8a8fa8; --display: "Monoton", "Rubik", sans-serif; --body: "Rubik", system-ui, sans-serif; --mono: "VT323", monospace; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--cream); font-family: var(--body); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent }
button { font: inherit; color: inherit; cursor: pointer }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none }
.home { position: fixed; z-index: 30; left: max(14px, env(safe-area-inset-left)); top: calc(env(safe-area-inset-top, 0px) + 12px); font: 600 12px var(--body); color: var(--ink); text-decoration: none; padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--cream); box-shadow: 3px 3px 0 var(--pink) }
.home:hover { background: var(--teal) }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)), repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px) }

/* ---------- title ---------- */
#title { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; background: linear-gradient(180deg, rgba(5,6,12,.15), rgba(5,6,12,.75)) }
.logo h1 { margin: 0; font: clamp(56px, 12vw, 132px)/1 var(--display); color: var(--pink); text-shadow: 0 0 10px var(--pink), 0 0 30px var(--pink), 0 0 60px rgba(255,79,160,.6); animation: neon 4s infinite }
.logo h2 { margin: 8px 0 0; font: 400 clamp(16px, 2.6vw, 26px) var(--mono); color: var(--teal); letter-spacing: 3px; text-shadow: 0 0 10px var(--teal) }
.eyebrow { font: 20px var(--mono); color: var(--amber); letter-spacing: 3px }
@keyframes neon { 0%, 18%, 22%, 60%, 64%, 100% { opacity: 1 } 20%, 62% { opacity: .35 } }
.menu { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center }
.menu button, .ending button, .paper button, .device button { padding: 11px 20px; border-radius: 10px; border: 2px solid var(--teal); background: rgba(5,6,12,.7); font: 600 16px var(--body); box-shadow: 0 0 12px rgba(47,224,200,.3) }
.menu button:hover, .paper button:hover, .device button:hover, .ending button:hover { background: var(--teal); color: var(--ink) }
button.big { font-size: 20px !important; border-color: var(--pink) !important; box-shadow: 0 0 18px rgba(255,79,160,.5) !important }
button.big:hover { background: var(--pink) !important }
.endings { font: 20px var(--mono); color: var(--muted) } .end { margin: 0 6px; padding: 2px 8px; border: 1px dashed var(--muted); border-radius: 6px } .end.got { color: var(--amber); border-color: var(--amber) }
.blurb { max-width: 560px; color: var(--muted); line-height: 1.5 }
.ending { max-width: 640px } .ending h1 { font: clamp(40px, 8vw, 84px)/1.05 var(--display); color: var(--amber); text-shadow: 0 0 16px var(--amber); margin: 10px 0 }
.ending p { font-size: 19px; line-height: 1.55 } .ending .stats { font: 22px var(--mono); color: var(--teal) }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none }
#cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,243,214,.7); transition: transform .1s }
#cross.on { transform: scale(2.2); background: var(--teal); box-shadow: 0 0 10px var(--teal) }
#prompt { position: absolute; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); font: 24px var(--mono); color: var(--cream); text-shadow: 0 0 6px #000, 0 2px 0 #000; white-space: nowrap }
#say { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); width: min(760px, 92vw); padding: 12px 18px; border-radius: 12px; background: rgba(5,6,12,.82); border-left: 4px solid var(--pink); font-size: 17px; line-height: 1.45; opacity: 0; transition: opacity .3s }
#say.on { opacity: 1 }
#loop { position: absolute; right: 16px; top: 14px; font: 30px var(--mono); color: var(--amber); text-shadow: 0 0 8px var(--amber) }
#inv { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 92vw }
.chip { font: 20px var(--mono); padding: 3px 12px; border-radius: 8px; background: rgba(5,6,12,.8); border: 1px solid var(--teal); color: var(--teal) }
#keys { position: absolute; left: 16px; bottom: 18px; font: 18px var(--mono); color: var(--muted) }
#banner { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; opacity: 0 }
#banner.on { animation: banner 3.4s ease forwards }
#banner b { display: block; font: 72px var(--display); color: var(--amber); text-shadow: 0 0 20px var(--amber) }
#banner span { font: 24px var(--mono); color: var(--cream) }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, 10px) } 15%, 70% { opacity: 1; transform: translate(-50%, 0) } 100% { opacity: 0 } }
#toasts { position: absolute; right: 16px; top: 60px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end }
.toast { font: 20px var(--mono); padding: 4px 12px; border-radius: 8px; background: var(--teal); color: var(--ink); animation: tin .3s ease }
@keyframes tin { from { opacity: 0; transform: translateX(20px) } }
#touchUI { position: absolute; inset: 0 }
#touchUI button { pointer-events: auto; position: absolute; bottom: 110px; width: 74px; height: 74px; border-radius: 50%; border: 2px solid var(--teal); background: rgba(5,6,12,.6); font: 600 15px var(--body) }
#useBtn { right: 24px } #bookBtn { right: 108px; width: 56px !important; height: 56px !important }
.stickhint { position: absolute; left: 30px; bottom: 120px; width: 110px; height: 110px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.25) }

/* ---------- overlays: paper, devices ---------- */
.overlay { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; padding: 20px; background: rgba(5,6,12,.55) }
.overlay.dim { background: rgba(5,6,12,.75) }
.overlay .x { position: absolute; right: 10px; top: 8px; border: 0 !important; box-shadow: none !important; background: none !important; font-size: 20px !important; color: inherit; padding: 4px 8px !important }
.paper { position: relative; max-width: 560px; width: 100%; max-height: 86vh; overflow: auto; padding: 22px 24px; background: #f6efd8; color: #2a2418; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.6); transform: rotate(-.6deg) }
.paper h3 { margin: 0 0 10px; font: 30px var(--mono) } .paper h4 { margin: 14px 0 4px; font: 22px var(--mono) }
.paper pre { white-space: pre-wrap; font: 22px/1.25 var(--mono); margin: 0 }
.paper button { color: #2a2418; border-color: #2a2418 !important; background: #fff !important; box-shadow: none !important }
.paper .row, .device .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap }
.paper .col { display: flex; flex-direction: column; gap: 10px }
.paper .obj { font: 22px var(--mono); color: #a8203a }
.paper details { margin: 4px 0 } .paper summary { cursor: pointer; font-weight: 600 }
.paper.wide { max-width: 860px }
.souvs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px } .sv { padding: 10px; border: 2px solid #2a2418; border-radius: 6px } .sv.locked { opacity: .45 } .sv p { margin: 4px 0 0; font-size: 14px }
.hint { color: var(--muted); font-size: 14px; margin: 10px 0 0 } .paper .hint { color: #6a5a40 }
.device { position: relative; padding: 22px; border-radius: 16px; background: #23252d; border: 3px solid #444a58; box-shadow: 0 10px 40px rgba(0,0,0,.7); text-align: center; max-width: 440px; width: 100% }
.register .lcd { font: 46px var(--mono); color: #3aff7a; background: #06120a; border-radius: 8px; padding: 6px 12px; margin-bottom: 14px; text-shadow: 0 0 8px #3aff7a; letter-spacing: 3px }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px } .keys button { font: 30px var(--mono) !important; padding: 10px !important }
.clock canvas { width: 220px; height: 220px; display: block; margin: 0 auto 6px }
.clock .ok { margin-top: 12px }
.radio { background: #6a4a2a; border-color: #3a2410 }
.dial { position: relative; height: 54px; border-radius: 8px; background: #f0d8a0; margin-bottom: 10px; overflow: hidden } .needle { position: absolute; top: 0; bottom: 0; width: 3px; background: #c81e2a; left: 40% } .scale { position: absolute; bottom: 4px; left: 0; right: 0; font: 18px var(--mono); color: #3a2410 }
.freq { font: 40px var(--mono); color: #ffb84a; text-shadow: 0 0 10px #ffb84a } .radio input { width: 100%; accent-color: #ffb84a }
.radio .hint { color: #f0d8a0; font: 22px var(--mono); min-height: 52px }
.switches { background: #dcd6c0; border-color: #8a8470; color: #2a2418 } .switches .hint { color: #4a4430 }
.grid { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; justify-content: center; margin: 14px 0 }
.sw { width: 72px; height: 92px; border-radius: 8px; border: 3px solid #5a5440 !important; background: linear-gradient(180deg, #fff 0 45%, #bbb 45% 100%) !important; box-shadow: none !important }
.sw.on { background: linear-gradient(180deg, #bbb 0 55%, #fff 55% 100%) !important; box-shadow: 0 0 16px #ffe880 !important; border-color: #e8c040 !important }
.switches .reset { color: #2a2418 }
#fade { position: fixed; inset: 0; z-index: 35; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s }
#flash { position: fixed; inset: 0; z-index: 34; opacity: 0; pointer-events: none }
</style>

<canvas id="cv"></canvas>
<a class="home" href="index.html">← Kai.fun</a>
<div id="hud" hidden>
  <div id="cross"></div><div id="prompt"></div><div id="say"></div><div id="loop"></div><div id="inv"></div><div id="banner"></div><div id="toasts"></div>
  <div id="keys">WASD · mouse · E use · J notebook</div>

</div>

<script type="module">
import * as THREE from 'three';
/* ============================================================================================
   THE STATION. "Night Shift Neon": a 1990s gas-station convenience store at 11:52 PM, forever.
   Hard fluorescent light, sticky checkerboard floor, a pink-and-teal neon OPEN sign, fog that
   eats the road. Everything is built here from boxes and canvas textures.
   ============================================================================================ */
const W = {};               // the world: meshes the game needs to reach
const colliders = [];       // {minX,maxX,minZ,maxZ,on} boxes the player can't walk through
const interactables = [];   // meshes with userData.use
const raycastables = [];    // everything that blocks a look

function rngFrom(seed) { let a = seed | 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function tex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter; t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.userData = { canvas: c, ctx: x }; return t;
}
const MATS = {};
function mat(color, opts = {}) { return new THREE.MeshLambertMaterial({ color, ...opts }); }
function box(w, h, d, m, x, y, z, { solid = false, parent, ray = true, name } = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); (parent || W.scene).add(mesh);
  if (name) mesh.name = name;
  if (ray) raycastables.push(mesh);
  if (solid) { const c = { minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, on: true }; colliders.push(c); mesh.userData.col = c; }
  return mesh;
}
function plane(w, h, m, x, y, z, ry = 0, parent) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  mesh.position.set(x, y, z); mesh.rotation.y = ry; (parent || W.scene).add(mesh); raycastables.push(mesh); return mesh;
}
function interact(mesh, label, use, extra = {}) { mesh.userData.label = label; mesh.userData.use = use; Object.assign(mesh.userData, extra); interactables.push(mesh); if (!raycastables.includes(mesh)) raycastables.push(mesh); return mesh; }
function textTex(lines, { w = 256, h = 128, bg = '#f4ecd0', fg = '#222', font = 'bold 30px Courier New', align = 'center', border } = {}) {
  return tex(w, h, (x) => {
    x.fillStyle = bg; x.fillRect(0, 0, w, h);
    if (border) { x.strokeStyle = border; x.lineWidth = 8; x.strokeRect(4, 4, w - 8, h - 8); }
    x.fillStyle = fg; x.font = font; x.textAlign = align; x.textBaseline = 'middle';
    const L = Array.isArray(lines) ? lines : [lines], lh = h / (L.length + 1);
    L.forEach((l, i) => x.fillText(l, align === 'center' ? w / 2 : 16, lh * (i + 1)));
  });
}

function buildWorld(seed) {
  const R = rngFrom(seed);
  const scene = W.scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05060c);
  scene.fog = new THREE.FogExp2(0x07080f, 0.045);

  /* ---------- textures ---------- */
  const floorT = tex(64, 64, (x) => { for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { x.fillStyle = (i + j) % 2 ? '#d9d2bf' : '#2b2b36'; x.fillRect(i * 32, j * 32, 32, 32); } x.fillStyle = 'rgba(80,60,20,.15)'; for (let k = 0; k < 40; k++) x.fillRect(Math.random() * 64, Math.random() * 64, 2, 2); }, [16, 12]);
  const ceilT = tex(64, 64, (x) => { x.fillStyle = '#cfcbbd'; x.fillRect(0, 0, 64, 64); x.strokeStyle = '#8f8a7a'; x.lineWidth = 2; x.strokeRect(1, 1, 62, 62); x.fillStyle = 'rgba(0,0,0,.06)'; for (let k = 0; k < 60; k++) x.fillRect(Math.random() * 64, Math.random() * 64, 1, 1); }, [8, 6]);
  const wallT = tex(64, 64, (x) => { x.fillStyle = '#e6dfc4'; x.fillRect(0, 0, 64, 64); x.fillStyle = '#c94f6d'; x.fillRect(0, 44, 64, 6); x.fillStyle = '#2fb8a8'; x.fillRect(0, 50, 64, 3); x.fillStyle = 'rgba(0,0,0,.05)'; for (let k = 0; k < 50; k++) x.fillRect(Math.random() * 64, Math.random() * 64, 1, 2); }, [8, 1]);
  const asphaltT = tex(64, 64, (x) => { x.fillStyle = '#1b1c22'; x.fillRect(0, 0, 64, 64); for (let k = 0; k < 300; k++) { const v = 20 + Math.random() * 30; x.fillStyle = `rgb(${v},${v},${v + 4})`; x.fillRect(Math.random() * 64, Math.random() * 64, 1, 1); } }, [40, 40]);
  const tileT = tex(32, 32, (x) => { x.fillStyle = '#9fc9c4'; x.fillRect(0, 0, 32, 32); x.strokeStyle = '#6f9995'; x.strokeRect(0.5, 0.5, 31, 31); }, [4, 3]);

  const M = {
    floor: mat(0xffffff, { map: floorT }), ceil: mat(0xffffff, { map: ceilT }), wall: mat(0xffffff, { map: wallT }), dark: mat(0x22232c), metal: mat(0x9aa0aa),
    counter: mat(0xb8452f), counterTop: mat(0xe8e2d0), shelf: mat(0x5d6470), glass: new THREE.MeshLambertMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.18, depthWrite: false }),
    asphalt: mat(0xffffff, { map: asphaltT }), tile: mat(0xffffff, { map: tileT }), door: mat(0x6b4a3a), steel: mat(0x6f7480), canopy: mat(0xd8d8d8), red: mat(0xd8343a), white: mat(0xf2f2f2),
    light: new THREE.MeshBasicMaterial({ color: 0xfff8e6 }), black: mat(0x0a0a0e), wood: mat(0x8a6a4a),
  };
  MATS.M = M;

  /* ---------- the store: x -8..8, z -6..6, 3.2 tall ---------- */
  const H = 3.2;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), M.floor); floor.rotation.x = -Math.PI / 2; scene.add(floor); raycastables.push(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), M.ceil); ceil.rotation.x = Math.PI / 2; ceil.position.y = H; scene.add(ceil);
  // walls
  box(0.2, H, 12, M.wall, -8.1, H / 2, 0, { solid: true });                 // left (fridges)
  box(0.2, H, 12, M.wall, 8.1, H / 2, 0, { solid: true });                  // right
  // back wall with two doorways: restroom x -7.2..-5.8 ; staff x 4.4..5.6
  box(0.9, H, 0.2, M.wall, -7.65, H / 2, -6.1, { solid: true });
  box(10.2, H, 0.2, M.wall, -0.7, H / 2, -6.1, { solid: true });
  box(2.4, H, 0.2, M.wall, 6.8, H / 2, -6.1, { solid: true });
  box(1.4, 0.9, 0.2, M.wall, -6.5, H - 0.45, -6.1); box(1.2, 0.9, 0.2, M.wall, 5, H - 0.45, -6.1);
  // front wall: windows and the automatic door gap x -1.2..1.2
  for (const [x0, x1] of [[-8, -1.2], [1.2, 8]]) {
    const w = x1 - x0, cx = (x0 + x1) / 2;
    box(w, 0.9, 0.25, M.counter, cx, 0.45, 6.1, { solid: true });
    box(w, 0.5, 0.25, M.wall, cx, H - 0.25, 6.1);
    const g = box(w, 1.8, 0.05, M.glass, cx, 1.8, 6.1, { solid: true }); g.renderOrder = 2;
    for (let px = x0; px <= x1 + 0.01; px += w / 3) box(0.08, 1.8, 0.12, M.steel, px, 1.8, 6.1);
  }
  box(2.4, 0.5, 0.25, M.wall, 0, H - 0.25, 6.1);
  // automatic sliding doors
  W.doorL = box(1.2, 2.6, 0.06, M.glass, -0.6, 1.3, 6.1); W.doorR = box(1.2, 2.6, 0.06, M.glass, 0.6, 1.3, 6.1);
  [W.doorL, W.doorR].forEach(d => { d.renderOrder = 2; box(1.2, 0.08, 0.1, M.steel, 0, 1.3, 0, { parent: d, ray: false }).position.set(0, 1.27, 0); });
  W.doorCol = { minX: -1.2, maxX: 1.2, minZ: 6.0, maxZ: 6.2, on: true }; colliders.push(W.doorCol);
  // the CLOSED-sign hook on the front door
  W.hook = box(0.25, 0.25, 0.05, M.steel, -0.6, 1.9, 6.0);
  W.doorSign = plane(0.5, 0.25, new THREE.MeshBasicMaterial({ map: textTex(['OPEN 24H'], { w: 128, h: 64, bg: '#1d6b3a', fg: '#fff', font: 'bold 26px Arial' }) }), -0.6, 1.75, 6.02, Math.PI);
  W.doorSign.material.side = THREE.DoubleSide;

  // ceiling fluorescent panels + lights
  W.lights = []; W.panels = [];
  for (const [x, z] of [[-4.5, -3], [0, -3], [4.5, -3], [-4.5, 2.5], [0, 2.5], [4.5, 2.5]]) {
    const p = box(2.2, 0.06, 0.5, M.light, x, H - 0.04, z, { ray: false }); W.panels.push(p);
  }
  for (const [x, z] of [[-4.5, 0], [3, 0], [0, 3.5], [-6.3, -8], [5.5, -8]]) { const l = new THREE.PointLight(0xfff3d6, 7, 14, 1.3); l.position.set(x, H - 0.3, z); scene.add(l); W.lights.push(l); }
  W.amb = new THREE.HemisphereLight(0xbfd4ff, 0x302820, 0.55); scene.add(W.amb);
  W.emergency = new THREE.PointLight(0xff2a3a, 0, 20, 1.2); W.emergency.position.set(5, 2.6, -4); scene.add(W.emergency);

  /* ---------- aisles with products ---------- */
  const labels = ['CHIPZ', 'SODA', 'GUM', 'JERKY', 'NUTS', 'CANDY', 'OIL', 'MAPS', 'SOUP', 'FOG'];
  const labelMats = labels.map((l, i) => new THREE.MeshLambertMaterial({ map: textTex([l], { w: 64, h: 64, bg: ['#d8343a', '#2fb8a8', '#f2c230', '#7a4ab8', '#3a7ad8', '#e86a1a', '#4a8a3a', '#d84a9a', '#e8e2d0', '#9aa0aa'][i], fg: '#111', font: 'bold 16px Arial' }) }));
  W.products = [];
  for (const ax of [-4.8, -2.2, 0.4]) {
    box(0.9, 1.7, 5, M.shelf, ax, 0.85, -1.6, { solid: true });
    for (const y of [0.35, 0.85, 1.35]) {
      box(1.0, 0.04, 5.1, M.metal, ax, y - 0.12, -1.6, { ray: false });
      for (let z = -3.8; z < 0.7; z += 0.36) for (const side of [-1, 1]) {
        if (R() < 0.15) continue;
        const m = labelMats[Math.floor(R() * 8)], hh = 0.18 + R() * 0.14;
        const pr = box(0.24, hh, 0.26, m, ax + side * 0.33, y - 0.1 + hh / 2, z, { ray: false });
        W.products.push(pr);
      }
    }

function drawClock(h, m) {
  const t = W.clockTex, x = t.userData.ctx;
  x.fillStyle = '#f4f0e0'; x.beginPath(); x.arc(64, 64, 62, 0, Math.PI * 2); x.fill(); x.lineWidth = 6; x.strokeStyle = '#222'; x.stroke();
  x.fillStyle = '#222'; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; x.fillRect(64 + Math.sin(a) * 50 - 2, 64 - Math.cos(a) * 50 - 2, 4, 4); }
  const hand = (a, len, w) => { x.lineWidth = w; x.lineCap = 'round'; x.beginPath(); x.moveTo(64, 64); x.lineTo(64 + Math.sin(a) * len, 64 - Math.cos(a) * len); x.stroke(); };
  hand(((h % 12) + m / 60) / 12 * Math.PI * 2, 30, 6); hand(m / 60 * Math.PI * 2, 46, 4);
  t.needsUpdate = true;
}
function drawNeon(colors, on = 1) {
  const t = W.neonTex, x = t.userData.ctx; x.clearRect(0, 0, 256, 96);
  x.font = 'bold 76px Arial Black, Arial'; x.textBaseline = 'middle'; x.lineWidth = 5;
  'OPEN'.split('').forEach((ch, i) => {
    const c = on ? colors[i] : '#333';
    // the plane faces the lot, so it reads OPEN from outside and backwards (NEPO) from inside
    x.save(); x.translate(8 + i * 60, 50);
    x.shadowColor = c; x.shadowBlur = on ? 18 : 0; x.strokeStyle = c; x.strokeText(ch, 0, 0); x.fillStyle = on ? '#fff' : '#222'; x.globalAlpha = on ? 0.25 : 1; x.fillText(ch, 0, 0);
    x.restore();
  });
  t.needsUpdate = true;
}
function drawMirror(revealed, msg) {
  const t = W.mirrorTex, x = t.userData.ctx;
  const g = x.createLinearGradient(0, 0, 256, 230); g.addColorStop(0, '#a8c8d0'); g.addColorStop(1, '#6a8a98'); x.fillStyle = g; x.fillRect(0, 0, 256, 230);
  x.fillStyle = 'rgba(255,255,255,.15)'; x.fillRect(20, 0, 30, 230);
  if (revealed) {
    x.fillStyle = 'rgba(240,250,255,.75)'; x.fillRect(0, 0, 256, 230);
    x.fillStyle = 'rgba(60,70,80,.85)'; x.font = 'bold 26px Comic Sans MS, cursive'; x.textAlign = 'center';
    msg.forEach((l, i) => x.fillText(l, 128, 50 + i * 40));
  }
  t.needsUpdate = true;
}

function rollPuzzles(seed) {
  const r = rngFrom(seed * 3 + 1), pick = (a) => a[Math.floor(r() * a.length)];
  const prices = { coffee: pick([125, 149, 175, 199]), jerky: pick([349, 425, 499, 550]), map: pick([299, 375, 450]), ice: pick([199, 225, 250]) };
  const total = prices.coffee + prices.jerky + prices.map + prices.ice;
  const perm = [0, 1, 2, 3, 4].sort(() => r() - 0.5).slice(0, 4);
  const lights = [0, 0, 0, 0, 0, 0, 0, 0, 0];
  const press = (L, i) => { const x = i % 3, y = Math.floor(i / 3); [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => { const X = x + dx, Y = y + dy; if (X >= 0 && X < 3 && Y >= 0 && Y < 3) L[Y * 3 + X] ^= 1; }); };
  const presses = new Set(); while (presses.size < 4) presses.add(Math.floor(r() * 9));
  presses.forEach(i => press(lights, i));
  return { prices, code: String(total).padStart(4, '0'), hour: pick([11, 11, 10, 9]), minute: pick([5, 10, 20, 25, 35, 40, 50, 55]), neon: perm,
    freq: (88 + Math.floor(r() * 190) / 10 + 0.1).toFixed(1), lights, press };
}

// touch: left stick, right drag to look, USE button
const touch = matchMedia('(pointer: coarse)').matches;
const stick = { id: null, x: 0, y: 0, ox: 0, oy: 0 }, look = { id: null, x: 0, y: 0 };
if (touch) {
  $('#touchUI').hidden = false;
  canvas.addEventListener('touchstart', e => { for (const t of e.changedTouches) { if (t.clientX < innerWidth * 0.4 && stick.id == null) { stick.id = t.identifier; stick.ox = t.clientX; stick.oy = t.clientY; stick.x = stick.y = 0; } else if (look.id == null) { look.id = t.identifier; look.x = t.clientX; look.y = t.clientY; } } }, { passive: true });
  canvas.addEventListener('touchmove', e => { for (const t of e.changedTouches) { if (t.identifier === stick.id) { stick.x = Math.max(-1, Math.min(1, (t.clientX - stick.ox) / 50)); stick.y = Math.max(-1, Math.min(1, (t.clientY - stick.oy) / 50)); } if (t.identifier === look.id) { player.yaw -= (t.clientX - look.x) * 0.006; player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch - (t.clientY - look.y) * 0.006)); look.x = t.clientX; look.y = t.clientY; } } }, { passive: true });
  canvas.addEventListener('touchend', e => { for (const t of e.changedTouches) { if (t.identifier === stick.id) { stick.id = null; stick.x = stick.y = 0; } if (t.identifier === look.id) look.id = null; } });

}

    if (!c.on) continue;
    const qx = Math.max(c.minX, Math.min(p.x, c.maxX)), qz = Math.max(c.minZ, Math.min(p.z, c.maxZ));
    const dx = p.x - qx, dz = p.z - qz, d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x += dx / d * (r - d); p.z += dz / d * (r - d); }
      else { const L = p.x - c.minX, Rr = c.maxX - p.x, B = p.z - c.minZ, T = c.maxZ - p.z, m = Math.min(L, Rr, B, T); if (m === L) p.x = c.minX - r; else if (m === Rr) p.x = c.maxX + r; else if (m === B) p.z = c.minZ - r; else p.z = c.maxZ + r; }
    }

}

/* ---------- looking at things ---------- */
const ray = new THREE.Raycaster(); ray.far = 2.7;
let target = null;
function updateTarget() {
  ray.setFromCamera({ x: 0, y: 0 }, camera);
  const hits = ray.intersectObjects(raycastables.filter(o => o.visible && isShown(o)), false);
  target = null;
  if (hits.length && hits[0].object.userData.use) target = hits[0].object;
  $('#prompt').textContent = target ? (touch ? '' : '[E] ') + target.userData.label : '';
  $('#cross').classList.toggle('on', !!target);
}
function isShown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function use() { if (target && !overlayOpen) { Snd.play('click'); target.userData.use(); } }

/* ---------- the frame ---------- */
let last = performance.now(), flick = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing && !overlayOpen) {
    S.time += dt;
    const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - stick.y;
    const side = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + stick.x;
    const sp = (keys.ShiftLeft ? 4.6 : 2.9);
    const sx = Math.sin(player.yaw), cz = Math.cos(player.yaw);
    let mx = -sx * fwd + cz * side, mz = -cz * fwd - sx * side;
    const l = Math.hypot(mx, mz); if (l > 1) { mx /= l; mz /= l; }
    player.pos.x += mx * sp * dt; player.pos.z += mz * sp * dt;
    collide(player.pos);
    const moving = l > 0.1;
    if (moving) { player.bob += dt * sp * 2.6; if (Math.sin(player.bob) < -0.95 && player.step <= 0) { Snd.play(player.pos.z > 6.3 ? 'stepOut' : 'step'); player.step = 0.25; } }
    player.step -= dt;
    // the automatic doors
    const nearDoor = Math.hypot(player.pos.x, player.pos.z - 6.1) < 2.4;
    const o = nearDoor ? 1 : 0; W.doorOpen = (W.doorOpen || 0) + (o - (W.doorOpen || 0)) * Math.min(1, dt * 6);
    W.doorL.position.x = -0.6 - W.doorOpen * 1.1; W.doorR.position.x = 0.6 + W.doorOpen * 1.1; W.doorCol.on = W.doorOpen < 0.7;
    if (nearDoor && !W.wasNear) Snd.play('whoosh'); W.wasNear = nearDoor;
    // the road brings you back
    const out = player.pos.z > 6.3 || Math.abs(player.pos.x) > 8.25 || player.pos.z < -10.3;
    Snd.outside(out);
    if (out && (player.pos.z > 19.5 || Math.abs(player.pos.x) > 15 || player.pos.z < -12)) {
      if (S.f.signHung) { if (!looping) { looping = true; ending('closing'); } } else nextLoop();
    }
    player.pos.x = Math.max(-16, Math.min(16, player.pos.x)); player.pos.z = Math.min(21, player.pos.z);
  }
  camera.position.set(player.pos.x, 1.62 + Math.sin(player.bob * 2) * 0.03, player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
  // flicker
  flick -= dt;
  const flickery = S && (S.anomaly || '').includes('flicker') ? 6 : 1;
  if (S && !S.f.lights && flick < 0) {
    flick = 0.05 + Math.random() * (3 / flickery);
    const on = Math.random() > 0.08 * flickery;
    W.lights.forEach((L, i) => { if (i < 5) L.intensity = on ? 7 : 1.5; }); W.panels.forEach(p => p.visible = on);
    if (!on) Snd.play('buzz');
  }
  if (S && S.f.lights) { W.lights.forEach((L, i) => { if (i < 5) L.intensity = 0; }); W.panels.forEach(p => p.visible = false); W.emergency.intensity = 3 + Math.sin(now / 400); W.amb.intensity = 0.12; W.backLight.intensity = 6; }
  // dawn after the sign is hung
  if (dawn) { W.scene.fog.color.lerp(new THREE.Color(0xd8a0b8), dt * 0.3); W.scene.background.lerp(new THREE.Color(0xe8b0a0), dt * 0.3); W.scene.fog.density += (0.018 - W.scene.fog.density) * dt * 0.4; }
  if (W.glow) W.glow.forEach((g, i) => g.material.opacity = 0.6 + Math.sin(now / 300 + i) * 0.3);
  // title camera
  if (!playing) { const t = now / 9000; camera.position.set(Math.sin(t) * 3 + 2, 2.4, 17 + Math.cos(t) * 2); camera.lookAt(0, 1.8, 6); }
  else updateTarget();
  renderer.render(W.scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- sound: hum, wind, drone, chimes, all synthesized ---------- */
const Snd = {
  ctx: null, on: SAVED.sound !== false,
  init() {
    if (this.ctx) return; try { this.ctx = new AudioContext(); } catch (e) { return; }
    const c = this.ctx; this.master = c.createGain(); this.master.gain.value = this.on ? 0.7 : 0; this.master.connect(c.destination);
    // fluorescent hum
    this.hum = c.createGain(); this.hum.gain.value = 0.025; this.hum.connect(this.master);
    [60, 120, 180].forEach((f, i) => { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 500; const g = c.createGain(); g.gain.value = [0.6, 0.3, 0.15][i]; o.connect(fl); fl.connect(g); g.connect(this.hum); o.start(); });
    // wind
    const n = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = n; src.loop = true; this.windF = c.createBiquadFilter(); this.windF.type = 'lowpass'; this.windF.frequency.value = 420;
    this.wind = c.createGain(); this.wind.gain.value = 0.0; src.connect(this.windF); this.windF.connect(this.wind); this.wind.connect(this.master); src.start();
    // the drone that grows with every loop
    this.drone = c.createGain(); this.drone.gain.value = 0; this.drone.connect(this.master);
    [55, 55.7, 82.4].forEach(f => { const o = c.createOscillator(); o.frequency.value = f; o.connect(this.drone); o.start(); });
    this.noiseBuf = n;
  },
  toggle() { this.on = !this.on; SAVED.sound = this.on; if (this.master) this.master.gain.value = this.on ? 0.7 : 0; },
  outside(o) { if (!this.ctx) return; const t = this.ctx.currentTime; this.wind.gain.setTargetAtTime(o ? 0.16 : 0.03, t, 0.4); this.hum.gain.setTargetAtTime(o || (S && S.f.lights) ? 0.003 : 0.025, t, 0.3); this.drone.gain.setTargetAtTime(Math.min(0.06, (S ? S.loop : 1) * 0.006), t, 2); },
  tone(f, t, d, type = 'sine', g = 0.15) { const c = this.ctx; const o = c.createOscillator(), a = c.createGain(); o.type = type; o.frequency.value = f; a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t + 0.01); a.gain.exponentialRampToValueAtTime(0.0008, t + d); o.connect(a); a.connect(this.master); o.start(t); o.stop(t + d + 0.05); },
  noise(t, d, g, f, type = 'bandpass') { const c = this.ctx; const s = c.createBufferSource(); s.buffer = this.noiseBuf; const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; const a = c.createGain(); a.gain.setValueAtTime(g, t); a.gain.exponentialRampToValueAtTime(0.0008, t + d); s.connect(fl); fl.connect(a); a.connect(this.master); s.start(t, Math.random()); s.stop(t + d + 0.05); },
  play(n) {
    this.init(); if (!this.ctx) return; const t = this.ctx.currentTime;
    if (n === 'chime') { this.tone(1046, t, 1.1, 'sine', 0.18); this.tone(830, t + 0.42, 1.4, 'sine', 0.18); }
    if (n === 'click') this.tone(1400, t, 0.04, 'square', 0.03);
    if (n === 'step') this.noise(t, 0.07, 0.12, 900);
    if (n === 'stepOut') this.noise(t, 0.09, 0.14, 500);
    if (n === 'pickup') { this.tone(880, t, 0.12, 'triangle', 0.12); this.tone(1320, t + 0.08, 0.2, 'triangle', 0.1); }
    if (n === 'solve') [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, t + i * 0.09, 0.6, 'triangle', 0.1));
    if (n === 'wrong') { this.tone(180, t, 0.25, 'square', 0.06); this.tone(150, t + 0.12, 0.3, 'square', 0.06); }
    if (n === 'beep') this.tone(1800, t, 0.06, 'square', 0.04);
    if (n === 'unlock') { this.noise(t, 0.1, 0.3, 2000); this.noise(t + 0.15, 0.12, 0.3, 1200); }

    if (n === 'clink') this.tone(2400 + Math.random() * 400, t, 0.15, 'sine', 0.08);
    if (n === 'buzz') this.tone(60, t, 0.12, 'sawtooth', 0.05);

    $('#again').onclick = () => { f.style.background = '#000'; title(); };
    setTimeout(() => f.style.opacity = 0, 400);
  }, 1600);
}

/* ---------- title ---------- */
function title() {
  playing = false; $('#hud').hidden = true; S = SAVED.run || null;
  P = rollPuzzles(S ? S.seed : 99); if (S) { applyLoop(); refreshWorld(); } paintClues();
  const el = $('#title'); el.hidden = false;
  const ends = ENDINGS.map(e => `<span class="end ${SAVED.endings[e.id] ? 'got' : ''}">${SAVED.endings[e.id] ? e.name : '???'}</span>`).join('');
  el.innerHTML = `<div class="logo"><div class="eyebrow">GAS-N-GO #4 · ROUTE ∞ · 11:52 PM</div><h1>LAST STOP</h1><h2>the gas station at the end of the world</h2></div>
    <div class="menu">${S ? `<button class="big" id="cont">Continue · Loop ${S.loop}</button>` : ''}<button class="${S ? '' : 'big'}" id="new">${S ? 'Start over' : 'Start your shift'}</button><button id="souv">Souvenirs ${Object.keys(SAVED.souvenirs).length}/${SOUVENIRS.length}</button></div>
    <div class="endings">Endings: ${ends}</div>
    <p class="blurb">You pulled in for gas. You can't pull out. Walk to the road and you're back at the door. Solve the store to get out. Headphones recommended.</p>`;
  if (S) $('#cont').onclick = () => start(false);
  $('#new').onclick = () => start(true);
  $('#souv').onclick = () => {
    el.innerHTML = `<div class="paper wide"><h3>Souvenirs</h3><div class="souvs">${SOUVENIRS.map(s => SAVED.souvenirs[s.id] ? `<div class="sv"><b>${s.name}</b><p>${s.desc}</p></div>` : `<div class="sv locked"><b>???</b><p>Still somewhere on the night shift.</p></div>`).join('')}</div><button id="back">Back</button></div>`;
    $('#back').onclick = title;
  };
}
function start(fresh) {
  looping = false;
  Snd.init(); if (Snd.ctx && Snd.ctx.state === 'suspended') Snd.ctx.resume();
  if (fresh || !S) { S = freshRun(); SAVED.run = S; }
  P = rollPuzzles(S.seed);
  // undo any previous run's state in the world
  W.scene.fog.color.setHex(0x07080f); W.scene.background.setHex(0x05060c); W.emergency.intensity = 0; W.amb.intensity = 0.55; W.backLight.intensity = 0; W.neonLight.intensity = 3;
  if (W.glow) { W.glow.forEach(g => W.scene.remove(g)); W.glow = null; }
  W.sDoorPivot.rotation.y = 0; W.rDoorPivot.rotation.y = 0; W.sDoorTarget = 0;
  W.doorSign.material.map = textTex(['OPEN 24H'], { w: 128, h: 64, bg: '#1d6b3a', fg: '#fff', font: 'bold 26px Arial' }); W.doorSign.material.needsUpdate = true;
  applyLoop(); refreshWorld(); paintClues();
  if (S.f.lights) blackoutQuiet();
  player.pos.set(0, 0, 4.6); player.yaw = 0; player.pitch = 0;
  $('#title').hidden = true; $('#hud').hidden = false; playing = true; drawInv(); save();
  if (!touch) canvas.requestPointerLock();
  Snd.play('chime'); loopBanner(S.loop, S.loop === 1 ? 'You pulled in for gas.' : S.anomaly);
  if (S.loop === 1 && !S.f.register) setTimeout(() => say('11:52 PM. You only stopped for gas. There\'s a receipt on the floor by the door... it has your name on it.'), 1600);
}
function blackoutQuiet() { W.glow = []; refreshWorld(); openSDoor(); }

// doors swing smoothly
setInterval(() => {
  if (S && S.f.restroom) W.rDoorPivot.rotation.y += (-1.6 - W.rDoorPivot.rotation.y) * 0.15;
  if (W.sDoorTarget) W.sDoorPivot.rotation.y += (W.sDoorTarget - W.sDoorPivot.rotation.y) * 0.15;
}, 30);

if (location.hash === '#test') window.__ls = { get S() { return S; }, get P() { return P; }, W, player, start, use, ending, nextLoop, interactables };
title();
requestAnimationFrame(frame);

</script>
