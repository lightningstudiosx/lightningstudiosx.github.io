<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Longest Day</title>
<meta name="description" content="Plan one 24-hour day, then live it 365 times and see who you become. Over 120 endings, sixteen commissions, and a whole lifetime to get it wrong in.">
<meta name="theme-color" content="#f3e9d2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* The Longest Day: "Sunprint Almanac". A two-colour riso print of a farmer's almanac: cream paper, indigo ink, coral
   printed slightly off register behind it, marigold for the sun. Fraunces for anything said aloud, DM Mono for figures. */
:root { --paper: #f3e9d2; --paper2: #e9dcbc; --ink: #1f2a5a; --coral: #f2644b; --gold: #f7c531; --teal: #27988a; --mute: #6d7191;
  --serif: "Fraunces", Georgia, serif; --mono: "DM Mono", ui-monospace, Menlo, monospace }
* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: var(--paper) }
body { margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--mono); font-size: 14px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
  background: radial-gradient(rgba(31,42,90,.1) 1px, transparent 1.5px) 0 0 / 7px 7px, linear-gradient(180deg, var(--paper), var(--paper2)); background-attachment: fixed }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0 }
h1, h2, h3 { font-family: var(--serif); margin: 0; line-height: .95 }
.home { position: fixed; left: 10px; top: 10px; z-index: 30; font: 500 12px var(--mono); color: var(--ink); text-decoration: none; background: var(--paper); border: 2px solid var(--ink); padding: 4px 9px; box-shadow: 3px 3px 0 var(--coral) }
#mute { position: fixed; right: 10px; top: 10px; z-index: 30; background: var(--paper); border: 2px solid var(--ink); padding: 4px 9px; font-size: 12px; box-shadow: 3px 3px 0 var(--gold) }
section { max-width: 1080px; margin: 0 auto; padding: 56px 16px 40px }
.btn { display: inline-block; background: var(--ink); color: var(--paper); font: 700 17px var(--serif); padding: 11px 20px; border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--coral); transition: transform .08s, box-shadow .08s }
.btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--coral) }
.btn.ghost { background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--gold) }
.btn.small { font-size: 14px; padding: 7px 13px }
.card { background: var(--paper); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--coral); padding: 14px 16px }
.kick { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute) }
.riso { color: var(--ink); text-shadow: .06em .06em 0 var(--coral) }

/* home: the title page of the almanac */
#s-home { display: grid; grid-template-columns: 1fr minmax(260px, 440px); gap: 28px; align-items: center; min-height: 100vh; padding-top: 70px }
#s-home h1 { font-size: clamp(58px, 11vw, 132px); font-weight: 900; letter-spacing: -.03em }
#s-home h1 span { display: block }
#s-home h1 span:nth-child(2) { color: var(--coral); text-shadow: .045em .045em 0 var(--ink) }
.tag { font: 500 clamp(17px, 2.4vw, 23px) var(--serif); margin: 16px 0 22px; max-width: 26em }
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 560px }
.door { text-align: left; background: var(--paper); border: 2px solid var(--ink); padding: 12px 14px; box-shadow: 5px 5px 0 var(--ink); transition: transform .08s, box-shadow .08s }
.door:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--coral) }
.door b { display: block; font: 700 21px var(--serif) }
.door small { color: var(--mute); font-size: 12px }
.door:first-child { background: var(--gold) }
#homeDial, #dial, #yearDial { display: block; width: 100%; aspect-ratio: 1; touch-action: none }
@media (max-width: 760px) { #s-home { grid-template-columns: 1fr; gap: 6px } #homeWrap { order: -1; max-width: 250px; margin: 0 auto } .doors { grid-template-columns: 1fr } }

/* planner */
.plan { display: grid; grid-template-columns: minmax(280px, 460px) 1fr; gap: 26px; align-items: start }
.top { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap }
.top h2 { font-size: 30px; font-weight: 900; flex: 1 }
#brief { margin-bottom: 10px }
#brief .ask { font: 500 17px var(--serif); margin: 4px 0 8px }
#brief ol { margin: 0; padding-left: 20px; font-size: 12.5px }
#dial { cursor: crosshair }
#fore { margin: 14px 0 0; display: grid; gap: 4px }
.bar { display: grid; grid-template-columns: 62px 1fr 34px; gap: 8px; align-items: center; font-size: 12px }
.bar i { display: block; height: 11px; border: 1.5px solid var(--ink); background: rgba(31,42,90,.08); position: relative }
.bar i b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--teal); transition: width .25s }
.bar i u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--coral) }
.bar.lo i b { background: var(--coral) }
.bar span:last-child { text-align: right }
#cash { font-size: 12px; margin-top: 3px }
.fnote { font-size: 11px; color: var(--mute) }
#brushbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; align-items: center; background: var(--paper); border: 2px solid var(--ink); padding: 7px 9px; margin-bottom: 10px; box-shadow: 4px 4px 0 var(--gold) }
#brushbar #cur { flex: 1; min-width: 0; font: 700 16px var(--serif); display: flex; gap: 7px; align-items: center }
#brushbar button { border: 2px solid var(--ink); padding: 3px 8px; font-size: 12px; background: var(--paper); display: inline-flex; gap: 5px; align-items: center }
#brushbar button.on { background: var(--ink); color: var(--paper) }
#info { font-size: 12.5px; min-height: 3.2em; margin-bottom: 10px }
#info b { font-family: var(--serif); font-size: 15px }
.plus { color: var(--teal) } .minus { color: var(--coral) }
.cat { margin-bottom: 12px }
.cat h3 { font-size: 15px; display: flex; gap: 6px; align-items: center; margin-bottom: 6px }
.stickers { display: flex; flex-wrap: wrap; gap: 7px }
.st { border: 2px solid var(--ink); border-left-width: 9px; background: var(--paper); padding: 5px 10px 5px 8px; font: 500 13px var(--mono); box-shadow: 2px 2px 0 rgba(31,42,90,.3); transition: transform .08s }
.st:hover { transform: rotate(-1.5deg) }
.st.on { background: var(--ink); color: var(--paper); transform: rotate(-2deg) scale(1.04); box-shadow: 3px 3px 0 var(--coral) }
.st.no { border-style: dashed; color: var(--mute); box-shadow: none; cursor: default }
.st.no:hover { transform: none }
#live { width: 100%; font-size: 22px }
#endDial { display: block; width: 150px; aspect-ratio: 1; margin: 0 auto 4px }
/* on a phone the stickers become one sideways tray right above the dial, so you never scroll between them */
@media (max-width: 820px) {
  .plan { display: flex; flex-direction: column; align-items: stretch; gap: 10px } .plan > div { display: contents }
  #brief { order: 1; margin: 0 } #brushbar { order: 2; margin: 0; position: static } #sheet { order: 3 } #info { order: 4; min-height: 2.9em; margin: 0 } #dialWrap { order: 5; width: 100%; max-width: 400px; margin: 0 auto } #live { order: 6 } #fore { order: 7 }
  #sheet { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 8px; min-width: 0; max-width: 100% } .cat { flex: none; margin: 0 } .stickers { flex-wrap: nowrap } .st { white-space: nowrap } .st.no { display: none }
}

/* the year */
#s-year { text-align: center; max-width: 620px }
#week { font: 900 clamp(44px, 9vw, 76px) var(--serif) }
#month { letter-spacing: .3em; text-transform: uppercase; font-size: 12px; color: var(--mute) }
#yearWrap { max-width: 330px; margin: 6px auto }
#ybars { max-width: 420px; margin: 0 auto 10px; display: grid; gap: 4px; text-align: left }
#log { text-align: left; min-height: 170px; display: grid; gap: 6px; align-content: start }
.ev { background: var(--paper); border: 2px solid var(--ink); padding: 6px 10px; font: 500 14px var(--serif); animation: drop .25s ease-out; box-shadow: 3px 3px 0 var(--gold) }
.ev small { font: 11px var(--mono); color: var(--mute); display: block }
.ev.tier { box-shadow: 3px 3px 0 var(--teal) } .ev.bad { box-shadow: 3px 3px 0 var(--coral); background: #fbd9cf }
@keyframes drop { from { transform: translateY(-10px) rotate(-1deg); opacity: 0 } }

/* the ending */
#s-end { max-width: 660px }
#endCard { text-align: center; padding: 24px 20px; position: relative; animation: stamp .32s cubic-bezier(.2, 1.6, .4, 1) }
@keyframes stamp { from { transform: scale(1.5) rotate(-5deg); opacity: 0 } }
#endCard h2 { font-size: clamp(34px, 7vw, 58px); font-weight: 900; margin: 6px 0 10px }
#endCard .d { font: 500 19px var(--serif); max-width: 26em; margin: 0 auto 14px }
.rar { display: inline-block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; border: 2px solid; padding: 2px 9px; margin-bottom: 6px }
.r1 { color: var(--ink) } .r2 { color: var(--teal) } .r3 { color: var(--coral) }
.new { position: absolute; right: -8px; top: -12px; background: var(--gold); border: 2px solid var(--ink); font: 900 15px var(--serif); padding: 3px 10px; transform: rotate(8deg) }
.nums { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-size: 13px; margin: 8px 0 }
.nums b { font: 700 18px var(--serif) }
.also { margin-top: 12px; text-align: left; font-size: 12.5px }
.chip { display: inline-block; border: 1.5px solid; padding: 1px 8px; margin: 3px 4px 0 0; font-size: 12px; background: var(--paper) }
.chip.n { background: var(--gold); color: var(--ink) }
.goals { text-align: left; margin: 12px auto 0; max-width: 430px; font-size: 13px; display: grid; gap: 3px }
.goals .ok { color: var(--teal) } .goals .x { color: var(--mute) }
.stars { font-size: 34px; letter-spacing: 6px; color: var(--gold); -webkit-text-stroke: 1.5px var(--ink) }
.stars .off { color: transparent }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px }
.unl { margin-top: 12px; background: var(--gold); border: 2px solid var(--ink); padding: 6px 10px; font: 700 15px var(--serif) }
.lifelist { text-align: left; font-size: 12.5px; max-height: 200px; overflow: auto; margin-top: 10px; border-top: 2px dashed var(--ink); padding-top: 8px }

/* commissions and almanac */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px }
.com { text-align: left; background: var(--paper); border: 2px solid var(--ink); padding: 11px 13px; box-shadow: 4px 4px 0 var(--ink); display: block; width: 100% }
.com:hover { box-shadow: 6px 6px 0 var(--coral) }
.com b { font: 700 19px var(--serif); display: block }
.com p { margin: 4px 0 6px; font: 500 14px var(--serif) }
.com.shut { opacity: .5; border-style: dashed; box-shadow: none; cursor: default }
.com .s { color: var(--gold); -webkit-text-stroke: 1px var(--ink); font-size: 18px; letter-spacing: 3px }
.com .s .off { color: transparent }
.prow { display: grid; grid-template-columns: 120px repeat(3, 1fr); gap: 6px; margin-bottom: 6px; align-items: stretch }
.prow > span { font: 700 14px var(--serif); align-self: center }
.e { border: 2px solid var(--ink); background: var(--paper); padding: 5px 8px; font-size: 12px; text-align: left; min-height: 34px }
.e.un { border-style: dashed; color: var(--mute); background: transparent; cursor: default }
.e.r2 { box-shadow: 3px 3px 0 var(--teal) } .e.r3 { box-shadow: 3px 3px 0 var(--coral) } .e.r1 { box-shadow: 3px 3px 0 rgba(31,42,90,.35) }
.e.r1, .e.r2, .e.r3 { color: var(--ink) }
#almInfo { position: sticky; bottom: 10px; margin-top: 16px }
#almInfo b { font: 700 19px var(--serif) }
@media (max-width: 560px) { .prow { grid-template-columns: 1fr 1fr 1fr } .prow > span { grid-column: 1 / -1 } }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; font: 500 14px var(--serif); z-index: 40; box-shadow: 4px 4px 0 var(--coral); max-width: 92vw; text-align: center }
.shake { animation: shake .25s } @keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
</style>
</head>
<body>
<a class="home" href="index.html">← Kai.fun</a>
<button id="mute">sound on</button>

<section id="s-home">
  <div>
    <h1 class="riso"><span>The</span><span>Longest</span><span>Day</span></h1>
    <p class="tag">Plan one day. Live it 365 times. Find out who that makes you.</p>
    <div class="doors">
      <button class="door" id="goFree"><b>A Free Day</b><small>Any day you like, for a year.</small></button>
      <button class="door" id="goComs"><b>Commissions</b><small id="comCount"></small></button>
      <button class="door" id="goLife"><b>A Lifetime</b><small id="lifeBest">Year after year, until it ends.</small></button>
      <button class="door" id="goAlm"><b>The Almanac</b><small id="almCount"></small></button>
    </div>
  </div>
  <div id="homeWrap"><canvas id="homeDial"></canvas></div>
</section>

<section id="s-coms" hidden>
  <div class="top"><h2 class="riso">Commissions</h2><button class="btn ghost small" data-home>Menu</button></div>
  <p class="tag">People who want their day designed. One star earns you their stickers.</p>
  <div class="grid" id="comGrid"></div>
</section>

<section id="s-plan" hidden>
  <div class="top"><h2 class="riso" id="ptitle">A Free Day</h2><button class="btn ghost small" id="pback">Menu</button></div>
  <div class="plan">
    <div>
      <div class="card" id="brief"></div>
      <div id="dialWrap"><canvas id="dial"></canvas></div>
      <button class="btn" id="live">Live it × 365</button>
      <div id="fore"></div>
    </div>
    <div>
      <div id="brushbar"><span id="cur"></span><button id="eraser"></button><button id="clear">clear</button></div>
      <div id="info"></div>
      <div id="sheet"></div>
    </div>
  </div>
</section>

<section id="s-year" hidden>
  <div id="month">January</div>
  <div id="week" class="riso">Week 1</div>
  <div id="yearWrap"><canvas id="yearDial"></canvas></div>
  <div id="ybars"></div>
  <div id="log"></div>
  <div class="row"><button class="btn ghost small" id="skip">Skip to the end</button></div>
</section>

<section id="s-end" hidden>
  <div class="card" id="endCard"></div>
  <div class="row" id="endBtns"></div>
</section>

<section id="s-alm" hidden>
  <div class="top"><h2 class="riso">The Almanac</h2><button class="btn ghost small" data-home>Menu</button></div>
  <p class="tag" id="almTag"></p>
  <h3 style="margin:14px 0 8px">Pursuits</h3>
  <div id="almPur"></div>
  <h3 style="margin:18px 0 8px">Fates</h3>
  <div class="grid" id="almFates" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px"></div>
  <div class="card" id="almInfo" hidden></div>
</section>

<div id="toast" hidden></div>
<script>
/* The Longest Day: everything there is to do in a day, what happens over a year, how it ends, and who commissions you. */
const CATS = {
  rest: { n: 'Rest', c: '#3d4fae', ink: '#fff' }, work: { n: 'Work', c: '#7a7f8c', ink: '#fff' },
  body: { n: 'Body', c: '#e2553d', ink: '#fff' }, food: { n: 'Food', c: '#f0a81c', ink: '#2a1c05' },
  people: { n: 'People', c: '#ea7fa8', ink: '#3a0d21' }, mind: { n: 'Mind', c: '#27988a', ink: '#fff' },
  play: { n: 'Play', c: '#8e5bd0', ink: '#fff' }, chaos: { n: 'Chaos', c: '#211d2b', ink: '#ffd34d' }
};
const STATS = { e: 'Energy', h: 'Health', j: 'Joy', b: 'Mind', f: 'Bonds' };

/* fx: where each hour pushes a stat, in points. $: money per hour, per day. win: the hours it works best [from, to).
   p: a pursuit (it has three endings of its own). tip: said instead of the plain effects. */
const ACT = {};
function A(id, n, cat, fx, $, o) { ACT[id] = Object.assign({ id, n, cat, fx: { e: fx[0], h: fx[1], j: fx[2], b: fx[3], f: fx[4] }, $: $ }, o || {}) }
A('sleep', 'Sleep', 'rest', [0, 0, 0, 0, 0], 0, { win: [21, 9], tip: 'Seven to nine hours, at night, and everything else works better.' });
A('nap', 'Nap', 'rest', [5, .5, 1, 0, 0], 0, { win: [12, 17], off: .5 });
A('bath', 'Long bath', 'rest', [2, 1, 3, 0, 0], -1, { s: 'Bath' });
A('stare', 'Stare at ceiling', 'rest', [1.5, 0, -1, 1.5, 0], 0, { s: 'Stare' });
A('meditate', 'Meditate', 'rest', [2, 1.5, 2.5, 2, 0], 0, { win: [5, 9], p: 1, s: 'Medit' });
A('job', 'Office job', 'work', [-3.2, -.6, -1.2, 1, .8], 24, { win: [8, 18], off: .75, s: 'Job' });
A('hustle', 'Side hustle', 'work', [-3.5, 0, -.5, 1.5, 0], 10, { p: 1, s: 'Hustle', tip: 'Pays badly at first. Pays better the longer you keep at it.' });
A('study', 'Study', 'work', [-2.5, 0, -1.2, 5, 0], -3, { win: [8, 22], p: 1 });
A('chores', 'Chores', 'work', [-1.5, .8, -.6, 0, 0], 0, { tip: 'Do none and the mess wins.' });
A('invest', 'Day-trade', 'work', [-2, 0, -1, 1, 0], 0, { win: [9, 16], p: 1, s: 'Trade', tip: 'Makes money if your Mind is sharp. Loses it if not. Markets open 9 to 4.' });
A('run', 'Run', 'body', [-2.5, 6, 1.5, 0, 0], 0, { win: [5, 20], p: 1 });
A('gym', 'Gym', 'body', [-3, 5.5, 1, 0, .4], -2, { p: 1 });
A('yoga', 'Yoga', 'body', [-.5, 3.5, 2, .8, 0], 0, { p: 1 });
A('swim', 'Swim', 'body', [-2.8, 5.5, 2, 0, 0], -2, { win: [6, 21], p: 1 });
A('walk', 'Walk', 'body', [-.6, 2.2, 1.6, .6, 0], 0, {});
A('eat', 'Eat', 'food', [1, 0, 1.5, 0, 0], -8, { tip: 'Two or three hours of meals a day keeps you alive. Costs money.' });
A('cook', 'Cook', 'food', [-1, 2.5, 2, .8, .6], -6, { p: 1, tip: 'Half a meal each hour, and eating out costs half as much.' });
A('snack', 'Snack', 'food', [.8, -2, 2.2, 0, 0], -5, {});
A('coffee', 'Coffee', 'food', [0, 0, .6, 0, 0], -4, { tip: 'Two cups wake you up. More than that and your hands hum. After 3pm it ruins sleep.' });
A('bake', 'Bake', 'food', [-1, 0, 3, .5, 1.2], -5, { p: 1 });
A('friends', 'See friends', 'people', [-.8, 0, 4.5, 0, 6], -6, { win: [11, 1], p: 1, s: 'Friends' });
A('family', 'Family time', 'people', [-.6, 0, 2, 0, 4.5], -1, { s: 'Family' });
A('date', 'Go on dates', 'people', [-1, 0, 4, 0, 3.5], -14, { win: [17, 24], p: 1, s: 'Date' });
A('volunteer', 'Volunteer', 'people', [-2, 0, 3, .8, 3.5], 0, { p: 1, s: 'Volunt' });
A('party', 'Party', 'people', [-4, -3, 6, 0, 3.5], -18, { win: [20, 4], p: 1 });
A('read', 'Read', 'mind', [-.6, 0, 2, 4.5, 0], 0, { p: 1 });
A('write', 'Write a novel', 'mind', [-1.8, 0, 1, 3, 0], 0, { p: 1, s: 'Write' });
A('chess', 'Chess', 'mind', [-1.5, 0, 1.5, 4, .3], 0, { p: 1 });
A('code', 'Code', 'mind', [-2, 0, .5, 4, 0], 0, { p: 1, tip: 'Sharpens the Mind. After a few months it starts paying.' });
A('language', 'Learn a language', 'mind', [-1.6, 0, 1, 3.8, .6], 0, { p: 1, s: 'Lingo' });
A('games', 'Video games', 'play', [-.8, -1.2, 5, .5, .4], 0, { p: 1, s: 'Games' });
A('guitar', 'Guitar', 'play', [-1, 0, 3.8, 1.8, 0], 0, { p: 1 });
A('paint', 'Paint', 'play', [-.8, 0, 3.5, 1.5, 0], -3, { p: 1 });
A('tv', 'Watch TV', 'play', [.8, -1, 3, -.8, 0], 0, { s: 'TV' });
A('garden', 'Garden', 'play', [-1.5, 2, 3, 0, 0], -2, { win: [6, 19], off: .3, p: 1 });
A('scroll', 'Doomscroll', 'chaos', [-.5, 0, 2, -1.5, -.5], 0, { p: 1, s: 'Scroll' });
A('gamble', 'Gamble', 'chaos', [-1, 0, 2, 0, 0], 0, { p: 1, tip: 'Loses money nearly every week. Nearly.' });
A('prank', 'Prank people', 'chaos', [-1.5, 0, 4, .5, -2.5], 0, { p: 1, s: 'Prank' });
A('conspiracy', 'Research "the truth"', 'chaos', [-1, 0, 1.5, -2.5, -2], 0, { p: 1, s: 'Truth' });
A('pigeon', 'Befriend pigeons', 'chaos', [-.5, 0, 2.5, 0, .5], 0, { win: [6, 19], p: 1, s: 'Pigeon' });
const START = ['sleep', 'nap', 'stare', 'job', 'chores', 'run', 'walk', 'eat', 'snack', 'coffee', 'friends', 'family', 'read', 'games', 'tv', 'scroll'];

/* Each pursuit's three endings: about an hour a day, three hours a day, and most of your waking life. */
const TIERS = {
  meditate: [['Calm-ish', 'You can sit still for eleven minutes. Ten of them are about lunch.'], ['The Still One', 'People lower their voices near you without knowing why.'], ['Ascended', 'You no longer cast a full shadow. The landlord still wants rent.']],

/** Where each stat is heading if you keep living this day, given how you are right now. */

/* The Longest Day: sound. A wooden music box. Painting an hour plays that hour's note, and while the year runs your

  $('#comGrid').innerHTML = COMS.map(c => {
    const open = c.id === 0 || SV.stars[c.id - 1], s = SV.stars[c.id] || 0;
    return `<button class="com${open ? '' : ' shut'}" ${open ? `data-com="${c.id}"` : ''}><span class="kick">Commission ${c.id + 1}</span><b>${open ? esc(c.who) : '? ? ?'}</b><p>${open ? '"' + esc(c.ask) + '"' : 'Earn a star in the one before.'}</p><span class="s">${[0, 1, 2].map(i => `<span class="${i < s ? '' : 'off'}">★</span>`).join('')}</span>${c.un ? `<div class="fnote">Reward: ${c.un.map(id => SV.un[id] ? ACT[id].n : '???').join(', ')}</div>` : ''}</button>`;
  }).join('');
}
function almanac() {
  show('alm');
  const got = Object.keys(SV.found).length;
  $('#almTag').textContent = `${got} of ${ENDINGS.length} endings found. Every year adds its headline and anything else you became along the way.`;
  const cell = e => SV.found[e.id] ? `<button class="e r${e.r}" data-end="${e.id}">${esc(e.t)}</button>` : `<button class="e un">${'★'.repeat(e.r)}</button>`;
  $('#almPur').innerHTML = Object.keys(TIERS).map(id => `<div class="prow"><span>${SV.un[id] ? esc(ACT[id].n) : '? ? ?'}</span>${ENDINGS.filter(e => e.act === id).map(cell).join('')}</div>`).join('');
  $('#almFates').innerHTML = ENDINGS.filter(e => !e.act).map(cell).join('');
  $('#almInfo').hidden = true;
}

/* ---------------------------------------------------------------- drawing and wiring */
function fit(cv) { const w = cv.clientWidth, d = Math.min(2, window.devicePixelRatio || 1); if (!w) return 0; if (cv.width !== Math.round(w * d)) { cv.width = cv.height = Math.round(w * d) } cv.getContext('2d').setTransform(d, 0, 0, d, 0, 0); return w }
function fitAll() { ['#homeDial', '#dial', '#yearDial'].forEach(s => fit($(s))) }
function frame(ts) {
  const spin = ts / 4000;
  if (screen === 'home') { const cv = $('#homeDial'), S = fit(cv); if (S) drawDial(cv.getContext('2d'), S, DEMO, { t: (ts / 700) % 24, hand: true, mood: .6, spin }) }
  else if (screen === 'plan') {
    const cv = $('#dial'), S = fit(cv), f = G.fore, free = G.plan.filter(x => !x).length;
    const mood = f ? ((f.T.e + f.T.h + f.T.j + f.T.b + f.T.f) / 5 - 50) / 30 : 0;
    if (S) drawDial(cv.getContext('2d'), S, G.plan, { t: (G.hover >= 0 ? G.hover : G.last) + .5, mood, spin, hover: G.hover, lock: G.lock, lines: [free ? free + 'h free' : 'Full day', free ? 'unplanned hours drift' : 'ready when you are'] });
  } else if (screen === 'year' && yr) {
    const cv = $('#yearDial'), S = fit(cv), hi = yr.R.hist[Math.min(yr.w, yr.R.hist.length - 1)];
    if (S) drawDial(cv.getContext('2d'), S, G.plan, { t: ((ts - yr.t0) / WEEK_MS * 24) % 24, hand: true, mood: (hi.st.j - 50) / 30, spin: spin * 3 });
  }
  requestAnimationFrame(frame);
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, a'); if (!t) return;
  AU.unlock();
  if (t.dataset.home != null) return home();
  if (t.dataset.act) return setBrush(t.dataset.act);
  if (t.dataset.no) { AU.deny(); return toast(t.dataset.no) }
  if (t.dataset.com) return startCom(+t.dataset.com);
  if (t.dataset.end) { const e = ENDINGS.find(x => x.id === t.dataset.end), box = $('#almInfo'); box.hidden = false; box.innerHTML = `<span class="rar r${e.r}">${RAR[e.r]}</span><br><b>${esc(e.t)}</b><br>${esc(e.d)}`; return AU.pick() }
  switch (t.id) {
    case 'goFree': return startFree();
    case 'goComs': case 'toComs': return coms();
    case 'goLife': case 'lifeAgain': return startLife();
    case 'goAlm': case 'toAlm': return almanac();
    case 'pback': return G.mode === 'com' ? coms() : home();
    case 'eraser': return setBrush('');
    case 'clear': G.plan = G.plan.map((id, h) => G.lock[h] ? id : G.life && G.life.base ? G.life.base[h] : null); AU.erase(); return refresh();
    case 'live': return live();
    case 'skip': return skipYear();
    case 'again': return openPlan();
    case 'next': return startCom(G.com.id + 1);
    case 'nextYear': return openPlan();
    case 'mute': SV.muted = !SV.muted; AU.setMuted(SV.muted); t.textContent = SV.muted ? 'sound off' : 'sound on'; return save();
  }
});
const dial = $('#dial');
dial.addEventListener('pointerdown', ev => { AU.unlock(); stroke = { down: true, last: -1, denied: false }; try { dial.setPointerCapture(ev.pointerId) } catch (e) { } paintAt(ev); ev.preventDefault() });
dial.addEventListener('pointermove', paintAt);
dial.addEventListener('pointerup', () => stroke.down = false);
dial.addEventListener('pointercancel', () => stroke.down = false);
dial.addEventListener('pointerleave', () => { if (!stroke.down) G.hover = -1 });
window.addEventListener('resize', fitAll);
AU.setMuted(SV.muted); $('#mute').textContent = SV.muted ? 'sound off' : 'sound on';
window.LD = { G, get SV() { return SV }, simulate, analyse, targets, startFree, startCom, startLife, live, skipYear, refresh, home, almanac, coms, ENDINGS };
home(); requestAnimationFrame(frame);

</script>
