<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SOMETHING'S WRONG · Kai.fun</title>
<meta name="description" content="A falling-block puzzle game run by ERRATA, a glitchy little TV that keeps seven ridiculous generated modifiers planned at all times: upside-down wells, butter floors, flashlights, fake game overs and worse.">
<meta name="theme-color" content="#0a0810">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* style1.css - "DEAD CHANNEL" art direction: base, header, CRT overlay, VHS tracking, glitch */
:root{--bg:#0a0810;--bg2:#120d1c;--panel:#161022;--panel2:#1d1530;--line:#2b2140;--line2:#3d3058;--ink:#e9e2ff;--dim:#8f86a8;--dim2:#5c5474;
--mag:#ff3d8b;--teal:#26e0c0;--lime:#b5f23d;--amber:#ffb13b;--vio:#9b7dff;--bone:#f0e6cc;--blue:#4f86ff;--red:#ff4b2b;
--vt:"VT323",ui-monospace,"Consolas",monospace;--mono:"JetBrains Mono",ui-monospace,"Cascadia Mono","Consolas",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;
  overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;background:none;border:0}
.hide{display:none!important}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:1500px;margin:0 auto;padding:0 16px 10px;
  background:radial-gradient(900px 480px at 50% -10%,rgba(255,61,139,.10),transparent 70%),radial-gradient(700px 400px at 100% 100%,rgba(38,224,192,.06),transparent 70%)}
#top{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none;position:relative;z-index:5}
#kai{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;background:var(--panel);border:1px solid var(--line);
  padding:8px 13px 8px 11px;border-radius:999px;line-height:1}
#kai:hover{border-color:var(--mag);color:#fff}
#osd{font-family:var(--vt);font-size:22px;letter-spacing:.08em;color:#f4f0ff;text-shadow:2px 0 rgba(255,61,139,.6),-2px 0 rgba(38,224,192,.5);white-space:nowrap}
#osd .rec{color:var(--red);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ib{appearance:none;border:1px solid var(--line);background:var(--panel);height:36px;min-width:36px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.ib:hover{border-color:var(--line2)}
.ib.sm{height:28px;min-width:34px;font-size:11px;letter-spacing:-.1em}
.ib svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .x{display:none}.ib.off .x{display:inline}.ib.off .wave{display:none}
.screen{flex:1;min-height:0;position:relative}
/* CRT: scanlines, vignette and a soft flicker over everything */
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%);animation:flick 4s infinite steps(60)}
@keyframes flick{0%,100%{opacity:.92}47%{opacity:.85}50%{opacity:1}53%{opacity:.88}}
/* VHS tracking band rolling down the screen now and then */
#vhs{position:fixed;left:0;right:0;top:-12%;height:9%;pointer-events:none;z-index:49;opacity:.0;
  background:linear-gradient(to bottom,transparent,rgba(255,255,255,.06) 40%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.04) 60%,transparent);
  animation:track 11s linear infinite}
@keyframes track{0%{top:-12%;opacity:0}70%{top:-12%;opacity:0}71%{opacity:1}100%{top:105%;opacity:1}}
/* chromatic aberration burst when a modifier fires */
body.glitching #app{animation:chroma .55s steps(8) 1}
@keyframes chroma{
  0%{filter:none;transform:none}
  12%{filter:drop-shadow(4px 0 0 rgba(255,61,139,.75)) drop-shadow(-4px 0 0 rgba(38,224,192,.75));transform:translate(-3px,1px) skewX(-2deg)}
  25%{filter:drop-shadow(-6px 0 0 rgba(255,61,139,.7)) drop-shadow(6px 0 0 rgba(38,224,192,.7));transform:translate(4px,-1px)}
  45%{filter:drop-shadow(2px 0 0 rgba(255,61,139,.6)) drop-shadow(-2px 0 0 rgba(38,224,192,.6));transform:translate(-1px,0) skewX(1deg)}
  70%{filter:hue-rotate(40deg) drop-shadow(1px 0 0 rgba(255,61,139,.5));transform:none}
  100%{filter:none;transform:none}}
body.calmfx.glitching #app{animation:none}
/* menu buttons */
.mb{font-family:var(--vt);font-size:21px;letter-spacing:.06em;color:var(--ink);background:var(--panel);border:1px solid var(--line2);
  padding:7px 16px 6px;border-radius:6px;line-height:1;box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.05)}
.mb:hover{border-color:var(--mag);color:#fff;text-shadow:1px 0 var(--mag),-1px 0 var(--teal)}
.mb:active{transform:translateY(1px);box-shadow:none}
#toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-20px);background:#0d0a14;border:1px solid var(--mag);color:#fff;
  font-family:var(--vt);font-size:20px;letter-spacing:.05em;padding:8px 16px 7px;border-radius:4px;opacity:0;pointer-events:none;z-index:40;
  transition:opacity .25s,transform .25s;box-shadow:3px 0 0 rgba(38,224,192,.45),-3px 0 0 rgba(255,61,139,.45);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
.face{display:block}

/* style2.css - home screen: block-letter logo, ERRATA, channel (mode) tapes, rank bar */
#home{display:flex;flex-direction:column;align-items:center;gap:6px;overflow-y:auto;overflow-x:hidden;padding-bottom:8px}
#title{width:min(900px,100%);height:clamp(120px,24vh,250px);flex:none}
#homeMid{display:flex;gap:22px;align-items:stretch;width:min(1100px,100%);flex:1 0 auto}
#homeAI{flex:0 0 250px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
#faceHome{width:200px;height:173px}
.hbub{position:relative;background:#f4efff;color:#140f1f;font-family:var(--vt);font-size:21px;line-height:1.05;padding:10px 13px 9px;border-radius:10px;
  min-height:54px;width:100%;box-shadow:4px 4px 0 var(--mag)}
.hbub::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#f4efff}
#modes{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.tape{position:relative;text-align:left;background:linear-gradient(180deg,#1c1530,#140f22);border:1px solid var(--line2);border-radius:10px;padding:12px 14px 12px 64px;
  min-height:92px;overflow:hidden;transition:transform .12s,border-color .12s}
.tape:hover{transform:translateY(-2px);border-color:var(--mag)}
.tape:active{transform:translateY(1px)}
.tape .ch{position:absolute;left:10px;top:12px;width:44px;height:44px;border-radius:6px;background:#08060c;border:1px solid var(--line2);
  font-family:var(--vt);font-size:26px;color:var(--lime);display:flex;align-items:center;justify-content:center;text-shadow:0 0 8px rgba(181,242,61,.6)}
.tape .nm{font-family:var(--vt);font-size:30px;line-height:.95;letter-spacing:.04em;color:#fff}
.tape .tg{font-size:10px;letter-spacing:.2em;color:var(--mag);margin-top:2px}
.tape .ds{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.35}
.tape .bs{position:absolute;right:12px;top:12px;font-family:var(--vt);font-size:18px;color:var(--amber)}
.tape .bs b{font-weight:400;color:var(--dim2);font-size:13px;letter-spacing:.1em;margin-right:4px}
.tape.main{grid-column:1/-1;min-height:110px;border-color:rgba(255,61,139,.55);background:linear-gradient(120deg,#2a1030,#160f24 60%)}
.tape.main .nm{font-size:42px;text-shadow:2px 0 rgba(255,61,139,.7),-2px 0 rgba(38,224,192,.6)}
.tape.main .ch{width:44px;height:84px;font-size:30px}
.tape.locked{opacity:.55;filter:grayscale(.7)}
.tape.locked .nm::after{content:" 🔒";font-size:20px}
.tape .lk{font-size:11px;color:var(--amber);margin-top:4px}
.tape::after{content:"";position:absolute;right:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;
  background:repeating-radial-gradient(circle,#0b0812 0 6px,#211933 6px 8px);opacity:.6}
#homeBar{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(1100px,100%);flex:none;padding-top:8px;border-top:1px dashed var(--line2)}
#rankBox{flex:1;min-width:0}
#rankName{font-family:var(--vt);font-size:22px;color:#fff}
#rankName small{color:var(--dim);font-size:16px;margin-right:6px}
#rankBar{height:8px;background:#0b0812;border:1px solid var(--line2);border-radius:4px;overflow:hidden;margin:4px 0;max-width:420px}
#rankFill{height:100%;width:0;background:linear-gradient(90deg,var(--mag),var(--amber));box-shadow:0 0 10px rgba(255,61,139,.6)}
#rankNext{font-size:11px;color:var(--dim)}
#homeBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#codexN{color:var(--lime)}
@media (max-width:760px){
  #title{height:clamp(96px,17vh,150px)}
  #homeMid{flex-direction:column;gap:10px}
  #homeAI{flex:none;flex-direction:row;align-items:center;gap:10px;padding:0}
  #faceHome{width:88px;height:76px;flex:none}
  .hbub{font-size:18px;min-height:0;box-shadow:3px 3px 0 var(--mag)}
  .hbub::before{top:50%;left:-9px;margin:-9px 0 0;border:9px solid transparent;border-left:0;border-right-color:#f4efff}
  #modes{grid-template-columns:1fr 1fr;gap:8px}
  .tape{padding:9px 10px 10px 10px;min-height:0}
  .tape .ch{position:static;width:auto;height:auto;display:inline-flex;border:0;background:none;font-size:18px;margin-bottom:2px}
  .tape.main .ch{width:auto;height:auto;font-size:20px}
  .tape .nm{font-size:23px}.tape.main .nm{font-size:32px}
  .tape .ds{display:none}.tape.main .ds{display:block}
  .tape .bs{top:8px;right:9px;font-size:15px}
  #homeBar{flex-direction:column;align-items:stretch;gap:8px}
  #homeBtns{justify-content:space-between}
  #homeBtns .mb{flex:1;font-size:17px;padding:8px 4px}
  #osd{font-size:17px}
}

/* style3.css - game screen: HUD, well, hold/next, ERRATA's panel, the 7-card plan, touch pad */
#game{display:flex;flex-direction:column;gap:6px}
#gHud{display:flex;align-items:center;gap:18px;flex:none;font-family:var(--vt);font-size:22px;padding:0 4px}
.hv{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.hk{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim)}
#hMode{color:var(--mag);letter-spacing:.06em}
#hScore{color:#fff;min-width:80px;text-shadow:1px 0 rgba(255,61,139,.6),-1px 0 rgba(38,224,192,.5)}
#bPause{margin-left:auto}
#gMain{flex:1;min-height:0;display:grid;grid-template-columns:140px minmax(0,1fr) 120px 330px;gap:14px}
#lcol,#rcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 6px 4px}
.lbl{font-size:10px;letter-spacing:.24em;color:var(--dim);margin:0 0 2px 3px}
#holdCv{width:100%;height:80px;display:block}
#nextCv{width:100%;height:290px;display:block}
#holdCv.jam{opacity:.35}
#stats{font-size:11px;color:var(--dim);line-height:1.75;padding:2px 4px}
#stats b{color:var(--ink);font-weight:700;float:right}
#wellWrap{position:relative;min-width:0;min-height:0;touch-action:none}
#cv{position:absolute;inset:0;display:block}
#fakeOver{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,0,8,.82);z-index:3;
  animation:foIn .2s steps(3)}
@keyframes foIn{from{opacity:0;transform:scaleY(.02)}to{opacity:1;transform:none}}
.fo1{font-family:var(--vt);font-size:clamp(44px,8vw,84px);color:var(--red);letter-spacing:.06em;text-shadow:3px 0 var(--mag),-3px 0 var(--teal)}
.fo2{font-family:var(--vt);font-size:22px;color:var(--dim);animation:blink 1s steps(1) infinite}
#fakeOver.jk .fo1::after{content:" ...JK";color:var(--lime)}
#pauseOv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(8,6,12,.86);z-index:4}
.pt{font-family:var(--vt);font-size:54px;color:#fff;letter-spacing:.1em;margin-bottom:8px}
#pauseOv .mb{min-width:200px}
/* ERRATA's panel */
#ai{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
#aiTop{display:flex;gap:8px;align-items:flex-start;flex:none}
#face{width:110px;height:95px;flex:none}
#bubble{position:relative;flex:1;min-width:0;background:#f4efff;color:#140f1f;font-family:var(--vt);font-size:19px;line-height:1.02;border-radius:9px;
  padding:7px 10px;min-height:70px;box-shadow:3px 3px 0 var(--mag);overflow:hidden;word-wrap:break-word}
#bubble::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-left:0;border-right-color:#f4efff}
#bubble.pop{animation:bpop .22s ease-out}
@keyframes bpop{0%{transform:scale(.92) rotate(-1deg)}60%{transform:scale(1.03)}100%{transform:none}}
#nowCard{flex:none;border-radius:8px;border:1px solid var(--line2);background:#0e0a16;padding:8px 10px;position:relative;overflow:hidden;min-height:66px}
#nowCard .nl{font-size:10px;letter-spacing:.22em;color:var(--dim);display:flex;justify-content:space-between}
#nowCard .nl .air{color:var(--red)}
#nowCard .nn{font-family:var(--vt);font-size:24px;line-height:1;color:#fff;margin-top:3px;padding-right:56px}
#nowCard .ni{position:absolute;right:10px;bottom:12px;font-size:22px}
#nowCard .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--mag);box-shadow:0 0 8px var(--mag)}
#nowCard.good .bar{background:var(--teal);box-shadow:0 0 8px var(--teal)}
#nowCard.live{border-color:var(--mag);background:linear-gradient(110deg,#2a0f22,#0e0a16 70%)}
#nowCard.live.good{border-color:var(--teal);background:linear-gradient(110deg,#0b2622,#0e0a16 70%)}
#nowCard.flash{animation:nflash .5s steps(5)}
@keyframes nflash{0%,40%{background:#fff;color:#000}50%{background:var(--mag)}100%{}}
#qHead{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.22em;color:var(--dim);flex:none;padding:0 2px}
#qHead span:first-child{color:var(--lime)}
#queue{display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
.qc{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--mag);border-radius:6px;padding:5px 8px 5px 6px;transition:transform .3s,opacity .3s}
.qc.weird{border-left-color:var(--vio)}.qc.good{border-left-color:var(--teal)}
.qc:first-child{border-color:var(--line2);background:var(--panel2)}
.qc .qi{height:36px;border-radius:5px;background:#08060c;display:flex;align-items:center;justify-content:center;font-size:17px;letter-spacing:-.2em;overflow:hidden}
.qc .qn{font-family:var(--vt);font-size:18px;line-height:.98;color:#fff;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qc .qm{font-size:10px;color:var(--dim);margin-top:2px;white-space:nowrap}
.qc .qm .pip{letter-spacing:-.05em;color:var(--amber)}
.qc .qt{font-family:var(--vt);font-size:22px;color:var(--amber);text-align:right;min-width:42px}
.qc .qt small{display:block;font-family:var(--mono);font-size:9px;color:var(--dim2);letter-spacing:.1em}
.qc.enter{animation:qin .55s ease-out}
@keyframes qin{0%{opacity:0;transform:translateX(30px) skewX(-12deg);filter:drop-shadow(3px 0 var(--mag)) drop-shadow(-3px 0 var(--teal))}100%{opacity:1;transform:none}}
.qc.soon .qt{color:var(--red);animation:blink .5s steps(1) infinite}
#touch{display:none}

/* style4.css - codex / how-to / settings / results panels + responsive game layout */
.panel{display:flex;flex-direction:column;gap:10px;overflow:hidden}
.ph{display:flex;align-items:center;gap:14px;flex:none}
.ph h2{font-family:var(--vt);font-weight:400;font-size:34px;letter-spacing:.06em;color:#fff;flex:1;text-shadow:2px 0 rgba(255,61,139,.6),-2px 0 rgba(38,224,192,.5)}
.ph span{font-family:var(--vt);font-size:20px;color:var(--lime)}
#codexGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;align-content:start;padding:2px 2px 14px}
.cx{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--mag);border-radius:7px;padding:9px 10px;display:grid;grid-template-columns:38px 1fr;gap:4px 10px}
.cx.weird{border-left-color:var(--vio)}.cx.good{border-left-color:var(--teal)}
.cx .ci{grid-row:span 2;font-size:24px;display:flex;align-items:center;justify-content:center;background:#08060c;border-radius:6px;height:38px}
.cx .cn{font-family:var(--vt);font-size:21px;line-height:1;color:#fff}
.cx .ck{font-size:9.5px;letter-spacing:.16em;color:var(--dim)}
.cx .cd{grid-column:1/-1;font-size:11.5px;color:var(--dim);line-height:1.4}
.cx .cs{grid-column:1/-1;font-size:10px;color:var(--amber)}
.cx.unk{border-left-color:var(--line2);opacity:.6}
.cx.unk .ci{color:var(--dim2);font-family:var(--vt)}
#howBody,#setBody{flex:1;overflow-y:auto;max-width:860px;font-size:13px;line-height:1.6;color:var(--ink);padding-bottom:18px}
#howBody h3,#setBody h3{font-family:var(--vt);font-weight:400;font-size:24px;color:var(--amber);margin:14px 0 4px}
#howBody p{color:var(--dim);margin:4px 0}
#howBody kbd{font-family:var(--mono);font-size:11px;background:#08060c;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:#fff}
.krow{display:grid;grid-template-columns:200px 1fr;gap:4px 14px}
.srow{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.srow label{min-width:140px;color:var(--dim)}
.srow input[type=range]{width:200px;accent-color:var(--mag)}
.skins{display:flex;flex-wrap:wrap;gap:8px}
.skin{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:96px}
.skin canvas{width:72px;height:36px}
.skin span{font-family:var(--vt);font-size:17px}
.skin small{font-size:9.5px;color:var(--amber)}
.skin.on{border-color:var(--mag);box-shadow:0 0 0 1px var(--mag)}
.skin.locked{opacity:.45}
#results{display:flex;align-items:center;justify-content:center;overflow-y:auto}
#resCard{width:min(560px,100%);background:linear-gradient(180deg,#1b1229,#100b18);border:1px solid var(--line2);border-radius:14px;padding:20px 22px;text-align:center;
  box-shadow:6px 6px 0 rgba(255,61,139,.35)}
#resCard .rt{font-family:var(--vt);font-size:52px;line-height:1;color:#fff;letter-spacing:.05em;text-shadow:3px 0 rgba(255,61,139,.7),-3px 0 rgba(38,224,192,.6)}
#resCard .rs{font-family:var(--vt);font-size:64px;line-height:1;color:var(--amber);margin:8px 0 2px}
#resCard .rb{font-size:11px;letter-spacing:.2em;color:var(--lime);min-height:16px}
#resCard .rg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
#resCard .rg div{background:#0b0812;border:1px solid var(--line);border-radius:7px;padding:6px}
#resCard .rg b{display:block;font-family:var(--vt);font-size:26px;font-weight:400;color:#fff}
#resCard .rg span{font-size:9.5px;letter-spacing:.14em;color:var(--dim)}
#resCard .rx{font-size:12px;color:var(--dim);margin:6px 0;line-height:1.5}
#resCard .rx b{color:var(--lime)}
#resCard .rq{font-family:var(--vt);font-size:20px;color:var(--ink);margin:10px 0;min-height:22px}
#resCard .rbtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
@media (max-width:1100px){#gMain{grid-template-columns:110px minmax(0,1fr) 96px 270px;gap:10px}}
/* phones: ERRATA on top, the plan as a strip of 7 chips, well in the middle, touch pad below */
@media (max-width:760px){
  #app{padding:0 10px 6px}
  #top{height:44px}

<body>

<script>
"use strict";
// ===== util.js =====
// util.js - SOMETHING'S WRONG: namespace, seeded randomness, storage, small helpers
const SW = window.SW = {};
SW.W = 10;          // well width
SW.H = 22;          // total rows (2 hidden spawn rows on top)
SW.HID = 2;
SW.VIS = 20;
SW.$ = id => document.getElementById(id);
SW.el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
SW.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
SW.lerp = (a, b, t) => a + (b - a) * t;
SW.now = () => performance.now() / 1000;

// mulberry32: small fast seeded PRNG. rng() -> [0,1)
SW.rng = seed => {
  let a = seed >>> 0;
  const f = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.int = n => Math.floor(f() * n);
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.range = (a, b) => a + f() * (b - a);
  f.chance = p => f() < p;
  return f;
};
SW.hash = str => {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
};
SW.R = SW.rng((Date.now() ^ (Math.random() * 1e9)) >>> 0);   // cosmetic randomness (particles, lines)
SW.pick = arr => arr[Math.floor(Math.random() * arr.length)];
SW.shuffle = (arr, r) => { r = r || Math.random; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

// today's date key in local time, e.g. "2026-11-19"
SW.dayKey = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
SW.fmtTime = s => {
  s = Math.max(0, s);
  const m = Math.floor(s / 60), r = s - m * 60;
  return m + ':' + (r < 10 ? '0' : '') + r.toFixed(2);
};
SW.fmtNum = n => Math.floor(n).toLocaleString('en-US');

// localStorage wrapped so private windows / blocked storage never break the game
SW.store = {
  get(k, def) {
    try { const v = localStorage.getItem('sw_' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; }
  },
  set(k, v) { try { localStorage.setItem('sw_' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem('sw_' + k); } catch (e) { /* ignore */ } }
};

// make text look corrupted. amt 0..1
const GL = '▓▒░█▚▞▙▟#%&@$¤§';
SW.glitchText = (s, amt) => {
  if (amt <= 0) return s;
  let o = '';
  for (const ch of s) {
    const r = Math.random();
    if (ch !== ' ' && r < amt * 0.16) o += GL[Math.floor(Math.random() * GL.length)];
    else if (ch !== ' ' && r < amt * 0.24) o += ch + ch;
    else if (r < amt * 0.3) o += ch.toUpperCase();
    else o += ch;
  }
  return o;
};

// event bus so modules stay decoupled
SW.bus = {
  h: {},
  on(ev, fn) { (this.h[ev] = this.h[ev] || []).push(fn); },
  emit(ev, a, b) { const l = this.h[ev]; if (l) for (const fn of l) fn(a, b); }
};

SW.colors = {
  // block colours: original "dead channel" palette (not any brand scheme)
  piece: [null, '#ff3d8b', '#26e0c0', '#b5f23d', '#ffb13b', '#9b7dff', '#f0e6cc', '#4f86ff', '#5b5468', '#ff4b2b', '#2a2633'],
  // 8 = junk, 9 = bomb, 10 = wall
  mono: '#7dffcf'
};
SW.ui = {};   // filled by ui files

// ===== pieces.js =====
// pieces.js - the seven four-square blocks (own names), rotation states, kicks, the shuffle bag
SW.P = {};
// each block: name, box size, cells in the spawn rotation, colour index
SW.P.base = [
  { name: 'STICK', box: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]], c: 1 },
  { name: 'CHIP',  box: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]], c: 2 },
  { name: 'FORK',  box: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]], c: 3 },
  { name: 'ZIG',   box: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]], c: 4 },
  { name: 'ZAG',   box: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]], c: 5 },
  { name: 'HOOK',  box: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]], c: 6 },
  { name: 'CROOK', box: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]], c: 7 }
];
// rotate a cell list clockwise inside an N box
SW.P.rotCW = (cells, N) => cells.map(([x, y]) => [N - 1 - y, x]);
SW.P.makeRots = (cells, N) => {
  const r = [cells];
  for (let i = 1; i < 4; i++) r.push(SW.P.rotCW(r[i - 1], N));
  return r;
};
// build a piece definition. kind: 0..6 normal; special: 'giant' | 'tiny' | 'bomb'
SW.P.make = (kind, special) => {
  const b = SW.P.base[kind];
  let cells = b.cells, box = b.box, c = b.c;
  if (special === 'giant') {
    const out = [];
    for (const [x, y] of cells) out.push([x * 2, y * 2], [x * 2 + 1, y * 2], [x * 2, y * 2 + 1], [x * 2 + 1, y * 2 + 1]);
    cells = out; box = box * 2;
  } else if (special === 'tiny') { cells = [[0, 0]]; box = 1; }
  else if (special === 'bomb') { cells = [[0, 0]]; box = 1; c = 9; }
  else if (special === 'long5' || special === 'long6') {
    const L = special === 'long5' ? 5 : 6; cells = []; box = L; c = 1;
    for (let i = 0; i < L; i++) cells.push([i, 2]);
  }
  return { kind, special: special || '', box, c, rots: SW.P.makeRots(cells, box), name: special === 'bomb' ? 'BOMB' : ({ giant: 'GIANT ', tiny: 'TINY ', long5: 'LONG ', long6: 'LONGER ' }[special] || '') + b.name };
};
// wall kicks: tried in order after a rotation (generic, own table)
SW.P.kicks = [[0, 0], [-1, 0], [1, 0], [0, -1], [-1, -1], [1, -1], [-2, 0], [2, 0], [0, 1], [0, -2]];

// 7-bag: every block once per bag, order shuffled by the given rng
SW.P.bag = rng => {
  let bag = [];
  return () => {
    if (!bag.length) bag = SW.shuffle([0, 1, 2, 3, 4, 5, 6], rng);
    return bag.pop();
  };
};
// draw a small block preview into a canvas context (used by HOLD/NEXT panels)
SW.P.preview = (g, def, cx, cy, s, skin, mono) => {
  const cells = def.rots[0];
  let x0 = 9, y0 = 9, x1 = -9, y1 = -9;
  for (const [x, y] of cells) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const w = (x1 - x0 + 1) * s, h = (y1 - y0 + 1) * s;
  for (const [x, y] of cells) SW.Rn.cell(g, cx - w / 2 + (x - x0) * s, cy - h / 2 + (y - y0) * s, s, mono ? 'mono' : def.c, skin, 1);
};

// ===== board.js =====
// board.js - the 10x20 well: collision, locking, line clears, junk, melting, compacting
SW.B = {};
SW.B.empty = () => { const b = []; for (let y = 0; y < SW.H; y++) b.push(new Array(SW.W).fill(0)); return b; };
// walls from the "narrow well" modifier
SW.B.walls = M => [M ? M.wallL : 0, M ? M.wallR : 0];
SW.B.fits = (S, cells, px, py) => {
  const [wl, wr] = SW.B.walls(S.M), b = S.board;
  for (const [cx, cy] of cells) {
    const x = px + cx, y = py + cy;
    if (x < wl || x >= SW.W - wr || y >= SW.H) return false;
    if (y >= 0 && b[y][x]) return false;
  }
  return true;
};
// rows that are full inside the currently open columns
SW.B.fullRows = S => {
  const [wl, wr] = SW.B.walls(S.M), out = [];
  for (let y = 0; y < SW.H; y++) {
    let full = true;
    for (let x = wl; x < SW.W - wr; x++) if (!S.board[y][x]) { full = false; break; }
    if (full) out.push(y);
  }
  return out;
};
SW.B.removeRows = (S, rows) => {
  const set = new Set(rows), nb = [];
  for (let y = 0; y < SW.H; y++) if (!set.has(y)) nb.push(S.board[y]);
  while (nb.length < SW.H) nb.unshift(new Array(SW.W).fill(0));
  S.board = nb;
};
SW.B.height = S => {   // number of filled rows from the bottom (stack height)
  for (let y = 0; y < SW.H; y++) if (S.board[y].some(v => v)) return SW.H - y;
  return 0;
};
// push n junk rows up from the bottom; returns true if blocks were pushed off the top
SW.B.addJunk = (S, n, rng) => {
  let over = false;
  for (let i = 0; i < n; i++) {
    if (S.board[0].some(v => v)) over = true;
    S.board.shift();
    const row = new Array(SW.W).fill(8);
    row[Math.floor((rng || Math.random)() * SW.W)] = 0;
    S.board.push(row);
  }
  // shove the falling piece up so it isn't swallowed
  if (S.cur) for (let k = 0; k < n && !SW.B.fits(S, S.cur.cells, S.cur.x, S.cur.y); k++) S.cur.y--;
  return over;
};
SW.B.removeJunk = S => {
  const rows = [];
  for (let y = 0; y < SW.H; y++) if (S.board[y].some(v => v === 8) && S.board[y].every(v => v === 8 || v === 0)) rows.push(y);
  SW.B.removeRows(S, rows);
  return rows.length;
};
// surface blocks (nothing above them) - candidates for melting
SW.B.surface = S => {
  const out = [];
  for (let x = 0; x < SW.W; x++) for (let y = 0; y < SW.H; y++) if (S.board[y][x]) { out.push([x, y]); break; }
  return out;
};
// column gravity: every block falls straight down to fill holes
SW.B.compact = S => {
  let moved = 0;
  for (let x = 0; x < SW.W; x++) {
    const col = [];
    for (let y = 0; y < SW.H; y++) if (S.board[y][x]) col.push(S.board[y][x]);
    for (let y = SW.H - 1, i = col.length - 1; y >= 0; y--, i--) {
      const v = i >= 0 ? col[i] : 0;
      if (S.board[y][x] !== v) moved++;
      S.board[y][x] = v;
    }
  }
  return moved;
};
// blast a square area (bomb). returns list of destroyed cells
SW.B.blast = (S, cx, cy, r) => {
  const out = [];
  for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) {
    if (x < 0 || x >= SW.W || y < 0 || y >= SW.H) continue;
    if (S.board[y][x]) { out.push([x, y, S.board[y][x]]); S.board[y][x] = 0; }
  }
  return out;
};
// tallest column index
SW.B.tallest = S => {
  let best = 0, bh = -1;
  for (let x = 0; x < SW.W; x++) {
    let h = 0;
    for (let y = 0; y < SW.H; y++) if (S.board[y][x]) { h = SW.H - y; break; }
    if (h > bh) { bh = h; best = x; }
  }
  return best;
};
// ghost: how far the current piece can drop
SW.B.dropDist = (S, p) => {
  let d = 0;
  while (SW.B.fits(S, p.cells, p.x, p.y + d + 1)) d++;
  return d;
};

// ===== effects1.js =====
// effects1.js - modifier registry + the first batch of base effects (controls & camera)
// Each base effect: id, icon, kind (bad|weird|good), calm (gentle enough for Calm mode), min (chaos level needed),
// nm (name halves the generator mixes), desc (codex text), say (ERRATA's lines when it fires),
// apply(M, I, st, t) per frame into the modifier state M; optional on/off/tick(S, ...) for gameplay side effects.
SW.E = { list: [], by: {} };
SW.E.def = o => { o.calm = !!o.calm; o.min = o.min || 1; SW.E.list.push(o); SW.E.by[o.id] = o; };
SW.E.k = (I, a, b) => a + (b - a) * (SW.clamp(I, 1, 5) - 1) / 4;   // scale by intensity 1..5
SW.E.blankM = () => ({
  rev: 0, flip: 0, mirror: 0, rot: 0, tilt: 0, grav: 1, side: 0, invis: 0, flash: 0, spawn: '', slip: 0, shake: 0,
  liar: 0, mono: 0, zoom: 1, bounce: 0, wallL: 0, wallR: 0, noClear: 0, oneWay: 0, emoji: 0, tempo: 1, ghostLie: 0,
  wobble: 0, rgb: 0, lowres: 0, noHold: 0, scramble: 0, sway: 0, lag: 0, lockMul: 1, disco: 0, scoreMul: 1, pulse: 0,
  stat: 0, wind: 0, blink: 0, far: 0, noNext: 0, focus: null
});
const K = SW.E.k;

SW.E.def({ id: 'rev', icon: '⇄', kind: 'bad', min: 1, nm: [['Backwards', 'Steering'], ['Reversed', 'Controls'], ['Opposite', 'Day']],
  desc: 'Left is right and right is left. Your thumbs will figure it out right as it ends.',
  say: ['Left is right now. I checked.', 'I swapped your wires. Both of them.', 'Steering by opposites!'],
  apply(M) { M.rev = 1; } });

SW.E.def({ id: 'flip', icon: '⥯', kind: 'bad', min: 2, nm: [['Upside-Down', 'Well'], ['Topsy', 'Turvy'], ['Upside-Down', ''], ['Australian', 'Broadcast']],
  desc: 'The picture is flipped vertically. Blocks still fall "down". Down is now up. Good luck.',
  say: ['Flipping the picture. Gravity didn\'t get the memo.', 'Australia mode.', 'The floor is the ceiling now.'],
  apply(M) { M.flip = 1; } });

SW.E.def({ id: 'mirror', icon: '◫', kind: 'weird', calm: true, min: 1, nm: [['Mirror', 'World'], ['Looking-Glass', 'Well'], ['Backwards', 'Reflection']],
  desc: 'The picture is mirrored left to right, but your controls are not. Pressing left moves it... visually right.',
  say: ['Mirror, mirror, on the well.', 'Everything is backwards except you.', 'Reflection time.'],
  apply(M) { M.mirror = 1; } });

SW.E.def({ id: 'spin', icon: '↻', kind: 'bad', min: 2, nm: [['Spinning', 'Screen'], ['Revolving', 'Door'], ['Rotisserie', 'Cam']],
  desc: 'The whole screen slowly turns, faster at higher intensity.',
  say: ['Wheee. Wait, you\'re not enjoying it?', 'Rotating the broadcast.', 'Round and round we go.'],
  on(S, I, st) { st.dir = Math.random() < 0.5 ? -1 : 1; },
  apply(M, I, st, t) { M.rot += st.dir * t * K(I, 14, 60); } });

  'Weekend', 'Festival', '(Live)', 'Reloaded', 'Express', 'Returns', 'of the Damned', 'Starter Pack', 'Encore',
  '(Bootleg)', 'Free Trial', 'Again', 'Forever', '64', '3000', '(Beta)', 'Adventure', 'Spectacular'];
const TWISTS = [
  { id: 'pulse', words: ['Pulsing', 'Flickering', 'On-Off', 'Stuttering'] },
  { id: 'quick', words: ['Quick', 'Flash', 'Snap', 'Blink-And-Miss-It'] },
  { id: 'long', words: ['Lingering', 'Long-Playing', 'Extended', 'Slow-Burn'] }];
SW.Gen.INT_WORDS = INT_WORDS;

// cfg: { rng, chaos (1..), calm (bool), combo: force combo count, last: [recent ids] }
SW.Gen.make = cfg => {
  const r = cfg.rng, chaos = Math.max(1, cfg.chaos);
  let pool = SW.E.list.filter(e => e.min <= chaos && (!cfg.calm || e.calm) && !(cfg.last || []).includes(e.id));
  if (!pool.length) pool = SW.E.list.filter(e => !cfg.calm || e.calm);
  // helpful ones show up regularly so it isn't pure pain
  const goodP = cfg.calm ? 0.4 : SW.clamp(0.26 - chaos * 0.008, 0.14, 0.26);
  const wantGood = r() < goodP;
  let sub = pool.filter(e => (e.kind === 'good') === wantGood);
  if (!sub.length) sub = pool;
  const first = sub[Math.floor(r() * sub.length)];
  const fx = [first];
  // combos at higher chaos
  let nCombo = cfg.combo != null ? cfg.combo : 0;
  if (cfg.combo == null && !cfg.calm && chaos >= 4 && first.kind !== 'good') {
    const p = Math.min(0.55, (chaos - 3) * 0.075);
    if (r() < p) nCombo = 1;
    if (chaos >= 10 && r() < 0.15) nCombo = 2;
  }
  for (let i = 0; i < nCombo; i++) {
    const c = pool.filter(e => !fx.includes(e) && e.kind !== 'good' && e.id !== 'fake');
    if (c.length) fx.push(c[Math.floor(r() * c.length)]);
  }
  // intensity
  const cap = cfg.calm ? 2 : SW.clamp(Math.floor(2 + chaos / 2.4), 2, 5);
  let I = 1 + Math.floor(Math.pow(r(), chaos < 6 ? 1.35 : 0.85) * cap);
  if (cfg.boost) I = Math.min(5, I + cfg.boost);
  // twist
  let twist = null;
  if (!cfg.calm && chaos >= 3 && r() < 0.18) twist = TWISTS[Math.floor(r() * TWISTS.length)];
  let dur = 4 + r() * 8;
  if (twist && twist.id === 'quick') { dur = 4 + r() * 1.5; I = Math.min(5, I + 1); }
  if (twist && twist.id === 'long') { dur = 10 + r() * 2; I = Math.max(1, I - 1); }
  if (cfg.short) dur = Math.max(4, dur * 0.75);
  dur = SW.clamp(dur, 4, 12);
  const gap = Math.max(0.9, 3.0 - chaos * 0.14) + r() * 1.3;
  // name
  const pa = first.nm[Math.floor(r() * first.nm.length)];
  let core;
  if (fx.length === 1) core = pa[1] ? pa[0] + ' ' + pa[1] : pa[0];
  else {
    const last = fx[fx.length - 1], pb = last.nm[Math.floor(r() * last.nm.length)];
    core = pa[0] + (fx.length === 3 ? ' ' + fx[1].nm[0][0] : '') + ' ' + (pb[1] || pb[0]);
  }
  const iw = INT_WORDS[I][Math.floor(r() * INT_WORDS[I].length)];
  let name = (twist ? twist.words[Math.floor(r() * twist.words.length)] + ' ' : '') + iw + ' ' + core;
  if (r() < 0.38) name += ' ' + SUFFIX[Math.floor(r() * SUFFIX.length)];
  const kind = fx.some(e => e.kind === 'bad') ? 'bad' : fx.some(e => e.kind === 'weird') ? 'weird' : 'good';
  SW.Gen.uid = (SW.Gen.uid || 0) + 1;
  return { uid: SW.Gen.uid, name, I, dur, gap, kind, twist: twist ? twist.id : '', ids: fx.map(e => e.id),
    icons: fx.map(e => e.icon), fx: fx.map(e => ({ e, I, st: {} })) };
};

// ===== director.js =====
// director.js - ERRATA's planner: always keeps 7 modifiers queued, fires them one after another, forever
SW.D = {};
SW.D.N = 7;
SW.D.chaos = (S, idx) => {
  const m = S.mode.id;
  if (m === 'calm') return 1.5;
  if (m === 'daily') return Math.min(16, 1 + idx * 0.14);
  if (m === 'sprint') return Math.min(10, 1.6 + S.lines / 7);
  if (m === 'melt') return Math.min(18, 6 + S.level * 0.9);
  if (m === 'roulette') return Math.min(16, 4 + S.level * 0.8);
  return Math.min(16, 1 + (S.level - 1) * 0.85 + S.dir.fired * 0.025);
};
SW.D.init = S => {
  const seed = S.mode.id === 'daily' ? SW.hash('plan-ahead-' + S.day) : (Math.random() * 4294967296) >>> 0;
  S.dir = { rng: SW.rng(seed), queue: [], active: null, phase: 'gap', t: S.mode.id === 'calm' ? 3.5 : 2.6, fired: 0, idx: 0, at: 0, hold: 0 };
  for (let i = 0; i < SW.D.N; i++) SW.D.plan(S, true);
};
SW.D.plan = (S, silent) => {
  const d = S.dir, last = d.queue.slice(-3).reduce((a, q) => a.concat(q.ids), []);
  if (d.active) last.push(...d.active.ids);
  const cfg = { rng: d.rng, chaos: SW.D.chaos(S, d.idx), calm: S.mode.id === 'calm', last };
  if (S.mode.id === 'melt') { cfg.combo = d.rng() < 0.6 ? 1 : 0; cfg.boost = 1; }
  if (S.mode.id === 'roulette') { cfg.combo = 2; cfg.short = true; }
  const mod = SW.Gen.make(cfg);
  if (d.idx === 0 && S.mode.id !== 'calm') mod.gap = Math.min(mod.gap, 2.6);
  d.idx++;
  d.queue.push(mod);
  if (!silent) SW.bus.emit('modPlan', mod);
  return mod;
};
SW.D.fire = S => {
  const d = S.dir, mod = d.queue.shift();
  d.active = mod; d.phase = 'active'; d.t = mod.dur; d.at = 0; d.fired++;
  for (const f of mod.fx) {
    if (f.e.on) f.e.on(S, f.I, f.st);
    SW.Save.seen(f.e.id, f.I);
  }
  S.stats.mods++;
  SW.bus.emit('modFire', mod);
  SW.D.plan(S);
};
SW.D.end = S => {
  const d = S.dir, mod = d.active;
  if (!mod) return;
  for (const f of mod.fx) if (f.e.off) f.e.off(S, f.I, f.st);
  d.active = null; d.phase = 'gap'; d.t = d.queue[0].gap;
  S.stats.survived++;
  SW.bus.emit('modEnd', mod);
};
// advance the plan and rebuild the modifier state M for this frame
SW.D.update = (S, dt) => {
  const d = S.dir;
  if (!d.hold) {
    d.t -= dt;
    if (d.phase === 'gap' && d.t <= 0) SW.D.fire(S);
    else if (d.phase === 'active') {
      d.at += dt;
      for (const f of d.active.fx) if (f.e.tick) f.e.tick(S, dt, f.I, f.st);
      if (d.t <= 0) SW.D.end(S);
    }
  }
  S.M = SW.E.blankM();
  if (d.active) {
    const on = d.active.twist !== 'pulse' || Math.sin(d.at * 5.5) > -0.2;
    if (on) for (const f of d.active.fx) if (f.e.apply) f.e.apply(S.M, f.I, f.st, d.at);
  }
};
// seconds until each queued card fires
SW.D.countdowns = S => {
  const d = S.dir, out = [];
  let acc = d.phase === 'gap' ? Math.max(0, d.t) : Math.max(0, d.t) + d.queue[0].gap;
  for (let i = 0; i < d.queue.length; i++) {
    out.push(acc);
    acc += d.queue[i].dur + (d.queue[i + 1] ? d.queue[i + 1].gap : 0);
  }
  return out;
};
// test/debug helper: run the planner forward quickly (game frozen)
SW.D.skip = (S, sec) => {
  const step = 1 / 30;
  for (let t = 0; t < sec; t += step) SW.D.update(S, step);
};
// force a specific base effect to fire next (codex/test use)
SW.D.force = (S, id, I) => {
  const e = SW.E.by[id];
  if (!e) return;
  if (S.dir.active) SW.D.end(S);
  const mod = { uid: ++SW.Gen.uid, name: SW.Gen.INT_WORDS[I || 3][0] + ' ' + e.nm[0][0] + (e.nm[0][1] ? ' ' + e.nm[0][1] : ''),
    I: I || 3, dur: 4, gap: 1, kind: e.kind, twist: '', ids: [id], icons: [e.icon], fx: [{ e, I: I || 3, st: {} }] };
  S.dir.queue.unshift(mod);
  SW.D.fire(S);
  S.dir.queue.length = Math.min(S.dir.queue.length, SW.D.N);
};

};
SW.G.create = mode => {
  const day = SW.dayKey();
  const seed = mode.id === 'daily' ? SW.hash('blocks-' + day) : (Math.random() * 4294967296) >>> 0;
  const S = {
    mode, day, board: SW.B.empty(), cur: null, nextQ: [], hold: null, holdUsed: false, special: [],
    score: 0, lines: 0, level: mode.startLevel || 1, combo: -1, b2b: false, time: 0, over: false, won: false, paused: false,
    fakeOver: 0, gravAcc: 0, sideAcc: 0, lockT: 0, lockRes: 0, pendingClear: false, clearing: null, soft: false,
    lagQ: [], M: SW.E.blankM(), rngP: SW.rng(seed), rngJ: SW.rng(seed ^ 0x9e3779b9),
    stats: { pieces: 0, quads: 0, maxCombo: 0, mods: 0, survived: 0, clears: 0, best4: 0 }
  };
  S.bag = SW.P.bag(S.rngP);

// put a fresh block at the top. returns false on top-out
SW.G.spawn = (S, fromKind) => {
  let kind = fromKind, special = '';
  if (kind == null) {
    kind = S.nextQ.shift(); S.nextQ.push(S.bag());
    special = S.special.length ? S.special.shift() : S.M.spawn;
  }
  if (special === 'stick') { kind = 0; special = ''; }
  if (special === 'long5' || special === 'long6') kind = 0;
  let def = SW.P.make(kind, special);
  const place = d => {
    const cells = d.rots[0];
    let maxY = 0; for (const c of cells) maxY = Math.max(maxY, c[1]);
    const p = { def: d, rot: 0, cells, x: Math.floor((SW.W - d.box) / 2), y: SW.HID - maxY, bounced: 0, slipped: 0, slide: null, born: S.time };
    for (let k = 0; k < 3; k++) { if (SW.B.fits(S, p.cells, p.x, p.y)) return p; p.y--; }
    return null;
  };
  let p = place(def);
  if (!p && special) { def = SW.P.make(kind, ''); p = place(def); }
  S.holdUsed = false; S.lockT = 0; S.lockRes = 0; S.gravAcc = 0; S.sideAcc = 0;
  if (!p) { S.cur = null; SW.G.topOut(S); return false; }
  S.cur = p;

  SW.bus.emit('spawn', p);

};
SW.G.tryMove = (S, dx, dy) => {
  const c = S.cur;
  if (!c || c.slide) return false;
  if (!SW.B.fits(S, c.cells, c.x + dx, c.y + dy)) return false;
  c.x += dx; c.y += dy;
  if (dx && S.lockT > 0 && S.lockRes < 15) { S.lockT = 0; S.lockRes++; }
  return true;
};
SW.G.nudge = (S, dir) => { if (SW.G.tryMove(S, dir, 0)) SW.FX.puff(S.cur, dir); };
SW.G.rotate = (S, dir, forced) => {
  const c = S.cur;

  const nr = (c.rot + dir + 4) % 4, cells = c.def.rots[nr];
  for (const [kx, ky] of SW.P.kicks) {

      g.restore();
    }
  }
  SW.FX.draw(g, s, t);
  // flashlight: darkness except a beam around the block
  if (M.flash) {
    let px = W / 2, py = H * 0.2;
    if (c) { let ax = 0, ay = 0; for (const [cx, cy] of c.cells) { ax += c.x + cx + 0.5; ay += c.y + cy + 0.5 - SW.HID; } px = ax / c.cells.length * s; py = ay / c.cells.length * s; }
    const r = M.flash * s, gr = g.createRadialGradient(px, py, r * 0.35, px, py, r);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(3,2,6,.97)');

  }
  if (M.stat > 0) {

    const q = Math.max(2, Math.round(s / 6));
    g.drawImage(SW.Rn.noise, Math.random() * 60, Math.random() * 60, 100, 100, 0, 0, W + q * 20, H + q * 20);
    g.globalAlpha = 1; g.imageSmoothingEnabled = true;
  }

// ===== render3.js =====
// render3.js - composite the well onto the screen through ERRATA's "camera" (flip, mirror, spin, zoom,
// shake, wobble, low-res, colour split) plus the glitch burst when a modifier fires
SW.Rn.tint = (dst, src, color) => {
  const g = dst.g;
  g.globalCompositeOperation = 'copy'; g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'multiply'; g.fillStyle = color; g.fillRect(0, 0, dst.c.width, dst.c.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-over';
  return dst.c;
};
SW.Rn.frame = (S, t, dt) => {
  const R = SW.Rn, g = R.g, dpr = R.dpr, M = S.M, cam = R.cam, low = SW.opts.calmFx;
  if (!R.pc) return;
  R.drawWell(S, t);
  const W = R.cv.width, H = R.cv.height, ww = R.off.width, wh = R.off.height;
  // camera targets, eased so flips and spins animate instead of snapping
  const ease = 1 - Math.pow(0.0015, dt);
  const tRot = (M.rot + M.tilt) * Math.PI / 180;
  cam.rot += (tRot - cam.rot) * ease;
  cam.zoom += (M.zoom - cam.zoom) * ease;
  cam.sx += ((M.mirror ? -1 : 1) - cam.sx) * ease * 0.8;
  cam.sy += ((M.flip ? -1 : 1) - cam.sy) * ease * 0.8;
  let fx = 0, fy = 0;
  if (M.focus === 'piece' && S.cur) {
    let ax = 0, ay = 0;
    for (const [cx, cy] of S.cur.cells) { ax += S.cur.x + cx + 0.5; ay += S.cur.y + cy + 0.5 - SW.HID; }
    fx = (ax / S.cur.cells.length) * R.pc - ww / 2; fy = (ay / S.cur.cells.length) * R.pc - wh / 2;
  }
  cam.fx += (fx - cam.fx) * ease; cam.fy += (fy - cam.fy) * ease;
  const shake = (low ? 0.3 : 1) * (M.shake + SW.FX.kickAmt) * dpr;
  const ox = (Math.random() - 0.5) * shake * 2 + (M.sway ? Math.sin(t * 1.3) * M.sway * dpr : 0);
  const oy = (Math.random() - 0.5) * shake * 2 + (M.sway ? Math.cos(t * 1.7) * M.sway * 0.4 * dpr : 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  // pick the source picture: plain, low-res, or glitched
  let src = R.off;
  if (M.lowres > 1) {
    const q = R.tmp[2], f = M.lowres;
    q.g.imageSmoothingEnabled = false; q.g.clearRect(0, 0, ww, wh);
    q.g.drawImage(R.off, 0, 0, ww / f, wh / f); q.g.drawImage(q.c, 0, 0, ww / f, wh / f, 0, 0, ww, wh);
    src = q.c;
  }
  g.save();
  g.translate(W / 2 + ox, H / 2 + oy);
  g.rotate(cam.rot);
  g.scale(cam.zoom * cam.sx, cam.zoom * cam.sy);
  g.translate(-ww / 2 - cam.fx, -wh / 2 - cam.fy);
  // bezel glow around the well
  g.shadowColor = 'rgba(255,61,139,.45)'; g.shadowBlur = 24 * dpr;
  g.fillStyle = '#05040a'; g.fillRect(-3 * dpr, -3 * dpr, ww + 6 * dpr, wh + 6 * dpr);
  g.shadowBlur = 0;
  const split = low ? 0 : Math.max(M.rgb, R.glitch > 0 ? R.glitch * 16 : 0) * dpr;
  const wob = M.wobble * dpr, gl = low ? 0 : R.glitch;
  const draw = (img, dx, op) => {
    g.globalCompositeOperation = op || 'source-over';
    if (!wob && gl <= 0) { g.drawImage(img, dx, 0); return; }
    const band = Math.max(2, Math.round(3 * dpr));
    for (let y = 0; y < wh; y += band) {
      let sx = wob ? Math.sin(y * 0.035 / dpr + t * 7) * wob : 0;
      if (gl > 0 && ((y / band + Math.floor(t * 30)) % 23) < 2) sx += (Math.random() - 0.5) * 60 * dpr * gl;
      g.drawImage(img, 0, y, ww, band, dx + sx, y, ww, band);
    }
  };
  if (split > 0.5) {
    g.fillStyle = '#000'; g.fillRect(0, 0, ww, wh);
    draw(R.tint(R.tmp[0], src, '#ff0000'), -split, 'lighter');
    draw(R.tint(R.tmp[1], src, '#00ffff'), split, 'lighter');
  } else draw(src, 0);
  g.globalCompositeOperation = 'source-over';
  // frame
  g.strokeStyle = 'rgba(255,61,139,.85)'; g.lineWidth = 2 * dpr; g.strokeRect(-1.5 * dpr, -1.5 * dpr, ww + 3 * dpr, wh + 3 * dpr);
  g.strokeStyle = 'rgba(38,224,192,.35)'; g.lineWidth = 1 * dpr; g.strokeRect(-5 * dpr, -5 * dpr, ww + 10 * dpr, wh + 10 * dpr);
  g.restore();
  // glitch bars across the whole screen
  if (gl > 0) {
    for (let i = 0; i < 4; i++) {
      const y = Math.random() * H, h = (2 + Math.random() * 14) * dpr;
      g.fillStyle = Math.random() < 0.5 ? 'rgba(255,61,139,.35)' : 'rgba(38,224,192,.3)';
      g.fillRect(0, y, W, h * gl);
    }
    R.glitch = Math.max(0, R.glitch - dt * 2.2);
  }
};

// ===== fx.js =====
// fx.js - particles, popups and screen kick. Positions are in cell units of the visible well.
SW.FX = { p: [], txt: [], beams: [], kickAmt: 0, squashK: 0 };
const vy = y => y - SW.HID;
SW.FX.add = (x, y, vx, vy2, c, life, size, kind) => {
  if (SW.FX.p.length > 700) SW.FX.p.shift();

};
SW.FX.kick = a => { SW.FX.kickAmt = Math.min(22, SW.FX.kickAmt + a); };
SW.FX.burst = (x, y, c, n) => {
  for (let i = 0; i < n; i++) SW.FX.add(x + 0.5, vy(y) + 0.5, (Math.random() - 0.5) * 9, (Math.random() - 0.8) * 9, c, 0.5 + Math.random() * 0.5, 0.12 + Math.random() * 0.2);
};
SW.FX.clearRows = (S, rows, free) => {
  for (const y of rows) {
    for (let x = 0; x < SW.W; x++) {
      const c = S.board[y][x] || 3;
      for (let k = 0; k < 3; k++) SW.FX.add(x + Math.random(), vy(y) + Math.random(), (Math.random() - 0.5) * 14 + (x - 4.5) * 0.8, -Math.random() * 10 - 2, c, 0.6 + Math.random() * 0.6, 0.14 + Math.random() * 0.2);
    }
    SW.FX.beams.push({ y: vy(y), life: 0.45, max: 0.45, row: 1, c: free ? '#26e0c0' : '#ffffff' });
  }

};
SW.FX.flashRows = () => { SW.FX.beams.push({ y: SW.VIS - 1, life: 0.4, max: 0.4, row: 1, c: '#26e0c0' }); };
SW.FX.beam = x => { SW.FX.beams.push({ x, life: 0.6, max: 0.6, col: 1, c: '#b5f23d' }); SW.FX.kick(8); };
SW.FX.trail = (c, d) => {
  if (d < 1) return;
  for (const [cx, cy] of c.cells) for (let k = 0; k < 2; k++)
    SW.FX.add(c.x + cx + Math.random(), vy(c.y + cy) + Math.random() * d, 0, 4 + Math.random() * 6, c.def.c, 0.25 + Math.random() * 0.2, 0.08, 'streak');
};
SW.FX.lockFlash = c => {
  for (const [cx, cy] of c.cells) SW.FX.add(c.x + cx + 0.5, vy(c.y + cy) + 0.5, 0, 0, '#ffffff', 0.18, 1, 'flash');
  let maxY = 0, ax = 0;
  for (const [cx, cy] of c.cells) { maxY = Math.max(maxY, cy); ax += cx; }
  for (let i = 0; i < 6; i++) SW.FX.add(c.x + ax / c.cells.length + 0.5 + (Math.random() - 0.5) * 2, vy(c.y + maxY) + 1, (Math.random() - 0.5) * 4, -Math.random() * 2, '#ffffff', 0.35, 0.07);
};
SW.FX.puff = (c, dir) => {
  if (!c) return;
  for (const [cx, cy] of c.cells) SW.FX.add(c.x + cx + 0.5 - dir * 0.6, vy(c.y + cy) + 0.5, -dir * (2 + Math.random() * 3), (Math.random() - 0.5) * 2, '#dfe8ff', 0.3, 0.1);
};
SW.FX.drip = (x, y, c) => {
  for (let i = 0; i < 6; i++) SW.FX.add(x + 0.5, vy(y) + 0.5, (Math.random() - 0.5) * 2, 2 + Math.random() * 6, c, 0.8, 0.16, 'drop');
};
SW.FX.boom = (x, y, gone) => {
  for (const [gx, gy, c] of gone) SW.FX.burst(gx, gy, c, 5);
  for (let i = 0; i < 40; i++) { const a = Math.random() * 6.28, v = 4 + Math.random() * 12; SW.FX.add(x + 0.5, vy(y) + 0.5, Math.cos(a) * v, Math.sin(a) * v, i % 2 ? '#ff4b2b' : '#ffd88a', 0.5 + Math.random() * 0.4, 0.2); }
  SW.FX.add(x + 0.5, vy(y) + 0.5, 0, 0, '#fff3c0', 0.35, 5, 'ring');
};
SW.FX.squash = () => { SW.FX.squashK = 1; };
SW.FX.pop = (text, x, y, c, big) => { SW.FX.txt.push({ text, x, y, c: c || '#fff', life: 1.3, max: 1.3, big: !!big }); };
SW.FX.update = dt => {
  const P = SW.FX.p;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.life -= dt;
    if (p.life <= 0) { P.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'sq' || p.kind === 'drop') p.vy += 22 * dt;
  }
  for (let i = SW.FX.txt.length - 1; i >= 0; i--) { const q = SW.FX.txt[i]; q.life -= dt; q.y -= dt * 1.2; if (q.life <= 0) SW.FX.txt.splice(i, 1); }
  for (let i = SW.FX.beams.length - 1; i >= 0; i--) { const b = SW.FX.beams[i]; b.life -= dt; if (b.life <= 0) SW.FX.beams.splice(i, 1); }

  SW.FX.squashK *= Math.pow(0.0005, dt);
};
SW.FX.draw = (g, s) => {
  for (const b of SW.FX.beams) {
    const k = b.life / b.max;
    g.fillStyle = SW.Rn.hexA(b.c, (0.7 * k).toFixed(3));
    if (b.row) g.fillRect(-s, b.y * s + s * 0.5 * (1 - k), (SW.W + 2) * s, s * k);
    else g.fillRect(b.x * s + s * 0.5 * (1 - k), 0, s * k, SW.VIS * s);
  }
  for (const p of SW.FX.p) {
    const k = p.life / p.max, col = typeof p.c === 'number' ? SW.colors.piece[p.c] || '#fff' : p.c;
    g.globalAlpha = Math.min(1, k * 1.5);
    g.fillStyle = col;
    if (p.kind === 'streak') g.fillRect(p.x * s, p.y * s, Math.max(1, s * 0.06), s * 0.9);
    else if (p.kind === 'flash') { g.globalAlpha = k * 0.8; g.fillRect((p.x - 0.5) * s, (p.y - 0.5) * s, s, s); }
    else if (p.kind === 'ring') { g.strokeStyle = col; g.lineWidth = s * 0.3 * k; g.beginPath(); g.arc(p.x * s, p.y * s, s * p.size * (1 - k) + s, 0, 7); g.stroke(); }
    else { const z = p.size * s; g.fillRect(p.x * s - z / 2, p.y * s - z / 2, z, z); }
  }

  for (const q of SW.FX.txt) {
    const k = q.life / q.max, sz = s * (q.big ? 1.15 : 0.72) * (1 + (1 - Math.min(1, (1 - k) * 6)) * 0.4);
    g.globalAlpha = Math.min(1, k * 2.5);
    g.font = sz + 'px "VT323", monospace';
    g.fillStyle = '#000'; g.fillText(q.text, q.x * s + s * 0.06, q.y * s + s * 0.06);
    g.fillStyle = q.c; g.fillText(q.text, q.x * s, q.y * s);
  }

};
SW.FX.reset = () => { SW.FX.p.length = 0; SW.FX.txt.length = 0; SW.FX.beams.length = 0; SW.FX.kickAmt = 0; };

// ===== audio.js =====
// audio.js - procedural WebAudio sound effects (no samples)
SW.A = { ctx: null, on: true, sfxVol: 0.7, musVol: 0.5 };
SW.A.init = () => {
  if (SW.A.ctx) { if (SW.A.ctx.state === 'suspended') SW.A.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    const ctx = SW.A.ctx = new C();
    SW.A.master = ctx.createGain(); SW.A.master.gain.value = SW.A.on ? 1 : 0;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5;
    SW.A.master.connect(comp); comp.connect(ctx.destination);
    SW.A.sfx = ctx.createGain(); SW.A.sfx.gain.value = SW.A.sfxVol; SW.A.sfx.connect(SW.A.master);
    SW.A.mus = ctx.createGain(); SW.A.mus.gain.value = SW.A.musVol * 0.55; SW.A.mus.connect(SW.A.master);
    const len = ctx.sampleRate;
    SW.A.nbuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = SW.A.nbuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { SW.A.ctx = null; }
};
SW.A.setOn = v => { SW.A.on = v; if (SW.A.master) SW.A.master.gain.value = v ? 1 : 0; };
SW.A.setVol = (sfx, mus) => {
  SW.A.sfxVol = sfx; SW.A.musVol = mus;
  if (SW.A.sfx) SW.A.sfx.gain.value = sfx;
  if (SW.A.mus) SW.A.mus.gain.value = mus * 0.55;
};
// one oscillator blip
SW.A.tone = (f, dur, type, vol, f2, delay, dest) => {
  const c = SW.A.ctx; if (!c || !SW.A.on) return;
  const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || SW.A.sfx); o.start(t); o.stop(t + dur + 0.05);
};
SW.A.noise = (dur, vol, freq, type, delay, f2, dest) => {
  const c = SW.A.ctx; if (!c || !SW.A.on) return;
  const t = c.currentTime + (delay || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = SW.A.nbuf; s.loop = true;
  f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq || 2000, t);

  g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || SW.A.sfx);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
};
const A = SW.A;
A.move = () => A.tone(520, 0.03, 'square', 0.05);
A.bump = () => A.tone(140, 0.05, 'square', 0.05);
A.rotate = f => A.tone(f ? 380 : 660, 0.05, 'triangle', 0.09, f ? 300 : 880);

A.lock = () => A.tone(200, 0.06, 'triangle', 0.12, 120);
A.thud = () => { A.tone(80, 0.25, 'sine', 0.4, 35); A.noise(0.2, 0.25, 500); };

A.boing = () => A.tone(180, 0.28, 'sine', 0.3, 620);

A.drip = () => A.tone(1400, 0.09, 'sine', 0.12, 500);
A.zap = () => { A.tone(1800, 0.35, 'sawtooth', 0.12, 90); A.noise(0.3, 0.15, 5000, 'highpass'); };
A.junk = () => { A.tone(60, 0.22, 'square', 0.18, 40); A.noise(0.18, 0.2, 700); };

// ===== music.js =====
// music.js - ERRATA's generated soundtrack: a seeded minor-key synth loop that grows layers with the level
SW.Mu = { playing: false, step: 0, next: 0, tempo: 1, energy: 1, style: 'game', stutter: 0 };
const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10], harm: [0, 2, 3, 5, 7, 8, 11] };

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
SW.Mu.compose = seed => {
  const r = SW.rng(seed), keys = Object.keys(SCALES);
  const song = { root: 45 + r.int(7), scale: SCALES[keys[r.int(keys.length)]], prog: PROGS[r.int(PROGS.length)], bpm: 104 + r.int(18) };

// input.js - keyboard (with auto-repeat), on-screen buttons, swipe gestures and gamepads
SW.In = { held: {}, dir: 0, das: 0, DAS: 0.15, ARR: 0.045, pad: {}, swipe: null };
const KEYMAP = {
  ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowDown: 'D', KeyS: 'D', Space: 'H',
  ArrowUp: 'CW', KeyX: 'CW', KeyW: 'CW', KeyZ: 'CCW', KeyQ: 'CCW', ControlLeft: 'CCW', ControlRight: 'CCW',
  KeyC: 'HOLD', ShiftLeft: 'HOLD', ShiftRight: 'HOLD', KeyP: 'PAUSE', Escape: 'PAUSE', KeyM: 'MUTE'
};
SW.In.press = a => {
  const S = SW.S;
  if (a === 'MUTE') { SW.ui.toggleSound(); return; }
  if (a === 'PAUSE') { SW.ui.togglePause(); return; }
  if (!S || S.over || SW.ui.screen !== 'game') return;
  if (S.paused) return;
  if (SW.In.held[a]) return;
  SW.In.held[a] = true;
  if (a === 'L' || a === 'R') { SW.In.dir = a === 'L' ? -1 : 1; SW.In.das = 0; }
  if (a === 'D') { S.soft = true; SW.G.act(S, 'D'); return; }
  SW.G.act(S, a);
};
SW.In.release = a => {
  SW.In.held[a] = false;
  if ((a === 'L' && SW.In.dir === -1) || (a === 'R' && SW.In.dir === 1)) SW.In.dir = SW.In.held.L ? -1 : SW.In.held.R ? 1 : 0;
  if (a === 'D' && SW.S) SW.S.soft = false;
};
SW.In.releaseAll = () => { for (const k in SW.In.held) SW.In.release(k); SW.In.dir = 0; };
SW.In.update = dt => {
  SW.In.pollPad();
  const S = SW.S;
  if (!S || S.over || S.paused || !SW.In.dir) return;
  SW.In.das += dt;
  if (SW.In.das > SW.In.DAS) {
    while (SW.In.das > SW.In.DAS + SW.In.ARR) { SW.In.das -= SW.In.ARR; SW.G.act(S, SW.In.dir < 0 ? 'L' : 'R'); }
  }
};
SW.In.init = () => {
  addEventListener('keydown', e => {
    const a = KEYMAP[e.code];
    if (SW.ui.screen !== 'game') {
      if (e.code === 'Escape') SW.ui.back();
      if (e.code === 'KeyM') SW.ui.toggleSound();
      return;
    }
    if (!a) return;
    e.preventDefault();
    if (e.repeat) return;
    SW.A.init();
    SW.In.press(a);
  });
  addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) SW.In.release(a); });
  addEventListener('blur', () => SW.In.releaseAll());
  // on-screen buttons
  document.querySelectorAll('[data-act]').forEach(b => {
    const a = b.dataset.act;
    b.addEventListener('pointerdown', e => { e.preventDefault(); SW.A.init(); b.classList.add('on'); SW.In.press(a); });
    const up = () => { b.classList.remove('on'); SW.In.release(a); };
    b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  // swipe on the well: drag sideways to move, flick down to drop, tap to rotate
  const w = SW.$('wellWrap');
  w.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    SW.A.init();
    SW.In.swipe = { x: e.clientX, y: e.clientY, t: performance.now(), mx: 0, moved: false };
  });
  w.addEventListener('pointermove', e => {
    const sw = SW.In.swipe, S = SW.S;
    if (!sw || !S) return;
    const step = (SW.Rn.cs || 24) * 0.9, dx = e.clientX - sw.x, cells = Math.trunc(dx / step);
    while (sw.mx < cells) { SW.G.act(S, 'R'); sw.mx++; sw.moved = true; }
    while (sw.mx > cells) { SW.G.act(S, 'L'); sw.mx--; sw.moved = true; }
    if (e.clientY - sw.y > step * 3 && !sw.dropped && performance.now() - sw.t < 260) { sw.dropped = true; SW.G.act(S, 'H'); }
  });
  w.addEventListener('pointerup', e => {
    const sw = SW.In.swipe; SW.In.swipe = null;
    if (!sw || !SW.S) return;
    const d = Math.hypot(e.clientX - sw.x, e.clientY - sw.y);
    if (!sw.moved && !sw.dropped && d < 12 && performance.now() - sw.t < 300) SW.G.act(SW.S, 'CW');
  });
  w.addEventListener('pointercancel', () => { SW.In.swipe = null; });
};
// gamepad: d-pad/stick move, A rotate, B/X counter-rotate, Y/bumpers hold, up hard drop, start pause
const PADMAP = { 14: 'L', 15: 'R', 13: 'D', 12: 'H', 0: 'CW', 1: 'CCW', 2: 'CCW', 3: 'HOLD', 4: 'HOLD', 5: 'HOLD', 9: 'PAUSE' };
SW.In.pollPad = () => {
  if (!navigator.getGamepads) return;
  let pads;
  try { pads = navigator.getGamepads(); } catch (e) { return; }
  for (const p of pads) {
    if (!p) continue;
    const now = {};
    for (const i in PADMAP) if (p.buttons[i] && p.buttons[i].pressed) now[PADMAP[i]] = true;
    if (p.axes[0] < -0.55) now.L = true;
    if (p.axes[0] > 0.55) now.R = true;
    if (p.axes[1] > 0.6) now.D = true;
    for (const a of ['L', 'R', 'D', 'H', 'CW', 'CCW', 'HOLD', 'PAUSE']) {
      if (now[a] && !SW.In.pad[a]) { if (a === 'PAUSE' || SW.ui.screen === 'game') SW.In.press(a); else if (a === 'CW' || a === 'H') SW.ui.padConfirm && SW.ui.padConfirm(); }
      if (!now[a] && SW.In.pad[a]) SW.In.release(a);
    }
    SW.In.pad = now;
    return;
  }
};

// ===== hud.js =====
// hud.js - score readout, HOLD / NEXT previews, the NOW card and ERRATA's 7-card plan
SW.Hud = { els: new Map(), acc: 0 };
const pips = I => '●'.repeat(I) + '○'.repeat(5 - I);
const decrypt = (el, text) => {   // the name "resolves" out of noise as ERRATA writes it
  let i = 0;
  const glyph = '▓▒░#%&@01';
  const step = () => {
    if (!el.isConnected) return;
    i += 2;
    let s = text.slice(0, i);
    for (let k = i; k < text.length; k++) s += text[k] === ' ' ? ' ' : glyph[Math.floor(Math.random() * glyph.length)];
    el.textContent = s;
    if (i < text.length) setTimeout(step, 28);
  };
  step();
};
SW.Hud.card = (mod, fresh) => {
  const c = SW.el('div', 'qc ' + mod.kind + (fresh ? ' enter' : ''));
  c.dataset.uid = mod.uid;
  const qi = SW.el('div', 'qi', mod.icons.join(''));
  const mid = SW.el('div', 'qb');
  const qn = SW.el('div', 'qn', mod.name);
  const qm = SW.el('div', 'qm');
  qm.innerHTML = '<span class="pip">' + pips(mod.I) + '</span> · ' + mod.dur.toFixed(1) + 's' + (mod.fx.length > 1 ? ' · COMBO' : '') + (mod.twist ? ' · ' + mod.twist.toUpperCase() : '');
  mid.append(qn, qm);
  const qt = SW.el('div', 'qt');
  qt.innerHTML = '<span>--</span><small>IN</small>';
  c.append(qi, mid, qt);
  c.title = mod.name + ' — ' + mod.fx.map(f => f.e.desc).join(' + ');
  if (fresh) decrypt(qn, mod.name);
  return c;
};
SW.Hud.syncQueue = S => {
  const q = SW.$('queue'), want = S.dir.queue.map(m => m.uid);
  for (const [uid, el] of SW.Hud.els) if (!want.includes(uid)) { el.remove(); SW.Hud.els.delete(uid); }
  S.dir.queue.forEach(mod => {
    let el = SW.Hud.els.get(mod.uid);
    if (!el) { el = SW.Hud.card(mod, SW.Hud.ready); SW.Hud.els.set(mod.uid, el); }
    q.appendChild(el);   // keeps order
  });
  SW.Hud.ready = true;
};
SW.Hud.reset = () => { SW.$('queue').innerHTML = ''; SW.Hud.els.clear(); SW.Hud.ready = false; SW.Hud.lastNow = null; };
SW.Hud.now = S => {

SW.Hud.countdowns = S => {

const prevCv = (cv, draw) => {
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  draw(g, W, H);
};
SW.Hud.previews = (S, t) => {

  });

    for (let i = 0; i < n; i++) {

  });
};

      d.querySelector('.cs').textContent = 'seen ×' + seen.n + ' · strongest: ' + SW.Gen.INT_WORDS[Math.max(1, seen.maxI)][0];
    } else {
      d.innerHTML = '<div class="ci">?</div><div class="cn">??????</div><div class="ck">UNDISCOVERED</div><div class="cd">Survive more of ERRATA\'s plans to log this one.' + (e.min > 1 ? ' Shows up from chaos level ' + e.min + '.' : '') + '</div>';
    }
    grid.appendChild(d);
  }
};

// ===== ui3.js =====
// ui3.js - fake game over, the real game over, results screen, button wiring
SW.bus.on('fakeOver', () => {
  const f = SW.$('fakeOver');
  f.classList.remove('hide', 'jk');
  SW.Mu.stop();
  setTimeout(() => f.classList.add('jk'), 1500);
});
SW.bus.on('fakeDone', () => {
  SW.$('fakeOver').classList.add('hide');
  if (SW.S && !SW.S.over) SW.Mu.start(SW.S.mode.music, SW.S.mode.id === 'daily' ? SW.hash(SW.S.day) : null);
});
SW.bus.on('over', S => {
  SW.Mu.stop();
  if (S.won) SW.A.win(); else SW.A.over();
  SW.Rn.glitch = 1;
  SW.AI.busy = 0;
  SW.AI.say(SW.L.say(S.won ? 'sprintDone' : 'over'), S.won ? 'shock' : 'laugh', 9, 4);
  // turn the stack grey row by row, then show results
  let y = SW.H - 1;
  const grey = setInterval(() => {
    if (y < 0 || SW.S !== S) { clearInterval(grey); return; }
    for (let x = 0; x < SW.W; x++) if (S.board[y][x]) S.board[y][x] = 8;
    y--;
  }, 40);
  const sum = SW.Save.finish(S);
  setTimeout(() => { if (SW.S === S) SW.ui.results(S, sum); }, S.won ? 1400 : 1700);
});
SW.ui.results = (S, sum) => {
  SW.ui.show('results');
  const won = S.won, m = S.mode;
  const title = m.goal ? (won ? 'FINISHED!' : 'SIGNAL LOST') : 'SIGNAL LOST';
  const big = m.goal && won ? SW.fmtTime(S.time) : SW.fmtNum(S.score);
  const lines = ['That was a good broadcast. For me.', 'I\'m keeping the tape.', 'Same time tomorrow?', 'I already planned your next run. Seven things.',
    'You were brave. Wrong, but brave.', 'Ratings were through the roof.'];
  let unl = '';
  if (sum.rankUp) unl += '<div class="rx">RANK UP → <b>' + sum.rankUp.n + ' · ' + sum.rankUp.name + '</b></div>';
  for (const u of sum.fresh) unl += '<div class="rx">UNLOCKED: <b>' + (u.type === 'mode' ? SW.MODES.by[u.id].name + ' channel' : (SW.Rn.SKINS.find(s => s.id === u.id) || {}).name + ' skin') + '</b></div>';
  SW.$('resCard').innerHTML = `<div class="rt">${title}</div>
<div class="rs">${big}</div><div class="rb">${sum.best ? '★ NEW BEST ★' : (m.id === 'daily' ? 'PLAN AHEAD · ' + S.day : m.name)}</div>
<div class="rg"><div><b>${S.lines}</b><span>LINES</span></div><div><b>${S.level}</b><span>LEVEL</span></div><div><b>${SW.fmtTime(S.time).replace(/\.\d+$/, '')}</b><span>TIME</span></div>
<div><b>${S.stats.mods}</b><span>MODIFIERS</span></div><div><b>${S.stats.quads}</b><span>QUADS</span></div><div><b>${S.stats.maxCombo + 1}</b><span>BEST COMBO</span></div></div>
<div class="rx">+<b>${sum.xp}</b> XP · codex ${SW.Save.codexCount()}/${SW.E.list.length}</div>${unl}
<div class="rq">ERRATA: "${SW.pick(lines)}"</div>
<div class="rbtn"><button class="mb" id="rAgain">PLAY AGAIN</button><button class="mb" id="rCodex">CODEX</button><button class="mb" id="rMenu">MENU</button></div>`;
  SW.$('rAgain').onclick = () => { SW.A.ui(); SW.ui.start(m.id); };
  SW.$('rCodex').onclick = () => { SW.A.ui(); SW.ui.codex(); };
  SW.$('rMenu').onclick = () => { SW.A.ui(); SW.ui.home(); };
};
SW.ui.wire = () => {
  SW.$('snd').onclick = () => SW.ui.toggleSound();
  SW.$('bCodex').onclick = () => { SW.A.init(); SW.A.ui(); SW.ui.codex(); };
  SW.$('bHow').onclick = () => { SW.A.init(); SW.A.ui(); SW.ui.howto(); };
  SW.$('bSet').onclick = () => { SW.A.init(); SW.A.ui(); SW.ui.settings(); };
  for (const b of document.querySelectorAll('.back')) b.onclick = () => SW.ui.back();
  SW.$('bPause').onclick = () => SW.ui.togglePause();
  SW.$('pResume').onclick = () => SW.ui.togglePause();
  SW.$('pRestart').onclick = () => { SW.A.ui(); SW.ui.start(SW.S.mode.id); };
  SW.$('pQuit').onclick = () => { SW.S.over = true; SW.ui.home(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && SW.S && !SW.S.paused && !SW.S.over && SW.ui.screen === 'game') SW.ui.togglePause(); });
  addEventListener('resize', () => SW.Rn.resize());
  document.addEventListener('pointerdown', () => SW.A.init(), { once: true });
};

// ===== debug.js =====
// debug.js - small hooks used by the automated test and for tinkering in the console
SW.T = {
  // fill the bottom n rows except the columns in gaps
  fill(n, gaps) {
    const S = SW.S;
    for (let k = 0; k < n; k++) {
      const y = SW.H - 1 - k;
      for (let x = 0; x < SW.W; x++) S.board[y][x] = gaps.includes(x) ? 0 : 1 + ((x + k) % 7);
    }
  },
  // replace the falling block with a given kind at a column, flat rotation
  setPiece(kind, x) {
    const S = SW.S;
    SW.G.spawn(S, kind);
    if (x != null) S.cur.x = x;
  },
  // stop the planner and clear any active modifier (deterministic checks)
  quiet() {
    const S = SW.S;
    if (S.dir.active) SW.D.end(S);
    S.dir.hold = 1; S.dir.t = 99;
    SW.D.update(S, 0);
  },
  resume() { const S = SW.S; S.dir.hold = 0; S.dir.t = 1; },
  skip(sec) { SW.D.skip(SW.S, sec); },
  // fire every base effect once with a few simulated frames each; returns ids that threw
  fireAll(frames) {
    const S = SW.S, bad = [];
    for (const e of SW.E.list) {
      try {
        SW.D.force(S, e.id, 4);
        for (let i = 0; i < (frames || 12); i++) { SW.step(1 / 30, SW.now() + i / 30); if (S.over) break; }
        if (S.fakeOver > 0) { S.fakeOver = 0; SW.bus.emit('fakeDone'); }
        if (S.over) { S.over = false; S.board = SW.B.empty(); SW.G.spawn(S); }
      } catch (err) { bad.push(e.id + ': ' + err); }
    }
    return bad;
  },
  queueNames() { return SW.S.dir.queue.map(m => m.name); },
  info() {
    const S = SW.S;
    return { lines: S.lines, score: S.score, level: S.level, over: S.over, fired: S.dir.fired, q: S.dir.queue.length,
      cards: document.querySelectorAll('#queue .qc').length, y: S.cur ? S.cur.y : null, active: S.dir.active ? S.dir.active.name : null };
  }
};

// ===== main.js =====
// main.js - boot + the frame loop
SW.opts = { calmFx: false };
SW.boot = () => {
  const q = location.search;
  if (q.includes('reset')) SW.store.del('save');
  const d = SW.Save.load();
  if (q.includes('unlock')) SW.Save.forceAll = true;
  SW.A.on = d.opts.sound; SW.A.sfxVol = d.opts.sfx; SW.A.musVol = d.opts.mus;
  SW.$('snd').classList.toggle('off', !d.opts.sound);
  SW.Rn.skin = SW.Rn.SKINS.some(s => s.id === d.opts.skin) && SW.Save.unlocked('skin', d.opts.skin) ? d.opts.skin : 'phosphor';
  SW.opts.calmFx = !!d.opts.calmFx;
  document.body.classList.toggle('calmfx', SW.opts.calmFx);
  SW.Rn.init();
  SW.ui.face = SW.Face.make(SW.$('face'));
  SW.ui.faceHome = SW.Face.make(SW.$('faceHome'));
  SW.ui.title = SW.Title.home(SW.$('title'));
  SW.ui.wire();
  SW.In.init();
  SW.ui.home();
  SW.loopT = SW.now();
  requestAnimationFrame(SW.loop);
  window.SOMETHINGSWRONG = true;
};
SW.frames = 0;
SW.loop = () => {
  requestAnimationFrame(SW.loop);
  const nowT = SW.now(), dt = Math.min(0.05, Math.max(0, nowT - SW.loopT));
  SW.loopT = nowT;
  SW.step(dt, nowT);
};
SW.step = (dt, t) => {
  SW.frames++;
  try {
    SW.In.update(dt);
    const S = SW.S, scr = SW.ui.screen;
    if (scr === 'game' && S) {
      SW.G.update(S, dt);
      if (S.dir.idx !== SW.lastIdx || !SW.Hud.ready) { SW.lastIdx = S.dir.idx; SW.Hud.syncQueue(S); }
      SW.FX.update(dt);
      SW.Rn.frame(S, t, dt);
      SW.Hud.update(S, t, dt);
      SW.ui.face.draw(t, dt);
      SW.Mu.tempo = S.M.tempo;
    } else if (scr === 'home') {
      SW.ui.title.draw(dt);
      SW.ui.faceHome.draw(t, dt);
    }
    SW.AI.update(dt);
    SW.osdT = (SW.osdT || 0) + dt;
    if (SW.osdT > 0.25) {     // VCR on-screen clock: tape counter in game, the eternal blinking 12:00 elsewhere
      SW.osdT = 0;
      const tt = S && scr === 'game' ? S.time : 0, hh = Math.floor(tt / 3600), mm = Math.floor(tt / 60) % 60, ss = Math.floor(tt) % 60;
      SW.$('osdClock').textContent = scr === 'game' || scr === 'results' ? 'SP ' + hh + ':' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0')
        : (Math.floor(t * 1.2) % 2 ? 'AM 12:00' : 'AM --:--');
    }
  } catch (e) {
    console.error(e);
    SW.lastError = String(e && e.stack || e);
  }
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', SW.boot);
else SW.boot();
