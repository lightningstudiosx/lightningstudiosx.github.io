<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinite Matryoshka · Kai.fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#b3122e;--red2:#7a0a1f;--gold:#c9952e;--gold2:#a8771f;--ink:#1a0b0b;--soft:#6b5a55;--line:#ece4dc;--paper:#ffffff;--card:#fffaf2;--serif:'Yeseva One',Georgia,serif;--sans:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(14px,env(safe-area-inset-top)) 18px 0;pointer-events:none;gap:10px}
.top>*{pointer-events:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--ink);text-decoration:none;font:800 15px var(--sans);padding:6px 0}
.nav a:hover{color:var(--red)}
.nav a.home{font:400 22px var(--serif);color:var(--red);padding:2px 0}
.title{text-align:center;pointer-events:none!important;flex:1;min-width:0}
.title h1{margin:0;font:400 clamp(18px,2.6vw,28px)/1 var(--serif);color:var(--red)}
.depth{font:900 clamp(30px,5.5vw,54px)/1.05 var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.depth small{display:block;font:800 11px var(--sans);letter-spacing:.24em;color:var(--soft);text-transform:uppercase}
.btns{display:flex;gap:6px}
.ib{min-width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:#fff;color:var(--ink);font:900 14px var(--sans);cursor:pointer;padding:0 14px;display:grid;place-items:center;box-shadow:3px 3px 0 var(--ink)}
.ib:hover{background:#fff4e8}.ib:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ib.shop{background:var(--red);color:#fff}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 18px max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;gap:10px}
.zone{font:400 clamp(15px,2vw,19px) var(--serif);color:var(--red)}
.zone span{display:block;font:800 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.hint{font:800 12px var(--sans);color:var(--soft);text-align:center;letter-spacing:.06em}
.shards{font:900 17px var(--sans);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.shards i,.gem{width:14px;height:18px;background:linear-gradient(135deg,#bff4ff,#5fb8e8 55%,#2a6fb0);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);display:inline-block;vertical-align:-3px}
.auto{font:800 12px var(--sans);color:var(--soft)}
.cur{position:fixed;left:50%;bottom:max(70px,calc(env(safe-area-inset-bottom) + 60px));transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap;max-width:94vw}
.cur b{display:block;font:400 clamp(16px,2.2vw,22px) var(--serif);overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font:900 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#1a0b0b;margin-top:3px}
.banner{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s;z-index:5;width:min(92vw,620px)}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.banner .tier{font:900 clamp(34px,8vw,74px)/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;-webkit-text-stroke:3px #1a0b0b;paint-order:stroke fill;text-shadow:0 5px 0 #1a0b0b}
.banner .odds{display:inline-block;font:900 13px var(--sans);letter-spacing:.16em;margin-top:10px;color:#fff;background:#1a0b0b;padding:6px 12px;border-radius:999px}
.banner .tap{font:800 12px var(--sans);margin-top:10px;color:var(--soft);letter-spacing:.14em}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.panel{position:fixed;inset:0;z-index:10;display:none;background:rgba(255,255,255,.75);backdrop-filter:blur(6px);padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.panel.on{display:flex;justify-content:center}
.sheet{width:min(980px,100%);height:100%;display:flex;flex-direction:column;background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;min-height:0}
.sh-top{display:flex;align-items:center;gap:8px;padding:12px 12px 0;flex-wrap:wrap}
.sh-top h2{margin:0 auto 0 6px;font:400 26px var(--serif);color:var(--red)}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:2px solid var(--line)}
.tabs button{flex:none;font:900 13px var(--sans);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;min-height:40px;padding:0 14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.body{flex:1;overflow-y:auto;padding:14px;min-height:0;-webkit-user-select:text;user-select:text}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:0;background:repeating-linear-gradient(to bottom,transparent 0 142px,#c98b52 142px 154px,#8a5a2c 154px 158px);border-radius:8px}
.slot{height:158px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:16px;cursor:pointer;position:relative}
.slot canvas{width:70px;height:105px;display:block}
.slot .lb{position:absolute;top:4px;font:900 9px var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:#1a0b0b;max-width:92px;text-align:center}
.sortrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.sortrow .sm{font:800 12px var(--sans);color:var(--soft)}
.chip{font:900 12px var(--sans);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px}
.chip.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 8px;border-bottom:1px dashed #e2d6cc;text-align:left;font-size:14px}
th{font:900 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
td.r{text-align:right}
.tn .pill{margin:0}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.th{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;text-align:center;font:800 12px var(--sans)}
.th canvas{width:60px;height:90px;display:block;margin:0 auto 4px}
.up{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px;border:2px solid var(--ink);border-radius:16px;margin-bottom:10px;background:#fff;box-shadow:3px 3px 0 var(--ink)}
.up .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:400 26px var(--serif);color:#fff}
.up h3{margin:0;font:400 19px var(--serif);color:var(--ink)}
.up h3 small{font:900 11px var(--sans);letter-spacing:.12em;color:var(--soft);margin-left:6px}
.up p{margin:3px 0 0;color:var(--soft);font-size:14px}
.up .bar{display:flex;gap:3px;margin-top:6px}.up .bar i{width:12px;height:6px;border-radius:3px;background:#eadfd4}.up .bar i.on{background:var(--red)}
.buy{font:900 14px var(--sans);background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
.buy:disabled{opacity:.35;cursor:default}
.wallet{display:flex;align-items:center;gap:8px;font:900 18px var(--sans);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.stat{padding:14px;border-radius:14px;background:#fff;border:2px solid var(--line)}
.stat b{display:block;font:900 26px var(--sans);font-variant-numeric:tabular-nums}
.stat span{font:800 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.danger{margin-top:18px;font:800 13px var(--sans);color:#b3122e;background:none;border:2px solid #e6a0a0;border-radius:10px;min-height:40px;padding:0 14px;cursor:pointer}
.detail{position:fixed;inset:0;z-index:12;display:none;place-items:center;background:rgba(255,255,255,.8);padding:20px}
.detail.on{display:grid}
.detail .card{text-align:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px 22px;max-width:340px;width:100%;box-shadow:6px 6px 0 var(--ink)}
.detail canvas{width:180px;height:270px}
.detail h3{margin:6px 0 2px;font:400 22px var(--serif)}
.detail p{margin:2px 0;color:var(--soft);font-size:14px}
@media (max-width:600px){.hint{display:none}.nav a.home{font-size:18px}.ib{padding:0 10px;font-size:13px}.title h1{font-size:16px}}
</style>
</head>
<body>
<canvas id="c" aria-label="A nesting doll. Tap to open it."></canvas>
<div class="flash" id="flash"></div>
<div class="top">
  <nav class="nav"><a class="home" href="index.html">Kaifun.fun</a><a href="index.html">← Index</a></nav>
  <div class="title"><h1>Infinite Matryoshka</h1><div class="depth" id="depth">0<small>dolls deep</small></div></div>
  <div class="btns"><button class="ib shop" id="openShop">Shop</button><button class="ib txt" id="openShelf">Shelf</button><button class="ib" id="snd" aria-label="Sound">🔊</button></div>
</div>
<div class="cur" id="cur"></div>
<div class="bottom">
  <div class="zone" id="zone"></div>
  <div class="hint">click the doll · hold to dive · space works too<br><span class="auto" id="autoTxt"></span></div>
  <div class="shards" title="Shards — spend them on upgrades in the Shelf"><i></i><span id="shards">0</span></div>
</div>
<div class="banner" id="banner"><div class="tier" id="bTier"></div><div class="odds" id="bOdds"></div><div class="tap" id="bTap"></div></div>

<div class="panel" id="panel"><div class="sheet">
  <div class="sh-top"><h2>The Shelf</h2><button class="ib" id="closeP" aria-label="Close">✕</button></div>
  <div class="tabs" id="tabs"><button data-t="shelf" class="on">Dolls</button><button data-t="log">Collection Log</button><button data-t="up">Shop</button><button data-t="odds">Odds</button><button data-t="stats">Stats</button></div>
  <div class="body" id="pbody"></div>
</div></div>
<div class="detail" id="detail"><div class="card"><canvas id="dc" width="360" height="540"></canvas><h3 id="dn"></h3><p id="dt"></p><p id="dd"></p><button class="chip" id="dclose" style="margin-top:10px">Close</button></div></div>

<script>
(()=>{
'use strict';
/* ---------------- data ---------------- */
const TIERS=[
 {n:'Common',odds:1,c:'#e9dcc4',sh:1},
 {n:'Uncommon',odds:4,c:'#7fd67a',sh:2},
 {n:'Rare',odds:15,c:'#4fb4ff',sh:5},
 {n:'Epic',odds:60,c:'#c36bff',sh:15},
 {n:'Legendary',odds:300,c:'#ffc23d',sh:60},
 {n:'Mythic',odds:1500,c:'#ff5fa8',sh:250},
 {n:'Cosmic',odds:10000,c:'#7f8bff',sh:1200},
 {n:'Divine',odds:100000,c:'#fffbe6',sh:8000},
 {n:'Impossible',odds:1000000,c:'#ff4040',sh:50000},
 {n:'Stupidly Secret',odds:2500000,c:'#9dff00',sh:150000}
];
const JOKES=[['cardboard','Cardboard Matryoshka'],['error','Error Matryoshka'],['banana','Banana (it\'s just a banana)'],['stickman','Stickman Matryoshka'],['potato','Just a Potato'],['brick','A Brick'],['pixel','8-Bit Babushka'],['upside','Upside-Down Olga'],['tiny','Extremely Tiny Doll'],['toast','Toast Matryoshka'],['egg','Egg (wrong toy)'],['pin','Bowling Pin (close enough)'],['blank','Unpainted Doll (she forgot)'],['homework','Kai\'s Homework']];
const JOKE_NAME=Object.fromEntries(JOKES);
const THEMES=['pirate','astronaut','duck','robot','dragon','kai','ice','lava','bee','ghost','king','cat'];
const THEME_NAMES={pirate:'Pirate',astronaut:'Astronaut',duck:'Duck',robot:'Robot',dragon:'Dragon',kai:'Kai',ice:'Ice',lava:'Lava',bee:'Bee',ghost:'Ghost',king:'Tsar',cat:'Cat'};
const PALS=[
 ['#c8102e','#f6c445','#2c6e49','#f7e7c4','#1f3a93'],['#1f3a93','#e63946','#f1c40f','#fdf0d5','#2a9d8f'],['#2a9d8f','#e9c46a','#e76f51','#fff3e0','#264653'],
 ['#6a0dad','#ffb703','#fb8500','#fff8e7','#219ebc'],['#d62828','#003049','#fcbf49','#fff1d6','#2b9348'],['#e07a5f','#3d405b','#81b29a','#f4f1de','#f2cc8f'],
 ['#0b6e4f','#f2c14e','#d1495b','#fbf3e4','#08415c'],['#ff6b6b','#4ecdc4','#ffe66d','#fff9ec','#1a535c'],['#8c1c13','#e6af2e','#1d3557','#f9ecd2','#3a7d44'],
 ['#5f0f40','#fb8b24','#0f4c5c','#fff5e1','#e36414'],['#ef476f','#06d6a0','#ffd166','#fffaf0','#118ab2'],['#3c1642','#fca311','#2ec4b6','#fdf6e3','#e71d36']
];
const NAMES=['Anya','Olga','Masha','Dasha','Katya','Nadia','Sveta','Galina','Irina','Lena','Vera','Zoya','Mila','Tanya','Polina','Yulia','Inna','Rita','Alla','Nina','Lyuba','Sonya','Varya','Ksenia','Duckovna','Babushka'];
const EPI=['of the Garden','the Small','the Smaller','the Even Smaller','of the Deep','the Painted','the Brave','the Patient','of the Third Shelf','the Glossy','who Knows','the Hollow','the Curious','of Many Layers','the Unopened','the Lucky','the Sleepy','who Waits','the Tiny Queen','the Last (not really)'];
const ZONES=[
 [0,'The Parlour','a doll on the table'],[25,'Inside the Dolls','it smells like lacquer'],[120,'The Sawdust Depths','wood grain everywhere'],[500,'The Grain','smaller than a crumb'],
 [1500,'Atomic Lacquer','the paint is made of atoms'],[5000,'The Starfield','there are galaxies in here'],[20000,'The Void','nothing but dolls'],[100000,'Beyond Kai','you should not be here']
];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------------- state ---------------- */
const KEY='matryoshka_save';
const def=()=>({depth:0,deepest:0,opened:0,shards:0,luck:0,auto:0,counts:Array(10).fill(0),themes:{},jokes:{},coll:[],best:0,cur:null,sound:1});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=def()}
if(!Array.isArray(S.counts))S.counts=[];while(S.counts.length<10)S.counts.push(0);S.jokes=S.jokes||{};
let saveT=0;function save(now){clearTimeout(saveT);const f=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){S.coll=S.coll.slice(-200);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e2){}}};if(now)f();else saveT=setTimeout(f,400)}

const luckMul=()=>(1+Math.log10(1+S.depth)*0.35)*(1+0.15*S.luck);
const chance=i=>i===0?1:Math.min(1,luckMul()*(i===9?1+(S.sniff||0):1)/TIERS[i].odds);
function rollTier(){for(let i=TIERS.length-1;i>0;i--){if(Math.random()<chance(i))return i}return 0}
function makeDoll(tier,depth){
  const seed=(Math.random()*2**31)|0,r=mulberry(seed);
  let theme=null;
  if(tier>=2&&r()<0.32)theme=THEMES[(r()*THEMES.length)|0];
  if(tier===1&&r()<0.04)theme=THEMES[(r()*6)|0];
  if(tier===9){const j=JOKES[(r()*JOKES.length)|0];return {s:seed,t:9,th:null,j:j[0],d:depth,n:j[1]}}
  return {s:seed,t:tier,th:theme,d:depth,n:NAMES[(r()*NAMES.length)|0]+' '+EPI[(r()*EPI.length)|0]};
}
if(!S.cur)S.cur={s:12345,t:0,th:null,d:0,n:'Babushka the First'};

/* ---------------- doll painter ---------------- */
function outline(c){c.beginPath();c.moveTo(0,-.5);c.bezierCurveTo(.13,-.5,.21,-.43,.21,-.33);c.bezierCurveTo(.21,-.25,.17,-.21,.17,-.18);c.bezierCurveTo(.3,-.09,.335,.12,.31,.29);c.bezierCurveTo(.295,.42,.26,.5,.215,.5);c.lineTo(-.215,.5);c.bezierCurveTo(-.26,.5,-.295,.42,-.31,.29);c.bezierCurveTo(-.335,.12,-.3,-.09,-.17,-.18);c.bezierCurveTo(-.17,-.21,-.21,-.25,-.21,-.33);c.bezierCurveTo(-.21,-.43,-.13,-.5,0,-.5);c.closePath()}
function ell(c,x,y,rx,ry,col,rot=0){c.beginPath();c.ellipse(x,y,rx,ry,rot,0,Math.PI*2);c.fillStyle=col;c.fill()}
const SEAM=-.02;
function paint(c,doll,t,opts={}){
  const r=mulberry(doll.s),P=PALS[(r()*PALS.length)|0],tier=doll.t,th=doll.th,sil=opts.sil;
  let body=P[0],scarf=P[1],apron=P[3],flower=P[0],accent=P[4],hair=['#3b2416','#7a4a22','#c98a3c','#1d1d1d','#e8c27a'][(r()*5)|0];
  const pattern=(r()*4)|0,dots=(r()*3)|0;
  if(r()<.5){[body,scarf]=[scarf,body]}
  // theme colours
  if(th==='duck'){body='#ffd23f';scarf='#ffb000';apron='#fff6d6'}
  if(th==='robot'){body='#9aa7b4';scarf='#5c6b7a';apron='#d8e0e7';flower='#2ec4ff'}
  if(th==='dragon'){body='#2f8f4e';scarf='#1d5e33';apron='#f3e2a9';flower='#e8442e'}
  if(th==='ice'){body='#bfe9ff';scarf='#e9f8ff';apron='#ffffff';flower='#58b8ff'}
  if(th==='lava'){body='#2a0f08';scarf='#ff5a1f';apron='#ffb347';flower='#ff2a00'}
  if(th==='bee'){body='#ffc800';scarf='#1d1d1d';apron='#fff3b0'}
  if(th==='ghost'){body='#f4f4ff';scarf='#dcdcff';apron='#ffffff';flower='#b9b9ff'}
  if(th==='king'){body='#7a0a1f';scarf='#e8b64a';apron='#fbf0d9'}
  if(th==='astronaut'){body='#f4f6f8';scarf='#ff7a1a';apron='#e4e9ee';flower='#1f6feb'}
  if(th==='pirate'){scarf='#1d1d1d';apron='#f1e4c5'}
  if(th==='cat'){body='#f4a259';scarf='#e07a2b'}
  if(sil&&!doll.j){c.save();outline(c);c.fillStyle=opts.sil;c.fill();c.restore();return}
  if(doll.j){joke(c,doll,t);return}
  c.save();outline(c);c.clip();
  // body fill by tier
  let bf=body;
  if(tier===4){const g=c.createLinearGradient(-.3,-.5,.3,.5);g.addColorStop(0,'#fff0a8');g.addColorStop(.35,'#e8b64a');g.addColorStop(.6,'#a8771f');g.addColorStop(1,'#ffe08a');bf=g}
  if(tier===5){const g=c.createLinearGradient(-.35,-.5,.35,.5),h=(t*60)%360;for(let k=0;k<=5;k++)g.addColorStop(k/5,`hsl(${(h+k*60)%360},85%,${68-k%2*8}%)`);bf=g}
  if(tier===6){const g=c.createRadialGradient(.08,.05,.02,0,0,.6);g.addColorStop(0,'#5b2b9e');g.addColorStop(.5,'#1a1650');g.addColorStop(1,'#05051a');bf=g}
  if(tier===7){const g=c.createLinearGradient(0,-.5,0,.5);g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#fff6dc');g.addColorStop(1,'#f0d48a');bf=g}
  if(tier===8){const g=c.createConicGradient?c.createConicGradient(t*1.5,0,0):c.createLinearGradient(-.3,0,.3,0);for(let k=0;k<=6;k++)g.addColorStop(k/6,`hsl(${k*60},95%,60%)`);bf=g}
  c.fillStyle=bf;c.fillRect(-.5,-.6,1,1.2);
  if(th==='lava'){for(let k=0;k<9;k++){c.strokeStyle=`rgba(255,${90+k*12},0,.8)`;c.lineWidth=.012;c.beginPath();let x=-.3+r()*.6,y=-.1;c.moveTo(x,y);for(let j=0;j<5;j++){x+=(r()-.5)*.12;y+=.12;c.lineTo(x,y)}c.stroke()}}

function slot(j,c,g){const u=j-c,h=g.Hs*Math.pow(K,u);return{x:g.ax+g.Hs*GAP*(1-Math.pow(K,u))/(1-K),h,y:g.fy-h/2}}
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;const t=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  const g=geo();
  let p=0,q=0;
  if(anim){p=(now-anim.t0)/anim.dur;if(p>=1){finish();p=0}}
  if(anim){q=Math.min(1,Math.max(0,(p-.12)/.5));const z=Math.min(1,Math.max(0,(p-.55)/.45));cam=S.depth+(z<.5?2*z*z:1-Math.pow(-2*z+2,2)/2)}else cam=S.depth;
  if(shake>0){shake=Math.max(0,shake-dt*3);ctx.translate((Math.random()-.5)*shake*14,(Math.random()-.5)*shake*14)}
  // floor
  ctx.fillStyle='#f6f1ec';ctx.fillRect(0,g.fy,W,H-g.fy);ctx.fillStyle='#e8ddd2';ctx.fillRect(0,g.fy,W,2);
  // aura for the newest doll
  const top=anim?anim.next:cur,TC=TIERS[top.t].c,ts=slot(anim&&q>=1?S.depth+1:S.depth,cam,g);
  if(top.t>=2&&(!anim||q>=1)){const a=ctx.createRadialGradient(ts.x,ts.y,ts.h*.1,ts.x,ts.y,ts.h*1.1);a.addColorStop(0,TC+'88');a.addColorStop(1,TC+'00');ctx.fillStyle=a;ctx.fillRect(0,0,W,H)}
  if((top.t>=4&&(!anim||q>=1))||rays>0){ctx.save();ctx.translate(ts.x,ts.y);ctx.rotate(t*.3);const n=20;ctx.fillStyle=(top.t>=4?TC:rayCol)+'40';const R=Math.hypot(W,H);for(let k=0;k<n;k++){ctx.rotate(Math.PI*2/n);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(R,-R*.06);ctx.lineTo(R,R*.06);ctx.fill()}ctx.restore()}
  rays=Math.max(0,rays-dt);
  // the row of dolls: previous (big, left) ... current
  const first=Math.max(0,Math.floor(cam)-12);
  for(let j=first;j<=S.depth;j++){
    const sl=slot(j,cam,g);if(sl.x+sl.h<-50)continue;if(sl.h<1)break;
    const d=j===S.depth?cur:byDepth(j);
    ctx.fillStyle='rgba(60,30,20,.12)';ctx.beginPath();ctx.ellipse(sl.x,g.fy,sl.h*.26,sl.h*.035,0,0,7);ctx.fill();
    if(j===S.depth&&anim){
      const lift=Math.sin(Math.PI*Math.min(1,p/.75));
      drawDoll(ctx,d,sl.x,sl.y,sl.h,t,{half:'bot'});
      drawDoll(ctx,d,sl.x-sl.h*.05*lift,sl.y-sl.h*.32*lift,sl.h,t,{half:'top',rot:-.35*lift});
    } else drawDoll(ctx,d,sl.x,sl.y,sl.h,t,{rot:j===S.depth?Math.sin(t*2)*.015:0});
  }
  // the new doll jumping out to the side
  if(anim){
    const a=slot(S.depth,cam,g),b=slot(S.depth+1,cam,g),e=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;
    const h=a.h*K*(.75+.25*e),x=a.x+(b.x-a.x)*e,y=(a.y-a.h*.05)+(b.y-(a.y-a.h*.05))*e-Math.sin(Math.PI*q)*a.h*.55;
    if(q>0){if(q>=1){ctx.fillStyle='rgba(60,30,20,.12)';ctx.beginPath();ctx.ellipse(b.x,g.fy,b.h*.26,b.h*.035,0,0,7);ctx.fill()}
      drawDoll(ctx,anim.next,x,y,h,t,{rot:q<1?Math.sin(Math.PI*q)*.5:0})}
  }
  // auto-opener
  if(S.bot&&S.botOn&&!blocked&&!anim&&!$('panel').classList.contains('on')){botT+=dt;if(botT>=botEvery()){botT=0;open(true)}}
  requestAnimationFrame(frame);
}
let botT=0;const botEvery=()=>Math.max(.35,3*Math.pow(.8,S.bot-1));

/* ---------------- opening ---------------- */
const $=id=>document.getElementById(id);
let blocked=false;
function rollBest(){let a=rollTier();if(S.reroll&&Math.random()<Math.min(.8,S.reroll*.08)){const b=rollTier();if(b>a)a=b}return a}
function open(fast){
  if(blocked)return;
  if(anim)finish();
  const tier=rollBest(),nd=makeDoll(tier,S.depth+1);
  const base=fast?Math.max(170,520*Math.pow(.86,S.auto)):560;
  anim={next:nd,t0:performance.now(),dur:base};pop();
}
function finish(){
  if(!anim)return;const nd=anim.next;anim=null;cur=nd;S.cur=nd;S.depth++;S.opened++;if(S.depth>S.deepest)S.deepest=S.depth;
  S.line.push(nd);if(S.line.length>14)S.line.shift();
  S.counts[nd.t]++;S.shards+=Math.round(TIERS[nd.t].sh*(1+.25*(S.magnet||0)));if(nd.t>S.best)S.best=nd.t;
  if(nd.j)S.jokes[nd.j]=(S.jokes[nd.j]||0)+1;
  if(nd.th)S.themes[nd.th]=(S.themes[nd.th]||0)+1;
  if(nd.t>=2||nd.th){S.coll.push(nd);if(S.coll.length>400){S.coll.sort((a,b)=>a.t-b.t);S.coll.shift()}}
  ui();save(nd.t>=3);
  if(nd.t>=2)reveal(nd);
}
let bT=0;
function reveal(d){
  const T=TIERS[d.t];$('bTier').textContent=d.j?T.n:(d.th?THEME_NAMES[d.th]+' · ':'')+T.n;$('bTier').style.color=T.c;
  $('bOdds').textContent=`1 in ${T.odds.toLocaleString()} · +${Math.round(T.sh*(1+.25*(S.magnet||0))).toLocaleString()} shards`;
  const big=d.t>=4;$('bTap').textContent=big?'click to keep going':'';
  $('banner').classList.add('on');clearTimeout(bT);
  rays=d.t>=3?2:0;rayCol=T.c;shake=d.t>=4?1:d.t>=3?.4:0;
  if(d.t>=3){const f=$('flash');f.style.transition='none';f.style.opacity=d.t>=6?'.9':d.t>=4?'.6':'.3';f.style.background=T.c;requestAnimationFrame(()=>{f.style.transition='opacity .9s';f.style.opacity='0'})}
  chord(d.t);
  if(big){blocked=true;stopHold();setTimeout(()=>{bT='wait'},500)}
  else bT=setTimeout(()=>$('banner').classList.remove('on'),d.t>=3?1500:900);
}
function dismiss(){if(bT!=='wait')return false;bT=0;blocked=false;$('banner').classList.remove('on');return true}

/* ---------------- input ---------------- */
let holdIv=0,holdTo=0;
function stopHold(){clearInterval(holdIv);clearTimeout(holdTo);holdIv=0}
cv.addEventListener('pointerdown',e=>{audio();if(dismiss())return;if(blocked)return;open(false);holdTo=setTimeout(()=>{holdIv=setInterval(()=>open(true),Math.max(170,520*Math.pow(.86,S.auto)))},420)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>cv.addEventListener(ev,stopHold));
$('banner').addEventListener('pointerdown',()=>{if(!dismiss()&&!blocked){$('banner').classList.remove('on')}});
let spaceDown=false,lastKey=0;
addEventListener('keydown',e=>{if($('panel').classList.contains('on'))return;if(e.code==='Space'||e.key==='Enter'){e.preventDefault();audio();if(dismiss())return;const now=performance.now();if(e.repeat&&now-lastKey<Math.max(170,520*Math.pow(.86,S.auto)))return;lastKey=now;open(e.repeat)}});

/* ---------------- sound ---------------- */
let ac=null;function audio(){if(ac||!S.sound)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function pop(){if(!ac||!S.sound)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';const f=520+((S.depth%12)*30);o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*.45,n+.12);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+.14);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+.15);
  const b=ac.createBuffer(1,ac.sampleRate*.04,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=ac.createBufferSource(),g2=ac.createGain();s.buffer=b;g2.gain.value=.08;s.connect(g2);g2.connect(ac.destination);s.start(n)}
function buyS(){if(!ac||!S.sound)return;const n=ac.currentTime;[880,1320].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.1,n+i*.06);g.gain.exponentialRampToValueAtTime(.001,n+i*.06+.15);o.connect(g);g.connect(ac.destination);o.start(n+i*.06);o.stop(n+i*.06+.16)})}
function chord(tier){if(!ac||!S.sound)return;const n=ac.currentTime,sc=[523,659,784,1047,1319,1568,2093,2637,3136];for(let i=0;i<=Math.min(8,tier+1);i++){const o=ac.createOscillator(),g=ac.createGain();o.type=tier>=5?'sine':'triangle';o.frequency.value=sc[i]*(tier>=6?.5:1);const st=n+i*.07;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.12,st+.02);g.gain.exponentialRampToValueAtTime(.001,st+.5+tier*.08);o.connect(g);g.connect(ac.destination);o.start(st);o.stop(st+.7+tier*.1)}}
$('snd').addEventListener('click',()=>{S.sound=S.sound?0:1;$('snd').textContent=S.sound?'🔊':'🔇';save();if(S.sound)audio()});
$('snd').textContent=S.sound?'🔊':'🔇';

/* ---------------- HUD ---------------- */
function ui(){
  $('depth').innerHTML=S.depth.toLocaleString()+'<small>dolls deep</small>';
  const z=zoneOf(S.depth);$('zone').innerHTML=z[1]+'<span>'+z[2]+'</span>';
  $('shards').textContent=S.shards.toLocaleString();
  const T=TIERS[cur.t];$('cur').innerHTML=`<b>${cur.n}</b><span class="pill" style="color:${T.c}">${cur.th?THEME_NAMES[cur.th]+' · ':''}${T.n}</span>`;
  $('autoTxt').textContent=S.bot?(S.botOn?`auto-opener on · every ${botEvery().toFixed(1)}s`:'auto-opener paused'):'';
}

/* ---------------- panel ---------------- */
let tab='shelf',sort='rarity';
const UPS=[
 {k:'luck',n:'Lucky Paint',ic:'✦',col:'#b3122e',max:20,cost:l=>Math.round(40*Math.pow(1.6,l)),d:l=>`+15% luck per level. Now ×${(1+.15*l).toFixed(2)}.`},
 {k:'auto',n:'Quick Hands',ic:'»',col:'#1f3a93',max:12,cost:l=>Math.round(30*Math.pow(1.7,l)),d:l=>`Hold-to-dive opens dolls faster.`},
 {k:'bot',n:'Auto-Opener',ic:'⟳',col:'#2a9d8f',max:12,cost:l=>Math.round(150*Math.pow(1.9,l)),d:l=>l?`Opens a doll by itself every ${Math.max(.35,3*Math.pow(.8,l-1)).toFixed(1)}s.`:'A tiny helper that opens dolls for you, even when you\'re not clicking.'},
 {k:'magnet',n:'Shard Magnet',ic:'◆',col:'#5fb8e8',max:15,cost:l=>Math.round(60*Math.pow(1.75,l)),d:l=>`+25% shards from every doll. Now ×${(1+.25*l).toFixed(2)}.`},
 {k:'reroll',n:'Second Look',ic:'⟲',col:'#6a0dad',max:10,cost:l=>Math.round(120*Math.pow(1.85,l)),d:l=>`${Math.min(80,l*8)}% chance to roll each doll twice and keep the rarer one.`},
 {k:'sniff',n:'Secret Sniffer',ic:'?',col:'#5a8a00',max:9,cost:l=>Math.round(2000*Math.pow(2.2,l)),d:l=>`Stupidly Secret dolls are ×${1+l} as likely.`}
];
$('openShop').addEventListener('click',()=>{stopHold();tab='up';[...$('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.t==='up'));$('panel').classList.add('on');render()});
$('openShelf').addEventListener('click',()=>{stopHold();tab='shelf';[...$('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.t==='shelf'));$('panel').classList.add('on');render()});
$('closeP').addEventListener('click',()=>$('panel').classList.remove('on'));
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;[...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));render()});
function mini(doll,w,h,o={}){const c=document.createElement('canvas'),d=Math.min(2,devicePixelRatio||1);c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);drawDoll(x,doll,w/2,h/2+h*.02,h*.92,0,o);if(o.sil&&doll.j){x.globalCompositeOperation='source-in';x.fillStyle=o.sil;x.fillRect(0,0,w,h)}return c}
function render(){
  const B=$('pbody');B.innerHTML='';
  if(tab==='shelf'){
    const row=document.createElement('div');row.className='sortrow';row.innerHTML=`<span class="sm">${S.coll.length} dolls kept · Rare and up, plus every themed doll</span><span style="flex:1"></span>`;
    for(const k of['rarity','newest','deepest']){const b=document.createElement('button');b.className='chip'+(sort===k?' on':'');b.textContent=k[0].toUpperCase()+k.slice(1);b.onclick=()=>{sort=k;render()};row.appendChild(b)}
    B.appendChild(row);
    if(!S.coll.length){const p=document.createElement('p');p.textContent='Nothing on the shelf yet. Dive deeper — Rare dolls and themed dolls get kept here automatically.';p.style.color='var(--soft)';B.appendChild(p);return}
    const list=S.coll.map((d,i)=>[d,i]);
    list.sort(sort==='rarity'?(a,b)=>b[0].t-a[0].t||b[1]-a[1]:sort==='newest'?(a,b)=>b[1]-a[1]:(a,b)=>b[0].d-a[0].d);
    const sh=document.createElement('div');sh.className='shelf';
    for(const[d]of list.slice(0,240)){const s=document.createElement('div');s.className='slot';const T=TIERS[d.t];s.innerHTML=`<span class="lb" style="color:${T.c}">${T.n}</span>`;s.appendChild(mini(d,70,105));s.title=d.n;s.onclick=()=>detail(d);sh.appendChild(s)}
    B.appendChild(sh);
  }
  if(tab==='log'){
    let h='<table><tr><th>Rarity</th><th>Odds</th><th class="r">Found</th></tr>';
    TIERS.forEach((T,i)=>{const f=S.counts[i];h+=`<tr><td class="tn">${f?`<span class="pill" style="color:${T.c}">${T.n}</span>`:'<span style="color:#bbb">???</span>'}</td><td>1 in ${T.odds.toLocaleString()}</td><td class="r">${f.toLocaleString()}</td></tr>`});
    B.innerHTML=h+'</table><h3 style="font:400 20px var(--serif);color:var(--gold);margin:22px 0 0">Special dolls</h3><p style="margin:4px 0 0;opacity:.7;font-size:14px">Themed dolls show up at Rare and above. Find them all.</p>';
    const g=document.createElement('div');g.className='themes';
    for(const th of THEMES){const n=S.themes[th]||0,d=document.createElement('div');d.className='th';const doll={s:th.length*977,t:2,th};d.appendChild(n?mini(doll,60,90):mini(doll,60,90,{sil:'rgba(0,0,0,.6)'}));d.appendChild(document.createTextNode(n?`${THEME_NAMES[th]} ×${n}`:'???'));g.appendChild(d)}
    B.appendChild(g);
    const h3=document.createElement('div');h3.innerHTML='<h3 style="font:400 20px var(--serif);color:#5a8a00;margin:24px 0 0">Stupidly Secret</h3><p style="margin:4px 0 0;opacity:.7;font-size:14px">1 in 2,500,000. Nobody is supposed to find these.</p>';B.appendChild(h3);
    const g2=document.createElement('div');g2.className='themes';
    for(const[k,n]of JOKES){const f=S.jokes[k]||0,d=document.createElement('div');d.className='th';const doll={s:k.length*131,t:9,j:k};d.appendChild(mini(doll,60,90,f?{}:{sil:'rgba(0,0,0,.6)'}));d.appendChild(document.createTextNode(f?`${n} ×${f}`:'???'));g2.appendChild(d)}
    B.appendChild(g2);
  }
  if(tab==='up'){
    const w=document.createElement('div');w.className='wallet';w.innerHTML=`<i class="gem"></i>${S.shards.toLocaleString()} shards`;B.appendChild(w);
    for(const u of UPS){const lv=S[u.k]||0,max=lv>=u.max,cost=u.cost(lv),el=document.createElement('div');el.className='up';
      el.innerHTML=`<div class="ic" style="background:${u.col}">${u.ic}</div><div><h3>${u.n}<small>LV ${lv}/${u.max}</small></h3><p>${u.d(lv)}</p><div class="bar">${Array.from({length:u.max},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div></div>`;
      const b=document.createElement('button');b.className='buy';b.innerHTML=max?'MAX':`<i class="gem" style="width:11px;height:14px"></i> ${cost.toLocaleString()}`;b.disabled=max||S.shards<cost;
      b.onclick=()=>{if(max||S.shards<cost)return;S.shards-=cost;S[u.k]=lv+1;if(u.k==='bot')S.botOn=1;buyS();save(true);ui();render()};el.appendChild(b);
      if(u.k==='bot'&&lv>0){const tg=document.createElement('button');tg.className='chip';tg.style.marginLeft='6px';tg.textContent=S.botOn?'Pause':'Resume';tg.onclick=()=>{S.botOn=S.botOn?0:1;save();ui();render()};el.lastChild.after(tg);el.style.gridTemplateColumns='auto 1fr auto auto'}
      B.appendChild(el)}
    const p=document.createElement('p');p.style.color='var(--soft)';p.textContent='Every doll gives shards. Rarer dolls give way more. Going deeper also raises your luck on its own.';B.appendChild(p);
  }
  if(tab==='odds'){
    let h=`<p style="margin:0 0 10px;opacity:.8">Your luck right now: <b>×${luckMul().toFixed(2)}</b> (depth bonus × Lucky Paint). These are the odds for the next doll.</p><table><tr><th>Rarity</th><th>Base</th><th class="r">Your odds</th></tr>`;
    TIERS.forEach((T,i)=>{const p=chance(i);h+=`<tr><td class="tn"><span class="pill" style="color:${T.c}">${T.n}</span></td><td>1 in ${T.odds.toLocaleString()}</td><td class="r">${i?'1 in '+Math.max(1,Math.round(1/p)).toLocaleString():'everything else'}</td></tr>`});
    B.innerHTML=h+'</table>';
  }
  if(tab==='stats'){
    const bt=TIERS[S.best];
    B.innerHTML=`<div class="stats"><div class="stat"><b>${S.depth.toLocaleString()}</b><span>Current depth</span></div><div class="stat"><b>${S.deepest.toLocaleString()}</b><span>Deepest dive</span></div><div class="stat"><b>${S.opened.toLocaleString()}</b><span>Dolls opened</span></div><div class="stat"><b><span class="pill" style="color:${bt.c};font-size:14px">${bt.n}</span></b><span>Rarest found</span></div><div class="stat"><b>${Object.keys(S.themes).length}/${THEMES.length}</b><span>Special dolls</span></div><div class="stat"><b>${zoneOf(S.depth)[1]}</b><span>Where you are</span></div></div>`;
    const r=document.createElement('button');r.className='danger';r.textContent='Reset everything';let armed=false;r.onclick=()=>{if(!armed){armed=true;r.textContent='Tap again to really reset';return}S=def();try{localStorage.removeItem(KEY)}catch(e){}cur=S.cur={s:12345,t:0,th:null,d:0,n:'Babushka the First'};S.line=[S.cur];save(true);ui();render()};B.appendChild(r);
  }
}
function detail(d){const c=$('dc'),x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,360,540);drawDoll(x,d,180,280,500,0);const T=TIERS[d.t];$('dn').textContent=d.n;$('dt').innerHTML=`<b class="pill" style="color:${T.c}">${d.th?THEME_NAMES[d.th]+' · ':''}${T.n}</b> · 1 in ${T.odds.toLocaleString()}`;$('dd').textContent=`Found ${d.d.toLocaleString()} dolls deep`;$('detail').classList.add('on')}
$('dclose').onclick=()=>$('detail').classList.remove('on');$('detail').addEventListener('click',e=>{if(e.target.id==='detail')$('detail').classList.remove('on')});

ui();requestAnimationFrame(frame);
window.__M={S:()=>S,roll:rollTier,TIERS,open,finish,draw:drawDoll,make:makeDoll,JOKES};
})();
</script>
