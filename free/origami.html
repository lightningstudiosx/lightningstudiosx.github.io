<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORIGAMMY 2 HD</title>
<style>
body{margin:0;background:#0ff;color:#f00;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#f00;text-shadow:3px 3px #ff0;margin:4px;transform:rotate(2deg);font-size:36px}
a{color:#00f}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}
#lb{width:0;height:20px;background:#f00;border:2px solid #000;margin:8px auto 0;max-width:80%}
.ft{font-size:10px;color:#00f;margin:10px}
canvas{max-width:94vw;border:4px dotted #f00;background:#ffc;touch-action:none;cursor:crosshair}
button{font:bold 16px Impact,sans-serif;background:#f0f;color:#fff;border:3px outset #f0f;padding:6px 12px}
#s{font:bold 20px Impact,sans-serif;color:#fff;background:#00f;display:inline-block;padding:3px 8px}
</style></head><body>
<div id="ld">LOADING PAPER (1 sheet)... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>📄 ORIGAMMY 2 HD 📄</h1>
<div>tap a side of teh paper to fold it over. real folds (sort of not)</div>
<canvas id="c" width="320" height="320"></canvas><br>
<div id="s">FOLDS: 0 · LAYERS: 1</div>
<div id="nm" style="font-weight:bold;min-height:24px">u made: a square</div>
<button id="r">NEW SHEET</button>
<p class="ft">made in 5 minits. paper cut warning<br>(joke knockoff — the real game is at <a href='../origami.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var c=document.getElementById('c'),x=c.getContext('2d'),poly,ghost,folds,cr;
var names=['a square','a rectangle (wow)','a TRIANGLE','a paper airplane (it cant fly)','a CRANE (trust me)','a frog? maybe','a tiny hat for a ant','a paper ball','a crumb','nothing. u folded it into another dimension'];
function reset(){poly=[[40,40],[280,40],[280,280],[40,280]];ghost=null;folds=0;cr=[];draw()}
function cen(p){var a=0,b=0;p.forEach(function(q){a+=q[0];b+=q[1]});return[a/p.length,b/p.length]}
function clip(p,c0,n){var o=[];for(var i=0;i<p.length;i++){var A=p[i],B=p[(i+1)%p.length],da=(A[0]-c0[0])*n[0]+(A[1]-c0[1])*n[1],db=(B[0]-c0[0])*n[0]+(B[1]-c0[1])*n[1];
  if(da<=0)o.push(A);if((da<0)!=(db<0)){var t=da/(da-db);o.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t])}}return o}
function refl(p,c0,n){return p.map(function(q){var d=(q[0]-c0[0])*n[0]+(q[1]-c0[1])*n[1];return[q[0]-2*d*n[0],q[1]-2*d*n[1]]})}
function fill(p,col){if(p.length<3)return;x.beginPath();x.moveTo(p[0][0],p[0][1]);p.forEach(function(q){x.lineTo(q[0],q[1])});x.closePath();x.fillStyle=col;x.fill();x.strokeStyle='#000';x.lineWidth=3;x.stroke()}
function draw(){x.clearRect(0,0,320,320);fill(poly,['#f33','#3c3','#36f','#fc0','#f6f'][folds%5]);if(ghost)fill(ghost,'rgba(0,0,0,.25)');
  x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=1;x.setLineDash([5,5]);cr.forEach(function(l){x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(l[2],l[3]);x.stroke()});x.setLineDash([]);
  document.getElementById('s').textContent='FOLDS: '+folds+' · LAYERS: '+Math.pow(2,folds);document.getElementById('nm').textContent='u made: '+names[Math.min(folds,names.length-1)]}
c.onpointerdown=function(e){var r=c.getBoundingClientRect(),px=(e.clientX-r.left)*c.width/r.width,py=(e.clientY-r.top)*c.height/r.height;
  if(folds>=9){document.getElementById('nm').textContent='its too small to fold!! get a NEW SHEET';return}
  var c0=cen(poly),dx=px-c0[0],dy=py-c0[1],d=Math.hypot(dx,dy)||1,n=[dx/d,dy/d];
  // snap to 8 directions bc free version
  var a=Math.round(Math.atan2(n[1],n[0])/(Math.PI/4))*(Math.PI/4);n=[Math.cos(a),Math.sin(a)];
  var gone=clip(poly,c0,[-n[0],-n[1]]);poly=clip(poly,c0,n);ghost=refl(gone,c0,n);folds++;
  cr.push([c0[0]-n[1]*300,c0[1]+n[0]*300,c0[0]+n[1]*300,c0[1]-n[0]*300]);draw()};
document.getElementById('r').onclick=reset;reset();
</script></body></html>
