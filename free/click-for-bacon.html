<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>CLIK FOR BACON 2!!! (offical)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Comic Sans MS","Comic Sans",cursive}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:#fff;background:#000a;padding:3px;z-index:50}.ft a{color:#ff0}
canvas{display:block;touch-action:none;cursor:pointer}
#hud{position:fixed;top:26px;right:6px;color:#fff;background:#f00;font:18px Impact,sans-serif;padding:2px 8px;z-index:50}
</style></head><body>
<div id="ld">FRYING...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<div id="hud">🥓 <span id="c">0</span> · page left: <span id="pl">100</span>%</div>
<canvas id="cv"></canvas>
<div class="ft">made in 5 minits by xX_kai_Xx · (joke knockoff — the real game is at <a href='../click-for-bacon.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var cv=document.getElementById('cv'),g=cv.getContext('2d'),page=document.createElement('canvas'),pg=page.getContext('2d'),W,H,COLS=8,ROWS=10,tiles=[],bacon=0,left=0;
function build(){
  W=cv.width=innerWidth;H=cv.height=innerHeight;page.width=W;page.height=H;
  pg.fillStyle='#fff';pg.fillRect(0,0,W,H);pg.fillStyle='#000';pg.textAlign='center';
  pg.font='bold '+Math.min(60,W/13)+'px "Times New Roman"';pg.fillText('CLICK FOR BACON!!!',W/2,H*.18);
  pg.font=Math.min(20,W/26)+'px "Times New Roman"';
  ['Welcome to my homepage.','There is bacon on this website.','Click anywhere to get it.','Under construction since 1998','You are visitor #000000042'].forEach(function(s,i){pg.fillText(s,W/2,H*.3+i*Math.min(30,W/18))});
  pg.fillStyle='#00f';pg.fillText('[ link ]   [ guestbook ]   [ more bacon ]',W/2,H*.62);
  pg.fillStyle='#ccc';pg.fillRect(W*.3,H*.68,W*.4,H*.12);pg.fillStyle='#000';pg.fillText('<<< CLICK HERE >>>',W/2,H*.75);
  tiles=[];var tw=W/COLS,th=H/ROWS;for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)tiles.push({sx:c*tw,sy:r*th,w:tw,h:th,x:c*tw,y:r*th,vx:0,vy:0,a:0,va:0,f:false});
  left=tiles.length;
}
function drawBacon(){
  g.fillStyle='#fc9';g.fillRect(0,0,W,H);
  for(var k=0;k<5;k++){var y0=H*(.12+k*.18);
    for(var s=0;s<4;s++){g.beginPath();g.strokeStyle=s%2?'#f9a':'#b22';g.lineWidth=H*.03;for(var x=0;x<=W;x+=20){var y=y0+s*H*.03+Math.sin(x/40+k)*12;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}}
  g.fillStyle='#600';g.font='bold '+Math.min(50,W/10)+'px Impact';g.textAlign='center';g.fillText(left?'(there is bacon back here)':'🥓 U FOUND ALL THE BACON 🥓',W/2,H/2);
}
function loop(){
  drawBacon();
  tiles.forEach(function(t){
    if(t.f){t.vy+=.6;t.x+=t.vx;t.y+=t.vy;t.a+=t.va}
    if(t.y>H+200)return;
    g.save();g.translate(t.x+t.w/2,t.y+t.h/2);g.rotate(t.a);g.drawImage(page,t.sx,t.sy,t.w,t.h,-t.w/2,-t.h/2,t.w+1,t.h+1);g.restore();
  });
  requestAnimationFrame(loop);
}
function drop(t){if(t&&!t.f){t.f=true;t.vx=Math.random()*6-3;t.vy=-Math.random()*6;t.va=Math.random()*.2-.1;left--}}
cv.addEventListener('pointerdown',function(e){
  bacon++;var c=Math.floor(e.clientX/(W/COLS)),r=Math.floor(e.clientY/(H/ROWS)),t=tiles[r*COLS+c];
  if(t&&!t.f)drop(t);else{var rest=tiles.filter(function(t){return !t.f});drop(rest[Math.floor(Math.random()*rest.length)])}
  if(Math.random()<.3){var rest2=tiles.filter(function(t){return !t.f});drop(rest2[Math.floor(Math.random()*rest2.length)])}
  document.getElementById('c').textContent=bacon;document.getElementById('pl').textContent=Math.round(left/tiles.length*100);
});
addEventListener('resize',function(){if(Math.abs(innerWidth-W)>40)build()});
build();loop();
</script></body></html>
