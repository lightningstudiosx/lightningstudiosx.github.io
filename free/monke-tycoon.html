<title>MONKY TYCON: BANANA ILAND FREE</title>
<style>
body{margin:0;background:#0cf;color:#630;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#ff0;text-shadow:3px 3px #630;margin:4px;transform:rotate(-2deg);font-size:32px}
a{color:#00f}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}

<h1>🐒 MONKY TYCON: BANANA ILAND 🍌</h1>
<div id="hud">🍌 0 · 🪙 0 · 🐒 0</div>
<div id="isl"><div id="tr">🌴</div><div id="mk"></div></div>
<div>tap the tree!! sell bananas!! hire monkes!! become rich (in bananas)</div>
<button id="sl">SELL ALL 🍌 (1🪙 ea)</button><button id="hm">HIRE MONKE (10🪙)</button><button id="bt">BUY BOAT (500🪙)</button>
<div id="m" style="font-weight:bold;min-height:22px"></div>
<p class="ft">made in 5 minits by 3 monkes on keyboards<br>(joke knockoff — the real game is at <a href='../monke-tycoon.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
function $(i){return document.getElementById(i)}
var ban=0,coin=0,mon=0,cost=10,price=1,boat=0,tot=0;
function ui(){$('hud').textContent='🍌 '+Math.floor(ban)+' · 🪙 '+Math.floor(coin)+' · 🐒 '+mon+(boat?' · ⛵':'')+' · TOTAL 🍌 '+Math.floor(tot);
  $('sl').textContent='SELL ALL 🍌 ('+price.toFixed(1)+'🪙 ea)';$('hm').textContent='HIRE MONKE ('+cost+'🪙)';$('hm').disabled=coin<cost;$('bt').disabled=coin<500||boat;
  $('mk').textContent='🐒'.repeat(Math.min(mon,14))+(mon>14?' +'+(mon-14):'')}
$('tr').onclick=function(e){var g=boat?3:1;ban+=g;tot+=g;var f=document.createElement('div');f.className='fly';f.textContent='🍌';f.style.left=(130+Math.random()*60)+'px';f.style.top='60px';$('isl').appendChild(f);setTimeout(function(){f.remove()},1000);ui()};
$('sl').onclick=function(){if(ban<1){$('m').textContent='u have no bananas. sad';return}coin+=Math.floor(ban)*price;$('m').textContent='sold '+Math.floor(ban)+' bananas!';ban-=Math.floor(ban);ui()};
$('hm').onclick=function(){if(coin<cost)return;coin-=cost;mon++;cost=Math.ceil(cost*1.4);$('m').textContent=['new monke!! his name is '+['Gerald','Bonk','Steve','Mr Tail','Chimpy'][Math.random()*5|0],'monke hired. pays in bananas'][Math.random()*2|0];ui()};
$('bt').onclick=function(){if(coin<500||boat)return;coin-=500;boat=1;$('m').textContent='⛵ u bought a boat!! taps now give 3 🍌 (boat does nothing else)';ui()};
setInterval(function(){var g=mon*0.25;ban+=g;tot+=g;ui()},500);
setInterval(function(){price=Math.max(0.3,Math.min(4,price+(Math.random()-.5)*0.6));if(Math.random()<.2)$('m').textContent=price>2?'📈 BANANA PRICES ARE UP!!! SELL!!!':'📉 banana market crashed (a monke sneezed)';ui()},3000);
ui();
</script></body></html>
