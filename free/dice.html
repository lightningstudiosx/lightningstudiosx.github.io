<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DICE HD 2 REAL</title>
<style>
body{margin:0;background:#f0f;color:#ff0;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#fff;text-shadow:3px 3px #00f;margin:4px;transform:rotate(-2deg);font-size:38px}
a{color:#ff0}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}
#lb{width:0;height:20px;background:#0a0;border:2px solid #000;margin:8px auto 0;max-width:80%}
.ft{font-size:10px;color:#fff;margin:10px}
canvas{max-width:96vw;border:10px solid #840;touch-action:none;cursor:pointer}
button{font:bold 16px Impact,sans-serif;background:#ff0;border:3px outset #fc0;padding:6px 12px;margin:2px}
#s{font:bold 22px Impact,sans-serif;background:#00f;color:#fff;display:inline-block;padding:3px 10px}
</style></head><body>
<div id="ld">CARVING DICE... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>🎲 DICE HD 2 REAL 🎲</h1>
<div>tap a die to kick it. dice are 2D (3D is in the DLC)</div>
<canvas id="c" width="340" height="380"></canvas><br>
<div id="s">TOTAL: 0</div><br>
<button id="ad">+ ADD DIE</button><button id="ro">ROLL ALL</button><button id="cl">CLEAR</button>
<div id="m" style="font-weight:bold;min-height:22px"></div>
<p class="ft">made in 5 minits. dice may be loaded (with bugs)<br>(joke knockoff — the real game is at <a href='../dice.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var c=document.getElementById('c'),x=c.getContext('2d'),D=[],S=44,rolls=0,cl=['#fff','#f66','#6f6','#69f','#ff6','#f9f'];
var PIP={1:[[.5,.5]],2:[[.25,.25],[.75,.75]],3:[[.25,.25],[.5,.5],[.75,.75]],4:[[.25,.25],[.75,.25],[.25,.75],[.75,.75]],5:[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]],6:[[.25,.2],[.75,.2],[.25,.5],[.75,.5],[.25,.8],[.75,.8]]};
function add(){if(D.length>=12){document.getElementById('m').textContent='table is full. its a small table';return}D.push({x:40+Math.random()*260,y:40+Math.random()*300,vx:0,vy:0,a:0,va:0,v:1+Math.random()*6|0,c:cl[D.length%6]})}
function kick(d){d.vx=(Math.random()-.5)*28;d.vy=(Math.random()-.5)*28;d.va=(Math.random()-.5)*.8}
function loop(){var moving=0;D.forEach(function(d){d.x+=d.vx;d.y+=d.vy;d.a+=d.va;d.vx*=.96;d.vy*=.96;d.va*=.95;
  if(d.x<S/2){d.x=S/2;d.vx*=-.8}if(d.x>340-S/2){d.x=340-S/2;d.vx*=-.8}if(d.y<S/2){d.y=S/2;d.vy*=-.8}if(d.y>380-S/2){d.y=380-S/2;d.vy*=-.8}
  var sp=Math.abs(d.vx)+Math.abs(d.vy);if(sp>1.5){moving=1;if(Math.random()<.3)d.v=1+Math.random()*6|0}else{d.vx=d.vy=0;d.a+=(Math.round(d.a/(Math.PI/2))*(Math.PI/2)-d.a)*.2}});
  for(var i=0;i<D.length;i++)for(var j=i+1;j<D.length;j++){var a=D[i],b=D[j],dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy);if(dd<S&&dd>0){var p=(S-dd)/2,nx=dx/dd,ny=dy/dd;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;var t=a.vx;a.vx=b.vx;b.vx=t;t=a.vy;a.vy=b.vy;b.vy=t}}
  x.fillStyle='#0a5';x.fillRect(0,0,340,380);x.fillStyle='rgba(0,0,0,.08)';for(var k=0;k<380;k+=16)x.fillRect(0,k,340,2);
  var tot=0;D.forEach(function(d){tot+=d.v;x.save();x.translate(d.x,d.y);x.rotate(d.a);x.fillStyle='rgba(0,0,0,.3)';x.fillRect(-S/2+4,-S/2+4,S,S);x.fillStyle=d.c;x.fillRect(-S/2,-S/2,S,S);x.strokeStyle='#000';x.lineWidth=3;x.strokeRect(-S/2,-S/2,S,S);
    x.fillStyle='#000';PIP[d.v].forEach(function(p){x.beginPath();x.arc(-S/2+p[0]*S,-S/2+p[1]*S,4.5,0,7);x.fill()});x.restore()});
  document.getElementById('s').textContent='TOTAL: '+tot+(moving?' (rolling...)':'')+' · ROLLS: '+rolls;
  requestAnimationFrame(loop)}
c.onpointerdown=function(e){var r=c.getBoundingClientRect(),px=(e.clientX-r.left)*c.width/r.width,py=(e.clientY-r.top)*c.height/r.height,hit=0;
  D.forEach(function(d){if(Math.abs(d.x-px)<S*.7&&Math.abs(d.y-py)<S*.7){kick(d);hit=1}});if(hit){rolls++;document.getElementById('m').textContent=['KICK!','bonk','yeet','roll roll roll'][Math.random()*4|0]}};
document.getElementById('ad').onclick=function(){add()};document.getElementById('ro').onclick=function(){D.forEach(kick);rolls++};
document.getElementById('cl').onclick=function(){D=[];document.getElementById('m').textContent='dice gone. where did they go'};
add();add();loop();
</script></body></html>
