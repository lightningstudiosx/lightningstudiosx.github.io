<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOKS MARKIT REAL 2</title>
<style>
body{margin:0;background:#003;color:#0f0;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#0f0;text-shadow:3px 3px #f00;margin:4px;transform:rotate(-1deg);font-size:36px}
a{color:#ff0}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}

.ft{font-size:10px;color:#fff;margin:10px}
canvas{max-width:96vw;border:3px solid #0f0;background:#000}
button{font:bold 15px Impact,sans-serif;border:3px outset #888;padding:6px 10px;margin:2px}
.co.on{background:#ff0}

</style></head><body>
<div id="ld">CONNECTING TO SOCK EXCHANGE... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>🧦 SOKS MARKIT REAL 2 📈</h1>
<div><button class="co on" data-i="0">SOKCO</button><button class="co" data-i="1">FUZZYTOE</button><button class="co" data-i="2">HOLEY INC</button></div>
<canvas id="c" width="340" height="180"></canvas>
<div id="hud"></div><br>
<button id="by" style="background:#0f0">BUY 1</button><button id="sl" style="background:#f66">SELL 1</button><button id="bo" style="background:#0ff">BORROW $50 (laundromat bank)</button><button id="pb" style="background:#fc0">PAY BACK $50</button>
<div id="news">📰 markets are open. socks are on feet.</div>
<p class="ft">made in 5 minits. not financial advise. its socks.<br>(joke knockoff — the real game is at <a href='../soks.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var S=[{n:'SOKCO',p:20,h:[],o:0,c:'#0f0'},{n:'FUZZYTOE',p:8,h:[],o:0,c:'#0ff'},{n:'HOLEY INC',p:50,h:[],o:0,c:'#f0f'}],sel=0,cash=100,debt=0,start=100;
var NEWS=[[0,1.3,'SOKCO invents a sock with 6 toes!!'],[1,0.6,'FUZZYTOE recalls 1000 left socks'],[2,1.5,'HOLEY INC: holes are now a feature'],[0,0.7,'dryer ate all SOKCO inventory'],[1,1.4,'celebrity wears FUZZYTOE to a wedding'],[2,0.5,'HOLEY INC CEO steps on a lego']];
S.forEach(function(s){for(var i=0;i<60;i++)s.h.push(s.p)});
var c=document.getElementById('c'),x=c.getContext('2d');
function $(i){return document.getElementById(i)}
function worth(){return cash-debt+S.reduce(function(a,s){return a+s.o*s.p},0)}
function draw(){var s=S[sel],mx=Math.max.apply(0,s.h)*1.1,mn=Math.min.apply(0,s.h)*0.9;x.fillStyle='#000';x.fillRect(0,0,340,180);
  x.strokeStyle='#030';for(var i=0;i<180;i+=30){x.beginPath();x.moveTo(0,i);x.lineTo(340,i);x.stroke()}
  x.strokeStyle=s.c;x.lineWidth=3;x.beginPath();s.h.forEach(function(v,i){var yy=170-(v-mn)/(mx-mn||1)*160;i?x.lineTo(i*5.7,yy):x.moveTo(0,yy)});x.stroke();
  x.fillStyle='#fff';x.font='bold 16px Impact';x.fillText(s.n+' $'+s.p.toFixed(2),8,20);x.font='26px serif';x.fillText('🧦',300,30);
  var w=worth();$('hud').textContent='CASH $'+cash.toFixed(2)+' · OWN '+s.o+' · DEBT $'+debt+' · NET WORTH $'+w.toFixed(2)+(w>start?' 📈':' 📉')}
setInterval(function(){S.forEach(function(s){s.p=Math.max(0.5,s.p*(1+(Math.random()-.49)*0.08));s.h.push(s.p);s.h.shift()});
  if(Math.random()<.08){var e=NEWS[Math.random()*NEWS.length|0];S[e[0]].p*=e[1];$('news').textContent='📰 '+e[2]}draw()},500);
document.querySelectorAll('.co').forEach(function(b){b.onclick=function(){sel=+b.dataset.i;document.querySelectorAll('.co').forEach(function(o){o.className='co'});b.className='co on';draw()}});
$('by').onclick=function(){var s=S[sel];if(cash>=s.p){cash-=s.p;s.o++;$('news').textContent='📰 u bought 1 '+s.n+'. it smells'}else $('news').textContent='📰 not enuf money. sell a kidney? (no)';draw()};
$('sl').onclick=function(){var s=S[sel];if(s.o>0){cash+=s.p;s.o--;$('news').textContent='📰 sold 1 '+s.n}else $('news').textContent='📰 u dont own any. (shorting is premium)';draw()};
$('bo').onclick=function(){cash+=50;debt+=50;$('news').textContent='📰 laundromat bank lent u $50 in quarters';draw()};
$('pb').onclick=function(){if(debt>=50&&cash>=50){cash-=50;debt-=50;$('news').textContent='📰 paid back. bank is happy (it is a washing machine)'}draw()};
draw();
</script></body></html>
