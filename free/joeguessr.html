<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOEGESSR FREE (100% REAL JOES)</title>
<style>
body{margin:0;padding:32px 8px 8px;background:#0a0;color:#fff;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center}
h1{font:46px Impact,sans-serif;color:#ff0;text-shadow:3px 3px #f00;margin:4px}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{font-size:10px;padding:10px}.ft a{color:#ff0}
canvas{background:#fff;border:8px solid #f0f;transform:rotate(-2deg);max-width:70vw}
button{font:30px Impact,sans-serif;padding:8px 22px;margin:8px;border:5px outset;cursor:pointer}
#j{background:#ff0;color:#00f;border-color:#ff0}#n{background:#f00;color:#fff;border-color:#f00}
#msg{font-size:22px;min-height:60px;background:#000;color:#0f0;max-width:500px;margin:6px auto;padding:6px}
</style></head><body>
<div id="ld">LOADING SUSPECTS...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>JOE GESSR</h1>
<div>ROUND <b id="rd">1</b>/10 · SCORE <b id="sc">0</b> · RATING <b id="rt">1000</b></div>
<canvas id="cv" width="220" height="220"></canvas>
<div style="font-size:26px">is this person named <b style="color:#ff0">JOE</b>?</div>
<button id="j">JOE (J)</button><button id="n">NOT JOE (N)</button>
<div id="msg">look at his face. does it look like a joe.</div>
<div class="ft">made in 5 minits by xX_kai_Xx · photos drawn by me · (joke knockoff — the real game is at <a href='../joeguessr.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var g=document.getElementById('cv').getContext('2d'),round=1,score=0,rating=1000,isJoe,name,wait=false;
var NOT=['Joey','Joseph','Joel','Moe','Jo','Bob','Jim','Joan','Doe','Jeo','Joe-Bob','Toe','Jöe'],LAST=['Hamburger','McJoe','Smith','Pickles','Sandwich','Notjoe','Spoon','Wobble','Bigfoot'];
function r(a){return a[Math.floor(Math.random()*a.length)]}
function face(){
  g.fillStyle='#fff';g.fillRect(0,0,220,220);
  g.fillStyle=r(['#fc9','#c96','#0f0','#99f','#f9c','#fd5','#a63']);g.beginPath();g.ellipse(110,120,60+Math.random()*20,75+Math.random()*15,Math.random()*.4-.2,0,7);g.fill();g.strokeStyle='#000';g.lineWidth=3;g.stroke();
  g.fillStyle=r(['#000','#ff0','#f00','#840','#fff']);g.fillRect(55+Math.random()*10,40,110,25+Math.random()*25);
  var ey=105+Math.random()*10;g.fillStyle='#fff';g.beginPath();g.arc(85,ey,12,0,7);g.arc(135,ey+Math.random()*8,9+Math.random()*8,0,7);g.fill();g.stroke();
  g.fillStyle='#000';g.beginPath();g.arc(87,ey,4,0,7);g.arc(133,ey+3,4,0,7);g.fill();
  g.beginPath();g.moveTo(110,ey+5);g.lineTo(100+Math.random()*20,ey+35);g.lineTo(115,ey+35);g.stroke();
  g.beginPath();var m=Math.random();if(m<.5)g.arc(110,160,22,0.2,Math.PI-0.2);else g.arc(110,185,20,Math.PI+0.3,-0.3);g.stroke();
  if(Math.random()<.4){g.fillStyle='#840';g.fillRect(85,168,50,8)}
  if(Math.random()<.3){g.strokeStyle='#00f';g.strokeRect(68,ey-14,34,28);g.strokeRect(118,ey-14,34,28)}
}
function next(){isJoe=Math.random()<.5;name=(isJoe?'Joe':r(NOT))+' '+r(LAST);face();wait=false;document.getElementById('rd').textContent=round}
function guess(j){
  if(wait)return;wait=true;var m=document.getElementById('msg');
  if(round>10){round=1;score=0;document.getElementById('sc').textContent=0;m.textContent='new case. new joes.';next();return}
  if(j===isJoe){score++;rating+=Math.floor(Math.random()*30)+5;m.innerHTML='✅ CORRECT!! this is <b>'+name+'</b>'}
  else{rating-=Math.floor(Math.random()*30)+5;m.innerHTML='❌ WRONG. this is <b>'+name+'</b>'+(isJoe?'':' (close tho)')}
  document.getElementById('sc').textContent=score;document.getElementById('rt').textContent=rating;
  round++;
  setTimeout(function(){if(round>10){m.innerHTML+='<br>CASE CLOSED: '+score+'/10 joes. press any button 2 restart';wait=false;}else next()},900);
}
document.getElementById('j').onclick=function(){guess(true)};document.getElementById('n').onclick=function(){guess(false)};
document.onkeydown=function(e){if(e.key==='j'||e.key==='J')guess(true);if(e.key==='n'||e.key==='N')guess(false)};
next();
</script></body></html>
