<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SERCH FREE (searches evrything)</title>
<style>
body{margin:0;padding:32px 8px 8px;background:#fc0;color:#000;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center}
h1{font:54px Impact,sans-serif;margin:4px;letter-spacing:2px}
h1 span:nth-child(1){color:#00f}h1 span:nth-child(2){color:#f00}h1 span:nth-child(3){color:#0a0}h1 span:nth-child(4){color:#f0f}h1 span:nth-child(5){color:#fff}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{font-size:10px;padding:10px}
input{font:22px "Comic Sans MS",cursive;width:70%;max-width:380px;border:4px solid #00f;border-radius:20px;padding:6px 12px}
button{font:20px Impact,sans-serif;background:#0a0;color:#ff0;border:4px outset #0a0;padding:6px 14px;margin:4px;cursor:pointer}
canvas{background:#fff;border:4px dashed #000;max-width:96vw;margin-top:8px}
#res{max-width:640px;margin:8px auto;text-align:left;background:#fff;border:3px solid #f0f;padding:8px;font-size:14px;min-height:40px}
#res div{margin:4px 0;border-bottom:1px dotted #999}
</style></head><body>
<div id="ld">INDEXING THE INTERNET (all of it)...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1><span>S</span><span>E</span><span>R</span><span>C</span><span>H</span></h1>
<div>type 1 word. we show every day in history it was said (we guessed)</div>
<input id="q" value="pancake" maxlength="30"><button id="go">SERCH 🔍</button>
<br><canvas id="cv" width="640" height="300"></canvas>
<div id="res"></div>
<p>searches: <b id="c">0</b> · days lit: <b id="d">0</b></p>
<div class="ft">made in 5 minits by xX_kai_Xx · no internet was used · (joke knockoff — the real game is at <a href='../search.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var g=document.getElementById('cv').getContext('2d'),n=0;
function rng(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return function(){h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%10000)/10000}}
var WHO=['a guy at a bus stop','my uncle','a newspaper (probly)','a parrot','someone on a boat','a king (small)','a teacher','a very old book','the radio','a sign on a fence','a dog (we think)'];
function go(){
  var w=document.getElementById('q').value.trim().toLowerCase().replace(/[<>&"]/g,'');if(!w)return;
  var R=rng(w),Y0=1950,Y1=2026,cols=Y1-Y0+1,cw=640/cols,ch=(300-30)/12,lit=0,hits=[],dens=.05+R()*.4;
  g.fillStyle='#fff';g.fillRect(0,0,640,300);
  for(var y=0;y<cols;y++){var boom=R()<.15?2:1;for(var m=0;m<12;m++){var on=R()<dens*boom*((y/cols)+.3);
      g.fillStyle=on?['#f00','#00f','#0a0','#f0f'][Math.floor(R()*4)]:'#eee';g.fillRect(y*cw,m*ch,cw-1,ch-1);
      if(on){lit++;hits.push([Y0+y,m+1])}}}
  g.fillStyle='#000';g.font='11px Comic Sans MS';for(var yy=0;yy<cols;yy+=10)g.fillText(Y0+yy,yy*cw,295);
  g.font='bold 14px Comic Sans MS';g.fillText('"'+w+'" was said '+lit+' times (months, roughly)',200,288);
  var out='';for(var i=0;i<Math.min(6,hits.length);i++){var h=hits[Math.floor(R()*hits.length)];
    out+='<div>📅 '+h[0]+'-'+String(h[1]).padStart(2,'0')+'-'+String(1+Math.floor(R()*28)).padStart(2,'0')+': '+WHO[Math.floor(R()*WHO.length)]+' said "<b>'+w+'</b>"'+(R()<.3?' (twice)':'')+'</div>'}
  document.getElementById('res').innerHTML=out||'nobody ever said "'+w+'". u invented it. congrats';
  n++;document.getElementById('c').textContent=n;document.getElementById('d').textContent=lit;
}
document.getElementById('go').onclick=go;document.getElementById('q').onkeydown=function(e){if(e.key==='Enter')go()};
go();
</script></body></html>
