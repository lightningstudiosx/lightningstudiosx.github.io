<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>THE GAEM OF PAWSING 2 HD</title>
<style>
body{margin:0;padding:30px 4px 4px;background:#000;color:#fff;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;user-select:none}
h1{font:40px Impact,sans-serif;color:#fff;text-shadow:3px 3px #f00;margin:4px}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{font-size:10px;padding:10px}.ft a{color:#ff0}
canvas{background:#333;border:6px dashed #fff;max-width:96vw;touch-action:manipulation;cursor:pointer}
</style></head><body>
<div id="ld">PAUSING THE LOADING...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>THE GAEM OF PAWSING 2</h1>
<div>the only button is PAUSE. pause when the 🐾 is in the green. (tap / space)</div>
<canvas id="cv" width="600" height="220"></canvas>
<p>good pauses: <b id="sc">0</b> · lives: <b id="lv">3</b> · best: <b id="bs">0</b></p>
<div class="ft">made in 5 minits by xX_kai_Xx · (joke knockoff — the real game is at <a href='../pause.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var cv=document.getElementById('cv'),g=cv.getContext('2d'),x=40,v=4,zx=300,zw=110,paused=false,sc=0,lv=3,best=0,msg='',dead=false;
function newZone(){zw=Math.max(24,110-sc*7);zx=30+Math.random()*(540-zw)}
function draw(){
  g.fillStyle='#333';g.fillRect(0,0,600,220);
  g.fillStyle='#0c0';g.fillRect(zx,70,zw,80);g.strokeStyle='#ff0';g.lineWidth=3;g.strokeRect(zx,70,zw,80);
  g.fillStyle='#fff';g.fillRect(0,108,600,4);
  g.font='44px serif';g.fillText('🐾',x-22,128);
  g.font='bold 20px Comic Sans MS';g.fillStyle='#ff0';g.fillText(msg,14,40);
  if(paused){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,600,220);g.fillStyle='#fff';g.font='60px Impact';g.fillText(dead?'GAME OVER':'❚❚ PAUSED',dead?160:150,135);g.font='16px Comic Sans MS';g.fillText(dead?'tap to start over':'tap to unpause',230,185)}
}
function loop(){if(!paused){x+=v;if(x>580||x<20){v=-v;x+=v*2}}draw();requestAnimationFrame(loop)}
function hit(){
  if(paused){if(dead){dead=false;sc=0;lv=3;v=4;newZone();document.getElementById('sc').textContent=0;document.getElementById('lv').textContent=3;msg=''}paused=false;return}
  paused=true;
  if(x>zx&&x<zx+zw){sc++;msg=['NICE PAUSE','PURRFECT','u paused it good','pause master','wow (pause)'][sc%5];v=(Math.abs(v)+.8)*(Math.random()<.5?-1:1);newZone()}
  else{lv--;msg='BAD PAUSE. that was not green';if(lv<=0){dead=true;if(sc>best)best=sc;document.getElementById('bs').textContent=best}}
  document.getElementById('sc').textContent=sc;document.getElementById('lv').textContent=Math.max(0,lv);
}
cv.addEventListener('pointerdown',function(e){e.preventDefault();hit()});
onkeydown=function(e){if(e.key===' '||e.key==='p'||e.key==='Enter'){e.preventDefault();hit()}};
newZone();loop();
</script></body></html>
