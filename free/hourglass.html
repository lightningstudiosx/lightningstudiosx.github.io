<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>HOURGLAS HD 2 (real sand)</title>
<style>
body{margin:0;padding:30px 4px 4px;background:#fd0;color:#00f;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;user-select:none}
h1{font:40px Impact,sans-serif;color:#f00;text-shadow:3px 3px #0ff;margin:2px}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{font-size:10px;padding:6px}
canvas{background:#0af;border:6px ridge #f0f;max-width:94vw;max-height:60vh;touch-action:manipulation;cursor:pointer}
button{font:22px Impact,sans-serif;background:#f0f;color:#ff0;border:4px outset #f0f;padding:6px 16px;margin:4px;cursor:pointer}
</style></head><body>
<div id="ld">POURING SAND...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>HOURGLAS HD 2</h1>
<canvas id="cv" width="300" height="400"></canvas><br>
<button id="fl">🔄 FLIP</button>
<div>elapsed: <b id="el">0:00</b> · flips: <b id="fc">0</b> · grains fallen: <b id="gr">0</b></div>
<div style="font-size:12px">tap the glass or press space to flip. (takes 30 secs. not an hour. sorry)</div>
<div class="ft">made in 5 minits by xX_kai_Xx · (joke knockoff — the real game is at <a href='../hourglass.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var cv=document.getElementById('cv'),g=cv.getContext('2d'),TOT=1800,top_=TOT,flips=0,fallen=0,rot=0,flipping=0,t0=Date.now(),drops=[];
var CX=150,TY=40,NY=200,BY=360,HW=110;
function glass(){g.beginPath();g.moveTo(CX-HW,TY);g.lineTo(CX+HW,TY);g.lineTo(CX+8,NY);g.lineTo(CX+HW,BY);g.lineTo(CX-HW,BY);g.lineTo(CX-8,NY);g.closePath()}
function draw(){
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#0af';g.fillRect(0,0,300,400);
  g.translate(150,200);g.rotate(rot);g.translate(-150,-200);
  g.fillStyle='#840';g.fillRect(CX-HW-15,TY-20,2*HW+30,20);g.fillRect(CX-HW-15,BY,2*HW+30,20);
  g.save();glass();g.fillStyle='#cff';g.fill();g.clip();
  var ft=top_/TOT,fb=1-ft,hT=(NY-TY)*Math.sqrt(ft),hB=(BY-NY)*(1-Math.sqrt(1-fb));
  g.fillStyle='#e8c06e';g.fillRect(0,NY-hT,300,hT);
  g.fillStyle='#d9a84a';g.beginPath();g.moveTo(CX-HW,BY);g.lineTo(CX+HW,BY);g.lineTo(CX+HW,BY-hB+10);g.lineTo(CX,BY-hB-12);g.lineTo(CX-HW,BY-hB+10);g.fill();
  g.fillStyle='#e8c06e';drops.forEach(function(d){g.fillRect(d.x,d.y,3,3)});
  g.restore();g.lineWidth=5;g.strokeStyle='#000';glass();g.stroke();
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#000';g.font='bold 14px Comic Sans MS';
  if(top_<=0&&!flipping)g.fillText('ALL DONE. flip it!!',90,390);
}
function loop(){
  if(flipping>0){rot+=Math.PI/30;flipping--;if(flipping===0){rot=0;top_=TOT-top_;drops=[]}}
  else if(top_>0){top_--;fallen++;if(Math.random()<.7)drops.push({x:CX-1+Math.random()*3,y:NY,v:2})}
  for(var i=drops.length-1;i>=0;i--){var d=drops[i];d.v+=.3;d.y+=d.v;var ft=top_/TOT,hB=(BY-NY)*(1-Math.sqrt(ft));if(d.y>BY-hB-8)drops.splice(i,1)}
  draw();
  var s=Math.floor((Date.now()-t0)/1000);document.getElementById('el').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  document.getElementById('gr').textContent=fallen;
  requestAnimationFrame(loop);
}
function flip(){if(flipping)return;flipping=30;flips++;document.getElementById('fc').textContent=flips}
cv.onclick=flip;document.getElementById('fl').onclick=flip;
onkeydown=function(e){if(e.key===' '){e.preventDefault();flip()}};
loop();
</script></body></html>
