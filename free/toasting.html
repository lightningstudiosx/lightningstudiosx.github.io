<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>a simpel game about tosting FREE 2</title>
<style>
body{margin:0;padding:32px 8px 8px;background:#630;color:#ff0;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center}
h1{font:36px Impact,sans-serif;color:#fc6;text-shadow:3px 3px #000;margin:4px}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{font-size:10px;padding:10px}.ft a{color:#0ff}
#cnt{font:44px Impact,sans-serif;color:#fff}
#ts{font-size:120px;background:none;border:none;cursor:pointer;transition:transform .08s;user-select:none}
#ts:active{transform:scale(.88) rotate(8deg)}
#shop{max-width:460px;margin:6px auto;background:#ffe;color:#000;padding:8px;border:3px dashed #000;transform:rotate(-1deg);font-family:"Courier New",monospace;text-align:left}
.b{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dotted #000;padding:4px 0}
.b button{font:16px Impact,sans-serif;background:#c00;color:#fff;border:3px outset #c00;cursor:pointer;padding:3px 10px}
.b button:disabled{background:#888;border-color:#888}
#news{font-size:14px;min-height:22px;color:#fc6}
</style></head><body>
<div id="ld">PREHEATING...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>a simpel game about tosting FREE</h1>
<div id="cnt">0 toast</div>
<div><b id="ps">0</b> toast/s</div>
<button id="ts" aria-label="toast">🍞</button>
<div id="news">BREAKING: local person enjoys toast</div>
<div id="shop"></div>
<div class="ft">made in 5 minits by xX_kai_Xx · do not eat ur screen · (joke knockoff — the real game is at <a href='../toasting.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var U=[['🔌 old toaster',15,.5],['🧈 butter guy',100,3],['🔥 lava toaster',600,15],['👵 grandma (toasts fast)',3000,60],['🏭 toast factory',15000,300],['🌞 the sun (toaster)',99999,2000]],own=[0,0,0,0,0,0],toast=0,burnt=0;
try{var s=JSON.parse(localStorage.getItem('toast2')||'null');if(s){toast=s.t||0;own=s.o||own}}catch(e){}
var NEWS=['BREAKING: toast is still bread but hot','experts say: more toast','a toaster was seen toasting','toast prices hit 0 coins','local bread nervous','scientists confirm toast is crunchy','u are now the toast person'];
function rate(){var r=0;for(var i=0;i<U.length;i++)r+=own[i]*U[i][2];return r}
function cost(i){return Math.floor(U[i][1]*Math.pow(1.15,own[i]))}
function shop(){var h='<b>🧾 TOAST SHOP — ORDER #'+(1000+toast%9000|0)+'</b>';U.forEach(function(u,i){h+='<div class="b"><span>'+u[0]+' x'+own[i]+'<br><small>+'+u[2]+'/s</small></span><button data-i="'+i+'">'+cost(i)+' 🍞</button></div>'});
  document.getElementById('shop').innerHTML=h;[].forEach.call(document.querySelectorAll('.b button'),function(b){b.onclick=function(){buy(+b.getAttribute('data-i'))}});upd()}
function upd(){document.getElementById('cnt').textContent=Math.floor(toast).toLocaleString()+' toast';document.getElementById('ps').textContent=rate().toFixed(1);
  [].forEach.call(document.querySelectorAll('.b button'),function(b){b.disabled=toast<cost(+b.getAttribute('data-i'))})}
function buy(i){var c=cost(i);if(toast<c)return;toast-=c;own[i]++;document.getElementById('news').textContent='u bought '+U[i][0]+'. it smells like toast';shop()}
document.getElementById('ts').onclick=function(){
  if(Math.random()<.06){burnt++;this.textContent='⬛';document.getElementById('news').textContent='oops u burnt one. thats '+burnt+' burnt toast. still counts tho';toast+=1}
  else{this.textContent='🍞';toast+=1+Math.floor(own[1]/5)}
  upd();
};
setInterval(function(){toast+=rate()/10;upd()},100);
setInterval(function(){document.getElementById('news').textContent=NEWS[Math.floor(Math.random()*NEWS.length)];try{localStorage.setItem('toast2',JSON.stringify({t:toast,o:own}))}catch(e){}},5000);
shop();
</script></body></html>
