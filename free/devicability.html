<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>DEVICABILTY HD (works on any devise)</title>
<style>
body{margin:0;padding:30px 4px 4px;background:#111;color:#0ff;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow:hidden}
h1{font:36px Impact,sans-serif;color:#f0f;text-shadow:3px 3px #0f0;margin:2px}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{font-size:10px;padding:4px}.ft a{color:#ff0}
canvas{background:#9c9;border:6px inset #555;touch-action:none;max-width:96vw;max-height:62vh;image-rendering:pixelated}
#dv{font-size:18px;color:#ff0}
</style></head><body>
<div id="ld">DETECTING UR DEVISE...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>DEVICABILTY HD</h1>
<div id="dv">ur device is a ...</div>
<canvas id="cv" width="160" height="200"></canvas>
<div>score: <b id="sc">0</b> · best: <b id="bs">0</b> · <small>← → / A D / drag. tap to start</small></div>
<div class="ft">made in 5 minits by xX_kai_Xx · runs at 12fps on purpose (we think) · (joke knockoff — the real game is at <a href='../devicability.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var w=innerWidth,D=w<500?['a POTATO 🥔','potato']:w<900?['a TOASTER 🍞','toaster']:w<1500?['a MICROWAVE 📟','microwave']:['a FRIDGE (big screen) 🧊','fridge'];
document.getElementById('dv').textContent='ur device is '+D[0]+' · graphics: '+(w<500?'1 color':'2 colors');
var cv=document.getElementById('cv'),g=cv.getContext('2d'),W=160,H=200,px=80,tx=80,blocks=[],run=false,sc=0,best=0,keys={},tick=0;
function reset(){blocks=[];sc=0;px=tx=80;run=true;tick=0}
function loop(){
  if(run){
    tick++;
    if(keys.l)tx-=6;if(keys.r)tx+=6;tx=Math.max(6,Math.min(W-6,tx));px+=(tx-px)*.5;
    if(tick%Math.max(3,10-Math.floor(sc/8))===0)blocks.push({x:Math.random()*(W-16),y:-10,w:10+Math.random()*(sc>15?30:12),v:3+Math.random()*2+sc/12});
    for(var i=blocks.length-1;i>=0;i--){var b=blocks[i];b.y+=b.v;
      if(b.y>H){blocks.splice(i,1);sc++;document.getElementById('sc').textContent=sc;continue}
      if(b.y+10>H-16&&b.y<H-6&&px+5>b.x&&px-5<b.x+b.w){run=false;if(sc>best){best=sc;document.getElementById('bs').textContent=best}}}
  }
  g.fillStyle='#9c9';g.fillRect(0,0,W,H);g.fillStyle='#132';
  blocks.forEach(function(b){g.fillRect(Math.round(b.x/4)*4,Math.round(b.y/4)*4,b.w,10)});
  g.fillRect(Math.round(px/4)*4-5,H-16,10,10);
  g.font='10px monospace';
  if(!run){g.fillText(sc?'U GOT HIT. '+D[1]+' sad':'DODGE THE BLOX',20,90);g.fillText('tap to play',45,110)}
}
setInterval(loop,1000/12);
function pt(e){var q=cv.getBoundingClientRect();tx=(e.clientX-q.left)*W/q.width}
cv.addEventListener('pointerdown',function(e){if(!run)reset();pt(e)});
cv.addEventListener('pointermove',function(e){if(e.buttons||e.pointerType==='touch')pt(e)});
onkeydown=function(e){var k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.l=1;if(k==='arrowright'||k==='d')keys.r=1;if((k===' '||k==='enter')&&!run)reset()};
onkeyup=function(e){var k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.l=0;if(k==='arrowright'||k==='d')keys.r=0};
</script></body></html>
