<h1>MIROR MAZE 3D (2D)</h1>

<script>
var c=document.getElementById('c'),x=c?c.getContext('2d'):null;
function P(e){var r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function T(s,X,Y,z,col,al){x.font='bold '+(z||20)+'px "Comic Sans MS",cursive';x.fillStyle=col||'#000';x.textAlign=al||'left';x.fillText(s,X,Y)}
function R(a,b){return a+Math.random()*(b-a)}
function $(i){return document.getElementById(i)}
(function(){var p=0,b=$('lb'),t=$('lt'),i=setInterval(function(){p=Math.min(99,p+Math.random()*20);b.style.width=p+'%';t.textContent='LOADING... '+(p|0)+'%'},110);
setTimeout(function(){clearInterval(i);b.style.width='100%';t.textContent='LOADING... 101%';setTimeout(function(){$('ld').remove()},350)},1500)})();
</script>
<script>
var G,S=45,lr,tc,tr,lv=0,won=0;
function nl(){G=[];lr=Math.random()*6|0;tc=2+Math.random()*6|0;do{tr=Math.random()*6|0}while(tr==lr);for(var r=0;r<6;r++){G.push([]);for(var q=0;q<8;q++){var path=(r==lr&&q<=tc)||(q==tc&&(r-lr)*(r-tr)<=0);G[r].push(!path&&Math.random()<.2?3:0)}}won=0}
function draw(){x.fillStyle='#113';x.fillRect(0,0,360,270);for(var r=0;r<6;r++)for(var q=0;q<8;q++){x.strokeStyle='#f0f';x.strokeRect(q*S,r*S,S,S);var g=G[r][q];
if(g==3){x.fillStyle='#a52';x.fillRect(q*S+3,r*S+3,S-6,S-6)}if(g==1||g==2){x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.moveTo(q*S+5,g==1?r*S+S-5:r*S+5);x.lineTo(q*S+S-5,g==1?r*S+5:r*S+S-5);x.stroke();x.lineWidth=1}}
x.font='30px serif';x.textAlign='center';x.fillText('🎯',tc*S+22,tr*S+33);
var cx=-1,cy=lr,dx=1,dy=0,pts=[[0,lr*S+22]],hit=0;for(var k=0;k<60;k++){cx+=dx;cy+=dy;if(cx<0||cy<0||cx>7||cy>5)break;var g=G[cy][cx];pts.push([cx*S+22,cy*S+22]);if(cx==tc&&cy==tr){hit=1;break}if(g==3)break;
if(g==1){var t=dx;dx=-dy;dy=-t}if(g==2){t=dx;dx=dy;dy=t}}if(!hit&&k<60)pts.push([(cx)*S+22,(cy)*S+22]);
x.strokeStyle='#f00';x.lineWidth=4;x.beginPath();pts.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.stroke();x.lineWidth=1;
if(hit&&!won){won=1;lv++;$('s').textContent='LEVELS: '+lv;setTimeout(nl,900)}if(won)T('U DID IT!!!',180,140,40,'#0f0','center');requestAnimationFrame(draw)}
c.onpointerdown=function(e){var p=P(e),q=p.x/S|0,r=p.y/S|0;if(G[r]&&G[r][q]!=3&&!(q==tc&&r==tr))G[r][q]=(G[r][q]+1)%3};nl();draw();
</script>
