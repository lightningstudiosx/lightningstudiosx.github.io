<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE FRIGDE 2 FREE</title>
<style>
body{margin:0;background:#f6c;color:#006;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#0ff;text-shadow:3px 3px #00f;margin:4px;transform:rotate(-2deg);font-size:36px}
a{color:#00f}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}
#lb{width:0;height:20px;background:#0ff;border:2px solid #000;margin:8px auto 0;max-width:80%}
.ft{font-size:10px;color:#006;margin:10px}
#fr{position:relative;width:280px;height:380px;margin:8px auto;background:#ddd;border:5px solid #333;border-radius:12px;touch-action:none}
#in{position:absolute;inset:8px;background:#cff;display:none;font-size:40px;padding-top:20px}
#in span{cursor:pointer;display:inline-block;margin:8px}
#door{position:absolute;inset:0;background:#fff;border-radius:8px;transform-origin:left;transition:transform .4s}
#fr.open #door{transform:perspective(600px) rotateY(-75deg)}#fr.open #in{display:block}
#hd{position:absolute;right:10px;top:120px;width:14px;height:90px;background:#888;border-radius:5px;cursor:pointer}
.mg{position:absolute;padding:3px 6px;font:bold 15px "Comic Sans MS",cursive;border:2px solid #000;cursor:grab;user-select:none;touch-action:none}
#s{font:bold 18px Impact,sans-serif;background:#00f;color:#ff0;display:inline-block;padding:3px 8px}
</style></head><body>
<div id="ld">COOLING DOWN... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>🧊 THE FRIGDE 2 🧊</h1>
<div>drag magnets to make poems. tap the handle to open. CLOSE THE DOOR.</div>
<div id="fr"><div id="in"></div><div id="door"><div id="hd"></div></div></div>
<div id="m" style="font-weight:bold;min-height:24px">fridge is closed. good.</div>
<div id="s">SNACKS ATE: 0 · DOOR OPEN: 0s</div>
<p class="ft">made in 5 minits (fridge not included)<br>(joke knockoff — the real game is at <a href='../fridge.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var fr=document.getElementById('fr'),door=document.getElementById('door'),m=document.getElementById('m'),ate=0,open=0,openT=0,tot=0;
var words=['i','love','cheez','the','moon','is','a','big','egg','why','my','sock','cold','very','fridge','sad','dance','pickle'];
var cl=['#f00','#ff0','#0f0','#0ff','#f0f','#fa0'];
words.forEach(function(w,i){var s=document.createElement('span');s.className='mg';s.textContent=w;s.style.left=(10+(i%4)*62+Math.random()*10)+'px';s.style.top=(20+((i/4)|0)*60+Math.random()*20)+'px';s.style.background=cl[i%6];s.style.transform='rotate('+(Math.random()*20-10)+'deg)';door.appendChild(s);
  s.onpointerdown=function(e){e.stopPropagation();s.setPointerCapture(e.pointerId);var ox=e.clientX-s.offsetLeft,oy=e.clientY-s.offsetTop;
    s.onpointermove=function(e){s.style.left=Math.max(0,Math.min(230,e.clientX-ox))+'px';s.style.top=Math.max(0,Math.min(350,e.clientY-oy))+'px'};
    s.onpointerup=function(){s.onpointermove=null}}});
var snacks=['🍕','🥚','🧀','🥒','🍦','🧃','🥚','🌭','🍰'];
function fill(){document.getElementById('in').innerHTML=snacks.map(function(s,i){return '<span data-i="'+i+'">'+s+'</span>'}).join('')+(snacks.length?'':'<div style="font-size:16px">fridge empty. go shoping</div>')}
document.getElementById('in').onclick=function(e){var i=e.target.dataset.i;if(i==null)return;var s=snacks[i];
  if(s=='🥚'){snacks[i]='🍳';m.textContent='u cracked a egg. on the shelf. why'}else{snacks.splice(i,1);ate++;m.textContent='u ate the '+s+'. nom'}fill()};
document.getElementById('hd').onclick=function(e){e.stopPropagation();open=1;openT=Date.now();fr.className='open';m.textContent='door is open... ❄️'};
fr.onclick=function(e){if(open&&e.target.id!='in'&&!e.target.dataset.i){}};
var cb=document.createElement('button');cb.textContent='CLOSE DOOR';cb.style.cssText='font:bold 18px Impact;background:#f00;color:#fff;border:3px outset #f00;padding:6px 12px';
cb.onclick=function(){if(open){tot+=(Date.now()-openT)/1000;open=0;fr.className='';m.textContent='thank u. the fridge thanks u.'}};fr.after(cb);
setInterval(function(){var s=tot+(open?(Date.now()-openT)/1000:0);document.getElementById('s').textContent='SNACKS ATE: '+ate+' · DOOR OPEN: '+s.toFixed(0)+'s';
  if(open&&Date.now()-openT>4000)m.textContent=['CLOSE THE DOOR!!!','UR LETTING THE COLD OUT','were u born in a barn','the electric bill!!!'][((Date.now()-openT)/2000|0)%4]},500);
fill();
</script></body></html>
