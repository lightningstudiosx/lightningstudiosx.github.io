<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INCRAMENTAL FREE HD</title>
<style>
body{margin:0;background:#0f0;color:#000;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#000;text-shadow:3px 3px #fff,-2px -2px #f0f;margin:4px;transform:rotate(-2deg);font-size:36px}
a{color:#00f}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}
#lb{width:0;height:20px;background:#000;border:2px solid #000;margin:8px auto 0;max-width:80%}
.ft{font-size:10px;color:#000;margin:10px}
canvas{max-width:94vw;border:5px dashed #f0f;background:#000;touch-action:none;cursor:crosshair}
button{font:bold 16px Impact,sans-serif;background:#f0f;color:#fff;border:3px outset #f0f;padding:6px 12px;margin:2px}
#s{font:bold 18px Impact,sans-serif;background:#000;color:#fff;display:inline-block;padding:3px 8px}
</style></head><body>
<div id="ld">LOADING INFINIT CANVAS (it is 340px)... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>🌀 INCRAMENTAL FREE HD 🌀</h1>
<div>draw in white. then press FRACTALIZE. math hapens (bad math)</div>
<canvas id="c" width="340" height="340"></canvas><br>
<button id="f">🌀 FRACTALIZE</button><button id="cl">🧽 CLEAR</button>
<div id="s">FRACTALS MADE: 0 · INK USED: 0</div>
<div id="m" style="font-weight:bold;min-height:20px"></div>
<p class="ft">made in 5 minits (the fractal took 0.2 sec)<br>(joke knockoff — the real game is at <a href='../incremental.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var c=document.getElementById('c'),x=c.getContext('2d'),dn=0,lx,ly,ink=0,fr=0;
function clr(){x.fillStyle='#000';x.fillRect(0,0,340,340)}clr();
function pt(e){var r=c.getBoundingClientRect();return[(e.clientX-r.left)*340/r.width,(e.clientY-r.top)*340/r.height]}
c.onpointerdown=function(e){dn=1;var p=pt(e);lx=p[0];ly=p[1]};
c.onpointermove=function(e){if(!dn)return;var p=pt(e);x.strokeStyle='#fff';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(lx,ly);x.lineTo(p[0],p[1]);x.stroke();ink+=Math.hypot(p[0]-lx,p[1]-ly)|0;lx=p[0];ly=p[1];st()};
window.onpointerup=function(){dn=0};
function st(){document.getElementById('s').textContent='FRACTALS MADE: '+fr+' · INK USED: '+ink+'px'}
var modes=['TRIANGLE THING','SPIRAL OF DOOM','4 CORNERS','KALEIDOSCOOP'];
document.getElementById('f').onclick=function(){var mode=fr%4,t=document.createElement('canvas');t.width=t.height=340;var g=t.getContext('2d');
  for(var it=0;it<4;it++){g.clearRect(0,0,340,340);g.drawImage(c,0,0);clr();x.save();x.globalCompositeOperation='lighter';
    if(mode==0){[[85,0],[0,170],[170,170]].forEach(function(o){x.drawImage(t,o[0],o[1],170,170)})}
    if(mode==1){x.drawImage(t,0,0);x.translate(170,170);x.rotate(0.6);x.scale(0.7,0.7);x.drawImage(t,-170,-170)}
    if(mode==2){[[0,0],[170,0],[0,170],[170,170]].forEach(function(o,i){x.save();x.translate(o[0]+85,o[1]+85);x.rotate(i*Math.PI/2);x.drawImage(t,-85,-85,170,170);x.restore()})}
    if(mode==3){x.drawImage(t,0,0);x.translate(340,0);x.scale(-1,1);x.drawImage(t,0,0);x.setTransform(1,0,0,-1,0,340);x.drawImage(t,0,0)}
    x.restore()}
  // colour it in bc white is boring
  x.save();x.globalCompositeOperation='multiply';var gr=x.createLinearGradient(0,0,340,340);gr.addColorStop(0,'#f0f');gr.addColorStop(.5,'#0ff');gr.addColorStop(1,'#ff0');x.fillStyle=gr;x.fillRect(0,0,340,340);x.restore();
  fr++;st();document.getElementById('m').textContent='made a '+modes[mode]+'! press agen for a difrent one'};
document.getElementById('cl').onclick=function(){clr();document.getElementById('m').textContent='blank. like my brain'};
</script></body></html>
