<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAPZ R US FREE (REAL MAPS)</title>
<style>
body{margin:0;padding:30px 6px 6px;background:#804000;color:#ff0;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center}
h1{font:40px Impact,sans-serif;color:#0f0;text-shadow:3px 3px #00f;margin:4px;transform:rotate(2deg)}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{font-size:10px;padding:10px}.ft a{color:#0ff}
canvas{border:10px ridge gold;background:#0ff;max-width:96vw;touch-action:manipulation}
button{font:20px Impact,sans-serif;background:#f0f;color:#ff0;border:4px outset #f0f;padding:5px 14px;margin:4px;cursor:pointer}
#nm{font-size:22px;min-height:30px;color:#fff;background:#00f;display:inline-block;padding:2px 10px}
</style></head><body>
<div id="ld">LOADING TEH WORLD...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>MAPZ R US FREE</h1>
<div>a musuem of maps. all maps drawn by me. from memory.</div>
<canvas id="cv" width="600" height="380"></canvas><br>
<div id="nm">tap a contenent to learn its name</div><br>
<button id="nx">NEXT MAP ▶</button>
<p>maps looked at: <b id="c">1</b> · contenents learned: <b id="k">0</b></p>
<div class="ft">made in 5 minits by xX_kai_Xx · (joke knockoff — the real game is at <a href='../maps.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var cv=document.getElementById('cv'),g=cv.getContext('2d'),blobs=[],maps=1,learned=0;
var A=['Big','Wet','Lil','North','Spicy','Flat','Upside','Soggy','Mega','Kinda','Not','Extra'],B=['land','Part','istan','ia','Rock','Zone','Bit','ville','opia',' Island (lake)','continent','shire'];
var CAP=['MAP OF THE WURLD (probly)','EARTH BUT I FORGOT','MAP FROM SPACE (zoomed in)','THE WORLD IN 1500 (or now)','MAP OF MY ROOM','WORLD MAP HD (low res)'];
var COL=['#0f0','#f0f','#ff0','#f80','#a0f','#f00','#8f8','#fa8'];
function r(a){return a[Math.floor(Math.random()*a.length)]}
function make(){
  blobs=[];var n=4+Math.floor(Math.random()*4);
  for(var i=0;i<n;i++){
    var cx=60+Math.random()*480,cy=70+Math.random()*250,rad=25+Math.random()*60,p=new Path2D(),pts=10+Math.floor(Math.random()*6);
    for(var j=0;j<pts;j++){var a=j/pts*Math.PI*2,rr=rad*(.5+Math.random()*.8),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.8;j?p.lineTo(x,y):p.moveTo(x,y)}
    p.closePath();blobs.push({p:p,c:r(COL),n:r(A)+r(B),x:cx,y:cy,seen:false});
  }
  draw();
}
function draw(hi){
  g.fillStyle='#0ff';g.fillRect(0,0,600,380);
  g.strokeStyle='#00f';g.lineWidth=2;g.font='18px Comic Sans MS';g.fillStyle='#00f';
  for(var i=0;i<14;i++)g.fillText('~',Math.random()*580,Math.random()*370);
  blobs.forEach(function(b){g.fillStyle=b.c;g.fill(b.p);g.lineWidth=b===hi?6:3;g.strokeStyle='#000';g.stroke(b.p);
    if(b.seen){g.fillStyle='#000';g.font='bold 14px Comic Sans MS';g.fillText(b.n,b.x-30,b.y)}});
  g.fillStyle='#f00';g.font='bold 22px Impact';g.fillText(CAP[maps%CAP.length],10,28);
  g.font='bold 30px Impact';g.fillText('X',300+Math.sin(maps)*200,200+Math.cos(maps*3)*90);g.font='12px Comic Sans MS';g.fillText('u r here (maybe)',300+Math.sin(maps)*200,215+Math.cos(maps*3)*90);
  g.fillStyle='#000';g.fillText('N ↑ (or down idk)',520,370);
}
cv.addEventListener('pointerdown',function(e){
  var q=cv.getBoundingClientRect(),x=(e.clientX-q.left)*600/q.width,y=(e.clientY-q.top)*380/q.height,hit=null;
  for(var i=blobs.length-1;i>=0;i--)if(g.isPointInPath(blobs[i].p,x,y)){hit=blobs[i];break}
  var nm=document.getElementById('nm');
  if(hit){if(!hit.seen){hit.seen=true;learned++;document.getElementById('k').textContent=learned}nm.textContent='thats '+hit.n.toUpperCase()+'! pop: '+Math.floor(Math.random()*900)+' guys';}
  else nm.textContent='thats water. its wet. 💧';
  draw(hit);
});
document.getElementById('nx').onclick=function(){maps++;document.getElementById('c').textContent=maps;document.getElementById('nm').textContent='new map just dropped';make()};
make();
</script></body></html>
