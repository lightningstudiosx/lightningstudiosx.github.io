<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVERLASTING BOB 2 FREE</title>
<style>
body{margin:0;background:#f80;color:#00f;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#ff0;text-shadow:3px 3px #00f;margin:4px;transform:rotate(-2deg);font-size:36px}
a{color:#00f}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}
#lb{width:0;height:20px;background:#00f;border:2px solid #000;margin:8px auto 0;max-width:80%}
.ft{font-size:10px;color:#000;margin:10px}
pre{background:#fff;color:#000;font:bold 18px "Courier New",monospace;display:inline-block;padding:10px 20px;border:5px double #00f;margin:6px;text-align:left}
button{font:bold 15px "Courier New",monospace;background:#0ff;border:3px outset #0ff;padding:6px 8px;margin:2px}
.bar{display:inline-block;width:150px;height:14px;background:#600;border:2px solid #000;vertical-align:middle}.bar i{display:block;height:100%;background:#0f0}
#st{background:#ff0;display:inline-block;padding:6px;text-align:right;font-size:14px;border:3px solid #f00}
#say{font-weight:bold;min-height:24px;color:#fff;text-shadow:1px 1px #000}
</style></head><body>
<div id="ld">SUMMONING BOB... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>👾 EVERLASTING BOB 2 👾</h1>
<div>bob is ur pet. bob can never die. bob can be very grumpy tho</div>
<pre id="bob"></pre>
<div id="say">bob: hi</div>
<div><button id="feed">[ FEED ]</button><button id="play">[ PLAY ]</button><button id="wash">[ WASH ]</button><button id="sleep">[ SLEEP ]</button><button id="talk">[ TALK ]</button></div>
<div id="st"></div>
<div id="age" style="font:bold 18px Impact,sans-serif;margin-top:6px"></div>
<p class="ft">made in 5 minits. bob has existed for way longer<br>(joke knockoff — the real game is at <a href='../bob.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var s={food:70,fun:70,clean:70,energy:70},age=0,acts=0,asleep=0,blink=0;
var F={happy:['  _______ ',' /       \\','|  ^   ^  |','|    v    |','|  \\___/  |',' \\_______/'],ok:['  _______ ',' /       \\','|  o   o  |','|    v    |','|  -----  |',' \\_______/'],sad:['  _______ ',' /       \\','|  T   T  |','|    v    |','|  /---\\  |',' \\_______/'],sleep:['  _______   z',' /       \\ z','|  -   -  |','|    v    |','|   ___   |',' \\_______/'],blink:['  _______ ',' /       \\','|  -   -  |','|    v    |','|  -----  |',' \\_______/']};
var T=['bob: i like turtles','bob: what is a weekend','bob: i am 1000 years old in bob years','bob: u r my best friend (only friend)','bob: i dreamed i was a toaster','bob: do u ever just... blob','bob: my favorite colour is ascii','bob: i will outlive the sun'];
function say(t){document.getElementById('say').textContent=t}
function act(k,amt,msg){if(asleep&&k!='energy'){say('bob is sleeping. shhh. zzz');return}s[k]=Math.min(100,s[k]+amt);acts++;say(msg);draw()}
document.getElementById('feed').onclick=function(){act('food',25,'bob: nom nom (it was a pixel)')};
document.getElementById('play').onclick=function(){if(s.energy<10){say('bob: too tired. zzz');return}s.energy-=8;act('fun',25,'bob: WHEEE!!!')};
document.getElementById('wash').onclick=function(){act('clean',30,'bob: i am shiny now ✨')};
document.getElementById('sleep').onclick=function(){asleep=!asleep;say(asleep?'bob: goodnight... zzz':'bob: im awake!!! what year is it');draw()};
document.getElementById('talk').onclick=function(){act('fun',5,T[Math.random()*T.length|0])};
function mood(){var a=(s.food+s.fun+s.clean+s.energy)/4;return asleep?'sleep':a>60?'happy':a>30?'ok':'sad'}
function bar(v){return '<span class="bar"><i style="width:'+v+'%;background:'+(v>50?'#0f0':v>20?'#ff0':'#f00')+'"></i></span>'}
function draw(){var m=mood();document.getElementById('bob').textContent=(blink&&m!='sleep'?F.blink:F[m]).join('\n');
  document.getElementById('st').innerHTML='FOOD '+bar(s.food)+'<br>FUN '+bar(s.fun)+'<br>CLEAN '+bar(s.clean)+'<br>ENERGY '+bar(s.energy);
  document.getElementById('age').textContent='BOB AGE: '+age+' secs · THINGS U DID: '+acts+(m=='sad'?' · bob is sad but bob is EVERLASTING':'')}
setInterval(function(){age++;s.food=Math.max(0,s.food-1.2);s.fun=Math.max(0,s.fun-1);s.clean=Math.max(0,s.clean-0.6);s.energy=asleep?Math.min(100,s.energy+4):Math.max(0,s.energy-0.8);
  if(asleep&&s.energy>=100){asleep=0;say('bob: fully charged. BOB IS BACK')}draw()},1000);
setInterval(function(){blink=1;draw();setTimeout(function(){blink=0;draw()},200)},3500);
draw();
</script></body></html>
