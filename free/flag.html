<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRAW TEH FLAG 2 REAL</title>
<style>
body{margin:0;background:#0c0;color:#fff;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#f00;text-shadow:3px 3px #fff;margin:4px;transform:rotate(-2deg);font-size:34px}
a{color:#ff0}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}
#lb{width:0;height:20px;background:#f00;border:2px solid #000;margin:8px auto 0;max-width:80%}
.ft{font-size:10px;color:#fff;margin:10px}
canvas{max-width:94vw;border:4px solid #000;touch-action:none;background:#fff}
.sw{display:inline-block;width:34px;height:34px;border:3px solid #000;margin:2px;cursor:pointer;vertical-align:middle}.sw.on{border-color:#ff0;transform:scale(1.2)}
button{font:bold 15px Impact,sans-serif;background:#00f;color:#fff;border:3px outset #00f;padding:6px 10px;margin:2px}
#cn{font:bold 28px Impact,sans-serif;color:#ff0;background:#f0f;display:inline-block;padding:2px 12px;transform:rotate(1deg)}
</style></head><body>
<div id="ld">LOADING CONTRIES... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>🏳️ DRAW TEH FLAG 2 REAL 🏳️</h1>
<div>draw this contrys flag from memry. the computer is VERY judgy</div>
<div id="cn"></div><br>
<canvas id="c" width="300" height="200"></canvas><br>
<div id="pal"></div>
<button id="fl">🪣 FILL ALL</button><button id="go">✅ JUDGE ME</button><button id="nx">⏭ NEXT</button>
<div id="m" style="font-weight:bold;min-height:24px;color:#ff0"></div>
<canvas id="t" width="90" height="60" style="display:none;border:2px solid #000"></canvas>
<div id="s" style="font:bold 18px Impact,sans-serif">TOTAL SCORE: 0 · FLAGS: 0</div>
<p class="ft">made in 5 minits with 6 crayons<br>(joke knockoff — the real game is at <a href='../flag.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var P=['#e00','#fff','#039','#090','#fd0','#000'],cur=0,c=document.getElementById('c'),x=c.getContext('2d'),tot=0,cnt=0;
// flags: [name, type, colors]  h=horizontal stripes, v=vertical, d=disc
var F=[['JAPAN','d',[1,0]],['FRANCE','v',[2,1,0]],['ITALY','v',[3,1,0]],['GERMANY','h',[5,0,4]],['INDONESIA','h',[0,1]],['UKRAINE','h',[2,4]],['NIGERIA','v',[3,1,3]],['AUSTRIA','h',[0,1,0]],['POLAND','h',[1,0]],['BANGLADESH','d',[3,0]],['BELGIUM','v',[5,4,0]],['ESTONIA','h',[2,5,1]]];
var cf;
function paint(g,f,w,h){var k=f[2];if(f[1]=='d'){g.fillStyle=P[k[0]];g.fillRect(0,0,w,h);g.fillStyle=P[k[1]];g.beginPath();g.arc(w/2,h/2,h*.3,0,7);g.fill()}
  else k.forEach(function(ci,i){g.fillStyle=P[ci];if(f[1]=='h')g.fillRect(0,i*h/k.length,w,h/k.length+1);else g.fillRect(i*w/k.length,0,w/k.length+1,h)})}
function next(){cf=F[Math.random()*F.length|0];document.getElementById('cn').textContent='DRAW: '+cf[0];x.fillStyle='#fff';x.fillRect(0,0,300,200);document.getElementById('t').style.display='none';document.getElementById('m').textContent=''}
document.getElementById('pal').innerHTML=P.map(function(p,i){return '<span class="sw'+(i?'':' on')+'" data-i="'+i+'" style="background:'+p+'"></span>'}).join('');
document.getElementById('pal').onclick=function(e){if(e.target.dataset.i==null)return;cur=+e.target.dataset.i;document.querySelectorAll('.sw').forEach(function(s){s.className='sw'});e.target.className='sw on'};
var dn=0,lx,ly;function pt(e){var r=c.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*200/r.height]}
c.onpointerdown=function(e){dn=1;var p=pt(e);lx=p[0];ly=p[1];c.onpointermove(e)};
c.onpointermove=function(e){if(!dn)return;var p=pt(e);x.strokeStyle=P[cur];x.lineWidth=28;x.lineCap='round';x.beginPath();x.moveTo(lx,ly);x.lineTo(p[0],p[1]);x.stroke();lx=p[0];ly=p[1]};
window.onpointerup=function(){dn=0};
document.getElementById('fl').onclick=function(){x.fillStyle=P[cur];x.fillRect(0,0,300,200)};
document.getElementById('go').onclick=function(){var t=document.createElement('canvas');t.width=300;t.height=200;var g=t.getContext('2d');paint(g,cf,300,200);
  var a=x.getImageData(0,0,300,200).data,b=g.getImageData(0,0,300,200).data,ok=0,n=0;
  for(var yy=5;yy<200;yy+=10)for(var xx=5;xx<300;xx+=10){var i=(yy*300+xx)*4;n++;if(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2])<120)ok++}
  var sc=Math.round(ok/n*100);tot+=sc;cnt++;
  var j=sc>90?'PERFECT. are u a flag?':sc>70?'not bad. the computer is slightly impresed':sc>40?'hmm. that contry is offended':'thats not a flag thats a crime';
  document.getElementById('m').textContent=sc+'% — '+j;var tc=document.getElementById('t');paint(tc.getContext('2d'),cf,90,60);tc.style.display='inline-block';
  document.getElementById('s').textContent='TOTAL SCORE: '+tot+' · FLAGS: '+cnt};
document.getElementById('nx').onclick=next;next();
</script></body></html>
