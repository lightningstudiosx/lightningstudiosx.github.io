<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;background:#f90;color:#00f;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#c00;text-shadow:3px 3px #ff0;margin:4px;transform:rotate(-2deg);font-size:34px}
a{color:#00f}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}
#lb{width:0;height:20px;background:#c00;border:2px solid #000;margin:8px auto 0;max-width:80%}

</style></head><body>
<div id="ld">LOADING DOLLS (1 of ∞)... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>🪆 INFINAT MATROSHKA FREE 🪆</h1>
<div>tap the doll to open it. there is always another doll. ALWAYS.</div>
<canvas id="c" width="300" height="340"></canvas><br>
<div id="d">0 DOLLS DEEP</div>
<div id="m" style="font-weight:bold;min-height:22px"></div>
<div id="sh" style="font-size:22px"></div>
<p class="ft">made in 5 minits (dolls made in 5 more minits each)<br>(joke knockoff — the real game is at <a href='../matryoshka.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var c=document.getElementById('c'),x=c.getContext('2d'),depth=0,t=-1,col='#d22',next='#22d',rare=0,shelf=[];
var cols=['#d22','#22d','#2a2','#d2d','#f80','#0aa','#a50'];
function doll(cx,cy,s,cl,gold,split){x.save();x.translate(cx,cy);x.scale(s,s);
  var off=split||0;
  // bottom
  x.fillStyle=gold?'#fc0':cl;x.beginPath();x.ellipse(0,40,70,80,0,0,Math.PI);x.lineTo(-70,40);x.fill();x.fillRect(-70,0,140,41);
  x.fillStyle='#fff';x.beginPath();x.arc(-25,60,12,0,7);x.arc(25,60,12,0,7);x.fill();
  // top
  x.translate(0,-off);x.fillStyle=gold?'#fc0':cl;x.beginPath();x.arc(0,-50,62,Math.PI,0);x.lineTo(70,0);x.lineTo(-70,0);x.fill();
  x.fillStyle='#fdc';x.beginPath();x.arc(0,-50,36,0,7);x.fill();
  x.fillStyle='#000';x.beginPath();x.arc(-12,-55,4,0,7);x.arc(12,-55,4,0,7);x.fill();x.fillStyle='#f66';x.beginPath();x.arc(-20,-42,6,0,7);x.arc(20,-42,6,0,7);x.fill();
  x.strokeStyle='#000';x.lineWidth=3;x.beginPath();x.arc(0,-45,10,0.3,2.8);x.stroke();x.restore()}
function draw(){x.fillStyle='#fff';x.fillRect(0,0,300,340);
  if(t<0){doll(150,190,1,col,rare)}else{var k=t;doll(150,190+0*k,0.55+0.45*k,next,rare==2);x.globalAlpha=1-k;doll(150,190,1+k*.3,col,rare==1,k*160);x.globalAlpha=1}
  x.fillStyle='#000';x.font='bold 14px "Comic Sans MS"';x.fillText('doll #'+(depth+1),10,20)}
function anim(){t+=0.06;if(t>=1){t=-1;col=next;rare=rare==2?1:0;draw();return}draw();requestAnimationFrame(anim)}
c.onpointerdown=function(){if(t>=0)return;depth++;next=cols[Math.random()*cols.length|0];var m=document.getElementById('m');
  if(Math.random()<0.06){rare=2;m.textContent='✨ GOLD DOLL!!! (painted yellow) +1 for ur shelf';shelf.push('🥇');document.getElementById('sh').textContent='SHELF: '+shelf.join('')}
  else m.textContent=['another doll!','wow a doll','its dolls all the way down','smaller (not really)','u r obsessed'][Math.random()*5|0];
  document.getElementById('d').textContent=depth+' DOLLS DEEP';t=0;anim()};
draw();
</script></body></html>
