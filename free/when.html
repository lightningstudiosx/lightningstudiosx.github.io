<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WHEN?! 2 (REAL HISTERY)</title>
<style>
body{margin:0;padding:32px 10px 10px;background:#f80;color:#000;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center}
h1{font:48px Impact,sans-serif;color:#f0f;text-shadow:4px 4px #0f0;margin:4px;transform:rotate(-2deg)}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{font-size:10px;padding:10px}
#card{background:#ffc;border:5px double #800;max-width:520px;margin:10px auto;padding:14px;transform:rotate(1deg)}
#ev{font-size:24px;color:#800;min-height:60px}
#yr{font:60px Impact,sans-serif;color:#00f}
input[type=range]{width:90%}
button{font:22px Impact,sans-serif;background:#00f;color:#ff0;border:4px outset #00f;padding:6px 16px;margin:6px;cursor:pointer}
#res{font-size:18px;min-height:50px;color:#060}
.clk{font-size:50px;display:inline-block;animation:s 4s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div id="ld">WINDING TEH CLOCKS...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1><span class="clk">🕰️</span> WHEN?! 2 <span class="clk">⏰</span></h1>
<div>guess WHEN stuff happend. i checked the dates (once)</div>
<div id="card">
  <div>HAPPENING <b id="rn">1</b>/5</div>
  <div id="ev"></div>
  <div id="yr">1900</div>
  <input type="range" id="sl" min="1400" max="2030" value="1900"><br>
  <button id="m">-1</button><button id="ok">LOCK IT IN 🔒</button><button id="p">+1</button>
  <div id="res"></div>
</div>
<p>total score: <b id="sc">0</b> · best: <b id="bs">0</b></p>
<div class="ft">made in 5 minits by xX_kai_Xx · (joke knockoff — the real game is at <a href='../when.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var EV=[["the Titanic sinks (big boat. ice.)",1912],["first powered airplane flight (it was very short)",1903],["humans walk on the moon 🌕",1969],["Columbus sails across the Atlantic",1492],["the Eiffel Tower gets finished",1889],["World War I starts",1914],["the Berlin Wall comes down",1989],["the US Declaration of Independence",1776],["the French Revolution kicks off",1789],["this knockoff was made (in 5 minits)",2026],["Shakespeare is born (roughly, nobody wrote it down)",1564]];
var set=[],i=0,score=0,locked=false,best=0;
try{best=+localStorage.getItem('when2best')||0}catch(e){}
document.getElementById('bs').textContent=best;
var sl=document.getElementById('sl'),yr=document.getElementById('yr'),res=document.getElementById('res'),ok=document.getElementById('ok');
function shuf(){set=EV.slice().sort(function(){return Math.random()-.5}).slice(0,5);i=0;score=0;show()}
function show(){locked=false;document.getElementById('rn').textContent=i+1;document.getElementById('ev').textContent=set[i][0];res.textContent='';ok.textContent='LOCK IT IN 🔒';document.getElementById('sc').textContent=score}
function upd(){yr.textContent=sl.value}
sl.oninput=upd;
document.getElementById('m').onclick=function(){sl.value=+sl.value-1;upd()};
document.getElementById('p').onclick=function(){sl.value=+sl.value+1;upd()};
ok.onclick=function(){
  if(locked){i++;if(i>=5){res.innerHTML='GAME OVER. u got '+score+'/500. '+(score>400?'histery nerd!!':'pls read a book');ok.textContent='PLAY AGAIN';
      if(score>best){best=score;try{localStorage.setItem('when2best',best)}catch(e){}document.getElementById('bs').textContent=best}i=-1;locked=false;return}
    show();return}
  if(i<0){shuf();return}
  var g=+sl.value,a=set[i][1],d=Math.abs(g-a),pts=Math.max(0,100-d);score+=pts;locked=true;
  res.innerHTML='it was <b>'+a+'</b>. u were '+d+' years off. +'+pts+' pts '+(d===0?'🎯 PERFECT!!!':d<10?'👍 close':d<50?'😐 meh':'💀 not even close');
  ok.textContent='NEXT ▶';document.getElementById('sc').textContent=score;
};
shuf();
</script></body></html>
