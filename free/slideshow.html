<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INFINITE SLIDSHOW FREE (∞ slides)</title>
<style>
body{margin:0;padding:28px 6px 6px;background:#ccc;color:#000;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center}
#ld{position:fixed;inset:0;z-index:99;background:#000;color:#0f0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:30px Impact,sans-serif}
#ld b{width:70%;max-width:400px;height:26px;border:4px ridge #f0f;background:#fff;margin:10px;display:block}#ld i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#0f0 0 10px,#ff0 10px 20px)}
.bk{position:fixed;top:0;left:0;z-index:50;background:#ff0;color:#00f;font:bold 12px "Comic Sans MS",cursive;padding:3px 6px;border:2px dashed #f00}
.ft{font-size:10px;padding:8px}
#menu{background:#fff;border:2px solid #888;text-align:left;font-size:13px;padding:3px 6px;max-width:760px;margin:0 auto}
#menu span{margin-right:10px;text-decoration:underline}
h1{font:22px Impact,sans-serif;margin:4px;color:#f80}
#sl{width:min(94vw,720px);aspect-ratio:16/9;margin:8px auto;background:#fff;border:3px solid #000;position:relative;overflow:hidden;cursor:pointer;box-shadow:8px 8px #000;transition:transform .4s}
#tt{position:absolute;top:8%;left:0;right:0;font:clamp(22px,6vw,54px) Impact,sans-serif;-webkit-text-stroke:2px #000}
#cl{position:absolute;bottom:8%;font-size:clamp(50px,14vw,120px)}
#bl{position:absolute;bottom:12%;right:6%;width:45%;text-align:left;font-size:clamp(11px,2.4vw,18px)}
#nt{background:#ffc;border:1px solid #aa8;max-width:720px;margin:4px auto;padding:4px;font-size:13px;text-align:left}
button{font:18px Impact,sans-serif;background:#f80;color:#fff;border:4px outset #f80;padding:5px 14px;margin:3px;cursor:pointer}
</style></head><body>
<div id="ld">OPENING PRESENTASHUN...<b><i id="lb"></i></b><small id="lt">0%</small></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<div id="menu"><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>WordArt</span><span>Help (none)</span></div>
<h1>INFINITE SLIDSHOW FREE</h1>
<div id="sl"><div id="tt"></div><div id="cl"></div><div id="bl"></div></div>
<button id="pv">◀ PREV (disabled lol)</button><button id="nx">NEXT ▶</button>
<div>Slide <b id="n">1</b> of ∞ · tap slide or press space</div>
<div id="nt"></div>
<div class="ft">made in 5 minits by xX_kai_Xx · (joke knockoff — the real game is at <a href='../slideshow.html'>kaifun.fun</a>)</div>
<script>
!function(){var L=document.getElementById('ld'),b=document.getElementById('lb'),t=document.getElementById('lt'),p=0,h=setInterval(function(){p=Math.min(100,p+Math.random()*22);b.style.width=p+'%';t.textContent=Math.floor(p)+'%'+(p>90?' (almost)':'');if(p>=100){clearInterval(h);setTimeout(function(){L.remove()},250)}},110)}();
var W=['potato','synergy','frog','quarterly','spoon','volcano','pancake','robot','ladder','cheese','teamwork','moon','sock','tornado','pickle','growth','banana','toaster','duck','cloud','goals','pizza','chair','wizard'];
var CL=['🐸','🥔','🚀','📈','🍕','🦆','🧀','🌋','🤖','🧦','🍌','🪑','🧙','☁️','🥞','📎','🐌','🎺'];
var BG=['#ff0','#0ff','#f0f','#0f0','#f80','#fff','#f99','#9f9','#99f'],FG=['#f00','#00f','#0a0','#f0f','#ff0','#fff'];
var NOTES=['say this part loud','dont read the slide out loud (read it out loud)','pause for laughs','this slide is very important','idk what this one means either','look at the clip art. respect it.','improvise here','if anyone asks, its a metaphor'];
var n=1,TR=['rotate(4deg)','rotate(-3deg) scale(.95)','skewX(6deg)','scale(1.03)','rotate(1deg) translateX(6px)'];
function r(a){return a[Math.floor(Math.random()*a.length)]}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function make(){
  var sl=document.getElementById('sl'),tt=document.getElementById('tt'),w1=r(W),w2=r(W);
  sl.style.background=r(BG);sl.style.transform=r(TR);
  tt.textContent=(Math.random()<.5?'THE '+w1.toUpperCase()+' OF '+w2.toUpperCase():cap(w1)+' & '+cap(w2)+'!!!');
  tt.style.color=r(FG);tt.style.transform='rotate('+(Math.random()*14-7)+'deg)';
  var cl=document.getElementById('cl');cl.textContent=r(CL);cl.style.left=(5+Math.random()*30)+'%';
  document.getElementById('bl').innerHTML='• '+cap(r(W))+' is '+r(['good','bad','up 300%','a '+r(W),'coming soon'])+'<br>• '+cap(r(W))+' = '+r(W)+'<br>• questions?';
  document.getElementById('nt').textContent='speaker notes: '+r(NOTES);
  document.getElementById('n').textContent=n;
}
function next(){n++;make()}
document.getElementById('sl').onclick=next;document.getElementById('nx').onclick=next;
document.getElementById('pv').onclick=function(){document.getElementById('nt').textContent='speaker notes: there is no going back. only forward.'};
onkeydown=function(e){if(e.key===' '||e.key==='ArrowRight'){e.preventDefault();next()}};
make();
</script></body></html>
