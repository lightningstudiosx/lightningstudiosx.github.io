<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COPERLINE CIRCUT LAB FREE 2</title>
<style>
body{margin:0;background:#f0f;color:#0f0;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#ff0;text-shadow:3px 3px #00f;margin:4px;transform:rotate(-2deg);font-size:30px}
a{color:#ff0}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}
#lb{width:0;height:20px;background:#0f0;border:2px solid #000;margin:8px auto 0;max-width:80%}
.ft{font-size:10px;color:#fff;margin:10px}
canvas{max-width:96vw;border:4px dashed #ff0;touch-action:none}
button{font:bold 16px "Comic Sans MS",cursive;border:3px outset #0ff;background:#0ff;margin:3px;padding:6px 10px}
button.on{background:#f60;border-style:inset}
#sc{font:bold 22px Impact,sans-serif;color:#fff;background:#00f;display:inline-block;padding:2px 8px;transform:rotate(1deg)}
</style></head><body>
<div id="ld">LOADING ELECTRONS... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>⚡ COPERLINE CIRCUT LAB FREE 2 ⚡</h1>
<div style="color:#fff">connect 🔋 to 💡 with wires. no 3D (3D costs extra)</div>
<div><button data-t="1" class="on">WIRE</button><button data-t="2">🔋 BATRY</button><button data-t="3">💡 LED</button><button data-t="0">ERASE</button></div>
<canvas id="c" width="360" height="280"></canvas>
<div id="sc">LEDS LIT: 0</div>
<div id="msg" style="color:#ff0;min-height:22px"></div>
<p class="ft">made in 5 minits with real copper (it was a penny)<br>(joke knockoff — the real game is at <a href='../copperline.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var c=document.getElementById('c'),x=c.getContext('2d'),W=9,H=7,S=40,g=[],tool=1,best=0;
for(var i=0;i<W*H;i++)g.push(0);
document.querySelectorAll('button').forEach(function(b){b.onclick=function(){tool=+b.dataset.t;document.querySelectorAll('button').forEach(function(o){o.className=''});b.className='on'}});
function nb(i){var cx=i%W,cy=(i/W)|0,r=[];if(cx<W-1)r.push(i+1);if(cx>0)r.push(i-1);if(cy<H-1)r.push(i+W);if(cy>0)r.push(i-W);return r}
function draw(){
  var on={},q=[];g.forEach(function(v,i){if(v==2){on[i]=1;q.push(i)}});
  while(q.length){var i=q.pop();nb(i).forEach(function(j){if(g[j]&&!on[j]){on[j]=1;q.push(j)}})}
  x.fillStyle='#2a6';x.fillRect(0,0,360,280);
  x.fillStyle='#174';for(var i=0;i<W*H;i++)x.fillRect((i%W)*S+18,((i/W)|0)*S+18,4,4);
  x.lineWidth=9;x.lineCap='round';
  for(var i=0;i<W*H;i++)if(g[i]){var cx=(i%W)*S+20,cy=((i/W)|0)*S+20;[i+1,i+W].forEach(function(j){if(j<W*H&&g[j]&&!(j==i+1&&i%W==W-1)){x.strokeStyle=on[i]&&on[j]?'#ffa500':'#a0522d';x.beginPath();x.moveTo(cx,cy);x.lineTo((j%W)*S+20,((j/W)|0)*S+20);x.stroke()}})}
  var lit=0;
  for(var i=0;i<W*H;i++){var cx=(i%W)*S+20,cy=((i/W)|0)*S+20;
    if(g[i]==1){x.fillStyle=on[i]?'#ffa500':'#a0522d';x.fillRect(cx-6,cy-6,12,12)}
    if(g[i]==2){x.fillStyle='#e00';x.fillRect(cx-14,cy-10,28,20);x.fillStyle='#fff';x.font='bold 16px Impact';x.fillText('+',cx-4,cy+6)}
    if(g[i]==3){x.beginPath();x.arc(cx,cy,13,0,7);x.fillStyle=on[i]?'#ff0':'#444';x.fill();if(on[i]){lit++;x.strokeStyle='rgba(255,255,0,.5)';x.lineWidth=6;x.beginPath();x.arc(cx,cy,19,0,7);x.stroke();x.lineWidth=9}}
  }
  best=Math.max(best,lit);
  document.getElementById('sc').textContent='LEDS LIT: '+lit+'  (best '+best+')';
  document.getElementById('msg').textContent=lit>=6?'UR A REAL ENGINER NOW!!! (not legaly)':lit>0?'IT WORKS?!?! wow':'';
}
var down=false,last=-1;
function cell(e){var r=c.getBoundingClientRect(),px=(e.clientX-r.left)*c.width/r.width,py=(e.clientY-r.top)*c.height/r.height;return Math.min(H-1,Math.max(0,(py/S)|0))*W+Math.min(W-1,Math.max(0,(px/S)|0))}
c.onpointerdown=function(e){down=true;last=cell(e);g[last]=tool;draw()};
c.onpointermove=function(e){if(!down)return;var k=cell(e);if(k!=last&&tool<2){last=k;g[k]=tool;draw()}};
window.onpointerup=function(){down=false};
g[19]=2;g[20]=1;g[21]=1;g[22]=3;draw();
</script></body></html>
