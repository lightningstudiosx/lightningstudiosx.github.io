<style>
body{margin:0;background:#fff;color:#000;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}

<h1>✅ CONFIRM 2 (CONFIRMED) ✅</h1>
<div id="s">CONFIRMED: 0 · STREAK: 0</div>

<p class="ft">made in 5 minits (confirmed)<br>(joke knockoff — the real game is at <a href='../confirm.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var Q=['press CONFIRM.','are u sure?','are u SURE sure?','really really?','confirm that u confirmed','do u confirm the confirmation of ur confirm?','last one (lie)','ok but are u sure tho','the button is getting tired. confirm?','confirm u r not a toaster','confirm ur favorite number is a number','still here? confirm','press it agen. for science','CONFIRM HARDER','u have confirmed more than anyone (prob). confirm?'];
var lvl=0,tot=0,ar=document.getElementById('ar');
function btn(t,cls,f){var b=document.createElement('div');b.className='b'+(cls?' '+cls:'');b.textContent=t;b.onclick=f;ar.appendChild(b);return b}
function place(b){var w=ar.clientWidth,h=ar.clientHeight;if(lvl<3){return}b.style.left=(Math.random()*(w-140))+'px';b.style.top=(90+Math.random()*(h-150))+'px'}
function show(){ar.querySelectorAll('.b').forEach(function(b){b.remove()});document.getElementById('q').textContent=Q[lvl%Q.length]+(lvl>=Q.length?' (x'+(1+(lvl/Q.length|0))+')':'');
  var sz=Math.max(11,18-lvl*0.5);
  var y=btn(lvl?'YES':'CONFIRM','',function(){lvl++;tot++;st();show()});y.style.fontSize=sz+'px';y.style.left='60px';y.style.top='150px';
  if(lvl){var n=btn('NO','no',function(){lvl=0;document.getElementById('q').textContent='ok... no problem... CONFIRM?';st();setTimeout(show,700)});n.style.left='220px';n.style.top='150px';place(n)}
  place(y);
  if(lvl>=6){var f=btn('YES (fake)','no',function(){document.getElementById('q').textContent='that was the fake one lol. try agen';});f.style.left='130px';f.style.top='240px';place(f)}
  if(lvl>=10){y.onmouseenter=function(){if(Math.random()<.4)place(y)}}}
function st(){document.getElementById('s').textContent='CONFIRMED: '+tot+' · STREAK: '+lvl}
show();
</script></body></html>
