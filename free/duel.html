<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;padding:0 8px 20px;background:#ff0000;color:#00ff00;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;touch-action:manipulation;overflow-x:hidden}
h1{font-family:Impact,"Arial Black",sans-serif;font-size:34px;margin:6px 0;color:#00ff00;text-shadow:3px 3px #000,-2px -2px #fff;transform:rotate(3deg)}

<div class="sc" id="s">P1: 0 &bull; P2: 0</div><button onclick="cpu=!cpu;this.textContent=cpu?'P2 = CPU 🤖':'P2 = HUMAN'">P2 = HUMAN</button>
<div id="m" style="font:bold 40px Impact;margin:10px;color:#000;background:#fff">WAIT...</div>

<script>
var c=document.getElementById('c'),x=c?c.getContext('2d'):null;
function P(e){var r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function T(s,X,Y,z,col,al){x.font='bold '+(z||20)+'px "Comic Sans MS",cursive';x.fillStyle=col||'#000';x.textAlign=al||'left';x.fillText(s,X,Y)}
function R(a,b){return a+Math.random()*(b-a)}
function $(i){return document.getElementById(i)}
(function(){var p=0,b=$('lb'),t=$('lt'),i=setInterval(function(){p=Math.min(99,p+Math.random()*20);b.style.width=p+'%';t.textContent='LOADING... '+(p|0)+'%'},110);
setTimeout(function(){clearInterval(i);b.style.width='100%';t.textContent='LOADING... 101%';setTimeout(function(){$('ld').remove()},350)},1500)})();
</script>
<script>
var st=0,s=[0,0],cpu=false,tm,ct;
function round(){st=0;$('m').textContent='WAIT...';clearTimeout(tm);clearTimeout(ct);tm=setTimeout(function(){st=1;$('m').textContent='GO!!!';if(cpu)ct=setTimeout(function(){hit(1)},R(280,650))},R(1200,3500))}
function hit(i){if(st==2)return;if(st==0){s[1-i]++;$('m').textContent='P'+(i+1)+' TOO EARLY lol';}else{s[i]++;$('m').textContent='P'+(i+1)+' WINS 🎉'}
st=2;clearTimeout(tm);clearTimeout(ct);$('s').textContent='P1: '+s[0]+' • P2: '+s[1];setTimeout(round,1500)}
$('a').onpointerdown=function(e){e.preventDefault();hit(0)};$('b').onpointerdown=function(e){e.preventDefault();if(!cpu)hit(1)};
onkeydown=function(e){if(e.repeat)return;if(e.key=='a')hit(0);if(e.key=='l'&&!cpu)hit(1)};round();
</script>
