<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONEY VISULIZER FREE (NO MONEY)</title>
<style>
body{margin:0;background:#9f9;color:#060;font-family:"Comic Sans MS","Comic Sans",cursive;text-align:center;overflow-x:hidden}
h1{font-family:Impact,sans-serif;color:#060;text-shadow:3px 3px #ff0;margin:4px;transform:rotate(2deg);font-size:34px}
a{color:#00f}.bk{display:inline-block;background:#ff0;color:#f00;padding:3px;margin:4px;border:3px outset #fc0;font-weight:bold}
#ld{position:fixed;inset:0;background:#fff;color:#000;z-index:9;padding-top:40vh;font:bold 22px Impact,sans-serif}
#lb{width:0;height:20px;background:#060;border:2px solid #000;margin:8px auto 0;max-width:80%}
.ft{font-size:10px;color:#030;margin:10px}
canvas{max-width:96vw;border:4px solid #060;background:#cef}
input{font:bold 18px "Comic Sans MS",cursive;width:180px}
button{font:bold 14px Impact,sans-serif;background:#060;color:#ff0;border:3px outset #060;padding:5px 9px;margin:2px}
#m{font-weight:bold;min-height:44px;background:#fff;border:3px dotted #060;max-width:340px;margin:6px auto;padding:4px}
</style></head><body>
<div id="ld">COUNTING MONEY (1, 2, 3...)... <div id="lb"></div></div>
<a class="bk" href="../kaifunfree.html">← back to KAIFUN.FUN.FREE.REAL</a>
<h1>💸 MONEY VISULIZER FREE 💸</h1>
<div>type a amount. we stack it in $1 bills. see how tall it is</div>
$ <input id="a" type="number" value="1000" min="0"> <button id="go">STACK IT</button><br>
<button data-v="3.5">kais savings</button><button data-v="1000000">a milion</button><button data-v="1000000000">a BILLION</button><button data-v="100000000000">a richest guy (made up)</button>
<canvas id="c" width="340" height="360"></canvas>
<div id="m"></div>
<div id="s" style="font:bold 16px Impact,sans-serif">STACKS MADE: 0</div>
<p class="ft">made in 5 minits. 1 bill = 0.11mm thick (we measured with our eyes)<br>(joke knockoff — the real game is at <a href='../money.html'>kaifun.fun</a>)</p>
<script>
var L=0,lb=document.getElementById('lb'),lt=setInterval(function(){L+=7+Math.random()*20;if(L>=100){clearInterval(lt);document.getElementById('ld').style.display='none'}lb.style.width=Math.min(L,100)+'%'},110);
var c=document.getElementById('c'),x=c.getContext('2d'),n=0;
var refs=[['a guy',1.7],['a giraffe',5.5],['a house',10],['a big tree',40],['a skyscraper',300],['a mountain',4000],['a plane flying',10000],['space (sort of)',100000],['the moon (almost)',384400000]];
function stick(px,base,h,lab){x.strokeStyle='#000';x.lineWidth=2;var hh=h;x.beginPath();x.arc(px,base-hh+hh*.1,hh*.1,0,7);x.moveTo(px,base-hh*.8);x.lineTo(px,base-hh*.35);x.lineTo(px-hh*.15,base);x.moveTo(px,base-hh*.35);x.lineTo(px+hh*.15,base);x.moveTo(px-hh*.2,base-hh*.65);x.lineTo(px+hh*.2,base-hh*.65);x.stroke();x.fillStyle='#000';x.font='11px "Comic Sans MS"';x.fillText(lab,px-18,base+12)}
function go(v){v=Math.max(0,Math.floor(+v||0));var h=v*0.00011,ref=refs[0];refs.forEach(function(r){if(h>=r[1]*0.5)ref=r});
  var top=Math.max(h,ref[1],1.7),sc=300/top;
  x.fillStyle='#cef';x.fillRect(0,0,340,360);x.fillStyle='#4a2';x.fillRect(0,330,340,30);
  var sh=Math.max(1,h*sc);for(var yy=0;yy<sh;yy+=4){x.fillStyle=(yy/4)%2?'#2a6':'#3c7';x.fillRect(90,330-yy-4,70,Math.min(4,sh-yy))}
  x.strokeStyle='#030';x.strokeRect(90,330-sh,70,sh);x.fillStyle='#030';x.font='bold 18px Impact';x.fillText('$'+v.toLocaleString(),92,Math.max(20,322-sh));
  var rh=ref[1]*sc;if(ref[1]<=20)stick(240,330,rh,ref[0]);else{x.fillStyle='#999';x.fillRect(220,330-rh,60,rh);x.fillStyle='#000';x.font='11px "Comic Sans MS"';x.fillText(ref[0],210,Math.max(14,325-rh))}
  var gi=h/5.5;n++;document.getElementById('s').textContent='STACKS MADE: '+n;
  document.getElementById('m').innerHTML='ur stack is <b>'+(h<1?(h*100).toFixed(2)+' cm':h.toFixed(1)+' m')+'</b> tall<br>thats '+(gi<0.01?'basicly 0':gi.toFixed(2))+' giraffes. '+(v>1e9?'u could buy SO many socks':v<10?'u can buy 1 gum':'nice')}
document.getElementById('go').onclick=function(){go(document.getElementById('a').value)};
document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){document.getElementById('a').value=b.dataset.v;go(b.dataset.v)}});
go(1000);
</script></body></html>
