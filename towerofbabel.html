<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower of Babel Chat</title>
<meta name="description" content="Build a tower to the sky by chatting with your crew. The catch: every floor up, their language drifts. Letters swap, words flip, colours get new names. Learn their new talk by watching what they say, or the crew loses patience.">
<meta name="theme-color" content="#2a1e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#2a1e14; --sand:#f6e7c6; --sand2:#ecd5a6; --sand3:#dfc18a; --clay:#d9603b; --teal:#1f8a7a; --gold:#f0b429; --paper:#fffaf0;
  --ui:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif }
* { box-sizing:border-box }
[hidden] { display:none !important }
html,body { margin:0; height:100%; overflow:hidden; background:var(--ink); color:var(--ink); font:500 15px/1.35 var(--ui); -webkit-tap-highlight-color:transparent }
button { font:inherit; color:inherit; cursor:pointer }
#app { position:fixed; inset:0; display:grid; grid-template-columns:1fr 410px; grid-template-rows:56px 1fr }
#top { grid-column:1/3; display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--ink); color:#fff; border-bottom:4px solid var(--gold); min-width:0 }
#top .home { color:#fff; text-decoration:none; font:600 14px var(--ui); padding:7px 12px; border-radius:999px; background:#ffffff1f; border:1.5px solid #ffffff38; white-space:nowrap }
#top h1 { margin:0; font:700 22px var(--ui); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
#top h1 b { color:var(--gold) }
#top .sp { flex:1 }
.chip { font:600 14px var(--ui); padding:5px 11px; border-radius:999px; background:#ffffff16; border:1.5px solid #ffffff30; white-space:nowrap; font-variant-numeric:tabular-nums }
#hearts { letter-spacing:1px; color:#ff6b5b }
#hearts.low { animation:pulse .45s infinite alternate }
@keyframes pulse { to { transform:scale(1.1) } }
.ib { width:38px; height:38px; border-radius:11px; border:1.5px solid #ffffff38; background:#ffffff1f; font-size:17px; padding:0 }
#scene { position:relative; overflow:hidden; min-height:0 }
#cv { position:absolute; inset:0; width:100%; height:100%; display:block }
#panel { display:flex; flex-direction:column; background:var(--sand); border-left:4px solid var(--ink); min-height:0; min-width:0 }
#bp { padding:10px 12px 9px; background:var(--sand2); border-bottom:3px solid var(--ink) }
#bp .lbl { display:flex; justify-content:space-between; font:700 13px var(--ui); text-transform:uppercase; letter-spacing:.06em; color:#7a5530 }
#bp .row { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap }
#bp .slot { position:relative; width:46px; height:40px; border-radius:7px; background:#fff6; border:2px dashed #a07a4a }
#bp .slot img { width:100%; height:100%; display:block }
#bp .slot.done { border-style:solid; border-color:#2f9e5a; background:#fff }
#bp .slot.bad { border-style:solid; border-color:#d33 }
#bp .slot.done:after { content:"✓"; position:absolute; right:-6px; top:-8px; width:18px; height:18px; border-radius:50%; background:#2f9e5a; color:#fff; font:700 12px/18px var(--ui); text-align:center }
#bp .slot.bad:after { content:"✕"; position:absolute; right:-6px; top:-8px; width:18px; height:18px; border-radius:50%; background:#d33; color:#fff; font:700 12px/18px var(--ui); text-align:center }
#bp .rule { margin-top:7px; font:500 13px var(--ui); color:#5a3d20 }
#bp .rule b { color:var(--clay) }
#tabs { display:flex; border-bottom:3px solid var(--ink); background:var(--sand3) }
#tabs button { flex:1; border:0; background:none; padding:8px 4px; font:700 14px var(--ui); color:#6b4a28; border-right:2px solid #0002 }
#tabs button.on { background:var(--sand); color:var(--ink) }
#log, #book { flex:1; overflow-y:auto; padding:10px 10px 4px; min-height:0 }
#book { display:none }
.msg { display:flex; gap:7px; margin:0 0 9px; align-items:flex-end; animation:pop .22s ease-out }
@keyframes pop { from { transform:translateY(8px) scale(.96); opacity:0 } }
.msg .av { width:34px; height:34px; flex:none; border-radius:50%; background:#fff; border:2px solid var(--ink) }
.msg .who { font:700 12px var(--ui); color:#7a5530; margin:0 0 2px 4px }
.bub { background:var(--paper); border:2.5px solid var(--ink); border-radius:16px 16px 16px 4px; padding:7px 11px; font:600 16px/1.3 var(--ui); box-shadow:0 3px 0 #0002; max-width:290px; overflow-wrap:anywhere }
.bub .ic { display:inline-flex; align-items:center; gap:2px; vertical-align:middle; margin-right:5px; padding:1px 5px 1px 2px; border-radius:7px; background:#0000000d; font:700 13px var(--ui) }
.bub .ic img { width:30px; height:26px }
.bub .emo { margin-left:4px }
.bub .sub { margin-top:3px; font:500 12px var(--ui); color:#8a6a48 }
.msg.you { justify-content:flex-end }
.msg.you .bub { background:#d9f2ff; border-radius:16px 16px 4px 16px }
.bub .w { border-radius:5px; padding:0 2px }
.bub .w.ok { background:#bdf0c9; color:#145c2a }
.bub .w.old { background:#ddd; color:#666; text-decoration:line-through }
.bub .w.bad { background:#ffd0cc; color:#9b1c12 }
.msg.sys { justify-content:center; text-align:center }
.msg.sys .card { background:var(--ink); color:#fff; border-radius:12px; padding:8px 14px; font:500 13px var(--ui); max-width:330px }
.msg.sys .card b { display:block; font:700 16px var(--ui); color:var(--gold) }
.msg.parrot .bub { background:#e7ffd9 }
#form { display:flex; gap:6px; padding:8px; border-top:3px solid var(--ink); background:var(--sand2) }
#say { flex:1; min-width:0; font:600 17px var(--ui); padding:10px 12px; border:3px solid var(--ink); border-radius:12px; background:#fff; color:var(--ink); outline:none }
#say:focus { box-shadow:0 0 0 3px var(--gold) }
.btn { border:3px solid var(--ink); border-radius:12px; background:var(--gold); font:700 16px var(--ui); padding:0 14px; box-shadow:0 3px 0 var(--ink); transition:transform .06s }
.btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink) }
.btn.g { background:#b9e88e }
.btn.c { background:var(--clay); color:#fff }
#hint { padding:0 10px; font-size:19px }
.bk { padding:2px 0 8px }
.bk h3 { margin:4px 0 6px; font:700 13px var(--ui); text-transform:uppercase; letter-spacing:.06em; color:#7a5530 }

.bk .e .t { font:700 16px var(--ui); min-width:70px }
.bk .e .m { flex:1; display:flex; align-items:center; gap:6px; color:#5a3d20 }
.bk .e .m img { width:30px; height:26px }
.bk .e .f { font:600 11px var(--ui); color:#a07a4a }
.bk .e.stale { opacity:.45 }
.sw { display:inline-block; width:18px; height:18px; border-radius:5px; border:2px solid var(--ink) }
.bk .empty { color:#8a6a48; font:500 14px var(--ui); padding:4px 2px 10px }
#notes { width:100%; min-height:110px; resize:vertical; border:2.5px solid var(--ink); border-radius:10px; padding:8px; font:500 15px var(--ui); background:var(--paper); color:var(--ink) }
#ov { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:#1a120b55; backdrop-filter:blur(2px); padding:14px }
#ov .card { width:min(560px,100%); max-height:100%; overflow:auto; background:var(--sand); border:4px solid var(--ink); border-radius:22px; padding:22px 24px; box-shadow:0 10px 0 var(--ink),0 30px 80px #000a; text-align:center }
#ov h2 { margin:0; font:700 40px/1.05 var(--ui); color:var(--ink) }
#ov h2 b { color:var(--clay) }
#ov .tag { margin:8px 0 14px; font:500 17px var(--ui); color:#5a3d20 }
#ov .how { text-align:left; background:var(--paper); border:2.5px solid #0002; border-radius:14px; padding:10px 14px; font:500 15px/1.45 var(--ui); margin:0 0 16px }
#ov .how li { margin:3px 0 }
#ov code { font:700 15px var(--ui); background:#d9f2ff; border-radius:6px; padding:0 5px }
#ov .modes { display:flex; gap:10px; justify-content:center; flex-wrap:wrap }
#ov .modes .btn { padding:12px 18px; font-size:19px; min-width:200px }
#ov .modes .btn small { display:block; font:500 13px var(--ui) }
#ov .best { margin-top:12px; font:600 14px var(--ui); color:#7a5530 }
#ov .big { font:700 56px var(--ui); color:var(--clay); margin:6px 0 }
@media (max-width:820px) {
  #app { grid-template-columns:1fr; grid-template-rows:50px minmax(180px,38vh) 1fr }
  #top { grid-column:1; gap:6px; padding:0 8px }
  #top h1 { font-size:17px }
  #top .chip { padding:4px 8px; font-size:13px }
  #panel { border-left:0; border-top:4px solid var(--ink) }
  #bp .slot { width:38px; height:33px }
  #bp .rule { display:none }
  #ov h2 { font-size:30px }
}
@media (max-width:480px) { #top h1 span { display:none } }
</style>

<body>
<div id="app">
  <div id="top">
    <a class="home" href="index.html">← kai.fun</a>
    <h1><span>Tower of </span><b>Babel</b><span> Chat</span></h1>
    <div class="sp"></div>
    <div class="chip" id="floorChip">Floor 1/12</div>
    <div class="chip" id="hearts" title="Crew patience"></div>
    <button class="ib" id="mute" aria-label="Sound">🔊</button>
  </div>
  <div id="scene"><canvas id="cv"></canvas></div>
  <div id="panel">
    <div id="bp"><div class="lbl"><span id="bpTitle">Blueprint</span><span id="bpPar"></span></div><div class="row" id="bpRow"></div><div class="rule" id="bpRule"></div></div>
    <div id="tabs"><button class="on" data-t="log">💬 Chat</button><button data-t="book">📖 Phrasebook</button></div>
    <div id="log" aria-live="polite"></div>
    <div id="book"><div id="bookList"></div><div class="bk"><h3>Your notes</h3><textarea id="notes" placeholder="Write down what you've figured out... e.g. zib = red?"></textarea></div></div>
    <form id="form" autocomplete="off"><input id="say" maxlength="80" placeholder="Talk to your crew..." autocapitalize="off" spellcheck="false" enterkeyhint="send"><button type="button" class="btn g" id="hint" title="Ask Pip the parrot (costs 1 patience)">🦜</button><button class="btn" id="send">Send</button></form>
  </div>
</div>
<div id="ov"><div class="card" id="ovCard"></div></div>
<script src="bdp.js" defer></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
/* ================= LANGUAGE ENGINE =================
   Every floor adds one drift rule. A word's dialect form is the English word run through every rule
   introduced so far (words born later, like the polite particle, only get the rules after their birth). */
const NOUNS = ['brick','window','door','arch','column','flag','bell'];
const COLS = ['red','blue','gold','green'];
const NUMS = ['one','two','three'];
const VERBS = ['build','smash'];
const REPLY = ['yes','boss','what','old','talk','no','room'];
const CAT = {};
NOUNS.forEach(k => CAT[k] = 'noun'); COLS.forEach(k => CAT[k] = 'color'); NUMS.forEach(k => CAT[k] = 'num');
VERBS.forEach(k => CAT[k] = 'verb'); REPLY.forEach(k => CAT[k] = 'reply'); CAT._p = 'particle';
const HEX = { red:'#e5483c', blue:'#3b7ddd', gold:'#f0b429', green:'#3faa55' };
const FLOORS = 12;
const WIDTHS = [6,6,6,5,5,5,5,4,4,4,4,3];

const swapLR = w => w.replace(/[lr]/g, c => c === 'l' ? 'r' : 'l');
const VR = { a:'e', e:'i', i:'o', o:'u', u:'a' };
const vowels = w => w.replace(/[aeiou]/g, c => VR[c]);
const mirror = w => [...w].reverse().join('');
const SOFT = { b:'p', d:'t', g:'k', v:'f', z:'s' };
const soften = w => w.replace(/[bdgvz]/g, c => SOFT[c]);

const RULES = [
  { type:'lex', f:swapLR, title:'Slippery sounds', hint:'Up here two letters keep trading places. Listen to the crew.' },
  { type:'order', title:'Backwards day', hint:'Same words as before, but the crew says them in a different order now.' },
  { type:'sub', cat:'color', title:'New colours', hint:'The colours got brand new names. Watch what the crew carries.' },
  { type:'particle', pos:'end', title:'Manners', hint:'The crew got very polite. Every sentence needs a little extra word now.' },
  { type:'lex', f:vowels, title:'Vowels moved house', hint:'Every vowel shuffled along to the next one.' },
  { type:'repeat', title:'Say it again', hint:'Numbers went out of fashion. The crew counts a different way.' },
  { type:'sub', cat:'noun', title:'New names for things', hint:'Bricks, doors, bells... every thing got renamed.' },
  { type:'particle', pos:'front', title:'Polite first', hint:'The polite little word went for a walk.' },
  { type:'lex', f:mirror, title:'Mirror talk', hint:'Up here everybody talks like they are reading a mirror.' },
  { type:'sub', cat:'verb', title:'New action words', hint:'Even building and smashing got new words.' },
  { type:'lex', f:soften, title:'Thin air', hint:'At the top the air is thin and hard sounds go soft.' },
];
const PARTICLES = ['ko','pa','nu','ta','mi','zo','fe'];

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (R, a) => a[Math.floor(R() * a.length)];
function genWord(R) {
  const C = 'bdgkmnpstvz', V = 'aeiou', c = () => pick(R, C), v = () => pick(R, V);
  return R() < .55 ? c() + v() + c() : c() + v() + c() + v();
}
function makeRun(seed) {
  for (let tries = 0; tries < 2000; tries++) {
    const s = (seed + tries * 7919) >>> 0, R = rng(s), used = new Set();
    const rules = RULES.map(r => ({ ...r }));
    for (const r of rules) {
      if (r.type === 'sub') {
        r.map = {};
        for (const k of (r.cat === 'color' ? COLS : r.cat === 'noun' ? NOUNS : VERBS)) {
          let w; do { w = genWord(R); } while (used.has(w)); used.add(w); r.map[k] = w;
        }
      }
      if (r.type === 'particle' && r.pos === 'end') r.word = pick(R, PARTICLES);
    }
    const run = { seed:s, rules, R, tries };
    if (validRun(run)) return run;
  }
  throw new Error('no valid run');
}
function form(run, key, f) {
  let w = key === '_p' ? null : key;
  for (let i = 0; i < f - 1; i++) {
    const r = run.rules[i];
    if (r.type === 'particle' && r.word && key === '_p') w = r.word;
    else if (w == null) continue;
    else if (r.type === 'sub' && r.cat === CAT[key]) w = r.map[key];
    else if (r.type === 'lex') w = r.f(w);
  }
  return w;
}
function gram(run, f) {
  const g = { rev:false, part:null, rep:false };
  for (let i = 0; i < f - 1; i++) { const r = run.rules[i]; if (r.type === 'order') g.rev = true; if (r.type === 'particle') g.part = r.pos; if (r.type === 'repeat') g.rep = true; }
  return g;
}
/* cmd = { v:'build'|'smash', n:1..3, c:colour, o:noun } -> list of dialect words */
function sentence(run, f, cmd, one) {
  const g = gram(run, f), F = k => form(run, k, f), t = [];
  if (cmd.v === 'build') {
    t.push(F('build'));
    if (!g.rep && (cmd.n > 1 || one)) t.push(F(NUMS[cmd.n - 1]));
    t.push(F(cmd.c));
    for (let i = 0; i < (g.rep ? cmd.n : 1); i++) t.push(F(cmd.o));
  } else {
    t.push(F('smash'));
    if (g.rep) { for (let i = 1; i < cmd.n; i++) t.push(F('smash')); }
    else if (cmd.n > 1 || one) t.push(F(NUMS[cmd.n - 1]));
  }
  if (g.rev) t.reverse();
  if (g.part === 'end') t.push(F('_p')); else if (g.part === 'front') t.unshift(F('_p'));
  return t;
}
function replyWords(run, f, keys) {
  const g = gram(run, f), t = keys.map(k => form(run, k, f));
  if (g.part === 'end') t.push(form(run, '_p', f)); else if (g.part === 'front') t.unshift(form(run, '_p', f));
  return t.join(' ');
}
const ALL_CMDS = [];
for (let n = 1; n <= 3; n++) { for (const c of COLS) for (const o of NOUNS) ALL_CMDS.push({ v:'build', n, c, o }); ALL_CMDS.push({ v:'smash', n }); }
function entries(run, f) {
  const g = gram(run, f), out = [];
  for (const c of ALL_CMDS) { out.push([sentence(run, f, c).join(' '), c]); if (c.n === 1 && !g.rep) out.push([sentence(run, f, c, true).join(' '), c]); }
  return out;
}
function cmdKeys(run, f) {
  const g = gram(run, f), ks = [...VERBS, ...COLS, ...NOUNS];
  if (!g.rep) ks.push(...NUMS);
  if (g.part) ks.push('_p');
  return ks;
}
function validRun(run) {
  const seen = new Map();
  for (let f = 1; f <= FLOORS; f++) {
    const toks = new Map();
    for (const k of [...cmdKeys(run, f), ...REPLY]) {
      const w = form(run, k, f);
      if (!w || w.length > 10 || !/^[a-z]+$/.test(w)) return false;
      if (toks.has(w) && toks.get(w) !== k) return false;
      if (seen.has(w) && seen.get(w) !== k) return false;
      toks.set(w, k);
    }
    for (const [w, k] of toks) seen.set(w, k);
    const tb = new Map();
    for (const [s, c] of entries(run, f)) { const o = tb.get(s); if (o && JSON.stringify(o) !== JSON.stringify(c)) return false; tb.set(s, c); }
  }
  return true;
}
/* per-floor lookup tables */
let RUN, G, TABLE, LEX, OLD, SORTED;
function buildTables(f) {
  G = gram(RUN, f);
  TABLE = new Map(entries(RUN, f));
  SORTED = new Set([...TABLE.keys()].map(s => s.split(' ').sort().join(' ')));
  LEX = new Map(); for (const k of cmdKeys(RUN, f)) LEX.set(form(RUN, k, f), k);
  OLD = new Map();
  for (let p = 1; p < f; p++) for (const k of cmdKeys(RUN, p)) { const w = form(RUN, k, p); if (!LEX.has(w)) OLD.set(w, k); }
}
const norm = s => s.toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
function understand(text) {
  const toks = norm(text).split(' ').filter(Boolean), s = toks.join(' ');
  const marks = toks.map(t => LEX.has(t) ? { t, k:'ok', key:LEX.get(t) } : OLD.has(t) ? { t, k:'old', key:OLD.get(t) } : { t, k:'bad' });
  const hit = TABLE.get(s);
  if (hit) return { ok:true, cmd:hit, marks };
  let why;
  if (!toks.length) why = 'empty';
  else if (marks.some(m => m.k === 'old')) why = 'old';
  else if (marks.some(m => m.k === 'bad')) why = 'what';
  else {
    const keys = marks.map(m => m.key), cats = keys.map(k => CAT[k]);
    if (!cats.includes('verb')) why = 'verb';
    else if (keys.includes('build') && !cats.includes('noun')) why = 'noun';
    else if (keys.includes('build') && !cats.includes('color')) why = 'color';
    else if (G.part && !cats.includes('particle')) why = 'manners';
    else if (SORTED.has([...toks].sort().join(' '))) why = 'order';
    else why = 'huh';
  }
  return { ok:false, why, marks };
}
const REPLIES = { ok:['yes','boss'], full:['no','room'], empty:['no'], old:['old','talk'], what:['what'], verb:['what'], noun:['what'], color:['what'], manners:['no'], order:['what'], huh:['what'] };
const EMO = { ok:'👍', full:'🚫', empty:'🤷', old:'👴', what:'❓', verb:'🔨❓', noun:'🧱❓', color:'🎨❓', manners:'😤🙏', order:'🔀', huh:'🤷' };
const EXPLAIN = { full:'The floor is already full.', empty:'Nothing to smash.', old:'That word is old talk. Nobody up here says it any more.', what:'They don\'t know one of those words.', verb:'Build or smash? They need an action word.', noun:'Build what thing?', color:'Which colour?',
  manners:'They want you to be polite!', order:'Right words, wrong order.', huh:'Right words, but that makes no sense to them.' };

/* ================= SOUND ================= */
let AC = null, muted = localStorage.getItem('babel_mute') === '1';
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(freq, dur, type, vol, when, slide) {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .05, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, when) {
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + (when || 0), b = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = a.createBufferSource(), g = a.createGain(), fl = a.createBiquadFilter();
  fl.type = 'lowpass'; fl.frequency.value = 1400; s.buffer = b; g.gain.value = vol || .12;

    for (let i = 1; i <= FLOORS; i++) { const fl = st.floors[i], yy = my + mh - (i - .5) / FLOORS * mh; c.fillStyle = fl && fl.done ? '#ffd23d' : i === st.f ? '#fff' : 'rgba(255,255,255,.25)'; c.fillRect(mx, yy - mh / FLOORS / 2 + 1, 10, mh / FLOORS - 2); }
  }
}
function drawGhost(c, x, yb, col, o, a) {
  const sx = X(x), sy = Y(yb + FH), w = S * Z, h = FH * Z;
  drawPiece(c, o, col, sx + 3 * Z, sy + 3 * Z, w - 6 * Z, h - 6 * Z, a);
  c.save(); c.setLineDash([5 * Z, 4 * Z]); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = Math.max(1.2, 2 * Z); rr(c, sx + 3 * Z, sy + 3 * Z, w - 6 * Z, h - 6 * Z, 5 * Z); c.stroke(); c.restore();
}
function drawDome(c) {
  const k = Math.min(1, (st.t - st.domeT) / .9), w = wOf(FLOORS) * S * .95, y0 = fb(FLOORS) + FH;
  c.save(); c.translate(X(0), Y(y0)); c.scale(1, k);
  c.fillStyle = '#d9b77c'; c.fillRect(-(w / 2 + 14) * Z, -SL * Z, (w + 28) * Z, SL * Z); c.strokeStyle = INK; c.lineWidth = 2.2 * Z; c.strokeRect(-(w / 2 + 14) * Z, -SL * Z, (w + 28) * Z, SL * Z);
  const g = c.createLinearGradient(-w / 2 * Z, 0, w / 2 * Z, 0); g.addColorStop(0, '#c98a12'); g.addColorStop(.45, '#ffe07a'); g.addColorStop(1, '#b77708');
  c.fillStyle = g; c.beginPath(); c.ellipse(0, -SL * Z, w / 2 * Z, w * .55 * Z, 0, Math.PI, 0); c.fill(); c.stroke();
  c.strokeStyle = INK; c.beginPath(); c.moveTo(0, -(SL + w * .55) * Z); c.lineTo(0, -(SL + w * .55 + 60) * Z); c.stroke();
  c.fillStyle = '#e5483c'; c.beginPath(); const fy = -(SL + w * .55 + 60) * Z, wave = Math.sin(st.t * 5) * 4 * Z; c.moveTo(0, fy); c.lineTo(36 * Z, fy + 9 * Z + wave); c.lineTo(0, fy + 20 * Z); c.fill(); c.stroke();
  c.restore();
}
function palm(c, x, y) {
  c.strokeStyle = '#7a4a22'; c.lineWidth = 7 * Z; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 14 * Z, y - 50 * Z, x + 4 * Z, y - 100 * Z); c.stroke();
  c.fillStyle = '#3f9e4d'; c.strokeStyle = INK; c.lineWidth = 2;
  for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + (i - 2.5) * .55; c.beginPath(); c.ellipse(x + 4 * Z + Math.cos(a) * 26 * Z, y - 100 * Z + Math.sin(a) * 14 * Z + 8 * Z, 30 * Z, 8 * Z, a, 0, 7); c.fill(); c.stroke(); }
}
function bubble(c, x, y, b) {
  const age = st.t - b.t; if (age > b.life) return;
  const al = Math.min(1, age * 6, (b.life - age) * 3);
  c.save(); c.globalAlpha = al; c.font = '600 15px Fredoka, Trebuchet MS, sans-serif';
  let text = b.text; if (text.length > 34) text = text.slice(0, 32) + '…';
  const tw = c.measureText(text).width, iw = b.cmd ? 38 : 0, bw = tw + iw + 20, bh = 34;
  let bx = Math.max(6, Math.min(CW - bw - 6, x - bw / 2)), by = Math.max(6, y - bh - 12);
  c.fillStyle = '#fffaf0'; c.strokeStyle = INK; c.lineWidth = 2.5;
  c.beginPath(); c.moveTo(Math.max(bx + 12, Math.min(bx + bw - 12, x)) - 7, by + bh - 1); c.lineTo(x, by + bh + 10); c.lineTo(Math.max(bx + 12, Math.min(bx + bw - 12, x)) + 7, by + bh - 1); c.fill(); c.stroke();
  rr(c, bx, by, bw, bh, 12); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(Math.max(bx + 12, Math.min(bx + bw - 12, x)) - 6, by + bh - 2); c.lineTo(Math.max(bx + 12, Math.min(bx + bw - 12, x)) + 6, by + bh - 2); c.strokeStyle = '#fffaf0'; c.lineWidth = 3; c.stroke();
  if (b.cmd) {
    if (b.cmd.v === 'smash') { c.font = '18px sans-serif'; c.textAlign = 'left'; c.fillStyle = INK; c.fillText('🔨', bx + 8, by + 23); }
    else drawPiece(c, b.cmd.o, b.cmd.c, bx + 7, by + 6, 26, 22, 1);
    if (b.cmd.n > 1) { c.font = '700 11px Fredoka, sans-serif'; c.fillStyle = INK; c.textAlign = 'left'; c.fillText('×' + b.cmd.n, bx + 27, by + 31); }
    c.font = '600 15px Fredoka, Trebuchet MS, sans-serif';
  }
  c.fillStyle = INK; c.textAlign = 'left'; c.fillText(text, bx + 10 + iw, by + 22);
  c.restore();
}

/* ================= LOOP ================= */
function update(dt) {
  st.t += dt;
  if (st.events.length) {
    const due = st.events.filter(e => e.t <= st.t); st.events = st.events.filter(e => e.t > st.t);
    due.sort((a, b) => a.t - b.t).forEach(e => e.fn());
  }
  if (st.started && !st.busy && !st.over) {
    st.chatT -= dt;
    if (st.chatT <= 0) {
      const idle = crew.filter(w => w.i && w.free <= st.t);
      const who = R() < .25 ? 0 : idle.length ? pick(R, idle).i : 0;
      chatter(who, randomChatCmd());
      st.chatT = 7.5 + R() * 4;
    }
  }
  for (const p of st.parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  st.parts = st.parts.filter(p => p.life > 0);
  st.bubbles = st.bubbles.filter(b => st.t - b.t < b.life);
  if (st.shake > 0) st.shake = Math.max(0, st.shake - dt);
  if (st.win) { st.fwT = (st.fwT || 0) - dt; if (st.fwT <= 0) { firework(); st.fwT = .45; } }
  Z = Math.min(CW / (9.8 * S), CH / (4.4 * (FH + SL))) * (st.view ? st.view.zoom : 1);
  if (st.view) { cam.x = st.view.x; cam.y = st.view.y; return; }
  const ty = st.win ? fb(FLOORS) + FH + 90 : fb(st.started ? st.f : 1) + FH * .45;
  cam.y += (ty - cam.y) * Math.min(1, dt * 2.6);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw(dt);
  requestAnimationFrame(frame);
}

/* ================= SCREENS ================= */
const ov = $('#ov'), card = $('#ovCard');
function getBest() { try { return JSON.parse(localStorage.getItem('babel_best')) || {}; } catch (e) { return {}; } }
function saveBest() {
  const b = getBest(), done = st.floors.filter(f => f && f.done).length, m = b[st.mode] || { f:0, stars:0 };
  if (done > m.f || (done === m.f && st.stars > m.stars)) { b[st.mode] = { f:done, stars:st.stars }; localStorage.setItem('babel_best', JSON.stringify(b)); }
}
function bestLine() {
  const b = getBest(), s = [];
  if (b.normal) s.push('Best: floor ' + b.normal.f + ' (' + b.normal.stars + '★)');
  if (b.easy) s.push('Easy best: floor ' + b.easy.f);
  return s.join(' · ');
}
function modeButtons() {
  return '<div class="modes"><button class="btn" data-m="normal">BUILD<small>6 patience · no subtitles</small></button><button class="btn g" data-m="easy">EASY<small>endless patience · subtitles on</small></button></div>';
}
function wire() { card.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { ac(); start(b.dataset.m); }); }
function titleScreen() {
  st.started = false;
  card.innerHTML = '<h2>Tower of <b>Babel</b> Chat</h2><div class="tag">Build a tower to the sky by chatting with your crew.<br>The catch: every floor up, their language drifts.</div>' +
    '<ul class="how"><li>Type to your crew, like <code>build two red brick</code>. Match the blueprint, left to right.</li>' +
    '<li>Made a mistake? <code>smash</code> knocks down the last piece.</li>' +
    '<li>Every floor their talk changes: letters swap, words flip around, colours get new names...</li>' +
    '<li>Watch what the crew says while they carry things. That is how you learn their new words.</li>' +
    '<li>Words they don\'t understand cost patience. Run out and they walk off the job.</li></ul>' + modeButtons() +
    '<div class="best">' + esc(bestLine()) + '</div>';
  ov.hidden = false; wire(); renderHUD();
}
function gameOver() {
  if (st.over) return;
  st.over = true; st.overT = st.t; st.busy = true; SFX.lose(); saveBest();
  crew.forEach(w => { w.x = posAt(w, st.t); w.plan = []; });
  const done = st.floors.filter(f => f && f.done).length;
  say(0, replyWords(RUN, st.f, ['no', 'no', 'boss']) + '...', { emo:'😩', sub:'The crew has had enough.' });
  setTimeout(() => {
    card.innerHTML = '<h2>The crew walked <b>off the job</b></h2><div class="tag">Nobody could understand anybody.</div><div class="big">' + done + ' / ' + FLOORS + '</div><div class="tag">floors built · ' + st.stars + '★ · ' + st.msgs + ' messages</div>' +
      modeButtons() + '<div class="best">' + esc(bestLine()) + '</div>';
    ov.hidden = false; wire();
  }, 2400);
}
function victory() {
  st.win = true; st.busy = true; st.domeT = st.t; SFX.win(); saveBest();
  say(0, replyWords(RUN, st.f, ['yes', 'yes', 'boss']) + '!!!', { emo:'🎉', sub:'We did it! I think. Nobody can tell any more.' });
  setTimeout(() => {
    card.innerHTML = '<h2>The tower touches <b>the stars!</b></h2><div class="tag">Nobody understands anybody any more, but just look at it.</div><div class="big">' + st.stars + ' / ' + (FLOORS * 3) + ' ★</div><div class="tag">' + st.msgs + ' messages to build ' + FLOORS + ' floors' + (st.mode === 'easy' ? ' (easy mode)' : '') + '</div>' +
      modeButtons() + '<div class="best">' + esc(bestLine()) + '</div>';
    ov.hidden = false; wire();
  }, 3600);
}
function start(mode, seed) {
  seed = seed == null ? ((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0) : seed;
  RUN = makeRun(seed); R = rng(RUN.seed + 1);
  Object.assign(st, { mode, hearts:6, f:1, floors:[], busy:true, over:false, win:false, chatT:8, started:true, msgs:0, stars:0, events:[], banner:null, parts:[], bubbles:[], fwT:0 });
  st.learned = new Map(); log.innerHTML = '';
  ov.hidden = true;
  startFloor(1);
  setTimeout(() => $('#say').focus(), 50);
}
titleScreen();
requestAnimationFrame(frame);

/* hooks for automated testing */
window.BABEL = {
  st, start, send, hint, nextCmd, understand, makeRun, validRun, form, gram, sentence, entries, english, crew,
  chatter: who => chatter(who, randomChatCmd()),
  run: () => RUN, say: cmd => sentence(RUN, st.f, cmd).join(' '),
  step(sec) { for (let t = 0; t < sec; t += .05) update(.05); },
};
})();
</script>
