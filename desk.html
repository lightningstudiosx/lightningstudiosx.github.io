<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Desk of Kai · Kai.fun</title>
<meta name="description" content="A secret second homepage: Kai's messy desk. Poke everything. Find the secrets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Caveat+Brush&family=Fredoka:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a1b12; --cream:#fff4dc; --paper:#fbf3e0; --tomato:#e8553e; --mustard:#f2b632; --teal:#2e5e66; --mint:#8fd1b5;
  --night:#16121f; --night2:#211a2e; --glow:#ffd48a;
  --hd:60px; --zb:0px;
  --hand:'Caveat','Comic Sans MS','Segoe Print',cursive;
  --brush:'Caveat Brush','Caveat','Comic Sans MS',cursive;
  --ui:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --pix:'Pixelify Sans','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{background:var(--night);color:var(--cream);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse at 50% 120%, #3a2a3e 0%, transparent 60%), radial-gradient(circle at 20% 0%, #2a2140 0%, transparent 45%);
  transition:background-color .6s;}
body.dark{background-color:#0b0912;}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit}

/* ---------- header ---------- */
#hd{height:var(--hd);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;position:relative;z-index:20;}
.back{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;text-decoration:none;
  font-weight:600;font-size:14px;color:#e9dcc6;background:rgba(255,244,220,.07);border:1.5px solid rgba(255,244,220,.16);transition:background .2s}
.back:hover{background:rgba(255,244,220,.15)}
.tape{position:relative;font-family:var(--brush);font-size:32px;line-height:1;color:var(--ink);padding:6px 22px 4px;
  background:#f3e3b8;transform:rotate(-2deg);box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap;
  clip-path:polygon(2% 0,98% 6%,100% 52%,97% 100%,3% 94%,0 48%);}
.tape small{font-family:var(--hand);font-size:17px;color:#7a5c3a;margin-left:8px;font-weight:700}
.hbtns{display:flex;gap:8px;align-items:center}
.hb{min-width:44px;height:44px;border-radius:14px;border:1.5px solid rgba(255,244,220,.18);background:rgba(255,244,220,.07);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-weight:600;font-size:14px;transition:background .2s, transform .15s}
.hb:hover{background:rgba(255,244,220,.16)}
.hb:active{transform:scale(.95)}
.hb svg{width:22px;height:22px;flex:none}
.hb.on{background:var(--mustard);color:var(--ink);border-color:var(--mustard)}
#jBtn{background:var(--cream);color:var(--ink);border-color:var(--cream)}
#jBtn b{font-size:15px}
#jBtn.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.18) rotate(-4deg)}60%{transform:scale(.96)}}

/* ---------- stage ---------- */
#stage{position:relative;height:calc(100dvh - var(--hd) - var(--zb));overflow:auto;scrollbar-width:none;overscroll-behavior:contain;cursor:default;}
#stage::-webkit-scrollbar{display:none}
#stage.grab{cursor:grab}
#stage.grabbing{cursor:grabbing}
#scene{position:relative;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 2px rgba(255,244,220,.06);}
#desk{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;}
#zoom{position:fixed;right:14px;top:calc(var(--hd) + 10px);display:flex;flex-direction:column;gap:6px;z-index:15}
#zoom button{width:42px;height:42px;border-radius:12px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);font-weight:700;font-size:20px;line-height:1;box-shadow:0 3px 0 var(--ink)}
#zoom button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#zoom button.fit{font-size:11px;letter-spacing:.5px}

/* zone bar (phones) */
#zones{display:none;height:var(--zb);align-items:center;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none;position:relative;z-index:5}
#zones::-webkit-scrollbar{display:none}
#zones button{flex:none;height:42px;padding:0 14px;border-radius:999px;border:1.5px solid rgba(255,244,220,.2);background:rgba(255,244,220,.08);font-weight:600;font-size:14px}
#zones button:active{background:var(--mustard);color:var(--ink)}
body.narrow{--zb:62px}
body.narrow #zones{display:flex}

/* ---------- svg objects ---------- */
.o{stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.o3{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.obj{cursor:pointer;outline:none}
.obj>.in{transform-box:fill-box;transform-origin:center}
.obj:hover>.in,.obj:focus-visible>.in{filter:brightness(1.08) drop-shadow(0 0 6px rgba(255,236,190,.55))}
.obj:focus-visible>.in{filter:brightness(1.1) drop-shadow(0 0 0 #fff) drop-shadow(0 0 8px #fff)}
.hit{fill:transparent;stroke:none}
.fb{transform-box:fill-box;transform-origin:center}
.fbb{transform-box:fill-box;transform-origin:50% 100%}
text{font-family:var(--hand)}
.pixt{font-family:var(--pix)}
.uit{font-family:var(--ui)}

.a-shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px) rotate(-3deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px) rotate(-2deg)}80%{transform:translateX(3px)}}
.a-bounce{animation:bounce .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bounce{40%{transform:translateY(-16px) scale(1.04,.96)}70%{transform:translateY(2px) scale(.97,1.03)}}
.a-squish{animation:squish .4s}
@keyframes squish{35%{transform:scale(1.2,.75)}70%{transform:scale(.92,1.1)}}
.a-spin{animation:spin .9s cubic-bezier(.5,0,.3,1)}
@keyframes spin{25%{transform:scaleX(0)}50%{transform:scaleX(-1)}75%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.a-wobble{animation:wobble .9s}
@keyframes wobble{15%{transform:rotate(-2.5deg)}35%{transform:rotate(2deg)}55%{transform:rotate(-1.2deg)}75%{transform:rotate(.6deg)}}
.a-pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}

/* idle life */
#steam path{animation:steam 3.2s ease-in-out infinite;opacity:0;transform-box:fill-box}
#steam path:nth-child(2){animation-delay:1.1s}
#steam path:nth-child(3){animation-delay:2.1s}
@keyframes steam{0%{opacity:0;transform:translateY(10px) scaleY(.7)}30%{opacity:.75}100%{opacity:0;transform:translateY(-38px) scaleY(1.2)}}
#leaves{animation:sway 5.5s ease-in-out infinite;transform-box:view-box;transform-origin:1500px 478px}
@keyframes sway{50%{transform:rotate(2.4deg)}}
#beam{animation:flick 5s ease-in-out infinite;transition:opacity .35s}
@keyframes flick{50%{opacity:.8}52%{opacity:.68}54%{opacity:.82}}
#clouds{animation:drift 38s linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(320px)}}
#pendulum{animation:pend 2s ease-in-out infinite;transform-box:view-box;transform-origin:840px 196px}
@keyframes pend{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}}
#loosePin{animation:loose 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes loose{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(14deg)}90%{transform:rotate(-10deg)}94%{transform:rotate(6deg)}}
#led{animation:led 2.4s steps(1) infinite}
@keyframes led{50%{opacity:.35}}
#cursor{animation:led 1s steps(1) infinite}
.flake{animation:flake 6s linear infinite}
@keyframes flake{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
#globeSnow.swirl .flake{animation:swirl 1.6s ease-out 2}
@keyframes swirl{0%{transform:translate(0,0)}25%{transform:translate(18px,-24px)}50%{transform:translate(-20px,-6px)}75%{transform:translate(10px,18px)}100%{transform:translate(0,0)}}
#owlEyes{animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#owlEyes{transform-box:fill-box;transform-origin:center}
#speakers.thump circle.cone{animation:thump .42s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes thump{50%{transform:scale(1.08)}}
.star{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}

#dark{transition:opacity .45s;pointer-events:none}
#owlG{transition:opacity .5s}
#mugIn{transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
#pbBoard{transition:transform 1s cubic-bezier(.3,1.6,.4,1);transform-box:view-box;transform-origin:62px 40px}
#bag{transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:50% 100%}
#cuckooBird{transition:transform .3s cubic-bezier(.3,1.8,.5,1);transform-box:fill-box;transform-origin:50% 80%;transform:scale(0)}
#door{transition:transform .2s;transform-box:fill-box;transform-origin:0 50%}
#lockedFront,#junkFront{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tear{animation:tear 1s ease-in forwards;transform-box:fill-box;transform-origin:20% 0}
@keyframes tear{20%{transform:rotate(-8deg)}100%{transform:translate(-120px,260px) rotate(-70deg);opacity:0}}
#can{transition:opacity .3s}
.drop{animation:drip .7s ease-in infinite}
@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(60px);opacity:0}}
#bird{opacity:0}
#bird.fly{animation:fly 2.2s linear}
@keyframes fly{0%{opacity:1;transform:translate(-40px,0)}50%{transform:translate(150px,-30px)}100%{opacity:1;transform:translate(340px,10px)}}
#gold.dropin{animation:coinArc .8s cubic-bezier(.3,0,.6,1)}
@keyframes coinArc{0%{transform:translate(-60px,-120px) scale(.5)}60%{transform:translate(-10px,-30px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){
  #leaves,#clouds,#pendulum,#loosePin,.flake,#steam path,.star{animation-duration:0s!important;animation-iteration-count:1!important}
}

/* ---------- caption ---------- */
#cap{position:fixed;left:50%;bottom:calc(var(--zb) + 18px);transform:translate(-50%,24px);opacity:0;z-index:30;pointer-events:none;
  max-width:min(620px,calc(100vw - 48px));background:var(--paper);color:var(--ink);font-family:var(--hand);font-weight:700;font-size:25px;line-height:1.1;
  padding:10px 20px 11px;border-radius:6px;box-shadow:0 10px 30px -8px rgba(0,0,0,.6),0 3px 0 rgba(0,0,0,.25);transition:opacity .25s, transform .3s cubic-bezier(.3,1.5,.5,1);text-align:center}
#cap.on{opacity:1;transform:translate(-50%,0) rotate(-.6deg)}
#cap a{pointer-events:auto;color:var(--tomato)}
#cap.link{pointer-events:auto}

/* ---------- secret celebration ---------- */
#yay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:90}
#yay .card{background:var(--mustard);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:16px 26px 18px;text-align:center;
  transform:scale(.3) rotate(-8deg);opacity:0;transition:transform .45s cubic-bezier(.3,1.7,.5,1),opacity .25s;max-width:calc(100vw - 40px)}
#yay.on .card{transform:scale(1) rotate(-3deg);opacity:1}
#yay .k{font-weight:700;letter-spacing:3px;font-size:13px;text-transform:uppercase}
#yay .t{font-family:var(--brush);font-size:38px;line-height:1.05;margin:4px 0}
#yay .n{font-weight:600;font-size:15px}
.spark{position:fixed;width:10px;height:10px;border-radius:2px;z-index:89;pointer-events:none;animation:spark 1s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

/* toast (moods / stamp) */
#toasts{position:fixed;left:50%;top:calc(var(--hd) + 8px);transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:95;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:8px 14px 8px 8px;font-weight:600;font-size:14px;
  animation:tin .45s cubic-bezier(.3,1.6,.5,1)}
.toast svg{width:44px;height:44px;flex:none}
.toast b{display:block;font-size:16px}
.toast a{pointer-events:auto;color:var(--tomato);font-weight:700}
@keyframes tin{from{transform:translateY(-30px);opacity:0}}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:4px;background:rgba(12,8,18,.62);backdrop-filter:blur(3px)}
#modal.on{display:flex}
#mbox{position:relative;max-width:100%;max-height:calc(100dvh - 8px);overflow:auto;padding:20px 18px 22px;animation:min .4s cubic-bezier(.3,1.5,.5,1);scrollbar-width:thin}
@keyframes min{from{transform:translateY(40px) scale(.9);opacity:0}}
.x{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font-size:22px;font-weight:700;line-height:1;z-index:3;box-shadow:0 3px 0 var(--ink)}
.mcard{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 rgba(0,0,0,.45);padding:22px;width:min(560px,calc(100vw - 48px))}
.mcard h2{font-family:var(--brush);font-weight:400;font-size:38px;margin:0 50px 6px 0;line-height:1}
.mcard p{margin:6px 0;font-size:16px;line-height:1.4}
.mline{min-height:52px;margin-top:12px;background:#fff;border:2px dashed #c9b48e;border-radius:12px;padding:10px 14px;font-family:var(--hand);font-weight:700;font-size:23px;line-height:1.1}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:2.5px solid var(--ink);background:var(--mustard);color:var(--ink);font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#fff}

/* junk drawer */
.drawerIn{background:linear-gradient(#6b4527,#5a381f);border:3px solid var(--ink);border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;box-shadow:inset 0 10px 20px rgba(0,0,0,.4)}
.junk{background:rgba(255,244,220,.08);border:2px solid transparent;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#f5e6c8;font-size:12px;font-weight:600;min-height:86px;transition:transform .2s,background .2s}
.junk:hover{background:rgba(255,244,220,.18);transform:translateY(-3px) rotate(-2deg)}
.junk svg{width:56px;height:56px}
.junk.used{border-color:rgba(255,244,220,.25)}
@media (max-width:460px){.drawerIn{grid-template-columns:repeat(3,1fr)} }

/* sketchbook */
.sk{width:min(640px,calc(100vw - 48px));background:#c8a46a;border:3px solid var(--ink);border-radius:18px;padding:30px 16px 16px;box-shadow:8px 8px 0 rgba(0,0,0,.45);position:relative}
.rings{position:absolute;top:8px;left:30px;right:30px;height:22px;background:repeating-linear-gradient(90deg,transparent 0 14px,#d9d9d9 14px 22px,transparent 22px 34px);border-radius:4px}
.page{background:#fffdf6;border:2px solid var(--ink);border-radius:6px;aspect-ratio:300/230;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(transparent 0 27px,#dfe9f3 27px 28px)}
.page svg{width:100%;height:100%;display:block}
.page.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:perspective(900px) rotateX(0)}50%{transform:perspective(900px) rotateX(-75deg);opacity:.4}100%{transform:perspective(900px) rotateX(0)}}
.skbar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:var(--ink);gap:8px}
.skbar span{font-family:var(--hand);font-weight:700;font-size:24px;text-align:center;flex:1}

/* phone */
.ph{width:250px;background:linear-gradient(160deg,#4d6073,#2f3c4a);border:3px solid var(--ink);border-radius:40px 40px 34px 34px;padding:26px 18px 20px;box-shadow:8px 8px 0 rgba(0,0,0,.45);position:relative}
.ph:before{content:"";position:absolute;top:-34px;right:34px;width:16px;height:40px;background:#2f3c4a;border:3px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0}
.ph .brand{text-align:center;font-weight:700;letter-spacing:4px;font-size:11px;color:#aac0d4;margin-bottom:8px}
.lcd{background:#a9d68a;border:3px solid var(--ink);border-radius:10px;height:150px;padding:10px;font-family:var(--pix);color:#23361a;font-size:15px;line-height:1.25;box-shadow:inset 0 0 18px rgba(30,60,10,.35);overflow:hidden;position:relative}
.lcd .big{font-size:26px;letter-spacing:6px;text-align:center;margin-top:12px}
.lcd .sm{font-size:12px;opacity:.85}
.lcd.shake{animation:shake .4s}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.keys button{height:44px;border-radius:14px;border:2px solid var(--ink);background:#e7edf3;color:var(--ink);font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.keys .soft{background:#9fb4c8;font-size:15px}

/* radio */
.rad{width:min(560px,calc(100vw - 48px));background:var(--tomato);border:3px solid var(--ink);border-radius:26px;padding:22px;box-shadow:8px 8px 0 rgba(0,0,0,.45);color:var(--ink);position:relative}
.rad h2{font-family:var(--brush);font-weight:400;font-size:34px;margin:0 50px 10px 0;color:var(--cream);line-height:1}
.dialwin{background:#fff3cf;border:3px solid var(--ink);border-radius:14px;height:86px;position:relative;overflow:hidden}
.scale{position:absolute;left:14px;right:14px;top:10px;height:40px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 100%);background-size:calc(100% / 41) 14px;background-repeat:repeat-x}
.scale span{position:absolute;top:18px;font-size:12px;font-weight:700;transform:translateX(-50%)}
.needle{position:absolute;top:4px;bottom:4px;width:4px;background:var(--tomato);border-radius:2px;box-shadow:0 0 6px rgba(232,85,62,.8);transition:left .08s}
.freq{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;gap:10px}
.freq .num{font-family:var(--pix);font-size:38px;background:#1d1a17;color:#9be37d;border:3px solid var(--ink);border-radius:10px;padding:2px 14px;min-width:170px;text-align:center;text-shadow:0 0 8px rgba(155,227,125,.7)}
.freq .num small{font-size:16px}
.station{font-family:var(--hand);font-weight:700;font-size:24px;color:var(--cream);min-height:30px;margin:8px 0 10px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.tune{width:100%;height:44px;-webkit-appearance:none;appearance:none;background:transparent}
.tune::-webkit-slider-runnable-track{height:12px;background:#7a2a1e;border-radius:6px;border:2px solid var(--ink)}
.tune::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;margin-top:-16px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.tune::-moz-range-track{height:12px;background:#7a2a1e;border-radius:6px;border:2px solid var(--ink)}
.tune::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:var(--cream);border:3px solid var(--ink)}
.rrow{display:flex;gap:10px;align-items:center;margin-top:8px}
.rrow .btn{flex:none}
.pwr{background:#1d1a17;color:#ff8c7a}
.pwr.on{background:#9be37d;color:var(--ink)}

/* controller */
.pad{width:min(560px,calc(100vw - 48px));background:#6b5ca5;border:3px solid var(--ink);border-radius:60px 60px 80px 80px;padding:22px 22px 30px;box-shadow:8px 8px 0 rgba(0,0,0,.45);position:relative}
.tv{background:#141018;border:3px solid var(--ink);border-radius:14px;height:96px;color:#9be37d;font-family:var(--pix);padding:10px 14px;font-size:18px;overflow:hidden;margin-bottom:18px}
.tv .seq{font-size:26px;letter-spacing:4px;color:#fff;white-space:nowrap;overflow:hidden}
.padrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
.dpad button{background:#2a2433;color:#fff;border:2.5px solid var(--ink);border-radius:10px;font-size:20px}
.dpad button:active,.ab button:active{transform:scale(.92);filter:brightness(1.3)}
.ab{display:flex;gap:14px;align-items:flex-end}
.ab button{width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);font-weight:700;font-size:22px;box-shadow:0 4px 0 var(--ink)}
.ab .b{background:var(--tomato);color:#fff;margin-bottom:-18px}
.ab .a{background:var(--mustard);color:var(--ink);margin-top:-18px}
.startb{display:block;margin:16px auto 0;height:40px;padding:0 20px;border-radius:999px;border:2.5px solid var(--ink);background:#2a2433;color:#ddd;font-weight:600;font-size:13px;letter-spacing:2px}

/* goblin */
.gob{width:min(560px,calc(100vw - 48px));background:linear-gradient(#5a381f,#3f2614);border:3px solid var(--ink);border-radius:22px;padding:20px;box-shadow:8px 8px 0 rgba(0,0,0,.45);color:var(--cream);text-align:center;position:relative}
.gob h2{font-family:var(--brush);font-weight:400;font-size:36px;margin:0 50px 4px;line-height:1}
.gob svg{width:min(320px,100%);height:auto;cursor:pointer}
.bubble{background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;font-family:var(--hand);font-weight:700;font-size:24px;line-height:1.1;margin:8px auto 0;max-width:420px}

/* note */
.note{width:min(440px,calc(100vw - 48px));background:#fffbe8;border-radius:4px;padding:30px 28px 26px;color:#2b2b4a;font-family:var(--hand);font-size:27px;font-weight:700;line-height:1.2;transform:rotate(-1.5deg);
  box-shadow:0 20px 40px -10px rgba(0,0,0,.6);background-image:repeating-linear-gradient(transparent 0 31px,#cfe0ef 31px 32px);position:relative}
.note .x{top:-14px;right:-14px}

/* OS */
.os{width:min(900px,calc(100vw - 76px));height:min(600px,calc(100dvh - 90px));background:#1d6b74;border:3px solid var(--ink);border-radius:18px;box-shadow:0 0 0 10px #e9e1cf,0 0 0 13px var(--ink),14px 18px 0 13px rgba(0,0,0,.45);
  display:flex;flex-direction:column;overflow:hidden;font-family:var(--pix);color:#fff;position:relative;
  background-image:radial-gradient(circle at 80% 20%, rgba(255,255,255,.12), transparent 40%),repeating-linear-gradient(rgba(0,0,0,.06) 0 2px,transparent 2px 4px)}
.os.boot{animation:boot .5s ease-out}
@keyframes boot{0%{transform:scaleY(.01) scaleX(.6);filter:brightness(4)}60%{transform:scaleY(1.02) scaleX(1)}}
.os.off{animation:off .4s ease-in forwards}
@keyframes off{60%{transform:scaleY(.01) scaleX(1);filter:brightness(3)}100%{transform:scale(0,0);opacity:0}}
.ostitle{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 12px;background:linear-gradient(90deg,#f2b632,#e8553e);color:var(--ink);font-weight:600;font-size:15px;border-bottom:3px solid var(--ink);flex:none}
.ostitle span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ostitle button{width:36px;height:32px;border-radius:8px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);font-family:var(--ui);font-weight:700;font-size:16px}
.osdesk{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px 6px;align-content:start;scrollbar-width:thin}
.ico{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#fff;padding:6px 2px;border-radius:10px;border:2px solid transparent;font-size:12.5px;line-height:1.15;text-align:center;background:none;font-family:var(--pix);min-height:96px}
.ico:hover,.ico:focus-visible{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);outline:none}
.ico .im{width:58px;height:58px;border-radius:12px;border:2.5px solid var(--ink);overflow:hidden;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35);flex:none;display:flex;align-items:center;justify-content:center}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico span{text-shadow:0 1px 0 rgba(0,0,0,.6);word-break:break-word}
.ostask{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 8px;background:#e9e1cf;color:var(--ink);border-top:3px solid var(--ink)}
.ostask .start{height:32px;padding:0 12px;border-radius:8px;border:2px solid var(--ink);background:var(--mustard);font-family:var(--pix);font-weight:600;font-size:15px;color:var(--ink)}
.ostask .stat{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ostask .clk{font-size:15px;padding:0 8px}
.osmenu{position:absolute;left:8px;bottom:50px;background:#e9e1cf;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:6px;display:none;flex-direction:column;min-width:220px;box-shadow:5px 5px 0 rgba(0,0,0,.35);z-index:5}
.osmenu.on{display:flex}
.osmenu a,.osmenu button{display:block;text-align:left;padding:10px 12px;border-radius:8px;text-decoration:none;font-family:var(--pix);font-size:15px;background:none;border:none;color:var(--ink);min-height:40px}
.osmenu a:hover,.osmenu button:hover{background:var(--mustard)}
.oswin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 24px));background:#e9e1cf;color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:6px 6px 0 rgba(0,0,0,.4);z-index:4;overflow:hidden;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.oswin .ostitle{background:linear-gradient(90deg,#4aa9d8,#6b5ca5);color:#fff}
.oswin .body{padding:12px;font-size:15px;line-height:1.4}
.oswin .file{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:none;background:none;font-family:var(--pix);font-size:15px;text-align:left;color:var(--ink);min-height:42px}
.oswin .file:hover{background:var(--mustard)}

/* journal */
#journal{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:70;background:var(--paper);color:var(--ink);transform:translateX(105%);transition:transform .45s cubic-bezier(.3,1.2,.5,1);
  box-shadow:-20px 0 50px rgba(0,0,0,.5);display:flex;flex-direction:column;
  background-image:repeating-linear-gradient(transparent 0 33px,#e3d6b8 33px 34px),linear-gradient(90deg,transparent 46px,#f3a7a0 46px 48px,transparent 48px)}
#journal.on{transform:none}
#jScrim{position:fixed;inset:0;background:rgba(10,6,16,.5);z-index:69;opacity:0;pointer-events:none;transition:opacity .3s}
#jScrim.on{opacity:1;pointer-events:auto}
.jhead{padding:18px 18px 8px 60px;position:relative}
.jhead h2{font-family:var(--brush);font-weight:400;font-size:40px;margin:0;line-height:1}
.jhead .sub{font-family:var(--hand);font-size:21px;font-weight:700;color:#7a5c3a}
.jbody{flex:1;overflow-y:auto;padding:0 18px 24px 60px}
.prog{height:16px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--mustard) 0 8px,#ffd25e 8px 16px);border-right:2.5px solid var(--ink);transition:width .6s}
.jstats{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin-bottom:6px}
.sec{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #d8c7a3}
.sec .box{flex:none;width:26px;height:26px;border:2.5px solid var(--ink);border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;margin-top:2px}
.sec.got .box{background:var(--mint)}
.sec .nm{font-weight:600;font-size:15px}
.sec .hint{font-family:var(--hand);font-weight:700;font-size:19px;color:#8b7457;line-height:1.05}
.sec.got .hint{color:#3d7a5f}
.jsec{font-family:var(--brush);font-size:26px;margin:18px 0 4px}
.unl{display:flex;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--ink);border-radius:12px;background:#fff;margin:6px 0}
.unl svg{width:42px;height:42px;flex:none}
.unl .t{flex:1;font-size:14px;line-height:1.3}
.unl .t b{display:block;font-size:15px}
.unl.locked{opacity:.6;background:#f6efdf}
.jfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.jfoot a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;border:2.5px solid var(--ink);background:#fff;font-weight:600;text-decoration:none;font-size:14px}
#reset{min-height:44px;padding:0 14px;border-radius:12px;border:2px dashed #b9a27a;background:none;font-size:13px;color:#8b7457}
#reset.arm{border-color:var(--tomato);color:var(--tomato);font-weight:700}
#jClose{position:absolute;top:14px;right:14px}

@media (max-width:640px){
  :root{--hd:58px}
  #hd{padding:0 10px;gap:6px}
  .back{padding:0 9px;font-size:13px;gap:3px}
  .tape{font-size:23px;padding:5px 12px 3px}
  .tape small{display:none}
  .hb{padding:0 10px}
  .hb .lbl{display:none}
  #zoom{flex-direction:row;right:10px;top:auto;bottom:calc(var(--zb) + 10px)}
  #zoom button{width:40px;height:40px}
  #cap{font-size:20px;bottom:calc(var(--zb) + 64px);max-width:calc(100vw - 24px)}
  .skbar{flex-wrap:wrap}
  .skbar span{order:-1;flex:1 1 100%;font-size:22px}
  .mcard{padding:18px}
  .mcard h2{font-size:32px}
}

function save(){ try{ localStorage.setItem(SKEY,JSON.stringify(S)); }catch(e){} }

  radio:"radio",jar:"coin jar",pencils:"pencil cup",computer:"computer",keyboard:"keyboard",duck:"rubber duck",lamp:"lamp",mug:"mug",plant:"plant",

const SECRETS=[
  {id:"mugkey",name:"The key under the mug",hint:"Something warm is sitting on something small.",how:"Moved the mug and grabbed the tiny key."},

];

/* =================== audio =================== */
let ac=null, master=null;
function A(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.55; master.connect(ac.destination);}catch(e){ ac=null; } }
  if(ac && ac.state==="suspended") ac.resume();
  return ac;
}
function tone(f,dur,type,vol,when,dest,glideTo){
  const c=A(); if(!c) return;
  const t=(when||c.currentTime), o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+dur+.05);

let amb=null;
function ambOn(){
  const c=A(); if(!c) return;
  const s=c.createBufferSource(); s.buffer=nbuf(); s.loop=true;
  const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=520;
  const g=c.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(.16,c.currentTime+1.5);
  const s2=c.createBufferSource(); s2.buffer=nbuf(); s2.loop=true; s2.playbackRate.value=.6;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=3000; bp.Q.value=.6;
  const g2=c.createGain(); g2.gain.value=0; g2.gain.linearRampToValueAtTime(.025,c.currentTime+2);
  s.connect(lp); lp.connect(g); g.connect(master); s2.connect(bp); bp.connect(g2); g2.connect(master);
  s.start(); s2.start();
  amb={s,s2,g,g2};
}

}

function radioNodes(){
  const c=A(); if(!c) return;
  const s=c.createBufferSource(); s.buffer=nbuf(); s.loop=true;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2200; bp.Q.value=.5;
  const sg=c.createGain(); sg.gain.value=0; s.connect(bp); bp.connect(sg); sg.connect(master); s.start();
  const mg=c.createGain(); mg.gain.value=0; mg.connect(master);
  radio.nodes={s,sg,mg};
}
function curStation(){ let best=null,bd=9; ST.forEach(s=>{ const d=Math.abs(s.f-radio.f); if(d<bd){bd=d;best=s;} }); return {st:best,d:bd}; }
function mix(){
  if(!radio||!radio.nodes) return;
  const {st,d}=curStation(), t=ac.currentTime;
  const music=radio.on? Math.max(0,1-d/0.45) : 0, stat=radio.on? Math.min(1,d/0.35)*.12+.01 : 0;
  radio.nodes.mg.gain.setTargetAtTime(music*.9,t,.05); radio.nodes.sg.gain.setTargetAtTime(stat,t,.05);
  const nm=radio.b.querySelector("#stName");
  const tuned=radio.on && d<0.05;
  nm.textContent=!radio.on? "(off)" : tuned? st.name : d<0.45? "…"+st.name.slice(0,12)+"… kssh…" : "…kssshhhhh…";
  $("#speakers").classList.toggle("thump",radio.on && music>.3);
  if(tuned && st.kind==="kai" && !S.found.radio){ setTimeout(()=>{ if(radio && curStation().d<0.05 && radio.on){ found("radio"); say("You found Station KAI! It's Kai humming his own theme song. On loop. Forever.",5200); } },900); }
}

const KSEQ=[]; KAI_SONG.forEach(n=>{ KSEQ.push(n); for(let i=1;i<n[1];i++) KSEQ.push(null); });
const LOFI=[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
function radioStep(){
  if(!radio||!radio.nodes||!radio.on) return;
  const {st,d}=curStation(); if(d>0.5) return;
  const dest=radio.nodes.mg, t=ac.currentTime+.02, k=radio.step++;
  if(st.kind==="kai"){ // melody, one 8th note per step
    const n=KSEQ[k%KSEQ.length];
    if(n){ tone(N(n[0]),n[1]*.15,"square",.06,t,dest); tone(N(n[0]-12),n[1]*.15,"triangle",.1,t,dest); }
    if(k%4===0) tone(N([48,45,41,43][(k/16|0)%4]),.5,"triangle",.12,t,dest);
    if(k%2===0) noise(.04,.06,6000,1,t,"highpass");
  } else if(st.kind==="monke"){
    if(k%6===0) tone(pick([300,350,420]),.35,"sawtooth",.06,t,dest,pick([700,900,600]));
    if(k%3===1) tone(160,.12,"sine",.18,t,dest,90);
  } else if(st.kind==="beeps"){
    if(k%4===0) tone(1000,.08,"sine",.1,t,dest); if(k%8===2) tone(1000,.25,"sine",.1,t,dest);
  } else if(st.kind==="lofi"){
    if(k%16===0){ LOFI[(k/16|0)%4].forEach(n=>tone(N(n),2.3,"triangle",.045,t,dest)); }
    if(k%8===0) tone(110,.22,"sine",.2,t,dest,45); if(k%8===4) noise(.08,.07,1800,.8,t);
    if(Math.random()<.2) noise(.02,.03,5000,2,t,"highpass");
  }
}

  fitZ=narrow? Math.max(Hh/1000, W/1600) : Math.min((W-32)/1600,(Hh-16)/1000,1.25);
  if(!keepCenter) zoom=fitZ;
  zoom=Math.max(fitZ*(narrow?1:1),Math.min(zoom,fitZ*2.6));
  const w=1600*zoom, h=1000*zoom;
  scene.style.width=w+"px"; scene.style.height=h+"px";
  scene.style.marginTop=Math.max(0,(Hh-h)/2)+"px";
  stage.classList.toggle("grab",w>W+2||h>Hh+2);
}
function setZoom(z,cx,cy){
  const W=stage.clientWidth, Hh=stage.clientHeight;
  const ux=cx!=null?cx:(stage.scrollLeft+W/2)/zoom, uy=cy!=null?cy:(stage.scrollTop+Hh/2-parseFloat(scene.style.marginTop||0))/zoom;
  zoom=z; layout(true);
  stage.scrollLeft=ux*zoom-W/2; stage.scrollTop=uy*zoom-Hh/2;
}
function goto(x,y){ const W=stage.clientWidth,Hh=stage.clientHeight; stage.scrollTo({left:x*zoom-W/2,top:y*zoom-Hh/2,behavior:"smooth"}); }
$("#zIn").addEventListener("click",()=>setZoom(zoom*1.35));
$("#zOut").addEventListener("click",()=>setZoom(zoom/1.35));
$("#zFit").addEventListener("click",()=>{ layout(false); if(narrow) goto(800,500); });
$("#zones").innerHTML=ZONES.map((z,i)=>'<button data-i="'+i+'">'+z[0]+'</button>').join("");
$$("#zones button").forEach(b=>b.addEventListener("click",()=>{ const z=ZONES[+b.dataset.i]; goto(z[1],z[2]); }));
// mouse drag-to-pan
let drag=null;
stage.addEventListener("pointerdown",e=>{ if(e.pointerType!=="mouse"||e.button!==0) return; drag={x:e.clientX,y:e.clientY,sl:stage.scrollLeft,st:stage.scrollTop}; dragMoved=false; });
addEventListener("pointermove",e=>{ if(!drag) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>6){ dragMoved=true; stage.classList.add("grabbing"); } if(dragMoved){ stage.scrollLeft=drag.sl-dx; stage.scrollTop=drag.st-dy; } });
addEventListener("pointerup",()=>{ if(drag){ drag=null; stage.classList.remove("grabbing"); setTimeout(()=>{ dragMoved=false; },0); } });
let rT=0; addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>layout(true),80); });
layout(false);
if(narrow){ stage.scrollLeft=800*zoom-stage.clientWidth/2; stage.scrollTop=Math.max(0,420*zoom-stage.clientHeight/2); }

/* =================== boot =================== */
applyState(); setLockGlint(); updCount();
if(S.radioF) $("#radDisp").textContent=(+S.radioF).toFixed(1);
const visits=(()=>{ try{ const v=+(localStorage.getItem("desk_visits")||0)+1; localStorage.setItem("desk_visits",v); return v; }catch(e){ return 1; } })();
setTimeout(()=>say(visits<=1? "You found Kai's desk. He's not here. Touch everything. Find the secrets." : nFound()>=NSEC? "Welcome back, master snoop. Every secret found." : "Welcome back. "+(NSEC-nFound())+" secrets still hiding. Ask the duck if you're stuck.",5200),600);
window.__desk={S:()=>S,found,H};
})();
</script>
