<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Snowman Architect · Kai.fun</title>
<meta name="description" content="A cosy snowy sandbox: scoop and pack snow, roll big snowballs across the yard, stack them, sculpt and paint them, dress them up and keep your favourites in the Snowman Gallery.">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#2c3a5e;--ink2:#5f6f94;--snow:#f8fbff;--ice:#dbe8f5;--ice2:#b9cde3;--paper:#fbf7ef;--paper2:#efe6d6;--berry:#d4566b;--amber:#f4b04a;--pine:#3f6d5e;--moss:#8fb79a;--wool:#e9a3a0;
--f:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;--hand:"Gochi Hand","Segoe Print","Comic Sans MS",cursive;
--cut:0 3px 0 rgba(44,58,94,.22),0 8px 22px rgba(44,58,94,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#c9dcef}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;font-weight:600}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#grain{position:fixed;inset:0;pointer-events:none;z-index:1;mix-blend-mode:multiply;opacity:.5}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;font-weight:600;-webkit-tap-highlight-color:transparent}
svg{display:block}
#kai{position:fixed;left:12px;top:10px;z-index:30;font-family:var(--f);font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;background:rgba(251,247,239,.92);padding:7px 13px 7px 11px;border-radius:999px;box-shadow:var(--cut);line-height:1}
#kai:hover{background:#fff}
/* paper buttons */
.btn{appearance:none;border:0;border-radius:16px;background:var(--paper);font-size:17px;padding:11px 20px;min-height:46px;cursor:pointer;box-shadow:var(--cut);transition:transform .12s,box-shadow .12s,background .2s;line-height:1.1;position:relative}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(44,58,94,.25)}
.btn.warm{background:linear-gradient(#ffcf7a,#f4a843);color:#5a3410}
.btn.berry{background:linear-gradient(#ee8a98,#d4566b);color:#fff;text-shadow:0 1px 0 rgba(90,20,40,.35)}
.btn.ice{background:linear-gradient(#ffffff,#dbe8f5)}
.btn.big{font-size:22px;padding:14px 30px;min-height:58px;border-radius:20px}
.btn.warm::after,.btn.berry::after,.tool.on::after{content:"";position:absolute;inset:5px;border:2px dashed rgba(255,255,255,.55);border-radius:inherit;pointer-events:none}
.btn:disabled{opacity:.4;cursor:default;transform:none}
/* title */
#title{position:fixed;top:0;bottom:0;left:3vw;width:min(50vw,660px);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;padding:50px 0 30px}
#titleCv{width:100%;height:auto;pointer-events:none;display:block}
.tbtns{display:flex;flex-direction:column;gap:12px;align-items:center;pointer-events:auto;width:min(330px,80%)}
.tbtns .btn{width:100%}
.tsub{white-space:nowrap;font-family:var(--hand);font-size:20px;color:var(--ink);background:rgba(251,247,239,.8);padding:3px 14px;border-radius:12px;margin-top:2px}
/* editor */
#top{position:fixed;top:8px;right:10px;z-index:20;display:flex;gap:8px;align-items:center}
.brand{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:19;font-family:var(--f);font-weight:700;font-size:20px;color:var(--ink);background:rgba(251,247,239,.85);padding:6px 16px;border-radius:999px;box-shadow:var(--cut);cursor:pointer;white-space:nowrap}
.ib{appearance:none;border:0;background:var(--paper);min-width:44px;height:44px;border-radius:14px;box-shadow:var(--cut);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:15px;transition:transform .12s,background .2s}
.ib:hover{transform:translateY(-2px)}.ib:active{transform:translateY(1px)}
.ib:disabled{opacity:.38;transform:none;cursor:default}
.ib.prim{background:linear-gradient(#ffcf7a,#f4a843);color:#5a3410}
.ib svg{width:24px;height:24px;flex:none}
.ib.off svg .wave{display:none}
.ib.off{background:var(--paper2)}
.grp{display:flex;gap:6px}
#tools{position:fixed;z-index:20;left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;background:rgba(251,247,239,.9);padding:10px 8px;border-radius:22px;box-shadow:var(--cut)}
.tool{appearance:none;border:0;background:transparent;width:72px;height:70px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;cursor:pointer;position:relative;transition:background .2s,transform .12s}
.tool svg{width:34px;height:34px}
.tool:hover{background:rgba(219,232,245,.7)}
.tool.on{background:linear-gradient(#7fa6d6,#5a83bd);color:#fff}
#opts{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:12px;width:min(780px,calc(100vw - 230px));background:rgba(251,247,239,.94);border-radius:22px;box-shadow:var(--cut);padding:10px 14px;min-height:76px;display:flex;align-items:center}
.opt{display:none;width:100%;align-items:center;gap:10px;flex-wrap:wrap}
.opt.on{display:flex}
.otxt{flex:1 1 200px;font-size:14.5px;color:var(--ink2);line-height:1.3;font-weight:600}
.otxt b{color:var(--ink)}
.chip{appearance:none;border:0;background:#fff;border-radius:14px;min-height:44px;padding:5px 12px;display:flex;align-items:center;gap:7px;font-size:14.5px;cursor:pointer;box-shadow:0 2px 0 rgba(44,58,94,.16);transition:background .15s,transform .1s;white-space:nowrap}
.chip svg{width:24px;height:24px}
.chip:active{transform:translateY(1px)}
.chip.on{background:#5a83bd;color:#fff;box-shadow:inset 0 2px 0 rgba(0,0,0,.15)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.sep{width:2px;align-self:stretch;background:rgba(44,58,94,.1);border-radius:2px;margin:0 2px}
.sw{appearance:none;border:0;width:38px;height:38px;border-radius:50%;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 2px 0 rgba(44,58,94,.2);position:relative;transition:transform .12s;flex:none}
.sw.on{transform:scale(1.14);outline:3px solid var(--ink);outline-offset:2px}
.sw.eraser{background:repeating-linear-gradient(45deg,#fff 0 5px,#e4edf7 5px 10px)}
#decoBox{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;width:100%;padding:2px 2px 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.dt{flex:none;width:64px;height:68px;border-radius:14px;background:#fff;border:0;box-shadow:0 2px 0 rgba(44,58,94,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;font-size:11px;color:var(--ink2);padding-top:2px;transition:transform .12s,background .15s;touch-action:pan-x}
.dt:hover{transform:translateY(-2px);background:#f3f8fd}
.dt canvas{width:46px;height:46px;pointer-events:none}
.dt span{pointer-events:none;line-height:1.05;margin-top:1px}
#hint{position:fixed;z-index:18;left:50%;transform:translateX(-50%);top:64px;font-family:var(--hand);font-size:21px;color:var(--ink);background:rgba(251,247,239,.88);padding:4px 16px;border-radius:14px;box-shadow:var(--cut);pointer-events:none;transition:opacity .5s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#decoBar{position:fixed;z-index:22;left:50%;top:60px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 12px);gap:5px;background:rgba(251,247,239,.96);padding:5px;border-radius:16px;box-shadow:var(--cut);align-items:center}
#decoBar .ib{min-width:38px;height:38px;border-radius:11px;box-shadow:0 2px 0 rgba(44,58,94,.16);padding:0 6px}
#decoBar .ib svg{width:21px;height:21px}
#decoBar .sw{width:28px;height:28px}
#dbTints{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#dbName{font-family:var(--hand);font-size:20px;padding:0 8px 0 6px;white-space:nowrap}
body.selOn #hint{top:118px}
.pop{position:fixed;z-index:25;top:60px;right:10px;width:300px;background:var(--paper);border-radius:20px;box-shadow:var(--cut);padding:14px}
.pop h4,.panel h4{font-size:14px;color:var(--ink2);margin:4px 0 8px;font-weight:600;letter-spacing:.02em}
.bgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bgc{appearance:none;border:0;border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;box-shadow:0 2px 0 rgba(44,58,94,.16);padding:0 0 4px;font-size:14px}
.bgc canvas{width:100%;height:62px;display:block;margin-bottom:3px}
.bgc.on{outline:3px solid #5a83bd;outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.row .chip{flex:1 1 40%;justify-content:center}
/* modal */
#modal{position:fixed;inset:0;z-index:40;background:rgba(32,44,78,.42);display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.panel{background:var(--paper);border-radius:24px;box-shadow:0 10px 40px rgba(20,30,60,.35);width:min(820px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden;position:relative}
.panel.small{width:min(420px,100%)}
.phead{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.phead h3{font-size:24px;font-weight:700;flex:1}
.x{appearance:none;border:0;background:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:22px;box-shadow:0 2px 0 rgba(44,58,94,.16);line-height:1}
.tabs{display:flex;gap:6px;padding:0 18px 8px}
.pbody{padding:6px 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:#fff;border-radius:16px;box-shadow:0 3px 0 rgba(44,58,94,.14);overflow:hidden;display:flex;flex-direction:column}
.card img,.card canvas{width:100%;aspect-ratio:16/10;display:block;background:#dbe8f5;object-fit:cover;cursor:pointer}
.card .nm{font-family:var(--hand);font-size:21px;padding:6px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt2{font-size:12px;color:var(--ink2);padding:0 10px}
.card .acts{display:flex;gap:6px;padding:8px}
.card .acts .chip{flex:1;justify-content:center;min-height:38px;font-size:13.5px;padding:4px 8px}
.card .acts .chip.ic{flex:0 0 38px;padding:0}
.empty{font-family:var(--hand);font-size:22px;color:var(--ink2);text-align:center;padding:30px 10px}
.field{width:100%;font-family:var(--hand);font-size:26px;padding:8px 14px;border-radius:14px;border:2px solid var(--ice2);background:#fff;color:var(--ink);outline:none;user-select:text;-webkit-user-select:text}
.field:focus{border-color:#5a83bd}
.prev{width:100%;border-radius:16px;display:block;margin-bottom:12px;aspect-ratio:16/10;background:#dbe8f5}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pbtns .btn{flex:1 1 140px}
#toast{position:fixed;z-index:60;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:15px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){
  .brand{display:none}
  #top{top:8px;right:8px;gap:5px}
  .grp{gap:5px}
  .ib{min-width:40px;height:40px;padding:0 7px;border-radius:12px}
  .ib span{display:none}
  .ib svg{width:22px;height:22px}
  #kai{top:12px;left:8px;font-size:14px;padding:7px 10px}
  #tools{left:0;right:0;top:auto;bottom:0;transform:none;flex-direction:row;justify-content:space-around;border-radius:20px 20px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
  .tool{width:auto;flex:1;height:56px;font-size:13px}
  .tool svg{width:28px;height:28px}
  #opts{left:6px;right:6px;width:auto;transform:none;bottom:calc(74px + env(safe-area-inset-bottom));border-radius:18px;padding:8px 10px;min-height:66px}
  .opt{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;touch-action:pan-x}
  .opt::-webkit-scrollbar{display:none}
  .otxt{flex:1 0 170px;font-size:13px}
  .chip{min-height:42px;padding:4px 10px;font-size:13.5px}
  .chips{flex-wrap:nowrap}
  #hint{top:58px;font-size:18px;white-space:normal;text-align:center;width:max-content;max-width:90vw;line-height:1.15}
  .pop{left:8px;right:8px;width:auto;top:56px}
  .grid{grid-template-columns:repeat(2,1fr);gap:9px}
  .card .nm{font-size:18px}
  .phead h3{font-size:21px}
  #toast{bottom:170px}
  .opt[data-for=snow] .otxt{display:none}
  .opt[data-for=paint]{flex-wrap:wrap;row-gap:7px}
  .opt[data-for=paint] .sep{display:none}
  #paintCols{gap:5px}
  #paintCols .sw{width:33px;height:33px}
  #decoBar .sw{width:25px;height:25px}
  #decoBar{left:6px;right:6px;top:54px;transform:none}
  #dbName{font-size:17px}
  body.selOn #hint{top:150px}
  #decoBar .ib{min-width:34px;height:34px}
  .card .acts{gap:4px;padding:6px}
  .tsub{font-size:18px}
  #title{left:0;right:0;width:auto;justify-content:space-between;padding:52px 0 calc(18px + env(safe-area-inset-bottom))}
  #titleCv{width:94vw}
  .tbtns{width:86vw;gap:9px}
  .btn.big{min-height:54px;font-size:20px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="grain"></div>
<a id="kai" href="index.html">← Kai.fun</a>

<div id="title">
  <canvas id="titleCv" width="980" height="420"></canvas>
  <div class="tbtns">
    <button id="tNew" class="btn big warm">Start building</button>
    <button id="tCont" class="btn ice hidden">Keep building my snowman</button>
    <button id="tGal" class="btn">Snowman Gallery</button>
    <div class="tsub">scoop · roll · stack · dress up</div>
  </div>
</div>

<div id="ui" class="hidden">
  <div class="brand" id="brand" title="Back to the title">Snowman Architect</div>
  <header id="top">
    <div class="grp">
      <button class="ib" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="ib" id="bRedo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <div class="grp">
      <button class="ib" id="bScene" title="Backyard, day/night and snowfall" aria-label="Scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m3 17 5-6 4 4 3-3 6 6"/><circle cx="16" cy="8.5" r="1.8"/></svg><span>Scene</span></button>
      <button class="ib" id="bSound" title="Sound on/off" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5v14l-4.5-4.5H4z" fill="currentColor" fill-opacity=".15"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
    </div>
    <div class="grp">
      <button class="ib" id="bGal" title="Snowman Gallery" aria-label="Gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span>Gallery</span></button>
      <button class="ib prim" id="bSave" title="Save or download" aria-label="Save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5"/><path d="M4 15v3a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-3"/></svg><span>Save</span></button>
    </div>
  </header>

  <nav id="tools">
    <button class="tool on" data-tool="snow"><svg viewBox="0 0 40 40"><circle cx="20" cy="22" r="12" fill="#fff" stroke="currentColor" stroke-width="2.4"/><path d="M14 19a7 7 0 0 1 6-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/><path d="M5 34h30" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M30 8l2-3M33 12l3-1M26 6V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Snow</span></button>
    <button class="tool" data-tool="shape"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="17" cy="26" rx="12" ry="9" fill="#fff"/><path d="M24 4c3 0 5 2 5 5v6l3-2c2-1 4 1 3 3l-6 8"/><path d="M24 4c-2 0-3 2-3 4v9"/></svg><span>Shape</span></button>
    <button class="tool" data-tool="paint"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5c5 7 9 12 9 17a9 9 0 0 1-18 0c0-5 4-10 9-17z" fill="#ee8a98"/><path d="M16 23a4 4 0 0 0 3 4" stroke="#fff"/></svg><span>Paint</span></button>
    <button class="tool" data-tool="deco"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 30h28" /><rect x="11" y="9" width="18" height="21" rx="2" fill="#4a4f63" stroke="currentColor"/><path d="M11 24h18" stroke="#d4566b" stroke-width="4"/><path d="M5 31c5 2 25 2 30 0" /></svg><span>Dress up</span></button>
  </nav>

  <div id="opts">
    <div class="opt on" data-for="snow">
      <div class="otxt" id="snowTip"><b>Press the snow</b> to scoop a ball. <b>Drag sideways</b> to roll it bigger. <b>Drag up</b> or <b>press and hold</b> to lift it onto another ball.</div>
      <div class="chips">
        <button class="chip" id="bFresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="m9 4 3 2 3-2M9 20l3-2 3 2"/></svg>Fresh snow</button>
        <button class="chip on" id="bSteady" title="Keeps stacks neat and centred"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="17" r="5"/><circle cx="12" cy="7.5" r="3.5"/><path d="M12 1v2M3 22h18"/></svg>Steady</button>
      </div>
    </div>
    <div class="opt" data-for="shape">
      <div class="chips" id="shapeModes"></div>
    </div>
    <div class="opt" data-for="paint">
      <div class="chips" id="paintCols"></div>
      <div class="sep"></div>
      <div class="chips" id="paintOpts"></div>
    </div>
    <div class="opt" data-for="deco">
      <div id="decoBox"></div>
    </div>
  </div>
  <div id="hint"></div>
  <div id="decoBar" class="hidden">
    <span id="dbName"></span>
    <div id="dbTints"></div>
    <button class="ib" id="dbFlip" title="Flip" aria-label="Flip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7 3 12l5 5zM16 7l5 5-5 5z" fill="currentColor" fill-opacity=".2"/></svg></button>

}

/* ============================== title screen: a snowman builds itself ============================== */
const demo = { sc: null, field: new SnowField(), t: 0 };
function demoReset() { demo.sc = newScene('yard'); demo.field.build('yard'); demo.t = 0; demo.step = 0; demo.tr = {}; demo.pi = 0; demo.A = demo.B = demo.C = null; demo.fade = 0; }
function demoTrack(key, x, y, w) {
  const sc = demo.sc, f = demo.field; let t = demo.tr[key];
  if (!t) { t = [x, y, w]; sc.tracks.push(t); f.seg(x, y, x + 0.01, y, w); demo.tr[key] = t; return; }
  const n = t.length; if (Math.hypot(x - t[n - 3], y - t[n - 2]) < 6) return; f.seg(t[n - 3], t[n - 2], x, y, w); t.push(x, y, w);
}
function demoFly(b, P, k, from) { layout(demo.sc); const tx = P._cx, ty = P._cy - (P._ry + b._ry) * 0.86; b._fx = lerp(from.x, tx, k); b._fy = lerp(from.y, ty, k) - Math.sin(k * Math.PI) * 110; }
function demoUpdate(dt) {
  const D = demo, sc = D.sc; D.t += dt; const t = D.t;
  if (!D.A && t > 0.4) { D.A = newBall({ r: 13, x: -440, gy: 785, seed: 3 }); sc.balls.push(D.A); }
  if (D.A && t < 3.8) { const k = ease(clamp((t - 0.4) / 3.2, 0, 1)), x = lerp(-440, -10, k), gy = lerp(785, 765, k); D.A.rot += (x - D.A.x) / Math.max(8, D.A.r); D.A.x = x; D.A.gy = gy; D.A.r = lerp(13, 66, k); demoTrack('A', x, gy, D.A.r * 0.95); }
  if (!D.B && t > 3.6) { D.B = newBall({ r: 12, x: 440, gy: 715, seed: 8 }); sc.balls.push(D.B); }
  if (D.B && D.step === 0) { const k = ease(clamp((t - 3.6) / 2.4, 0, 1)), x = lerp(440, 190, k), gy = lerp(715, 735, k); D.B.rot += (x - D.B.x) / Math.max(8, D.B.r); D.B.x = x; D.B.gy = gy; D.B.r = lerp(12, 47, k); demoTrack('B', x, gy, D.B.r * 0.95); if (t > 6.2) { layout(sc); D.B._free = true; D.B._fx = D.B._cx; D.B._fy = D.B._cy; D.from = { x: D.B._cx, y: D.B._cy }; D.step = 1; } }
  if (D.step === 1) { const k = ease(clamp((t - 6.2) / 1, 0, 1)); demoFly(D.B, D.A, k, D.from); if (k >= 1) { D.B._free = false; D.B.p = D.A.id; D.B.a = 0; D.B._sq = 0.14; D.A._sq = 0.05; D.step = 2; layout(sc); puff(D.B._cx, D.B._cy + D.B._ry, 8, 90); } }
  if (D.step === 2 && t > 7.5) { D.C = newBall({ r: 10, x: 330, gy: 775, seed: 5 }); sc.balls.push(D.C); demoTrack('C', 330, 775, 30); D.step = 3; }
  if (D.step === 3) { D.C.r = Math.min(33, D.C.r + dt * 34); if (t > 8.3) { layout(sc); D.C._free = true; D.C._fx = D.C._cx; D.C._fy = D.C._cy; D.from = { x: D.C._cx, y: D.C._cy }; D.step = 4; } }
  if (D.step === 4) { const k = ease(clamp((t - 8.3) / 0.9, 0, 1)); demoFly(D.C, D.B, k, D.from); if (k >= 1) { D.C._free = false; D.C.p = D.B.id; D.C.a = 0; D.C._sq = 0.14; D.B._vw = 1.2; D.step = 5; layout(sc); puff(D.C._cx, D.C._cy + D.C._ry, 6, 70); } }
  const plan = [[9.7, 'coal'], [9.95, 'coal'], [10.4, 'carrot'], [10.8, 'smile'], [11.2, 'stick'], [11.5, 'stick'], [11.9, 'scarf'], [12.4, 'tophat'], [12.9, 'coal'], [13.15, 'coal'], [13.4, 'coal']];
  if (D.step >= 5) while (D.pi < plan.length && t > plan[D.pi][0]) { layout(sc); smartDeco(sc, plan[D.pi][1], D.A); D.pi++; }
  D.fade = t > 17 ? clamp((t - 17) / 0.8, 0, 1) : 0;
  if (t > 18) { demoReset(); D.fade = 1; }
  updateScene(sc, dt, null);
}

/* ============================== loop ============================== */
let freshDone = false, vign = null;
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - (frame.last || ts)) / 1000)); frame.last = ts; now += dt;
  if (mode === 'title') demoUpdate(dt);
  else { updDrag(dt); updateScene(S, dt, field); }
  updParts(dt);
  if (freshT > 0) { freshT -= dt; if (freshT < 0.6 && !freshDone) { freshDone = true; S.tracks = []; ensureField(true); commit(); } if (freshT <= 0) { freshT = 0; freshDone = false; } }
  flurry = Math.max(0, flurry - dt * 0.6);
  const sc = mode === 'title' ? demo.sc : S;
  nightA = lerp(nightA, mode === 'title' ? 0.42 : (S.night ? 1 : 0), 1 - Math.exp(-dt * 3));
  const sp = 1 + flurry * 2.5;
  for (const f of flakes) { f.y += (0.02 + 0.035 * f.z) * dt * sp; f.x += (Math.sin(now * 0.7 + f.ph) * 0.004 + 0.002 + flurry * 0.01) * dt * f.z; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); } if (f.x > 1.02) f.x = -0.02; }
  try { draw(sc); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function draw(sc) {
  const fld = mode === 'title' ? demo.field : field, k = cam.s * DPR;
  const key = sc.bg + '|' + cv.width + '|' + cv.height + '|' + cam.s.toFixed(4) + '|' + cam.ox.toFixed(1) + '|' + cam.oy.toFixed(1);
  if (!bgCache || bgCacheKey !== key) {
    if (!bgCache || bgCache.width !== cv.width || bgCache.height !== cv.height) bgCache = mkCanvas(cv.width, cv.height);
    const x = bgCache.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, bgCache.width, bgCache.height);
    x.setTransform(k, 0, 0, k, cam.ox * DPR, cam.oy * DPR); PXS = k; drawBackdrop(x, sc.bg, vb); bgCacheKey = key;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgCache, 0, 0);
  ctx.setTransform(k, 0, 0, k, cam.ox * DPR, cam.oy * DPR); PXS = k; FLK = DPR;
  layout(sc);
  renderWorld(ctx, sc, fld, vb, now, { ghost: mode === 'edit' ? snapGhost : null, night: nightA, flakes: sc.flakes ? flakes : null, parts });
  if (mode === 'edit') drawOverlay();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const wf = mode === 'title' ? demo.fade : (freshT > 0 ? Math.sin(clamp(1 - freshT / 1.2, 0, 1) * Math.PI) * 0.85 : 0);
  if (wf > 0) { ctx.fillStyle = 'rgba(248,251,255,' + wf + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (!vign || vign.w !== cv.width || vign.h !== cv.height) { const g = ctx.createRadialGradient(cv.width / 2, cv.height * 0.45, Math.min(cv.width, cv.height) * 0.45, cv.width / 2, cv.height * 0.45, Math.max(cv.width, cv.height) * 0.75); g.addColorStop(0, 'rgba(30,40,90,0)'); g.addColorStop(1, 'rgba(30,40,90,.22)'); vign = { g, w: cv.width, h: cv.height }; }
  ctx.fillStyle = vign.g; ctx.fillRect(0, 0, cv.width, cv.height);
}
function drawOverlay() {
  const c = ctx, u = 1 / cam.s;
  if (sel && S.decos.includes(sel)) {
    const h = handlePos(sel);
    c.lineWidth = 2 * u; c.strokeStyle = 'rgba(90,131,189,.9)'; c.setLineDash([6 * u, 5 * u]); c.beginPath(); c.arc(h.c.x, h.c.y, h.c.R + 6 * u, 0, TAU); c.stroke(); c.setLineDash([]);
    for (const [p, kind] of [[h.rot, 'rot'], [h.sc, 'sc']]) {
      c.fillStyle = '#fff'; c.strokeStyle = '#5a83bd'; c.lineWidth = 2.5 * u; c.beginPath(); c.arc(p.x, p.y, 14 * u, 0, TAU); c.fill(); c.stroke();
      c.strokeStyle = '#2c3a5e'; c.lineWidth = 2 * u; c.lineCap = 'round'; c.beginPath();
      if (kind === 'rot') { c.arc(p.x, p.y, 6.5 * u, -2.6, 1.2); c.moveTo(p.x + 6.5 * u * Math.cos(1.2) + 3 * u, p.y + 6.5 * u * Math.sin(1.2) - 1 * u); c.lineTo(p.x + 6.5 * u * Math.cos(1.2), p.y + 6.5 * u * Math.sin(1.2)); c.lineTo(p.x + 6.5 * u * Math.cos(1.2) - 1 * u, p.y + 6.5 * u * Math.sin(1.2) - 4 * u); }
      else { c.moveTo(p.x - 5 * u, p.y - 5 * u); c.lineTo(p.x + 5 * u, p.y + 5 * u); c.moveTo(p.x + 5 * u, p.y); c.lineTo(p.x + 5 * u, p.y + 5 * u); c.lineTo(p.x, p.y + 5 * u); c.moveTo(p.x - 5 * u, p.y); c.lineTo(p.x - 5 * u, p.y - 5 * u); c.lineTo(p.x, p.y - 5 * u); }
      c.stroke();
    }
  }
  if (hover && !hover.touch && (tool === 'paint' || (tool === 'shape' && (shapeMode === 'carve' || shapeMode === 'smooth')))) {
    const b = (drag && drag.b) || ballAt(hover.x, hover.y);
    if (b) {
      const r = tool === 'paint' ? brushR(b) : shapeMode === 'smooth' ? 10 + b.r * 0.15 : Math.max(2, 0.05 * b.r * 0.5);
      c.lineWidth = 1.8 * u; c.strokeStyle = tool === 'paint' && !eraser ? PAINTS[paintCol].c : '#5a83bd'; c.beginPath(); c.arc(hover.x, hover.y, r, 0, TAU); c.stroke();
    }
  }
}

/* ============================== screens ============================== */
function hasWork() { const w = LS.get(K_WORK, null); return w && w.scene ? w : null; }
function updContinue() { $('tCont').classList.toggle('hidden', !hasWork()); }
function enterEdit(work) {
  mode = 'edit'; $('title').classList.add('hidden'); $('ui').classList.remove('hidden');
  if (work) { try { S = sceneFrom(work.scene); curName = work.name || ''; curGal = work.gal || null; } catch (e) { S = newScene(); } }
  else { S = newScene(S && S.bg || 'yard'); curName = ''; curGal = null; }
  sel = null; drag = null; ensureField(true); resetHistory(); computeCam(); syncSceneUI(); setTool('snow'); nightA = S.night ? 1 : 0;
  if (!S.balls.length) showHint('Press on the snow to scoop a snowball', 4200);
}
function goTitle() {
  if (mode === 'edit') { clearTimeout(workT); if (S.balls.length || S.decos.length || S.tracks.length) LS.set(K_WORK, { scene: sceneJSON(S), name: curName, gal: curGal }); }
  mode = 'title'; sel = null; drag = null; updDecoBar(); closeModal(); closePops();
  $('ui').classList.add('hidden'); $('title').classList.remove('hidden'); updContinue(); demoReset(); computeCam();
}
$('tNew').onclick = () => {
  Snd.unlock(); Snd.pop(); const w = hasWork();
  if (!w) { enterEdit(null); return; }
  openModal('<div class="panel small"><div class="phead"><h3>Start a fresh yard?</h3><button class="x" aria-label="Close">×</button></div><div class="pbody"><p style="font-size:16px;color:var(--ink2);margin-bottom:6px">Your last snowman will be cleared away. Snowmen saved in the gallery stay safe.</p><div class="pbtns"><button class="btn" id="nKeep">Keep building it</button><button class="btn warm" id="nFresh">Start fresh</button></div></div></div>');
  $('nKeep').onclick = () => { closeModal(); enterEdit(hasWork()); };
  $('nFresh').onclick = () => { closeModal(); LS.set(K_WORK, null); enterEdit(null); };
};
$('tCont').onclick = () => { Snd.unlock(); Snd.pop(); enterEdit(hasWork()); };
$('tGal').onclick = () => { Snd.unlock(); Snd.tick(); openGallery(gal().length ? 'mine' : 'ideas'); };
window.addEventListener('resize', resize);
(function init() {
  const pr = LS.get(K_PREF, {}) || {}; Snd.setMuted(!!pr.muted); steady = pr.steady !== false; updSound();
  makeGrain(); buildDecoBox(); demoReset(); resize(); updContinue(); syncSceneUI();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawTitleText(); });
  requestAnimationFrame(frame);
})();
</script>
