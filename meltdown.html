<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="icons/meltdown.svg" type="image/svg+xml"><link rel="icon" href="icons/meltdown.png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>MELTDOWN. · Kai.fun</title>
<meta name="description" content="You are an ice cube on the run. Heat melts you smaller, cold grows you back. Nine giant-sized levels from the kitchen counter to a snowy park: slide as a puddle, float as steam, freeze puddles into bridges.">
<meta name="theme-color" content="#0f2a44">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<style>
:root{--ink:#14263d;--ink2:#56708c;--card:rgba(250,253,255,.94);--ice:#bfe9ff;--ice2:#7fd0ff;--deep:#0f2a44;--warm:#ff8a3d;--hot:#ff3d2e;--gold:#ffc93a;
--sh:0 3px 0 rgba(10,30,60,.18),0 8px 24px rgba(5,20,45,.28);--h:"Lilita One","Trebuchet MS",Impact,sans-serif;--f:"Nunito","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;background:#0f2a44}
body{font-family:var(--f);font-weight:800;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
#kai{position:fixed;left:12px;top:12px;z-index:40;font-weight:800;font-size:15px;color:var(--ink);text-decoration:none;background:var(--card);padding:9px 14px 9px 12px;border-radius:999px;box-shadow:var(--sh);line-height:1}
#kai:hover{background:#fff}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ib{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:inline-flex;align-items:center;justify-content:center;transition:transform .12s}
.ib:hover{transform:translateY(-2px)}.ib:active{transform:scale(.94)}
.ib svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ib .fillc{fill:var(--ink)}
.ib.on{background:#ffd34a}
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#hud button{pointer-events:auto}
#topC{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--card);border-radius:999px;padding:6px 8px 6px 14px;box-shadow:var(--sh);white-space:nowrap}
#lvName{font-family:var(--h);font-size:17px;letter-spacing:.5px;color:var(--ink);font-weight:400}
#timer{font-variant-numeric:tabular-nums;font-size:15px;background:var(--deep);color:#e8f6ff;border-radius:999px;padding:4px 10px;min-width:72px;text-align:center}
#topR{position:absolute;top:12px;right:12px;display:flex;gap:8px}
body.heat #bHeat{background:#ff6a2a}body.heat #bHeat svg{stroke:#fff}body.heat #bHeat .fillc{fill:#fff}
#side{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:14px}
#thermo{position:relative;width:46px;display:flex;flex-direction:column;align-items:center}
#tNum{font-size:15px;color:#fff;background:var(--deep);border-radius:9px;padding:3px 7px;margin-bottom:6px;font-variant-numeric:tabular-nums;min-width:44px;text-align:center;box-shadow:var(--sh)}
#tTube{position:relative;width:16px;height:150px;border-radius:9px;background:rgba(255,255,255,.88);box-shadow:var(--sh);overflow:hidden;border:2px solid #fff}
#tFill{position:absolute;left:0;right:0;bottom:0;height:40%;background:#ff8a3d;border-radius:0 0 7px 7px;transition:background .3s}
#tZero{position:absolute;left:-2px;right:-2px;height:2px;background:var(--deep);opacity:.55}
#tBulb{width:30px;height:30px;border-radius:50%;margin-top:-8px;border:3px solid #fff;background:#ff8a3d;box-shadow:var(--sh);transition:background .3s}
#sizeBox{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
#sizeCube{width:46px;height:46px;display:flex;align-items:flex-end;justify-content:center}
#sizeIce{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f2fbff 0%,#a8e0ff 55%,#6cc4f5 100%);border:2px solid #fff;box-shadow:inset -3px -3px 0 rgba(40,120,190,.25),var(--sh);transition:width .2s,height .2s}
#sizeNum{font-size:14px;color:#fff;background:var(--deep);border-radius:9px;padding:2px 7px;font-variant-numeric:tabular-nums;box-shadow:var(--sh)}
#frostRdy{position:absolute;right:-22px;top:2px;width:24px;height:24px;border-radius:50%;background:#e8f8ff;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.6);transition:all .2s;box-shadow:0 0 14px #9fe3ff}
#frostRdy.on{opacity:1;transform:scale(1)}
#frostRdy svg{width:16px;height:16px;fill:none;stroke:#2f8fe0;stroke-width:2.6;stroke-linecap:round}
body.danger #sizeNum{background:var(--hot);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#lifeRing{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:64px;height:64px}
#lifeRing svg{width:100%;height:100%;transform:rotate(-90deg)}
#lifeRing circle{fill:rgba(15,42,68,.55);stroke:rgba(255,255,255,.35);stroke-width:6}
#lifeRing #lifeFg{fill:none;stroke:#7fd0ff;stroke-width:6;stroke-linecap:round;stroke-dasharray:157;stroke-dashoffset:0}
#lifeIco{position:absolute;inset:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff,#7fd0ff 60%,#3a9be0)}
#lifeRing.steam #lifeFg{stroke:#fff}#lifeRing.steam #lifeIco{border-radius:50%;background:radial-gradient(circle,#fff,#dfe8ef 60%,#b8c8d6)}
#keys{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;opacity:.95}
.k{background:var(--card);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 3px 0 rgba(10,30,60,.3);color:var(--ink)}
#bJump{position:absolute;right:22px;bottom:26px;width:84px;height:84px;border-radius:50%;background:rgba(250,253,255,.78);box-shadow:var(--sh);display:none;align-items:center;justify-content:center}
#bJump svg{width:40px;height:40px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#bJump.on{background:#ffd34a;transform:scale(.94)}
.scr{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:70px 16px 24px}
#title{background:radial-gradient(ellipse at 50% 120%,rgba(255,138,61,.35),transparent 60%),linear-gradient(180deg,rgba(15,42,68,.15),rgba(15,42,68,.45))}
#logo{display:flex;font-family:var(--h);font-size:clamp(46px,13vw,128px);line-height:1;letter-spacing:.02em;filter:drop-shadow(0 6px 0 rgba(10,40,80,.35)) drop-shadow(0 18px 30px rgba(0,20,50,.45))}
#logo span{position:relative;display:inline-block;background:linear-gradient(180deg,#ffffff 0%,#dff5ff 30%,#8fd6ff 62%,#4aa9e8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.7);animation:bob 3s ease-in-out infinite}
#logo span:nth-child(2n){animation-delay:-.6s}#logo span:nth-child(3n){animation-delay:-1.3s}
#logo span::after{content:"";position:absolute;left:46%;top:86%;width:.11em;height:.22em;border-radius:0 0 .06em .06em;background:linear-gradient(180deg,#8fd6ff,#4aa9e8);animation:drip 2.6s ease-in infinite;opacity:.95}
#logo span:nth-child(3)::after,#logo span:nth-child(7)::after{height:.36em;animation-delay:-1.1s}
#logo span:nth-child(2)::after,#logo span:nth-child(5)::after,#logo span:nth-child(9)::after{display:none}
#logo .dot{background:linear-gradient(180deg,#ffd9a8,#ff8a3d 60%,#ff3d2e);-webkit-background-clip:text;background-clip:text}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes drip{0%{transform:scaleY(.4);transform-origin:top}60%{transform:scaleY(1.15)}100%{transform:scaleY(.4)}}
#tagIco svg{width:150px;height:56px;fill:none}
#tagIco .ice{fill:#dff5ff;stroke:#fff;stroke-width:1.5}#tagIco .ar{stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.big{width:104px;height:104px;border-radius:50%;background:linear-gradient(180deg,#ffd34a,#ff9f2e);box-shadow:0 6px 0 #c25f12,0 16px 34px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.big:hover{transform:translateY(-3px) scale(1.03)}.big:active{transform:translateY(3px);box-shadow:0 3px 0 #c25f12}
.big svg{width:50px;height:50px;fill:#fff;stroke:none;margin-left:6px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#loadBar{width:180px;height:8px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}#loadFill{height:100%;width:0;background:#fff;transition:width .2s}
#levels{background:linear-gradient(180deg,rgba(12,34,58,.88),rgba(12,34,58,.94));justify-content:flex-start;overflow-y:auto;touch-action:pan-y}
#levels .head{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:center}
#starTot{font-size:20px;color:#fff;display:flex;align-items:center;gap:6px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%;max-width:880px}
.lv{position:relative;border-radius:18px;padding:12px 10px 10px;background:var(--c,#2d5d8a);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .12s;min-height:170px}
.lv:hover{transform:translateY(-3px)}.lv:active{transform:translateY(2px)}
.lv .n{position:absolute;left:10px;top:8px;font-family:var(--h);font-size:20px;opacity:.85}
.lv svg.ic{width:70px;height:70px}
.lv .nm{font-family:var(--h);font-size:17px;letter-spacing:.3px;line-height:1.1;min-height:38px;display:flex;align-items:center}
.lv .ss{display:flex;gap:3px}.lv .bt{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.lv.locked{filter:grayscale(.85) brightness(.6);cursor:default}.lv.locked:hover{transform:none}
.lv .lock{position:absolute;left:0;right:0;top:14px;height:72px;display:flex;align-items:center;justify-content:center}.lv.locked svg.ic{opacity:.18}
.lv .lock svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2.4}
.st{display:inline-block;width:22px;height:22px;background:rgba(0,0,0,.25);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.st.on{background:var(--gold)}
.card{background:var(--card);border-radius:26px;padding:22px 22px 20px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:16px;max-width:400px;width:100%}
.big2{width:62px;height:62px}.big2 svg{width:30px;height:30px}
.ib.go{background:linear-gradient(180deg,#ffd34a,#ff9f2e)}.ib.go svg{stroke:#fff;fill:#fff}
#pause,#settings,#result,#fail{background:rgba(8,24,44,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.srow{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.srow svg.lead{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.seg{display:flex;background:#e3edf6;border-radius:999px;padding:3px}
.seg button{padding:7px 12px;border-radius:999px;font-size:13px;color:var(--ink2);display:flex;align-items:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.seg svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
input[type=range]{width:160px;accent-color:#2f8fe0}
#rTitle,#fWord{font-family:var(--h);font-size:30px;color:var(--ink);letter-spacing:.5px;text-align:center;line-height:1.1}
#stars{display:flex;gap:10px}#stars .st{width:56px;height:56px;transform:scale(.4);opacity:.4;transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .2s}
#stars .st.on{transform:scale(1);opacity:1}
#rStats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:7px;background:#eef5fb;border-radius:14px;padding:8px 12px;font-size:17px;font-variant-numeric:tabular-nums}
.stat svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.stat .par{font-size:12px;color:var(--ink2)}.stat.ok{background:#fff3c4}
.stat .best{font-size:11px;background:var(--gold);border-radius:6px;padding:1px 5px;color:var(--ink)}
#fIco svg{width:90px;height:90px}
#banner{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%);z-index:25;text-align:center;pointer-events:none;color:#fff;animation:ban 2.2s ease forwards}
#bNum{font-family:var(--h);font-size:22px;opacity:.9;text-shadow:0 3px 0 rgba(0,0,0,.3)}
#bName{font-family:var(--h);font-size:clamp(34px,8vw,64px);text-shadow:0 4px 0 rgba(10,40,80,.45),0 10px 30px rgba(0,0,0,.4)}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-30%) scale(.9)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;z-index:99}
#touch{position:fixed;inset:0;z-index:10;display:none}
body.touch.playing #touch{display:block}
body.touch #bJump{display:flex}
body.touch #keys{display:none!important}
#stickBase{position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);opacity:0;transition:opacity .15s}
#stickBase.on{opacity:1}
#stickKnob{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.25)}
@media (max-width:640px){
#kai{font-size:13px;padding:8px 10px;top:10px;left:8px}
#topC{top:52px;padding:4px 6px 4px 10px}#lvName{font-size:14px}#timer{font-size:13px;min-width:62px}
#topR{top:8px;right:8px;gap:6px}.ib{width:40px;height:40px}.ib svg{width:21px;height:21px}
#side{left:8px;top:auto;bottom:auto;top:46%;gap:10px;transform:translateY(-50%) scale(.82);transform-origin:left center}
#tTube{height:110px}
#lifeRing{top:92px}
#bJump{width:76px;height:76px;right:16px;bottom:22px}
.scr{padding:64px 12px 18px;gap:16px}
#grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lv{min-height:150px;padding:10px 6px 8px}.lv svg.ic{width:56px;height:56px}.lv .nm{font-size:15px;min-height:34px}
.card{padding:18px 14px 16px;gap:12px}
#stars .st{width:46px;height:46px}
.big2{width:56px;height:56px}
.seg button{padding:6px 9px}
input[type=range]{width:120px}
}
@media (max-height:480px) and (orientation:landscape){
#side{transform:translateY(-50%) scale(.7)}
.scr{padding-top:50px;gap:10px}#logo{font-size:56px}.big{width:80px;height:80px}
}
body.nohud #hud,body.nohud #kai,body.nohud #banner{display:none!important}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="touch" aria-hidden="true"><div id="stickBase"><div id="stickKnob"></div></div></div>
<a id="kai" href="index.html">← Kai.fun</a>
<div id="hud" class="hide">
  <div id="topC"><span id="lvName"></span><span id="timer">0:00.0</span></div>
  <div id="topR">
    <button class="ib" id="bHeat" aria-label="Heat vision (H)" title="Heat vision (H)"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3.2" class="fillc"/></svg></button>
    <button class="ib" id="bPause" aria-label="Pause" title="Pause (Esc)"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  </div>
  <div id="side">
    <div id="thermo" aria-label="Temperature"><div id="tNum">20°</div><div id="tTube"><div id="tFill"></div><div id="tZero"></div></div><div id="tBulb"></div></div>
    <div id="sizeBox" aria-label="Size"><div id="sizeCube"><div id="sizeIce"></div></div><div id="sizeNum">100%</div><div id="frostRdy" title="Cold enough to freeze water"><svg viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg></div></div>
  </div>
  <div id="lifeRing" class="hide"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" class="bg"/><circle cx="30" cy="30" r="25" id="lifeFg"/></svg><div id="lifeIco"></div></div>
  <div id="keys" class="hide"><span class="k">WASD</span><span class="k">SPACE</span><span class="k">H</span><span class="k">Q E</span></div>
  <button id="bJump" aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg></button>
</div>
<div id="banner" class="hide"><div id="bNum"></div><div id="bName"></div></div>
<div id="title" class="scr">
  <div id="logo" aria-label="MELTDOWN."><span>M</span><span>E</span><span>L</span><span>T</span><span>D</span><span>O</span><span>W</span><span>N</span><span class="dot">.</span></div>
  <div id="tagIco"><svg viewBox="0 0 64 24"><rect x="2" y="4" width="16" height="16" rx="3" class="ice"/><path d="M24 12h14M33 7l5 5-5 5" class="ar"/><rect x="46" y="9" width="10" height="10" rx="2" class="ice"/><path d="M50 21c0 1.5 2 1.5 2 0" class="ar"/></svg></div>
  <button id="bPlay" class="big" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
  <div class="row"><button class="ib" id="bLevels" aria-label="Levels"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
  <button class="ib" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button></div>
  <div id="loadBar"><div id="loadFill"></div></div>
</div>
<div id="levels" class="scr hide"><div class="head"><button class="ib" id="bLvBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div id="starTot"></div></div><div id="grid"></div></div>
<div id="pause" class="scr hide"><div class="card">
  <div class="row"><button class="ib big2" id="bResume" aria-label="Resume"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
  <button class="ib big2" id="bRestart" aria-label="Restart level"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5"/><path d="M4 4v4h4"/></svg></button>
  <button class="ib big2" id="bToLv" aria-label="Levels"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button></div>
  <div id="setRows"></div>
</div></div>
<div id="settings" class="scr hide"><div class="card"><div id="setRows2"></div><div class="row"><button class="ib big2" id="bSetBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></div></div></div>
<div id="result" class="scr hide"><div class="card">
  <div id="rTitle"></div>
  <div id="stars"><i class="st"></i><i class="st"></i><i class="st"></i></div>
  <div id="rStats"></div>
  <div class="row"><button class="ib big2" id="bRetry" aria-label="Play again"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5"/><path d="M4 4v4h4"/></svg></button>
  <button class="ib big2" id="bRLv" aria-label="Levels"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
  <button class="ib big2 go" id="bNext" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button></div>
</div></div>

<script>
"use strict";
// ===== util.js =====
{
const MD = window.MD = { t: 0, ready: false, events: {}, tex: {}, glb: {} };
MD.$ = (id) => document.getElementById(id);
MD.Q = new URLSearchParams(location.search);
MD.TEST = MD.Q.has('test');
MD.TILE = MD.Q.has('tile');
MD.ASSETS = MD.Q.get('assets') || 'meltdown/assets/';
MD.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
MD.lerp = (a, b, t) => a + (b - a) * t;
MD.smooth = (a, b, v) => { const t = MD.clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
MD.damp = (a, b, k, dt) => b + (a - b) * Math.exp(-k * dt);
MD.rand = (a = 0, b = 1) => a + Math.random() * (b - a);
MD.rng = (seed) => { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e6) / 1e6; }; };
MD.isPhone = () => Math.min(screen.width, screen.height) < 600 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 600);
MD.touch = () => matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
MD.reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
MD.on = (n, f) => (MD.events[n] = MD.events[n] || []).push(f);
MD.emit = (n, a) => (MD.events[n] || []).forEach((f) => { try { f(a); } catch (e) { console.warn(e); } });
MD.store = {
get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
del(k) { try { localStorage.removeItem(k); } catch (e) { /* private mode */ } },
};
MD.v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
MD.tmp = { a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3(), d: new THREE.Vector3(), q: new THREE.Quaternion(), m: new THREE.Matrix4(), e: new THREE.Euler() };
MD.col = (hex) => new THREE.Color(hex);
MD.canvasTex = (w, h, draw, srgb = true, rep) => {
const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
return t;
};
MD.fmtTime = (s) => { if (s == null || !isFinite(s)) return '--:--'; const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); };
MD.useF = /^en-US$/i.test(navigator.language || '') && !MD.TEST;
MD.fmtTemp = (c) => MD.useF ? Math.round(c * 1.8 + 32) + '°' : Math.round(c) + '°';
MD.shadows = (o, cast = true, recv = true) => { o.traverse((c) => { if (c.isMesh) { c.castShadow = cast; c.receiveShadow = recv; } }); return o; };
MD.dispose = (o) => {
o.traverse((c) => {
if (c.geometry && !c.geometry.userData.keep) c.geometry.dispose();
const ms = c.material ? (Array.isArray(c.material) ? c.material : [c.material]) : [];
for (const m of ms) if (m && !m.userData.keep) m.dispose();
});
};
}
// ===== save.js =====
{
const S = MD.Save = {};
const KEY = 'meltdown.v1', SKEY = 'meltdown.settings';
S.fresh = () => ({ v: 1, lv: {}, seen: {} });
S.init = () => {
if (MD.Q.has('reset')) { MD.store.del(KEY); MD.store.del(SKEY); }
const d = MD.store.get(KEY, null);
S.d = d && d.v === 1 && typeof d.lv === 'object' ? Object.assign(S.fresh(), d) : S.fresh();
const st = MD.store.get(SKEY, {}) || {};
S.settings = Object.assign({ vol: 0.8, mute: false, music: true, q: null, shake: MD.reduced() ? 0 : 1 }, st);
};
S.write = () => MD.store.set(KEY, S.d);
S.writeSettings = () => MD.store.set(SKEY, S.settings);
S.rec = (i) => S.d.lv[i] || null;
S.stars = (i) => (S.d.lv[i] && S.d.lv[i].stars) || 0;
S.total = () => Object.keys(S.d.lv).reduce((a, k) => a + (S.d.lv[k].stars || 0), 0);
S.unlocked = (i) => i === 0 || !!S.d.lv[i - 1] || MD.Q.has('unlock');
S.finish = (i, time, size, stars) => {
const o = S.d.lv[i] || { stars: 0, time: null, size: 0, plays: 0 };
const best = { stars: stars > o.stars, time: o.time == null || time < o.time, size: size > o.size };
o.stars = Math.max(o.stars, stars); o.time = o.time == null ? time : Math.min(o.time, time); o.size = Math.max(o.size, size);
o.plays = (o.plays || 0) + 1; S.d.lv[i] = o; S.write();
return best;
};
S.seen = (k) => !!S.d.seen[k];
S.see = (k) => { S.d.seen[k] = 1; S.write(); };
}
// ===== render.js =====
{
const R = MD.R = { q: 1, frameMs: [] };
R.PRESETS = [
{ dpr: 0.7, shadow: 1024, soft: false, post: false, parts: 0.5, bubbles: 10, shadowR: 16, lights: 1, env: false, msaa: 0 },
{ dpr: 0.75, shadow: 1024, soft: false, post: true, parts: 0.8, bubbles: 16, shadowR: 20, lights: 2, env: false, msaa: 2 },
{ dpr: 2.0, shadow: 2048, soft: true, post: true, parts: 1, bubbles: 22, shadowR: 24, lights: 4, env: true, msaa: 4 },
];
R.NPL = 4;
R.init = () => {
const canvas = MD.$('gl');
try {
R.renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: MD.TEST || MD.TILE });
} catch (e) { return false; }
const r = R.renderer;
r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
try { const gl = r.getContext(), d = gl.getExtension('WEBGL_debug_renderer_info'); R.gpu = d ? String(gl.getParameter(d.UNMASKED_RENDERER_WEBGL)) : ''; } catch (e) { R.gpu = ''; }
R.soft = /swiftshader|llvmpipe|software/i.test(R.gpu);
R.scene = new THREE.Scene();
R.scene.fog = new THREE.Fog(0xdde6ee, 60, 220);
R.cam = new THREE.PerspectiveCamera(55, 1, 0.05, 900);
R.hemi = new THREE.HemisphereLight(0xeaf2ff, 0x806a55, 0.55); R.scene.add(R.hemi);
R.sun = new THREE.DirectionalLight(0xfff0dd, 1.6); R.sun.castShadow = true;
R.sun.shadow.bias = -0.0006; R.sun.shadow.normalBias = 0.03; R.sun.shadow.radius = 4;
R.scene.add(R.sun); R.scene.add(R.sun.target);
R.sunDir = MD.v3(0.35, 0.85, 0.4).normalize();
R.pl = [];
for (let i = 0; i < R.NPL; i++) { const l = new THREE.PointLight(0xff8844, 0, 12, 2); l.position.set(0, -50, 0); R.scene.add(l); R.pl.push(l); }
R.pmrem = new THREE.PMREMGenerator(r);
R.cubeRT = new THREE.WebGLCubeRenderTarget(128, { format: THREE.RGBFormat, generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
R.cubeRT.texture.encoding = THREE.sRGBEncoding;
R.cubeCam = new THREE.CubeCamera(0.1, 400, R.cubeRT);
R.q = R.autoQuality();
const s = MD.Save.settings.q;
if (s != null && !MD.TEST) R.q = s;
R.applyQuality(R.q, true);
R.resize(); addEventListener('resize', R.resize);
return true;
};
R.autoQuality = () => {
if (R.soft || MD.isPhone()) return 0;
if (/rtx|radeon rx|geforce gtx 1[06-9]|arc a/i.test(R.gpu)) return 2;
return 1;
};
R.preset = () => R.PRESETS[R.q];
R.applyQuality = (q, first) => {
R.q = MD.clamp(q | 0, 0, 2); const p = R.preset();
R.renderer.shadowMap.type = p.soft ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
R.sun.shadow.mapSize.set(p.shadow, p.shadow);
if (R.sun.shadow.map) { R.sun.shadow.map.dispose(); R.sun.shadow.map = null; }
const sc = R.sun.shadow.camera, sr = p.shadowR; sc.left = -sr; sc.right = sr; sc.top = sr; sc.bottom = -sr; sc.near = 1; sc.far = 220; sc.updateProjectionMatrix();
R.renderer.shadowMap.needsUpdate = true;
R.pl.forEach((l, i) => (l.visible = i < p.lights));
if (MD.Post && MD.Post.rt && MD.Post.rt.isWebGLMultisampleRenderTarget) MD.Post.rt.samples = p.msaa;
R.applyEnv();
R.resize();
if (!first) { R.scene.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => (m.needsUpdate = true)); }); MD.emit('quality', R.q); }
};
R.dpr = () => Math.min(window.devicePixelRatio || 1, R.preset().dpr, MD.isPhone() ? 1.5 : 3);
R.resize = () => {
const w = innerWidth, h = innerHeight; R.w = w; R.h = h; if (!R.renderer) return;
R.renderer.setPixelRatio(R.dpr()); R.renderer.setSize(w, h, false);
R.cam.aspect = w / h; R.cam.fov = w < h ? 68 : 55; R.cam.updateProjectionMatrix();
if (MD.Post) MD.Post.resize();
};
R.followSun = (p) => {
const s = R.preset().shadowR, texel = (2 * s) / R.sun.shadow.mapSize.x, c = MD.tmp.c.copy(p);
c.x = Math.round(c.x / texel) * texel; c.z = Math.round(c.z / texel) * texel; c.y = Math.round(c.y / texel) * texel;
R.sun.position.copy(c).addScaledVector(R.sunDir, 90); R.sun.target.position.copy(c); R.sun.target.updateMatrixWorld();
};
R.capture = (at) => {
const hide = []; R.scene.traverse((o) => { if (o.userData.noEnv && o.visible) { o.visible = false; hide.push(o); } });
R.cubeCam.position.copy(at); R.cubeRT.texture.mapping = THREE.CubeReflectionMapping;
R.cubeCam.update(R.renderer, R.scene);
if (R.envRT) R.envRT.dispose();
R.envRT = R.pmrem.fromCubemap(R.cubeRT.texture);
R.cubeRT.texture.mapping = THREE.CubeRefractionMapping;
for (const o of hide) o.visible = true;
R.applyEnv();
};
R.applyEnv = () => {
if (!R.envRT || !R.scene) return;
const all = R.preset().env, tex = R.envRT.texture;
R.scene.environment = all ? tex : null;
R.hemi.intensity = (R.hemiBase || 0.3) + (all ? 0 : 0.32);
R.scene.traverse((o) => {
if (!o.material) return;
for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
if (!m.isMeshStandardMaterial) continue;
const want = all ? null : (m.metalness >= 0.5 || m.transparent || m.userData.env) ? tex : null;
if (m.envMap !== want) { m.envMap = want; m.needsUpdate = true; }
}
});
};
R.render = () => {
R.fc = (R.fc || 0) + 1; R.renderer.shadowMap.autoUpdate = R.q >= 2 || R.fc % 2 === 0 || R.shadowNow; R.shadowNow = false;
if (MD.Heat && MD.Heat.on) return MD.Heat.render();
if (MD.Post && MD.Post.active()) MD.Post.render(); else R.renderer.render(R.scene, R.cam);
};
R.watch = (ms) => {
if (MD.TEST || R.locked || MD.Q.has('perf') || !MD.Game || !MD.Game.playing()) return;
R.frameMs.push(ms); if (R.frameMs.length < 120) return;
const a = R.frameMs.slice().sort((x, y) => x - y)[60]; R.frameMs = [];
R.checks = (R.checks || 0) + 1;
if (a > 22 && R.q > 0 && MD.Save.settings.q == null) R.applyQuality(R.q - 1);
if (R.checks >= 5) R.locked = true;
};
}
// ===== post.js =====
{
const P = MD.Post = { spots: [], hot: 0, cold: 0, danger: 0, global: 0 };
const NS = 8;
P.init = () => {
const r = MD.R.renderer, gl2 = r.capabilities.isWebGL2;
const opts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, encoding: THREE.sRGBEncoding };
P.rt = gl2 ? new THREE.WebGLMultisampleRenderTarget(4, 4, opts) : new THREE.WebGLRenderTarget(4, 4, opts);
if (gl2) P.rt.samples = MD.R.preset().msaa;
const spots = []; for (let i = 0; i < NS; i++) spots.push(new THREE.Vector4(0, 0, 0, 0));
P.mat = new THREE.ShaderMaterial({
uniforms: { tDiffuse: { value: P.rt.texture }, uTime: { value: 0 }, uSpots: { value: spots }, uAspect: { value: 1 },
uHot: { value: 0 }, uCold: { value: 0 }, uDanger: { value: 0 }, uGlobal: { value: 0 } },
vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
fragmentShader: `
uniform sampler2D tDiffuse; uniform float uTime, uAspect, uHot, uCold, uDanger, uGlobal; uniform vec4 uSpots[${NS}];
varying vec2 vUv;
float h21(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
void main(){
float m = uGlobal * smoothstep(0.62, 0.05, vUv.y) * 0.6;
for (int i = 0; i < ${NS}; i++) {
vec4 s = uSpots[i]; if (s.w <= 0.0) continue;
vec2 d = vUv - s.xy; d.x *= uAspect; d.y -= s.z * 0.9;
float e = (d.x*d.x) / (s.z*s.z*0.55) + (d.y*d.y) / (s.z*s.z*2.4);
m += s.w * exp(-e);
}
m = min(m, 1.4);
vec2 q = vUv * vec2(uAspect, 1.0) * 26.0 + vec2(0.0, -uTime * 3.2);
vec2 off = vec2(vn(q) - 0.5, vn(q + 17.3) - 0.5) * 0.009 * m;
vec4 c = texture2D(tDiffuse, vUv + off);
c.rgb += vec3(0.05, 0.02, 0.0) * m;
vec2 v = vUv - 0.5; float vig = dot(v, v);
float edge = smoothstep(0.12, 0.5, vig);
c.rgb = mix(c.rgb, c.rgb * vec3(1.12, 0.92, 0.75) + vec3(0.08, 0.02, 0.0), edge * uHot);
float fr = vn(vUv * vec2(uAspect, 1.0) * 9.0) * 0.6 + vn(vUv * vec2(uAspect, 1.0) * 31.0) * 0.4;
float frost = smoothstep(0.55, 0.2, (0.5 - vig) + fr * 0.35 - uCold * 0.35) * uCold;
c.rgb = mix(c.rgb, vec3(0.86, 0.95, 1.0), frost * 0.75);
float pulse = 0.65 + 0.35 * sin(uTime * 7.0);
c.rgb = mix(c.rgb, vec3(0.9, 0.12, 0.08), edge * uDanger * pulse * 0.55);
c.rgb *= 1.0 - vig * 0.35;

}`,
depthTest: false, depthWrite: false,

P.scene = new THREE.Scene(); P.scene.add(P.quad); P.cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
P.resize();
};
P.active = () => MD.R.preset().post && !MD.R.soft;
P.resize = () => {
if (!P.rt) return; const r = MD.R.renderer, s = new THREE.Vector2(); r.getDrawingBufferSize(s);
P.rt.setSize(s.x, s.y); P.mat.uniforms.uAspect.value = s.x / Math.max(1, s.y);
};
const pv = new THREE.Vector3();
P.update = (dt) => {
const u = P.mat ? P.mat.uniforms : null; if (!u) return;
u.uTime.value += dt;
const cam = MD.R.cam, list = MD.T ? MD.T.shimmer(cam.position) : [];

const v = u.uSpots.value[i], s = list[i];
if (!s) { v.w = 0; continue; }
pv.copy(s.p); pv.y += s.r * 0.25; pv.project(cam);

if (pv.z > 1 || Math.abs(pv.x) > 1.6 || Math.abs(pv.y) > 1.6) { v.w = 0; continue; }

}

u.uDanger.value = MD.damp(u.uDanger.value, P.danger, 4, dt); u.uGlobal.value = P.global;
};

const r = MD.R.renderer;
r.setRenderTarget(P.rt); r.render(MD.R.scene, MD.R.cam);
r.setRenderTarget(null); r.render(P.scene, P.cam);
};
}
// ===== tex.js =====
{
const X = MD.Tex = { n: 0, done: 0 };
X.PBR = ['wood_floor', 'rounded_square_tiled_wall', 'concrete_pavement', 'asphalt_02', 'snow_02', 'leafy_grass', 'weathered_plank_siding',
'painted_plaster_wall', 'poly_wool_herringbone', 'marble_01', 'dark_wooden_planks'];
X.SKY = ['kloofendal_43d_clear_puresky', 'kloofendal_overcast_puresky', 'kloofendal_48d_partly_cloudy_puresky'];
X.GLB = ['hydrant', 'teaset', 'cake', 'plant', 'bench'];
const tick = () => { X.done++; MD.emit('progress', X.done / Math.max(1, X.n)); };
const loadTex = (url, srgb) => new Promise((res) => {
X.n++;
new THREE.TextureLoader().load(url, (t) => { if (srgb) t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; tick(); res(t); },
undefined, () => { tick(); res(null); });
});
const loadGlb = (url) => new Promise((res) => {
if (!THREE.GLTFLoader) return res(null);
X.n++;
new THREE.GLTFLoader().load(url, (g) => { tick(); res(g.scene); }, undefined, () => { tick(); res(null); });
});
X.all = async () => {
const A = MD.ASSETS, jobs = [];
for (const n of X.PBR) {
MD.tex[n] = {};

jobs.push(loadTex(A + 'tex_' + n + '_nor.jpg', false).then((t) => (MD.tex[n].normalMap = t)));
jobs.push(loadTex(A + 'tex_' + n + '_rough.jpg', false).then((t) => (MD.tex[n].roughnessMap = t)));
}
for (const s of X.SKY) jobs.push(loadTex(A + 'sky_' + s + '.jpg', true).then((t) => { if (t) { t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping; } MD.tex['sky_' + s] = t; }));
for (const g of X.GLB) jobs.push(loadGlb(A + g + '.glb').then((m) => (MD.glb[g] = m)));
await Promise.all(jobs);
X.paint();
};
X.paint = () => {
const T = MD.tex;
T.check = MD.canvasTex(256, 256, (g, w) => {
g.fillStyle = '#f7f1e6'; g.fillRect(0, 0, w, w); g.fillStyle = 'rgba(214,52,58,0.88)';
for (let i = 0; i < 4; i++) { g.fillRect(i * 64, 0, 32, w); g.fillRect(0, i * 64, w, 32); }
g.fillStyle = 'rgba(170,30,40,0.5)'; for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) g.fillRect(i * 64, j * 64, 32, 32);
g.globalAlpha = 0.08; for (let i = 0; i < 3000; i++) { g.fillStyle = Math.random() < 0.5 ? '#000' : '#fff'; g.fillRect(Math.random() * w, Math.random() * w, 1, 1); }
}, true, true);
T.toast = MD.canvasTex(128, 128, (g, w) => {
g.fillStyle = '#8a4a1c'; g.beginPath(); g.roundRect ? g.roundRect(0, 0, w, w, 26) : g.rect(0, 0, w, w); g.fill();
const gr = g.createRadialGradient(64, 70, 10, 64, 70, 60); gr.addColorStop(0, '#e9b765'); gr.addColorStop(1, '#c78435');
g.fillStyle = gr; g.fillRect(10, 12, w - 20, w - 22);
for (let i = 0; i < 260; i++) { g.fillStyle = 'rgba(120,60,20,' + Math.random() * 0.35 + ')'; g.beginPath(); g.arc(12 + Math.random() * 104, 14 + Math.random() * 100, Math.random() * 2.4, 0, 7); g.fill(); }
});
T.flake = MD.canvasTex(128, 128, (g, w) => {
g.fillStyle = '#2f8fe0'; g.fillRect(0, 0, w, w); g.strokeStyle = '#eaf8ff'; g.lineWidth = 7; g.lineCap = 'round';
g.translate(64, 64);
for (let i = 0; i < 6; i++) { g.rotate(Math.PI / 3); g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -40); g.moveTo(0, -24); g.lineTo(-11, -34); g.moveTo(0, -24); g.lineTo(11, -34); g.stroke(); }
});
T.stripes = MD.canvasTex(128, 32, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#fdf6ea' : '#e2483f'; g.fillRect(i * 16, 0, 16, h); } }, true, true);
T.stripesB = MD.canvasTex(128, 32, (g, w, h) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#f4fbff' : '#2f86c9'; g.fillRect(i * 16, 0, 16, h); } }, true, true);

MD.Input.bot = null; MD.Input.mx = MD.Input.mz = 0;
const p = P();
return { state: G.state, why: G.why || null, time: +G.time.toFixed(2), size: +(p.form === 'cube' ? p.s : 0).toFixed(3), form: p.form, stars: G.result ? G.result.stars : 0,
pos: [p.b.p.x, p.b.p.y, p.b.p.z].map((v) => +v.toFixed(2)), step: bot.idx(), of: (o.route || G.lv.route).length, log: bot.log };
};
D.sim = (sec) => { const G = MD.Game, n = Math.round(sec / G.DT); for (let i = 0; i < n && G.state === 'play'; i++) { MD.Input.update(); G.step(G.DT); } };
D.state = () => { const p = P(), b = p.b; return { s: p.s, form: p.form, env: p.env, tp: p.tp, life: p.life, pos: [b.p.x, b.p.y, b.p.z], g: b.grounded, state: MD.Game.state, lv: MD.Game.i, time: MD.Game.time }; };
D.put = (x, y, z, s) => { const p = P(); p.spawn(MD.v3(x, y, z), s == null ? p.s : s); MD.Cam.snap = true; if (MD.Game.state === 'failed' || MD.Game.state === 'done') { MD.Game.state = 'play'; MD.UI.show(null); } };
D.temp = (x, y, z) => MD.T.sample(MD.v3(x, y, z));
D.hold = (mx, mz, sec) => { MD.Input.bot = () => { MD.Input.mx = mx; MD.Input.mz = mz; }; D.sim(sec); MD.Input.bot = null; };
D.pose = (x, y, z, s, yaw, pitch, dist) => {
D.put(x, y, z, s); const C = MD.Cam; if (yaw != null) { C.home = yaw; C.off = 0; } if (pitch != null) C.pitch = pitch; if (dist != null) C.base = dist; C.snap = true;
};
D.perf = (li, sec = 6, sync = false) => new Promise((res) => {
const G = MD.Game; G.load(li); MD.UI.show(null); MD.Input.bot = D.bot(G.lv.route);
const gl = MD.R.renderer.getContext(), px = new Uint8Array(4), iv = [], work = [], orig = MD.frame;
let t0 = performance.now(), last = 0;
MD.frame = (dt) => { const a = performance.now(); orig(dt); if (sync) gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); work.push(performance.now() - a); if (last) iv.push(a - last); last = a; };
const end = () => {
MD.frame = orig; MD.Input.bot = null;
const q = (arr, p) => { const s = arr.slice().sort((x, y) => x - y); return +s[Math.min(s.length - 1, Math.floor(s.length * p))].toFixed(2); };
res({ lv: li, frames: iv.length, fps: +(1000 * iv.length / (performance.now() - t0)).toFixed(1), int50: q(iv, 0.5), int95: q(iv, 0.95), work50: q(work, 0.5), work95: q(work, 0.95), q: MD.R.q, px: MD.R.renderer.getDrawingBufferSize(new THREE.Vector2()).toArray() });
};
setTimeout(end, sec * 1000);
});
}
// ===== main.js =====
{
MD.boot = async () => {
MD.Save.init();
if (MD.Q.get('hud') === '0') document.body.classList.add('nohud');
if (!MD.R.init()) { MD.$('nogl').classList.remove('hide'); MD.$('title').classList.add('hide'); return; }
MD.on('progress', (f) => MD.UI.progress(f));
MD.Post.init(); MD.Heat.init();
await MD.Tex.all();
MD.M.init(); MD.W.clear(); MD.FX.init(); MD.Cube.init(); MD.Player.init();
MD.Input.init(); MD.Audio.init(); MD.HUD.init(); MD.UI.init();
MD.$('loadBar').classList.add('hide');
MD.Game.preview(0);
try { MD.R.renderer.compile(MD.R.scene, MD.R.cam); } catch (e) { /* fine */ }
MD.ready = true; window.MELTDOWN = true; MD.emit('ready');
requestAnimationFrame(MD.loop);
};
MD.Game.preview = (i) => {
const G = MD.Game; G.load(i); G.state = 'menu'; MD.Player.b.v.set(0, 0, 0);
};
let last = 0;
MD.loop = (now) => {
requestAnimationFrame(MD.loop);
const raw = last ? (now - last) / 1000 : 0.016; last = now;
const dt = Math.min(0.05, Math.max(0.001, raw)); MD.dt = dt; MD.t += dt;
try { MD.frame(dt); } catch (e) { if (!MD._err) { MD._err = true; console.error(e); } }
MD.R.watch(raw * 1000);
MD.frameMs = raw * 1000;
};
MD.frame = (dt) => {
const menu = MD.Game.state === 'menu' && MD.Game.lv;
if (menu) MD.Cam.home += dt * 0.12;
MD.Game.frame(dt);
if (menu) { MD.W.frame(dt, MD.t); MD.Cube.update(dt, MD.t); }
MD.Audio.update(dt);
MD.R.render();
};
if (window.THREE) MD.boot(); else addEventListener('load', () => (window.THREE ? MD.boot() : MD.$('nogl').classList.remove('hide')));
}
