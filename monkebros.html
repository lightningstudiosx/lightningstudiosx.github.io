const VW = 400, VH = 224, TS = 16, ROWS = 14;

// ===================================================================================== pixel sprites
// Sprites are painted pixel by pixel from simple shapes, then given a dark outline: a 16-bit look without image files.
function sprite(w, h, paint, outline = '#1b0f0b') {
  const grid = new Array(w * h).fill(null);
  const A = {
    px(x, y, c) { x = Math.floor(x); y = Math.floor(y); if (x >= 0 && y >= 0 && x < w && y < h) grid[y * w + x] = c; },
    rect(x, y, ww, hh, c) { for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) A.px(x + i, y + j, c); },
    ell(cx, cy, rx, ry, c) { for (let y = Math.floor(cy - ry - 1); y <= cy + ry; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx; x++) { const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) A.px(x, y, c); } },
    line(x0, y0, x1, y1, c) { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0; for (let i = 0; i <= n; i++) A.px(x0 + (x1 - x0) * i / (n || 1), y0 + (y1 - y0) * i / (n || 1), c); },
  };
  paint(A);
  let g = grid;
  if (outline) { g = grid.slice(); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { if (grid[y * w + x]) continue; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < w && Y < h && grid[Y * w + X]) { g[y * w + x] = outline; break; } } } }
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  for (let i = 0; i < g.length; i++) if (g[i]) { x.fillStyle = g[i]; x.fillRect(i % w, (i / w) | 0, 1, 1); }
  return c;
}
// ---- the Monke brothers: Bongo (green bandana) and Bingo (blue bandana)
const PALS = [
  { fur: '#8a4b22', furD: '#5e2f12', furL: '#b06a34', face: '#f2c79a', faceD: '#cf9a6a', band: '#3fb84a', bandD: '#257a2e' },
  { fur: '#6b5a52', furD: '#43362f', furL: '#8f7b70', face: '#f0d2b0', faceD: '#c9a07c', band: '#3a8ef0', bandD: '#2258a8' },
];
const FIREPAL = p => Object.assign({}, p, { band: '#ff8a1e', bandD: '#c4520c', belly: '#fff6e0' });
function monke(big, frame, P) {
  const h = big ? 24 : 16;
  return sprite(16, h, A => {
    const s = big ? 1.35 : 1, by = big ? 8 : 0;           // body offset for the big form
    const legY = h - 3, belly = P.belly || P.face;
    // tail
    if (frame !== 5) { A.px(3, by + 10, P.furD); A.px(2, by + 9, P.furD); A.px(1, by + 8, P.furD); A.px(1, by + 7, P.furD); A.px(2, by + 6, P.furD); }
    // legs
    const legs = { 0: [[5, 0], [9, 0]], 1: [[4, -1], [10, 0]], 2: [[6, 0], [8, -1]], 3: [[4, -2], [10, 0]], 4: [[3, 0], [9, 0]], 5: [[4, 0], [10, 0]], 6: [[5, 0], [9, 0]] }[frame];
    for (const [lx, ly] of legs) A.rect(lx, legY + ly, 3, big ? 3 : 2, P.furD);
    // body
    if (frame === 6 && big) { A.ell(8, h - 6, 6, 4, P.fur); A.ell(9, h - 6, 3.5, 2.5, belly); }
    else { A.ell(8, big ? 17 : 11, 4.2 * s, 3.4 * s, P.fur); A.ell(9, big ? 17.5 : 11.5, 2.4 * s, 2.2 * s, belly); }
    // arms
    const ay = big ? 14 : 9;
    if (frame === 3) A.rect(12, ay - 4, 2, 4, P.fur);
    else if (frame === 1) A.rect(11, ay + 1, 2, 3, P.fur);
    else if (frame === 2) A.rect(4, ay + 1, 2, 3, P.fur);
    else if (frame === 4) A.rect(12, ay, 3, 2, P.fur);
    else if (frame !== 6) A.rect(11, ay + 1, 2, 2, P.fur);
    if (frame === 6 && big) return headAt(A, P, 8.5, h - 12, 0);
    headAt(A, P, 8.5, big ? 8.5 : 5.5, frame === 5 ? 1 : 0);
  });
}
function headAt(A, P, cx, cy, dead) {
  A.ell(cx - 4.5, cy, 1.9, 2.1, P.fur); A.px(cx - 4.5, cy, P.faceD);                      // ear
  A.ell(cx, cy, 4.6, 4.4, P.fur);
  A.ell(cx + 1.3, cy + 1, 3.2, 2.9, P.face);
  A.rect(cx - 4, cy - 4, 8, 2, P.band); A.px(cx - 5, cy - 3, P.bandD); A.px(cx - 6, cy - 2, P.band); A.px(cx - 6, cy - 1, P.bandD);
  if (dead) { A.px(cx + 1, cy, '#1b0f0b'); A.px(cx + 3, cy, '#1b0f0b'); A.px(cx + 2, cy + 1, '#1b0f0b'); A.px(cx + 2, cy + 3, '#7a2a1a'); }
  else { A.px(cx + 1.5, cy, '#1b0f0b'); A.px(cx + 3.5, cy, '#1b0f0b'); A.px(cx + 1.5, cy - 1, '#fff'); A.px(cx + 2.5, cy + 2.5, P.faceD); A.px(cx + 3.5, cy + 2.5, P.faceD); }
}
const SPR = { mk: [] };
function buildMonkeSprites() {
  for (let p = 0; p < 2; p++) {
    SPR.mk[p] = {};
    for (const [form, pal] of [[0, PALS[p]], [1, PALS[p]], [2, FIREPAL(PALS[p])]]) {
      SPR.mk[p][form] = []; for (let f = 0; f < 7; f++) SPR.mk[p][form][f] = monke(form > 0, f, pal);
    }
  }
}
buildMonkeSprites();
// ---- enemies and things
SPR.crab = [0, 1].map(f => sprite(16, 16, A => { A.ell(2, 8, 2, 2.2, '#e8553f'); A.ell(14, 8, 2, 2.2, '#e8553f'); A.px(1, 7, '#ffd0c0'); A.px(15, 7, '#ffd0c0'); A.rect(5, 4, 1, 4, '#c43a28'); A.rect(10, 4, 1, 4, '#c43a28'); A.ell(5.5, 3.5, 1.5, 1.5, '#fff'); A.ell(10.5, 3.5, 1.5, 1.5, '#fff'); A.px(6, 3, '#1b0f0b'); A.px(11, 3, '#1b0f0b'); A.ell(8, 10, 6, 3.6, '#d8432f'); A.ell(8, 11.5, 5, 2, '#a52d1f'); for (let i = 0; i < 3; i++) { A.px(4 + i * 3 + f, 14, '#a52d1f'); A.px(5 + i * 3 - f, 15, '#a52d1f'); } }));
SPR.crabFlat = sprite(16, 16, A => { A.ell(8, 13.5, 7, 2, '#d8432f'); A.px(5, 13, '#fff'); A.px(10, 13, '#fff'); });
SPR.arm = [0, 1].map(f => sprite(16, 16, A => { A.ell(13, 11, 2.6, 2.2, '#c9a988'); A.px(14, 10, '#1b0f0b'); A.ell(7.5, 9.5, 6.5, 5, '#8c7a62'); for (const x of [4, 7, 10]) A.line(x, 5, x, 13, '#6c5a44'); A.ell(6, 7, 2, 1.2, '#b3a084'); A.rect(3 + f, 13, 2, 2, '#6c5a44'); A.rect(9 - f, 13, 2, 2, '#6c5a44'); }));
SPR.armBall = sprite(16, 16, A => { A.ell(8, 9, 6.2, 6, '#8c7a62'); for (const x of [5, 8, 11]) A.line(x, 4, x, 14, '#6c5a44'); A.ell(6, 6, 2, 1.2, '#b3a084'); });
SPR.parrot = [0, 1].map(f => sprite(16, 16, A => { A.ell(7, 10, 4, 4.5, '#2fae4f'); A.rect(3, 13, 2, 2, '#e8402e'); A.ell(10, 5, 3.2, 3, '#e8402e'); A.px(13, 5, '#f6c23a'); A.px(13, 6, '#f6c23a'); A.px(14, 6, '#f6c23a'); A.px(11, 4, '#fff'); A.px(11, 5, '#1b0f0b'); if (f) A.ell(5, 6, 3.5, 2, '#1d7d37'); else A.ell(5, 12, 3.5, 2, '#1d7d37'); }));
SPR.hog = [0, 1].map(f => sprite(16, 16, A => { for (let x = 3; x <= 12; x += 2) { A.px(x, 5, '#efe6d2'); A.px(x + 1, 6, '#efe6d2'); A.px(x, 7, '#efe6d2'); } A.ell(8, 11, 6.3, 4, '#7a5a3a'); A.ell(14, 12, 1.8, 1.5, '#d79c7d'); A.px(12, 10, '#1b0f0b'); A.rect(4 + f, 14, 2, 1, '#4a321c'); A.rect(10 - f, 14, 2, 1, '#4a321c'); }));
SPR.bat = [0, 1, 2].map(f => sprite(16, 16, A => { if (f === 2) { A.ell(8, 8, 3, 5, '#5a3a7a'); A.px(7, 7, '#ff3a3a'); A.px(9, 7, '#ff3a3a'); return; } A.ell(8, 8, 3, 3, '#5a3a7a'); if (f) { A.ell(3, 6, 3, 1.6, '#432a5c'); A.ell(13, 6, 3, 1.6, '#432a5c'); } else { A.ell(3, 10, 3, 1.6, '#432a5c'); A.ell(13, 10, 3, 1.6, '#432a5c'); } A.px(7, 7, '#ff3a3a'); A.px(9, 7, '#ff3a3a'); A.px(6, 5, '#5a3a7a'); A.px(10, 5, '#5a3a7a'); }));
SPR.bullet = sprite(16, 16, A => { A.ell(8, 8, 6, 5, '#5a3a22'); A.ell(6, 6, 2, 1.4, '#7c5634'); A.px(9, 7, '#fff'); A.px(11, 7, '#fff'); A.px(10, 8, '#1b0f0b'); A.px(12, 8, '#1b0f0b'); A.line(9, 6, 11, 7, '#1b0f0b'); });
SPR.crusher = sprite(24, 24, A => { A.rect(1, 1, 22, 22, '#7c7f8c'); A.rect(2, 2, 20, 3, '#9fa3b2'); A.rect(5, 8, 5, 4, '#fff'); A.rect(14, 8, 5, 4, '#fff'); A.rect(7, 9, 2, 3, '#1b0f0b'); A.rect(15, 9, 2, 3, '#1b0f0b'); A.line(4, 7, 10, 8, '#1b0f0b'); A.line(20, 7, 14, 8, '#1b0f0b'); A.rect(7, 16, 10, 3, '#1b0f0b'); for (let x = 8; x < 17; x += 2) A.px(x, 16, '#fff'); for (const [x, y] of [[2, 2], [21, 2], [2, 21], [21, 21]]) A.px(x, y, '#c8ccd8'); });
SPR.krok = [0, 1, 2].map(f => sprite(36, 32, A => {
  A.ell(7, 24, 6, 3, '#2f6f2c'); A.ell(3, 22, 3, 2, '#2f6f2c');                                    // tail
  A.ell(16, 20, 11, 9, '#3f8f3a'); A.ell(18, 22, 7, 6, '#d6e0a0');
  for (let i = 0; i < 4; i++) A.px(8 + i * 4, 11, '#2f6f2c');
  A.rect(10 + (f === 1 ? 2 : 0), 28, 5, 3, '#2f6f2c'); A.rect(20 - (f === 1 ? 2 : 0), 28, 5, 3, '#2f6f2c');
  A.ell(24, 11, 8, 6, '#4aa244'); A.rect(26, 11 - (f === 2 ? 2 : 0), 9, 4, '#4aa244'); A.rect(26, 15, 9, 3, '#3f8f3a');
  for (let x = 27; x < 35; x += 2) { A.px(x, 14, '#fff'); A.px(x + 1, 15, '#fff'); }
  A.ell(25, 7, 2.4, 2.4, '#fff'); A.px(26, 7, '#c4141a'); A.px(26, 8, '#1b0f0b'); A.line(22, 4, 27, 5, '#1b0f0b');
  A.rect(18, 1, 11, 3, '#f6c23a'); for (const x of [18, 23, 28]) { A.px(x, 0, '#f6c23a'); } A.px(23, 2, '#e8402e');
  A.ell(29, 22, 2.5, 2, '#4aa244');
}));
SPR.coin = [0, 1, 2, 3].map(f => sprite(12, 16, A => { const w = [4, 3, 1.5, 3][f]; A.ell(6, 8, w, 6, '#ffd23a'); if (w > 2) { A.ell(6 - w * .3, 7, w * .45, 4, '#fff3a0'); A.px(6, 1, '#7a5a20'); A.px(6, 15, '#7a5a20'); } else A.rect(6, 2, 1, 12, '#c89a1a'); }));
SPR.bigBanana = sprite(16, 16, A => { A.ell(8, 9, 6, 5, '#ffd23a'); A.ell(8, 6, 6, 4.5, null); A.ell(9, 10, 4, 2.4, '#fff3a0'); A.rect(13, 3, 2, 3, '#7a5a20'); A.px(2, 9, '#7a5a20'); A.px(7, 10, '#1b0f0b'); A.px(10, 10, '#1b0f0b'); A.px(8, 12, '#c4520c'); });
SPR.fireNut = sprite(16, 16, A => { A.ell(8, 9, 6, 6, '#7c4a24'); A.ell(6, 7, 2.5, 2, '#a86a3a'); A.px(6, 11, '#3b2210'); A.px(9, 12, '#3b2210'); A.px(10, 10, '#3b2210'); A.ell(8, 2.5, 3, 2.2, '#ff8a1e'); A.ell(8, 2, 1.6, 1.4, '#ffe066'); });
SPR.mango = sprite(16, 16, A => { A.ell(8, 9, 6, 6, '#ff9a2a'); A.ell(10, 11, 3.5, 3.5, '#e8402e'); A.ell(6, 6, 2, 1.6, '#ffd08a'); A.rect(8, 1, 1, 3, '#5a3a1a'); A.ell(11, 2, 2.5, 1.2, '#3fb84a'); A.px(6, 9, '#1b0f0b'); A.px(10, 9, '#1b0f0b'); A.px(8, 11, '#1b0f0b'); });
SPR.rage = [0, 1].map(f => sprite(16, 16, A => { A.ell(8, 9, 6.5, 5.2, f ? '#ff5ad0' : '#ffd23a'); A.ell(8, 5.5, 6, 4, null); A.ell(9, 10, 4, 2.4, '#fff'); A.rect(13, 3, 2, 3, '#7a5a20'); A.px(6, 9, '#1b0f0b'); A.px(10, 9, '#1b0f0b'); A.line(5, 7, 7, 8, '#1b0f0b'); A.line(11, 7, 9, 8, '#1b0f0b'); }));
SPR.shot = [0, 1].map(f => sprite(8, 8, A => { A.ell(4, 4, 3, 3, '#7c4a24'); A.px(3 + f, 3, '#ffb060'); A.px(5 - f, 5, '#3b2210'); }));
SPR.golden = [0, 1].map(f => sprite(20, 20, A => { A.ell(10, 11, 8, 6.5, f ? '#fff07a' : '#ffd23a'); A.ell(10, 6.5, 8, 5.2, null); A.ell(11, 12, 5, 3, '#fffbe0'); A.rect(16, 3, 2, 4, '#a07a20'); A.px(3, 11, '#a07a20'); }), '#3a2a00');
SPR.totem = [0, 1].map(f => sprite(16, 32, A => { A.rect(4, 4, 8, 28, '#8a5a2e'); A.rect(3, 4, 10, 3, '#5e3a1a'); A.rect(5, 10, 2, 2, f ? '#ffe066' : '#1b0f0b'); A.rect(9, 10, 2, 2, f ? '#ffe066' : '#1b0f0b'); A.rect(6, 15, 4, 2, '#5e3a1a'); A.rect(4, 22, 8, 2, '#5e3a1a'); A.ell(8, 2, 5, 2, f ? '#3fb84a' : '#4a7a3a'); }));
SPR.lever = [0, 1].map(f => sprite(16, 16, A => { A.rect(3, 12, 10, 4, '#6c6f7c'); if (f) A.line(8, 12, 13, 5, '#b8b8c0'); else A.line(8, 12, 3, 5, '#b8b8c0'); A.ell(f ? 13 : 3, 4, 2, 2, '#e8402e'); }));
SPR.cloud = sprite(24, 16, A => { for (const [x, y, r] of [[6, 10, 5], [12, 7, 6], [18, 10, 5], [12, 11, 6]]) A.ell(x, y, r, r * .8, '#ffffff'); A.ell(12, 12.5, 8, 2, '#dfe8f5'); A.px(9, 8, '#1b0f0b'); A.px(15, 8, '#1b0f0b'); A.line(9, 11, 15, 11, '#1b0f0b'); A.px(8, 10, '#1b0f0b'); A.px(16, 10, '#1b0f0b'); }, '#9fb0c8');

SPR.flame = [0, 1].map(f => sprite(12, 40, A => { for (let y = 0; y < 40; y += 2) { const w = 3 + Math.sin(y * .5 + f * 2) * 1.5 + y * .05; A.ell(6, 40 - y, w, 2, y < 20 ? '#ff8a1e' : '#ffd23a'); } A.ell(6, 34, 2.5, 6, '#fff3a0'); }, null));

// ===================================================================================== themes, worlds, tiles
const THEMES = {

  cave: { ceil: true, music: 'cave', bg: 'cave' },

const WORLDS = [

// tile art for one world + theme: an atlas of 16x16 canvases

    if (!b.dead && b.x - cam < VW) { drawText("KING KROK", VW - 104, 24, 8, '#ffd23a', 'left'); for (let i = 0; i < b.maxHp; i++) { ctx.fillStyle = i < b.hp ? '#e8402e' : '#3a1a1a'; ctx.fillRect(VW - 104 + i * 10, 36, 8, 6); } } }

  if (introOpts.fromCheckpoint && quip) drawText(quip, VW / 2, 164, 8, '#ffd23a', 'center');

// ===================================================================================== flow
function onKey(code) {
  const confirm = ['Enter', 'Space', 'KeyZ', 'KeyX'].includes(code), up = code === 'ArrowUp' || code === 'KeyW', down = code === 'ArrowDown' || code === 'KeyS', left = code === 'ArrowLeft' || code === 'KeyA', right = code === 'ArrowRight' || code === 'KeyD';
  if (code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : .55; try { localStorage.setItem('monkebros_mute', muted ? '1' : '0'); } catch (e) {} }

    if (confirm) { if (menuSel === 2) { onKey('KeyM'); return; } twoP = menuSel === 1; lives = 5; score = 0; bananas = 0; deaths = 0; carryForms = [0, 0]; state = 'map'; mapSel = SAVE.unlocked; stateT = 0; playSong('title'); }
    return;

    return;

  if (state === 'ending' && confirm && stateT > 240) { state = 'title'; }
}
let last = performance.now(), acc = 0;
function frame(now) {

  acc += Math.min(.1, (now - last) / 1000); last = now;
  musicTick();
  // gamepad start / jump for menus

  if ((state === 'map' || state === 'title') && TOUCH.left && !frame.tl) onKey('ArrowLeft'); frame.tl = TOUCH.left;
  if ((state === 'map' || state === 'title') && TOUCH.right && !frame.tr) onKey('ArrowRight'); frame.tr = TOUCH.right;

}
const homeEl = document.getElementById('home');
function draw() {

    if (paused) { ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, VW, VH); drawText('PAUSED', VW / 2, 80, 16, '#ffd23a', 'center'); ['RESUME', 'EXIT TO MAP'].forEach((o, i) => drawText((pauseSel === i ? '▶ ' : '  ') + o, VW / 2 - 50, 116 + i * 16, 8, pauseSel === i ? '#ffd23a' : '#fff')); drawText('M: SOUND ON/OFF', VW / 2, 170, 6, '#fff9', 'center'); }
    if (state === 'gameover') { ctx.fillStyle = '#000c'; ctx.fillRect(0, 0, VW, VH); drawText('GAME OVER', VW / 2, 90, 16, '#e8402e', 'center'); drawText('SCORE ' + score, VW / 2, 120, 8, '#fff', 'center'); if (stateT > 60) drawText('PRESS JUMP', VW / 2, 150, 8, '#ffd23a', 'center'); }
    if (state === 'worldclear') { ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, VW, VH); drawSprite(SPR.golden[(frameN >> 3) % 2], VW / 2 - 10, 50); drawText('WORLD ' + (LEVELS[levelIdx].w + 1) + ' CLEAR!', VW / 2, 84, 16, '#ffd23a', 'center'); drawText('GOLDEN BANANA ' + SAVE.golden.length + ' OF 4 RECOVERED', VW / 2, 114, 8, '#fff', 'center'); drawText('KING KROK RAN OFF TO THE NEXT ISLAND...', VW / 2, 132, 6, '#ffffffbb', 'center'); if (stateT > 90) drawText('PRESS JUMP', VW / 2, 160, 8, '#ffd23a', 'center'); }

  }

    const y0 = VH - stateT * .4; lines.forEach((l, i) => drawText(l, VW / 2, y0 + i * 18, 8, i === 0 ? '#ffd23a' : '#fff', 'center'));

}
// debug hook for automated tests
window.__mb = { get state() { return state; }, get players() { return players; }, get L() { return L; }, startLevel: (i, o) => { levelIdx = i; startLevel(i, o || {}); }, get cam() { return cam; }, KEYS, LEVELS, set(s) { state = s; }, get enemies() { return enemies; }, get boss() { return boss; }, get items() { return items; } };
