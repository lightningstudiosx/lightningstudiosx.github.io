<script>
"use strict";
// ===== util.js =====
{
const HL = window.HL = {};
HL.U = { M: 60, H: 3600, D: 86400, W: 604800, Y: 31557600 };
HL.$ = (s, r) => (r || document).querySelector(s);
HL.$$ = (s, r) => [...(r || document).querySelectorAll(s)];
HL.q = new URLSearchParams(location.search);
HL.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
HL.esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
HL.clamp = (x, a, b) => x < a ? a : x > b ? b : x;
HL.lerp = (a, b, k) => a + (b - a) * k;
HL.mobile = () => window.innerWidth < 760;
const PFX = 'howlong.';
let mem = {};
HL.store = {
get(k, d) {
try { const v = localStorage.getItem(PFX + k); return v == null ? (k in mem ? mem[k] : d) : JSON.parse(v); }
catch (e) { return k in mem ? mem[k] : d; }
},
set(k, v) { mem[k] = v; try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) { } },
wipe() { mem = {}; try { Object.keys(localStorage).filter(k => k.startsWith(PFX)).forEach(k => localStorage.removeItem(k)); } catch (e) { } }
};
if (HL.q.has('reset')) HL.store.wipe();
const bus = {};
HL.on = (n, f) => (bus[n] = bus[n] || []).push(f);
HL.emit = (n, d) => (bus[n] || []).forEach(f => { try { f(d); } catch (e) { console.error(e); } });
HL.rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
HL.hash = (a, b, c) => { let h = (a * 374761393 + (b | 0) * 668265263 + (c | 0) * 2147483647) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
HL.toast = (html, cls, key) => {
const box = HL.$('#toasts');
if (key) box.querySelectorAll('.toast[data-key="' + key + '"]').forEach(o => o.remove());
while (box.children.length >= 3) box.firstElementChild.remove();
const t = HL.el('div', 'toast ' + (cls || ''), html); if (key) t.dataset.key = key; box.appendChild(t);
setTimeout(() => t.classList.add('out'), 3600); setTimeout(() => t.remove(), 4200);
};
}
// ===== fmt.js =====
{
const { M, H, D, Y } = HL.U;
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
const sig = (x, n) => {
if (x === 0) return '0';
const e = Math.floor(Math.log10(Math.abs(x))), d = Math.max(0, n - 1 - e);
let s = x.toFixed(Math.min(d, 20));
if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
return s;

['logistics', 857 * H, 'life', 'The longest film ever made', '"Logistics" (2012) follows a pedometer\'s journey backwards through its supply chain, from Sweden to China, in 857 hours: over 35 days.', 'Logistics, by Erika Magnusson and Daniel Andersson (2012), runtime 857 hours.', 0],

Mn.sources = () => '<h2>SOURCES & NOTES</h2><p>Every figure, in order, with what it is based on. <b>≈</b> marks figures that are approximate, averages, or vary a lot. Live entries are worked out from your device\'s clock. Years here are 365.25 days.</p><table class="srcs"><tbody>' +
HL.E.map(e => { const lk = e.secret && !HL.Col.unlocked(e.id); return '<tr id="src_' + e.id + '"><td class="sd">' + (e.about ? '≈ ' : '') + HL.esc(HL.fmt.dur(e.s)) + '<small>' + HL.esc(HL.fmt.exact(e.s)) + '</small></td><td><b>' + (lk ? '★ ??? (secret)' : HL.esc(e.name)) + '</b>' + (lk ? '' : '<br>' + HL.esc(e.src)) + '</td></tr>'; }).join('') + '</tbody></table>';
Mn.keys = () => '<h2>HOW LONG IS THAT?</h2><p>The page is one long timeline. Every time you scroll about a screen or two, durations get <b>ten times</b> longer. The clock at the top shows the duration at the dashed line across the middle of the screen.</p>' +
'<ul class="keys"><li><b>↓ / J</b> next thing</li><li><b>↑ / K</b> previous thing</li><li><b>PgDn / Space</b> ×10</li><li><b>PgUp</b> ÷10</li><li><b>Home</b> back to 1 second</li><li><b>End</b> the end of time</li><li><b>R</b> random jump</li><li><b>C</b> compare</li><li><b>A</b> your age</li><li><b>M</b> sound</li></ul>' +
'<p>Tap or drag the ruler on the right to fly anywhere. Share any spot with its link: the address bar always holds <b>#t=</b> and the seconds you\'re looking at.</p><p class="small">All art is original pixel art drawn in code. Fonts: Press Start 2P and Pixelify Sans (SIL Open Font License) with a built-in pixel font for the clock. Made for Kai.fun.</p>';
Mn.init = () => {
HL.$('#bMenu').addEventListener('click', () => Mn.open());
HL.$('#chipSeen').addEventListener('click', () => Mn.open('collect'));
HL.$('#modal').addEventListener('click', ev => {
if (ev.target.id === 'modal' || ev.target.closest('[data-close]')) return Mn.close();

if (a.dataset.act2 === 'unseen') { const un = HL.MAIN.filter(e => !HL.Col.isSeen(e.id)); Mn.close(); if (un.length) { HL.Title.hide(); HL.App.goEntry(un[Math.floor(Math.random() * un.length)], true); } }

HL.$('#track').addEventListener('click', ev => {
const card = ev.target.closest('.card'); if (!card) return; const id = card.dataset.id, e = HL.byId[id];
const b = ev.target.closest('[data-act]');

const act = b.dataset.act;

else if (act === 'link') {
const url = location.href.split('#')[0] + '#t=' + id;
try { navigator.clipboard.writeText(url).then(() => HL.toast('Link copied: <b>#t=' + id + '</b>'), () => HL.toast('Link: ' + HL.esc(url))); } catch (er) { HL.toast('Link: ' + HL.esc(url)); }

}

});

}
// ===== title.js =====
{
const T = HL.Title = { shown: false };
const drawTitle = () => {
const c = HL.$('#titleC'), m = HL.mobile(), sc = m ? 4 : 7, lines = ['HOW LONG', 'IS THAT?'];
const w = Math.max(...lines.map(l => HL.font.measure(l, sc))) + sc * 2, lh = sc * 9;
c.width = w; c.height = lh * 2 + sc; const x = c.getContext('2d', { willReadFrequently: true });
lines.forEach((l, i) => { const lw = HL.font.measure(l, sc); HL.font.draw(x, l, (w - lw) / 2 | 0, i * lh + sc, sc, i ? '#f8d74a' : '#fff4a8', '#8e2436'); });
x.fillStyle = 'rgba(146,96,58,.55)'; for (let i = 0; i < 200; i++) { const px = HL.hash(i, 1, 9) * w | 0, py = HL.hash(i, 2, 9) * c.height | 0, d = x.getImageData(px, py, 1, 1).data; if (d[3] > 0 && d[0] > 200) x.fillRect(px - px % sc, py - py % sc, sc / 2 | 0 || 1, sc / 2 | 0 || 1); }
};
HL.S._title = g => {
const per = 72, k = g.ph(per), flip = Math.floor(g.t / per) % 2;
g.bg('u'); HL.L.stars(g, 12, 42);
HL.L.hourglass(g, 16, 16, k, flip ? 'p' : 'y');
if (g.cyc(per) > per - 4) { g.p(4, 6, 'z'); g.p(27, 24, 'Y'); }
};
const spr = f => { const c = HL.$('#titleSpr'); if (c && T.shown) HL.pix.draw(c.getContext('2d'), '_title', f, HL.mobile() ? 2 : 3); };
T.show = () => {

const c = HL.$('#titleSpr'), s = HL.mobile() ? 2 : 3; c.width = c.height = 32 * s; HL.Anim.add(spr);
};
T.hide = () => { if (!T.shown) return; T.shown = false; HL.$('#title').classList.add('hide'); HL.Anim.del(spr); };
T.init = () => {
HL.$('#tGo').addEventListener('click', () => { T.hide(); const e = HL.App.nextEntry(1, 0.001); HL.App.goEntry(e, true); HL.sfx('jump'); });
HL.$('#tUp').addEventListener('click', () => { T.hide(); const e = HL.App.nextEntry(-1, -0.001); HL.App.goEntry(e, true); HL.sfx('jump'); });
};
}
// ===== app.js =====
{
const A = HL.App;
A.boot = () => {
HL.Icons.init(); HL.Bg.init(); HL.Ruler.init(); HL.Clock.init(); HL.Cmp.init(); HL.Here.init(); HL.Nav.init(); HL.Menu.init(); HL.Title.init();

// ===== sheet.js =====
{
HL.Sheet = {
show() {
document.body.classList.add('sheetMode');
const box = HL.el('div', 'sheet'); document.body.appendChild(box);
const arg = HL.q.get('sheet'), [a, b] = arg ? arg.split(',').map(Number) : [0, HL.E.length];
const S = +(HL.q.get('scale') || 3), ids = HL.q.get('ids'), cs = [];
const list = ids ? ids.split(',').map(i => HL.byId[i]).filter(Boolean) : HL.E.slice(a || 0, b || HL.E.length);

const d = HL.el('div', 'sh' + (HL.pix.has(e.id) ? '' : ' miss')), c = document.createElement('canvas');

// ===== tile.js =====
{
const W = 1640, H = 820, C = 27, P = 3; // letter cell size and sub-pixel size (10x10 sub-pixels per cell)
const HG = 'nnnnnnnnn/YyyyyyyyY/oYyyyyyYo/ooYyyyYoo/oooYnYooo/ooyynyyoo/oyyyyyyyo/yyyyyyyyy/nnnnnnnnn';
const CK = 'yyyyyyyyy/yyywwwyyy/yywwkwwyy/ywwwkwwwy/ywwwkkkwy/ywwwwwwwy/yywwwwwyy/yyywwwyyy/ooooooooo';
const SAND = 'YYYYYYYYo/YyyyyyyAo/YyyAyyyyo/Yyyyyyyyo/YyyyyAyyo/YyAyyyyyo/Yyyyyyyyo/YyyyyAyyo/ooooooooo';
HL.Tile = {
show() {
document.body.classList.add('tileMode'); const T = HL.$('#tile'); T.classList.remove('hide');
const c = document.createElement('canvas'); c.width = W; c.height = H; T.appendChild(c); const X = c.getContext('2d'); X.imageSmoothingEnabled = false;
const r = HL.rng(2026), px = (x, y, w, h, col) => { X.fillStyle = HL.PAL[col] || col; X.fillRect(x, y, w, h); };
const bands = ['#1b1840', '#1d1a48', '#201c50', '#231e58', '#28205e', '#2d2264', '#33246a', '#3a2670', '#42286f', '#4b2a6b'];
bands.forEach((b, i) => px(0, i * 64, W, 66, b));
for (let i = 0; i < 380; i++) { const s = r() < 0.12 ? 8 : 4; px(r() * W / 4 * 4 | 0, r() * 600 / 4 * 4 | 0, s, s, r() < 0.2 ? '#fff4a8' : r() < 0.5 ? '#f5f2e8' : '#b9bccb'); }
for (let dy = -5; dy <= 5; dy++) { const w = Math.floor(Math.sqrt(30 - dy * dy)); px(1592 - w * 8, 440 + dy * 8, w * 16 + 8, 8, '#cdf3ff'); }
px(1576, 424, 16, 16, '#9bb7c8'); px(1600, 456, 16, 8, '#9bb7c8');
for (let i = 0; i < 90; i++) { const k = i / 90, a = k * 7 + (i % 2) * 3.14, d = k * 70; px(80 + Math.cos(a) * d * 0.9 | 0, 440 + Math.sin(a) * d * 0.5 | 0, 6, 6, k < 0.3 ? '#fff4a8' : '#a98cf0'); }
const TF = {
H: '##..##/##..##/##..##/######/######/##..##/##..##/##..##', O: '.####./######/##..##/##..##/##..##/##..##/######/.####.',
W: '##...##/##...##/##...##/##.#.##/##.#.##/#######/###.###/##...##', L: '##..../##..../##..../##..../##..../##..../######/######',
N: '##...##/###..##/####.##/##.####/##..###/##...##/##...##/##...##', G: '.#####/######/##..../##.###/##.###/##..##/######/.#####',
I: '######/######/..##../..##../..##../..##../######/######', S: '.#####/######/##..../#####./.#####/....##/######/#####.',
T: '######/######/..##../..##../..##../..##../..##../..##..', A: '.####./######/##..##/##..##/######/######/##..##/##..##',
'?': '.####./######/##..##/...###/..###./..##../....../..##..', ' ': '.../.../.../.../.../.../.../...'
};
const lines = ['HOW LONG', 'IS THAT?'], cellsOf = s => {
const out = []; let cx = 0;
[...s].forEach((ch, k) => { const rows = TF[ch].split('/'); rows.forEach((row, y) => [...row].forEach((v, x) => { if (v === '#') out.push([cx + x, y]); })); cx += rows[0].length + 1; });
return { out, w: cx - 1 };
};
lines.forEach((s, li) => {
const { out, w } = cellsOf(s), ys = out.map(p => p[1]), y0min = Math.min(...ys), x0 = Math.round((W - w * C) / 2), y0 = 42 + li * 282;
out.forEach(([x, y]) => px(x0 + x * C + 9, y0 + (y - y0min) * C + 9, C, C, '#120a1c'));
out.forEach(([x, y]) => {
const pick = HL.hash(x, y, li), pat = pick < 0.2 ? HG : pick < 0.36 ? CK : SAND, map = li ? { y: 'y', Y: 'Y', o: 'o' } : null;
pat.split('/').forEach((row, j) => [...row].forEach((ch, i) => { const cc = map && map[ch] ? map[ch] : ch; px(x0 + x * C + i * P, y0 + (y - y0min) * C + j * P, P, P, cc); }));
});
});
const ids = ['humm', 'blink', 'popcorn', 'sloth', 'tokyo', 'moonwalk', 'pyramidbuild', 'iceage', 'dinos', 'sunlife'], S = 4, fw = 32 * S, gap = 20, sx = Math.round((W - (ids.length * (fw + gap) - gap)) / 2), sy = 640;
px(0, sy - 30, W, fw + 60, '#0b0a14');
for (let x = 6; x < W; x += 36) { px(x, sy - 22, 18, 12, '#3a3747'); px(x, sy + fw + 12, 18, 12, '#3a3747'); }
ids.forEach((id, i) => { const t = HL.pix.canvas(id, S, 20); X.drawImage(t, sx + i * (fw + gap), sy); });
window.TILE_READY = true;
}
};
}

{
