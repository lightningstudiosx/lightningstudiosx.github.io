<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>frame perfects · Kai.fun</title>
<style>
  :root{
    --ink:#141414; --paper:#fff; --muted:#8a8a8a;
    --coral:#ff6b5e; --sky:#4aa9d8; --moss:#6fb85c; --grape:#9b7fd4; --sun:#f5b829;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Trebuchet MS",system-ui,sans-serif;
    min-height:100vh;padding:16px 12px 50px;
  }
  .wrap{max-width:900px;margin:0 auto;}
  .back{text-decoration:none;color:var(--muted);font-size:14px;}
  .back:hover{color:var(--ink);}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 10px;}
  .wordmark{
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
    font-weight:900;font-size:38px;transform:rotate(-1.5deg);
  }
  .wordmark .f{color:var(--coral);} .wordmark .p{color:var(--sky);}
  .tag{color:var(--muted);font-size:13px;}
  #totals{
    border:2px solid var(--ink);border-radius:12px;background:#fff;
    box-shadow:3px 3px 0 var(--ink);padding:10px 16px;margin-bottom:14px;
    display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;font-weight:900;
  }
  /* ---------- level select ---------- */
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .lvl{
    border:2px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden;
    box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .12s;
  }
  .lvl:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);}
  .lvl .im{
    height:96px;background:#141414;display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;
  }
  .lvl .im img{width:100%;height:100%;object-fit:cover;}
  .lvl .im .ph{font-size:38px;font-weight:900;color:#333;}
  .lvl .im .done{
    position:absolute;top:6px;right:6px;background:var(--moss);color:#fff;
    border-radius:999px;padding:2px 8px;font-size:12px;font-weight:900;
  }
  .lvl .body{padding:8px 10px;}
  .lvl .nm{font-weight:900;font-size:13.5px;}
  .lvl .win{font-size:11.5px;color:var(--coral);font-weight:700;margin-top:2px;}
  .lvl .best{font-size:11px;color:var(--muted);margin-top:2px;}
  /* ---------- play screen ---------- */
  #play{position:fixed;inset:0;background:#0c0c10;z-index:20;display:none;color:#fff;}
  #bgIm{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;filter:blur(2px);}
  #playUi{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px;}
  #pTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  #pName{font-weight:900;font-size:20px;text-shadow:1px 2px 4px #000;}
  #pWin{font-size:13px;color:#ffb3ab;font-weight:700;}
  #quitBtn{background:none;border:2px solid #fff5;border-radius:10px;color:#fff;
    font-family:inherit;font-weight:900;padding:7px 12px;cursor:pointer;}
  #quitBtn:hover{border-color:#fff;}
  #arena{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;}
  #track{
    position:relative;width:min(760px,94vw);height:120px;background:#ffffff0d;
    border:2px solid #ffffff33;border-radius:12px;overflow:hidden;
  }
  #targetLine{
    position:absolute;top:0;bottom:0;width:3px;background:var(--sun);left:78%;
    box-shadow:0 0 14px var(--sun);
  }
  #winZone{position:absolute;top:0;bottom:0;background:#f5b82933;}
  #bar{
    position:absolute;top:8px;bottom:8px;width:6px;background:#fff;border-radius:3px;
    box-shadow:0 0 10px #fff;left:0;
  }
  #blind{position:absolute;top:0;bottom:0;background:#0c0c10;display:none;}
  #msg{font-size:26px;font-weight:900;min-height:40px;text-align:center;text-shadow:1px 2px 4px #000;}
  #sub{font-size:14px;color:#bbb;min-height:20px;text-align:center;}
  #attempt{position:absolute;left:18px;bottom:14px;font-size:13px;color:#888;font-weight:700;}
  #hint{position:absolute;right:18px;bottom:14px;font-size:12px;color:#666;}
  .fp{color:var(--moss);text-shadow:0 0 20px var(--moss);}
  .early{color:var(--sky);}
  .late{color:var(--coral);}
  #goBtn{
    border:2px solid #fff;border-radius:12px;background:var(--sun);color:#141414;
    font-family:inherit;font-weight:900;font-size:18px;padding:14px 40px;cursor:pointer;
    box-shadow:0 4px 0 #00000066;
  }
  #goBtn:active{transform:translateY(3px);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Kai.fun</a>
  <header>
    <div class="wordmark"><span class="f">frame</span> <span class="p">perfects</span> 🎯</div>
    <div class="tag">one frame-perfect click at every framerate — from 1fps (a whole second) to 480fps (2ms).</div>
  </header>
  <div id="totals"></div>
  <div id="grid"></div>
  <div style="margin-top:14px;font-size:12px;color:var(--muted);">
    images are named by framerate: 1.png, 5.png, 10.png … 480.png — missing ones show the number instead.
  </div>
</div>

<div id="play">
  <img id="bgIm" alt="">
  <div id="playUi">
    <div id="pTop">
      <div>
        <div id="pName"></div>
        <div id="pWin"></div>
      </div>
      <button id="quitBtn">✕ levels</button>
    </div>
    <div id="arena">
      <div id="msg"></div>
      <div id="track">
        <div id="winZone"></div>
        <div id="targetLine"></div>
        <div id="blind"></div>
        <div id="bar"></div>
      </div>
      <div id="sub"></div>
      <button id="goBtn">GO</button>
    </div>
    <div id="attempt"></div>
    <div id="hint">click / space to stop the bar ON the line</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
// ============ THE FPS LADDER ============
// each level = ONE frame-perfect click at that framerate. window = 1000/fps ms.
// image for each level = its fps number: 1.png, 5.png, 10.png ... 480.png
const SPEED=560;   // bar px/sec, same for every level — only the window shrinks
const LEVELS=[
  {fps:1},{fps:5},{fps:10},{fps:20},{fps:30},{fps:60},{fps:100},{fps:120},
  {fps:160},{fps:180},{fps:200},{fps:240},{fps:300},{fps:360},{fps:400},{fps:480},
  {fps:480, blind:140},
];
LEVELS.forEach(L=>{ L.n=L.fps+"fps frame perfect"+(L.blind?" · BLIND":""); L.speed=SPEED; });
// ============ SAVE ============
const SAVE="frameperfects_v1";
let S={done:{}, best:{}, attempts:{}, totalFp:0};
try{ const d=JSON.parse(localStorage.getItem(SAVE)); if(d) S=Object.assign(S,d); }catch(e){}
function save(){ try{ localStorage.setItem(SAVE,JSON.stringify(S)); }catch(e){} }

// ============ LEVEL SELECT ============
function winMsOf(L){ return 1000/L.fps; }
function fmtWin(L){
  return "1 frame @ "+L.fps+"fps = "+winMsOf(L).toFixed(2)+"ms window"+(L.blind?" · BLIND":"");
}
function renderGrid(){
  const g=$("grid"); g.innerHTML="";
  let doneCount=0;
  LEVELS.forEach((L,ix)=>{
    const i=ix+1;
    if(S.done[i]) doneCount++;
    const d=document.createElement("div");
    d.className="lvl";
    d.innerHTML='<div class="im"><img src="'+L.fps+'.png" alt=""><div class="ph" style="display:none">'+L.fps+'</div>'+
      (S.done[i]?'<div class="done">✔ FP</div>':"")+'</div>'+
      '<div class="body"><div class="nm">'+i+". "+L.n+'</div>'+
      '<div class="win">'+fmtWin(L)+'</div>'+
      '<div class="best">'+(S.best[i]!==undefined? "best: "+S.best[i].toFixed(2)+"ms off · "+(S.attempts[i]||0)+" attempts" : "unattempted")+'</div></div>';
    const img=d.querySelector("img");
    img.onerror=()=>{ img.style.display="none"; d.querySelector(".ph").style.display="block"; };
    d.onclick=()=>openLevel(i);
    g.appendChild(d);
  });
  $("totals").innerHTML=
    "<span>🏆 "+doneCount+"/"+LEVELS.length+" frame perfects</span>"+
    "<span>🎯 "+S.totalFp+" total FP hits</span>"+
    "<span>"+(doneCount===20? "👑 YOU HAVE MASTERED THE FRAMES" : "")+"</span>";
}

// ============ PLAY ============
let cur=0, L=null, running=false, raf=0, startT=0, trackW=0, targetX=0, halfWinPx=0;
function openLevel(i){
  cur=i; L=LEVELS[i-1];
  $("play").style.display="block";
  document.body.style.overflow="hidden";
  const im=$("bgIm");
  im.style.display="block";
  im.onerror=()=>im.style.display="none";
  im.src=L.fps+".png";
  $("pName").textContent=i+". "+L.n;
  $("pWin").textContent=fmtWin(L)+" · bar speed "+SPEED+"px/s";
  $("msg").textContent="";
  $("msg").className="";
  $("sub").textContent="press GO. stop the bar exactly on the line.";
  $("goBtn").style.display="inline-block";
  layout();
  $("bar").style.left="0px";
  updateAttempts();
}
function layout(){
  const track=$("track");
  trackW=track.clientWidth;
  targetX=trackW*0.78;
  const winMs=winMsOf(L);
  halfWinPx=(winMs/1000)*SPEED/2;
  const wz=$("winZone");
  wz.style.left=(targetX-halfWinPx)+"px";
  wz.style.width=Math.max(1,halfWinPx*2)+"px";
  $("targetLine").style.left=targetX+"px";
  const bl=$("blind");
  if(L.blind){
    bl.style.display="block";
    bl.style.left=(targetX-L.blind)+"px";
    bl.style.width=(L.blind+halfWinPx+40)+"px";
  } else bl.style.display="none";
}
addEventListener("resize",()=>{ if(L) layout(); });
function startRun(){
  if(running) return;
  running=true;
  S.attempts[cur]=(S.attempts[cur]||0)+1;
  updateAttempts(); save();
  $("goBtn").style.display="none";
  $("msg").textContent="";
  $("msg").className="";
  $("sub").textContent="";
  startT=performance.now()+280;      // tiny runway so it never starts mid-click
  loop();
}
function loop(){
  raf=requestAnimationFrame(loop);
  const t=(performance.now()-startT)/1000;
  const x=Math.max(0,t*L.speed);
  $("bar").style.left=Math.min(trackW-6,x)+"px";
  if(x>trackW+10) miss( (trackW-targetX)/L.speed*1000 );  // sailed past
}
function stopRun(){
  if(!running) return;
  running=false;
  cancelAnimationFrame(raf);
  const t=(performance.now()-startT)/1000;
  const x=t*L.speed;
  const diffPx=x-targetX;
  const diffMs=diffPx/L.speed*1000;
  judge(diffMs);
}
function miss(lateMs){
  running=false;
  cancelAnimationFrame(raf);
  judge(lateMs+999);   // way late
}
function judge(diffMs){
  const winMs=winMsOf(L);
  const framesOff=Math.abs(diffMs)/winMs;
  if(S.best[cur]===undefined || Math.abs(diffMs)<S.best[cur]) S.best[cur]=Math.abs(diffMs);
  const hit=Math.abs(diffMs)<=winMs/2;
  const m=$("msg");
  if(hit){
    S.totalFp++;
    S.done[cur]=true;
    m.textContent="⚡ FRAME PERFECT!";
    m.className="fp";
    $("sub").textContent=Math.abs(diffMs).toFixed(2)+"ms off center — inside the "+winMs.toFixed(2)+"ms frame";
  }else if(diffMs>900){
    m.textContent="…you just let it sail by.";
    m.className="late";
    $("sub").textContent="the bar reached the end. it's ok. grief has stages.";
  }else{
    const fr=framesOff.toFixed(1);
    if(diffMs<0){ m.textContent=Math.abs(diffMs).toFixed(2)+"ms EARLY"; m.className="early"; }
    else{ m.textContent=diffMs.toFixed(2)+"ms LATE"; m.className="late"; }
    $("sub").textContent="that's "+fr+" frames off at "+L.fps+"fps · the frame is "+winMs.toFixed(2)+"ms wide";
  }
  save();
  $("goBtn").style.display="inline-block";
  $("goBtn").textContent=hit? "AGAIN (flex)" : "RETRY";
  updateAttempts();
}
function updateAttempts(){
  $("attempt").textContent="attempt "+(S.attempts[cur]||0)+
    (S.best[cur]!==undefined? " · best "+S.best[cur].toFixed(2)+"ms" : "");
}
function press(){
  if(running) stopRun();
  else if($("play").style.display==="block" && $("goBtn").style.display!=="none") startRun();
}
$("goBtn").onclick=(e)=>{ e.stopPropagation(); startRun(); };
$("play").addEventListener("pointerdown",(e)=>{
  if(e.target.id==="quitBtn"||e.target.id==="goBtn") return;
  press();
});
addEventListener("keydown",(e)=>{
  if($("play").style.display!=="block") return;
  if(e.key===" "){ e.preventDefault(); press(); }
  if(e.key==="Escape") quit();
});
function quit(){
  running=false;
  cancelAnimationFrame(raf);
  $("play").style.display="none";
  document.body.style.overflow="";
  renderGrid();
}
$("quitBtn").onclick=quit;

renderGrid();
</script>
</body>
</html>
