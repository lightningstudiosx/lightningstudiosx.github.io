<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong Allstar · Kai.fun</title>
<meta property="og:title" content="Pong Allstar">
<meta property="og:description" content="Play Pong online. Bots, ratings, 14 variants, tournaments, puzzles, game review and multiplayer. It gets faster every hit.">
<meta property="og:image" content="pongallstar.png">
<style>
  :root{--bg:#302e2b;--side:#262421;--panel:#262522;--card:#1f1e1b;--card2:#3c3a37;--line:#3d3b38;--text:#fff;--dim:#bababa;--dim2:#8b8987;--green:#81b64c;--green2:#45753c;--red:#e02828;--gold:#f7c045}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overflow-x:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  input,select{font:inherit}
  .app{display:grid;grid-template-columns:180px 1fr;min-height:100vh}
  /* ---------------- sidebar ---------------- */
  .side{background:var(--side);display:flex;flex-direction:column;padding:12px 0;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:8px;padding:6px 16px 16px;font-weight:900;font-size:21px;letter-spacing:-.5px;text-decoration:none;color:#fff}
  .logo svg{width:30px;height:30px;flex:0 0 auto}
  .logo span{color:var(--green)}
  .nav a,.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 16px;font-weight:700;font-size:16.5px;color:#fff;text-decoration:none;text-align:left}
  .nav a:hover,.nav button:hover{background:#1b1a18}
  .nav .ic{width:24px;text-align:center;font-size:19px}
  .side .grow{flex:1}
  .me{margin:8px 12px;padding:10px;border-radius:8px;background:#1b1a18;font-size:13px}
  .me b{display:block;font-size:15px}
  .me .r{color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .side .home{margin:4px 12px;padding:9px;border-radius:6px;background:var(--card2);text-align:center;font-weight:800;color:#fff;text-decoration:none;font-size:14px}
  /* ---------------- main ---------------- */
  .main{display:grid;grid-template-columns:minmax(300px,calc(100vh - 110px)) minmax(320px,520px);gap:24px;padding:16px 24px;justify-content:center;align-items:start}
  .boardcol{display:flex;flex-direction:column;gap:8px;max-width:calc(100vh - 110px);width:100%}
  .pbar{display:flex;align-items:center;gap:10px;height:44px}
  .pbar .av{width:40px;height:40px;border-radius:4px;background:#585654;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
  .pbar .nm{font-weight:800;font-size:15px;line-height:1.1}
  .pbar .nm small{font-weight:600;color:var(--dim);margin-left:4px;font-size:14px}
  .pbar .nm em{display:block;font-style:normal;font-weight:600;font-size:12px;color:var(--dim2)}
  .pbar .grow{flex:1}
  .score{min-width:40px;text-align:center;font-weight:900;font-size:22px;background:#21201d;border-radius:4px;padding:2px 8px}
  .clock{min-width:96px;text-align:right;font-weight:800;font-size:24px;padding:4px 12px;border-radius:4px;background:#21201d;color:#9a9998;font-variant-numeric:tabular-nums}
  .clock.on{background:#fff;color:#21201d}
  .clock.low{background:var(--red);color:#fff}
  .board{position:relative;width:100%;aspect-ratio:1;border-radius:3px;overflow:hidden;touch-action:none;cursor:none;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .board.rev{cursor:default}
  .board canvas{width:100%;height:100%;display:block}
  .board.pong{background:#000;box-shadow:0 0 0 3px #1a1a1a,0 0 30px rgba(255,255,255,.08)}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);cursor:default}
  .overlay[hidden]{display:none}
  .modal{background:var(--panel);border-radius:10px;width:min(340px,88%);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center}
  .modal .hd{padding:18px 14px 12px;background:linear-gradient(#3a3835,#2a2926)}
  .modal .hd h3{font-size:26px;font-weight:900}
  .modal .hd p{color:var(--dim);font-size:14px;font-weight:600}
  .modal .bd{padding:14px}
  .modal .rc{font-size:30px;font-weight:900;margin:4px 0 6px}
  .modal .rc .up{color:var(--green)} .modal .rc .dn{color:#e86b6b}
  .modal .row{display:flex;gap:8px;margin-top:8px}
  .modal .accs{display:flex;justify-content:center;gap:14px;margin:6px 0 4px;font-weight:800;color:var(--dim);font-size:13px}
  .modal .accs b{display:block;color:#fff;font-size:20px}
  .btn{display:block;width:100%;padding:12px 10px;border-radius:8px;font-weight:900;font-size:17px;background:var(--card2);box-shadow:0 4px 0 #262421;transition:filter .1s}
  .btn:hover{filter:brightness(1.15)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #262421}
  .btn.go{background:var(--green);box-shadow:0 5px 0 var(--green2);font-size:21px;padding:14px}
  .btn.sm{font-size:14px;padding:8px}
  .btn.danger{background:#b33a3a;box-shadow:0 4px 0 #6d1f1f}
  .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:110px;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
  .board.pong .count{font-family:"Courier New",Consolas,monospace;text-shadow:0 0 18px rgba(255,255,255,.7)}
  .modtag{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:3px 12px;pointer-events:none;white-space:nowrap}
  /* ---------------- right panel ---------------- */
  .panel{background:var(--panel);border-radius:8px;min-height:540px;display:flex;flex-direction:column;overflow:hidden;max-height:calc(100vh - 32px)}
  .ph{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 16px 14px;font-size:30px;font-weight:900;border-bottom:1px solid var(--line);position:relative}
  .ph .back{position:absolute;left:12px;font-size:22px;color:var(--dim);padding:4px 8px}
  .ph .back:hover{color:#fff}
  .pb{padding:16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
  .card{display:flex;align-items:center;gap:16px;padding:16px 18px;background:#2e2c29;border-radius:8px;text-align:left;width:100%;box-shadow:0 3px 0 #1c1b19;transition:background .1s}
  .card:hover{background:#383633}
  .card .ci{font-size:40px;width:52px;text-align:center;flex:0 0 auto}
  .card b{display:block;font-size:22px;font-weight:900}
  .card span{color:var(--dim);font-size:14.5px;font-weight:600}
  .vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vgrid .card{padding:12px;gap:10px}
  .vgrid .card .ci{font-size:30px;width:36px}
  .vgrid .card b{font-size:16px}
  .vgrid .card span{font-size:12.5px}
  .links{display:flex;justify-content:center;gap:26px;padding:10px 0 4px;font-weight:800;color:var(--dim)}
  .links button:hover{color:#fff}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg button{padding:10px 6px;border-radius:6px;background:#2e2c29;font-weight:800;font-size:14px;border:2px solid transparent}
  .seg button.on{border-color:var(--green);background:#3a3835}
  .seg button small{display:block;color:var(--dim2);font-size:11.5px;font-weight:700}
  .lbl{color:var(--dim);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  .bots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .bot{aspect-ratio:1;border-radius:8px;background:#2e2c29;font-size:30px;display:flex;align-items:center;justify-content:center;position:relative;border:2px solid transparent}
  .bot.on{border-color:var(--green);background:#3a3835}
  .bot small{position:absolute;bottom:2px;left:0;right:0;font-size:10.5px;font-weight:800;color:var(--dim)}
  .botinfo{display:flex;gap:14px;align-items:center;background:#2e2c29;border-radius:8px;padding:14px}
  .botinfo .big{font-size:52px}
  .botinfo b{font-size:21px;display:block}
  .bubble{background:#fff;color:#21201d;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;position:relative;line-height:1.4}
  .moves{background:#21201d;border-radius:6px;font-family:Consolas,monospace;font-size:14px;overflow-y:auto;max-height:260px;min-height:120px}
  .moves div{display:grid;grid-template-columns:40px 1fr 1fr;padding:3px 10px;align-items:center}
  .moves div:nth-child(odd){background:#262522}
  .moves i{color:var(--dim2);font-style:normal}
  .moves .pt{grid-template-columns:1fr;color:var(--gold);font-weight:700;text-align:center}
  .moves .mv{cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:1px 5px;border-radius:4px;width:max-content}
  .moves .mv:hover{background:#3c3a37}
  .moves .mv.sel{background:#5d5b57}
  .stat{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-weight:700}
  .stat span{color:var(--dim);text-align:right}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl td,.tbl th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
  .tbl th{color:var(--dim);font-size:12px;text-transform:uppercase}
  .tbl tr.me td{background:#3a4a2c}
  .w{color:var(--green);font-weight:900} .l{color:#e86b6b;font-weight:900} .d{color:var(--dim);font-weight:900}
  .note{color:var(--dim);font-size:13.5px;line-height:1.5}
  .field{display:flex;flex-direction:column;gap:6px}
  .field input,.field select{background:#1b1a18;border:1px solid var(--line);color:#fff;border-radius:6px;padding:9px 10px}
  .code{font-family:Consolas,monospace;font-size:28px;font-weight:900;letter-spacing:4px;text-align:center;background:#1b1a18;border-radius:8px;padding:10px}
  .spinner{width:46px;height:46px;border-radius:50%;border:5px solid #444;border-top-color:var(--green);animation:spin .9s linear infinite;margin:10px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .puz{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .puz button{padding:12px 4px;border-radius:8px;background:#2e2c29;font-weight:900;font-size:18px}
  .puz button small{display:block;font-size:11px;color:var(--dim)}
  .puz button.done{background:#3a4a2c}
  .puz button.locked{opacity:.4;cursor:not-allowed}
  .tourn{display:flex;flex-direction:column;gap:6px}
  .tourn div{display:flex;align-items:center;gap:10px;background:#2e2c29;border-radius:8px;padding:8px 12px;font-weight:700}
  .tourn div.cur{outline:2px solid var(--green)}
  .tourn div .res{margin-left:auto}
  .offer{background:#3a4a2c;border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;font-weight:800}
  .offer .btn{width:auto;padding:6px 12px;font-size:13px}
  /* ---------------- game review ---------------- */
  .revctl{display:flex;gap:6px;position:sticky;top:-16px;z-index:2;background:var(--panel);padding:4px 0}
  .revctl button{flex:1;padding:10px 0;border-radius:6px;background:#3c3a37;font-size:17px;font-weight:900;box-shadow:0 3px 0 #1c1b19}
  .revctl button:hover{background:#4a4845}
  .graph{width:100%;height:96px;display:block;border-radius:6px;cursor:pointer;background:#403d39}
  .accrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .acc{background:#2e2c29;border-radius:8px;padding:10px;text-align:center}
  .acc b{display:block;font-size:30px;font-weight:900}
  .acc span{color:var(--dim);font-size:13px;font-weight:700}
  .cls{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 3px;border-radius:999px;font-size:11px;font-weight:900;color:#fff;flex:0 0 auto;font-family:"Segoe UI",sans-serif;line-height:1}
  .counts{width:100%;border-collapse:collapse;font-size:14px}
  .counts td{padding:4px 6px}
  .counts td.n{text-align:center;font-weight:900;width:44px}
  .counts td.k{font-weight:700}
  .counts td.k span{display:inline-flex;align-items:center;gap:8px}
  .moment{display:flex;gap:10px;align-items:center;background:#2e2c29;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:14px}
  .moment:hover{background:#383633}
  #toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);background:#fff;color:#21201d;font-weight:800;border-radius:8px;padding:10px 16px;transition:transform .25s;z-index:99;max-width:90vw;text-align:center}
  #toast.on{transform:translate(-50%,0)}
  @media(max-width:1020px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:6px}.side .nav{display:flex;flex-wrap:wrap}.nav a,.nav button{padding:6px 10px;font-size:14px;width:auto}.nav .ic{width:auto}.side .grow,.me{display:none}.logo{padding:6px 10px}.main{grid-template-columns:1fr;padding:10px}.boardcol{max-width:none}.panel{max-height:none;min-height:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="logo" href="#" id="logoHome"><svg viewBox="0 0 32 32"><rect x="3" y="6" width="5" height="20" fill="#81b64c"/><rect x="24" y="6" width="5" height="20" fill="#fff"/><rect x="13" y="10" width="6" height="6" fill="#fff"/></svg>Pong<span>Allstar</span></a>
    <nav class="nav">
      <button data-go="home"><span class="ic">🏓</span>Play</button>
      <button data-go="puzzles"><span class="ic">🧩</span>Puzzles</button>
      <button data-go="learn"><span class="ic">🎓</span>Learn</button>
      <button data-go="watch"><span class="ic">📺</span>Watch</button>
      <button data-go="leaderboard"><span class="ic">🏆</span>Community</button>
      <button data-go="settings"><span class="ic">⚙️</span>Other</button>
    </nav>
    <div class="grow"></div>
    <div class="me" id="meBox"></div>
    <a class="home" href="index.html">&larr; Kai.fun</a>
  </aside>

  <div class="main">
    <div class="boardcol">
      <div class="pbar" id="barTop"></div>
      <div class="board" id="board">
        <canvas id="cv"></canvas>
        <div class="count" id="count"></div>
        <div class="modtag" id="modtag" hidden></div>
        <div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>
      </div>
      <div class="pbar" id="barBot"></div>
    </div>
    <div class="panel">
      <div class="ph" id="ph"></div>
      <div class="pb" id="pb"></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
// =====================================================================================
//  Data: time controls, variants, bots, move classifications
// =====================================================================================
const TC = {
  bullet: {name: "Bullet", icon: "🚀", speed: 0.78, accel: 1.075, to: 3, clock: 60},
  blitz:  {name: "Blitz",  icon: "⚡", speed: 0.62, accel: 1.05,  to: 5, clock: 180},
  rapid:  {name: "Rapid",  icon: "🕒", speed: 0.5,  accel: 1.035, to: 7, clock: 360},
};
const VARIANTS = {
  classic: {name: "Classic",           icon: "🏓", desc: "Normal pong. Faster every hit.", mods: {}},
  multi:   {name: "Multiball",         icon: "🎱", desc: "Two balls at once.", mods: {multi: 1}},
  tiny:    {name: "Tiny Paddles",      icon: "🤏", desc: "Paddles half the size.", mods: {tiny: 1}},
  giant:   {name: "Giant Ball",        icon: "🌕", desc: "A huge, slightly slower ball.", mods: {giant: 1}},
  ghost:   {name: "Ghost Ball",        icon: "👻", desc: "The ball vanishes in the middle of the court.", mods: {ghost: 1}},
  speed:   {name: "Speed Demon",       icon: "🔥", desc: "The ball speeds up way more every hit.", mods: {speed: 1}},
  shrink:  {name: "Shrinking Paddles", icon: "📉", desc: "Your paddle shrinks every hit. Resets each point.", mods: {shrink: 1}},
  curve:   {name: "Curveball",         icon: "🌪️", desc: "Move while you hit to put spin on the ball.", mods: {curve: 1}},
  portals: {name: "Portals",           icon: "🌀", desc: "The middle of each side wall teleports to the other side.", mods: {portals: 1}},
  bricks:  {name: "Brick Wall",        icon: "🧱", desc: "Smash through rows of bricks to reach your opponent.", mods: {bricks: 1}},
  bumpers: {name: "Bumpers",           icon: "🔴", desc: "Pinball bumpers fling the ball off at new angles.", mods: {bumpers: 1}},
  wind:    {name: "Windy",             icon: "💨", desc: "Gusts of wind push the ball sideways.", mods: {wind: 1}},
  chaos:   {name: "Chaos",             icon: "🎲", desc: "A different variant every point.", mods: "chaos"},
  p960:    {name: "Pong960",           icon: "🔀", desc: "Random paddles, ball size, speed and two rules every game.", mods: "960"},
};
const MOD_KEYS = ["multi", "tiny", "giant", "ghost", "speed", "shrink", "curve", "portals", "bricks", "bumpers", "wind"];
const MOD_NAME = {};
for (const v of Object.values(VARIANTS)) if (typeof v.mods === "object"){ const k = Object.keys(v.mods)[0]; if (k) MOD_NAME[k] = v.icon + " " + v.name; }
const BOTS = [
  {id: "pebble",   name: "Pebble",        elo: 250,  icon: "🪨", bio: "Is a rock. Moves like one."},
  {id: "wobbles",  name: "Sir Wobbles",   elo: 500,  icon: "🐧", bio: "Waddles to the ball. Usually a bit late."},
  {id: "doris",    name: "Doris",         elo: 800,  icon: "👵", bio: "Played pong in 1972 and never stopped."},
  {id: "spin",     name: "Captain Spin",  elo: 1100, icon: "🏴‍☠️", bio: "Loves hitting with the edge of the paddle. Arrr."},
  {id: "lil",      name: "Lil Paddle",    elo: 1400, icon: "👶", bio: "Seven years old. Already better than your uncle."},
  {id: "rebound",  name: "Dr. Rebound",   elo: 1700, icon: "🧪", bio: "Calculates every bounce. Wears goggles indoors."},
  {id: "wall",     name: "The Wall",      elo: 2000, icon: "🧱", bio: "Nothing gets past. Almost nothing."},
  {id: "ninja",    name: "Neon Ninja",    elo: 2300, icon: "🥷", bio: "You won't see the ball coming. Or him."},
  {id: "overlord", name: "Pong Overlord", elo: 2700, icon: "🤖", bio: "Trained on every rally ever played."},
  {id: "kai",      name: "Kai",           elo: 3000, icon: "😎", bio: "Made this website. Will not let you win."},
];
const COACH = {id: "coach", name: "Coach Pongo", elo: 900, icon: "🧑‍🏫", bio: "Plays gently and tells you what to do better."};
const COACH_TIPS = [
  "Hit the ball with the edge of your paddle to send it at an angle.",
  "Hitting with the middle sends the ball straight back. Easy for me!",
  "Aim away from me. If my paddle is on the right, send the ball left.",
  "Bounce it off the side walls. Bank shots are hard to read.",
  "Watch where the ball will land, not where it is now.",
  "Every hit makes the ball faster. Long rallies get scary.",
  "Stay near the middle after you hit. You'll reach both sides.",
];
// chess-style move grades for every hit
const CLS = {
  brilliant:  {n: "Brilliant",  s: "!!", c: "#1baca6", acc: 100},
  great:      {n: "Great",      s: "!",  c: "#5c8bb0", acc: 100},
  best:       {n: "Best",       s: "★",  c: "#81b64c", acc: 100},
  excellent:  {n: "Excellent",  s: "👍", c: "#96bc4b", acc: 92},
  good:       {n: "Good",       s: "✓",  c: "#77915f", acc: 80},
  book:       {n: "Book",       s: "B",  c: "#a88865", acc: 100},
  inaccuracy: {n: "Inaccuracy", s: "?!", c: "#f7c045", acc: 65},
  mistake:    {n: "Mistake",    s: "?",  c: "#ffa459", acc: 42},
  miss:       {n: "Miss",       s: "✗",  c: "#ff7769", acc: 0},
  blunder:    {n: "Blunder",    s: "??", c: "#fa412d", acc: 10},
  forced:     {n: "Forced",     s: "□",  c: "#8b8987", acc: null},
};
const CLS_ORDER = ["brilliant", "great", "best", "excellent", "good", "book", "inaccuracy", "mistake", "miss", "blunder"];
const badge = k => `<span class="cls" style="background:${CLS[k].c}" title="${CLS[k].n}">${CLS[k].s}</span>`;

// =====================================================================================
//  Saving
// =====================================================================================
const KEY = "pongallstar_v1";
function fresh(){ return {name: "Guest" + Math.floor(1000 + Math.random() * 9000), ratings: {bullet: 800, blitz: 800, rapid: 800}, games: {bullet: 0, blitz: 0, rapid: 0}, history: [], puzzle: 800, puzSolved: {}, tourn: null, tournWins: 0, theme: "pong", v2: true, sound: true}; }
let P = (() => { try { const j = JSON.parse(localStorage.getItem(KEY) || "null"); if (j) { const f = fresh(); return {...f, ...j, v2: !!j.v2, ratings: {...f.ratings, ...j.ratings}, games: {...f.games, ...j.games}}; } } catch (e) {} return fresh(); })();
if (!P.v2){ P.v2 = true; P.theme = "pong"; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
const THEMES = {pong: ["#000", "#000"], green: ["#ebecd0", "#739552"], brown: ["#f0d9b5", "#b58863"], blue: ["#dee3e6", "#8ca2ad"], purple: ["#efefef", "#8877b7"], neon: ["#1d1f33", "#2c2f4d"]};
const isPong = () => P.theme === "pong";

// =====================================================================================
//  Sound

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// where a ball reaches a horizontal line, bouncing off the side walls

  const pts = [[x, y]];

    if ((lineY - y) * vy <= 0) break;
    const tl = (lineY - y) / vy, tw = vx > 0 ? (1 - r - x) / vx : vx < 0 ? (r - x) / vx : Infinity;

function makeBot(def){ const s = def.elo / 3000; return {...def, skill: s, speed: .42 + 1.95 * s, err: .19 * Math.pow(1 - s, 1.6) + .006, react: .34 - .27 * s}; }

//  Move analysis (Game Review)
// =====================================================================================
function classify(log){
  const out = [];
  let lastHit = null, rallyStart = true;
  for (let k = 0; k < log.length; k++){
    const e = log[k];
    if (e.point != null){
      const loser = 1 - e.point;
      if (lastHit && lastHit.side === e.point) out[k] = {side: loser, c: lastHit.a >= .7 ? "forced" : "miss"};
      else if (!lastHit) out[k] = {side: loser, c: "miss"};        // didn't even return the serve
      else out[k] = null;
      lastHit = null; rallyStart = true; continue;
    }
    const next = log[k + 1], winner = next && next.point === e.side;
    const ratio = e.b > 0.02 ? e.a / e.b : 1;
    let c;
    if (winner && e.a >= .7) c = ratio >= .8 && e.a >= .9 && (e.wb > 0 || e.r >= 8) ? "brilliant" : "great";
    else if (ratio >= .75) c = "best";
    else if (ratio >= .55) c = "excellent";
    else if (ratio >= .38) c = "good";
    else if (rallyStart && ratio >= .2) c = "book";
    else if (ratio >= .24) c = "inaccuracy";
    else if (ratio >= .1 || e.b < .9) c = "mistake";
    else c = "blunder";
    out[k] = {side: e.side, c};
    lastHit = e; rallyStart = false;
  }
  return out;
}
function accuracy(cls, side){
  let s = 0, n = 0;
  for (const x of cls) if (x && x.side === side && CLS[x.c].acc != null){ s += CLS[x.c].acc; n++; }
  return n ? Math.round(s / n * 10) / 10 : null;
}
function evalSeries(log){
  // a pretend "evaluation" from the bottom player's point of view: score difference plus the pressure of the last shot
  const ev = [0];
  for (const e of log){
    const sd = e.point != null ? e.score[0] - e.score[1] : null;
    const prev = ev.length ? ev._sd || 0 : 0;
    if (sd != null){ ev._sd = sd; ev.push(clamp(sd, -6, 6)); }
    else ev.push(clamp((ev._sd || 0) + (e.side === 0 ? 1 : -1) * Math.min(1.6, e.a) * .9, -6, 6));

}

let lastT = performance.now();

    }
    if (G.o.net) netTick(dt);
    if (REV && REV.playing){
      REV.frame += dt * 30 * REV.speed;
      if (REV.frame >= G.frames.length - 1){ REV.frame = G.frames.length - 1; REV.playing = false; renderRevCtl(); }
      syncSelToFrame();

let resignArmed = 0;

function onResign(){
  if (!G || G.over) return;
  if (canAbort()){ G.finish(-1, "aborted"); return; }
  if (Date.now() - resignArmed > 3000){
    resignArmed = Date.now();
    const b = $("resignBtn"); if (b){ b.textContent = "Click again to resign"; b.classList.add("danger"); }
    setTimeout(() => { const b2 = $("resignBtn"); if (b2 && G && !G.over){ b2.textContent = "🏳 Resign"; b2.classList.remove("danger"); } }, 3000);
    return;
  }
  resignArmed = 0;
  const me = meSide();
  if (G.o.net) netSend2({t: "resign"});
  G.finish(G.o.kind === "local" ? 1 : 1 - me, "resignation");
}
function onDraw(){
  if (!G || G.over) return;
  const o = G.o;
  if (o.kind === "local"){ G.finish(-1, "agreement"); return; }
  if (o.net){ netSend2({t: "drawoffer"}); toast("Draw offered."); return; }
  const botSide = o.players.findIndex(p => p.ctrl === "bot");
  if (botSide < 0) return;
  const bot = o.players[botSide], lead = G.score[botSide] - G.score[1 - botSide];
  const accept = bot.bot.id !== "kai" && (lead <= -2 || (lead === 0 && G.clock < 30 && bot.rating < 2000));
  if (accept){ toast(bot.icon + " " + bot.name + " accepts the draw."); G.finish(-1, "agreement"); }
  else toast(bot.icon + " " + (bot.bot.id === "kai" ? "Kai laughs at your draw offer." : lead > 0 ? bot.name + " is winning. No draw." : bot.name + " wants to keep playing."));
}

  const o = G.o;
  panel(o.puzzle ? "Puzzle" : TC[o.tc].icon + " " + TC[o.tc].name, "", `
    <div class="note">${VARIANTS[o.variant] ? VARIANTS[o.variant].icon + " " + VARIANTS[o.variant].name : ""} · ${o.rated ? "Rated" : "Unrated"} · first to ${TC[o.tc].to}</div>
    ${o.kind === "coach" ? `<div class="bubble" id="coachSay">${COACH_TIPS[0]}</div>` : ""}
    <div id="offerBox"></div>
    <div class="moves" id="moves"></div>
    <div class="stat"><b>Ball speed</b><span id="spd">1.00×</span></div>
    ${G.over ? `<button class="btn go" id="revBtn2">⭐ Game Review</button><button class="btn sm" data-go="home">New Game</button>` : `<div style="display:flex;gap:8px"><button class="btn sm" id="resignBtn">🏳 Resign</button><button class="btn sm" id="drawBtn">½ Draw</button></div>`}`, G.over ? "home" : null);
  const rs = $("resignBtn"); if (rs) rs.onclick = onResign;
  const dr = $("drawBtn"); if (dr) dr.onclick = onDraw;
  const rv = $("revBtn2"); if (rv) rv.onclick = () => view("review");
  lastLogLen = -1;
}
function coachSay(t){ const b = $("coachSay"); if (b) b.textContent = t; }
let lastLogLen = -1;
function updateLiveLog(){
  const m = $("moves"); if (!m || !G) return;
  if (G.log.length !== lastLogLen){
    lastLogLen = G.log.length;
    let h = "", n = 1, row = [];
    const flush = () => { if (row.length){ h += `<div><i>${n++}.</i><span>${row[0] || ""}</span><span>${row[1] || ""}</span></div>`; row = []; } };
    for (const e of G.log){
      if (e.point != null){ flush(); h += `<div class="pt">${esc(G.o.players[e.point].name)} scores · ${e.score[0]}-${e.score[1]}</div>`; n = 1; }
      else { row.push(e.sq); if (row.length === 2) flush(); }
    }
    flush(); m.innerHTML = h || `<div class="pt" style="color:var(--dim)">Waiting for the first hit...</div>`; m.scrollTop = m.scrollHeight;
  }
  const sp = $("spd"); if (sp && G.balls[0]) sp.textContent = (Math.hypot(G.balls[0].vx, G.balls[0].vy) / G.tc.speed).toFixed(2) + "×";
  const rs = $("resignBtn"); if (rs && !rs.classList.contains("danger")) rs.textContent = canAbort() ? "✖ Abort" : "🏳 Resign";
}

function openReview(){
  if (!G || !G.over || G.o.puzzle){ toast("Finish a game first, then review it."); return VIEWS.home(); }
  closeOverlay();
  const cls = classify(G.log);
  REV = {sel: null, frame: G.frames.length - 1, playing: false, speed: 1, cls, ev: evalSeries(G.log)};
  renderReview();
}
function moveText(k){
  const e = G.log[k], c = REV.cls[k];
  if (!c) return "";
  const who = G.o.players[c.side].name, opp = G.o.players[1 - c.side].name;
  const where = e.point == null ? (Math.abs(e.bo) > .3 ? "the edge of the paddle" : "the middle of the paddle") : "";
  return {
    brilliant: `Brilliant! ${who} found a winner${e.wb ? " off the wall" : ""} that was almost impossible to return.`,
    great: `Great shot! ${opp} couldn't get there in time.`,
    best: `The best shot available. Nothing harder to return from there.`,
    excellent: `Excellent. Very close to the best shot.`,
    good: `A solid return, but there was a harder shot (dashed arrow).`,
    book: `A standard return of serve.`,
    inaccuracy: `An inaccuracy. Hitting with ${where} (dashed arrow) would have pulled ${opp} much further.`,
    mistake: `A mistake. This went close to ${opp}. The dashed arrow shows the better shot.`,
    blunder: `A blunder! There was a winner available (dashed arrow), but this was an easy ball for ${opp}.`,
    miss: `${who} missed it. That ball was returnable.`,
    forced: `Nothing ${who} could do. That shot was out of reach.`,
  }[c.c];
}
function renderReview(){
  const me = meSide(), pl = G.o.players, cls = REV.cls;
  const accs = [accuracy(cls, 0), accuracy(cls, 1)];
  const counts = [{}, {}]; for (const x of cls) if (x) counts[x.side][x.c] = (counts[x.side][x.c] || 0) + 1;
  // the coach's summary
  const myAcc = accs[me], mine = cls.map((x, k) => x && x.side === me ? {k, c: x.c} : null).filter(Boolean);
  const bril = mine.filter(x => x.c === "brilliant").length, worst = mine.find(x => x.c === "blunder") || mine.find(x => x.c === "miss") || mine.find(x => x.c === "mistake");
  let summary = myAcc == null ? "Not enough hits to grade this one." :
    (myAcc >= 85 ? `Superb game! ${myAcc}% accuracy.` : myAcc >= 70 ? `Well played. ${myAcc}% accuracy.` : myAcc >= 50 ? `A decent game with ${myAcc}% accuracy, and room to improve.` : `A tough one: ${myAcc}% accuracy. Let's see what went wrong.`);
  if (bril) summary += ` You found ${bril} brilliant shot${bril > 1 ? "s" : ""}!`;
  if (worst) summary += ` Your biggest slip was hit #${hitNo(worst.k)} (${CLS[worst.c].n}). Click it below to see it.`;
  // key moments: brilliants, greats and the worst errors
  const pick = (c, max) => cls.map((x, k) => x && x.c === c ? k : -1).filter(k => k >= 0).slice(0, max);
  const keyIdx = [...pick("brilliant", 4), ...pick("great", 3), ...pick("blunder", 3), ...pick("mistake", 2), ...pick("miss", 3)].slice(0, 8).sort((a, b) => a - b);
  panel("Game Review", "⭐", `
    <div class="revctl" id="revctl"></div>
    <div class="bubble" id="revSay">${summary}</div>
    <svg class="graph" id="graph" viewBox="0 0 300 96" preserveAspectRatio="none"></svg>
    <div class="accrow">${[me, 1 - me].map(s => `<div class="acc"><span>${pl[s].icon} ${esc(pl[s].name)}</span><b>${accs[s] ?? "-"}</b><span>Accuracy</span></div>`).join("")}</div>
    <table class="counts"><tr><td class="n">${esc(pl[me].name).slice(0, 8)}</td><td></td><td class="n">${esc(pl[1 - me].name).slice(0, 8)}</td></tr>
      ${CLS_ORDER.map(k => `<tr><td class="n" style="color:${CLS[k].c}">${counts[me][k] || 0}</td><td class="k"><span>${badge(k)} ${CLS[k].n}</span></td><td class="n" style="color:${CLS[k].c}">${counts[1 - me][k] || 0}</td></tr>`).join("")}</table>
    ${keyIdx.length ? `<div class="lbl">Key moments</div>` + keyIdx.map(k => `<div class="moment" data-mv="${k}">${badge(cls[k].c)} ${esc(pl[cls[k].side].name)}: ${G.log[k].point != null ? "missed" : G.log[k].sq} <span style="color:var(--dim);margin-left:auto">hit #${hitNo(k)}</span></div>`).join("") : ""}
    <div class="lbl">Moves</div>
    <div class="moves" id="moves" style="max-height:none"></div>
    <div class="stat"><b>Longest rally</b><span>${G.stats.longest} hits</span></div>
    <div class="stat"><b>Top ball speed</b><span>${(G.stats.top / G.tc.speed).toFixed(2)}×</span></div>
    <button class="btn go" data-go="home">New Game</button>`, "home");
  renderRevCtl(); renderGraph(); renderRevMoves();
  $("pb").addEventListener("click", e => { const m = e.target.closest("[data-mv]"); if (m) selectMove(+m.dataset.mv); });
}
const hitNo = k => G.log.slice(0, k + 1).filter(e => e.point == null).length;
function renderRevCtl(){
  const c = $("revctl"); if (!c) return;
  c.innerHTML = `<button id="rvFirst" title="Start">⏮</button><button id="rvPrev" title="Previous hit (←)">◀</button><button id="rvPlay" title="Play">${REV.playing ? "❚❚" : "▶"}</button><button id="rvNext" title="Next hit (→)">▶|</button><button id="rvLast" title="End">⏭</button>`;
  $("rvFirst").onclick = () => { REV.playing = false; REV.frame = 0; REV.sel = null; renderRevCtl(); renderRevMoves(); };
  $("rvLast").onclick = () => { REV.playing = false; REV.frame = G.frames.length - 1; REV.sel = null; renderRevCtl(); renderRevMoves(); };
  $("rvPrev").onclick = () => revStep(-1);
  $("rvNext").onclick = () => revStep(1);
  $("rvPlay").onclick = () => { if (REV.frame >= G.frames.length - 1) REV.frame = 0; REV.playing = !REV.playing; REV.sel = null; renderRevCtl(); };
}
function revStep(d){
  if (!REV) return;
  const idx = REV.cls.map((x, k) => x ? k : -1).filter(k => k >= 0);
  if (!idx.length) return;
  let cur = REV.sel == null ? (d > 0 ? -1 : idx.length) : idx.indexOf(REV.sel);
  cur = clamp(cur + d, 0, idx.length - 1);
  selectMove(idx[cur]);
}
function selectMove(k){
  REV.playing = false; REV.sel = k;
  const e = G.log[k];
  REV.frame = clamp(e.f, 0, G.frames.length - 1);
  renderRevCtl(); renderRevMoves(); renderGraph();
  const say = $("revSay"); if (say && REV.cls[k]) say.innerHTML = `${badge(REV.cls[k].c)} <b>${e.point != null ? "Missed ball" : "Hit #" + hitNo(k) + " " + e.sq}</b> is ${/^[aeiou]/i.test(CLS[REV.cls[k].c].n) ? "an" : "a"} <b style="color:${CLS[REV.cls[k].c].c}">${CLS[REV.cls[k].c].n}</b>. ${moveText(k)}`;
}
function syncSelToFrame(){
  let k = null;
  for (let i = 0; i < G.log.length; i++){ if (G.log[i].f <= REV.frame && REV.cls[i]) k = i; else if (G.log[i].f > REV.frame) break; }
  if (k !== REV.sel){ REV.sel = k; renderRevMoves(); }
}
function renderRevMoves(){
  const m = $("moves"); if (!m || !REV) return;
  let h = "", n = 1, row = [];
  const flush = () => { if (row.length){ h += `<div><i>${n++}.</i>${row[0] || "<span></span>"}${row[1] || "<span></span>"}</div>`; row = []; } };
  G.log.forEach((e, k) => {
    const c = REV.cls[k];
    if (e.point != null){
      flush();
      if (c) h += `<div class="pt"><span class="mv ${REV.sel === k ? "sel" : ""}" data-mv="${k}" style="margin:auto">${badge(c.c)} ${esc(G.o.players[c.side].name)} missed</span></div>`;
      h += `<div class="pt">${esc(G.o.players[e.point].name)} scores · ${e.score[0]}-${e.score[1]}</div>`; n = 1;
    } else {
      row.push(`<span class="mv ${REV.sel === k ? "sel" : ""}" data-mv="${k}">${c ? badge(c.c) : ""}${e.sq}</span>`);
      if (row.length === 2) flush();
    }
  });
  flush();
  m.innerHTML = h || `<div class="pt" style="color:var(--dim)">No hits in this game.</div>`;
  const s = m.querySelector(".sel"); if (s) s.scrollIntoView({block: "nearest"});
}
function renderGraph(){
  const g = $("graph"); if (!g) return;
  const ev = REV.ev, n = Math.max(1, ev.length - 1), sign = meSide() === 0 ? 1 : -1;
  const Y = v => 48 - clamp(v * sign, -6, 6) / 6 * 44, Xg = i => i / n * 300;
  let d = `M0 96 L0 ${Y(ev[0])}`; ev.forEach((v, i) => { d += ` L${Xg(i).toFixed(1)} ${Y(v).toFixed(1)}`; }); d += ` L300 96 Z`;
  let dots = "";
  REV.cls.forEach((c, k) => { if (c && ["brilliant", "great", "blunder", "miss", "mistake"].includes(c.c)) dots += `<circle cx="${Xg(k + 1)}" cy="${Y(ev[k + 1])}" r="3.2" fill="${CLS[c.c].c}" stroke="#fff" stroke-width="1"/>`; });
  const selX = REV.sel != null ? `<line x1="${Xg(REV.sel + 1)}" x2="${Xg(REV.sel + 1)}" y1="0" y2="96" stroke="#f7c045" stroke-width="2"/>` : "";
  g.innerHTML = `<path d="${d}" fill="#fff"/><line x1="0" x2="300" y1="48" y2="48" stroke="#888" stroke-width=".6" stroke-dasharray="3 3"/>${selX}${dots}`;
  g.onclick = e => {
    const r = g.getBoundingClientRect(), i = Math.round((e.clientX - r.left) / r.width * n) - 1;
    let best = null; for (let k = 0; k < REV.cls.length; k++) if (REV.cls[k] && (best == null || Math.abs(k - i) < Math.abs(best - i))) best = k;
    if (best != null) selectMove(best);
  };
}

function startLocal(tc, variant){

}

let puzIdx = 0;

    <div class="row" style="margin-top:14px"><button class="btn sm" id="pzRetry">Retry</button>${ok && puzIdx + 1 < PUZZLES.length ? `<button class="btn sm" id="pzNext">Next</button>` : ""}</div><button class="btn go" style="margin-top:10px" id="pzList">Puzzles</button></div>`);

function tournResult(won){

let watchNext = null;
function startWatch(){

  if (curView !== "watch") return;
  let a = Math.floor(Math.random() * BOTS.length), b = Math.floor(Math.random() * BOTS.length); if (a === b) b = (b + 3) % BOTS.length;

  G.onEnd = () => {}; flipped = false; watchMode = true; lastLogLen = -1;

}

// =====================================================================================
//  Online multiplayer (peer to peer, through the free PeerJS broker)
// =====================================================================================
let Peer_ = null, net = null, searching = null;
function loadPeer(){
  if (window.Peer) return Promise.resolve(window.Peer);
  if (Peer_) return Peer_;
  Peer_ = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"; s.onload = () => res(window.Peer); s.onerror = () => { Peer_ = null; rej(new Error("load")); }; document.head.appendChild(s); });
  return Peer_;
}
function peerOpen(id){
  return new Promise((res, rej) => {
    const p = id ? new window.Peer(id) : new window.Peer();
    let opened = false;
    const to = setTimeout(() => { if (!opened){ rej(new Error("timeout")); try { p.destroy(); } catch (e) {} } }, 9000);
    p.on("open", () => { opened = true; clearTimeout(to); res(p); });
    // only give up on errors before we're connected; later errors (like "nobody is waiting in that lobby") are normal
    p.on("error", err => { if (opened) return; clearTimeout(to); rej(err); try { p.destroy(); } catch (e) {} });
    // if the broker connection drops mid-game, quietly reconnect
    p.on("disconnected", () => { if (opened && !p.destroyed) try { p.reconnect(); } catch (e) {} });
  });
}
function searchUI(html){ const b = $("searchBox"); if (b) b.innerHTML = html; }
function onClick(id, fn){ const el = $(id); if (el) el.onclick = fn; }
function cancelSearch(){
  if (!searching) return;
  searching.cancelled = true;
  for (const p of searching.peers) try { p.destroy(); } catch (e) {}
  searching = null;
}
async function findMatch(tc, variant){
  cancelSearch();
  const me = searching = {cancelled: false, peers: []};
  searchUI(`<div class="spinner"></div><p class="note" style="text-align:center">Looking for an opponent in ${TC[tc].name} · ${VARIANTS[variant].name}...</p><button class="btn sm" id="cancelBtn">Cancel</button>`);
  onClick("cancelBtn", () => { cancelSearch(); searchUI(""); });
  try { await loadPeer(); } catch (e) { return searchFail("Couldn't load the multiplayer system. Check your internet."); }
  const lobby = s => `pongallstar-v2-${tc}-${variant}-${s}`;
  let mine;
  try { mine = await peerOpen(); me.peers.push(mine); } catch (e) { return searchFail("Couldn't reach the matchmaking server."); }
  for (let s = 0; s < 4 && !me.cancelled; s++){
    const res = await tryJoin(mine, lobby(s), 2600, tc);
    if (me.cancelled) return;
    if (res){ me.peers = me.peers.filter(p => p !== mine); searching = null; return beginNet(res.conn, "client", tc, variant, res.hello, mine); }
  }
  if (me.cancelled) return;
  for (let s = 0; s < 4 && !me.cancelled; s++){
    let host;
    try { host = await peerOpen(lobby(s)); } catch (e) { continue; }
    if (me.cancelled){ host.destroy(); return; }
    me.peers.push(host);
    searchUI(`<div class="spinner"></div><p class="note" style="text-align:center">Waiting for an opponent... (keep this tab open)</p><p class="note" style="text-align:center">Tip: send a friend a link with Play a Friend to play right away.</p><button class="btn sm" id="cancelBtn">Cancel</button>`);
    onClick("cancelBtn", () => { cancelSearch(); searchUI(""); });
    return waitForGuest(host, tc, variant, me);
  }
  searchFail("The lobby is full right now. Try again in a moment.");
}
function searchFail(msg){ cancelSearch(); searchUI(`<p class="note" style="color:#e86b6b">${msg}</p><button class="btn sm" data-go="bots">Play a bot instead</button>`); }
function tryJoin(peer, id, ms, tc){
  return new Promise(res => {
    let done = false;
    const finish = v => { if (done) return; done = true; clearTimeout(to); res(v); };
    const to = setTimeout(() => { finish(null); try { conn.close(); } catch (e) {} }, ms);
    let conn;
    try { conn = peer.connect(id, {reliable: true}); } catch (e) { return finish(null); }
    if (!conn) return finish(null);
    peer.on("error", err => { if (err && err.type === "peer-unavailable" && String(err.message || "").includes(id)) finish(null); });
    conn.on("open", () => conn.send({t: "hello", name: P.name, rating: P.ratings[tc || sel.tc], v: 2}));
    conn.on("data", d => { if (d && d.t === "accept") finish({conn, hello: d}); else if (d && d.t === "busy") finish(null); });
  });
}
function waitForGuest(host, tc, variant, me){
  let taken = false;
  host.on("connection", conn => {
    conn.on("data", d => {
      if (!d || d.t !== "hello") return;
      if (taken || me.cancelled){ conn.send({t: "busy"}); setTimeout(() => conn.close(), 300); return; }
      taken = true;
      conn.send({t: "accept", name: P.name, rating: P.ratings[tc], tc, variant});
      searching = null;
      beginNet(conn, "host", tc, variant, d, host);
    });
  });
}
async function hostRoom(tc, variant){
  cancelSearch();
  const me = searching = {cancelled: false, peers: []};
  searchUI(`<div class="spinner"></div><p class="note" style="text-align:center">Making a room...</p>`);
  try { await loadPeer(); } catch (e) { return searchFail("Couldn't load the multiplayer system."); }
  const code = Math.random().toString(36).slice(2, 8).toUpperCase();
  let host;
  try { host = await peerOpen("pongallstar-room-" + code); me.peers.push(host); } catch (e) { return searchFail("Couldn't make a room. Try again."); }
  const link = location.href.split("#")[0].split("?")[0] + "?room=" + code;
  searchUI(`<div class="lbl">Send this link to your friend</div><div class="code">${code}</div><div class="field"><input id="linkIn" readonly value="${link}"></div><button class="btn sm" id="copyBtn">Copy link</button><div class="spinner"></div><p class="note" style="text-align:center">Waiting for your friend to open it...</p><button class="btn sm" id="cancelBtn">Cancel</button>`);
  onClick("copyBtn", () => { navigator.clipboard && navigator.clipboard.writeText(link).then(() => toast("Link copied!")); $("linkIn").select(); });
  onClick("cancelBtn", () => { cancelSearch(); searchUI(""); });
  waitForGuest(host, tc, variant, me);
}
async function joinRoom(code){
  view("friend");
  searchUI(`<div class="spinner"></div><p class="note" style="text-align:center">Joining room ${esc(code)}...</p>`);
  try { await loadPeer(); } catch (e) { return searchFail("Couldn't load the multiplayer system."); }
  let mine; try { mine = await peerOpen(); } catch (e) { return searchFail("Couldn't reach the server."); }
  const res = await tryJoin(mine, "pongallstar-room-" + code, 8000);
  if (!res){ try { mine.destroy(); } catch (e) {} return searchFail("That room isn't open anymore. Ask your friend for a new link."); }
  beginNet(res.conn, "client", res.hello.tc || "blitz", res.hello.variant || "classic", res.hello, mine);
}
function beginNet(conn, role, tc, variant, hello, peer){
  net = {conn, role, peer, lastRecv: Date.now(), acc: 0, sent: 0, tc, variant, oppHello: hello, mine: false, theirs: false};
  conn.on("data", d => onNet(d));
  conn.on("close", () => { if (G && G.o.net === net && !G.over){ G.finish(meSide(), "abandoned"); } toast("Your opponent left."); });
  startNetGame();
  toast("Matched with " + String(hello.name || "Opponent") + " (" + (+hello.rating || 800) + ")!");
}
function startNetGame(){
  const opp = {name: String(net.oppHello.name || "Opponent").slice(0, 18), rating: +net.oppHello.rating || 800, icon: "🧑", ctrl: "remote", tag: "Online"};
  const me = {...human(), rating: P.ratings[net.tc]};
  const players = net.role === "host" ? [me, opp] : [opp, me];
  net.sent = 0; net.mine = net.theirs = false;
  startGame({tc: net.tc, variant: net.variant, rated: true, kind: "online", net, players});
}
function rematchOnline(){ if (!net) return; net.mine = true; netSend2({t: "rematch"}); toast("Rematch offered. Waiting for your opponent..."); tryRestart(); }
function tryRestart(){ if (net && net.mine && net.theirs && net.role === "host"){ netSend2({t: "restart"}); startNetGame(); } }
function netSend2(m){ try { net && net.conn.open && net.conn.send(m); } catch (e) {} }
function netTick(dt){
  if (!net || !G) return;
  if (net.role === "client" && !G.over){
    const r = G.br();
    for (const b of G.balls){ b.x += b.vx * dt; b.y += b.vy * dt; if (b.x < r){ b.x = r; b.vx = Math.abs(b.vx); } if (b.x > 1 - r){ b.x = 1 - r; b.vx = -Math.abs(b.vx); } }
    applyInput();
    const half = G.padW(1) / 2, p = G.pads[1];
    p.tx = clamp(p.tx, half, 1 - half); p.x += clamp(p.tx - p.x, -3.6 * dt, 3.6 * dt);
  }
  if (Date.now() - net.lastRecv > 20000 && !G.over){ G.finish(meSide(), "abandoned"); }
  net.acc += dt;
  if (net.acc < 1 / 30) return;
  net.acc = 0;
  if (net.role === "host"){
    if (G.over && net.sentOver) return;
    netSend2({t: "s", b: G.balls.map(b => [+b.x.toFixed(4), +b.y.toFixed(4), +b.vx.toFixed(3), +b.vy.toFixed(3)]), p: [G.pads[0].x, G.pads[1].x], sc: G.score, c: Math.round(G.clock * 10) / 10, st: G.state, tm: G.timer, pts: G.points,
      m: Object.keys(G.mods), scl: G.scale, sh: G.shrink, bk: G.bricks.map(k => k.on ? 1 : 0).join(""), wd: +G.wind.toFixed(3), lg: G.log.slice(net.sent), ov: G.over ? [G.winner, G.reason] : null});
    net.sent = G.log.length;
    if (G.over) net.sentOver = true;
  } else if (!G.over){
    netSend2({t: "x", x: G.pads[1].tx});
  }
}
function onNet(d){
  if (!net || !d) return;
  net.lastRecv = Date.now();
  if (d.t === "rematch"){ net.theirs = true; toast(G ? G.o.players[1 - meSide()].name + " wants a rematch!" : "Rematch?"); tryRestart(); return; }
  if (d.t === "restart" && net.role === "client"){ net.sentOver = false; startNetGame(); return; }
  if (!G) return;
  if (d.t === "x" && net.role === "host"){ G.pads[1].tx = clamp(+d.x || .5, 0, 1); }
  else if (d.t === "s" && net.role === "client"){
    if (G.over) return;
    G.balls = d.b.map(a => ({x: a[0], y: a[1], vx: a[2], vy: a[3]}));
    G.pads[0].x = d.p[0];
    const prevScore = G.score.join();
    G.score = d.sc; G.clock = d.c; G.state = d.st; G.timer = d.tm; G.points = d.pts;
    G.mods = Object.fromEntries((d.m || []).map(k => [k, 1])); G.scale = d.scl || G.scale; G.shrink = d.sh || G.shrink; G.wind = d.wd || 0;
    if (G.mods.bricks){ if (G.bricks.length !== (d.bk || "").length) G.bricks = G.makeBricks(); G.bricks.forEach((k, i) => { k.on = d.bk[i] === "1"; }); }
    for (const e of d.lg || []){ G.log.push(e); if (e.side != null){ SFX.hit(); G.stats.hits[e.side]++; G.stats.longest = Math.max(G.stats.longest, e.r || 0); G.stats.top = Math.max(G.stats.top, e.sp || 0); } }
    if (prevScore !== G.score.join()){ SFX.point(); G.flash = 1; }
    G.recordNow();
    if (d.ov && !G.over) G.finish(d.ov[0], d.ov[1]);
  } else if (d.t === "resign" && !G.over){ G.finish(meSide(), "resignation"); }
  else if (d.t === "drawoffer" && !G.over){
    const box = $("offerBox"); if (!box) return;
    box.innerHTML = `<div class="offer">½ ${esc(G.o.players[1 - meSide()].name)} offers a draw <span style="flex:1"></span><button class="btn go" id="dAcc">Accept</button><button class="btn" id="dDec">Decline</button></div>`;
    $("dAcc").onclick = () => { box.innerHTML = ""; if (net.role === "host") G.finish(-1, "agreement"); else netSend2({t: "drawaccept"}); };
    $("dDec").onclick = () => { box.innerHTML = ""; netSend2({t: "drawdecline"}); };
  }
  else if (d.t === "drawaccept" && net.role === "host" && !G.over){ G.finish(-1, "agreement"); }
  else if (d.t === "drawdecline"){ toast("Draw declined."); }
}
// a heartbeat on a timer keeps going even when the tab is in the background, so a quick tab switch never counts as leaving
setInterval(() => { if (net && net.conn && net.conn.open) netSend2({t: "hb"}); }, 1000);
function netClose(){ try { net && net.conn.close(); } catch (e) {} try { net && net.peer && net.peer.destroy(); } catch (e) {} net = null; }

//  Bits and pieces

let toastT = 0;
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2800); }
function renderMe(){ $("meBox").innerHTML = `<b>🙂 ${esc(P.name)}</b><div class="r"><span>🚀 ${P.ratings.bullet}</span><span>⚡ ${P.ratings.blitz}</span><span>🕒 ${P.ratings.rapid}</span><span>🧩 ${P.puzzle}</span></div>`; }

renderMe(); renderBars(); fit(); view("home");
const room = new URLSearchParams(location.search).get("room");
if (room) joinRoom(room.replace(/[^A-Za-z0-9]/g, "").slice(0, 8).toUpperCase());
requestAnimationFrame(loop);
