# The kai.fun Random Newsletter: once a day this wakes up and, on random days only, sends a random email
# to everyone subscribed on Buttondown (see newsletter/send.py and VISITS_SETUP.md).
name: Random newsletter
on:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send one right now (skip the dice roll)'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Maybe send a random email
        run: python newsletter/send.py
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
