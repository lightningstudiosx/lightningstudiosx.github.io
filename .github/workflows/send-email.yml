# Write your own kai.fun newsletter email: Actions → "Send an email" → Run workflow.
# Leave "send now" unticked to make a draft you can preview at https://buttondown.com/emails first.
# Only people who can run this repository's Actions (you) can send. The Buttondown key stays a secret.
name: Send an email
on:
  workflow_dispatch:
    inputs:
      subject:
        description: 'Subject line'
        type: string
        required: true
      message:
        description: 'Your message (type \n for a new line; **bold** and links like [kai.fun](https://kaifun.fun) work)'
        type: string
        required: true
      add_game:
        description: 'Add a random kai.fun game at the bottom'
        type: boolean
        default: true
      send_now:
        description: 'SEND NOW to every subscriber (leave unticked to save a draft you can check first)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send your email
        run: python newsletter/send.py
        env:
          MODE: custom
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SUBJECT: ${{ inputs.subject }}
          MESSAGE: ${{ inputs.message }}
          ADD_GAME: ${{ inputs.add_game && '1' || '' }}
          SEND_NOW: ${{ inputs.send_now && '1' || '' }}
