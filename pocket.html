<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Ecosystem</title>
<meta name="description" content="A sealed glass jar ecosystem. Change one thing at a time and keep it alive for 100 days.">
<meta name="theme-color" content="#f3ead6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,600;1,9..144,800&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f3ead6; --card: #fbf6ea; --card2: #f5eddb; --ink: #2b2418; --ink2: #5a4e3c; --muted: #8a7c64;
  --moss: #557a36; --leaf: #7fa64a; --terra: #c4623a; --brass: #c9922c; --water: #4f8fa6; --bad: #c2452f; --good: #4f8a3a;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 15px/1.45 var(--body); min-height: 100vh; overflow-x: hidden;
  background:
    linear-gradient(rgba(43,36,24,.05) 1px, transparent 1px) 0 0 / 26px 26px,
    linear-gradient(90deg, rgba(43,36,24,.05) 1px, transparent 1px) 0 0 / 26px 26px,
    radial-gradient(ellipse at 20% 0%, #f8f1e1, transparent 60%),
    var(--paper);
}
button { font: inherit; color: inherit; }
.home { position: fixed; z-index: 30; left: max(16px, env(safe-area-inset-left)); top: calc(env(safe-area-inset-top, 0px) + 14px); font: 600 12px var(--body); color: var(--ink); text-decoration: none; padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card); box-shadow: 3px 3px 0 var(--ink); }
.home:hover { background: #fff; }
.home:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }

.app { max-width: 1520px; margin: 0 auto; padding: 0 16px 28px; }
header.top { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; padding: 12px 0 12px 104px; min-height: 66px; }
.brand { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 900 34px/1 var(--display); letter-spacing: -.5px; }
.brand h1 em { font-style: italic; font-weight: 800; color: var(--moss); }
.brand p { margin: 0; font: 700 21px/1.1 var(--hand); color: var(--ink2); }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; cursor: pointer; border: 2px solid var(--ink); background: var(--card); border-radius: 10px; padding: 7px 12px; font: 600 13px/1.1 var(--body); box-shadow: 2px 2px 0 var(--ink); transition: transform .08s, box-shadow .08s, background .15s; }
.btn:hover { background: #fff; }
.btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--moss); color: #fbf6ea; }
.btn.primary:hover { background: #64893f; }

.grid { display: grid; gap: 16px; grid-template-columns: 290px minmax(0, 1fr) 340px; grid-template-areas: "cl stage cr"; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.cl { grid-area: cl; } .cr { grid-area: cr; }
.card { background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink); padding: 12px 14px 14px; min-width: 0; }
.card h2 { margin: 0 0 8px; font: 700 12px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card h2 .note { font: 700 17px/1 var(--hand); letter-spacing: 0; text-transform: none; color: var(--muted); }
#stage { grid-area: stage; padding: 0; overflow: hidden; position: relative; background: #3b4432; }

/* stage */
#scene { display: block; width: 100%; touch-action: manipulation; cursor: crosshair; }
.hud { position: absolute; top: 10px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud.l { left: 10px; } .hud.r { right: 10px; }
.daychip { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 4px 11px 6px; box-shadow: 2px 2px 0 var(--ink); min-width: 128px; }
.daychip b { font: 900 21px/1 var(--display); display: block; }
.daychip b span { font: 600 13px var(--body); color: var(--muted); }
.daychip small { font: 600 11.5px/1.2 var(--body); color: var(--ink2); white-space: nowrap; }
.dayline { height: 5px; border-radius: 3px; background: #e5dac2; margin-top: 4px; overflow: hidden; border: 1px solid rgba(43,36,24,.35); }
.dayline i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--leaf), var(--moss)); }
.speed { display: flex; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 2px 2px 0 var(--ink); overflow: hidden; }
.speed button { appearance: none; border: 0; background: transparent; padding: 7px 10px; font: 700 13px/1 var(--body); cursor: pointer; min-width: 38px; min-height: 34px; }
.speed button + button { border-left: 1.5px solid rgba(43,36,24,.3); }
.speed button.on { background: var(--ink); color: var(--card); }
.speed svg { width: 12px; height: 12px; display: block; margin: 0 auto; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--card); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink); padding: 7px 10px 8px; max-width: 230px; font-size: 12.5px; line-height: 1.35; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
.tip.show { opacity: 1; transform: none; }
.tip.dock { left: 8px; right: 8px; bottom: 8px; top: auto; max-width: none; padding: 6px 10px 7px; font-size: 12px; }
.tip.dock .bl { display: none; }
.tip.dock b { font-size: 14px; }
.tip.dock .bars { grid-template-columns: auto 1fr auto 1fr; margin-top: 3px; }
.tip b { font: 800 15px/1.15 var(--display); display: block; }
.tip i { font-style: normal; color: var(--muted); font-size: 11.5px; }
.tip .bars { display: grid; grid-template-columns: auto 1fr; gap: 2px 7px; align-items: center; margin-top: 5px; font-size: 11px; color: var(--ink2); }
.tip .bar { height: 6px; border-radius: 3px; background: #e7ddc7; overflow: hidden; }
.tip .bar i { display: block; height: 100%; background: var(--good); }
.tip .st { color: var(--bad); font-weight: 600; }
.pausedTag { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font: 700 22px/1 var(--hand); color: #fbf6ea; background: rgba(43,36,24,.72); padding: 5px 14px 7px; border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity .2s; }
.pausedTag.show { opacity: 1; }

/* controls */
.lampbox { background: var(--card2); border: 1.5px solid rgba(43,36,24,.25); border-radius: 12px; padding: 9px 10px 10px; margin-bottom: 10px; position: relative; }
.lampbox label { display: flex; justify-content: space-between; font: 600 12.5px var(--body); color: var(--ink2); margin-top: 2px; }
.lampbox label output { font-weight: 700; color: var(--ink); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0 0 2px; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #3a3326, #f1c75a); border: 1.5px solid var(--ink); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #3a3326, #f1c75a); border: 1.5px solid var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink); margin-top: -8.5px; box-shadow: 1px 1px 0 var(--ink); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 2px solid var(--ink); }
#hrs::-webkit-slider-runnable-track { background: repeating-linear-gradient(90deg, #e9dfc7 0 calc(100% / 24 - 1px), rgba(43,36,24,.35) calc(100% / 24 - 1px) calc(100% / 24)); }
input[type=range]:disabled { opacity: .45; cursor: not-allowed; }
.lampnote { font: 700 16px/1.1 var(--hand); color: var(--muted); margin-top: 2px; min-height: 18px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act { position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 9px; min-height: 52px; }
.act svg { width: 26px; height: 26px; flex: none; }
.act span { display: block; min-width: 0; }
.act strong { display: block; font: 700 13px/1.15 var(--body); }
.act small { display: block; font: 500 11px/1.2 var(--body); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act::after, .mini::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--cd, 0%); background: rgba(43,36,24,.13); pointer-events: none; }
.act:disabled, .mini:disabled { cursor: not-allowed; box-shadow: 0 0 0 var(--ink); transform: translate(2px, 2px); background: var(--card2); }
.act:disabled strong { color: var(--ink2); }
.hint { font: 700 17px/1.15 var(--hand); color: var(--ink2); margin: 10px 2px 0; }

/* shelf */
.shelfgrp { font: 700 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 6px 0 4px; display: flex; justify-content: space-between; }
.shelfgrp span { letter-spacing: 0; text-transform: none; font: 600 11px var(--body); }
.sp { display: grid; grid-template-columns: 40px 1fr auto auto; align-items: center; gap: 4px 8px; padding: 4px 0; border-top: 1px dashed rgba(43,36,24,.2); }
.sp:first-of-type { border-top: 0; }
.sp canvas { width: 40px; height: 40px; background: var(--card2); border-radius: 9px; border: 1.5px solid rgba(43,36,24,.3); }
.sp .nm { min-width: 0; }
.sp .nm b { display: block; font: 700 13px/1.15 var(--body); }
.sp .nm small { display: block; font: 500 11px/1.2 var(--body); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp .ct { font: 800 17px var(--display); min-width: 26px; text-align: right; }
.sp .ct.zero { color: #b9ab90; }
.pm { display: flex; gap: 4px; }
.mini { position: relative; overflow: hidden; appearance: none; cursor: pointer; width: 32px; height: 32px; border: 2px solid var(--ink); background: var(--card); border-radius: 9px; font: 800 17px/1 var(--body); box-shadow: 2px 2px 0 var(--ink); padding: 0; }
.mini:hover { background: #fff; }
.mini.add { background: #e3eccd; }
.mini:active { transform: translate(2px, 2px); box-shadow: none; }
.cdline { font: 600 11px var(--body); color: var(--muted); margin-top: 6px; min-height: 15px; }

/* gauges */
.gs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 8px; }
.g { text-align: center; }
.g svg { width: 100%; max-width: 98px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.g .v { font: 800 15px/1 var(--display); margin-top: -4px; }
.g .v.badv { color: var(--bad); }
.g .lb { font: 600 10.5px/1.2 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.verdict { margin-top: 8px; font: 700 18px/1.15 var(--hand); color: var(--ink2); min-height: 21px; }

/* graph */
#graph { width: 100%; height: 150px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 6px; }
.legend button { appearance: none; cursor: pointer; border: 1.5px solid rgba(43,36,24,.3); background: var(--card2); border-radius: 999px; padding: 2px 8px 2px 6px; font: 600 11px/1.3 var(--body); display: flex; align-items: center; gap: 5px; }
.legend button i { width: 9px; height: 9px; border-radius: 50%; display: block; border: 1px solid rgba(0,0,0,.3); }
.legend button.off { opacity: .4; text-decoration: line-through; }

/* log */
#logCard { display: flex; flex-direction: column; }
#log { list-style: none; margin: 0; padding: 0 4px 0 0; overflow-y: auto; max-height: 260px; min-height: 120px; flex: 1; }
#log li { display: grid; grid-template-columns: 54px 1fr; gap: 6px; padding: 5px 0; border-top: 1px dashed rgba(43,36,24,.18); font-size: 13px; line-height: 1.3; animation: pop .35s ease-out; }
#log li:first-child { border-top: 0; }
#log li .d { font: 700 16px/1.05 var(--hand); color: var(--muted); }
#log li.act .t { color: var(--ink2); font-style: italic; }
#log li.death .t::before, #log li.birth .t::before, #log li.env .t::before, #log li.fungi .t::before, #log li.mile .t::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
#log li.death .t::before { background: var(--bad); } #log li.birth .t::before { background: var(--leaf); } #log li.env .t::before { background: var(--water); } #log li.fungi .t::before { background: #c9925a; } #log li.mile .t::before { background: var(--brass); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* modal */
.modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(27,23,16,.55); overflow-y: auto; }
.modal.show { display: flex; }
.sheet { position: relative; background: var(--card); border: 2.5px solid var(--ink); border-radius: 20px; box-shadow: 6px 6px 0 var(--ink); max-width: 560px; width: 100%; padding: 24px 24px 20px; margin: auto; overflow: hidden; }
.sheet h3 { margin: 0 0 4px; font: 900 34px/1.02 var(--display); letter-spacing: -.4px; }
.sheet h3 em { color: var(--moss); }
.sheet .sub { font: 700 22px/1.15 var(--hand); color: var(--ink2); margin: 0 0 12px; }
.sheet p { margin: 8px 0; }
.sheet ul { margin: 8px 0; padding-left: 20px; }
.sheet li { margin: 4px 0; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.sheet .row .btn { padding: 10px 16px; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin: 12px 0; }
.stats div { background: var(--card2); border: 1.5px solid rgba(43,36,24,.25); border-radius: 12px; padding: 7px 10px; }
.stats b { display: block; font: 800 22px/1.1 var(--display); }
.stats small { font: 600 11px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.why li { margin: 6px 0; }
.timeline { font: 700 18px/1.25 var(--hand); color: var(--ink2); }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 12px; height: 8px; border-radius: 0 80% 0 80%; animation: fall linear infinite; opacity: .85; }
@keyframes fall { to { transform: translateY(640px) rotate(540deg); } }
.how { display: grid; grid-template-columns: 28px 1fr; gap: 6px 10px; align-items: start; margin: 12px 0; }
.how .n { font: 900 20px/1.2 var(--display); color: var(--terra); }
.kbd { font: 600 11px var(--body); color: var(--muted); margin-top: 10px; }

@media (max-width: 1180px) {
  .grid { grid-template-columns: minmax(0, 1fr) 320px; grid-template-areas: "stage cr" "cl cl"; }
  .cl { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
  #log { max-height: 220px; }
}
@media (max-width: 760px) {
  header.top { padding: 52px 0 10px; min-height: 0; }
  .brand h1 { font-size: 30px; }
  .brand p { font-size: 19px; }
  .grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: none; gap: 14px; }
  .col, .cl { display: contents; }
  #stage { order: 1; } #gauges { order: 2; } #ctrl { order: 3; } #shelf { order: 4; } #graphCard { order: 5; } #logCard { order: 6; }
  #stage, #gauges, #ctrl, #shelf, #graphCard, #logCard { grid-area: auto; }
  .daychip { min-width: 0; padding: 3px 9px 5px; }
  .daychip b { font-size: 18px; }
  .speed button { padding: 6px 8px; min-width: 34px; }
  .sheet { padding: 20px 18px 18px; }
  .sheet h3 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } #log li { animation: none; } }
</style>
</head>
<body>
<a class="home" href="index.html">← kaifun</a>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Pocket <em>Ecosystem</em></h1>
      <p>keep a sealed jar alive for 100 days</p>
    </div>
    <div class="top-actions">
      <button class="btn" id="bHelp" type="button">How it works</button>
      <button class="btn" id="bSound" type="button" aria-pressed="false">Sound: off</button>
      <button class="btn primary" id="bNew" type="button">New random jar</button>
    </div>
  </header>

  <main class="grid">
    <section class="card" id="stage" aria-label="The jar">
      <canvas id="scene" role="img" aria-label="A glass jar terrarium with soil, moss, plants and small creatures"></canvas>
      <div class="hud l">
        <div class="daychip"><b id="dDay">Day 1 <span>/ 100</span></b><small id="dTime">08:00 · lamp on</small><div class="dayline"><i id="dProg"></i></div></div>
      </div>
      <div class="hud r">
        <div class="speed" role="group" aria-label="Speed">
          <button type="button" data-s="0" aria-label="Pause"><svg viewBox="0 0 12 12"><rect x="2" y="1.5" width="3" height="9" rx="1" fill="currentColor"/><rect x="7" y="1.5" width="3" height="9" rx="1" fill="currentColor"/></svg></button>
          <button type="button" data-s="1">1×</button>
          <button type="button" data-s="4">4×</button>
          <button type="button" data-s="16">16×</button>
        </div>
      </div>
      <div class="tip" id="tip"></div>
      <div class="pausedTag" id="pausedTag">paused</div>
    </section>

    <div class="col cl">
    <section class="card" id="ctrl">
      <h2>Make a change <span class="note">one at a time</span></h2>
      <div class="lampbox">
        <label for="bri">Grow lamp brightness <output id="briO">65%</output></label>
        <input type="range" id="bri" min="0" max="100" step="5" value="65">
        <label for="hrs">Lamp hours per day <output id="hrsO">12 h</output></label>
        <input type="range" id="hrs" min="0" max="24" step="1" value="12">
        <div class="lampnote" id="lampNote">on 07:00 – 19:00</div>
      </div>
      <div class="acts">
        <button class="btn act" id="aWater" type="button"><svg viewBox="0 0 26 26" fill="none" stroke="#2b2418" stroke-width="1.8" stroke-linejoin="round"><path d="M13 3 C13 3 6 11 6 15.5 A7 7 0 0 0 20 15.5 C20 11 13 3 13 3 Z" fill="#9ccbdb"/><path d="M9.5 15.5 A3.5 3.5 0 0 0 12.5 19" stroke="#fff" stroke-linecap="round"/></svg><span><strong>Drip water</strong><small id="aWaterS">soak the soil</small></span></button>
        <button class="btn act" id="aMist" type="button"><svg viewBox="0 0 26 26" fill="none" stroke="#2b2418" stroke-width="1.8" stroke-linejoin="round"><rect x="13" y="9" width="9" height="14" rx="2.5" fill="#e3eccd"/><path d="M15 9 V6 H20 V9" fill="#c9922c"/><path d="M15 6 H11" stroke-linecap="round"/><g fill="#9ccbdb" stroke="none"><circle cx="7" cy="5" r="1.4"/><circle cx="4" cy="8" r="1.2"/><circle cx="8" cy="9" r="1.1"/><circle cx="4.5" cy="3" r="1"/></g></svg><span><strong>Mist</strong><small id="aMistS">humid air</small></span></button>
        <button class="btn act" id="aLid" type="button"><svg viewBox="0 0 26 26" fill="none" stroke="#2b2418" stroke-width="1.8" stroke-linejoin="round"><path d="M7 9 L19 9 L18 21 L8 21 Z" fill="#d4a26a"/><ellipse cx="13" cy="9" rx="6" ry="2.2" fill="#e8c08a"/><g fill="#9b6c3c" stroke="none"><circle cx="11" cy="14" r=".9"/><circle cx="15" cy="17" r=".9"/><circle cx="12" cy="18.5" r=".7"/></g></svg><span><strong id="aLidT">Open lid</strong><small id="aLidS">let air in</small></span></button>
        <button class="btn act" id="aTrim" type="button"><svg viewBox="0 0 26 26" fill="none" stroke="#2b2418" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="19" r="3.3" fill="#e3eccd"/><circle cx="15" cy="21" r="3.3" fill="#e3eccd"/><path d="M9.5 16.8 L21 4 M12.6 18.4 L17 4.5"/></svg><span><strong>Trim plant</strong><small id="aTrimS">tap a plant first</small></span></button>
      </div>
      <p class="hint" id="hint">Tip: tap anything in the jar to inspect it.</p>
    </section>

    <section class="card" id="shelf">
      <h2>Packets &amp; vials <span class="note">add · remove</span></h2>
      <div class="shelfgrp">Plants <span id="plantCap"></span></div>
      <div id="shelfPlants"></div>
      <div class="shelfgrp">Critters</div>
      <div id="shelfCrit"></div>
      <div class="cdline" id="shelfCd"></div>
    </section>
    </div>

    <div class="col cr">
    <section class="card" id="gauges">
      <h2>Jar health <span class="note" id="tempNote"></span></h2>
      <div class="gs" id="gs"></div>
      <div class="verdict" id="verdict"></div>
    </section>

    <section class="card" id="graphCard">
      <h2>Populations <span class="note">by day</span></h2>
      <canvas id="graph"></canvas>
      <div class="legend" id="legend"></div>
    </section>

    <section class="card" id="logCard">
      <h2>Field notes <span class="note" id="logCount"></span></h2>
      <ul id="log" aria-live="polite"></ul>
    </section>
    </div>
  </main>
</div>

    let worst = 0, cause = '';
    const s = (v, c) => { if (v > worst) { worst = v; cause = c; } };
    if (e.hum < .5) s((.5 - e.hum) * .03, 'dried out');
    if (e.temp > 31) s((e.temp - 31) * .012, 'heat');
    if (light > .9 && e.hum < .7) s(.005, 'scorching light');
    if (worst > .002) { m.health -= worst; m.stress = cause; } else { m.health = Math.min(1, m.health + .015); m.stress = ''; }
    const shed = .00025 * m.cover; m.cover -= shed; m.drop = (m.drop || 0) + shed * .35;
    if (m.drop > .015) { addDet(m.x + rand(-m.w / 3, m.w / 3), 'leaf', m.drop); m.drop = 0; }
    if (m.health < .3) { const loss = Math.min(m.cover, .004); m.cover -= loss; if (Math.random() < .2) addDet(m.x + rand(-20, 20), 'leaf', loss * 2 + .004); }
    if (m.health <= 0 || m.cover < .02) {
      S.moss.splice(i, 1); bump(S.stats.deaths, cause || 'grazing');
      logOnce('mossdie', 48, `A moss patch ${cause === 'dried out' ? 'crisped up and crumbled' : cause === 'heat' ? 'cooked under the lamp' : 'was grazed down to bare soil'}.`, 'death');
      continue;
    }
    if (m.cover > .85 && m.health > .7 && S.moss.length < 8 && Math.random() < .004) {
      const x = freeMoss(); if (x != null && Math.abs(x - m.x) < 140) { addMoss(x, .08); logOnce('mossspread', 72, 'The moss crept outward and started a new cushion.', 'birth'); }
    }
  }

  // --- algae in the pool ---
  if (e.pool > .05) {
    const g = .025 * light * (e.nut / (e.nut + .2)) * cF * (1 - e.algae);
    e.algae = clamp(e.algae + g - .0025 * e.algae);
    dCO2 -= g * .3 * K; e.nut -= g * .02;
  } else e.algae *= .98;

  // --- decomposition, mycelium, mushrooms ---
  let detTot = 0; for (const d of S.det) detTot += d.m;
  e.myc = clamp(e.myc + .012 * ((detTot + e.humus * .015) / (detTot + e.humus * .015 + .08)) * ss(.5, .75, e.hum) * moist * (1 - e.myc) - .004 * e.myc);
  for (let i = S.det.length - 1; i >= 0; i--) {
    const d = S.det[i]; d.age++;
    const rate = .0035 * moist * tf * (1 + 3 * e.myc) * (d.kind === 'corpse' ? 1.3 : 1);
    const dm = Math.min(d.m, d.m * rate + .00004);
    d.m -= dm; e.nut += dm * .25; e.humus += dm * .2; dCO2 += dm * .3 * K;
    if (d.m < .0015) S.det.splice(i, 1);
  }
  const dh = e.humus * .0005 * moist * tf; e.humus -= dh; e.nut += dh * .2; e.nut -= e.nut * .0008; dCO2 += dh * .65 * K;
  if (S.shrooms.length < 9 && e.hum > .68 && Math.random() < .03 * (.15 + e.myc) * ss(.68, .9, e.hum) * (1 + detTot * 8)) {
    const host = S.det.length && Math.random() < .8 ? pick(S.det) : null;
    const x = host ? host.x + rand(-6, 6) : rand(222, 578);
    if (!inWater(x)) {
      const kinds = ['tan', 'tan', 'rust', 'ink', 'glow'];
      S.shrooms.push({ id: nid(), x: clamp(x, 214, 586), z: host ? host.z : rand(.1, .9), size: .05, age: 0, life: rand(36, 70), kind: pick(kinds), seed: (Math.random() * 1e9) | 0 });
      S.stats.shrooms++;
      if (!S.flags.firstShroom) { S.flags.firstShroom = 1; logEv('The first mushroom pushed up through the soil. Rot is being recycled.', 'fungi'); }
      else if (S.shrooms.length >= 6) logOnce('shroomring', 96, `${S.shrooms.length} mushrooms at once: the fungi are feasting.`, 'fungi');
    }
  }
  for (let i = S.shrooms.length - 1; i >= 0; i--) {
    const s = S.shrooms[i]; s.age += e.hum < .5 ? 2.5 : 1;
    if (s.age < s.life) s.size = Math.min(1, s.size + .05);
    else s.size -= .05;
    // mushrooms digest nearby litter quickly
    for (const d of S.det) if (Math.abs(d.x - s.x) < 22) { const dm = Math.min(d.m, .0015 * s.size); d.m -= dm; e.nut += dm * .6; dCO2 += dm * .3 * K; }
    if (s.size <= 0) { S.shrooms.splice(i, 1); addDet(s.x, 'leaf', .006); }
  }

  // --- critters ---
  const live = { spr: prev.spr, iso: prev.iso, snail: prev.snail, spider: prev.spider, fly: prev.fly };
  const born = [], dead = [];
  for (const c of S.crit) {
    const sp = CR[c.sp]; c.age++;
    const tfm = .6 + e.temp / 40;
    c.e -= sp.met * tfm;
    if (c.sp === 'spider') hunt(c, live, dead);
    else if (c.e < .92) { const want = sp.intake * (c.e < .5 ? 1.25 : .85); const got = eat(c, want); c.e += got * sp.conv; }
    c.e = Math.min(1, c.e);
    dCO2 += sp.resp * K * tfm;
    let worst = 0, cause = '';
    const s = (v, k) => { if (v > worst) { worst = v; cause = k; } };
    if (e.hum < sp.humMin) s((sp.humMin - e.hum) * sp.dryS, 'dried out');
    if (e.o2 < 16) s((16 - e.o2) * .025, 'suffocated');
    if (e.co2 > 4000) s((e.co2 - 4000) / 30000, 'CO₂ poisoning');
    if (e.temp > 30.5) s((e.temp - 30.5) * .03, 'overheated');
    if (e.temp < 8) s((8 - e.temp) * .02, 'chilled');
    if (c.sp === 'iso' && e.soil > .97) s(.02, 'drowned');
    if (c.sp === 'iso' && e.soil < .22) s(.012, 'dried out');
    if (worst > .003) { c.hp -= worst; c.stress = cause; } else { c.stress = ''; if (c.e > .2) c.hp = Math.min(1, c.hp + .03); }
    if (c.dead) continue;
    if (c.hp <= 0) { c.dead = cause || 'stress'; dead.push(c); continue; }
    if (c.e <= 0) { c.dead = 'starved'; dead.push(c); continue; }
    if (c.age > c.life) { c.dead = 'old age'; dead.push(c); continue; }
    if (!S.lid && c.sp === 'fly' && Math.random() < .07) { c.dead = 'escaped'; dead.push(c); continue; }
    if (!S.lid && c.sp === 'snail' && c.mode === 'glass' && c.y < 330 && Math.random() < .03) { c.dead = 'escaped'; dead.push(c); continue; }
    // breeding
    const n = live[c.sp];
    if (c.age > sp.mature && c.e > .6 && n < sp.cap && (!sp.pair || n >= 2) && c.hp > .7 && Math.random() < sp.breed * (1 - n / sp.cap)) {
      const k = rint(sp.brood[0], sp.brood[1]);
      for (let j = 0; j < k && live[c.sp] < sp.cap; j++) { born.push([c.sp, c]); live[c.sp]++; }
      c.e -= sp.cost;
    }
  }
  for (const c of dead) {
    const i = S.crit.indexOf(c); if (i >= 0) S.crit.splice(i, 1);
    live[c.sp] = Math.max(0, live[c.sp] - 1);
    if (c.dead === 'escaped') {
      if (c.sp === 'snail') logEv(`${c.name} the snail climbed out of the open jar and set off across the desk.`, 'death');
      else logOnce('flyescape', 24, 'Some fruit flies escaped through the open top.', 'act');
      continue;
    }
    bump(S.stats.deaths, c.dead);
    if (c.dead !== 'eaten by a spider') addDet(c.x, 'corpse', CR[c.sp].corpse, { sp: c.sp, dir: c.dir, z: c.z });
    if (c.name) logEv(`${c.name} the ${c.sp === 'snail' ? 'snail' : 'spider'} died (${c.dead}).`, 'death');
  }
  for (const [sp, parent] of born) {
    const b = addCrit(sp, parent, false); b.age = 0; b.e = .55;
    if (sp === 'spider') { b.wx = parent.wx; b.wy = parent.wy; b.wr = parent.wr; b.x = parent.x; b.y = parent.y; }
    S.stats.births++;
    if (!S.flags.pop['born_' + sp]) { S.flags.pop['born_' + sp] = 1; if (sp === 'snail') logEv(`A baby snail hatched! (${b.name})`, 'birth'); else if (sp === 'spider') logEv(`Spiderlings! ${b.name} is the first of a new generation.`, 'birth'); else if (sp === 'iso') logEv('Tiny pale baby woodlice appeared under the leaf litter.', 'birth'); }
    if (Math.random() < .3) plink(rand(660, 990), .05);
  }

  // --- gases ---
  e.co2 = clamp(e.co2 + dCO2, 40, 30000);
  e.o2 = clamp(e.o2 - dCO2 * O2K, 2, 21.5);
  e.nut = clamp(e.nut, 0, 1.2);

  // --- stress bookkeeping (for the end-of-game diagnosis) ---
  if (e.hum < .45) st.dry++; if (e.temp > 30) st.hot++; if (e.co2 > 4000) st.stuffy++; if (e.o2 < 16) st.lowo2++;
  if (e.soil > .92) st.flood++; if (e.soil < .25) st.drought++; if (e.co2 < 160) st.lowco2++; if (e.nut < .06) st.lownut++; if (!S.lid) st.lid++;
  if (tod === 0) { if (S.stats.dli < 2.4) st.dark += 24; S.stats.dli = 0; }

  events(prev, counts());
  if (S.hour % 6 === 0) recordHist();
  trackPeaks();
  checkEnd();
  if (S.hour % 6 === 0) save();
}

function bump(o, k, n = 1) { o[k] = (o[k] || 0) + n; }

function eat(c, want) {
  const sp = CR[c.sp], e = S.env; let got = 0;
  for (const [src, pref] of sp.diet) {
    if (got >= want) break;
    let need = (want - got) * pref;
    if (need <= 0) continue;
    if (src === 'fungi') {
      const avail = Math.max(0, e.myc - .06) * .3 + S.shrooms.reduce((a, s) => a + s.size * .03, 0);
      const take = Math.min(need, avail * .02);
      if (take > 0) { e.myc = Math.max(0, e.myc - take / .3 * .7); for (const s of S.shrooms) s.size = Math.max(0, s.size - take * 2); got += take; }
    } else if (src === 'det') {
      if (!S.det.length) continue;
      const d = S.det[Math.floor(Math.random() * S.det.length)];
      const take = Math.min(need, d.m * .5); d.m -= take; got += take; e.nut += take * .2;
    } else if (src === 'algae') {
      const take = Math.min(need, e.algae * .4 * .05); e.algae -= take / .4; got += take;
    } else if (src === 'moss') {
      if (c.e > .45 && c.sp !== 'spr') continue;
      const m = S.moss.length ? pick(S.moss) : null; if (!m) continue;
      const take = Math.min(need, m.cover * .35 * .05); m.cover -= take / .35; got += take;
    } else if (src === 'plant') {
      if (c.sp === 'iso' && c.e > .3) continue;
      const opts = S.plants.filter(p => !p.dead && p.bm > .01);
      if (!opts.length) continue;
      let tot = 0; for (const p of opts) tot += PL[p.sp].pal * (p.bm + .05);
      let r = Math.random() * tot, p = opts[0];
      for (const o of opts) { r -= PL[o.sp].pal * (o.bm + .05); if (r <= 0) { p = o; break; } }
      const take = Math.min(need, p.bm * .3);
      p.bm -= take; got += take; e.nut += take * .15;
      p.lastEater = c.name || CR[c.sp].name.toLowerCase(); p.lastEaterH = S.hour; p.lastEaterSp = c.sp;
      if (c.sp === 'snail') c.munch = p.id;
    }
  }
  return got;
}

function hunt(c, live, dead) {
  if (c.e > .85) return;
  const prey = S.crit.filter(o => (o.sp === 'spr' || o.sp === 'fly') && !o.dead);
  if (!prey.length) return;
  const p = .07 * prey.length / (prey.length + 6);
  if (Math.random() < p) {
    const flies = prey.filter(o => o.sp === 'fly');
    const v = flies.length && Math.random() < .55 ? pick(flies) : pick(prey);
    v.dead = 'eaten by a spider'; dead.push(v);
    c.e = Math.min(1, c.e + (v.sp === 'fly' ? .34 : .26));
    c.pounce = 1.2; c.px = v.x; c.py = v.y;
    S.stats.eaten++;
    S.flags.catches = (S.flags.catches || 0) + 1;
    if (S.flags.catches === 1) logEv(`${c.name} the spider caught its first ${v.sp === 'fly' ? 'fruit fly' : 'springtail'}.`, 'death');
    else if (S.flags.catches % 25 === 0) logEv(`${c.name} and co. have now eaten ${S.flags.catches} small things.`, 'death');
  }
}

function killPlant(p, cause) {
  p.dead = true; p.cause = cause; p.health = 0;
  bump(S.stats.deaths, cause);
  const nm = PL[p.sp].name;
  const left = S.plants.filter(o => !o.dead && o.sp === p.sp).length;
  if (cause === 'eaten') {
    const who = p.lastEaterSp === 'snail' ? `${p.lastEater} the snail` : `the ${p.lastEater}`;
    logEv(left ? `${cap(who)} chewed a ${nm} down to the stem.` : `${cap(who)} ate the last of the ${nm}.`, 'death');
  } else {
    const why = { drought: 'it dried out', 'root rot': 'its roots rotted in soggy soil', 'dry air': 'the air was too dry', heat: 'it cooked under the lamp', cold: 'it got too cold', 'scorching light': 'the light scorched it', darkness: 'it starved in the dark', 'CO₂ starvation': 'it ran out of CO₂ to breathe in', 'nutrient hunger': 'the soil ran out of nutrients', starvation: 'it could not make enough food' }[cause] || cause;
    logEv(`A ${nm} died: ${why}.${left ? '' : ` That was the last ${nm}.`}`, 'death');
  }
  plink(220, .06, 1.2);
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------------- events / log ---------------- */
function logEv(text, cat = 'env') {
  S.log.unshift({ d: dayNum(), t: text, c: cat });
  if (S.log.length > 80) S.log.length = 80;
  logDirty = true;
}
function logOnce(key, hours, text, cat) {
  const w = S.flags.warn; if (w[key] && S.hour - w[key] < hours) return false;
  w[key] = S.hour; logEv(text, cat); return true;
}
function events(a, b) {
  const e = S.env, F = S.flags.pop;
  const crit = [['spr', 'springtail', 'springtails'], ['iso', 'woodlouse', 'woodlice'], ['snail', 'snail', 'snails'], ['spider', 'spider', 'spiders'], ['fly', 'fruit fly', 'fruit flies']];
  for (const [k, one, many] of crit) {
    if (a[k] > 0 && b[k] === 0) {
      logEv(`The last ${one} is gone. No more ${many} in the jar.`, 'death');
      S.stats.extinct.push({ d: dayNum(), what: many });
    }
    const lv = [10, 25, 50, 80];
    for (const t of lv) if (a[k] < t && b[k] >= t && !F[k + t] && (k === 'spr' || k === 'fly' || t <= 10)) {
      F[k + t] = 1;
      logEv(k === 'fly' ? `Fruit fly boom: ${b[k]} buzzing around.` : `${cap(many)} are booming: ${b[k]} now.`, 'birth');
    }
  }
  if (a.plantN > 0 && b.plantN === 0) S.stats.extinct.push({ d: dayNum(), what: 'plants' });
  if (a.mossN > 0 && b.mossN === 0) { logEv('The last moss is gone.', 'death'); S.stats.extinct.push({ d: dayNum(), what: 'moss' }); }
  if (e.hum < .42) logOnce('dry', 72, 'The air is getting dry. The moss is turning crispy.', 'env');
  if (e.hum > .97 && e.cond > .01) logOnce('fog', 120, 'The glass fogged right up. Very tropical in here.', 'env');
  if (e.temp > 30.5) logOnce('hot', 48, `It is ${e.temp.toFixed(0)}°C under the lamp. Things are wilting.`, 'env');
  if (e.co2 > 3500) logOnce('stuffy', 72, 'The air is getting stuffy: CO₂ is piling up.', 'env');
  if (e.o2 < 16.5) logOnce('o2', 72, 'Oxygen is running low. The critters are gasping.', 'env');
  if (e.co2 < 170 && S.env.light > .2) logOnce('lowco2', 96, 'The plants have breathed in nearly all the CO₂. Growth is stalling.', 'env');
  if (e.soil > .93) logOnce('flood', 72, 'The soil is waterlogged. Roots hate wet feet.', 'env');
  if (e.soil < .22) logOnce('drysoil', 72, 'The soil has dried out.', 'env');
  if (e.algae > .75) logOnce('algae', 120, 'The pool has turned pea-soup green with algae.', 'env');
  if (e.nut < .06) logOnce('nut', 120, 'The soil is running out of nutrients.', 'env');
  for (const p of S.plants) if (!p.dead && p.sp === 'clover' && p.bm > .75 && p.health > .8 && !F['flower' + p.id]) { F['flower' + p.id] = 1; logEv('A Button clover put up a little white flower.', 'birth'); }
  for (const p of S.plants) if (!p.dead && p.sp === 'fern') { const nf = Math.min(9, 1 + Math.floor(p.bm * 4.5)); if (nf > (p.fr || 0)) { if (p.fr && nf >= 3) logOnce('frond' + p.id, 120, 'A Curlfern unrolled a new fiddlehead.', 'birth'); p.fr = nf; } }
  const d = dayNum(), h = S.hour - START_H;
  if (h % 24 === 0 && [10, 25, 50, 75, 90].includes(d - 1)) logEv(`${d - 1} days in. ${d - 1 === 50 ? 'Halfway there!' : d - 1 === 90 ? 'Ten days to go.' : 'Still breathing.'}`, 'mile');
}
function recordHist() {
  const n = counts();
  S.hist.push([S.hour, +(n.plants * 10).toFixed(1), +(n.moss * 10).toFixed(1), n.spr, n.iso, n.snail, n.spider, n.fly, n.shroom]);
  if (S.hist.length > 1200) S.hist.splice(0, S.hist.length - 1200);
  graphDirty = true;
}
function trackPeaks() {
  const n = counts(), P = S.stats.peak;
  for (const k of ['plantN', 'mossN', 'spr', 'iso', 'snail', 'spider', 'fly', 'shroom']) P[k] = Math.max(P[k] || 0, n[k]);
}
function aliveCount() { const n = counts(); return n.plantN + n.mossN + n.spr + n.iso + n.snail + n.spider + n.fly; }
function checkEnd() {
  if (S.over && !S.endless) return;
  if (aliveCount() === 0) {
    S.over = 'lost'; S.endless = false; S.endDay = dayNum(); setSpeed(0); save();
    setTimeout(showEnd, 900); plink(196, .08, 2); plink(147, .06, 2.6);
    logEv('Nothing is left alive. The jar has gone quiet.', 'death');
  } else if (!S.over && S.hour - START_H >= GOAL_DAYS * 24) {
    S.over = 'won'; S.endDay = GOAL_DAYS; setSpeed(0); save();
    logEv('100 days! The jar made it. Life finds a way, with a little help.', 'mile');
    celebrate(); setTimeout(showEnd, 1400);
  }
}

/* =====================================================================
   PLAYER ACTIONS
   ===================================================================== */
function ready(k) { return !(S.cd[k] > 0) && !(S.over && !S.endless); }
function useCd(k) { S.cd[k] = COOLDOWN[k]; S.stats.changes++; uiDirty = true; }
function uncork() { if (S.lid) corkAnim = 1.6; }
function doWater() {
  if (!ready('water')) return;
  const e = S.env; e.soil += .12; S.stats.waterAdded++;
  if (e.soil > 1) { e.pool += (e.soil - 1) / POOLV; e.soil = 1; }
  e.pool = Math.min(1, e.pool + .03);
  uncork(); dropperAnim = 1.8;
  for (let i = 0; i < 7; i++) fx.push({ t: 'drop', x: 400 + rand(-3, 3), y: 120, vy: 40, delay: i * .2 });
  useCd('water'); logEv('You dripped water in.' + (e.soil > .9 ? ' The soil is sodden now.' : ''), 'act');
  sfxDrip(); save();
}
function doMist() {
  if (!ready('mist')) return;
  const e = S.env; e.hum = Math.min(1, e.hum + .22); e.cond += .006; e.soil = Math.min(1, e.soil + .02);
  uncork(); mistAnim = 2;
  for (let i = 0; i < 40; i++) addDrop(true);
  useCd('mist'); logEv('You misted the jar. Fine droplets beaded on the glass.', 'act');
  sfxMist(); save();
}
function doLid() {
  if (!ready('lid')) return;
  S.lid = !S.lid; useCd('lid');
  logEv(S.lid ? 'You corked the jar again.' : 'You pulled the cork. Fresh air rushes in, humidity rushes out.', 'act');
  sfxCork(); save();
}
function doTrim() {
  if (!ready('trim')) return;
  let p = selected && selected.type === 'plant' ? S.plants.find(o => o.id === selected.id && !o.dead) : null;
  if (!p) p = S.plants.filter(o => !o.dead).sort((a, b) => b.bm - a.bm)[0];
  if (!p || p.bm < .12) { flashHint('Nothing big enough to trim yet.'); return; }
  const cut = p.bm * .4; p.bm -= cut; p.boost = 48;
  addDet(p.x + rand(-10, 10), 'clip', cut * .6); addDet(p.x + rand(-14, 14), 'clip', cut * .3);
  uncork();
  const top = plantTop(p);
  for (let i = 0; i < 14; i++) fx.push({ t: 'bit', x: p.x + rand(-20, 20), y: top + rand(0, 30), vx: rand(-20, 20), vy: rand(-30, 10), life: 1.6, col: PL[p.sp].sp === 'nerve' ? '#3f7a45' : '#5d9a3c' });
  useCd('trim'); logEv(`You trimmed the ${PL[p.sp].name}. The clippings will feed the decomposers.`, 'act');
  sfxSnip(); save();
}
function doAdd(kind) {
  if (!ready('add')) return;
  if (PL[kind]) {
    const x = freeSpot(40); if (x == null) { flashHint('No room for another plant. Trim or remove one first.'); return; }
    const p = addPlant(kind, x, .14);
    for (let i = 0; i < 12; i++) fx.push({ t: 'spark', x: x + rand(-10, 10), y: groundY(x, p.z) - rand(0, 20), life: rand(.8, 1.4) });
    logEv(`You planted a ${PL[kind].name} seedling.`, 'act');
  } else if (kind === 'moss') {
    const x = freeMoss(); if (x == null) { flashHint('The moss has no bare soil left to colonise.'); return; }
    addMoss(x, .25); logEv('You pressed in a plug of Cushion moss.', 'act');
  } else {
    const d = CR[kind]; const n = counts()[kind];
    if (n >= d.cap) { flashHint(`That's as many ${d.plural} as this jar can hold.`); return; }
    const k = Math.min(d.vial, d.cap - n); let names = [];
    for (let i = 0; i < k; i++) { const c = addCrit(kind, null, true, .3); if (c.name) names.push(c.name); }
    logEv(names.length ? `You tipped in a ${d.name.toLowerCase()} called ${names.join(' and ')}.` : `You tipped in a vial of ${k} ${d.plural}.`, 'act');
  }
  uncork(); useCd('add'); sfxCork(); save();
}
function doRemove(kind) {
  if (!ready('remove')) return;
  let done = '';
  if (PL[kind]) {
    const list = S.plants.filter(p => p.sp === kind);
    let p = selected && selected.type === 'plant' ? list.find(o => o.id === selected.id) : null;

function hitTest(x, y) {

  if (best) return best;
  for (const s of S.shrooms) { const sy = groundY(s.x, s.z) - 8; if (Math.abs(s.x - x) < 16 && Math.abs(sy - 6 - y) < 20) return { type: 'shroom', id: s.id }; }

  const ps = S.plants.slice().sort((a, b) => a.z - b.z);

  for (const p of ps) { const b = plantBox(p); if (x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3]) { const d = Math.abs(p.x - x); if (d < pd) { pd = d; pb = p; } } }

  if (inPoolX(x) && y > surf(T.pool.cx) - T.pool.depth - 12 && y < surf(T.pool.cx) + 4) return { type: 'pool' };
  if (y < J.b && x > J.l && x < J.r && y > surf(x) - 2) return { type: y > CHAR_B ? 'gravel' : y > SOIL_B ? 'charcoal' : 'soil' };

}

    master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
    // soft room tone: filtered noise
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = last * 3.2; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
    const g = AC.createGain(); g.gain.value = .05; src.connect(lp); lp.connect(g); g.connect(master); src.start();
    // lamp hum
    const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = 100;
    hum = AC.createGain(); hum.gain.value = 0; o.connect(hum); hum.connect(master); o.start();
  } catch (e) { AC = null; }
}
function plink(freq, vol = .04, dur = .5) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
  } catch (e) { }
}
function noiseBurst(dur, freq, vol, q = 1) {
  if (!AC || muted) return;
  try {
    const t = AC.currentTime, len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = AC.createBufferSource(); s.buffer = buf; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = AC.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(master); s.start(t);
  } catch (e) { }
}
function sfxDrip() { [0, 200, 400, 600, 800, 1000, 1200].forEach((ms, i) => setTimeout(() => { if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(1300 - i * 40, t); o.frequency.exponentialRampToValueAtTime(500, t + .12); g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.connect(g); g.connect(master); o.start(t); o.stop(t + .2); }, ms + 300)); }
function sfxMist() { noiseBurst(.5, 4000, .12, .7); setTimeout(() => noiseBurst(.4, 4500, .08, .7), 250); }
function sfxCork() { noiseBurst(.08, 600, .25, 2); plink(300, .05, .2); }
function sfxSnip() { noiseBurst(.05, 3200, .2, 3); setTimeout(() => noiseBurst(.05, 3600, .2, 3), 110); }
function sfxClick() { noiseBurst(.04, 1800, .15, 4); }

/* =====================================================================
   PERSISTENCE
   ===================================================================== */
function save() { try { if (S) localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function load() { try { const s = localStorage.getItem(KEY); if (!s) return null; const o = JSON.parse(s); return o && o.v === 1 && o.env && Array.isArray(o.plants) ? o : null; } catch (e) { return null; } }
function saveOpts() { try { localStorage.setItem(KEY_OPT, JSON.stringify({ muted, hidden: [...hidden] })); } catch (e) { } }
function loadOpts() { try { const o = JSON.parse(localStorage.getItem(KEY_OPT) || 'null'); if (o) { muted = o.muted !== false; (o.hidden || []).forEach(i => hidden.add(i)); } } catch (e) { } }
const randomSeed = () => (Math.random() * 2147483647) | 0;

/* =====================================================================
   MAIN LOOP & WIRING
   ===================================================================== */
function setSpeed(s) { SPEED = s; uiDirty = true; if (S) S.speed = s; }
function start() { started = true; startAudio(); if (!(S.over && !S.endless)) setSpeed(S.speed && S.speed > 0 ? S.speed : 1); refreshUI(); }
function afterNew() { buildTerrain(); syncLampInputs(); logDirty = true; graphDirty = true; acc = 0; tip.classList.remove('show'); save(); refreshUI(); }
let uiDirty = true, lastUI = 0, lastT = performance.now();
let frameErrs = 0;
function frame(now) {
  requestAnimationFrame(frame);
  try { step(now); } catch (err) { if (frameErrs++ < 3) console.error('frame error', err && err.stack || err); }
}
function step(now) {
  const dt = Math.min(.1, Math.max(0, (now - lastT) / 1000)); lastT = now;
  const t = now / 1000;
  if (S) {
    const running = SPEED > 0 && (!S.over || S.endless) && !modal.classList.contains('show');
    if (running) {
      acc += dt * SPEED; let n = 0;
      while (acc >= 1 && n < 24) { acc -= 1; tick(); n++; if (S.over && !S.endless) { acc = 0; break; } }
      if (acc > 1) acc = .99;
    }
    // cooldowns tick in game hours, or at 1h per second while paused
    const cdh = running ? dt * SPEED : dt;
    for (const k in S.cd) if (S.cd[k] > 0) S.cd[k] = Math.max(0, S.cd[k] - cdh);
    const vis = running ? Math.min(2.4, .7 + Math.log2(SPEED + 1) * .45) : (S.over === 'won' ? .4 : 0);
    if (vis > 0) { animCritters(dt * vis, t); animDrops(dt, vis); }
    animFx(dt);
    if (corkAnim > 0) corkAnim -= dt; if (dropperAnim > 0) dropperAnim -= dt; if (mistAnim > 0) mistAnim -= dt;
    if (hum && AC) { try { hum.gain.setTargetAtTime(lampOnAt((S.hour + acc) % 24) && !muted ? .004 + S.lamp.b * .006 : 0, AC.currentTime, .3); } catch (e) { } }
    render(t);
    updateClock();
    if (uiDirty || now - lastUI > 250) { uiDirty = false; lastUI = now; refreshUI(); }
  }
}
function flashHint(msg) { const h = $('#hint'); h.textContent = msg; h.style.color = 'var(--bad)'; clearTimeout(flashHint.t); flashHint.t = setTimeout(() => { h.textContent = 'Tip: tap anything in the jar to inspect it.'; h.style.color = ''; }, 3500); }

document.querySelectorAll('.speed button').forEach(b => b.addEventListener('click', () => { startAudio(); if (!started) { started = true; } if (S.over && !S.endless) return; setSpeed(+b.dataset.s); refreshUI(); }));
$('#aWater').addEventListener('click', () => { startAudio(); doWater(); refreshUI(); });
$('#aMist').addEventListener('click', () => { startAudio(); doMist(); refreshUI(); });
$('#aLid').addEventListener('click', () => { startAudio(); doLid(); refreshUI(); });
$('#aTrim').addEventListener('click', () => { startAudio(); doTrim(); refreshUI(); });
for (const id of ['#bri', '#hrs']) {
  const el = $(id);
  el.addEventListener('input', () => { draggingLamp = true; $('#briO').textContent = $('#bri').value + '%'; $('#hrsO').textContent = $('#hrs').value + ' h'; $('#lampNote').textContent = lampNoteText(+$('#bri').value / 100, +$('#hrs').value); });
  el.addEventListener('change', () => { draggingLamp = false; startAudio(); commitLamp(); refreshUI(); });
}
$('#bNew').addEventListener('click', () => {
  startAudio();
  const go = () => { closeModal(); newJar(randomSeed()); afterNew(); start(); };
  if (S && !S.over && S.hour - START_H > 48) {
    const was = SPEED; setSpeed(0);
    openModal(`<h3>Start a new jar?</h3><p class="sub">Jar ${S.jarNo} is on day ${dayNum()}. Its progress will be lost.</p><div class="row"><button class="btn primary" id="mYes">New random jar</button><button class="btn" id="mNo">Keep this one</button></div>`);
    $('#mYes').onclick = go; $('#mNo').onclick = () => { closeModal(); setSpeed(was || 1); };
  } else go();
});
$('#bHelp').addEventListener('click', () => { startAudio(); showHelp(); });
$('#bSound').addEventListener('click', () => { muted = !muted; saveOpts(); if (!muted) { startAudio(); if (AC && AC.state === 'suspended') AC.resume(); plink(660, .05, .4); } refreshUI(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || modal.classList.contains('show')) { if (e.key === 'Escape' && started && modal.classList.contains('show')) closeModal(); return; }
  if (e.code === 'Space') { e.preventDefault(); if (S.over && !S.endless) return; setSpeed(SPEED ? 0 : 1); }
  else if (e.key === '1') setSpeed(1); else if (e.key === '2') setSpeed(4); else if (e.key === '3') setSpeed(16);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => { resize(); drawGraph(); });
if (window.ResizeObserver) new ResizeObserver(() => { const w = $('#stage').clientWidth; if (w !== VW) { resize(); } graphDirty = true; }).observe($('#stage'));

/* boot */
loadOpts();
buildGauges(); buildLegend();
S = load();
if (S) { buildTerrain(); S.speed = S.speed || 1; }
else newJar(randomSeed(), 'starter');
buildShelf();
resize(); syncLampInputs();
refreshUI();
if (S.over && !S.endless) { started = true; setSpeed(0); setTimeout(showEnd, 300); } else showWelcome();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawIcons(); graphDirty = true; }).catch(() => { });
</script>
</body>
