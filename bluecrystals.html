<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="icons/bluecrystals.svg" type="image/svg+xml"><link rel="icon" href="icons/bluecrystals.png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Make Blue Crystals · Kai.fun</title>
<meta name="description" content="Run a gourmet blue rock-candy lab out of a beat-up camper van in the desert. Cook, crack and sell sparkling candy crystals to picky critics, beat your rival in a purity war, and become a Crystal Legend.">
<meta name="theme-color" content="#1b2a6b">
<script src="bdp.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#16224a;--navy2:#22336e;--blue:#2f8cff;--ice:#bfe9ff;--sand:#ffcf8a;--sun:#ff7a4d;--yel:#f2d43d;--card:#fdf8ee;--ink:#1d2444;--ink2:#5a6184;
--f:"Nunito","Trebuchet MS",system-ui,sans-serif;--fc:"Lilita One","Arial Black",sans-serif;--sh:0 3px 0 rgba(10,15,40,.35),0 10px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0e1633}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hide{display:none!important}
#kai{position:fixed;left:8px;top:8px;z-index:60;font-weight:900;font-size:13px;color:var(--navy);text-decoration:none;background:var(--card);padding:7px 11px;border-radius:999px;box-shadow:var(--sh);line-height:1}
.screen{position:fixed;inset:0}
.cbtn{font-family:var(--fc);font-size:18px;letter-spacing:.4px;padding:9px 16px;border-radius:14px;background:#fff;color:var(--navy);box-shadow:0 4px 0 rgba(10,15,40,.45),0 8px 16px rgba(0,0,0,.2);transition:transform .07s,box-shadow .07s;white-space:nowrap;touch-action:manipulation}
.cbtn:active,.cbtn.held{transform:translateY(3px);box-shadow:0 1px 0 rgba(10,15,40,.45),0 3px 8px rgba(0,0,0,.2)}
.cbtn.big{font-size:22px;padding:11px 20px;border-radius:18px}
.cbtn.small{font-size:15px;padding:6px 11px;border-radius:11px}
.cbtn.blue{background:linear-gradient(#5fb2ff,#2f7ae6);color:#fff;text-shadow:0 2px 0 rgba(10,40,110,.5)}
.cbtn.go{background:linear-gradient(#8ff0b8,#3fc47e);color:#0c4228}
.cbtn.pinkb{background:linear-gradient(#ffc2e6,#ff8fcf);color:#5a1440}
.cbtn.yel{background:linear-gradient(#ffe98a,#f2c43d);color:#4a3600}
.cbtn.ghost{background:rgba(255,255,255,.85)}
.cbtn.hold{touch-action:none}
.cbtn[disabled]{opacity:.45;pointer-events:none}
/* title */
#title{background:#1b1240;z-index:50}
#tcv{position:absolute;inset:0;width:100%;height:100%;display:block}
#tBtns{position:absolute;left:50%;bottom:6vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(92vw,480px)}
#tStats{font-weight:800;color:#fff;background:rgba(10,15,40,.6);padding:6px 14px;border-radius:999px;font-size:14px;text-align:center}
/* app layout */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(#22336e,#0e1633)}
#hud{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 112px;background:linear-gradient(#ff8a52,#e2593a);box-shadow:0 3px 0 #a83a22;z-index:5;flex-wrap:wrap;min-height:46px}
#logo{font-family:var(--fc);font-size:22px;color:#fff;text-shadow:0 2px 0 #a83a22;white-space:nowrap}
#logo b{font-weight:400;color:var(--ice);text-shadow:0 2px 0 #1b3a8a,0 0 10px rgba(120,200,255,.8)}
#pills{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#fff;border-radius:999px;padding:4px 10px;font-weight:900;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.2);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pill i{font-style:normal;font-size:12px;color:var(--ink2)}
.pill em{display:block;width:44px;height:7px;border-radius:4px;background:#e4e8f4;overflow:hidden}
.pill em u{display:block;height:100%;background:linear-gradient(90deg,#5fb2ff,#7fe0a8);width:0}
#main{flex:1;min-height:0;display:flex;flex-direction:row;gap:10px;padding:10px}
#stageWrap{position:relative;flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.35);touch-action:none;background:#2a1f2a}
#panel{width:380px;flex:none;overflow-y:auto;overflow-x:hidden;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh)}
#nav{display:flex;justify-content:center;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#0b1230}
.nb{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:54px;padding:4px 8px;border-radius:12px;color:#fff;position:relative}
.nb span{font-size:20px;line-height:1.1}.nb i{font-style:normal;font-size:11px;font-weight:800;opacity:.85}
.nb:hover,.nb.on{background:rgba(255,255,255,.14)}
.nb.glow{box-shadow:0 0 0 2px #ffd34d inset}

#dots i.cur{background:#fff;box-shadow:0 0 8px #7ef9ff}
#dots i.done{background:#7fe0a8}#dots i.g1{background:#ff6b6b}#dots i.g2{background:#ffb35a}#dots i.g3{background:#ffd34d}#dots i.g5{background:#7ef9ff}
#stepChip{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:#fff;border-radius:18px;padding:10px 20px;text-align:center;box-shadow:var(--sh);transition:.2s}
#stepChip.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#stepChip b{display:block;font-family:var(--fc);font-size:26px;font-weight:400}#stepChip span{font-weight:800;color:var(--ink2);font-size:14px}
#stepChip.g5 b{color:#1aa0d8}#stepChip.g4 b{color:#2fa86a}#stepChip.g3 b{color:#c99a00}#stepChip.g2 b{color:#e0782a}#stepChip.g1 b{color:#e03a3a}

#phaseTag:empty{display:none}
/* panel contents */
.mgHead{margin-bottom:10px}.mgHead span b{color:var(--navy);font-weight:900}
.mgHead>b{display:block;font-family:var(--fc);font-weight:400;font-size:22px;color:var(--navy)}.mgHead span{font-size:14px;font-weight:700;color:var(--ink2);line-height:1.35;display:block}
.ctl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.ctl.wrapc .cbtn{flex:1 1 40%}
.meter{flex:1;min-width:120px;height:34px;border-radius:12px;background:#e4e8f4;position:relative;overflow:hidden}
.meter u{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7fe0a8,#3fc47e);width:0}
.meter b{position:relative;display:block;text-align:center;line-height:34px;font-size:13px;font-weight:900;color:var(--navy)}
.mini{font-size:13px;font-weight:700;color:var(--ink2);text-align:center;line-height:1.4}
.warn{background:#ffe0dc;color:#a8231a;border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
h2{font-family:var(--fc);font-weight:400;font-size:24px;color:var(--navy);margin-bottom:6px}
h3{font-family:var(--fc);font-weight:400;font-size:20px;color:var(--navy);line-height:1.1}
p{font-size:14px;font-weight:700;line-height:1.4;margin:4px 0}
.sbar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px;font-weight:800}
.sbar span{width:92px;flex:none}.sbar i{flex:1;height:10px;border-radius:5px;background:#e4e8f4;overflow:hidden}.sbar i u{display:block;height:100%;background:#5fb2ff}

.batch .bTop{display:flex;gap:10px;align-items:center;margin-bottom:6px}

em.new,em.rec{font-style:normal;font-family:var(--f);font-size:11px;font-weight:900;background:#ffd34d;color:#4a3600;border-radius:6px;padding:2px 6px;vertical-align:middle}
em.rec{background:#7ef9ff;color:#0b3a66}
/* flavour chips + cards */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#fff;font-weight:800;font-size:13px;box-shadow:0 2px 0 rgba(10,15,40,.2);border:2px solid transparent}
.chip i{width:14px;height:14px;border-radius:50%;flex:none}
.chip.on{border-color:var(--blue);background:#e5f2ff}

.cards{display:flex;flex-direction:column;gap:8px}
.card{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 2px 0 rgba(10,15,40,.15)}
.card .info{flex:1;min-width:0}.card .info b{display:block;font-size:14px}.card .info small{display:block;font-size:12px;font-weight:700;color:var(--ink2);line-height:1.3}
.card.pickable{cursor:pointer;border:2px solid transparent}.card.pickable:hover{border-color:var(--blue)}
.card.owned{opacity:.6}
.tag{font-size:11px;font-weight:900;padding:2px 7px;border-radius:6px;background:#e4e8f4;white-space:nowrap}
.tag.fav{background:#ffd6f5;color:#8a1a6a}.tag.ok{background:#d8f7e6;color:#16613a}.tag.late{background:#ffe0dc;color:#a8231a}
.react{font-size:15px;font-weight:800;background:#fff;border-radius:14px;padding:8px 12px;margin:6px 0;box-shadow:0 2px 0 rgba(10,15,40,.15)}
.rev{font-size:13px;font-weight:700;background:#fff7d6;border-radius:12px;padding:8px 10px;margin:6px 0}
.rev b{color:#e0a000;letter-spacing:1px}
.tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}.tabs button{font-weight:900;font-size:13px;padding:6px 12px;border-radius:999px;background:#e4e8f4}.tabs button.on{background:var(--navy);color:#fff}
/* modal + toasts */
#modal{position:fixed;inset:0;background:rgba(5,8,25,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:12px}
#modalCard{position:relative;background:var(--card);border-radius:20px;padding:18px;width:min(560px,100%);max-height:calc(100dvh - 24px);overflow-y:auto;overflow-x:hidden;box-shadow:var(--sh)}
#modalCard .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#e4e8f4;font-weight:900;font-size:16px}
#modalCard.ev{text-align:center}
.bigic{font-size:54px;text-align:center;line-height:1.1}
#toasts{position:fixed;left:50%;top:56px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(94vw,440px)}
.toast{background:#fff;color:var(--navy);font-weight:800;font-size:14px;padding:8px 14px;border-radius:14px;box-shadow:var(--sh);transition:.35s;text-align:center}
.toast.out{opacity:0;transform:translateY(-10px)}
.toast.gold{background:#ffe98a}.toast.warn{background:#ffe0dc}.toast.good{background:#d8f7e6}
/* phone */
@media (max-width:860px){
  #hud{padding:5px 6px 5px 92px;gap:4px}#logo{font-size:17px}
  #pills{gap:4px;width:100%;justify-content:center;margin:0}.pill{font-size:12px;padding:3px 7px}.pill em{width:30px}
  #main{flex-direction:column;padding:6px;gap:6px}
  #stageWrap{flex:none}
  #panel{width:100%;flex:1;min-height:0;padding:10px}
  .nb{min-width:0;flex:1;padding:4px 2px}.nb span{font-size:18px}.nb i{font-size:10px}
  .cbtn.big{font-size:19px;padding:10px 14px}
  #kai{font-size:12px;padding:6px 9px}
}
</style>

<body>
<a id="kai" href="index.html">← Kai.fun</a>

  <div id="tBtns">

<div id="app" class="hide">
  <header id="hud">
    <div id="logo">Make <b>Blue Crystals</b></div>
    <div id="pills">
      <span class="pill" id="hDay">Day <b>1</b></span>

      <span class="pill" id="hRank"><i>Sugar Novice</i><em><u></u></em></span>
      <span class="pill" id="hBest" title="Best purity">💎 <b>0%</b></span>
      <span class="pill" id="hClean" title="Lab cleanliness">🧽 <b>100%</b></span>

<div id="modal" class="hide"><div id="modalCard"></div></div>

<script>
"use strict";
// ===== util.js =====
// util.js - shared helpers on the BC namespace: maths, DOM, toasts, hold-buttons, seeded randomness
window.BC = {};
(() => {
  const B = BC;
  B.W = 640; B.H = 440;
  B.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  B.lerp = (a, b, t) => a + (b - a) * t;
  B.rnd = (a, b) => a + Math.random() * (b - a);
  B.ri = (a, b) => Math.floor(B.rnd(a, b + 1));
  B.pick = (a) => a[Math.floor(Math.random() * a.length)];
  B.avg = (a) => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
  B.$ = (s) => document.querySelector(s);
  B.$$ = (s) => Array.from(document.querySelectorAll(s));
  B.money = (n) => '$' + Math.round(n).toLocaleString('en-US');
  B.pct = (n) => (Math.round(n * 10) / 10).toFixed(1) + '%';
  B.esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  B.stars = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);
  B.uid = () => Math.random().toString(36).slice(2, 9);

  // toasts
  B.toast = (msg, cls, ms) => {
    const t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.innerHTML = msg;
    B.$('#toasts').appendChild(t); setTimeout(() => t.classList.add('out'), ms || 2600); setTimeout(() => t.remove(), (ms || 2600) + 400);
  };

  // panel (HTML controls under the stage)
  B.panel = (html) => { const p = B.$('#panel'); p.innerHTML = html; p.scrollTop = 0; return p; };
  B.on = (sel, fn, root) => { const el = (root || document).querySelector(sel); if (el) el.addEventListener('click', (e) => { B.sfx('tap'); fn(e); }); return el; };

  // press-and-hold buttons (mouse + touch + keyboard space)
  B.hold = (sel, down, up) => {
    const el = B.$(sel); if (!el) return;
    let on = false;
    const d = (e) => { e.preventDefault(); if (on) return; on = true; el.classList.add('held'); down(); };
    const u = () => { if (!on) return; on = false; el.classList.remove('held'); up && up(); };
    el.addEventListener('pointerdown', d); el.addEventListener('pointerup', u); el.addEventListener('pointerleave', u); el.addEventListener('pointercancel', u);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    return el;
  };

  // modal
  B.modal = (html, cls) => {
    const m = B.$('#modal'), c = B.$('#modalCard'); c.className = cls || ''; c.innerHTML = '<button class="x" aria-label="Close">✕</button>' + html;
    m.classList.remove('hide'); c.querySelector('.x').onclick = () => { B.sfx('tap'); B.closeModal(); }; c.scrollTop = 0; return c;
  };
  B.closeModal = () => { B.$('#modal').classList.add('hide'); if (B._onClose) { const f = B._onClose; B._onClose = null; f(); } };

  // HSL helper for candy colours
  B.hsl = (h, s, l, a) => a == null ? `hsl(${h},${s}%,${l}%)` : `hsla(${h},${s}%,${l}%,${a})`;
  B.bar = (label, v, max, col) => `<div class="sbar"><span>${label}</span><i><u style="width:${B.clamp(v / max * 100, 0, 100)}%;background:${col || ''}"></u></i><b>${typeof v === 'number' ? (max === 100 ? Math.round(v) + '%' : (Math.round(v * 10) / 10)) : v}</b></div>`;
  B.sfx = (n, a) => { try { B.SFX && B.SFX.play(n, a); } catch (e) { } };
})();

// ===== audio.js =====
// audio.js - every sound synthesised live with WebAudio: bubbles, stirs, sniffs, crunches, the cash register, a lullaby
(() => {
  let ac = null, out = null, nb = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
    out = ac.createGain(); out.gain.value = 0.7; out.connect(ac.destination);
    nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function tone(type, f0, f1, dur, vol, when) {
    const t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, type, f0, f1, when, q, attack) {
    const t = ac.currentTime + (when || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = nb; f.type = type || 'bandpass'; f.frequency.setValueAtTime(f0 || 1000, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 1;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.008)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  const LULL = [523, 659, 784, 659, 587, 698, 880, 698, 523, 659, 784, 1047];
  let lullI = 0;
  const S = {
    tap() { tone('sine', 620, 860, 0.06, 0.1); },
    bubble() { const f = 180 + Math.random() * 260; tone('sine', f, f * 2.6, 0.07, 0.09); },
    stir() { noise(0.25, 0.16, 'bandpass', 350, 1100, 0, 2.5, 0.05); tone('sine', 140, 95, 0.18, 0.05); },
    beat() { tone('triangle', 880, 0, 0.04, 0.05); },
    perfect() { tone('sine', 988, 0, 0.08, 0.1); tone('sine', 1480, 0, 0.12, 0.08, 0.05); },
    miss() { tone('square', 160, 110, 0.12, 0.05); },
    pour() { noise(0.18, 0.12, 'lowpass', 600 + Math.random() * 300, 300, 0, 3); tone('sine', 220 + Math.random() * 90, 160, 0.1, 0.04); },
    grain() { for (let i = 0; i < 4; i++) noise(0.03, 0.06, 'highpass', 4000 + Math.random() * 3000, 0, i * 0.025); },

// save.js - the whole van business in one object, saved to localStorage (every access wrapped in try/catch)
(() => {
  const KEY = 'bluecrystals_save_v1';
  BC.fresh = () => ({
    v: 1, day: 1, money: 60, rep: 0, legend: false, best: 0, earned: 0, price: 8,
    owned: { blueraz: true }, upg: {}, recipes: {}, stock: [], orders: [], clean: 100,
    phase: 'lab', cooks: 0, queue: [], qi: 0, todayEarn: 0, todayRep: 0, event: null,
    ch: 0, chFlag: false, chStart: { five: 0, combos: 0 }, chDone: [], rivalPrice: 0, fairWon: false, fairDay: 0,
    stats: { batches: 0, boxes: 0, five: 0, combos: 0, inspections: 0, storms: 0, reviews: [] },
    ach: {}, set: { mute: false }, tut: false, nextOrder: 2, evNote: ''
  });
  BC.S = BC.fresh();
  BC.load = () => {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
    if (raw && raw.v === 1) {
      const d = BC.fresh();
      for (const k of Object.keys(d)) {
        if (raw[k] == null) continue;
        BC.S[k] = (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) ? Object.assign(d[k], raw[k]) : raw[k];
      }
      if (!Array.isArray(BC.S.stock)) BC.S.stock = [];
      if (!Array.isArray(BC.S.orders)) BC.S.orders = [];
      if (!Array.isArray(BC.S.queue)) BC.S.queue = [];
    }
    return BC.S;
  };
  BC.save = () => { try { localStorage.setItem(KEY, JSON.stringify(BC.S)); return true; } catch (e) { return false; } };
  BC.wipe = () => { try { localStorage.removeItem(KEY); } catch (e) { } BC.S = BC.fresh(); };
  BC.hasSave = () => { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } };

  // money / reputation helpers (all go through here so the HUD and achievements stay in sync)
  BC.addMoney = (n) => { BC.S.money += n; if (n > 0) { BC.S.earned += n; BC.S.todayEarn += n; } BC.hud && BC.hud(); BC.checkAch && BC.checkAch(); };
  BC.addRep = (n) => {
    const before = BC.rankIdx(BC.S.rep, BC.S.legend);
    BC.S.rep = Math.max(0, BC.S.rep + n); BC.S.todayRep += n;
    const after = BC.rankIdx(BC.S.rep, BC.S.legend);
    if (after > before) { BC.toast('🏅 New rank: <b>' + BC.RANKS[after].n + '</b>!', 'gold', 3600); BC.sfx('fanfare'); }
    BC.hud && BC.hud();
  };
  BC.has = (u) => !!BC.S.upg[u];
  BC.cooksPerDay = () => BC.has('van') ? 2 : 1;
  BC.trays = () => BC.has('van') ? 3 : 2;
})();

// ===== batch.js =====
// batch.js - turns the 8 minigame scores into a candy batch (purity, size, clarity, colour, smell, crunch) and judges it
(() => {
  const C = BC.clamp;
  BC.WEIGHTS = { scale: 0.12, heat: 0.2, stir: 0.12, color: 0.1, pour: 0.08, seed: 0.1, cool: 0.16, crack: 0.12 };
  // pure function: scores {step: 0..1}, ex {smell 0..10, burnt}, flavs -> batch stats
  BC.batchFrom = (sc, ex, flavs, upg) => {
    ex = ex || {}; upg = upg || {};
    const s = (k) => C(sc[k] == null ? 0 : sc[k], 0, 1);
    let q = 0; for (const k in BC.WEIGHTS) q += BC.WEIGHTS[k] * s(k);
    const purity = Math.round((50 + 49.9 * Math.pow(C(q, 0, 1), 1.3)) * 10) / 10;
    const size = Math.round((2 + 10 * (0.35 * s('seed') + 0.35 * s('cool') + 0.15 * s('stir') + 0.15 * s('crack')) + (upg.chamber ? 2 : 0)) * 10) / 10;
    const clarity = Math.round(100 * (0.4 * s('stir') + 0.3 * s('heat') + 0.3 * s('cool')));
    const colour = Math.round(100 * (0.8 * s('color') + 0.2 * s('heat')));
    let smell = ex.smell == null ? 6 : ex.smell; if (ex.burnt) smell = Math.min(smell, 3);
    const crunch = Math.round(10 * (0.5 * s('crack') + 0.3 * s('cool') + 0.2 * s('heat')) * 10) / 10;
    const boxes = Math.max(1, Math.round(ex.boxes != null ? ex.boxes : (ex.trays || 2) * 3));
    return { id: BC.uid(), flavs: flavs.slice(), name: BC.recipeName(flavs), purity, size, clarity, colour, smell: Math.round(smell * 10) / 10,
      crunch, burnt: !!ex.burnt, shade: ex.shade || BC.targetShade(flavs), boxes, scores: Object.assign({}, sc), q };
  };
  BC.quality = (b) => C((b.purity - 50) / 50, 0, 1);

  // how one buyer feels about one batch -> {aroma, taste, tex, looks, pur, total, stars}
  BC.judge = (bu, b) => {
    const fav = b.flavs.includes(bu.fav);
    let aroma = C(1 - Math.abs(b.smell - bu.smell) / 6, 0, 1) * 0.8 + (fav ? 0.2 : 0.05);
    if (b.burnt) aroma = 0.05;
    const taste = C((fav ? 1 : 0.62) * (0.35 + 0.65 * BC.quality(b)) + (b.flavs.length > 1 ? 0.05 : 0), 0, 1);
    const near = (v, p, lo, hi) => v >= p ? 1 - (v - p) / hi : 1 - (p - v) / lo; // too little hurts more than too much
    const tex = bu.body === 'granny' ? 0.8 : C(0.5 * near(b.crunch, bu.crunch, 5, 10) + 0.5 * near(b.size, bu.size, 6, 12), 0, 1);
    const looks = C(0.5 * b.colour / 100 + 0.5 * b.clarity / 100, 0, 1);
    const pur = b.purity >= bu.min ? 0.7 + 0.3 * (b.purity - bu.min) / Math.max(1, 100 - bu.min) : C(0.6 - (bu.min - b.purity) / 15, 0, 1);
    const w = bu.w; const wt = w.aroma + w.taste + w.tex + w.looks + w.pur;
    let total = (aroma * w.aroma + taste * w.taste + tex * w.tex + looks * w.looks + pur * w.pur) / wt;
    if (b.burnt) total *= 0.5;
    const stars = total < 0.38 ? 1 : total < 0.52 ? 2 : total < 0.66 ? 3 : total < 0.8 ? 4 : 5;
    return { aroma, taste, tex, looks, pur, total, stars, fav };
  };

  // what they pay: boxes x price, price-sensitivity, rival undercut, tip
  BC.deal = (bu, b, j, S) => {
    let boxes = BC.ri(bu.boxes[0], bu.boxes[1]); const notes = [];
    const fair = 4 + 14 * j.total;
    if (S.price > fair * 1.5) { boxes = 1; notes.push('Pricey for what it is...'); }
    if (S.rivalPrice && S.price > S.rivalPrice && b.purity < BC.rivalPurity()) { boxes = Math.max(1, boxes - 1); notes.push('Duke\'s truck sells it for ' + BC.money(S.rivalPrice) + '...'); }

// ===== cook.js =====
// cook.js - runs the 8-step minigame chain, shows a grade after each step, then bottles the batch
(() => {
  const B = BC; B.MG = {};
  const grade = (s) => s >= 0.95 ? ['PERFECT!', 'g5'] : s >= 0.8 ? ['Great', 'g4'] : s >= 0.6 ? ['Good', 'g3'] : s >= 0.35 ? ['Wobbly', 'g2'] : ['Oops', 'g1'];
  B.cook = {
    on: false, i: 0, flavs: [], res: {}, ex: {}, mg: null, lock: false,
    begin(flavs) {
      this.on = true; this.i = 0; this.flavs = flavs.slice(); this.res = {}; this.ex = { trays: B.trays(), shade: null, smell: 6 };
      this.target = B.targetShade(flavs); B.S.cooks++; B.save(); this.next();
    },
    next() {
      if (this.i >= B.STEPS.length) return this.finish();
      const key = B.STEPS[this.i]; this.mg = B.MG[key]; this.lock = false;
      this.mg.start({ flavs: this.flavs, target: this.target, cook: this });
      B.view = this.mg; this.dots();
      B.panel('<div class="mgHead"><b>' + (this.i + 1) + '/8 · ' + this.mg.title + '</b><span>' + this.mg.help + '</span></div>' + this.mg.panel());
      this.mg.wire && this.mg.wire();
    },
    // called by a minigame when it is finished: score 0..1, extras merged into ex, short note
    complete(score, extra, note) {
      if (this.lock || !this.on) return; this.lock = true;
      const key = B.STEPS[this.i]; score = B.clamp(score, 0, 1); this.res[key] = score; Object.assign(this.ex, extra || {});
      const [w, cls] = grade(score);
      const chip = B.$('#stepChip'); chip.className = 'show ' + cls; chip.innerHTML = '<b>' + B.STEP_N[key] + ': ' + w + '</b><span>' + Math.round(score * 100) + '%' + (note ? ' · ' + note : '') + '</span>';
      B.sfx(score >= 0.8 ? 'good' : score >= 0.4 ? 'coin' : 'miss');
      setTimeout(() => { chip.className = ''; this.i++; this.next(); }, B.fast ? 30 : 1300);
    },
    force(score, extra) { this.complete(score, extra, 'forced'); }, // used by tests / debug
    dots() {
      B.$('#dots').innerHTML = B.STEPS.map((k, n) => '<i class="' + (n < this.i ? 'done ' + grade(this.res[k])[1] : n === this.i ? 'cur' : '') + '" title="' + B.STEP_N[k] + '"></i>').join('');
      B.$('#dots').classList.remove('hide');
    },
    finish() {
      this.on = false; B.$('#dots').classList.add('hide');
      const b = B.batchFrom(this.res, this.ex, this.flavs, B.S.upg);
      B.S.stock.unshift(b); if (B.S.stock.length > 6) B.S.stock.length = 6;
      B.S.stats.batches++; B.S.clean = Math.max(0, B.S.clean - 14 - (this.ex.spill ? 10 : 0));
      const key = B.recipeKey(this.flavs), rec = B.S.recipes[key], isNew = !rec;
      if (isNew) { B.S.recipes[key] = { n: b.name, best: 0, made: 0, flavs: this.flavs.slice() }; if (this.flavs.length > 1) B.S.stats.combos++; }
      const r = B.S.recipes[key]; r.made++; const recBest = b.purity > r.best; r.best = Math.max(r.best, b.purity);
      const record = b.purity > B.S.best; B.S.best = Math.max(B.S.best, b.purity);
      B.save(); B.hud(); B.checkAch(); B.story && B.story.onBatch(b);
      B.view = B.resultView(b);
      B.showBatch(b, { isNew, record, recBest });
    }
  };
  B.showBatch = (b, f) => {
    const sh = b.shade, sw = B.hsl(sh.h, sh.s, sh.l);
    const left = B.cooksPerDay() - B.S.cooks;
    B.panel('<div class="batch"><div class="bTop"><i class="swatch" style="background:' + sw + '"></i><div><h3>' + B.esc(b.name) + (f && f.isNew ? ' <em class="new">NEW RECIPE!</em>' : '') + '</h3>' +
      '<div class="pur">' + B.pct(b.purity) + ' <small>purity</small>' + (f && f.record ? ' <em class="rec">RECORD!</em>' : '') + (b.purity >= 99.1 ? ' <em class="rec">99.1 CLUB</em>' : '') + '</div></div></div>' +
      B.bar('Crystal size', b.size, 14, '#7cc8f5').replace(/<b>.*<\/b>/, '<b>' + b.size + 'mm</b>') + B.bar('Clarity', b.clarity, 100, '#b5e8ff') + B.bar('Colour match', b.colour, 100, sw) +
      B.bar('Smell', b.smell, 10, '#ffb3d9') + B.bar('Crunch', b.crunch, 10, '#ffd97a') +
      (b.burnt ? '<p class="warn">Burnt sugar! Buyers will smell it a mile off.</p>' : '') +
      '<p class="mini">' + b.boxes + ' candy boxes made · steps: ' + B.STEPS.map((k) => B.STEP_N[k] + ' ' + Math.round((b.scores[k] || 0) * 100)).join(' · ') + '</p>' +
      '<div class="row">' + (left > 0 ? '<button class="cbtn" id="bAgain">Cook again (' + left + ' left)</button>' : '') + '<button class="cbtn big blue" id="bToWin">Open the Window 🪟</button></div></div>');
    B.on('#bAgain', () => B.goLab());
    B.on('#bToWin', () => B.goWindow());
    B.sfx(b.purity >= 90 ? 'sparkle' : 'coin');
  };
  // canvas view after cooking: the finished crystal pile glowing on the counter
  B.resultView = (b) => ({
    t: 0, update(dt) { this.t += dt; if (Math.random() < dt * 3) B.emit(B.rnd(200, 440), B.rnd(220, 300), 1, { kind: 'glint', g: -20, s0: 5, s1: 20, z0: 6, z1: 12 }); },
    draw(g, t) {
      B.vanBg(g, t); g.fillStyle = 'rgba(10,20,60,.35)'; g.fillRect(0, 0, B.W, B.H);
      g.fillStyle = 'rgba(120,200,255,.25)'; g.beginPath(); g.ellipse(320, 330, 200, 40, 0, 0, 7); g.fill();
      const n = Math.round(6 + b.size * 2.2);
      B.cluster(g, 320, 340, 250, n + 4, b.shade.h, b.shade.s + 10, b.shade.l + 6, t, 11, 0.9 * b.clarity / 100);
      B.title(g, B.pct(b.purity), 320, 120, 64, '#bfe9ff', '#0b2a66');
      B.txt(g, 'PURITY', 320, 166, 18, '#ffffff', 'center', '#0b2a66');
    }
  });
})();

// mg_scale.js - step 1: weigh sugar, Glimmerose syrup and Quackium salts. Hold to pour; it keeps trickling after you let go!
(() => {
  const B = BC, ING_COL = ['#ffffff', '#ff8fd8', '#ffd84d'];
  B.MG.scale = {
    title: 'Measure', help: 'Hold <b>Pour</b> to fill the bowl to the target, then tap <b>Lock in</b>. Careful: it keeps trickling for a moment after you let go!',
    grade(errs) { return B.avg(errs.map((e) => B.clamp(1 - Math.abs(e) * 6, 0, 1))); },
    start() {
      this.k = 0; this.amt = 0; this.flow = 0; this.held = false; this.hold = 0; this.errs = []; this.t = 0; this.tick = 0;
      this.targets = B.ING.map((g) => Math.round(B.rnd(g.lo, g.hi)));
    },
    panel() {
      return '<div class="ctl"><button class="cbtn big hold" id="mPour">Hold to Pour ⏬</button><button class="cbtn" id="mLock">Lock in ✓</button></div>';
    },
    wire() {
      B.hold('#mPour', () => { this.held = true; this.hold = 0; }, () => { this.held = false; });
      B.on('#mLock', () => this.lockIn());
    },
    lockIn() {
      if (this.k >= 3) return;
      const tg = this.targets[this.k]; this.errs.push((this.amt - tg) / tg); B.sfx('thud');
      this.k++; this.amt = 0; this.flow = 0; this.held = false;
      if (this.k >= 3) { const sc = this.grade(this.errs); B.cook.complete(sc, null, 'off by ' + Math.round(B.avg(this.errs.map(Math.abs)) * 100) + '% avg'); }
    },
    down() { this.held = true; this.hold = 0; }, up() { this.held = false; },
    update(dt) {
      this.t += dt; if (this.k >= 3) return;
      const ing = B.ING[this.k], tg = this.targets[this.k];
      if (this.held) { this.hold += dt; this.flow = ing.rate * Math.min(2.2, 0.35 + this.hold * 1.3); }
      else this.flow *= Math.pow(0.0008, dt); // the trickle after you let go
      let f = this.flow; if (B.has('scale') && Math.abs(this.amt - tg) / tg < 0.12) f *= 0.35;
      if (f > 0.01) { this.amt += f * dt; this.tick += dt; if (this.tick > 0.09) { this.tick = 0; B.sfx(this.k === 1 ? 'pour' : 'grain'); } }
    },
    draw(g, t) {
      B.vanBg(g, t, { dim: 0.3 });
      const ing = B.ING[Math.min(2, this.k)], tg = this.targets[Math.min(2, this.k)], col = ING_COL[Math.min(2, this.k)];
      // dial
      const cx = 200, cy = 250, R = 92, frac = B.clamp(this.amt / (tg * 1.5), 0, 1), tf = 1 / 1.5;
      g.fillStyle = '#eef3f7'; g.beginPath(); g.arc(cx, cy, R + 12, 0, 7); g.fill(); g.strokeStyle = '#8a99a6'; g.lineWidth = 6; g.stroke();
      const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25, ang = (f) => a0 + (a1 - a0) * f;
      g.lineWidth = 14; g.strokeStyle = '#7fe0a8'; g.beginPath(); g.arc(cx, cy, R - 10, ang(tf * 0.94), ang(tf * 1.06)); g.stroke();
      g.strokeStyle = '#ffd34d'; g.beginPath(); g.arc(cx, cy, R - 10, ang(tf * 0.85), ang(tf * 0.94)); g.stroke(); g.beginPath(); g.arc(cx, cy, R - 10, ang(tf * 1.06), ang(tf * 1.15)); g.stroke();
      g.strokeStyle = '#334'; g.lineWidth = 2; for (let i = 0; i <= 15; i++) { const a = ang(i / 15); g.beginPath(); g.moveTo(cx + Math.cos(a) * (R - 2), cy + Math.sin(a) * (R - 2)); g.lineTo(cx + Math.cos(a) * (R - 14), cy + Math.sin(a) * (R - 14)); g.stroke(); }
      g.strokeStyle = '#e0303a'; g.lineWidth = 5; g.lineCap = 'round'; const na = ang(frac);
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(na) * (R - 18), cy + Math.sin(na) * (R - 18)); g.stroke();
      g.fillStyle = '#334'; g.beginPath(); g.arc(cx, cy, 9, 0, 7); g.fill();
      g.fillStyle = '#16224a'; B.rr(g, cx - 56, cy + 30, 112, 34, 8); g.fill();
      B.txt(g, (B.has('scale') ? this.amt.toFixed(1) : Math.round(this.amt)) + ' ' + ing.u, cx, cy + 48, 22, '#7ef9ff');
      // platform + bowl + pile
      const bx = 440, by = 318;
      g.fillStyle = '#9aa8b4'; B.rr(g, bx - 110, by, 220, 22, 8); g.fill(); g.fillStyle = '#6d7b87'; g.fillRect(bx - 20, by + 22, 40, 26);
      const fill = B.clamp(this.amt / (tg * 1.4), 0, 1.1);
      g.fillStyle = col; g.beginPath(); g.ellipse(bx, by - 6 - fill * 36, 70 * (0.5 + fill * 0.5), 12 + fill * 26, 0, Math.PI, 0); g.fill();
      if (this.k === 2) for (let i = 0; i < fill * 14; i++) { const r = B.srand(i + 3); g.fillStyle = '#f2b400'; g.beginPath(); g.arc(bx + (r() - 0.5) * 100 * fill, by - 10 - r() * 40 * fill, 4, 0, 7); g.fill(); }
      g.fillStyle = 'rgba(220,240,255,.55)'; g.beginPath(); g.moveTo(bx - 90, by - 64); g.quadraticCurveTo(bx, by + 34, bx + 90, by - 64); g.lineTo(bx + 80, by - 64); g.quadraticCurveTo(bx, by + 16, bx - 80, by - 64); g.fill();

      // the pouring sack/bottle and stream

// mg_heat.js - step 2: dissolve the sugar. Turn the burner dial to hold the syrup in the Sweet Zone without burning it.
(() => {
  const B = BC;
  B.MG.heat = {
    title: 'Heat', help: 'Turn the dial (hold <b>−</b>/<b>+</b> or drag the knob) to keep the syrup in the green <b>Sweet Zone</b> for 7 seconds. Red = burnt sugar!',
    zone() { return B.has('thermo') ? [109, 123] : [112, 120]; },
    grade(o) { return B.clamp(o.inZone / o.need, 0, 1) - B.clamp(o.burn * 0.22, 0, 0.8); },
    start() { this.T = 22; this.k = 0.2; this.t = 0; this.inZone = 0; this.burn = 0; this.need = 7; this.dur = 17; this.n = 0; this.dir = 0; this.done = false; this.bt = 0; },
    panel() { return '<div class="ctl"><button class="cbtn big hold" id="hDn">− Lower</button><div class="meter" id="hMeter"><u></u><b></b></div><button class="cbtn big hold" id="hUp">+ Raise</button></div>'; },
    wire() { B.hold('#hDn', () => (this.dir = -1), () => (this.dir = 0)); B.hold('#hUp', () => (this.dir = 1), () => (this.dir = 0)); },
    down(x, y) { if (Math.hypot(x - 560, y - 340) < 80) { this.drag = y; this.k0 = this.k; } },

// mg_stir.js - step 3: the Wobble Centrifuge. Tap STIR exactly as each shrinking ring lands on the pot rim.
(() => {
  const B = BC, BEAT = 0.62, N = 10, LEAD = 1.0;
  B.MG.stir = {
    title: 'Stir', help: 'Tap <b>Stir</b> (or the pot, or Space) right when each shrinking ring hits the gold rim. Keep the rhythm!',
    win() { return B.has('centrifuge') ? 1.45 : 1; },
    q(e) { const m = this.win(); return e == null ? 0 : e < 0.07 * m ? 1 : e < 0.14 * m ? 0.75 : e < 0.24 * m ? 0.4 : 0; },
    grade(errs, extra) { return B.clamp(B.avg(errs.map((e) => this.q(e))) - (extra || 0) * 0.04, 0, 1); },
    start() { this.t = 0; this.errs = new Array(N).fill(null); this.judged = new Array(N).fill(false); this.extra = 0; this.pops = []; this.spin = 0; this.lastBeat = -1; this.done = false; },
    beatT(i) { return LEAD + 0.6 + i * BEAT; },
    panel() { return '<div class="ctl"><button class="cbtn big blue" id="sTap">Stir! 🥄</button></div>'; },
    wire() { const b = B.$('#sTap'); b.addEventListener('pointerdown', (e) => { e.preventDefault(); this.tap(); }); },
    down() { this.tap(); },
    key(k, d) { if (d && (k === ' ' || k === 'Enter')) this.tap(); },
    tap() {
      if (this.done) return; let best = -1, be = 9;
      for (let i = 0; i < N; i++) { if (this.judged[i]) continue; const e = Math.abs(this.t - this.beatT(i)); if (e < be) { be = e; best = i; } }
      this.spin += 1.4;
      if (best >= 0 && be < 0.3) {
        this.judged[best] = true; this.errs[best] = be; const q = this.q(be);
        this.pops.push({ s: q >= 1 ? 'PERFECT' : q >= 0.75 ? 'GOOD' : q > 0 ? 'OK' : 'MISS', t: 0, c: q >= 1 ? '#7fe0a8' : q > 0 ? '#ffd34d' : '#ff6b6b' });
        B.sfx(q >= 1 ? 'perfect' : 'stir'); if (q >= 0.75) B.emit(320, 250, 6, { kind: 'glint', g: 0, s0: 60, s1: 160, z0: 6, z1: 12 });
      } else { this.extra++; B.sfx('miss'); }
    },
    update(dt) {
      if (this.done) return; this.t += dt; this.spin *= Math.pow(0.4, dt);
      const bi = Math.floor((this.t - LEAD - 0.6) / BEAT + 0.5); if (bi >= 0 && bi < N && bi !== this.lastBeat && this.t >= this.beatT(bi)) { this.lastBeat = bi; B.sfx('beat'); }
      for (let i = 0; i < N; i++) if (!this.judged[i] && this.t > this.beatT(i) + 0.3) { this.judged[i] = true; this.pops.push({ s: 'MISS', t: 0, c: '#ff6b6b' }); }
      this.pops.forEach((p) => (p.t += dt)); this.pops = this.pops.filter((p) => p.t < 0.8);
      if (this.t > this.beatT(N - 1) + 0.45) {
        this.done = true; const hits = this.errs.filter((e) => e != null && this.q(e) > 0).length;
        B.cook.complete(this.grade(this.errs, this.extra), null, hits + '/' + N + ' on beat');
      }
    },
    draw(g, t) {
      B.vanBg(g, t); g.fillStyle = 'rgba(20,10,40,.35)'; g.fillRect(0, 0, B.W, B.H);
      const cx = 320, cy = 250, R = 92;
      // the Wobble Centrifuge frame
      g.fillStyle = '#c94fd6'; B.rr(g, cx - 150, cy - 160, 300, 26, 13); g.fill(); g.fillStyle = '#8a2a99'; g.fillRect(cx - 140, cy - 140, 14, 130); g.fillRect(cx + 126, cy - 140, 14, 130);
      B.txt(g, 'WOBBLE CENTRIFUGE' + (B.has('centrifuge') ? ' TURBO' : ''), cx, cy - 147, 15, '#fff');
      for (let i = 0; i < 6; i++) { const on = Math.floor(t * 6 + i) % 3 === 0; g.fillStyle = on ? '#ffe36b' : '#6a2a70'; g.beginPath(); g.arc(cx - 100 + i * 40, cy - 124, 6, 0, 7); g.fill(); }
      // pot (top view) with swirling syrup
      g.fillStyle = '#8a99a6'; g.beginPath(); g.arc(cx, cy, R + 16, 0, 7); g.fill();
      g.fillStyle = '#eaf6ff'; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.fill();
      const rot = t * (2 + this.spin * 3);
      g.strokeStyle = 'rgba(120,170,230,.6)'; g.lineWidth = 5;
      for (let k = 0; k < 3; k++) { g.beginPath(); for (let a = 0; a < 9; a += 0.2) { const r = a * 9; g.lineTo(cx + Math.cos(a + rot + k * 2.1) * r, cy + Math.sin(a + rot + k * 2.1) * r); } g.stroke(); }
      // spoon
      const sa = rot * 0.7; g.strokeStyle = '#b5874f'; g.lineWidth = 12; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx + Math.cos(sa) * 40, cy + Math.sin(sa) * 40); g.lineTo(cx + Math.cos(sa) * 40 + 90, cy - 150); g.stroke();

        if (this.judged[i]) continue; const dtb = this.beatT(i) - this.t; if (dtb > 1.0 || dtb < -0.3) continue;
        const r = R + 16 + dtb * 170; g.strokeStyle = 'rgba(126,249,255,' + B.clamp(1 - Math.abs(dtb), 0.2, 1) + ')'; g.lineWidth = 4; g.beginPath(); g.arc(cx, cy, Math.max(4, r), 0, 7); g.stroke();

      const hit = this.errs.filter((e) => e != null && this.q(e) > 0).length; B.txt(g, 'Beat ' + Math.min(N, this.lastBeat + 1) + '/' + N + '   ✓ ' + hit, cx, 410, 18, '#fff', 'center', '#16224a');
    }
  };
})();

// mg_pour.js - step 5: tip the pot and fill each tray to the dotted line. Overfill and it slops everywhere.
(() => {
  const B = BC, LINE = 0.8;
  B.MG.pour = {
    title: 'Pour', help: 'Hold <b>Pour</b> to fill each tray up to the dotted line. It speeds up the longer you hold! Overflowing makes a sticky mess.',
    grade(fills) { return B.avg(fills.map((f) => f > 1 ? 0.1 : B.clamp(1 - Math.abs(f - LINE) * 4.5, 0, 1))); },
    start() {
      this.n = B.trays(); this.fills = new Array(this.n).fill(0); this.k = 0; this.held = false; this.hold = 0; this.rate = 0; this.t = 0; this.wait = 0; this.spill = false; this.tick = 0; this.done = false;

    panel() { return '<div class="ctl"><button class="cbtn big hold blue" id="pPour">Hold to Pour 🫗</button><button class="cbtn" id="pNext">Next tray ➜</button></div><div class="mini" id="pInfo"></div>'; },
    wire() { B.hold('#pPour', () => { if (!this.auto()) { this.held = true; this.hold = 0; } }, () => { this.held = false; this.wait = 0.55; }); B.on('#pNext', () => this.advance()); this.info(); },
    auto() { return this.helper && this.k === 0; },
    info() { const el = B.$('#pInfo'); if (el) el.innerHTML = this.auto() ? 'Noodle the assistant is pouring tray 1... fingers crossed!' : 'Tray ' + (this.k + 1) + ' of ' + this.n + ' · fill ' + Math.round(this.fills[this.k] * 100 / LINE) + '% of the line'; },
    down() { if (!this.auto()) { this.held = true; this.hold = 0; } }, up() { if (this.held) { this.held = false; this.wait = 0.55; } },
    advance() {

    update(dt) {

      } else {

    },
    trayX(i) { return B.W / 2 + (i - (this.n - 1) / 2) * (this.n > 2 ? 190 : 230); },
    draw(g, t) {
      B.vanBg(g, t, { dim: 0.3 }); const sh = B.cook.ex.shade || B.cook.target;
      for (let i = 0; i < this.n; i++) {
        const x = this.trayX(i), y = 340, w = this.n > 2 ? 170 : 200, h = 50, f = Math.min(1.05, this.fills[i]);
        g.fillStyle = '#b8c4cc'; B.rr(g, x - w / 2 - 8, y - h, w + 16, h + 10, 10); g.fill();
        g.fillStyle = '#5b6670'; B.rr(g, x - w / 2, y - h + 6, w, h - 2, 6); g.fill();
        if (f > 0) { g.fillStyle = B.hsl(sh.h, sh.s, sh.l, 0.92); g.fillRect(x - w / 2, y + 4 - (h - 2) * f, w, (h - 2) * f); }

        g.strokeStyle = '#fff'; g.setLineDash([8, 6]); g.lineWidth = 3; const ly = y + 4 - (h - 2) * LINE; g.beginPath(); g.moveTo(x - w / 2 - 12, ly); g.lineTo(x + w / 2 + 12, ly); g.stroke(); g.setLineDash([]);

// mg_seed.js - step 6: moon-dust seeding. Drag the shaker over the tray to sprinkle seed crystals evenly - not too much, not too little.
(() => {
  const B = BC, CX = 8, CY = 5, X0 = 120, Y0 = 130, W = 400, H = 240, LO = 0.6, HI = 1.7, TIME = 9;
  B.MG.seed = {
    title: 'Seed', help: 'Press and <b>drag</b> the moon-dust shaker across the tray. Every square should <b>twinkle green</b> - bare squares grow nothing, clumps grow mush.',
    grade(cells) { return B.clamp(cells.filter((c) => c >= LO && c <= HI).length / cells.length - cells.filter((c) => c > HI * 1.6).length * 0.02, 0, 1); },
    start() { this.cells = new Array(CX * CY).fill(0); this.t = 0; this.px = 320; this.py = 90; this.on = false; this.done = false; this.tick = 0; },
    panel() { return '<div class="ctl"><div class="meter" id="sdMeter"><u></u><b></b></div><button class="cbtn big go" id="sdDone">Done ✓</button></div>'; },
    wire() { B.on('#sdDone', () => this.finish()); },
    down(x, y) { this.on = true; this.px = x; this.py = y; }, move(x, y) { this.px = x; this.py = y; }, up() { this.on = false; },
    cellAt(x, y) { const i = Math.floor((x - X0) / (W / CX)), j = Math.floor((y - Y0) / (H / CY)); return i >= 0 && i < CX && j >= 0 && j < CY ? j * CX + i : -1; },
    dust(x, y, amt) { // spread a little to neighbours so it feels like a sprinkle
      const c = this.cellAt(x, y); if (c < 0) return; this.cells[c] += amt;
      const i = c % CX, j = (c / CX) | 0; for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const a = i + di, b = j + dj; if (a >= 0 && a < CX && b >= 0 && b < CY) this.cells[b * CX + a] += amt * 0.3; }
    },
    finish() {
      if (this.done) return; this.done = true; const good = this.cells.filter((c) => c >= LO && c <= HI).length;
      B.cook.complete(this.grade(this.cells), null, good + '/' + this.cells.length + ' squares seeded');
    },
    update(dt) {
      if (this.done) return; this.t += dt;
      if (this.on) { this.dust(this.px, this.py + 30, dt * 4.5); this.tick += dt; if (this.tick > 0.1 && this.cellAt(this.px, this.py + 30) >= 0) { this.tick = 0; B.sfx('sprinkle'); B.emit(this.px + B.rnd(-8, 8), this.py + 14, 2, { kind: 'glint', g: 200, ang: Math.PI / 2, spread: 0.4, s0: 40, s1: 90, z0: 3, z1: 6, l0: 0.2, l1: 0.4 }); } }
      const m = B.$('#sdMeter'); if (m) { const good = this.cells.filter((c) => c >= LO && c <= HI).length; m.querySelector('u').style.width = (1 - this.t / TIME) * 100 + '%'; m.querySelector('b').textContent = good + '/' + this.cells.length + ' seeded · ' + Math.max(0, TIME - this.t).toFixed(1) + 's'; }
      if (this.t >= TIME) this.finish();
    },
    draw(g, t) {
      B.vanBg(g, t); g.fillStyle = 'rgba(10,10,40,.45)'; g.fillRect(0, 0, B.W, B.H);
      const sh = B.cook.ex.shade || B.cook.target;
      g.fillStyle = '#b8c4cc'; B.rr(g, X0 - 16, Y0 - 16, W + 32, H + 32, 16); g.fill();
      g.fillStyle = B.hsl(sh.h, sh.s, sh.l); g.fillRect(X0, Y0, W, H);
      const cw = W / CX, chh = H / CY;
      for (let c = 0; c < this.cells.length; c++) {
        const i = c % CX, j = (c / CX) | 0, x = X0 + i * cw, y = Y0 + j * chh, v = this.cells[c];
        const ok = v >= LO && v <= HI, over = v > HI;
        if (ok) { g.fillStyle = 'rgba(127,224,168,' + (0.18 + Math.sin(t * 4 + c) * 0.08) + ')'; g.fillRect(x + 2, y + 2, cw - 4, chh - 4); }
        if (over) { g.fillStyle = 'rgba(255,240,200,' + B.clamp((v - HI) / 2, 0.2, 0.7) + ')'; g.fillRect(x + 2, y + 2, cw - 4, chh - 4); }
        const n = Math.min(14, Math.round(v * 6)), r = B.srand(c + 1);
        g.fillStyle = '#fffbe0'; for (let k = 0; k < n; k++) { g.beginPath(); g.arc(x + r() * cw, y + r() * chh, 1.8, 0, 7); g.fill(); }
        if (ok && Math.sin(t * 3 + c * 1.3) > 0.8) B.glint(g, x + cw / 2, y + chh / 2, 8, 0.9);
      }
      g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1; for (let i = 1; i < CX; i++) { g.beginPath(); g.moveTo(X0 + i * cw, Y0); g.lineTo(X0 + i * cw, Y0 + H); g.stroke(); } for (let j = 1; j < CY; j++) { g.beginPath(); g.moveTo(X0, Y0 + j * chh); g.lineTo(X0 + W, Y0 + j * chh); g.stroke(); }
      // shaker (moon jar)
      g.save(); g.translate(this.px, this.py); g.rotate(this.on ? Math.sin(t * 30) * 0.25 : 0);
      g.fillStyle = '#e8ecff'; B.rr(g, -20, -34, 40, 50, 10); g.fill(); g.fillStyle = '#8a99a6'; B.rr(g, -16, 14, 32, 10, 4); g.fill();
      g.fillStyle = '#ffe36b'; g.beginPath(); g.arc(0, -10, 11, 0, 7); g.fill(); g.fillStyle = '#e8ecff'; g.beginPath(); g.arc(5, -13, 10, 0, 7); g.fill();
      g.restore();
      B.txt(g, 'MOON-DUST SEEDING', 320, 70, 20, '#ffe36b', 'center', '#16224a');
    }
  };
})();

// ===== mg_cool.js =====
// mg_cool.js - step 7: lullaby cooling. Keep the tray's temperature riding the dotted curve: blanket to slow it, fan to speed it.
(() => {
  const B = BC, DUR = 16, T0 = 110, AMB = 22, TAU = 5.5;
  const target = (t) => AMB + (T0 - AMB) * Math.exp(-t / TAU);
  B.MG.cool = {
    title: 'Cool', help: 'Ride the dotted curve! Hold <b>Lullaby blanket</b> to slow the cooling, hold <b>Fan</b> to speed it up. Watch out for desert gusts.',
    grade(errs) { return B.clamp(1 - B.avg(errs) / 10, 0, 1); },
    target,
    start() { this.t = 0; this.T = T0; this.errs = []; this.hist = []; this.blanket = false; this.fanOn = false; this.gust = 0; this.gt = 0; this.done = false; this.lt = 0; this.ft = 0; },
    panel() { return '<div class="ctl"><button class="cbtn big hold" id="cBlank">🛏️ Lullaby blanket</button><button class="cbtn big hold blue" id="cFan">🌀 Fan</button></div><div class="mini" id="cInfo">Drift from the curve: 0°</div>'; },
    wire() { B.hold('#cBlank', () => (this.blanket = true), () => (this.blanket = false)); B.hold('#cFan', () => (this.fanOn = true), () => (this.fanOn = false)); },
    key(k, d) { if (k === 'ArrowLeft' || k === 'b') this.blanket = d; if (k === 'ArrowRight' || k === 'f') this.fanOn = d; },
    update(dt) {
      if (this.done) return; this.t += dt;
      const chamber = B.has('chamber'), storm = B.S.event && B.S.event.id === 'storm';
      let k = chamber ? 1 / TAU : 1 / 3.9;
      if (this.blanket) k *= 0.22; if (this.fanOn) k *= B.has('fan') ? 3 : 1.7;
      this.gt -= dt; if (this.gt <= 0) { this.gt = B.rnd(1.5, 3); this.gust = B.rnd(-1, 1) * (storm ? 9 : 5) * (chamber ? 0.4 : 1); if (Math.abs(this.gust) > 3) B.sfx('wind'); }
      this.gust *= Math.pow(0.5, dt);
      this.T += (-k * (this.T - AMB) - this.gust) * dt;
      const e = Math.abs(this.T - target(this.t)); this.errs.push(e); this.hist.push([this.t, this.T]);
      if (this.blanket) { this.lt -= dt; if (this.lt <= 0) { this.lt = 0.42; B.sfx('lullaby'); } }
      if (this.fanOn) { this.ft -= dt; if (this.ft <= 0) { this.ft = 0.28; B.sfx('fan'); } }
      const el = B.$('#cInfo'); if (el && Math.random() < 0.2) el.innerHTML = 'Drift from the curve: <b>' + e.toFixed(1) + '°</b> · avg ' + B.avg(this.errs).toFixed(1) + '°';
      if (this.t >= DUR) { this.done = true; const sc = this.grade(this.errs); B.cook.complete(sc, null, 'avg drift ' + B.avg(this.errs).toFixed(1) + '°'); }
    },
    draw(g, t) {
      B.vanBg(g, t); g.fillStyle = 'rgba(10,15,40,.55)'; g.fillRect(0, 0, B.W, B.H);
      const gx = 60, gy = 60, gw = 540, gh = 230, X = (s) => gx + s / DUR * gw, Y = (T) => gy + gh - (T - 15) / (T0 + 5 - 15) * gh;
      g.fillStyle = 'rgba(255,255,255,.08)'; B.rr(g, gx - 10, gy - 10, gw + 20, gh + 20, 12); g.fill();
      // tolerance band + target curve
      g.fillStyle = 'rgba(127,224,168,.22)'; g.beginPath();
      for (let s = 0; s <= DUR; s += 0.25) g.lineTo(X(s), Y(target(s) + 4)); for (let s = DUR; s >= 0; s -= 0.25) g.lineTo(X(s), Y(target(s) - 4)); g.fill();
      g.strokeStyle = '#7fe0a8'; g.setLineDash([7, 6]); g.lineWidth = 3; g.beginPath(); for (let s = 0; s <= DUR; s += 0.25) g.lineTo(X(s), Y(target(s))); g.stroke(); g.setLineDash([]);
      g.strokeStyle = '#7ef9ff'; g.lineWidth = 4; g.beginPath(); this.hist.forEach(([s, T], i) => (i ? g.lineTo(X(s), Y(T)) : g.moveTo(X(s), Y(T)))); g.stroke();
      const cy = Y(this.T); g.fillStyle = '#fff'; g.shadowColor = '#7ef9ff'; g.shadowBlur = 14; g.beginPath(); g.arc(X(this.t), cy, 7, 0, 7); g.fill(); g.shadowBlur = 0;
      B.txt(g, Math.round(this.T) + '°', X(this.t) + 26, cy - 14, 16, '#fff', 'center', '#16224a');
      B.txt(g, 'LULLABY COOLING CURVE', gx + gw / 2, gy - 22, 18, '#ffe36b', 'center', '#16224a');
      // the tray, crystals growing as it cools
      const tx = 320, ty = 370, grow = B.clamp(this.t / DUR, 0, 1), sh = B.cook.ex.shade || B.cook.target;
      g.fillStyle = '#b8c4cc'; B.rr(g, tx - 140, ty - 26, 280, 52, 10); g.fill(); g.fillStyle = B.hsl(sh.h, sh.s, sh.l); g.fillRect(tx - 130, ty - 18, 260, 36);
      for (let i = 0; i < 9; i++) B.crystal(g, tx - 115 + i * 29, ty, 4 + grow * 12, i, sh.h, sh.s, sh.l + 10, i + 2, 0);
      if (this.blanket) { g.fillStyle = 'rgba(255,170,210,.9)'; B.rr(g, tx - 150, ty - 34, 300, 30, 12); g.fill(); g.fillStyle = '#fff'; for (let i = 0; i < 3; i++) B.txt(g, '♪', tx - 60 + i * 60, ty - 60 - ((t * 40 + i * 20) % 40), 22, '#ffd6f5'); }
      if (this.fanOn) { g.save(); g.translate(tx + 200, ty - 20); g.rotate(t * 20); g.fillStyle = '#c4ebff'; for (let i = 0; i < 3; i++) { g.rotate(2.09); g.beginPath(); g.ellipse(0, -18, 8, 18, 0, 0, 7); g.fill(); } g.restore(); }
      if (Math.abs(this.gust) > 2) B.txt(g, this.gust > 0 ? 'chilly gust!' : 'warm gust!', 520, 330, 16, this.gust > 0 ? '#9ad8ff' : '#ffb37a', 'center', '#16224a');
    }
  };
})();

// ===== mg_crack.js =====
// mg_crack.js - step 8: crack the slab into crystals. Whack it when the power needle is in the green - too hard makes dust, too soft just bonks.
(() => {
  const B = BC, N = 5;
  B.MG.crack = {
    title: 'Crack', help: 'Tap <b>Whack!</b> (or the slab) when the power needle is in the <b>green</b>. 5 clean whacks = perfect chunky crystals.',
    zone() { return B.has('hammer') ? [0.5, 0.8] : [0.57, 0.75]; },
    q(p) { const [lo, hi] = this.zone(), c = (lo + hi) / 2, h = (hi - lo) / 2; if (p >= lo && p <= hi) return 1 - Math.abs(p - c) / h * 0.2; const d = p < lo ? lo - p : p - hi; return B.clamp(0.6 - d * 3, 0, 0.6); },
    grade(ps) { return B.avg(ps.map((p) => this.q(p))); },
    start() { this.t = 0; this.ps = []; this.cracks = []; this.swing = 0; this.done = false; this.ph = 0; this.msg = null; },
    panel() { return '<div class="ctl"><button class="cbtn big blue" id="kWhack">Whack! 🔨</button></div>'; },
    wire() { const b = B.$('#kWhack'); b.addEventListener('pointerdown', (e) => { e.preventDefault(); this.whack(); }); },
    down() { this.whack(); },
    key(k, d) { if (d && (k === ' ' || k === 'Enter')) this.whack(); },
    power() { return 0.5 - 0.5 * Math.cos(this.ph); },
    whack() {
      if (this.done || this.swing > 0.15) return; const p = this.power(), q = this.q(p), [lo, hi] = this.zone(); this.ps.push(p); this.swing = 0.35;
      const x = B.rnd(200, 440), y = B.rnd(260, 320), lines = [];
      const arms = p > hi ? 7 : p < lo ? 1 : 4;
      for (let a = 0; a < arms; a++) { let px = x, py = y, ang = a / arms * Math.PI * 2 + B.rnd(-0.3, 0.3); const seg = [[px, py]]; for (let s = 0; s < 5; s++) { ang += B.rnd(-0.5, 0.5); px += Math.cos(ang) * B.rnd(14, 30); py += Math.sin(ang) * B.rnd(6, 14); seg.push([px, py]); } lines.push(seg); }
      this.cracks.push(lines);
      if (p > hi) { this.msg = { s: 'TOO HARD - dust!', c: '#ff8a8a', t: 0 }; B.sfx('crunch'); B.emit(x, y, 30, { kind: 'dot', hue: 205, s0: 60, s1: 260, z0: 1.5, z1: 3, col: '#dff3ff' }); }
      else if (p < lo) { this.msg = { s: 'bonk...', c: '#ffd34d', t: 0 }; B.sfx('thud'); }
      else { this.msg = { s: q > 0.92 ? 'CLEAN CRACK!' : 'Crack!', c: '#7fe0a8', t: 0 }; B.sfx('crack'); B.emit(x, y, 12, { kind: 'shard', hue: B.cook.ex.shade ? B.cook.ex.shade.h : 205, s0: 80, s1: 240, z0: 4, z1: 9 }); }
      if (this.ps.length >= N) { this.done = true; setTimeout(() => B.cook.complete(this.grade(this.ps), null, this.ps.filter((v) => this.q(v) >= 0.8).length + '/5 clean whacks'), 500); }
    },
    update(dt) { this.t += dt; this.ph += dt * (3.2 + this.ps.length * 0.7); this.swing = Math.max(0, this.swing - dt); if (this.msg) this.msg.t += dt; },
    draw(g, t) {
      B.vanBg(g, t, { dim: 0.3 });
      const sh = B.cook.ex.shade || B.cook.target, n = this.ps.length;
      g.fillStyle = '#9a6a42'; B.rr(g, 120, 220, 400, 140, 14); g.fill(); g.fillStyle = 'rgba(0,0,0,.15)'; for (let i = 0; i < 6; i++) g.fillRect(130, 232 + i * 22, 380, 3);
      // the slab: one sheet that splits into more chunks with every whack
      const cols = 1 + Math.min(4, n), rows = 1 + Math.min(2, Math.floor(n / 2)), sw = 320, shh = 100, gap = n * 2;
      for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
        const x = 160 + i * (sw / cols) + (i - (cols - 1) / 2) * gap, y = 240 + j * (shh / rows) + (j - (rows - 1) / 2) * gap;
        const gr = g.createLinearGradient(x, y, x + sw / cols, y + shh / rows); gr.addColorStop(0, B.hsl(sh.h, sh.s, sh.l + 22, 0.95)); gr.addColorStop(1, B.hsl(sh.h, sh.s, sh.l - 6, 0.95));
        g.fillStyle = gr; B.rr(g, x, y, sw / cols - 2, shh / rows - 2, 5); g.fill();
        g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x + 4, y + 4, sw / cols - 12, 5);
      }
      g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2; this.cracks.forEach((ls) => ls.forEach((seg) => { g.beginPath(); seg.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); }));
      for (let i = 0; i < 4; i++) B.glint(g, 180 + i * 90, 250 + Math.sin(t + i) * 30, 9, Math.sin(t * 2.5 + i * 1.6));
      // hammer
      const ang = this.swing > 0 ? B.lerp(-0.5, 0.85, this.swing / 0.35) : -0.5 + Math.sin(t * 2) * 0.05;
      g.save(); g.translate(540, 110); g.rotate(ang); g.fillStyle = '#b5874f'; B.rr(g, -6, 0, 12, 120, 5); g.fill(); g.fillStyle = B.has('hammer') ? '#bfe9ff' : '#8a99a6'; B.rr(g, -34, 100, 68, 34, 8); g.fill(); g.restore();
      // power meter
      const mx = 60, my0 = 80, my1 = 360, [lo, hi] = this.zone(), Yp = (p) => my1 - p * (my1 - my0);
      g.fillStyle = 'rgba(10,15,40,.75)'; B.rr(g, mx - 22, my0 - 10, 44, my1 - my0 + 20, 12); g.fill();
      g.fillStyle = '#ffd34d'; g.fillRect(mx - 14, Yp(1), 28, Yp(hi) - Yp(1)); g.fillStyle = '#7fe0a8'; g.fillRect(mx - 14, Yp(hi), 28, Yp(lo) - Yp(hi)); g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(mx - 14, Yp(lo), 28, Yp(0) - Yp(lo));
      const py = Yp(this.power()); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(mx - 30, py); g.lineTo(mx - 14, py - 8); g.lineTo(mx - 14, py + 8); g.fill(); g.fillRect(mx - 14, py - 2, 28, 4);
      B.txt(g, 'POWER', mx, my0 - 26, 14, '#fff', 'center', '#16224a');
      B.txt(g, 'Whack ' + Math.min(N, n + 1) + ' / ' + N, 320, 400, 18, '#fff', 'center', '#16224a');
      if (this.msg && this.msg.t < 0.9) { g.globalAlpha = 1 - this.msg.t / 0.9; B.title(g, this.msg.s, 320, 190 - this.msg.t * 40, 30, this.msg.c); g.globalAlpha = 1; }
    }
  };
})();

// sell.js - the afternoon at the window: critics arrive, you pick a batch, they SNIFF it, CRUNCH it, pay, tip and review
(() => {
  const B = BC, D = { arrive: 0.9, sniff: 2.4, sniffR: 1.6, crunch: 2.1, crunchR: 1.6, leave: 0.8 };
  B.speed = 1;
  const s = B.sell = {
    bu: null, phase: '', pt: 0, slide: 1, sniff: 0, chew: 0, mood: 'idle', say: '', batch: null, smellV: 0, crunchV: 0, stars: 0, till: 0, closed: false,
    busy() { return !!this.bu && this.phase !== 'ask' && this.phase !== 'pay'; },
    buyerCount() { const S = B.S; let n = 3 + (B.has('sign') ? 1 : 0) + (B.has('van') ? 1 : 0) + Math.floor(B.rankIdx(S.rep) / 2); if (S.event && S.event.id === 'storm') n -= 2; if (S.event && S.event.id === 'breakdown' && !S.event.fixed) n -= 2; return Math.max(1, n); },
    makeQueue() {
      const ids = B.BUYERS.map((b) => b.id).sort(() => Math.random() - 0.5), n = this.buyerCount(), q = [];
      for (let i = 0; i < n; i++) q.push(ids[i % ids.length]);
      if (B.S.event && B.S.event.id === 'celeb') q.splice(Math.min(1, q.length), 0, 'celeb');
      return q;
    },
    next() {
      const S = B.S; this.stars = 0; this.batch = null; this.sniff = 0; this.chew = 0; this.mood = 'idle'; this.smellV = 0; this.crunchV = 0;
      if (S.qi >= S.queue.length || !S.stock.length) return this.close();
      this.bu = B.buyerById(S.queue[S.qi]); this.phase = 'arrive'; this.pt = 0; this.slide = 1; this.say = this.bu.hi; this.closed = false;
      B.panel('<p class="mini">Someone\'s walking up to the window...</p>'); B.hud();
    },
    askPanel() {
      const bu = this.bu, S = B.S;
      const cards = S.stock.map((b, i) => '<div class="card pickable" data-i="' + i + '"><i class="swatch" style="background:' + B.hsl(b.shade.h, b.shade.s, b.shade.l) + '"></i><div class="info"><b>' + B.esc(b.name) + (b.flavs.includes(bu.fav) ? ' <span class="tag fav">♥ fav</span>' : '') + '</b><small>' +
        B.pct(b.purity) + ' pure' + (b.purity < bu.min ? ' <span class="tag late">below ' + bu.min + '%</span>' : '') + ' · smell ' + b.smell + ' · crunch ' + b.crunch + ' · ' + b.size + 'mm · ' + b.boxes + ' boxes</small></div></div>').join('');
      B.panel('<div class="card"><div class="info"><b>' + bu.n + (bu.celeb ? ' 🌟' : '') + '</b><small>' + bu.quirk + '</small><div class="chips" style="margin:4px 0 0"><span class="tag fav">♥ ' + B.FLAV[bu.fav].n + '</span><span class="tag">wants ≥ ' + bu.min + '% purity</span><span class="tag">customer ' + (S.qi + 1) + '/' + S.queue.length + '</span></div></div></div>' +
        '<h3 style="margin:10px 0 6px">Serve which batch?</h3><div class="cards">' + cards + '</div>' +
        '<div class="row"><span class="pill">Price/box <button class="cbtn small" id="pDn">−</button><b id="pV">' + B.money(S.price) + '</b><button class="cbtn small" id="pUp">+</button></span><button class="cbtn small" id="sAway">Turn away</button></div>' +
        (S.rivalPrice ? '<p class="mini">Duke Fudgeworth sells for ' + B.money(S.rivalPrice) + ' at ' + B.rivalPurity().toFixed(1) + '%. Beat his purity or his price!</p>' : ''));
      B.$$('#panel .pickable').forEach((c) => c.onclick = () => { B.sfx('tap'); this.serve(+c.dataset.i); });
      const setP = (d) => { S.price = B.clamp(S.price + d, 2, 40); B.$('#pV').textContent = B.money(S.price); B.save(); };
      B.on('#pDn', () => setP(-1)); B.on('#pUp', () => setP(1));
      B.on('#sAway', () => { this.say = 'Hmph! Fine, I\'ll go to the gold truck.'; this.mood = 'meh'; B.S.qi++; B.save(); this.phase = 'leave'; this.pt = 0; });
    },
    serve(i) {
      const b = B.S.stock[i]; if (!b || this.phase !== 'ask') return;
      this.batch = b; this.j = B.judge(this.bu, b); this.deal = B.deal(this.bu, b, this.j, B.S);
      this.phase = 'sniff'; this.pt = 0; this.say = '*sniff sniff sniff*'; B.sfx('sniff');
      B.panel('<div class="react" id="r1">👃 Sniff test...</div>');
    },
    update(dt) {
      if (!this.bu) return; dt *= B.speed; this.pt += dt; const j = this.j, b = this.batch, bu = this.bu;
      if (this.phase === 'arrive') { this.slide = Math.max(0, 1 - this.pt / D.arrive); if (this.pt >= D.arrive) { this.phase = 'ask'; this.askPanel(); } }
      else if (this.phase === 'sniff') {
        this.sniff = 0.5 + 0.5 * Math.sin(this.pt * 10); this.smellV = B.clamp(this.pt / D.sniff, 0, 1) * b.smell / 10;
        if (Math.random() < dt * 14) B.emit(330 + B.rnd(-20, 20), 330, 1, { kind: 'smell', g: -60, ang: -1.9, spread: 0.4, s0: 60, s1: 120, hue: b.burnt ? 30 : B.FLAV[b.flavs[0]].hue + 120, z0: 6, z1: 12 });
        if (this.pt >= D.sniff) { this.sniff = 0; this.phase = 'sniffR'; this.pt = 0; this.say = B.sniffLine(bu, b, j); this.mood = j.aroma > 0.7 ? 'love' : j.aroma < 0.4 ? 'bad' : 'idle'; B.sfx(j.aroma > 0.7 ? 'ooh' : j.aroma < 0.4 ? 'yuck' : 'tap'); B.$('#r1').innerHTML = '👃 ' + B.esc(this.say); }
      } else if (this.phase === 'sniffR') { if (this.pt >= D.sniffR) { this.phase = 'crunch'; this.pt = 0; this.mood = 'idle'; this.say = ''; this.ct = 0; } }
      else if (this.phase === 'crunch') {
        this.chew = this.pt; this.crunchV = B.clamp(this.pt / D.crunch, 0, 1) * b.crunch / 10; this.ct -= dt;
        if (this.ct <= 0) { this.ct = 0.45; B.sfx('crunch'); B.emit(300 + B.rnd(-10, 10), 270, 7, { kind: 'shard', hue: b.shade.h, s0: 60, s1: 200, z0: 3, z1: 6, ang: -Math.PI / 2, spread: 1.4 }); }
        if (this.pt >= D.crunch) { this.chew = 0; this.phase = 'crunchR'; this.pt = 0; this.say = B.crunchLine(bu, b, j); this.mood = j.tex > 0.7 ? 'love' : j.tex < 0.4 ? 'bad' : 'idle'; B.$('#panel').insertAdjacentHTML('beforeend', '<div class="react">🦷 ' + B.esc(this.say) + '</div>'); }
      } else if (this.phase === 'crunchR') { if (this.pt >= D.crunchR) this.pay(); }
      else if (this.phase === 'leave') { this.slide = -Math.min(1, this.pt / D.leave); if (this.pt >= D.leave) { this.bu = null; this.next(); } }
    },
    pay() {
      const S = B.S, j = this.j, d = this.deal, b = this.batch, bu = this.bu;
      this.phase = 'pay'; this.stars = j.stars; this.mood = j.stars >= 4 ? 'love' : j.stars <= 2 ? 'bad' : 'meh';
      this.say = j.stars >= 4 ? bu.love : j.stars <= 2 ? bu.bad : bu.meh; B.sfx(j.stars <= 2 ? 'yuck' : 'cash');
      b.boxes -= d.boxes; if (b.boxes <= 0) S.stock.splice(S.stock.indexOf(b), 1);
      this.till = d.pay + d.tip; B.addMoney(d.pay + d.tip); B.addRep(d.rep); S.stats.boxes += d.boxes;
      if (j.stars === 5) S.stats.five++;
      S.stats.reviews.unshift({ who: bu.n, stars: j.stars, text: this.say, day: S.day, candy: b.name }); S.stats.reviews.length = Math.min(30, S.stats.reviews.length);
      S.qi++; B.save(); B.story && B.story.onSale(j, bu); B.checkAch();
      if (j.stars >= 4) B.emit(95, 380, 14, { kind: 'glint', col: '#ffe36b', g: 200, ang: -Math.PI / 2, spread: 0.8, s0: 120, s1: 260 });
      B.$('#panel').insertAdjacentHTML('beforeend', '<div class="rev"><b>' + B.stars(j.stars) + '</b> “' + B.esc(this.say) + '” <br>— ' + bu.n + '</div>' +
        '<p>Bought <b>' + d.boxes + '</b> box' + (d.boxes > 1 ? 'es' : '') + ' for <b>' + B.money(d.pay) + '</b>' + (d.tip ? ' + <b>' + B.money(d.tip) + '</b> tip' : '') + ' · rep ' + (d.rep >= 0 ? '+' : '') + d.rep + '</p>' +
        (d.notes.length ? '<p class="mini">' + d.notes.map(B.esc).join(' ') + '</p>' : '') + '<div class="row"><button class="cbtn big blue" id="sNext">Next customer ➜</button></div>');
      B.on('#sNext', () => { this.phase = 'leave'; this.pt = 0; this.stars = 0; this.till = 0; });
    },
    close() {
      const S = B.S; this.bu = null; this.closed = true; this.phase = ''; B.hud();
      B.panel('<h2>Window closed!</h2><p>' + (S.stock.length ? 'That\'s everyone for today.' : 'Sold out!') + ' Today you took <b>' + B.money(S.todayEarn) + '</b> and ' + (S.todayRep >= 0 ? 'gained' : 'lost') + ' <b>' + Math.abs(S.todayRep) + '</b> reputation.</p>' +
        '<p class="mini">Got orders? Deliver them from 📋 Orders before you sleep.</p><div class="row"><button class="cbtn big blue" id="sEnd">🌙 End the day</button></div>');
      B.on('#sEnd', () => B.endDay());
    }
  };
  B.goWindow = () => {
    if (B.busy()) return; const S = B.S; B.$('#modal').classList.add('hide');
    if (S.phase === 'evening') { B.toast('It\'s night! End the day to open again tomorrow.', 'warn'); return; }
    if (S.phase === 'lab') { if (!S.stock.length) { B.toast('Nothing on the shelf yet. Cook a batch first! 🧪', 'warn'); return; } S.phase = 'window'; S.queue = s.makeQueue(); S.qi = 0; B.save(); }
    B.view = B.windowView; s.closed = false; s.bu = null; s.next();
  };
  B.resumeWindow = () => { B.view = B.windowView; s.bu = null; s.next(); };
})();

(() => {

    const S = B.S, owned = B.FLAV_IDS.filter((f) => S.owned[f]), ri = B.rankIdx(S.rep, S.legend);
    const min = Math.min(97, 68 + ri * 5 + B.ri(0, 8)), boxes = B.ri(2, 4 + Math.min(2, ri));
    const o = { id: B.uid(), who: B.pick(WHO), flav: B.pick(owned), min, boxes, due: S.day + B.ri(2, 3), pay: Math.round(boxes * 11 * (1 + (min - 68) / 25)), rep: 6 + ri };
    S.orders.push(o); return o;
  };
  B.orderMatch = (o) => B.S.stock.filter((b) => b.flavs.includes(o.flav) && b.purity >= o.min && b.boxes >= o.boxes).sort((a, b) => b.purity - a.purity)[0];
  B.deliver = (id) => {
    const S = B.S, o = S.orders.find((x) => x.id === id); if (!o) return false; const b = B.orderMatch(o); if (!b) return false;
    b.boxes -= o.boxes; if (b.boxes <= 0) S.stock.splice(S.stock.indexOf(b), 1);
    S.orders.splice(S.orders.indexOf(o), 1); B.addMoney(o.pay); B.addRep(o.rep); S.stats.orders = (S.stats.orders || 0) + 1;
    B.sfx('cash'); B.toast('📦 Delivered to ' + B.esc(o.who) + '! +' + B.money(o.pay), 'good'); B.save(); B.checkAch(); return true;
  };
  B.expireOrders = () => {
    const S = B.S, late = S.orders.filter((o) => o.due < S.day);
    late.forEach((o) => { S.orders.splice(S.orders.indexOf(o), 1); B.addRep(-6); B.toast('⌛ Missed the order for ' + B.esc(o.who) + '. Reputation −6', 'warn', 3200); });
    if (S.orders.length < 3 && S.day >= S.nextOrder) { const o = B.newOrder(); S.nextOrder = S.day + B.ri(1, 2); B.toast('📬 New order from ' + B.esc(o.who) + '!', 'gold'); }
  };
  B.openOrders = () => {
    const S = B.S;
    const list = S.orders.map((o) => {
      const b = B.orderMatch(o), left = o.due - S.day;
      return '<div class="card"><i class="swatch" style="background:' + B.FLAV[o.flav].col + '"></i><div class="info"><b>' + B.esc(o.who) + '</b><small>' + o.boxes + ' boxes of <b>' + B.FLAV[o.flav].n + '</b> (any recipe with it) · ≥ ' + o.min + '% purity</small>' +
        '<small><span class="tag ' + (left <= 0 ? 'late' : '') + '">' + (left <= 0 ? 'due TODAY' : 'due in ' + left + ' day' + (left > 1 ? 's' : '')) + '</span> <span class="tag ok">' + B.money(o.pay) + ' · +' + o.rep + ' rep</span></small></div>' +
        '<button class="cbtn small ' + (b ? 'go' : '') + '" data-o="' + o.id + '"' + (b ? '' : ' disabled') + '>Deliver</button></div>';
    }).join('');
    const c = B.modal('<h2>📋 Orders</h2><p class="mini" style="text-align:left">Postcards from around the desert. Cook a batch that matches, then deliver it here. Missed deadlines cost reputation.</p><div class="cards">' + (list || '<p>No orders right now. More arrive every day or two!</p>') + '</div>');
    c.querySelectorAll('[data-o]').forEach((btn) => btn.onclick = () => { if (B.deliver(btn.dataset.o)) B.openOrders(); });
  };
})();

  };

    B.sfx(e.sfx); B._onClose = () => finish();
    const finish = () => { B._onClose = null; B.$('#modal').classList.add('hide'); B.applyEvent(); done && done(); };
    const ok = c.querySelector('#eOk'); if (ok) ok.onclick = () => { B.sfx('tap'); finish(); };
    const fx = c.querySelector('#eFix'); if (fx) fx.onclick = () => { S.money -= 40; S.event.fixed = true; B.hud(); B.toast('🔧 Good as new! (ish)', 'good'); finish(); };

    const sc = c.querySelector('#eScrub'); if (sc) sc.onclick = () => { B._onClose = null; B.$('#modal').classList.add('hide'); B.scrub(() => { B.applyEvent(); done && done(); }); };
  };
  B.applyEvent = () => {
    const S = B.S, id = S.event && S.event.id; if (!id || S.event.applied) return; S.event.applied = true;
    if (id === 'inspector') {
      if (S.clean >= 60) { B.addRep(8); S.stats.inspections++; B.toast('✅ Inspector Clipboard: "Spotless! Gold star." +8 rep', 'good', 3600); B.sfx('good'); }
      else { S.money = Math.max(0, S.money - 40); B.addRep(-6); B.toast('❌ "Sticky floors! Fine: $40." −6 rep', 'warn', 3600); B.sfx('yuck'); }
    }

    const blobs = []; for (let i = 0; i < 14; i++) blobs.push({ x: B.rnd(60, 580), y: B.rnd(150, 400), r: B.rnd(22, 40), a: 1 });
    let t = 0, px = -99, py = -99, on = false, tick = 0;
    const finish = () => { const wiped = B.avg(blobs.map((b) => 1 - b.a)); B.S.clean = Math.min(100, B.S.clean + wiped * 70); B.save(); B.hud(); B.toast('🧽 Lab is now ' + Math.round(B.S.clean) + '% clean', 'good'); B.view = B.prevView || B.labView; done && done(); };
    B.prevView = B.view;
    B.view = {
      down(x, y) { on = true; px = x; py = y; }, move(x, y) { px = x; py = y; }, up() { on = false; },
      update(dt) {
        t += dt; if (on) blobs.forEach((b) => { if (Math.hypot(b.x - px, b.y - py) < b.r + 18 && b.a > 0) { b.a = Math.max(0, b.a - dt * 2.6); tick += dt; if (tick > 0.12) { tick = 0; B.sfx('scrub'); B.emit(px, py, 1, { kind: 'dot', col: 'rgba(255,255,255,.8)', g: 50, s0: 20, s1: 80, z0: 4, z1: 8, l0: 0.3, l1: 0.6 }); } } });
        if (t > 7 || blobs.every((b) => b.a <= 0)) { this.update = () => {}; finish(); }
      },
      draw(g, tt) {
        B.vanBg(g, tt, { clean: true }); blobs.forEach((b) => { g.fillStyle = 'rgba(120,90,30,' + 0.75 * b.a + ')'; g.beginPath(); g.ellipse(b.x, b.y, b.r, b.r * 0.6, 0, 0, 7); g.fill(); });
        g.fillStyle = '#ffd34d'; B.rr(g, px - 22, py - 14, 44, 28, 8); g.fill(); g.fillStyle = '#7fe0a8'; B.rr(g, px - 22, py + 6, 44, 10, 4); g.fill();
        B.txt(g, 'SCRUB! Drag over the sticky spots · ' + Math.max(0, 7 - t).toFixed(1) + 's', 320, 60, 20, '#fff', 'center', '#16224a');
      }
    };
    B.panel('<div class="mgHead"><b>🧽 Scrub the lab</b><span>Press and drag across the sticky sugar spots to wipe them up!</span></div>');
  };
})();

// story.js - THE PURITY WAR: 5 chapters against rival candy cook Duke Fudgeworth, ending at the Candy Fair showdown
(() => {
  const B = BC;
  const CH = [null,
    { t: 'Chapter 1: A Shiny Truck Appears', d: 'A GOLD food truck has parked across the dune. Out steps Duke Fudgeworth, twirling his moustache: "Ninety percent purity, five dollars a box! Your little van is DONE, amateur!"', goal: 'Cook a batch of 90% purity or better', rew: [60, 15] },
    { t: 'Chapter 2: The Rumour Mill', d: 'Duke is telling every critic in the desert that your candy "tastes like a sandbox". Time to prove him wrong where it counts: the reviews.', goal: 'Earn 3 five-star reviews', rew: [90, 20] },
    { t: 'Chapter 3: The Flavour Heist', d: 'Duke snuck a look at your recipe book and now sells "Duke\'s Blue Raspberry". Copycat! Only brand-new recipes will keep you ahead.', goal: 'Invent 2 new combo recipes (pick two flavours)', rew: [140, 25] },
    { t: 'Chapter 4: The Purity War', d: '"NINETY-SEVEN PERCENT!" Duke bellows through a megaphone shaped like a lollipop. The whole desert is watching. Can your van out-cook a golden truck?', goal: 'Cook a batch of 97.5% purity or better', rew: [200, 35] },
    { t: 'Chapter 5: The Candy Fair Showdown', d: 'It all comes down to this: the Grand Desert Candy Fair. Three judges. Two cooks. Duke brings a 99.0% masterpiece. Bring your very best batch!', goal: 'Win the Candy Fair (enter from the 🧪 Cook screen)', rew: [500, 120] }
  ];
  B.CHAPTERS = CH;
  const S = () => B.S;
  B.story = {
    progress() {
      const s = S(), c = s.ch;
      if (c === 1 || c === 4) return s.chFlag ? 1 : 0;
      if (c === 2) return B.clamp((s.stats.five - s.chStart.five) / 3, 0, 1);
      if (c === 3) return B.clamp((s.stats.combos - s.chStart.combos) / 2, 0, 1);
      if (c === 5) return s.fairWon ? 1 : 0;
      return 0;
    },
    check() {
      const s = S(), c = s.ch; if (c < 1 || c > 5 || s.chDone.includes(c)) return;
      if (this.progress() >= 1) {
        s.chDone.push(c); const [m, r] = CH[c].rew; B.addMoney(m); B.addRep(r); B.sfx('fanfare');
        B.toast('🏆 <b>' + CH[c].t.split(':')[0] + ' complete!</b> +' + B.money(m) + ', +' + r + ' rep', 'gold', 4200); B.save();
      }
    },
    onBatch(b) { const s = S(); if ((s.ch === 1 && b.purity >= 90) || (s.ch === 4 && b.purity >= 97.5)) s.chFlag = true; this.check(); }, onSale() { this.check(); },
    // at the start of each day: open chapter 1 on day 2, or the next chapter once the previous one is done
    dayStart() {
      const s = S();
      if (s.ch === 0 && s.day >= 2) return this.open(1);
      if (s.ch >= 1 && s.ch < 5 && s.chDone.includes(s.ch)) return this.open(s.ch + 1);
      return false;
    },
    open(n) {
      const s = S(); s.ch = n; s.chFlag = false; s.chStart = { five: s.stats.five, combos: s.stats.combos }; s.rivalPrice = n <= 4 ? [0, 5, 6, 6, 7][n] : 0; B.save();
      this.show(n); return true;
    },
    show(n) {
      const c = CH[n]; const card = B.modal('<canvas id="dukeCv" width="220" height="200" style="display:block;margin:0 auto;width:160px;height:145px"></canvas><h2 style="text-align:center">' + c.t + '</h2><p>' + c.d + '</p><div class="rev"><b>GOAL:</b> ' + c.goal + '<br><small>Reward: ' + B.money(c.rew[0]) + ' + ' + c.rew[1] + ' reputation</small></div><div class="row"><button class="cbtn big blue" id="stOk">Bring it on!</button></div>', 'ev');
      const g = card.querySelector('#dukeCv').getContext('2d'); B.drawBuyer(g, B.DUKE, 110, 120, 0.62, { t: 1, mood: n === 5 ? 'meh' : 'idle' });
      B.sfx('whistle'); card.querySelector('#stOk').onclick = () => { B.sfx('tap'); B.closeModal(); };
    },
    goalHtml() {
      const s = S(); if (s.ch < 1) return ''; if (s.ch > 5 || (s.ch === 5 && s.fairWon)) return '<p class="mini">🏆 You beat Duke Fudgeworth. The desert bows to your crystals.</p>';
      const c = CH[s.ch], done = s.chDone.includes(s.ch);
      return '<div class="rev"><b>' + c.t + '</b><br>' + (done ? '✅ Done! Next chapter tomorrow.' : '🎯 ' + c.goal + ' · ' + Math.round(this.progress() * 100) + '%') + '</div>';
    }
  };
})();

// fair.js - the Grand Desert Candy Fair: three judges sniff and crunch your batch and Duke's, then hold up scorecards
(() => {
  const B = BC, JUDGES = ['owl', 'chef', 'lizard'];
  B.fairScore = (b) => { const per = JUDGES.map((id) => Math.round(B.judge(B.buyerById(id), b).total * 100) / 10); return { per, total: Math.round((per.reduce((s, v) => s + v, 0) + (b.purity - 90) * 0.6) * 10) / 10 }; };
  B.canFair = () => B.S.ch === 5 && !B.S.fairWon && B.S.fairDay !== B.S.day;
  B.fairPanel = () => {
    const S = B.S;
    if (!S.stock.length) { B.toast('Bring a batch! Cook something first.', 'warn'); return; }
    B.panel('<h2>🏆 The Candy Fair</h2><p>Pick your entry. Judges: Professor Hootsworth (purity!), Chef Pompadour (colour!) and Duchess Gecko (sparkle!). Duke brings ' + B.pct(B.DUKE_BATCH.purity) + '.</p><div class="cards">' +
      S.stock.map((b, i) => '<div class="card pickable" data-i="' + i + '"><i class="swatch" style="background:' + B.hsl(b.shade.h, b.shade.s, b.shade.l) + '"></i><div class="info"><b>' + B.esc(b.name) + '</b><small>' + B.pct(b.purity) + ' · clarity ' + b.clarity + ' · colour ' + b.colour + ' · crunch ' + b.crunch + '</small></div></div>').join('') +
      '</div><div class="row"><button class="cbtn" id="fBack">Not yet</button></div>');
    B.$$('#panel .pickable').forEach((c) => c.onclick = () => { B.sfx('tap'); B.runFair(S.stock[+c.dataset.i]); });
    B.on('#fBack', () => B.goLab());
  };
  B.runFair = (b) => {
    const S = B.S; S.fairDay = S.day; B.save();
    const mine = B.fairScore(b), duke = B.fairScore(B.DUKE_BATCH), win = mine.total > duke.total;
    const steps = []; JUDGES.forEach((id, k) => { steps.push({ k, who: 'you', a: 'sniff' }, { k, who: 'you', a: 'crunch' }, { k, who: 'duke', a: 'sniff' }, { k, who: 'duke', a: 'crunch' }); });
