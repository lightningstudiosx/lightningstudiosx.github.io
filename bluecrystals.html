    const sun = g.createRadialGradient(W / 2, H * 0.98, 0, W / 2, H * 0.98, H * 0.6); sun.addColorStop(0, 'rgba(255,220,140,.9)'); sun.addColorStop(1, 'rgba(255,150,80,0)'); g.fillStyle = sun; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,.7)'; for (let i = 0; i < 60; i++) { const r = B.srand(i + 9); g.fillRect(r() * W, r() * H * 0.5, 2, 2); }
    const L = B.crystalText(['MAKE BLUE', 'CRYSTALS'], W, H, 330, { lh: 0.98 }); g.drawImage(L, 0, 0);
    for (let i = 0; i < 16; i++) { const p = L.pts[(i * 131) % L.pts.length]; B.glint(g, p[0], p[1], 34, 0.9); }
    return c.toDataURL('image/png');
  };
})();

// ===== main.js =====
// main.js - boot: load the save, size the canvas, run the frame loop, route pointer/keyboard input to the current view
(() => {
  const B = BC, cv = B.$('#cv'), g = cv.getContext('2d');
  let scale = 1, dpr = 1, last = performance.now(), T = 0;
  B.view = null;
  B.fit = () => {
    const wrap = B.$('#stageWrap'), narrow = window.innerWidth <= 860;
    if (narrow) wrap.style.height = Math.round(Math.min(wrap.clientWidth * B.H / B.W, window.innerHeight * 0.46)) + 'px'; else wrap.style.height = '';
    const w = wrap.clientWidth, h = wrap.clientHeight || w * B.H / B.W;
    scale = Math.max(0.2, Math.min(w / B.W, h / B.H)); dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width = Math.floor(B.W * scale) + 'px'; cv.style.height = Math.floor(B.H * scale) + 'px';
    cv.width = Math.floor(B.W * scale * dpr); cv.height = Math.floor(B.H * scale * dpr);
  };
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * B.W, (e.clientY - r.top) / r.height * B.H]; };
  let down = false;
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); down = true; try { cv.setPointerCapture(e.pointerId); } catch (er) { } const [x, y] = pos(e); B.view && B.view.down && B.view.down(x, y); });
  cv.addEventListener('pointermove', (e) => { const [x, y] = pos(e); B.view && B.view.move && B.view.move(x, y, down); });
  const up = (e) => { if (!down) return; down = false; const [x, y] = pos(e); B.view && B.view.up && B.view.up(x, y); };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  const key = (d) => (e) => { if (e.target && e.target.tagName === 'INPUT') return; if (e.key === ' ' && d) e.preventDefault(); if (e.repeat) return; B.view && B.view.key && B.view.key(e.key, d); };
  window.addEventListener('keydown', key(true)); window.addEventListener('keyup', key(false));
  window.addEventListener('resize', () => { B.fit(); B.titleFit && B.titleFit(); });

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
    try {
      if (!B.$('#app').classList.contains('hide') && B.view) {
        B.view.update && B.view.update(dt);
        g.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0); g.clearRect(0, 0, B.W, B.H);
        B.view.draw(g, T); B.drawParts(g, dt);
      }
      B.titleFrame && B.titleFrame(dt, T);
    } catch (err) { console.error(err); }
    requestAnimationFrame(frame);
  }

  const nav = (id, fn) => B.$(id).addEventListener('click', () => { B.sfx('tap'); const f = fn(); f && f(); });
  nav('#nLab', () => B.goLab); nav('#nWin', () => B.goWindow); nav('#nOrd', () => B.openOrders); nav('#nShop', () => B.openShop);
  nav('#nBook', () => B.openBook); nav('#nEnd', () => B.endDay); nav('#nMenu', () => B.openMenu);
  B.$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') B.closeModal(); });

  B.enterApp = () => {
    B.$('#title').classList.add('hide'); B.$('#app').classList.remove('hide'); B.fit(); B.hud();
    if (B.S.phase === 'window' && B.resumeWindow) B.resumeWindow();
    else if (B.S.phase === 'evening' && B.showEvening) B.showEvening();
    else B.goLab();
    if (!B.S.tut && B.howTo) B.howTo();
  };
  B.load(); B.fit(); B.titleInit && B.titleInit();
  if (/[?&]play\b/.test(location.search)) B.enterApp();
  window.BCready = true;
  requestAnimationFrame(frame);
})();
