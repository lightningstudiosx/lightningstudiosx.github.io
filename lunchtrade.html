<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LUNCH TRADE · Kai.fun</title>
<meta name="description" content="LUNCH TRADE - the soggy sandwich exchange. Bargain with 26 classmates over grape juice boxes, slightly soggy PB&Js and the legendary snowman cookie. Make fair trades, spot welchers, keep your reputation.">
<meta name="theme-color" content="#7fb28a">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
/* style1.css - LUNCH TRADE "Crayon Cafeteria": construction paper, crayon ink, tray-green tables */
:root {
--paper: #f0c987; --paper2: #f7e3b3; --milk: #fffdf5; --ink: #3e2723; --ink2: #6d4c41;
--tray: #7fb28a; --trayD: #3f6b4a; --grape: #7b3f9e; --grapeD: #4e2466; --apple: #f2b632; --appleD: #a8740d;
--cherry: #d9443b; --butter: #ffe082; --sky: #9fd3f0; --good: #2e7d32; --bad: #c62828;
--r: 14px; --shadow: 3px 4px 0 rgba(62, 39, 35, .85);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
body { font-family: Gaegu, 'Comic Sans MS', cursive; font-weight: 700; font-size: 17px; line-height: 1.25; overscroll-behavior: none; }
button { font-family: inherit; font-weight: 700; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; max-width: 100vw; }
#app.shake { animation: shake .35s linear 2; }
@keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-5px, 2px); } 50% { transform: translate(4px, -3px); } 75% { transform: translate(-3px, -2px); } }
#top { flex: 0 0 auto; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--trayD); color: #fff; z-index: 30;
border-bottom: 3px solid var(--ink); }
#kai { color: #fff; text-decoration: none; font-size: 18px; padding: 4px 10px; border-radius: 10px; background: rgba(255, 255, 255, .12); white-space: nowrap; }
#kai:hover { background: rgba(255, 255, 255, .25); }
#topMid { flex: 1; min-width: 0; }
.ib { border: 2px solid var(--ink); background: var(--milk); border-radius: 10px; min-width: 36px; height: 34px; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; padding: 0 6px; box-shadow: 2px 2px 0 var(--ink); }
.ib:active { transform: translate(2px, 2px); box-shadow: none; }
.ib.sm { height: 30px; min-width: 32px; font-size: 15px; }
.screen { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; }
.hide { display: none !important; }
/* crayon "lunch ticket" buttons */
.tk { border: 3px solid var(--ink); background: var(--milk); border-radius: var(--r); padding: 8px 14px; font-size: 18px; box-shadow: var(--shadow); transition: transform .08s; position: relative; }
.tk:hover:not(:disabled) { transform: translate(-1px, -1px) rotate(-.4deg); }
.tk:active:not(:disabled) { transform: translate(3px, 4px); box-shadow: none; }
.tk.big { font-size: 22px; padding: 12px 18px; }
.tk.sm { font-size: 15px; padding: 5px 10px; border-width: 2px; box-shadow: 2px 3px 0 var(--ink); }
.tk.grape { background: var(--grape); color: #fff; }
.tk.apple { background: var(--apple); }
.tk.cherry { background: var(--cherry); color: #fff; }
.tk.butter { background: var(--butter); }
.tk small { display: block; font-size: 14px; opacity: .85; font-weight: 400; }
.tk.wrap { white-space: normal; }
.rowBtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin-top: 14px; }
.sub { color: var(--ink2); font-weight: 400; }
.empty { color: var(--ink2); font-weight: 400; font-size: 15px; padding: 6px; }
h2, h3 { font-family: 'Luckiest Guy', Gaegu, cursive; font-weight: 400; letter-spacing: 1px; margin: 6px 0; }
h3 { font-size: 20px; color: var(--grapeD); }
/* ---- home ---- */
#home { overflow: hidden; }
#homeCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#homeUi { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 16px 14px; pointer-events: none; overflow-y: auto; }
#homeUi > * { pointer-events: auto; }
#homeTitleSpace { width: min(92vw, 760px); height: min(30vh, 290px); flex: 0 0 auto; pointer-events: none !important; }
#homeBtns { display: flex; flex-direction: column; gap: 10px; width: min(92vw, 440px); margin-top: 4px; }
#homeBtns .row { display: flex; gap: 10px; }
#homeBtns .row .tk { flex: 1; font-size: 16px; padding: 8px 6px; }
#homeBtns .tk.big { transform: rotate(-.6deg); }
#homeBtns .tk.big:nth-child(2) { transform: rotate(.5deg); }
#homeBtns .tk.big b { font-family: 'Luckiest Guy', Gaegu, cursive; font-weight: 400; font-size: 26px; letter-spacing: 1px; }
#homeStats { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 15px; color: #fff; text-shadow: 1px 1px 0 var(--trayD); }
#homeStats span { background: rgba(63, 107, 74, .65); padding: 2px 10px; border-radius: 10px; }
#toast { position: fixed; left: 50%; bottom: 110px; transform: translate(-50%, 30px); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 12px; opacity: 0; pointer-events: none;
transition: .25s; z-index: 80; max-width: calc(100vw - 32px); text-align: center; font-size: 16px; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast.good { background: var(--good); } #toast.bad { background: var(--bad); }
#fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 70; }
#floats { position: fixed; inset: 0; pointer-events: none; z-index: 75; overflow: hidden; }
.float { position: absolute; transform: translate(-50%, 0); font-family: 'Luckiest Guy', Gaegu, cursive; font-size: clamp(22px, 5vw, 38px); color: #fff; white-space: nowrap;
-webkit-text-stroke: 2px var(--ink); text-shadow: 3px 3px 0 var(--ink); animation: floatUp 1.7s ease-out forwards; max-width: 96vw; overflow: hidden; text-overflow: ellipsis; }
.float.good { color: #8ef08a; } .float.bad { color: #ff7a6e; } .float.meh { color: var(--butter); }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70px) scale(1); } }
.stars i { font-style: normal; color: rgba(62, 39, 35, .25); font-size: 20px; }
.stars i.on { color: #ffb300; text-shadow: 1px 1px 0 var(--ink); }
/* style2.css - the cafeteria screen: HUD, scene, goals, feed, your lunchbox strip, item cards, overlays */
#cafe { display: flex; flex-direction: column; }
#hud { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--paper2); border-bottom: 3px solid var(--ink); flex-wrap: nowrap; overflow: hidden; }
.hv { display: flex; align-items: center; gap: 4px; background: var(--milk); border: 2px solid var(--ink); border-radius: 10px; padding: 2px 8px; min-width: 0; white-space: nowrap; }
.hv .hk { font-size: 13px; color: var(--ink2); }
.hv b { font-size: 18px; }
#hClock { flex: 1 1 auto; min-width: 90px; }
#hClock i, #hTens i { position: relative; display: block; flex: 1; height: 10px; min-width: 30px; background: #e8dcc0; border-radius: 6px; border: 1.5px solid var(--ink); overflow: hidden; }
#hFill, #tFill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tray); }
#tFill { background: linear-gradient(90deg, #f2b632, #d9443b); }
#hClock.late b { color: var(--bad); animation: pulse .6s infinite alternate; }
#hTens { width: 74px; flex: 0 0 auto; }
#hTens.hot { animation: pulse .4s infinite alternate; background: #ffd9d4; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
#ledN { font-size: 12px; background: var(--cherry); color: #fff; border-radius: 8px; padding: 0 4px; }
#ledN:empty { display: none; }
#cafeMain { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
#sceneCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#goalsBox { position: absolute; right: 8px; top: 8px; width: min(300px, 46vw); background: rgba(255, 253, 245, .94); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 9px; font-size: 14px;
box-shadow: 2px 3px 0 var(--ink); z-index: 5; }
#goalsBox b { font-family: 'Luckiest Guy', Gaegu, cursive; font-weight: 400; color: var(--grapeD); }
#goalsBox .g { margin: 2px 0; font-weight: 400; } #goalsBox .g.done { color: var(--good); font-weight: 700; } #goalsBox .g.fail { color: var(--bad); text-decoration: line-through; } #goalsBox .g.track { color: var(--good); }
#goalsBox em { font-style: normal; color: var(--grape); font-weight: 700; }
#feed { position: absolute; left: 8px; bottom: 6px; width: min(420px, 70vw); pointer-events: none; z-index: 4; }
.fi { background: rgba(62, 39, 35, .85); color: #fff; font-size: 14px; padding: 3px 9px; border-radius: 9px; margin-top: 3px; font-weight: 400; }
.fi.bad { background: rgba(198, 40, 40, .9); } .fi.good { background: rgba(46, 125, 50, .9); } .fi.warn { background: rgba(168, 116, 13, .92); }
#tapHint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--butter); border: 3px solid var(--ink); padding: 6px 14px; border-radius: 14px; pointer-events: none;
animation: bob 1s infinite alternate; z-index: 6; font-size: 19px; box-shadow: var(--shadow); white-space: nowrap; }
@keyframes bob { from { transform: translate(-50%, 0); } to { transform: translate(-50%, -8px); } }
#incoming { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(460px, calc(100% - 16px)); display: flex; align-items: center; gap: 8px; background: var(--milk);
border: 3px solid var(--ink); border-radius: 14px; padding: 6px 8px; box-shadow: var(--shadow); z-index: 8; animation: popIn .25s; }
#incoming canvas { width: 48px; height: 48px; flex: 0 0 auto; }
#incoming .it { flex: 1; font-size: 15px; font-weight: 400; min-width: 0; }
#incoming .ib2 { display: flex; flex-direction: column; gap: 4px; }
@keyframes popIn { from { transform: translateX(-50%) scale(.7); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
#myBox { flex: 0 0 auto; background: var(--tray); border-top: 3px solid var(--ink); padding: 4px 8px 6px; }
#myBox .lbl { color: #fff; font-family: 'Luckiest Guy', Gaegu, cursive; font-size: 15px; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; text-shadow: 1px 1px 0 var(--trayD); }
#myBox .lbl small { font-family: Gaegu, cursive; font-size: 14px; }
#myItems { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 2px; scrollbar-width: thin; }
/* item cards */
.item { display: flex; align-items: center; gap: 4px; background: var(--milk); border: 2px solid var(--ink); border-radius: 12px; padding: 2px 8px 2px 2px; text-align: left; flex: 0 0 auto;
max-width: 220px; box-shadow: 2px 2px 0 rgba(62, 39, 35, .6); }
.item canvas { flex: 0 0 auto; }
.item .info { display: flex; flex-direction: column; min-width: 0; }
.item .info b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .chips { display: flex; flex-wrap: wrap; gap: 2px; }
.cc { font-style: normal; font-size: 11px; font-weight: 400; padding: 0 4px; border-radius: 6px; background: #f1e6cf; white-space: nowrap; }
.cc.bad { background: #e1ecf4; color: #2c4a63; } .cc.good { background: #e4f3dc; color: #2e5d20; }
.item:hover { transform: translateY(-1px); }
.item.allergen { opacity: .45; }
#bellOv, #pauseOv { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(62, 39, 35, .55); gap: 10px; }
#bellOv div { font-family: 'Luckiest Guy', Gaegu, cursive; font-size: clamp(44px, 12vw, 110px); color: var(--butter); -webkit-text-stroke: 3px var(--ink); text-shadow: 5px 5px 0 var(--ink); animation: ring .12s infinite alternate; }
#bellOv small { color: #fff; font-size: 22px; }
@keyframes ring { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
#pauseOv .pt { font-family: 'Luckiest Guy', Gaegu, cursive; font-size: 52px; color: #fff; -webkit-text-stroke: 2px var(--ink); }
/* style3.css - the bargaining table (trade panel) */
#trade { position: absolute; inset: 0; z-index: 20; background: rgba(62, 39, 35, .45); display: flex; justify-content: center; align-items: flex-start; padding: 8px; overflow-y: auto; }
#tCard { width: min(960px, 100%); background: var(--paper2); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 5px 6px 0 var(--ink); padding: 8px 10px 10px; display: grid; gap: 7px;
background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(80, 140, 200, .12) 27px 28px); animation: cardIn .22s ease-out; }
@keyframes cardIn { from { transform: translateY(18px) rotate(-1deg); opacity: 0; } to { transform: none; opacity: 1; } }
#tHead { display: flex; gap: 10px; align-items: center; }
#tFace { width: 92px; height: 92px; flex: 0 0 auto; }
#tWho { flex: 1; min-width: 0; }
#tName { font-family: 'Luckiest Guy', Gaegu, cursive; font-size: 26px; letter-spacing: 1px; line-height: 1; }
#tName .arch { font-family: Gaegu; font-size: 20px; }
#tTitle { color: var(--grape); font-size: 16px; }
#tMood { font-size: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
#tMood .pat { color: var(--tray); letter-spacing: -1px; } #tMood .pat s { color: rgba(62, 39, 35, .2); text-decoration: none; }
#tNotes { font-size: 14px; font-weight: 400; color: var(--ink2); }
#tNotes .note { display: inline-block; background: var(--butter); border-radius: 6px; padding: 0 5px; margin: 2px 2px 0 0; color: var(--ink); font-weight: 700; }
#tClose { align-self: flex-start; }
#tLog { background: var(--milk); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 8px; height: 92px; overflow-y: auto; font-size: 16px; display: flex; flex-direction: column; gap: 3px; }
.msg { max-width: 88%; padding: 3px 9px; border-radius: 12px; font-weight: 400; }
.msg.kid { background: #fff3c4; align-self: flex-start; border: 1.5px solid #e0c060; }
.msg.kid b { font-weight: 700; color: var(--grapeD); }
.msg.you { background: #d8ecf8; align-self: flex-end; border: 1.5px solid #8fb9d6; }
.msg.sys { align-self: center; background: #ece3cf; font-size: 14px; text-align: center; }
.msg.sys.bad { background: #ffd9d4; color: var(--bad); font-weight: 700; } .msg.sys.good { background: #dff2d8; color: var(--good); font-weight: 700; }
.aiT { font-style: normal; font-size: 10px; background: var(--grape); color: #fff; border-radius: 4px; padding: 0 3px; }
#tDeal { display: grid; grid-template-columns: 1fr minmax(150px, 210px) 1fr; gap: 8px; align-items: stretch; }
.tSide { background: rgba(127, 178, 138, .35); border: 2px dashed var(--trayD); border-radius: 12px; padding: 4px; min-height: 86px; min-width: 0; }
.tSide .lbl, .tray .lbl { font-family: 'Luckiest Guy', Gaegu, cursive; font-size: 14px; color: var(--trayD); letter-spacing: 1px; }
.slots, .tray .items { display: flex; flex-wrap: wrap; gap: 5px; }
.slots .item, .tray .item { flex-direction: column; padding: 2px 3px 3px; width: 92px; text-align: center; align-items: center; gap: 0; }
.slots .item .info, .tray .item .info { align-items: center; width: 100%; }
.slots .item .info b, .tray .item .info b { font-size: 13px; max-width: 86px; }
.slots .cc, .tray .cc { font-size: 12px; padding: 0 2px; }
.slots .cc .ct, .tray .cc .ct { display: none; }
.slots .chips, .tray .chips { justify-content: center; }
.item.hi.in { border-color: var(--cherry); background: #ffe4e0; animation: wig .5s 2; }
.item.hi.out { opacity: .45; text-decoration: line-through; border-style: dashed; }
@keyframes wig { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-4deg); } 70% { transform: rotate(4deg); } }
.iou { background: var(--butter); border: 2px dashed var(--ink); border-radius: 10px; padding: 4px 6px; font-size: 14px; width: 100%; }
.iou.hi.in { border-color: var(--cherry); background: #ffe4e0; }
#tMeter { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-width: 0; }
#meterCv { width: 100%; max-width: 200px; height: 92px; display: block; }
#mVerdict b { display: block; font-family: 'Luckiest Guy', Gaegu, cursive; font-weight: 400; font-size: 17px; letter-spacing: .5px; }
#mVerdict small { display: block; font-size: 13px; font-weight: 400; color: var(--ink2); }
#mBars { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
#mBars:empty { display: none; }
.mbar { display: flex; align-items: center; gap: 6px; font-size: 14px; min-width: 0; }
.mbar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.mbar i { position: relative; flex: 1; height: 12px; background: #eee3cc; border: 1.5px solid var(--ink); border-radius: 6px; min-width: 40px; }
.mbar i em { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.mbar u { position: absolute; top: 0; bottom: 0; border-radius: 5px; transition: .25s; }
.mbar u.pos { background: #5fb35a; } .mbar u.neg { background: #d9443b; }
.mbar b { white-space: nowrap; font-size: 13px; }
#tActs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
#tActs .gone { margin: 0; color: var(--bad); }
#tQuick { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
#tQuick:empty { display: none; }
.qb { border: 2px solid var(--ink); background: var(--milk); border-radius: 20px; padding: 4px 10px; font-size: 15px; box-shadow: 1px 2px 0 var(--ink); }
.qb:hover { background: var(--butter); } .qb:active { transform: translate(1px, 2px); box-shadow: none; }
#tChat { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#tInput { flex: 1 1 200px; min-width: 0; font-family: inherit; font-size: 17px; font-weight: 700; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 12px; background: var(--milk); color: var(--ink); }
.chip { border: 2px solid var(--grape); background: #efe4f6; color: var(--grapeD); border-radius: 12px; font-size: 13px; padding: 3px 8px; }
.chip.on { background: var(--grape); color: #fff; }
#tTrays { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tray { background: rgba(255, 253, 245, .7); border: 2px solid var(--ink2); border-radius: 12px; padding: 4px; min-width: 0; }
/* style4.css - panels (semester, intro, results, Lunch-dex, lunchboxes, settings, how-to), modal, phone layout */
.panel, #intro, #results { overflow-y: auto; padding: 10px 14px 24px; background: var(--paper); }
.ph { display: flex; align-items: center; gap: 10px; max-width: 980px; margin: 0 auto 8px; }
.ph h2 { flex: 1; text-align: center; font-size: 28px; color: var(--grapeD); }
.ph span { min-width: 80px; text-align: right; font-size: 15px; }
#semBody, #dexBody, #boxBody, #howBody, #setBody { max-width: 980px; margin: 0 auto; }
.week { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.dayc { border: 3px solid var(--ink); border-radius: 14px; background: var(--milk); padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 128px; box-shadow: var(--shadow); min-width: 0; }
.dayc small { color: var(--ink2); } .dayc .evi { font-size: 28px; } .dayc b { font-size: 15px; text-align: center; }
.dayc.next { background: var(--butter); animation: bob2 1.2s infinite alternate; }
@keyframes bob2 { from { transform: translateY(0); } to { transform: translateY(-4px); } }
.dayc.locked { background: #e6d7b6; box-shadow: none; }
#introCard, #resCard { max-width: 720px; margin: 0 auto; background: var(--milk); border: 3px solid var(--ink); border-radius: 18px; padding: 14px 16px; box-shadow: 5px 6px 0 var(--ink);
background-image: repeating-linear-gradient(0deg, transparent 0 27px, rgba(80, 140, 200, .14) 27px 28px); }
.ic-top, .rc-top { text-align: center; } .ic-top h2, .rc-top h2 { font-size: clamp(26px, 6vw, 38px); color: var(--grapeD); }
.evb { background: var(--butter); border: 2px solid var(--ink); border-radius: 12px; padding: 5px 10px; font-weight: 400; font-size: 15px; display: inline-block; }
.story { font-size: 18px; font-weight: 400; } .crave { color: var(--grape); }
.goals { margin: 4px 0; padding-left: 22px; } .goals li { margin: 3px 0; }
.goals.res li.done { color: var(--good); } .goals.res li.fail { color: var(--ink2); font-weight: 400; } .goals.res { list-style: none; padding-left: 4px; }
.introBox { display: flex; flex-wrap: wrap; gap: 6px; }
.due { padding: 5px 10px; border-radius: 10px; background: #f1e6cf; font-weight: 400; } .due.good { background: #dff2d8; } .due.bad { background: #ffd9d4; }
table.score { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 18px; }
table.score td { padding: 3px 4px; border-bottom: 1.5px dashed rgba(62, 39, 35, .25); } table.score td:last-child { text-align: right; }
table.score td.neg { color: var(--bad); } table.score tr.tot td { font-family: 'Luckiest Guy', Gaegu, cursive; font-size: 24px; border: 0; }

LT.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
LT.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
LT.lerp = (a, b, t) => a + (b - a) * t;
LT.now = () => performance.now() / 1000;
LT.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
LT.cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
LT.sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
LT.round1 = v => Math.round(v * 10) / 10;
LT.rng = seed => {
let a = seed >>> 0;
const f = () => {
a = (a + 0x6D2B79F5) >>> 0;
let t = a;
t = Math.imul(t ^ (t >>> 15), t | 1);
t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
f.int = n => Math.floor(f() * n);
f.pick = arr => arr[Math.floor(f() * arr.length)];
f.range = (lo, hi) => lo + f() * (hi - lo);
f.chance = p => f() < p;
return f;
};
LT.hash = str => {
let h = 2166136261 >>> 0;
for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
return h >>> 0;
};
LT.R = LT.rng((Date.now() ^ (Math.random() * 1e9)) >>> 0);      // game randomness (re-seeded per day)
LT.C = LT.rng((Date.now() * 7) >>> 0);                          // cosmetic randomness (particles, wobble)
LT.pick = (arr, r) => arr[Math.floor((r || Math.random)() * arr.length)];
LT.shuffle = (arr, r) => { r = r || Math.random; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
LT.weighted = (pairs, r) => {                                   // pairs: [[value, weight], ...]
const tot = LT.sum(pairs, p => Math.max(0, p[1])); let x = (r || Math.random)() * tot;
for (const p of pairs) { x -= Math.max(0, p[1]); if (x <= 0) return p[0]; }
return pairs[pairs.length - 1][0];
};

set(k, v) { try { localStorage.setItem('lt_' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
del(k) { try { localStorage.removeItem('lt_' + k); } catch (e) { /* ignore */ } }
};

h: {},

};
LT.fill = (s, ctx) => String(s).replace(/\{(\w+)\}/g, (m, k) => ctx && ctx[k] != null ? ctx[k] : m);

LT.V = {};

const d = k.def, it = LT.IT[s.id];
if (d.allergy && it.has(d.allergy)) return 0;
let v = it.base * (k.pref[it.cat] == null ? 1 : k.pref[it.cat]);
for (const t of it.tags) { if (d.tagLove[t]) v *= d.tagLove[t]; if (d.tagHate[t]) v *= d.tagHate[t]; }
if (d.onlyTag && !it.has(d.onlyTag)) v *= 0.45;
if (d.loves.includes(s.id)) v *= 1.6;
if (d.hates.includes(s.id)) v *= 0.3;
if (k.loveToday === s.id) v *= 1.5;
if (k.noise) v *= k.noise[s.id] || 1;
if (d.collect && k.inv) v *= k.inv.some(x => x.id === s.id && x.uid !== s.uid) ? 0.6 : 1.3;
if (d.health && LT.HEALTHY(s.id)) v *= 1.3;
const m = k.mood;
if (m === 'hungry' && (it.cat === 'main' || it.has('protein'))) v *= 1.25;
if (m === 'bored' && (it.has('trendy') || it.has('exotic'))) v *= 1.25;
if (m === 'sugar' && LT.SWEETISH(s.id)) v *= 1.3;

};
LT.V.party = (party, s) => LT.sum(party, k => LT.V.kid(k, s)) / party.length;
LT.V.me = s => {
const it = LT.IT[s.id], S = LT.S; let v = it.base;
if (S && S.crave) {
if (S.crave.cats && S.crave.cats.includes(it.cat)) v *= 1.5;
if (S.crave.sweet && LT.SWEETISH(s.id)) v *= 1.4;
if (S.crave.items && S.crave.items.includes(s.id)) v *= 1.9;

LT.V.mkt = s => LT.IT[s.id].base * LT.V.ev(s.id) * LT.Cond.mult(s, null);
LT.V.trust = k => {
const rep = LT.S ? LT.S.rep : 50;
return LT.clamp(0.25 + (rep - 50) / 100 + k.opinion / 220 + (k.def.gull - 0.4) * 0.4 - (k.burned || 0) * 0.25, 0.05, 1);

LT.Ledger.add = (dir, kidId, itemId, extra) => {
const S = LT.S, e = Object.assign({ id: LT.uid(), dir, kid: kidId, item: itemId, made: S.dayNum, due: S.dayNum + 1, status: 'open' }, extra || {});
LT.Ledger.items.unshift(e);
while (LT.Ledger.items.length > 40) LT.Ledger.items.pop();
LT.bus.emit('ledger', e);
return e;
};
LT.Ledger.open = () => LT.Ledger.items.filter(e => e.status === 'open' || e.status === 'welched');
LT.Ledger.youOwe = kidId => LT.Ledger.items.filter(e => e.dir === 'you' && e.status === 'open' && (!kidId || e.kid === kidId));
LT.Ledger.theyOwe = kidId => LT.Ledger.items.filter(e => e.dir !== 'you' && (e.status === 'open' || e.status === 'welched') && (!kidId || e.kid === kidId));
LT.Ledger.dayStart = () => {
const S = LT.S, out = [];
for (const e of LT.Ledger.items) {
if (e.dir !== 'kid' || e.status !== 'open' || e.due > S.dayNum) continue;
const k = LT.Class.k(e.kid);
if (!k.present) { e.due = S.dayNum + 1; continue; }
if (e.willPay) {
const s = LT.Cond.make(e.item, LT.R, {});
S.box.push(s); LT.Dex.see(s); e.status = 'paid';
LT.Class.op(k, 4);
out.push({ e, k, paid: true, line: LT.say(k, 'paid', { item: LT.IT[e.item].nick }) });
} else {
e.status = 'welched'; S.stats.welchedOnYou++;
out.push({ e, k, paid: false, line: LT.say(k, 'excuse', { item: LT.IT[e.item].nick }) });
}
}
return out;
};
LT.Ledger.dayEnd = () => {
const S = LT.S, out = [];
for (const e of LT.Ledger.items) {
if (e.dir !== 'you' || e.status !== 'open' || e.due > S.dayNum) continue;
const k = LT.Class.k(e.kid);
if (!k.present) { e.due = S.dayNum + 1; continue; }
e.status = 'youwelched'; S.stats.youWelched++;
S.rep = LT.clamp(S.rep - 10, 0, 100); LT.Class.op(k, -35); k.burned++;
for (const o of LT.Class.present()) if (o !== k && LT.Class.isFriend(o, k)) LT.Class.op(o, -12);

};
LT.Ledger.canPay = (e, s) => s.id === e.item || (LT.IT[s.id].cat === LT.IT[e.item].cat && LT.V.mkt(s) >= LT.V.mkt(LT.V.typical(e.item)) * 0.8);

const S = LT.S, k = LT.Class.k(e.kid);
S.box.splice(S.box.indexOf(s), 1); k.inv.push(s);
e.status = 'paid'; S.rep = LT.clamp(S.rep + 3, 0, 100); LT.Class.op(k, 14); S.stats.iouPaid++;
LT.Class.gossip(k, 3, 'You paid ' + k.def.name + ' back. People trust you a little more.');
LT.Class.react(k, 'happy', 3);
return LT.say(k, 'thanks');
};
LT.Ledger.callOut = e => {
const S = LT.S, k = LT.Class.k(e.kid), witnesses = LT.Class.present().filter(o => o.def.reporter).length + (S.monitor === 'sub' ? 0 : 1);
if (e.status === 'welched' || e.dir === 'swap') {
S.rep = LT.clamp(S.rep + 5, 0, 100); k.welchKnown++; LT.Class.op(k, -12); S.stats.callouts++;
LT.Class.react(k, 'embarrassed', 3.5);
const p = 0.35 + witnesses * 0.15 + (k.def.bully ? -0.2 : 0);
let got = null;
if (LT.R() < p) {
const orig = e.orig && k.inv.find(x => x.uid === e.orig);
got = orig || k.inv.slice().sort((a, b) => LT.V.mkt(b) - LT.V.mkt(a))[0] || LT.Cond.make(e.item, LT.R, {});
if (k.inv.includes(got)) k.inv.splice(k.inv.indexOf(got), 1);
S.box.push(got); LT.Dex.see(got);

e.status = 'called';
for (const o of LT.Class.present()) if (o !== k && !LT.Class.isFriend(o, k)) LT.Class.op(o, 2);
LT.Day.feed('📢 You called out ' + k.def.name + (e.dir === 'swap' ? ' for the swap.' : ' for welching.') + (got ? ' They coughed up ' + LT.IT[got.id].nick + '.' : ' No payment, but everyone heard.'), 'good');

S.rep = LT.clamp(S.rep - 6, 0, 100); LT.Class.op(k, -15);

LT.Intent.keys = () => {

for (const it of LT.ITEMS) {
const words = new Set((IN_SYN[it.id] || []).concat([it.nick.toLowerCase(), it.name.toLowerCase()]));
const last = it.nick.toLowerCase().split(' ').pop();
if (last.length > 3 && !['sticks', 'cup', 'box', 'bar', 'kit', 'snacks'].includes(last)) words.add(last);
for (const w of words) k.push([w, it.id]);
}
k.sort((a, b) => b[0].length - a[0].length);
return (LT.Intent._k = k);
};
LT.Intent.items = (text, myBox, theirInv) => {
let t = ' ' + text.toLowerCase().replace(/[^a-z&' ]/g, ' ') + ' ';
const mine = [], theirs = [], found = [];
for (const [w, id] of LT.Intent.keys()) {
const i = t.indexOf(w.replace(/[^a-z&' ]/g, ' '));
if (i < 0) continue;
found.push({ id, at: i });
t = t.slice(0, i) + ' '.repeat(w.length) + t.slice(i + w.length);
}
const low = ' ' + text.toLowerCase() + ' ';
for (const f of found) {
const before = low.slice(Math.max(0, f.at - 9), f.at + 1);
const inMine = myBox.some(s => s.id === f.id), inTheirs = theirInv.some(s => s.id === f.id);
let side = /\byour\b/.test(before) ? 'theirs' : /\b(my|mine)\b/.test(before) ? 'mine' : inMine && !inTheirs ? 'mine' : inTheirs ? 'theirs' : 'mine';
if (side === 'mine' && !inMine && inTheirs) side = 'theirs';
(side === 'mine' ? mine : theirs).push(f.id);
}
return { mine, theirs };
};
LT.Intent.parse = (text, myBox, theirInv) => {
const t = String(text || '').trim(), it = LT.Intent.items(t, myBox || [], theirInv || []);
let intent = 'other';
for (const k of LT.Intent.ORDER) if (IN_RX[k].test(t)) { intent = k; break; }
if ((intent === 'other' || intent === 'greet' || intent === 'accept' || intent === 'fair') && it.mine.length + it.theirs.length > 0 && /\bfor\b|\btrade\b|\bswap\b|\bgive\b/i.test(t)) intent = 'offer';
if (intent === 'other' && it.mine.length + it.theirs.length > 0) intent = it.theirs.length ? 'offer' : 'sweetener';
return { intent, mine: it.mine, theirs: it.theirs, text: t };
};

if (k === 'g' || k === 'G') { LT.$('goalsBox').classList.toggle('open'); return; }
const N = LT.N;
if (!N) { if (k === 'l' || k === 'L') LT.ui.ledger(); if (k === 'y' && LT.S.incoming) LT.Day.answerIncoming(true); if (k === 'n' && LT.S.incoming) LT.Day.answerIncoming(false); return; }
if (k === 'Enter') { e.preventDefault(); if (N.phase === 'deal') LT.ui.act('shake'); else if (N.phase === 'open') LT.ui.act('propose'); else if (N.phase === 'counter') LT.ui.act('acceptC'); return; }
if ((k === 's' || k === 'S') && N.phase === 'deal') { LT.ui.act('shake'); return; }
if ((k === 'l' || k === 'L') && N.phase === 'deal') { LT.ui.act('inspect'); return; }
if ((k === 'a' || k === 'A') && N.phase === 'counter') { LT.ui.act('acceptC'); return; }
const qi = '12345'.indexOf(k);
if (qi >= 0 && (N.phase === 'open' || N.phase === 'counter')) { LT.ui.quick(LT.QUICK[qi][0]); return; }
if (k === 't' || k === '/') { e.preventDefault(); LT.$('tInput').focus(); }
});
};
// ===== debug.js =====
LT.T = {};
LT.T.start = (mode, idx) => { LT.ui.intro(mode || 'camp', idx || 0); LT.ui.startCafe(); return LT.S.dayNum; };
LT.T.skip = secs => { const S = LT.S; if (!S) return; let n = Math.ceil(secs / 0.1); while (n-- > 0 && !S.ended) { const was = LT.N; LT.N = null; LT.Day.update(0.1); LT.N = was; } return S.t; };
LT.T.kid = id => LT.Class.k(id);
LT.T.put = (id, o) => { const s = LT.Cond.make(id, LT.R, o || {}); LT.S.box.push(s); LT.ui.boxKey = ''; LT.ui.renderBox(); return s.uid; };
LT.T.giveKid = (kid, id, o) => { const s = LT.Cond.make(id, LT.R, o || {}); LT.Class.k(kid).inv.push(s); return s.uid; };
LT.T.find = uid => LT.S.box.find(s => s.uid === uid) || [].concat(...LT.Class.present().map(k => k.inv)).find(s => s.uid === uid);
LT.T.quiet = () => { const S = LT.S; S.nextAmbient = S.nextIncoming = S.nextIdle = 1e9; };
LT.T.state = () => { const S = LT.S; return S ? { t: S.t, len: S.len, rep: S.rep, score: S.score, ended: !!S.ended, done: !!S.done, trades: S.stats.trades, tension: S.tension, box: S.box.map(s => s.id) } : null; };
LT.T.presentIds = () => LT.Class.present().map(k => k.id);
// ===== main.js =====
LT.boot = () => {
const q = location.search;
if (q.includes('reset')) LT.store.del('save');
const d = LT.Save.load();
if (q.includes('unlock')) LT.Save.forceAll = true;
if (q.includes('fixed')) LT.Day.fixedSeed = true;
LT.A.on = d.opts.sound; LT.A.sfxVol = d.opts.sfx; LT.A.musVol = d.opts.mus; LT.A.chatter = d.opts.chatter;
LT.opts.motion = d.opts.motion;
LT.Scene.init(LT.$('sceneCv'));
LT.FX.init();
LT.ui.wireTop(); LT.ui.wireHome(); LT.ui.wireCafe(); LT.ui.wireDay(); LT.ui.wireTrade();
LT.In.init();
LT.ui.aiChip();
LT.ui.home();
LT.Title.ready().then(() => { LT.Title.key = ''; LT.Scene.bgKey = ''; LT.Art.cache.clear(); });
if (d.opts.ai) LT.AI.start(false);              // only resumes if the model is already in the browser cache
LT.loopT = LT.now();
requestAnimationFrame(LT.loop);
window.LUNCHTRADE = true;
};
LT.loop = () => {
requestAnimationFrame(LT.loop);
const nowT = LT.now(), dt = Math.min(0.05, Math.max(0, nowT - LT.loopT));
LT.loopT = nowT;
try {
LT.Day.update(dt);
LT.ui.frame(nowT);
LT.FX.step(dt);
} catch (e) { LT.lastError = String(e && e.stack || e); console.error(e); }
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', LT.boot); else LT.boot();
</script>
