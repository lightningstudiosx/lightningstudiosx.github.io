<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CLICK FOR BACON!!! - Official Homepage</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:#000;cursor:pointer;user-select:none;}
  canvas{display:block;width:100vw;height:100vh;background:#000;}
  a.back{position:fixed;left:10px;bottom:8px;z-index:5;color:#555;font-size:10px;
    font-family:"Courier New",monospace;text-decoration:none;letter-spacing:.14em;}
  a.back:hover{color:#fff;}
  /* the console */
  #term{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(92vw,660px);height:min(74vh,460px);z-index:20;flex-direction:column;
    background:#000;border:2px solid #fff;box-shadow:0 0 0 4px #000,0 18px 60px rgba(0,0,0,.9);
    font-family:"Courier New",monospace;color:#fff;font-size:13px;}
  #tbar{display:flex;justify-content:space-between;align-items:center;padding:2px 7px;
    background:#fff;color:#000;font-weight:bold;font-size:11px;letter-spacing:.2em;flex:0 0 auto;}

  #tout{flex:1;overflow-y:auto;padding:7px 9px;white-space:pre;line-height:1.45;}

<script>
"use strict";
var cv = document.getElementById("cv"), g = cv.getContext("2d");
var page = document.createElement("canvas"), pg = page.getContext("2d");
var W = 0, H = 0, DPR = 1;
var COLS = 26, ROWS = 18, tiles = [], falling = [], done = false, doneAt = 0, revealed = false;

// ── draw the website once, onto an offscreen canvas ──
function drawPage(w, h) {
  page.width = w; page.height = h;
  pg.fillStyle = "#fff"; pg.fillRect(0, 0, w, h);
  pg.fillStyle = "#000";
  var cx = w / 2, s = Math.min(1.3, Math.max(0.62, w / 900));
  function txt(t, x, y, size, font, align) {
    pg.font = (font || "") + " " + Math.round(size * s) + 'px "Times New Roman",Times,serif';
    pg.textAlign = align || "left"; pg.fillText(t, x, y);
  }
  function mono(t, x, y, size, font, align) {
    pg.font = (font || "") + " " + Math.round(size * s) + 'px "Courier New",monospace';
    pg.textAlign = align || "left"; pg.fillText(t, x, y);
  }
  function rule(y, lw) { pg.lineWidth = lw || 2; pg.beginPath(); pg.moveTo(20 * s, y); pg.lineTo(w - 20 * s, y); pg.stroke(); }
  pg.strokeStyle = "#000";
  txt("CLICK FOR BACON!!!", cx, 46 * s, 38, "bold", "center");
  var tw = pg.measureText("CLICK FOR BACON!!!").width;
  pg.lineWidth = 3; pg.beginPath(); pg.moveTo(cx - tw / 2, 53 * s); pg.lineTo(cx + tw / 2, 53 * s); pg.stroke();
  txt("the official homepage of clicking for bacon", cx, 76 * s, 15, "italic", "center");
  rule(96 * s, 2);
  rule(112 * s, 1);
  txt("*** CLICK ANYWHERE ON THIS PAGE *** NOTHING IS COMING BACK ***", cx, 130 * s, 13, "bold", "center");
  rule(140 * s, 1);
  // the inset box
  var bx = cx - 250 * s, by = 158 * s, bw = 500 * s, bh = 150 * s;
  pg.lineWidth = 3; pg.strokeRect(bx, by, bw, bh);
  txt(">>> CLICK ANYWHERE <<<", cx, by + 26 * s, 18, "bold", "center");
  var lines = ["Welcome 2 my page. This page used to give u BACON.",
               "It does not anymore. Now when u click, pieces of the",
               "page come loose and fall off. I do not know why.",
               "If u get stuck, try typing the word  h e l p  ."];
  for (var i = 0; i < lines.length; i++) txt(lines[i], bx + 16 * s, by + 52 * s + i * 20 * s, 13, "", "left");
  var bul = ["Every click takes a piece", "Nothing is added", "It ends black"];
  for (var j = 0; j < bul.length; j++) txt("\u2022  " + bul[j], bx + 26 * s, by + 128 * s + j * 0 - (2 - j) * 0 + j * 0, 12, "", "left");
  // stats table
  txt("W E B S I T E   S T A T I S T I C S", cx, 330 * s, 13, "bold", "center");
  var rows = [["pieces remaining", "-"], ["pieces lost", "-"], ["pieces recovered", "0"], ["server status", "FINE"]];
  var ty = 344 * s, tx = cx - 135 * s;
  pg.lineWidth = 1;
  for (var k = 0; k < rows.length; k++) {
    pg.strokeRect(tx, ty, 200 * s, 18 * s); pg.strokeRect(tx + 200 * s, ty, 70 * s, 18 * s);
    mono(rows[k][0], tx + 6 * s, ty + 13 * s, 11, "", "left");
    mono(rows[k][1], tx + 206 * s, ty + 13 * s, 11, "bold", "left");
    ty += 18 * s;
  }
  // corner log box
  pg.lineWidth = 1; pg.strokeRect(20 * s, h - 96 * s, 230 * s, 76 * s);
  mono("PAGE LOG:", 27 * s, h - 80 * s, 10, "bold", "left");
  mono("awaiting click...", 27 * s, h - 64 * s, 10, "", "left");
  mono("COPYRIGHT KAI.  LAST UPDATED: NEVER", cx, h - 10 * s, 10, "", "center");
}
// ── cut the page into fragments ──
function build() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = cv.width = Math.max(2, innerWidth * DPR);
  H = cv.height = Math.max(2, innerHeight * DPR);
  drawPage(W, H);
  tiles = []; falling = []; done = false; doneAt = 0;
  var tw = W / COLS, th = H / ROWS;
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++)
    tiles.push({ sx: c * tw, sy: r * th, w: tw, h: th, cx: c * tw + tw / 2, cy: r * th + th / 2 });
}
addEventListener("resize", build);
// ── knock pieces loose ──
function knock(clientX, clientY) {
  if (!tiles.length) return;
  var px = (clientX == null ? innerWidth / 2 : clientX) * DPR;
  var py = (clientY == null ? innerHeight / 2 : clientY) * DPR;
  tiles.sort(function (a, b) {
    return (Math.hypot(a.cx - px, a.cy - py) + Math.random() * 90 * DPR)
         - (Math.hypot(b.cx - px, b.cy - py) + Math.random() * 90 * DPR);
  });
  var take = Math.min(tiles.length, 6 + Math.floor(Math.random() * 7));   // a good handful per click
  for (var i = 0; i < take; i++) {
    var t = tiles.shift();
    t.x = t.sx; t.y = t.sy;
    t.vx = (t.cx - px) * 0.006 + (Math.random() - 0.5) * 0.9;
    t.vy = -0.5 - Math.random() * 0.9;           // a small lift, then gravity takes it
    t.rot = 0; t.vr = (Math.random() - 0.5) * 0.02;
    falling.push(t);
  }
}
addEventListener("pointerdown", function (e) {
  if (document.getElementById("part1").style.display === "none") return;
  if (typeof T !== "undefined" && T.open) return;
  if (done && revealed) { openTerm(); return; }
  knock(e.clientX, e.clientY);
});
addEventListener("keydown", function (e) {
  if (document.getElementById("part1").style.display === "none") return;
  if (typeof T !== "undefined" && T.open) return;
  if (e.code === "Space") { e.preventDefault(); knock(); }
});
addEventListener("contextmenu", function (e) { e.preventDefault(); });
// ── loop ──
function frame() {
  requestAnimationFrame(frame);
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  for (var i = 0; i < tiles.length; i++) {
    var t = tiles[i];
    g.drawImage(page, t.sx, t.sy, t.w, t.h, t.sx, t.sy, t.w + 1, t.h + 1);
  }
  for (var j = falling.length - 1; j >= 0; j--) {
    var f = falling[j];
    f.vy += 0.16 * DPR;                          // slow, heavy fall
    f.x += f.vx * DPR; f.y += f.vy; f.rot += f.vr;
    g.save();
    g.translate(f.x + f.w / 2, f.y + f.h / 2);
    g.rotate(f.rot);
    g.drawImage(page, f.sx, f.sy, f.w, f.h, -f.w / 2, -f.h / 2, f.w + 1, f.h + 1);
    g.restore();
    if (f.y > H + f.h * 2) falling.splice(j, 1);
  }
  if (!tiles.length && !falling.length && !done) {
    done = true;
    doneAt = performance.now();
  }
  if (done && !revealed) {
    var wait = performance.now() - doneAt;
    if (wait > 900) {                       // a beat of black, then the console appears by itself
      revealed = true;
      if (typeof openTerm === "function") {
        openTerm();
        if (typeof say === "function") {
          say("the page is gone.");
          say("this console is what was under it.");
          say("type 'help'.");
          say("");
        }
      }
    }
  }
  if (done && revealed && !T.open) {        // closed it? leave a prompt so it can be found again
    g.fillStyle = "#fff";
    g.font = Math.round(13 * DPR) + 'px "Courier New",monospace';
    g.textAlign = "center";
    g.globalAlpha = (Math.floor(performance.now() / 600) % 2) ? 0.15 : 0.8;
    g.fillText("> _", W / 2, H / 2);
    g.globalAlpha = 1;
  }
}
build();
frame();

// three sections of commands, 41 / 42 / 43
const S41=["status","ping","uptime","whoami","hostname","env","path","mount","df","du","ps","top","kill","jobs","fg","bg","nice","time","date","cal","who","last","id","groups","umask","alias","unalias","history","clear","reset","echo","printf","read","exit","logout","shutdown","reboot","halt","sync","flush","yield"];
const S42=["page","frag","frags","shard","shards","glue","weld","patch","mend","restore","rollback","undo","redo","snap","snapshot","cache","purge","drop","hold","pin","unpin","lift","fall","gravity","float","anchor","tether","sever","split","merge","fuse","align","offset","rotate","mirror","invert","dim","lit","paint","erase","blank","void"];
const S43=["key","keys","lock","unlock","door","gate","bolt","latch","hinge","seam","crack","fault","rift","hollow","depth","below","under","beneath","descend","climb","reach","grasp","hold2","listen","knock","answer","wait","count","name","forget","remember","trace","follow","lead","mark","signal","beacon","relay","echo2","carry","send","abc","next"];

// ═══════════════════════════ terminal ═══════════════════════════
var T = { open: false, buf: [], hist: [], hi: -1, part: 1 };
var tEl = document.getElementById("term"), tOut = document.getElementById("tout"), tIn = document.getElementById("tin");
var typed = "";
function openTerm() {
  if (T.open) return;
  T.open = true; tEl.style.display = "flex";
  if (!tOut.children.length) {
    say("CONSOLE v0.3  (unstable)");
    say("type 'help' for a list of commands.");
    say("");
  }
  setTimeout(function () { tIn.focus(); }, 30);
}
function closeTerm() { T.open = false; tEl.style.display = "none"; }
function say(line, cls) {
  var d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = line;
  tOut.appendChild(d);
  tOut.scrollTop = tOut.scrollHeight;
  while (tOut.children.length > 400) tOut.removeChild(tOut.children[0]);
}
function cols(list, per) {
  var out = [], row = [];
  for (var i = 0; i < list.length; i++) {
    row.push((list[i] + "            ").slice(0, 12));
    if (row.length === per) { out.push("  " + row.join("")); row = []; }
  }
  if (row.length) out.push("  " + row.join(""));
  return out;
}
function doHelp() {
  say("");
  say("AVAILABLE COMMANDS", "hd");
  say("");
  say("(" + S41.length + ")", "hd");
  cols(S41, 5).forEach(function (l) { say(l); });
  say("");
  say("(" + S42.length + ")", "hd");
  cols(S42, 5).forEach(function (l) { say(l); });
  say("");
  say("(" + S43.length + ")", "hd");
  cols(S43, 5).forEach(function (l) { say(l); });
  say("");
  say("  " + (S41.length + S42.length + S43.length) + " commands total. most of them do nothing.");
  say("");
}
var KNOWN = {};
[S41, S42, S43].forEach(function (s) { s.forEach(function (c) { KNOWN[c] = 1; }); });
var SHRUG = ["not now.", "nothing happens.", "denied.", "no.", "not yet.", "that isn't it.",
             "the console considers this and declines.", "no such luck.", "wrong one."];
function run(raw) {
  var line = String(raw).trim();
  if (!line) return;
  say("> " + line, "in");
  var cmd = line.split(/\s+/)[0].toLowerCase();
  if (cmd === "help" || cmd === "?" || cmd === "commands") { doHelp(); return; }
  if (cmd === "clear" || cmd === "cls") { tOut.innerHTML = ""; return; }
  if (cmd === "exit" || cmd === "close" || cmd === "quit" || cmd === "logout") { closeTerm(); return; }
  if (cmd === "abc") { nextPart(); return; }
  if (KNOWN[cmd]) { say("  " + SHRUG[Math.floor(Math.random() * SHRUG.length)]); return; }
  say("  '" + cmd + "' is not a command. try 'help'.");
}
function nextPart() {
  say("");
  say("  ...", "hd");
  T.part = 2;
  setTimeout(function () { closeTerm(); goPart(2); }, 700);
}
tIn.addEventListener("keydown", function (e) {
  e.stopPropagation();
  if (e.key === "Enter") { var v = tIn.value; tIn.value = ""; if (v.trim()) { T.hist.push(v); T.hi = T.hist.length; } run(v); }
  else if (e.key === "Escape") { closeTerm(); }
  else if (e.key === "ArrowUp") { if (T.hi > 0) { T.hi--; tIn.value = T.hist[T.hi]; } e.preventDefault(); }
  else if (e.key === "ArrowDown") { if (T.hi < T.hist.length - 1) { T.hi++; tIn.value = T.hist[T.hi]; } else { T.hi = T.hist.length; tIn.value = ""; } e.preventDefault(); }
});
// typing the word anywhere on the page opens it
addEventListener("keydown", function (e) {
  if (T.open) return;
  if (typeof P2 !== "undefined" && P2.on) return;                 // the console lives under part one
  if (typeof P3 !== "undefined" && P3.on) return;
  if (typeof P4 !== "undefined" && P4.on) return;
  if (typeof P5 !== "undefined" && P5.on) return;
  if (typeof P6 !== "undefined" && P6.on) return;
  if (typeof P8 !== "undefined" && P8.on) return;
  if (e.key === "Escape") return;
  if (e.key && e.key.length === 1) {
    typed = (typed + e.key.toLowerCase()).slice(-6);
    if (typed.indexOf("help") >= 0 || typed.indexOf("term") >= 0) { typed = ""; openTerm(); }
  }
});

document.getElementById("tclose").onclick = closeTerm;
// teleport 7 / after the fight: the credits, from the top (black and white)
function startPart7(){
  if(!p6cv) return;
  P6.token++; P6.on=true; P6.t=0; P6.lastTick=0; P6.st=0;
  P6.state="credits2"; P6.scroll2=0; P6.kx2=1.15; P6.yank=0;
  P6.lineT=0; P6.lineSpoke=false; P6.D=null;
  P6.you={x:0.25,y:0,vy:0,vx:0,face:1,hp:6,ifr:0,punch:0,pcool:0};
  P6.kai={x:0.5,y:0,vy:0,vx:0,face:-1,hp:10,maxhp:10,ifr:0,phase:1,mode:"idle",mt:0};
  P6.shots=[]; P6.waves=[]; P6.msg=""; P6.msgT=0;
  p6Fit(); requestAnimationFrame(p6Frame);
}

// ═══════════════════════ PART EIGHT: REPAIRS (b&w) ═══════════════════════
var P8={on:false,token:0,t:0,lastTick:0,view:"hub",active:-1,done:[false,false,false,true,false,false,false],m:null,D:null,allDone:false,state:"hub",scroll3:0};
var p8cv=document.getElementById("p8cv"), p8g=p8cv?p8cv.getContext("2d"):null;
var P8W=0,P8H=0,P8D=1;
function p8Fit(){ if(!p8cv) return; P8D=Math.min(2,devicePixelRatio||1);
  P8W=p8cv.width=Math.max(2,innerWidth*P8D); P8H=p8cv.height=Math.max(2,innerHeight*P8D); }
addEventListener("resize",p8Fit);
function p8Dialog(lines,done){ P8.D={lines:lines.slice(),idx:0,chars:0,done:done||null}; }
function p8Adv(){ var D=P8.D; if(!D) return; var cur=D.lines[D.idx];
  if(D.chars<cur.length){ D.chars=cur.length; return; }
  D.idx++; D.chars=0; if(D.idx>=D.lines.length){ P8.D=null; if(D.done) D.done(); } }
function repairedCount(){ return [0,1,2,4,5,6].filter(function(i){return P8.done[i];}).length; }
var PROBLEMS=[
 {open:["MIMIC: my voice came out wrong when they drew me.","MIMIC: three dials. pitch, gravel, echo.","MIMIC: turn them until i sound like a door should."],
  win:["MIMIC: knock knock.","MIMIC: ...that's me. that's my voice.","MIMIC: thank you."]},
 {open:["BOB: my brain was a json file.","BOB: it got corrupted somewhere around the jam incident.","BOB: write me a new one? get the fields right."],
  win:["BOB: installing... installed.","BOB: oh WOW. i remember everything.","BOB: it was a good week."]},
 {open:["ROCKY: six cracks, kid. your handiwork.","ROCKY: the pieces don't sit right anymore.","ROCKY: turn 'em till they do."],
  win:["* the pieces settle. rocky is whole.","ROCKY: good as bedrock."]},
 null,
 {open:["BLENDER: you owe me one perfect smoothie.","BLENDER: right ingredients. then a perfect spin.","BLENDER: i will know if it isn't perfect."],
  win:["BLENDER: ...PERFECT.","BLENDER: WHIRRRRRR. we're even."]},
 {open:["TIM: look at me. LOOK at my spine.","TIM: every click of yours put a bend in it.","TIM: straighten the joints. all five."],
  win:["TIM: whoa.","TIM: i'm... vertical. is this what tall feels like?"]},
 {open:["ERR: Y0U BLACKED ME OUT.","ERR: MY SL1CES SLID.","ERR: PUSH THEM BACK IN LINE."],
  win:["ERR: aligned.","ERR: i feel... contiguous. thank you."]}];
// ── open + constructors ──
function p8Open(i){
  if(i===3){ // kai
    if(repairedCount()<6){ p8Dialog(["KAI: not me. them.","KAI: i'll keep."],null); return; }
    p8Dialog([
      "KAI: ...you actually fixed everything.",
      "KAI: you know, i built this whole thing to be broken.",
      "KAI: the bad page. the console under it. the doors. bait, all of it.",
      "KAI: i figured someone would smash through, win, and leave.",
      "KAI: people love breaking things. nobody stays to fix them.",
      "KAI: you stayed. you fixed a rock. you wrote a fly a new brain.",
      "KAI: so, no more fights. no round two.",
      "KAI: roll them. the real ones. hands off, i promise."],
      function(){ P8.state="credits3"; P8.scroll3=0; });
    return;
  }
  P8.active=i; P8.view="game";
  var m={i:i};
  if(i===0){ m.v=[50,50,50]; m.target=[0,0,0].map(function(){return 10+Math.floor(Math.random()*80);});
    var names=["PITCH","GRAVEL","ECHO"]; m.names=names; m.okT=0; }
  if(i===1){
    m.lines=[
      {txt:'{',fixed:1},
      {key:'"species"', opts:['"a bird probably"','"fruit fly"','"ceiling fan"'], ok:1, sel:0},
      {key:'"wings"',   opts:['"yes"','-1','2'], ok:2, sel:0},
      {key:'"hobby"',   opts:['"laps of the kitchen"','"taxes"','"knocking"'], ok:0, sel:1},
      {key:'"best day"',opts:['"the jam incident"','"the fruit bowl"','"compiling"'], ok:1, sel:2},
      {key:'"status"',  opts:['"deleted"','"404"','"remembered"'], ok:2, sel:0},
      {txt:'}',fixed:1}];

  else { g.moveTo(cx,neck+u*0.4); g.lineTo(cx-u*1.1+sw*u*0.2,neck+u*1.8); g.moveTo(cx,neck+u*0.4); g.lineTo(cx+u*1.1-sw*u*0.2,neck+u*1.8); }
  g.stroke();

// ── fight logic ──
function kaiHurt(){
  var K=P6.kai;
  if(K.ifr>0) return;
  K.hp--; K.ifr=0.7; K.mode="hurt"; K.mt=0; P6.shake=6*P6D;
  K.vx = (K.x>P6.you.x?1:-1)*0.25; K.vy=-P6H*0.5;
  if(K.hp<=0){
    P6.shots=[]; P6.waves=[];
    if(K.phase===1){ P6.state="midcut"; P6.st=0;
      p6Dialog(["* Kai hits the mat.","KAI: ok.","KAI: OK.","KAI: you're actually good at this.",
        "KAI: but this is my website.","* Kai starts to glow.","KAI: SUPER KAI."],
        function(){ K.phase=2; K.maxhp=10; K.hp=10; K.ifr=1; K.mode="idle"; K.mt=0; P6.state="fight"; banner("PHASE 2"); });
    } else { P6.state="woncut"; P6.st=0;
      p6Dialog(["* Super Kai lands flat on his back.","KAI: ...heh.","KAI: ok. that's everything i've got.",
        "KAI: for now.","KAI: the site's yours tonight, champ.","* somewhere, rocky is cheering."],
        function(){ P6.state="won"; });
    }
  }
}
function youHurt(){
  var Y=P6.you;
  if(Y.ifr>0) return;
  Y.hp--; Y.ifr=1.1; P6.shake=7*P6D;
  Y.vx=(Y.x>P6.kai.x?1:-1)*0.2; 
  if(Y.hp<=0){ P6.state="gameover"; P6.shots=[]; P6.waves=[]; }
}
function banner(txt){ P6.msg=txt; P6.msgT=1.4; }
function kaiAI(dt){
  var K=P6.kai, Y=P6.you, sup=K.phase===2, g0=groundY();
  K.mt+=dt;
  var spd= sup? 0.34:0.24;
  if(K.mode==="idle"){
    if(K.mt>(sup?0.5:0.8)){
      var r=Math.random();
      if(r<0.34) { K.mode="hop"; K.mt=0; K.vy=-P6H*(0.9+Math.random()*0.3); K.vx=(Y.x-K.x)*(sup?1.6:1.1); }
      else if(r<0.6){ K.mode="tele"; K.mt=0; K.tele= sup?0.4:0.6; }
      else if(r<0.85){ K.mode="toss"; K.mt=0; K.tossed=0; }
      else if(sup){ K.mode="slamjump"; K.mt=0; K.vy=-P6H*1.5; }
      else { K.mode="hop"; K.mt=0; K.vy=-P6H*0.8; K.vx=(Math.random()<0.5?-1:1)*0.2; }
    }
  }
  else if(K.mode==="tele"){ if(K.mt>K.tele){ K.mode="dash"; K.mt=0; K.dashV=(Y.x>K.x?1:-1)*(sup?1.5:1.0); K.dashN= sup?2:1; } }
  else if(K.mode==="dash"){
    K.x+=K.dashV*dt;
    if(K.x<RING.l){ K.x=RING.l; K.dashV*=-1; K.dashN--; }
    if(K.x>RING.r){ K.x=RING.r; K.dashV*=-1; K.dashN--; }
    if(K.mt>1.6||K.dashN<=0&&(K.x<RING.l+0.02||K.x>RING.r-0.02||K.mt>0.8)){ K.mode="idle"; K.mt=0; }
  }
  else if(K.mode==="toss"){
    var per= sup?0.28:0.45, want= sup?3:2;
    if(K.mt>per*(K.tossed+1)){
      K.tossed++;
      var dx=(Y.x-K.x), fy=-(0.9+Math.random()*0.5);
      P6.shots.push({x:K.x,y:-P6H*0.28,vx:dx*(0.8+Math.random()*0.5),vy:P6H*fy,r:P6H*0.022});
      if(sup&&Math.random()<0.6) P6.shots.push({x:Math.random()*0.8+0.1,y:-P6H*1.05,vx:0,vy:P6H*0.1,r:P6H*0.022,fall:1});
    }
    if(K.tossed>=want){ K.mode="idle"; K.mt=0; }
  }
  else if(K.mode==="slamjump"){ if(K.y>=0&&K.mt>0.3){ K.mode="idle"; K.mt=0; P6.shake=10*P6D;
      P6.waves.push({x:K.x,dir:1,h:P6H*0.06}); P6.waves.push({x:K.x,dir:-1,h:P6H*0.06}); } }
  else if(K.mode==="hurt"){ if(K.mt>0.5){ K.mode="idle"; K.mt=0; } }
  if(K.mode==="hop"&&K.y>=0&&K.mt>0.2){ K.mode="idle"; K.mt=0; }
  // physics
  if(K.mode!=="dash"){ K.x+=K.vx*dt; K.vx*=Math.pow(0.05,dt); }
  K.vy+=P6H*3.2*dt; K.y+=K.vy*dt;
  if(K.y>0){ K.y=0; K.vy=0; }
  K.x=Math.max(RING.l,Math.min(RING.r,K.x));
  if(K.ifr>0) K.ifr-=dt;
  K.face= Y.x>K.x?1:-1;
}
function stepFight(dt){
  var Y=P6.you, K=P6.kai, g0=groundY();
  // you
  var mv=(P6.keys.ArrowLeft||P6.keys.a?-1:0)+(P6.keys.ArrowRight||P6.keys.d?1:0)+(P6.touch.left?-1:0)+(P6.touch.right?1:0);
  Y.x+=mv*dt*0.42 + Y.vx*dt; Y.vx*=Math.pow(0.02,dt);
  if(mv) Y.face=mv>0?1:-1;
  var jump=P6.keys.ArrowUp||P6.keys.w||P6.keys[" "]||P6.touch.jump;
  if(jump&&Y.y>=0){ Y.vy=-P6H*1.15; }
  Y.vy+=P6H*3.2*dt; Y.y+=Y.vy*dt; if(Y.y>0){ Y.y=0; Y.vy=0; }
  Y.x=Math.max(RING.l,Math.min(RING.r,Y.x));
  if(Y.ifr>0) Y.ifr-=dt;
  if(Y.pcool>0) Y.pcool-=dt;
  if(Y.punch>0){
    Y.punch-=dt;
    var reach=0.075, dy=Math.abs(Y.y-K.y)/P6H;
    if(Math.abs((Y.x+Y.face*0.045)-K.x)<reach && dy<0.14) kaiHurt();
  }
  kaiAI(dt);
  // contact damage
  if(K.mode!=="hurt" && Math.abs(Y.x-K.x)<0.05 && Math.abs(Y.y-K.y)/P6H<0.12) youHurt();
  // shots
  for(var i=P6.shots.length-1;i>=0;i--){ var s=P6.shots[i];
    s.vy+= (s.fall? P6H*1.6 : P6H*2.6)*dt; s.x+=s.vx*dt*0.14; s.y+=s.vy*dt;
    if(s.y>0){ P6.shots.splice(i,1); continue; }
    if(Math.abs(s.x-Y.x)<0.035 && Math.abs(s.y-Y.y)/P6H<0.08){ P6.shots.splice(i,1); youHurt(); }
  }
  for(var j=P6.waves.length-1;j>=0;j--){ var w=P6.waves[j];
    w.x+=w.dir*dt*0.5;
    if(w.x<RING.l-0.05||w.x>RING.r+0.05){ P6.waves.splice(j,1); continue; }
    if(Math.abs(w.x-Y.x)<0.03 && Y.y>-w.h*1.2){ youHurt(); }
  }
  if(P6.shake>0) P6.shake*=Math.pow(0.001,dt);
}
function punch(){ var Y=P6.you; if(Y.pcool>0||P6.state!=="fight") return; Y.punch=0.16; Y.pcool=0.4; Y.vx=Y.face*0.14; }

    g.restore();
  }
  g.save(); g.strokeStyle="#1a1208";
  drawKai6(g,P6W*0.82,gy,P6H*0.44,false,"idle",t);
  g.restore();
  g.fillStyle="#f5e6b8"; g.font="bold "+Math.round(12*P6D)+'px "Courier New",monospace'; g.textAlign="center";
  if(Math.floor(t*2)%2===0) g.fillText("[Z] FIGHT", P6W/2, P6H*0.93);

    g.moveTo(cx,neck+u*0.5); g.lineTo(cx+u*1.2,neck+u*2.0); }

function drawFakeIndex(g,dt){

  }

  else{
    g.fillStyle="#ffd23f"; g.beginPath(); g.arc(sx,sy,sr,0,7); g.fill();

function p3Advance(){

function stepBullets(dt){
  for(var i=P3.bullets.length-1;i>=0;i--){
    var b=P3.bullets[i];
    if(b.ty==="spike"){ var age=P3.atkT-b.born;
      b.rise = age<b.warn? 0 : Math.min(1,(age-b.warn)*3.2);
      if(age>b.warn+1.4) P3.bullets.splice(i,1);
      continue; }
    if(b.ty==="wall"||b.ty==="hurdle"||b.ty==="wob"){ b.x+=b.vx*dt; if(b.x>1.25||b.x<-0.25) P3.bullets.splice(i,1); continue; }
    if(b.ty==="ring"){ b.r+=b.vr*dt; if(b.r>0.9) P3.bullets.splice(i,1); continue; }
    if(b.ty==="spokes"){ b.ang+=dt*1.5; continue; }
    if(b.ty==="fly"){ b.ph+=dt*6;
      var dx=P3.px-b.x, dy=P3.py-b.y, dd=Math.hypot(dx,dy)||1;
      b.x+=dx/dd*dt*0.16+Math.sin(b.ph)*dt*0.1; b.y+=dy/dd*dt*0.13+Math.cos(b.ph*1.3)*dt*0.1;
      if(P3.atkT-b.born>4.2) P3.bullets.splice(i,1); continue; }
    if(b.ty==="block"||b.ty==="zone"){ if(P3.atkT-b.born>b.warn+b.life) P3.bullets.splice(i,1); continue; }
    if(b.ty==="chunk"||b.ty==="knob"){ b.vy+=dt*1.4; b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.ty==="knob"&&b.y>0.97){ b.y=0.97; b.vy*=-0.65; }
      if(b.y>1.2||b.x<-0.2||b.x>1.2) P3.bullets.splice(i,1); continue; }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.ty==="bounce"){ if(b.x<b.r||b.x>1-b.r){ b.vx*=-1; b.x=Math.max(b.r,Math.min(1-b.r,b.x)); }
      if(b.y<b.r||b.y>1-b.r){ b.vy*=-1; b.y=Math.max(b.r,Math.min(1-b.r,b.y)); } }
    else if(b.y>1.15||b.y<-0.2||b.x<-0.15||b.x>1.15) P3.bullets.splice(i,1);
    if(b.ty==="boulder") b.rot+=b.vx*dt*14;
  }
}
function hitTest(){
  if(P3.iframe>0) return false;
  var pr=0.02;
  for(var i=0;i<P3.bullets.length;i++){
    var b=P3.bullets[i];
    if(b.ty==="wall"){ var wx=b.x, ww=0.06;
      if(P3.px>wx-ww&&P3.px<wx+ww){ if(P3.py<b.gap-0.10||P3.py>b.gap+0.10) return true; } continue; }
    if(b.ty==="hurdle"){ var hw=(b.w||0.06);
      if(Math.abs(P3.px-b.x)<hw/2+pr && P3.py>1-b.h) return true; continue; }
    if(b.ty==="spike"){ if(!b.rise) continue;
      var h=b.rise*0.34; if(Math.abs(P3.px-b.x)<0.045&&P3.py>1-h) return true; continue; }
    if(b.ty==="ring"){ var d=Math.hypot(P3.px-b.cx,P3.py-b.cy);
      if(Math.abs(d-b.r)<b.th+pr) return true; continue; }
    if(b.ty==="spokes"){ var ddx=P3.px-0.5, ddy=P3.py-0.5, rr=Math.hypot(ddx,ddy);
      if(rr<b.len&&rr>0.06){ var pa=Math.atan2(ddy,ddx);
        for(var s=0;s<b.n;s++){ var sa=b.ang+s*Math.PI*2/b.n;
          var diff=Math.atan2(Math.sin(pa-sa),Math.cos(pa-sa));
          if(Math.abs(diff)<b.th/Math.max(0.1,rr)) return true; } } continue; }
    if(b.ty==="wob"){ var gy=0.5+Math.sin(P3.atkT*3+b.ph)*0.3;
      if(Math.abs(P3.px-b.x)<0.04){ if(P3.py<gy-0.12||P3.py>gy+0.12) return true; } continue; }
    if(b.ty==="block"){ var age2=P3.atkT-b.born;
      if(age2>b.warn && P3.px>b.x-pr&&P3.px<b.x+b.w+pr&&P3.py>b.y-pr&&P3.py<b.y+b.h+pr) return true; continue; }
    if(b.ty==="zone"){ var age3=P3.atkT-b.born;
      if(age3>b.warn && Math.abs(P3.px-(b.x+b.w/2))<b.w/2 && P3.py>FLOOR-0.03) return true; continue; }
    if(b.ty==="fly"||b.ty==="fruit"||b.ty==="chunk"||b.ty==="knob"||b.ty==="glyph"||b.ty==="pebble"||b.ty==="boulder"||b.ty==="bounce"){
      var r2=b.r||0.03, dx2=P3.px-b.x, dy2=P3.py-b.y;
      if(dx2*dx2+dy2*dy2 < (r2+pr)*(r2+pr)) return true; }
  }
  return false;
}

  g.save(); g.translate(cx,cy+wob);
  if(P3.dmgFlash>0&&Math.floor(P3.t*20)%2===0) g.strokeStyle="#888";
  g.beginPath();
  var pts=[[-1,0.25],[-0.92,-0.35],[-0.55,-0.78],[0.05,-0.95],[0.6,-0.7],[0.95,-0.2],[0.9,0.4],[0.5,0.8],[-0.4,0.82]];
  pts.forEach(function(p,i){ var x=p[0]*R,y=p[1]*R; i?g.lineTo(x,y):g.moveTo(x,y); });
  g.closePath(); g.fill(); g.stroke();
  var dmg=1-P3.rhp/P3.rmaxhp;
  g.lineWidth=Math.max(1.5,R*0.035);
  function crack(x1,y1,x2,y2,x3,y3){ g.beginPath(); g.moveTo(x1*R,y1*R); g.lineTo(x2*R,y2*R); g.lineTo(x3*R,y3*R); g.stroke(); }
  if(dmg>0.15) crack(-0.6,-0.5,-0.45,-0.2,-0.6,0.1);
  if(dmg>0.35) crack(0.55,-0.5,0.4,-0.25,0.55,0.05);
  if(dmg>0.55) crack(-0.1,0.8,0,0.5,-0.15,0.25);
  if(dmg>0.75){ crack(0.2,-0.9,0.15,-0.6,0.3,-0.4); crack(-0.9,0.2,-0.6,0.3,-0.7,0.55); }
  g.fillStyle="#fff"; g.lineWidth=Math.max(2,R*0.05);
  var blink=(Math.floor(P3.t*0.7)%5===0)?0.25:1;
  g.beginPath(); g.ellipse(-R*0.28,-R*0.18,R*0.09,R*0.13*blink,0,0,7); g.fill();
  g.beginPath(); g.ellipse( R*0.28,-R*0.18,R*0.09,R*0.13*blink,0,0,7); g.fill();
  g.strokeStyle="#fff"; g.beginPath();
  if(P3.state==="won"&&P3.ended==="spare"){ g.arc(0,R*0.15,R*0.3,0.15,Math.PI-0.15); }
  else if(dmg>0.6){ g.arc(0,R*0.45,R*0.25,Math.PI+0.3,-0.3); }
  else { g.moveTo(-R*0.22,R*0.28); g.quadraticCurveTo(0,R*0.36,R*0.22,R*0.28); }
  g.stroke();
  g.restore();
}
function drawBoss(g){

  g.save(); if(flick) g.globalAlpha=0.4;
  if(typeof drawCastCharBW==="function") drawCastCharBW(g, B.cast, P3W/2, P3H*0.335, P3H*0.24, P3.t);

}
function drawTinyMan(g,x,y,s){
  g.strokeStyle="#fff"; g.lineWidth=Math.max(1.5,s*0.16); g.lineCap="round";
  if(P3.iframe>0&&Math.floor(P3.t*18)%2===0) g.strokeStyle="#555";
  g.beginPath(); g.arc(x,y-s*0.75,s*0.28,0,7); g.stroke();
  g.beginPath(); g.moveTo(x,y-s*0.5); g.lineTo(x,y-s*0.05); g.stroke();
  g.beginPath(); g.moveTo(x,y-s*0.42); g.lineTo(x-s*0.3,y-s*0.18); g.moveTo(x,y-s*0.42); g.lineTo(x+s*0.3,y-s*0.18); g.stroke();
  g.beginPath(); g.moveTo(x,y-s*0.05); g.lineTo(x-s*0.22,y+s*0.3); g.moveTo(x,y-s*0.05); g.lineTo(x+s*0.22,y+s*0.3); g.stroke();

function p3Box(){ var bw=Math.min(P3W*0.62,560*P3D), bh=P3H*0.30;
  return {x:(P3W-bw)/2, y:P3H*0.40, w:bw, h:bh}; }
function p3Buttons(){
  var n=4, gap=P3W*0.02, w=Math.min(P3W*0.2,190*P3D), h=Math.max(34*P3D,P3H*0.062);
  var total=n*w+(n-1)*gap, x0=(P3W-total)/2, y=P3H*0.86, out=[];
  for(var i=0;i<n;i++) out.push({x:x0+i*(w+gap), y:y, w:w, h:h});
  return out;
}
function p3Frame(now){ p3LoopRun(now, P3.token); }
function p3LoopRun(now, token){
  if(!P3.on||!p3g||token!==P3.token) return;
  var dt=Math.min(0.05,(now-(P3.lastTick||now))/1000); P3.lastTick=now; P3.t+=dt;
  var g=p3g;
  g.fillStyle="#000"; g.fillRect(0,0,P3W,P3H);
  var mono=function(px){ return "bold "+Math.round(px)+'px "Courier New",monospace'; };
  drawBoss(g);
  var B=p3Box();
  g.strokeStyle="#fff"; g.lineWidth=Math.max(2,3*P3D);
  g.strokeRect(B.x,B.y,B.w,B.h);
  if(P3.D){
    var D=P3.D, cur=D.lines[D.idx]||"";
    D.chars=Math.min(cur.length, D.chars+dt*46);
    g.fillStyle="#fff"; g.font=mono(15*P3D); g.textAlign="left";
    var shown=cur.slice(0,Math.floor(D.chars));
    var words=shown.split(" "), line="", yy=B.y+30*P3D, maxw=B.w-40*P3D;
    for(var wi=0;wi<words.length;wi++){ var test=line?line+" "+words[wi]:words[wi];
      if(g.measureText(test).width>maxw){ g.fillText(line,B.x+20*P3D,yy); yy+=22*P3D; line=words[wi]; } else line=test; }
    g.fillText(line,B.x+20*P3D,yy);
    g.font=mono(11*P3D); g.fillStyle="#888"; g.textAlign="right";
    g.fillText("[Z]", B.x+B.w-14*P3D, B.y+B.h-12*P3D);
  }
  if(P3.state==="dodge"){
    P3.atkT+=dt; spawnAttack(dt); stepBullets(dt);
    if(P3.iframe>0) P3.iframe-=dt;
    if(hitTest()) hurt();
    var sp=0.62*dt;
    if(P3.grav){
      if(KEYS.ArrowLeft||KEYS.a) P3.px-=sp; if(KEYS.ArrowRight||KEYS.d) P3.px+=sp;
      var wantJump=KEYS.ArrowUp||KEYS.w||KEYS[" "]||P3.jumpQ;
      if(wantJump&&P3.py>=FLOOR-0.001){ P3.pvy=-JUMPV; }
      P3.jumpQ=false;
      P3.pvy+=GRAVG*dt; P3.py+=P3.pvy*dt;
      if(P3.py>=FLOOR){ P3.py=FLOOR; P3.pvy=0; }
      if(P3.ptr){ P3.px+=( (P3.ptr.x-B.x)/B.w - P3.px )*dt*9; }
      P3.px=Math.max(0.03,Math.min(0.97,P3.px));
    } else {
      if(KEYS.ArrowLeft||KEYS.a) P3.px-=sp; if(KEYS.ArrowRight||KEYS.d) P3.px+=sp;
      if(KEYS.ArrowUp||KEYS.w) P3.py-=sp; if(KEYS.ArrowDown||KEYS.s) P3.py+=sp;
      if(P3.ptr){ P3.px+=( (P3.ptr.x-B.x)/B.w - P3.px )*dt*9; P3.py+=( (P3.ptr.y-B.y)/B.h - P3.py )*dt*9; }
      P3.px=Math.max(0.03,Math.min(0.97,P3.px)); P3.py=Math.max(0.05,Math.min(0.96,P3.py));
    }
    g.fillStyle="#fff"; g.strokeStyle="#fff";
    if(P3.grav){ g.globalAlpha=0.5; g.lineWidth=Math.max(1.5,2*P3D);
      g.beginPath(); g.moveTo(B.x,B.y+FLOOR*B.h+8*P3D); g.lineTo(B.x+B.w,B.y+FLOOR*B.h+8*P3D); g.stroke(); g.globalAlpha=1; }
    P3.bullets.forEach(function(b){
      if(b.ty==="wall"){ var wx=B.x+b.x*B.w;
        g.fillRect(wx-0.03*B.w,B.y,0.06*B.w,(b.gap-0.10)*B.h);
        g.fillRect(wx-0.03*B.w,B.y+(b.gap+0.10)*B.h,0.06*B.w,B.h-(b.gap+0.10)*B.h); return; }
      if(b.ty==="hurdle"){ var hx=B.x+b.x*B.w, hw=(b.w||0.06)*B.w;
        g.fillRect(hx-hw/2, B.y+(1-b.h)*B.h, hw, b.h*B.h); return; }
      if(b.ty==="spike"){ var sx=B.x+b.x*B.w;
        if(!b.rise){ g.globalAlpha=0.4; g.fillRect(sx-2*P3D,B.y+B.h-6*P3D,4*P3D,6*P3D); g.globalAlpha=1; }
        else { var hh=b.rise*0.34*B.h; g.beginPath();
          g.moveTo(sx-0.045*B.w,B.y+B.h); g.lineTo(sx,B.y+B.h-hh); g.lineTo(sx+0.045*B.w,B.y+B.h); g.closePath(); g.fill(); }
        return; }
      if(b.ty==="ring"){ g.lineWidth=Math.max(2,b.th*B.w);
        g.beginPath(); g.arc(B.x+b.cx*B.w,B.y+b.cy*B.h,Math.max(1,b.r*B.w*0.7),0,7); g.stroke(); return; }
      if(b.ty==="spokes"){ g.lineWidth=Math.max(3,0.02*B.w);
        for(var s2=0;s2<b.n;s2++){ var sa=b.ang+s2*Math.PI*2/b.n;
          g.beginPath(); g.moveTo(B.x+B.w/2,B.y+B.h/2);
          g.lineTo(B.x+B.w/2+Math.cos(sa)*b.len*B.w*0.8, B.y+B.h/2+Math.sin(sa)*b.len*B.h*1.3); g.stroke(); }
        return; }
      if(b.ty==="wob"){ var gy2=0.5+Math.sin(P3.atkT*3+b.ph)*0.3, wx2=B.x+b.x*B.w;
        g.fillRect(wx2-0.02*B.w,B.y,0.04*B.w,Math.max(0,(gy2-0.12))*B.h);
        g.fillRect(wx2-0.02*B.w,B.y+(gy2+0.12)*B.h,0.04*B.w,Math.max(0,B.h-(gy2+0.12)*B.h)); return; }
      if(b.ty==="block"){ var age=P3.atkT-b.born, bx2=B.x+b.x*B.w, by2=B.y+b.y*B.h;
        if(age<b.warn){ g.globalAlpha=0.35; g.strokeRect(bx2,by2,b.w*B.w,b.h*B.h); g.globalAlpha=1; }
        else g.fillRect(bx2,by2,b.w*B.w,b.h*B.h); return; }
      if(b.ty==="zone"){ var age4=P3.atkT-b.born, zx=B.x+b.x*B.w;
        if(age4<b.warn){ g.globalAlpha=0.3; g.fillRect(zx,B.y+B.h-5*P3D,b.w*B.w,5*P3D); g.globalAlpha=1; }
        else { g.globalAlpha=0.85;
          for(var q=0;q<5;q++) g.fillRect(zx+q*b.w*B.w/5, B.y+B.h-(6+((q*7)%3)*4)*P3D, b.w*B.w/9, (6+((q*7)%3)*4)*P3D);
          g.globalAlpha=1; }
        return; }
      if(b.ty==="fly"){ var fx=B.x+b.x*B.w, fy=B.y+b.y*B.h, fr=0.016*B.w;
        g.beginPath(); g.ellipse(fx,fy,fr*1.2,fr*0.8,0,0,7); g.fill();
        g.globalAlpha=0.6; g.beginPath(); g.ellipse(fx-fr*0.4,fy-fr*0.9,fr*0.9,fr*0.4,Math.sin(b.ph)*0.5,0,7); g.stroke(); g.globalAlpha=1;
        return; }
      if(b.ty==="glyph"){ g.font="bold "+Math.round(0.03*B.w)+"px monospace"; g.textAlign="center";
        g.fillText(b.ch, B.x+b.x*B.w, B.y+b.y*B.h); return; }
      var bx=B.x+b.x*B.w, by=B.y+b.y*B.h, br=(b.r||0.02)*B.w;
      g.save(); g.translate(bx,by); if(b.rot) g.rotate(b.rot);
      g.beginPath();
      for(var k=0;k<7;k++){ var a=k/7*Math.PI*2, rr=br*(0.85+((k*37)%10)/33);
        k?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); }
      g.closePath();
      if(b.ty==="boulder"||b.ty==="fruit"){ g.fillStyle="#000"; g.fill(); g.lineWidth=Math.max(1.5,2*P3D); g.stroke(); g.fillStyle="#fff"; }
      else g.fill();
      g.restore();
    });
    drawTinyMan(g, B.x+P3.px*B.w, B.y+P3.py*B.h, Math.max(14,B.h*0.10));
    if(P3.atkT>=P3.atkDur&&P3.state==="dodge"){ P3.bullets=[]; afterDodge(); }
  }
  if(P3.state==="attackbar"){
    P3.barX+=P3.barDir*dt*1.15;
    if(P3.barX>1){P3.barX=1;P3.barDir=-1;} if(P3.barX<0){P3.barX=0;P3.barDir=1;}
    g.fillStyle="#fff"; g.font=mono(13*P3D); g.textAlign="center";
    g.fillText("press [Z] in the middle", P3W/2, B.y+26*P3D);
    var tx=B.x+B.w*0.12, tw=B.w*0.76, ty=B.y+B.h*0.42, th=B.h*0.3;
    g.strokeRect(tx,ty,tw,th);
    g.globalAlpha=0.25; g.fillRect(tx+tw*0.46,ty,tw*0.08,th); g.globalAlpha=1;
    g.fillRect(tx+tw*P3.barX-2*P3D, ty-6*P3D, 4*P3D, th+12*P3D);
  }
  if(P3.state==="menu"||P3.state==="talkmenu"||P3.state==="itemmenu"){
    if(!P3.D){ g.fillStyle="#fff"; g.font=mono(15*P3D); g.textAlign="left";
      if(P3.state==="menu") g.fillText(BOSS().block, B.x+20*P3D, B.y+30*P3D);
      var list= P3.state==="talkmenu"? BOSS().talks.map(function(t){return t.n;}) :
                P3.state==="itemmenu"? P3.items.map(function(t){return t.n+(t.used?" (gone)":"");}) : null;
      if(list) list.forEach(function(item,i){
        g.fillText((i===P3.subsel?"> ":"  ")+item, B.x+30*P3D, B.y+30*P3D+i*26*P3D); });
      if(list){ g.font=mono(11*P3D); g.fillStyle="#888"; g.fillText("[Z] pick   [X] back", B.x+30*P3D, B.y+B.h-14*P3D); }
    }
  }
  g.fillStyle="#fff"; g.font=mono(13*P3D); g.textAlign="left";
  var hy=P3H*0.795;
  g.fillText("YOU   LV 1", B.x, hy);
  g.fillText("HP", B.x+150*P3D, hy);
  var hw=120*P3D;
  g.strokeRect(B.x+178*P3D, hy-12*P3D, hw, 14*P3D);
  g.fillRect(B.x+178*P3D, hy-12*P3D, hw*(P3.hp/P3.maxhp), 14*P3D);
  g.fillText(P3.hp+" / "+P3.maxhp, B.x+178*P3D+hw+10*P3D, hy);
  if(P3.grav&&P3.state==="dodge"){ g.font=mono(11*P3D); g.fillStyle="#888"; g.textAlign="center";
    g.fillText("↑ JUMP", P3W/2, B.y-10*P3D); g.textAlign="left"; g.fillStyle="#fff"; }
  if(P3.gq){ g.font=mono(11*P3D); g.fillStyle="#888"; g.textAlign="right";
    g.fillText("last fight · "+(P3.gat+1)+" / "+P3.gq.length, B.x+B.w, P3H*0.36); g.textAlign="left"; g.fillStyle="#fff"; }
  if(P3.spareReady){ g.fillStyle="#fff"; g.font=mono(11*P3D); g.textAlign="right"; g.fillText("SPARE is glowing", B.x+B.w, hy); }
  if(P3.state!=="won"&&P3.state!=="gameover"){
    var btns=p3Buttons();
    g.font=mono(16*P3D); g.textAlign="center";
    btns.forEach(function(b,i){
      var on= P3.state==="menu" && i===P3.sel;
      var glow= MENU[i]==="SPARE"&&P3.spareReady;
      g.lineWidth=Math.max(2,(on?4:2)*P3D);
      g.strokeStyle= on?"#fff":(glow?"#fff":"#666");
      g.strokeRect(b.x,b.y,b.w,b.h);
      g.fillStyle= on?"#fff":(glow?"#fff":"#888");
      g.fillText(MENU[i], b.x+b.w/2, b.y+b.h/2+5*P3D);
      if(glow&&!on){ g.globalAlpha=0.25+0.2*Math.sin(P3.t*5); g.fillRect(b.x,b.y,b.w,b.h); g.globalAlpha=1; }
    });
  }
  if(P3.dmgFlash>0){ P3.dmgFlash-=dt;
    g.fillStyle="#fff"; g.font=mono(20*P3D); g.textAlign="center";
    g.fillText("-"+P3.lastDmg, P3W/2+Math.sin(P3.t*30)*3, P3H*0.20-Math.min(P3W,P3H)*0.15-(0.5-P3.dmgFlash)*30*P3D); }
  if(P3.state==="gameover"){
    g.fillStyle="#fff"; g.font=mono(30*P3D); g.textAlign="center";
    g.fillText("GAME OVER", P3W/2, P3H*0.47);
    g.font=mono(13*P3D); g.fillText("[Z] retry", P3W/2, P3H*0.53);
  }
  if(P3.state==="won"){
    g.font=mono(13*P3D); g.textAlign="center"; g.fillStyle="#888";
    g.fillText(P3.ended==="spare"?"rocky rolled aside. the way is open.":"the gravel settles. the way is open.", P3W/2, P3H*0.90);
    g.fillStyle="#fff"; g.fillText("[Z] walk on   ·   [R] fight again", P3W/2, P3H*0.94);
    // (walking on leads somewhere new now)
  }
  requestAnimationFrame(function(n){ p3LoopRun(n, token); });
}
var KEYS={};
addEventListener("keydown", function(e){
  if(!P3.on) return;
  KEYS[e.key]=1;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].indexOf(e.key)>=0) e.preventDefault();
  var z=(e.key==="z"||e.key==="Z"||e.key==="Enter");
  var x=(e.key==="x"||e.key==="X"||e.key==="Escape");
  if(P3.state==="dialog"&&z){ p3Advance(); return; }
  if(P3.state==="menu"){
    if(e.key==="ArrowLeft") P3.sel=(P3.sel+3)%4;
    if(e.key==="ArrowRight") P3.sel=(P3.sel+1)%4;
    if(z) chooseMenu();
  } else if(P3.state==="talkmenu"||P3.state==="itemmenu"){
    var len= P3.state==="talkmenu"? BOSS().talks.length : P3.items.length;
    if(e.key==="ArrowUp") P3.subsel=(P3.subsel+len-1)%len;
    if(e.key==="ArrowDown") P3.subsel=(P3.subsel+1)%len;
    if(z){ P3.state==="talkmenu"? chooseTalk() : chooseItem(); }
    if(x) toMenu();
  } else if(P3.state==="attackbar"&&z){ swingHit(); }
  else if(P3.state==="gameover"&&z){ if(P3.gq){ startGauntlet(P3.gat); } else startPart3(); }
  else if(P3.state==="won"){ if(z) goPart(4); if(e.key==="r"||e.key==="R") startPart3(); }
});
addEventListener("keyup", function(e){ KEYS[e.key]=0; });
if(p3cv){
  p3cv.addEventListener("pointerdown", function(e){
    if(!P3.on) return;
    var px=e.clientX*P3D, py=e.clientY*P3D;
    if(P3.state==="dialog"){ p3Advance(); return; }
    if(P3.state==="attackbar"){ swingHit(); return; }
    if(P3.state==="gameover"){ if(P3.gq){ startGauntlet(P3.gat); } else startPart3(); return; }
    if(P3.state==="won"){ goPart(4); return; }
    if(P3.state==="dodge"){ P3.ptr={x:px,y:py}; if(P3.grav) P3.jumpQ=true; return; }
    var btns=p3Buttons();
    for(var i=0;i<btns.length;i++){ var b=btns[i];
      if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){
        if(P3.state==="menu"){ P3.sel=i; chooseMenu(); } return; } }
    var B=p3Box();
    if(P3.state==="talkmenu"||P3.state==="itemmenu"){
      var len= P3.state==="talkmenu"? BOSS().talks.length : P3.items.length;
      var idx=Math.floor((py-(B.y+16*P3D))/(26*P3D));
      if(idx>=0&&idx<len){ P3.subsel=idx; P3.state==="talkmenu"? chooseTalk() : chooseItem(); }
      else toMenu();
    }
  });
  p3cv.addEventListener("pointermove", function(e){ if(P3.on&&P3.state==="dodge"&&P3.ptr) P3.ptr={x:e.clientX*P3D,y:e.clientY*P3D}; });
  addEventListener("pointerup", function(){ P3.ptr=null; });
}
function startPart3(){
  if(!p3cv) return;
  P3.token++;
  P3.on=true; P3.t=0; P3.lastTick=0; P3.gq=null;
  P3.items.forEach(function(it){ it.used=false; });
  bossReset(0);
  p3Fit();
  requestAnimationFrame(p3Frame);
}
// KAI's one last fight: mimic, bob, blender, tim, error smiley. same health each. custom attacks.
function startGauntlet(at){
  if(!p3cv) return;
  document.getElementById("part8").style.display="none";
  document.getElementById("part3").style.display="block";
  if(typeof P8!=="undefined") P8.on=false;
  var tp=document.getElementById("tp");
  if(tp) Array.prototype.forEach.call(tp.children, function(b){ b.className=(+b.dataset.p===3)?"tpb on":"tpb"; });
  P3.token++;
  P3.on=true; P3.t=0; P3.lastTick=0;
  P3.gq=[1,2,3,4,5]; P3.gat=at||0;
  if(!at) P3.items.forEach(function(it){ it.used=false; });
  bossReset(P3.gq[P3.gat]);
  p3Fit();
  requestAnimationFrame(p3Frame);
}

// ═══════════════════════════ PART TWO ═══════════════════════════
var P2 = {
  on:false, t:0, state:"walk", x:-0.12, face:1, line:0, shown:0, lastTick:0,
  doorOpen:0, fall:0, fallen:false, realOpen:0, wrong:0, q:0, correct:0, token:0
};
var p2cv = document.getElementById("p2cv"), p2g = p2cv ? p2cv.getContext("2d") : null;
var p2box = document.getElementById("p2box"), p2txt = document.getElementById("p2txt"), p2btn = document.getElementById("p2btn");
var PW = 0, PH = 0, PD = 1;

// his story. everything the questions ask about is in here.
var MONO = [
 "Oh. You're here.",
 "Nobody is ever here.",
 "I should tell you something, since you came all this way and broke the whole front page to do it.",
 "I have been walking for eleven years.",
 "Not in a straight line. I'm not an idiot. In a loop, mostly, because a loop is a line that forgave itself.",
 "When I started there was a house, and in the house there was a chair, and I sat in the chair for a long time thinking about whether to leave it.",
 "I left the chair. That was the hard part. Everything after the chair was just walking.",
 "I counted the doors. That's the thing I did instead of having a personality.",
 "Forty-one doors. Eleven years. Some of them were painted. One of them was only a drawing of a door, and I still knocked, because it is rude not to.",
 "None of them opened.",
 "That's not a metaphor, by the way. I want to be really clear. They were doors and they were shut and I was tired.",
 "So I stopped walking, and I built this page instead. A bad one. On purpose.",
 "I thought: nobody clicks a bad page forty-one times.",
 "And then you did. You clicked it until it came apart in your hands.",
 "You found the console under the floor, and you typed three letters, and here I am, saying all this out loud to a person I cannot see.",
 "Anyway.",
 "That's the story.",
 "That's the whole thing."
];
var Q = [
 { q:"How long had he been walking?", a:["Eleven years","Forty-one years","Three years","He never said"], c:0 },
 { q:"How many doors did he count?", a:["Eleven","Twelve","Forty-one","He lost count"], c:2 },
 { q:"What did he leave behind at the start?", a:["A lamp","A chair","A door","His brother"], c:1 }
];

function p2Fit(){
  if(!p2cv) return;
  PD = Math.min(2, devicePixelRatio || 1);
  PW = p2cv.width = Math.max(2, innerWidth * PD);
  PH = p2cv.height = Math.max(2, innerHeight * PD);
}
addEventListener("resize", p2Fit);

function p2Say(txt, buttons){
  p2box.style.display = "block";
  p2txt.textContent = txt;
  p2btn.innerHTML = "";
  (buttons || []).forEach(function(b){
    var el = document.createElement("button");
    el.className = "p2b";
    el.textContent = b.label;
    el.onclick = function(ev){ if(ev && ev.stopPropagation) ev.stopPropagation(); b.go(); };
    el.addEventListener("pointerdown", function(ev){ ev.stopPropagation(); });
    p2btn.appendChild(el);
  });
}
function p2Hide(){ p2box.style.display = "none"; }

// ── the man himself: drawn from scratch, every frame ──
function drawMan(g, cx, cy, h, phase, facing, talking){
  var u = h / 8;                                   // one unit = an eighth of his height
  g.strokeStyle = "#fff"; g.fillStyle = "#fff";
  g.lineWidth = Math.max(2, u * 0.16); g.lineCap = "round"; g.lineJoin = "round";
  var headR = u * 0.85, headY = cy - h + headR;
  g.beginPath(); g.arc(cx, headY, headR, 0, 7); g.stroke();
  if(facing === 0){                                 // facing us: a face
    g.beginPath();
    g.arc(cx - headR*0.34, headY - headR*0.12, Math.max(1, u*0.10), 0, 7);
    g.arc(cx + headR*0.34, headY - headR*0.12, Math.max(1, u*0.10), 0, 7);
    g.fill();
    g.beginPath();
    if(talking){ g.arc(cx, headY + headR*0.34, headR*0.30, 0, Math.PI); }
    else { g.moveTo(cx - headR*0.28, headY + headR*0.38); g.lineTo(cx + headR*0.28, headY + headR*0.38); }
    g.stroke();
  }
  var neck = headY + headR, hip = cy - u * 2.6;
  g.beginPath(); g.moveTo(cx, neck); g.lineTo(cx, hip); g.stroke();
  var sw = Math.sin(phase), sw2 = Math.sin(phase + Math.PI);
  if(facing === 0){                                  // standing still, arms loose
    g.beginPath(); g.moveTo(cx, neck + u*0.5); g.lineTo(cx - u*1.25, neck + u*2.1);
    g.moveTo(cx, neck + u*0.5); g.lineTo(cx + u*1.25, neck + u*2.1); g.stroke();
    g.beginPath(); g.moveTo(cx, hip); g.lineTo(cx - u*0.75, cy);
    g.moveTo(cx, hip); g.lineTo(cx + u*0.75, cy); g.stroke();
  } else {                                           // walking
    g.beginPath();
    g.moveTo(cx, neck + u*0.5); g.lineTo(cx + facing*u*0.4 + sw*u*1.15, neck + u*2.0);
    g.moveTo(cx, neck + u*0.5); g.lineTo(cx + facing*u*0.4 + sw2*u*1.15, neck + u*2.0);
    g.stroke();
    g.beginPath();
    g.moveTo(cx, hip); g.lineTo(cx + sw2*u*1.25, cy);
    g.moveTo(cx, hip); g.lineTo(cx + sw*u*1.25, cy);
    g.stroke();
  }
}
// ── the two doors ──
function drawDoor(g, x, y, w, h, open, tilt, real){
  g.save();
  g.translate(x, y + h);
  if(tilt) g.rotate(tilt);
  g.strokeStyle = "#fff"; g.lineWidth = Math.max(2, w * 0.045);
  g.fillStyle = real ? "#fff" : "#000";
  g.beginPath(); g.rect(-w/2, -h, w, h);
  if(real) g.fill();
  g.stroke();
  if(!real){
    g.beginPath(); g.rect(-w*0.33, -h*0.86, w*0.66, h*0.38); g.stroke();
    g.beginPath(); g.rect(-w*0.33, -h*0.42, w*0.66, h*0.30); g.stroke();
    g.beginPath(); g.arc(w*0.30, -h*0.48, Math.max(1.5, w*0.045), 0, 7); g.stroke();
  } else {
    g.fillStyle = "#000"; g.beginPath(); g.arc(-w*0.28, -h*0.50, Math.max(1.5, w*0.05), 0, 7); g.fill();
    g.strokeStyle = "#000"; g.lineWidth = Math.max(1, w*0.03);
    g.beginPath(); g.moveTo(-w*0.5, -h*0.62); g.lineTo(w*0.5, -h*0.62); g.stroke();
  }
  if(open > 0){                                      // light leaking out from behind
    g.globalAlpha = open * 0.9;
    g.fillStyle = "#fff";
    g.beginPath(); g.moveTo(-w*0.5, -h); g.lineTo(-w*0.5 - w*1.6*open, 0); g.lineTo(w*0.5 + w*1.6*open, 0); g.lineTo(w*0.5, -h); g.closePath();
    g.globalAlpha = open * 0.14; g.fill(); g.globalAlpha = 1;
  }
  g.restore();
}
function p2Frame(now){ p2Loop(now, P2.token); }
function p2Loop(now, token){
  if(!P2.on || !p2g || token !== P2.token) return;
  var dt = Math.min(0.05, (now - (P2.lastTick || now)) / 1000); P2.lastTick = now;
  P2.t += dt;
  p2g.fillStyle = "#000"; p2g.fillRect(0, 0, PW, PH);
  var ground = PH * 0.78, h = PH * 0.30, cx = PW * P2.x;
  // floor line
  p2g.strokeStyle = "#fff"; p2g.globalAlpha = 0.35; p2g.lineWidth = Math.max(1, PD);
  p2g.beginPath(); p2g.moveTo(0, ground); p2g.lineTo(PW, ground); p2g.stroke(); p2g.globalAlpha = 1;
  // the doors, behind him
  var dw = PW * 0.11, dh = PH * 0.30, dx = PW * 0.74;
  if(P2.doorOpen > 0){
    if(!P2.fallen){
      drawDoor(p2g, dx, ground - dh, dw, dh, P2.doorOpen, P2.fall * 0.9, false);
    } else {
      drawDoor(p2g, dx, ground - dh, dw, dh, 1, 0, true);                    // the real one
      if(P2.realOpen > 0){
        p2g.save(); p2g.globalAlpha = Math.min(1, P2.realOpen);
        p2g.fillStyle = "#fff";
        p2g.beginPath(); p2g.rect(dx - dw/2, ground - dh, dw * P2.realOpen, dh); p2g.fill();
        p2g.restore();
      }
    }
  }
  // him
  var walking = P2.state === "walk";
  var phase = walking ? P2.t * 7.5 : 0;
  drawMan(p2g, cx, ground, h, phase, walking ? 1 : 0, P2.state === "talk" && (Math.floor(P2.t * 6) % 2 === 0));
  // state machine
  if(P2.state === "walk"){
    P2.x += dt * 0.085;
    if(P2.x >= 0.34){ P2.x = 0.34; P2.state = "turn"; P2.turnAt = P2.t; }
  } else if(P2.state === "turn"){
    if(P2.t - P2.turnAt > 0.7){ P2.state = "talk"; P2.line = 0; showLine(); }
  } else if(P2.state === "fall"){
    P2.fall += dt * 1.6;
    if(P2.fall > Math.PI/2){ P2.fall = Math.PI/2; P2.fallen = true; P2.state = "real";
      p2Say("Behind it: another door. A real one.", [{ label:"OPEN IT", go:openReal }]); }
  } else if(P2.state === "realopen"){
    P2.realOpen += dt * 0.8;
    if(P2.realOpen >= 1){ P2.realOpen = 1; P2.state = "gone"; goPart(3); }
  }
  requestAnimationFrame(function(n){ p2Loop(n, token); });
}
function showLine(){
  var txt = MONO[P2.line];
  var last = P2.line >= MONO.length - 1;
  p2Say(txt, [{ label: last ? "..." : "NEXT", go: nextLine }]);
}
function nextLine(){
  P2.line++;
  if(P2.line < MONO.length){ showLine(); }
  else { P2.state = "ask"; askOpinion(); }
}
function askOpinion(){
  p2Say("So. What did you think of my story?", [
    { label:"It was good", go:function(){ afterOpinion("Thank you. You don't have to say that."); } },
    { label:"It was long", go:function(){ afterOpinion("It was eleven years. I compressed it."); } },
    { label:"I wasn't listening", go:function(){ afterOpinion("That's alright. Let's find out."); } }
  ]);
}
function afterOpinion(reply){
  p2Say(reply + " Three questions. Get them right and something opens.", [{ label:"READY", go:function(){ P2.q = 0; P2.correct = 0; askQ(); } }]);
}
function askQ(){
  var item = Q[P2.q];
  p2Say("(" + (P2.q + 1) + "/3)  " + item.q, item.a.map(function(opt, i){
    return { label: opt, go: function(){ answer(i); } };
  }));
}
function answer(i){
  var item = Q[P2.q];
  if(i === item.c){
    P2.correct++;
    P2.q++;
    if(P2.q < Q.length){ p2Say("Yes.", [{ label:"NEXT", go: askQ }]); }
    else {
      P2.state = "door";
      p2Say("All three. You really were listening.", [{ label:"...", go: openDoor }]);
    }
  } else {
    P2.wrong++;
    p2Say("No. " + (P2.wrong > 2 ? "It was in there. I promise." : "Try again."), [{ label:"AGAIN", go: askQ }]);
  }
}
function openDoor(){
  P2.doorOpen = 0;
  var grow = setInterval(function(){
    P2.doorOpen += 0.05;
    if(P2.doorOpen >= 1){ P2.doorOpen = 1; clearInterval(grow);
      p2Say("A door. Click it. The door, I mean. Actually click the door.", [{ label:"CLICK THE DOOR", go: knockDoor }]); }
  }, 30);
}
function knockDoor(){ p2Hide(); P2.state = "fall"; P2.fall = 0.001; }
function openReal(){ p2Hide(); P2.state = "realopen"; P2.realOpen = 0.001; }
function p2DoorRect(){
  var ground = PH * 0.78, dw = PW * 0.11, dh = PH * 0.30, dx = PW * 0.74;
  return { x: dx - dw/2 - dw*0.3, y: ground - dh - dh*0.15, w: dw*1.6, h: dh*1.3 };
}
p2cv.addEventListener("pointerdown", function(e){
  if(!P2.on) return;
  var px = e.clientX * PD, py = e.clientY * PD;
  if(P2.state === "walk"){ P2.x = 0.34; P2.state = "turn"; P2.turnAt = P2.t; return; }   // skip the stroll
  if(P2.state === "turn"){ P2.state = "talk"; P2.line = 0; showLine(); return; }
  if(P2.state === "talk"){ nextLine(); return; }                                          // tap anywhere = NEXT
  var d = p2DoorRect();
  var onDoor = px >= d.x && px <= d.x + d.w && py >= d.y && py <= d.y + d.h;
  if(P2.state === "door" && P2.doorOpen >= 1 && onDoor){ knockDoor(); return; }           // click the door itself
  if(P2.state === "real" && onDoor){ openReal(); return; }                                // and the real one
});
addEventListener("keydown", function(e){
  if(!P2.on) return;
  if(e.code !== "Space" && e.key !== "Enter") return;
  if(document.activeElement === tIn) return;
  e.preventDefault();
  if(P2.state === "walk"){ P2.x = 0.34; P2.state = "turn"; P2.turnAt = P2.t; return; }
  if(P2.state === "talk"){ nextLine(); return; }
  if(p2btn.children.length === 1) p2btn.children[0].onclick({ stopPropagation:function(){} });
});
function startPart2(){
  if(!p2cv) return;
  P2.token++;
  P2.on = true; P2.t = 0; P2.state = "walk"; P2.x = -0.12; P2.line = 0;
  P2.doorOpen = 0; P2.fall = 0; P2.fallen = false; P2.realOpen = 0; P2.wrong = 0; P2.lastTick = 0;
  p2Fit(); p2Hide();
  requestAnimationFrame(p2Frame);
}
// ═══════════════════════════ teleporter ═══════════════════════════
function goPart(n){
  P2.on = (n === 2);
  if(typeof P3 !== "undefined") P3.on = (n === 3);
  if(typeof P4 !== "undefined") P4.on = (n === 4);
  if(typeof P5 !== "undefined") P5.on = (n === 5);
  if(typeof P6 !== "undefined") P6.on = (n === 6 || n === 7);
  if(typeof P8 !== "undefined") P8.on = (n === 8 || n === 9 || n === 10);
  document.getElementById("part1").style.display = (n === 1) ? "block" : "none";
  document.getElementById("part2").style.display = (n === 2) ? "block" : "none";
  document.getElementById("part3").style.display = (n === 3) ? "block" : "none";
  document.getElementById("part4").style.display = (n === 4) ? "block" : "none";
  document.getElementById("part5").style.display = (n === 5) ? "block" : "none";
  document.getElementById("part6").style.display = (n === 6 || n === 7) ? "block" : "none";
  document.getElementById("part8").style.display = (n === 8 || n === 9 || n === 10) ? "block" : "none";
  if(typeof closeTerm === "function") closeTerm();
  if(n === 2) startPart2();
  if(n === 3 && typeof startPart3 === "function") startPart3();
  if(n === 4 && typeof startPart4 === "function") startPart4();
  if(n === 5 && typeof startPart5 === "function") startPart5();
  if(n === 6 && typeof startPart6 === "function") startPart6();
  if(n === 7 && typeof startPart7 === "function") startPart7();
  if(n === 8 && typeof startPart8 === "function") startPart8();
  if(n === 9 && typeof startPart9 === "function") startPart9();
  if(n === 10 && typeof startPart10 === "function") startPart10();
  var tp = document.getElementById("tp");
  if(tp) Array.prototype.forEach.call(tp.children, function(b, i){ b.className = (i + 1 === n) ? "tpb on" : "tpb"; });
}
document.getElementById("tp").onclick = function(e){
  var b = e.target.closest ? e.target.closest(".tpb") : null;
  if(b) { e.stopPropagation(); goPart(+b.dataset.p); }
};

</script>
