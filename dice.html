<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dice · Kai.fun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --felt:#0b5d3b; --felt-deep:#063823; --rail:#4a2216; --rail-hi:#6b3420; --rail-lo:#2a120b;
    --brass:#e2bd67; --brass-lo:#a57d2c; --ivory:#f6f1e7; --ink:#1b120d;
    --chip-red:#c8313a; --chip-blue:#2b62b0; --chip-violet:#6f47a8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:var(--felt-deep);overflow:hidden;font-family:"Barlow Semi Condensed","Trebuchet MS",system-ui,sans-serif;color:var(--ivory);}
  #c{position:fixed;inset:0;display:block;touch-action:none;}
  button,input{font-family:inherit;}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--brass);outline-offset:3px;}

  /* ---- table marking printed on the felt ---- */
  #mark{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;
    color:rgba(246,241,231,.86);}
  #mark h1{font-family:"Limelight",Georgia,serif;font-weight:400;font-size:clamp(34px,5vw,54px);letter-spacing:.06em;line-height:1;
    text-shadow:0 2px 0 rgba(0,0,0,.25);}
  #mark .arc{display:inline-block;margin-top:6px;padding:3px 14px;border:1.5px solid rgba(246,241,231,.45);border-radius:999px;
    font-size:13px;font-weight:600;letter-spacing:.08em;color:rgba(246,241,231,.75);white-space:nowrap;}
  #homeLink{position:fixed;top:16px;left:16px;z-index:12;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;
    border-radius:999px;background:rgba(6,40,25,.55);border:1px solid rgba(226,189,103,.35);color:var(--brass);
    font-weight:700;font-size:14px;text-decoration:none;letter-spacing:.02em;}
  #homeLink:hover{background:rgba(6,40,25,.85);color:#f3d58f;}

  /* ---- result plaque ---- */
  #result{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--railH,112px) + 16px);z-index:10;
    min-width:220px;max-width:min(92vw,640px);padding:10px 22px 11px;text-align:center;
    background:linear-gradient(#f0d488,#d2a64c 55%,#b98b34);color:var(--ink);border-radius:10px;
    box-shadow:0 1px 0 #fff6 inset,0 -2px 0 #0003 inset,0 10px 24px rgba(0,0,0,.35);
    font-size:17px;font-weight:700;line-height:1.25;}
  #result::before,#result::after{content:"";position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff7,#7a5a1e 70%);}
  #result::before{left:8px;} #result::after{right:8px;}
  #result b{font-family:"Limelight",Georgia,serif;font-weight:400;font-size:30px;vertical-align:-3px;margin-left:2px;}
  #result .sub{font-size:13px;font-weight:600;color:#4b3414;margin-top:2px;}
  #result .vals{word-break:break-word;}

  /* ---- the rail (controls) ---- */
  #bar{position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:
      linear-gradient(180deg,var(--rail-hi) 0,var(--rail) 18%,var(--rail) 70%,var(--rail-lo) 100%);
    border-top:3px solid #1a0a05;box-shadow:0 -10px 30px rgba(0,0,0,.35);}
  #bar::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,220,170,.18);}
  .grp{display:flex;align-items:center;gap:10px;}
  .grpLabel{font-size:13px;font-weight:700;color:#e9cfa0;letter-spacing:.03em;margin-right:2px;}

  /* poker chips */
  .chip{position:relative;width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
    background:
      radial-gradient(circle,var(--c) 0 52%,transparent 53%),
      repeating-conic-gradient(var(--c) 0 22.5deg,#fff 22.5deg 30deg,var(--c) 30deg 45deg);
    box-shadow:0 0 0 2px rgba(0,0,0,.35),0 4px 0 #0007,0 6px 12px rgba(0,0,0,.35);
    transition:transform .12s ease,box-shadow .12s ease;}
  .chip::after{content:"";position:absolute;inset:11px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);pointer-events:none;}
  .chip::before{content:"+";position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;
    background:linear-gradient(#f4dc95,#c99a40);color:var(--ink);font-size:17px;font-weight:800;line-height:21px;text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .chip .nm{font-size:14px;font-weight:800;letter-spacing:.01em;text-shadow:0 1px 1px rgba(0,0,0,.4);}
  .chip:hover{transform:translateY(-3px);box-shadow:0 0 0 2px rgba(0,0,0,.35),0 7px 0 #0007,0 10px 16px rgba(0,0,0,.35);}
  .chip:active{transform:translateY(2px);box-shadow:0 0 0 2px rgba(0,0,0,.35),0 2px 0 #0007;}
  #addD6{--c:var(--chip-red);} #addBarrel{--c:var(--chip-blue);} #addOrb{--c:var(--chip-violet);}

  /* sides stepper */
  .stepper{display:flex;align-items:center;height:48px;border-radius:12px;background:#1f0d07;border:1px solid #6b3a22;
    box-shadow:0 2px 0 #fff1 inset;padding:0 4px;}
  .stepper button{width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:var(--brass);font-size:22px;font-weight:700;cursor:pointer;}
  .stepper button:hover{background:#ffffff12;}
  .stepper label{display:flex;flex-direction:column;align-items:center;line-height:1;}
  .stepper .lbl{font-size:11px;font-weight:700;color:#c9a578;letter-spacing:.05em;}
  #sidesIn{width:46px;border:0;background:transparent;color:var(--ivory);text-align:center;font-size:21px;font-weight:800;
    -moz-appearance:textfield;padding:0;}
  #sidesIn::-webkit-inner-spin-button,#sidesIn::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}

  #rollAll{height:56px;padding:0 34px;border:0;border-radius:14px;cursor:pointer;
    font-family:"Limelight",Georgia,serif;font-size:24px;letter-spacing:.06em;color:var(--ink);
    background:linear-gradient(#f4dc95,#dcb25a 50%,#b88a33);
    box-shadow:0 1px 0 #fff8 inset,0 -3px 0 #0002 inset,0 4px 0 #3b1a0c,0 8px 16px rgba(0,0,0,.4);
    transition:transform .12s ease,box-shadow .12s ease;}
  #rollAll:hover{transform:translateY(-2px);box-shadow:0 1px 0 #fff8 inset,0 -3px 0 #0002 inset,0 6px 0 #3b1a0c,0 12px 20px rgba(0,0,0,.4);}
  #rollAll:active{transform:translateY(3px);box-shadow:0 1px 0 #fff8 inset,0 1px 0 #3b1a0c;}
  #clearAll{height:44px;padding:0 16px;border-radius:10px;border:1.5px solid #8a5034;background:transparent;color:#e9cfa0;
    font-weight:700;font-size:15px;cursor:pointer;letter-spacing:.03em;}
  #clearAll:hover{background:#ffffff10;color:#fff;}

  #overlay{position:fixed;inset:0;background:var(--felt-deep);color:#cfe3d6;z-index:50;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:17px;font-weight:600;padding:20px;white-space:pre-line;line-height:1.5;}

  @media (max-width:640px){
    #homeLink{top:12px;left:12px;}
    #mark{top:64px;}
    #mark h1{font-size:34px;}
    #bar{gap:10px 8px;padding:12px 10px calc(12px + env(safe-area-inset-bottom));}
    .grpLabel{display:none;}
    .chip{width:56px;height:56px;}
    .chip::after{inset:9px;}
    .chip .nm{font-size:12.5px;}
    .grp.make{gap:8px;}
    .grp.go{width:100%;justify-content:center;}
    #rollAll{flex:1;max-width:240px;height:52px;font-size:22px;}
    .stepper{height:48px;}
    .stepper button{width:34px;}
    #sidesIn{width:38px;}
    #result{font-size:15px;min-width:0;width:max-content;max-width:calc(100vw - 32px);}
  }
  @media (prefers-reduced-motion:reduce){ .chip,#rollAll{transition:none;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="homeLink" href="index.html">&larr; Kai.fun</a>
<div id="mark"><h1>Dice</h1><span class="arc">a table for strange dice</span></div>
<div id="result">tap a die to kick it<div class="sub">add dice from the rail below</div></div>
<div id="bar">
  <div class="grp make">
    <span class="grpLabel">add</span>
    <button id="addD6" class="chip" aria-label="add a six-sided die"><span class="nm">d6</span></button>
    <button id="addBarrel" class="chip" aria-label="add a barrel die"><span class="nm">barrel</span></button>
    <button id="addOrb" class="chip" aria-label="add an orb die"><span class="nm">orb</span></button>
    <div class="stepper" title="how many sides the barrel and orb get">
      <button id="sidesDown" aria-label="fewer sides">&minus;</button>
      <label><input id="sidesIn" type="number" min="3" max="60" value="10" inputmode="numeric"><span class="lbl">sides</span></label>
      <button id="sidesUp" aria-label="more sides">+</button>
    </div>
  </div>
  <div class="grp go">
    <button id="rollAll">Roll all</button>
    <button id="clearAll">Clear</button>
  </div>
</div>
<div id="overlay">loading 3D engine…</div>

<script>
(async function main(){
const overlay = document.getElementById("overlay");
function fail(msg){ overlay.textContent = msg; overlay.style.display = "flex"; }

async function importAny(urls){
  let lastErr;
  for(const u of urls){
    try{ return await import(u); }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("no source worked");
}

let THREE, CANNON;
try{
  THREE = await importAny([
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "https://unpkg.com/three@0.160.0/build/three.module.js",
  ]);
  CANNON = await importAny([
    "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js",
    "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js",
  ]);
}catch(e){
  fail("couldn't download the 3D engine.\nthis network may block CDNs — try another connection.");
  return;
}
overlay.style.display = "none";

// ================= SCENE =================
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x063823);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 16, 11);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(6, 14, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
scene.add(sun);

// felt table
const TRAY_W = 19, TRAY_D = 12;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(TRAY_W*5, TRAY_D*8),
  new THREE.MeshStandardMaterial({color:0x0b5d3b, roughness:0.95})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
// wooden rail drawn where the invisible tray walls are (visual only — physics unchanged)
(function(){
  const wood = new THREE.MeshStandardMaterial({color:0x5a2a18, roughness:0.55});
  const T = 0.5, Hh = 0.55;
  const mk = (w,d,x,z)=>{ const m = new THREE.Mesh(new THREE.BoxGeometry(w,Hh,d), wood); m.position.set(x,Hh/2,z); m.castShadow = true; m.receiveShadow = true; scene.add(m); };
  mk(TRAY_W+2*T, T, 0, -TRAY_D/2-T/2); mk(TRAY_W+2*T, T, 0, TRAY_D/2+T/2);
  mk(T, TRAY_D, -TRAY_W/2-T/2, 0);     mk(T, TRAY_D, TRAY_W/2+T/2, 0);
})();

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  // narrow screens: widen the view so the whole tray still fits between the title and the rail
  // tall phone screens look at the tray from its long side, so it fills the screen top to bottom
  const portrait = camera.aspect < 0.85;
  if(portrait){ camera.position.set(11, 16, 0); camera.zoom = Math.min(1, camera.aspect/0.92); }
  else { camera.position.set(0, 16, 11); camera.zoom = Math.min(1, camera.aspect/1.45); }
  camera.lookAt(0, 0, 0);
  const railH = document.getElementById("bar").offsetHeight;
  document.documentElement.style.setProperty("--railH", railH+"px");
  // nudge the table up so the rail never hides its front edge
  camera.setViewOffset(innerWidth, innerHeight, 0, railH*0.42, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

// ================= PHYSICS =================
const world = new CANNON.World({gravity: new CANNON.Vec3(0, -22, 0)});
world.allowSleep = true;
const matDice = new CANNON.Material("dice");
const matTable = new CANNON.Material("table");
world.addContactMaterial(new CANNON.ContactMaterial(matDice, matTable, {friction:0.25, restitution:0.42}));
world.addContactMaterial(new CANNON.ContactMaterial(matDice, matDice, {friction:0.2, restitution:0.5}));

function staticPlane(nx, ny, nz, px, py, pz){
  const b = new CANNON.Body({type:CANNON.Body.STATIC, shape:new CANNON.Plane(), material:matTable});
  b.quaternion.setFromVectors ? null : null;
  const n = new CANNON.Vec3(nx,ny,nz);
  b.quaternion.setFromUnitVectors ? b.quaternion.setFromUnitVectors(new CANNON.Vec3(0,0,1), n)
    : b.quaternion.setFromVectors(new CANNON.Vec3(0,0,1), n);
  b.position.set(px,py,pz);
  world.addBody(b);
}
staticPlane(0,1,0, 0,0,0);                       // floor
staticPlane(0,0,1, 0,0,-TRAY_D/2);               // back
staticPlane(0,0,-1, 0,0, TRAY_D/2);              // front
staticPlane(1,0,0, -TRAY_W/2,0,0);               // left
staticPlane(-1,0,0, TRAY_W/2,0,0);               // right

// ================= TEXTURES =================
function canvasTex(w, h, draw){
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.anisotropy = 4;
  return t;
}
function pipFace(n){
  return canvasTex(256, 256, (ctx)=>{
    ctx.fillStyle = "#f6f1e7";
    ctx.fillRect(0,0,256,256);
    ctx.strokeStyle = "#00000022"; ctx.lineWidth = 10;
    ctx.strokeRect(5,5,246,246);
    ctx.fillStyle = "#181818";
    const P = 62, C = 128, F = 194, R = 24;
    const spots = {
      1:[[C,C]], 2:[[P,P],[F,F]], 3:[[P,P],[C,C],[F,F]],
      4:[[P,P],[F,P],[P,F],[F,F]], 5:[[P,P],[F,P],[C,C],[P,F],[F,F]],
      6:[[P,P],[F,P],[P,C],[F,C],[P,F],[F,F]],
    }[n];
    for(const [x,y] of spots){
      ctx.beginPath(); ctx.arc(x,y,R,0,Math.PI*2); ctx.fill();
    }
  });
}
function barrelTex(N, hue){
  const w = Math.max(1024, N*90);
  return canvasTex(w, 256, (ctx)=>{
    ctx.fillStyle = "hsl("+hue+",45%,90%)";
    ctx.fillRect(0,0,w,256);
    const col = w/N;
    ctx.fillStyle = "#181818";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for(let k=0;k<N;k++){
      ctx.strokeStyle = "#00000030"; ctx.lineWidth = 4;
      ctx.strokeRect(k*col+2, 2, col-4, 252);
      ctx.font = "bold "+(N>24?90:120)+"px Trebuchet MS";
      // upright when the face is on top of a lying barrel
      ctx.save();
      ctx.translate(k*col+col/2, 128);
      ctx.rotate(Math.PI/2);
      ctx.fillText(String(k+1), 0, 0);
      ctx.restore();
    }
  });
}
function orbTex(hue){
  return canvasTex(512, 256, (ctx)=>{
    const g = ctx.createLinearGradient(0,0,0,256);
    g.addColorStop(0, "hsl("+hue+",70%,62%)");
    g.addColorStop(1, "hsl("+((hue+40)%360)+",70%,42%)");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,512,256);
    ctx.fillStyle = "#ffffff55";
    for(let i=0;i<40;i++){
      ctx.beginPath();
      ctx.arc(Math.random()*512, Math.random()*256, 2+Math.random()*4, 0, Math.PI*2);
      ctx.fill();
    }
  });
}

// ================= DICE =================
const dice = [];  // {mesh, body, kind, sides, ...}
const MAXD = 25;
const resultEl = document.getElementById("result");

function fib(n){
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y = 1 - 2*(i+0.5)/n;
    const r = Math.sqrt(Math.max(0, 1 - y*y));
    const th = i * golden;
    pts.push(new THREE.Vector3(Math.cos(th)*r, y, Math.sin(th)*r));
  }
  return pts;
}

function spawnCommon(mesh, body){
  mesh.castShadow = true;
  body.position.set((Math.random()-0.5)*TRAY_W*0.5, 6+Math.random()*3, (Math.random()-0.5)*TRAY_D*0.5);
  body.quaternion.setFromEuler(Math.random()*6, Math.random()*6, Math.random()*6);
  body.angularVelocity.set((Math.random()-0.5)*14, (Math.random()-0.5)*14, (Math.random()-0.5)*14);
  body.velocity.set((Math.random()-0.5)*4, -2, (Math.random()-0.5)*4);
  body.allowSleep = true;
  body.sleepSpeedLimit = 0.35;
  body.sleepTimeLimit = 0.55;
  scene.add(mesh);
  world.addBody(body);
}
function addD6(){
  if(dice.length >= MAXD) return capMsg();
  const s = 1.35;
  const mats = [3,4,1,6,2,5].map(n=>new THREE.MeshStandardMaterial({map:pipFace(n), roughness:0.4}));
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(s,s,s), mats);
  const body = new CANNON.Body({mass:1, material:matDice,
    shape:new CANNON.Box(new CANNON.Vec3(s/2,s/2,s/2))});
  spawnCommon(mesh, body);
  dice.push({mesh, body, kind:"d6", sides:6});
}
function addBarrel(N){
  if(dice.length >= MAXD) return capMsg();
  N = Math.max(3, Math.min(60, N|0 || 10));
  const r = 0.85, L = 2.1;
  const hue = Math.floor(Math.random()*360);
  const side = new THREE.MeshStandardMaterial({map:barrelTex(N, hue), roughness:0.45});
  const cap = new THREE.MeshStandardMaterial({color:0x222222, roughness:0.5});
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, N), [side, cap, cap]);
  const body = new CANNON.Body({mass:1.2, material:matDice,
    shape:new CANNON.Cylinder(r, r, L, N)});
  spawnCommon(mesh, body);
  dice.push({mesh, body, kind:"barrel", sides:N});
}
function addOrb(N){
  if(dice.length >= MAXD) return capMsg();
  N = Math.max(2, Math.min(120, N|0 || 10));
  const r = 0.95;
  const hue = Math.floor(Math.random()*360);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24),
    new THREE.MeshStandardMaterial({map:orbTex(hue), roughness:0.3}));
  const body = new CANNON.Body({mass:1, material:matDice, shape:new CANNON.Sphere(r)});
  body.linearDamping = 0.25;   // orbs roll forever otherwise
  body.angularDamping = 0.25;
  spawnCommon(mesh, body);
  dice.push({mesh, body, kind:"orb", sides:N, points:fib(N)});
}
function capMsg(){
  resultEl.innerHTML = "that's plenty of dice (max "+MAXD+")<div class='sub'>clear the table to start over</div>";
}

// ================= READING RESULTS =================
const UP = new THREE.Vector3(0,1,0);
function topValue(d){
  const q = new THREE.Quaternion(d.body.quaternion.x, d.body.quaternion.y, d.body.quaternion.z, d.body.quaternion.w);
  if(d.kind === "d6"){
    const axes = [
      [new THREE.Vector3(1,0,0), 3], [new THREE.Vector3(-1,0,0), 4],
      [new THREE.Vector3(0,1,0), 1], [new THREE.Vector3(0,-1,0), 6],
      [new THREE.Vector3(0,0,1), 2], [new THREE.Vector3(0,0,-1), 5],
    ];
    let best=null, bv=-2;
    for(const [v, val] of axes){
      const y = v.clone().applyQuaternion(q).y;
      if(y > bv){ bv = y; best = val; }
    }
    return best;
  }
  if(d.kind === "barrel"){
    // if it's standing on an end cap, that's a cocked die — nudge it
    const axisY = new THREE.Vector3(0,1,0).applyQuaternion(q).y;
    let best=null, bv=-2;
    for(let k=0;k<d.sides;k++){
      const th = (k+0.5) * Math.PI*2/d.sides;
      const n = new THREE.Vector3(Math.sin(th), 0, Math.cos(th)).applyQuaternion(q);
      if(n.y > bv){ bv = n.y; best = k+1; }
    }
    if(Math.abs(axisY) > bv){ return "cocked"; }
    return best;
  }
  // orb
  let best=null, bv=-2;
  for(let i=0;i<d.points.length;i++){
    const y = d.points[i].clone().applyQuaternion(q).y;
    if(y > bv){ bv = y; best = i+1; }
  }
  return best;
}

let settledShown = false;
function checkSettled(){
  if(!dice.length){ return; }
  const allSleeping = dice.every(d => d.body.sleepState === CANNON.Body.SLEEPING);
  if(!allSleeping){ settledShown = false; return; }
  if(settledShown) return;
  const vals = dice.map(topValue);
  if(vals.includes("cocked")){
    // a barrel is standing on its end — give it a bump
    dice.forEach(d=>{
      if(topValue(d)==="cocked"){
        d.body.wakeUp();
        d.body.applyImpulse(new CANNON.Vec3((Math.random()-0.5)*3, 3, (Math.random()-0.5)*3), d.body.position);
      }
    });
    return;
  }
  settledShown = true;
  const total = vals.reduce((a,b)=>a+b, 0);
  resultEl.innerHTML = "<span class='vals'>" + vals.join(" + ") + " =</span> <b>" + total + "</b>"
    + "<div class='sub'>" + dice.length + (dice.length===1?" die":" dice") + " on the table \u2014 tap one to kick it</div>";
}

// ================= INTERACTION =================
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
canvas.addEventListener("pointerdown", (e)=>{
  ptr.x = (e.clientX/innerWidth)*2 - 1;
  ptr.y = -(e.clientY/innerHeight)*2 + 1;
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(dice.map(d=>d.mesh));
  if(!hits.length) return;
  const mesh = hits[0].object;
  const d = dice.find(x=>x.mesh===mesh);
  const p = hits[0].point;
  d.body.wakeUp();
  const dir = new CANNON.Vec3(d.body.position.x - p.x, 0, d.body.position.z - p.z);
  const len = Math.max(0.001, Math.hypot(dir.x, dir.z));
  const kick = new CANNON.Vec3(dir.x/len*4, 7+Math.random()*3, dir.z/len*4);
  d.body.applyImpulse(kick, new CANNON.Vec3(p.x, p.y, p.z));
});

document.getElementById("addD6").onclick = addD6;
document.getElementById("addBarrel").onclick = ()=>addBarrel(Number(document.getElementById("sidesIn").value));
document.getElementById("addOrb").onclick = ()=>addOrb(Number(document.getElementById("sidesIn").value));
const sidesIn = document.getElementById("sidesIn");
function bumpSides(d){ const v = Math.max(3, Math.min(60, (Number(sidesIn.value)||10) + d)); sidesIn.value = v; }
document.getElementById("sidesDown").onclick = ()=>bumpSides(-1);
document.getElementById("sidesUp").onclick = ()=>bumpSides(1);
document.getElementById("rollAll").onclick = ()=>{
  dice.forEach(d=>{
    d.body.wakeUp();
    d.body.position.y = Math.max(d.body.position.y, 4+Math.random()*3);
    d.body.velocity.set((Math.random()-0.5)*8, 2, (Math.random()-0.5)*8);
    d.body.angularVelocity.set((Math.random()-0.5)*20, (Math.random()-0.5)*20, (Math.random()-0.5)*20);
  });
  resultEl.innerHTML = "rolling\u2026<div class='sub'>&nbsp;</div>";
};
document.getElementById("clearAll").onclick = ()=>{
  dice.forEach(d=>{ scene.remove(d.mesh); world.removeBody(d.body); });
  dice.length = 0;
  resultEl.innerHTML = "tap a die to kick it<div class='sub'>add dice from the rail below</div>";
};

// ================= LOOP =================
let last = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  world.step(1/60, dt, 4);
  for(const d of dice){
    d.mesh.position.copy(d.body.position);
    d.mesh.quaternion.copy(d.body.quaternion);
  }
  checkSettled();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// start with two classics on the table
addD6(); addD6();
})();
</script>
