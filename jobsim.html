<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>job simulator · Kai.fun</title>
<style>
  :root{
    --ink:#141414; --paper:#fff; --muted:#8a8a8a; --line:#e2e2e2;
    --coral:#ff6b5e; --sky:#4aa9d8; --moss:#6fb85c; --grape:#9b7fd4; --sun:#f5b829;
    --corp:#2456d8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Trebuchet MS",system-ui,sans-serif;
    min-height:100vh;padding:16px 12px 60px;
  }
  .wrap{max-width:1020px;margin:0 auto;}
  .back{text-decoration:none;color:var(--muted);font-size:14px;}
  .back:hover{color:var(--ink);}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 8px;}
  .wordmark{
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
    font-weight:900;font-size:38px;transform:rotate(-1.5deg);
  }
  .wordmark .j{color:var(--corp);} .wordmark .s{color:var(--coral);}
  .tag{color:var(--muted);font-size:13px;}
  #jobBanner{
    border:2px solid var(--ink);border-radius:12px;background:#eef3ff;
    box-shadow:3px 3px 0 var(--ink);padding:10px 16px;margin-bottom:12px;
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;font-weight:700;
  }
  #earn{color:var(--moss);}
  #stats{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700;}
  .cols{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  #left{flex:0 1 380px;min-width:300px;}
  #right{flex:1 1 420px;min-width:300px;}
  .card{
    border:2px solid var(--ink);border-radius:14px;background:#fff;
    box-shadow:4px 4px 0 var(--ink);padding:14px;margin-bottom:14px;
  }
  .card h2{font-size:16px;margin-bottom:10px;}
  label{font-size:12.5px;font-weight:700;color:#555;display:block;margin:10px 0 4px;}
  input[type=text],select,textarea{
    width:100%;border:2px solid var(--ink);border-radius:8px;padding:8px 10px;
    font-family:inherit;font-size:13.5px;background:#fff;
  }
  textarea{resize:vertical;min-height:56px;}
  .skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .skill{
    border:2px solid var(--ink);border-radius:999px;padding:5px 11px;font-size:12px;
    cursor:pointer;user-select:none;font-weight:700;background:#fff;
  }
  .skill.on{background:var(--sun);box-shadow:1px 1px 0 var(--ink);}
  .btn{
    border:2px solid var(--ink);border-radius:10px;background:var(--sun);
    font-family:inherit;font-weight:900;font-size:13.5px;padding:9px 14px;
    cursor:pointer;box-shadow:2px 2px 0 var(--ink);
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
  .btn.blue{background:#dbe7ff;}
  .btn.small{font-size:12px;padding:6px 10px;}
  .job{
    border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    background:#fff;
  }
  .job .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .job .role{font-weight:900;font-size:15.5px;}
  .job .co{color:var(--corp);font-weight:700;font-size:13px;}
  .job .sal{font-weight:900;color:var(--moss);font-size:13.5px;white-space:nowrap;}
  .job .req{font-size:12px;color:#555;margin:6px 0 2px;line-height:1.55;}
  .job .flags{font-size:11.5px;color:#a06;line-height:1.5;}
  .job .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;}
  .match{font-size:12px;color:var(--muted);font-weight:700;}
  #pending .p{
    display:flex;justify-content:space-between;gap:8px;font-size:12.5px;
    padding:7px 4px;border-bottom:1px dashed var(--line);align-items:center;
  }
  #pending .st{font-weight:900;}
  .spin{display:inline-block;animation:sp 1.2s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  /* modal */
  #modal{
    position:fixed;inset:0;background:#0008;z-index:30;display:none;
    align-items:center;justify-content:center;padding:16px;
  }
  #modal .box{
    width:min(520px,94vw);background:#fff;border:2px solid var(--ink);
    border-radius:14px;box-shadow:6px 6px 0 var(--ink);padding:20px 22px;
    max-height:88vh;overflow-y:auto;
  }
  #modal .box h2{font-size:20px;margin-bottom:10px;}
  #modal .letter{
    font-family:Georgia,serif;font-size:14px;line-height:1.7;color:#333;
    background:#fafaf6;border:1px solid #ddd;padding:14px 16px;border-radius:6px;
  }
  #modal .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .ansBtn{
    display:block;width:100%;text-align:left;border:2px solid var(--ink);border-radius:10px;
    background:#fff;font-family:inherit;font-size:13.5px;padding:10px 12px;cursor:pointer;
    margin-top:8px;font-weight:700;
  }
  .ansBtn:hover{background:#f2f6ff;}
  .offerBig{font-size:26px;font-weight:900;color:var(--moss);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Kai.fun</a>
  <header>
    <div class="wordmark"><span class="j">job</span> <span class="s">simulator</span> 💼</div>
    <div class="tag">apply. get rejected. apply again. somebody has to get hired.</div>
  </header>

  <div id="jobBanner">
    <span id="curJob">currently: unemployed</span>
    <span id="earn"></span>
    <div id="stats"></div>
  </div>

  <div class="cols">
    <div id="left">
      <div class="card">
        <h2>📄 your resume</h2>
        <label>name</label>
        <input type="text" id="rName" maxlength="24" placeholder="your name">
        <label>education</label>
        <select id="rEdu">
          <option value="0">school of life</option>
          <option value="1">high school diploma</option>
          <option value="2">some college (it was complicated)</option>
          <option value="3">bachelor's degree</option>
          <option value="4">master's degree in something</option>
        </select>
        <label>years of experience: <span id="rExpV">2</span></label>
        <input type="range" id="rExp" min="0" max="30" value="2" style="width:100%">
        <label>skills (pick up to 6)</label>
        <div class="skills" id="rSkills"></div>
        <label>personal statement</label>
        <textarea id="rStmt" maxlength="220" placeholder="i am passionate about…"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button class="btn small blue" id="genStmt">✍ generate statement</button>
        </div>
      </div>
      <div class="card">
        <h2>⏳ pending applications</h2>
        <div id="pending"><div style="color:var(--muted);font-size:12.5px;">nothing yet. the void awaits.</div></div>
      </div>
    </div>

    <div id="right">
      <div class="card">
        <h2 style="display:flex;justify-content:space-between;align-items:center;">
          🗂 job board <button class="btn small" id="refreshBtn">🔄 new listings</button>
        </h2>
        <div id="jobs"></div>
      </div>
    </div>
  </div>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
const $=id=>document.getElementById(id);
// ============ SAVE ============
const SAVE="jobsim_v1";
let S={stats:{sent:0,rejected:0,ghosted:0,interviews:0,offers:0},
  cur:null, earned:0, resume:{name:"",edu:2,exp:2,skills:[],stmt:""}};
try{ const d=JSON.parse(localStorage.getItem(SAVE)); if(d) S=Object.assign(S,d); }catch(e){}
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{
  try{ localStorage.setItem(SAVE,JSON.stringify(S)); }catch(e){} },400); }

// ============ RESUME ============
const SKILLS=["excel (advanced-ish)","email tone management","forklift certified","vibes",
  "leadership","followership","typing (fast)","typing (loud)","synergy","spreadsheet whispering",
  "can lift 50 lbs emotionally","lunch scheduling","phone voice","printer exorcism",
  "meeting survival","deadline negotiation"];
function renderSkills(){
  const box=$("rSkills"); box.innerHTML="";
  SKILLS.forEach(sk=>{
    const d=document.createElement("div");
    d.className="skill"+(S.resume.skills.includes(sk)?" on":"");
    d.textContent=sk;
    d.onclick=()=>{
      const i=S.resume.skills.indexOf(sk);
      if(i>=0) S.resume.skills.splice(i,1);
      else if(S.resume.skills.length<6) S.resume.skills.push(sk);
      renderSkills(); save(); renderJobs(false);
    };
    box.appendChild(d);
  });
}
$("rName").oninput=(e)=>{ S.resume.name=e.target.value; save(); };
$("rEdu").onchange=(e)=>{ S.resume.edu=+e.target.value; save(); renderJobs(false); };
$("rExp").oninput=(e)=>{ S.resume.exp=+e.target.value; $("rExpV").textContent=e.target.value; save(); renderJobs(false); };
$("rStmt").oninput=(e)=>{ S.resume.stmt=e.target.value; save(); };
$("genStmt").onclick=()=>{
  const a=["i am deeply passionate about","i live and breathe","i was practically raised by","my heart beats in the rhythm of"];
  const b=["deliverables","synergy","the grind","cross-functional lunches","quarterly outcomes","stakeholder energy"];
  const c=["i work hard and nap harder.","references available upon interrogation.","i once fixed a printer with my mind.","i will bring my own stapler.","failure is just success wearing a disguise."];
  const r=()=>Math.random();
  S.resume.stmt=a[Math.floor(r()*a.length)]+" "+b[Math.floor(r()*b.length)]+". "+c[Math.floor(r()*c.length)];
  $("rStmt").value=S.resume.stmt; save();
};

// ============ JOB GENERATOR ============
const CO_A=["Syner","Grind","Hyper","Blue","Iron","Cloud","Snap","Quant","Vibe","Milk","Turbo","Sprocket","Beige","Yeet","Optima","Corp"];
const CO_B=["lytics","Corp","Hub","Works","ify","Systems","& Sons","Global","Labs","Dynamics","Solutions LLC","Industries","Verse","Logistics"];
const ROLES=[
  ["Assistant to the Regional Assistant",26,38],
  ["Junior Spreadsheet Custodian",30,44],
  ["Email Forwarding Specialist",32,46],
  ["Senior Vibe Coordinator",48,70],
  ["Meeting Attender II",38,52],
  ["Professional Lunch Scheduler",34,48],
  ["Printer Relations Manager",42,60],
  ["Chief Synergy Apprentice",36,55],
  ["Data Whisperer",55,85],
  ["Director of Miscellaneous",70,110],
  ["Head of Deliverables",80,130],
  ["VP of Circling Back",95,160],
];
const FLAGS=["🚩 \\u201cwe're a family here\\u201d","🚩 salary: competitive (won't say)","🚩 \\u201cfast-paced environment\\u201d",
  "🚩 wants 5 yrs experience, calls it entry level","🚩 \\u201cwear many hats\\u201d","🚩 unlimited PTO (nobody takes it)",
  "🚩 ping pong table mentioned twice","🚩 \\u201crockstar wanted\\u201d","✅ free coffee (real)","✅ dog fridays",
  "✅ leaves at 5 actually","🚩 reply-all culture"];
let jobs=[];
function makeJob(){
  const r=()=>Math.random();
  const role=ROLES[Math.floor(r()*ROLES.length)];
  const salLo=role[1], salHi=role[2];
  const sal=Math.round((salLo+r()*(salHi-salLo)))*1000;
  const hideSal=r()<0.3;
  const needExp=Math.max(0,Math.round((sal/1000-25)/8)+Math.floor(r()*4)-1);
  const needEdu=Math.min(4,Math.max(0,Math.floor((sal/1000-20)/30)+ (r()<0.4?1:0)));
  const needSkills=[];
  while(needSkills.length<2){
    const sk=SKILLS[Math.floor(r()*SKILLS.length)];
    if(!needSkills.includes(sk)) needSkills.push(sk);
  }
  const fl=[];
  while(fl.length<2+Math.floor(r()*2)){
    const f=FLAGS[Math.floor(r()*FLAGS.length)];
    if(!fl.includes(f)) fl.push(f);
  }
  const redCount=fl.filter(x=>x.startsWith("🚩")).length;
  return {co:CO_A[Math.floor(r()*CO_A.length)]+CO_B[Math.floor(r()*CO_B.length)],
    role:role[0], sal, hideSal, needExp, needEdu, needSkills, fl, redCount, id:Math.random()};
}
function chanceFor(j){
  const R=S.resume;
  let ch=0.16;
  const skillHit=j.needSkills.filter(sk=>R.skills.includes(sk)).length;
  ch+=skillHit*0.13;
  if(R.exp>=j.needExp) ch+=0.15;
  else ch-=(j.needExp-R.exp)*0.03;
  if(R.exp>j.needExp+12) ch-=0.12;            // "overqualified"
  if(R.edu>=j.needEdu) ch+=0.10; else ch-=0.10;
  ch+=j.redCount*0.05;                         // desperate places hire faster
  ch-=Math.max(0,(j.sal-45000))/1000*0.004;    // money is guarded by dragons
  if((R.stmt||"").length>30) ch+=0.03;
  if(!R.name) ch-=0.05;                        // resumes need names. who knew.
  return Math.max(0.02, Math.min(0.85, ch));
}
function stars(ch){
  const n=Math.round(ch*5/0.85);
  return "match "+"★".repeat(Math.max(1,n))+"☆".repeat(5-Math.max(1,n));
}
function renderJobs(fresh){
  if(fresh || jobs.length===0){ jobs=[]; for(let i=0;i<5;i++) jobs.push(makeJob()); }
  const box=$("jobs"); box.innerHTML="";
  jobs.forEach(j=>{
    const d=document.createElement("div");
    d.className="job";
    const ch=chanceFor(j);
    d.innerHTML=
      '<div class="top"><div><div class="role"></div><div class="co"></div></div>'+
      '<div class="sal">'+(j.hideSal? "$ competitive ✨" : "$"+j.sal.toLocaleString()+"/yr")+'</div></div>'+
      '<div class="req">wants: '+j.needExp+'+ yrs · '+$("rEdu").options[j.needEdu].text+
      ' · skills: '+j.needSkills.join(", ")+'</div>'+
      '<div class="flags">'+j.fl.join(" · ")+'</div>'+
      '<div class="bottom"><span class="match">'+stars(ch)+'</span>'+
      '<button class="btn small">📨 APPLY</button></div>';
    d.querySelector(".role").textContent=j.role;
    d.querySelector(".co").textContent=j.co;
    d.querySelector("button").onclick=()=>apply(j);
    box.appendChild(d);
  });
}
$("refreshBtn").onclick=()=>renderJobs(true);

// ============ APPLYING ============
let pending=[];
function renderPending(){
  const box=$("pending");
  if(!pending.length){ box.innerHTML='<div style="color:var(--muted);font-size:12.5px;">nothing yet. the void awaits.</div>'; return; }
  box.innerHTML="";
  pending.slice(-8).reverse().forEach(p=>{
    const d=document.createElement("div");
    d.className="p";
    d.innerHTML="<span></span><span class='st'></span>";
    d.children[0].textContent=p.j.role+" @ "+p.j.co;
    d.children[1].innerHTML=p.state==="wait"? '<span class="spin">⏳</span>' :
      p.state==="ghost"? '👻 ghosted' : p.state;
    box.appendChild(d);
  });
}
function apply(j){
  S.stats.sent++;
  const p={j, state:"wait"};
  pending.push(p);
  renderPending(); statsBar(); save();
  const ch=chanceFor(j);
  const roll=Math.random();
  setTimeout(()=>{
    if(roll<ch*0.55){ startInterview(p,j,ch); }
    else if(roll<ch){ resolve(p,"✅ OFFER"); showOffer(j); }
    else if(Math.random()<0.45){
      // ghosting: it just… never resolves (well. eventually it does.)
      setTimeout(()=>{ p.state="ghost"; S.stats.ghosted++; renderPending(); statsBar(); save(); },
        8000+Math.random()*25000);
    }
    else if(Math.random()<0.25){
      resolve(p,"❌ rejected (2 min)"); rejectLetter(j,true);
    }
    else{ resolve(p,"❌ rejected"); rejectLetter(j,false); }
  }, 900+Math.random()*1600);
}
function resolve(p,st){ p.state=st; renderPending(); statsBar(); save(); }

// ============ REJECTION LETTERS ============
function rejectLetter(j,fast){
  S.stats.rejected++;
  const n=(S.resume.name||"applicant");
  const cand=(1000+Math.floor(Math.random()*9000)).toLocaleString();
  const lines=[
    "Dear "+n+",<br><br>Thank you for your interest in the "+j.role+" position at "+j.co+
    ". After careful consideration of your application among "+cand+" highly qualified candidates, we have decided to move forward with someone who is, and we say this with love, not you.",
    "Dear "+n+",<br><br>We were impressed by your application to "+j.co+". Unfortunately, we were more impressed by a different application.",
    "Dear "+n+",<br><br>Your resume for "+j.role+" was reviewed by our system in 0.4 seconds. The system has feelings, and they were mixed.",
    "Dear "+n+",<br><br>While your skills are remarkable, the position of "+j.role+" has been filled internally by the CEO's nephew, Braden.",
  ];
  const body=lines[Math.floor(Math.random()*lines.length)]+
    "<br><br>We will keep your resume on file, in the sense that files can be deleted."+
    "<br><br>Warmly,<br>The "+j.co+" Talent Acquisition Bot";
  openModal("<h2>"+(fast?"⚡ that was fast.":"📧 you got mail")+"</h2>"+
    '<div class="letter">'+body+'</div>'+
    '<div class="btns"><button class="btn" onclick="closeModal()">character building</button></div>');
  statsBar(); save();
}

// ============ INTERVIEW ============
const QUESTIONS=[
  {q:"Where do you see yourself in 5 years?",
   a:[["Growing with this company, ideally upward.",1],["In your chair.",-1],["Physically? Hard to say.",0]]},
  {q:"What is your greatest weakness?",
   a:[["I care too much about deliverables.",1],["Load-bearing walls.",0],["I will not elaborate.",-1]]},
  {q:"Why do you want to work here?",
   a:[["Your mission genuinely aligns with my skills.",1],["Money. Next question.",0],["The building looked warm.",-1]]},
  {q:"Describe a time you handled conflict.",
   a:[["I listened, found common ground, moved forward.",1],["I won.",0],["The less said, the better.",-1]]},
  {q:"Do you have any questions for us?",
   a:[["Yes — what does success look like in 90 days?",1],["Is the ping pong table load-bearing?",0],["Are you happy? Like, really?",-1]]},
];
function startInterview(p,j,ch){
  S.stats.interviews++;
  resolve(p,"🎙 interview!");
  const Q=QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];
  let html="<h2>🎙 interview — "+j.co+"</h2><p style='font-size:14px;margin-bottom:4px;'>"+
    "the hiring manager leans in:</p><p style='font-weight:900;font-size:16px;'>\\u201c"+Q.q+"\\u201d</p>";
  openModal(html+"<div id='ansBox'></div>");
  const box=document.getElementById("ansBox");
  Q.a.forEach(([txt,val])=>{
    const b=document.createElement("button");
    b.className="ansBtn"; b.textContent=txt;
    b.onclick=()=>{
      closeModal();
      setTimeout(()=>{
        const fin=Math.random()<(ch+val*0.25+0.25);
        if(val<0 && Math.random()<0.6){ resolve(p,"❌ escorted out"); securityLetter(j); }
        else if(fin){ resolve(p,"✅ OFFER"); showOffer(j); }
        else{ resolve(p,"❌ post-interview no"); internalLetter(j); }
      },700);
    };
    box.appendChild(b);
  });
}
function securityLetter(j){
  S.stats.rejected++;
  openModal("<h2>🚨 hm.</h2><div class='letter'>Security has been notified. Not because you did anything illegal — they just wanted to meet the person who said that.<br><br>— "+j.co+"</div>"+
    '<div class="btns"><button class="btn" onclick="closeModal()">worth it</button></div>');
  statsBar(); save();
}
function internalLetter(j){
  S.stats.rejected++;
  openModal("<h2>📧 so close</h2><div class='letter'>Dear "+(S.resume.name||"applicant")+
    ",<br><br>You interviewed wonderfully. Truly. Unfortunately we have decided to go with an internal candidate we had already chosen before your interview began.<br><br>This was a formality. You were the formality.<br><br>— "+j.co+"</div>"+
    '<div class="btns"><button class="btn" onclick="closeModal()">of course</button></div>');
  statsBar(); save();
}

// ============ OFFER ============
function showOffer(j){
  S.stats.offers++;
  const sal=j.sal;
  openModal("<h2>🎉 OFFER!</h2>"+
    "<div class='offerBig'>$"+sal.toLocaleString()+"/yr</div>"+
    "<p style='font-size:14.5px;margin:8px 0;'>"+j.co+" wants YOU as their new <b>"+j.role+"</b>."+
    (S.cur? " (you'd be leaving your job as "+S.cur.role+")" : "")+"</p>"+
    '<div class="btns"><button class="btn" id="acceptBtn">✍ ACCEPT</button>'+
    '<button class="btn blue" id="declineBtn">decline (power move)</button></div>');
  document.getElementById("acceptBtn").onclick=()=>{
    S.cur={role:j.role, co:j.co, sal};
    closeModal(); banner(); statsBar(); save();
  };
  document.getElementById("declineBtn").onclick=()=>{ closeModal(); statsBar(); save(); };
}

// ============ HUD ============
function banner(){
  $("curJob").textContent=S.cur?
    "currently: "+S.cur.role+" @ "+S.cur.co+" ($"+S.cur.sal.toLocaleString()+"/yr)" :
    "currently: unemployed";
}
function statsBar(){
  const st=S.stats;
  $("stats").innerHTML=["📨 "+st.sent+" sent","❌ "+st.rejected+" rejected","👻 "+st.ghosted+" ghosted",
    "🎙 "+st.interviews+" interviews","🎉 "+st.offers+" offers"].map(x=>"<span>"+x+"</span>").join("");
}
setInterval(()=>{
  if(S.cur){ S.earned+=S.cur.sal/31536000; $("earn").textContent="career earnings: $"+Math.floor(S.earned).toLocaleString(); save(); }
},1000);

// ============ MODAL ============
function openModal(html){ $("modalBox").innerHTML=html; $("modal").style.display="flex"; }
function closeModal(){ $("modal").style.display="none"; }
$("modal").onclick=(e)=>{ if(e.target.id==="modal") closeModal(); };

// ============ BOOT ============
$("rName").value=S.resume.name||"";
$("rEdu").value=S.resume.edu;
$("rExp").value=S.resume.exp; $("rExpV").textContent=S.resume.exp;
$("rStmt").value=S.resume.stmt||"";
renderSkills();
renderJobs(true);
renderPending();
banner(); statsBar();
if(S.earned) $("earn").textContent="career earnings: $"+Math.floor(S.earned).toLocaleString();
</script>
</body>
</html>
