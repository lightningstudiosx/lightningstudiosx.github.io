<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FOLDWAY · Kai.fun</title>
<meta name="description" content="FOLDWAY - fold a paper map so faraway places touch. Tuck, crease, tape, tear and ink your way across 46 hand-made maps in eight atlases, plus a daily fold, an endless map press and a map editor.">
<meta name="theme-color" content="#3a2616">
<script src="bdp.js" defer></script>
<style>
/* style_base.css - FOLDWAY "Cartographer's Desk": walnut desk, cream paper, sepia ink, red pencil */
:root {
--desk: #3a2616; --desk2: #24170d; --paper: #f2e7c9; --paper2: #e6d6ad; --ink: #3b2a1c; --ink2: #6b5238;
--red: #b4402c; --blue: #4d7a90; --green: #6f8a4a; --gold: #c99a3c; --shadow: rgba(20, 10, 2, .45);
--serif: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
--hand: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--desk2); color: var(--paper); font-family: var(--serif); overflow: hidden; overscroll-behavior: none; }
body { -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; cursor: pointer; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 100vw; overflow: hidden;
background: radial-gradient(ellipse at 50% 40%, #5a3b22 0%, #3a2616 55%, #1e130a 100%); }
#app::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .35;
background: repeating-linear-gradient(92deg, rgba(0,0,0,.0) 0 7px, rgba(0,0,0,.18) 7px 9px, rgba(255,220,170,.04) 9px 15px),
repeating-linear-gradient(88deg, rgba(0,0,0,0) 0 31px, rgba(0,0,0,.12) 31px 34px); }
#top { position: relative; z-index: 5; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px;
background: linear-gradient(#2b1b0e, #20140a); border-bottom: 1px solid #5c3f24; box-shadow: 0 2px 8px rgba(0,0,0,.4); flex: none; }
#kai { color: #f0d9a8; text-decoration: none; font-size: 14px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; }
#kai:hover { background: rgba(255,255,255,.08); }
#topT { font-weight: bold; letter-spacing: .18em; color: #f3e2b8; font-size: 15px; white-space: nowrap; }
#topMid { flex: 1; min-width: 0; text-align: center; font-size: 13px; color: #d9c393; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-style: italic; }
.tb { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #5c3f24; background: #3a2616; color: #f0d9a8; font-size: 16px; flex: none; padding: 0; }
.tb:hover { background: #4a3220; }
.tb.off { opacity: .45; text-decoration: line-through; }
#stage { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.hide { display: none !important; }
.pb { position: relative; border: 0; border-radius: 4px; padding: 10px 14px; color: var(--ink); text-align: center;
background: linear-gradient(170deg, #f7edd2, #e7d4a6); box-shadow: 0 3px 0 #b89a62, 0 6px 14px rgba(0,0,0,.45);
font-size: 15px; transition: transform .12s, box-shadow .12s; }
.pb::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: linear-gradient(transparent, rgba(110,80,40,.25), transparent); }
.pb:hover { transform: translateY(-2px) rotate(-.4deg); box-shadow: 0 5px 0 #b89a62, 0 10px 18px rgba(0,0,0,.5); }
.pb:active { transform: translateY(2px); box-shadow: 0 1px 0 #b89a62, 0 3px 8px rgba(0,0,0,.4); }
.pb b { display: block; font-size: 1.05em; }
.pb small { display: block; font-size: .72em; color: var(--ink2); font-style: italic; margin-top: 2px; }
.pb.big { font-size: 19px; padding: 14px 22px; }
.pb.sm { padding: 6px 12px; font-size: 14px; }
.pb.red { background: linear-gradient(170deg, #d35a42, #a83824); color: #fff3e0; box-shadow: 0 3px 0 #6e2416, 0 6px 14px rgba(0,0,0,.45); }
.pb.red small { color: #ffd9c4; }
.pb[disabled] { opacity: .45; pointer-events: none; }
#toasts { position: fixed; left: 50%; top: 54px; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.toast { background: var(--paper); color: var(--ink); padding: 8px 14px; border-radius: 3px; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.5);
opacity: 0; transform: translateY(-8px) rotate(-.6deg); transition: .3s; text-align: center; border-left: 4px solid var(--red); }
.toast.in { opacity: 1; transform: none; }
#modal { position: fixed; inset: 0; z-index: 40; background: rgba(15, 8, 2, .62); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modalBox { position: relative; width: min(440px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; color: var(--ink); padding: 22px 20px 18px;
background: linear-gradient(175deg, #f6ecd1, #e9d8ae); border-radius: 3px; box-shadow: 0 18px 50px rgba(0,0,0,.6); transform: rotate(-.5deg); }
#modalBox h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: .04em; }
#modalBox p { margin: 8px 0; line-height: 1.45; font-size: 15px; }
#modalBox .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
#modalBox label { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 15px; }
#modalBox input[type=range] { flex: 1; accent-color: var(--red); }
#modalBox input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--red); }
#modalBox textarea, #modalBox input[type=text] { width: 100%; font-family: monospace; font-size: 12px; padding: 6px; border: 1px solid #b89a62; background: #fffaf0; color: var(--ink); }
@media (max-width: 520px) { #topT { display: none; } #kai { font-size: 13px; padding: 6px 4px; } .tb { width: 32px; } }
/* style_play.css - the folding table: hud, board, tools, win card */
#hud { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 2px; min-height: 40px; }
#hName { font-size: 17px; color: #f4e3b9; text-shadow: 0 1px 2px #000; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#hName small { display: block; font-size: 11px; color: #cdb07a; font-style: italic; letter-spacing: .05em; }
#hStat { display: flex; gap: 6px; flex: none; align-items: center; }
.chip { background: rgba(242,231,201,.92); color: var(--ink); border-radius: 3px; padding: 3px 8px; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,.35); white-space: nowrap; }
.chip b { color: var(--red); }
.chip.warn { background: #f3c9a8; }
#boardWrap { position: relative; flex: 1; min-height: 0; touch-action: none; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#board.drag { cursor: grabbing; }
#tip { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); max-width: min(94%, 560px); text-align: center; cursor: pointer;
background: rgba(242,231,201,.94); color: var(--ink); padding: 7px 14px; border-radius: 3px; font-size: 14px; line-height: 1.35; box-shadow: 0 4px 12px rgba(0,0,0,.4);
transition: opacity .4s; font-family: var(--hand); }
#tip:empty { display: none; }
#note { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); pointer-events: none; background: #fbe3c8; color: #7a2412; font-size: 14px;
padding: 5px 12px; border-radius: 3px; box-shadow: 0 3px 10px rgba(0,0,0,.4); opacity: 0; transition: opacity .25s; white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
#note.in { opacity: 1; }
#tools { flex: none; display: flex; justify-content: center; gap: 6px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); flex-wrap: nowrap; }
.tl { flex: 0 1 64px; min-width: 0; height: 52px; border: 0; border-radius: 4px; color: var(--ink); padding: 2px 0;
background: linear-gradient(170deg, #f7edd2, #e2cd9b); box-shadow: 0 3px 0 #a88a52, 0 5px 10px rgba(0,0,0,.4); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tl i { font-style: normal; font-size: 20px; line-height: 1; }
.tl span { font-size: 11px; margin-top: 3px; letter-spacing: .02em; }
.tl:active { transform: translateY(2px); box-shadow: 0 1px 0 #a88a52; }
.tl[disabled] { opacity: .4; pointer-events: none; }
.tl.on { background: linear-gradient(170deg, #d9654c, #a83824); color: #fff0dc; box-shadow: 0 3px 0 #6e2416, 0 5px 10px rgba(0,0,0,.4); }
.tl.glow { animation: glow 1.2s infinite; }
@keyframes glow { 50% { box-shadow: 0 3px 0 #a88a52, 0 0 0 4px rgba(255, 210, 120, .7); } }
.stamps { display: flex; justify-content: center; gap: 14px; margin: 10px 0 4px; }
.stamp { width: 64px; height: 64px; border-radius: 50%; border: 3px double rgba(160, 40, 25, .25); color: rgba(160,40,25,.25); display: flex; align-items: center; justify-content: center;
font-size: 11px; font-weight: bold; letter-spacing: .06em; transform: rotate(-12deg) scale(.6); opacity: .0; transition: .35s cubic-bezier(.3,1.6,.5,1); text-align: center; line-height: 1.05; }
.stamp.got { border-color: #a8301d; color: #a8301d; background: radial-gradient(rgba(180,50,30,.08), transparent 70%); }
.stamp.in { transform: rotate(-12deg) scale(1); opacity: 1; }
.stamp.no { opacity: .55; transform: rotate(-8deg) scale(1); }
.wl { font-size: 14px; color: var(--ink2); text-align: center; }
.kbd { font-family: monospace; background: #fff6e2; border: 1px solid #c5a86f; border-radius: 3px; padding: 0 4px; font-size: 12px; }
@media (max-width: 420px) { .tl { height: 48px; } .tl i { font-size: 18px; } .tl span { font-size: 10px; } #tools { gap: 4px; padding-left: 4px; padding-right: 4px; } #hName { font-size: 15px; } .chip { font-size: 12px; padding: 3px 6px; } }
/* style_screens.css - the desk home screen, atlas pages and the drafting table (editor) */
#homeCv { position: absolute; inset: 0; width: 100%; height: 100%; }
#homeUi { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 16px 16px; pointer-events: none; }
#homeSpace { flex: 1; }
#homeBtns { display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: auto; width: 100%; max-width: 560px; }
#homeBtns .row { display: flex; gap: 10px; width: 100%; justify-content: center; }
#homeBtns .row .pb { flex: 1 1 0; min-width: 0; padding: 9px 6px; font-size: 14px; }
#homeFoot { margin-top: 12px; font-size: 13px; color: #e9d3a3; font-style: italic; text-align: center; text-shadow: 0 1px 3px #000; }
#atHead { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px; }
#atTitle { text-align: center; color: #f4e3b9; text-shadow: 0 1px 3px #000; min-width: 0; flex: 1; max-width: 520px; }
#atTitle b { display: block; font-size: 21px; letter-spacing: .06em; }
#atTitle small { display: block; font-size: 12px; color: #d4b985; font-style: italic; }
#atWrap { position: relative; flex: 1; min-height: 0; }
#atCv { position: absolute; inset: 0; width: 100%; height: 100%; }
#atPins { position: absolute; inset: 0; }
.city { position: absolute; transform: translate(-50%, -50%); border: 0; background: none; padding: 0; width: 64px; height: 64px; color: var(--ink); }
.city .dot { position: absolute; left: 50%; top: 22px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #f8eed5; border: 3px solid var(--ink);
box-shadow: 0 2px 4px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; transition: transform .15s; }
.city:hover .dot { transform: scale(1.18); }
.city.done .dot { background: #f0c7a6; border-color: #9a2e1c; color: #9a2e1c; }
.city.lock .dot { background: #cdbb93; border-color: #8f7a55; color: #8f7a55; }
.city.next .dot { animation: pulse 1.3s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(180, 64, 44, .35); } }
.city .nm { position: absolute; left: 50%; top: 47px; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-style: italic; background: rgba(242,231,201,.86); padding: 0 4px; border-radius: 2px; }
.city .st { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); font-size: 12px; color: #a8301d; letter-spacing: -1px; white-space: nowrap; }
#atFoot { flex: none; display: flex; justify-content: center; gap: 8px; padding: 6px 8px 12px; flex-wrap: wrap; color: #e9d3a3; font-size: 13px; align-items: center; }
#edBar { flex: none; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px; }
#edBar .pb { padding: 6px 10px; font-size: 13px; }
#edWrap { position: relative; flex: 1; min-height: 0; touch-action: none; }
#edCv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#edPal { flex: none; display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding: 6px 6px calc(10px + env(safe-area-inset-bottom)); }
.pal { min-width: 40px; height: 40px; border: 0; border-radius: 4px; background: linear-gradient(170deg, #f7edd2, #e2cd9b); color: var(--ink); font-size: 12px; padding: 0 6px;
box-shadow: 0 2px 0 #a88a52; display: flex; align-items: center; justify-content: center; gap: 3px; }
.pal.on { background: linear-gradient(170deg, #d9654c, #a83824); color: #fff0dc; box-shadow: 0 2px 0 #6e2416; }
.pal canvas { width: 22px; height: 22px; }
@media (max-width: 420px) { .pal { min-width: 36px; height: 36px; font-size: 11px; } #homeBtns .row .pb { font-size: 13px; } #homeBtns .row .pb small { font-size: 10px; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <a id="kai" href="index.html">← Kai.fun</a>
    <button class="tb" id="bHome" title="Back to the desk" aria-label="Home">⌂</button>
    <span id="topT">FOLDWAY</span>
    <span id="topMid"></span>
    <button class="tb" id="bMus" title="Music on / off" aria-label="Music">♪</button>
    <button class="tb" id="bSnd" title="Sound on / off" aria-label="Sound">🔊</button>
    <button class="tb" id="bSet" title="Settings" aria-label="Settings">⚙</button>
  </header>
  <main id="stage">
    <section id="home" class="screen">
      <canvas id="homeCv" aria-label="FOLDWAY - a folded map on a cartographer's desk"></canvas>
      <div id="homeUi">
        <div id="homeSpace"></div>
        <div id="homeBtns">
          <button class="pb big" id="hPlay"><b>Unfold the map</b><small id="hSub">begin the campaign</small></button>
          <div class="row">
            <button class="pb" id="hDaily"><b>Daily Fold</b><small id="hDailySub">today's map</small></button>
            <button class="pb" id="hEndless"><b>Map Press</b><small id="hEndSub">endless maps</small></button>
            <button class="pb" id="hEdit"><b>Drafting Table</b><small>make + share</small></button>
          </div>
        </div>
        <div id="homeFoot">Fold the paper. Make faraway places touch. Get the post through.</div>
      </div>
    </section>
    <section id="atlas" class="screen hide">
      <div id="atHead"><button class="pb sm" id="atPrev" aria-label="Previous atlas">◀</button><div id="atTitle"></div><button class="pb sm" id="atNext" aria-label="Next atlas">▶</button></div>
      <div id="atWrap"><canvas id="atCv" aria-label="Atlas page"></canvas><div id="atPins"></div></div>
      <div id="atFoot"></div>
    </section>
    <section id="play" class="screen hide">
      <div id="hud"><div id="hName"></div><div id="hStat"></div></div>
      <div id="boardWrap"><canvas id="board" aria-label="The folding map. Drag across a grid line to fold."></canvas><div id="tip"></div><div id="note"></div></div>
      <div id="tools">
        <button class="tl" id="tUndo" title="Undo (Z)"><i>↶</i><span>Undo</span></button>
        <button class="tl" id="tRedo" title="Redo (Y)"><i>↷</i><span>Redo</span></button>
        <button class="tl" id="tUnf" title="Unfold the last fold, keeping creases and ink (U)"><i>⤢</i><span>Unfold</span></button>
        <button class="tl" id="tMode" title="Fold over the top or tuck under (T)"><i>⤴</i><span>Over</span></button>
        <button class="tl" id="tTear" title="Tear along a crease (X)"><i>✂</i><span>Tear</span></button>
        <button class="tl" id="tHint" title="Ghost the next fold (H)"><i>✎</i><span>Hint</span></button>
        <button class="tl" id="tReset" title="Unfold everything and start over (R)"><i>⟲</i><span>Reset</span></button>
      </div>
    </section>
    <section id="editor" class="screen hide">
      <div id="edBar"></div>
      <div id="edWrap"><canvas id="edCv" aria-label="Map editor"></canvas></div>
      <div id="edPal"></div>
    </section>
  </main>
  <div id="modal" class="hide"><div id="modalBox"></div></div>
  <div id="toasts"></div>
</div>
<script>
"use strict";
// ===== util.js =====
const FW = window.FW = {};
FW.$ = id => document.getElementById(id);
FW.qs = (sel, root) => (root || document).querySelector(sel);
FW.qsa = (sel, root) => Array.from((root || document).querySelectorAll(sel));
FW.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
FW.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
FW.lerp = (a, b, t) => a + (b - a) * t;
FW.now = () => performance.now() / 1000;
FW.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
FW.ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
FW.easeOut = t => 1 - Math.pow(1 - t, 3);
FW.rng = seed => {
let a = seed >>> 0;
const f = () => {
a = (a + 0x6D2B79F5) >>> 0; let t = a;
t = Math.imul(t ^ (t >>> 15), t | 1);
t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
f.int = n => Math.floor(f() * n);
f.pick = arr => arr[Math.floor(f() * arr.length)];
f.range = (lo, hi) => lo + f() * (hi - lo);
f.chance = p => f() < p;
f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
return f;
};
FW.hash = str => {
let h = 2166136261 >>> 0;
for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
return h >>> 0;
};
FW.store = {
get(k, def) { try { const v = localStorage.getItem('foldway_' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
set(k, v) { try { localStorage.setItem('foldway_' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
del(k) { try { localStorage.removeItem('foldway_' + k); } catch (e) { /* storage unavailable */ } }
};
FW.bus = {
h: {},
on(n, f) { (this.h[n] = this.h[n] || []).push(f); },
emit(n, a) { (this.h[n] || []).forEach(f => { try { f(a); } catch (e) { console.error(e); } }); }
};
FW.toast = (msg, ms) => {
const box = FW.$('toasts'); if (!box) return;
const t = FW.el('div', 'toast', msg); box.appendChild(t);
requestAnimationFrame(() => t.classList.add('in'));
setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 400); }, ms || 2200);
};
FW.today = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
// ===== terrain.js =====
FW.N = 1; FW.E = 2; FW.S = 4; FW.W = 8;
FW.OPP = [0, 4, 8, 0, 1, 0, 0, 0, 2];
FW.DX = [0, 0, 1, 0, 0, 0, 0, 0, -1];
FW.DY = [0, -1, 0, 0, 1, 0, 0, 0, 0];
FW.DIRS = [1, 2, 4, 8];
FW.DNAME = { 1: 'north', 2: 'east', 4: 'south', 8: 'west' };
FW.ROAD = { ' ': 0, '─': 10, '│': 5, '┌': 6, '┐': 12, '└': 3, '┘': 9, '├': 7, '┤': 13, '┬': 14, '┴': 11, '┼': 15, '╴': 8, '╶': 2, '╵': 1, '╷': 4 };
FW.ROADCH = []; for (const k in FW.ROAD) FW.ROADCH[FW.ROAD[k]] = k;
FW.SIGN = { '>': 2, '<': 8, '^': 1, 'v': 4 };
FW.xf = (m, sx, sy) => {
if (sx < 0) m = (m & 5) | ((m & 2) << 2) | ((m & 8) >> 2);
if (sy < 0) m = (m & 10) | ((m & 1) << 2) | ((m & 4) >> 2);
return m;
};
FW.TERR = { '.': 'grass', 'f': 'forest', 'm': 'mountain', 'h': 'hills', '~': 'water', 's': 'sea', 'd': 'sand', 'v': 'village', 'p': 'field', 'w': 'marsh' };
FW.WHO = ['post', 'red', 'fogg', 'gull', 'doro', 'pass'];
FW.parse = o => {

FW.Atlas = { a: 0 };
FW.Atlas.pos = (n, i, a, tall) => {
const t = n > 1 ? i / (n - 1) : 0.5;
return tall ? { x: 0.5 + 0.28 * Math.sin(i * 1.75 + a), y: 0.1 + 0.8 * t } : { x: 0.1 + 0.8 * t, y: 0.5 + 0.27 * Math.sin(i * 1.8 + a) };
};
FW.Atlas.open = a => {
FW.UI.close(); FW.UI.show('atlas');
FW.Atlas.a = FW.clamp(a == null ? FW.S0.atlas || 0 : a, 0, FW.ATLAS.length - 1);
FW.Atlas.render();
};
FW.Atlas.render = () => {
const a = FW.Atlas.a, A = FW.ATLAS[a], L = FW.Camp.list(a), open = FW.Camp.open(a);
const got = L.reduce((s, sp) => s + ((FW.S0.lv[sp.id] || {}).s || 0), 0);
FW.$('atTitle').innerHTML = `<b>${FW.esc(['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'][a] + '. ' + A.name)}</b><small>${FW.esc(A.sub)}${open ? ' · ' + got + '/' + L.length * 3 + ' stamps' : ' · locked'}</small>`;
FW.$('atPrev').disabled = a === 0; FW.$('atNext').disabled = a === FW.ATLAS.length - 1;
const cv = FW.$('atCv'), r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
const W = r.width, H = r.height, tall = H > W * 1.1;
FW.Atlas.sheet(g, W, H, a, tall, L.length);
const pins = FW.$('atPins'); pins.innerHTML = '';
L.forEach((sp, i) => {
const p = FW.Atlas.pos(L.length, i, a, tall), un = FW.Camp.unlocked(a, i), rec = FW.S0.lv[sp.id];

b.innerHTML = `<span class="st">${rec && rec.s ? '✦'.repeat(rec.s) : ''}</span><span class="dot">${un ? i + 1 : '🔒'}</span><span class="nm">${FW.esc(sp.n)}</span>`;
b.title = sp.n + (un ? '' : ' (locked)');

};
FW.Atlas.sheet = (g, W, H, a, tall, n) => {
const A = FW.ATLAS[a], r = FW.rng(a * 97 + 5), m = 10;
g.clearRect(0, 0, W, H);
g.save(); g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 18; g.shadowOffsetY = 8; g.fillStyle = '#efe3c2'; g.fillRect(m, m, W - m * 2, H - m * 2); g.restore();
g.fillStyle = FW.Art.pattern(g, 'front'); g.fillRect(m, m, W - m * 2, H - m * 2);
g.fillStyle = 'rgba(120,160,175,.35)'; g.fillRect(m, m, W - m * 2, H - m * 2);
g.fillStyle = A.land; g.strokeStyle = FW.Art.INK; g.lineWidth = 2;
g.beginPath();
const cx = W / 2, cy = H / 2, R0 = Math.min(W, H) * 0.42, sx = tall ? 0.85 : 1.25, sy = tall ? 1.15 : 0.8;
for (let i = 0; i <= 40; i++) { const t = i / 40 * Math.PI * 2, rr = R0 * (0.86 + 0.16 * Math.sin(t * 3 + a) + 0.08 * Math.sin(t * 7 + a * 2) + r() * 0.05); const x = cx + Math.cos(t) * rr * sx, y = cy + Math.sin(t) * rr * sy; if (!i) g.moveTo(x, y); else g.lineTo(x, y); }
g.closePath(); g.fill(); g.stroke();
for (let i = 0; i < 14; i++) { const x = cx + (r() - 0.5) * W * 0.6, y = cy + (r() - 0.5) * H * 0.55; if (r() < 0.5) FW.Art.tree(g, x, y, 16, r); else FW.Art.peak(g, x, y, 14, r); }
FW.Art.compass(g, W - m - 46, H - m - 52, 30, 0);
FW.Art.serpent(g, m + 60, H - m - 36, 50, r, false);
FW.Art.coffee(g, W * 0.78, H * 0.2, 40, r, false);
g.strokeStyle = A.ink; g.lineWidth = 2.5; g.setLineDash([3, 7]); g.lineCap = 'round'; g.beginPath();
for (let i = 0; i < n; i++) { const p = FW.Atlas.pos(n, i, a, tall), x = p.x * W, y = p.y * H; if (!i) g.moveTo(x, y); else { const q = FW.Atlas.pos(n, i - 1, a, tall); g.quadraticCurveTo((q.x * W + x) / 2 + (r() - 0.5) * 40, (q.y * H + y) / 2 + (r() - 0.5) * 40, x, y); } }
g.stroke(); g.setLineDash([]);
g.strokeStyle = 'rgba(59,42,28,.7)'; g.lineWidth = 2; g.strokeRect(m + 6, m + 6, W - m * 2 - 12, H - m * 2 - 12);
g.strokeStyle = 'rgba(90,60,30,.18)'; g.lineWidth = 1.5;

};

// ===== modes.js =====
FW.Code = {};
FW.Code.KEYS = ['n', 'm', 'b', 'x', 'names', 's', 'p', 't'];
FW.Code.enc = spec => {
const o = {}; for (const k of FW.Code.KEYS) if (spec[k] != null && spec[k] !== '') o[k] = spec[k];
const json = JSON.stringify(o), bytes = new TextEncoder().encode(json);
let bin = ''; for (const b of bytes) bin += String.fromCharCode(b);
return 'F1' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
FW.Code.dec = code => {
try {
code = String(code || '').trim(); if (code.slice(0, 2) !== 'F1') return null;
const b64 = code.slice(2).replace(/-/g, '+').replace(/_/g, '/'), bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
const bytes = Uint8Array.from(bin, c => c.charCodeAt(0)), o = JSON.parse(new TextDecoder().decode(bytes));
if (!o || !Array.isArray(o.m) || !o.m.length || o.m.length > 9 || o.m.some(r => typeof r !== 'string' || r.length > 27)) return null;
const spec = {}; for (const k of FW.Code.KEYS) if (o[k] != null) spec[k] = o[k];
spec.id = 'shared' + FW.hash(code);
FW.parse(spec);
return spec;
} catch (e) { return null; }
};
FW.Code.url = spec => location.href.split('#')[0] + '#map=' + FW.Code.enc(spec);
FW.Modes = {};
FW.Modes.daily = () => {
const day = FW.today(), spec = FW.Gen.daily(day);
FW.G.load(spec, { mode: 'daily', day: String(day).replace(/(\d{4})(\d\d)(\d\d)/, '$1-$2-$3') });
FW.Hud.tip('A fresh sheet every day. Everyone in the world gets the same one.');
};
FW.Modes.streak = () => {
let n = 0; const d = new Date();
for (let i = 0; i < 400; i++) {
const k = (d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate());
const key = String(k).replace(/(\d{4})(\d\d)(\d\d)/, '$1-$2-$3');
if (FW.S0.daily[key]) n++; else if (i > 0) break;
d.setDate(d.getDate() - 1);
}
return n;
};
FW.Modes.endless = () => {
const E = FW.S0.endless, seed = (E.solved * 7 + 1 + (E.seed || 0)) >>> 0;
const spec = FW.Gen.make(seed, E.tier);
spec.n = spec.n || 'Pressed map';
FW.G.load(spec, { mode: 'endless', n: E.solved + 1 });
if (!E.solved) FW.Hud.tip('Every pressed map was folded at random first, then the road was drawn across it - so it can always be folded back.');
};
FW.Modes.endlessWin = res => {
const E = FW.S0.endless; E.solved++;
E.best[E.tier] = (E.best[E.tier] || 0) + 1;
if (res.stamps >= 2 && E.tier < 3 && E.best[E.tier] % 3 === 0) E.tier++;
else if (res.stamps === 1 && E.tier > 0 && Math.random() < 0.4) E.tier--;
FW.Save.write();
};
FW.Modes.fromHash = () => {
const m = /[#&]map=([A-Za-z0-9_-]+)/.exec(location.hash || '');
if (!m) return false;
const spec = FW.Code.dec(m[1]);
if (!spec) { FW.toast('That shared map code is smudged - could not read it.'); return false; }
FW.G.load(spec, { mode: 'shared' });
FW.Hud.tip('Someone folded this map for you at their drafting table.');
return true;
};

if ('ABab'.includes(t)) { E.feat = E.feat.map(f => f === t ? '.' : f); E.feat[i] = t; return; }
if (t === '@' || t === '%') { if (!prev) E.feat[i] = E.feat[i] === t ? '.' : t; return; }
if (t === 'sign') { if (!prev) { const cyc = ['.', '>', 'v', '<', '^']; E.feat[i] = cyc[(cyc.indexOf(E.feat[i]) + 1) % 5] || '>'; } return; }
if (t === 'tape') {
if (prev) return;
const fx = c.fx - c.x, fy = c.fy - c.y, dE = Math.min(fx, 1 - fx), dS = Math.min(fy, 1 - fy);
let tx = c.x, ty = c.y, d;
if (dE < dS) { d = 'E'; if (fx < 0.5) tx--; } else { d = 'S'; if (fy < 0.5) ty--; }
if (tx < 0 || ty < 0 || (d === 'E' && tx >= E.w - 1) || (d === 'S' && ty >= E.h - 1)) return;
const k = E.tape.findIndex(q => q[0] === tx && q[1] === ty && q[2] === d);
if (k >= 0) E.tape.splice(k, 1); else E.tape.push([tx, ty, d]);
return;
}
if (FW.TERR[t]) E.terr[i] = t;
};
FW.Ed.wire = () => {
const cv = FW.$('edCv'); let prev = null, down = false, moved = false, start = null;
cv.addEventListener('pointerdown', e => { const L = FW.Ed.lay(); cv.setPointerCapture(e.pointerId); down = true; moved = false; start = FW.Ed.cellAt(e, L); prev = start; if (!['road', 'ink'].includes(FW.Ed.tool)) { FW.Ed.paint(start, null); FW.Ed.changed(); } });
cv.addEventListener('pointermove', e => {
if (!down) return; const L = FW.Ed.lay(), c = FW.Ed.cellAt(e, L);
if (!c.ok || (prev && c.i === prev.i)) return;
moved = true; FW.Ed.paint(c, prev); prev = c; FW.Ed.changed();
});
const up = () => {
if (down && !moved && start && start.ok && ['road', 'ink'].includes(FW.Ed.tool)) {
const E = FW.Ed.E, key = FW.Ed.back ? (FW.Ed.tool === 'ink' ? 'inkB' : 'back') : (FW.Ed.tool === 'ink' ? 'ink' : 'road');
E[key][start.i] = 0; FW.Ed.changed();
}
down = false; prev = null;
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('resize', () => FW.Ed.draw());
};
FW.Ed.test = () => {
const sp = FW.Ed.spec(), M = FW.parse(sp);
if (!M.trav.length) { FW.toast('Place a traveller (A) and their destination (a) first.'); return; }
const S = FW.P.init(M);
if (S.dlv) { FW.toast('The road already joins up - no folding needed! Break it somewhere.'); return; }
const r = FW.Sv.solve(M, S, { maxDepth: 6, maxNodes: 150000, ms: 2500 });
if (r.sol) { FW.Ed.E.s = FW.P.fmtAll(r.sol); FW.Ed.E.p = r.sol.length; sp.s = FW.Ed.E.s; sp.p = FW.Ed.E.p; }
FW.G.load(sp, { mode: 'test' });
FW.Hud.tip(r.sol ? `The solver folds this in ${r.sol.length}. Can you?` : 'The solver could not crack this in 6 moves - fold it yourself to prove it can be done.');
};
FW.Ed.tested = res => {
const E = FW.Ed.E;
if (!E.s) { E.s = FW.P.fmtAll(FW.G.pathSoFar()); E.p = res.moves; }
FW.S0.edit = FW.Ed.spec(); FW.Save.write();
};
FW.Ed.share = () => {
const E = FW.Ed.E;
if (!E.s) { FW.toast('Test-fold the map first, so everyone knows it can be solved.'); return; }
const url = FW.Code.url(FW.Ed.spec());
FW.UI.modal(`<h2>Share this map</h2><p>Anyone who opens this link gets your map on their desk:</p><textarea id="eUrl" rows="4" readonly>${FW.esc(url)}</textarea>
<div class="btns"><button class="pb sm" id="eCopy">Copy link</button><button class="pb red sm" id="eOk">Done</button></div>`);
FW.$('eCopy').onclick = () => { const t = FW.$('eUrl'); t.select(); try { navigator.clipboard.writeText(url).then(() => FW.toast('Link copied.'), () => document.execCommand('copy')); } catch (e) { document.execCommand('copy'); } };
FW.$('eOk').onclick = () => FW.UI.close();
};
FW.Ed.load = () => {
const s = prompt('Paste a FOLDWAY map link or code:'); if (!s) return;
const m = /(F1[A-Za-z0-9_-]+)/.exec(s), sp = m && FW.Code.dec(m[1]);
if (!sp) { FW.toast('Could not read that code.'); return; }
FW.Ed.E = FW.Ed.fromSpec(sp); FW.S0.edit = FW.Ed.spec(); FW.Save.write(); FW.Ed.bar(); FW.Ed.draw();
};
// ===== main.js =====
FW.T = { fast: false, all: false };
FW.boot = () => {
const q = location.search;
if (q.includes('reset')) FW.store.del('save');
if (q.includes('test')) FW.T.fast = true;
if (q.includes('all')) FW.T.all = true;
FW.Save.load(); FW.Set.load();
FW.R.init(FW.$('board'));
FW.UI.wire(); FW.Hud.wire(); FW.In.wire(); FW.Home.wire(); FW.Atlas.wire(); FW.Ed.wire();
FW.Set.apply();
const gest = () => { FW.A.init(); FW.Set.apply(); };
addEventListener('pointerdown', gest, { once: true }); addEventListener('keydown', gest, { once: true });
FW.UI.show('home'); FW.Home.refresh();
if (!q.includes('tile')) FW.Modes.fromHash();
addEventListener('hashchange', () => FW.Modes.fromHash());
requestAnimationFrame(FW.loop);
window.FOLDWAY = true;
};
FW.loop = () => {
requestAnimationFrame(FW.loop);
try {
const t = FW.now();
if (FW.UI.cur === 'home') FW.Home.frame(t);
else if (FW.UI.cur === 'play') FW.R.frame(t);
} catch (e) { FW.lastError = String(e && e.stack || e); console.error(e); }
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', FW.boot); else FW.boot();
</script>
