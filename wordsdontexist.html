// ===== words08.js =====
{
WD.add("kaifun", [
["onemorrow", "wun-MOR-oh", "n.", "The single extra go that turns into another, and another, until the birds are singing and it is somehow tomorrow. Each round is sworn to be the last one, and each round is lying.", "From one more plus the old word morrow. First entered in the Unword Ledger by Clerk No. 9, who opened a game on kai.fun during a Friday tea break and was found on Saturday, still at the desk, saying 'nearly had it'.", "I said I would stop after this round, but onemorrow had me until the milkman came.", 2],
["flawlessence", "flaw-LESS-ens", "n.", "The rare, glowing calm of a perfect run, when every jump lands, every coin rings and your hands seem to know the game better than you do. It lasts for one round, and you will chase it for a month.", "Coined by the poet Mabyn Ostrich-Haye in 1911 after she skipped a stone eleven times across the Fennick millpond. She refused ever to skip another, saying it could only go downhill from there.", "For one minute I felt pure flawlessence: no hits, no misses, and a score I will tell my grandchildren about.", 2],
["hearthsave", "HARTH-sayv", "n.", "The warm surprise of returning to a game weeks later and finding it has remembered you: your name, your best score, your silly hat. It is like walking into a cafe where they already know your order.", "From Old Teaspoonic herthe, 'a fireside', and sayf, 'kept'. Archivist Prudence Nib left a lamp burning in the Bureau window for any clerk returning from a long journey, and the clerks called it the hearthsave.", "When Pocket Planet greeted me by name and showed my old little moon still spinning, the hearthsave nearly made me cry.", 2],
["squeakbest", "SKWEEK-best", "n.", "A new high score that beats your old one by exactly one point, which is worth celebrating far more loudly than it should be.", "From Low Frumpish squeak, 'the noise a gate makes when it only just opens'.", "It was a squeakbest of one single point, but I still ran round the kitchen with my arms up.", 1],
["mutepounce", "MYOOT-powns", "v.", "To lunge across the desk for the mute button the instant a game's music bursts out of the speakers at full blast.", "Recorded in Lower Wobbleton, where the church organist's wife kept a cushion ready to throw over the pipes.", "The music started and I mutepounced so fast I knocked over my orange juice.", 1],
["pausling", "PAWZ-ling", "n.", "A game left paused in a browser tab for days, waiting patiently for you to come back and finish the level.", "From pause plus the Vellumese ending -ling, 'a small thing left on a windowsill'.", "My pausling has been frozen mid-jump since Tuesday and I am scared to close it.", 1],
["retryfume", "ree-TRY-fyoom", "v.", "To hit the retry button faster than humanly possible after losing, while muttering darkly.", "From the Drabble Marshes, where a man fell into the same bog nine times and climbed out angrier each time.", "He retryfumed through forty attempts and finally passed the spinning saw on the forty-first.", 1],
["soundlurk", "SOWND-lurk", "n.", "A game's music still quietly playing in a forgotten tab, which you only notice when the room goes silent.", "From Middle Quellish sownd, 'a tune', and lurken, 'to hide behind the curtains'.", "During the quiet bit of the film we all heard a soundlurk of jolly game music from my laptop.", 1],
["tilegrazing", "TILE-gray-zing", "n.", "Slowly browsing a wall of game tiles, reading every title, picking nothing and enjoying it enormously.", "From the cows of the Fennick Valley, who wander a whole field tasting grass before settling on the first patch.", "I spent my free half-hour tilegrazing on kai.fun and never actually pressed play.", 1],
["badgeglow", "BADJ-gloh", "n.", "The warm buzz when a little banner slides in to announce you have unlocked an achievement you did not even know existed.", "From the Bureau's old brass medal for 'Most Words Filed Before Lunch', which made its wearers glow for a week.", "The achievement popped up for jumping ninety-nine times and the badgeglow carried me through dinner.", 1],
["eleventhed", "ih-LEV-ent-ed", "adj.", "Describing someone who has finished exactly one place below the bottom of the top ten leaderboard.", "Clerical error: the Bureau's honours board had room for ten names, and Brother Ludo's was painted round the side.", "I worked all week on that score and ended up eleventhed, just under someone called CHEESE.", 1],
["loopworm", "LOOP-wurm", "n.", "A game's short music loop that stays in your head long after you stop playing, usually during a test.", "From Proto-Snorrish lupwyrm, a worm said to live in bagpipes and know only one tune.", "The loopworm from the dragon game stayed with me all through my maths exam.", 1],
["progreft", "proh-GREFT", "adj.", "Describing a player whose save has been wiped after someone tidied the browser, taking ninety levels with it.", "From progress plus bereft. Dr Horatio Quell was progreft when a cleaner dusted his card index into alphabetical order.", "Mum cleared the history to speed up the computer and left me completely progreft.", 1],
["scoresnatch", "SKOR-snach", "n.", "The act of a friend beating your proudly announced high score within minutes of hearing about it.", "Gristle Cant, after a clerk boasted about filing a hundred cards and a colleague filed a hundred and one.", "I bragged about my score at lunch and suffered a scoresnatch before the bell rang.", 1],
["thumbnailure", "THUM-nay-lyer", "n.", "The pull of a game tile with a picture so bright and odd that you have to click it, whatever the game is.", "From thumbnail plus allure. The merchant Ebbe Tannick sold more jam by painting a dragon on the jar.", "Pure thumbnailure made me click a game about a dentist who treats dragons.", 0],
["keyflail", "KEE-flayl", "v.", "To press every key on the keyboard in turn to find out how on earth this game is controlled.", "From Sub-Arctic Dunnish flail, the motion of a seal trying to open a door.", "I keyflailed for a while until I learned that the space bar makes the frog jump.", 0],
["anykeyhunt", "EN-ee-kee-hunt", "n.", "The brief, silly search for a key labelled 'any' when the screen says to press any key.", "Recorded at the Bureau in 1983, where Clerk No. 9 reportedly searched for twenty minutes before trying the tea spoon.", "My little brother began an anykeyhunt and finally just pressed his own nose against the keyboard.", 0],
["tutorbolt", "TOO-ter-bohlt", "v.", "To skip the tutorial at speed, certain you will work it out, and then immediately die on the first spike.", "From the High Pellish tutor, 'one who points', and bolt, 'to run before the point is made'.", "I tutorbolted past the instructions and fell into the first hole in four seconds.", 0],
["jumphush", "JUMP-hush", "n.", "The held breath and frozen silence of the whole room during a very difficult jump.", "From the circus folk of Port Scrivel, who forbade even sneezing while the trapeze flew.", "There was a total jumphush as I leapt for the last ledge, and then a great cheer.", 0],
["leansteer", "LEEN-steer", "v.", "To tilt your entire body sideways in your chair while steering, as if that will help the car on screen turn.", "From the Isle of Umber fishermen, who leaned into every wave and still went the wrong way.", "Grandpa leansteered so hard round the last bend that he slid off the sofa.", 0],
["shoulderling", "SHOHL-der-ling", "n.", "A person who watches you play over your shoulder and offers advice about buttons they have never pressed.", "From shoulder plus -ling. Semicolon the Bureau cat was the first recorded shoulderling, sitting on clerks to supervise.", "My shoulderling kept shouting 'jump now' a full second after the right moment.", 0],
["watchfumble", "WOCH-fum-bul", "n.", "The sudden collapse of your skill the moment someone stands behind you to see how good you are.", "From the Gristlemoor saying 'the pot boils, but not for the watcher', applied to games in 2004.", "I was brilliant all morning, but watchfumble hit as soon as my cousin sat down.", 0],
["ancientbest", "AYN-shent-best", "n.", "A personal record set years ago that you have never come close to beating, and suspect was a fluke.", "From the Mount Ostentle climbing record, set in 1871 by a goat.", "My ancientbest from last summer still sits at the top, laughing at me.", 0],
["flipstand", "FLIP-stand", "n.", "The silent wonder of a tossed bottle landing perfectly upright, after you had stopped believing it could.", "From Coastal Mirrovan flippe, 'a turning fish', and standen, 'to stay put'.", "After fifty tries in Bottle Flip I got a flipstand and screamed so loudly the dog left.", 0],
["tentaclutter", "TEN-tuh-klut-er", "n.", "The frantic mess of trying to serve eight orders at once, as if you had eight arms.", "From tentacle plus clutter, coined by a Port Scrivel cook with too many pans and too few hands.", "By level six of Kraken Cafe I was drowning in tentaclutter and serving soup to the wrong squid.", 0],
["strayfluff", "STRAY-fluff", "n.", "The one cloud, sheep or small creature that refuses to follow the others and drifts off the edge of the screen.", "From the Fennick shepherds, who had a special whistle just for the one lamb that never listened.", "I had the whole flock home in Cloud Shepherd except one strayfluff floating towards the sun.", 0],
["overbubble", "OH-ver-bub-ul", "v.", "To push your luck one puff too far and pop the thing you were making, after it was perfect a second ago.", "From the Old Teaspoonic word for a pan of milk left on the stove one moment too long.", "I overbubbled my best mix in Gum Lab and it splattered across the whole screen.", 0],
["planetfond", "PLAN-et-fond", "adj.", "Describing the deep, protective love you feel for a tiny world you built yourself out of rocks and a tree.", "Coined by Archivist Prudence Nib about her window box, which she called 'the Republic'.", "I am so planetfond about my little world that I gave every rock a name.", 0],
["selfbonk", "SELF-bonk", "n.", "Walking straight into your own reflection in a game because you were sure it was the way through.", "From the Bureau's mirrored corridor, where Dr Horatio Quell bowed to himself every morning.", "The Mirror Maze gave me my fifth selfbonk of the day.", 0],
["thunkfever", "THUNK-fee-ver", "n.", "The wild rhythm you fall into when stamping things as fast as you can, until you are stamping the desk too.", "From the Smudge Room, where clerks during the Great Backlog of 1953 stamped in time to a brass band.", "Deep in Stamp Rush, thunkfever took over and I stamped my own homework.", 0],
["swapsmug", "SWOP-smug", "adj.", "Describing someone who has just traded a soggy sandwich for a whole chocolate pudding and knows it.", "From the merchant Ebbe Tannick, who was swapsmug for forty years after trading a goat for a ship.", "After my best deal in Lunch Trade I sat back, swapsmug, eating a pretend cake.", 0],
["waitwin", "WAYT-win", "n.", "The peculiar pride of being extremely good at a game that is mostly about waiting patiently.", "From the Bureau's annual Waiting Competition, held in a corridor since 1801 and never finished.", "My best waitwin in The Waiting Room came from not touching anything for ages.", 0],
["molarsweat", "MOH-ler-swet", "n.", "The nervous sweat of doing a delicate job beside something enormous that might wake up at any moment.", "From the dentists of Gristlemoor, who treated the village bull only while it was asleep.", "Pulling the last tooth in Dragon Dentist gave me serious molarsweat.", 0],
["lefright", "lef-RITE", "n.", "The brain-scrambling confusion of controls that have been swapped, so that left goes right and you go nowhere.", "From Proto-Snorrish, where left and right shared one word and travellers simply hoped.", "The reversed level threw me into lefright and I steered into a wall six times.", 0],
["hintworn", "HINT-worn", "adj.", "(Of a loading screen tip) Read so many times that you could recite it in your sleep.", "From the Bureau's tea trolley sign, 'Mind the Wheel', read so often it wore off the brass.", "The hintworn tip about collecting stars flashed up again and I mouthed every word.", 0],
["countjolt", "KOWNT-johlt", "n.", "The quick shiver of excitement as a game counts down three, two, one before the start.", "From the starting horn of the Lower Wobbleton duck race, which made the crowd jump more than the ducks.", "The countjolt hit me at 'two' and I pressed go before the race began.", 0],
["bossloathe", "BOS-lohth", "n.", "The very personal grudge you develop against one level's big enemy after losing to it many times.", "From the Bureau's long feud with a stubborn filing cabinet nicknamed the Duke.", "My bossloathe for the giant snail has grown into a lifelong rivalry.", 0],
["secretingle", "SEE-kret-ing-gul", "n.", "The chime of finding a hidden room or bonus that most players never discover.", "From Middle Quellish secreet, 'behind the bookshelf', where Brother Ludo once found the monastery's lost jam.", "I bumped a wall, heard the secretingle and found a room full of golden coins.", 0],
["freshtile", "FRESH-tile", "n.", "A brand-new game on the wall of tiles, glowing with a little label and begging to be tried first.", "From the bakers of the Isle of Umber, who put a flag in the warmest loaf.", "There was a freshtile on kai.fun this morning, so breakfast had to wait.", 0],
["keyshine", "KEE-shine", "n.", "The polished glint on the arrow keys and space bar, worn smooth by a thousand runs.", "From the shine on the Bureau's front doorknob, rubbed by every clerk since 1792.", "You can tell my favourite game by the keyshine on the left arrow.", 0],
["plinkjoy", "PLINK-joy", "n.", "The silly delight of the tiny sound a game makes when you collect a coin, and the urge to hear it again.", "From the Old Blotvian plink, the sound of a penny dropping into a wishing well.", "Collecting every coin was not needed, but the plinkjoy was too good to skip.", 0],
["gripdawn", "GRIP-dawn", "n.", "The moment the controls of a new game suddenly make sense and you stop fighting them.", "Coined in 1922 by Madame Ilse Vantablot, who said every new quill had a dawn after its first blot.", "Gripdawn arrived on my sixth go, and from then on I was flying.", 0],
["boardglimpse", "BORD-glimps", "n.", "The thrill of spotting your own name on a leaderboard, however far down it is.", "From the Bureau's noticeboard, where clerks searched daily for their names on the rota.", "I had a boardglimpse at number ninety-two and still took a photo.", 0],
["pausesnap", "PAWZ-snap", "v.", "To pause a game with lightning speed when someone walks into the room unexpectedly.", "Gristle Cant, from clerks who hid their crosswords under index cards when the Archivist passed.", "I pausesnapped just as Dad came in, and pretended to read about volcanoes.", 0],
["tabflicker", "TAB-flik-er", "n.", "The little title of a game tab flashing to remind you it is still waiting for you to come back.", "From the lighthouse at Port Scrivel, which blinked mostly to say 'remember me?'.", "A tabflicker caught my eye in the middle of my essay, and the essay lost.", 0],
["escaplunge", "es-KAY-plunj", "n.", "The awful second after pressing the wrong key and closing the game halfway through your best run.", "From escape plus plunge, recorded in the Drabble Marshes as the sound of a boot leaving a foot.", "One escaplunge wiped out the greatest round of my life.", 0],
["padflail", "PAD-flayl", "n.", "The clumsy thrashing of trying to play a fast game on a laptop touchpad with one finger.", "From the Low Frumpish padflayl, a farmer trying to steer a pig with a feather.", "My padflail on the bus got me nowhere near the finish line.", 0],
["wahbonk", "WAH-bonk", "interj.", "A cry let out when crashing into an obstacle you saw coming from miles away.", "From the sound made by a Lower Wobbleton bell-ringer who walked into his own bell.", "Wahbonk! I saw the cactus, I knew it was there, and I hit it anyway.", 0],
["zingdone", "ZING-dun", "interj.", "A triumphant shout on finishing a level cleanly, usually followed by a little dance in the chair.", "From the Coastal Mirrovan zing, the sound a cork makes when it leaves a bottle perfectly.", "Zingdone! Level twelve, no hits, and only one sock lost in the excitement.", 0],
["spacewhack", "SPAYS-wak", "n.", "Hitting the space bar much harder than necessary, as if force will make the character jump higher.", "From the Bureau's rubber stamp tradition, where a harder thump was believed to make a word more official.", "My spacewhack was so loud that my sister thought a book had fallen.", 0],
["quietmash", "KWY-et-mash", "v.", "To press keys frantically but silently late at night so that nobody hears you are still playing.", "From the Isle of Umber night fishers, who rowed with wool on their oars.", "I quietmashed through the final level while the whole house slept.", 0],
["turnhover", "TURN-huv-er", "n.", "The way a waiting sibling stands right behind you, counting down your turn out loud.", "From the High Pellish turnhofer, a child waiting beside the swing with a stopwatch.", "My sister's turnhover started the second I lost my first life.", 0],
["tilelottery", "TILE-lot-er-ee", "n.", "Closing your eyes and clicking any game tile at random, then committing to it with your whole heart.", "From the Gristlemoor fair, where you paid a penny to draw a stranger's hat from a sack.", "Tilelottery gave me a game about stacking cows, and it is now my favourite.", 0],
["skillecho", "skil-EK-oh", "n.", "Returning to a game after months away and finding your fingers still remember exactly what to do.", "From the Bureau's echoing stairwell, which repeats every word a week later, or so the clerks swear.", "Skillecho kicked in and I beat my old score on my first try back.", 0],
["rustdrop", "RUST-drop", "n.", "The opposite discovery: returning to an old favourite and being astonishingly bad at it.", "From the gate at the Fennick mill, which squeaked louder every year nobody used it.", "After a long holiday the rustdrop was brutal, and I fell off the very first platform.", 0],
["scoretwin", "SKOR-twin", "n.", "Scoring exactly the same number as last time, to the point, as if the game were mocking you.", "Clerical error: two clerks filed the same word on the same day in 1830, and neither would give way.", "Two rounds in a row I hit 4,212, a perfect scoretwin.", 0],
["startflop", "START-flop", "n.", "Dying within the first second of a game, before you have even worked out which character is yours.", "From the Lower Wobbleton sack race, which one runner famously lost at the word 'ready'.", "That was a total startflop: I pressed play and instantly fell in the river.", 0],
["overstare", "oh-ver-STAIR", "v.", "To stare at the game over screen for far too long, replaying the mistake in your head.", "From Brother Ludo, who stared at an ink blot on page one hundred for a whole afternoon.", "I overstared at my final score until the screen dimmed itself out of pity.", 0],
["greenluck", "GREEN-luk", "n.", "The suspicious brilliance of your very first try at a game, which you will never match again.", "From the Snorrish saying that new boots always find the path on the first day.", "My greenluck gave me a top score on my first go, and it has been downhill ever since.", 0],
["cursorstray", "KUR-ser-stray", "n.", "The mouse pointer escaping the edge of the game window at the worst possible moment.", "From the Bureau cat Semicolon, who always wandered out of the room during roll call.", "A cursorstray sent my click onto the wrong tab and my spaceship drifted into a rock.", 0],
["scoremantra", "SKOR-man-truh", "n.", "Your best score, memorised to the last digit and repeated in your head like a magic spell.", "From the Vellumese mantren, 'numbers the monks counted while stirring soup'.", "Eight thousand and six, my scoremantra goes, eight thousand and six.", 0],
["hairlate", "HAIR-layt", "adj.", "Missing a personal best by such a tiny fraction of a second that you check the numbers twice.", "From the horse races of the Fennick Valley, where a mane often won by a single hair.", "I was hairlate by one hundredth of a second and had to lie on the floor for a while.", 0],
["heartpin", "HART-pin", "v.", "To mark a game as a favourite so it waits for you at the top every time you visit.", "From Mabyn Ostrich-Haye, who pinned her favourite poems to her coat.", "I heartpinned the frog game so I can find it before school.", 0],
["starelock", "STAIR-lok", "n.", "The trance of a tricky level, where you forget to blink, breathe or answer when anyone speaks.", "From Proto-Snorrish starrlok, the gaze of an owl waiting for a mouse.", "I was in such starelock that I didn't hear Mum calling for tea.", 0],
["halfplayer", "HAF-play-er", "n.", "A person who starts ten games in an afternoon and finishes the first level of exactly none of them.", "From the Gristlemoor saying about a man who built half a cart, half a boat and half a ladder.", "As a proud halfplayer, I have tried every game on the site for one minute each.", 0],
["obviotutor", "OB-vee-oh-too-ter", "n.", "A cheerful helper character who explains, slowly and twice, that pressing right moves you right.", "From the Bureau's very first induction leaflet, which spent four pages explaining doors.", "The obviotutor told me to jump over the gap, which was the only thing on the screen.", 0],
["pixelshy", "PIK-sul-shy", "adj.", "Failing a run so close to the finish that it was a single dot away.", "From the Old Blotvian pixl, 'a speck', a unit used to measure disappointment.", "I came pixelshy of the flag and the whole room groaned.", 0],
["levelgrooved", "LEV-ul-groovd", "adj.", "Knowing one level so well that you could play it with your eyes closed and a sandwich in your other hand.", "From the grooves worn in the Bureau's steps by two centuries of clerks taking the same route to the tea trolley.", "I am completely levelgrooved on stage three, but stage four still terrifies me.", 0],
["lagblame", "LAG-blaym", "v.", "To blame the internet, the computer or the weather for a mistake that was entirely your own.", "From the Bureau's ancient tradition of blaming Semicolon for every missing index card.", "He lagblamed his fall into the lava, although the game was running perfectly.", 0],
["roomcheer", "ROOM-cheer", "n.", "A huge cry of triumph over a high score, heard only by an empty room and a confused pet.", "From the hermit of Mount Ostentle, who cheered his own pancakes every morning.", "I let out a roomcheer at my new best, and the goldfish didn't even look up.", 0],
["loadlessness", "LOHD-less-ness", "n.", "The quiet joy of a free game that starts the instant you click it, with nothing to install and nothing to wait for.", "From the Vellumese lodlos, 'a door without a doorman'.", "The loadlessness of kai.fun means I can play a whole round while the toast pops up.", 0],
["proofsnap", "PROOF-snap", "n.", "A hurried screenshot of your high score, taken as evidence before anyone can claim you made it up.", "Gristle Cant, from clerks who drew the biggest fish they ever caught on an index card.", "Nobody believed my score until I showed them the proofsnap.", 0]
]);
}

{
WD.add("time", [
["sundolour", "sun-DOL-er", "n.", "The grey, heavy feeling that creeps in around five o'clock on a Sunday evening, when the weekend is not yet over but has clearly packed its bags. It smells faintly of school shoes and unfinished homework.", "From Middle Quellish sunne-dolor, 'the ache of the seventh day'. Brother Ludo of Gristlemoor noted it in the margins of every Sunday sermon for forty years, always beside a tiny drawing of a sad candle.", "By teatime the sundolour had set in, and even the roast potatoes tasted like Monday.", 2],
["clocktaffy", "KLOK-taf-ee", "n.", "The very last minute before home time, which stretches like warm toffee until it seems to last an entire hour. The second hand moves, technically, but only out of politeness.", "Coined in 1931 by Clerk No. 9, who timed the final minute before the Bureau's closing bell at fifty-eight ordinary minutes. Dr Horatio Quell checked the sum, agreed, and asked to go home early.", "At 2:59 the clocktaffy began, and I watched the second hand crawl round like a snail on holiday.", 2],
["alarmsnub", "uh-LARM-snub", "n.", "Waking up exactly one minute before your alarm is due to go off, robbed of a minute's sleep and too awake to get it back. You lie there, waiting to be woken, like an actor who missed their cue.", "From the Vellumese alarme-snubbe, 'the rooster insulted'. The Bureau cat Semicolon is said to have woken Archivist Prudence Nib one minute before her bell every single morning from 1792 until 1801, purely to prove a point.", "I opened my eyes at 6:59, a perfect alarmsnub, and lay glaring at the clock until it rang.", 2],
["oldyearing", "OHLD-yeer-ing", "n.", "The habit of writing last year's date on everything for the first three weeks of January, then crossing it out with a sigh.", "Clerical error: in 1800 the Bureau stamped every card with 1799 until March, and simply called it tradition.", "My homework is covered in oldyearing, with every date scribbled out and corrected in the margin.", 1],
["minutebarter", "MIN-it-bar-ter", "n.", "The sleepy, muffled negotiation for five more minutes in bed, offered in exchange for promises nobody can keep.", "From the merchant Ebbe Tannick, who once traded his entire morning for 'just a little longer' and woke up at lunch.", "My minutebarter with Mum ended in a deal: five more minutes and I would make my own toast.", 1],
["smudgeweek", "SMUJ-week", "n.", "The blurry stretch between the winter holidays and the new year, when nobody knows what day it is or when anything happens.", "Named after the Bureau's Smudge Room, where the calendar on the wall has been smeared beyond reading since 1894.", "In the middle of smudgeweek I ate cold pudding for breakfast and had no idea if it was a Tuesday.", 1],
["laggardclock", "LAG-erd-klok", "n.", "The one clock in the house that nobody ever changes when the clocks go forward, so it spends half the year telling lies.", "From the Fennick Valley church clock, which still runs one hour behind because the bell-ringer refused on principle.", "The oven is our laggardclock, and it insists that dinner is an hour later than it is.", 1],
["tickstall", "TIK-stawl", "n.", "The strange way a clock's second hand seems to freeze for a moment the instant you look at it, as though caught doing something.", "From Old Blotvian tikstal, 'a clock playing statues'.", "I glanced up, got a tickstall, and for a second I thought the clock had stopped forever.", 1],
["pillowsum", "PIL-oh-sum", "n.", "The anxious maths you do in bed: if I fall asleep right now, I will get six hours and twelve minutes of sleep.", "Recorded on the Isle of Umber, where sleepers counted the hours left on their fingers and ran out of fingers.", "My pillowsum got worse each time I checked the clock, until it was less than five hours.", 1],
["hurrigrace", "HUR-ee-grays", "n.", "The astonishing speed and skill with which you can get ready when you are truly, desperately late.", "From hurry plus grace. Madame Ilse Vantablot once dressed, inked a contract and caught the coach in four minutes flat.", "With pure hurrigrace I brushed my teeth, found both shoes and was out the door in ninety seconds.", 1],
["twinhour", "TWIN-ow-er", "n.", "Glancing at a clock that shows matching numbers, like 11:11 or 2:22, and feeling oddly as if it means something.", "From the Snorrish belief that matching hours were when the clocks winked at you.", "I checked the time at a twinhour of 12:12 and made a wish just in case.", 1],
["fivefast", "FIVE-fast", "adj.", "(Of a clock) Kept five minutes fast to make everyone hurry, though the whole family now subtracts five in their heads.", "From the Gristlemoor kitchen clock, set ahead by a cook in 1820 and never trusted again.", "Our kitchen clock is fivefast, so nobody believes it and we are all late anyway.", 1],
["jiffling", "JIF-ling", "n.", "A 'just a second' that goes on for ten minutes, while you stand by the door holding your coat.", "From jiffy, via Low Frumpish jiffel, 'a promise made with one shoe on'.", "Dad's jiffling at the computer lasted so long I took my coat off again.", 1],
["timesquish", "TIME-skwish", "n.", "Discovering that something you think happened two years ago actually happened seven years ago, and feeling suddenly ancient.", "Coined by the poet Mabyn Ostrich-Haye, who was shocked to learn her 'recent' poem was nineteen years old.", "The timesquish hit when I learned my baby cousin is now in secondary school.", 1],
["lastdayish", "LAST-day-ish", "adj.", "Describing the bittersweet mood of the final day of a holiday, when you are still there but already half home.", "From the Port Scrivel saying 'the last wave is always the saddest'.", "We were all lastdayish on the beach, building a sandcastle we knew we would never see again.", 0],
["hourfilch", "OW-er-filch", "n.", "An hour that vanishes entirely while you were doing something fun, as if someone sneaked off with it.", "From High Pellish filchen, 'to steal a pie from a windowsill'.", "The hourfilch struck again: I sat down to draw for a minute and it was suddenly dinner.", 0],
["boilyawn", "BOYL-yawn", "n.", "The long, bored stare at a kettle that refuses to boil while you are watching it.", "From Old Teaspoonic boyle-jaun, the yawn of a cook in front of a slow pot.", "I stood in a boilyawn for so long that I forgot why I wanted tea.", 0],
["clockblank", "KLOK-blank", "n.", "Looking at a clock and then, one second later, having absolutely no idea what time it said.", "From the Bureau, where clerks check the wall clock forty times a day and remember it none of them.", "I had a clockblank and had to check my watch again straight away.", 0],
["afternoodle", "AF-ter-noo-dul", "n.", "The floppy, sleepy slump at about three in the afternoon, when the brain turns into warm spaghetti.", "Gristle Cant, from the clerks' three o'clock nap beneath the index drawers.", "In the afternoodle, I read the same sentence about rivers four times.", 0],
["weekendrift", "week-END-rift", "n.", "The light, floaty feeling that arrives on Friday afternoon and makes even a spelling test feel bearable.", "From the Lower Wobbleton custom of ringing the market bell on Friday at noon to let everyone start daydreaming.", "Weekendrift had arrived by lunch and nobody could concentrate on fractions.", 0],
["agefumble", "AYJ-fum-bul", "n.", "Having to stop and work out how old you are when someone asks, as though it were a hard sum.", "Recorded in the Drabble Marshes, where everyone counted their age in floods and lost track.", "When the nurse asked my age, Grandad had an agefumble and said 'about sixty-something'.", 0],
["blockloop", "BLOK-loop", "v.", "To walk round the block on purpose because you arrived at a party far too early and don't want to knock yet.", "From Archivist Prudence Nib, who circled the Bureau three times every morning so as not to seem keen.", "We were twenty minutes early, so we blocklooped twice before ringing the bell.", 0],
["enroutish", "on-ROOT-ish", "adj.", "Describing someone who has texted 'on my way' while still wearing slippers and eating cereal.", "From the Vellumese en-routte, 'in the general direction of leaving'.", "My friend said he was coming, but he sounded very enroutish with his mouth full of toast.", 0],
["departdrift", "dih-PART-drift", "n.", "The way a planned three o'clock departure quietly turns into twenty to four.", "From Ebbe Tannick's ships, which sailed 'at dawn', usually around lunch.", "The departdrift was so bad that we left for the zoo just as it was closing.", 0],
["dimfour", "DIM-for", "n.", "The winter shock of walking out of school at four o'clock into what looks like midnight.", "Coined by a lamplighter of the Fennick Valley who had to start his rounds before his tea.", "Dimfour came early in December and I walked home under the streetlights.", 0],
["lingerlight", "LING-ger-lite", "n.", "The long, golden summer evening that refuses to get dark, so bedtime feels like a mistake.", "From the Coastal Mirrovan midsummer, when the sun was said to hang on just to see the end of the dance.", "It was nine o'clock but the lingerlight made it feel like the afternoon.", 0],
["whenfog", "WEN-fog", "n.", "Waking from an afternoon nap with no idea whether it is morning, evening or next Thursday.", "From Sub-Arctic Dunnish wenfogg, the confusion of a bear who woke from winter too soon.", "I woke on the sofa in a total whenfog and started to pack my school bag at seven at night.", 0],
["sleepsum", "SLEEP-sum", "n.", "The number of sleeps left until a big day, counted carefully every night by children.", "From the Isle of Umber, where children counted sleeps with pebbles on the windowsill.", "My little sister's sleepsum until her birthday is now down to three.", 0],
["eveslog", "EEV-slog", "n.", "The slowest day of the year, which is always the day before the exciting one.", "From the Gristlemoor fair, whose eve was so slow that villagers counted the hours with candles.", "The eveslog dragged so badly that I tidied my whole room just to pass time.", 0],
["beepdodge", "BEEP-doj", "v.", "To open the microwave at one second left so that it never gets the chance to beep.", "From Old Teaspoonic beppe, 'a kettle that tells on you'.", "I beepdodged the microwave so nobody would know I was having a midnight snack.", 0],
["deadlurch", "DED-lurch", "n.", "The jolt of remembering, at eleven at night, that something is due first thing in the morning.", "Clerical error: in 1847 Clerk No. 9 remembered a report at midnight and wrote it by moonlight.", "A deadlurch woke me straight up when I remembered the science poster.", 0],
["dayskew", "DAY-skyoo", "n.", "Being utterly certain it is Thursday when it is in fact only Wednesday, and feeling betrayed.", "From Proto-Snorrish skew, 'a week with a missing step'.", "My dayskew meant I packed my swimming kit on the wrong day.", 0],
["handpuzzle", "HAND-puz-ul", "n.", "Working out the time on an old clock with hands, slowly, as though decoding a treasure map.", "From the Bureau's grandfather clock, which has three hands and a sense of humour.", "Grandma's clock gave me a handpuzzle every morning until I learned it.", 0],
["resolapse", "REZ-oh-laps", "n.", "The moment, usually on the fourth of January, when a New Year's promise quietly gives up.", "From resolution plus lapse. Dr Horatio Quell's annual pledge to be humble has lapsed every year by the second.", "My resolapse came on day four, with a biscuit in each hand.", 0],
["zonemuddle", "ZOHN-mud-ul", "n.", "The headache of working out what time it is for a friend on the other side of the world.", "From the merchant Ebbe Tannick, who wrote letters at noon to say 'good night' and confused everyone.", "After ten minutes of zonemuddle I phoned my aunt at three in the morning.", 0],
["birthdaysprawl", "BURTH-day-sprawl", "n.", "The custom of stretching one birthday into a whole week of treats.", "From Mabyn Ostrich-Haye, whose birthday lasted a month and included a parade.", "My birthdaysprawl started on Monday and lasted until the cake ran out.", 0],
["lunchshrink", "LUNCH-shrink", "n.", "The way lunch break seems to last ten minutes, while maths lasts for a geological age.", "Gristle Cant, from the Bureau's tea break, officially fifteen minutes, actually four.", "Lunchshrink struck and the bell rang before I finished my sandwich.", 0],
["endlessfirst", "END-less-furst", "n.", "The first morning of the summer holidays, when time stretches out like a field with no fence.", "From the Fennick Valley shepherds' word for the first day of the long grazing season.", "On the endlessfirst I lay on the grass and planned a hundred things I would never do.", 0],
["backbump", "BAK-bump", "n.", "The hard landing of the first day back at school after a long holiday.", "From Low Frumpish backbumpel, a cart wheel falling into the same rut every September.", "The backbump hit as soon as I saw my unopened pencil case.", 0],
["snoozestack", "SNOOZ-stak", "n.", "A tower of alarms set five minutes apart, each one ignored by a sleepier version of you.", "From the Bureau's 1979 experiment with seven alarm clocks, all of which were thrown in a drawer.", "I built a snoozestack of six alarms and still overslept.", 0],
["parcelvigil", "PAR-sul-vij-il", "n.", "Waiting at home all day for a delivery that might arrive at any minute between eight and nine.", "From the Port Scrivel harbour watchers, who waited weeks for ships and missed them when they nipped to the shop.", "My parcelvigil ended when I popped to the bathroom and missed the knock.", 0],
["keyhour", "KEE-ow-er", "n.", "The time lost searching for keys that were in your coat pocket the whole time.", "From the jailers of Gristlemoor, who were famous for locking themselves out of the jail.", "After a full keyhour, Dad found them in the fridge next to the butter.", 0],
["pencilsprint", "PEN-sul-sprint", "v.", "To write at a furious speed during the final five minutes of a test, handwriting turning into wobbly spaghetti.", "From the Bureau's annual dictation contest, won in 1903 by a clerk whose writing nobody could read.", "I pencilsprinted through the last question with my tongue sticking out.", 0],
["augustsink", "AW-gust-sink", "n.", "The sudden realisation, late in the summer holidays, that there are only a few days left.", "From the Drabble Marshes, where the reeds start to bow at summer's end, as if sorry.", "The augustsink came when I saw new school shoes in the hallway.", 0],
["punctuglow", "PUNK-choo-gloh", "n.", "The small private pride of arriving at the exact minute you were supposed to.", "From punctual plus glow, coined by Archivist Prudence Nib, who was never late in her life.", "I knocked on the door at exactly two o'clock and felt a punctuglow all over.", 0],
["monthwhoosh", "MUNTH-woosh", "n.", "Saying 'it's already November?' and not being able to account for where October went.", "From the Isle of Umber gale that blew so hard it once carried off a whole month of washing.", "There was a monthwhoosh in the classroom when the teacher said it was nearly the holidays.", 0],
["knucklecount", "NUK-ul-kownt", "v.", "To count along your knuckles to find out how many days a month has, every single time.", "From Brother Ludo, who wrote the knuckle trick in a margin and then forgot it.", "I knucklecounted twice to check whether June had thirty-one days.", 0],
["nearlynow", "NEER-lee-now", "interj.", "A cry of excitement as the clock ticks into the final seconds before something good.", "From the countdown chant of the Lower Wobbleton bun race, shouted before every bun.", "Nearlynow! Two more seconds and the holidays begin!", 0],
["minutechew", "MIN-it-choo", "v.", "To stare at the clock so hard that each minute seems to take forever to swallow.", "From the Bureau's waiting bench, where visitors' stares wore a groove in the clock's face.", "I minutechewed through the whole afternoon waiting for the bell.", 0],
["deadhour", "DED-ow-er", "n.", "Waking at three in the morning with all your thoughts at full volume and nothing to do with them.", "From the Sub-Arctic Dunnish phrase for the hour when even owls go to bed.", "The deadhour found me wide awake, thinking about a joke I told in Year Two.", 0],
["errandspan", "AIR-und-span", "n.", "The way a 'quick' trip to the shops for milk swallows the entire afternoon.", "From the Gristlemoor tale of the boy who went for eggs and came back with a cow.", "Mum's errandspan was four hours, and she still forgot the milk.", 0],
["awaitflash", "uh-WAYT-flash", "n.", "A day you looked forward to for months that is somehow over in about ten minutes.", "From Madame Ilse Vantablot's favourite firework, which took a week to make and a second to watch.", "The party was an awaitflash, and suddenly I was home with a balloon.", 0],
["yearbrink", "YEER-brink", "n.", "The last few seconds of the old year, when everyone counts down together and holds their breath.", "From the Coastal Mirrovan new year cliff, from which villagers shouted their wishes at the sea.", "At the yearbrink we all counted from ten and my uncle dropped his biscuit.", 0],
["tenhoper", "TEN-hoh-per", "n.", "An optimist who truly believes ten minutes is enough time to shower, dress, eat and do homework.", "From Dr Horatio Quell, who planned to write a whole dictionary 'before tea'.", "As a tenhoper, I started my essay at 8:50 for a nine o'clock deadline.", 0],
["napwarp", "NAP-worp", "n.", "A twenty-minute nap that feels like twelve hours, or a long night that feels like a blink.", "From the Bureau cat Semicolon, whose naps are said to bend time itself.", "The napwarp made me think I had slept for days, but it was only lunchtime.", 0],
["weekendawn", "WEEK-en-dawn", "n.", "Waking at six on a Saturday, wide awake, after a week of being impossible to wake.", "From the cockerel of Lower Wobbleton, who slept in on weekdays and crowed at dawn on market day.", "Weekendawn struck at six and I watched cartoons while everyone slept.", 0],
["doorscramble", "DOR-skram-bul", "n.", "The chaos of the final five minutes before leaving, when shoes vanish and coats hide.", "From the Bureau's front door, where clerks arrive at nine and leave at five, both in a muddle.", "Our doorscramble ended with me wearing one of my sister's shoes.", 0],
["hindcake", "HIND-kayk", "n.", "A birthday card, call or cake given a day late, with an extra-big smile to make up for it.", "From the Old Blotvian hindkak, 'the second cake, for the one who missed the first'.", "I forgot Gran's birthday, so I brought her a hindcake the next morning.", 0],
["drillminute", "DRIL-min-it", "n.", "A minute in the dentist's chair, which lasts at least as long as a fortnight's holiday.", "From the Gristlemoor tooth-puller, who said 'just a minute' and meant something else.", "Every drillminute felt like a year staring at the poster on the ceiling.", 0],
["queuecreep", "KYOO-kreep", "n.", "The way your queue always moves the slowest, while the one beside you gallops.", "From the fish queue at Port Scrivel, where the slowest line was named after a crab.", "I switched lines to escape the queuecreep and the old one sped up instantly.", 0],
["milecrawl", "MILE-krawl", "n.", "The last stretch of a long car journey, where the final mile seems longer than the first hundred.", "From the coachmen of the Fennick Valley, who claimed the last mile always grew in the night.", "The milecrawl to Grandma's house took ages, though we could see her roof.", 0],
["ampmix", "AM-pee-miks", "n.", "Setting your alarm for seven in the evening instead of seven in the morning and waking at noon.", "Clerical error: the Bureau's first alarm clock was set for supper and woke nobody for breakfast.", "Thanks to an ampmix I slept until lunch on the morning of the trip.", 0],
["rushstall", "RUSH-stawl", "n.", "Racing to arrive on time, only to discover that everything has been delayed by an hour.", "From the Lower Wobbleton coach, famous for setting off precisely after its passengers gave up.", "We ran all the way to the station and then sat in a rushstall for forty minutes.", 0],
["holidaytilt", "HOL-ih-day-tilt", "n.", "The way the first half of a holiday crawls slowly and the second half rolls downhill.", "From the hillside farms of Gristlemoor, where every cart moved slow uphill and fast down.", "The holidaytilt meant the first week felt like a month and the second like a day.", 0],
["crossoffery", "kros-OFF-er-ee", "n.", "The delight of crossing off each day on a calendar as an exciting date gets closer.", "From the Bureau's countdown board, which crosses off the days to the next tea delivery.", "My crossoffery for the summer trip has now covered half the kitchen calendar.", 0],
["aftermind", "AF-ter-mynd", "n.", "Remembering an appointment the exact minute it ends.", "From the High Pellish aftermynd, 'a thought that turns up when the guests have gone'.", "My aftermind kicked in at four o'clock, just as the piano lesson finished.", 0],
["preheatience", "pree-HEE-shens", "n.", "The patience needed to wait for an oven to heat up when you are hungry right now.", "From preheat plus patience, as stitched by Madame Ilse Vantablot on her oven glove.", "My preheatience ran out and I ate the pizza half cold.", 0],
["hideycount", "HY-dee-kownt", "n.", "The suspiciously fast count to twenty during hide and seek, done by someone who wants to win.", "From the playground of Lower Wobbleton, where one boy counted to a hundred in three seconds.", "Her hideycount went one, two, skip a few, twenty, coming!", 0],
["dateglance", "DAYT-glans", "n.", "Checking the date on your phone for the fourth time today because it simply refuses to stick.", "From the Bureau's date stamp, which clerks check every hour as if it might have changed.", "I did a dateglance before writing the letter, then forgot it again.", 0],
["endtermish", "END-term-ish", "adj.", "Describing the floppy last week of term, when lessons quietly turn into films, quizzes and games.", "Gristle Cant, from clerks who tidy their desks for a full week before the summer close.", "Everyone was endtermish and the teacher let us play hangman all afternoon.", 0],
["menulimbo", "MEN-yoo-lim-boh", "n.", "The long wait between ordering food and the food arriving, when even the bread basket is empty.", "From the Isle of Umber inn, where meals came so slowly that guests aged visibly.", "We sat in menulimbo so long that my little brother fell asleep in his chair.", 0],
["twiceright", "TWYSS-rite", "adj.", "(Of a broken clock, or a person who guesses) Correct twice a day, entirely by accident, and proud of it.", "From Dr Horatio Quell's famous stopped watch, which he insisted was 'merely patient'.", "The twiceright clock in the hall was correct at ten past four, and we all cheered.", 0]
