// ===== words10.js =====
{
WD.add("weather", [
["doorsplot", "DOR-splot", "n.", "The first raindrop of the day, which waits until the exact second your front door clicks shut behind you.", "Low Frumpish dorsplotte, 'the sky was watching'. Brother Ludo of Gristlemoor noted eleven in one week and stopped going out.", "I had one foot on the step when the doorsplot landed squarely on my glasses.", 0],
["dryspite", "DRY-spite", "n.", "Rain that stops the instant you finally reach shelter, having soaked you all the way there.", "Gristle Cant; clerks arriving drenched at the Bureau would stamp their cards DRY SPITE while the sun came out behind them.", "Forty minutes of downpour, then dryspite the moment I touched the bus shelter.", 0],
["prognosplash", "prog-noh-SPLASH", "n.", "A downpour arriving on a day the forecast promised, with a cheerful little sun icon, would be glorious.", "Coined by Dr Horatio Quell in 1871 after he wore his best linen suit on the strength of a confident almanac.", "The app said sunshine all afternoon; the prognosplash began during the sandwiches.", 0],
["contragust", "KON-truh-gust", "n.", "A wind that blows into your face on the way out and, by some trick, into your face on the way home as well.", "Middle Quellish contra gyst, 'the wind that turns when you turn'. Cyclists of the Fennick Valley curse it by name.", "I cycled into a contragust both ways and arrived home older.", 0],
["glubbet", "GLUB-it", "n.", "A puddle that looks like a shallow film of water and is in fact deep enough to swallow your whole shoe.", "Named for the noise. Port Scrivel fishermen measured glubbets in boots rather than inches.", "I stepped confidently onto the glubbet and lost my left foot to it.", 0],
["perhapsle", "per-HAP-sul", "n.", "Rain so fine that you hold out your palm to check and still cannot honestly say whether it is raining.", "Old Teaspoonic perhapsel, 'the not-quite drizzle'. Ebbe Tannick refused to open his stall in it, or close it.", "We stood in the perhapsle, palms up, arguing about whether to fetch coats.", 0],
["iconflict", "EYE-kon-flikt", "n.", "The disagreement between a sun symbol on your phone and the grey drizzle on the other side of your window.", "A Bureau filing error merged ICON and CONFLICT on one index card in 1998, and nobody could improve on the result.", "The iconflict was settled when I opened the curtains and believed my eyes.", 0],
["umbrasidle", "UM-bruh-sy-dul", "v.", "To shuffle sideways, inch by inch, so as to stay inside the shadow of a lamppost on a scorching day.", "From Vellumese umbra, shade, plus a Lower Wobbleton word for the walk of a crab in no hurry.", "The whole queue umbrasidled around the bus stop pole as the sun moved.", 0],
["dampointment", "damp-OINT-ment", "n.", "Snow that melts the instant it touches the ground, after you have already told everyone it is snowing.", "Fennick Valley children's slang, first recorded on an index card smudged with what appears to be mitten fluff.", "I ran outside with a sledge and found only dampointment and a grey pavement.", 0],
["gustlifter", "GUST-lif-ter", "n.", "A single gust of wind whose only purpose is to take your hat across a car park and under a van.", "Recorded on the Isle of Umber, where hats are tied on and the gustlifter is spoken of as a known thief.", "A gustlifter took my cap and delivered it, with great precision, into the duck pond.", 0],
["boomtally", "BOOM-tal-ee", "n.", "The counting under your breath between lightning and thunder, done with total confidence and no idea of the maths.", "Sub-Arctic Dunnish bumtali, 'counting to the cloud'. Clerk No. 9 is said to reach exactly four every time.", "We did a boomtally of seven and decided, for no real reason, that we were safe.", 0],
["soggrief", "SOG-greef", "n.", "The cold that spreads through one wet sock over the course of a long day, toe by toe, until it owns you.", "Gristlemoor dialect. Brother Ludo wrote it in a margin beside a sermon on patience, then underlined it twice.", "By lunchtime the soggrief had reached my heel and my mood.", 0],
["tressgobble", "TRES-gob-ul", "n.", "A gust that blows your own hair straight into your mouth just as you begin to speak.", "From the poet Mabyn Ostrich-Haye, who lost a recital on a windy pier to one and wrote a furious sonnet about it.", "I began my speech outdoors, got a tressgobble, and finished it chewing.", 0],
["kneebrave", "NEE-brayv", "adj.", "Describing someone who wears shorts on the first slightly warm day of March, against all evidence.", "High Pellish knibraf, 'the boldness of legs'. Ebbe Tannick sold more scarves to kneebrave folk than to anyone else.", "My kneebrave uncle went out in shorts and came back the colour of a radish.", 0],
["cloudscorch", "KLOWD-skorch", "n.", "Sunburn acquired on a grey, overcast day when you were absolutely certain the sun was not involved.", "Coastal Mirrovan clodscorch. Port Scrivel sailors blamed it on 'the sun hiding and biting'.", "It never once looked sunny, yet I came home with a cloudscorch on my nose.", 0],
["skywaffle", "SKY-wof-ul", "n.", "A sky that spends all day looking as though it might rain and never commits to anything.", "Gristle Cant for a clerk who will neither approve nor reject a word, later applied to the weather outside the Smudge Room.", "We cancelled the barbecue because of a skywaffle, and it stayed dry until midnight.", 0],
["drizzlekin", "DRIZ-ul-kin", "n.", "Strangers who become brief, cheerful allies while sheltering together under one shop awning in a downpour.", "Lower Wobbleton usage; the drizzlekin of that town are said to have formed a choir by the third shower.", "Six drizzlekin and a damp dog watched the rain together and parted as friends.", 0],
["pitterlull", "PIT-er-lul", "n.", "The way rain on a bedroom window makes a duvet twice as warm and getting up three times as hard.", "From Old Teaspoonic pitterlul, a word for any sound that makes the eyelids heavy.", "The pitterlull kept me in bed a full hour past my alarm.", 0],
["twirlick", "TWUR-lik", "n.", "A miniature whirlwind in a doorway that spins dead leaves and a crisp packet round and round like a dance troupe.", "Named by Semicolon the Bureau cat, or rather by the clerk who watched Semicolon attack one for twenty minutes.", "A twirlick of leaves circled the doorstep, then collapsed as if embarrassed.", 0],
["bruiselight", "BROOZ-lite", "n.", "The strange yellow-green glow the world takes on just before a big storm breaks.", "Drabble Marshes dialect, where cows lie down when it arrives and farmers follow their example.", "In the bruiselight every house looked like an old photograph.", 0],
["lullbrink", "LUL-brink", "n.", "The eerie moment the wind drops, the birds stop, and everything holds its breath before the storm.", "Middle Quellish lul brync, 'the edge of the hush'. Dr Quell claimed to hear it; colleagues said he was just being quiet.", "During the lullbrink even the washing on the line stopped moving.", 0],
["hailgawk", "HAYL-gawk", "v.", "To rush to the window the instant hail starts, as though a parade were passing.", "From the Isle of Umber, where hail is rare enough that schools pause lessons for a proper hailgawk.", "The whole office hailgawked at the window for ninety seconds, then sat back down.", 0],
["mistranged", "mis-TRAYNJD", "adj.", "Describing a familiar street made unrecognisable by thick fog, so that your own front gate seems foreign.", "A clerical error in the Unword Ledger, where 'mist' and 'strange' were filed on top of each other in damp weather.", "In the morning fog the high street was mistranged, and I walked past my own house.", 0],
["rimescript", "RYME-skript", "n.", "The ferny, curling patterns frost writes on a car window overnight, which look like a message nobody can read.", "Brother Ludo of Gristlemoor tried to translate them for a whole winter and concluded they were mostly complaints.", "I almost felt guilty scraping off the rimescript before work.", 0],
["rimescratch", "RYME-skratch", "v.", "To scrape a frozen windscreen using whatever flat card happens to be in your wallet, and regret it.", "Gristle Cant, from clerks who cleared their windows with expired Bureau library cards.", "I rimescratched a hole the size of a letterbox and drove off peering through it.", 0],
["huffdragon", "HUF-drag-un", "v.", "To blow great clouds of breath on a cold morning while pretending, privately or loudly, to be a dragon.", "Sub-Arctic Dunnish hufdragen. Adults deny doing it, but the Bureau holds signed confessions.", "The children huffdragoned all the way to school and roared at the lollipop lady.", 0],
["squidgefall", "SKWIJ-fawl", "n.", "Snow of exactly the right wetness for snowballs, which arrives perhaps once a decade.", "Fennick Valley usage; the village rings a bell when squidgefall arrives and the school simply gives up.", "It was perfect squidgefall, and by noon the park held an army of snowmen.", 0],
["pristomp", "PRIS-tomp", "v.", "To be the first to stamp across an untouched field of fresh snow, leaving a trail of proud boot prints.", "From Vellumese pristine plus a stomp; Archivist Prudence Nib was famously fond of it until the age of ninety.", "I got up at dawn to pristomp the garden before my brother woke.", 0],
["kerbdrench", "KERB-drench", "n.", "The wave of puddle water flung over you by a passing car that was, you are sure, aiming.", "Port Scrivel dialect. Ebbe Tannick once sold umbrellas held sideways, solely for kerbdrench season.", "A kerbdrench from the number twelve bus soaked me to the waist.", 0],
["nimbonter", "nim-BON-ter", "n.", "The obligatory remark about the weather exchanged with a stranger, which both of you mean sincerely.", "From nimbus and banter, combined by Madame Ilse Vantablot, who claimed most of her customers only ever discussed clouds.", "We shared some nimbonter at the post office and agreed it was turning chilly.", 0],
["buckleburn", "BUK-ul-burn", "n.", "The brand a seatbelt buckle leaves on your arm after the car has sat in hot sunshine all afternoon.", "Coined on a postcard from Mount Ostentle, which reads in full: 'Lovely view. Buckleburn. Never again.'", "I grabbed the seatbelt and got a buckleburn shaped like a little letterbox.", 0],
["layerlag", "LAY-er-lag", "n.", "Being dressed for freezing weather outside while trapped in an overheated train, shop or waiting room.", "Gristle Cant, from clerks bundled in scarves at their desks while the Bureau boiler roared.", "Three stops in, the layerlag had me peeling off a coat, a scarf and most of my patience.", 0],
["flipwind", "FLIP-wind", "n.", "A breeze that turns the page of your book outdoors just as you reach the best sentence.", "Recorded by Mabyn Ostrich-Haye, who claimed a flipwind once finished one of her poems for her.", "A flipwind skipped me forward four chapters and spoiled the ending.", 0],
["dryghost", "DRY-gohst", "n.", "The dry, car-shaped rectangle left on wet tarmac after a parked car drives away.", "From Lower Wobbleton, where children play a game of standing in dryghosts before the rain fills them in.", "When the van left, its dryghost stayed behind on the road for a minute like a shadow.", 0],
["brollysmug", "BROL-ee-smug", "adj.", "Describing the quiet superiority of the one person who remembered an umbrella.", "Gristle Cant. The Bureau has a rubber stamp reading BROLLYSMUG, used chiefly by Clerk No. 9.", "She strolled brollysmug through the downpour while the rest of us sprinted.", 0],
["drylugging", "DRY-lug-ing", "n.", "Carrying an umbrella around all day in case of rain that never once arrives.", "Old Blotvian drilugg, 'the burden of the prepared'. Dr Quell carried one for forty years and was rained on twice.", "After a whole day of drylugging, I left the umbrella on the train and it poured.", 0],
["jacketish", "JAK-it-ish", "adj.", "(Of weather) needing a jacket for exactly half of every hour and being too warm for one the other half.", "High Pellish jaketisc. The Fennick Valley calendar marks most of April as jacketish.", "It was a jacketish afternoon, so I spent it taking my coat on and off.", 0],
["glarewedge", "GLAIR-wej", "n.", "The precise slice of low sun that dodges the car visor, whichever way you angle it.", "Named by a Gristlemoor carter in 1903, who squinted his way into a hedge and filed a complaint with the sky.", "I flipped the visor three ways and the glarewedge found my eyes every time.", 0],
["lashflake", "LASH-flayk", "n.", "A single snowflake that lands on your eyelash and makes you go cross-eyed trying to look at it.", "Proto-Snorrish lasflak. In Sub-Arctic Dunnish folklore a lashflake means good luck, or at least a blink.", "I spent a whole minute admiring a lashflake until it melted into my eye.", 0],
["flakelick", "FLAYK-lik", "v.", "To tip your head back and catch falling snow on your tongue, whatever your age or dignity.", "From the Isle of Umber; their mayor is required by tradition to flakelick at the first snowfall each year.", "Even the headteacher was flakelicking in the playground by lunchtime.", 0],
["palmcast", "PAHM-kast", "n.", "The moment the weather presenter stands exactly in front of the town where you live.", "Coined by viewers in Port Scrivel, which has never once been visible on a weather map.", "Thanks to the palmcast, I still have no idea whether it will rain on us.", 0],
["windfizz", "WIND-fiz", "n.", "The wild, giddy energy that children and dogs acquire on a blustery day.", "Lower Wobbleton teachers coined it; the school there closes the playground when windfizz is forecast.", "The class had windfizz all afternoon and nobody could sit on a chair.", 0],
["aftershine", "AF-ter-shyne", "n.", "Glorious sunshine that appears exactly as the soggy picnic has been packed away.", "From Old Teaspoonic afterscin. Ebbe Tannick claimed to sell picnic blankets that summoned it.", "We drove home in brilliant aftershine, still wet from the park.", 0],
["slantsoak", "SLANT-sohk", "n.", "Rain that arrives sideways, apparently designed by the sky to make umbrellas pointless.", "Drabble Marshes usage, where umbrellas are held like shields and the slantsoak still wins.", "The slantsoak got me from the left while my umbrella guarded the sky.", 0],
["roadbreath", "ROHD-breth", "n.", "The steam that rises off hot tarmac after a summer shower, as though the street is exhaling.", "Coastal Mirrovan rodbreth. Mabyn Ostrich-Haye called it 'the town sighing with relief'.", "We walked home through clouds of roadbreath after the thunderstorm.", 0],
["mulchtrap", "MULCH-trap", "n.", "A crisp-looking pile of autumn leaves that turns out to be slippery wet slime underneath.", "Gristlemoor gardeners' word, often heard shouted as someone vanishes from view.", "I kicked the mulchtrap expecting a crunch and got a squelch up my leg.", 0],
["slumpkin", "SLUMP-kin", "n.", "A snowman on the third day of a thaw, leaning, its carrot nose drooping toward the lawn.", "Fennick Valley children's word, spoken softly and with genuine sorrow.", "By Thursday our proud snowman was a slumpkin with one button left.", 0],
["hedgecast", "HEJ-kast", "n.", "A forecast of sunny spells with a chance of showers and possible wind, which cannot be proven wrong.", "Gristle Cant. Dr Horatio Quell issued only hedgecasts, and was therefore never incorrect.", "The hedgecast covered every possibility, so I packed sunglasses and wellies.", 0],
["towergust", "TOW-er-gust", "n.", "The ferocious wind that lives in the gap between two tall buildings and nowhere else in the city.", "Coined in Port Scrivel, whose one tall building and its neighbour are famous for blowing over pigeons.", "The towergust turned my umbrella and my afternoon inside out.", 0],
["crunchpane", "KRUNCH-payn", "n.", "A thin sheet of ice over a puddle, which exists only so that someone can stamp on it.", "From Sub-Arctic Dunnish krunsheyn. Archivist Nib reportedly halted a carriage to stamp on one.", "I walked to school via every crunchpane on the street and arrived late and delighted.", 0],
["drumroofed", "DRUM-rooft", "adj.", "Describing passengers in a car who fall silent at once when heavy rain starts hammering the roof.", "Coined by Brother Ludo, who found it the only reliable way to end an argument on a long journey.", "We were drumroofed for a full mile, staring out at the downpour.", 0],
["bathrain", "BATH-rayn", "n.", "Summer rain so warm that you stop running from it and simply walk around getting wetter.", "Isle of Umber usage, where children are sent out to play in bathrain instead of having a real bath.", "The bathrain was so mild that we stood in the garden with our arms out.", 0],
["windweep", "WIND-weep", "v.", "To have both eyes stream in a cold wind, so that strangers assume you have had terrible news.", "Old Blotvian windwepen. Ebbe Tannick sold handkerchiefs on the pier to anyone windweeping.", "I was windweeping along the seafront when a kind lady asked if I was all right.", 0],
["pinprain", "PIN-prayn", "n.", "A shower from one cloud so precise that it rains on your garden while next door sunbathes.", "Coined in Gristlemoor, where one particular cloud has followed the same shepherd for decades.", "A pinprain soaked our washing as the neighbours sipped lemonade.", 0],
["pavensol", "PAV-en-sol", "n.", "Sunshine that falls on only one side of the street, always the side you are not walking on.", "From Vellumese pave and sol. Clerks of the Bureau cross the road twice each morning in pursuit of it.", "I crossed for the pavensol, and the shadows immediately swapped sides.", 0],
["leapsplosh", "LEEP-splosh", "n.", "A heroic jump over a puddle that falls just short, landing in the deepest part.", "Lower Wobbleton dialect, where the puddle by the post office has claimed generations of leapsploshes.", "It was a magnificent leapsplosh, and my trousers will never forget it.", 0],
["solsneeze", "SOL-sneez", "n.", "A sneeze triggered by stepping from shade into bright sunlight, as though the sun has tickled you.", "Proto-Snorrish solsnesa. The Proto-Snorrish word for sun and for sneeze may be the same, scholars bicker.", "I stepped out of the cinema into the light and let out a solsneeze.", 0],
["nosecherry", "NOHZ-cher-ee", "n.", "The glowing red nose acquired after ten minutes in a cold wind.", "Fennick Valley usage; their winter carnival awards a prize for the brightest nosecherry.", "We came in from sledging, each of us sporting a glowing nosecherry.", 0],
["brollivert", "BROL-ih-vert", "v.", "To have your umbrella flip inside out in a single gust, leaving you holding a metal tulip in public.", "From Gristle Cant brolly and Vellumese vert, to turn; first filed in 1844 alongside a bent umbrella, still kept in the Vault.", "My umbrella brolliverted on the bridge and I carried it home like a broken flower.", 1],
["glumulus", "GLOOM-yoo-lus", "n.", "The one cloud in an otherwise clear sky that parks in front of the sun the moment you lie down.", "Dr Horatio Quell's attempt at a cloud classification, rejected by real scientists and adopted at once by every beach.", "The glumulus arrived the second I unrolled my towel, and left when I packed it.", 1],
["pegpanic", "PEG-pan-ik", "n.", "The frantic dash outside to grab the washing off the line when the first drops of rain begin.", "From the Drabble Marshes, where an ancient bell is rung for pegpanic and whole villages sprint as one.", "Pegpanic struck, and I ran out in my slippers with sheets over my head.", 1],
["surrendrench", "sur-REN-drench", "n.", "The point at which you are so soaked that you stop hurrying and simply stroll through the rain.", "Coined in 1911 by the poet Mabyn Ostrich-Haye, who said it was the most peaceful moment of her life.", "Halfway home I reached surrendrench and started enjoying myself.", 1],
["prismissed", "priz-MIST", "adj.", "Describing someone who points out a rainbow just as it fades, so nobody else ever sees it.", "Isle of Umber dialect. Islanders say a rainbow is only real if two people see it, so the prismissed are much pitied.", "By the time my sister looked up, I was prismissed and the sky was grey.", 1],
["expectaboom", "ek-SPEK-tuh-boom", "n.", "The thunderclap you were waiting for, counting down to and fully braced for, which makes you jump anyway.", "Clerk No. 9 coined it after spilling tea on the Unword Ledger during a storm; the stain is still there.", "I counted five, the expectaboom came on five, and I still nearly fell off the sofa.", 1],
["kneecast", "NEE-kast", "n.", "A forecast delivered by a grandparent's aching knee, which beats the television for accuracy.", "Old Blotvian knikast. Archivist Prudence Nib trusted her left knee over all printed almanacs, and was rarely wrong.", "Grandad's kneecast said rain by teatime, and the clouds rolled in at half five.", 1],
["dropderby", "DROP-dar-bee", "n.", "The silent race between raindrops down a bus window, on which you have privately bet everything.", "Gristle Cant; filing clerks once ran a betting book on window races until the tea trolley ladies shut it down.", "My raindrop was winning the dropderby until it merged with a rival and vanished.", 1],
["pirouslip", "PEER-oo-slip", "n.", "An unplanned spin on black ice that you convert, mid-fall, into something resembling a dance move.", "From Vellumese pirou, a turn. The Isle of Umber holds a winter contest for the most graceful pirouslip.", "I did a full pirouslip outside the bakery and bowed to make it look deliberate.", 1],
["lurkdrip", "LURK-drip", "n.", "A raindrop that clings to a branch long after the rain stops, waiting specifically for the back of your neck.", "From Gristlemoor, where Brother Ludo wrote that every tree holds 'one drop with a name on it'.", "The sky was clear but a lurkdrip found my collar under the oak.", 1],
["hushwhiff", "HUSH-wif", "n.", "The clean, cold, metallic smell in the air an hour before snow, which the nose knows before the sky admits it.", "Sub-Arctic Dunnish huswif, 'the smell of quiet coming'. Shepherds there are said to bring their flocks in by it.", "I caught a hushwhiff on the walk home and put the sledge by the door.", 1],
["glimpsulus", "GLIMP-syoo-lus", "n.", "A cloud that looks exactly like something, a rabbit, a teapot, your headteacher, for precisely one second. By the time you point it out, it has become a lumpy nothing, and nobody believes you.", "Dr Horatio Quell claimed in 1888 to have seen a cloud shaped like his own profile. He spent three years trying to classify it before the Bureau stamped the card GLIMPSULUS and filed him under UNPROVEN.", "There was a perfect dragon in the sky, but it was only a glimpsulus, and my friend saw a sock.", 2],
["nivigil", "NIV-ih-jil", "n.", "The repeated late-night checking of the window for snow on the eve of a possible snow day. It involves pressing your face to the cold glass, staring at a streetlamp, and deciding every drop of rain might be a flake.", "From Old Blotvian nivu, snow, and vigil. Archivist Prudence Nib kept one each winter as a girl in the Fennick Valley, and wrote that the best nivigils are the ones where you fall asleep at the window and wake to white.", "I kept a nivigil until two in the morning and woke to green grass and a school day.", 2],
["quaddleday", "KWOD-ul-day", "n.", "A single day that manages all four seasons before lunch: frost at breakfast, sunshine at ten, hail at eleven and a sticky heatwave by noon. Nobody is ever dressed correctly for a quaddleday.", "Recorded on the Isle of Umber, whose weather is famously indecisive. The merchant Ebbe Tannick made his fortune there selling a single garment with sleeves, shorts, a hood and a fan, which he called the Quaddle.", "It was a proper quaddleday, so I wore a scarf, sunglasses and wellies and was still wrong.", 2]
]);
}
// ===== words11.js =====
{
WD.add("animals", [
["papersquat", "PAY-per-skwot", "v.", "(Of a cat) to sit precisely on the page, map or newspaper you are trying to read, and nowhere else.", "Gristle Cant. Semicolon, the Bureau cat, has papersquatted on every important document since 1987.", "The cat papersquatted on my homework and began washing a paw.", 0],
["earshirk", "EER-shurk", "v.", "(Of a dog) to go suddenly and completely deaf when called away from a fascinating smell.", "Low Frumpish earscirc, 'the ears gone visiting'. Fennick Valley shepherds have a whistle reserved for it, which is also ignored.", "I shouted his name nine times while he earshirked beside a bin.", 0],
["boxwedge", "BOKS-wej", "v.", "(Of a cat) to fold itself into a box plainly two sizes too small and look deeply satisfied.", "Recorded at Port Scrivel docks, where the harbour cats are said to have boxwedged into a teacup crate.", "She boxwedged into a shoebox and sat there like a disappointed loaf of fur.", 0],
["flopspiral", "FLOP-spy-rul", "n.", "The three slow circles a dog turns before lying down in the exact spot it was already standing.", "Coined by Brother Ludo, who timed his dog's flopspiral at four minutes and recorded it in the margin of a psalm.", "After a long flopspiral, the dog lay down where he had begun.", 0],
["chitterjaw", "CHIT-er-jaw", "n.", "The rattling chatter a cat makes at birds on the other side of a window it cannot get through.", "Middle Quellish chitter-chaw. Dr Horatio Quell insisted it was a dialect of Old Blotvian, and tried to answer.", "The cat kept up a furious chitterjaw at a sparrow, then had a nap.", 0],
["stillbluff", "STIL-bluff", "n.", "A squirrel freezing in the middle of an open lawn, convinced that standing still makes it invisible.", "From the Drabble Marshes, where children play a game of stillbluff and lose to the squirrels.", "The squirrel held its stillbluff even as the dog sniffed past its tail.", 0],
["contritail", "kon-TRY-tayl", "n.", "Ears flat, eyes huge, tail tucked: the posture of a dog sitting beside a chewed slipper it has never seen before.", "Vellumese contritio plus tail. Archivist Prudence Nib forgave nine slippers because of one contritail.", "He gave me the full contritail, and the slipper was forgiven.", 0],
["scuffback", "SKUF-bak", "v.", "(Of a dog) to kick grass and gravel backwards after doing its business, like a footballer celebrating.", "Gristlemoor dialect; the abbey lawn there is famously bald from centuries of scuffbacking.", "Our terrier scuffbacked a shower of gravel all over the neighbour's car.", 0],
["toysnub", "TOY-snub", "n.", "The cat's rejection of an expensive new toy in favour of the bottle cap that came off its packaging.", "Ebbe Tannick coined it after his finest velvet mouse sold to no cat and his string sold to all of them.", "Twenty pounds of feathers, and the toysnub was swift and brutal.", 0],
["kneeprop", "NEE-prop", "v.", "(Of a large dog) to lean its whole weight against your legs as a sign of love and a test of your balance.", "From the Fennick Valley, where wolfhounds kneeprop farmers into hedges out of pure affection.", "The dog kneepropped me so hard I had to grab the fence.", 0],
["dawnheckle", "DAWN-hek-ul", "n.", "A single bird singing at full volume outside your bedroom window at four in the morning, only for you.", "Old Teaspoonic daunheccel. Mabyn Ostrich-Haye wrote it an angry ode and it sang through the reading.", "The dawnheckle began before light and repeated the same three notes until six.", 0],
["blankwatch", "BLANK-wotch", "n.", "A cat staring intently at an empty patch of wall as if something there is about to happen.", "Bureau clerks noticed Semicolon performing blankwatch outside the Smudge Room and declined to investigate.", "The cat kept a blankwatch on the ceiling corner, and now I cannot sleep.", 0],
["chinplead", "CHIN-pleed", "n.", "A dog resting its chin on your knee at dinner, eyes on your fork, saying nothing and everything.", "Coined at a Lower Wobbleton supper in 1910, when a sheepdog's chinplead won a whole sausage.", "The chinplead lasted the entire meal and I gave up my last potato.", 0],
["patchcreep", "PATCH-kreep", "v.", "(Of a cat) to relocate across the floor all afternoon, following a moving square of sunlight.", "Sub-Arctic Dunnish patsakrip, a word for anyone who follows warmth without ever getting up.", "By teatime the cat had patchcreeped from the rug to the bread bin.", 0],
["honkcharge", "HONK-charj", "n.", "The neck-out, wings-wide sprint of a goose that has decided you, personally, are the problem.", "First filed by Clerk No. 9 after a trip to the Isle of Umber, on a card with a footprint on it.", "We fled a honkcharge across the park and left our picnic to the goose.", 0],
["sockheist", "SOK-hyst", "n.", "A dog stealing one sock and running in delighted circles just out of reach.", "Gristle Cant. Clerks say lost Bureau socks are not lost but taken in a sockheist and buried in the yard.", "The sockheist lasted three laps of the garden before I gave up.", 0],
["doordither", "DOR-dith-er", "n.", "A cat crying to be let out, then sitting on the threshold staring at the weather and refusing to choose.", "From the Fennick Valley, where farmhouses are built with double doors purely for doordither.", "Five minutes of doordither later, the cat walked back to the radiator.", 0],
["gamesnort", "GAYM-snort", "n.", "The little sneeze a dog does mid-play to show it is only joking and having a wonderful time.", "Named by a Port Scrivel vet who said it was the dog version of a wink.", "Every growl came with a gamesnort, so we knew he was only playing.", 0],
["cheekhoard", "CHEEK-hord", "v.", "To stuff your cheeks with far more food than fits, like a hamster expecting a long winter.", "Low Frumpish chekhord. Ebbe Tannick's hamster reportedly cheekhoarded a whole biscuit and kept it till Tuesday.", "The hamster cheekhoarded every seed and looked like a furry balloon.", 0],
["nodstep", "NOD-step", "n.", "The head-bobbing walk of a pigeon, as if agreeing with itself enthusiastically at each pace.", "Old Blotvian nodstappe. Dr Quell learnt to walk this way for a lecture on pigeons and could not stop.", "The pigeon did its nodstep all the way up the platform and back.", 0],
["plughaunt", "PLUG-hawnt", "v.", "(Of a spider) to appear in the bath exactly when you want one, and refuse to climb out.", "Middle Quellish plugghaunten. Brother Ludo carried every plughaunting spider outside in a cup he named Mercy.", "A spider was plughaunting the tub, so I had a wash in the sink.", 0],
["panebump", "PAYN-bump", "n.", "A fly's insistence on headbutting the closed half of a window while the other half stands wide open.", "Coined by Archivist Nib, who said panebump explained most of the arguments she had ever witnessed.", "The fly continued its panebump for an hour, an inch from freedom.", 0],
["sipstalk", "SIP-stawk", "v.", "(Of a wasp) to ignore an entire picnic and take a sole interest in the drink you are holding.", "From the Drabble Marshes, where lemonade is drunk from jars with lids because of sipstalking.", "A wasp sipstalked my cup until I gave it away.", 0],
["wailalong", "WAYL-uh-long", "v.", "(Of a dog) to howl along with a passing siren, as though joining a song it knows the words to.", "From Lower Wobbleton, whose dogs are said to wailalong perfectly in tune with the town brass band.", "Every ambulance sets him off and he wailalongs until the street is quiet.", 0],
["pawdough", "PAW-doh", "v.", "(Of a cat) to knead your lap rhythmically with its claws, as if preparing you for the oven.", "Madame Ilse Vantablot's cat pawdoughed an entire batch of drying ink, so the word was stamped in purple.", "She pawdoughed my jumper into a soft, pulled mess and purred.", 0],
["fetchtease", "FECH-teez", "n.", "A dog dropping its ball at your feet and then snatching it back the instant you reach for it.", "Gristle Cant, originally for clerks who offered tea from the trolley and then wandered off with it.", "After the fifth fetchtease, I sat down and he dropped it in my lap.", 0],
["dreamgallop", "DREEM-gal-up", "n.", "The paws twitching and running of a sleeping dog, clearly chasing something enormous in its dreams.", "Recorded by the poet Mabyn Ostrich-Haye, who wrote that her spaniel dreamgalloped 'clean over the moon'.", "The dog had a dreamgallop on the sofa and woofed softly at nothing.", 0],
["keystroll", "KEE-strohl", "n.", "A cat walking slowly across a keyboard and typing a long, confident string of nonsense.", "Named after an index card at the Bureau which reads in full 'jjjjjjjjjj;;;' and is signed by Semicolon.", "The keystroll deleted my essay and added the word 'grrrrrr'.", 0],
["herdtrail", "HURD-trayl", "v.", "(Of cows) to follow you silently along the length of a field fence, staring, as if you owe them money.", "Fennick Valley ramblers' word; local maps mark the fields where herdtrailing is worst.", "Twelve cows herdtrailed us to the stile and watched us climb over.", 0],
["doorjubilee", "DOR-joo-bil-ee", "n.", "A dog's ecstatic welcome after you have been gone for four minutes to put the bins out.", "Coined in Port Scrivel, where sailors' dogs perform the same doorjubilee for a voyage or a stroll to the post.", "I nipped to the car and came back to a full doorjubilee in the hall.", 0],
["poisebluff", "POYZ-bluf", "n.", "A cat that misses a jump, then sits and licks a paw as though it meant to do that all along.", "From Vellumese poise. Semicolon has missed the Bureau filing cabinet daily for six years and performed poisebluff each time.", "She hit the shelf, fell, and gave us a flawless poisebluff from the floor.", 0],
["slimecommute", "SLYME-kom-yoot", "n.", "The great wet-evening migration of snails across the one path you need to walk down.", "Gristlemoor dialect. Brother Ludo used to light a lantern so he would not tread on the slimecommute.", "We tiptoed home through the slimecommute, counting forty snails.", 0],
["breadflotilla", "BRED-flo-til-uh", "n.", "The fleet of ducks that forms the instant anyone on the bank touches a paper bag.", "Coastal Mirrovan usage; the harbourmaster of Port Scrivel once mistook a breadflotilla for an invasion.", "I rustled my bag and a breadflotilla appeared from three directions.", 0],
["washrevolt", "WOSH-ree-vohlt", "n.", "A freshly bathed dog's immediate dash outside to roll in the most interesting thing it can find.", "Lower Wobbleton dialect; the town dog groomer has a sign reading WE ARE NOT RESPONSIBLE FOR WASHREVOLT.", "Ten minutes after shampoo, the washrevolt left him smelling of compost.", 0],
["duvetstalk", "DOO-vay-stawk", "v.", "(Of a cat) to hunt your toes as they move under the covers, pouncing with total commitment.", "Sub-Arctic Dunnish duvestok. In long northern winters, duvetstalking is said to be a cat's main sport.", "I wiggled my feet and the kitten duvetstalked me until midnight.", 0],
["vetyawn", "VET-yawn", "n.", "The huge, nervous yawn a dog gives in the waiting room, which fools nobody into thinking it is relaxed.", "Clerk No. 9 recorded it while waiting with Semicolon for a check-up, and has refused to discuss it since.", "Our spaniel did a vetyawn every time the door opened.", 0],
["mirrorchat", "MIR-er-chat", "n.", "A budgie's long and lively conversation with its own reflection, which never wins an argument.", "From Old Teaspoonic mirrachatte, a word also used for anyone who practises speeches in the bathroom.", "The budgie kept up its mirrorchat all morning and seemed to be winning.", 0],
["irktwitch", "URK-twich", "n.", "The flick at the very tip of a cat's tail that warns the stroking is about to end badly.", "Old Blotvian irkhwic. Archivist Nib said every clerk should learn to read an irktwitch before handling index cards.", "I ignored the irktwitch and got a swat for my trouble.", 0],
["crumbparade", "KRUM-puh-rayd", "n.", "A neat line of ants carrying away a single crumb across the kitchen floor like a royal procession.", "Coined by children in the Fennick Valley, who lay biscuit crumbs on purpose to watch a crumbparade.", "A crumbparade marched under the fridge with half my cereal.", 0],
["nightwoof", "NYTE-woof", "n.", "A single loud bark at three in the morning, at absolutely nothing, followed by peaceful snoring.", "From the Drabble Marshes, whose villagers blame the nightwoof on mist goblins, and the goblins blame the dogs.", "One nightwoof woke the house, and the dog was asleep before we were.", 0],
["trillcome", "TRIL-kum", "n.", "The chirping trill a cat uses to greet you, somewhere between a hello and a question.", "From Middle Quellish trillcuman. The poet Mabyn Ostrich-Haye called it 'a door opening in a cat'.", "She gave me a trillcome from the stairs and trotted down for breakfast.", 0],
["panicflap", "PAN-ik-flap", "n.", "The moment an entire flock of pigeons takes off at once for no reason anyone can see.", "Gristle Cant; the Bureau roof pigeons stage a panicflap every time a rubber stamp is used too loudly.", "A panicflap exploded across the square and then they all landed again.", 0],
["wormtap", "WURM-tap", "n.", "A gull's little stamping dance on wet grass, done to trick worms into surfacing.", "Coastal Mirrovan wurmtap. Port Scrivel children do a wormtap at school discos and call it the Gull.", "Two seagulls did a wormtap on the football pitch at half-time.", 0],
["dawnstare", "DAWN-stair", "n.", "A cat sitting on your chest at five in the morning, staring silently until you wake and feed it.", "Recorded by Brother Ludo, whose cat would dawnstare him awake each day an hour before the bells.", "I opened my eyes to a dawnstare and a whisker in my ear.", 0],
["splatshake", "SPLAT-shayk", "n.", "A wet dog shaking itself dry right next to you, never once in the empty field.", "From the Isle of Umber, where dog owners wear raincoats indoors after walks to survive the splatshake.", "He came out of the lake and saved the splatshake for my new jeans.", 0],
["glasslap", "GLAS-lap", "v.", "(Of a cat) to drink from your glass of water while ignoring its own full bowl.", "Vellumese glaslap. Madame Vantablot kept her ink in glasses and lost three bottles to glasslapping.", "The cat glasslapped my water while I watched, then stared at me.", 0],
["lettucesprint", "LET-iss-sprint", "n.", "The unexpected speed a tortoise finds the instant a lettuce leaf is put down.", "Gristlemoor dialect. Brother Ludo kept a tortoise said to manage a lettucesprint of a yard a minute.", "Grandad's tortoise did a lettucesprint across the patio, stunning us all.", 0],
["lapdeposit", "LAP-dee-poz-it", "n.", "A soggy toy placed on your lap by a dog, always when you are wearing your best clothes.", "Ebbe Tannick coined it in his ledger, writing 'one lapdeposit, value nil, trousers ruined'.", "In the middle of the wedding photos came a lapdeposit, a wet tennis ball.", 0],
["spiteperch", "SPYTE-perch", "v.", "(Of a cat) to choose the lap of the one guest in the room who dislikes cats.", "Old Teaspoonic spitpercan. Dr Quell, who loathed cats, was spiteperched by Semicolon at every Bureau meeting.", "The cat spiteperched on my uncle the moment he said he wasn't a cat person.", 0],
["tankrush", "TANK-rush", "n.", "The thrilling sprint of every fish in a tank to the front glass the moment someone walks past the food tub.", "From Coastal Mirrovan, where fishmongers' children keep goldfish and call the tankrush 'the shoal hello'.", "Even our laziest goldfish joined the tankrush at teatime.", 0],
["twistleap", "TWIST-leep", "n.", "A rabbit's sudden happy leap into the air with a sideways twist, done purely for joy.", "High Pellish twistlep. Fennick Valley hares are said to twistleap on the first day of spring to wake the grass.", "The bunny did a twistleap across the lawn and landed facing backwards.", 0],
["glintpocket", "GLINT-pok-it", "v.", "(Of a crow or magpie) to carry off anything small and shiny you left lying out for one minute.", "Gristle Cant. The Bureau's missing brass paperclips were found in a nest, and the word was filed the same day.", "A magpie glintpocketed my ring pull and flew off looking proud.", 0],
["flumpsigh", "FLUMP-sy", "n.", "A dog's dramatic collapse onto the floor with a long, heavy sigh, as though life were simply too much.", "Lower Wobbleton dialect; their actors study a good flumpsigh before playing a tragic role.", "He gave a flumpsigh when the walk was cancelled and refused to look at me.", 0],
["pawplant", "PAW-plant", "v.", "(Of a dog) to sit down firmly on the pavement and refuse to walk any further in that direction.", "Recorded in the Fennick Valley, where farmers have learned to plan walks round a pawplanting dog.", "Halfway to the vet, she pawplanted and became a very heavy statue.", 0],
["tailorbit", "TAY-lor-bit", "n.", "A puppy's dizzy chase of its own tail, which it has never once caught and never will.", "From Old Blotvian tegelorbe, 'the circle that runs from you'. Dr Quell attempted to calculate its speed and fell over.", "The puppy did a tailorbit until it sat down, astonished, in its own water bowl.", 0],
["pocketnose", "POK-it-nohz", "v.", "(Of a horse) to nudge your coat pockets with its nose in search of hidden treats.", "Mount Ostentle stable slang; riding coats there come with a decoy pocket for pocketnosing ponies.", "The pony pocketnosed me so hard I gave up the apple at once.", 0],
["stepsprawl", "STEP-sprawl", "v.", "(Of a pet) to lie full-length across the busiest doorway in the house, preferably in the dark.", "Gristlemoor usage; the abbey's records list three monks tripped by a stepsprawling hound in one winter.", "The dog stepsprawled at the top of the stairs and I nearly flew.", 0],
["spellperk", "SPEL-perk", "n.", "The ears springing up when a dog learns that you have started spelling W-A-L-K out loud to fool it.", "Coined in Port Scrivel, where families now spell in a second language and the dogs are learning that too.", "I spelled out the word and got a full spellperk from the sofa.", 0],
["lampswoon", "LAMP-swoon", "n.", "A moth's helpless, devoted circling of a light bulb, as if the lamp were the moon and the love of its life.", "Mabyn Ostrich-Haye wrote her finest poem about a lampswoon, then closed the window so the moth could go home.", "A lampswoon kept the moth busy all evening on the porch.", 1],
["waddlestrut", "WOD-ul-strut", "n.", "The supremely confident walk of a duck crossing a road, as if it owns the road and the cars are visiting.", "Low Frumpish wadelstrutte. Lower Wobbleton has a crossing painted in the shape of webbed feet for the waddlestrut.", "Traffic stopped both ways for a single duck's slow waddlestrut.", 1],
["budgeless", "BUJ-liss", "adj.", "(Of a pigeon) declining to move out of your path until the very last step, and then only by one hop.", "Gristle Cant; Bureau clerks claim the pigeons outside the Smudge Room have been budgeless since 1792.", "The pigeon stayed budgeless right up to my shoe, then hopped an inch.", 1],
["querytilt", "KWEER-ee-tilt", "n.", "The sideways head-tilt a dog gives when you say a word it almost understands.", "Dr Horatio Quell believed the querytilt was a dog's attempt at a question mark and spent a year teaching one to write.", "I said 'biscuit?' and got the biggest querytilt of his life.", 1],
["chipsiege", "CHIP-seej", "n.", "A seagull staring at your chips from the railing, patient, unblinking and absolutely certain of victory.", "From Port Scrivel, where benches carry warnings in three languages about the chipsiege.", "The chipsiege ended when the gull swooped and took the biggest one.", 1],
["doorbounty", "DOR-bown-tee", "n.", "A gift left on the doormat by a proud cat, typically a leaf, a sock or a single, damp crisp.", "Brother Ludo listed every doorbounty from the abbey cat in a margin, including one very surprised frog.", "This morning's doorbounty was a glove belonging to someone down the road.", 1],
["blinkvow", "BLINK-vow", "n.", "The long, slow blink a cat gives you, which is the closest it will ever come to saying it loves you.", "Archivist Prudence Nib received a blinkvow from Semicolon's great-grandmother and called it her highest honour.", "After a week of feeding her, the stray gave me a blinkvow.", 1],
["stickjam", "STIK-jam", "n.", "A dog trying to carry a stick that is far wider than the gate, and refusing to drop either end.", "Recorded on Mount Ostentle, where a terrier is said to have brought down a fence in a single stickjam.", "We stood waiting at the gate while the stickjam went on for five minutes.", 1],
["bellytrap", "BEL-ee-trap", "n.", "A cat rolling over to show its fluffy tummy, which is an invitation that ends in claws.", "Old Blotvian beligtrapp. Dr Quell fell for the bellytrap on fourteen recorded occasions.", "I fell for the bellytrap again and now my hand is wrapped in a kitten.", 1],
["wigglewind", "WIG-ul-wynd", "n.", "The rapid back-end wiggle a cat performs before pouncing, like winding up a toy.", "From Gristle Cant; clerks claim to perform their own wigglewind before stamping an especially big pile.", "After a long wigglewind, the kitten pounced and missed the ball by a mile.", 1],
["sniffgazette", "SNIF-guh-zet", "n.", "The morning round of lampposts and gateposts that a dog reads, slowly and in full, like a newspaper.", "Ebbe Tannick claimed his hound could tell the entire week's news of Port Scrivel from its sniffgazette.", "We spent twenty minutes on the sniffgazette and walked about ten yards.", 1],
["topplegaze", "TOP-ul-gayz", "n.", "The act of a cat pushing an object slowly to the edge of a table while looking you straight in the eye. It pauses, waits for you to say no, and then nudges it off anyway. Scientists call it gravity research. Cats call it Tuesday.", "Named by Archivist Prudence Nib in 1792, on the founding day of the Bureau, when the first Bureau cat topplegazed her inkwell onto the very first index card. The splash is still there, and the card reads TOPPLEGAZE in her shaky hand.", "Mid-topplegaze, the cat held my stare and tapped my mug one inch nearer the edge.", 2],
["hallgallop", "HAWL-gal-up", "n.", "A sudden, wild sprint of a pet from one end of the house to the other, usually at midnight, for no reason at all. It involves skidding on rugs, bouncing off the sofa and a sudden stop, followed by casual grooming as if nothing happened.", "From the Drabble Marshes, where old cottages have long straight halls. Locals say the marsh spirits race through at midnight and the cats simply join in. Brother Ludo kept a tally of 312 hallgallops in one year and called them 'little thunderstorms of fur'.", "At midnight the cat did a hallgallop, flattened the rug and fell asleep on the stairs.", 2],
["acornesia", "ay-korn-EE-zhuh", "n.", "A squirrel's habit of burying a nut with great care and secrecy, then forgetting completely where it is. Most of the oak trees in any park are planted this way, by accident, by a very busy and very forgetful gardener.", "Coined by Dr Horatio Quell in 1866 after watching a squirrel bury a hazelnut in his hat. He wrote a long paper on acornesia, then lost the paper. Clerk No. 9 found it ten years later in a flowerpot, beside a hazelnut.", "Thanks to acornesia, there is now a tiny oak growing in our window box.", 2]
]);
}
// ===== words12.js =====
{
WD.add("places", [
["stuffhold", "STUF-hohld", "n.", "The cupboard under the stairs, into which everything is shoved and from which nothing returns without a struggle.", "Gristle Cant; the Bureau's own stuffhold has not been fully opened since a clerk vanished into it in 1931 and emerged in 1932.", "I opened the stuffhold for the hoover and an ironing board fell on me.", 0],
["cushprime", "KUSH-prym", "n.", "The single best seat on the family sofa, which is fought over nightly and never formally owned.", "Low Frumpish kushprim, 'the seat of the elder'. In Lower Wobbleton it is passed down in wills.", "I got up for a drink and lost the cushprime to my little brother.", 0],
["sighchair", "SY-chair", "n.", "The lone chair outside a shop changing room, occupied by someone holding bags and slowly losing hope.", "Coined by Ebbe Tannick, who placed one sighchair outside his fitting room and noticed it was never empty.", "Dad spent an hour on the sighchair holding three coats and a hat.", 0],
["shedback", "SHED-bak", "n.", "The narrow, nettled strip behind the garden shed where broken pots and lost frisbees live forever.", "Fennick Valley dialect. Children there are dared to fetch a ball from the shedback and rarely accept.", "The football went over into the shedback and we agreed to buy another.", 0],
["rucksump", "RUK-sump", "n.", "The very bottom of a rucksack, where crumbs, loose coins and a sticky sweet from last year gather.", "From Sub-Arctic Dunnish rukksump. Mountaineers on Mount Ostentle are said to find whole sandwiches there.", "I reached into the rucksump for my keys and found a raisin from March.", 0],
["almostaisle", "AWL-mohst-ile", "n.", "The supermarket aisle that sells everything closely related to what you need, and never the thing itself.", "Gristle Cant, coined by clerks sent out for string who came back with ribbon, twine and wool.", "I searched the almostaisle for birthday candles and found only napkins and a party hat.", 0],
["tipslab", "TIP-slab", "n.", "The one loose paving stone that rocks under your foot and squirts muddy water up your leg.", "Port Scrivel usage; the harbour's most famous tipslab has its own warning sign and a small fan club.", "I stood on the tipslab and my sock was instantly brown.", 0],
["mustparlour", "MUST-par-ler", "n.", "A waiting room whose magazines are so old that the puzzles have all been done twice and the news is history.", "Coined by Dr Horatio Quell, who once read in a mustparlour of an event he had attended as a child.", "The mustparlour at the dentist still had a calendar from three years ago.", 0],
["guestvault", "GEST-vawlt", "n.", "A spare bedroom so full of boxes, bikes and old lamps that no guest has slept in it in years.", "Lower Wobbleton dialect; locals offer visitors the sofa while apologising for the guestvault.", "We cleared a path through the guestvault but the bed was still buried.", 0],
["loftlands", "LOFT-landz", "n.", "The attic, regarded as a distant unmapped region entered only at Christmas and with a torch.", "From High Pellish loftland. Archivist Nib referred to the Bureau attic as the loftlands and sent clerks up in pairs.", "Dad went up into the loftlands for the decorations and was gone for an hour.", 0],
["humpseat", "HUMP-seet", "n.", "The middle back seat of a car, perched on a bump, where the youngest sibling is always placed.", "Gristlemoor dialect; old carriages there had a humpseat for whichever child had lost the coin toss.", "On the long drive I was in the humpseat with a knee in each ear.", 0],
["wayhalt", "WAY-hawlt", "n.", "A motorway service station at two in the morning, all bright lights and strange quiet, like a dream with a café.", "From Middle Quellish weihalt, a coaching inn. The poet Mabyn Ostrich-Haye wrote her strangest poems in one.", "We stopped at a wayhalt for chips and a toilet and felt like ghosts.", 0],
["postdrift", "POHST-drift", "n.", "The end of the kitchen counter where unopened letters, leaflets and receipts slowly pile up.", "Bureau term for any surface where paper settles; the original postdrift is in the Smudge Room and is two feet high.", "The postdrift was so high that a birthday card from June slid out of it.", 0],
["forgotshelf", "fer-GOT-shelf", "n.", "The back shelf of the fridge, where a single tub of leftovers waits patiently to become an experiment.", "Old Teaspoonic forgotscelf. Clerk No. 9 claims to have discovered a new colour there in 2004.", "Something on the forgotshelf had grown a fur coat.", 0],
["nowheredoor", "NOH-wair-dor", "n.", "A door in an old building that opens onto a solid brick wall, as though the house changed its mind.", "From the Isle of Umber, where builders are said to add a nowheredoor so that bad luck has somewhere to go.", "The hotel had a nowheredoor at the end of the hall, and we dared each other to open it.", 0],
["tidepack", "TYDE-pak", "n.", "The firm, damp strip of sand by the water where you can run fast and build castles that stand up.", "Coastal Mirrovan tidepak; Port Scrivel children race on the tidepack before the sea takes it back.", "We built our castle on the tidepack and the moat filled itself.", 0],
["signalnook", "SIG-nul-nook", "n.", "The one spot in a house, usually halfway up the stairs, where a phone gets any signal at all.", "Coined at a Drabble Marshes cottage, where the whole family stands in the signalnook to read messages.", "Grandma's signalnook is beside the bathroom door, so we queue there.", 0],
["hurrygallery", "HUR-ee-gal-er-ee", "n.", "The room in a museum that everybody walks straight through on the way to the dinosaurs.", "Archivist Prudence Nib's term for the Bureau's own room of Very Minor Words, which nobody ever reads.", "We sped through the hurrygallery full of old teaspoons without stopping.", 0],
["platfringe", "PLAT-frinj", "n.", "The far end of a railway platform past the shelter, where the train is short and never stops.", "Gristle Cant, from clerks who waited at the platfringe and watched the carriages halt fifty yards away.", "We stood at the platfringe and had to sprint for the last door.", 0],
["loomaze", "LOO-mayz", "n.", "The route to the toilets in a restaurant, down two staircases, through a fire door and past the kitchens.", "From the Lower Wobbleton Inn, whose loomaze is so long that guests are given a map with their menu.", "I followed the signs through the loomaze and ended up in the car park.", 0],
["gatehuddle", "GAYT-hud-ul", "n.", "The cluster of grown-ups outside a school gate at home time, exchanging news like a small parliament.", "Fennick Valley usage; the gatehuddle there is said to know about every birthday before the family does.", "Mum vanished into the gatehuddle and I waited on the wall for twenty minutes.", 0],
["shortmyth", "SHORT-mith", "n.", "A route that everyone swears is quicker, which takes ten minutes longer and goes past a bog.", "Old Blotvian scortmyth. Dr Quell led a Bureau outing via a shortmyth and arrived the following morning.", "We took Dad's shortmyth through the woods and missed the start of the film.", 0],
["hushcove", "HUSH-kohv", "n.", "The deepest corner of a library, behind the last shelf, where even your breathing feels too loud.", "Brother Ludo of Gristlemoor wrote that every library has a hushcove and that he had found God in his, or a cat.", "I read three chapters in the hushcove before anyone noticed I was there.", 0],
["sillyard", "SIL-yard", "n.", "The windowsill behind the curtain where dead flies and one ladybird have quietly gathered.", "A pun by Madame Ilse Vantablot, who found her studio sillyard full of insects attracted by the ink.", "I opened the curtains and the sillyard had six new residents.", 0],
["toastcorner", "TOHST-kor-ner", "n.", "The desk next to the radiator, which is warm, sleepy and the most fiercely contested spot in any classroom.", "Gristle Cant; Bureau seniority is measured by distance from the toastcorner.", "I got to school early and claimed the toastcorner for the whole winter.", 0],
["nocarage", "noh-KAR-ij", "n.", "A garage that contains bikes, paint tins, a freezer and boxes, but has never once held a car.", "From a Bureau clerical error, where a smudged index card read GARAGE NO CAR, and the word simply grew.", "We park on the street because the nocarage is full of Christmas decorations.", 0],
["keyaltar", "KEE-awl-ter", "n.", "The little bowl or hook by the front door where keys are meant to live, and occasionally do.", "From Old Teaspoonic keialtar. Archivist Nib kept the Bureau keys in one, and lost them in the Vault.", "I checked the keyaltar three times before finding my keys in the fridge.", 0],
["kickscar", "KIK-skar", "n.", "The bald brown patch of lawn worn away beneath a homemade goal.", "Lower Wobbleton dialect. Their village green has a kickscar that is officially listed as a landmark.", "Every summer the kickscar grows and Dad sighs at the garden.", 0],
["cellardread", "SEL-er-dred", "n.", "The cold stretch of steps down into a cellar, which become longer and darker the later in the evening it is.", "Drabble Marshes cottagers' word; jars of jam are fetched only at noon to avoid the cellardread.", "Nobody would brave the cellardread for the lemonade after dark.", 0],
["coldwing", "KOHLD-wing", "n.", "The one room in any house that stays chilly whatever the heating does, usually the bathroom.", "Sub-Arctic Dunnish koldvinge. Every house in the Fennick Valley is said to have a coldwing, and a jumper hung in it.", "I ran from the shower through the coldwing wrapped in three towels.", 0],
["gatetrek", "GAYT-trek", "n.", "The airport departure gate so far away that you walk past shops, cafés and several time zones to reach it.", "Ebbe Tannick, travelling to Port Scrivel by airship, is said to have complained of a gatetrek of four miles.", "Our gatetrek took twenty minutes and two moving walkways.", 0],
["slopepitch", "SLOHP-pitch", "n.", "A tent pitched on ground that seemed flat in daylight, so that everyone slides into one corner overnight.", "From the camping fields of Mount Ostentle, where every pitch is a slopepitch whether you like it or not.", "We woke up in a heap at the bottom of our slopepitch.", 0],
["dashdark", "DASH-dark", "n.", "The black stretch of garden between the back door and the shed, which must be crossed at a sprint at night.", "Gristlemoor children's word; monks of the abbey are said to have run the dashdark to the woodpile.", "I ran the dashdark for the torch and came back with my heart thumping.", 0],
["skyseat", "SKY-seet", "n.", "The front seat on the top deck of a bus, which makes any passenger feel they are driving it.", "Coined by children in Port Scrivel; the bus company there sells skyseat tickets at double the price.", "I raced upstairs and grabbed the skyseat, steering with an invisible wheel.", 0],
["neckrow", "NEK-roh", "n.", "The front row at the cinema, where you watch the film by staring straight up at the ceiling.", "From Lower Wobbleton's one-screen picture house, whose neckrow was sold at a discount with a neck rub.", "We arrived late and ended up in the neckrow with sore necks.", 0],
["bogpark", "BOG-park", "n.", "A farmer's muddy field pressed into service as a car park for a summer fair, especially after rain.", "Drabble Marshes dialect; locals keep a tractor ready to pull visitors out of the bogpark.", "We spent the day at the show and the evening stuck in the bogpark.", 0],
["gatherhob", "GATH-er-hob", "n.", "The kitchen at any party, where everyone ends up standing while the living room sits empty.", "From Old Teaspoonic gaderhob. Archivist Nib held Bureau parties in the kitchen to save time.", "The music played to an empty room while twenty guests crammed into the gatherhob.", 0],
["laterledge", "LAY-ter-lej", "n.", "The top of a wardrobe or bookshelf where things are put 'just for now' and remain for a decade.", "Brother Ludo's term, from the high shelf of the scriptorium where he placed unfinished margins.", "I found my old school project on the laterledge, covered in dust.", 0],
["tickhall", "TIK-hawl", "n.", "A grandparent's hallway, with a grandfather clock ticking so loudly that the silence seems to have a heartbeat.", "Recorded by the poet Mabyn Ostrich-Haye, who said every tickhall smells faintly of polish and peppermints.", "We crept through the tickhall in our socks so we would not wake anyone.", 0],
["squeezeway", "SKWEEZ-way", "n.", "A country lane just wide enough for one car, where every meeting turns into a slow reversing contest.", "Fennick Valley usage; the lanes there have signs saying SQUEEZEWAY, and drivers who never back down.", "We met a tractor halfway down the squeezeway and reversed a whole mile.", 0],
["bootcache", "BOOT-kash", "n.", "The car boot permanently filled with wellies, an umbrella, a blanket and something nobody remembers buying.", "Gristle Cant, from the travelling clerks who stored spare index cards in their bootcache in case of a sudden new word.", "We couldn't fit the shopping because the bootcache was full of camping chairs.", 0],
["chillpocket", "CHIL-pok-it", "n.", "The patch of icy water in an otherwise warm swimming pool or lake, which follows you around.", "Coastal Mirrovan chilpokat. Isle of Umber swimmers believe the chillpocket is a sulking water sprite.", "I swam straight into a chillpocket and yelped in front of everyone.", 0],
["lampgap", "LAMP-gap", "n.", "The dark section of an evening street exactly halfway between two streetlamps.", "Old Blotvian lampgappe; night watchmen of Gristlemoor sang to themselves while crossing each lampgap.", "I walked faster through the lampgap and slowed down again under the light.", 0],
["zigqueue", "ZIG-kyoo", "n.", "The roped-off zigzag queue where you walk a quarter of a mile to move three metres forward.", "Coined by Ebbe Tannick at a Port Scrivel fair; he claimed the zigqueue tired him more than the rides.", "We zigzagged through the zigqueue and passed the same family eleven times.", 0],
["swingrut", "SWING-rut", "n.", "The bare dip worn into the ground under a swing by years of dragging feet.", "Lower Wobbleton dialect; their oldest swingrut fills with rain and is used by ducks as a pond.", "After the storm the swingrut was a puddle and nobody could swing.", 0],
["drapehaven", "DRAYP-hay-ven", "n.", "The space behind a long curtain where every child believes they are completely invisible, feet and all.", "Archivist Prudence Nib hid in a drapehaven as a girl and overheard the conversation that inspired the Bureau.", "His toes stuck out from the drapehaven, but we pretended not to see.", 0],
["pillowkeep", "PIL-oh-keep", "n.", "A fortress built from sofa cushions and blankets, defended fiercely until teatime.", "From Middle Quellish pilwecepe. The Bureau once declared the clerks' pillowkeep a protected building.", "We spent the whole wet Saturday inside the pillowkeep with a torch.", 0],
["squelchstile", "SKWELCH-style", "n.", "The patch of deep mud that gathers at every field stile and gate, waiting to claim a boot.", "Fennick Valley ramblers' word; their walking club gives a prize for the deepest squelchstile of the year.", "My left boot stayed in the squelchstile while my foot went on alone.", 0],
["creakboard", "KREEK-bord", "n.", "The one floorboard on the landing that creaks loudly whenever you are trying to sneak to the kitchen.", "Gristlemoor dialect; the abbey's creakboard was said to warn the abbot of every midnight snack.", "I stepped over the creakboard, landed on another and woke the whole house.", 0],
["blastporch", "BLAST-porch", "n.", "The doorway of a big shop where a wall of hot air from the heater blows your hair upward as you enter.", "From Sub-Arctic Dunnish blastporsh. Northerners are said to linger in the blastporch all winter.", "We stood in the blastporch for a minute, thawing our fingers.", 0],
["wishbasin", "WISH-bay-sin", "n.", "A town fountain whose floor is paved with coins thrown in for luck by people who now have less money.", "Old Teaspoonic wiscbasin. Port Scrivel's wishbasin is cleaned once a year and pays for the Christmas lights.", "I threw a coin into the wishbasin and wished for a dog.", 0],
["primproom", "PRIMP-room", "n.", "The immaculate front room in someone's house, with plumped cushions nobody is ever allowed to sit on.", "Lower Wobbleton dialect; families there open their primproom only for weddings, funerals and the vicar.", "Grandma took us into the primproom and we sat very still on the edge of the sofa.", 0],
["stairpile", "STAIR-pyle", "n.", "The heap of things on the bottom stair waiting to be carried upstairs by someone, eventually.", "Gristle Cant for the stack of index cards outside the Smudge Room, which the clerks walk past daily.", "The stairpile now had six books, a shoe and a lamp on it.", 0],
["hopestop", "HOHP-stop", "n.", "A bus stop in the middle of nowhere with no timetable, where you wait purely on faith.", "From the Drabble Marshes, where the bus is said to come on Tuesdays, or perhaps in the rain.", "We waited at the hopestop for an hour, then a tractor gave us a lift.", 0],
["slipfence", "SLIP-fens", "n.", "The gap in a fence just big enough for children to squeeze through as a shortcut.", "Fennick Valley usage; farmers there say the slipfence is never mended because it was once their own.", "We wriggled through the slipfence and were at the park in two minutes.", 0],
["murkroom", "MURK-room", "n.", "The windowless meeting room at work that makes every afternoon feel like midnight.", "The Bureau's Smudge Room was nicknamed the murkroom by Clerk No. 9, who had not seen daylight in weeks.", "After three hours in the murkroom I blinked at the sun like a mole.", 0],
["stockvoid", "STOK-voyd", "n.", "The staff-only door into which shop assistants vanish for twenty minutes to check if your size is in.", "Coined by Ebbe Tannick, whose assistant disappeared into the stockvoid in 1879 and came out with a hat.", "She went into the stockvoid to look for my size and we never saw her again.", 0],
["seatcrevasse", "SEET-kruh-vass", "n.", "The narrow slot between a car seat and the handbrake, which swallows phones, coins and chips.", "Gristle Cant; Bureau drivers have rescued three pencils, a stamp and a sandwich from a single seatcrevasse.", "My phone slid into the seatcrevasse and I needed a ruler to get it out.", 0],
["carlimbo", "kar-LIM-boh", "n.", "The section of a huge car park where you are certain you left the car and where it has never been.", "Gristle Cant; the Bureau keeps a jar of keys found in carlimbo by clerks who gave up and took the bus.", "We wandered through carlimbo for half an hour pressing the key fob at random.", 1],
["vestibuffer", "VES-tih-buf-er", "n.", "The glass box between two sets of automatic doors, where you stand for a second, neither inside nor out.", "From Vellumese vestibuf. Dr Quell once stood in a vestibuffer for an hour, unsure whether he was arriving or leaving.", "We stood in the vestibuffer while the second door thought about opening.", 1],
["crumbvalley", "KRUM-val-ee", "n.", "The deep gap down the side of the sofa cushions, containing coins, crumbs, a remote and a hairgrip from 1998.", "Recorded by Semicolon the Bureau cat, or by the clerk who found Semicolon asleep inside one.", "I dug through crumbvalley and found the remote, two coins and a raisin.", 1],
["turnmirage", "TURN-mih-rahzh", "n.", "The turning that the satnav insists is there and which is, in fact, a hedge.", "From High Pellish turnmirag. Ebbe Tannick's maps were famous for turnmirages that led to the sea.", "The satnav sent us down a turnmirage and into a field of surprised cows.", 1],
["neverhall", "NEV-er-hawl", "n.", "A hotel corridor so long and identical that your room seems to move further away with every step.", "Coined by the poet Mabyn Ostrich-Haye after a night in Port Scrivel's grandest hotel, where she walked the neverhall till dawn.", "Room 438 was at the very end of the neverhall, past the ice machine and a lot of carpet.", 1],
["whylanding", "WY-land-ing", "n.", "The top of the stairs, where you arrive with total purpose and immediately forget why you came up.", "Gristlemoor dialect. Brother Ludo built a shelf on his whylanding for notes reminding him what he wanted.", "I stood on the whylanding for a full minute, then went back down for my reason.", 1],
["bedchasm", "BED-kaz-um", "n.", "The narrow, dark gap between the bed and the wall, into which books, socks and phones fall forever.", "Old Blotvian bedcasma. Children of the Fennick Valley are told the bedchasm leads to the Vault of Rejected Words.", "My book slipped into the bedchasm and I had to move the whole bed.", 1],
["hedgevault", "HEJ-vawlt", "n.", "The thick hedge in a neighbour's garden where every lost ball, shuttlecock and frisbee ends its days.", "From Lower Wobbleton, where an annual hedgevault clear-out once produced ninety-three tennis balls and a hat.", "The ball sailed over into the hedgevault and that was the end of the match.", 1],
["foldspot", "FOLD-spot", "n.", "The exact place on a folded paper map where your destination sits, worn into a blank white crease.", "Coined by Archivist Nib on a trip to the Drabble Marshes, where the village she sought lived in a foldspot.", "Our campsite was in the foldspot, so we had to guess which way to go.", 1],
["gropewall", "GROHP-wawl", "n.", "The stretch of wall you pat blindly in the dark for a light switch that is actually on the other side of the door.", "Gristle Cant; the Smudge Room's switch was moved in 1850 and clerks have been patting the gropewall ever since.", "I patted the gropewall for ages before I remembered the switch was outside.", 1],
["loopabout", "LOOP-uh-bowt", "n.", "A roundabout you go all the way around twice because you missed the exit and then missed it again.", "From Port Scrivel, whose harbour roundabout is known locally as the loopabout, and is visited by tourists on purpose.", "We did three laps of the loopabout while Mum read out the signs.", 1],
["missendell", "MIS-en-del", "n.", "The hidden corner of a room where lost things go: single socks, pen lids, the hair bobble you just put down. Nobody can see it, but everything you search for has clearly spent a holiday there before turning up somewhere obvious.", "First described by Archivist Prudence Nib in 1793, after losing the Bureau's first rubber stamp. She found it a year later in plain sight on her own desk and declared that it must have been 'down in the missendell'. Clerks still leave a biscuit there for luck.", "My left glove has been in the missendell since October and will reappear in summer.", 2],
["nullstep", "NUL-step", "n.", "The extra stair at the top of a staircase that your foot is sure exists in the dark, and does not. You stamp down on empty air with full confidence, and your heart arrives at the landing before you do.", "From Proto-Snorrish nulstep, 'the stair of nothing'. Dr Horatio Quell insisted he had counted the Bureau stairs correctly for forty years, and the clerks quietly added a nullstep to the ledger after he fell up them one winter night.", "I hit the nullstep at midnight and my whole body jolted like a dropped spoon.", 2],
["tanglarium", "tang-GLAIR-ee-um", "n.", "The kitchen drawer of mystery cables: chargers for phones nobody owns, wires with a plug at one end and nothing at the other, and one cable that fits everything except what you need. It is never emptied, only added to.", "Named by Clerk No. 9, who opened the Bureau's tanglarium in 1999 to find one charger and was found three days later, calm but changed. The drawer has since been labelled DO NOT FEED and is checked by Semicolon every morning.", "I spent ten minutes untangling the tanglarium and still couldn't find a charger that fitted.", 2]
]);
