"use strict";
// ===== util.js =====
{
const WD = window.WD = window.WD || {};
WD.$ = s => document.querySelector(s);
WD.$$ = s => [...document.querySelectorAll(s)];
WD.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
WD.cap = s => s.charAt(0).toUpperCase() + s.slice(1);
WD.fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
WD.hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
WD.rng = seed => { let a = (typeof seed === 'string' ? WD.hash(seed) : seed) >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
WD.pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
WD.shuffle = (arr, r = Math.random) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => (n < 10 ? '0' : '') + n;
WD.dateStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
WD.today = () => WD.dateStr(new Date());
WD.dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
WD.prettyDate = s => { const [y, m, d] = s.split('-').map(Number); return d + ' ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][m - 1] + ' ' + y; };
WD.store = {
get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
WD.q = new URLSearchParams(location.search);
WD.lev = (a, b) => { const m = a.length, n = b.length, d = []; for (let i = 0; i <= m; i++) { d[i] = [i]; } for (let j = 1; j <= n; j++) d[0][j] = j;
for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[m][n]; };
WD.el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
WD.toast = (html, cls = '') => {
const box = WD.$('#toasts'); if (!box) return; const t = WD.el('<div class="toast ' + cls + '">' + html + '</div>'); box.appendChild(t);
setTimeout(() => t.classList.add('out'), 2600); setTimeout(() => t.remove(), 3200);
while (box.children.length > 4) box.firstChild.remove();
};
WD.copy = async (text) => {
try { await navigator.clipboard.writeText(text); return true; } catch (e) { }

["voxmurk", "VOKS-murk", "n.", "The rising dread of an unplayed voicemail, which could be good news but has never once been good news.", "From Low Frumpish vox-murke, 'a voice left in the dark'; the Bureau files it beside its card on unexpected doorbells.", "Three days of voxmurk later, it turned out to be the dentist confirming a Tuesday.", 0],
["phantread", "FAN-tred", "n.", "The lurch of stepping down onto a stair that is not there, so your whole skeleton briefly files a complaint.", "A clerical error: in 1903 Clerk No. 9 misspelled 'phantom tread' on an index card, and nobody dared correct it.", "I hit the landing with a phantread so violent that I apologised to the carpet.", 0],
["fundlewarm", "FUN-del-worm", "adj.", "Describing the glow of finding forgotten money in a coat you have not worn since last winter.", "From the Fennick Valley dialect fundle, 'to rummage'; locals still call a lucky coat 'a fundler'.", "I pulled a crumpled note from my old anorak and felt fundlewarm for the rest of the week.", 0],
["glossunder", "GLOSS-un-der", "n.", "The deep satisfaction of peeling the protective film off a new gadget in one long, flawless sweep.", "Middle Quellish, 'the shine beneath'; Madame Ilse Vantablot claimed she could hear it from three rooms away.", "She saved the glossunder for last, peeling slowly while the whole family held its breath.", 0],
["handfret", "HAND-fret", "n.", "The panic of searching everywhere for your phone while you are holding it, and ideally also talking on it.", "From Old Blotvian hondfretta, which the Bureau translates as 'the hand that forgets itself'.", "In a full handfret, he checked every pocket using the phone as a torch.", 0],
["chorusbane", "KOR-us-bayn", "n.", "The betrayal of hearing a song you love sold off to advertise mattresses or gravy.", "Coined by Dr Horatio Quell in 1974, who heard his favourite hymn in an advert for a lawnmower and never fully recovered.", "Every advert break brought fresh chorusbane as her teenage anthem sold yet another sofa.", 1],
["dampvindle", "DAMP-vin-del", "n.", "The smug triumph of having brought an umbrella on the one day it actually rains.", "Sub-Arctic Dunnish, roughly 'the vindication of the damp'; Ebbe Tannick carried two umbrellas, for double the effect.", "As the clouds burst, I opened my brolly with the slow dignity of pure dampvindle.", 0],
["verdiglide", "VUR-dee-glide", "n.", "The joy of hitting every green light in a row, as though the town has finally recognised your importance.", "High Pellish verdi, 'green', plus glide; the Bureau keeps a special stamp of it for good mornings.", "Seven lights, seven greens: the bus driver whooped in verdiglide.", 0],
["tonguemoth", "TUNG-moth", "n.", "A word fluttering just behind your teeth that refuses to land, no matter how many times you snap at it.", "Brother Ludo of Gristlemoor drew a moth in the margin whenever a word escaped him; one of his books holds four hundred moths.", "The actor's name hovered as a tonguemoth all through dinner and landed, naturally, at bedtime.", 0],
["gumbrink", "GUM-brink", "n.", "The triumph of finally finding the edge of a roll of sticky tape after a long, fingernail-based search.", "Gristle Cant: Bureau clerks who found the tape-end were 'at the gum brink' and got first pick of the tea trolley.", "After five minutes of scratching I reached gumbrink and wrapped the present in victory.", 0],
["lintglow", "LINT-gloh", "n.", "The bliss of pulling on a jumper still hot from the tumble dryer, like being hugged by the laundry.", "From Coastal Mirrovan lynt-glau, said by fisherfolk warming their sweaters on the stove before a night at sea.", "Soaked from the rain, I dug a hot hoodie out of the dryer and stood there in lintglow.", 0],
["summonfrost", "SUM-un-frost", "n.", "The chill that runs through you when someone says 'Can I have a quick word?' and gives no further detail.", "Archivist Prudence Nib wrote it on her very first index card in 1792, calling it 'the oldest feeling in any office'.", "The teacher's calm 'see me after class' sent summonfrost down every spine in the room.", 1],
["binnistry", "BIN-iss-tree", "n.", "The pride of cramming one more thing into a full bin and somehow still getting the lid shut.", "A mishearing: a Lower Wobbleton dustman said 'it's a bin mystery', and the clerk wrote down what she heard.", "Through pure binnistry he fitted a whole pizza box in and stood back like an architect.", 0],
["plopwail", "PLOP-wayl", "n.", "The grief of watching your ice cream scoop slide off the cone and land face down on a hot pavement.", "Imitative: first the plop of the scoop, then the wail of whoever owned it.", "His plopwail echoed down the promenade while a seagull moved in.", 0],
["snibcalm", "SNIB-kahm", "n.", "The calm that settles over you when a drawer or cupboard closes with one soft, perfect click.", "From Lower Wobbleton snib, 'a latch'; cabinetmakers there test every drawer by ear and a bad one is sent home.", "The new drawer slid shut with such snibcalm that the whole kitchen felt tidier.", 0],
["twinflick", "TWIN-flick", "n.", "The jolt of kinship on spotting a stranger wearing exactly your coat, followed by both of you pretending not to notice.", "From Vellumese twynfliq, 'the glance of the doubled'; Semicolon the Bureau cat feels it about other tabbies.", "We clocked our matching yellow raincoats, shared a twinflick, and stared hard at our shoes.", 0],
["blankstep", "BLANK-step", "n.", "The thrill of being the first to walk across untouched snow, and the guilt that arrives one footprint later.", "Proto-Snorrish blanc-stappa; children on Mount Ostentle race each winter morning to claim the first one.", "I left a single trail of blanksteps across the playing field before anyone else was awake.", 0],
["fernrue", "FERN-roo", "n.", "The guilt of noticing that the houseplant you forgot about has been quietly giving up in the corner.", "A Drabble Marshes word; marsh folk apologise to their plants out loud to ease it, and the plants seem to appreciate it.", "Watering the droopy fern at last, I felt a deep fernrue and promised it a sunnier window.", 0],
["lastgrab", "LAST-grab", "n.", "The fierce delight of getting the final one left on the shelf, plus a sideways look at the person who wanted it.", "Gristle Cant: the last good stapler in the Bureau stationery cupboard was always a lastgrab, and feuds began over it.", "The last box of sparklers was mine, and I carried it to the till radiating lastgrab.", 0],
["buffertrem", "BUF-er-trem", "n.", "The trembling hope of watching a loading wheel spin after you have pressed 'pay' and cannot press anything else.", "Coined in 1999 by Clerk No. 9, who filed it on a card and then stared at the card for some time, waiting.", "I sat frozen in buffertrem until the screen finally said thank you for your order.", 0],
["packmourn", "PAK-morn", "n.", "The heavy heart of packing your suitcase on the last night of a holiday.", "From Low Frumpish pakmurn; the merchant Ebbe Tannick packed so slowly out of packmourn that he missed three ships.", "Sandy socks went in one by one as packmourn settled over the caravan.", 0],
["freebloom", "FREE-bloom", "n.", "The secret joy of plans you were dreading being cancelled by somebody else, so nobody is to blame.", "Middle Quellish frebloma, 'the evening that opens like a flower'.", "When the party was called off, I sat in freebloom with toast and slippers.", 0],
["sockrift", "SOK-rift", "n.", "The particular fury of one lonely sock emerging from the wash with no partner, ever again.", "Old Teaspoonic sokkrift, 'a tear at the seam of the world'; an orphan sock is kept in the Vault of Rejected Words.", "Another sockrift: the green striped one has now been single for a year.", 0],
["gustfright", "GUST-frite", "n.", "The jump you give when a hand dryer roars to life before you were ready, as if it had been lying in wait.", "Imitative of the roar; first logged by a very startled Dr Horatio Quell in 1958.", "The dryer howled and my gustfright sent my scarf flying into the sink.", 0],
["mugtender", "MUG-ten-der", "adj.", "Describing the fierce loyalty you feel towards one chipped old mug, despite owning twelve better ones.", "From the Bureau tea trolley, where each clerk's mug is labelled and nobody has ever been allowed a replacement.", "I feel mugtender about the cracked owl mug and will drink from no other.", 0],
["popwhim", "POP-wim", "n.", "The irresistible urge to pop bubble wrap the moment it is in your hands, whatever else you were meant to be doing.", "Coined in 1956 by a Bureau junior handed a parcel to file, who was found an hour later surrounded by silence.", "Gripped by popwhim, she popped every bubble before opening the actual present.", 0],
["hushwary", "HUSH-wair-ee", "adj.", "Describing the suspicion you feel when a toddler or a puppy has gone completely quiet in another room.", "From the Fennick Valley proverb 'loud is lucky, hush is a warning'.", "Ten minutes of silence made me hushwary, and sure enough, the toddler had found the felt-tips.", 0],
["toldsome", "TOLD-sum", "adj.", "Describing the guilty glee of being proved right after you said it would break and nobody listened.", "Gristle Cant, from 'I told some of them'; Clerk No. 9 is said to have stayed toldsome for an entire decade.", "When the wobbly shelf finally collapsed, Gran was toldsome for the rest of the day.", 0],
["brimstep", "BRIM-step", "n.", "The tense, hunched concentration of carrying a mug filled right to the top across a crowded room.", "From Old Teaspoonic brimmstappe; Teaspoonic monks trained for years to master it, mostly on carpet.", "He made it from kettle to sofa in perfect brimstep without spilling a drop.", 0],
["boonfall", "BOON-fawl", "n.", "The giddy luck of a vending machine dropping two snacks instead of one.", "From Coastal Mirrovan bunfal, 'gift from above', first used for a fish that leaps into your boat by itself.", "Boonfall! Two chocolate bars tumbled down and I looked around for witnesses.", 0],
["glassjolt", "GLASS-jolt", "n.", "The startle of catching your reflection in a shop window and needing a moment to realise that is you.", "Coined in 1888 by Mabyn Ostrich-Haye, who once nodded politely at herself in a draper's window.", "A glassjolt on the high street told me my hair had been sideways all morning.", 0],
["nagdodge", "NAG-dodge", "n.", "The low guilt of clicking 'remind me later' on the same update for the four-hundredth time.", "Gristle Cant; the Unword Ledger has a note in the margin reading 'review later', dated 1834.", "My laptop begged for an update again, and I felt a flicker of nagdodge as I waved it away.", 0],
["gripwarm", "GRIP-worm", "n.", "The melting feeling when a baby wraps its whole hand around one of your fingers and refuses to let go.", "From Proto-Snorrish grippa-warm, a phrase that turns up in the old lullabies of the Isle of Umber.", "My baby cousin grabbed my thumb and I was lost to gripwarm for the afternoon.", 0],
["layoutlorn", "LAY-owt-lorn", "adj.", "Describing the bereft feeling when an update moves all your buttons and the screen you knew by heart is gone.", "Coined at the Bureau in 2009 by a clerk whose filing software rearranged itself overnight; she sobbed in the Smudge Room.", "Grandad has been layoutlorn since the telly got new menus, and he only wanted the weather.", 1],
["jigrage", "JIG-rayj", "n.", "The fury of reaching the end of a thousand-piece jigsaw and discovering a single piece is missing.", "From Middle Quellish jiggeraige; Brother Ludo blamed the abbey cat, who blamed nobody.", "The final gap stared up at us from the table and jigrage filled the room.", 0],
["radioblest", "RAY-dee-oh-blest", "adj.", "Describing the thrill of your favourite song coming on the radio by pure chance, as if it knew you were listening.", "Coastal Mirrovan; lighthouse keepers who caught a beloved shanty on the wireless said they had been radioblest.", "I was radioblest twice on the drive home and sang along both times, badly.", 0],
["lexiblush", "LEK-see-blush", "n.", "The hot embarrassment of discovering you have been mispronouncing a word out loud for years.", "Dr Horatio Quell said 'epi-tome' to lecture halls for thirty years until a student finally corrected him.", "When I heard it said properly on the news, my lexiblush could have toasted bread.", 1],
["endpaperlull", "END-pay-per-lull", "n.", "The quiet, hollow stretch after finishing a great book, when real life seems badly written by comparison.", "Vellumese, from the blank pages at the back of a book; Bureau clerks call the slump 'sitting in the endpapers'.", "I closed the last chapter and drifted through an endpaperlull for two whole days.", 1],
["boxtingle", "BOKS-ting-gel", "n.", "The excitement of opening a parcel even though you ordered it, know exactly what it is, and chose the colour.", "Gristle Cant; parcels at the Bureau are opened ceremonially in the presence of the cat, which helps.", "I knew it was only a phone case, but the boxtingle still had me tearing at the tape.", 0],
["doorhaunt", "DOR-hawnt", "n.", "The nagging certainty, halfway down the road, that you have left something on, open or behind.", "From Old Blotvian dorhaunta, a ghost said to follow people out of their houses whispering 'the iron, the iron'.", "Doorhaunt turned me round at the bus stop, and of course the oven was off.", 1],
["binswish", "BIN-swish", "n.", "The private glory of lobbing rubbish into a bin from across the room and getting it in first time.", "Imitative of the paper landing; Bureau clerks keep a secret tally on the back of the Smudge Room door.", "Nobody saw my binswish from the sofa, which is the eternal tragedy of the binswish.", 0],
["blanknerve", "BLANK-nurv", "n.", "The fear of writing on the first page of a beautiful new notebook in case you spoil it forever.", "Archivist Prudence Nib left the first page of every ledger empty for this reason; the Bureau now owns nine hundred empty first pages.", "Blanknerve kept me out of the new notebook, so I wrote the shopping list on a napkin.", 0],
["sagloon", "SAG-loon", "n.", "The droopy melancholy of a party balloon three days later, hovering at knee height as if it has lost its job.", "A mishearing: a child with a cold dictated 'sad balloon' to the Bureau, and the card has said sagloon ever since.", "The sagloon by the stairs bumped my ankle as if asking whether there were any more parties.", 0],
["snowgrant", "SNOH-grant", "n.", "The wild joy of being told school is closed because of snow.", "From the Fennick Valley, where the headmaster once announced it by ringing the church bell eleven times.", "Snowgrant swept the whole street at seven in the morning and nobody stayed indoors.", 0],
["relicpang", "REL-ik-pang", "n.", "The startled pang of seeing a toy from your own childhood displayed in a museum behind glass.", "Coined in 1971 by Dr Horatio Quell upon finding his boyhood spinning top labelled 'antique'.", "There, under a spotlight, sat my old wind-up robot, and relicpang hit me like a draught.", 1],
["porchtriumph", "PORCH-try-umf", "n.", "The thrill of getting indoors seconds before the rain starts hammering down.", "Mabyn Ostrich-Haye wrote nineteen poems about narrowly escaping showers and gave this one its name.", "The sky opened just as the door clicked shut, and I leaned against it in porchtriumph.", 0],
["labelitch", "LAY-bel-itch", "n.", "The slow-building rage at a clothing label scratching the back of your neck all day long.", "From High Pellish labbelich; the tailors of Port Scrivel cut every label out before selling a shirt, just in case.", "By lunchtime the labelitch was so bad I performed surgery with the office scissors.", 0],
["duegloom", "DYOO-gloom", "n.", "The gloom of a library book falling due when you have not read a single page of it.", "Gristle Cant; the Bureau library stamps overdue books with a small rain cloud instead of a date.", "Duegloom set in as I renewed the novel for the third time.", 0],
["unsavement", "un-SAYV-ment", "n.", "The despair of losing an hour of progress in a game because you forgot to save it.", "Coined in 1997 by Clerk No. 9 after a power cut at the Bureau erased a whole afternoon of filing.", "Unsavement struck when the battery died two steps before the checkpoint.", 0],
["pipswell", "PIP-swell", "n.", "The swelling pride when a seed you planted in a yoghurt pot actually sprouts.", "From Low Frumpish pipswelle; gardeners in Lower Wobbleton announce every new sprout to the whole street.", "One green shoot appeared and the pipswell kept me at the windowsill all morning.", 0],
["gazeprickle", "GAYZ-prik-el", "n.", "The prickly sense that the eyes of a painted portrait are following you round the room.", "From the Bureau's east corridor, where a portrait of Archivist Prudence Nib is said to watch any clerk who leaves early.", "Gazeprickle made me tiptoe the length of the gallery sideways.", 1],
["chillvaunt", "CHIL-vawnt", "n.", "The brave, shrieking rush of jumping into very cold water all at once rather than inch by inch.", "Sub-Arctic Dunnish chilvaunt, 'the boast of the cold'; Dunnish swimmers shout it as they leap.", "I leapt off the jetty in a burst of chillvaunt and instantly regretted my whole life.", 0],
["stalehome", "STAYL-hohm", "n.", "The odd, flat feeling of walking back into your own house after a trip and finding it smells like a stranger's.", "From Coastal Mirrovan staylhom; sailors returning from long voyages said their cottages had 'gone stalehome'.", "After two weeks away, stalehome met us at the door with a faint whiff of cardboard.", 0],
["prodlong", "PROD-long", "n.", "The almost unbearable urge to touch something precisely because a sign says please do not touch.", "Brother Ludo wrote 'do not touch' in the margin of a manuscript; that margin has now been worn clean through.", "Prodlong had my finger hovering over the ancient vase until the guard coughed.", 1],
["chimequicken", "CHIME-kwik-en", "n.", "The heart-jump of hearing the ice cream van's tune from three streets away.", "From Middle Quellish chymequykke; children in Port Scrivel can name every van by its tune alone.", "Chimequicken sent us scrambling down the back of the sofa for coins.", 0],
["letterwarm", "LET-er-worm", "adj.", "Describing the glow of finding an old handwritten note from a grandparent tucked inside a book.", "From Vellumese leterwarma; the Bureau keeps such notes in a drawer that nobody is ever allowed to tidy.", "I found Nana's shopping list inside the recipe book and felt letterwarm all evening.", 0],
["keyfinale", "KEE-fin-ah-lee", "n.", "The weary relief of finding your keys in the very last pocket you check, which is always the last.", "Gristle Cant; Clerk No. 9 holds the Bureau record of eleven pockets before keyfinale.", "Keyfinale arrived in the inside pocket of the jacket I was already wearing.", 0],
["snizzlehang", "SNIZ-el-hang", "n.", "The agony of a sneeze that builds, hovers, and then simply leaves without saying goodbye.", "From Proto-Snorrish snizl, the sound of a nose making plans; scholars suspect Snorrish was mostly sneezes.", "I stood in snizzlehang with my eyes watering and my mouth open like a letterbox.", 1],
["baskgrudge", "BASK-gruj", "n.", "The envy of watching a cat sleep in a sunbeam while you have chores to do.", "Coined at the Bureau, where Semicolon the cat has occupied the only sunny windowsill since 2011.", "Folding laundry, I glared at the snoozing cat with pure baskgrudge.", 0],
["glimpop", "GLIM-pop", "n.", "The brief heartbreak of a soap bubble bursting a moment before your finger reaches it.", "Imitative; children in Lower Wobbleton shout 'glimpop!' as each bubble vanishes, and then 'again!'.", "The biggest bubble of the day drifted close and then glimpopped right under my nose.", 0],
["pricewince", "PRISE-wins", "n.", "The sting of spotting the thing you just bought on sale for less in the very next shop.", "From the account books of Ebbe Tannick, where the margin note 'wince' appears beside half his purchases.", "Pricewince struck two doors down, where the same scarf hung in a bin marked half price.", 0],
["peeplorious", "peep-LOR-ee-us", "adj.", "Describing the dizzy pride of whistling a real note for the first time after weeks of only blowing air.", "A blend of peep and glorious, coined in 1922 by a Fennick Valley shepherd boy whose sheep finally came when he whistled.", "One clear note came out and I felt so peeplorious I whistled at the kettle.", 1],
["heelpride", "HEEL-pride", "n.", "The swelling pride when your dog actually comes back when called, in front of other dog owners.", "From the sheepdog trials of Gristlemoor, where judges score the owner's face as well as the dog.", "Biscuit trotted straight back to me in the park and I nearly burst with heelpride.", 0],
["tiltgasp", "TILT-gasp", "n.", "The half-second of pure terror when you lean back on a chair and it tips one degree too far.", "Middle Quellish tyltegaspe; Brother Ludo recorded it in the margin, in a very shaky hand.", "Mid-tiltgasp I grabbed the desk, and the whole class turned round to watch me land.", 0],
["nomsalve", "NOM-salv", "n.", "The relief of remembering someone's name a split second before you have to say it.", "From Vellumese nomsalve, 'the name that heals'; Bureau receptionists are trained in it for a full year.", "Nomsalve arrived just in time: 'Hello, er, Patricia!' and Patricia beamed.", 0],
["freewhoosh", "FREE-woosh", "n.", "The giddy, loose-limbed feeling of the very first morning of the summer holidays.", "Imitative of a school gate swinging open; Lower Wobbleton children are said to run home faster on that day than any other.", "Freewhoosh carried me out of bed and into the garden in my pyjamas.", 0],
["fridgehonour", "FRIJ-on-er", "n.", "The glow of seeing your drawing stuck on the fridge door, where the whole family has to look at it.", "From the Isle of Umber, where a child's painting on the larder door once counted as a formal award.", "My wonky dinosaur went up under a magnet and I basked in fridgehonour every time someone wanted milk.", 0],
["dwindlehome", "DWIN-del-hohm", "n.", "The strange, tender vertigo of revisiting your old primary school and finding the chairs knee-high, the corridors short and the giant teacher of your memory somehow your own height. Everything is exactly where you left it, only smaller, as if the building has been shrinking without you.", "Coined in 1899 by Archivist Prudence Nib, who returned to her village school in Gristlemoor, sat in her old seat, got stuck, and had to be lifted out by the caretaker. She filed the card that same afternoon, still slightly wedged.", "In the little hall where I once sang in the nativity, a wave of dwindlehome made me sit on a bench built for six-year-olds.", 2],
["arrivelorn", "a-RIVE-lorn", "adj.", "Describing the flat, puzzled feeling of finally getting the thing you counted down to for months, and finding it merely nice. The waiting turns out to have been the fun part, and now the waiting is gone.", "From the logbook of Ebbe Tannick, who waited eleven years for a ship of rare cinnamon. When it docked he sniffed one stick, said 'Ah', and sat on the quay until dark. The Bureau stamped the card in cinnamon-coloured ink in his honour.", "After counting down to my birthday since spring, I sat among the wrapping paper feeling oddly arrivelorn.", 2],
["thalassinkle", "THAL-ass-ink-el", "n.", "The leap in your chest when the sea first appears between two hills on a long car journey. Everyone in the car suddenly sits up straight, and somebody always shouts it first.", "From Coastal Mirrovan thalasinkel, 'the little shout of the sea'. Mirrovan families held a contest every summer, and whoever spotted the sea first rode home in the front seat. The Bureau keeps a list of champions going back to 1810.", "The moment a blue line showed above the hedges, thalassinkle swept the back seat and my brother claimed victory.", 2]
]);
}
// ===== words02.js =====
{
WD.add("social", [
["hehnod", "HEH-nod", "v.", "To laugh along at a joke you did not hear, nodding as if it was the best one all week.", "Imitative of the polite 'heh'; Dr Horatio Quell hehnodded through an entire banquet held in his honour.", "The music was too loud, so I just hehnodded and hoped the joke was not about me.", 0],
["shimblock", "SHIM-block", "n.", "The pavement dance where you and an oncoming stranger both step left, then both step right, then both stop.", "From Middle Quellish shimmeblok; Lower Wobbleton has one lane so narrow that a shimblock once lasted until lunch.", "After our third shimblock, the man bowed and let me pass like a gentleman in a duel.", 0],
["tugblunder", "TUG-blun-der", "n.", "Pushing hard on a door marked PULL while somebody on the other side watches you do it.", "Gristle Cant; the Bureau front door has said PULL since 1792 and has been pushed roughly every eleven minutes since.", "I made a confident tugblunder at the bank and then tried to pretend I was testing the hinges.", 0],
["youtoodle", "YOO-too-del", "v.", "To reply 'you too' to something that does not apply to the other person, such as 'enjoy your film'.", "A clerical error at the Bureau: Clerk No. 9 replied 'you too' to a birthday card and the word was filed out of pity.", "When the cinema usher said enjoy the film, I youtoodled and walked off fast.", 0],
["mumslip", "MUM-slip", "n.", "Calling your teacher 'Mum' in front of the whole class, which nobody will ever let you forget.", "Coined in 1931 by a Gristlemoor schoolmaster who was called Mum so often he started signing reports that way.", "My mumslip in Year 4 is still mentioned at every school reunion.", 0],
["doorjog", "DOR-jog", "n.", "The awkward trot a person must do because you held the door open for them from much too far away.", "From the Fennick Valley, where farm gates are held open for miles and visitors arrive out of breath.", "She spotted me holding the door from the car park and broke into a guilty doorjog.", 0],
["chatterlock", "CHAT-er-lock", "n.", "When two people start talking at once, both stop, both say 'sorry, go on', and then both start again.", "From Low Frumpish chatterlok; one famous chatterlock at the Port Scrivel fish market lasted twenty minutes.", "We fell into a chatterlock so bad that we gave up and texted each other instead.", 0],
["nomfade", "NOM-fayd", "n.", "Forgetting a person's name in the very second after they tell it to you, while still shaking their hand.", "Vellumese nomfada, 'the name that slips like soap'; Bureau visitors now wear badges, just in case.", "Nomfade struck mid-handshake and I called him 'mate' for the rest of the evening.", 0],
["fistbungle", "FIST-bung-gel", "n.", "The tangle when one person goes for a handshake, the other a hug and somebody throws in a fist bump.", "Coined in 2004 by Clerk No. 9, after a very confusing welcome party in the Smudge Room.", "Our fistbungle ended with me holding his elbow, which neither of us mentioned.", 0],
["byeloop", "BYE-loop", "n.", "The stretch at the end of a video call when everyone says bye, waves, and nobody presses the button.", "Gristle Cant; the Bureau's longest byeloop is recorded on an index card as 'forty-one byes, one sneeze'.", "We were stuck in a byeloop until Grandpa's screen froze mid-wave.", 0],
["fineflub", "FINE-flub", "n.", "Answering 'Good, thanks' to a question that was not 'how are you?', such as 'what's the time?'.", "From High Pellish fyneflubbe; Pellish has nine words for 'fine' and none of them answer the question.", "He asked where the toilets were and I gave him a cheery fineflub.", 0],
["busnuzzle", "BUS-nuz-el", "n.", "A stranger choosing to sit right beside you on an otherwise completely empty bus.", "First recorded on the Isle of Umber, which had one bus, forty seats and one very sociable fisherman.", "Thirty empty seats and still a busnuzzle; I stared out of the window until my stop.", 0],
["ascendumb", "a-SEND-um", "adj.", "Describing the silence of strangers in a lift, all watching the floor numbers as though they were a gripping film.", "A clerical error: Clerk No. 9 meant to write 'ascending' but the lift arrived and they forgot how to talk.", "Five of us stood ascendumb all the way to the ninth floor.", 0],
["glowhide", "GLOH-hide", "v.", "To pretend to be busy on your phone so that someone you vaguely know will not stop to chat.", "From Coastal Mirrovan glauhyd, once used for hiding behind a lantern; the principle is unchanged.", "I tried to glowhide by the bus shelter as my old maths teacher strolled past.", 0],
["aislejolt", "ILE-jolt", "n.", "The shock of seeing your teacher in the supermarket, buying normal food like a normal person.", "Coined in 1968 by a Port Scrivel pupil who saw her headmistress buying crisps and had to lie down.", "Aislejolt hit me by the yoghurts when Mr Pike appeared in shorts.", 0],
["clapstrand", "KLAP-strand", "n.", "Being the last person still clapping after everyone else has stopped, alone and echoing.", "Middle Quellish clappestrand; theatres in Port Scrivel once hired someone to clap last on purpose to spare the rest.", "My clapstrand rang out across the silent hall during the head's pause.", 1],
["glanceknot", "GLANS-not", "n.", "Catching the eye of the driver in the next car while they are singing at full volume, and neither of you looking away fast enough.", "From Old Blotvian glanzknota, 'a stare that ties itself'; the Bureau keeps it next to the card for windows.", "At the red light we shared a glanceknot mid-chorus and both pretended to adjust our mirrors.", 0],
["snipfib", "SNIP-fib", "n.", "Telling the hairdresser you love your new haircut when you would like to wear a hat for a month.", "Gristle Cant; Bureau clerks arriving with fresh haircuts are greeted with a kind snipfib by tradition.", "I gave a bright snipfib, tipped well, and pulled up my hood outside.", 0],
["overtell", "oh-ver-TELL", "v.", "To answer a passing 'how are you?' with a full and honest account of your week, your knee and your cousin.", "From Ebbe Tannick, whose ledgers note that one customer overtold so long the ship sailed without them.", "The cashier asked how I was and I began to overtell the whole story of the burst pipe.", 0],
["farewelp", "fair-WELP", "n.", "Saying a proper goodbye to someone and then meeting them again thirty seconds later at the crossing.", "A mishearing: Brother Ludo wrote 'farewell, help' in a margin after the same pilgrim passed his window twice.", "We had a heartfelt hug, then a farewelp at the lights, then a second farewelp at the bus stop.", 0],
["trolleyduel", "TROL-ee-dyoo-el", "n.", "A silent battle of politeness between two shoppers trying to steer past each other in one narrow aisle.", "From Lower Wobbleton, where the market has wheelbarrows and the duels are said to be legendary.", "After a long trolleyduel by the cereal, we both reversed and took the long way round.", 0],
["creepass", "KREEP-ass", "n.", "Overtaking someone on the pavement at almost exactly their speed, so you walk side by side for an age.", "From Sub-Arctic Dunnish krepaas; on Dunnish ice, it can take a whole afternoon to overtake a neighbour.", "My creepass lasted the full length of the high street, both of us staring straight ahead.", 0],
["namefreeze", "NAME-freez", "n.", "Being called by the wrong name for so long that it is now far too late to correct anyone.", "Coined in 1924 by a Bureau clerk named Ada who was called Edith for thirty-two years and simply became Edith.", "Namefreeze means I am still Josh to the man at the corner shop.", 1],
["selfchortle", "self-CHOR-tel", "n.", "Laughing at your own joke when nobody else does, then laughing slightly longer to make up for it.", "From Mabyn Ostrich-Haye, who giggled through her own readings and called it 'applause from the inside'.", "My selfchortle filled the silent kitchen as everyone else kept eating.", 0],
["risemirror", "RIZE-mir-er", "n.", "Standing up to leave at the same time as someone else, then both sitting down again to be polite.", "From Vellumese rysemyrre; Bureau meetings once ran for three extra hours because of a single risemirror.", "A risemirror kept us bobbing up and down at the tea-shop table like pistons.", 0],
["maybewave", "MAY-bee-wave", "n.", "A half-raised hand towards someone across the street you may or may not know, ready to turn into a hair-scratch.", "Gristle Cant; clerks who were not sure if they knew someone would 'maybe-wave' and then file the result.", "My maybewave became a sudden itch behind my ear when they did not wave back.", 0],
["unblessed", "un-BLEST", "adj.", "(Of a sneeze) let off in a quiet room where nobody says anything at all.", "From Brother Ludo, who sneezed in the silent abbey library and recorded the silence in the margin.", "My sneeze echoed round the exam hall, totally unblessed.", 0],
["cheesefreeze", "CHEEZ-freez", "n.", "A smile held so long for a slow photo that it turns into something closer to a grimace.", "Middle Quellish chesefrese; Gristlemoor portrait painters were notorious for asking sitters to hold a smile all day.", "Grandma fiddled with the camera so long that our cheesefreeze curdled.", 0],
["giftflinch", "GIFT-flinch", "n.", "Watching someone unwrap the present you gave them, studying their face for the truth.", "From Ebbe Tannick, who gave everyone a single dried fish and studied their faces very closely.", "Giftflinch gripped me as Auntie Pat lifted out the novelty mug.", 0],
["candlestare", "KAN-del-stair", "n.", "Not knowing what to do with your face while a room sings Happy Birthday at you.", "A Port Scrivel word; local cakes are lit with one hundred candles to give the birthday person something to look at.", "I endured the whole song in candlestare, smiling at a fork.", 1],
["kneeshuffle", "NEE-shuf-el", "n.", "Squeezing along a full row of seats at the cinema, apologising to every pair of knees in turn.", "Gristle Cant, from the narrow benches of the Bureau's annual lecture by Dr Horatio Quell.", "With my popcorn held high, I did a sixteen-person kneeshuffle to the middle seat.", 0],
["storysink", "STOR-ee-sink", "n.", "Realising halfway through telling a story that it is not interesting, and that there is no way out but onwards.", "Coined by Mabyn Ostrich-Haye in 1870 after she began an epic poem about a turnip at a wedding.", "Midway through my tale about the parking ticket, storysink set in and the table went glassy.", 0],
["billfog", "BILL-fog", "n.", "The hush when the bill arrives at a table of friends and everybody studies the ceiling.", "From Coastal Mirrovan bilfog; Mirrovan sailors simply threw the bill overboard and blamed the weather.", "Billfog rolled over the table until Sam finally said 'Shall we just split it?'.", 0],
["nodlock", "NOD-lock", "n.", "Saying 'pardon?' three times, still not hearing, and simply agreeing to whatever it was.", "From Old Blotvian nodlok; Blotvian merchants were known to sell whole cows by nodlock.", "Out of pure nodlock I said 'yes, lovely', and found I had joined the choir.", 0],
["photobumble", "FOH-toh-bum-bel", "v.", "To stroll straight through a stranger's holiday photo just as they press the button.", "Coined in 1952 by a Mount Ostentle tourist who appears, waving apologetically, in nine hundred family albums.", "I photobumbled a whole wedding party on the steps and had to wave sorry to the bride.", 1],
["sorrybounce", "SOR-ee-bounce", "n.", "Saying sorry automatically when somebody else bumps into you.", "From Low Frumpish sorribons; the Frumpish apologise so often that two of them colliding counts as a conversation.", "He stood on my foot and I let out a sorrybounce before I could stop myself.", 0],
["plateorphan", "PLAYT-or-fun", "n.", "The last biscuit on the plate, which everyone wants and nobody dares take.", "Gristle Cant; the Bureau tea trolley has carried the same plateorphan since Tuesday and nobody will touch it.", "The plateorphan sat in the middle of the table while six people discussed the weather.", 0],
["timeflub", "TIME-flub", "n.", "Greeting someone with 'Morning!' at four in the afternoon and having to stand by it.", "From the Isle of Umber, where the ferry is so slow that passengers lose track and wish each other good night at noon.", "My cheery timeflub to the librarian came out at teatime.", 0],
["rimlurk", "RIM-lurk", "v.", "To hover at the edge of a group conversation, smiling, waiting for a gap that never opens.", "From Vellumese rymlurke, said of a moth circling a lamp; the moth, too, never gets a word in.", "I rimlurked by the snack table for ten minutes before going to look at the coats.", 0],
["infantlimbo", "IN-fant-lim-boh", "n.", "Being handed a baby without warning and holding it like a parcel that might go off.", "Coined in 1983 by Dr Horatio Quell, who held his nephew at arm's length for an entire christening.", "In full infantlimbo, I swayed gently and asked the baby about the weather.", 1],
["palmwhiff", "PAHM-wiff", "n.", "A high five that misses completely, leaving two hands waving through empty air in public.", "Imitative of the whoosh; Bureau clerks who palmwhiff must shake hands formally instead.", "Our palmwhiff in front of the whole team ended in a sort of salute.", 0],
["faceflounder", "FACE-flown-der", "n.", "Pretending to remember someone who clearly remembers you, while hunting for any clue as to who they are.", "From the Fennick Valley, where everyone is somebody's cousin and nobody can remember whose.", "In a full faceflounder, I asked how 'the family' was and prayed she had one.", 0],
["retellion", "ree-TEL-yun", "n.", "Telling a story to the very person who told it to you in the first place.", "A clerical error: Clerk No. 9 filed one anecdote twice, and the clerk who wrote it read it back to them.", "I committed full retellion, recounting Dad's own fishing story to Dad.", 0],
["handclash", "HAND-klash", "n.", "Reaching for the same last item on the shelf at exactly the same moment as a stranger.", "Old Teaspoonic handklasse; Teaspoonic monks settled handclashes over the sugar bowl with a coin toss.", "Our handclash over the final loaf ended with both of us saying 'no, you have it'.", 0],
["blinkcaught", "BLINK-kawt", "adj.", "Describing the one face in a group photo that has its eyes shut, which is always yours.", "From Middle Quellish; Gristlemoor's oldest group portrait shows forty monks wide awake and Brother Ludo asleep.", "The best photo from the wedding had me blinkcaught right in the front row.", 0],
["fancylone", "FAN-see-lone", "adj.", "Describing the one person who arrived in fancy dress to a party that turned out not to be fancy dress.", "Coined in 1977 at the Bureau's summer party, when Clerk No. 9 arrived as a giant pencil.", "I spent the evening fancylone, explaining my pirate hat to everyone.", 0],
["whisperboom", "WISP-er-boom", "n.", "A whisper in a silent room that comes out loud enough to reach the back row.", "From the Bureau's reading room, where an echo makes every whisper boom off the ceiling.", "My whisperboom of 'is this the bit where he dies?' carried across the entire theatre.", 0],
["yieldlock", "YEELD-lock", "n.", "Two people at a doorway both insisting 'after you' until neither of you goes anywhere.", "From Old Blotvian yeeldlok; Blotvian courtiers were once found still bowing at a door after a royal visit had ended.", "Yieldlock kept us at the bakery door until the person behind us went through instead.", 0],
["budreply", "BUD-ree-ply", "n.", "Answering a stranger who is actually talking on a hands-free earpiece to somebody else.", "Coined in 2011 by a Bureau clerk who gave a full weather forecast to a man ordering pizza.", "I made an enthusiastic budreply about the bus times before spotting the wire.", 0],
["gratomat", "GRAT-oh-mat", "n.", "Saying thank you to a machine, such as a ticket barrier or self-checkout, and meaning it.", "From High Pellish grato, 'thanks', plus automat; Bureau clerks bow to the photocopier daily.", "My gratomat to the cash machine drew a look from the man behind me.", 0],
["wristsneak", "RIST-sneek", "n.", "A secret check of your watch during a conversation, disguised as a sleeve adjustment.", "Gristle Cant; Bureau meetings with Dr Horatio Quell produced a record forty wristsneaks an hour.", "My wristsneak was spotted, and the story suddenly got three times longer.", 0],
["yeahtrap", "YAH-trap", "n.", "Saying 'yeah' while not really listening and discovering you have agreed to something huge.", "From Low Frumpish yatrappe; Ebbe Tannick yeahtrapped himself into buying a lighthouse.", "One distracted yeahtrap later, I was helping Ben move house on Saturday.", 1],
["falsehail", "FOLS-hayl", "n.", "Greeting a stranger warmly from behind because they have your friend's exact coat and haircut.", "From Port Scrivel, where every fisherman wears the same yellow coat and the same beard.", "I slapped the man on the back in a hearty falsehail and he turned out to be nobody I knew.", 0],
["introfreeze", "IN-troh-freez", "n.", "The blank mind that strikes when asked to 'say something interesting about yourself' to a room.", "Coined at the Bureau's induction day of 1955, where every new clerk said only 'I like toast'.", "In full introfreeze, I told the class my favourite shape was a square.", 1],
["lyricflub", "LIR-ik-flub", "n.", "Belting out the wrong words to a song loudly in public, just as the music cuts out.", "From the Fennick Valley harvest choir, which sang the wrong words for a century because nobody had the sheet music.", "My lyricflub rang out across the silent car park as the radio dropped.", 0],
["swipetrespass", "SWIPE-tres-pass", "n.", "Handing someone your phone to see one photo and watching them swipe on into all the others.", "Gristle Cant; Bureau clerks show each other photographs only through a slot in a locked box.", "Swipetrespass left me lunging across the table as Gran scrolled into last summer.", 1],
["heelclip", "HEEL-klip", "n.", "Stepping on the back of the shoe of the person in front of you in a queue, then hanging back three paces in shame.", "From Middle Quellish heleklippe; Quellish pilgrims walked so close that whole processions ended up barefoot.", "One heelclip in the dinner queue and his shoe came right off.", 0],
["hugoverstay", "HUG-oh-ver-stay", "n.", "A hug that lasts one beat longer than either person expected, so neither knows how to end it.", "From Coastal Mirrovan; sailors' goodbyes once lasted so long that ships left on the next tide instead.", "Our hugoverstay at the station went on long enough for the train doors to beep.", 0],
["rhetoreply", "RET-or-ree-ply", "n.", "Earnestly answering a question nobody wanted answered, such as 'who does he think he is?'.", "Coined by Dr Horatio Quell, who answered every rhetorical question in his own lectures, at length.", "My rhetoreply to 'what is the world coming to?' took several minutes.", 0],
["snackboast", "SNAK-bohst", "n.", "Telling a host 'I'm not hungry', then eating most of the crisps while talking about not being hungry.", "From Old Teaspoonic snakbost; Teaspoonic guests always refused food three times before eating all of it.", "Despite my snackboast at the door, the crisp bowl was empty by nine.", 0],
["queuefudge", "KYOO-fudge", "n.", "Not knowing whether the person standing nearby is in the queue or just standing there.", "Gristle Cant; the queue for the Bureau tea trolley has been fudged since 1802, when a coat stand joined it.", "Queuefudge kept me hovering by the till until the man said he was waiting for his wife.", 0],
["nametagsquint", "NAME-tag-skwint", "n.", "Trying to read someone's name badge without them noticing you looking at their chest.", "From the Bureau's annual conference, where name badges are printed in very small, very fancy writing.", "My nametagsquint was so obvious that she simply said 'It's Carol'.", 0],
["echowave", "EK-oh-wave", "n.", "Waving back at someone across the room who was actually waving at the person behind you.", "Coined in 1920 by Mabyn Ostrich-Haye, who returned a wave from the Duke of Nowhere meant for her maid.", "My echowave froze mid-air, and I turned it into a stretch.", 1],
["outgrinned", "owt-GRIND", "adj.", "Describing the feeling of smiling at someone in a corridor for the third time that day and running out of faces to pull.", "From Low Frumpish; long Frumpish corridors are designed with corners so that nobody need smile more than twice.", "By the fourth pass by the printer, I was totally outgrinned and just raised my eyebrows.", 0],
["sitstutter", "SIT-stut-er", "n.", "The half-crouch of not knowing whether the seat someone is pointing at is for you or the person next to you.", "From the Isle of Umber, where all the chairs are in a circle and nobody is ever told where to sit.", "I hovered in a sitstutter over the chair until the host said 'no, the other one'.", 0],
["lateclatter", "LATE-klat-er", "n.", "Arriving late to a silent room in which every chair, door and coat hook seems to have been made extra noisy.", "Gristle Cant; the Bureau's lecture hall door was oiled in 1950, which somehow made it louder.", "My lateclatter into assembly included a dropped lunchbox and a squeak like a goose.", 0],
["mutetalk", "MYOOT-tawk", "n.", "Speaking passionately for a whole minute on a video call before realising your microphone was off.", "Coined at the Bureau in 2020 by Clerk No. 9, whose finest speech was heard only by Semicolon the cat.", "After a long mutetalk, ten faces mouthed 'you're on mute' at once.", 0],
["menuhover", "MEN-yoo-huv-er", "n.", "Reading a menu while the waiter stands over you, pen poised, so that you panic and order the first thing your eyes land on.", "From Middle Quellish menuhovere; Quellish inns were said to employ waiters who never blinked.", "Under intense menuhover I ordered soup, which I do not even like.", 1],
["solemngiggle", "SOL-em-gig-el", "n.", "A laugh that escapes at exactly the wrong moment, such as during a sad speech, and then refuses to stop.", "Coined in 1907 by Brother Ludo, who got the giggles at a solemn abbey dinner and wrote 'forgive me' in every margin for a month.", "A solemngiggle seized me during the minute's silence and I had to pretend it was hiccups.", 1],
["byewander", "BYE-won-der", "n.", "The slow agony of saying a warm goodbye to someone and then discovering you are both walking in the same direction. You must now either chat all over again, overtake briskly, or pretend to remember an urgent errand down a side street.", "From Gristle Cant. In 1888 two Bureau clerks said goodbye at the front door and walked side by side, in silence, all the way to the same village. They married eleven years later, and the word was stamped at the wedding.", "After our big farewell at the gate came a byewander of four streets, during which we both discussed the clouds.", 2],
["farewellnest", "fair-WELL-nest", "n.", "The long goodbye at the door of a party, where coats go on, keys come out, and somebody begins a fresh conversation in the hallway. A farewellnest can outlast the party itself and has been known to produce whole new friendships.", "Recorded in 1802 by Archivist Prudence Nib, who left a Bureau dinner at nine o'clock and reached her own front door, four houses away, at midnight. She filed the card in her coat, which she was still wearing at breakfast.", "Mum said 'right, we're off' at eight, and the farewellnest kept us on the doorstep until ten.", 2],
["blamecough", "BLAME-koff", "n.", "A fake cough performed to cover a much worse noise, such as a stomach rumble during a silent test. Everyone in the room knows exactly what it is covering, and everyone kindly pretends otherwise.", "From the Drabble Marshes, where the frogs are so loud that locals cough to cover them out of politeness. Brother Ludo described it as 'a lie told with the throat, for the sake of peace'.", "My stomach gurgled in the silent exam, and I covered it with a blamecough that fooled nobody.", 2]
]);
