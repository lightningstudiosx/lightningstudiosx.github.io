{
WD.add("office", [
["replyquake", "ree-PLY-kwayk", "n.", "The cold, rolling shock of realising you have just replied to everyone instead of one person. It begins in the stomach, travels to the fingertips, and ends with you staring at the screen, wondering whether you can simply move to a new country.", "First recorded in 1897, when a Bureau clerk sent a memo about the Archivist's hat to all two hundred staff by mistake. Prudence Nib replied to all as well, with the single word 'noted', and the clerk was not seen at the tea trolley for a year.", "A replyquake shook me the moment I saw two hundred names in the address line.", 2],
["dreadjam", "DRED-jam", "n.", "The uncanny power of a printer to sense a deadline and jam at the exact moment it matters most. The same machine will print a hundred birthday flyers flawlessly at noon, then swallow a single urgent page at 4.59 and flash a light nobody understands.", "Dr Horatio Quell believed printers fed on human panic and wrote a forty-page pamphlet on the subject. The Bureau's printer jammed while printing it, which he considered proof.", "Ten minutes before the interview, the dreadjam struck and my only copy came out folded like a fan.", 2],
["staplestray", "STAY-pel-stray", "n.", "A stapler that belongs to nobody and has been in every department. It drifts from desk to desk, is never returned, and is always found on the desk of whoever needs it least.", "The Bureau's oldest stapler, known as Old Clench, has been officially reported missing 412 times since 1903. It has never left the building, and Clerk No. 9 claims to have seen it moving on its own after dark.", "I asked who owned the staplestray on my desk, and five people said it was theirs and none of them meant it.", 2],
["inkthunk", "INK-thunk", "n.", "The deep satisfaction of bringing a rubber stamp down hard and hearing it land.", "Gristle Cant, from the Bureau's stamping hall, where clerks rate each other's thunks out of ten.", "APPROVED, said the inkthunk, and for one glorious moment I felt like a judge.", 1],
["nibnapped", "NIB-napt", "adj.", "(Of a pen) borrowed by a colleague 'for one second' and never seen again.", "Named after Archivist Prudence Nib, who lost so many pens that she began chaining them to the desk with string.", "My favourite pen was nibnapped during the Monday meeting and I suspect the whole sales team.", 1],
["cellapse", "sel-APS", "n.", "The collapse of an entire spreadsheet into error messages after you change one innocent cell.", "Coined by a Bureau accountant in 1977 who changed a single number and watched the yearly budget turn into a wall of hash signs.", "I fixed one typo and caused a cellapse across fourteen tabs.", 1],
["acronod", "AK-roh-nod", "v.", "To nod knowingly at an acronym you have never heard of, hoping nobody asks you to explain it.", "From Middle Quellish akron, 'a short word with long secrets', and the nod that has been hiding ignorance since meetings began.", "I acronodded through the whole presentation and still don't know what the KPQ is.", 1],
["whirlimbo", "wur-LIM-boh", "n.", "The state of staring at a spinning loading wheel, unable to work and unable to leave.", "A Gristle Cant word from the Bureau's first computer, which spun for so long that clerks began bringing sandwiches to it.", "I was stuck in whirlimbo for ten minutes, holding a cup of tea and growing older.", 1],
["typewich", "TYPE-wich", "n.", "A lunch eaten at your desk with one hand while typing with the other.", "The poet Mabyn Ostrich-Haye wrote an ode to the typewich, which was rejected because it had mayonnaise on it.", "Crumbs from my typewich have now filled the space under the letter K.", 1],
["hoardrobe", "HORD-rohb", "n.", "The secret desk drawer of emergency snacks, kept for long afternoons and sworn to silence.", "A pun by Clerk No. 9, whose hoardrobe is rumoured to contain an entire wheel of cheese.", "When the meeting ran past six, I quietly opened my hoardrobe and shared a biscuit with nobody.", 1],
["funforcement", "fun-FORS-ment", "n.", "Compulsory team fun, such as a quiz night nobody wanted that everyone must attend.", "Recorded in the Unword Ledger beside a 1950 notice reading 'ALL STAFF WILL ENJOY THE PICNIC'.", "The funforcement reached its peak when we were made to wear matching paper hats.", 1],
["mugsignet", "MUG-sig-net", "n.", "The perfect brown ring left by a coffee mug on an important document.", "From the Bureau's Smudge Room, where mugsignets are catalogued by shape and some are thought to be valuable.", "The contract arrived bearing three signatures and one large mugsignet.", 1],
["circlebacker", "SUR-kel-bak-er", "n.", "A colleague who speaks only in office phrases, never saying 'later' when 'circling back offline' is available.", "From a 1990s Bureau memo that used the word 'synergy' nine times and the word 'help' not at all.", "The circlebacker in our team asked to 'take this offline' even though we were already in the car park.", 1],
["convenonsense", "kon-VEEN-non-sens", "n.", "A meeting that could have been a short note, and everyone in the room knows it.", "From 'convene' and 'nonsense', first scrawled on a Bureau whiteboard by an anonymous hand, widely believed to be the cat's.", "After an hour of convenonsense, the conclusion was to have another meeting.", 0],
["mutemime", "MYOOT-mym", "n.", "A person speaking passionately on a video call without realising they are on mute.", "From Coastal Mirrovan, where mime artists were paid by the minute and silence was considered a profession.", "He gave a five-minute mutemime before someone typed 'you're muted' in capital letters.", 0],
["busyclack", "BIZ-ee-klak", "v.", "To type something, anything, very quickly as the boss walks past your desk.", "Imitative; the Bureau's typing pool was said to busyclack in perfect unison whenever the Archivist's boots were heard.", "I busyclacked a whole line of nonsense until her footsteps faded.", 0],
["regardither", "ree-GAR-dith-er", "v.", "To agonise over whether to end an email with 'Kind regards', 'Best wishes' or just your name.", "From 'regards' and 'dither'; Dr Quell is said to have spent a full afternoon on the sign-off to a two-word letter.", "I regardithered for so long that the person rang me instead.", 0],
["notelash", "NOHT-lash", "n.", "A passive-aggressive note stuck to the office fridge about someone's missing milk.", "Gristle Cant, after the famous Bureau note of 1921, written in three colours of ink and underlined eleven times.", "This morning's notelash said 'SOME of us bring our own yoghurt', and nobody made eye contact.", 0],
["greetfog", "GREET-fog", "n.", "The panic of signing a group birthday card for a colleague you have never actually met.", "From the Fennick Valley, where a fog of greetings meant anything vague enough to be said to anyone.", "In the greetfog I wrote 'Have a great one!' and passed it on quickly.", 0],
["swivelate", "SWIV-el-ayt", "v.", "To spin slowly round in an office chair while thinking, or pretending to think.", "Recorded at the Bureau in 1960, the year swivel chairs arrived and productivity fell by half.", "Whenever the work gets hard, I swivelate for a while and look out of the window.", 0],
["autorepine", "aw-toh-ree-PYNE", "n.", "The envy you feel on receiving a colleague's out-of-office reply saying they are on a beach.", "From 'auto-reply' and 'pine'; Ebbe Tannick once sailed home early purely to stop sending them.", "Her message said 'back in two weeks', and I sat in a cloud of autorepine.", 0],
["attachmeant", "uh-TACH-meent", "n.", "An email that says 'please find attached' when nothing at all is attached.", "A clerical joke from the Bureau's post room, where clerks sorted envelopes that were sent completely empty.", "His attachmeant arrived, followed a minute later by 'Oops, here it is'.", 0],
["dialcrawl", "DY-al-krawl", "n.", "The way the final five minutes of a working day take roughly an hour.", "From the Bureau's great clock, which staff believed was secretly slowed down by the Archivist every afternoon.", "Coat on, bag packed, I suffered the dialcrawl from 4.55 to five.", 0],
["keyrubble", "KEE-rub-el", "n.", "The crumbs, hairs and mystery bits that collect underneath your keyboard keys.", "Brother Ludo once found an entire seed growing in his writing desk and named the word after it.", "I tipped up my keyboard and a whole landslide of keyrubble came out.", 0],
["dutigle", "DOO-tig-el", "n.", "The polite laugh you give at the boss's joke, which is not funny and is not your fault.", "From 'dutiful' and 'giggle', recorded at a Bureau dinner where Dr Quell told the same joke for nineteen years.", "His joke about spreadsheets earned a long round of dutigles.", 0],
["perlastic", "per-LAS-tik", "adj.", "Describing an email that is perfectly polite on the surface and quietly furious underneath.", "From the phrase 'as per my last email', which the Bureau classes as a medium-grade insult.", "Her reply was so perlastic that I could feel the heat through the screen.", 0],
["thermostrife", "THUR-moh-stryfe", "n.", "The long, silent office war over the heating dial, fought one small turn at a time.", "From High Pellish thermos, 'warmth', and the strife of anyone sitting next to a window.", "The thermostrife ended when someone hid the dial behind a filing cabinet.", 0],
["droopling", "DROOP-ling", "n.", "The office plant that nobody waters but somehow stays alive, out of stubbornness.", "From the Drabble Marshes, where certain reeds were said to live entirely on gossip.", "The droopling by the window has survived three managers and a flood.", 0],
["roomtangle", "ROOM-tang-el", "n.", "The polite standoff when two teams arrive at the same meeting room at the same time, both with a booking.", "From a Bureau diary of 1934, recording a six-hour roomtangle that ended in a shared tea break.", "We were in the middle of a roomtangle when someone suggested the kitchen.", 0],
["duskinvite", "DUSK-in-vyte", "n.", "A meeting invitation that arrives at five to five on a Friday afternoon.", "Coined by the poet Mabyn Ostrich-Haye, who said 'it falls like the evening, and so does my heart'.", "The duskinvite was for Monday at eight, titled simply 'Quick catch up'.", 0],
["mailberg", "MAYL-burg", "n.", "The enormous pile of unread emails waiting when you return from a holiday, most of it hidden beneath the surface.", "From Sub-Arctic Dunnish berga, 'something huge that sinks ships'.", "I came back from a week away and crashed straight into the mailberg.", 0],
["envelash", "EN-vel-ash", "n.", "A paper cut from the flap of an envelope, which is somehow worse than a wound from anything sharper.", "From Vellumese envela, 'the cover that bites', used by postmen in Port Scrivel for centuries.", "An envelash on my finger made every keyboard key feel like a tiny revenge.", 0],
["printoasty", "print-OHS-tee", "adj.", "Describing paper fresh from the printer, still warm like bread from the oven.", "A favourite word of the Bureau cat Semicolon, who sleeps on warm printouts and refuses to move.", "I held the printoasty pages to my cheek because the office was freezing.", 0],
["drawerjut", "DROR-jut", "n.", "The filing cabinet drawer that refuses to close the last centimetre, no matter how hard you push.", "Low Frumpish jutta, 'to stick out stubbornly', once used of chins as well as furniture.", "I gave the drawerjut a hip-bump and two others flew open.", 0],
["clipdangle", "KLIP-dang-el", "n.", "A long chain of paperclips assembled during a dull phone call.", "The Vault of Rejected Words holds a clipdangle of 4,000 links made during a single call with the tax office.", "By the end of the call my clipdangle reached the floor.", 0],
["waitune", "way-TOON", "n.", "The single tinny tune played on repeat while you wait on hold, which will stay with you for days.", "From 'wait' and 'tune', said to have been hummed by Clerk No. 9 for a whole decade.", "I've heard the waitune so many times that I could play it on the piano.", 0],
["draftorphan", "DRAFT-or-fan", "n.", "A long, careful reply you were typing when someone else answered first, leaving yours pointless.", "Gristle Cant; the Bureau has a drawer full of unsent draftorphans kept purely for sentimental reasons.", "I deleted my draftorphan one sad word at a time.", 0],
["fishwave", "FISH-wayv", "n.", "The act of heating up fish in the office microwave, which every single colleague will remember.", "From Coastal Mirrovan, where fishermen heated lunch on the boat and were never asked to do so indoors.", "After his fishwave, the kitchen had to be closed for an hour.", 0],
["boardfossil", "BORD-fos-il", "n.", "A notice on the office pinboard advertising an event that happened several years ago.", "From the Bureau corridor, where a notice for the 1958 summer dance is still pinned and still hopeful.", "The boardfossil said the bake sale was on Tuesday, but did not say which Tuesday or which decade.", 0],
["inkrelay", "INK-ree-lay", "n.", "A form that must pass through six desks for six signatures before anything can happen.", "Prudence Nib invented the Bureau's first inkrelay in 1795, and it is still on desk four.", "My holiday request is halfway through its inkrelay and I've already missed the holiday.", 0],
["quickchill", "KWIK-chil", "n.", "The sudden dread caused by a message from the boss reading 'Got a quick minute?'", "From Middle Quellish kwikkel, 'a summons that sounds small and isn't'.", "A quickchill ran down my spine, but she only wanted to borrow my charger.", 0],
["clockbolt", "KLOK-bohlt", "v.", "To leave your desk at exactly the stroke of five, coat already on, before anyone can ask you something.", "From the Bureau's evening bell, at which clerks were said to vanish like startled rabbits.", "I clockbolted so quickly that my chair was still spinning.", 0],
["mugtally", "MUG-tal-ee", "n.", "The impossible task of remembering six different tea orders while walking to the kitchen.", "From the tea trolley's ledger, where milk and sugar orders were recorded in a code only one clerk understood.", "Halfway down the corridor, my mugtally fell apart and I made everyone the same.", 0],
["chairdwindle", "CHAIR-dwin-del", "n.", "The slow sinking of an office chair over the day, until your chin is level with the desk.", "From a Bureau complaint card of 1978 reading 'my seat descends as the afternoon descends'.", "By four o'clock the chairdwindle had brought me down to keyboard height.", 0],
["pixelgape", "PIK-sel-gayp", "n.", "The awful frozen face you leave on everyone's screen when a video call drops.", "Gristle Cant, from the Bureau's first video meeting, which ended with the Archivist frozen mid-sneeze.", "I came back to the call to find my pixelgape had been on screen for five minutes.", 0],
["flutternote", "FLUT-er-noht", "n.", "A sticky note that has lost its stick and drifts off your screen at the worst possible moment.", "From Vellumese flutra, 'a leaf in autumn'; the Bureau sweeps up flutternotes every Friday.", "The flutternote with the password on it floated gently into the bin.", 0],
["sendsight", "SEND-syte", "n.", "The way a typo becomes visible only in the exact second after you press send.", "Recorded by Dr Quell, who once signed a letter to a duke 'Yours sincerly' and never recovered.", "My sendsight spotted 'Dear Sir or Madman' a moment too late.", 0],
["fontdawdle", "FONT-daw-del", "v.", "To spend an hour choosing a font for a memo that is only two lines long.", "From the Bureau's signwriting room, where Madame Vantablot once fontdawdled for an entire spring.", "I fontdawdled until lunchtime and then sent it in the default anyway.", 0],
["fluffport", "FLUF-port", "n.", "A weekly progress report padded with long words to hide that nothing has happened.", "From Old Blotvian flufa, 'a pillow', because it is soft and full of air.", "My fluffport described one phone call as 'a significant stakeholder engagement'.", 0],
["apologreet", "uh-POL-oh-greet", "n.", "An opening paragraph that is nothing but apology for replying late, before getting to the point.", "From the letters of Ebbe Tannick, who apologised so much that some of his letters never mentioned business at all.", "His apologreet was three lines long and the actual answer was 'yes'.", 0],
["ringdodge", "RING-doj", "v.", "To stare at a ringing desk phone and hope someone else in the office picks it up.", "Gristle Cant; the Bureau's phone of 1931 rang for nine days before anyone was brave enough.", "The whole team ringdodged until it went to voicemail.", 0],
["unsavening", "un-SAYV-en-ing", "n.", "The heart-stopping moment you realise an hour of work has vanished because you never saved.", "Clerk No. 9 wrote 'the unsavening' on an index card and then lost the card.", "One wrong click caused an unsavening, and I lay face down on my desk.", 0],
["trayhog", "TRAY-hog", "n.", "A colleague who prints a 400-page document just before you need one page.", "From the Bureau print room, where trayhogs are fined one biscuit per hundred pages.", "The trayhog sent the whole manual, so I waited twenty minutes for one ticket.", 0],
["copyfodder", "KOP-ee-fod-er", "n.", "A person copied into an email they will never need to read, just in case.", "From the old Bureau rule that every memo must be copied to the cat.", "I'm copyfodder on forty emails a day and I've opened none of them.", 0],
["drillmingle", "DRIL-ming-el", "n.", "The awkward car-park socialising with colleagues during a fire drill.", "Recorded at the Bureau's first fire drill in 1912, when clerks discovered they did not know each other's faces.", "During the drillmingle, I finally learned the name of the man who sits behind me.", 0],
["idlefright", "EYE-del-fryte", "n.", "The worry that your status has switched to 'away' while you were busy reading a long document.", "From a Bureau rule that any clerk seen motionless for ten minutes must be checked for a pulse.", "In a flash of idlefright I wiggled my mouse and typed a full stop to nobody.", 0],
["doorsnub", "DOR-snub", "n.", "The lift doors closing just as you rush up, while someone inside avoids your eye.", "From Port Scrivel, where ferry captains were said to perform the doorsnub deliberately.", "I got a doorsnub and had to wait for the next lift with my coffee going cold.", 0],
["rattlehope", "RAT-el-hohp", "n.", "The rising joy at hearing the distant rattle of the tea trolley coming down the corridor.", "A Bureau word since 1792, when the trolley was the only reason anyone came in on Mondays.", "A rattlehope swept through the office, and twenty heads turned towards the door.", 0],
["anywhoosh", "EN-ee-woosh", "interj.", "Said brightly to escape a conversation by the coffee machine that has gone on too long.", "Brother Ludo used it to leave sermons early, writing it in the margin with an arrow pointing to the door.", "Anywhoosh, I'd better get back to it, she said, and was gone.", 0],
["hallaprint", "HAL-uh-print", "interj.", "A cry of joy when the printer finally produces the page after ten minutes of flashing lights.", "First shouted by Madame Vantablot in 1969 at a printer that had been jammed since spring.", "Hallaprint! said Sam, holding the warm page above his head.", 0],
["folderly", "FOHL-der-lee", "adv.", "In the purposeful manner of someone walking around the office with a folder, so as to look busy.", "From a Gristle Cant saying: 'carry a folder and no one will ask'.", "He strolled folderly from floor to floor for an hour and did no work at all.", 0],
["pendpile", "PEND-pyle", "n.", "The tower of papers marked 'to be filed' that has become a permanent piece of furniture.", "From the Bureau, where the oldest pendpile is now used as a table by the tea trolley.", "My pendpile got so tall that someone rested their coffee on it.", 0],
["creakshame", "KREEK-shaym", "n.", "The embarrassment of your chair creaking loudly in a silent office, so everyone looks up.", "From Low Frumpish kreka, 'a noise from furniture that belongs to you'.", "Every time I leaned back, a creakshame echoed round the open-plan floor.", 0],
["lightwaggle", "LYTE-wag-el", "v.", "To wave your arms at the ceiling because the motion-sensor lights have decided you have gone home.", "Logged in the Unword Ledger in 2004 by a clerk working late in the Smudge Room in total darkness.", "I sat so still that I had to lightwaggle three times in an hour.", 1],
["falsurgent", "fal-SUR-jent", "adj.", "Describing an email marked urgent that could easily wait until next year.", "From High Pellish falsa, 'a red flag on a calm day'.", "Another falsurgent message arrived, asking if anyone had seen a blue mug.", 0],
["gostopgo", "goh-STOP-goh", "n.", "The polite stammering loop when two people on a call start talking at once, both stop, and both start again.", "Recorded by Dr Quell, who once spent four minutes in a gostopgo with his own echo.", "After the third gostopgo, we agreed to raise our hands like children.", 0],
["lobbified", "LOB-ih-fyde", "adj.", "Stuck in a call's waiting room, wondering if the meeting has started without you.", "From the old Bureau lobby, where visitors once waited so long that a few were hired out of pity.", "I sat lobbified for fifteen minutes before learning the call was tomorrow.", 0],
["keythunder", "KEE-thun-der", "n.", "The thunderous typing of a colleague who presses every key as if it owes them money.", "From the Isle of Umber, where typewriters were built of iron and so were the typists.", "The keythunder from the next desk made my tea ripple like a pond.", 0],
["bandorb", "BAND-orb", "n.", "The huge ball of rubber bands on an old manager's desk, grown one band at a time over decades.", "From the Bureau postmaster's bandorb, which is now so heavy it has its own desk.", "When she retired, the bandorb was carried out like a trophy.", 0],
["slotjuggle", "SLOT-jug-el", "v.", "To move six meetings around a calendar to make room for one more meeting.", "From Coastal Mirrovan jugla, 'to keep fish in the air'.", "I slotjuggled all morning and found a gap of eleven minutes next Thursday.", 0],
["finalmost", "FY-nal-mohst", "n.", "A speaker's 'one final point', which is reliably followed by six more.", "From a famous Bureau lecture by Dr Quell, in which he said 'finally' fourteen times.", "We all reached for our coats at the finalmost, then sat back down.", 0],
["desksquat", "DESK-skwot", "v.", "To borrow someone's desk while they are on holiday and rearrange everything on it.", "Gristle Cant; the Bureau's desks are numbered so that squatters can be traced by their crumbs.", "Somebody desksquatted while I was away and moved my chair two inches to the left.", 0]
]);
}
// ===== words06.js =====
{
WD.add("school", [
["snapdaze", "SNAP-dayz", "n.", "The jolt of being asked a question by the teacher while deep in a daydream. You return to the room to find thirty faces turned towards you, a question you never heard hanging in the air, and nothing in your head but the cloud you were watching.", "Brother Ludo of Gristlemoor was snapdazed by his abbot mid-prayer in 1310 and answered 'seven geese', which was not the question. The phrase 'seven geese' is still muttered in Gristlemoor schools by anyone caught dreaming.", "In my snapdaze I said 'France?', and the teacher said the question had been about fractions.", 2],
["registumble", "REJ-is-tum-bel", "n.", "A substitute teacher's brave and completely wrong attempt at pronouncing a name on the register. The class falls silent, the owner of the name decides whether to correct it, and very often the new name sticks for the rest of the year.", "Named in honour of a Port Scrivel supply teacher of 1888 who read the whole register as if it were in Old Blotvian. Three pupils kept their new names for life, and one became a famous sea captain under his.", "After the registumble, Siobhan answered to 'See-oh-ban' for the whole of Wednesday rather than make a fuss.", 2],
["shavelline", "SHAYV-el-lyne", "n.", "The queue at the pencil sharpener, which is really a social club where news is shared and no pencil is ever in a hurry. Membership requires only a pencil that is not quite blunt.", "Prudence Nib attended a Fennick Valley school where the sharpener was bolted to the far wall. She later admitted that she learned more in the shavelline than in any lesson, and installed one in the Bureau purely for gossip.", "Half the class joined the shavelline the moment the teacher turned to the board.", 2],
["credidler", "KRED-id-ler", "n.", "The member of a group project who says nothing, does nothing, and gets exactly the same mark as everyone else.", "From 'credit' and 'idler', coined by Dr Horatio Quell about a co-author who added only his own name to their book.", "Our credidler turned up for the presentation and pointed at a slide.", 1],
["boardsight", "BORD-syte", "n.", "The mysterious ability of a teacher facing the whiteboard to know exactly who is talking at the back.", "From Sub-Arctic Dunnish, where owls were said to see backwards and teachers were said to be owls.", "Without turning round, she used her boardsight and said, 'Thank you, Marcus.'", 1],
["supplyfib", "suh-PLY-fib", "n.", "A tall tale told to a substitute teacher about what the class is 'normally allowed' to do.", "Gristle Cant, after a 1906 class that convinced a supply teacher they normally had lessons on the roof.", "The best supplyfib was that we always finish early on days with a Y in them.", 1],
["aheadcount", "uh-HED-kownt", "v.", "To count ahead during reading aloud to find and practise your paragraph, then panic when someone reads two.", "From the Isle of Umber, where readers took turns by candlelight and every child secretly counted the candles.", "I aheadcounted carefully, but then Ella read a short bit and I got the word 'rhinoceros'.", 1],
["ludogram", "LOO-doh-gram", "n.", "A doodle that grows slowly across the margin of an exercise book over a whole term.", "Named after Brother Ludo of Gristlemoor, whose margin drawings of dragons are worth more than the books they decorate.", "My history book contains three pages of notes and a ludogram of a castle under siege.", 1],
["canmayhem", "kan-MAY-hem", "n.", "The teacher's reply to 'Can I go to the toilet?', which is 'I don't know, CAN you?'", "Coined by a Lower Wobbleton pupil who waited so long for the grammar lesson to end that he invented a word instead.", "I had no time for canmayhem, so I just said 'May I?' and ran.", 1],
["illwaitude", "il-WAYT-yood", "n.", "The heavy silence after a teacher says 'I'll wait', during which nobody dares to breathe.", "From the 1902 Bureau inspection report of a schoolmistress whose waits were 'longer than some winters'.", "The illwaitude lasted a full minute and the radiator could be heard ticking.", 1],
["mumfusion", "mum-FYOO-zhun", "n.", "The moment of accidentally calling your teacher 'Mum' in front of the whole class.", "From Middle Quellish mumma and the clerkly word fusion, 'two things becoming one by mistake'.", "In a fit of mumfusion I put my hand up and said 'Mum, can I have a tissue?'", 1],
["deskborder", "DESK-bor-der", "n.", "The invisible line down the middle of a shared desk that neither neighbour must cross with an elbow.", "Dr Quell claimed it descended from an ancient Blotvian treaty, but it was in fact drawn in biro by two nine-year-olds.", "His ruler crossed the deskborder and war was declared.", 1],
["glumstick", "GLUM-stik", "n.", "A glue stick that has dried out because someone left the lid off, leaving a crumbly stub of sadness.", "From the Smudge Room, where clerks found so many glumsticks they built a small fort out of them.", "I rubbed the glumstick across the paper and it left nothing but scratches.", 1],
["teamnamery", "TEEM-naym-er-ee", "n.", "The first forty minutes of a group project spent arguing about what to call the group.", "Coined by a teacher in Gristlemoor whose class spent an entire term deciding between 'The Thunderbolts' and 'Team Thunderbolt'.", "After the teamnamery we had five minutes left to make the poster.", 1],
["raisewipe", "RAYZ-wype", "n.", "Raising your hand eagerly with the answer and having it wiped from your mind the moment you are picked.", "From the Fennick Valley proverb 'the hand goes up and the head goes empty'.", "I suffered a total raisewipe and had to pretend I'd been stretching.", 0],
["gnawcap", "NAW-kap", "n.", "A pen lid chewed so flat and ridged that it no longer fits the pen.", "Low Frumpish gnaa, 'to nibble while thinking', of which the Bureau's clerks are world champions.", "He handed me back my pen with a gnawcap, which was not the deal.", 0],
["eraserift", "ee-RAY-zer-rift", "n.", "The hole torn through your page by rubbing out the same wrong answer too many times.", "From a famous 1930s exam paper, displayed in the Vault of Rejected Words, that is mostly hole.", "One more rub and my sum turned into an eraserift.", 0],
["oohchorus", "OO-kor-us", "n.", "The long, delighted 'ooooh' from the whole class when someone is sent out of the room.", "Imitative; the poet Mabyn Ostrich-Haye called it 'the only song every child knows by heart'.", "As the door clicked shut behind him, the oohchorus rose and fell.", 0],
["pageroar", "PAYJ-ror", "n.", "The deafening rustle of turning a page in a silent exam hall.", "From Vellumese paja, 'a leaf', and the Bureau's estimate that a page turned in a quiet room is as loud as a lion.", "My pageroar made the invigilator look up from her book.", 0],
["shortsgrief", "SHORTS-greef", "n.", "Having to wear the spare PE kit from the lost-property box because you forgot your own.", "Recorded in the Drabble Marshes, where the lost-property box was said to be older than the school.", "The shorts were enormous and the shortsgrief lasted all of rounders.", 0],
["marginflate", "MAR-jin-flayt", "v.", "To make an essay look longer by widening the margins, the spacing and the size of every letter.", "Brother Ludo marginflated a copy of a sermon until it filled nine scrolls and one cart.", "I marginflated my homework until three paragraphs filled two whole pages.", 0],
["verbloat", "VER-bloht", "v.", "To pad a piece of writing with words like 'very', 'really' and 'in conclusion' to reach the word count.", "From Old Blotvian verba, 'words', and bloat, 'too many of them'.", "To reach five hundred words, I had to verbloat every single sentence.", 0],
["benchhope", "BENCH-hohp", "n.", "The brave smile kept up on the bench while sports teams are being picked one by one.", "From the Gristlemoor village green, where every child sits on the same old bench and every child has felt it.", "I kept my benchhope until the last name, and then I was the goalkeeper.", 0],
["fibwork", "FIB-wurk", "n.", "An excuse for missing homework so elaborate that it took longer to invent than the homework would have.", "Clerk No. 9 reportedly delivered a fibwork involving a goose, a storm and a stolen bicycle.", "Her fibwork included a burst pipe, a lost cat and a mysterious foreign postman.", 0],
["busscrawl", "BUS-skrawl", "v.", "To finish homework on the bus to school, writing in a wobbly line over every pothole.", "From Port Scrivel, whose cobbled streets produced the bumpiest handwriting in the kingdom.", "I busscrawled the last three answers, and one of them goes off the page.", 0],
["custarmour", "kus-TAR-mer", "n.", "The thick skin on top of a bowl of school custard, strong enough to rest a spoon on.", "A clerical error for 'custard armour' in a Bureau menu, which everyone agreed was more accurate.", "He tapped the custarmour twice before breaking through.", 0],
["notenab", "NOHT-nab", "n.", "The moment a teacher intercepts a note being passed under the desks.", "Gristle Cant; Bureau clerks still fold notes in a special shape designed to survive a notenab.", "There was a notenab just two desks from its target, and the teacher read the word 'banana'.", 0],
["copyfudge", "KOP-ee-fuj", "v.", "To copy a friend's homework while changing just enough words to hope nobody notices.", "From the Isle of Umber, where fudge was made by taking someone else's recipe and adding one nut.", "He copyfudged my answers so badly that he spelled my name at the top.", 0],
["remindling", "ree-MYND-ling", "n.", "The classmate who reminds the teacher that there was supposed to be homework, just as the bell rings.", "From Coastal Mirrovan, where a remindling was the bird that woke fishermen just as they fell asleep.", "We were nearly free, and then the remindling put her hand up.", 0],
["deskboing", "DESK-boyng", "n.", "The twanging noise made by flicking a ruler held over the edge of a desk.", "Imitative; Archivist Nib banned deskboings in the Bureau in 1801, which only made them more popular.", "A deskboing echoed from the back row the moment the teacher left the room.", 0],
["goggleprint", "GOG-el-print", "n.", "The red ring left round your eyes after a science lesson in safety goggles.", "From the laboratory of Madame Vantablot, whose ink experiments left her looking permanently surprised.", "I walked into lunch with a goggleprint like a startled panda.", 0],
["tallyfret", "TAL-ee-fret", "n.", "A teacher's panic on a school trip when the headcount comes out at twenty-nine instead of thirty.", "From the Bureau's annual outing to Mount Ostentle, on which the cat was counted as a pupil every year.", "After a long tallyfret, the missing boy came out of the gift shop holding a pencil.", 0],
["pageecho", "PAYJ-ek-oh", "n.", "The ghostly dents left on the next page when you press too hard with a pen.", "From the Vellumese belief that paper remembers everything written above it.", "The pageecho of my maths notes could be read across three pages of science.", 0],
["spellsweat", "SPEL-swet", "n.", "The panic of standing up to spell a word in front of everyone and forgetting how many Ss it has.", "From the Lower Wobbleton spelling bee of 1874, which ran for two days because nobody could spell Wobbleton.", "Spellsweat struck at 'necessary', and I guessed a lot of letters.", 0],
["calcuflip", "KAL-kyoo-flip", "n.", "The trick of turning a calculator upside down to spell silly words with the numbers.", "Discovered at the Bureau in 1974 by a clerk meant to be doing the accounts, who was not doing the accounts.", "Sami's calcuflip spelled 'HELLO', and the whole table giggled through the maths test.", 0],
["mindsum", "MYND-sum", "n.", "A correct answer worked out in your head that you cannot explain when told to 'show your working'.", "From High Pellish mindsa, 'a thing known but not proven', the subject of many arguments in Mount Ostentle.", "My mindsum was right, but I got no marks because I wrote 'I just knew'.", 0],
["backswoop", "BAK-swoop", "n.", "The heart-stopping lurch when you lean back on two chair legs and nearly go over.", "From the Bureau's famous chair of 1866, which tipped a junior clerk straight into the tea trolley.", "One backswoop was enough to make me keep all four legs down for life.", 0],
["fadetip", "FAYD-tip", "n.", "A felt-tip pen from the class pot that turns out to be dry, so it draws only a faint, scratchy ghost of a line.", "Gristle Cant, from the Bureau's colouring box, which has contained only fadetips since roughly 1990.", "I chose the purple, but it was a fadetip and my sky came out grey.", 0],
["grimacheese", "GRIM-uh-cheez", "n.", "The stiff, strange smile produced for a school photograph when the photographer says 'say cheese'.", "From 'grimace' and 'cheese', coined by a Fennick Valley photographer who said nobody had smiled properly in thirty years.", "In every one of my school photos I am wearing a grimacheese.", 0],
["corridoom", "KOR-ih-doom", "n.", "The long, slow wait on the chair outside the head teacher's office.", "From the Bureau's first corridor, where clerks waited for the Archivist's verdict on their spelling.", "I sat in corridoom for ten minutes, swinging my feet and rehearsing my side of the story.", 0],
["revisprint", "REV-iz-print", "v.", "To revise an entire term's work in a frantic rush the night before the test.", "Dr Quell revisprinted for his own examinations and later claimed it was a deliberate method.", "I revisprinted until midnight and dreamed about volcanoes.", 0],
["lockerfog", "LOK-er-fog", "n.", "Forgetting your locker combination the instant you stand in front of it.", "From Sub-Arctic Dunnish lokka, 'a box that hates you', said of sea chests with rusty clasps.", "Lockerfog left me spinning the dial and guessing birthdays.", 0],
["strapswagger", "STRAP-swag-er", "n.", "The cool, careless walk of a pupil wearing their school bag on just one shoulder.", "Recorded in Port Scrivel in 1955, when a whole year group copied one boy's lopsided walk.", "His strapswagger lasted until the bag slid off into a puddle.", 0],
["bellpack", "BEL-pak", "v.", "To start packing your bag noisily five minutes before the bell, as a hint.", "From the Bureau's evening bell, which clerks began bellpacking for as early as noon.", "The whole class bellpacked until the teacher said the bell does not dismiss you.", 0],
["glowsmother", "GLOH-smuth-er", "v.", "To highlight so much of a textbook page that it turns completely yellow and nothing stands out.", "Madame Ilse Vantablot invented a glowing ink and then watched her students glowsmother everything she owned.", "I glowsmothered the whole chapter, so now none of it matters more than the rest.", 0],
["armprop", "ARM-prop", "v.", "To hold up your raised arm with your other hand because you have been waiting so long to be picked.", "From the Isle of Umber, where farmers armprop their tall sunflowers with sticks.", "I armpropped for five minutes and the question had moved on twice.", 0],
["lunchbarter", "LUNCH-bar-ter", "v.", "To trade items from your packed lunch at the table like a seasoned market trader.", "From the merchant Ebbe Tannick, who claimed he learned his whole trade swapping apples at school.", "I lunchbartered my apple and two crackers for a single chocolate biscuit.", 0],
["lastscrawl", "LAST-skrawl", "n.", "The frantic final word scribbled after the teacher has already said 'pens down'.", "Gristle Cant, from the Bureau's exams, where lastscrawls are marked separately and with sympathy.", "My lastscrawl was the word 'because', and then the paper was gone.", 0],
["hushwise", "HUSH-wyze", "adj.", "Describing a pupil who knew the answer all along but never put a hand up.", "From Old Teaspoonic hussa, 'the quiet one at the bottom of the cup', where the best of the sugar collects.", "The hushwise girl by the window gets full marks every test and never says a word.", 0],
["palmscribe", "PALM-skryb", "v.", "To write a reminder on the back of your hand in pen, which will be gone or blurred by lunch.", "From a Fennick Valley custom of writing shopping lists on the hand, then forgetting what 'eggs?' meant.", "I palmscribed 'BRING PE KIT' and then washed my hands.", 0],
["reporthedge", "ree-PORT-hej", "v.", "To delay giving your parents your school report until after dinner, when they are in a good mood.", "From the Drabble Marshes, where children kept reports hidden in a hedge until the weather improved.", "I reporthedged until pudding and then slid it across the table.", 0],
["shushstorm", "SHUSH-storm", "n.", "A librarian's shush that is far louder than the whisper it was meant to stop.", "Recorded at the Bureau's reading room, where one shushstorm of 1899 blew out three candles.", "A shushstorm swept the library and the boy who sneezed went red.", 0],
["corridazed", "KOR-ih-dayzd", "adj.", "Lost in the corridors of a new school on the first day, holding a timetable upside down.", "From the Bureau, whose own corridors have confused clerks since 1792 and have never once been mapped.", "On the first day I was so corridazed that I sat through a lesson for the wrong year.", 0],
["oohpickme", "ooh-PIK-mee", "interj.", "The strained noise, half-word and half-whimper, of a pupil desperate to be chosen to answer.", "A sound rather than a word, written down by a Gristlemoor teacher who heard it from every desk at once.", "Oohpickme, oohpickme, went the front row, arms waving like reeds.", 0],
["slumpward", "SLUMP-wurd", "adv.", "Sinking slowly down in your seat to avoid the teacher's gaze during a question.", "From Low Frumpish slumpa, 'to make yourself smaller than a chair'.", "When the question came, the whole class slid slumpward at once.", 0],
["answerdrought", "AN-ser-drowt", "n.", "The long silence after a teacher asks the class a question and every pair of eyes drops to the floor.", "Mabyn Ostrich-Haye compared it to 'a field in August, with nobody brave enough to rain'.", "The answerdrought stretched on until a pigeon landed on the window ledge.", 0],
["anonytest", "an-ON-ih-test", "n.", "A test handed in without a name at the top, now sitting unclaimed on the teacher's desk.", "From the Vault of Rejected Words, which keeps a drawer of anonytests going back two centuries.", "The teacher held up the anonytest and asked who got eight out of ten.", 0],
["demoflop", "DEM-oh-flop", "n.", "A science demonstration that works every time in practice and fails completely in front of the class.", "From the Bureau's first public demonstration of invisible ink, which remained invisible forever.", "The volcano demoflop produced one sad bubble and a smell of vinegar.", 0],
["assemblegs", "uh-SEM-bel-egz", "n.", "The pins and needles in your legs after sitting cross-legged through a long assembly.", "From 'assembly' and 'legs', coined in Lower Wobbleton after a head teacher's speech about punctuality ran an hour late.", "When we stood up, half the hall wobbled with assemblegs.", 0],
["recordwail", "ree-KORD-wayl", "n.", "The piercing sound of thirty beginners playing the same school recorder tune at once.", "Imitative; Semicolon the cat was found on the Bureau roof after a recordwail drifted over from the school next door.", "The recordwail at the concert made the grandparents grip their programmes.", 0],
["chantables", "chan-TAY-belz", "n.", "Times tables recited in a sing-song chant by the whole class, which you then can't say any other way.", "From the schoolrooms of Mount Ostentle, where tables were chanted so loudly that they echoed off the peaks.", "I still have to do the chantables in my head to work out seven eights.", 0],
["chairghost", "CHAIR-gohst", "n.", "The lingering warmth of a seat from whoever sat in it during the last lesson.", "From a Bureau rumour that Clerk No. 9 sits in every chair just before you do.", "I sat down on a chairghost and shifted to the next seat.", 0],
["coverlineage", "KUV-er-lin-ee-ij", "n.", "The list of every previous owner's name written inside the cover of a school textbook.", "Dr Quell traced one Gristlemoor textbook's coverlineage back eighty years and found his own grandmother.", "My coverlineage includes someone who wrote their name in glitter.", 0],
["ghostanswer", "GOHST-an-ser", "n.", "An answer pencilled into an old textbook by a previous owner, which may or may not be right.", "From the Bureau, which once found a ghostanswer in a 1790 schoolbook that was wrong and very confident.", "I trusted the ghostanswer and got the question wrong.", 0],
["gaitswitch", "GAYT-swich", "v.", "To change instantly from running to walking when a teacher appears round the corner.", "From the Fennick Valley, where hares are said to gaitswitch whenever a farmer looks up.", "We gaitswitched so fast that Leo skidded into the noticeboard.", 0],
["sinistain", "SIN-is-tayn", "n.", "The ink smudged along the side of a left-handed writer's hand by the end of a lesson.", "From High Pellish sinistra, 'the left', and a stain that Madame Vantablot swore she could never remove.", "Her sinistain showed she had written the entire essay in one go.", 0],
["lendwear", "LEND-wair", "n.", "The state of a rubber that comes back from a loan as a tiny grey crumb.", "From Middle Quellish lende, 'to lend', and the old saying 'what goes out whole comes back worn'.", "Lendwear had reduced my new rubber to the size of a lentil.", 0],
["scrawlcipher", "SKRAWL-sy-fer", "n.", "A teacher's handwritten comment that nobody in the class, or at home, can actually read.", "Gristle Cant, after the Archivist's signature, which the Bureau has never once successfully read.", "We spent dinner trying to work out the scrawlcipher at the bottom of my homework.", 0],
["nubsharpen", "NUB-shar-pen", "v.", "To keep sharpening a pencil until it becomes a stub too short to hold.", "From Proto-Snorrish nubba, 'a stump', said of very old carrots and very short pencils.", "Out of boredom I nubsharpened my pencil down to the rubber.", 0],
["coachlunch", "KOHCH-lunch", "n.", "The packed lunch eaten on the coach before half past nine on a school trip.", "From the Bureau's outing of 1951, when every sandwich had gone before the coach left the car park.", "By lunchtime my coachlunch was a distant memory and a crisp packet.", 0],
["flipdread", "FLIP-dred", "n.", "The dread of a marked test placed face down on your desk, waiting to be turned over.", "From Coastal Mirrovan, where card players who would not look at their hands were said to have flipdread.", "I sat in flipdread for a minute before peeking at one corner.", 0],
["tickspurt", "TIK-spurt", "n.", "The way the classroom clock speeds up during an exam after crawling all through the lesson before.", "From the Bureau's great clock, which Prudence Nib suspected of having a mischievous streak.", "There was a tickspurt in the last ten minutes and I left two questions blank.", 0]
]);
}
// ===== words07.js =====
{
WD.add("internet", [
["ninetinker", "NINE-tee-tink-er", "n.", "A loading bar that has reached 99 per cent and decided it likes the view. It sits there for longer than the first 98 per cent took together, refusing to explain itself, while you consider whether a computer can be shy.", "Coined in 1998 by Clerk No. 9, who watched a single progress bar from the end of the morning tea round to the start of the afternoon one. The card was finally stamped with the note 'Still 99. Going home.' and has never been moved.", "The update raced to 99 per cent and then sat there in a full ninetinker until the kettle had boiled twice.", 2],
["tiphantom", "tip-HAN-tum", "n.", "The three dots that show someone is typing a reply, followed by the dots vanishing and no message ever arriving. Somewhere, a sentence was written, considered and destroyed, and you will never know what it said.", "From Middle Quellish tippa, 'a tapping', and fantum, 'a guest who leaves before the soup'. The poet Mabyn Ostrich-Haye wrote nine sonnets about a single tiphantom and sent none of them, which she felt was fitting.", "I watched the tiphantom bob up and down for a full minute, then the dots disappeared and so did my faith in friendship.", 2],
["fossilike", "FOSS-il-ike", "v.", "To accidentally like a photo from many years ago while quietly looking through someone's old posts, thereby announcing to them exactly how far back you had travelled. No amount of un-liking erases the alert they have already received.", "Named by Dr Horatio Quell after he tapped approval on a colleague's holiday portrait from 2009 and had to resign from three committees. The Bureau files the word in the Smudge Room, face down, out of sympathy.", "She fossiliked his school photo from eleven years ago and spent the evening composing an apology to the entire internet.", 2],
["laterling", "LAY-ter-ling", "n.", "A browser tab kept open to read later, which will remain open, unread and quietly judging you, until the computer itself dies.", "From Low Frumpish laterlyng, 'a guest who never leaves the spare room'. Brother Ludo of Gristlemoor kept a laterling of his own: a page he marked 'read after vespers' in 1340.", "That article about sleep has been a laterling in my browser since March, and I am too tired to read it.", 1],
["mutelogue", "MYOOT-uh-log", "n.", "A long, passionate, beautifully argued speech delivered on a video call while your microphone is off.", "Gristle Cant, from the clerks' conference line, where Clerk No. 9 once argued for a better biscuit budget for twelve minutes to a silent room.", "He finished his brilliant mutelogue, looked up, and saw forty people pointing at their own ears.", 1],
["voicetome", "VOYSS-tohm", "n.", "A voice message so long it should have chapters, an interval and a small gift shop at the end.", "From voice plus tome, a large book. The merchant Ebbe Tannick once sent his supplier a voicetome so lengthy the courier had to change horses.", "Grandma sent a nine-minute voicetome that began with the weather and ended, somehow, at her wedding.", 1],
["hyperamble", "HY-per-am-bul", "v.", "To drift link by link from a simple search into an entirely unrelated subject, as when looking up a pancake recipe leads to the history of medieval spoons.", "From High Pellish hyper, 'beyond', and amblen, 'to wander off'. First recorded in the Fennick Valley, where a shepherd went looking for a lost sheep and came back knowing about volcanoes.", "I only wanted the bus times, but I hyperambled until midnight and now I know everything about lighthouse keepers.", 1],
["botdoubt", "BOT-dowt", "n.", "The brief, honest wobble of uncertainty when a website asks you to confirm you are not a robot.", "Clerical error: the Bureau's new filing machine stamped its own index card 'human' in 1961 and the clerks have been uneasy ever since.", "As I ticked the box to prove I was human, a cold botdoubt crept up my spine.", 1],
["avatarchaic", "av-uh-tar-KAY-ik", "adj.", "(Of a profile picture) So old that it shows a haircut, a pet and a version of you that no longer exist.", "Coined by Archivist Prudence Nib, who kept the same painted portrait on her Bureau door from 1792 until 1840, long after she had gone grey.", "His avatarchaic profile photo still shows him holding a goldfish that passed away during school.", 1],
["kayfrost", "KAY-frost", "n.", "The chill that settles over a conversation when your long, heartfelt message receives the single-letter reply 'k'.", "From Sub-Arctic Dunnish kay, 'one stone', and frost. In Dunnish villages a pebble left on the doorstep meant 'message received, do not visit'.", "I wrote three paragraphs about my day and got back a kayfrost so cold I put a jumper on.", 1],
["ultimafile", "UL-tim-uh-file", "n.", "A document saved as 'final', then 'final2', then 'final FINAL', then 'actual final real one', none of which is the final version.", "From the Vellumese ultima, 'the last', which in Vellumese grammar could be followed by any number of further lasts.", "The project folder now holds seven ultimafiles and nobody knows which one the teacher wanted.", 1],
["simulsorry", "SIM-ul-sor-ee", "n.", "The moment on a video call when two people start speaking at once, both stop, both say 'sorry, go on', and then both start again.", "First documented at a Bureau committee in 1962, where a simulsorry between two archivists lasted until lunch was cancelled.", "We hit a simulsorry, then another one, and in the end I just wrote my point in the chat.", 1],
["snoutcam", "SNOWT-kam", "n.", "The unflattering upward view of your own nostrils and chin when the front camera opens by mistake.", "From Coastal Mirrovan snout, 'nose', and camm, 'a pond you glimpse your face in'. The Bureau cat Semicolon is said to be the only creature who looks good in a snoutcam.", "I opened the camera by accident and the snoutcam showed me a version of my chin I never wanted to meet.", 1],
["glitchmug", "GLICH-mug", "n.", "The face you are frozen in when a video call stalls, always mid-sneeze or mid-word and never mid-smile.", "Gristle Cant, from clerks who noticed that the Bureau's ancient camera always froze them at their worst.", "The connection dropped and the whole class stared at my glitchmug for a full minute.", 1],
["corrigrief", "KOR-ih-greef", "n.", "The sinking horror of noticing, just after pressing send, that autocorrect has changed 'see you soon' into something wildly different.", "From the Old Blotvian corrig, 'to straighten', which the Blotvians also used to describe straightening a perfectly good fence into a ditch.", "I meant to wish her happy birthday but corrigrief struck and I congratulated her on her happy bathtub.", 0],
["passcrimp", "PASS-krimp", "n.", "The rising despair of password rules: one capital, one number, one symbol, no names, nothing used before, and the blood of a dragon.", "Named for the Bureau's Vault of Rejected Words, whose door required a password Madame Ilse Vantablot changed every Tuesday.", "After the fourth passcrimp rejection I made my password a sentence about how tired I was.", 0],
["squarequint", "SKWAIR-kwint", "v.", "To stare at a grid of blurry pictures, agonising over whether the tiny corner of a traffic light counts as a traffic light.", "Brother Ludo of Gristlemoor squarequinted at a tiled floor for an hour trying to decide which squares were holy.", "I squarequinted at the bicycle pictures for so long that the website gave me new ones.", 0],
["agreeplummet", "uh-GREE-plum-it", "v.", "To fling a page of terms and conditions to the very bottom without reading a word, simply so the Agree button lights up.", "From Low Frumpish plummet-on, 'to roll a barrel downhill and hope'. Clerk No. 9 holds the Bureau record: forty pages in under a second.", "I agreeplummeted through the terms and may have promised them my firstborn goldfish.", 0],
["crescendrag", "kreh-SHEN-drag", "n.", "The buffering wheel that appears at the exact moment a video reaches its most important second.", "From the Middle Quellish crescen, 'the rising bit', and drag, 'a cart with one wheel off'.", "Just as the detective said who did it, the screen hit a crescendrag and the wheel spun for ever.", 0],
["seenlorn", "SEEN-lorn", "adj.", "Describing someone whose message has been marked as read and then answered by nothing at all, for hours.", "From seen plus the poetic forlorn. Mabyn Ostrich-Haye was seenlorn for a whole summer and wrote an ode to it.", "I sat seenlorn on the bus, staring at the word 'Read' under my question.", 0],
["batterflinch", "BAT-er-flinch", "n.", "The jolt of alarm at seeing your phone drop to one per cent just as you need the map.", "From the Fennick Valley dialect batter, 'the lamp oil', and flinch, which needs no explanation.", "Halfway to the party I got a batterflinch and started memorising the street names.", 0],
["thumbdrift", "THUM-drift", "n.", "The way your thumb keeps scrolling long after your brain has stopped reading, as if it has plans of its own.", "Coined in Port Scrivel, where fishermen's thumbs reportedly kept mending nets in their sleep.", "My tea went cold during a slow thumbdrift through photos of strangers' kitchens.", 0],
["loopicking", "LOOP-ik-ing", "n.", "The habit of opening the same three apps in a circle, as if one of them might have changed in the last nine seconds.", "From the Isle of Umber custom of checking all three of the island's mailboxes in turn, all day, even on Sundays.", "Bored in the queue, I fell into a loopicking spiral: messages, photos, weather, messages again.", 0],
["falsping", "FALS-ping", "n.", "A notification that makes your heart leap, which turns out to be the phone telling you about its own storage.", "From Proto-Snorrish fals, 'a bell rung by the wind'.", "I grabbed my phone at the buzz, but it was a falsping about a software tip I did not need.", 0],
["quivermiss", "KWIV-er-miss", "n.", "The phantom buzz of a phone in your pocket that is, in fact, on the kitchen table at home.", "Recorded in Lower Wobbleton, where farmers felt their pockets ring years before pockets could.", "I felt a quivermiss in my jeans and remembered the phone was charging upstairs.", 0],
["postwince", "POHST-wins", "v.", "To read your own message again straight after sending it and discover a typo you are now powerless to fix.", "From the Bureau's own tradition of re-reading every index card after the ink is dry, then sighing.", "She postwinced as she saw she had signed off 'Love, Mun'.", 0],
["backspiral", "BAK-spy-rul", "n.", "The cycle of writing a message, deleting it all, writing it again, deleting half, and finally sending 'ok'.", "Gristle Cant for a clerk rubbing out the same word until the card has a hole in it.", "After a twenty-minute backspiral, my reply to the party invite was just a thumbs up.", 0],
["signaliar", "SIG-nul-y-er", "n.", "A connection that proudly shows full bars and delivers absolutely nothing.", "From signal plus liar. Mount Ostentle's old beacon tower famously blazed every night without warning anyone of anything.", "The café internet was a total signaliar: five bars and a blank page.", 0],
["skypoking", "SKY-poh-king", "n.", "Holding your phone up as high as your arm allows, as if the signal lived just above your head.", "From Sub-Arctic Dunnish skypok, the act of raising a spoon to taste the weather.", "There we stood on the hill, all four of us skypoking like a statue of very confused explorers.", 0],
["plugwhisper", "PLUG-wis-per", "v.", "To switch the router off, count slowly to ten, switch it on again and speak to it kindly while the lights blink.", "Madame Ilse Vantablot plugwhispered to her ink presses every morning; the Bureau still does it to the kettle.", "Dad plugwhispered to the router for five minutes and the internet came back out of sheer embarrassment.", 0],
["glarewake", "GLAIR-wayk", "n.", "The searing flash of a phone screen checked at full brightness in a dark bedroom at three in the morning.", "From Old Teaspoonic glaer, 'the moon in the bottom of a cup'.", "One glance at the clock gave me such a glarewake that I saw purple squares until dawn.", 0],
["backlogue", "BAK-log", "n.", "The two hundred unread messages a group chat produces during the one lunch you spent away from it.", "From the Bureau's own backlog of uninvented words, which grows by forty a day and is kept in a cupboard.", "I came back from swimming to a backlogue of photos, jokes and a fierce debate about socks.", 0],
["mistargle", "mis-TAR-gul", "v.", "To send a message meant for one person to another, usually the one person it was about.", "From Coastal Mirrovan targ, 'a shot arrow', and the dreaded little ending -gle, 'into the wrong barrel'.", "I mistargled my birthday-present plans straight to my sister, who was the present.", 0],
["afterpitch", "AF-ter-pich", "n.", "An advert for the exact thing you bought yesterday, arriving now that you need it least.", "Coined by Ebbe Tannick, who sold a man a cart, then followed him home offering him carts.", "I bought one pair of boots and now every page shows me an afterpitch for the same boots.", 0],
["spookmercial", "spook-MER-shul", "n.", "An advert for something you only ever said out loud, once, in your own kitchen.", "From Middle Quellish spook, 'the wall that listens', and merce, 'a market'.", "We talked about getting a parrot at dinner, and by bedtime I had a spookmercial for birdseed.", 0],
["acceptoid", "ak-SEP-toyd", "n.", "The third pop-up asking for your permission before you have read a single word of the page you came for.", "Clerical error: Clerk No. 9 stamped 'Accept' on a card so many times it grew legs and became a word.", "I closed one acceptoid, then another popped up asking if I accepted the first one.", 0],
["clickfog", "KLIK-fog", "n.", "The blank daze of opening a browser and forgetting what you came online to do.", "From the Drabble Marshes, where a thick fog was said to make travellers forget which village they were walking to.", "I sat in a clickfog for a full minute, then remembered: I needed a bus ticket.", 0],
["greyprint", "GRAY-print", "n.", "The faint grey text at the bottom of an email where the unsubscribe link hides, small enough for an ant to need glasses.", "From the Vellumese grisprinte, a legal clause written in pencil so that nobody could find it.", "I scrolled down, squinted at the greyprint, and still could not find the button.", 0],
["downgrief", "DOWN-greef", "n.", "The sorrow of a long download finishing at last, only to announce that the file is broken.", "From Old Blotvian dunngref, 'a parcel arriving wet'.", "After two hours of waiting the game hit me with a downgrief and a message saying 'error'.", 0],
["patchambush", "PACH-am-bush", "n.", "A software update that insists on installing at the exact moment you need the computer.", "From a Gristlemoor tale about a cobbler who mended your boots while you were still wearing them.", "My homework was due in ten minutes when the patchambush began: 'Do not turn off your computer'.", 0],
["updefer", "up-dih-FER", "v.", "To press 'remind me tomorrow' on the same update every day for most of a year.", "Recorded at the Bureau, where the tea trolley's new wheels have been 'arriving next week' since 1887.", "I have updeferred that update so many times it has started sending me sad faces.", 0],
["posthaunt", "POHST-hawnt", "n.", "An old post of yours that resurfaces years later, full of spelling and opinions you no longer own.", "Brother Ludo of Gristlemoor suffered the first known posthaunt when his teenage margin doodles were read out at his retirement.", "A posthaunt from when I was ten popped up: a whole page about how I would marry a horse.", 0],
["autoblare", "AW-toh-blair", "n.", "A video that begins playing at full volume the moment you open a page in a silent library.", "From Lower Wobbleton blaer, the shout of the town crier, who was famous for never checking whether anyone was asleep.", "The autoblare of a cooking video made the whole library turn and look at me.", 0],
["thumbhang", "THUM-hang", "v.", "To hover your thumb over the send button for a long, dramatic moment before you dare to press it.", "From the Isle of Umber practice of holding a letter over the post box until a seagull makes the decision for you.", "I thumbhanged over the message for so long that my screen went dark.", 0],
["replystale", "rih-PLY-stayl", "adj.", "(Of a reply) Carefully composed for ten minutes, only for the chat to have moved on to an entirely new topic.", "From High Pellish replisteal, 'bread brought to a feast after the feast'.", "My replystale joke about the film landed in the middle of a talk about dentists.", 0],
["credentangle", "kred-en-TANG-gul", "n.", "The muddle of not knowing which email, username or long-forgotten nickname you signed up with years ago.", "Coined by Dr Horatio Quell, who once had nine library cards under nine slightly different names.", "Lost in a credentangle, I tried three old emails before admitting I would just make a new account.", 0],
["whirrupt", "wih-RUPT", "v.", "(Of a laptop) To suddenly roar its fan like a jet engine for no reason during a quiet moment.", "From the sound itself, as transcribed by the Bureau cat Semicolon, who left the room each time.", "In the middle of the exam the old laptop whirrupted and the teacher thought it was a plane.", 0],
["crackleweb", "KRAK-ul-web", "n.", "The spiderweb of cracks on a phone screen that you have decided, for now, to simply live with.", "From Proto-Snorrish krakl, the sound of thin ice, and web, which the Snorrish also used for any problem that keeps getting bigger.", "She read the whole recipe through a crackleweb and only cut her finger slightly.", 0],
["clipslip", "KLIP-slip", "n.", "The act of pasting whatever was left on your clipboard three days ago into an important message.", "Gristle Cant, after a Bureau clerk glued the wrong card into the Unword Ledger and the word 'thrumbish' became, briefly, a soup.", "A clipslip turned my polite email to the head teacher into a shopping list for bananas.", 0],
["unwindle", "un-WIN-dul", "v.", "To mash the undo button over and over in panic, rewinding far past the mistake and into the distant past.", "From Low Frumpish unwyndel, 'to unravel the jumper to fix one stitch'.", "I unwindled so far back that my drawing turned into a blank page and an apology.", 0],
["hearthunting", "HART-hun-ting", "n.", "Checking a post you put up five minutes ago to see how many people have reacted, and then checking again.", "From the Drabble Marshes custom of counting how many frogs answered your song.", "Stop hearthunting your own holiday photo and come and eat your breakfast.", 0],
["lateflourish", "LAYT-flur-ish", "n.", "The perfect funny reaction picture you find only after the conversation has ended and everyone has gone to bed.", "From the poet Mabyn Ostrich-Haye, who composed her best comebacks on the coach home.", "At midnight I found the ideal lateflourish: a duck in a hat, looking disappointed.", 0],
["tabletrumble", "TAY-bul-trum-bul", "n.", "The startling buzz of a phone lying face down on a wooden table, loud enough to rattle every cup at dinner.", "From Old Teaspoonic trumbel, 'a spoon that will not keep still'.", "The tabletrumble made Grandad spill his soup and accuse the house of an earthquake.", 0],
["iconquake", "EYE-kon-kwayk", "n.", "The moment a long press makes every icon on the screen start wobbling, as if the phone were frightened.", "Coined at a Port Scrivel fishmarket, where a dropped tray made all the herring wobble at once.", "I pressed too long and caused an iconquake that took me twenty minutes to calm down.", 0],
["deadthumb", "DED-thum", "n.", "The state of a finger so cold that the touchscreen refuses to believe it is a finger.", "From Sub-Arctic Dunnish, where winter phones were said to only answer to noses.", "With a deadthumb in the snow, I had to unlock my phone with my nose.", 0],
["stillwatcher", "STIL-woch-er", "n.", "Someone who is asked by the screen whether they are still watching, and must admit, in shame, that they are.", "From the Bureau's motion-sensing lamp, which turns itself off every evening to ask the clerks the same question.", "When the screen asked if anyone was there, I pressed yes like a proud stillwatcher.", 0],
["volumecliff", "VOL-yoom-klif", "n.", "A volume setting where one step is a whisper and the very next step wakes the neighbours.", "From Mount Ostentle, whose north face goes from gentle meadow to sheer drop in a single stride.", "Bedtime films are impossible on this volumecliff: either silence or thunder.", 0],
["dripload", "DRIP-lohd", "n.", "A picture appearing slowly, one stripe at a time, building suspense about what is in it like a theatre curtain.", "From Low Frumpish drippel, 'a jug of honey being poured upside down'.", "The dripload revealed a forehead, then eyebrows, then, finally, my cousin's new fringe.", 0],
["zeroplod", "ZEER-oh-plod", "n.", "An upload that sits at zero per cent for so long you wonder whether it has even put its shoes on.", "Clerical error at the Bureau: the first ever upload from the Smudge Room is still listed, in 1994, at nought.", "The video sat in a zeroplod all afternoon, then finished in four seconds the moment I gave up.", 0],
["compasswaltz", "KUM-pus-wolts", "n.", "The slow spin you perform in the street while the map on your phone works out which way you are facing.", "Coined in Port Scrivel, where the harbour master danced the same steps every foggy morning.", "We did a full compasswaltz outside the station before the arrow finally pointed us to the museum.", 0],
["screenreckon", "SKREEN-rek-un", "n.", "The weekly report that tells you how many hours you spent looking at your phone, which you then avoid looking at.", "From the Vellumese reckon, a bill delivered by a polite but unbudging goose.", "My screenreckon said nine hours a day, so I closed it and opened a game.", 0],
["typostone", "TY-poh-stohn", "n.", "A spelling mistake in a public comment that cannot be edited and will now outlive everyone you know.", "From the stonemasons of Gristlemoor, who carved 'Here Lies Hary' and had to leave it.", "My comment wishing the team 'good lunk' is now a typostone for all to see.", 0],
["palmcall", "PAHM-kawl", "v.", "To accidentally start a call with someone while scrolling, usually someone you have not spoken to in nine years.", "Gristle Cant, from the clerks' old switchboard, which rang whoever was leaned on.", "I palmcalled my old swimming coach and had to pretend I was calling about the weather.", 0],
["leakplay", "LEEK-play", "n.", "Sound bursting from your phone's speaker after your earphones quietly fell out, broadcasting your song to the bus.", "From the Coastal Mirrovan leek, 'a bucket that sings'.", "The leakplay revealed to the entire bus that I was listening to sea shanties.", 0],
["cablecrook", "KAY-bul-krook", "n.", "A charging cable that works only when bent at one exact angle and held there by a book.", "Madame Ilse Vantablot's ink pipe was a famous cablecrook, flowing only when propped on a dictionary.", "My cablecrook charges only if I balance it on the dog's bowl and don't breathe.", 0],
["chatflump", "CHAT-flump", "n.", "The sudden silence in a group chat right after you send something, as if everyone has left the room at once.", "From Low Frumpish flump, the sound of a sack of flour dropped in an empty barn.", "My joke landed with a chatflump so loud I could hear the crickets.", 0],
["wrongscreen", "RONG-skreen", "n.", "The panic of sharing your screen in a lesson and showing everyone the wrong window.", "From the Bureau's first projector, which showed the Unword Ledger to a visiting duke instead of the slideshow about tea.", "In a wrongscreen moment, the whole class saw my search for 'how to wake up a sleepy hamster'.", 0],
["cachegloom", "KASH-gloom", "n.", "The gloom of being told to clear your cache, cookies and history to fix a problem nobody can explain.", "From Old Blotvian cashglum, 'to sweep the house because the roof leaks'.", "Lost in cachegloom, I deleted everything and the website still would not let me in.", 0],
["notifloom", "NOH-tif-loom", "n.", "The pile of red dots and numbers on the corner of every app, which you have chosen to stop noticing.", "From the Isle of Umber word floom, a heap of shells nobody remembers collecting.", "Her phone had a notifloom of four thousand unread emails and she slept like a baby.", 0],
["selfscroll", "SELF-skrohl", "v.", "To read back through your own old messages with someone, wincing at how strange you were last Tuesday.", "Coined in 1979 by Dr Horatio Quell, who re-read his own letters aloud to the Bureau every Christmas.", "I selfscrolled to find the address and found my unbearable joke about cheese instead.", 0],
["refreshoo", "ree-FRESH-oo", "interj.", "A low, hopeful chant muttered while pressing refresh over and over on a page that is about to show your results.", "From the Proto-Snorrish rain dance refrishu, performed on the same spot until either rain or boredom arrived.", "Refreshoo, refreshoo, I whispered, as the ticket page went blank for the ninth time.", 0],
["keytrudge", "KEE-trudj", "n.", "The slow agony of typing a long password on a television using a remote and an alphabet grid.", "Gristle Cant, from clerks typing the Bureau's 40-letter vault code on a rotary dial.", "After a ten-minute keytrudge, the screen told me the password was wrong.", 0]
]);
