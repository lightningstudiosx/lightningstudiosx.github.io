// ===== words13.js =====
{
WD.add("sounds", [
["humbereft", "HUM-be-reft", "n.", "The sudden roar of silence when the fridge stops humming, revealing that it had been humming all along. You never heard it start, you will not hear it again until it stops, and for a moment the whole kitchen seems to hold its breath.", "Coined by Archivist Prudence Nib in 1794, who leapt from her desk when the Bureau's ice-chest fell quiet and wrote the word on her cuff before she had even worked out what had changed. The cuff is still in the Vault, unwashed.", "The humbereft made us both look up from our cereal as if somebody had walked in.", 2],
["squeedle", "SKWEE-dul", "v.", "To make a balloon squeak by rubbing or twisting it, ideally right next to someone it bothers.", "Middle Quellish squedel, 'the protest of the bladder', from the days when party balloons were made of sheep stomach and complained accordingly.", "Uncle Fen squeedled a balloon into a dog so loudly that the actual dog left the room.", 0],
["nightsettle", "NITE-set-ul", "n.", "The single loud crack a house makes at two in the morning, which every adult explains as the house settling, although houses apparently settle every night forever and never finish.", "Gristle Cant. Clerk No. 9 logged 4,211 nightsettles in the Bureau's east wing between 1880 and 1903 and concluded, in a margin note, that the building was trying to get comfortable.", "A nightsettle cracked across the landing and Dad said it was nothing, in the voice of a man fetching a torch.", 1],
["clonkerdink", "KLONK-er-dink", "n.", "The knocks, ticks and clanks of a radiator waking up for winter, like an iron orchestra tuning up in the wrong key.", "From Low Frumpish klonkerdinken, 'to stretch with metal bones', said of radiators and of old uncles getting out of armchairs.", "Every October the first clonkerdink of the heating convinces the cat there is a burglar in the wall.", 0],
["thwoopet", "THWOO-pet", "interj.", "A cry of triumph made at the exact moment a stubborn jar lid pops, conveniently ignoring the three people who loosened it first.", "Old Teaspoonic thwoop, imitating the sound, plus -et, the Bureau's suffix for things that deserve a round of applause.", "'Thwoopet!' cried Gran, raising the pickle jar like a trophy after ten minutes under the hot tap.", 0],
["scritchlap", "SKRITCH-lap", "n.", "The enormous ripping noise of undoing a Velcro strap in a silent room, which no amount of slowness can soften.", "A clerical error: the Bureau typist meant to file 'scratch lap' under minor injuries and instead invented the loudest word in the Unword Ledger.", "I tried to sneak my trainers off in the library, but the scritchlap turned every head on the floor.", 0],
["beepnag", "BEEP-nag", "n.", "The reminder beep a microwave repeats every minute because you have not collected your soup, as if you had forgotten soup exists.", "Recorded by Dr Horatio Quell, who insisted kitchen machines had no opinions until one beepnagged him through an entire lecture on vowels.", "The microwave let out its fourth beepnag and I finally rescued my porridge, which had grown a skin of disappointment.", 0],
["squinchet", "SKWIN-chet", "n.", "The high squeak of a trainer turning sharply on a sports-hall floor, the sound of a PE lesson happening somewhere nearby.", "From Coastal Mirrovan squinch, 'the cry of a wet gull', which is exactly what a hall full of netball sounds like from outside.", "The squinchets echoing down the corridor told us the basketball match had started.", 0],
["spindletink", "SPIN-dul-tink", "n.", "The quickening rattle of a dropped coin spinning flatter and faster on a hard floor until it suddenly goes quiet.", "Coined by the merchant Ebbe Tannick, who said the best part of losing money was the spindletink and the worst part was everything after.", "Everyone in the queue stopped talking to listen to the spindletink of my pound under the counter.", 1],
["slorkle", "SLOR-kul", "n.", "The loud gurgle of a straw hunting for the last of a milkshake among the bubbles and ice.", "Proto-Snorrish slorkel, 'the last drink of the well', which the Snorrish considered rude only if you kept going.", "He kept up the slorkle long after the cup was clearly empty, purely to annoy his sister.", 0],
["plinkwatch", "PLINK-wotch", "n.", "The night-long vigil of lying awake listening to a dripping tap, counting the gaps and dreading each next drop.", "Fennick Valley dialect, first the name of the shepherd's boy told to stay up listening for wolves, who only ever heard the trough leaking.", "I did a full plinkwatch until three, then got up and wrapped a sock round the tap.", 0],
["fwapperel", "FWAP-er-el", "n.", "The slap of a fitted sheet's corner springing off the mattress just as you finish the opposite corner.", "From the poet Mabyn Ostrich-Haye's unfinished 'Ode to Bedding', abandoned after the forty-first fwapperel.", "Making the bed took twenty minutes because there was a fwapperel at every single corner.", 0],
["lidwobble", "LID-wob-ul", "n.", "The rolling clatter of a saucepan lid dropped on a tiled floor, which keeps spinning far longer than physics should allow.", "Named after Lower Wobbleton, whose pan-makers' festival of 1851 ended with three hundred lids dropped at once and a town that could not hear for a week.", "The lidwobble went on so long that Mum had time to come downstairs and ask what happened before it stopped.", 0],
["crunshel", "KRUN-shel", "n.", "The startlingly loud crunch of celery being bitten inside your own head, which you assume the whole table can hear.", "Vellumese krunsh, 'noise heard from the inside', also used for knees on stairs and thoughts during exams.", "I gave up on celery at the dinner party after one crunshel stopped the conversation dead.", 0],
["cupbonk", "KUP-bonk", "n.", "The hollow thud of a head meeting a cupboard door that somebody else left open.", "Gristle Cant, coined by filing clerks in the Smudge Room, where every cabinet was hung at precisely forehead height.", "After the third cupbonk of the morning, I closed every door in the kitchen and glared at my brother.", 0],
["chattermew", "CHAT-er-mew", "n.", "The odd clicking chirp a cat makes at birds through a window, half hunting call and half complaint.", "First recorded beside the Bureau cat Semicolon, who chattermewed at the pigeons on the windowsill every afternoon at four, regular as the tea trolley.", "Biscuit sat on the sill doing a chattermew at a robin who was not remotely worried.", 0],
["zipshriek", "ZIP-shreek", "n.", "The impossibly loud zip of a tent door at night, made by whoever needs the loo first and heard by everyone else.", "Sub-Arctic Dunnish zippskrik, 'the noise that wakes the camp', said to have carried across three valleys during a midnight snack.", "The zipshriek at four in the morning meant someone was going outside, and now we all knew about it.", 0],
["kettlick", "KET-lik", "n.", "The confident click of a kettle switching itself off, announcing that tea is now a decision rather than a dream.", "Old Teaspoonic, of course: the Teaspoonics measured all time in kettlicks, and a long shift was 'a nine-kettlick day'.", "At the kettlick, the whole office rose from their desks as one.", 0],
["enginkle", "en-JIN-kul", "n.", "The slow ticking and pinging of a car engine cooling down after a long drive, as if it is muttering about the journey.", "A mishearing: Dr Horatio Quell asked a mechanic what the noise was, the mechanic said 'engine, I think', and Quell wrote it down as one word.", "We sat in the dark garage listening to the enginkle and nobody wanted to get out first.", 0],
["crinkmunch", "KRINK-munch", "n.", "The rustle and crunch of someone eating crisps very slowly in a quiet cinema, which is somehow louder than eating them fast.", "Port Scrivel slang, from the old picture-house where ushers carried long feathered poles to tickle offenders into stopping.", "Three rows back, a heroic crinkmunch lasted through the entire sad bit.", 0],
["fizzwhisp", "FIZ-wisp", "n.", "The careful hiss of a fizzy bottle being opened very slowly, a sound made entirely of hope and fear.", "Coastal Mirrovan fisswisp, 'the bottle bargaining', since every Mirrovan sailor believed a shaken drink could be talked down.", "He let out the fizzwhisp a millimetre at a time while the rest of us backed away.", 0],
["roofwhump", "ROOF-wump", "n.", "The heavy, muffled slump of snow sliding off a roof in one piece and landing somewhere unwelcome.", "Sub-Arctic Dunnish, where roofwhumps are so common they double as doorbells: two whumps means 'come in, the path is clear'.", "A roofwhump outside the window buried the bin and most of the bike.", 0],
["whinellow", "WINE-el-oh", "n.", "The thin, high whine of an old television left on standby, audible only to dogs, children and anyone trying to sleep.", "From Middle Quellish whinelow, 'the ghost's kettle', since nobody in the house could ever find what was making it.", "Only Ruby could hear the whinellow, so she was sent to switch the telly off at the wall.", 1],
["flapsnick", "FLAP-snik", "n.", "The sharp snap of a letterbox springing shut, often on the fingers of the person posting through it.", "Recorded at the Port Scrivel post office, whose letterboxes were so fierce they were fed by apprentices wearing thimbles.", "The flapsnick told us the post had come, and that the postie had lost another glove.", 0],
["glorgle", "GLOR-gul", "v.", "To gurgle loudly as the last of the bathwater drains, like a plughole clearing its throat to say something.", "Low Frumpish glorgel, 'the drain's last word', believed by Frumpish children to be the plughole wishing them goodnight.", "The baby clapped every time the bath glorgled.", 0],
["rumbelow", "RUM-be-loh", "n.", "A deep, unstoppable stomach rumble that arrives during the quietest moment of an exam or a minute's silence.", "Coined by Brother Ludo of Gristlemoor, who wrote it in the margin of a fasting manual beside a little drawing of himself looking guilty.", "My rumbelow rolled across the exam hall and the invigilator looked up from her book.", 0],
["shtickle", "SHTIK-ul", "v.", "To walk across a sticky floor, each shoe peeling up with a little rip at every step.", "Named after the cinema floors of the Drabble Marshes, rumoured to be the stickiest in the known world and possibly alive.", "We shtickled our way out of the bowling alley like flies leaving a jam jar.", 0],
["tinkerset", "TINK-er-set", "n.", "The clink of ice cubes shifting in a glass all by themselves, as if someone invisible had nudged it.", "Vellumese tinkersett, 'the glass rearranging its furniture', a phrase also used for a cat settling on a pile of books.", "The tinkerset from my lemonade made me jump in the empty room.", 0],
["skitterpen", "SKIT-er-pen", "n.", "The clattering, rolling escape of a pen off a desk in a silent room, followed by the long walk to fetch it.", "From the Bureau's Exam Room Incident of 1911, in which Clerk No. 9 dropped a pen that rolled the full length of the hall and out of the door.", "My skitterpen went under four desks before stopping at the teacher's shoe.", 0],
["hangerdance", "HANG-er-dance", "n.", "The rattle of empty coat hangers still swinging in the wardrobe after you have snatched your coat and gone.", "Mount Ostentle climbing slang for the noise of tin cups on a rucksack, borrowed by people who never climb anything taller than a stair.", "The hangerdance was still going in the hall when I was already at the bus stop.", 0],
["duvewhoof", "DOOV-woof", "n.", "The great soft rush of air when someone flaps a duvet to shake it out, moving papers in the next room.", "High Pellish duvehuf, 'the bed's breath', which Pellish innkeepers used to judge how well a guest had slept.", "Dad's duvewhoof blew my homework off the desk and halfway down the stairs.", 0],
["squelchoon", "skwel-CHOON", "n.", "The wet song of stepping into a shoe and discovering, too late, that the inside is still damp.", "Drabble Marshes dialect; marsh folk measure the day in squelchoons and consider three of them a holiday.", "One squelchoon and I knew my plimsolls had not dried overnight.", 0],
["pipfizzle", "PIP-fiz-ul", "n.", "The sad hiss of a bubble-wrap bubble that leaks instead of popping.", "Coined in 1960 by a packing clerk at the Bureau who spent a whole lunch break hunting for one good pop and found only pipfizzles.", "I saved the biggest bubble till last, squeezed it for glory, and got a pipfizzle.", 0],
["clunknot", "KLUNK-not", "n.", "The not-quite-right click of a seatbelt that has not actually latched, which you only notice once the car is moving.", "Gristle Cant for a rubber stamp that didn't take; the clerks lent it to motorists out of sympathy.", "After the clunknot I tried three more times while the driver pretended not to watch.", 0],
["clankerwell", "KLANK-er-wel", "n.", "The knocking in the pipes when someone upstairs turns on a tap, as though the house is tapping out a secret code.", "Isle of Umber word; the islanders' cottages all share one water main, so a clankerwell in one house is gossip for the whole street.", "A clankerwell rang through the walls and we knew next door was running a bath.", 0],
["jinglepad", "JING-ul-pad", "n.", "The approaching jingle of a dog's collar tags padding down the hallway, which means you are about to be loved at.", "From Old Blotvian jingelpad, 'the sound before the nose', a word said to be older than dogs themselves.", "The jinglepad in the hall told me Bramble had heard the treat tin open.", 0],
["vellumur", "vel-YOO-mur", "n.", "The dry whisper of a page being turned in a library, magnified by the silence into something almost rude.", "Vellumese, naturally, where it was also the polite word for a person who reads over your shoulder.", "Each vellumur from the next table sounded like a thunderclap in the reading room.", 1],
["markeek", "mar-KEEK", "n.", "The squeal of a nearly dry marker dragged across a whiteboard, which makes the back of everyone's neck shiver.", "Old Blotvian markik, 'the chalk's revenge', muttered by scholars the day their slates were replaced.", "Mr Hale's markeek during the maths test made the whole room wince.", 0],
["snorrumph", "SNOR-rumf", "n.", "The crumpled crunch of the very first footstep into fresh, untouched snow.", "Proto-Snorrish snorrumf, which also meant 'first', since Snorrish children fought over who got to snorrumph the yard.", "I took my snorrumph across the lawn before anyone else in the house was awake.", 1],
["pipwhimper", "PIP-wim-per", "n.", "The lone chirp of a smoke alarm with a dying battery, which sounds once every few minutes, only at night, and never while you are standing under the right alarm. Finding it becomes a household quest.", "In 1897 Clerk No. 9 spent eleven nights hunting a pipwhimper through the Bureau, finally tracing it to a cricket in the Vault of Rejected Words that had learned to imitate the new fire bell.", "At three in the morning the whole family stood on the landing in silence, waiting for the next pipwhimper.", 2],
["bootsuckle", "BOOT-suk-ul", "n.", "The deep slurp of a welly being pulled out of thick mud, sometimes without the foot.", "Fennick Valley farmers' word; a field is graded by its bootsuckle, from 'damp' to 'keeps your grandmother'.", "My boot came free with a bootsuckle, but my sock stayed behind in the field.", 0],
["groanstep", "GROAN-step", "n.", "The one stair that creaks, known to everyone in the house and stepped over by anyone sneaking down for biscuits.", "Recorded in Gristlemoor, where the monks chalked a cross on theirs so latecomers to prayers could avoid it.", "I skipped the groanstep perfectly and then trod on the cat.", 0],
["tinsizzle", "TIN-siz-ul", "n.", "The tinny hiss of music leaking from someone else's headphones on a bus, all cymbals and no tune.", "A clerical error: an index card for 'tin sizzle', a fried breakfast, was misfiled under noises in 1932 and has stayed there out of stubbornness.", "The tinsizzle from the boy beside me was a song I almost, but not quite, recognised.", 0],
["melontock", "MEL-on-tok", "n.", "The hollow knock of tapping a melon in a shop to test it, though nobody knows what a good one sounds like.", "The merchant Ebbe Tannick claimed to judge melons by melontock alone and was wrong about nine times in ten.", "Grandad gave every melon a melontock, nodded wisely, and bought the first one anyway.", 0],
["cordplink", "KORD-plink", "n.", "The thin tick of a bathroom pull-cord light switch, which always takes two goes in the dark.", "Vellumese, from the bead at the end of the cord, which the Vellumese called a plink and collected in jars.", "After two cordplinks and a lot of fumbling, the bathroom light finally came on.", 0],
["splorch", "SPLORCH", "v.", "To refuse to pour for ages and then surrender everything at once, as ketchup bottles do over chips.", "Middle Quellish splorke, 'the sauce's surrender', usually followed by a second word not permitted in the Ledger.", "The bottle splorched and my chips disappeared under a red flood.", 0],
["fanticker", "FAN-tik-er", "n.", "The faint clunk a desk fan makes at the end of each swing before it turns back the other way.", "Coined by the poet Mabyn Ostrich-Haye in the heatwave of 1876, who claimed her fanticker kept better time than her metronome.", "I fell asleep counting fantickers instead of sheep.", 0],
["ahemble", "a-HEM-bul", "v.", "To clear your throat loudly before speaking, announcing that a speech is now happening whether anyone wants one or not.", "Dr Horatio Quell's signature noise; Bureau records show he ahembled before every sentence, including 'yes'.", "The headteacher ahembled so loudly that the microphone squealed.", 1],
["homejangle", "HOME-jang-ul", "n.", "The rattle of one particular person's keys in the front door, recognised instantly by every dog and child in the house.", "Coastal Mirrovan homjangel; Mirrovan fishwives claimed to know which husband was home by his keys alone.", "At the homejangle, the dog was at the door before Mum had even turned the key.", 0],
["rattlemint", "RAT-ul-mint", "n.", "The hopeful shake of a sweet box to find out whether there is one left.", "Gristle Cant, from the tin of mints on the tea trolley, which always rattled and was never, somehow, quite empty.", "Dad's rattlemint gave him away; he had been hiding the last one all afternoon.", 0],
["sloshwarm", "SLOSH-worm", "n.", "The gentle wobble and slosh of a hot-water bottle being hugged into bed.", "High Pellish, from a lullaby about a sheep who carried a flask of soup everywhere and was never cold again.", "I fell asleep to the sloshwarm against my tummy.", 0],
["zwishery", "ZWISH-er-ee", "n.", "The rhythmic swish of corduroy trousers rubbing together as someone walks, which makes sneaking impossible.", "From Lower Wobbleton, where the schoolmaster wore corduroy on purpose so his pupils could hear him coming.", "The zwishery of his trousers gave him away long before he reached the fridge.", 0],
["prinwhirr", "PRIN-wur", "n.", "The long, thoughtful grinding a printer makes before deciding not to print anything at all.", "Clerk No. 9's only recorded word, scribbled on a jammed page in 1987 and pinned to the Bureau noticeboard ever since.", "After a full minute of prinwhirr, the printer flashed an orange light and went quiet.", 1],
["scrawkle", "SKRAW-kul", "n.", "The screech of a single chair pushed back in a silent room, which makes the person who did it want to vanish.", "Old Blotvian skrawkel, 'the chair's tattle', from the belief that chairs report you to the teacher.", "My scrawkle interrupted the whole assembly right in the middle of the prayer.", 0],
["blinktock", "BLINK-tok", "n.", "The steady tick of a car's indicator, which gets weirdly louder while you wait for a gap in the traffic.", "Coined by a Fennick Valley carter who fitted a clicking lamp to his cart and regretted it by the first junction.", "We sat at the junction listening to the blinktock for what felt like a year.", 0],
["crinkfilm", "KRINK-film", "n.", "The crackling squawk of cling film being torn off its roll, usually at a hopeless angle.", "From Madame Ilse Vantablot, who wrapped her ink pots in waxed paper and declared the crinkfilm the sound of freshness.", "The crinkfilm went on for ages while Mum tried to find the end of the roll.", 0],
["tentpitter", "TENT-pit-er", "n.", "The first light patter of rain on a tent roof, cosy for exactly five minutes.", "Mount Ostentle climbers' word, said in a cheerful voice that grows less cheerful as the night goes on.", "We lay in our sleeping bags enjoying the tentpitter until a drip landed on my nose.", 0],
["sealthup", "SEEL-thup", "n.", "The soft sucking thump of a fridge door sealing shut, which sounds like it is keeping a secret.", "Isle of Umber word; islanders believe a good sealthup stops the cheeses gossiping overnight.", "I closed the fridge with a sealthup and pretended I had not touched the trifle.", 0],
["spinfare", "SPIN-fair", "n.", "The cheerful little tune a washing machine plays when it finishes, as if it has done something heroic.", "High Pellish spinfaer, 'the laundry's trumpet', from a time when washerwomen really did play trumpets at the end of washday.", "The spinfare rang out from the kitchen and nobody moved to empty the machine.", 0],
["doingle", "DOING-ul", "n.", "The long wobbling boing of a spring doorstop flicked by a curious finger.", "First catalogued after the Bureau cat Semicolon flicked the Smudge Room doorstop 312 times in one afternoon.", "Every toddler who visits finds the doorstop and fills the hall with doingles.", 0],
["snerkle", "SNER-kul", "v.", "To squeak while holding in a sneeze, producing a noise far stranger than the sneeze would have been.", "Coined by Brother Ludo of Gristlemoor, who was forbidden to sneeze during silent prayer and kept a tally of snerkles in the margin.", "She snerkled through the quiet bit of the film and set off the whole row giggling.", 0],
["earpock", "EER-pok", "n.", "The muffled pop inside your ears as a plane comes down, after which the whole world turns its volume back up.", "From Coastal Mirrovan, where pearl divers called it 'the sea letting go of your head'.", "After the earpock I could finally hear the pilot telling us we had landed.", 0],
["ploomb", "PLOOM", "n.", "The deep, round plunk of a stone dropped down a well, arriving much later than expected.", "Sub-Arctic Dunnish; Dunnish wells are so deep that waiting for the ploomb is a recognised hobby with its own club.", "We counted to four before the ploomb came floating back up the well.", 1],
["kneelhiss", "NEEL-hiss", "n.", "The great hiss and sigh of a bus lowering itself at a stop, as though it is tired of all of you.", "Coined in 1952 by a Port Scrivel bus conductor who swore his bus sighed louder on Mondays.", "With a kneelhiss the bus sank down and the doors folded open.", 1],
["vanwarble", "VAN-wor-bul", "n.", "The distant, wobbly tune of an ice-cream van three streets away, which you can never quite locate.", "Lower Wobbleton dialect; the village has one ice-cream van, and its tune has never once been in tune.", "At the first vanwarble every child on the street ran indoors with an open hand.", 0],
["cricketude", "KRIK-et-tewd", "n.", "The silence after a joke that nobody laughed at, which is not empty at all but full of people deciding where to look. It is the loudest quiet there is, and it lasts exactly as long as the teller can bear.", "Named by the poet Mabyn Ostrich-Haye after her reading of 1868, when she told a pun about inkwells to a full hall and heard, for the first time, a single cricket in the rafters. She wrote forty-seven poems about it and never told a joke again.", "My pun about teapots was met with a cricketude so long that the teacher started handing out worksheets.", 2],
["scrivelling", "SKRIV-el-ing", "n.", "The busy scratching of thirty pencils in an exam, which convinces you everyone else knows the answers.", "Named after Port Scrivel, a town made entirely of clerks, where nobody has spoken aloud since 1803.", "I sat frozen in the scrivelling, the only pencil in the room not moving.", 0],
["tickswell", "TIK-swel", "n.", "The way a clock's ticking grows louder and louder the harder you try to fall asleep.", "From Middle Quellish tikswel, 'the clock's swagger', recorded by a Quellish insomniac who finally kept his clock in the bread bin.", "By midnight the tickswell was so bad I buried the alarm clock in my sock drawer.", 1],
["spittersizz", "SPIT-er-siz", "n.", "The furious hiss and crackle when a single drop of water lands in a hot frying pan.", "Old Teaspoonic, from the Teaspoonic belief that pans are retired dragons who have been asked nicely to stop.", "A spittersizz made us all leap back from the hob.", 0],
["backbleep", "BAK-bleep", "n.", "The patient beeping of a lorry reversing somewhere nearby, which seems to get closer the longer it goes on.", "Gristle Cant; clerks use it for any colleague who backs out of a conversation very slowly and very loudly.", "The backbleep started at six in the morning and was still going at breakfast.", 0],
["paneskreek", "PANE-skreek", "v.", "To squeal a finger across a steamed-up window while drawing a face on it.", "Recorded on the Isle of Umber, where windows steam up nine months a year and every child is a master paneskreeker.", "My little brother paneskreeked a smiley face onto the car window, then a less friendly one.", 0],
["stirtinkle", "STIR-tink-ul", "n.", "The bright tinkle of a teaspoon stirring a mug, which tells the whole office that someone has made tea and not for them.", "Old Teaspoonic, the oldest word in the language; scholars believe Old Teaspoonic consisted of nothing but stirtinkles for its first century.", "A stirtinkle drifted from the kitchen and twelve heads turned towards it like sunflowers.", 1]
]);

// ===== words14.js =====
{
WD.add("objects", [
["unlockling", "un-LOK-ling", "n.", "The key on every keyring that opens nothing anyone can remember. Nobody dares throw it away, because the moment you do, the lock it belongs to will appear and demand to be opened.", "Archivist Prudence Nib's own keyring held a single unlockling from 1792 until her death; the Bureau has since tried it in every door, drawer and biscuit tin it owns. It opens none of them, and it is still kept, on a velvet cushion, just in case.", "Dad has tried the unlockling in the shed, the garage and next door's gate, and he still won't take it off the ring.", 2],
["widdersock", "WID-er-sok", "n.", "The lone sock left over after the wash, still waiting in the drawer for a partner who is never coming back. It is kept for years out of pure loyalty, and eventually becomes a duster without ever being told.", "From Low Frumpish widdersokke, 'the sock that waits', from a Frumpish ballad in which a stocking sits by the window for forty winters. Brother Ludo of Gristlemoor kept a widdersock as a bookmark and wrote it a short sad poem in the margin of every book it marked.", "I found the other half of my widdersock behind the radiator, but by then it had already become a puppet.", 2],
["tackulent", "tak-YOO-lent", "adj.", "Describing a surface still sticky where a price label was peeled off, no matter how hard anyone scrubs.", "Dr Horatio Quell's word, invented after he spent a whole afternoon picking at a new inkstand and announced that the glue was 'tackulent beyond reason'.", "The new photo frame stayed tackulent for months, collecting every crumb and hair in the house.", 1],
["gnawsterpiece", "NAW-ster-peece", "n.", "A pen lid chewed so thoroughly during exams that it has become a small, wet, abstract sculpture.", "Coined by the poet Mabyn Ostrich-Haye, who left a box of her gnawsterpieces to the nation and was politely refused.", "By the end of the maths paper, my pen lid was a gnawsterpiece with tooth-shaped corners.", 1],
["snapperling", "SNAP-er-ling", "n.", "The plastic safety clip at the back of a lanyard, designed to break off if pulled, which it does every single time you bend down.", "Gristle Cant, from the clerks' lanyards, which snapped so often that the Bureau eventually issued string.", "My snapperling gave way at the photocopier and my pass slid straight under the machine.", 0],
["orphawire", "OR-fa-wire", "n.", "A charging cable for a gadget nobody in the house has owned for at least a decade, kept in a drawer in case it turns up.", "From Vellumese orfawir, 'the rope with no ship', a phrase once used for any servant whose employer had moved abroad.", "The drawer contains six orphawires, none of which fit anything we own.", 0],
["bagwhisker", "BAG-wisk-er", "n.", "The little wire twist from a loaf of bread, saved in a mug for some important future job that never arrives.", "Port Scrivel bakers' slang, since the twists sticking out of a sack of loaves looked like a cat's face.", "Grandad uses a bagwhisker to hold his glasses together and refuses to discuss it.", 0],
["slivvock", "SLIV-ok", "n.", "The last thin wafer of soap, too small to wash with and too stubborn to throw away, usually pressed onto the new bar like a sticker.", "Old Blotvian slivok, 'soap's ghost', from the Blotvian practice of collecting them all year to make one enormous lump for midwinter.", "Mum squashed the slivvock onto the new bar, and now the soap has a mysterious green stripe.", 0],
["plyghost", "PLY-gohst", "n.", "The one sheet of toilet paper left clinging to the cardboard roll, so nobody technically has to replace it.", "A clerical error at the Bureau in 1958 combined the cards for 'ply' and 'ghost', and the clerks agreed the result was too accurate to correct.", "My brother left a plyghost on the roll and swore that meant it wasn't finished.", 1],
["reservoon", "rez-er-VOON", "n.", "The spare button sewn inside a new shirt, which is never used, because the button that falls off is always a different one.", "Coastal Mirrovan reservun, 'the button for later', from tailors who sewed lucky spares into sailors' coats.", "I lost a cuff button and found that the reservoon was, naturally, a collar button.", 0],
["postloop", "POHST-loop", "n.", "The red rubber band dropped by the postie, which you find on the doorstep, on the pavement, and somehow inside your shoe.", "Isle of Umber word; Umber postmen are paid partly in rubber bands and must leave a postloop at every door as a receipt.", "There are eleven postloops on our door handle, which is now basically a sculpture.", 0],
["scrawlpatch", "SKRAWL-patch", "n.", "The scrap of paper covered in spirals and zigzags from testing pens to see which ones still work.", "From Madame Ilse Vantablot's workshop, where every new batch of ink was proven on a scrawlpatch pinned to the wall.", "The scrawlpatch by the phone holds a hundred tiny loops and one important number nobody can find.", 0],
["coastermiss", "KOHST-er-miss", "n.", "The pale ring left on a wooden table by a hot mug placed one centimetre from the coaster.", "High Pellish, from a Pellish table so ringed by coastermisses that it was eventually sold as a map of the stars.", "Gran spotted the coastermiss from across the room before I had even sat down.", 0],
["eatnotling", "EET-not-ling", "n.", "The small papery sachet of beads found in new shoeboxes and coat pockets, which says DO NOT EAT and somehow makes you want to.", "Middle Quellish etnotlinge, 'the forbidden pebble', a name first given to pretty stones from the Fennick Valley that children were warned not to swallow.", "My little sister held up the eatnotling and asked, quite seriously, what it would taste like.", 1],
["drumpenny", "DRUM-pen-ee", "n.", "The coin that rattles round inside the washing machine drum for weeks, never quite falling out to be claimed.", "The merchant Ebbe Tannick reckoned every washing machine in Lower Wobbleton held a drumpenny and calculated the town's total savings accordingly.", "The drumpenny clanged around the spin cycle like a tiny drummer who wanted out.", 0],
["brolligast", "BROL-ee-gast", "n.", "An umbrella blown inside out and abandoned in a bin, its spokes poking up like the legs of a dead spider.", "Drabble Marshes dialect; on windy days the marsh bins fill with brolligasts, and locals call it the umbrella harvest.", "Every bin on the high street had a brolligast sticking out of it after the storm.", 1],
["railglove", "RAIL-gluv", "n.", "A lost glove that a kind stranger has picked up and placed on a railing, waving hopefully at whoever dropped it.", "First described by Brother Ludo of Gristlemoor, who found a railglove every winter outside the abbey and wrote down each one in the margin of the visitors' book.", "There was a railglove on the park fence, one finger pointing towards the bus stop.", 1],
["bagnest", "BAG-nest", "n.", "The plastic bag stuffed full of other plastic bags under the kitchen sink, growing quietly like a cloud.", "Sub-Arctic Dunnish, where people genuinely build nests of bags in winter and are surprisingly warm.", "I opened the cupboard and the bagnest burst out like a startled animal.", 0],
["souvenagnet", "soo-ven-AG-net", "n.", "A fridge magnet from a seaside town that nobody in the family remembers ever visiting.", "Coined at the Bureau tea trolley in 1964, when a magnet reading 'Greetings from Mount Ostentle' appeared on the urn and nobody would admit to having gone.", "The souvenagnet with a crab on it has held up the bin calendar for nine years.", 0],
["bobblecuff", "BOB-ul-kuf", "n.", "The hair band worn round the wrist for so long that it has left a permanent groove and forgotten it was ever meant for hair.", "From Lower Wobbleton, where schoolgirls once traded bobblecuffs as currency, three for a liquorice stick.", "She rescued the bobblecuff from her wrist and tied up her hair without even looking.", 0],
["snapfork", "SNAP-fork", "n.", "The plastic takeaway fork that loses a prong on the very first chip and is then used anyway, with grim determination.", "Gristle Cant, recorded at the Bureau's annual picnic, where forty clerks owned forty snapforks between them by the end of lunch.", "I ate the whole curry with a two-pronged snapfork and a lot of patience.", 0],
["stubbock", "STUB-ok", "n.", "A pencil sharpened down to a nub so short it can only be held by the very tips of your fingers, yet still not thrown away.", "From Proto-Snorrish stubok, 'the brave one', since a Snorrish pencil was never discarded while it could still write a single letter.", "He wrote the whole test with a stubbock, his knuckles scraping the desk.", 0],
["butterstow", "BUT-er-stoh", "n.", "The toast crumb buried in the butter, evidence that someone did not use a clean knife.", "Old Teaspoonic butterstoe, 'what the knife left behind', used in Teaspoonic courts as proof of guilt.", "The butterstow told Mum exactly who had made toast without washing up.", 0],
["battlaband", "BAT-la-band", "n.", "The rubber band wrapped round a TV remote to hold the batteries in, since the little cover vanished years ago.", "A Port Scrivel word; the Bureau's own remote control has worn the same battlaband since 1979.", "If you knock the remote off the sofa, the battlaband pings off and the batteries scatter.", 0],
["refoldum", "ree-FOLD-um", "n.", "An instruction leaflet unfolded once and now impossible to fold back along its original creases.", "Coined by Dr Horatio Quell, who spent an evening refolding a map of the Fennick Valley and finished with something closer to a hat.", "The refoldum from the new kettle now lives crumpled in the drawer, slightly larger than the drawer.", 0],
["remnabolt", "REM-na-bolt", "n.", "The single screw left over after building flat-pack furniture, which makes you distrust the whole wardrobe forever.", "From Vellumese remnabolte, 'the bolt of doubt', originally said of a ship launched with one plank still on the dock.", "The bookcase looks fine, but the remnabolt on the carpet says otherwise.", 0],
["wonkerwheel", "WONK-er-weel", "n.", "The one wheel on a shopping trolley that refuses to point the same way as the others and drags you towards the biscuits.", "High Pellish wonkerwhel, 'the wheel with its own opinions', applied at first to stubborn ox carts.", "I got the trolley with the wonkerwheel and spent the whole shop walking diagonally.", 0],
["scrattlejar", "SKRAT-ul-jar", "n.", "The jar of mixed screws, buttons, washers and mystery bits that everyone tips out on the table when looking for one specific thing.", "Fennick Valley dialect; a scrattlejar was once a dowry item, and a good one could buy a cow.", "Dad emptied the scrattlejar on the table and found everything except the screw he needed.", 0],
["tetherquill", "TETH-er-kwil", "n.", "The pen fastened to a counter with a little chain, which never works and always reaches just short of the form.", "From the Bureau's front desk, where Archivist Prudence Nib chained a quill in 1793 after losing ninety-four.", "I stretched the tetherquill as far as it could go and signed my name at a slant.", 0],
["zombipen", "ZOM-bee-pen", "n.", "A dried-out felt tip that someone keeps putting back in the pot, where it waits to ruin your next drawing.", "Gristle Cant, coined in the Smudge Room by clerks who swore the dead pens climbed back into the jar at night.", "I picked the purple and it was a zombipen, so my unicorn has a faint grey mane.", 0],
["tillmarker", "TIL-mark-er", "n.", "A receipt used as a bookmark, so the book is permanently opened at page 112 and the reminder that you bought three bananas.", "Coined by a Port Scrivel librarian who once catalogued four hundred tillmarkers left inside returned books.", "Halfway through the novel, my tillmarker told me I had once spent far too much on cheese.", 0],
["snaptab", "SNAP-tab", "n.", "The ring pull that breaks off a tin before the tin has opened, leaving you holding a little metal loop and a lot of regret.", "Middle Quellish snaptabbe; Quellish fishermen threw snaptabs back into the sea to apologise to the sardines.", "The snaptab came off in my hand and the beans stayed firmly inside.", 0],
["peelwax", "PEEL-waks", "n.", "A crayon with its paper wrapper picked off, now naked, broken and somehow blunter than before.", "Recorded by the Bureau cat Semicolon's keeper, who noticed Semicolon peeled every crayon in the building but never ate one.", "The tin was full of peelwax, so every colour came out stubby and smudged.", 0],
["hookberg", "HOOK-berg", "n.", "A single coat hook carrying six coats, three bags and a scarf, nine-tenths of it hidden underneath.", "From Sub-Arctic Dunnish hukberg, a word first used for an iceberg that had frozen around a fishing net and several hats.", "I found my school coat at the very bottom of the hookberg, still a bit damp.", 0],
["solebrick", "SOHL-brik", "n.", "The toy building brick that waits in the dark carpet for a bare foot, always pointing upwards.", "Proto-Snorrish solbrikka, 'the foot's enemy', originally a pointed stone left on a doorstep to stop trolls.", "I stood on a solebrick on my way to the loo and woke the whole house.", 0],
["orphalid", "OR-fa-lid", "n.", "A plastic tub lid that fits none of the tubs in the cupboard, kept on the off chance that its tub returns.", "Coastal Mirrovan orfalid, also the name for a hat floating in the harbour with no head nearby.", "The orphalid is on every tub in turn and fits none of them.", 0],
["curlstray", "KURL-stray", "n.", "A curl of shiny gift ribbon found weeks after a birthday, stuck to the carpet like a festive worm.", "From Lower Wobbleton, where birthday ribbons are said to wriggle away and hide under sofas to avoid the bin.", "I found a curlstray under the bed in March and briefly thought it was alive.", 0],
["dadcrater", "DAD-kray-ter", "n.", "The permanent dip in a sofa cushion, perfectly shaped like the one person who always sits there.", "Coined in 1911 by Clerk No. 9, who sat on the same Bureau chair for forty years and left a dadcrater still visible today.", "The dog sleeps in the dadcrater the moment Dad stands up.", 1],
["clickpebble", "KLIK-peb-ul", "n.", "A stone wedged in a trainer's tread that clicks on every hard floor, impossible to dig out with anything you own.", "From the Isle of Umber, where children judge each other's journeys by the number of clickpebbles they bring home.", "My clickpebble announced me down the whole school corridor.", 0],
["tagbarb", "TAG-barb", "n.", "The little plastic T-shaped thread that attaches a price tag to new clothes, which survives the scissors and scratches you for weeks.", "Gristle Cant; Bureau clerks fixed index cards to their winter coats with tagbarbs and never got them out again.", "I wore my new jumper all day before finding the tagbarb lodged in the collar.", 0],
["pinmine", "PIN-mine", "n.", "One of the many hidden pins in a brand-new shirt, discovered only after you have put it on.", "From the tailors of High Pellish, who hid a pinmine in every shirt to make sure the buyer checked their work.", "I thought I'd found every pinmine, until I lifted my arm.", 0],
["jigstray", "JIG-stray", "n.", "The single jigsaw piece found under the sofa months after the puzzle was declared incomplete and put away.", "The poet Mabyn Ostrich-Haye spent a winter on a thousand-piece puzzle of Mount Ostentle; the summit turned up the following spring as a jigstray in her slipper.", "The jigstray had a bit of sky on it, so now we have to start again.", 1],
["intruspoon", "IN-troo-spoon", "n.", "The one spoon in the cutlery drawer that belongs to no set, arrived from nowhere, and is everyone's secret favourite.", "Vellumese intruspun, 'the guest at the table', from the belief that an odd spoon brings luck to a house.", "We all fight over the intruspoon because it fits a yogurt pot perfectly.", 1],
["jamladle", "JAM-lay-dul", "n.", "The kitchen tool that stops a drawer from opening by catching itself on the cupboard above.", "Old Blotvian jamladel, from a ladle so legendary for jamming drawers that the Blotvians buried it with honours.", "The jamladle held the drawer shut for ten minutes while I starved.", 0],
["giftcrumb", "GIFT-krum", "n.", "A gift card with a tiny sum still on it, too little to buy anything and too much to throw away.", "Coined by the merchant Ebbe Tannick, who printed the first gift cards and quietly hoped everyone would leave giftcrumbs.", "I had a giftcrumb of twelve pence, so I bought one pencil and a lot of time.", 0],
["relightling", "ree-LITE-ling", "n.", "A half-burnt birthday candle that goes back in the drawer and returns, shorter each time, for cake after cake.", "From Gristlemoor; Brother Ludo used one relightling for every feast for nine years, and wrote down its final night.", "Grandma's cake had seven new candles and one ancient relightling.", 0],
["dustfern", "DUST-fern", "n.", "A plastic plant that has stood in the same corner for years, slowly turning grey with a coat of dust.", "Drabble Marshes dialect; the marsh folk believe a dustfern is a real plant that has simply given up.", "Nobody has watered the dustfern because nobody is quite sure it isn't real.", 0],
["mugexile", "MUG-ek-sile", "n.", "The novelty mug at the back of the cupboard that nobody ever chooses, only used when everything else is dirty.", "From a Bureau mug reading WORLD'S OKAYEST CLERK, which spent sixty years in exile behind the teapot.", "All the good mugs were in the sink, so I had to drink from the mugexile.", 0],
["tagdread", "TAG-dred", "n.", "The label on a mattress that says DO NOT REMOVE, which nobody removes and nobody dares ask why.", "Middle Quellish, from a Quellish legend in which a man removed his mattress label and was found the next morning living in a shed.", "My brother dared me to rip off the tagdread, and I lasted two seconds before running away.", 0],
["envelopane", "en-ve-LOP-ane", "n.", "The little plastic window on an envelope, through which the bill stares out before you have opened it.", "Madame Ilse Vantablot called it the envelopane and refused to post anything with one, because she said it spied on her ink.", "The envelopane showed just enough of the letter to make me feel worried.", 0],
["trolliquet", "trol-ee-KET", "n.", "The plastic token on your keyring meant to unlock a shopping trolley, forgotten every single time you need it.", "A clerical error: the Bureau filed 'trolley etiquette' as one word, and somehow the token has suffered ever since.", "My trolliquet was at home on my other keys, so I carried the shopping in my arms.", 0],
["crispangle", "KRISP-ang-ul", "n.", "A crisp packet folded into a tight little triangle by someone who wants credit for tidiness.", "From Port Scrivel, where pupils fold crispangles at break and flick them across desks like tiny paper footballs.", "There were three crispangles neatly lined up on the car dashboard.", 0],
["clipwand", "KLIP-wond", "n.", "A paperclip unbent into a straight wire, used to reset gadgets, clean keyboards or poke a phone's secret hole.", "Gristle Cant; filing clerks once used clipwands to fish lost cards out of the Unword Ledger's spine.", "Dad fixed the router with a clipwand and looked smug for the rest of the evening.", 0],
["hoodswallow", "HOOD-swol-oh", "n.", "The drawstring of a hoodie that has slipped inside the hood and must now be rescued with a safety pin and patience.", "From the Coastal Mirrovan saying 'the hood swallowed the rope', meaning a job that takes all afternoon.", "I spent my whole lunch break fishing the hoodswallow back out with a pin.", 0],
["frayneck", "FRAY-nek", "adj.", "(Of a charger cable) split and bent at the plug end, held together by tape, luck and careful positioning on the bed.", "Old Blotvian frayneke, originally said of a goose that had seen too many winters.", "My charger is so frayneck it only works if it points north.", 0],
["flyerdrift", "FLY-er-drift", "n.", "The pile of takeaway menus and leaflets that builds up behind the front door like snow, until the door barely opens.", "Sub-Arctic Dunnish, where postmen are said to deliver leaflets only to houses with no snow, out of jealousy.", "We came home from holiday and had to push the door open through the flyerdrift.", 0],
["clingnut", "KLING-nut", "n.", "A packing peanut that sticks to your sleeve with static, then to your other sleeve, then to the dog.", "From Vellumese klingnuth, 'the clinging guest', first used for a cousin who stayed at the Bureau for twelve years.", "Even after I tidied up the parcel, a clingnut was still hanging off my jumper.", 0],
["clutterdock", "KLUT-er-dok", "n.", "The kitchen drawer where everything with no home goes: batteries, birthday candles, takeaway chopsticks, mystery keys, a single dice. Everyone has one, no one has ever emptied one, and it always contains exactly one rubber band too few.", "Named after the Clutter Dock of Port Scrivel, a harbour said to receive every lost thing in the world. The Bureau kept its own clutterdock in the Smudge Room; when it was finally opened in 1950 it held three cats' collars, a map of Mount Ostentle and a fully working telescope.", "I looked for the scissors in the clutterdock and came out holding a whistle, a fuse and a dried conker.", 2],
["hoardsoap", "HORD-sohp", "n.", "The little wrapped hotel soap brought home and saved for a special occasion that never comes.", "The merchant Ebbe Tannick kept a trunk of hoardsoap, which his grandchildren found and sold back to the hotel.", "Gran's bathroom cabinet holds forty hoardsoaps and not a single bar we are allowed to use.", 0],
["fogfilm", "FOG-film", "n.", "The thin plastic protector still stuck to a new gadget's screen, never peeled off, slowly gathering scratches and bubbles.", "Coined by Dr Horatio Quell, who refused to remove the fogfilm from anything and lived in a mild blur.", "Dad's phone still has the fogfilm on it, with a bubble right where the clock is.", 0],
["bobbystray", "BOB-ee-stray", "n.", "A hair grip found on the floor, in the car, inside a book, or in the soup, long after anyone used one.", "From Gristlemoor, where monks found so many bobbystrays in the abbey that they assumed a ghost was combing her hair.", "There was a bobbystray in the cereal box, and nobody in the house has long hair.", 0],
["bauberrant", "baw-BERR-ant", "n.", "A Christmas bauble found under the sofa in the middle of summer, still trying hard to be festive.", "From Lower Wobbleton; it is considered lucky to find a bauberrant, and luckier still not to tread on it.", "We found a bauberrant behind the bookcase in July and hung it on the houseplant.", 0],
["abandonote", "a-BAN-doh-note", "n.", "A notebook with three pages of beautiful handwriting at the start, then nothing but blank hope.", "Recorded by the poet Mabyn Ostrich-Haye, who owned two hundred abandonotes and was certain the next one would be different.", "I bought a fresh abandonote for my diary, wrote one page, and used the rest for maths.", 0],
["pocketshore", "POK-et-shor", "n.", "A smooth pebble brought home from a beach that looked special at the time and now sits on a shelf, utterly ordinary.", "From the Isle of Umber, where visitors take so many pocketshores home that the beach shrinks every summer.", "The pocketshore by my bed is the only thing left of that holiday besides a sunburn.", 0],
["pennomad", "PEN-oh-mad", "n.", "A pen bearing the name of a company that nobody in the house has ever worked for or even heard of.", "Gristle Cant, from pens wandering into the Bureau from offices in towns that the clerks could not find on any map.", "I signed the birthday card with a pennomad from a carpet shop in another country.", 0],
["pricetattle", "PRISE-tat-ul", "n.", "The price sticker left on a present by mistake, quietly telling the person exactly what it cost.", "From Old Teaspoonic prycetatel, 'the gossiping label', from a market where labels were thought to whisper.", "Auntie Gwen peeled off the pricetattle and smiled a bit too widely.", 0],
["incasebox", "in-KASE-boks", "n.", "The cardboard box kept in the loft for an appliance that broke or was given away years ago, just in case.", "A clerical error: the phrase 'in case box' was stamped on so many Bureau cartons that it became a single word.", "The loft is full of incaseboxes for things we no longer have, including a box for a box.", 0],
["phantomote", "FAN-tom-ote", "n.", "A remote control that does not belong to anything in the house, yet everyone is afraid to throw it out.", "From the Fennick Valley, where an old farmhouse is said to hold a phantomote that turns on the radio in the house next door.", "I pressed every button on the phantomote and nothing happened anywhere, as far as we know.", 1],
["plugrelic", "PLUG-rel-ik", "n.", "The travel adaptor for a country you visited once, kept in a drawer in case you go back.", "Coined by the merchant Ebbe Tannick, who owned plugrelics for nine countries and a fear of travel.", "The drawer holds a plugrelic shaped like a small angry face.", 0],
["stickaside", "STIK-a-side", "n.", "A strip of sticky tape stuck to the table edge for later, forgotten until it picks up a crumb, a hair, and eventually your sleeve.", "Gristle Cant, from clerks who prepared stickasides before wrapping parcels and then could never find the end of the roll again.", "There were four stickasides on the edge of the desk, each one wearing a tiny bit of glitter.", 0],
["capcollar", "KAP-kol-ar", "n.", "The plastic ring left on a milk bottle's neck after the cap twists off, which is too stiff to remove and too silly to keep.", "From High Pellish kapkolar, 'the bottle's necklace', first used for the wax rings around old ink jars.", "The cat stole a capcollar and batted it round the kitchen for an hour.", 0],
["meltnose", "MELT-nohz", "n.", "The carrot found lying in a damp patch of lawn in spring, the last remains of a snowman who melted.", "Proto-Snorrish meltnos; Snorrish children say a meltnose must be fed to the birds, or the snowman will be lonely.", "We found the meltnose in March and gave it a proper burial by the shed.", 1]
]);

// ===== words15.js =====
{
WD.add("tiny", [
["patterpock", "PAT-er-pok", "v.", "To slap all your pockets in quick order, chest, hips, back, chest again, checking for keys, phone and wallet. It is done on every doorstep in the world, usually twice, and very often while holding the keys.", "Recorded in 1802 by Archivist Prudence Nib, who watched the Bureau's night porter patterpock for eleven minutes before noticing the keys were in his mouth. She added the word to the Unword Ledger with a footnote: 'he was very thorough'.", "Mum patterpocked on the doorstep, sighed, and then found the keys already in the lock.", 2],
["hiplatch", "HIP-latch", "v.", "To bump a door shut with your hip because both arms are full of shopping.", "Old Blotvian hiplakke, a dance step performed at harvest suppers by people carrying two pies.", "She hiplatched the car door and carried all six bags into the house in one go.", 0],
["soupuff", "soo-PUFF", "v.", "To blow gently across a hot spoonful while staring at it, as though bargaining with it.", "Middle Quellish supuffen; Quellish children were taught to soupuff three times, once for each grandparent.", "He soupuffed so long that the soup was cold by the time it reached his mouth.", 0],
["liftprod", "LIFT-prod", "v.", "To press the lift button again although it is already lit, just in case the lift needs reminding.", "Gristle Cant, coined by clerks waiting for the Bureau's single lift, which is believed to have been on its way since 1931.", "Everyone in the lobby liftprodded in turn, as if it were a group project.", 0],
["thumbsmite", "THUM-smite", "v.", "To tap a phone screen harder and harder, as though the problem is that it did not feel you the first time.", "Coined by Dr Horatio Quell, who thumbsmote his pocket watch whenever it disagreed with him.", "Gran thumbsmites the tablet so hard the whole table shakes.", 0],
["hobhaunt", "HOB-hawnt", "v.", "To hover a flat palm over a cooker ring to find out whether it is still hot, too scared to actually touch it.", "From the Fennick Valley belief that a ghost lives in every warm stove and must be greeted before cleaning.", "Dad hobhaunted the cooker for a full minute before wiping it with a very fast cloth.", 1],
["whiffjudge", "WIF-judge", "v.", "To sniff the milk before pouring it, then hand it to someone else to sniff because you still cannot decide.", "Low Frumpish whiffjuj, a market inspector who tested cheese by nose and was never wrong, or never admitted it.", "We passed the bottle round the table and whiffjudged it until everyone voted for toast instead.", 0],
["wakewiggle", "WAKE-wig-ul", "v.", "To jiggle a computer mouse to wake the screen, then keep jiggling while it thinks.", "Vellumese wekwiggel, originally the shaking of a sleeping clerk's elbow by a supervisor.", "I wakewiggled the mouse until a password box appeared and I realised I had forgotten it.", 0],
["lockwaggle", "LOK-wag-ul", "v.", "To tug the door handle two or three times after locking it, just to make sure the lock is still being a lock.", "From the Isle of Umber, where nobody locks their doors but everybody lockwaggles them anyway, out of habit.", "I lockwaggled the front door, walked to the car, then went back and did it again.", 0],
["seamthumb", "SEEM-thum", "v.", "To rub the top of a thin plastic produce bag between finger and thumb, hunting for the opening that is not there.", "Coastal Mirrovan seamthum, said of sailors trying to find the end of a knot in the dark.", "I seamthumbed for so long at the fruit stall that the queue grew behind me.", 0],
["lickflick", "LIK-flik", "v.", "To dampen a fingertip on your tongue before turning a page, a habit learned from grandparents and accountants.", "High Pellish likflik, from Pellish bankers who licked their thumbs so often their notes were always a little damp.", "Grandad lickflicked his way through the whole newspaper.", 0],
["chillflop", "CHIL-flop", "v.", "To turn your pillow over in the night to reach the cool side, then lie very still to enjoy it.", "Sub-Arctic Dunnish chilflop; in Dunnish homes, where every side is cold, the word means simply 'to give up'.", "I chillflopped at two in the morning and fell asleep almost straight away.", 0],
["toeprobe", "TOE-probe", "v.", "To dip one toe into a bath to test the water, then pull it out with a gasp as if it bit you.", "From Lower Wobbleton, where the village pond is toeprobed every New Year by the whole parish before anyone dares swim.", "I toeprobed the bath three times before admitting it needed cold water.", 0],
["squintlean", "SKWINT-leen", "v.", "To lean forward and narrow your eyes at a distant sign, as though leaning helps.", "Coined by the merchant Ebbe Tannick, who squintleaned at every price board in Port Scrivel and still overpaid.", "We all squintleaned at the departure board as if two inches would make the numbers clearer.", 0],
["aimloft", "AYM-loft", "v.", "To raise a TV remote higher and higher as the batteries die, eventually holding it above your head like a torch.", "Gristle Cant; Bureau clerks aimlofted their rubber stamps when the ink ran low, a habit that helped nothing.", "Dad aimlofted the remote at the ceiling until the channel finally changed.", 0],
["tunnelgulp", "TUN-el-gulp", "v.", "To hold your breath all the way through a tunnel in the car, puffed cheeks and all, for reasons no child can explain.", "Proto-Snorrish tunnelgulp, from a Snorrish dare to cross a cave without breathing so the bats would not notice.", "We tunnelgulped the whole way through the hill and burst out laughing on the other side.", 0],
["wrongpush", "RONG-push", "v.", "To push firmly against a door clearly marked PULL, then pull it while pretending you meant to all along.", "From the Bureau's front entrance, whose PULL sign was printed backwards in 1902 and kept that way for the entertainment of the clerks.", "I wrongpushed the café door in front of my whole class.", 0],
["wavelorn", "WAVE-lorn", "v.", "To wave back at someone who was waving at somebody behind you, then turn it into a hair-scratch.", "Coined by the poet Mabyn Ostrich-Haye, who wavelorned at a harbour full of strangers and wrote a sonnet to recover.", "I wavelorned at a woman across the street, then pretended to brush something off my head.", 1],
["phonedive", "FOHN-dive", "v.", "To suddenly study your phone with great interest to avoid making eye contact with someone you half know.", "A Port Scrivel word, first said of clerks who buried their noses in ledgers whenever the overdue-fines collector walked past.", "When my old swimming teacher got on the bus, I phonedived so hard I read my own emails twice.", 0],
["luckpuff", "LUK-puff", "v.", "To blow on a pair of dice before rolling them, as if luck travels by breath.", "Old Teaspoonic; Teaspoonic gamblers luckpuffed on their tea leaves, which is why the leaves were always on the floor.", "My brother luckpuffed on the dice, rolled a two, and blamed the dice.", 0],
["tagtuck", "TAG-tuk", "v.", "To silently tuck the label back into someone else's collar, a small kindness done without asking.", "First recorded at the Bureau tea trolley, where the tea lady tagtucked every clerk who bent over the biscuits.", "A stranger in the queue tagtucked my jumper and was gone before I could say thank you.", 0],
["penclickle", "PEN-klik-ul", "v.", "To click a pen over and over while thinking, unaware it is driving everyone else in the room mad.", "Dr Horatio Quell's word, coined to describe his students, though the minutes of the time show it was mostly him.", "Ana penclickled through the whole test until the teacher took the pen away.", 0],
["ringtwiddle", "RING-twid-ul", "v.", "To spin a ring round and round your finger with your thumb while listening, waiting or worrying.", "From Middle Quellish, where a bride who ringtwiddled at her own wedding was said to be counting her blessings.", "Mum ringtwiddled the whole way through the school play.", 0],
["loojig", "LOO-jig", "v.", "To bounce from foot to foot while waiting outside a locked loo, very politely and very fast.", "Gristle Cant; the Bureau has one loo for forty clerks, and the queue for it is known as the Loojig Line.", "My cousin loojigged outside the bathroom door, knocking every ten seconds.", 0],
["drumpatter", "DRUM-pat-er", "v.", "To drum your fingertips on a table in a little gallop, while waiting for something that is not arriving.", "From the Drabble Marshes, where drumpattering on a gate is the polite way to call for the farmer.", "The man at the counter drumpattered while the card machine thought about it.", 0],
["armwhiff", "ARM-wif", "v.", "To discreetly sniff your own sleeve or shoulder to check whether you smell, usually after PE.", "Mount Ostentle climbers' word, since nobody up there has washed since the base camp.", "I armwhiffed in the corridor and decided I could probably survive until home time.", 0],
["rindswirl", "RINDE-swirl", "v.", "To peel a satsuma in one single spiral, then show the peel to anyone nearby as proof of greatness.", "From Vellumese rindsvirl, a competition at the Vellumese midwinter fair, with a silver spoon for the longest unbroken peel.", "I rindswirled a perfect satsuma and nobody in my family looked up.", 0],
["toothwob", "TOOTH-wob", "v.", "To keep wiggling a loose tooth with your tongue, all day, unable to leave it alone.", "Coined by Brother Ludo of Gristlemoor, who toothwobbed through a whole winter of silent prayer and drew the tooth in the margin every day.", "She toothwobbed all through dinner until the tooth landed in her peas.", 1],
["warmwaggle", "WORM-wag-ul", "v.", "To wiggle your fingers under a running tap, waiting for the cold water to turn warm.", "High Pellish wormwagle; Pellish inns charged extra for taps that warmed before the third waggle.", "I warmwaggled at the sink for ages before remembering the boiler was off.", 0],
["matscuff", "MAT-skuff", "v.", "To scrape your shoes on the doormat several times more than needed, so the host can see you are a good guest.", "From Old Blotvian matskuf, the formal greeting of a visitor who has walked through a muddy field.", "Grandad matscuffed so thoroughly that he wore a hole in the doormat.", 0],
["dustclap", "DUST-klap", "v.", "To clap your hands briskly together to get rid of flour, sand or crumbs, as if announcing a job well done.", "Coined in a Gristlemoor bakery, where the bakers dustclapped at the end of each batch and the whole street came out in white.", "He finished the sandcastle, dustclapped, and admired his work like a builder.", 0],
["levelnudge", "LEV-el-nudge", "v.", "To straighten a slightly wonky picture frame on someone else's wall when they are out of the room.", "From Coastal Mirrovan levelnudj, a sailor's habit of straightening anything crooked, since a crooked ship is a sinking ship.", "Auntie Rose levelnudged every picture in our house before she took her coat off.", 0],
["rimtap", "RIM-tap", "v.", "To tap your teaspoon twice on the rim of a mug after stirring, like a judge closing a case.", "Old Teaspoonic, naturally, where the number of rimtaps showed your mood: two for content, four for fury.", "She rimtapped her cup and announced the meeting could now start.", 0],
["darkflick", "DARK-flik", "v.", "To flick on the light switch during a power cut, purely by habit, every time you walk into a room.", "Recorded in 1921, when the Bureau lost its lights for a week and Clerk No. 9 darkflicked some four hundred times.", "We darkflicked in every room during the blackout and laughed every time.", 0],
["smudgebuff", "SMUJ-buff", "v.", "To wipe your glasses on your jumper, which only spreads the smudge into a wider, more even blur.", "From the Smudge Room itself, where smudgebuffing was the official method of cleaning anything at all.", "Mr Pike smudgebuffed his glasses and squinted at us through a fresh fog.", 0],
["sleevemitt", "SLEEVE-mit", "v.", "To pull your jumper sleeves down over your hands until they become a pair of woolly mittens.", "Sub-Arctic Dunnish slevmit, where it is less of a habit and more of a legal requirement.", "I sleevemitted the whole walk home because I left my gloves on the bus.", 0],
["toescrunge", "TOE-skrunj", "v.", "To grip a thick carpet or warm sand with your toes, scrunching and unscrunching with deep satisfaction.", "From Lower Wobbleton, whose only carpet shop invites customers to toescrunge every rug before buying.", "I stood barefoot on the new rug and toescrunged until Mum asked what I was doing.", 0],
["spinetilt", "SPINE-tilt", "v.", "To tilt your head sideways in a bookshop to read the titles on the spines, until your neck forgets which way is up.", "Coined by the poet Mabyn Ostrich-Haye, who spinetilted in a Port Scrivel bookshop so long she walked out at an angle.", "I spinetilted down the whole shelf and came out with a crick and no book.", 0],
["lategrab", "LATE-grab", "n.", "A lightning-fast snatch at something falling, made a full second after it has already hit the floor.", "Gristle Cant; the clerks' annual award for the slowest lategrab is a small cup, which has been dropped many times.", "My lategrab came after the egg had already broken, but it looked very heroic.", 1],
["holdjog", "HOLD-jog", "v.", "To hold a door open for someone still far away, forcing them into an awkward little jog to reach it.", "From the Bureau's revolving door, the only door in the building nobody can holdjog, which the clerks find very restful.", "The man by the library holdjogged me from all the way across the car park.", 1],

});
if (n) WD.addInk(20 * n);
},

};
}

{

};
const card = (x, y, w, h, rot, kind, z) => {
const bg = kind === 'manila' ? '#e6c98a' : kind === 'blue' ? '#dfe7ef' : kind === 'pink' ? '#f4dcd2' : '#fbf5e4';
return '<div style="position:absolute;left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;width:' + w + 'px;height:' + h + 'px;transform:rotate(' + rot.toFixed(1) + 'deg);z-index:' + z + ';' +
'background:linear-gradient(to bottom,transparent ' + (h * 0.24) + 'px,#d9776f ' + (h * 0.24) + 'px,#d9776f ' + (h * 0.24 + 1.4) + 'px,transparent ' + (h * 0.24 + 1.4) + 'px),repeating-linear-gradient(to bottom,transparent 0 ' + (h * 0.15) + 'px,rgba(120,150,190,.55) ' + (h * 0.15) + 'px ' + (h * 0.15 + 1) + 'px) 0 ' + (h * 0.26) + 'px/100% 100% no-repeat,' + bg + ';' +
'box-shadow:0 1px 1px rgba(0,0,0,.35),0 4px 9px rgba(0,0,0,.35);border-radius:1px"></div>';
};

const rect = (x, y, w, h, rot, col, z) => '<div style="position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;border:' + 5 + 'px double ' + col + ';border-radius:4px;opacity:.86;transform:rotate(' + rot + 'deg);z-index:' + z + '" class="ink-mask"></div>';
WD.Tile = {
show() {
document.body.classList.add('tileMode'); const T = WD.$('#tile'); T.classList.remove('hide');
const r = WD.rng(1792), W = 1640, lines = ['THESE', 'WORDS', "DON'T", 'EXIST'], cw = 36, ch = 23.5, gapRows = 1.15;
let html = '<div style="position:absolute;inset:0;background:repeating-linear-gradient(92deg,rgba(255,220,170,.035) 0 3px,transparent 3px 11px),repeating-linear-gradient(88deg,rgba(0,0,0,.08) 0 1px,transparent 1px 23px)"></div>' +
'<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,214,150,.4),transparent 60%)"></div>';
for (let i = 0; i < 70; i++) { const x = r() * W, y = r() * 820; if (x > 250 && x < W - 250) continue; html += card(x - 60, y - 38, 128, 80, (r() - 0.5) * 70, r() < 0.3 ? 'manila' : r() < 0.15 ? 'blue' : 'cream', 1 + Math.floor(r() * 5)); }
const widthOf = s => [...s].reduce((a, c, i) => a + F[c][0].length + (i ? 1 : 0), 0);
const totalH = (7 * 4 + gapRows * 3) * ch, y0 = (820 - totalH) / 2 + 2;
let z = 10;
lines.forEach((s, li) => {
const cols = widthOf(s); let cx = (W - cols * cw) / 2; const yL = y0 + li * (7 + gapRows) * ch;

const kind = r() < 0.1 ? 'manila' : r() < 0.05 ? 'blue' : r() < 0.04 ? 'pink' : 'cream';

}
cx += (g[0].length + 1) * cw;
});
});
[[110, 90, 130, -12], [1420, 520, 150, 18], [1222, 282, 92, 8], [1296, 586, 84, -16], [1460, 130, 96, -20], [60, 560, 110, 25]].forEach(([x, y, s, rt]) => html += ring(x, y, s, rt, '#c3261c', 120));

}
};
