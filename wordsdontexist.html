{
WD.add("sleep", [
["flipcool", "FLIP-kool", "n.", "The cold side of the pillow, discovered by turning it over at two in the morning like buried treasure.", "Sub-Arctic Dunnish flipkuul; Dunnish pillows have a warm side and a cold side and are sold in pairs.", "I turned the pillow over, found the flipcool, and sighed as if I had come home.", 0],
["plummetwitch", "PLUM-et-twitch", "n.", "The violent full-body jolt of falling off a cliff that exists only in the doorway of sleep.", "Coined in 1912 by Dr Horatio Quell, whose plummetwitch kicked his wife clean off the bed.", "A plummetwitch shot me upright just as I was drifting off, gripping the mattress.", 0],
["snoozehaggle", "SNOOZ-hag-el", "v.", "To bargain with your alarm clock, offering to skip breakfast in exchange for nine more minutes.", "Gristle Cant; Bureau clerks haggle in nine-minute units, which they call 'a Nib'.", "I snoozehaggled my way from seven down to seven forty and lost my toast.", 0],
["dreamaudit", "DREEM-aw-dit", "n.", "Checking, in the first minutes of waking, whether the strange thing you remember actually happened.", "From the Bureau's Smudge Room, where clerks check every card twice in case they dreamt it.", "A quick dreamaudit confirmed I had not, in fact, been made headteacher.", 0],
["blushdark", "BLUSH-dark", "n.", "An embarrassing memory from years ago that ambushes you just as you close your eyes.", "From Old Blotvian bluschdarke, 'the redness that comes at night'; Blotvian children were told it was a tickling ghost.", "Blushdark struck at midnight and I relived waving at a stranger in 2015.", 0],
["footvent", "FOOT-vent", "n.", "A single foot left poking out of the duvet to set the exact temperature of the whole body.", "From the Fennick Valley, where farmers swore one foot out was 'the thermostat of the soul'.", "With one footvent and the window open a crack, the night was finally perfect.", 0],
["dangledread", "DANG-gel-dred", "n.", "The fear that a hand or foot hanging over the edge of the bed will be grabbed by something underneath.", "Brother Ludo of Gristlemoor slept with his feet in a basket and called it 'sensible'.", "Dangledread made me haul my arm back under the covers in one swift move.", 0],
["clockjump", "KLOK-jump", "n.", "Waking up one minute before your alarm and feeling robbed of that last minute.", "Recorded in 1792 by Archivist Prudence Nib, who woke each day at 5:59 out of spite.", "Clockjump had me awake at 6:59, glaring at the alarm as it waited to go off.", 0],
["hourtally", "OWR-tal-ee", "n.", "Counting how many hours of sleep you would get if you fell asleep right now, and right now, and right now.", "From Old Teaspoonic slepesumme; Teaspoonic monks did this arithmetic so often they invented fractions.", "My hourtally went from seven hours to five and a half while I worked it out.", 0],
["dozegenius", "DOZE-jeen-ee-us", "n.", "A brilliant idea that arrives as you are drifting off and is gone by morning, leaving only the feeling that it was brilliant.", "Mabyn Ostrich-Haye kept a pencil by the bed for hers, and her notebook is full of the word 'badger'.", "I had a dozegenius about solving traffic forever, and now I just remember a bus.", 1],
["duvetwrangle", "DOO-vay-rang-gel", "n.", "The hot, sweaty battle of trying to stuff a duvet into its cover, often from the inside.", "From Low Frumpish; in Lower Wobbleton the job is done by two people and a ladder.", "After a duvetwrangle in which I vanished entirely, Dad found me inside the cover.", 0],
["bedstrange", "BED-strayng", "adj.", "Describing the alert, wide-eyed first night in an unfamiliar bed, when every creak is a new mystery.", "From the travelling merchant Ebbe Tannick, who said he slept well only on his third night anywhere, then left.", "At Gran's house I lay bedstrange for hours, listening to her fridge hum.", 0],
["napswamp", "NAP-swomp", "n.", "The thick, muddled fog of waking from an afternoon nap that went on far too long.", "From the Drabble Marshes, where a nap in the long grass is said to last until the frogs wake you.", "I staggered out of a three-hour nap into deep napswamp and asked if it was Tuesday.", 0],
["whendaze", "WEN-dayz", "n.", "Waking up with no idea what day it is, what time it is, or which country you are in.", "Gristle Cant; a Bureau clerk in whendaze once filed the morning post under 'yesterday'.", "Whendaze hit me after the long flight, and I tried to make breakfast at midnight.", 0],
["dripvigil", "DRIP-vij-il", "n.", "Lying awake listening to a dripping tap that you could fix by getting up, but will not.", "From Vellumese dryppewigil; a monk of Gristlemoor counted eleven thousand drips before getting up.", "I endured the dripvigil until three, then stuffed a sock under the tap.", 0],
["yawnquake", "YAWN-kwake", "n.", "A yawn that spreads around a room from person to person, even reaching the dog.", "Coined in 1966 at a Bureau meeting, where one clerk's yawn reached all forty-two attendees in under a minute.", "One yawn from Grandad started a yawnquake that went round the whole dinner table.", 0],
["lineloop", "LINE-loop", "n.", "Reading the same sentence in a bedtime book five times over because your eyes are reading and your brain is not.", "From the Bureau library, where a single page of the Unword Ledger has been read by tired clerks a thousand times.", "Stuck in a lineloop on page twelve, I finally gave up and switched off the lamp.", 0],
["darkdash", "DARK-dash", "n.", "The sprint upstairs after switching off the downstairs light, before anything in the dark can catch you.", "From Proto-Snorrish dorkdasch; Snorrish houses had the light switch at the bottom of every staircase on purpose.", "I flicked off the hall light and did a darkdash so loud it woke my sister.", 0],
["creakwatch", "KREEK-wotch", "n.", "Lying very still at night and deciding whether each creak in the house is the pipes or a burglar.", "From Coastal Mirrovan; old ships' timbers creak so much that sailors simply name each creak.", "Creakwatch kept me rigid for an hour until I remembered the heating.", 0],
["droolmap", "DROOL-map", "n.", "The damp patch on a pillow that tells you exactly how deeply and happily you slept.", "A Bureau term: Clerk No. 9 once fell asleep on the Unword Ledger and left a map of the Isle of Umber.", "The droolmap on my pillow was shaped like a small country.", 0],
["dreamburrow", "DREEM-bur-oh", "v.", "To clamp your eyes shut after waking from a wonderful dream, trying to burrow back into it.", "From the Isle of Umber, whose children say good dreams live underground and can be dug for.", "I tried to dreamburrow back to the bit where I could fly, but I only got the bus stop.", 0],
["linenprint", "LIN-en-print", "n.", "The deep crease pressed into your cheek by a pillow or sleeve, visible to everyone at breakfast.", "Vellumese, from the habit of sleeping on pages; Brother Ludo once woke with a whole psalm on his face.", "My linenprint went from ear to chin and lasted until lunchtime.", 0],
["carryhome", "KAR-ee-hohm", "n.", "Falling asleep in the back of the car at night and being carried to bed, half awake, by someone who loves you. You keep your eyes shut on purpose, because being carried is the best part, and you never quite admit you were awake.", "From the Fennick Valley, where long journeys home from the coast ended with sleepy children being lifted out of carts. Archivist Prudence Nib called it 'the softest word in the Ledger' and filed it under C, in a drawer lined with felt.", "I faked a little sleep in the driveway so I could get a carryhome up the stairs.", 2],
["raindrowse", "RAYN-drowz", "n.", "The heavy, delicious sleepiness that rain on the roof pours over you.", "From Middle Quellish reindrouse; Quellish thatchers were blamed for sleepy villages because they made roofs too loud.", "Raindrowse settled over the attic and I gave up on my homework.", 0],
["snoozeghost", "SNOOZ-gohst", "n.", "Switching off your alarm in your sleep and having no memory of doing it.", "Gristle Cant; the Bureau's night porter claimed a ghost switched off his alarm every morning for forty years.", "A snoozeghost turned off all three of my alarms, and I woke at ten.", 1],
["bobdrowse", "BOB-drowz", "n.", "Fighting sleep during a film, your head dropping and jerking up again like a fishing float.", "From Coastal Mirrovan bobdrouse, first used for nodding fishermen whose floats bobbed in time with them.", "By the end of the film the whole family was in bobdrowse except the dog.", 0],
["stallsip", "STALL-sip", "n.", "A glass of water asked for at bedtime by a child who is not thirsty but is a skilled negotiator.", "From Low Frumpish stalsippe; Frumpish children are said to know eighteen reasons to come back downstairs.", "After the third stallsip, Mum stopped filling the glass more than halfway.", 0],
["settleruin", "SET-el-roo-in", "n.", "Getting perfectly comfy in bed and immediately realising you need the toilet.", "From the Isle of Umber, where outhouses are at the bottom of the garden and settleruin is a nightly tragedy.", "Settleruin struck the moment I tucked in my last toe.", 0],
["lieinlurch", "LIE-in-lurch", "n.", "Leaping out of bed in a panic about being late, only to remember it is Saturday.", "Coined in 1932 by a Bureau clerk who ran all the way to work on a Sunday and found only Semicolon the cat.", "Lieinlurch had me half dressed before I remembered there was no school.", 0],
["gapedoze", "GAPE-doze", "n.", "Falling asleep sitting up on a train with your mouth wide open for the whole carriage to see.", "From Vellumese; Vellumese railway posters warned passengers to 'close the jaw before the eyes'.", "I woke from a gapedoze to find a toddler staring into my mouth.", 0],
["quiltdrift", "KWILT-drift", "n.", "The way a duvet migrates in the night until all of it is crumpled in one corner of the cover.", "From Sub-Arctic Dunnish; Dunnish quilts are sewn into sections so that the feathers cannot escape north.", "Quiltdrift left me with a flat, empty cover and a big lump by my feet.", 0],
["quiltpilfer", "KWILT-pil-fer", "v.", "To steal all of the covers from someone sharing your bed by rolling over, very slowly, like a burrito.", "Gristle Cant; Bureau clerks sharing a train sleeper were said to quiltpilfer the whole way to Port Scrivel.", "My brother quiltpilfered the entire blanket and left me shivering in a sheet.", 1],
["doorglow", "DOR-gloh", "n.", "The strip of light under the bedroom door that means the grown-ups are still up and the world is still on.", "From Old Blotvian dorglau; Blotvian children left their doors open a crack to keep the doorglow.", "I fell asleep watching the doorglow and listening to the telly downstairs.", 0],
["swaddlecoil", "SWOD-el-koyl", "n.", "Rolling yourself up tightly in the duvet until you are a sleepy sausage roll with a face.", "From Mount Ostentle, where winter nights are so cold that everyone sleeps in a swaddlecoil, including the goats.", "In full swaddlecoil, I could not reach the light switch and simply gave up.", 0],
["treaclerun", "TREE-kel-run", "n.", "The dream where you need to run away but your legs move as if wading through syrup.", "From Old Teaspoonic triklerunne; Teaspoonic monks believed it was caused by dessert after nine.", "In last night's treaclerun, a goose chased me down a corridor and I moved at one mile an hour.", 0],
["testmare", "TEST-mair", "n.", "The dream that you have an exam today in a subject you never knew you were taking.", "Dr Horatio Quell reported having one every night for fifty years, always in a subject called Advanced Otters.", "I woke from a testmare about a geography exam held underwater and checked my calendar.", 0],
["chorephantom", "CHOR-fan-tum", "n.", "Dreaming you did a dull job, such as washing up, and waking to find it still undone.", "A clerical error: in 1977 Clerk No. 9 dreamt of filing the whole Smudge Room and came in late to do it again.", "A chorephantom fooled me, and the pile of plates was still in the sink.", 1],
["storydroop", "STOR-ee-droop", "n.", "When the grown-up reading the bedtime story falls asleep first, mid-sentence, with the book on their nose.", "From Lower Wobbleton, where bedtime stories are timed by how long Grandad lasts.", "Storydroop got Dad halfway through the dragon chapter, so I read the rest to him.", 0],
["listspin", "LIST-spin", "n.", "Lying in bed while your brain reads out everything you have to do tomorrow, twice, in no particular order.", "From High Pellish listspinne; Pellish clerks kept a slate by the bed to empty their heads onto.", "Listspin kept me up until one, rehearsing the shopping and a dentist call.", 0],
["fluffpunch", "FLUF-punch", "n.", "The ritual pummelling of a pillow before sleep, as if it has personally wronged you.", "Imitative of the thump; Madame Ilse Vantablot was said to fluffpunch so hard she broke a bed.", "Three hard fluffpunches later, the pillow was exactly as lumpy as before.", 0],
["glowdrift", "GLOH-drift", "n.", "The promise to look at your phone for one minute in bed, which somehow becomes an hour.", "Coined at the Bureau in 2013 by a clerk who looked up from his screen to find it was breakfast.", "A long glowdrift left me knowing all about penguins and nothing about sleep.", 0],
["murmurwake", "MUR-mer-wake", "n.", "Waking slowly to the sound of your family talking and clattering in the kitchen, and feeling safe.", "From Proto-Snorrish murmurwaka; Snorrish houses had thin walls on purpose so that children could hear breakfast.", "I lay in murmurwake for ages, listening to the kettle and my parents chatting.", 0],
["heftcalm", "HEFT-kahm", "n.", "The deep peace of a heavy blanket settling over you, as if the bed itself were hugging you down.", "From Coastal Mirrovan, where sleepers on stormy nights piled on all the fishing nets for the weight.", "Under three blankets I sank into heftcalm and stopped worrying about Monday.", 0],
["chairghoul", "CHAIR-gool", "n.", "A pile of clothes on a chair that, in the dark, takes on the shape of someone watching you.", "Brother Ludo of Gristlemoor recorded seeing 'a ghostly abbot' that turned out to be his own robe.", "My dressing gown became a chairghoul at midnight and I had to switch the lamp on.", 0],
["wakenjingle", "WAY-ken-jing-gel", "n.", "Waking with a song stuck in your head that you have not heard for years and did not ask for.", "From the Fennick Valley, where the morning bell plays one tune, so everyone wakes humming the same thing.", "I woke with a wakenjingle from an old toothpaste advert and hummed it all day.", 0],
["napstagger", "NAP-stag-er", "n.", "The wobbly, legless walk of someone who has just stood up from a deep nap.", "Gristle Cant; clerks waking from a nap in the Bureau archive are allowed five minutes of napstagger before work.", "I did a napstagger to the kitchen and walked into the fridge door.", 0],
["wakeunfurl", "WAKE-un-furl", "n.", "The glorious full-body morning stretch, toes pointed and arms flung out, with a noise you cannot control.", "From Middle Quellish, said of ferns opening at dawn; Quellish ferns are also very noisy about it.", "The cat and I did a matching wakeunfurl on the rug.", 0],
["dozehail", "DOZE-hayl", "n.", "Hearing someone call your name clearly just as you are falling asleep, when nobody did.", "From Old Blotvian dosahal; Blotvians answered it politely, just in case it was a relative.", "A dozehail had me sitting up saying 'what?' to an empty room.", 1],
["lastwhisperer", "last-WISP-er-er", "n.", "The one child at a sleepover still whispering in the dark long after everyone else has fallen asleep. They keep asking 'are you awake?' to a room of gentle snoring, and in the end they quietly tell the ceiling their best secret.", "From Lower Wobbleton, home of the famous midsummer sleepovers in the village hall. Mabyn Ostrich-Haye was the lastwhisperer there every year from 1862 to 1869, and the poems she whispered to the rafters became her first book.", "I was the lastwhisperer again, asking a pile of snoring sleeping bags whether ghosts eat cereal.", 2],
["fridgetiptoe", "FRIJ-tip-toh", "n.", "The silent journey downstairs for a midnight snack, avoiding every creaky step you know by heart.", "From the Bureau night shift, whose clerks mapped every squeaky floorboard on the way to the biscuit tin.", "My fridgetiptoe went perfectly until the light came on and Mum was sitting there.", 0],
["ringrue", "RING-roo", "n.", "The deep dislike you develop for a cheerful song once you have used it as your alarm.", "Coined by Mabyn Ostrich-Haye, who set her alarm to her favourite waltz and never danced again.", "Ringrue ruined that song for me forever, and it was my favourite.", 0],
["stillwake", "STIL-wake", "adj.", "Describing waking up in exactly the position you fell asleep, as if you were switched off all night.", "From Sub-Arctic Dunnish; Dunnish sleepers wrapped so tight in furs that nobody could move until morning.", "I woke stillwake, arms folded, like a statue on a tomb.", 0],
["bedcompass", "BED-kum-pass", "n.", "Waking up turned the wrong way round, with your head at the foot of the bed and no memory of the journey.", "From Coastal Mirrovan navigators, who claimed a sleeper always turns to face the sea.", "Bedcompass had me waking up with my feet on the pillow and my face in the slippers.", 0],
["rebedding", "ree-BED-ing", "n.", "The bliss of climbing back into a warm bed after a cold midnight trip to the bathroom.", "From Old Teaspoonic rebeddung; Teaspoonic monks rated it the second-best feeling, after tea.", "The rebedding was so lovely I almost went to the bathroom again for another go.", 0],
["dawnguilt", "DAWN-gilt", "n.", "Hearing the birds start singing and realising you have stayed up all night.", "From the Drabble Marshes, where the curlews start at four and are blamed for every guilty conscience.", "The first blackbird filled me with dawnguilt; I was still on chapter thirty.", 0],
["dozebabble", "DOZE-bab-el", "n.", "Nonsense said with total confidence by someone who is mostly asleep.", "From Brother Ludo, who once woke his whole abbey to announce that the turnips had voted.", "In a dozebabble, my sister told me the curtains needed more cheese.", 0],
["nestfidget", "NEST-fij-et", "v.", "To keep shifting and turning in bed in search of the one perfect position that existed last night.", "From Old Blotvian nestfigga, said of hens who refuse to settle; Blotvian hens are notoriously fussy.", "I nestfidgeted for an hour and ended up exactly where I started.", 0],
["sockquandary", "SOK-kwon-dree", "n.", "The nightly debate over whether to sleep with socks on or off, revisited several times before dawn.", "Gristle Cant; the Bureau's night porter wore one sock as a compromise and was considered wise.", "Sockquandary woke me at two, and the left sock went flying.", 0],
["limbfizz", "LIM-fizz", "n.", "Waking with an arm that has gone so numb and tingly under your pillow that it feels borrowed.", "Imitative of the fizzing; Dr Horatio Quell once shook a numb arm so hard he knocked over a lamp.", "Limbfizz meant I had to switch off the alarm with my nose.", 0],
["blanketmercy", "BLANG-ket-mur-see", "n.", "Waking on the sofa to find someone has quietly laid a blanket over you while you slept.", "From the Isle of Umber, where it is considered rude to wake a sofa sleeper, and kind to cover one.", "I woke to blanketmercy and a cup of tea going cold on the table beside me.", 1],
["whinedark", "WINE-dark", "n.", "The dread of hearing a mosquito whine near your ear in the dark and knowing you will not sleep until you find it.", "From the Drabble Marshes, whose mosquitoes are said to whine in three-part harmony.", "Whinedark kept me swatting at the air until the lamp came on.", 0],
["dreamshrug", "DREEM-shrug", "n.", "The calm way you accept total nonsense in a dream, like your teacher being a horse.", "Coined in 1955 by a Bureau clerk who dreamt the cat was her manager and woke up feeling it was fair.", "With a dreamshrug I let the talking toaster drive us to school.", 0],
["sheetchill", "SHEET-chil", "n.", "The shock of slipping into fresh sheets on a winter night, when the bed seems to have been kept in a fridge.", "From Mount Ostentle, where sheets are warmed with hot bricks and still somehow freeze.", "Sheetchill had me curled into a ball until the bed thawed out.", 0],
["eyelidsand", "EYE-lid-sand", "n.", "The gritty heaviness of eyes that are no longer willing to stay open, whatever the film is doing.", "From Coastal Mirrovan, where tired children are told the sand from the beach has crept into their eyes.", "By ten the eyelidsand was winning, and I missed the ending again.", 0],
["snorepeace", "SNOR-peese", "n.", "The unexpectedly soothing sound of someone you love snoring in the next room.", "From the Fennick Valley, where grandfathers' snores are said to keep the wolves away.", "Grandpa's snorepeace through the wall lulled me straight to sleep.", 1],
["pillowhunt", "PIL-oh-hunt", "n.", "Groping around the dark bed for the pillow that vanished in the night.", "From Low Frumpish; Frumpish beds have high railings to stop pillows escaping.", "After a long pillowhunt I found it on the floor, guarded by the cat.", 0],
["slumberfib", "SLUM-ber-fib", "n.", "Insisting 'I wasn't asleep' when you were very obviously asleep and snoring.", "Gristle Cant; the Bureau's night porter has told a slumberfib every shift since 1980.", "Dad woke on the sofa and gave a slumberfib about resting his eyes.", 1],
["lightswitchery", "LITE-swich-er-ee", "n.", "The tricky business of turning off the light and getting into bed before your eyes stop working.", "From Old Blotvian; Blotvian bedrooms had the light switch by the door and the bed by the far wall, as a test.", "My lightswitchery ended with a stubbed toe and a yelp.", 1],
["glassbrack", "GLASS-brack", "n.", "The flat, dusty taste of the glass of water that sat on your bedside table all night.", "From Coastal Mirrovan brak, 'water that has given up'; Mirrovan sailors refused any drink left out after sunset.", "One sip of glassbrack at dawn and I went downstairs for a fresh glass.", 1],
["pawdawn", "PAW-dawn", "n.", "The thud of a pet landing on your legs at first light, followed by a stare that means breakfast.", "From the Bureau, where Semicolon the cat has woken the night porter at exactly 5:12 every morning since 2011.", "Pawdawn arrived at five sharp, all four paws on my stomach.", 1],
["pyjamatwist", "pa-JAH-ma-twist", "n.", "Waking up to find your pyjamas have rotated in the night, so the pocket is now somewhere near your spine.", "From Old Teaspoonic; Teaspoonic monks wore their nightshirts back to front deliberately so that they would twist the right way round.", "Pyjamatwist had my top on sideways and one leg wound round like a barber's pole.", 0],
["dreamstain", "DREEM-stayn", "n.", "The mood of a vivid dream that clings to you all the next day, so you feel oddly cross with a friend who wronged you only in your sleep. It fades by teatime, but never quite in time to apologise.", "From Madame Ilse Vantablot, inkmaker to the Bureau, who claimed her darkest ink was made from leftover dreams. Any clerk who used it, she warned, would spend a day remembering things that never happened. The bottle is kept in the Smudge Room and is never opened.", "The dreamstain lingered all morning, and I was still a bit sniffy with Tom for eating my imaginary cake.", 2]
]);
}
// ===== words04.js =====
{
WD.add("food", [
["lactofuddle", "LAK-toh-fud-el", "n.", "The endless breakfast cycle of adding more cereal to use up the milk, then more milk to use up the cereal. It can only be ended by an empty box, an empty carton, or the arrival of lunch. Some households have been in one since Tuesday.", "Recorded by Archivist Prudence Nib in 1803 after her clerk Clerk No. 9 failed to report for duty for three days, having been found at the breakfast table still topping up. The Bureau now keeps cereal and milk in separate buildings.", "Four bowls into a lactofuddle, he realised the only way out was to drink the milk straight from the bowl and surrender.", 2],
["grimbutter", "GRIM-but-er", "n.", "The iron law that dropped toast lands butter side down. It applies most firmly to the last slice, on a clean floor, just before guests arrive, and has never once been disproved by a hopeful person holding a plate.", "Dr Horatio Quell spent the summer of 1861 dropping four hundred slices from the Bureau balcony to prove it false. Every slice landed grimbutter, and the cat Semicolon grew so fat she had to be carried to the Smudge Room.", "I watched the toast spin in the air and knew, with the calm of the defeated, that grimbutter would have its way.", 2],
["sacrificake", "sa-KRIF-ih-kayk", "n.", "The first pancake of any batch, which comes out pale, torn and strangely shaped no matter how good the cook is. It is not a failure. It is an offering, and the pan will not behave until it has been made.", "From the Lower Wobbleton custom of feeding the first pancake to the nearest goose, believed to keep the frying pan in a good mood. The geese of Lower Wobbleton are famously round and famously smug.", "Nobody wanted the sacrificake, so it went to the dog, who ate it with the gratitude of a goose.", 2],
["fryumph", "FRY-umf", "n.", "The single longest, crispiest chip on the plate, spotted early and saved until the very end as a reward.", "A blend of 'fry' and 'triumph', first shouted by the merchant Ebbe Tannick at a quayside chip stall in Port Scrivel.", "She ate around her fryumph for ten minutes and then her brother leaned over and took it.", 1],
["sniffidavit", "snif-ih-DAY-vit", "n.", "A solemn nasal declaration that the milk is 'probably fine', made after one deep sniff of the carton.", "Gristle Cant, from the clerks' habit of signing a card before using the tea-trolley milk, so that blame could be assigned later.", "Dad gave a sniffidavit for the milk, and we all ate our porridge in nervous silence.", 1],
["cerecrete", "SEH-ree-kreet", "n.", "Cereal left in a bowl long enough to dry into a cement that no sponge on earth can shift.", "Coined in 1922 by a Gristlemoor builder who claimed he had used breakfast leftovers to repair a bridge, and that it was still standing.", "I left the bowl by the sink overnight, and by morning it was lined with a perfect ring of cerecrete.", 1],
["garlingering", "gar-LING-er-ing", "n.", "The smell of garlic that stays on your fingers for a whole day after chopping, returning every time you touch your face.", "Madame Ilse Vantablot tried to bottle it as an ink scent; the Bureau's letters were returned unopened from three countries.", "Even after the bath, a faint garlingering followed her hands around like a loyal dog.", 1],
["beepthief", "BEEP-theef", "n.", "A person who opens the microwave door at one second remaining, robbing the machine of its final beep.", "Middle Quellish beepen, 'to announce', with the Gristle Cant suffix -thief, used of anyone who takes the last of something they did not need.", "My mum is a quiet beepthief who has not let the microwave finish its sentence in years.", 1],
["kettlehex", "KET-el-heks", "n.", "The curse that stops a kettle from boiling for as long as somebody stands there watching it.", "From Sub-Arctic Dunnish, where kettles were believed to be shy and the polite thing was to look at the wall.", "The kettlehex lifted the very second I turned round to find a mug.", 1],
["palatorch", "PAL-uh-torch", "n.", "The loose flap of skin on the roof of your mouth after biting into a slice of pizza far too early.", "From 'palate' and 'torch', a coinage of the poet Mabyn Ostrich-Haye, whose sonnet on the subject is mostly vowels.", "I spent the whole film poking my palatorch with my tongue and regretting nothing.", 1],
["jarchaeology", "jar-kee-OL-oh-jee", "n.", "The careful excavation of the fridge door, where jars of chutney from several previous years have quietly settled into layers.", "Named by Dr Horatio Quell, who once dated a jar of mustard to the reign of an old harbourmaster by its crust alone.", "A brief bit of jarchaeology turned up three half-finished pickles and a jam with a handwritten label nobody recognised.", 1],
["foilglean", "FOYL-gleen", "v.", "To lick the inside of a yoghurt lid with great care and dignity, as if nobody were watching.", "From Old Teaspoonic glenen, 'to collect the last of the harvest'; Brother Ludo drew a little lid in his margins whenever he did it.", "He thought nobody saw him foilglean, but the lid left a pink moustache.", 1],
["sippervise", "SIP-er-vyze", "v.", "To oversee a pot of soup by tasting it so often that there is noticeably less soup.", "A clerical error in the Unword Ledger, where a clerk combined 'sip' and 'supervise' and refused to cross it out.", "Grandad likes to sippervise the stew and then announce that it needs more of everything.", 1],
["toastagion", "toh-STAY-jun", "n.", "The way the smell of one person's toast makes everyone in the house suddenly need toast.", "First noted at the Bureau in 1840, when one clerk's breakfast emptied the bread bin of the entire building by nine o'clock.", "The toastagion spread up the stairs, and soon there were four of us queueing at the toaster.", 1],
["tinnifrump", "TIN-ih-frump", "n.", "The betrayal of opening a biscuit tin and finding it full of buttons, thread and a broken thimble.", "Low Frumpish tinni, 'tin', and frump, 'a sulky face'; still said in Gristlemoor of any container that lies about its contents.", "I lifted the lid with real hope and received nothing but a tinnifrump of safety pins.", 0],
["courtesliver", "KUR-teh-sliv-er", "n.", "The lone last slice on the plate that everyone wants and nobody will take, out of politeness.", "From 'courtesy' and 'sliver', coined at a Bureau birthday where the final slice of cake sat untouched for a fortnight.", "The courtesliver sat in the middle of the table while six people said they were fine, really.", 0],
["fridgeloiter", "FRIJ-loy-ter", "v.", "To open the fridge for the fourth time in ten minutes, hoping something new has appeared.", "From Coastal Mirrovan loitra, 'to stand in the cold looking hopeful', originally used of seals.", "Stop fridgeloitering and either choose the cheese or shut the door.", 0],
["thawpocket", "THAW-pok-it", "n.", "The ice-cold centre of microwaved food whose outside is already hot enough to melt a spoon.", "Clerk No. 9 wrote it on an index card titled 'complaints about the machine' and filed it under T for treachery.", "The lasagne was bubbling at the edges and still hid a frozen thawpocket in the middle.", 0],
["sauceweep", "SAWS-weep", "n.", "The thin, watery liquid that shoots out of a sauce bottle before any actual sauce arrives.", "From the Fennick Valley, where the first squirt was believed to be the bottle crying about being opened.", "Shake it first, or the sauceweep will soak straight into your bun.", 0],
["rindulum", "RIN-dyoo-lum", "n.", "An orange peeled in one perfect spiral, held up for applause.", "High Pellish, 'little ribbon of rind'; the Isle of Umber still holds a peeling contest on the first day of spring.", "Mira dangled her rindulum over the table like a medal.", 0],
["panscrabble", "PAN-skrab-el", "v.", "To scrape the crunchy, burnt bits off the edges of a baking dish, which are the best part.", "From Proto-Snorrish scrabbla, 'to dig with a spoon for treasure'; the treasure was always the corners.", "While the grown-ups talked, the children took turns to panscrabble the empty roasting tin.", 0],
["vacancrisp", "VAY-kan-krisp", "n.", "The disappointing rush of air that escapes a crisp packet which turns out to be mostly air.", "Ebbe Tannick complained in 1788 that he had bought 'a whole sack of breeze with a few crumbs for company'.", "One pop of vacancrisp and the bag was half the size it looked in the shop.", 0],
["dunkstrand", "DUNK-strand", "n.", "The string of a teabag that slides down into the mug, so you have to go in after it with a spoon.", "Gristle Cant, from the tea trolley, where fishing for strings was considered a junior clerk's duty.", "I lost the dunkstrand overboard and had to rescue it with a fork.", 0],
["forgotea", "for-GOT-ee", "n.", "A cup of tea made with love and then left on a shelf until it is cold, grey and slightly filmy.", "A mishearing at the Bureau in 1912, when a clerk asked 'did you forget your tea?' and was told 'the forgotea? yes'.", "I found three forgoteas around the house, each one sadder than the last.", 0],
["limpicle", "LIM-pih-kel", "n.", "A carrot found at the bottom of the fridge that has gone soft enough to bend into a loop.", "From 'limp' and 'icicle', in honour of a Sub-Arctic Dunnish winter when the carrots froze and then forgot how to be firm.", "He waved the limpicle at us like a wobbly wand and declared soup.", 0],
["skiddlepea", "SKID-el-pee", "n.", "The last pea on the plate, which escapes the fork every time and eventually flees under the rim.", "Lower Wobbleton dialect; local legend says one skiddlepea has been rolling around the village since 1650.", "She chased the skiddlepea round the plate for a full minute before using her fingers.", 0],
["flakesilt", "FLAYK-silt", "n.", "The dusty crumbs at the very bottom of the cereal box, poured out with a sigh as the final bowl.", "Vellumese silt, 'what remains after the river', applied by Prudence Nib to the end of every box of oats.", "All that was left for me was a bowl of flakesilt and a cardboard toy.", 0],
["conetwirl", "KOHN-twurl", "v.", "To spin an ice-cream cone in quick circles, licking a spiral path against the drips on a hot day.", "Recorded on the beach at Port Scrivel, where children were seen conetwirling so fast that gulls lost interest.", "If you don't conetwirl, it will end up running down your wrist and into your sleeve.", 0],
["sarnislip", "SAR-nee-slip", "n.", "The moment a bite into the front of a sandwich pushes all the filling out of the back.", "From Gristlemoor sarni, 'a packed lunch', and the noise it makes landing in your lap.", "One big bite caused a full sarnislip, and the tomato went straight down my shirt.", 0],
["raisulk", "RAY-zulk", "v.", "To feel personally betrayed on biting a biscuit and discovering raisins where you expected chocolate chips.", "The poet Mabyn Ostrich-Haye wrote 'I raisulk, therefore I am' on a tea-room napkin, now framed in the Vault of Rejected Words.", "He took one bite, saw the fruit, and raisulked for the rest of the afternoon.", 0],
["jarthank", "JAR-thank", "n.", "The credit nobody gives you for loosening a stuck jar lid that someone else then opens in one easy twist.", "Middle Quellish, 'the thanks that went to the wrong hand'; it is also used of hinges and stiff windows.", "I loosened it for them, I said, but there is no jarthank in this house.", 0],
["cerealogy", "seer-ee-AL-oh-jee", "n.", "The deep study of every word on the cereal box, including the ingredients, during a silent breakfast.", "Coined by a Bureau intern who memorised the back of an oat packet and then applied for the job of Chief Reader.", "After years of cerealogy, I know exactly how much iron is in a single serving.", 0],
["pilfry", "PIL-fry", "v.", "To steal chips from someone else's plate after loudly saying you did not want any.", "From Old Blotvian pilfa, 'to take one, then one more, then call it a taste'.", "He said he wasn't hungry, then sat down to pilfry half my dinner one chip at a time.", 0],
["lidlorn", "LID-lorn", "n.", "The lonely plastic lid in the kitchen drawer that fits no container anyone has ever owned.", "From 'lid' and 'forlorn'; the Bureau keeps a box of lidlorns in case their containers ever come home.", "We have nine boxes, eleven lids, and not one lidlorn that matches.", 0],
["hahfoo", "HAH-foo", "interj.", "The noise made with an open mouth while trying to cool a bite that is far too hot to chew and far too rude to spit out.", "Not a word so much as a sound, written down phonetically by Clerk No. 9 after their first baked potato.", "Hahfoo, hahfoo, he said, flapping one hand at his face.", 0],
["fogglance", "FOG-glans", "n.", "The instant your glasses steam up completely as you open the oven to check on dinner.", "From Coastal Mirrovan foggla, 'to look and see nothing', originally used of lighthouse keepers.", "I opened the door for a quick fogglance and burned my thumb on something I couldn't see.", 0],
["weepchop", "WEEP-chop", "v.", "To keep slicing onions bravely while tears roll down your face, insisting you are absolutely fine.", "Brother Ludo of Gristlemoor recorded weepchopping as a daily penance, though he did seem to enjoy the soup.", "Dad weepchopped his way through the onions, sniffing, and refused all offers of help.", 0],
["cartonlurch", "KAR-ton-lurch", "n.", "The way a full carton of juice pours nothing, nothing, nothing, and then everything at once.", "Dunnish lurka, 'to jump without warning'; the word also covers buckets and very old sauce bottles.", "The cartonlurch filled the glass, the table and the cat all in one go.", 0],
["nutroof", "NUT-roof", "n.", "A thick layer of peanut butter glued to the roof of your mouth, making speech impossible.", "From a Fennick Valley school where the headmaster announced assemblies with a spoonful of it and nobody understood a word.", "Mmf mmf, he replied through the nutroof, waving his sandwich.", 0],
["lacerspread", "LAY-ser-spred", "n.", "The holes torn in soft bread by butter straight from the fridge.", "A Bureau kitchen word, from the morning Madame Vantablot tried to butter a crumpet and tunnelled straight through it.", "Lacerspread had turned my toast into a slice of lace.", 0],
["thwacket", "THWAK-it", "v.", "To slap the bottom of an upturned sauce bottle with increasing desperation.", "Imitative, from the sound; Proto-Snorrish children were said to thwacket in rhythm as a drinking song.", "I thwacketed the bottle six times and got nothing but a tiny cough of red.", 0],
["skreeple", "SKREE-pel", "n.", "The awful screech of a fork dragged across a china plate.", "Imitative; Semicolon the cat once left the building for a week after hearing a skreeple at the Bureau's annual dinner.", "Every skreeple made Gran close her eyes and grip the tablecloth.", 0],
["menurue", "MEN-yoo-roo", "n.", "The regret of seeing someone else's dinner arrive and realising you ordered the wrong thing.", "From 'menu' and 'rue'; the merchant Ebbe Tannick kept a diary of every menurue he suffered, which ran to four volumes.", "As the pasta went past me to the next table, a deep menurue settled over my salad.", 0],
["pastaglut", "PAS-tah-glut", "n.", "The quantity of pasta you actually cook, which looked like enough for two and would feed eleven.", "From High Pellish glutta, 'a flood'; Gristlemoor families still eat cold pastaglut for the rest of the week.", "We tipped in one handful too many and spent Friday working through the pastaglut.", 0],
["fizzgrief", "FIZ-greef", "n.", "The let-down of swigging a fizzy drink left open overnight and finding it completely flat.", "Coined by Dr Quell, who described it in a letter as 'a betrayal by bubbles, sir, nothing less'.", "One sip and a wave of fizzgrief told me the lemonade had given up in the night.", 0],
["sugarlapse", "SHUG-er-laps", "n.", "Forgetting halfway through stirring whether you have put in one sugar or two.", "From the tea trolley's ledger, in which one clerk wrote 'one, two, or possibly none' beside every cup.", "After a sugarlapse I played safe and added a third, which was a mistake.", 0],
["crisplode", "KRIS-plohd", "v.", "To pull a bag of crisps open so hard that it bursts and showers the room.", "Proto-Snorrish krisp, 'brittle', and the Bureau's own -lode, used of anything that goes off with a bang.", "She crisploded the bag and we found crumbs in the curtains for a month.", 0],
["grillpine", "GRIL-pyne", "v.", "To stand in your own garden sniffing the air longingly while the neighbours have a barbecue.", "From Coastal Mirrovan, where villagers would grillpine at the harbour as the fishermen cooked their catch on the beach.", "We had beans on toast, and all evening I could only grillpine over the fence.", 0],
["batterboon", "BAT-er-boon", "n.", "The spoon and bowl of leftover cake mixture handed to whoever helped, or just hovered.", "Old Teaspoonic bune, 'the cook's gift'; in Lower Wobbleton it is a legal right of the youngest child.", "My little brother never helps bake but always turns up for the batterboon.", 0],
["spoonpuff", "SPOON-puf", "v.", "To blow on each spoonful of soup with such care that dinner takes an hour.", "From the Isle of Umber, where the soup is served boiling and the patient are rewarded.", "Grandpa spoonpuffs so slowly that his soup is always cold by the end.", 0],
["bruisanna", "broo-ZAN-uh", "n.", "The brown, squashy patch inside a banana that you only discover after you have already bitten into it.", "A clerical error by a Bureau clerk who could not spell banana and refused to look it up.", "There was a bruisanna hidden in my lunch, and the whole bus heard about it.", 0],
["avocadusk", "av-oh-kah-DUSK", "n.", "The brief window between an avocado being rock hard and being brown mush, which always happens while you are asleep.", "Mabyn Ostrich-Haye called it 'the green hour that waits for no one' and then slept straight through it.", "I checked it at bedtime and woke to find I had missed the avocadusk by miles.", 0],
["smokeflap", "SMOHK-flap", "v.", "To wave a tea towel at a beeping smoke alarm while someone else opens every window.", "From a 1931 entry in the Unword Ledger describing the Bureau's first attempt at making crumpets.", "Every Sunday the toast burns and Dad climbs on a chair to smokeflap.", 0],
["orphaloaf", "OR-fah-lohf", "n.", "The end crust of a loaf, which everyone skips but nobody is willing to throw away.", "From Vellumese orpha, 'left behind'; the Bureau's ducks are fed exclusively on orphaloafs.", "The bag is empty except for the orphaloaf, and it has been there since Monday.", 0],
["peelbadge", "PEEL-baj", "n.", "The little sticker on an apple that survives washing and is only found halfway through eating it.", "Gristle Cant, because clerks used to stick them on their coats and pretend they had won a medal.", "There's a peelbadge stuck to your chin, and it says the apple came from very far away.", 0],
["soggulent", "SOG-yoo-lent", "adj.", "Describing a packed-lunch sandwich made damp all the way through by a slice of tomato.", "From the Drabble Marshes, where everything is soggulent, including the bread before it is even made.", "By lunchtime my sandwich was so soggulent I could have wrung it out.", 0],
["rackwrangle", "RAK-rang-el", "v.", "To quietly reload the dishwasher after someone else has filled it the wrong way.", "Clerk No. 9 is said to rackwrangle the Bureau's tea cups every evening, though nobody has ever seen them do it.", "Mum waited until we'd gone to bed and then rackwrangled every plate.", 0],
["steepshirk", "STEEP-shurk", "v.", "To leave a dirty pan 'soaking' in the sink for days to avoid ever washing it.", "From Low Frumpish steppa, 'to wait in water', a word once used only of tea and very lazy frogs.", "He claims the pan needs a soak, but we all know he is steepshirking.", 0],
["poppledome", "POP-el-dohm", "n.", "The little round button on a new jar lid that pops satisfyingly when the seal breaks.", "From the Fennick Valley, where children would buy jam purely to be the first to press the poppledome.", "I pressed the poppledome in the shop to check, and the shopkeeper glared at me.", 0],
["dunkalamity", "dunk-uh-LAM-ih-tee", "n.", "The slow collapse of a biscuit held in tea for one second too long, ending in a soggy shipwreck.", "From 'dunk' and 'calamity', first logged in the Smudge Room after a clerk's custard cream sank without trace.", "I got distracted mid-dip and suffered a full dunkalamity.", 0],
["chomplorn", "CHOMP-lorn", "adj.", "(Of chewing gum) having lost all its flavour but not yet its welcome in your mouth.", "Sub-Arctic Dunnish chompa, 'to chew', with -lorn, 'abandoned by joy'.", "The gum was completely chomplorn, but there was nowhere to put it.", 0],
["scoopwrench", "SKOOP-rench", "n.", "The battle with ice cream straight from the freezer, ending in a bent spoon and a shaking wrist.", "From a Bureau supply card ordering 'one stronger spoon, urgent', signed by Archivist Nib herself.", "After ten minutes of scoopwrench I had chipped off about a pea's worth.", 0],
["cheesetether", "CHEEZ-teth-er", "n.", "The long rope of melted cheese stretching from a slice of pizza to your mouth and refusing to break.", "From Middle Quellish tethra, 'a rope that will not let go', first used of very stubborn goats.", "He pulled his slice away and the cheesetether reached all the way to his elbow.", 0],
["recipanic", "res-ih-PAN-ik", "n.", "The moment halfway through a recipe when you discover you do not have the main ingredient.", "From 'recipe' and 'panic', said to have been shouted by Madame Vantablot while making a cake with no flour.", "Eggs beaten, oven hot, and then the recipanic: no sugar.", 0],
["eyeserving", "EYE-ser-ving", "n.", "The huge portion your eyes chose and your stomach is now politely refusing.", "Old Blotvian, from the saying 'the eye serves, the belly sighs', carved above a Gristlemoor inn.", "I piled up an eyeserving of potatoes and gave up after four.", 0],
["dipsnap", "DIP-snap", "n.", "A crisp that breaks off inside the dip, leaving a sad fragment that must be rescued with a second crisp.", "Imitative, from the noise; the Bureau's party rules forbid double dipping but allow one dipsnap rescue per person.", "My crisp gave a dipsnap, and I went fishing for it with a bigger one.", 0],
["poplorn", "POP-lorn", "n.", "The unpopped kernels left at the bottom of the popcorn bowl, hard enough to break a tooth.", "From the Isle of Umber, where poplorns are kept in a jar and rattled at the end of every film.", "Careful, the bottom of the bowl is nothing but poplorn.", 0],
["noodlewhip", "NOO-del-wip", "n.", "The flick of sauce thrown across your face and shirt by a noodle slurped too eagerly.", "Recorded in Port Scrivel, where noodle sellers hand out bibs and the Bureau sends only its oldest jumpers.", "One enthusiastic slurp and the noodlewhip got me right across both cheeks.", 0],
["spatterflinch", "SPAT-er-flinch", "n.", "The startled leap backwards when a single drop of water hits a pan of hot oil.", "High Pellish spatra, 'angry rain', which is still what Gristlemoor cooks call a frying pan in a bad mood.", "Every spatterflinch made him hold the spatula out like a sword.", 0],
["crumbwise", "KRUM-wyze", "adv.", "In the manner of someone eating a croissant carefully over a plate and somehow still covering the entire room.", "Brother Ludo used it in his margins next to a drawing of himself, a pastry and a very cross abbot.", "She ate her pastry crumbwise and left a trail across three chairs.", 0],
["spoonfugue", "SPOON-fyoog", "n.", "The mysterious disappearance of every teaspoon in a shared kitchen at the same time.", "From Old Teaspoonic, whose speakers believed spoons wandered off at night to visit relatives.", "By Thursday the spoonfugue was total, and we were stirring tea with a pencil.", 0],
["rumblush", "RUM-blush", "n.", "The embarrassment of your stomach growling loudly in a completely silent room.", "From 'rumble' and 'blush', coined at a Bureau exam when a candidate's stomach answered the first question.", "During the test my rumblush was so loud the teacher looked up and checked the radiator.", 0]
