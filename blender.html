function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgb2hex(c){ return "#"+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join(""); }
function mixC(a,b,t){ t=t===undefined?0.5:t; const A=hex2rgb(a),B=hex2rgb(b); return rgb2hex([0,1,2].map(i=>A[i]*(1-t)+B[i]*t)); }
function darken(c,f){ return rgb2hex(hex2rgb(c).map(v=>v*f)); }
function lighten(c,f){ return rgb2hex(hex2rgb(c).map(v=>v+(255-v)*f)); }
const has=(d,t)=>d.tags.indexOf(t)>=0;
const any=(d,list)=>list.some(t=>has(d,t));
const uniq=a=>a.filter((x,i)=>a.indexOf(x)===i);
function shortName(n){ return n.replace(/\b(Powder|Water|Juice|Cream|Sugar)\b/g,"").trim()||n; }
function blendTags(a,b,add,drop){
  let t=uniq(a.tags.concat(b.tags).concat(add||[]));
  if(drop) t=t.filter(x=>drop.indexOf(x)<0);
  return t.slice(0,9);
}

function mixState(a,b){
  if(a.state==="gas"||b.state==="gas") return "gas";

  return r>=3.2?"liquid": r>=1.6?"goo": r>=0.8?"powder":"solid";
}

const CACHE={};
const STOP=["Blend","Purée","Mix","Chunks","Confection","Compote","Stew","Loam","Snack"];
function cleanName(n,a,b){
  const parts=String(n).split(/([\s-]+)/);                           // keep the separators so hyphenated names survive
  const seen={}, out=[]; let words=0;
  for(let i=0;i<parts.length;i+=2){ const w=parts[i]; if(!w) continue; const k=w.toLowerCase();
    if(seen[k]) continue; seen[k]=1; words++;
    out.push((out.length? (parts[i-1]||" ") : "")+w); }
  const name=out.join("");
  if(words<=4&&name.length<=30) return name;
  const head=shortName(a.name).split(/[\s-]+/)[0], tail=shortName(b.name).split(/[\s-]+/)[0];
  const kind=STOP.find(s=>name.indexOf(s)>=0)||"Blend";
  const short=head+" "+tail+" "+kind;
  return short.length<=34? short : head+" "+kind;
}
function blend(a,b){
  const k=[a.name,b.name].sort().join("+");
  if(CACHE[k]) return CACHE[k];
  let out=null, kind="rule";
  const rec=RECIPES[k];
  if(rec){ out={name:rec.name,color:rec.color,state:rec.state,tags:rec.tags.slice()}; kind="recipe"; }
  if(!out) for(const r of RULES){
    if(r.w(a,b)){ out=r.m(a,b); break; }
    if(r.w(b,a)){ out=r.m(b,a); break; }
  }
  if(!out){ out={name:shortName(a.name)+"-"+shortName(b.name)+" Blend", color:mixC(a.color,b.color), state:mixState(a,b), tags:blendTags(a,b)}; kind="fallback"; }
  out.name=cleanName(out.name,a,b);
  out.key="d_"+out.name.replace(/[^a-z0-9]+/gi,"_").toLowerCase();
  out.from=[a.name,b.name]; out.kind=kind; out.tags=uniq(out.tags).slice(0,9);
  if(!/^#[0-9a-f]{6}$/i.test(out.color)) out.color=mixC(a.color,b.color);
  CACHE[k]=out; return out;
}

  let r=list[0]; for(let i=1;i<list.length;i++) r=blend(r,list[i]); return r;
}

const GW=210, GH=130;
const REG=[null];                                  // registry: grid cells hold an index into this
const IDX={};                                      // def.key -> index
function reg(def){ if(IDX[def.key]!=null) return IDX[def.key]; REG.push(def); IDX[def.key]=REG.length-1; return REG.length-1; }

function swap(x,y,nx,ny){ const a=y*GW+x, b=ny*GW+nx; const t=grid[a]; grid[a]=grid[b]; grid[b]=t; const l=life[a]; life[a]=life[b]; life[b]=l; moved[b]=1; }

function tickWorld(){
  moved.fill(0);
  for(let y=GH-1;y>=0;y--){
    const l2r=Math.random()<0.5;
    for(let k=0;k<GW;k++){
      const x=l2r?k:GW-1-k, i=y*GW+x, v=grid[i];
      if(!v||moved[i]) continue;
      const d=REG[v], st=d.state;
      // ── reactions with neighbours ──
      if(react(x,y,v,d)) continue;
      if(st==="solid") continue;
      if(st==="gas"){
        if(life[i]>0){ life[i]--; } else { grid[i]=0; continue; }
        if(has(d,"fire")&&Math.random()<0.78) continue;             // flame lingers instead of floating off
        const ny=y-1, nx=x+(Math.random()<0.5?-1:1)*(Math.random()<0.6?1:0);
        if(at(nx,ny)===0) swap(x,y,nx,ny); else if(at(x,ny)===0) swap(x,y,x,ny);
        else if(at(nx,y)===0) swap(x,y,nx,y);
        continue;
      }
      if(st==="goo"&&Math.random()<0.34) continue;                 // viscous: moves less often
      const below=at(x,y+1);
      if(below===0||(below>0&&DENS[REG[below].state]<DENS[st]&&REG[below].state!=="solid")){ swap(x,y,x,y+1); continue; }
      const dir=Math.random()<0.5?-1:1;
      for(const dx of [dir,-dir]){ const t=at(x+dx,y+1); if(t===0){ swap(x,y,x+dx,y+1); dx&&0; break; } }
      if(moved[y*GW+x]) continue;
      if(st==="liquid"||(st==="goo"&&Math.random()<0.25)){
        const spread= st==="liquid"?4:1;
        for(const dx of [dir,-dir]){ for(let s=1;s<=spread;s++){ if(at(x+dx*s,y)!==0) break; if(at(x+dx*s,y+1)===0||s===spread){ swap(x,y,x+dx*s,y); s=spread+1; break; } } if(moved[y*GW+x]) break; }

  }
}
function react(x,y,v,d){
  const hot=has(d,"fire")||has(d,"hot"), cold=has(d,"cold")||has(d,"frozen");
  if(!hot&&!cold) return false;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  if(has(d,"blender")) return false;          // the blade only does anything when you press SPIN
  if(hot){
    for(const [dx,dy] of dirs){ const nx=x+dx, ny=y+dy, n=at(nx,ny);
      if(n>0){ const nd=REG[n];
        if(has(nd,"fire")||has(nd,"hot")||has(nd,"burnt")||has(nd,"mineral")&&!has(nd,"fuel")) continue;
        if(Math.random()<0.11){ const out=blend(nd,BYNAME["Fire"]); discover(out); put(nx,ny,reg(out)); if(Math.random()<0.25&&at(x,y-1)===0) put(x,y-1,v); } } }
    if(has(d,"fire")&&Math.random()<0.012){ put(x,y, reg(BYNAME["Smoke"])); }
    return false;
  }
  if(cold){
    for(const [dx,dy] of dirs){ const nx=x+dx, ny=y+dy, n=at(nx,ny);
      if(n>0){ const nd=REG[n]; if(nd.state!=="liquid"||has(nd,"frozen")) continue;
        if(Math.random()<0.03){ const out=blend(nd,BYNAME["Ice"]); discover(out); put(nx,ny,reg(out)); } } }
  }
  return false;
}

  if(!elements[a]||!elements[b]||!elements[r]) continue;

  if(rx[b]) continue;                            // don't clobber an existing reaction
  rx[b]={ elem1:r, elem2:null };
  elements[a].reactions=rx; wired++;
}
if(typeof console!=="undefined"&&console.log)

}
function exportMod(){
  const src=buildMod();
  if(!src){ toast("make something first — your pantry is empty"); return; }
  const blob=new Blob([src],{type:"text/javascript"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="my-blends.js";
  a.click();
  toast("exported "+Object.keys(PANTRY).length+" discoveries as a Sandboxels mod");
}
// ═══════════════════════════ canvas + loop ═══════════════════════════
const cv=$("cv"), g=cv.getContext("2d"), off=document.createElement("canvas");
off.width=GW; off.height=GH; const og=off.getContext("2d"); const img=og.createImageData(GW,GH);
function draw(){
  const d=img.data;
  for(let i=0;i<GW*GH;i++){ const p=i*4, v=grid[i];
    if(v){ const c=rgbOf(v); const j=((i*2654435761)>>>0)%18/100-0.09;   // per-cell speckle so powders read as grains
      d[p]=c[0]*(1+j); d[p+1]=c[1]*(1+j); d[p+2]=c[2]*(1+j); d[p+3]=255; }
    else { d[p]=16; d[p+1]=18; d[p+2]=24; d[p+3]=255; } }
  og.putImageData(img,0,0);
  g.imageSmoothingEnabled=false; g.drawImage(off,0,0,cv.width,cv.height);
}
function fitCanvas(){ const r=cv.parentElement.getBoundingClientRect(); const s=Math.max(1,Math.floor(Math.min(r.width/GW, r.height/GH)));
  cv.width=GW*s; cv.height=GH*s; cv.style.width=(GW*s)+"px"; cv.style.height=(GH*s)+"px"; }
addEventListener("resize",fitCanvas);
// painting
let painting=false, lastP=null;
function cellAt(e){ const r=cv.getBoundingClientRect(); return [Math.floor((e.clientX-r.left)/r.width*GW), Math.floor((e.clientY-r.top)/r.height*GH)]; }
function paintAt(x,y,erase){
  const i= erase?0:reg(SEL);
  for(let dy=-BRUSH;dy<=BRUSH;dy++) for(let dx=-BRUSH;dx<=BRUSH;dx++){
    if(dx*dx+dy*dy>BRUSH*BRUSH) continue;
    const nx=x+dx, ny=y+dy; if(!inB(nx,ny)) continue;
    if(erase||grid[ny*GW+nx]===0||SEL.tags.indexOf("wall")>=0) put(nx,ny,i);
  }
}
cv.addEventListener("pointerdown",e=>{ painting=true; const [x,y]=cellAt(e); paintAt(x,y,e.button===2||e.shiftKey); lastP=[x,y]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!painting) return; const [x,y]=cellAt(e); const er=e.buttons===2||e.shiftKey;
  if(lastP){ const [px,py]=lastP, n=Math.max(Math.abs(x-px),Math.abs(y-py));
    for(let k=0;k<=n;k++) paintAt(Math.round(px+(x-px)*k/n), Math.round(py+(y-py)*k/n), er); } else paintAt(x,y,er);
  lastP=[x,y]; });
addEventListener("pointerup",()=>{ painting=false; lastP=null; });
cv.addEventListener("contextmenu",e=>e.preventDefault());
// controls
$("bBlend").onclick=()=>doBlend(false);
$("bClearSlots").onclick=()=>{ SLOTS=[null,null,null]; paintSlots(); };
$("bClear").onclick=()=>{ grid.fill(0); };
$("bPause").onclick=()=>{ PAUSED=!PAUSED; $("bPause").textContent=PAUSED?"▶ play":"❚❚ pause"; };
$("bJug").onclick=()=>{ buildJug(); };
$("bSpin").onclick=spinJug;
$("bEmpty").onclick=()=>{ if(!JUG) return; for(let y=JUG.yTop+1;y<JUG.yBot;y++) for(let x=JUG.x0+1;x<JUG.x1;x++){ const i=y*GW+x; if(grid[i]&&!has(REG[grid[i]],"wall")&&!has(REG[grid[i]],"blender")) grid[i]=0; } toast("jug emptied"); };
$("search").oninput=paintPalette; $("search2").oninput=paintShelf;
$("brush").oninput=e=>{ BRUSH=+e.target.value; $("brushv").textContent=BRUSH*2+1; };
$("bMod").onclick=exportMod;
$("bWipe").onclick=()=>{ if(confirm("Forget every discovery?")){ for(const k in PANTRY) delete PANTRY[k]; DISCOVERED=0; try{localStorage.removeItem("blender:pantry");}catch(e){} paintShelf(); } };
addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return;
  if(e.key===" "){ e.preventDefault(); $("bPause").click(); }
  if(e.key==="c") $("bClear").click();
  if(e.key==="b"&&!$("bBlend").disabled) $("bBlend").click();

// a ready-made blender jug: walls, a blade at the bottom
let JUG=null;
function buildJug(){
  const x0=70, x1=140, yTop=42, yBot=112; JUG={x0,x1,yTop,yBot};
  for(let y=yTop;y<=yBot;y++){ put(x0,y,reg(WALL)); put(x1,y,reg(WALL)); }
  for(let x=x0;x<=x1;x++) put(x,yBot,reg(WALL));
  for(let x=x0+28;x<=x1-28;x++){ put(x,yBot-1,reg(BLADE)); }
  toast("jug built — pour ingredients in, then press SPIN");
}
// ── SPIN: blend everything currently inside the jug into a single ingredient ──
let spinT=0, spinResult=null;
function jugContents(){
  if(!JUG) return {cells:[], defs:[]};
  const cells=[], seen={}, defs=[];
  for(let y=JUG.yTop+1;y<JUG.yBot;y++) for(let x=JUG.x0+1;x<JUG.x1;x++){
    const v=grid[y*GW+x]; if(!v) continue; const d=REG[v];
    if(has(d,"wall")||has(d,"blender")) continue;
    cells.push(y*GW+x); if(!seen[d.name]){ seen[d.name]=1; defs.push(d); }
  }
  return {cells, defs};
}
function spinJug(){
  const {cells, defs}=jugContents();
  if(!JUG){ toast("build a jug first"); return; }
  if(defs.length<2){ toast(defs.length? "put something else in the jug too" : "the jug is empty — pour ingredients in"); return; }
  const r=blendAll(defs); discover(r); const ri=reg(r);
  spinResult={r, cells}; spinT=46;                                  // whirl, then settle as the result
  toast("blending "+defs.length+" ingredients…");
}
function spinStep(){
  if(spinT<=0) return;
  spinT--;
  const {cells}=spinResult;
  if(spinT>8){                                                       // swirl the contents around the jug
    for(let k=0;k<160;k++){
      const i=cells[(Math.random()*cells.length)|0]; if(i==null) continue;
      const x=i%GW, y=(i/GW)|0; const nx=x+((Math.random()*3)|0)-1, ny=y+((Math.random()*3)|0)-1;
      if(nx<=JUG.x0||nx>=JUG.x1||ny<=JUG.yTop||ny>=JUG.yBot) continue;
      const a=y*GW+x, b=ny*GW+nx;
      if(has(REG[grid[b]]||{tags:[]},"wall")||has(REG[grid[b]]||{tags:[]},"blender")) continue;
      const t=grid[a]; grid[a]=grid[b]; grid[b]=t;
    }
  } else if(spinT===8){                                              // everything becomes the new ingredient
    const ri=reg(spinResult.r);
    for(const i of cells){ const d=REG[grid[i]]; if(!grid[i]||has(d,"wall")||has(d,"blender")) continue; grid[i]=ri; }
    // sweep up any stragglers that drifted
    for(let y=JUG.yTop+1;y<JUG.yBot;y++) for(let x=JUG.x0+1;x<JUG.x1;x++){ const j=y*GW+x, v=grid[j];
      if(v&&!has(REG[v],"wall")&&!has(REG[v],"blender")) grid[j]=ri; }
    toast("made "+spinResult.r.name+"!");
    SEL=spinResult.r; $("sel").innerHTML=`<i style="background:${SEL.color}"></i> ${SEL.name} <small>${SEL.state}</small>`;
  }
}
// main loop
let acc=0;
function loop(){
  requestAnimationFrame(loop);
  if(spinT>0) spinStep();
  if(!PAUSED&&spinT<=0){ for(let k=0;k<2;k++) tickWorld(); }
  draw();
}
// boot
loadPantry(); paintPalette(); paintShelf(); paintSlots();
$("sel").innerHTML=`<i style="background:${SEL.color}"></i> ${SEL.name} <small>${SEL.state}</small>`;
$("bases").textContent=BASE.length;
fitCanvas(); buildJug(); loop();
