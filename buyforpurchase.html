<script src="bdp.js" defer></script>
<style>
/* ── "Clearance Chrome": bargain-bin software boxes, fluorescent price stickers, receipt paper, beveled windows inside windows ── */
:root{--ink:#1b1233;--ink2:#5a4f80;--paper:#fffaf0;--rc:#fbf7ea;--night:#140e30;--night2:#211852;--yel:#ffe14d;--pink:#ff5fa2;--lime:#a6f04a;--org:#ff9b2f;--cyan:#42d9ff;--red:#ff3d4f;--vio:#8b6cff;--manila:#ece2c6;
--disp:"Bungee","Arial Black",Impact,system-ui,sans-serif;--ui:"Rubik","Trebuchet MS",system-ui,sans-serif;--mono:"Space Mono",ui-monospace,Consolas,monospace;
--zig:linear-gradient(135deg,transparent 7px,var(--rc) 0) 0 0/14px 14px repeat-x,linear-gradient(-135deg,transparent 7px,var(--rc) 0) 0 0/14px 14px repeat-x}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--night)}
body{font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;
background:radial-gradient(rgba(255,255,255,.055) 1.2px,transparent 1.7px) 0 0/16px 16px,radial-gradient(130% 90% at 50% 0%,#2e2070,var(--night) 72%)}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.hidden{display:none!important}
canvas{display:block}
#tcv{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
#back{position:fixed;left:10px;top:max(9px,env(safe-area-inset-top));z-index:55;font:800 14px var(--ui);color:var(--ink);text-decoration:none;background:var(--yel);border:2.5px solid var(--ink);border-radius:22px 7px 7px 22px/50% 7px 7px 50%;padding:6px 12px 6px 22px;box-shadow:2px 3px 0 var(--ink);transform:rotate(-2deg);white-space:nowrap}
#back::before{content:"";position:absolute;left:7px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--night);border:2px solid var(--ink);box-shadow:0 0 0 2px #fff}
#back:hover{background:#fff27a}

/* ── title screen ── */
#title{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom));pointer-events:none}
.rcpt{pointer-events:auto;position:relative;width:min(440px,100%);background:var(--rc);color:var(--ink);font-family:var(--mono);font-size:13px;padding:20px 22px 22px;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35)) drop-shadow(0 0 30px rgba(0,0,0,.35));animation:print .7s cubic-bezier(.2,1.2,.4,1) both;transform-origin:50% 100%}
.rcpt::before,.rcpt::after{content:"";position:absolute;left:0;right:0;height:14px;background:var(--zig)}
.rcpt::before{top:-13px;transform:scaleY(-1)}
.rcpt::after{bottom:-13px}
@keyframes print{from{transform:translateY(60px) scaleY(.6);opacity:0}}
.rh{text-align:center;margin-bottom:8px}
.rh b{display:block;font:24px/1 var(--disp);letter-spacing:.02em;color:var(--ink)}
.rh small{display:block;font-size:10.5px;letter-spacing:.12em;margin-top:4px;color:var(--ink2)}
.rl{display:flex;justify-content:space-between;gap:10px;line-height:1.55;border-bottom:1px dashed rgba(27,18,51,.18)}
.rl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl.tot{font-weight:700;border-bottom:2px solid var(--ink);margin-bottom:12px;padding-bottom:2px}
.big{display:block;width:100%;border:3px solid var(--ink);border-radius:10px;font:22px/1 var(--disp);padding:13px 12px 10px;margin:10px 0 0;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;position:relative;letter-spacing:.01em}
.big small{display:block;font:700 11.5px/1.2 var(--mono);letter-spacing:.02em;margin-top:5px;opacity:.85}
.big:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.big:disabled{filter:grayscale(.85);opacity:.55;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.big.cart{background:linear-gradient(180deg,#ff8cc0,var(--pink) 55%,#e9407f);color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink)}
.big.inf{background:linear-gradient(180deg,#7ef0ff,var(--cyan) 55%,#1fb4dd);color:var(--ink)}
.big .stk{position:absolute;right:-10px;top:-12px;font:10px/1 var(--disp);background:var(--yel);color:var(--ink);border:2px solid var(--ink);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;transform:rotate(12deg);text-shadow:none;line-height:1.05;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.sm{border:2.5px solid var(--ink);background:#fff;border-radius:8px;font:800 13px var(--ui);padding:7px 12px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.sm:hover{background:var(--yel)}
.sm:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.sm.arm{background:var(--red);color:#fff}
.rf{text-align:center;font-size:10.5px;letter-spacing:.06em;margin-top:10px;color:var(--ink2)}
.bc{height:34px;margin:12px 18px 0;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 7px,transparent 7px 8px,var(--ink) 8px 9px,transparent 9px 12px,var(--ink) 12px 15px,transparent 15px 17px)}

/* ── game shell ── */
#game{position:fixed;inset:0;z-index:4}
#top{position:absolute;left:0;right:0;top:0;height:54px;padding:0 10px 0 118px;display:flex;align-items:center;gap:10px;background:linear-gradient(#2d2266,#1c1546);border-bottom:3px solid var(--ink);z-index:6}
#top::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:5px;background:repeating-linear-gradient(-45deg,var(--yel) 0 8px,var(--ink) 8px 16px);opacity:.9}
#depth{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.dlab{font:11px/1 var(--disp);color:#b9aee8;letter-spacing:.06em;text-align:right}
.dnum{font:900 30px/1 var(--ui);color:var(--yel);text-shadow:0 2px 0 var(--ink),0 0 14px rgba(255,225,77,.35);min-width:30px}
.crumbs{display:flex;align-items:center;gap:3px;min-width:0;overflow:hidden;padding:4px 2px}
.crumb{flex:none;width:28px;height:22px;border:2px solid var(--ink);border-radius:4px;background:var(--c,#888);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 2px 0 var(--ink);position:relative;padding:0;transition:transform .15s}
.crumb::after{content:"";position:absolute;inset:5px 6px;border-radius:2px;background:rgba(0,0,0,.35)}
.crumb.on{width:38px;height:28px;transform:translateY(-1px);outline:2px solid var(--yel);outline-offset:1px}
.crumb.next{opacity:.55;border-style:dashed}
.crumb:hover{transform:translateY(-3px)}
.crumbs i{color:#8d82c4;font:900 12px var(--ui);font-style:normal}
.tbtns{display:flex;gap:6px;flex:none}
.ib{position:relative;width:42px;height:38px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s}
.ib:hover{background:var(--yel)}
.ib:active{transform:translateY(3px);box-shadow:none}
.ib svg{width:24px;height:24px}
.ib .n{position:absolute;right:-7px;top:-8px;min-width:20px;height:18px;padding:0 4px;border-radius:9px;background:var(--pink);color:#fff;border:2px solid var(--ink);font:800 10px/14px var(--ui);text-align:center}
.ib.lock{opacity:.45}
.ib.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{background:var(--yel);transform:translateY(-2px)}}
#stage{position:absolute;left:10px;right:10px;top:66px;bottom:10px;bottom:max(10px,env(safe-area-inset-bottom));border-radius:16px;padding:7px;background:var(--bz,#4b4470);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 3px var(--ink),0 8px 0 rgba(0,0,0,.35);transition:background .5s}
#stage::before{content:"";position:absolute;left:50%;bottom:1px;width:7px;height:3px;margin-left:-3px;border-radius:2px;background:#7bff9c;box-shadow:0 0 6px #7bff9c}
#vp{position:absolute;inset:7px;border-radius:10px;overflow:hidden;background:#0b0820}
#scan{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.55));transition:opacity .2s}

/* ── one layer = one window ── */
.lv{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,opacity;color:var(--tx)}
.win{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--bg1),var(--bg2));border-radius:10px;overflow:hidden}
.tb{flex:none;height:38px;display:flex;align-items:center;gap:8px;padding:0 6px 0 8px;background:linear-gradient(180deg,var(--a),var(--a2));border-bottom:3px solid var(--ink);color:var(--atx);position:relative}
.tb::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.08));pointer-events:none}
.tb canvas{width:26px;height:26px;flex:none}
.tt{font:16px/1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tv{font:700 11px var(--mono);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.up{flex:none;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:6px;font:800 12px var(--ui);padding:4px 9px;box-shadow:0 2px 0 var(--ink);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.up:hover{background:var(--yel)}
.wb{display:flex;gap:4px;flex:none;position:relative;z-index:1}
.wb button{width:22px;height:20px;border:2px solid var(--ink);background:#efe9ff;border-radius:4px;font:900 11px/1 var(--ui);color:var(--ink);padding:0}
.wb button:last-child{background:#ff8a8a}
.bd{flex:1;min-height:0;display:flex}
.mn{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.hud{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 6px;position:relative}
.hud canvas{width:42px;height:42px;flex:none}
.amt{font:34px/1 var(--disp);color:var(--tx);text-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap;transition:transform .08s}
.amt.bump{transform:scale(1.07)}
.unit{font:700 12px/1.35 var(--mono);opacity:.85;white-space:nowrap}
.unit b{font-weight:700}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font:800 11.5px/1 var(--ui);padding:5px 9px 5px 8px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);white-space:nowrap;box-shadow:0 2px 0 var(--ink)}
.chip.roy{background:var(--lime)}
.chip.oc{background:var(--cyan)}
.chip.buff{background:var(--org);animation:glow 1s infinite}
.pw{flex:1;min-height:0;position:relative;margin:0 10px;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.pw>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ctl{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.ctl>*{pointer-events:auto}
.eb{border:2.5px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);font:800 13px/1.1 var(--ui);padding:7px 11px;box-shadow:0 3px 0 var(--ink);white-space:nowrap;transition:transform .07s,box-shadow .07s}
.eb small{display:block;font:700 10.5px var(--mono);opacity:.8}
.eb:active{transform:translateY(3px);box-shadow:none}
.eb.hot{background:var(--yel)}
.eb.on{background:var(--lime)}
.eb:disabled{opacity:.5;cursor:default}
.eb.no{background:var(--manila);color:var(--ink2)}
.tk{flex:none;height:28px;margin:8px 10px 10px;border:2.5px solid var(--ink);border-radius:5px;background:var(--yel);overflow:hidden;position:relative;font:700 12.5px/23px var(--mono);color:var(--ink);white-space:nowrap}
.tk::before,.tk::after{content:"";position:absolute;top:0;bottom:0;width:16px;z-index:1;background:repeating-linear-gradient(-45deg,var(--ink) 0 4px,var(--yel) 4px 8px)}
.tk::before{left:0}.tk::after{right:0}
.tkin{position:absolute;left:100%;top:0;padding-left:20px;will-change:transform}
.sd{flex:none;width:350px;display:flex;flex-direction:column;border-left:3px solid var(--ink);background:linear-gradient(rgba(255,250,240,.94),rgba(246,239,222,.97));color:var(--ink);min-height:0}
.nx{flex:none;padding:10px 12px 10px;border-bottom:3px solid var(--ink);background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.7),transparent),repeating-linear-gradient(-45deg,rgba(27,18,51,.035) 0 6px,transparent 6px 12px)}
.nxh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nxh b{font:12px/1 var(--disp);background:var(--red);color:#fff;padding:5px 8px 4px;border:2px solid var(--ink);border-radius:4px;transform:rotate(-2deg);white-space:nowrap}
.nxh span{font:700 11px/1.2 var(--mono);color:var(--ink2);min-width:0}
.nxb{display:flex;gap:12px;align-items:stretch}
.boxc{flex:none;width:118px;height:150px;cursor:pointer;filter:drop-shadow(3px 4px 0 rgba(27,18,51,.6));transition:transform .15s}
.boxc:hover{transform:rotate(-2deg) scale(1.03)}
.mon{flex:none;width:100%;border:3px solid var(--ink);border-radius:8px;background:#000;cursor:zoom-in;box-shadow:0 0 0 5px #3d3760,0 0 0 8px var(--ink),0 6px 0 4px rgba(0,0,0,.3);margin:6px 0 10px}
.nxi{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.nxt{font:17px/1.05 var(--disp);word-break:break-word}
.nxd{font:500 12px/1.35 var(--ui);color:var(--ink2)}
.nxp{display:inline-block;align-self:flex-start;font:15px/1 var(--disp);background:var(--yel);border:2px solid var(--ink);padding:5px 8px 4px;border-radius:4px;transform:rotate(-2deg)}
.buy{border:3px solid var(--ink);border-radius:9px;font:17px/1 var(--disp);padding:10px 10px 8px;background:linear-gradient(#ff9ccb,var(--pink));color:#fff;text-shadow:0 2px 0 var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;margin-top:auto}
.buy:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.buy:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.buy:disabled{background:var(--manila);color:var(--ink2);text-shadow:none;cursor:default}
.buy.go{background:linear-gradient(#9ff7ff,var(--cyan));color:var(--ink);text-shadow:none;animation:glow 1.4s infinite}
.buy.go:not(.pulse){animation:none}
.nxrow{display:flex;gap:8px}
.nxb.inst{flex-direction:column}
.nxrow .buy{flex:1}
.ocb{border:2.5px solid var(--ink);border-radius:9px;background:#fff;font:800 12px/1.1 var(--ui);padding:6px 8px;box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.ocb small{display:block;font:700 10.5px var(--mono)}
.ocb:disabled{opacity:.55;cursor:default}
.also{margin-top:7px;font:700 10.5px/1.3 var(--mono);color:var(--ink2);display:flex;align-items:center;gap:6px}
.also canvas{width:22px;height:28px;flex:none}
.tabs{flex:none;display:flex;gap:4px;padding:8px 10px 0;align-items:flex-end}
.tab{flex:1;border:2.5px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;background:var(--manila);font:800 13px var(--ui);padding:7px 4px 6px;color:var(--ink2);position:relative}
.tab.on{background:#fff;color:var(--ink);padding-bottom:9px;margin-bottom:-3px;z-index:1}
.tab .n{display:inline-block;min-width:18px;margin-left:4px;padding:1px 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:10.5px}
.bm{flex:none;display:flex;gap:2px;margin-left:6px;margin-bottom:4px}
.bm button{border:2px solid var(--ink);background:#fff;border-radius:5px;font:800 11px var(--ui);padding:3px 6px;color:var(--ink)}
.bm button.on{background:var(--ink);color:var(--yel)}
.ls{flex:1;min-height:0;overflow:auto;padding:12px 10px 16px 12px;border-top:3px solid var(--ink);background:#fff;scrollbar-width:thin}
.tag{position:relative;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:9px;width:100%;min-height:56px;padding:6px 9px 6px 26px;margin:0 0 9px;border:2.5px solid var(--ink);border-radius:26px 8px 8px 26px/50% 8px 8px 50%;background:var(--manila);text-align:left;box-shadow:0 3px 0 rgba(27,18,51,.8);transition:transform .08s,box-shadow .08s,background .15s;color:var(--ink2)}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.tag.ok{background:var(--tagc,var(--yel));color:var(--ink)}
.tag.ok:hover{transform:translateX(3px) rotate(-.6deg)}
.tag:active{transform:translateY(3px);box-shadow:none}
.tag canvas{width:36px;height:36px}
.tag .nm{font:800 14px/1.15 var(--ui);min-width:0}
.tag .nm i{font-style:normal;font:12px var(--disp);margin-left:3px;color:var(--pink);-webkit-text-stroke:.3px var(--ink)}
.tag .ds{display:block;font:500 11.5px/1.25 var(--ui);color:var(--ink2);margin-top:2px}
.tag .pr{font:13px/1 var(--disp);background:#fff;border:2px solid var(--ink);border-radius:4px;padding:5px 6px 4px;white-space:nowrap;transform:rotate(-3deg);color:var(--ink)}
.tag:not(.ok) .pr{color:#c22b3b}
.tag.cp{border-style:dashed;border-radius:8px;padding-left:12px;grid-template-columns:36px 1fr auto;background:#f5f0e2}
.tag.cp::before{display:none}
.tag.cp.ok{background:var(--tagc2,#bff3ff)}
.tag.max .pr{background:var(--lime)}
.tag.done{opacity:.55;border-style:solid;background:#efeadb;box-shadow:none}
.tag.done .pr{background:var(--lime);color:var(--ink)}
.tag.new::after{content:"NEW";position:absolute;right:-6px;top:-9px;font:10px/1 var(--disp);background:var(--pink);color:#fff;border:2px solid var(--ink);padding:3px 5px 2px;border-radius:4px;transform:rotate(8deg)}
.lsh{font:11px/1 var(--disp);color:var(--ink2);letter-spacing:.06em;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.lsh::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--ink2) 0 4px,transparent 4px 8px);opacity:.5}
.empty{font:600 13px/1.4 var(--ui);color:var(--ink2);text-align:center;padding:16px 10px}

/* ── modal sheets (receipt paper) ── */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:22px 12px;background:rgba(12,8,30,.62);backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(640px,100%);max-height:calc(100dvh - 50px);display:flex;flex-direction:column;background:var(--rc);color:var(--ink);filter:drop-shadow(0 10px 0 rgba(0,0,0,.4));animation:print .45s cubic-bezier(.2,1.2,.4,1) both}
.sheet::before,.sheet::after{content:"";position:absolute;left:0;right:0;height:14px;background:var(--zig);z-index:1}
.sheet::before{top:-13px;transform:scaleY(-1)}
.sheet::after{bottom:-13px}
.sheet.wide{width:min(900px,100%)}
.shd{flex:none;display:flex;align-items:center;gap:10px;padding:16px 18px 10px;border-bottom:2px dashed rgba(27,18,51,.3)}
.shd h2{font:24px/1 var(--disp);flex:1;min-width:0}
.shd .x{border:2.5px solid var(--ink);background:#fff;border-radius:8px;width:38px;height:36px;font:900 18px var(--ui);box-shadow:0 3px 0 var(--ink);flex:none}
.sbd{flex:1;min-height:0;overflow:auto;padding:14px 18px 20px;font:500 14px/1.45 var(--ui)}
.sbd p{margin:0 0 10px}
.mono{font-family:var(--mono)}
.kick{font:11px/1 var(--disp);letter-spacing:.08em;color:var(--red)}

.gbox canvas{width:96px;height:124px;filter:drop-shadow(2px 4px 0 rgba(27,18,51,.55));transition:transform .15s}
.gbox:hover canvas{transform:translateY(-5px) rotate(-2deg)}
.gbox span{display:block;max-width:104px;height:28px;overflow:hidden}
.trs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tro{display:flex;gap:9px;align-items:center;border:2px solid var(--ink);border-radius:8px;padding:8px;background:#fff;min-height:62px}

.tro.no{background:#ece6d6;opacity:.7}
.tro.no b{color:var(--ink2)}
.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}

.perk b{display:block;font:800 13.5px/1.15 var(--ui)}
.perk small{display:block;font:500 11.5px/1.3 var(--ui);color:var(--ink2)}
.perk .pr{font:13px/1 var(--disp);background:var(--yel);border:2px solid var(--ink);border-radius:4px;padding:5px 6px 4px;white-space:nowrap}
.perk.no{background:#f1ece0}
.perk.no .pr{background:#fff;color:#c22b3b}
.perk.mx .pr{background:var(--lime);color:var(--ink)}
.perk:active{transform:translateY(3px);box-shadow:none}
.refund{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:2.5px dashed var(--ink);border-radius:10px;padding:12px;background:#fff7d6}

.lines{font:13px/1.6 var(--mono);margin:8px 0}
.lines div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(27,18,51,.2)}
.lines div span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.gd canvas.bx{width:180px;height:232px;filter:drop-shadow(4px 6px 0 rgba(27,18,51,.5))}
.rv{border-left:4px solid var(--pink);padding:4px 0 4px 10px;margin:0 0 10px}
.rv .st{color:#e8a400;font-size:15px;letter-spacing:1px}
.rv q{display:block;font:600 14px/1.35 var(--ui);quotes:"\201C" "\201D"}
.rv cite{display:block;font:700 11px var(--mono);color:var(--ink2);font-style:normal;margin-top:2px}
.mile{border:2.5px solid var(--ink);border-radius:8px;padding:8px 10px;margin:0 0 8px;background:#fff;display:flex;gap:10px;align-items:center}
.mile b{font:15px/1 var(--disp);min-width:52px;text-align:center;color:var(--vio)}
.mile.got{background:#e9ffd8}
.mile.got b{color:#2c8a2c}
.mile span{font:500 13px/1.35 var(--ui)}
.mile em{font-style:normal;font-weight:800}

/* ── toasts ── */
#toasts{position:fixed;left:calc((100% - 380px) / 2);top:64px;transform:translateX(-50%);z-index:59;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(380px,calc(100% - 24px))}

.toast.out{animation:tout .35s ease-in both}
.toast canvas{width:40px;height:40px;flex:none}
.toast b{display:block;font:12px/1 var(--disp);color:var(--red);letter-spacing:.04em}
.toast span{display:block;font:800 14px/1.2 var(--ui)}
.toast small{display:block;font:500 12px/1.25 var(--ui);color:var(--ink2)}
.toast.mile{background:var(--yel)}
.toast.mile b{color:var(--ink)}
@keyframes tin{from{transform:translateY(-60px) scale(.8);opacity:0}}
@keyframes tout{to{transform:translateY(-30px) scale(.9);opacity:0}}

  .mn{flex:none}

  .amt{font-size:25px}
  .unit{font-size:11px}
  .chips{gap:4px}
  .chip{font-size:10.5px;padding:4px 6px}
  .pw{flex:none;height:clamp(250px,38vh,340px);margin:0 6px}
  .tk{height:22px;margin:5px 6px 6px;font-size:11px;line-height:17px}
  .sd{width:auto;flex:1;border-left:0;border-top:3px solid var(--ink)}
  .nx{padding:7px 8px}
  .nxh{margin-bottom:5px}
  .nxh b{font-size:10.5px}
  .boxc{width:58px;height:74px}
  .nxt{font-size:14px}
  .nxd{display:none}
  .nxp{font-size:12.5px}

  const pk = wrap.querySelector('.perks'); PERKS.forEach(p => { const l = perk(p.id), mx = l >= p.max, c = p.cost(l); const b = el('button', 'perk' + (mx ? ' mx' : G.rc < c ? ' no' : '')); const cv = document.createElement('canvas'); icon(sizeCanvas(cv, 40, 40), p.icon, 20, 20, 36, '#ffe14d', '#ff5fa2'); b.append(cv, el('span', '', `<b>${esc(p.name)}${l ? ' · Lv ' + l : ''}</b><small>${esc(p.desc(l))}</small>`), el('span', 'pr', mx ? 'MAX' : fmt(c) + ' ✉')); b.onclick = () => { if (mx || G.rc < c) { sfx('cant'); return; } G.rc -= c; G.perks[p.id] = l + 1; sfx('up'); save(); refModal(); updTop(); if (V) V.dirty = true; }; pk.appendChild(b); });
  const btn = wrap.querySelector('#doRef'); if (btn) btn.onclick = () => { if (!refArm) { refArm = 1; btn.innerHTML = 'REALLY? TAP AGAIN<small>all games will be returned</small>'; sfx('cant'); return; } doRefund(); };
  openModal('Refund · Receipts', wrap, true);
}
function doRefund() {
  const rg = receiptGain(); if (rg <= 0) return; const lines = G.L.slice(1).map(L => defOf(L.d)); const run = G.runT;
  G.rc += rg; META.rcTotal += rg; META.refunds++;
  const wrap = el('div'); wrap.innerHTML = `<div class="rh"><b>RETURNS RECEIPT</b><small>CART BLANCHE · RETURNS DESK · ${new Date().toLocaleDateString()}</small></div><div class="lines"></div><div class="lines"><div><b>RUN TIME</b><b>${fmtT(run)}</b></div><div><b>RECEIPTS ISSUED</b><b style="color:#c22b3b">+${fmt(rg)}</b></div></div><div class="bc"></div><div class="row"><button class="big cart" id="refGo" style="font-size:18px">SHOP AGAIN</button></div>`;
  const ls = wrap.querySelector('.lines'); openModal('Refund complete', wrap); sfx('print');
  lines.forEach((D, i) => setTimeout(() => { const d = el('div', '', `<span>RETURNED: ${esc(D.name)}</span><span>−1</span>`); ls.appendChild(d); sfx('tick'); }, 120 + i * 110));
  burstAt(innerWidth / 2, innerHeight / 2, 40, 'receipt'); shake(14);
  startRun(); if (V) { V.el.remove(); V = null; } V = buildView(G.at); $('#vp').appendChild(V.el); renderDepth(); setBezel(); updTop(); save();
  wrap.querySelector('#refGo').onclick = () => { closeModal(); sfx('kaching'); };
}
function menuModal() {
  const wrap = el('div'); const nm = nextMile(META.deep[G.slot] || 0);
  wrap.innerHTML = `<div class="kick">${G.slot === 'inf' ? 'INFINITE AISLE' : 'MAIN STORE'} · RUN ${G.runs} · DEEPEST EVER ${META.deep[G.slot] || 0}</div>
  <p style="margin-top:8px"><b>How it works.</b> Each game earns its own currency. Every game sells the <i>next</i> game. Buy it, zoom into its screen, play it. Its earnings pay royalties to the game above. Games above keep running while you're deeper, and can <b>Overclock</b> the game below. When you're 3+ deep, <b>Refund</b> everything for Receipts and buy permanent perks.</p>
  <p><b>It never ends.</b> After the 8 hand-made games, the store invents new ones forever: new names, new genres mixed from parts, bigger numbers. Next milestone: <b>depth ${nm[0]} · ${esc(nm[1])}</b>.</p><div id="miles"></div>
  <div class="row"><button class="sm" id="mSnd">sound: ${META.mute ? 'off' : 'on'}</button><button class="sm" id="mTitle">Title screen</button><button class="sm" id="mSave">Save now</button><button class="sm" id="mReset">Erase this save</button></div><p class="mono" style="font-size:11px;margin-top:10px;text-align:center">Keys: space = tap · ↑ zoom out · ↓ zoom in · esc = close</p>`;
  const ml = wrap.querySelector('#miles'); MILES.forEach(m => { const got = META.miles[G.slot + ':' + m[0]]; ml.appendChild(el('div', 'mile' + (got ? ' got' : ''), `<b>${m[0]}</b><span><em>${esc(m[1])}</em> — ${got ? esc(m[2]) : 'Keep buying to find out.'}</span>`)); });
  ml.appendChild(el('div', 'mile', `<b>∞</b><span><em>…and so on.</em> Every thousand, forever. The aisle has no last shelf.</span>`));
  openModal('Store Menu', wrap); wrap.querySelector('#mSnd').onclick = e => { toggleMute(); e.target.textContent = 'sound: ' + (META.mute ? 'off' : 'on'); };
  wrap.querySelector('#mTitle').onclick = () => { closeModal(); toTitle(); }; wrap.querySelector('#mSave').onclick = e => { save(); e.target.textContent = 'saved ✓'; };
  let arm = 0; wrap.querySelector('#mReset').onclick = e => { if (!arm) { arm = 1; e.target.classList.add('arm'); e.target.textContent = 'Really erase? Tap again'; return; } SAVES[G.slot] = null; G = null; closeModal(); if (V) { V.el.remove(); V = null; } save2(); toTitle(true); };
}
function save2() { try { localStorage.setItem(SKEY, JSON.stringify({ meta: META, main: SAVES.main, inf: SAVES.inf })); } catch (e) { } }
function awayModal(sec, tt, cap, before) {
  const wrap = el('div'); let rows = ''; G.L.forEach((L, i) => { const g = L.tot - (before[i] || 0); if (g > 0) rows += `<div><span>${esc(defOf(L.d).name)}</span><span>+${fmt(g)} ${esc(defOf(L.d).cur[1])}</span></div>`; });
  wrap.innerHTML = `<div class="rh"><b>WHILE YOU WERE AWAY</b><small>${fmtT(sec)} OUT OF THE STORE${sec > cap ? ' · CAPPED AT ' + fmtT(cap) : ''}</small></div><div class="lines">${rows || '<div><span>Nothing happened. Very peaceful.</span><span></span></div>'}</div><p class="mono" style="font-size:11px">Games kept running on their own. Extended Warranty raises the cap (now ${fmtT(cap)}).</p><div class="bc"></div><div class="row"><button class="big cart" id="awOk" style="font-size:18px">COLLECT</button></div>`;
  openModal('Welcome back', wrap); wrap.querySelector('#awOk').onclick = () => { closeModal(); sfx('kaching'); burstAt(innerWidth / 2, innerHeight / 2, 30, 'coin'); };
}
function toggleMute() { META.mute = !META.mute; if (META.mute) META.muted++; else { auInit(); sfx('buy'); } updTop(); $('#bSnd').textContent = 'sound: ' + (META.mute ? 'off' : 'on'); save2(); if (G) save(); }

/* ════════════════════════════ title screen ════════════════════════════ */
const TT = { z: 0, sw: [], swv: [], letters: [], hov: -1 };
function titleFrame(dt, t) {
  const cv = $('#tcv'), W = innerWidth, H = innerHeight, c = sizeCanvas(cv, W, H);
  TT.z += dt * .16; drawTunnel(c, W, H, TT.z, { py: .5 });
  const vg = c.createRadialGradient(W / 2, H * .4, Math.min(W, H) * .2, W / 2, H / 2, Math.max(W, H) * .75); vg.addColorStop(0, 'rgba(10,6,30,.15)'); vg.addColorStop(1, 'rgba(10,6,30,.7)'); c.fillStyle = vg; c.fillRect(0, 0, W, H);
  const rc = $('#tRc').getBoundingClientRect(); const avail = Math.max(120, rc.top - 26), topPad = W < 760 ? 60 : 44;
  for (let i = 0; i < 16; i++) { TT.swv[i] = (TT.swv[i] || 0) - (TT.sw[i] || 0) * 40 * dt; TT.swv[i] *= Math.pow(.25, dt); TT.sw[i] = (TT.sw[i] || 0) + TT.swv[i] * dt; }
  const mh = Math.min(avail - topPad, H * .55), cy = topPad + (avail - topPad) / 2;
  TT.letters = drawTitle(c, W / 2, cy, Math.min(W * (W < 760 ? .9 : .86), 1100), mh, t, TT.sw, { top: 0 });
}
function titleTap(x, y) { TT.letters.forEach((o, i) => { if (Math.hypot(x - o.x, y - (o.y + o.h * .5)) < o.h * .6) { TT.swv[i] = (TT.swv[i] || 0) + (x < o.x ? -1 : 1) * 2.4; auInit(); sfx('swing'); } }); }
function refreshTitle() {
  const m = SAVES.main, i = SAVES.inf;
  $('#bStartT').textContent = m ? 'CONTINUE SHOPPING' : 'ADD TO CART'; $('#bStartS').textContent = m ? `depth ${m.at} of ${m.L.length - 1} · ${fmt(m.rc)} receipts · run ${m.runs}` : 'start shopping · buy games to buy games';
  $('#bInfS').textContent = i ? `continue · depth ${i.L.length - 1} · deepest ${META.deep.inf || 0} · never ends` : 'every game generated · it never ends · separate save';
  const own = Object.keys(META.lib).length + 1; $('#tInfo').textContent = m || i ? `MEMBER SINCE ALWAYS · ${own} GAMES OWNED · ${Object.keys(META.ach).length}/${ACH.length} TROPHIES · ${META.refunds} REFUNDS` : 'NO PURCHASE HISTORY ON FILE · YOU WILL HAVE SOME SOON';
  $('#bSnd').textContent = 'sound: ' + (META.mute ? 'off' : 'on');
}
function toTitle(noSave) { if (G && !noSave) save(); if (V) { V.el.remove(); V = null; } mode = 'title'; closeModal(); $('#game').classList.add('hidden'); $('#title').classList.remove('hidden'); $('#tcv').classList.remove('hidden'); refreshTitle(); }
function enterGame(slot) {
  auInit(); if (G) save(); let fresh = false;
  G = SAVES[slot]; if (!G) { G = newGame(slot); startRun(); SAVES[slot] = G; fresh = true; }
  if (slot === 'inf') META.infVisit++;
  mode = 'game'; $('#title').classList.add('hidden'); $('#tcv').classList.add('hidden'); $('#game').classList.remove('hidden');
  if (V) V.el.remove(); V = buildView(G.at); $('#vp').appendChild(V.el); renderDepth(); setBezel(); updTop(); sfx('kaching');
  const away = (Date.now() - (G.saved || Date.now())) / 1000; if (!fresh && away > 60) offline(away, true);
  if (fresh && slot === 'main' && !META.welcomed) { META.welcomed = 1; setTimeout(() => toast('WELCOME TO CART BLANCHE', 'Press ADD TO CART. Buy the game in the corner.', 'Then zoom inside it. Then do it again. And again.', 'cart'), 600); }
  if (fresh && slot === 'inf') setTimeout(() => toast('THE INFINITE AISLE', 'Every game here is invented by the store.', 'Separate save. No last game. Go as deep as you like.', 'infinity'), 600);
  save();
}

/* ════════════════════════════ boot + main loop ════════════════════════════ */
let lastT = performance.now(), lastWall = Date.now(), saveT = 0;
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now; const wall = Date.now(), gap = (wall - lastWall) / 1000; lastWall = wall;
  if (G && gap > 5) offline(gap, gap > 90 && mode === 'game'); dt = clamp(dt, 0, .1);
  const t = now / 1000;
  if (G) simulate(dt);
  if (mode === 'title') titleFrame(dt, t);
  else if (V && G) renderView(V, dt, t);
  fxFrame(dt);
  saveT += dt; if (saveT > 10 && G) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}
function boot() {
  FX.cv = $('#fx'); load();
  $('#bStart').onclick = () => enterGame('main'); $('#bInf').onclick = () => enterGame('inf');
  $('#bLib').onclick = () => { auInit(); libModal(); }; $('#bTro').onclick = () => { auInit(); troModal(); }; $('#bSnd').onclick = () => toggleMute();
  $('#gLib').onclick = () => { libModal(); sfx('tap'); }; $('#gTro').onclick = () => { troModal(); sfx('tap'); }; $('#gRef').onclick = () => { refModal(); sfx('tap'); }; $('#gMenu').onclick = () => { menuModal(); sfx('tap'); }; $('#gSnd').onclick = () => toggleMute();
  $('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
  $('#tcv').addEventListener('pointerdown', e => titleTap(e.clientX, e.clientY));
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); return; } if (mode !== 'game' || !G || !$('#modal').classList.contains('hidden')) return;
    if (e.key === ' ' || e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); auInit(); const L = G.L[G.at], D = defOf(L.d); ENG[D.eng].click(L, D, 0, 0, false); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); goDepth(G.at - 1); } else if (e.key === 'ArrowDown') { e.preventDefault(); if (G.L[G.at + 1]) goDepth(G.at + 1); }
  });
  addEventListener('resize', () => { if (V) sizeMon(V); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  addEventListener('pagehide', () => save());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (V) { renderNx(V); renderList(V); } });
  refreshTitle(); updTop(); requestAnimationFrame(frame);
}
boot();
</script>
