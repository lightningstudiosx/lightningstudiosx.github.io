<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gravity Golf</title>
<meta name="description" content="Mini golf in space. Fling the ball, let the planets bend it, dodge black holes, ride wormholes and sink it. Then build your own holes and share them as a link.">
<meta name="theme-color" content="#0b0820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap">
<style>
/* Gravity Golf: a cosmic arcade mini-golf course. Deep indigo space, cream + sunny yellow + coral
   accents, chunky ink-shadowed controls. The canvas fills the screen; HUD on top, editor dock below. */
:root {
  --bg: #0b0820;
  --bg2: #151036;
  --ink: #140f2e;
  --paper: #fff6e3;
  --sun: #ffd84a;
  --coral: #ff6b6b;
  --teal: #3ef0d0;
  --lilac: #b48cff;
  --pink: #ff5fa2;
  --text: #fff6e3;
  --muted: #b9b0d8;
  --panel: rgba(21, 16, 54, .82);
  --line: rgba(255, 246, 227, .16);
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Fredoka", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none }

/* ---------- HUD ---------- */
#hud { position: fixed; z-index: 5; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px 14px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); pointer-events: none }
#hud > * { pointer-events: auto }
.home { flex: none; font: 600 12px var(--body); color: var(--ink); text-decoration: none; padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); white-space: nowrap }
@media (hover: hover) { .home:hover, .ib:hover { background: var(--sun) } .tool:hover { background: rgba(255,246,227,.12) } }
.brand { flex: none; display: flex; align-items: center; gap: 8px; font: 27px/1 var(--display); color: var(--paper); letter-spacing: .5px; text-shadow: 2px 3px 0 #e2483b, 4px 6px 0 rgba(0,0,0,.35); white-space: nowrap; pointer-events: none }
.brand svg { width: 30px; height: 30px; flex: none; filter: drop-shadow(2px 3px 0 rgba(0,0,0,.35)) }
#info { flex: 1; min-width: 0; display: flex; justify-content: center; align-items: center; gap: 10px; pointer-events: none }
#info > * { pointer-events: auto }
.ttl { display: flex; align-items: baseline; gap: 8px; min-width: 0; padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 1.5px solid var(--line); white-space: nowrap; overflow: hidden }
.ttl small { font: 600 11px var(--body); letter-spacing: 1.5px; text-transform: uppercase; color: var(--sun) }
.ttl b { font: 18px/1.1 var(--display); letter-spacing: .3px; overflow: hidden; text-overflow: ellipsis }
.stats { display: flex; gap: 6px; flex: none }
.chip { display: flex; align-items: baseline; gap: 5px; padding: 6px 11px; border-radius: 999px; background: var(--panel); border: 1.5px solid var(--line); font: 500 11px var(--body); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); white-space: nowrap }
.chip b { font: 17px/1 var(--display); letter-spacing: 0; color: var(--paper) }
.chip.hot b { color: var(--sun) }
.chipbtn { padding: 6px 12px; border-radius: 999px; border: 2px solid var(--ink); background: var(--teal); color: var(--ink); font: 600 12px var(--body); box-shadow: 2px 2px 0 var(--ink); white-space: nowrap }
.acts { flex: none; display: flex; gap: 8px }
.ib { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 0; transition: transform .08s }
.ib:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink) }
.ib.on { background: var(--sun) }
.ib svg { width: 20px; height: 20px }

#tip { position: fixed; z-index: 4; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%); max-width: calc(100% - 32px); text-align: center; font: 500 13px/1.3 var(--body); color: var(--muted); pointer-events: none; transition: opacity .4s }
#tip b { color: var(--paper); font-weight: 600 }

#intro { position: fixed; z-index: 6; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; width: calc(100% - 32px) }
#intro.show { animation: intro 2s ease forwards }
#intro.gone { animation: none; opacity: 0; transition: opacity .25s }
#intro small { display: block; font: 600 13px var(--body); letter-spacing: 4px; text-transform: uppercase; color: var(--sun) }
#intro strong { display: block; font: clamp(40px, 9vw, 76px)/1 var(--display); color: var(--paper); text-shadow: 3px 4px 0 #e2483b, 6px 9px 0 rgba(0,0,0,.4); margin: 6px 0 }
#intro span { font: 600 16px var(--body); color: var(--muted) }
@keyframes intro { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.9) } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1) } 75% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, -58%) } }

#toast { position: fixed; z-index: 30; left: 50%; top: max(150px, 24%); transform: translate(-50%, -50%) scale(.9); padding: 10px 18px; border-radius: 14px; border: 2px solid var(--ink); background: var(--coral); color: var(--ink); font: 600 15px var(--body); box-shadow: 4px 4px 0 var(--ink); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center }
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1) }
#toast.good { background: var(--teal) }

/* ---------- overlays ---------- */
.ov { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(6, 4, 20, .55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px) }
.ov[hidden] { display: none }
.card { width: 100%; max-width: 460px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto; background: linear-gradient(#211a52, #17113d); border: 2px solid var(--ink); outline: 1.5px solid var(--line); outline-offset: -5px; border-radius: 22px; padding: 22px; box-shadow: 6px 7px 0 var(--ink), 0 30px 80px rgba(0,0,0,.5); user-select: text; -webkit-user-select: text }
.card h2 { margin: 0 0 4px; font: 30px/1.05 var(--display); letter-spacing: .3px; color: var(--paper) }
.card p { margin: 6px 0; color: var(--muted); line-height: 1.4 }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px }
.btn { flex: 1 1 auto; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font: 600 15px var(--body); box-shadow: 3px 3px 0 var(--ink); white-space: nowrap }
.btn.pri { background: var(--sun) }
.btn.ghost { background: transparent; color: var(--paper); border-color: var(--line); box-shadow: none }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink) }
.btn.ghost:active { box-shadow: none }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; flex: 0 0 auto }
.result { text-align: center; max-width: 400px }
.result .big { font: clamp(44px, 12vw, 64px)/1 var(--display); background: linear-gradient(180deg, #fff6e3 10%, #ffd84a 55%, #ff8a5c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(3px 4px 0 var(--ink)); margin: 4px 0 8px }
.result .big.hio { background: linear-gradient(90deg, #ff6b6b, #ffd84a, #3ef0d0, #b48cff, #ff5fa2); -webkit-background-clip: text; background-clip: text; animation: hue 1.4s linear infinite }
@keyframes hue { to { filter: drop-shadow(3px 4px 0 var(--ink)) hue-rotate(360deg) } }
.badge { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 999px; background: var(--teal); color: var(--ink); font: 600 12px var(--body); letter-spacing: 1px; text-transform: uppercase }
table.sc { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px }
table.sc th { font: 600 11px var(--body); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); text-align: left; padding: 6px 6px; border-bottom: 1.5px solid var(--line) }
table.sc td { padding: 0; border-bottom: 1px solid rgba(255,246,227,.08) }
table.sc td > * { display: block; padding: 7px 6px }
table.sc button { all: unset; display: block; padding: 7px 6px; cursor: pointer; width: 100%; box-sizing: border-box }
table.sc tr.cur td { background: rgba(255, 216, 74, .1) }
table.sc .n { text-align: center; width: 48px }
table.sc tfoot td { font: 18px var(--display); border: 0; padding-top: 6px }
.under { color: var(--teal) } .over { color: var(--coral) }
.linkbox { width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: rgba(0,0,0,.3); color: var(--paper); font: 500 13px var(--body) }
.mine { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px }
.mine li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 14px; background: rgba(255,246,227,.06); border: 1.5px solid var(--line) }
.mine .nm { flex: 1 1 140px; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.mine .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px }

/* ---------- editor dock ---------- */
#ed { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: grid; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(16px, env(safe-area-inset-left)); background: linear-gradient(rgba(16, 11, 42, .9), rgba(11, 8, 32, .97)); border-top: 1.5px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px) }
#ed[hidden] { display: none }
#ed > * { width: 100%; max-width: 1060px; margin: 0 auto }
.tools { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px }
.tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 50px; padding: 0 2px; border-radius: 12px; border: 1.5px solid var(--line); background: rgba(255,246,227,.05); color: var(--paper); font: 500 11px/1.1 var(--body); min-width: 0 }
.tool span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tool svg { width: 22px; height: 22px; flex: none }
.tool.on { background: var(--sun); color: var(--ink); border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink) }
.props { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; min-height: 40px; font-size: 13px }
.props .hint { color: var(--muted); font-size: 12.5px }
.props label { display: flex; align-items: center; gap: 7px; color: var(--muted); white-space: nowrap }
.props label b { color: var(--paper); font-weight: 600; min-width: 34px }
.props input[type=range] { width: 120px; accent-color: var(--sun) }
.props input[type=text] { width: 170px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: rgba(0,0,0,.3); color: var(--paper); user-select: text; -webkit-user-select: text }
.props select { padding: 5px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: #1d1748; color: var(--paper) }
.sw { display: flex; gap: 5px }
.sw button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ink); padding: 0; box-shadow: 0 0 0 1.5px rgba(255,246,227,.25) }
.sw button.on { box-shadow: 0 0 0 2.5px var(--sun) }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden }
.seg button { border: 0; background: transparent; padding: 5px 10px; font-size: 13px }
.seg button.on { background: var(--sun); color: var(--ink); font-weight: 600 }
.eacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px }
.eacts .btn { flex: 0 1 auto; padding: 7px 12px; font-size: 13.5px; border-radius: 11px; display: flex; align-items: center; gap: 6px }
.eacts .btn svg { width: 16px; height: 16px }
.del { color: var(--coral) !important; border-color: rgba(255,107,107,.5) !important }

@media (max-width: 760px) {
  #hud { flex-wrap: wrap; gap: 8px 10px }
  .brand { flex: 1; min-width: 0; font-size: 20px; gap: 6px } .brand svg { width: 22px; height: 22px }
  #info { order: 3; flex-basis: 100%; flex-wrap: wrap; justify-content: center; gap: 6px }
  .ttl { flex: 1 1 auto; max-width: 100%; justify-content: center }
  .ttl { padding: 5px 11px; gap: 6px } .ttl b { font-size: 16px } .ttl small { font-size: 10px; letter-spacing: 1px }
  .chip { padding: 5px 8px; font-size: 10px; letter-spacing: .5px; gap: 4px } .chip b { font-size: 15px }
  .ib { width: 36px; height: 36px }
  .tools { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px }
  .tool { height: 44px; font-size: 10px } .tool svg { width: 19px; height: 19px }
  .props { min-height: 74px; gap: 6px 12px; align-content: center }
  .props input[type=range] { width: 92px }
  .props input[type=text] { width: 150px }
  .eacts .btn { padding: 6px 9px; font-size: 12.5px; gap: 4px }
  .eacts .btn svg { display: none }
  #tip { font-size: 12px }
}
@media (max-width: 400px) { .brand svg { display: none } .brand { font-size: 19px } }
</style>
</head>
<body>
<canvas id="cv" aria-label="Gravity Golf playfield"></canvas>

<header id="hud">
  <a class="home" href="index.html">← kaifun</a>
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="22" rx="18" ry="6" fill="none" stroke="#ffd84a" stroke-width="3" transform="rotate(-18 20 22)"/><circle cx="20" cy="20" r="11" fill="#ff6b6b" stroke="#140f2e" stroke-width="2.5"/><path d="M4.5 27 Q20 31 36 17" fill="none" stroke="#ffd84a" stroke-width="3" transform="rotate(-6 20 22)"/><circle cx="16" cy="16" r="3" fill="#fff6e3" opacity=".7"/></svg>
    <span>Gravity Golf</span>
  </div>
  <div id="info">
    <div class="ttl"><small id="holeNum">Hole 1</small><b id="holeName">First Swing</b></div>
    <div class="stats">
      <span class="chip"><span class="l">Par</span><b id="sPar">2</b></span>
      <span class="chip hot" id="chipStrokes"><span class="l">Strokes</span><b id="sStrokes">0</b></span>
      <span class="chip" id="chipRound"><span class="l">Round</span><b id="sRound">E</b></span>
      <button class="chipbtn" id="btnBack" hidden>Back</button>
    </div>
  </div>
  <nav class="acts">
    <button class="ib" id="btnEdit" title="Hole editor" aria-label="Hole editor"></button>
    <button class="ib" id="btnCard" title="Scorecard" aria-label="Scorecard"></button>
    <button class="ib" id="btnSound" title="Sound on/off" aria-label="Sound on/off"></button>
  </nav>
</header>

<div id="tip"></div>
<div id="intro"><small></small><strong></strong><span></span></div>
<div id="toast" role="status"></div>

<section id="ed" hidden aria-label="Hole editor">
  <div class="tools" id="tools"></div>
  <div class="props" id="props"></div>
  <div class="eacts">
    <button class="btn sm" id="eUndo"></button>
    <button class="btn sm" id="eNew"></button>
    <button class="btn sm pri" id="eTest"></button>
    <button class="btn sm" id="eShare"></button>
    <button class="btn sm" id="eSave"></button>
    <button class="btn sm" id="eMine"></button>
  </div>
</section>

<div class="ov" id="ovResult" hidden><div class="card result">
  <p id="rKicker" style="margin:0;font:600 12px var(--body);letter-spacing:3px;text-transform:uppercase;color:var(--sun)"></p>
  <div class="big" id="rBig"></div>
  <p id="rSub"></p>
  <div id="rBadge"></div>
  <div class="row" id="rBtns"></div>
</div></div>

<div class="ov" id="ovCard" hidden><div class="card">
  <h2>Scorecard</h2>
  <p id="cSub">Tap a hole to jump to it.</p>
  <table class="sc"><thead><tr><th class="n">#</th><th>Hole</th><th class="n">Par</th><th class="n">You</th><th class="n">Best</th></tr></thead><tbody id="cBody"></tbody><tfoot id="cFoot"></tfoot></table>
  <div class="row"><button class="btn ghost" id="cRestart">Restart round</button><button class="btn pri" id="cClose">Keep playing</button></div>
</div></div>

<div class="ov" id="ovShare" hidden><div class="card">
  <h2>Share your hole</h2>
  <p id="shMsg">Anyone who opens this link plays your hole.</p>
  <input class="linkbox" id="shLink" readonly>
  <div class="row"><button class="btn ghost" id="shClose">Done</button><button class="btn pri" id="shCopy">Copy link</button></div>
</div></div>

<div class="ov" id="ovMine" hidden><div class="card">
  <h2>My holes</h2>
  <p id="mEmpty">Saved holes live in this browser. Hit <b>Save</b> in the editor to keep one here.</p>
  <ul class="mine" id="mList"></ul>
  <div class="row"><button class="btn pri" id="mClose">Close</button></div>
</div></div>

<script>
'use strict';
/* =====================================================================
   Gravity Golf. One file: physics, renderer, course, editor, sharing.
   World is 1600 x 1000 units. Physics runs at a fixed 240 Hz step.
   ===================================================================== */
const TAU = Math.PI * 2;
const W = 1600, H = 1000, BR = 11;
const DT = 1 / 240, G0 = 900, VMAX = 1000, VCAP = 1500;
const E_PLANET = 0.5, E_MOON = 0.8, E_WALL = 0.92, E_BELT = 0.5;
const MU = 0.4, ROLL = 30, BOUNCE_MIN = 55;
const BH_K = 9, MOON_M = 0.7;
const WH_R = 30, RING_R = 34, RING_PULL_R = 80, RING_PULL = 340, RING_DRAG = 2.4;
const CUP_CATCH = 20, CUP_SPEED = 250, RING_SPEED = 360;
const WALL_H = 7, BELT_H = 13;
const REST_SPEED = 8, REST_STEPS = 60, MAX_SHOT_STEPS = 240 * 16, PREVIEW_STEPS = 240;
const LIMITS = { P: 14, B: 6, WH: 4, L: 24, M: 6 };
const STY = [
  { n: 'Rock',   base: '#c98f5e', hi: '#f6cf9c', lo: '#5a3524', atmo: '255,190,140' },
  { n: 'Gas',    base: '#e2a35c', hi: '#ffe0a8', lo: '#7a3d22', atmo: '255,170,90' },
  { n: 'Ice',    base: '#9fd8f0', hi: '#f2fcff', lo: '#35618f', atmo: '140,220,255' },
  { n: 'Lava',   base: '#6a2c35', hi: '#c45a3c', lo: '#22090f', atmo: '255,110,60' },
  { n: 'Ocean',  base: '#2f7fd0', hi: '#9fe0ff', lo: '#13336e', atmo: '110,180,255' },
  { n: 'Candy',  base: '#ff8fc7', hi: '#ffe0f0', lo: '#9a3474', atmo: '255,150,210' },
];
const WH_HUES = [175, 32, 290, 120];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- storage (always optional) ---------- */
const store = {
  get(k, def) { try { const v = localStorage.getItem('gravgolf.' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('gravgolf.' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};

/* ---------- the course ---------- */
// Course defs use degrees; tee/cup may be pinned to a planet surface with {p, a}.
const COURSE = [
  { name: 'First Swing', par: 2, tip: '<b>Drag back</b> from anywhere and let go to fling the ball. Land it by the flag.',
    P: [{ x: 330, y: 610, r: 140, s: 0 }, { x: 1240, y: 570, r: 150, s: 4 }],
    tee: { p: 0, a: -95 }, cup: { p: 1, a: -95 } },
  { name: 'Slingshot', par: 2, tip: 'Every planet <b>pulls</b>. Swing the ball around the giant.',
    P: [{ x: 820, y: 530, r: 175, m: 1.3, s: 1, g: 1 }, { x: 1420, y: 300, r: 80, s: 2 }, { x: 210, y: 760, r: 95, s: 0 }],
    tee: { p: 2, a: -80 }, cup: { p: 1, a: -140 } },
  { name: 'Hop Along', par: 3, tip: 'Soft shots <b>hop</b> and roll along the surface. Hop over the hill.',
    P: [{ x: 800, y: 700, r: 290, s: 4 }, { x: 800, y: 150, r: 55, s: 5 }],
    tee: { p: 0, a: -160 }, cup: { p: 0, a: -20 } },
  { name: 'Ring Toss', par: 2, tip: 'A floating <b>ring cup</b>. Arrive slowly, at the top of a lob.',
    P: [{ x: 330, y: 680, r: 130, s: 3 }, { x: 1100, y: 730, r: 165, s: 1, g: 1 }],
    tee: { p: 0, a: -90 }, cup: { x: 1100, y: 330 } },
  { name: 'Bumper Alley', par: 3, tip: '<b>Pink bumpers</b> bounce hard. Asteroid belts soak up speed.',
    P: [{ x: 230, y: 790, r: 110, s: 0 }, { x: 1370, y: 260, r: 105, s: 2 }],

/* =====================================================================
   RENDER
   ===================================================================== */
let lastNow = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - lastNow) / 1000; lastNow = now; if (dt > .1) dt = .1; if (dt < 0) dt = 0;
  acc += dt; let n = 0;
  while (acc >= DT && n < 40) { acc -= DT; tick(); n++; }
  if (n >= 40) acc = 0;

}
function render(dt, t) {

  const edit = game.mode === 'edit', px = 1 / view.s;
  game.shake *= Math.exp(-dt * 9); if (game.shake < .05) game.shake = 0;
  const shx = (Math.random() - .5) * 2 * game.shake, shy = (Math.random() - .5) * 2 * game.shake;
  worldTransform(shx, shy);
  const c = ctx;
  // field + boundary
  c.save();

  c.strokeStyle = 'rgba(255,246,227,.16)'; c.lineWidth = 1.5 * px; c.setLineDash([6 * px, 8 * px]); c.strokeRect(0, 0, W, H); c.setLineDash([]);
  c.strokeStyle = 'rgba(255,216,74,.55)'; c.lineWidth = 3 * px; const k = 34;
  c.beginPath(); for (const [x, y, sx, sy] of [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]]) { c.moveTo(x + sx * k, y); c.lineTo(x, y); c.lineTo(x, y + sy * k); } c.stroke();
  if (edit) { c.strokeStyle = 'rgba(255,246,227,.05)'; c.lineWidth = px; c.beginPath(); for (let x = 100; x < W; x += 100) { c.moveTo(x, 0); c.lineTo(x, H); } for (let y = 100; y < H; y += 100) { c.moveTo(0, y); c.lineTo(W, y); } c.stroke(); }
  c.restore();
  const T = edit ? 0 : game.S.T;
  // moon orbits first (behind)
  L.M.forEach(m => { c.strokeStyle = 'rgba(200,190,255,.13)'; c.lineWidth = 1.5 * px; c.setLineDash([4 * px, 8 * px]); c.beginPath(); c.arc(m.cx, m.cy, m.R, 0, TAU); c.stroke(); c.setLineDash([]); });
  drawWalls(c, L, t, px);
  L.B.forEach(b => drawBH(c, b, t, px));
  drawWormholes(c, L, t, px);
  L.P.forEach((p, i) => drawPlanet(c, p, i, t, px));
  drawMoons(c, L, T, t, px, false);
  drawCup(c, L, t, px);
  // tee marker
  c.strokeStyle = 'rgba(62,240,208,.45)'; c.lineWidth = 2 * px; c.setLineDash([3 * px, 4 * px]); c.beginPath(); c.arc(L.tee.x, L.tee.y, BR + 8, 0, TAU); c.stroke(); c.setLineDash([]);
  if (edit) {
    drawBall(c, L.tee.x, L.tee.y, t, px, 1, false);
    drawEditorOverlay(c, L, t, px);
  } else {
    updParts(dt);
    if (game.ball !== 'fly') game.trailFade = Math.max(0, game.trailFade - dt * .6);
    drawTrail(c, px);
    drawAim(c, t, px);
    drawGameBall(c, t, px);
    drawParts(c, px);

}
function drawGameBall(c, t, px) {

  if (a && a.k === 'sink') { const f = clamp((now - a.t0) / .35, 0, 1); if (f < 1) drawBall(c, a.x + (a.cx - a.x) * f, a.y + (a.cy - a.y) * f, t, px, 1 - f * .9, false); return; }

function drawAim(c, t, px) {

  c.strokeStyle = col; c.beginPath(); c.arc(S.x, S.y, BR + 16 * px + 4, -Math.PI / 2, -Math.PI / 2 + TAU * v.pow); c.stroke();

  const lx = clamp(sx + v.sx * -0 + 0, 30, vw - 30), ly = clamp(sy - 22, 20, vh - 20), txt = Math.round(v.pow * 100) + '%';
  c.fillStyle = 'rgba(20,15,46,.85)'; const tw = c.measureText(txt).width + 14; c.beginPath(); c.roundRect ? c.roundRect(lx - tw / 2, ly - 11, tw, 22, 11) : c.rect(lx - tw / 2, ly - 11, tw, 22); c.fill();

}
function drawEditorOverlay(c, L, t, px) {

  L.M.forEach((m, i) => { c.strokeStyle = 'rgba(255,246,227,.4)'; c.lineWidth = 1.5 * px; c.beginPath(); c.moveTo(m.cx - 8 * px, m.cy); c.lineTo(m.cx + 8 * px, m.cy); c.moveTo(m.cx, m.cy - 8 * px); c.lineTo(m.cx, m.cy + 8 * px); c.stroke(); const p = moonAt(m, 0, MP); c.setLineDash([2 * px, 4 * px]); c.beginPath(); c.moveTo(m.cx, m.cy); c.lineTo(p.x, p.y); c.stroke(); c.setLineDash([]);
