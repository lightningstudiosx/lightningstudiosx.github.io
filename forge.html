<body>
<div id="app">
  <canvas id="gl"></canvas>
  <a id="kai" href="index.html">&larr; Kai.fun</a>

  <div id="title" class="screen">
    <h1 id="logo"><span>THE</span> FORGE</h1>
    <p id="tag">Heat it. Hammer it. Make it yours.</p>

      </div>

      <button class="ib" id="bSnd" aria-label="Sound" title="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="ib" id="bGear" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></button>

<script>
"use strict";
// ===== util.js =====
{
const FG = window.FG = {};
const Q = new URLSearchParams(location.search);
FG.Q = Q;
FG.TEST = Q.has('test');
FG.TILE = Q.has('tile');
FG.$ = (id) => document.getElementById(id);
FG.clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
FG.lerp = (a, b, t) => a + (b - a) * t;
FG.smooth = (a, b, x) => { const t = FG.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
FG.damp = (a, b, k, dt) => b + (a - b) * Math.exp(-k * dt);
FG.isPhone = () => Math.min(innerWidth, innerHeight) < 560 || (matchMedia('(pointer:coarse)').matches && innerWidth < 900);
FG.now = () => performance.now() / 1000;
FG.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const subs = {};
FG.on = (n, f) => { (subs[n] = subs[n] || []).push(f); };
FG.emit = (n, a, b) => { for (const f of subs[n] || []) { try { f(a, b); } catch (e) { console.error(e); } } };
FG.store = {
get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
del(k) { try { localStorage.removeItem(k); } catch (e) { /* blocked */ } },
};
if (Q.has('reset')) { try { for (const k of Object.keys(localStorage)) if (k.startsWith('forge.')) localStorage.removeItem(k); } catch (e) { /* blocked */ } }
FG.rng = (seed) => {
let a = seed >>> 0;
return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
};
FG.rand = FG.rng(Q.has('seed') ? +Q.get('seed') : (Date.now() & 0xffffff));
FG.pick = (arr) => arr[(FG.rand() * arr.length) | 0];
FG.pack = (arr, lo, hi) => {
const b = new Uint8Array(arr.length);
for (let i = 0; i < arr.length; i++) b[i] = Math.round(FG.clamp((arr[i] - lo) / (hi - lo), 0, 1) * 255);
let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);

const W = FG.Work, b = W.bar, s = b.L * f, u = b.sample(b.off, s) + (across || 0) * b.sample(b.w, s) / 2 * 0.8;
if (tool) FG.Stations.setTool(tool);
FG.Stations.anvil.apply({ s, u, point: W.worldPoint(s, u) });
return T.bar();
};
T.screenOf = (f, across) => {
const W = FG.Work, b = W.bar, s = b.L * f, u = b.sample(b.off, s) + (across || 0) * b.sample(b.w, s) / 2 * 0.7;
const p = W.worldPoint(s, u).project(FG.R.cam); return [(p.x + 1) / 2 * FG.R.w, (1 - p.y) / 2 * FG.R.h];
};
T.state = () => ({ mode: FG.G.mode, station: FG.G.station, tool: FG.G.tool, toast: FG.UI.lastToast, frame: FG.R.stats(), quality: FG.R.q, gpu: FG.R.gpu });
T.settle = () => { FG.Work.setPose(FG.Work.pose, true); FG.Cam.go(FG.Cam.shot, true); };
}
// ===== recipes.js =====
{
const Rc = FG.Recipes = {};
const hot = (b, T) => b.T.fill(T || 1050);
const along = (b, f0, f1, step, fn) => { for (let f = f0; f <= f1 + 1e-6; f += step) fn(f * b.L); };
const strike = (b, tool, s, across, force) => FG.Ops.strike(b, tool, s, b.sample(b.off, s) + (across || 0) * b.sample(b.w, s) / 2 * 0.8, force || 1);
const grindEdges = (b, f0, sides, passes) => { for (let p = 0; p < (passes || 1); p++) along(b, f0, 1, 0.01, (s) => { const c = b.sample(b.off, s), w = b.sample(b.w, s) / 2; for (const sd of sides) FG.Ops.grind(b, 'edge', s, c + sd * w * 0.8, 0.5); FG.Ops.grind(b, 'flat', s, c, 0.3); }); };
const finish = (b, temperT) => { b.T.fill(20); for (let i = 0; i < b.N; i++) if (b.hard[i] > 0.05) b.peak[i] = Math.max(b.peak[i], temperT); along(b, 0, 1, 0.01, (s) => FG.Ops.polish(b, s, 0.6)); along(b, 0.2, 1, 0.01, (s) => FG.Ops.hone(b, s, 0.5)); b.version++; };
const quench = (b, medium, seed, T) => { b.T.fill(T || 860); FG.Ops.quench(b, medium, FG.rng(seed || 3)); b.T.fill(20); };
Rc.list = {
longsword: { metal: 'steel', len: 0.46, w: 0.032, t: 0.013, fit: { mount: 'grip', guard: 'cross', guardMat: 'steel', grip: 'leather', gripCol: 'black', pommel: 'disc', pommelMat: 'steel' },
make(b) { for (let p = 0; p < 6; p++) { hot(b); along(b, 0.25, 0.98, 0.06, (s) => strike(b, 'draw', s)); } for (let k = 0; k < 6; k++) { hot(b); strike(b, 'taper', b.L * 0.9); strike(b, 'taper', b.L * 0.96); }
for (let p = 0; p < 4; p++) { hot(b, 1000); along(b, 0.3, 0.97, 0.05, (s) => { strike(b, 'bevel', s, 0.8); strike(b, 'bevel', s, -0.8); }); }
grindEdges(b, 0.22, [1, -1]); b.clay = false; quench(b, 'oil', 5); finish(b, 215); } },
katana: { metal: 'damascus', len: 0.46, w: 0.03, t: 0.013, fit: { mount: 'grip', guard: 'disc', guardMat: 'iron', grip: 'cord', gripCol: 'black', pommel: 'disc', pommelMat: 'gold' },
make(b) { hot(b, 1100); FG.Ops.fold(b); hot(b, 1100); FG.Ops.fold(b); for (let p = 0; p < 10; p++) { hot(b); along(b, 0.22, 0.98, 0.05, (s) => strike(b, 'draw', s)); }
for (let k = 0; k < 5; k++) { hot(b); strike(b, 'taper', b.L * 0.95, 0.5); }
for (let p = 0; p < 4; p++) { hot(b, 1000); along(b, 0.28, 0.98, 0.04, (s) => strike(b, 'bevel', s, 0.8)); }
grindEdges(b, 0.22, [1], 2); b.clay = true; quench(b, 'water', 2); finish(b, 205); } },
axe: { metal: 'iron', len: 0.15, w: 0.045, t: 0.032, fit: { mount: 'haft', haftCol: 'ochre', gripCol: 'brown', guardMat: 'iron' },
make(b) { for (let p = 0; p < 5; p++) { hot(b); along(b, 0.1, 0.95, 0.08, (s) => strike(b, 'flatten', s)); }
for (let p = 0; p < 3; p++) { hot(b); along(b, 0.6, 1, 0.08, (s) => strike(b, 'flatten', s)); }
hot(b); FG.Ops.strike(b, 'cut', 0.19, 0, 1);
for (let p = 0; p < 4; p++) { hot(b, 1000); along(b, 0.05, 0.98, 0.05, (s) => strike(b, 'bevel', s, 0.85)); }
b.T.fill(20); for (let i = 0; i < b.N; i++) b.scale[i] = 0.8;
const tgt = []; along(b, 0, 1, 0.02, (s) => { const f = s / b.L, d = Math.max(0, Math.abs(f - 0.45) - 0.12) / 0.43, w = b.sample(b.w, s); tgt.push([s, b.sample(b.off, s) - w / 2 + w * 0.55 * Math.min(1, d * d * 1.3)]); });
for (let p = 0; p < 30; p++) for (const [s, u] of tgt) FG.Ops.grind(b, 'profile', s, u, 0.5);
for (let p = 0; p < 2; p++) along(b, 0.02, 1, 0.01, (s) => { const c = b.sample(b.off, s), w = b.sample(b.w, s) / 2; FG.Ops.grind(b, 'edge', s, c + w * 0.8, 0.5); });
along(b, 0.02, 1, 0.01, (s) => FG.Ops.hone(b, s, 0.5)); b.version++; } },
hammer: { metal: 'bronze', len: 0.15, w: 0.045, t: 0.032, fit: { mount: 'haft', haftCol: 'brown', gripCol: 'red', guardMat: 'bronze' },
make(b) { for (let p = 0; p < 2; p++) { hot(b, 720); along(b, 0.1, 0.9, 0.1, (s) => strike(b, 'upset', s, 0, 0.6)); }
hot(b, 720); strike(b, 'punch', b.L * 0.5); strike(b, 'punch', b.L * 0.5); for (let k = 0; k < 3; k++) { hot(b, 720); strike(b, 'taper', b.L * 0.97); }
b.T.fill(20); along(b, 0, 1, 0.01, (s) => FG.Ops.grind(b, 'flat', s, b.sample(b.off, s), 0.4)); finish(b, 0); } },
spear: { metal: 'star', len: 0.26, w: 0.03, t: 0.012, fit: { mount: 'haft', haftCol: 'black', gripCol: 'blue', guardMat: 'star' },
make(b) { for (let p = 0; p < 2; p++) { hot(b); along(b, 0.3, 0.9, 0.06, (s) => strike(b, 'flatten', s)); } for (let k = 0; k < 8; k++) { hot(b); strike(b, 'taper', b.L * 0.92); strike(b, 'taper', b.L * 0.98); }
for (let p = 0; p < 3; p++) { hot(b, 1000); along(b, 0.35, 0.98, 0.05, (s) => { strike(b, 'bevel', s, 0.8); strike(b, 'bevel', s, -0.8); }); }
grindEdges(b, 0.3, [1, -1]); quench(b, 'oil', 4); finish(b, 290); } },
dagger: { metal: 'damascus', len: 0.26, w: 0.03, t: 0.012, fit: { mount: 'grip', guard: 'curved', guardMat: 'silver', grip: 'wood', gripCol: 'brown', pommel: 'faceted', pommelMat: 'silver' },
make(b) { hot(b, 1100); FG.Ops.fold(b); for (let p = 0; p < 4; p++) { hot(b); along(b, 0.3, 0.95, 0.06, (s) => strike(b, 'draw', s)); } for (let k = 0; k < 5; k++) { hot(b); strike(b, 'taper', b.L * 0.9); strike(b, 'taper', b.L * 0.97); }
for (let p = 0; p < 3; p++) { hot(b, 1000); along(b, 0.35, 0.98, 0.05, (s) => { strike(b, 'bevel', s, 0.8); strike(b, 'bevel', s, -0.8); }); }
grindEdges(b, 0.3, [1, -1]); quench(b, 'oil', 6); finish(b, 270); } },
};
Rc.forge = (name) => {
const r = Rc.list[name]; FG.UI.startForge(r.metal, 'short'); const b = FG.Work.start(r.metal, r.len, r.w, r.t);
b.scale.fill(0.85); r.make(b); b.clamp(); b.version++; FG.Work.bar = b; return b;
};
Rc.show = async (name, title) => {
const r = Rc.list[name], b = Rc.forge(name), o = Object.assign({}, FG.Fit.DEFAULT, r.fit); o.type = FG.Classify.type(b, o);
const w = FG.Weapon.build(b, o), stats = FG.Stats.compute(b, o, w.info); FG.Weapon.dispose(w);
const rec = FG.Weapon.record(b, o, stats, title || stats.type); await FG.Turn.open(rec, { fresh: true }); return rec;
};
}
// ===== main.js =====
{
FG.t = 0;
FG.boot = async () => {
if (!FG.R.init()) { document.body.classList.add('nogl'); FG.$('tag').textContent = 'This game needs WebGL.'; return; }
FG.R.renderer.localClippingEnabled = true;
FG.Post.init(); FG.UI.init(); FG.Input.init();
requestAnimationFrame(FG.loop);
await FG.L.forge();
FG.M.init();
FG.Room.build(); FG.Hearth.build(); FG.Bellows.build(); FG.Anvil.build(); FG.Props.build(); FG.Props.buildGrind(); FG.Props.buildWall();
FG.Fx.build(); FG.Fx.build2(); FG.Work.build(); FG.Hammer.build(); FG.Turn.build();
FG.Work.start('steel', 0.26, 0.03, 0.012); FG.Work.group.visible = false;
FG.Cam.go('title', true);
FG.R.warm(FG.R.scene, FG.R.cam); FG.R.warm(FG.Turn.scene, FG.Turn.cam);
FG.ready = true;
FG.$('load').classList.add('hide'); FG.$('menu').classList.remove('hide');
window.FORGE = true; FG.emit('ready');
if (FG.TILE && FG.Tile) FG.Tile.setup();
};
let last = 0;
FG.loop = (now) => {
requestAnimationFrame(FG.loop);
const raw = last ? now - last : 16.7; last = now;
const dt = Math.min(0.05, Math.max(0.001, raw / 1000)); FG.dt = dt;
if (FG.paused) return;
FG.t += dt;
try { FG.frame(dt); } catch (e) { if (!FG._err) { FG._err = true; console.error(e && e.stack ? e.stack : e); } }
FG.R.mark(raw);
};
FG.frame = (dt) => {
const t = FG.t, R = FG.R;
if (!FG.ready) { R.renderer.setRenderTarget(null); R.renderer.setClearColor(0x070504); R.renderer.clear(); return; }
const G = FG.G;
if (G.mode === 'inspect' && FG.Turn.on) { FG.Turn.update(dt); FG.Post.render(FG.Turn.scene, FG.Turn.cam, t); return; }
if (G.mode === 'bench' && FG.Bench.cam && FG.Bench.on) { FG.Bench.update(dt); FG.Post.render(FG.Bench.scene, FG.Bench.cam, t); return; }
FG.Hearth.update(dt, t); FG.Bellows.update(dt); FG.Props.update(dt, t); FG.Props.updateGrind(dt);
FG.Stations.thermal(dt);
if (FG.Station && FG.Station.update) FG.Station.update(dt);
FG.Work.update(dt, t); FG.Hammer.update(dt);
FG.Fx.update(dt); FG.Fx.update2(dt, t); FG.Fx.update3(dt);
if (FG.Tile.on) FG.Tile.tick(dt);
FG.Cam.update(dt, t); FG.UI.update(dt);
if (FG.Audio.ctx) {
const near = FG.clamp(1.6 - R.cam.position.distanceTo(FG.Hearth.FIRE) * 0.4, 0, 1);
FG.Audio.update(dt, near, G.station === 'grind' ? (FG.Stations.grind.level || 0) : 0, G.station === 'bench' ? (FG.Stations.bench.level || 0) : 0, FG.Props.wheelSpeed || 0);
}
FG.Post.render(R.scene, R.cam, t);
};
if (window.THREE) FG.boot(); else addEventListener('load', () => (window.THREE ? FG.boot() : document.body.classList.add('nogl')));
}
</script>
