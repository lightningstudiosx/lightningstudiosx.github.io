<!DOCTYPE html>
<html lang="en">
<head>

<title>The Waiting Room · Kai.fun</title>
<meta name="description" content="A 3D waiting room where your only control is time. Take a number. Every real minute the room changes a little: strangers arrive, magazines go out of date, the plant grows, fish are born. Read every magazine and every book on the shelf. Come back in a few days and see what happened while you were gone.">

<style>

:root{--beige:#e9dcc0;--cream:#f6efe1;--paper:#fbf6ea;--ink:#3a2f27;--ink2:#5a4a3c;--brown:#6b5644;--teal:#6f9e98;--teal2:#4f7e78;--peach:#e7a98a;--mustard:#d9a441;--red:#c8382c;--dim:#8a7a66;
--ui:"Trebuchet MS","Gill Sans","Segoe UI",Helvetica,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif;--mono:"Courier New",Courier,monospace;--sh:0 10px 30px rgba(40,25,10,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#2a2420;color:var(--ink);overflow:hidden}
body{font-family:var(--ui);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea,select{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
.hide{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#vign{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 48%,transparent 55%,rgba(40,22,8,.5) 100%)}
#grain{position:fixed;inset:-50%;pointer-events:none;z-index:2;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:grain 1s steps(6) infinite}
body.nograin #grain{display:none}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
body.dreaming #vign{background:radial-gradient(ellipse at 50% 48%,transparent 35%,rgba(90,60,140,.45) 100%)}
body.dreaming #gl{filter:saturate(1.25) hue-rotate(-12deg) blur(.4px)}
#top{position:fixed;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:40;pointer-events:none}
#top>*{pointer-events:auto}
#kai{font-weight:700;font-size:13px;color:var(--ink);text-decoration:none;background:rgba(246,239,225,.9);border:1px solid rgba(107,86,68,.35);padding:8px 13px 8px 11px;border-radius:999px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#kai:hover{background:#fff}
body.inroom #kai{display:none}
#topR{display:flex;gap:8px}
.ib{border:1px solid rgba(107,86,68,.35);background:rgba(246,239,225,.9);height:36px;min-width:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ib svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .x{display:none}.ib.off .x{display:inline}.ib.off .wave{display:none}
.screen{position:fixed;inset:0;z-index:10}

#home{display:flex;align-items:center;justify-content:center;padding:62px 16px 20px;overflow-y:auto;background:linear-gradient(180deg,rgba(233,220,192,.86),rgba(220,204,172,.92) 62%,rgba(127,165,156,.92) 62.2%,rgba(111,150,142,.95));backdrop-filter:blur(3px)}
#homeWall{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:520px}
#homeSign{font-family:var(--ui);font-weight:700;letter-spacing:.12em;font-size:clamp(17px,4.6vw,24px);text-align:center;color:var(--ink);background:var(--paper);padding:12px 20px;border:3px solid var(--ink);box-shadow:var(--sh)}
#homeSign small{display:block;font-weight:400;letter-spacing:.04em;font-size:13px;color:var(--ink2);margin-top:3px}
#tmach{position:relative;width:250px;background:linear-gradient(90deg,#a82a20,#d8443a 45%,#b8322a);border-radius:18px 18px 10px 10px;padding:16px 18px 18px;box-shadow:var(--sh),inset 0 2px 0 rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;gap:12px}
#tmTop{background:#140806;border-radius:8px;padding:6px 14px;text-align:center;width:100%;border:3px solid #3a1a14}

#tmBody{position:relative;width:100%;height:120px;display:flex;justify-content:center}
#tmSlot{position:absolute;top:8px;width:150px;height:10px;background:#2a0a06;border-radius:6px;box-shadow:inset 0 2px 3px #000}
.tk{position:absolute;top:13px;width:132px;padding:8px 8px 10px;background:var(--paper);color:var(--ink);text-align:center;font-family:var(--mono);box-shadow:0 4px 10px rgba(0,0,0,.3);transform-origin:top center;transform:scaleY(.02);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.3,1),opacity .2s;border-bottom:2px dashed #b8a888;cursor:pointer}
.tk.out,.tk.printing{transform:scaleY(1) rotate(-2deg);opacity:1}
.tk i{display:block;font-style:normal;font-size:8px;letter-spacing:.15em;color:var(--red)}
.tk b{display:block;font-size:34px;letter-spacing:.06em;line-height:1.1}
.tk span{display:block;font-size:9px;color:var(--ink2)}
.pull{background:var(--cream);color:var(--red);font-weight:700;letter-spacing:.12em;font-size:14px;padding:11px 18px;border-radius:8px;box-shadow:0 4px 0 #7a1a12;width:100%}
.pull:active{transform:translateY(3px);box-shadow:0 1px 0 #7a1a12}
.pull:disabled{opacity:.7;cursor:default}
#tmFoot{font-size:9px;letter-spacing:.25em;color:rgba(255,240,220,.7)}
#homeBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.hb{background:var(--paper);border:2px solid var(--ink);padding:11px 10px;font-weight:700;letter-spacing:.06em;font-size:13px;box-shadow:3px 3px 0 var(--ink);text-align:center}
.hb small{display:block;font-weight:400;font-size:11px;letter-spacing:0;color:var(--ink2);margin-top:2px}
.hb:hover{background:#fff}.hb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hb.main{grid-column:1/-1;background:var(--mustard);font-size:15px;padding:14px}
#homeNote{font-size:13px;text-align:center;color:var(--ink);background:rgba(251,246,234,.75);padding:10px 14px;border-radius:8px;line-height:1.5}
#boot{position:fixed;inset:0;z-index:100;background:var(--beige);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-weight:700;letter-spacing:.2em;color:var(--ink);transition:opacity .5s;text-align:center;padding:20px}
#boot.gone{opacity:0;pointer-events:none}
#boot a{color:var(--red)}
#homeSign i{display:block;font-style:normal;font-size:11px;letter-spacing:.32em;color:var(--red);margin-bottom:4px}


#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
#hud>*{pointer-events:auto}
#xhair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,250,235,.55);box-shadow:0 0 0 1px rgba(60,40,20,.35);pointer-events:none}

#hoverTag{position:fixed;left:0;top:0;pointer-events:none!important;background:rgba(251,246,234,.95);border:1px solid rgba(107,86,68,.4);padding:6px 10px;border-radius:6px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity .12s;max-width:220px;z-index:25}
#hoverTag.on{opacity:1}
#hoverTag b{display:block}#hoverTag span{display:block;color:var(--ink2);font-size:11px}
#hTL{position:fixed;left:12px;top:12px;display:flex;gap:8px}
#hTL>div{background:#140806;border:2px solid #3a1a14;border-radius:8px;padding:4px 10px 5px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#hTL span{display:block;font-size:8.5px;letter-spacing:.18em;color:#e8a040}
#hTL b{font-family:var(--mono);font-size:22px;color:#ff4a2a;text-shadow:0 0 8px #ff3020;letter-spacing:.06em}
#hYou{background:var(--paper)!important;border-color:#b8a888!important}#hYou b{color:var(--ink)!important;text-shadow:none!important}#hYou span{color:var(--red)!important}
#hTR{position:fixed;right:112px;top:12px;text-align:right;background:rgba(251,246,234,.88);padding:6px 11px;border-radius:8px;font-size:12px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#hTime{font-weight:700}#hWait{color:var(--ink2);font-size:11px}
#hDream{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:rgba(70,50,110,.9);color:#f0e8ff;padding:6px 8px 6px 14px;border-radius:999px;display:flex;align-items:center;gap:10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#hDream span{letter-spacing:.2em;font-weight:700}#hDream button{background:#f0e8ff;color:#3a2a5a;border-radius:999px;padding:5px 12px;font-weight:700;font-size:11px}
#hInv{position:fixed;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(560px,70vw)}
.chip{background:rgba(251,246,234,.92);border:1px solid rgba(107,86,68,.4);border-radius:999px;padding:5px 11px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.chip.coin{background:var(--mustard);font-weight:700}
#hHelp{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);background:rgba(58,47,39,.88);color:var(--cream);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .5s,transform .5s;pointer-events:none!important;max-width:min(520px,86vw);text-align:center}
#hHelp.on{opacity:1;transform:translate(-50%,0)}
body.touch #hHelp{bottom:150px}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);z-index:80;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 16px;font-size:14px;line-height:1.4;max-width:min(460px,88vw);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,28,18,.35)}
.card{background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 rgba(58,47,39,.85);width:min(440px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;animation:pop .18s ease-out}
.card.wide{width:min(720px,100%)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.cardH{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:2px solid var(--ink);background:var(--beige)}
.cardH h3{font-size:15px;letter-spacing:.04em}
.cardH .x{font-size:16px;width:30px;height:30px;border-radius:50%;flex:none}.cardH .x:hover{background:rgba(0,0,0,.08)}
.cardB{padding:14px;overflow-y:auto;line-height:1.5;user-select:text;-webkit-user-select:text}
.cardB p+p{margin-top:8px}.cardB h4{margin:12px 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cardF{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-top:1px dashed rgba(58,47,39,.4)}
.mb{background:var(--cream);border:2px solid var(--ink);padding:8px 13px;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.mb:hover{background:#fff}.mb:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.mb.sm{padding:5px 9px;font-size:12px}.mb.big{padding:12px 20px;font-size:15px}.mb.on{background:var(--mustard)}.mb.warn{color:var(--red)}
.mb:disabled{opacity:.4;cursor:default}
.dim{color:var(--ink2);font-size:13px}
.bigNums{display:flex;gap:10px;margin-bottom:10px}.bigNums>div{flex:1;background:#140806;border-radius:8px;padding:6px;text-align:center}.bigNums small{display:block;font-size:9px;letter-spacing:.18em;color:#e8a040;text-transform:uppercase}.bigNums b{font-family:var(--mono);font-size:30px;color:#ff4a2a}
.sticky{background:#f8e060;padding:12px 14px;font-family:var(--mono);transform:rotate(-1deg);box-shadow:2px 3px 8px rgba(0,0,0,.2)}
.sticky.letter{background:#fbf6ea;font-family:var(--serif);transform:none;border:1px solid #d8ccb0}
.posterBig{display:block;width:min(200px,60%);margin:0 auto 10px;border:2px solid var(--ink)}
.fishList{list-style:none;display:grid;gap:5px}.fishList li{font-size:13px}.fishList i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tvNow{font-family:var(--serif);font-style:italic;background:var(--beige);padding:10px;border-radius:6px}
.guide{list-style:none;font-size:13px;columns:2;column-gap:16px}.guide li{padding:2px 0;break-inside:avoid}.guide li.on{font-weight:700;color:var(--red)}.guide i{color:var(--dim);font-size:11px}
.ledger{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin:8px 0}.ledger td{border-bottom:1px solid #d8ccb0;padding:4px}
.lostList{list-style:none;display:grid;gap:10px}
.talk .who{display:flex;gap:12px;align-items:center;margin-bottom:10px}.talk .face{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;border:2px solid var(--ink)}
.talk .who b{display:block}.talk .who span{display:block;font-size:12px;color:var(--ink2)}.talk .who em{font-size:11px;color:var(--teal2)}
.speech{font-family:var(--serif);font-size:16px;line-height:1.55;background:var(--cream);padding:12px 14px;border-radius:12px;position:relative}

#touch{position:fixed;inset:0;z-index:22;pointer-events:none}
.stick{position:fixed;left:22px;bottom:64px;width:118px;height:118px;border-radius:50%;background:rgba(251,246,234,.28);border:2px solid rgba(251,246,234,.6);pointer-events:auto;touch-action:none;transition:opacity .3s}
.stick.dim{opacity:.45}
.stick .nub{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(251,246,234,.85);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tb{position:fixed;right:20px;bottom:84px;pointer-events:auto;background:rgba(251,246,234,.9);border:2px solid var(--ink);border-radius:999px;padding:12px 16px;font-weight:700;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
body.touch #hInv{bottom:196px;max-width:calc(100vw - 24px)}
@media (max-width:600px){#hTL b{font-size:17px}#hTL span{font-size:7.5px}#hTR{top:62px;right:12px}.guide{columns:1}}
body.inroom #top{justify-content:flex-end}
#crosshair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fbf6ea;box-shadow:0 0 0 1.5px rgba(42,32,24,.75);pointer-events:none;z-index:24;display:none}
body.locked #crosshair{display:block}body.locked #hoverTag{transition:none}
#lockHint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(42,32,24,.72);color:#fbf6ea;font-size:13px;padding:6px 12px;border-radius:999px;pointer-events:none;z-index:24;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#lockHint.on{opacity:1}


#reader{z-index:60;background:rgba(30,20,12,.8);padding:10px}
body.reading #hud,body.reading #top,body.reading #touch{display:none}
.rdX select,.rdX .mb{color:var(--ink)}
.rd{display:flex;flex-direction:column;width:100%;height:100%;max-width:1180px;gap:8px}
.rdTop{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--cream);flex-wrap:wrap}
.rdT b{display:block;font-size:15px}.rdT span{font-size:12px;opacity:.8}
.rdX{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rdX select{background:var(--cream);border:2px solid var(--ink);padding:4px 6px;font-size:12px;max-width:220px}
.rdBook{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:6px}
.rdNav{width:44px;height:64px;border-radius:10px;background:rgba(251,246,234,.15);color:var(--cream);font-size:38px;line-height:1;flex:none}
.rdNav:hover:not(:disabled){background:rgba(251,246,234,.3)}.rdNav:disabled{opacity:.2;cursor:default}
.rdSpread{--ph:min(calc(100vh - 130px),760px);display:flex;height:var(--ph);box-shadow:0 18px 40px rgba(0,0,0,.45);background:#d8ccb0}
.rdPage{width:calc(var(--ph) * .72);max-width:44vw;height:100%;overflow:auto;position:relative;background:var(--paper)}
.rdPage.L{box-shadow:inset -14px 0 18px -12px rgba(0,0,0,.35)}.rdPage.R{box-shadow:inset 14px 0 18px -12px rgba(0,0,0,.35)}
.rd.single .rdSpread{width:100%;--ph:calc(100vh - 140px)}.rd.single .rdPage{width:100%;max-width:none;box-shadow:none}
.rd.single .rdNav{position:absolute;z-index:3;bottom:70px;background:rgba(58,47,39,.6);width:40px;height:50px}.rd.single .rdNav.prev{left:14px}.rd.single .rdNav.next{right:14px}
.rdSpread.fl .rdPage{animation:fl .42s ease-in-out}.rdSpread.fr .rdPage{animation:fr .42s ease-in-out}
@keyframes fl{0%{transform:none;opacity:1}33%{transform:perspective(1400px) rotateY(-28deg) translateX(-24px);opacity:0}34%{transform:perspective(1400px) rotateY(20deg) translateX(24px);opacity:0}100%{transform:none;opacity:1}}
@keyframes fr{0%{transform:none;opacity:1}33%{transform:perspective(1400px) rotateY(28deg) translateX(24px);opacity:0}34%{transform:perspective(1400px) rotateY(-20deg) translateX(-24px);opacity:0}100%{transform:none;opacity:1}}
.rdBot{display:flex;align-items:center;gap:12px;color:var(--cream);font-size:12px;justify-content:center}
.rdSlide{width:min(420px,60vw);accent-color:var(--mustard)}
.blank{width:100%;height:100%;background:repeating-linear-gradient(45deg,#e8dcc0,#e8dcc0 8px,#e2d4b4 8px,#e2d4b4 16px)}

.mpage{min-height:100%;padding:18px 18px 34px;position:relative;font-family:var(--ui);font-size:13px;line-height:1.45;color:#2a2018;background:var(--paper)}
.mpage .kick{display:inline-block;background:var(--mbg);color:var(--mfg);font-size:10px;font-weight:700;letter-spacing:.2em;padding:3px 8px;margin-bottom:8px}

.mpage blockquote{font-family:var(--ui);font-weight:700;font-size:15px;color:var(--mbg);filter:brightness(.8);border-top:3px solid var(--mbg);border-bottom:3px solid var(--mbg);padding:6px 0;margin:6px 0 10px;break-inside:avoid}
.aart{width:100%;height:auto;display:block;margin-bottom:10px;border:2px solid #2a2018}
.mfoot{position:absolute;left:18px;right:18px;bottom:10px;display:flex;justify-content:space-between;font-size:10px;color:#8a7a66;border-top:1px solid #d8ccb0;padding-top:4px}
.mast{font-family:var(--serif);font-weight:900;font-size:40px;line-height:.95;letter-spacing:-.02em;color:var(--mfg)}
.mast.sm{font-size:22px;color:var(--mbg);filter:brightness(.85);margin-bottom:8px}
.mpage.cover{background:var(--mbg);color:var(--mfg);display:flex;flex-direction:column;gap:8px;padding:20px}
.ctag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}

<script>
"use strict";
// ===== util.js =====
{
const WR = window.WR = {};
WR.Q = new URLSearchParams(location.search);
WR.$ = id => document.getElementById(id);
WR.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
WR.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
WR.lerp = (a, b, t) => a + (b - a) * t;
WR.damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
WR.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
WR.pad = (n, k) => String(Math.max(0, Math.floor(n)) % Math.pow(10, k || 4)).padStart(k || 4, '0');
WR.angWrap = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
WR.perf = () => performance.now() / 1000;
WR.plural = (n, w, pl) => n + ' ' + (n === 1 ? w : (pl || w + 's'));
WR.cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
WR.title = s => s.replace(/\b([a-z])/g, (m, c) => c.toUpperCase());
WR.isTouch = () => matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
WR.hash = (...a) => {
let h = 2166136261 >>> 0;
for (const v of a) {
const s = typeof v === 'number' ? String(Math.floor(v)) + '#' : String(v) + '|';
for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
}
h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d) >>> 0; h ^= h >>> 12; h = Math.imul(h, 0x297a2d39) >>> 0; h ^= h >>> 15;
return h >>> 0;
};
WR.h01 = (...a) => WR.hash(...a) / 4294967296;
WR.rng = seed => {
let a = (typeof seed === 'number' ? seed : WR.hash(seed)) >>> 0;
const f = () => {
a = (a + 0x6D2B79F5) >>> 0; let t = a;
t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
f.range = (lo, hi) => lo + f() * (hi - lo);
f.int = n => Math.floor(f() * n);
f.ri = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
f.pick = arr => arr[Math.floor(f() * arr.length)];
f.chance = p => f() < p;
f.shuffle = arr => { const b = arr.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
f.some = (arr, n) => f.shuffle(arr).slice(0, n);
return f;
};
WR.store = {
get(k, d) { try { const v = localStorage.getItem('waitingroom.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
set(k, v) { try { localStorage.setItem('waitingroom.' + k, JSON.stringify(v)); } catch (e) { } },
wipe() { try { Object.keys(localStorage).filter(k => k.startsWith('waitingroom.')).forEach(k => localStorage.removeItem(k)); } catch (e) { } }
};
const subs = {};
WR.on = (n, f) => { (subs[n] = subs[n] || []).push(f); };
WR.fire = (n, a, b, c) => { (subs[n] || []).forEach(f => { try { f(a, b, c); } catch (e) { console.warn(e); } }); };
WR.toast = (msg, ms) => {
const t = WR.$('toast'); if (!t) return; t.innerHTML = msg; t.classList.add('show');
clearTimeout(WR._toastT); WR._toastT = setTimeout(() => t.classList.remove('show'), ms || 2600);
};
WR.canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
WR.roman = n => { const m = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; };
WR.ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
WR.numWord = n => ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'][n] || String(n);
}
// ===== clock.js =====
{
const MIN = WR.MIN = 60000, HOUR = WR.HOUR = 3600000, DAY = WR.DAY = 86400000, WEEK = WR.WEEK = 7 * DAY;
WR.dream = { on: false, off: 0, speed: 3600 };
WR.t = () => Date.now() + WR.dream.off;
WR.real = () => Date.now();
WR.date = t => new Date(t == null ? WR.t() : t);
WR.EPOCH = new Date(2020, 0, 6, 9, 0, 0).getTime();   // a Monday, 9 am local: Waiting Weekly #1
const DN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

ch('1. Before You Begin', 'Welcome. You are waiting. This is normal. Everybody waits; it is just that most people do it badly, while looking at their phones and sighing. This pamphlet will teach you to wait well.', 'You will need: one chair, one number, and an afternoon. If you do not have an afternoon, one will be provided.'),
ch('2. Taking A Number', 'Pull the paper ticket firmly from the machine. Do not take two. The machine knows. Look at your number. It is further away than you hoped. That is fine. Hope is not the point. The point is the number.', 'Keep your ticket somewhere safe. Many people put it in a pocket, then spend the next hour checking the pocket. This counts as exercise.'),
ch('3. Choosing A Chair', 'Never sit directly next to a stranger if there is a free chair one along. Never sit one along if there is a free chair two along. If the room is full, sit wherever you like and apologise to the chair.', 'The best chair faces the display but not the clock. The second-best chair faces the window. The worst chair is the one with the wobble. You will find it. Everybody finds it.'),
ch('4. Not Looking At The Clock', 'The clock is not your friend. It is not your enemy either. It is a clock. It goes round. If you look at it, it goes round more slowly; this has been proven by science and by everyone\'s grandmother.', 'Try this: count to sixty without looking. Now look. It has been forty seconds. Do not be discouraged. You are learning.'),
ch('5. Magazines: A User\'s Guide', 'Waiting room magazines are out of date. This is deliberate. A magazine from last month is a small window into the past, when everything was slightly younger, including you.', 'Read the horoscopes first. They are always right, given enough time. Then do the crossword in pencil, so the next person can rub it out and feel clever.'),
ch('6. Advanced Waiting', 'Once you have mastered the basics you may try advanced techniques: the Slow Blink, the Long Sit, the Gentle Hum, and the legendary Waiting Without Waiting, in which you forget you are waiting at all. Masters of this technique have been known to miss their own number.', 'Be kind. Offer water. Return lost things. Listen to people\'s stories. Strangely, the kinder you are, the shorter the wait feels. Some say it actually is shorter. We could not possibly comment.'),
ch('7. When Your Number Is Called', 'Stand up. Do not run. Gather your things. Say goodbye to the plant. Walk to the desk with the quiet dignity of someone who has waited properly.', 'Then, and only then, you may say: "Finally." Say it softly. Other people are still waiting.'),
ch('8. Frequently Asked Questions', 'Will it be long? Yes. How long? Longer. Is there a toilet? Down the corridor, through the door, wait there. Can I jump the queue? No. Can someone let me go ahead? Only if you have been very, very kind. Is the coffee for me? No. It is never for you.', 'Who wrote this pamphlet? The Management. Who is The Management? Please take a seat.')

Bk.gens.etiquette = () => ({ opt: { pub: 'Pause & Daughter, Publishers of Manners' }, chapters: [
ch('On Arrival', 'A lady or gentleman entering a waiting room should nod once, to the room in general. Not to anyone in particular. To the room. The room will not nod back, but it appreciates the gesture.', 'Coats are hung on the rack, not on the back of the chair. A coat on the back of a chair is a coat that is planning to leave.'),

ch('On Sighing', 'One sigh per half hour is permitted. A second sigh may be taken if the clock has been particularly slow. A third sigh is considered a complaint and will be noted.'),
ch('On The Bell', 'Ring once. If nobody comes, that is the answer. Ringing twice is impatient. Ringing ten times is a cry for help. Ringing forty-seven times is a ritual, and the consequences are your own.'),

ch('Breathe In, Tick', 'Dear clock. You have been going round for a very long time. Let us take a moment. Breathe in on the tick. Breathe out on the tock. Notice how each second is the same as the one before, and also completely new.'),

Bk.gens.mop = () => ({ opt: { pub: 'Written on the back of a rota' }, chapters: [

'Then he tried to find his way straight across the garden, but he became more and more puzzled. Presently, he came to a pond where Mr. McGregor filled his water-cans. A white cat was staring at some gold-fish; she sat very, very still, but now and then the tip of her tail twitched as if it were alive. Peter thought it best to go away without speaking to her; he had heard about cats from his cousin, little Benjamin Bunny.',
'He went back towards the tool-shed, but suddenly, quite close to him, he heard the noise of a hoe: scr-r-ritch, scratch, scratch, scritch. Peter scuttered underneath the bushes. But presently, as nothing happened, he came out, and climbed upon a wheelbarrow and peeped over. The first thing he saw was Mr. McGregor hoeing onions. His back was turned towards Peter, and beyond him was the gate!',
'Peter got down very quietly off the wheelbarrow, and started running as fast as he could go, along a straight walk behind some black-currant bushes. Mr. McGregor caught sight of him at the corner, but Peter did not care. He slipped underneath the gate, and was safe at last in the wood outside the garden.',
'Mr. McGregor hung up the little jacket and the shoes for a scare-crow to frighten the blackbirds.',
'Peter never stopped running or looked behind him till he got home to the big fir-tree. He was so tired that he flopped down upon the nice soft sand on the floor of the rabbit-hole and shut his eyes. His mother was busy cooking; she wondered what he had done with his clothes. It was the second little jacket and pair of shoes that Peter had lost in a fortnight!',
'I am sorry to say that Peter was not very well during the evening. His mother put him to bed, and made some camomile tea; and she gave a dose of it to Peter! "One table-spoonful to be taken at bed-time."',

Bk.gens.aesop = () => ({ opt: { pub: 'Traditional · public domain', dedic: 'Moral: wait.' }, chapters: [
F('The Hare and the Tortoise', 'A Hare one day ridiculed the short feet and slow pace of the Tortoise, who replied, laughing: "Though you be swift as the wind, I will beat you in a race." The Hare, believing her assertion to be simply impossible, assented to the proposal; and they agreed that the Fox should choose the course and fix the goal.', 'On the day appointed for the race the two started together. The Tortoise never for a moment stopped, but went on with a slow but steady pace straight to the end of the course. The Hare, lying down by the wayside, fell fast asleep. At last waking up, and moving as fast as he could, he saw the Tortoise had reached the goal, and was comfortably dozing after her fatigue.', 'Slow but steady wins the race.'),
F('The Fox and the Grapes', 'A famished Fox saw some clusters of ripe black grapes hanging from a trellised vine. She resorted to all her tricks to get at them, but wearied herself in vain, for she could not reach them. At last she turned away, hiding her disappointment and saying: "The Grapes are sour, and not ripe as I thought."'),
F('The Ants and the Grasshopper', 'The Ants were spending a fine winter\'s day drying grain collected in the summertime. A Grasshopper, perishing with famine, passed by and earnestly begged for a little food. The Ants inquired of him, "Why did you not treasure up food during the summer?" He replied, "I had not leisure enough. I passed the days in singing." They then said in derision: "If you were foolish enough to sing all the summer, you must dance supperless to bed in the winter."'),
F('The Shepherd\'s Boy and the Wolf', 'A Shepherd-boy, who watched a flock of sheep near a village, brought out the villagers three or four times by crying out, "Wolf! Wolf!" and when his neighbours came to help him, laughed at them for their pains.', 'The Wolf, however, did truly come at last. The Shepherd-boy, now really alarmed, shouted in an agony of terror: "Pray, do come and help me; the Wolf is killing the sheep"; but no one paid any heed to his cries, nor rendered any assistance.', 'There is no believing a liar, even when he speaks the truth.'),
F('The Lion and the Mouse', 'A Lion was awakened from sleep by a Mouse running over his face. Rising up angrily, he caught him and was about to kill him, when the Mouse piteously entreated, saying: "If you would only spare my life, I would be sure to repay your kindness." The Lion laughed and let him go.', 'It happened shortly after this that the Lion was caught by some hunters, who bound him by strong ropes to the ground. The Mouse, recognising his roar, came and gnawed the rope with his teeth, and set him free, exclaiming: "You ridiculed the idea of my ever being able to help you, expecting to receive from me any repayment of your favour; now you know that it is possible for even a Mouse to confer benefits on a Lion."'),
F('The North Wind and the Sun', 'The North Wind and the Sun disputed as to which was the most powerful, and agreed that he should be declared the victor who could first strip a wayfaring man of his clothes. The North Wind first tried his power and blew with all his might, but the keener his blasts, the closer the Traveller wrapped his cloak around him.', 'Then the Sun began to shine. At first his beams were gentle, and the Traveller loosened his cloak; then the Sun shone out in all his warmth, and the Traveller, overcome with heat, undressed and bathed in a stream that lay across his path.', 'Persuasion is better than Force.'),
F('The Crow and the Pitcher', 'A Crow perishing with thirst saw a pitcher, and hoping to find water, flew to it with delight. When he reached it, he discovered to his grief that it contained so little water that he could not possibly get at it. He tried everything he could think of to reach the water, but all his efforts were in vain.', 'At last he collected as many stones as he could carry and dropped them one by one with his beak into the pitcher, until he brought the water within his reach and thus saved his life.', 'Necessity is the mother of invention.'),
F('The Town Mouse and the Country Mouse', 'A Country Mouse invited a Town Mouse to pay him a visit and partake of his country fare. As they were on the bare plough-lands, eating there wheat-stocks and roots pulled up from the hedge-row, the Town Mouse said to his friend, "You live here the life of the ants, while in my house is the horn of plenty."', 'The Country Mouse was easily persuaded, and returned to town with his friend. But no sooner had they begun to eat than the door was opened, and they ran in alarm to a hole. When they ventured out again, someone else came in. The Country Mouse said: "Although you have prepared for me so dainty a feast, I must leave you to enjoy it by yourself. I prefer my bare plough-lands and roots from the hedge-row, so that I can live in safety, and without fear."')
] });

'Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, "and what is the use of a book," thought Alice "without pictures or conversations?"',
'So she was considering in her own mind (as well as she could, for the hot day made her feel very sleepy and stupid), whether the pleasure of making a daisy-chain would be worth the trouble of getting up and picking the daisies, when suddenly a White Rabbit with pink eyes ran close by her.',
'There was nothing so very remarkable in that; nor did Alice think it so very much out of the way to hear the Rabbit say to itself, "Oh dear! Oh dear! I shall be late!" (when she thought it over afterwards, it occurred to her that she ought to have wondered at this, but at the time it all seemed quite natural); but when the Rabbit actually took a watch out of its waistcoat-pocket, and looked at it, and then hurried on, Alice started to her feet, for it flashed across her mind that she had never before seen a rabbit with either a waistcoat-pocket, or a watch to take out of it, and burning with curiosity, she ran across the field after it, and fortunately was just in time to see it pop down a large rabbit-hole under the hedge.',
'In another moment down went Alice after it, never once considering how in the world she was to get out again.',
'The rabbit-hole went straight on like a tunnel for some way, and then dipped suddenly down, so suddenly that Alice had not a moment to think about stopping herself before she found herself falling down a very deep well.',
'Either the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her and to wonder what was going to happen next. First, she tried to look down and make out what she was coming to, but it was too dark to see anything; then she looked at the sides of the well, and noticed that they were filled with cupboards and book-shelves; here and there she saw maps and pictures hung upon pegs. She took down a jar from one of the shelves as she passed; it was labelled "ORANGE MARMALADE", but to her great disappointment it was empty: she did not like to drop the jar for fear of killing somebody underneath, so managed to put it into one of the cupboards as she fell past it.',
'"Well!" thought Alice to herself, "after such a fall as this, I shall think nothing of tumbling down stairs! How brave they\'ll all think me at home! Why, I wouldn\'t say anything about it, even if I fell off the top of the house!" (Which was very likely true.)',
'Down, down, down. Would the fall never come to an end? "I wonder how many miles I\'ve fallen by this time?" she said aloud. "I must be getting somewhere near the centre of the earth. Let me see: that would be four thousand miles down, I think" (for, you see, Alice had learnt several things of this sort in her lessons in the schoolroom, and though this was not a very good opportunity for showing off her knowledge, as there was no one to listen to her, still it was good practice to say it over) "yes, that\'s about the right distance, but then I wonder what Latitude or Longitude I\'ve got to?" (Alice had no idea what Latitude was, or Longitude either, but thought they were nice grand words to say.)',
'Down, down, down. There was nothing else to do, so Alice soon began talking again. "Dinah\'ll miss me very much to-night, I should think!" (Dinah was the cat.) "I hope they\'ll remember her saucer of milk at tea-time. Dinah my dear! I wish you were down here with me! There are no mice in the air, I\'m afraid, but you might catch a bat, and that\'s very like a mouse, you know. But do cats eat bats, I wonder?"',
'And here Alice began to get rather sleepy, and went on saying to herself, in a dreamy sort of way, "Do cats eat bats? Do cats eat bats?" and sometimes, "Do bats eat cats?" for, you see, as she couldn\'t answer either question, it didn\'t much matter which way she put it. She felt that she was dozing off, and had just begun to dream that she was walking hand in hand with Dinah, and saying to her very earnestly, "Now, Dinah, tell me the truth: did you ever eat a bat?" when suddenly, thump! thump! down she came upon a heap of sticks and dry leaves, and the fall was over.',
'Alice was not a bit hurt, and she jumped up on to her feet in a moment: she looked up, but it was all dark overhead; before her was another long passage, and the White Rabbit was still in sight, hurrying down it. There was not a moment to be lost: away went Alice like the wind, and was just in time to hear it say, as it turned a corner, "Oh my ears and whiskers, how late it\'s getting!" She was close behind it when she turned the corner, but the Rabbit was no longer to be seen: she found herself in a long, low hall, which was lit up by a row of lamps hanging from the roof.',
'There were doors all round the hall, but they were all locked; and when Alice had been all the way down one side and up the other, trying every door, she walked sadly down the middle, wondering how she was ever to get out again.',
'[Here the excerpt ends. The rest of this copy was borrowed from the waiting room in 1987 and has not yet been returned. Please wait.]'] }] });

'There was once a shoemaker who, through no fault of his own, had become so poor that at last he had only leather enough left for one pair of shoes. In the evening he cut out the shoes, meaning to begin upon them the next morning; and since he had a good conscience, he lay down quietly, said his prayers, and fell asleep.',

Bk.gens.timemachine = () => ({ opt: { pub: 'William Heinemann, 1895 · public domain · an excerpt', dedic: 'Chosen for the waiting room because of the chairs.' }, chapters: [{ t: 'Chapter I. Introduction (opening)', paras: [
'The Time Traveller (for so it will be convenient to speak of him) was expounding a recondite matter to us. His grey eyes shone and twinkled, and his usually pale face was flushed and animated. The fire burned brightly, and the soft radiance of the incandescent lights in the lilies of silver caught the bubbles that flashed and passed in our glasses. Our chairs, being his patents, embraced and caressed us rather than submitted to be sat upon, and there was that luxurious after-dinner atmosphere when thought roams gracefully free of the trammels of precision. And he put it to us in this way, marking the points with a lean forefinger, as we sat and lazily admired his earnestness over this new paradox (as we thought it) and his fecundity.',
'"You must follow me carefully. I shall have to controvert one or two ideas that are almost universally accepted. The geometry, for instance, they taught you at school is founded on a misconception."',
'"Is not that rather a large thing to expect us to begin upon?" said Filby, an argumentative person with red hair.',
'"I do not mean to ask you to accept anything without reasonable ground for it. You will soon admit as much as I need from you. You know of course that a mathematical line, a line of thickness nil, has no real existence. They taught you that? Neither has a mathematical plane. These things are mere abstractions."',
'"That is all right," said the Psychologist.',
'"Nor, having only length, breadth, and thickness, can a cube have a real existence."',
'"There I object," said Filby. "Of course a solid body may exist. All real things..."',
'"So most people think. But wait a moment. Can an instantaneous cube exist?"',
'"Don\'t follow you," said Filby.',
'"Can a cube that does not last for any time at all, have a real existence?"',
'Filby became pensive. "Clearly," the Time Traveller proceeded, "any real body must have extension in four directions: it must have Length, Breadth, Thickness, and Duration. But through a natural infirmity of the flesh, which I will explain to you in a moment, we incline to overlook this fact. There are really four dimensions, three which we call the three planes of Space, and a fourth, Time."',
'[Here the excerpt ends. Somebody has written in the margin, in pencil: "a waiting room is a slow time machine."]'] }] });

{

'<button class="mb sm" id="rdBm" title="Bookmark this page">🔖</button><button class="mb sm" id="rdClose" title="Close (Esc)">✕</button></div></div>' +
'<div class="rdBook"><button class="rdNav prev" aria-label="Previous page">‹</button><div class="rdSpread"><div class="rdPage L"></div><div class="rdPage R"></div></div><button class="rdNav next" aria-label="Next page">›</button></div>' +
'<div class="rdBot"><input type="range" class="rdSlide" min="1" max="' + o.count + '" value="1" aria-label="Page"><span class="rdNum"></span></div>';
WR.$('reader').classList.remove('hide'); WR.UI.overlay(true); document.body.classList.add('reading');
w.querySelector('.prev').onclick = () => Rd.turn(-1); w.querySelector('.next').onclick = () => Rd.turn(1);

const toc = w.querySelector('.rdToc'); if (toc) toc.onchange = () => { if (toc.value !== '') { o.i = +toc.value; if (wide() && o.i % 2 === 0 && o.i > 0) o.i--; Rd.draw(); WR.Audio.page(); toc.value = ''; } };
let sx = null; const bk = w.querySelector('.rdBook');
bk.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });

if (o.extraWire) o.extraWire(w);
Rd.draw();
};
Rd.pair = () => { const o = Rd.cur; if (!wide()) return [o.i, null]; if (o.i === 0) return [null, 0]; return [o.i, o.i + 1 < o.count ? o.i + 1 : null]; };
Rd.draw = () => {
const o = Rd.cur, w = WR.$('rdWrap'); if (!o) return;
const [a, b] = Rd.pair(), L = w.querySelector('.rdPage.L'), R = w.querySelector('.rdPage.R');
w.classList.toggle('single', !wide());
const fill = (el, i) => { el.innerHTML = i == null ? '<div class="blank"></div>' : o.page(i); el.dataset.p = i == null ? '' : i; el.scrollTop = 0; if (i != null && o.mount) o.mount(el, i); };
fill(L, a); if (wide()) { R.style.display = ''; fill(R, b); } else R.style.display = 'none';
const last = Math.max(a == null ? -1 : a, b == null ? -1 : b);
w.querySelector('.rdNum').textContent = (a == null ? 'Cover' : 'p. ' + (a + 1) + (b != null ? '–' + (b + 1) : '')) + ' of ' + o.count + (WR.S.bm[o.key] != null ? '  ·  🔖 p. ' + (WR.S.bm[o.key] + 1) : '');
w.querySelector('.rdSlide').value = (a == null ? 0 : a) + 1;
w.querySelector('.prev').disabled = o.i <= 0; w.querySelector('.next').disabled = last >= o.count - 1;

Rd.turn = (d) => {

let ni = o.i + d * step; if (wide() && d < 0 && ni < 1) ni = 0; if (ni < 0 || ni > o.count - 1) return;
const w = WR.$('rdWrap'), sp = w.querySelector('.rdSpread'); WR.Audio.page();
sp.classList.remove('fl', 'fr'); void sp.offsetWidth; sp.classList.add(d > 0 ? 'fl' : 'fr');

Rd.close = () => { const o = Rd.cur; if (o && o.onClose) o.onClose(); Rd.cur = null; document.body.classList.remove('reading'); WR.$('reader').classList.add('hide'); WR.$('rdWrap').innerHTML = ''; WR.UI.overlay(false); WR.fire('coll'); };

e.stopImmediatePropagation();

{

if (WR.isCalled() && !WR.S.called && !WR.Ending.on && !WR.UI.ov) WR.Ending.start();
const cp = WR.R.cam.position, w = WR.W.weather();
WR.Audio.update(dt, { inRoom: true, rain: w.rain, nearClock: Math.hypot(cp.x + 1.3, cp.z + 4.5) < 3, nearTank: WR.clamp(1.4 - Math.hypot(cp.x - 5.5, cp.z + 3.2) / 3, 0, 1) });
} else WR.Audio.update(dt, { inRoom: false, rain: 0 });
