<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman Café · Kai.fun</title>
<style>
  :root{
    --ink:#141414; --paper:#ffffff; --muted:#8a8a8a; --line:#e2e2e2;
    --coral:#ff6b5e; --sky:#4aa9d8; --moss:#6fb85c; --grape:#9b7fd4; --sun:#f5b829;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Trebuchet MS",system-ui,sans-serif;
    min-height:100vh; padding:28px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .back{display:inline-block;text-decoration:none;color:var(--muted);font-size:15px;margin-bottom:18px;}
  .back:hover{color:var(--ink);}
  header{text-align:center;margin-bottom:8px;}
  .wordmark{
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
    font-weight:900;font-size:clamp(36px,7vw,60px);
    transform:rotate(-1.5deg);display:inline-block;line-height:.95;
  }
  .wordmark .w1{color:var(--sun);} .wordmark .w2{color:var(--ink);}
  .subtitle{color:var(--muted);margin-top:8px;font-size:15px;}

  /* the barista */
  #barista{
    font-family:"Courier New",monospace;
    text-align:center; white-space:pre; line-height:1.15;
    font-size:15px; margin:18px 0 6px;
  }
  #speech{
    text-align:center; min-height:26px; font-size:15px;
    margin-bottom:22px; color:var(--ink);
  }
  #speech b{background:var(--sun);padding:0 6px;border-radius:6px;}

  .menu{
    border:2px solid var(--ink); border-radius:14px; background:#fff;
    box-shadow:5px 5px 0 var(--ink); padding:18px; margin-bottom:16px;
  }
  .menu h2{
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
    font-size:19px; margin-bottom:10px;
  }
  .item{
    display:flex; align-items:center; gap:10px;
    padding:9px 6px; border-bottom:1px dashed var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item .nm{flex:1;}
  .item .nm small{display:block;color:var(--muted);font-size:12px;}
  .item .price{font-weight:700;min-width:56px;text-align:right;}
  .item .price.free{color:var(--moss);}
  .item button{
    border:2px solid var(--ink); border-radius:10px; background:#fff;
    font-family:inherit; font-weight:700; font-size:13px;
    padding:7px 14px; cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .item button:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);background:var(--sun);}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;}
  .note a{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Kai.fun</a>
  <header>
    <div class="wordmark"><span class="w1">Stickman</span> <span class="w2">Caf&eacute;</span></div>
    <div class="subtitle">water is free. everything else keeps the site alive.</div>
  </header>

  <div id="barista"></div>
  <div id="speech">welcome in. what can i get you?</div>

  <div class="menu">
    <h2>~ drinks ~</h2>
    <div id="drinks"></div>
  </div>
  <div class="menu">
    <h2>~ snacks ~</h2>
    <div id="snacks"></div>
  </div>
  <div class="menu">
    <h2>~ questionable ~</h2>
    <div id="weird"></div>
  </div>

  <p class="note">
    paid items open PayPal in a new tab as a tip &mdash; nothing ships, it's a tip jar with a menu.<br>
    water is, and will always be, free.
  </p>
</div>

<script>
// ====== EDIT THIS: your PayPal.Me username ======
const PAYPAL_USER = "YOURPAYPALNAME";   // <-- replace with your paypal.me name

const MENU = {
  drinks: [
    { n:"Water",             d:"cold. wet. free forever.",            p:0 },
    { n:"Drip Coffee",       d:"the classic. keeps kai coding.",      p:2 },
    { n:"Espresso",          d:"small cup, big consequences.",        p:3 },
    { n:"Cappuccino",        d:"foam art attempted, not promised.",   p:4 },
    { n:"Giant Latte",       d:"comically large. two hands.",         p:5 },
    { n:"Hot Chocolate",     d:"for non-coffee people. respect.",     p:3 },
    { n:"Mystery Tea",       d:"we also don't know what kind.",       p:2 },
  ],
  snacks: [
    { n:"Croissant",         d:"flaky. buttery. ASCII crumbs.",       p:3 },
    { n:"Cookie",            d:"one (1) perfect cookie.",             p:2 },
    { n:"Day-old Muffin",    d:"discounted honesty.",                 p:1 },
    { n:"Whole Cake",        d:"celebrating something? or not.",      p:10 },
  ],
  weird: [
    { n:"One Good Idea",     d:"kai will think really hard for you.", p:5 },
    { n:"Motivation",        d:"a stickman believes in you.",         p:1 },
    { n:"Server Fuel",       d:"keeps the games online. probably.",   p:7 },
    { n:"The Whole Caf\u00e9", d:"you now own this establishment.",   p:100 },
  ]
};

// ====== stickman barista poses ======
const POSE_IDLE = String.raw`
   O
  /|\    ___
  / \   |___|
_________|_|____
|  STICKMAN CAFE |`;
const POSE_MAKE = String.raw`
   O
  \|/    ~~~
  / \   (___)
_________|_|____
|  STICKMAN CAFE |`;
const POSE_SERVE = String.raw`
   O   \c/
  /|__  
  / \   
_________________
|  STICKMAN CAFE |`;

const baristaEl = document.getElementById("barista");
const speechEl = document.getElementById("speech");
baristaEl.textContent = POSE_IDLE;

let busy = false;
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function order(item){
  if(busy) return;
  busy = true;
  speechEl.innerHTML = "one <b>"+item.n.toLowerCase()+"</b>, coming up\u2026";
  baristaEl.textContent = POSE_MAKE;
  await sleep(1100);
  baristaEl.textContent = POSE_SERVE;
  if(item.p === 0){
    speechEl.innerHTML = "here you go. <b>on the house.</b> always.";
  }else{
    speechEl.innerHTML = "that'll be <b>$"+item.p+"</b> \u2014 opening the register\u2026";
    window.open("https://www.paypal.me/"+PAYPAL_USER+"/"+item.p, "_blank");
  }
  await sleep(1600);
  baristaEl.textContent = POSE_IDLE;
  speechEl.textContent = "anything else?";
  busy = false;
}

function buildSection(id, items){
  const el = document.getElementById(id);
  for(const item of items){
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML =
      '<div class="nm">'+item.n+'<small>'+item.d+'</small></div>'
      +'<div class="price'+(item.p===0?' free':'')+'">'+(item.p===0?'FREE':'$'+item.p)+'</div>';
    const btn = document.createElement("button");
    btn.textContent = item.p===0 ? "take" : "buy";
    btn.onclick = ()=>order(item);
    row.appendChild(btn);
    el.appendChild(row);
  }
}
buildSection("drinks", MENU.drinks);
buildSection("snacks", MENU.snacks);
buildSection("weird", MENU.weird);
</script>
</body>
</html>
