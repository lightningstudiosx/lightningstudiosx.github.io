<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="icons/chalk.svg" type="image/svg+xml"><link rel="icon" href="icons/chalk.png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Chalk · Kai.fun</title>
<meta name="description" content="A calm sidewalk-chalk ambience: pick up a chunky stick of chalk, draw on a sunny pavement, listen to the birds and the wind, then let the rain wash it all away.">
<meta name="theme-color" content="#b9b2a4">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Gochi+Hand&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#3d3a35;--ink2:#6e6960;--pill:rgba(250,248,243,.82);--pill2:rgba(250,248,243,.95);--sh:0 2px 0 rgba(40,36,30,.12),0 6px 18px rgba(40,36,30,.16);
--f:"Fredoka","Trebuchet MS",system-ui,sans-serif;--hand:"Gochi Hand","Segoe Print","Comic Sans MS",cursive}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#a9a397}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#cv.grab{cursor:grab}#cv.hold{cursor:none}#cv.pick{cursor:pointer}
#kai{position:fixed;left:12px;top:10px;z-index:30;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;background:var(--pill);padding:8px 14px 8px 12px;border-radius:999px;box-shadow:var(--sh);line-height:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#kai:hover{background:var(--pill2)}
#brand{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;font-family:var(--hand);font-size:34px;letter-spacing:.12em;color:rgba(255,255,255,.92);text-shadow:0 0 1px rgba(255,255,255,.6),0 2px 10px rgba(40,30,20,.35);pointer-events:none;transition:opacity 2.5s}
#bar{position:fixed;right:12px;top:10px;z-index:30;display:flex;gap:8px;align-items:center}
.ib{appearance:none;border:0;background:var(--pill);height:44px;min-width:44px;border-radius:999px;box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 13px;font:600 15px var(--f);color:var(--ink);transition:transform .15s,background .3s,opacity .3s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ib:hover{transform:translateY(-1px);background:var(--pill2)}.ib:active{transform:translateY(1px)}
.ib svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:#5d6f86;color:#fff}.ib.on svg{stroke:#fff}
.ib:disabled{opacity:.55;cursor:default;transform:none}
.ib.off .wave{display:none}.ib:not(.off) .x{display:none}
#vol{width:84px;accent-color:#6b7d94;cursor:pointer}
#volwrap{display:flex;align-items:center;gap:6px;background:var(--pill);height:44px;border-radius:999px;box-shadow:var(--sh);padding:0 6px 0 2px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#volwrap .ib{box-shadow:none;background:transparent;backdrop-filter:none}
#drop{display:none}#drop.show{display:flex}
#hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;font-family:var(--hand);font-size:21px;color:var(--ink);background:var(--pill);padding:7px 18px;border-radius:999px;box-shadow:var(--sh);white-space:nowrap;pointer-events:none;transition:opacity .8s;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#hint.hide{opacity:0}
#fade{position:fixed;inset:0;z-index:50;background:#b8b1a3;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:44px;color:#fff;letter-spacing:.14em;transition:opacity 1.2s;pointer-events:none}
#fade.gone{opacity:0}
#err{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;display:none;background:#fff;padding:12px;border-radius:12px;font-size:14px}
@media (max-width:640px){
  #brand{display:none}
  #kai{font-size:13px;padding:8px 10px;top:9px;left:8px}
  #bar{right:8px;top:8px;gap:6px}
  .ib{height:40px;min-width:40px;padding:0 10px}
  .ib .lbl{display:none}
  #vol{display:none}#volwrap{padding:0;height:40px}
  #hint{font-size:18px}
}
</style>
</head>
<body>
<canvas id="cv" tabindex="0"></canvas>
<a id="kai" href="index.html">← Kai.fun</a>
<div id="brand">chalk</div>
<div id="bar">
  <button class="ib" id="drop" title="Put the chalk back (Esc)"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg><span class="lbl">Put down</span></button>
  <button class="ib" id="smudge" title="Smudge mode (or right-drag / two fingers)"><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5c0 3.6-2.4 6-6 6-2.6 0-4.1-1.2-5.4-3.2L4.2 13.6a1.5 1.5 0 0 1 2.4-1.8L9 14"/></svg><span class="lbl">Smudge</span></button>
  <button class="ib" id="rain" title="Make it rain"><svg viewBox="0 0 24 24"><path d="M7 15.5a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 7a3.8 3.8 0 0 1 .5 7.6"/><path d="M8.5 18l-1 2.5M12.5 17.5l-1 2.5M16.5 18l-1 2.5"/></svg><span class="lbl">Rain</span></button>
  <button class="ib" id="snap" title="Save your drawing as a PNG"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10.5H4z"/><circle cx="12" cy="13.2" r="3.3"/></svg></button>
  <div id="volwrap"><button class="ib" id="snd" title="Sound on / off"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button><input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div>
</div>
<div id="hint">tap a chalk to pick it up</div>
<div id="fade">chalk</div>
<div id="err"></div>
<script>
"use strict";
// ===== util.js =====
// util.js - shared constants, helpers, shared uniforms
const QS = new URLSearchParams(location.search);
const SPEED = Math.max(0.1, Math.min(20, +QS.get('speed') || 1));   // test hook: speeds up the weather timeline
const TILE = QS.has('tile');
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window);
// world layout (1 unit = 10 cm). x: -14..14, z: -10..10
const WX0 = -14, WX1 = 14, WZ0 = -10, WZ1 = 10, WW = WX1 - WX0, WD = WZ1 - WZ0;
const GRASS_Z = -6.5, CURB_Z0 = 4.5, CURB_Z1 = 5.6, ROAD_Y = -0.9;
const DRAIN = { x0: 3.0, x1: 5.5, z0: 5.72, z1: 7.05 };
const TEXW = 2048, TEXH = Math.round(2048 * WD / WW);
const DPR = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 2 : 1.75);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(20261115);
const rnd = (a = 1, b) => b === undefined ? R() * a : a + R() * (b - a);
const groundY = z => z > CURB_Z1 ? ROAD_Y : 0;
const toUV = (x, z) => [(x - WX0) / WW, (z - WZ0) / WD];
function srgbToLin(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function hexLin(hex) { const c = new THREE.Color(hex); return [srgbToLin(c.r), srgbToLin(c.g), srgbToLin(c.b)]; }

// sidewalk chalk colours (sRGB)
const CHALK_COLS = [
  { n: 'white', c: '#f3efe6' }, { n: 'pink', c: '#f39ab9' }, { n: 'yellow', c: '#f6d964' }, { n: 'sky', c: '#7cc7ea' },
  { n: 'mint', c: '#93d58c' }, { n: 'orange', c: '#f5a259' }, { n: 'lilac', c: '#b9a0e2' }, { n: 'red', c: '#e8605c' },
  { n: 'blue', c: '#5583d8' }, { n: 'teal', c: '#5ccab7' }];

// uniforms shared by every patched material (objects are shared by reference)
const U = {
  uTime: { value: 0 }, uCloud: { value: 0 }, uCloudT: { value: 0 }, uWet: { value: 0 }, uWater: { value: 0 }, uRain: { value: 0 },
  uSun: { value: 1 }, tGround: { value: null }, tChalk: { value: null }, uTexel: { value: new THREE.Vector2(1 / TEXW, 1 / TEXH) },
  uSoggy: { value: 0 }, uWind: { value: new THREE.Vector2(0.55, 0.18) }
};
const STATE = { held: null, drawing: false, smudgeMode: false, phase: 'sun', ready: false, strokes: 0, inked: 0 };

function showErr(m) { const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = 'Sorry, something went wrong: ' + m; }

// ===== glsl.js =====
// glsl.js - shared GLSL snippets + a helper that patches MeshStandardMaterials
const G_NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
float hash13(vec3 p3){ p3 = fract(p3 * .1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash12(i), hash12(i + vec2(1., 0.)), u.x), mix(hash12(i + vec2(0., 1.)), hash12(i + vec2(1., 1.)), u.x), u.y); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.7); a *= .5; } return s / .96875; }
float fbm3(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 3; i++){ s += a * vnoise(p); p = p * 2.07 + vec2(5.3, 11.9); a *= .5; } return s / .875; }
vec3 vor(vec2 p){ vec2 i = floor(p), f = fract(p); float d1 = 8., d2 = 8., id = 0.;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){ vec2 g = vec2(float(x), float(y)); vec2 o = hash22(i + g);
    vec2 r = g + o - f; float d = dot(r, r); if (d < d1){ d2 = d1; d1 = d; id = hash12(i + g + 7.3); } else if (d < d2) d2 = d; }
  return vec3(sqrt(d1), sqrt(d2), id); }
float vnoise3(vec3 p){ vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3. - 2. * f);
  float a = mix(mix(hash13(i), hash13(i + vec3(1,0,0)), u.x), mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), u.x), u.y);
  float b = mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), u.x), mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), u.x), u.y);
  return mix(a, b, u.z); }
`;
const G_UNI = `
uniform float uTime, uCloud, uCloudT, uWet, uWater, uRain, uSun, uSoggy;
uniform vec2 uWind, uTexel;
uniform sampler2D tGround, tChalk;
vec2 w2uv(vec2 xz){ return vec2((xz.x - (${WX0.toFixed(1)})) / ${WW.toFixed(1)}, (xz.y - (${WZ0.toFixed(1)})) / ${WD.toFixed(1)}); }
vec2 uv2w(vec2 uv){ return vec2(uv.x * ${WW.toFixed(1)} + (${WX0.toFixed(1)}), uv.y * ${WD.toFixed(1)} + (${WZ0.toFixed(1)})); }
float cloudShade(vec2 xz){
  vec2 q = xz * .042 + uWind * uCloudT;
  float n = fbm3(q) * .8 + vnoise(q * 3.1) * .2;
  float thr = mix(.66, -.25, uCloud);
  float c = smoothstep(thr - .1, thr + .2, n);
  return 1. - c * mix(.42, .9, uCloud);
}
`;
const G_LIGHT = `
  { float csh = cloudShade(vWPos.xz); reflectedLight.directDiffuse *= csh; reflectedLight.directSpecular *= csh; }
`;

let _patchId = 0;
// o: { vpars, vbegin, fpars, map, rough, normal, light, emis }
function patchStd(mat, o = {}) {
  const key = 'p' + (++_patchId);
  mat.customProgramCacheKey = () => key;
  mat.onBeforeCompile = sh => {
    for (const k in U) sh.uniforms[k] = U[k];
    if (o.uniforms) for (const k in o.uniforms) sh.uniforms[k] = o.uniforms[k];
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nuniform float uTime, uCloud, uWet, uRain, uSoggy;\nuniform vec2 uWind;\n' + (o.vpars || ''))
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + (o.vbegin || ''))
      .replace('#include <project_vertex>', `#include <project_vertex>
  { vec4 wp4 = vec4(transformed, 1.);
  #ifdef USE_INSTANCING
    wp4 = instanceMatrix * wp4;
  #endif
    vWPos = (modelMatrix * wp4).xyz; }`);
    let f = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\n' + G_NOISE + G_UNI + (o.fpars || ''));
    if (o.map) f = f.replace('#include <map_fragment>', '#include <map_fragment>\n' + o.map);
    if (o.rough) f = f.replace('#include <roughnessmap_fragment>', '#include <roughnessmap_fragment>\n' + o.rough);
    if (o.normal) f = f.replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\n' + o.normal);
    f = f.replace('#include <aomap_fragment>', (o.light === undefined ? G_LIGHT : o.light) + '\n#include <aomap_fragment>');
    if (o.emis) f = f.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n' + o.emis);
    sh.fragmentShader = f;
  };
  return mat;
}

// ===== scene.js =====
// scene.js - renderer, camera rig, lights, sky environment
const cv = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: TILE });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x9d978b);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.3, 200);

// camera rig: target on the ground, slight tilt from straight down
const CAM = { tx: -1.2, tz: 0.6, dist: 13, tilt: 0.40, yaw: 0, ttx: -1.2, ttz: 0.6, tdist: 13 };
function camLimits() {
  const vh = 2 * CAM.tdist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), vw = vh * camera.aspect;
  return { hx: Math.max(0, WX1 - 0.5 - vw * 0.55), z0: WZ0 + 1.2 + vh * 0.5, z1: WZ1 - 0.8 - vh * 0.42 };
}
function camMaxDist() { return Math.min(24, 0.92 * WW / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect * 1.02), 0.8 * WD / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)))); }
function camClamp() {
  CAM.tdist = clamp(CAM.tdist, 3.2, camMaxDist());
  const L = camLimits();
  CAM.ttx = clamp(CAM.ttx, -L.hx, L.hx);
  CAM.ttz = L.z0 > L.z1 ? (L.z0 + L.z1) / 2 : clamp(CAM.ttz, L.z0, L.z1);
}
function camDefault() {
  const a = camera.aspect, vfov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 2;
  // frame the whole scene: grass verge (top), every chalk stick, the kerb, gutter and storm drain (bottom)
  CAM.tdist = Math.max(15.5 / vfov, 15 / (vfov * a)); CAM.ttx = a < 1 ? -2.8 : 0.2; CAM.ttz = 0.2; camClamp();
  CAM.dist = CAM.tdist; CAM.tx = CAM.ttx; CAM.tz = CAM.ttz;
}
function camUpdate(dt) {
  CAM.dist = damp(CAM.dist, CAM.tdist, 9, dt); CAM.tx = damp(CAM.tx, CAM.ttx, 10, dt); CAM.tz = damp(CAM.tz, CAM.ttz, 10, dt);
  const t = CAM.tilt + (CAM.dist - 8) * 0.004;
  camera.position.set(CAM.tx, groundY(CAM.tz) + Math.cos(t) * CAM.dist, CAM.tz + Math.sin(t) * CAM.dist);
  camera.lookAt(CAM.tx, groundY(CAM.tz) * 0.3, CAM.tz);
}

// lights
const sun = new THREE.DirectionalLight(0xfff1dc, 1.7);
sun.castShadow = true;
sun.shadow.mapSize.set(IS_TOUCH ? 1024 : 2048, IS_TOUCH ? 1024 : 2048);
const sc = sun.shadow.camera; sc.left = -11; sc.right = 11; sc.top = 11; sc.bottom = -11; sc.near = 1; sc.far = 60;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const SUN_DIR = new THREE.Vector3(-0.55, 1, -0.42).normalize();
const hemi = new THREE.HemisphereLight(0xcfe0f5, 0x8a7a62, 0.55);
scene.add(hemi);
function lightsFollow() {
  sun.target.position.set(CAM.tx, 0, CAM.tz);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 30);
}

// sky environment for reflections (puddles, wet chalk): an equirect sky painted on a canvas, prefiltered once
function makeEnv() {
  const W = 512, H = 256, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#5f8fc9'); g.addColorStop(0.38, '#a9c4de'); g.addColorStop(0.5, '#cbd6dc'); g.addColorStop(0.52, '#58604f'); g.addColorStop(1, '#4a443b');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const rr = mulberry(77);
  for (let i = 0; i < 70; i++) { const cx = rr() * W, cy = H * (0.12 + rr() * 0.32), r = 6 + rr() * 26; const cg = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    cg.addColorStop(0, 'rgba(250,250,252,.55)'); cg.addColorStop(1, 'rgba(250,250,252,0)'); x.fillStyle = cg; x.beginPath(); x.ellipse(cx, cy, r * 2, r, 0, 0, 6.29); x.fill(); }
  for (let i = 0; i < W; i += 2) { const h = 6 + 14 * Math.abs(Math.sin(i * 0.05) * Math.sin(i * 0.013 + 1)) + rr() * 4; x.fillStyle = 'rgba(40,58,38,.85)'; x.fillRect(i, H * 0.5 - h, 2, h); }
  const su = Math.atan2(SUN_DIR.z, SUN_DIR.x), sx = (su / (2 * Math.PI) + 0.5) * W, sy = (0.5 - Math.asin(SUN_DIR.y) / Math.PI) * H;
  const sg = x.createRadialGradient(sx, sy, 0, sx, sy, 24); sg.addColorStop(0, 'rgba(255,252,240,1)'); sg.addColorStop(0.3, 'rgba(255,245,220,.7)'); sg.addColorStop(1, 'rgba(255,240,210,0)');
  x.fillStyle = sg; x.fillRect(sx - 30, sy - 30, 60, 60);
  const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(renderer);
  const rt = pm.fromEquirectangular(t);
  pm.dispose(); t.dispose();
  return rt.texture;
}
const ENV = makeEnv();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); camClamp();
});
camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();

// ===== groundgen.js =====
// groundgen.js - procedurally paints the pavement once on the GPU: rgb = linear albedo, a = surface height
const FS = { cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), scene: new THREE.Scene(), quad: null };
FS.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null); FS.quad.frustumCulled = false; FS.scene.add(FS.quad);
const FS_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }';
function runPass(mat, target) { FS.quad.material = mat; renderer.setRenderTarget(target); renderer.render(FS.scene, FS.cam); renderer.setRenderTarget(null); }
function makeRT(w, h, o = {}) {
  return new THREE.WebGLRenderTarget(w, h, Object.assign({ minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: THREE.UnsignedByteType, depthBuffer: false, stencilBuffer: false, generateMipmaps: false }, o));
}
const GEN_FRAG = G_NOISE + G_UNI + `
varying vec2 vUv;
float crack(vec2 q, float seed, float len){

  updateDust(dt); updateWindLeaf(dt); updateRain();
  audioUpdate(dt, PTR.speed, STATE.drawing);
  if (!STATE.drawing) PTR.speed *= Math.exp(-6 * dt);
  renderer.render(scene, camera);
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fpsAvg = lerp(fpsAvg, 1 / Math.max(dt, 1e-3), 0.05);
  try { frame(dt); } catch (e) { showErr(e.message); console.error(e); return; }
  requestAnimationFrame(loop);
}
try {
  initWorld(); wireUI(); updateRainBtn();
  frame(0.016);
  STATE.ready = true;
  setTimeout(() => document.getElementById('fade').classList.add('gone'), 150);
  requestAnimationFrame(t => { last = t; loop(t); });
} catch (e) { showErr(e.message); console.error(e); }
// read-only hooks for automated tests and the tile renderer
window.CH = { STICKS, STATE, WX, CAM, chalkAmount, toScreen, rainToggle, setPhase, chalkSeg, flushStamps, frame, camClamp, fps: () => fpsAvg };

</script>
