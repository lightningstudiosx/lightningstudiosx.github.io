/* style_os.css - THE LIGHT WEB "Dayglow Beige": Glowbox 98 by SunnySoft. Cream plastic, sunshine title bars,
mint desktop with god-rays, chunky bevels, a soft CRT glow over everything. */
:root {
--cream: #fff6df; --cream2: #f3e7c6; --beige: #e2d4ae; --beigeD: #a8976b; --ink: #2b2a3a; --ink2: #5e5a70;
--sun: #ffb43c; --sun2: #ffd86b; --sunD: #d97a12; --mint: #3fbfb0; --mintD: #1f8378; --sky: #8fd8ff; --rose: #ff6f91;
--good: #2e9b4f; --bad: #d43a3a; --hi: #fffefa; --lo: #8c7c58; --bev: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--lo);
--bevIn: inset 1px 1px 0 var(--lo), inset -1px -1px 0 var(--hi); --ui: Tahoma, Verdana, 'Segoe UI', sans-serif; --tbH: 40px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #171622; color: var(--ink); }
body { font-family: var(--ui); font-size: 13px; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; cursor: pointer; font-size: inherit; }
input, textarea, select { font-family: inherit; font-size: 13px; }
.hide { display: none !important; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; max-width: 100vw; }
#top { flex: 0 0 auto; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: #23212f; color: #ffe9b0; z-index: 50; border-bottom: 2px solid #000; }
#kai { color: #ffe9b0; text-decoration: none; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: rgba(255, 255, 255, .1); white-space: nowrap; }
#kai:hover { background: rgba(255, 255, 255, .22); }
#topT { font-weight: 900; letter-spacing: 2px; color: #fff3c4; text-shadow: 0 0 8px #ffb43c; white-space: nowrap; font-size: 12px; }
#topMid { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #b9b2d6; font-size: 12px; }
.tb { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2); border-radius: 6px; color: #fff; min-width: 32px; height: 26px; }
#crt { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #0c0b12; }
.screen { position: absolute; inset: 0; overflow: hidden; }
#scan { position: absolute; inset: 0; pointer-events: none; z-index: 900; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .06) 0 1px, transparent 1px 3px);
box-shadow: inset 0 0 90px rgba(0, 0, 0, .35), inset 0 0 14px rgba(0, 0, 0, .4); }
body.nocrt #scan { display: none; }
/* ---------- desktop ---------- */
#desk { background: var(--mint); }
#wall { position: absolute; inset: 0 0 var(--tbH) 0; background-size: cover; background-position: center; }
#icons { position: absolute; inset: 0 0 var(--tbH) 0; padding: 8px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 2px; }
.dIcon { width: 84px; height: 78px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px; border: 1px dotted transparent; background: none;
color: #fff; text-shadow: 1px 1px 0 #0a3d38, 0 0 6px #0a3d38; font-size: 12px; line-height: 1.1; text-align: center; border-radius: 4px; position: relative; }
.dIcon:hover, .dIcon:focus { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .6); outline: none; }
.dIcon img, .ico { width: 36px; height: 36px; image-rendering: pixelated; filter: drop-shadow(1px 2px 0 rgba(0, 0, 0, .35)); }
.dIcon .bdg { position: absolute; top: 0; right: 14px; background: var(--rose); color: #fff; border-radius: 9px; padding: 0 5px; font-weight: 700; font-size: 11px; text-shadow: none; }
#wins { position: absolute; inset: 0 0 var(--tbH) 0; pointer-events: none; }
/* ---------- windows ---------- */
.win { position: absolute; pointer-events: auto; display: flex; flex-direction: column; background: var(--cream); border: 2px solid var(--ink); border-radius: 7px 7px 4px 4px;
box-shadow: var(--bev), 4px 5px 0 rgba(10, 40, 40, .35); min-width: 220px; min-height: 120px; animation: winIn .16s ease-out; }
@keyframes winIn { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.win.min { display: none; }
.win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; border-radius: 0; }
.wt { flex: 0 0 auto; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 7px; cursor: grab; touch-action: none; user-select: none;
background: linear-gradient(180deg, #c9c2b0, #aea68f); color: #f7f2e2; border-bottom: 2px solid var(--ink); border-radius: 5px 5px 0 0; }
.win.front .wt { background: linear-gradient(180deg, var(--sun2), var(--sun) 60%, var(--sunD)); color: var(--ink); }

.wt b { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }

.wb:active { box-shadow: var(--bevIn); }
.wb.x { background: #ff9d8a; }
.wc { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; }
.wgrip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none;
background: linear-gradient(135deg, transparent 50%, var(--beigeD) 50% 60%, transparent 60% 70%, var(--beigeD) 70% 80%, transparent 80%); }
/* ---------- taskbar + start ---------- */
#taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: var(--tbH); display: flex; align-items: center; gap: 4px; padding: 3px 4px; z-index: 600;
background: linear-gradient(180deg, var(--cream), var(--beige)); border-top: 2px solid var(--hi); box-shadow: 0 -2px 0 var(--ink); }
#startBtn { height: 32px; display: flex; align-items: center; gap: 5px; padding: 0 10px 0 6px; border: 2px solid var(--ink); border-radius: 16px; font-weight: 900; font-size: 14px;
background: linear-gradient(180deg, #fff2a8, var(--sun)); box-shadow: var(--bev), 0 0 12px rgba(255, 180, 60, .7); flex: 0 0 auto; }
#startBtn.on { box-shadow: var(--bevIn); }
.sLamp { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #ffe066 40%, #ff9a1f 75%); box-shadow: 0 0 8px #ffd34d; }
#tasks { flex: 1 1 auto; min-width: 0; display: flex; gap: 3px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
#tasks::-webkit-scrollbar { display: none; }

background: var(--cream2); box-shadow: var(--bev); white-space: nowrap; overflow: hidden; font-size: 12px; text-align: left; }
.task.front { box-shadow: var(--bevIn); background: #fff9e8; font-weight: 700; }
.task img { width: 16px; height: 16px; image-rendering: pixelated; flex: 0 0 auto; }
.task span { overflow: hidden; text-overflow: ellipsis; }
#tray { flex: 0 0 auto; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px; box-shadow: var(--bevIn); border-radius: 4px; font-size: 12px; white-space: nowrap; }
#trKb { font-weight: 700; color: var(--mintD); cursor: pointer; }
#trVpn { cursor: pointer; }
#startMenu { position: absolute; left: 4px; bottom: calc(var(--tbH) + 2px); width: 260px; max-height: calc(100% - var(--tbH) - 10px); z-index: 700; display: flex;
background: var(--cream); border: 2px solid var(--ink); border-radius: 8px 8px 4px 4px; box-shadow: var(--bev), 5px 5px 0 rgba(0, 0, 0, .3); overflow: hidden; animation: winIn .12s; }
#startMenu .side { width: 34px; flex: 0 0 auto; background: linear-gradient(0deg, var(--sunD), var(--sun2)); writing-mode: vertical-rl; transform: rotate(180deg);
font-weight: 900; font-size: 17px; letter-spacing: 1px; color: #fff; text-shadow: 1px 1px 0 var(--ink); padding: 8px 0; text-align: right; }
#startMenu .list { flex: 1; overflow-y: auto; padding: 4px; }
.sItem { width: 100%; display: flex; align-items: center; gap: 8px; padding: 5px 6px; border: 0; background: none; text-align: left; border-radius: 4px; font-size: 13px; }
.sItem:hover { background: var(--sun2); }
.sItem img { width: 24px; height: 24px; image-rendering: pixelated; }
.sSep { height: 2px; margin: 4px 2px; background: var(--beige); box-shadow: 0 1px 0 var(--hi); }
.sRank { padding: 6px 8px; font-size: 12px; color: var(--ink2); border-bottom: 2px solid var(--beige); }
.sRank b { color: var(--ink); }
/* toasts + floats */
#toasts { position: fixed; right: 10px; bottom: 50px; z-index: 2000; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 20px); }
.toast { background: var(--cream); border: 2px solid var(--ink); border-radius: 8px; padding: 7px 11px; box-shadow: 3px 3px 0 rgba(0, 0, 0, .35); max-width: 330px; font-size: 13px;
animation: toastIn .25s ease-out; transition: opacity .4s, transform .4s; }
.toast.good { background: #dcf7e0; } .toast.bad { background: #ffe0dc; } .toast.gold { background: linear-gradient(90deg, #fff3b0, #ffd86b); font-weight: 700; }
.toast.out { opacity: 0; transform: translateX(30px); }
@keyframes toastIn { from { transform: translateX(40px); opacity: 0; } }
.floatTxt { position: fixed; z-index: 2100; pointer-events: none; font-weight: 900; font-size: 18px; text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff; animation: floatUp 1.4s ease-out forwards; }
@keyframes floatUp { to { transform: translateY(-60px); opacity: 0; } }
/* style_apps.css - Glowbox 98 app chrome: bevel buttons, Lightscape Navigator, MailSnail, Wallet, VPN, Sniffles, Scamdex */
.bb { border: 2px solid var(--ink); background: var(--cream2); border-radius: 6px; padding: 5px 12px; box-shadow: var(--bev), 2px 2px 0 rgba(0, 0, 0, .25); font-weight: 700; }
.bb:hover:not(:disabled) { background: #fff3cf; }
.bb:active:not(:disabled) { box-shadow: var(--bevIn); transform: translate(1px, 1px); }
.bb:disabled { opacity: .5; cursor: default; }
.bb.sun { background: linear-gradient(180deg, var(--sun2), var(--sun)); }

.tabsH button.on { background: var(--cream); font-weight: 700; }

.inspect span { display: inline-block; min-width: 22px; border-bottom: 2px solid var(--beige); margin: 0 1px; }
.inspect span.odd { background: #ffd3cc; border-color: var(--bad); }
/* ---------- dialogs (in-game windows, always closable) ---------- */

.flow { display: flex; flex-direction: column; align-items: stretch; gap: 0; margin: 8px 0; }

.big1 { font-size: 22px; font-weight: 900; }
/* style_web.css - the Light Web's gloriously terrible early-internet design kit. Pages live inside .page. */
.page { position: relative; min-height: 100%; padding: 12px; font-family: 'Times New Roman', Times, serif; font-size: 16px; color: #000; background: #fff; line-height: 1.3; overflow-wrap: anywhere; }
.page a, .page .lnk { color: #00e; text-decoration: underline; cursor: pointer; }
.page a:visited { color: #551a8b; }
.page h1 { font-size: 34px; margin: 6px 0; } .page h2 { font-size: 24px; margin: 10px 0 6px; } .page h3 { margin: 8px 0 4px; }
.page img, .page canvas { max-width: 100%; }
.page input, .page select, .page textarea { font-size: 15px; max-width: 100%; }
.page table { border-collapse: separate; max-width: 100%; }
.page button { font-family: inherit; }
.ctr { text-align: center; }
.comic { font-family: 'Comic Sans MS', 'Comic Sans', cursive; } .imp { font-family: Impact, 'Arial Black', sans-serif; letter-spacing: .5px; }
.mono { font-family: 'Courier New', monospace; } .arial { font-family: Arial, Helvetica, sans-serif; } .georgia { font-family: Georgia, serif; }
.mq { overflow: hidden; white-space: nowrap; position: relative; }
.mq > span { display: inline-block; padding-left: 100%; animation: mq 12s linear infinite; }
.mq.fast > span { animation-duration: 6s; } .mq.slow > span { animation-duration: 22s; }
.mq.alt > span { padding-left: 0; animation: mqAlt 4s ease-in-out infinite alternate; }
@keyframes mq { to { transform: translateX(-100%); } }
@keyframes mqAlt { from { transform: translateX(0); } to { transform: translateX(40%); } }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.rainbow { background: linear-gradient(90deg, #f00, #f80, #ff0, #0c0, #00f, #80f, #f00); -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 200% 100%; animation: rb 3s linear infinite; }
@keyframes rb { to { background-position: 200% 0; } }

<script>

// ===== util.js =====

LW.lerp = (a, b, t) => a + (b - a) * t;
LW.now = () => performance.now() / 1000;
LW.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

LW.rng = seed => {
let a = seed >>> 0;
const f = () => {
a = (a + 0x6D2B79F5) >>> 0; let t = a;
t = Math.imul(t ^ (t >>> 15), t | 1);
t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
f.int = n => Math.floor(f() * n);
f.pick = arr => arr[Math.floor(f() * arr.length)];
f.range = (lo, hi) => lo + f() * (hi - lo);
f.chance = p => f() < p;
f.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
return f;
};
LW.hash = str => {
let h = 2166136261 >>> 0;
for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
return h >>> 0;

LW.Dex = {};
LW.Dex.flowHtml = sc => {
const K = { hook: 'THE HOOK', bait: 'THE BAIT', ask: 'THE ASK', loss: 'THE LOSS' };
return '<div class="flow">' + sc.flow.map((f, i) => (i ? '<div class="fArrow">▼</div>' : '') + '<div class="fNode ' + f[0] + '"><div class="k">' + (i + 1) + '. ' + K[f[0]] + '</div>' + f[1] + '</div>').join('') +
'<div class="fArrow">✋</div><div class="fNode flag"><div class="k">WHERE TO STOP IT</div>' + (sc.hint || '') + '</div></div>';
};
LW.app('dex', { title: 'Scamdex', desk: 'Scamdex', icon: 'dex', w: 640, h: 500, single: true,
mount: (body, w, arg) => { w.data.sel = arg && arg.id; LW.Dex.render(w); },
again: (w, arg) => { if (arg && arg.id) w.data.sel = arg.id; LW.Dex.render(w); } });
LW.Dex.status = id => {
const st = LW.S.scam[id];
if (!st || (!st.fell && !st.spotted)) return st && st.seen ? 'seen' : 'unk';
return st.spotted && st.fell ? 'both' : st.spotted ? 'spotted' : 'fell';
};
LW.Dex.render = w => {
const c = LW.Scam.count(), sel = w.data.sel;
let h = '<div class="split' + (sel ? ' showR' : '') + '"><div class="l"><div class="pad" style="padding:8px"><b>Mapped ' + c.mapped + ' / ' + c.total + '</b>' +
'<div class="meter" style="margin:4px 0"><i style="width:' + (100 * c.mapped / c.total) + '%"></i></div><small class="muted">🟢 spotted ' + c.spotted + ' · 🔴 fell for ' + c.fell + '</small></div>';
for (const id of LW.SCAM_ORDER) {
const sc = LW.SCAMS[id], s = LW.Dex.status(id), known = s !== 'unk';
h += '<div class="listItem' + (id === sel ? ' sel' : '') + '" data-id="' + id + '"><span style="font-size:20px;' + (known ? '' : 'filter:grayscale(1) brightness(.3)') + '">' + sc.emoji + '</span><span class="grow">' +
(known ? LW.esc(sc.name) : '??? <small class="muted">' + sc.cat + '</small>') + '</span>' +
(s === 'spotted' ? '<span class="tag good">SPOTTED</span>' : s === 'fell' ? '<span class="tag bad">FELL</span>' : s === 'both' ? '<span class="tag sun">BOTH</span>' : s === 'seen' ? '<span class="tag">MET</span>' : '') + '</div>';
}
h += '</div><div class="r">' + (sel ? LW.Dex.detail(sel) : LW.Dex.intro()) + '</div></div>';
w.body.innerHTML = h;
w.body.onclick = e => {
const r = e.target.closest('.listItem'); if (r) { LW.A.click(); w.data.sel = r.dataset.id; LW.Dex.render(w); return; }
if (e.target.closest('.backBtn')) { w.data.sel = null; LW.Dex.render(w); }
};
};
LW.Dex.intro = () => '<div class="pad"><h2 style="margin:0 0 6px">📕 The Scamdex</h2><p>Every scam on the Light Web follows the same shape:</p>' +
'<div class="flow"><div class="fNode hook"><div class="k">THE HOOK</div>Something grabs your attention: a prize, a scare, a friendly stranger.</div><div class="fArrow">▼</div>' +
'<div class="fNode bait"><div class="k">THE BAIT</div>Something you want: money, socks, love, safety, free stuff.</div><div class="fArrow">▼</div>' +
'<div class="fNode ask"><div class="k">THE ASK</div>They need something first: a fee, your secret word, a download, a gift card.</div><div class="fArrow">▼</div>' +
'<div class="fNode loss"><div class="k">THE LOSS</div>You lose the money, the secret, or your desktop fills with ducks.</div></div>' +
'<p>Spot the <b>ASK</b> and you can stop almost any scam. Report scams with 🚩 to fill in the map. Fall for them and they get mapped too… the hard way.</p></div>';
LW.Dex.detail = id => {
const sc = LW.SCAMS[id], s = LW.Dex.status(id), st = LW.S.scam[id] || { flags: [] };
if (s === 'unk' || s === 'seen') return '<div class="pad"><button class="bb sm backBtn">◀ List</button><div class="big" style="font-size:60px;text-align:center;filter:grayscale(1) brightness(.3)">' + sc.emoji + '</div>' +

if (S.t % 30 === 0) LW.Ach.check();
};

p.querySelector('#popCall').onclick = () => { p.remove(); LW.Call.ring(true); }; LW.A.alarm(); }
else if (r < 0.24) { LW.Scam.seen('fakeupdate'); W.pop(page, 'Lightscape Update', '<p>⚠ <b>Your browser is out of date!</b> Update to keep browsing.</p><button class="wbtn" data-dl="fakeupdate">Update now</button>', { w: 260 }); }
}, 900 + Math.random() * 1200);
});

const gest = () => { LW.A.init(); LW.Set.apply(); };

addEventListener('keydown', e => {

});
setInterval(() => { try { LW.Ev.tick(); } catch (e) { LW.lastError = String(e && e.stack || e); console.error(e); } }, 1000);
requestAnimationFrame(LW.loop);
if (q.includes('desk')) LW.Desk.enter();
window.LIGHTWEB = true;
};
LW.loop = () => {
requestAnimationFrame(LW.loop);
try {
const t = LW.now();
if (LW.ui.screen === 'home') LW.Home.frame();
else if (LW.ui.screen === 'desk') LW.Wid.frame(t);
} catch (e) { LW.lastError = String(e && e.stack || e); console.error(e); }
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', LW.boot); else LW.boot();
