  #again{position:fixed;bottom:12px;right:14px;font:11px "Courier New",monospace;color:#1d1b18;text-decoration:none}

const ITER = 200000;
const KEY = "chush_progress";
const root = document.getElementById("root");
let gen = 0, leaveFns = [];
const norm = s => decodeURIComponent(s || "").toLowerCase().replace(/[^a-z]/g, "");
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {answers: [], t0: 0}; } catch (e) { return {answers: [], t0: 0}; } }
function save(p){ try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {} }
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(n, word){
  const blob = BLOBS[n - 1];
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(word), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(blob.s), iterations: ITER, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(blob.i)}, key, b64(blob.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function show(level){
  for (const f of leaveFns) try { f(); } catch (e) {}
  leaveFns = []; const my = ++gen;
  document.getElementById("lvl").textContent = "chush/" + level.title;
  root.innerHTML = level.html;
  if (level.js){
    const api = {alive: () => my === gen, onLeave: f => leaveFns.push(f), startedAt: () => load().t0};
    try { new Function("root", "api", level.js)(root, api); } catch (e) {}
  }
}
let nope = 0;
function no(){
  const lines = ["no.", "no.", "not that.", "that is not a door.", "no.", "you are guessing.", "chush does not guess."];
  const el = document.getElementById("no"); el.textContent = lines[nope++ % lines.length]; el.classList.add("on");
  clearTimeout(no.t); no.t = setTimeout(() => el.classList.remove("on"), 1600);
}
// rebuild where you are from the answers you've already found
async function restore(){
  const p = load();
  let level = FIRST, ok = [];
  for (let n = 1; n <= p.answers.length && n <= BLOBS.length; n++){
    try { level = await open(n, p.answers[n - 1]); ok.push(p.answers[n - 1]); } catch (e) { break; }
  }
  p.answers = ok; save(p);
  show(level);
  return p;
}
let busy = false;
async function tryHash(){
  const word = norm(location.hash.slice(1));
  if (!word || busy) return;
  const p = load(), n = p.answers.length + 1;
  if (n > BLOBS.length) return;
  busy = true;
  try {
    const level = await open(n, word);
    if (!p.t0) p.t0 = Date.now();
    p.answers.push(word); save(p);
    history.replaceState(null, "", location.pathname + location.search);
    show(level);
  } catch (e) { if (n > 1 || word !== "") no(); }
  busy = false;
}
document.getElementById("again").onclick = e => {
  e.preventDefault();
  if (document.getElementById("again").dataset.sure !== "1"){ document.getElementById("again").dataset.sure = "1"; document.getElementById("again").textContent = "forget everything? click again"; setTimeout(() => { const a = document.getElementById("again"); a.dataset.sure = ""; a.textContent = "forget"; }, 3000); return; }
  save({answers: [], t0: 0}); history.replaceState(null, "", location.pathname); show(FIRST);
};
addEventListener("hashchange", tryHash);
restore().then(tryHash);
