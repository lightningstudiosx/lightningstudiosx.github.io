<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boomsmith</title>
<meta name="description" content="Design every part of a custom gun: barrels with as many bores as you like, your own bullets, warped grips, holey stocks. It wires itself together; then take it to the range.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: a blueprint workshop. The 3D bench fills the screen; paper spec sheets sit on top:
   parts + the Part Forge on the left, stats and auto-wiring on the right, mode switch top right.
   The test range reuses the canvas with its own HUD. One blueprint look by choice. */
:root {
  --blue: #17406f;
  --blue2: #1f5590;
  --paper: #f4efe2;
  --paper2: #e9e1cd;
  --ink: #14233f;
  --muted: #5d6b80;
  --orange: #ff6b1a;
  --yellow: #ffd23f;
  --mint: #3fd0a8;
  --stencil: "Saira Stencil One", "Bahnschrift", sans-serif;
  --body: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0; background: var(--blue); color: var(--ink); font: 14px/1.4 var(--body); overflow: hidden }
[hidden] { display: none !important }
canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
.sheet { position: fixed; z-index: 5; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--ink) }

.home { position: fixed; z-index: 6; left: max(16px, env(safe-area-inset-left)); top: calc(env(safe-area-inset-top, 0px) + 14px); font: 600 12px var(--body); color: var(--ink); text-decoration: none; padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink) }
.brand { position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left)); top: calc(env(safe-area-inset-top, 0px) + 54px); pointer-events: none; color: #fff }
.brand h1 { margin: 0; font: 38px/1 var(--stencil); letter-spacing: 2px; text-shadow: 3px 3px 0 var(--ink) }
.brand h1 b { color: var(--yellow); font-weight: 400 }
.brand small { display: block; margin-top: 4px; font: 600 11px var(--mono); color: #b9d3f2; letter-spacing: .14em; text-transform: uppercase }

/* left: parts + forge */
.parts { left: max(16px, env(safe-area-inset-left)); top: calc(env(safe-area-inset-top, 0px) + 122px); bottom: 18px; width: 316px; display: flex; flex-direction: column; overflow: hidden }
.cats { display: flex; flex-wrap: wrap; gap: 5px; padding: 12px 12px 10px; border-bottom: 2px dashed var(--paper2) }
.cats button { border: 1.5px solid var(--ink); background: transparent; border-radius: 8px; padding: 3px 9px; font-size: 12px; font-weight: 600 }
.cats button.on { background: var(--ink); color: var(--paper) }
.opts { flex: 1; overflow-y: auto; padding: 10px 12px 16px; display: grid; gap: 8px; align-content: start }
.opts h3 { margin: 2px 0 0; font: 700 11px var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center }
.card { position: relative; text-align: left; border: 1.5px solid var(--ink); background: #fffaf0; border-radius: 10px; padding: 8px 11px; transition: transform .1s, box-shadow .1s }
.card:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink) }
.card.on { background: var(--yellow); box-shadow: 3px 3px 0 var(--ink) }
.card b { display: block; font-size: 14px }
.card span { display: block; color: var(--muted); font-size: 12px; margin-top: 1px }
.card.on span { color: #4a4220 }
.card i { display: block; font: 600 11px var(--mono); font-style: normal; margin-top: 4px; color: var(--muted) }
.card i em { font-style: normal } .card i .up { color: #0f8a55 } .card i .dn { color: #c4321b }
.card .tag { position: absolute; right: 8px; top: 8px; font: 700 9px var(--mono); letter-spacing: .1em; background: var(--orange); color: #fff; border-radius: 5px; padding: 2px 5px }
.card .edit { position: absolute; right: 8px; bottom: 7px; font: 700 11px var(--mono); border: 1.5px solid var(--ink); border-radius: 6px; padding: 1px 6px; background: var(--paper) }
.card.new { border-style: dashed; background: transparent; text-align: center; font-weight: 700; color: var(--orange); border-color: var(--orange) }
.card.new:hover { box-shadow: 3px 3px 0 var(--orange) }
.swatches { display: flex; flex-wrap: wrap; gap: 7px }
.swatches button { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--ink) }
.swatches button.on { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--orange) }
.finishes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }

/* forge */
.forge-head { display: flex; align-items: center; gap: 8px }
.forge-head b { font: 22px var(--stencil); letter-spacing: 1px; flex: 1 }
.forge-head .chip { font: 700 10px var(--mono); background: var(--orange); color: #fff; padding: 2px 6px; border-radius: 5px; letter-spacing: .1em }
.forge input[type=text] { width: 100%; border: 1.5px solid var(--ink); border-radius: 8px; padding: 6px 9px; background: #fffaf0; font-weight: 600 }
.fld { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--paper2) }
.fld label { font-size: 12.5px; font-weight: 600 }
.fld output { font: 600 12px var(--mono); color: var(--orange) }
.fld input[type=range] { grid-column: span 2; width: 100%; accent-color: var(--orange) }
.fld select { grid-column: span 2; border: 1.5px solid var(--ink); border-radius: 8px; padding: 4px 8px; background: #fffaf0 }
.fld .seg { grid-column: span 2; display: flex; flex-wrap: wrap; gap: 4px }
.fld .seg button { border: 1.5px solid var(--ink); background: #fffaf0; border-radius: 7px; padding: 2px 8px; font-size: 12px; font-weight: 600 }
.fld .seg button.on { background: var(--ink); color: var(--paper) }
.fld input[type=color] { width: 44px; height: 26px; border: 1.5px solid var(--ink); border-radius: 6px; padding: 0; background: none }
.forge .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px }
.btn { border: 2px solid var(--ink); background: var(--paper); border-radius: 10px; padding: 7px 12px; font-weight: 700; box-shadow: 3px 3px 0 var(--ink) }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink) }
.btn.hot { background: var(--orange); color: #fff }
.btn.warn { background: transparent; box-shadow: none; border-style: dashed; color: #c4321b; border-color: #c4321b; grid-column: span 2; padding: 5px }
.forge .preview { font: 600 11px var(--mono); color: var(--muted); background: #fffaf0; border: 1.5px dashed var(--ink); border-radius: 8px; padding: 6px 8px; line-height: 1.5 }

/* right: run + stats */
.run { right: max(16px, env(safe-area-inset-right)); top: calc(env(safe-area-inset-top, 0px) + 14px); padding: 6px; display: flex; gap: 6px }
.run button { border: 1.5px solid var(--ink); background: transparent; border-radius: 9px; padding: 6px 12px; font-weight: 700; font-size: 13px }
.run button.on { background: var(--ink); color: var(--paper) }
.run button.fire { background: var(--orange); color: #fff }
.side { right: max(16px, env(safe-area-inset-right)); top: calc(env(safe-area-inset-top, 0px) + 72px); width: 296px; padding: 14px; max-height: calc(100% - 92px); overflow-y: auto }
.namebar { display: flex; gap: 6px; margin-bottom: 10px }
.namebar input { flex: 1; min-width: 0; background: #fffaf0; border: 2px solid var(--ink); border-radius: 10px; font: 21px var(--stencil); letter-spacing: 1px; padding: 4px 10px }
.namebar button { border: 2px solid var(--ink); background: var(--yellow); border-radius: 10px; width: 42px; font-size: 18px }
.bar { display: grid; grid-template-columns: 74px 1fr 36px; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; font-weight: 600 }
.bar .track { position: relative; height: 10px; background: #fffaf0; border: 1.5px solid var(--ink); border-radius: 99px; overflow: hidden }
.bar .ghost, .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width .25s }
.bar .ghost { background: repeating-linear-gradient(45deg, #c9bfa6 0 4px, transparent 4px 8px) }
.bar .fill { background: var(--orange) }
.bar b { font: 700 12px var(--mono); text-align: right }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 }
.nums div { background: #fffaf0; border: 1.5px solid var(--ink); border-radius: 9px; padding: 5px 2px; text-align: center }
.nums b { display: block; font: 700 15px var(--mono) }
.nums span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600 }
.wires h3 { margin: 4px 0 6px; font: 700 11px var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase }
.wires ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px }
.wires li { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500 }
.wires li::before { content: ""; width: 12px; height: 4px; border-radius: 2px; background: var(--c); border: 1px solid var(--ink) }
.wires li em { margin-left: auto; font: 700 10px var(--mono); color: #0f8a55; font-style: normal }
.side .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px }
.side select { grid-column: span 2; background: #fffaf0; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; font-weight: 600 }

/* range */
.rangehud { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); padding: 10px 18px; display: flex; gap: 22px; align-items: center }
.rangehud .ammo { font: 34px/1 var(--stencil) }
.rangehud .ammo small { font: 700 14px var(--mono); color: var(--muted) }
.rangehud .meta { font: 600 12px var(--mono); color: var(--muted); line-height: 1.6 }
.rangehud .meta b { color: var(--ink) }
.reloadbar { height: 5px; border-radius: 9px; background: var(--paper2); overflow: hidden; margin-top: 6px }
.reloadbar i { display: block; height: 100%; width: 0; background: var(--orange) }
.score { left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 14px); padding: 7px 16px; font: 600 13px var(--mono); color: var(--muted); display: flex; gap: 18px }
.score b { color: var(--ink) }
.hint { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); font: 600 12px var(--body); color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: nowrap }
.cross { position: fixed; z-index: 7; width: 34px; height: 34px; margin: -17px 0 0 -17px; pointer-events: none }
.cross::before, .cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 3px #000 }
.cross::before { left: 16px; top: 0; width: 2px; height: 34px; clip-path: polygon(0 0,100% 0,100% 38%,0 38%,0 62%,100% 62%,100% 100%,0 100%) }
.cross::after { top: 16px; left: 0; height: 2px; width: 34px; clip-path: polygon(0 0,38% 0,38% 100%,0 100%,0 0,62% 0,100% 0,100% 100%,62% 100%) }
.cross.hit::before, .cross.hit::after { background: var(--yellow) }
.dmg { position: fixed; z-index: 6; pointer-events: none; font: 26px var(--stencil); color: #fff; text-shadow: 2px 2px 0 var(--ink); transform: translate(-50%, -50%) }
body.ranging { cursor: none }
body.ranging .parts, body.ranging .side, body.ranging .brand { display: none }
#toast { position: fixed; z-index: 9; left: 50%; top: 74px; transform: translate(-50%, -10px); opacity: 0; transition: .25s; background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); font-weight: 700; padding: 7px 14px; border-radius: 10px; pointer-events: none }
#toast.show { opacity: 1; transform: translate(-50%, 0) }

.mobile-tabs { display: none }
@media (max-width: 860px) {
  .brand { top: calc(env(safe-area-inset-top, 0px) + 66px) } .brand h1 { font-size: 26px } .brand small { display: none }
  .parts { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 44vh }
  .side { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 44vh }
  body:not(.show-stats) .side { display: none } body.show-stats .parts { display: none }
  .mobile-tabs { display: flex; position: fixed; z-index: 6; right: 8px; bottom: calc(44vh + 18px); gap: 6px }
  .mobile-tabs button { border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700 }
  body.ranging .mobile-tabs { display: none }
  .run { right: 8px } .run button { padding: 5px 8px; font-size: 12px }
  .hint { display: none }
  .rangehud { gap: 12px; padding: 8px 12px } .rangehud .ammo { font-size: 24px }
}
</style>
</head>
<body>

<canvas id="stage" tabindex="0" aria-label="3D gun builder. Pick or design parts on the left; drag to turn the gun."></canvas>
<a class="home" href="index.html">← kaifun</a>
<div class="brand"><h1>BOOM<b>SMITH</b></h1><small>part forge · self-wiring · test range</small></div>

<nav class="sheet parts" aria-label="Parts">
  <div class="cats" id="cats"></div>
  <div class="opts" id="opts"></div>
</nav>

<div class="sheet run" id="run">
  <button id="m-build" class="on">Bench</button>
  <button id="m-xray">X-ray</button>
  <button id="m-range" class="fire">Test range</button>
</div>

<aside class="sheet side" aria-label="Stats">
  <div class="namebar"><input id="gname" maxlength="24" aria-label="Gun name"><button id="rename" title="New name">🎲</button></div>
  <div id="bars"></div>
  <div class="nums" id="nums"></div>
  <div class="wires"><h3>Auto-wiring</h3><ul id="links"></ul></div>
  <div class="btns">
    <button class="btn" id="rand">Randomize</button>
    <button class="btn" id="reset">Reset</button>
    <select id="presets" aria-label="Presets"><option value="">Load a preset…</option></select>
  </div>
</aside>

<div class="mobile-tabs"><button id="t-parts">Parts</button><button id="t-stats">Stats</button></div>

<div class="sheet score" id="score" hidden><span>dropped <b id="s-drop">0</b></span><span>shots <b id="s-shots">0</b></span><span>hit <b id="s-acc">0%</b></span><span>best dps <b id="s-dps">0</b></span></div>
<div class="sheet rangehud" id="rangehud" hidden>
  <div><div class="ammo" id="ammo">20<small> / 20</small></div><div class="reloadbar"><i id="rbar"></i></div></div>
  <div class="meta" id="rmeta"></div>
  <button class="btn" id="m-bench">Back to bench</button>
</div>
<div class="hint" id="hint" hidden>aim with the mouse · hold click or Space to fire · right-click to aim down sights · R to reload</div>
<div class="cross" id="cross" hidden></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const C = h => new THREE.Color(h).convertSRGBToLinear();
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- built-in parts ----------

    { id: 'heavy', name: 'Heavy', note: 'Big frame, big hits, big kick.', L: 5.6, H: 1.6, W: 0.82, base: { dmg: 40, rpm: 430, acc: 60, recoil: 62, mob: 38, range: 64 } },

    { id: 'ap', name: 'Armor-piercing', note: 'Goes through up to 2 targets.', fx: 'pierce', p: { cal: 0.11, len: 0.62, tip: 'pointed', tipColor: '#e8f0ff', caseColor: 'steel' }, mod: { dmg: 4, pierce: 2 } },

  M.body.color.copy(C(build.paint)); M.body.roughness = f.rough; M.body.metalness = f.metal; M.body.clearcoat = f.id === 'gloss' ? 1 : 0.2;

// ---------- geometry helpers ----------
function rrect(w, h, r) {

}

function tube(r1, r2, len, mat, seg = 28, open = false, lenSeg = 1) {  // cylinder along +x starting at x = 0

const at = (o, x, y, z = 0) => { o.position.set(x, y, z); return o; };
const ring = (r, t, mat) => { const m = mesh(new THREE.TorusGeometry(r, t, 10, 32), mat); m.rotation.y = Math.PI / 2; return m; };

// a cartridge (or just its bullet) along +x, base at x = 0
function bulletTip(p) {

  else if (p.tip === 'hollow') pts.push([r, bl * 0.8], [r * 0.88, bl], [r * 0.5, bl], [r * 0.32, bl * 0.72], [0, bl * 0.7]);

// ---------- the gun ----------
const gunPivot = new THREE.Group(); scene.add(gunPivot);

function buildGun(changed) {

    else if (mz.style === 'prong') { MD.add(tube(rr, rr, 0.18, M.metal)); const n = Math.max(3, mz.ports || 4); for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const pr = box(mz.len, 0.08, 0.08, M.metal); pr.rotation.set(a, 0, 0); MD.add(at(pr, mz.len / 2, Math.cos(a) * re, Math.sin(a) * re)); } }

const tweens = [];

  }

  kick = Math.min(1.6, kick + S.recoil / 70); shake = Math.min(1, shake + S.recoil / 140); spin = 1;
  const quiet = item('muzzle', build.muzzle).quiet;
  flashT = 0.05; flashSprite.position.copy(muz); flashSprite.scale.setScalar(quiet ? 0.8 : 2.4 + S.dmg / 20 + Math.sqrt(S.bores)); flashSprite.material.color.copy(C(FXCOL[S.fx] || '#ffc070')); flashSprite.visible = true;
  flash.position.copy(muz); flash.color.copy(C(FXCOL[S.fx] || '#ffb060')); flash.intensity = quiet ? 1 : 5;
  if (!item('mag', build.mag).energy && S.fx !== 'plasma') {
    const cs = am.p ? cartridge({ ...am.p, len: am.p.len * 0.55, tip: 'flat', tipColor: '#000000' }).children[0].clone() : mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.42, 8), M.brass);
    const c = new THREE.Group(); c.add(cs); cs.scale.setScalar(1.8); c.position.copy(wpos(A.port)); scene.add(c);
    casings.push({ m: c, v: new THREE.Vector3(rnd(-2, 1), rnd(6, 9), rnd(6, 9)).applyQuaternion(gunPivot.quaternion), spin: new THREE.Vector3(rnd(5, 15), rnd(5, 15), rnd(5, 15)), life: 1.6 });

}
function damage(t, amount, point, color) {

  amount = Math.round(amount * (t.frozen > 0 ? 1.25 : 1)); if (amount <= 0) return;
  t.hp -= amount; t.flash = 0.12; dmgWindow.push([now, amount]); floatText(point, amount, color); blip('sine', 1700, 900, 0.08, 0.05);
  if (t.hp <= 0) { t.down = 3.2; stats.drop++; blip('triangle', 300, 80, 0.3, 0.15); puff(point, ['#f4efe2', '#ff6b1a'], 16, 10, 0.8, 0.7, { gravity: -14, normal: true }); }
}
function resetTarget(t) { t.hp = 100; t.down = 0; t.fall = 0; t.burn = 0; t.frozen = 0; t.g.rotation.z = 0; t.face.color.setRGB(1, 1, 1); }
function explode(p) { puff(p, ['#ffd27a', '#ff7a2a', '#ff3c2a'], 34, 22, 3, 0.6); puff(p, '#4a4038', 18, 6, 4, 1.4, { normal: true, grow: 3, gravity: 2 }); noise(700, 0.8, 0.5, 0.6); shake = Math.min(1.4, shake + 0.6); targets.forEach(t => { const d = Math.hypot(t.x - p.x, t.cy - p.y, t.z - p.z); if (d < 16) damage(t, S.dmg * 1.4 * (1 - d / 16), new THREE.Vector3(t.x, t.cy + 2, t.z), '#ffd23f'); }); }
const floats = [];
function floatText(p, n, color) { const el = document.createElement('div'); el.className = 'dmg'; el.textContent = n; el.style.color = color || '#fff'; document.body.appendChild(el); floats.push({ el, p: p.clone(), t: 0 }); }
function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i], p0 = b.p.clone();
    b.v.y -= S.drop * dt; b.p.addScaledVector(b.v, dt); b.life -= dt;
    b.m.position.copy(b.p); if (!b.m.isSprite) b.m.lookAt(b.p.clone().add(b.v));
    if (S.fx === 'boom') puff(b.p, '#9a9088', 1, 1, 1.2, 0.6, { normal: true, grow: 2 });
    if (S.fx === 'fire' && Math.random() < 0.5) puff(b.p, '#ff8a3a', 1, 1, 0.7, 0.3);
    if (S.fx === 'party') puff(b.p, ['#ff6fae', '#ffd23f', '#46e3d0', '#9b8cff'], 1, 2, 0.5, 0.5);

}

// ---------- input ----------
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointermove', e => {
  if (mode === 'range' && ads) { aimYaw -= e.movementX * 0.0022 / S.zoom; aimPitch = clamp(aimPitch - e.movementY * 0.0022 / S.zoom, -0.45, 0.6); return; }
  lastX = e.clientX; lastY = e.clientY; mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
});
canvas.addEventListener('pointerdown', e => {
  audio(); if (mode !== 'range') return;
  if (e.button === 2) { ads = true; return; }
  lastX = e.clientX; lastY = e.clientY; mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  pull();
});
addEventListener('pointerup', e => { if (e.button === 2) ads = false; else triggerDown = false; });
function pull() { triggerDown = true; if (build.mode === 'semi') semiQueued = true; if (build.mode === 'burst' && burstLeft === 0) burstLeft = 3; }
addEventListener('keydown', e => {
  if (mode !== 'range' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { if (!e.repeat) pull(); e.preventDefault(); }
  if (e.code === 'KeyR') startReload();
  if (e.code === 'Escape') setMode('bench');
});
addEventListener('keyup', e => { if (e.code === 'Space') triggerDown = false; });
function tryFire(dt) {
  cooldown -= dt;
  if (reloading > 0) {
    reloading -= dt; $('#rbar').style.width = (1 - reloading / S.reload) * 100 + '%';
    if (magGroup) magGroup.position.y = 0.05 - Math.sin(Math.PI * clamp(1 - reloading / S.reload, 0, 1)) * 2.2;
    if (reloading <= 0) { ammoIn = S.cap; $('#rbar').style.width = '0'; clack(); hudRange(); }
    return;
  }
  const wants = (build.mode === 'auto' && triggerDown) || semiQueued || burstLeft > 0;
  if (!wants || cooldown > 0) return;
  if (ammoIn <= 0) { semiQueued = false; burstLeft = 0; blip('square', 300, 200, 0.03, 0.05); startReload(); return; }
  fire(); cooldown = 60 / S.rpm; semiQueued = false; if (burstLeft > 0) burstLeft--;
}

// ---------- frame loop ----------
let last = performance.now();
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); if (mode === 'bench') frameGun(); }); resize();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now = t / 1000;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur), e = 1 - Math.pow(1 - k, 3);
    if (tw.scale) tw.g.scale.setScalar(0.85 + 0.15 * e); else tw.g.position.copy(tw.from).multiplyScalar(1 - e);
    if (k >= 1) { tweens.splice(i, 1); clack(); }
  }
  wireFlash = Math.max(0, wireFlash - dt);
  const wireVis = xray ? 1 : mode === 'bench' ? Math.min(1, wireFlash) : 0;
  links.forEach((l, i) => {
    l.prog = Math.min(1, l.prog + (wireFlash < 1.6 - l.delay ? dt * 1.8 : 0));
    l.mesh.geometry.setDrawRange(0, Math.floor(l.count * l.prog / 3) * 3);
    l.mesh.material.opacity = wireVis * 0.95;
    l.dot.position.copy(l.curve.getPoint(l.prog < 1 ? l.prog : (now * 0.5 + i * 0.27) % 1));
    l.pulse = Math.max(0, l.pulse - dt * 3); l.dot.material.opacity = wireVis; l.dot.scale.setScalar(1 + l.pulse * 1.5);
  });
  if (rotor) { spin = Math.max(0, spin - dt * 0.8); rotor.rotation.x += dt * (0.4 + spin * 30); }
  // showcase bullet floats over the gun while you're on ammo
  const showAmmo = mode === 'bench' && (curCat === 'ammo' || !!(draft && draft.cat === 'ammo'));
  showcase.visible = showAmmo;
  if (showAmmo) { const sz = gun.userData.size || new THREE.Vector3(10, 4, 1); showcase.position.set(0, sz.y / 2 + 2.6 + Math.sin(now * 2) * 0.15, 0); showcase.rotation.y = now * 0.8; }

  if (mode === 'range') {
    let hit;
    if (!ads) {
      ray.setFromCamera(mouse, camera); hit = ray.intersectObjects(aimables, false)[0];
      aimPoint.copy(hit ? hit.point : ray.ray.at(170, new THREE.Vector3()));
      const d = aimPoint.clone().sub(gunPivot.position); aimYaw = Math.atan2(-d.z, d.x); aimPitch = Math.atan2(d.y, Math.hypot(d.x, d.z));
    } else {
      const dir = new THREE.Vector3(Math.cos(aimPitch) * Math.cos(aimYaw), Math.sin(aimPitch), -Math.cos(aimPitch) * Math.sin(aimYaw));
      ray.set(gunPivot.position, dir); hit = ray.intersectObjects(aimables, false)[0];
      aimPoint.copy(hit ? hit.point : gunPivot.position.clone().addScaledVector(dir, 170));
    }
    gunPivot.rotation.order = 'YZX';
    gunPivot.rotation.y += (aimYaw - gunPivot.rotation.y) * Math.min(1, dt * (ads ? 30 : 14));
    gunPivot.rotation.z += (aimPitch - (A.muzzleAng || 0) - gunPivot.rotation.z) * Math.min(1, dt * (ads ? 30 : 14));
    tryFire(dt);
    kick = Math.max(0, kick - dt * (2 + (100 - S.recoil) / 25)); shake = Math.max(0, shake - dt * 3);
    recoilG.position.set(-kick * 0.6, 0, 0); recoilG.rotation.z = kick * 0.12;
    const fwd = new THREE.Vector3(1, 0, 0).applyQuaternion(gunPivot.quaternion);
    const eye = A.eye ? recoilG.localToWorld(A.eye.clone()) : gunPivot.position.clone();
    const adsPos = eye.clone().addScaledVector(fwd, -2.6).add(new THREE.Vector3(0, 0.12, 0));
    camera.position.lerp(ads ? adsPos : HIP, Math.min(1, dt * 10));
    camera.position.add(new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).multiplyScalar(shake * 0.12));
    const tf = ads ? 50 / S.zoom : 50; camera.fov += (tf - camera.fov) * Math.min(1, dt * 10); camera.updateProjectionMatrix();
    lookT.lerp(ads ? eye.clone().addScaledVector(fwd, 100) : HIPLOOK, Math.min(1, dt * 12)); camera.lookAt(lookT);
    const cr = $('#cross'); cr.style.left = (ads ? innerWidth / 2 : lastX) + 'px'; cr.style.top = (ads ? innerHeight / 2 : lastY) + 'px';
    cr.style.opacity = ads && build.sight !== 'iron' ? 0 : 1;

    updateBullets(dt);
    targets.forEach(tg => {
      if (tg.burn > 0 && !tg.down) { tg.burn -= dt; if (Math.random() < dt * 10) damage(tg, 3, new THREE.Vector3(tg.x, tg.cy + rnd(-2, 2), tg.z + rnd(-2, 2)), '#ff8a3a'); puff(new THREE.Vector3(tg.x - 0.4, tg.cy + rnd(-2.5, 2.5), tg.z + rnd(-2.5, 2.5)), ['#ff8a3a', '#ffd27a'], 1, 3, 1.2, 0.5, { dir: new THREE.Vector3(0, 4, 0) }); }

      if (tg.frozen > 0) tg.face.color.setRGB(0.6, 0.9, 1.2); else tg.face.color.setRGB(1 + tg.flash * 6, 1 + tg.flash * 6, 1 + tg.flash * 6);
      if (tg.down > 0) { tg.down -= dt; tg.fall = Math.min(1, tg.fall + dt * 4); if (tg.down <= 0) resetTarget(tg); } else tg.fall = Math.max(0, tg.fall - dt * 3);

    });
    if (A.laser) { if (!laserBeam) { laserBeam = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1, 6), new THREE.MeshBasicMaterial({ color: C('#ff2a3a'), transparent: true, opacity: 0.7 })); scene.add(laserBeam); } const a = recoilG.localToWorld(A.laser.clone()), len = a.distanceTo(aimPoint); laserBeam.position.copy(a).lerp(aimPoint, 0.5); laserBeam.scale.set(1, len, 1); laserBeam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), aimPoint.clone().sub(a).normalize()); laserBeam.visible = true; }
    const dps = dmgWindow.filter(([tt]) => now - tt < 1).reduce((s, [, a]) => s + a, 0); while (dmgWindow.length && now - dmgWindow[0][0] > 1) dmgWindow.shift();
    if (dps > stats.best) { stats.best = dps; $('#s-dps').textContent = Math.round(dps); }
  } else {

  for (let i = casings.length - 1; i >= 0; i--) { const c = casings[i]; c.v.y -= 30 * dt; c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += c.spin.x * dt; c.m.rotation.y += c.spin.y * dt; c.life -= dt; if (c.m.position.y < GROUND + 0.1) { c.m.position.y = GROUND + 0.1; c.v.multiplyScalar(0.3); c.v.y = Math.abs(c.v.y); } if (c.life <= 0) { scene.remove(c.m); casings.splice(i, 1); } }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

renderCats(); renderOpts(); buildGun(); renderStats(); frameGun();
requestAnimationFrame(frame);
</script>
