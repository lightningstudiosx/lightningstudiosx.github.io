}

<script>
"use strict";
// ===== util.js =====
{
const ADV = window.ADV = { V: 1, t: 0, dt: 0.016, ready: false, events: {}, assets: {} };
ADV.$ = (id) => document.getElementById(id);
ADV.Q = new URLSearchParams(location.search);
ADV.TEST = ADV.Q.has('test');
ADV.TILE = ADV.Q.has('tile');
ADV.P = 800; // the plain repeats every 800 m in x and z: walk long enough and you pass the same television again
ADV.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
ADV.lerp = (a, b, t) => a + (b - a) * t;
ADV.smooth = (a, b, v) => { const t = ADV.clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
ADV.ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
ADV.wrap = (v) => v - ADV.P * Math.round(v / ADV.P); // nearest periodic image offset
ADV.isPhone = () => Math.min(screen.width, screen.height) < 600 || (matchMedia('(pointer: coarse)').matches && Math.min(innerWidth, innerHeight) < 600);
ADV.reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
ADV.rng = (seed) => { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e6) / 1e6; }; };
ADV.hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
ADV.on = (n, f) => (ADV.events[n] = ADV.events[n] || []).push(f);
ADV.emit = (n, a) => (ADV.events[n] || []).forEach((f) => { try { f(a); } catch (e) { console.warn(e); } });
ADV.store = {
get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
del(k) { try { localStorage.removeItem(k); } catch (e) { /* private mode */ } },
};
ADV.v3 = () => new THREE.Vector3();
ADV.tmp = { a: new THREE.Vector3(), b: new THREE.Vector3(), c: new THREE.Vector3(), m: new THREE.Matrix4(), q: new THREE.Quaternion() };
ADV.canvasTex = (w, h, draw, srgb = true) => {
const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; t.userData = { canvas: c, g }; return t;
};
ADV.shadows = (o, cast = true, recv = true) => { o.traverse((c) => { if (c.isMesh) { c.castShadow = cast; c.receiveShadow = recv; } }); return o; };
}
// ===== terrain_fn.js =====
{
const TF = ADV.TF = {};
const K = 2 * Math.PI / ADV.P;
TF.waves = [[1, 2, 1.7, 0.3], [3, -1, 1.15, 1.9], [2, 3, 0.9, 4.1], [5, 4, 0.5, 2.2], [-7, 5, 0.34, 0.7],
[9, 2, 0.24, 5.3], [4, -11, 0.17, 3.3], [13, 9, 0.1, 1.1], [-17, 12, 0.07, 2.6], [23, -19, 0.04, 0.4]];
TF.hills = [[1, 0, 38, 0.2], [0, 1, 30, 2.4], [1, 1, 26, 4.0], [2, -1, 22, 1.3], [3, 2, 14, 5.1], [-4, 3, 10, 0.9], [5, -6, 6, 3.7]];
TF.pads = []; // {x, z, r, fall, h}
TF.base = (x, z) => {
let h = 0;
for (const w of TF.waves) h += w[2] * Math.sin(K * (w[0] * x + w[1] * z) + w[3]);
return h;
};
TF.hillsAt = (x, z, cx, cz) => {
const d = Math.hypot(x - cx, z - cz); if (d < 260) return 0;
let h = 0;
for (const w of TF.hills) { const s = Math.sin(K * (w[0] * x + w[1] * z) + w[3]); h += w[2] * s * s; }
return h * ADV.smooth(260, 1500, d);
};
TF.h = (x, z) => {
let h = TF.base(x, z);
for (const p of TF.pads) {
const dx = ADV.wrap(x - p.x), dz = ADV.wrap(z - p.z), d = Math.hypot(dx, dz);
if (d < p.r + p.fall) h = ADV.lerp(h, p.h, 1 - ADV.smooth(p.r, p.r + p.fall, d));
}
return h;
};
TF.normal = (x, z, out) => {
const e = 0.35, hx = TF.h(x + e, z) - TF.h(x - e, z), hz = TF.h(x, z + e) - TF.h(x, z - e);
return (out || new THREE.Vector3()).set(-hx, 2 * e, -hz).normalize();
};
TF.setPads = (list) => {
TF.pads = list.map((p) => ({ x: p.x, z: p.z, r: p.r, fall: p.fall || 6, h: p.h != null ? p.h : TF.base(p.x, p.z) }));
ADV.emit('pads');
};
TF.MAXPAD = 10;
TF.glsl = () => {
const f = (v) => (Number.isInteger(v) ? v.toFixed(1) : String(v));
const terms = TF.waves.map((w) => `h += ${f(w[2])} * sin(${f(K)} * (${f(w[0])} * p.x + ${f(w[1])} * p.y) + ${f(w[3])});`).join('\n');
return `
uniform vec4 uPad[${TF.MAXPAD}]; uniform float uPadH[${TF.MAXPAD}];
float wrapP(float v) { return v - ${f(ADV.P)} * floor(v / ${f(ADV.P)} + 0.5); }
float terrainH(vec2 p) {
float h = 0.0;
${terms}
for (int i = 0; i < ${TF.MAXPAD}; i++) {
vec4 q = uPad[i]; if (q.z <= 0.0) continue;
float d = length(vec2(wrapP(p.x - q.x), wrapP(p.y - q.y)));
h = mix(h, uPadH[i], 1.0 - smoothstep(q.z, q.z + q.w, d));
}
return h;
}`;
};
TF.uniforms = () => ({ uPad: { value: Array.from({ length: TF.MAXPAD }, () => new THREE.Vector4(0, 0, -1, 1)) }, uPadH: { value: new Array(TF.MAXPAD).fill(0) } });
TF.sync = (u) => {
for (let i = 0; i < TF.MAXPAD; i++) {
const p = TF.pads[i];
if (p) { u.uPad.value[i].set(p.x, p.z, p.r, p.fall); u.uPadH.value[i] = p.h; } else u.uPad.value[i].set(0, 0, -1, 1);
}
};
TF.ray = (o, d, maxD = 900) => {
if (d.y > 0.2) return null;
let t = 0.5, prev = o.y - TF.h(o.x, o.z), step = 0.6;
for (let i = 0; i < 400 && t < maxD; i++) {
const x = o.x + d.x * t, y = o.y + d.y * t, z = o.z + d.z * t, g = y - TF.h(x, z);
if (g < 0) { // refine

};
T.look = (v) => { const P = ADV.Player, e = P.pos.y + P.eyeNow; P.yaw = Math.atan2(-(v.x - P.pos.x), -(v.z - P.pos.z)); P.pitch = Math.atan2(v.y - e, Math.hypot(v.x - P.pos.x, v.z - P.pos.z)); P.yawTo = P.pitchTo = null; };
T.aim = (name) => {
const v = T.target(name); if (!v) return null;
T.look(v); ADV.frame(0.016); const c = ADV.R.cam; c.updateMatrixWorld();
const p = v.clone().project(c); if (p.z > 1) return null;
const x = (p.x + 1) / 2 * innerWidth, y = (1 - p.y) / 2 * innerHeight;
const h = ADV.Input.pick(x, y);
return { x, y, kind: h.kind, name: h.inter ? h.inter.name : h.rec ? 'item:' + h.rec.it : null };
};
T.tp = (x, z, yaw = 0) => { const P = ADV.Player; P.stop(); P.elev = null; P.pos.set(x, ADV.TF.h(x, z), z); P.yaw = yaw; P.pitch = -0.05; ADV.frame(0.016); };
T.zone = (z) => { ADV.S.unlock(z); ADV.World.setZone(z); ADV.frame(0.016); };
T.give = (it) => { ADV.S.give(it); };
T.text = () => {
const out = [], w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
while (w.nextNode()) {
const n = w.currentNode, s = n.textContent.trim(); if (!s) continue;
const el = n.parentElement; if (!el || /^(SCRIPT|STYLE|NOSCRIPT)$/.test(el.tagName)) continue;
const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
if (r.width > 0 && r.height > 0 && cs.visibility !== 'hidden' && cs.display !== 'none' && +cs.opacity > 0) out.push(s.slice(0, 40));
}
return out;
};
T.perf = () => { const a = T.ft.slice(-240).sort((x, y) => x - y); return a.length ? { n: a.length, med: a[a.length >> 1], p95: a[Math.floor(a.length * 0.95)], mean: a.reduce((s, x) => s + x, 0) / a.length } : null; };
T.house = () => {
const H = ADV.House; let pink = 0;
H.root.traverse((o) => { if (o.isMesh && o.material && o.material.color) { const c = o.material.color; if (c.r > 0.85 && c.b > 0.45 && c.g < c.r - 0.08) pink++; } });
const sky = H.ceiling.material.map, g = sky.userData.g, px = g.getImageData(0, 0, sky.userData.canvas.width, sky.userData.canvas.height).data;
let blue = 0, white = 0; for (let i = 0; i < px.length; i += 400) { if (px[i + 2] > 200 && px[i] < 180) blue++; if (px[i] > 240 && px[i + 1] > 240 && px[i + 2] > 240) white++; }
const sp = H.signTex.userData.g.getImageData(0, 0, 512, 256).data; let ink = 0; for (let i = 3; i < sp.length; i += 4) if (sp[i] > 128) ink++;
return { active: H.active, pink, grass: H.grass.visible && H.grass.geometry.instanceCount > 0 && H.grass.material.uniforms.uFlat.value === H.Y, skyCanvas: !!sky.isCanvasTexture, blue, white,
signInk: ink, font: H.fontName, eyes: H.eyes.length, plainHidden: !ADV.Terrain.mesh.visible && !ADV.Sky.mesh.visible };
};
T.eyes = () => {
const cam = ADV.R.cam.position, out = []; let sum = 0;
for (const e of ADV.House.eyes) {
const p = e.ball.getWorldPosition(new THREE.Vector3()), f = new THREE.Vector3(0, 0, 1).applyQuaternion(e.ball.getWorldQuaternion(new THREE.Quaternion()));
const to = cam.clone().sub(p).normalize(); sum += Math.acos(ADV.clamp(f.dot(to), -1, 1)); out.push([f.x, f.y, f.z]);
}
return { mean: sum / out.length, gaze: out };
};
T.wait = (ms) => new Promise((r) => setTimeout(r, ms));
}
// ===== main.js =====
{
ADV.Puzzle.repair = () => {
const S = ADV.S;
if (S.flag('used_key')) S.unlock(1);
if (S.flag('used_marble')) S.unlock(2);
if (S.flag('used_floppy')) { if (!S.flag('booted')) S.set('booted'); S.unlock(3); }
if (S.flag('ending')) { S.nextLoop(); }
S.d.inv = S.d.inv.filter((it) => S.ITEMS.indexOf(it) >= 0 && !S.flag('used_' + it));
if (S.d.unlocked.indexOf(S.d.zone) < 0) S.d.zone = 0;
S.d.sel = null;
};
ADV.boot = async () => {
const S = ADV.S, R = ADV.R;
S.init();
if (!R.init()) { document.body.classList.add('nogl'); return; }
ADV.on('progress', (f) => ADV.UI.progress(f));
ADV.M.init(); ADV.Post.init(); ADV.Sky.init();
await ADV.L.all();
ADV.E.prepare();
ADV.Terrain.init(); ADV.Grass.build(); ADV.Flowers.build();
ADV.Items.build(); ADV.World.build(); ADV.Guide.init(); ADV.House.build();
ADV.Puzzle.repair(); ADV.Player.init();
ADV.World.setZone(S.d.zone);
ADV.Input.init(); ADV.UI.init(); ADV.Level2.init();
const place = S.d.place;
if (place === 'house' || place === 'level2') await ADV.House.enter(true);
if (place === 'level2') ADV.Level2.show();
ADV.loaded = true;
requestAnimationFrame(ADV.loop);
try { R.renderer.compile(R.scene, R.cam); } catch (e) { /* fine */ }
ADV.UI.ready();
await ADV.UI.begin();
ADV.ready = true; window.ADVENTURE = true; ADV.emit('begin');
};
let last = 0, saveT = 0;
ADV.loop = (now) => {
requestAnimationFrame(ADV.loop);
const raw = last ? (now - last) / 1000 : 0.016; last = now;
const dt = Math.min(0.05, Math.max(0.001, raw)); ADV.dt = dt; ADV.t += dt;
try { ADV.frame(dt); } catch (e) { if (!ADV._err) { ADV._err = true; console.error(e); } }
ADV.R.watch(raw * 1000);
};
ADV.frame = (dt) => {
const P = ADV.Player, cam = ADV.R.cam;
if (ADV.paused) { ADV.Audio.update(dt, cam.position, P.yaw, P.pitch); ADV.Level2.update(dt); return; }
P.update(dt);
const cp = cam.position;
if (ADV.House.active) ADV.House.update(dt, cp);
else {
ADV.World.update(dt, cp); ADV.Items.update(dt, cp);
ADV.Terrain.update(cp); ADV.Grass.update(cp); ADV.Flowers.update(cp);
ADV.Sky.update(dt, cp); ADV.Guide.update(dt, cp);
}
ADV.Marker.update(dt); ADV.Puzzle.update();
if (ADV.UI.glowFn) ADV.UI.glowFn();
ADV.Audio.update(dt, cp, P.yaw, P.pitch);
ADV.Input.update();
ADV.R.render();
saveT += dt; if (saveT > 4 && ADV.ready) { saveT = 0; ADV.S.save(); }
};
addEventListener('pagehide', () => { if (ADV.ready) ADV.S.save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && ADV.ready) ADV.S.save(); });
if (window.THREE) ADV.boot(); else addEventListener('load', () => (window.THREE ? ADV.boot() : document.body.classList.add('nogl')));
}
