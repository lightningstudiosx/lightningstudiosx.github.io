<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ultimate Pool · Kai.fun</title>
<meta name="description" content="Pool, but ultimate: up to 50 balls, bombs, ghosts, magnets and teleporters, negative numbers, four deadly black balls, moving and portal pockets, a two-level table, jump and massé shots, a play-money casino, and golf, soccer, bowling, basketball, curling and hockey pool.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Art direction: "The Rack Room, 3 a.m." - a smoky neon pool hall. Mahogany and brass, deep felt, pink and cyan tubes buzzing through the haze. */
:root{--bg:#07060a;--ink:#f6ecd9;--dim:#ab9f8c;--pink:#ff3d8b;--cy:#3ff1ff;--amb:#ffb347;--brass:#dcb45c;--red:#ff5252;--grn:#5dff9b;
--glass:rgba(18,11,14,.86);--glass2:rgba(34,20,26,.95);--line:rgba(255,179,71,.2);--line2:rgba(255,179,71,.5);
--f:"Barlow Semi Condensed","Segoe UI",system-ui,sans-serif;--d:"Bungee","Impact",system-ui,sans-serif;--n:"Monoton","Bungee",system-ui;
--glow:0 0 0 1px var(--line),0 8px 26px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;font-weight:600;font-size:16px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;font-weight:700;-webkit-tap-highlight-color:transparent}
#kai{position:fixed;left:10px;top:10px;z-index:40;font-weight:800;font-size:14px;color:var(--ink);text-decoration:none;background:var(--glass);padding:8px 13px 8px 11px;border-radius:999px;box-shadow:var(--glow);line-height:1;letter-spacing:.02em}
#kai:hover{color:var(--amb)}
.btn{appearance:none;border:0;border-radius:14px;background:var(--glass2);font-size:17px;padding:10px 18px;min-height:46px;cursor:pointer;box-shadow:0 0 0 1px var(--line2),0 4px 16px rgba(0,0,0,.45);transition:transform .12s,box-shadow .2s,background .2s,color .2s;line-height:1.1;letter-spacing:.03em}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--amb),0 0 18px rgba(255,179,71,.35)}
.btn:active{transform:translateY(1px)}
.btn.prim{background:linear-gradient(135deg,#ff3d8b,#c2185b 55%,#7b1fa2);color:#fff;box-shadow:0 0 0 1px rgba(255,200,230,.5),0 0 26px rgba(255,61,139,.45);text-shadow:0 1px 2px rgba(60,0,30,.6)}
.btn.cy{background:linear-gradient(135deg,#0fb8c9,#126d8a);color:#fff;box-shadow:0 0 0 1px rgba(160,250,255,.5),0 0 22px rgba(63,241,255,.35)}
.btn.gold{background:linear-gradient(135deg,#ffd36b,#c98a1b);color:#2a1600;box-shadow:0 0 0 1px rgba(255,230,160,.7),0 0 22px rgba(255,179,71,.4)}
.btn.sm{font-size:14px;min-height:36px;padding:6px 12px;border-radius:11px}
.btn:disabled{opacity:.38;cursor:default;transform:none}
.btn.on{box-shadow:0 0 0 2px var(--cy),0 0 16px rgba(63,241,255,.45);color:var(--cy)}
/* title */
#titleUI{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;pointer-events:none;padding:0 12px 18px}
.tsub{font-family:var(--d);font-size:15px;color:var(--cy);letter-spacing:.2em;text-align:center;text-shadow:0 0 8px rgba(63,241,255,.8),0 0 22px rgba(63,241,255,.4);margin-bottom:12px}
.tmenu{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;pointer-events:auto;width:min(760px,94vw)}
.tmenu .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tmenu .btn small{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.02em}
.tmenu .btn.prim small,.tmenu .btn.cy small{color:rgba(255,255,255,.8)}
.tmenu .btn.gold small{color:rgba(42,22,0,.8)}
.tmenu .wide{grid-column:span 2}
.tfoot{font-size:13px;color:var(--dim);opacity:.85;text-shadow:0 0 8px #000;text-align:center;margin-top:10px;pointer-events:none}
/* top right */
#topR{position:fixed;top:8px;right:8px;z-index:41;display:flex;gap:6px;align-items:center}
.ib{appearance:none;border:0;background:var(--glass);min-width:42px;height:42px;border-radius:13px;box-shadow:var(--glow);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;font-size:15px;transition:transform .12s,color .2s}
.ib:hover{color:var(--amb)}.ib:active{transform:translateY(1px)}
.ib svg{width:21px;height:21px;flex:none}
.ib.off .wave{display:none}.ib .mute{display:none}.ib.off .mute{display:block}
#chipPill{font-family:var(--d);font-size:14px;color:var(--amb);cursor:pointer;white-space:nowrap}
.chip{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#ffcf6b 0 30%,#b3261e 31% 62%,#fff 63% 70%,#b3261e 71%);box-shadow:0 0 0 1px #000 inset;vertical-align:-2px;margin-right:4px}
/* HUD */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none}
#hud > *{pointer-events:auto}
#topbar{position:fixed;top:6px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:6px;max-width:calc(100vw - 260px)}
.pc{min-width:150px;background:var(--glass);border-radius:14px;box-shadow:var(--glow);padding:5px 12px;display:flex;flex-direction:column;justify-content:center;transition:box-shadow .25s;position:relative}
.pc.turn{box-shadow:0 0 0 2px var(--pink),0 0 20px rgba(255,61,139,.45)}
.pc .nm{font-family:var(--d);font-size:13px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.pc .sc{font-size:22px;font-weight:800;line-height:1}
.pc .gp{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;max-width:190px;display:flex;gap:2px;align-items:center;min-height:14px}
.pc .gp i{display:inline-block;width:11px;height:11px;border-radius:50%;box-shadow:inset -2px -2px 3px rgba(0,0,0,.45)}
.pc .tk{position:absolute;right:6px;top:4px;font-size:12px;color:var(--cy)}
#mid{background:var(--glass);border-radius:14px;box-shadow:var(--glow);padding:4px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:110px;text-align:center}
#mid .a{font-family:var(--d);font-size:12px;color:var(--amb);letter-spacing:.06em;white-space:nowrap}
#mid .b{font-size:13px;color:var(--dim);white-space:nowrap}
#mods{position:fixed;left:8px;top:58px;display:flex;flex-direction:column;gap:5px;max-width:200px}
.card{background:linear-gradient(160deg,#2c1630,#160b17);border-radius:10px;padding:5px 9px;font-size:12.5px;box-shadow:0 0 0 1px rgba(255,61,139,.45),0 0 12px rgba(255,61,139,.2);line-height:1.15;cursor:help}
.card b{display:block;font-family:var(--d);font-size:11px;color:var(--pink);letter-spacing:.05em}
#ctl{position:fixed;left:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:132px}
#spinBox{position:relative;width:96px;height:96px;border-radius:50%;cursor:crosshair;touch-action:none;box-shadow:0 0 0 2px var(--line2),0 6px 20px rgba(0,0,0,.6)}
#spinCv{width:96px;height:96px;display:block;border-radius:50%}
#elevBox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);width:132px}
#elev{width:80px;accent-color:var(--pink)}
#tech{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:132px}
#tech .btn{font-size:12.5px;min-height:30px;padding:3px 4px;border-radius:9px}
#acts{position:fixed;right:8px;bottom:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
#acts .btn{font-size:13px;min-height:34px;padding:4px 11px;border-radius:10px}
#tokens{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
#pow{position:fixed;right:14px;top:50%;transform:translateY(-50%);width:46px;height:min(46vh,320px);border-radius:16px;background:var(--glass);box-shadow:var(--glow);touch-action:none;cursor:ns-resize;overflow:hidden}
#powFill{position:absolute;left:6px;right:6px;bottom:6px;height:0;border-radius:10px;background:linear-gradient(0deg,#3ff1ff,#ffb347 55%,#ff3d8b)}
#powLbl{position:absolute;left:0;right:0;top:6px;text-align:center;font-family:var(--d);font-size:10px;color:var(--dim);letter-spacing:.04em;pointer-events:none}
#powPct{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;font-weight:800;pointer-events:none;text-shadow:0 1px 3px #000}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--glass2);padding:8px 16px;border-radius:12px;box-shadow:0 0 0 1px var(--line2),0 8px 24px rgba(0,0,0,.6);font-size:16px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
#hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:13.5px;color:var(--dim);background:rgba(0,0,0,.55);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
/* panels */
#panel{position:fixed;inset:0;z-index:50;background:rgba(4,2,6,.7);display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{width:min(820px,100%);max-height:100%;display:flex;flex-direction:column;background:linear-gradient(170deg,#24141c,#120a0f 70%);border-radius:20px;box-shadow:0 0 0 1px var(--line2),0 0 40px rgba(255,61,139,.15),0 20px 60px rgba(0,0,0,.7);overflow:hidden}
#pHead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#pHead h2{font-family:var(--d);font-size:22px;letter-spacing:.04em;color:var(--amb);text-shadow:0 0 14px rgba(255,179,71,.45);flex:1;font-weight:400}
#pBody{padding:12px 16px 16px;overflow:auto;-webkit-overflow-scrolling:touch}
.x{appearance:none;border:0;background:none;font-size:26px;cursor:pointer;color:var(--dim);width:40px;height:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{background:rgba(255,255,255,.04);border-radius:14px;padding:11px 12px;box-shadow:0 0 0 1px var(--line);cursor:pointer;transition:box-shadow .2s,transform .12s;position:relative;display:flex;flex-direction:column;gap:4px}
.tile:hover{box-shadow:0 0 0 1px var(--amb),0 0 16px rgba(255,179,71,.25);transform:translateY(-1px)}
.tile h3{padding-right:48px;font-family:var(--d);font-size:15px;font-weight:400;letter-spacing:.03em;color:var(--ink)}
.tile p{font-size:14px;color:var(--dim);line-height:1.25;font-weight:500}
.tile .tag{font-size:12px;color:var(--cy);font-weight:700;letter-spacing:.04em}
.tile.lock{opacity:.5;cursor:default}
.tile.lock:hover{transform:none;box-shadow:0 0 0 1px var(--line)}
.tile.done{box-shadow:0 0 0 1px rgba(93,255,155,.5)}
.tile .badge{position:absolute;right:10px;top:9px;font-size:12px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.lbl{font-size:13px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg .btn{font-size:13.5px;min-height:34px;padding:5px 11px;border-radius:10px}
p.note{font-size:14px;color:var(--dim);line-height:1.35;font-weight:500;margin:6px 0}
.play{font-size:12px;color:var(--amb);border:1px dashed rgba(255,179,71,.5);border-radius:10px;padding:6px 10px;line-height:1.3;font-weight:600}
.big{font-family:var(--d);font-size:30px;color:var(--amb);text-align:center;margin:6px 0;font-weight:400;text-shadow:0 0 18px rgba(255,179,71,.5)}
.ctr{text-align:center}
table.sc{border-collapse:collapse;margin:6px auto;font-size:14px}
table.sc td,table.sc th{border:1px solid var(--line);padding:3px 7px;text-align:center}
input[type=range]{accent-color:var(--pink)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--d);font-size:16px;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 14px currentColor}
.hs{display:flex;gap:10px;align-items:center}
/* modal prompt */
#prompt{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:45;background:var(--glass2);border-radius:16px;padding:10px 14px;box-shadow:0 0 0 1px var(--pink),0 0 26px rgba(255,61,139,.3);display:flex;flex-direction:column;gap:7px;align-items:center;max-width:94vw;text-align:center}
#prompt .q{font-size:15.5px}
#prompt .row{justify-content:center;margin:0}
/* phone portrait */
@media (max-width:760px){
  #topbar{top:56px;left:6px;right:6px;transform:none;max-width:none;gap:4px}
  .pc{min-width:0;flex:1;padding:4px 8px}.pc .nm{font-size:11px;max-width:120px}.pc .sc{font-size:18px}.pc .gp{font-size:11px;max-width:130px}
  #mid{min-width:76px;padding:3px 6px}#mid .a{font-size:10px}#mid .b{font-size:11px}
  #mods{top:auto;bottom:206px;left:6px;flex-direction:row;flex-wrap:wrap;max-width:calc(100vw - 12px)}
  .card{font-size:11px;padding:3px 7px}.card b{font-size:9.5px}
  #ctl{left:6px;bottom:62px;flex-direction:row;width:auto;align-items:flex-end;gap:6px}
  #spinBox,#spinCv{width:78px;height:78px}
  #elevBox{flex-direction:column;width:44px;gap:2px;font-size:10px}
  #elev{width:70px;transform:rotate(-90deg);margin:28px -14px}
  #tech{grid-template-columns:repeat(3,1fr);width:174px}
  #tech .btn{font-size:11.5px;min-height:28px}
  #acts{right:6px;bottom:62px}
  #acts .btn{font-size:12px;min-height:30px;padding:3px 8px}
  #pow{right:6px;left:6px;top:auto;bottom:6px;transform:none;width:auto;height:48px;cursor:ew-resize}
  #powFill{top:6px;bottom:6px;left:6px;height:auto;width:0;background:linear-gradient(90deg,#3ff1ff,#ffb347 55%,#ff3d8b)}
  #powLbl{top:50%;transform:translateY(-50%);text-align:left;left:12px}
  #powPct{top:50%;bottom:auto;transform:translateY(-50%);text-align:right;right:12px;left:auto}
  #hint{bottom:auto;top:116px;font-size:12px;max-width:92vw}
  #toast{top:118px;font-size:14px}
  .tmenu{grid-template-columns:repeat(2,1fr);gap:7px}
  .tmenu .btn{min-height:50px;font-size:15px;padding:6px 8px}
  .tmenu .wide{grid-column:span 2}
  #pHead h2{font-size:18px}
  .grid{grid-template-columns:1fr}
  #prompt{bottom:120px}
}
@media (max-height:520px) and (min-width:761px){
  #ctl{bottom:4px}#spinBox,#spinCv{width:70px;height:70px}#tech .btn{min-height:24px;font-size:11px}
  .tmenu .btn{min-height:40px;padding:4px 8px;font-size:14px}.tmenu .btn small{display:none}
}
</style>
</head>
<body>
<a id="kai" href="index.html">← Kai.fun</a>
<canvas id="cv" tabindex="0"></canvas>
<div id="topR">
  <button class="ib" id="chipBtn" title="Your chips (play money)"><span id="chipPill"><span class="chip"></span><span id="chipN">0</span></span></button>
  <button class="ib" id="musicBtn" title="Lounge music"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>

<script>
'use strict';
/* ================= utilities ================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t, TAU = Math.PI * 2;
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RND = mulberry((Date.now() % 1e9) | 0);
const pick = (a, r = RND) => a[Math.floor(r() * a.length)];
function shuffle(a, r = RND) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => (n < 0 ? '-' : '') + Math.abs(Math.round(n)).toLocaleString('en-US');
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ================= save ================= */
const SKEY = 'ultimatepool.v1';
const DEF_SAVE = () => ({ chips: 600, loans: 0, career: 0, ach: {}, stats: {}, own: { cue: ['house'], felt: ['green'], skin: ['classic'], table: ['standard', 'big', 'layers'] },
  eq: { cue: 'house', felt: 'green', skin: 'classic' }, hustlers: {}, daily: {}, chal: {}, set: { mute: false, music: false, assist: true }, seen: {}, best: {} });

}
/* homepage tile: the words built from balls on felt (used by make_tile.py) */

  const lg = x.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, W * .55); lg.addColorStop(0, 'rgba(255,236,190,.22)'); lg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = lg; x.fillRect(0, 0, W, H);

  specs.forEach(s => { const b = pw.add(s.k, s.x + 40, s.y + 30, { n: s.n, gl: s.gl === undefined ? '' : s.gl, v: s.v || 0, r, noscale: 1 }); b.o = randOrient(mulberry(b.id * 7)); b.o = [1, 0, 0, 0, Math.cos(.25), -Math.sin(.25), 0, Math.sin(.25), Math.cos(.25)];

function gameFrame(dt, t) {
