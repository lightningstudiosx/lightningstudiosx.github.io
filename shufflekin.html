<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Shufflekin · Kai.fun</title>
<meta name="description" content="Shufflekin: a trading card battler with 162 one-of-a-kind hand-drawn characters across six factions. Free packs every day, never a duplicate, a 12-rival campaign, deck builder, crafting and online duels.">
<meta name="theme-color" content="#1b1430">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* style.css - base theme, buttons, top bar, screens, modal, toasts */
:root{--bg:#160f2a;--bg2:#241a44;--ink:#f4efff;--mute:#b5a8d8;--gold:#ffcf5a;--gold2:#ff9f2e;--pink:#ff6fb5;--teal:#4fe0d0;--panel:rgba(36,26,68,.92);--line:rgba(255,255,255,.12);
  --fh:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;--fb:'Nunito','Segoe UI',system-ui,sans-serif;--r:16px;--sh:0 10px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-weight:700;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit}
#bgfx{position:fixed;inset:0;z-index:0;background:radial-gradient(1200px 700px at 20% 0%,#3a2470 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#2a1250 0%,transparent 60%),linear-gradient(180deg,#1b1236,#120c24);pointer-events:none}
#bgfx:after{content:'';position:absolute;inset:0;opacity:.07;background-image:radial-gradient(circle at 25% 25%,#fff 1px,transparent 1.5px),radial-gradient(circle at 75% 60%,#fff 1px,transparent 1.5px);background-size:46px 46px,70px 70px}
#kai{position:fixed;left:10px;top:10px;z-index:60;font:900 14px var(--fb);color:#2a1a4a;text-decoration:none;background:#fff;padding:7px 12px;border-radius:999px;box-shadow:0 4px 0 #b89cff,0 8px 18px rgba(0,0,0,.35);line-height:1}
#kai:hover{background:var(--gold)}
body[data-scr=battle] #kai{display:none}
#app{position:fixed;inset:0;z-index:2}
.scr{position:absolute;inset:0;display:none;overflow:auto;padding:70px 18px 30px;-webkit-overflow-scrolling:touch}
.scr.on{display:block}
#s-title.on,#s-battle.on,#s-starter.on{display:flex}
#s-battle{padding:0;overflow:hidden}
.hide{display:none!important}
/* top bar */
#topbar{position:fixed;left:0;right:0;top:0;height:58px;z-index:50;display:flex;align-items:center;gap:12px;padding:0 14px 0 120px;background:linear-gradient(180deg,rgba(20,12,40,.96),rgba(20,12,40,.8));border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.tbBtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);font-size:22px;display:grid;place-items:center}
.tbBtn:hover{background:rgba(255,255,255,.16)}
#tbTitle{font:26px var(--fh);letter-spacing:.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 3px 0 rgba(0,0,0,.35)}
#tbRes{display:flex;gap:8px}
.res{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px;font:17px var(--fh)}
.res i{width:24px;height:24px;border-radius:50%;display:block}
.res.coin i{background:radial-gradient(circle at 35% 30%,#fff6c0,#ffcf3a 45%,#c98a10);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.res.dust i{background:radial-gradient(circle at 35% 30%,#fff,#b48cff 45%,#5a2ab0);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.res.packs i{background:linear-gradient(135deg,#ff7ab8,#ffb347);border-radius:5px;transform:rotate(-8deg)}
.res.packs{cursor:pointer}
/* buttons */
.btn{font:19px var(--fh);letter-spacing:.4px;padding:11px 20px;border-radius:14px;background:linear-gradient(180deg,#8d6cff,#5d3fd6);color:#fff;box-shadow:0 4px 0 #3a2290,0 8px 18px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2290,0 4px 10px rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,#ffd45a,#ff9d2e);color:#4a2200;box-shadow:0 4px 0 #b8600e,0 8px 18px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.btn.pink{background:linear-gradient(180deg,#ff8ac6,#e4458f);box-shadow:0 4px 0 #9a1f5c,0 8px 18px rgba(0,0,0,.35)}
.btn.teal{background:linear-gradient(180deg,#5ff0d8,#1fa99a);color:#063a34;box-shadow:0 4px 0 #0f6a60,0 8px 18px rgba(0,0,0,.35);text-shadow:none}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.btn.sm{font-size:15px;padding:7px 13px;border-radius:11px}
.btn.big{font-size:26px;padding:15px 30px;border-radius:18px}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.btn .badge,.badge{display:inline-block;min-width:22px;padding:1px 7px;margin-left:6px;border-radius:999px;background:#ff3d6e;color:#fff;font:14px var(--fh);box-shadow:0 2px 0 rgba(0,0,0,.3);text-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
h2{font:30px var(--fh);margin:0 0 12px;letter-spacing:.5px}
h3{font:21px var(--fh);margin:0 0 8px;letter-spacing:.4px}
.small{font-size:13px;color:var(--mute);font-weight:700}
.wrap{max-width:1180px;margin:0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:#fff;color:#241a44;border-color:#fff}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:14px;color:var(--mute)}
.seg button.on{background:#fff;color:#241a44}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5ff0d8,#ffd45a);border-radius:99px;transition:width .5s}
/* modal + toasts */
#modal{position:fixed;inset:0;z-index:200;background:rgba(8,4,20,.7);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
#modalCard{background:linear-gradient(180deg,#2e2258,#1e1640);border:1px solid rgba(255,255,255,.16);border-radius:22px;box-shadow:var(--sh);padding:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;text-align:center;animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
#modalCard.wide{max-width:860px}
#modalCard p{color:#ddd2ff;line-height:1.45;margin:8px 0}
.mBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
#toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#fff;color:#241a44;padding:10px 18px;border-radius:14px;font-weight:900;box-shadow:var(--sh);opacity:0;transform:translateY(-10px);transition:.3s;max-width:90vw;text-align:center}
.toast.in{opacity:1;transform:none}
.toast.good{background:linear-gradient(180deg,#7dffb0,#2fd07a);color:#063a20}
.toast.gold{background:linear-gradient(180deg,#ffe48a,#ffb347);color:#4a2200}
.toast.bad{background:linear-gradient(180deg,#ff9a9a,#ff5a6e);color:#3a0010}
#padCursor{position:fixed;z-index:400;pointer-events:none;border:4px solid #fff;border-radius:16px;box-shadow:0 0 0 3px #7a5cff,0 0 24px #b48cff;transition:all .12s}
@media (max-width:700px){#topbar{padding-left:104px;height:52px;gap:6px}#tbTitle{font-size:19px}.res{font-size:14px;padding:3px 8px 3px 4px}.res i{width:18px;height:18px}.scr{padding:62px 10px 24px}h2{font-size:24px}.btn.big{font-size:21px;padding:12px 22px}#kai{font-size:12px;padding:6px 10px}}
@media (max-width:420px){.res.packs{display:none}}
/* style2.css - the card frame (one look per faction), rarity gems, foil / holo shimmer, card zoom */
.card{--cw:180px;width:var(--cw);height:calc(var(--cw)*1.4);font-size:calc(var(--cw)/12);position:relative;flex:none;border-radius:.9em;cursor:pointer;transition:transform .15s;
  --fc:#8b7bb8;--fc2:#d8d0f0;--fd:#2a2240}
.card.f-ember{--fc:#ff6a2a;--fc2:#ffc070;--fd:#5a1a12}.card.f-tide{--fc:#2aa8e0;--fc2:#9ff0ff;--fd:#0b2a48}.card.f-grove{--fc:#4cb85a;--fc2:#c8ee7a;--fd:#143418}
.card.f-gear{--fc:#d9a83e;--fc2:#fff0a0;--fd:#3a260c}.card.f-gloom{--fc:#8b5bd6;--fc2:#d8c0ff;--fd:#1c0e30}.card.f-gleam{--fc:#f58cc8;--fc2:#fff6c0;--fd:#4a2a5a}
.cframe{position:absolute;inset:0;border-radius:.9em;overflow:hidden;background:linear-gradient(160deg,var(--fc2) 0%,var(--fc) 30%,var(--fd) 100%);box-shadow:0 .5em 1.2em rgba(0,0,0,.5),inset 0 0 0 .14em rgba(255,255,255,.35)}
.cframe:before{content:'';position:absolute;inset:.32em;border-radius:.65em;background:linear-gradient(180deg,var(--fd),#120a20 70%);box-shadow:inset 0 0 0 .1em rgba(0,0,0,.5)}
.f-ember .cframe:after{background-image:radial-gradient(circle at 20% 110%,rgba(255,150,40,.35),transparent 40%)}
.cframe:after{content:'';position:absolute;inset:0;pointer-events:none}
.f-gear .cframe{background:linear-gradient(160deg,#fff0a0,#d9a83e 30%,#7a5418 70%,#3a260c)}
.f-tide .cframe:before{background:linear-gradient(180deg,#0b2a48,#06121f 75%)}
.f-grove .cframe:before{background:linear-gradient(180deg,#163a1a,#0a170c 75%)}
.f-gloom .cframe:before{background:linear-gradient(180deg,#24113c,#0e0618 75%)}
.f-gleam .cframe:before{background:linear-gradient(180deg,#5a3a6e,#2a1838 75%)}
.cart{position:absolute;left:.55em;top:.55em;width:10.9em;height:8.2em;border-radius:.55em .55em .3em .3em;overflow:hidden;box-shadow:0 0 0 .12em rgba(0,0,0,.6),0 0 0 .26em var(--fc2)}
.cart img{width:100%;height:100%;display:block;object-fit:cover}
.card.spell .cart{border-radius:4em 4em .4em .4em}
.cname{position:absolute;left:.2em;right:.2em;top:8.05em;height:1.7em;display:flex;align-items:center;justify-content:center;font:1em var(--fh);color:#fff;text-shadow:0 .1em 0 rgba(0,0,0,.6),0 0 .4em rgba(0,0,0,.6);
  background:linear-gradient(180deg,var(--fc),var(--fd));border-radius:.4em;box-shadow:0 .12em .3em rgba(0,0,0,.6),inset 0 0 0 .08em rgba(255,255,255,.3);padding:0 2.2em 0 .6em;white-space:nowrap;line-height:1;letter-spacing:.02em}
.cname span{display:block;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cname.long span{font-size:.84em}.cname.vlong span{font-size:.72em}
.ctype{position:absolute;left:0;right:0;top:9.85em;text-align:center;font:800 1em var(--fb);color:var(--fc2);opacity:.85;letter-spacing:.08em;text-transform:uppercase}
.ctext{position:absolute;left:.8em;right:.8em;top:10.55em;bottom:1.9em;display:flex;align-items:center;justify-content:center;text-align:center;font:700 1em/1.22 var(--fb);color:#f2ecff;padding:0 .3em}
.ctext>div{font-size:.74em}
.ctype span{font-size:.55em}
.ctext b{color:var(--fc2);font-weight:900}
.ctext.s>div{font-size:.66em}.ctext.xs>div{font-size:.58em}
.cflav{display:none}
.ccost{position:absolute;left:-.3em;top:-.3em;width:2.7em;height:2.7em;border-radius:50%;display:grid;place-items:center;font:1.55em var(--fh);color:#fff;
  background:radial-gradient(circle at 35% 30%,#bfe6ff,#3f86e0 50%,#1a3a8a);box-shadow:0 .1em .3em rgba(0,0,0,.6),inset 0 0 0 .1em rgba(255,255,255,.5);text-shadow:0 .08em 0 #102050;font-size:1em}
.ccost b{font-size:1.6em;line-height:1}
.ccost.down{background:radial-gradient(circle at 35% 30%,#d0ffd8,#3fd06a 50%,#0f6a30)}.ccost.up{background:radial-gradient(circle at 35% 30%,#ffd0d0,#e04a4a 50%,#7a1010)}
.catk,.chp{position:absolute;bottom:-.25em;width:2.6em;height:2.6em;display:grid;place-items:center;font:1.5em var(--fh);color:#fff;text-shadow:0 .08em 0 rgba(0,0,0,.6);font-size:1em}
.catk b,.chp b{font-size:1.55em;line-height:1}
.catk{left:-.25em;background:radial-gradient(circle at 35% 30%,#ffe08a,#f2a83a 50%,#a85a10);border-radius:50% 50% 50% 12%;box-shadow:0 .1em .3em rgba(0,0,0,.6),inset 0 0 0 .1em rgba(255,255,255,.4)}
.chp{right:-.25em;background:radial-gradient(circle at 35% 30%,#ffb0b0,#e8483f 50%,#7a1418);clip-path:path('M0 0');border-radius:.4em .4em 50% 50%;box-shadow:0 .1em .3em rgba(0,0,0,.6),inset 0 0 0 .1em rgba(255,255,255,.4)}
.chp{clip-path:none}
.cgem{position:absolute;left:50%;top:13.6em;transform:translateX(-50%) rotate(45deg);width:.9em;height:.9em;border-radius:.15em;background:var(--rc,#ccc);box-shadow:0 0 .4em var(--rc),inset 0 0 0 .1em rgba(255,255,255,.6)}
.card.spell .cgem{top:auto;bottom:.85em}
.card:not(.spell) .cgem{top:auto;bottom:.85em}
.r-C{--rc:#c8c4d4}.r-U{--rc:#5fd06a}.r-R{--rc:#4aa8ff}.r-E{--rc:#b46cff}.r-L{--rc:#ffa63a}.r-M{--rc:#ff5fd0}
.r-L .cframe,.r-M .cframe{box-shadow:0 .5em 1.2em rgba(0,0,0,.5),0 0 0 .14em var(--rc),0 0 1.2em var(--rc)}
.r-L .cname{background:linear-gradient(180deg,#ffd45a,#c46a10);color:#fff}.r-M .cname{background:linear-gradient(90deg,#ff6fd0,#8a6cff,#4fe0d0,#ffd45a);background-size:200% 100%;animation:holo 4s linear infinite}
/* foil: R gentle sheen, E violet sheen, L gold holo, M rainbow holo with sparkle */
.cfoil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;background-size:300% 300%;z-index:1}
.cshine{position:absolute;inset:0;border-radius:.9em;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);background-size:300% 100%;mix-blend-mode:overlay}
.r-E .cshine,.r-L .cshine,.r-M .cshine{opacity:1;animation:sheen 6s ease-in-out infinite}
.r-R .cfoil{opacity:.35;background-image:linear-gradient(115deg,transparent 30%,rgba(160,210,255,.7) 45%,transparent 60%)}
.r-E .cfoil{opacity:.5;background-image:linear-gradient(115deg,transparent 25%,rgba(200,140,255,.8) 42%,rgba(120,200,255,.6) 50%,transparent 65%)}
.r-L .cfoil{opacity:.45;background-image:linear-gradient(115deg,transparent 20%,rgba(255,220,120,.9) 38%,rgba(255,160,60,.6) 48%,rgba(255,250,200,.8) 56%,transparent 72%)}
.r-M .cfoil{opacity:.42;mix-blend-mode:overlay;background-image:linear-gradient(115deg,rgba(255,80,200,.5),rgba(120,120,255,.6) 25%,rgba(80,240,220,.6) 45%,rgba(255,240,120,.6) 65%,rgba(255,80,200,.5) 85%)}
.r-R .cfoil,.r-E .cfoil,.r-L .cfoil,.r-M .cfoil{animation:sheen 5s ease-in-out infinite}
.r-M .cfoil{animation-duration:3.2s}
.noanim .cfoil{animation:none!important}
@keyframes sheen{0%{background-position:100% 0}50%{background-position:0 100%}100%{background-position:100% 0}}
@keyframes holo{to{background-position:200% 0}}
.r-M .cart:after,.r-L .cart:after{content:'';position:absolute;inset:0;z-index:2;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 1px,transparent 1.6px);background-size:1.4em 1.4em;mix-blend-mode:screen;opacity:.0;animation:twinkle 2.4s ease-in-out infinite}
.r-M .cart:after{opacity:.6}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.65}}
/* unowned / states */
.card.locked .cframe{filter:grayscale(1) brightness(.45)}
.card.locked .cart img{filter:brightness(0) opacity(.55)}
.card.locked:after{content:'?';position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font:4em var(--fh);color:rgba(255,255,255,.55);text-shadow:0 .05em .2em #000}
.card .newtag{position:absolute;right:-.4em;top:-.5em;background:#ff3d6e;color:#fff;font:.8em var(--fh);padding:.2em .5em;border-radius:.6em;box-shadow:0 .1em .3em rgba(0,0,0,.5);z-index:3;transform:rotate(8deg)}
.card .incount{position:absolute;inset:0;border-radius:.9em;background:rgba(10,5,25,.55);display:grid;place-items:center;font:1.4em var(--fh);color:#7dffb0;z-index:3;text-shadow:0 .1em .2em #000}
.card.cant{filter:saturate(.4) brightness(.6)}
.card.playable{box-shadow:0 0 0 .2em #7dffb0,0 0 1.4em #3fd07a;border-radius:.9em}
/* zoom view */
#zoom{position:fixed;inset:0;z-index:180;background:rgba(8,4,20,.78);display:flex;align-items:center;justify-content:center;gap:28px;padding:20px;backdrop-filter:blur(4px);flex-wrap:wrap;overflow:auto}
#zoom .card{--cw:min(330px,78vw);cursor:default;transform-style:preserve-3d;transition:transform .08s}
.zInfo{max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.zInfo h3{font-size:26px;margin-bottom:4px}
.zInfo .who{color:var(--gold);font-size:14px;margin-bottom:8px}
.zInfo .lore{font-style:italic;color:#e8dcff;font-size:16px;line-height:1.4;margin:10px 0}
.zInfo .kwl{font-size:13.5px;color:var(--mute);line-height:1.35;margin:4px 0}
.zInfo .kwl b{color:#fff}
.zMeta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
/* style3.css - packs screen, pack graphic, opening stage (tear, fly-out, flip, rarity glows, banners) */
.packWrap{display:flex;flex-direction:column;gap:14px}
.dailyPanel .pips{display:flex;gap:8px;margin:2px 0 10px}
.pip{width:34px;height:44px;border-radius:7px;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.2)}
.pip.on{background:linear-gradient(135deg,#ff8ac6,#ffb347);border:2px solid #fff;box-shadow:0 0 14px rgba(255,170,90,.6);animation:pipb 2s ease-in-out infinite}
.pip.bonus.on{background:linear-gradient(135deg,#5ff0d8,#8d6cff)}
@keyframes pipb{50%{transform:translateY(-3px) rotate(-3deg)}}
.dline{margin:5px 0;color:#e8dcff}.dline b{color:var(--gold)}.hl{color:#7dffb0;font-weight:900}
.packRow{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 0 20px}
.packActs{display:flex;flex-direction:column;gap:12px;max-width:380px;align-items:stretch}
.odds{line-height:1.4}
/* the pack */
.pack{--pw:230px;width:var(--pw);height:calc(var(--pw)*1.45);position:relative;cursor:pointer;font-size:calc(var(--pw)/12);filter:drop-shadow(0 1.2em 1.6em rgba(0,0,0,.55))}
.pack.small{--pw:120px}
.pack .pbody,.pack .ptop{position:absolute;left:0;right:0;background:linear-gradient(150deg,var(--pc2),var(--pc1) 45%,var(--pc3));overflow:hidden}
.pack .ptop{top:0;height:16%;border-radius:.4em .4em 0 0;-webkit-mask:linear-gradient(#000,#000) top/100% 88% no-repeat,radial-gradient(circle at 50% 100%,transparent .28em,#000 .3em) bottom/.7em 13% repeat-x;mask:linear-gradient(#000,#000) top/100% 88% no-repeat,radial-gradient(circle at 50% 100%,transparent .28em,#000 .3em) bottom/.7em 13% repeat-x;z-index:2;transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .55s}
.pack .ptop i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 .25em,transparent .25em .7em)}
.pack .pbody{top:15%;bottom:0;border-radius:0 0 .5em .5em;display:flex;flex-direction:column;align-items:center;padding-top:.8em;box-shadow:inset 0 0 0 .15em rgba(255,255,255,.35)}

.pack.idle{animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-1.5deg)}}
/* stage */
.pstage{position:fixed;inset:0;z-index:150;background:radial-gradient(circle at 50% 45%,#4a2f94,#120826 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.pstage.flash:after{content:'';position:absolute;inset:0;background:#fff;animation:flash .45s ease-out forwards;pointer-events:none;z-index:5}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.pstage.quake{animation:quake .45s}
@keyframes quake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,5px)}}
.pfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.phint{position:absolute;top:8%;font:26px var(--fh);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4);z-index:3;text-align:center;padding:0 16px}
.bigpack{--pw:min(260px,52vw);position:absolute;z-index:3}
.bigpack.enter{animation:penter .7s cubic-bezier(.2,1.5,.4,1) both,float 3s ease-in-out .7s infinite}
@keyframes penter{from{transform:translateY(60vh) rotate(12deg) scale(.6)}to{transform:none}}
.bigpack.shake{animation:pshake .16s}
@keyframes pshake{25%{transform:rotate(-6deg) scale(1.03)}75%{transform:rotate(6deg) scale(1.03)}}
.bigpack.torn .ptop{transform:translate(70px,-160px) rotate(38deg);opacity:0}
.bigpack.gone{transition:transform .5s ease-in,opacity .5s;transform:translateY(70vh) scale(.8);opacity:0;pointer-events:none}
.prow{display:flex;gap:min(16px,2vw);z-index:3;flex-wrap:wrap;justify-content:center;padding:0 10px;max-width:100vw}
.pslot{--cw:min(176px,17vw);width:var(--cw);height:calc(var(--cw)*1.4);perspective:1000px;animation:pout .6s cubic-bezier(.2,1.5,.4,1) both;cursor:pointer;position:relative}
@keyframes pout{from{transform:translateY(40vh) scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.pflip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.3,.5,1)}
.pflip.open{transform:rotateY(180deg)}
.pback,.pfront{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:calc(var(--cw)/13)}
.pfront{transform:rotateY(180deg)}
.pfront .card{--cw:inherit;width:100%;height:100%}
.pback{background:linear-gradient(150deg,#5d3fd6,#2a1a6a 60%,#160c38);box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 0 0 4px rgba(255,255,255,.25);display:grid;place-items:center;overflow:hidden}
.pback:before{content:'';position:absolute;inset:8px;border-radius:10px;border:2px solid rgba(255,220,140,.45);background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.06) 0 6px,transparent 6px 14px)}
.bk{text-align:center;position:relative}.bkS{font:calc(var(--cw)/2.4) var(--fh);color:#ffe48a;text-shadow:0 4px 0 #8a4a10,0 0 20px rgba(255,200,100,.6);line-height:1}
.bkT{font:calc(var(--cw)/10) var(--fh);color:#fff;opacity:.8;letter-spacing:.05em}
.g-U.pback{box-shadow:0 0 18px 3px #3fd06a,inset 0 0 0 4px #7dffb0}
.g-R.pback{box-shadow:0 0 24px 5px #4aa8ff,inset 0 0 0 4px #9fd0ff}
.g-E.pback{box-shadow:0 0 30px 8px #b46cff,inset 0 0 0 4px #d8b0ff;animation:gpulse 1.2s ease-in-out infinite}
.g-L.pback{box-shadow:0 0 40px 12px #ffa63a,inset 0 0 0 4px #ffe08a;animation:gpulse .8s ease-in-out infinite}
.g-M.pback{box-shadow:0 0 46px 14px #ff5fd0,inset 0 0 0 4px #fff;animation:gpulse .6s ease-in-out infinite,hue 2s linear infinite}
@keyframes gpulse{50%{filter:brightness(1.35)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.pslot.charge{animation:charge .5s ease-in}
@keyframes charge{30%{transform:scale(1.05) rotate(-3deg)}60%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1.12)}}
.pslot.hero{animation:hero 1.4s cubic-bezier(.2,1.4,.4,1);z-index:6}
@keyframes hero{0%{transform:scale(1.12)}25%{transform:scale(1.35) translateY(-20px)}100%{transform:none}}
.pslot.rv-R .pfront,.pslot.rv-E .pfront,.pslot.rv-L .pfront,.pslot.rv-M .pfront{box-shadow:0 0 26px var(--rc)}
.pslot.rv-R{--rc:#4aa8ff}.pslot.rv-E{--rc:#b46cff}.pslot.rv-L{--rc:#ffa63a}.pslot.rv-M{--rc:#ff5fd0}
.pnew{position:absolute;right:-8px;top:-10px;z-index:5;background:#ff3d6e;color:#fff;font:15px var(--fh);padding:3px 9px;border-radius:10px;transform:rotate(10deg);box-shadow:0 3px 8px rgba(0,0,0,.5);animation:pop .3s}
.dustCard{width:100%;height:100%;border-radius:14px;background:linear-gradient(160deg,#3a2a7a,#1a1040);box-shadow:inset 0 0 0 4px rgba(200,170,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:8px}
.dustCard b{font:calc(var(--cw)/5) var(--fh);color:#e8d8ff;text-shadow:0 0 12px #b48cff}.dustCard span{font-size:calc(var(--cw)/12);color:#d8c8ff}.dustCard em{font-size:calc(var(--cw)/15);color:#9a8ac8}
.dcrys{width:40%;aspect-ratio:1;background:linear-gradient(135deg,#fff,#c9a8ff 40%,#6a3ad0);clip-path:polygon(50% 0,85% 30%,70% 100%,30% 100%,15% 30%);animation:float 2s ease-in-out infinite;filter:drop-shadow(0 0 10px #b48cff)}
.pbtns{position:absolute;bottom:6%;display:flex;gap:10px;z-index:6;flex-wrap:wrap;justify-content:center}
.pbanner{position:absolute;top:18%;font:min(76px,13vw) var(--fh);z-index:7;pointer-events:none;animation:banner 1.6s cubic-bezier(.2,1.4,.4,1) forwards;letter-spacing:2px}
.pbanner.g-L{color:#ffd45a;text-shadow:0 6px 0 #a8500e,0 0 40px #ffa63a}.pbanner.g-M{background:linear-gradient(90deg,#ff5fd0,#8a6cff,#4fe0d0,#ffd45a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 #4a1a6a)}
.pbanner.g-E{color:#e0c0ff;text-shadow:0 5px 0 #5a2aa0,0 0 30px #b46cff;font-size:min(56px,10vw)}
@keyframes banner{0%{transform:scale(.3) rotate(-8deg);opacity:0}20%{transform:scale(1.15);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.1) translateY(-30px);opacity:0}}
@media (max-width:700px){.prow{gap:6px}.pslot{--cw:min(118px,29vw)}.phint{font-size:19px;top:5%}.pbtns{bottom:3%}}
/* style4.css - title hub, logo, starter choice */
#s-title{align-items:center;justify-content:center;flex-direction:column;padding:20px;overflow:hidden}

.tFan{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:0}

/* starter */
#s-starter{align-items:flex-start;justify-content:center;overflow:auto}

.stRow{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.stBox{width:320px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s,border-color .15s;text-align:center}

/* home tile */

<script>
"use strict";
// ===== art.js =====

<script>
"use strict";
// ===== ai.js =====
// ai.js - AI opponents. Easy: playful and random. Normal: greedy one-step search with noise. Hard: clean greedy search.
// Expert: greedy search with a short look-ahead on the best few candidates. All of them simulate on cloned states.
(function () {
const E = SK.E, CD = id => SK.CARDS[id];

<script>
"use strict";
// ===== decks.js =====
// decks.js - deck rules (exactly 30, one of each card, at most 2 factions, only cards you own, no tokens),
// auto-fill to a healthy mana curve, and deck storage helpers.
(function () {
const D = SK.Decks = {}, CD = id => SK.CARDS[id];
D.facsOf = cards => [...new Set(cards.map(id => CD(id) && CD(id).fac).filter(Boolean))];
D.validate = (cards, owned) => {
  const errs = [], seen = {}; owned = owned || SK.S.owned;
  if (!Array.isArray(cards)) return { ok: false, errs: ['Not a deck.'] };
  cards.forEach(id => { const C = CD(id); if (!C) errs.push('Unknown card ' + id); else if (C.token) errs.push(C.name + ' cannot go in decks.');
    else if (!owned[id]) errs.push('You do not own ' + C.name + '.'); if (seen[id]) errs.push('Only one ' + (C ? C.name : id) + ' allowed.'); seen[id] = 1; });
  const f = D.facsOf(cards); if (f.length > SK.R.MAX_FACTIONS) errs.push('A deck can use at most ' + SK.R.MAX_FACTIONS + ' factions (this one has ' + f.length + ').');
  if (cards.length !== SK.R.DECK) errs.push('A deck needs exactly ' + SK.R.DECK + ' cards (' + cards.length + ' now).');
  return { ok: !errs.length, errs: [...new Set(errs)] };
};
D.canAdd = (cards, id) => { const C = CD(id); if (!C || C.token || !SK.S.owned[id]) return 'You do not own this card yet.'; if (cards.includes(id)) return 'Already in the deck - one of each card.';
  if (cards.length >= SK.R.DECK) return 'The deck is full (30).'; const f = D.facsOf(cards); if (!f.includes(C.fac) && f.length >= SK.R.MAX_FACTIONS) return 'Two factions max - remove ' + SK.FACTIONS[f[1]].name + ' or ' + SK.FACTIONS[f[0]].name + ' cards first.';
  return ''; };
D.CURVE = { 1: 3, 2: 6, 3: 6, 4: 5, 5: 4, 6: 3, 7: 3 };
const bucket = c => Math.min(7, Math.max(1, c));
const power = id => { const C = CD(id); return SK.RAR[C.rar].w * 1.3 + (C.type === 'M' ? (C.atk + C.hp) / Math.max(1, C.cost) * 0.6 : 1.4) + (C.fx.length ? 0.5 : 0); };
// fill up to 30 using owned cards from the deck's factions (or the given ones), aiming at D.CURVE
D.autofill = (cards, facs, owned) => {
  owned = owned || SK.S.owned; cards = cards.slice(); let f = D.facsOf(cards); (facs || []).forEach(x => { if (!f.includes(x) && f.length < 2) f.push(x); });
  if (f.length < 2) { const counts = {}; SK.COLLECTIBLE.forEach(id => { if (owned[id] && !cards.includes(id)) counts[CD(id).fac] = (counts[CD(id).fac] || 0) + 1; });
    Object.keys(counts).sort((a, b) => counts[b] - counts[a]).forEach(x => { if (f.length < 2 && !f.includes(x)) f.push(x); }); }
  const pool = SK.COLLECTIBLE.filter(id => owned[id] && !cards.includes(id) && f.includes(CD(id).fac)).sort((a, b) => power(b) - power(a));
  while (cards.length < SK.R.DECK && pool.length) {
    const have = {}; cards.forEach(id => { const b = bucket(CD(id).cost); have[b] = (have[b] || 0) + 1; });
    let bi = -1, need = -99; pool.forEach((id, i) => { const b = bucket(CD(id).cost), n = (D.CURVE[b] || 0) - (have[b] || 0) + power(id) * 0.05; if (n > need) { need = n; bi = i; } });
    cards.push(pool.splice(bi, 1)[0]);
  }
  return { cards, facs: f, short: SK.R.DECK - cards.length };
};
D.curve = cards => { const c = [0, 0, 0, 0, 0, 0, 0, 0]; cards.forEach(id => { c[bucket(CD(id).cost)]++; }); return c; };
D.sort = cards => cards.slice().sort((a, b) => CD(a).cost - CD(b).cost || CD(a).name.localeCompare(CD(b).name));
D.active = () => { const S = SK.S; const d = S.decks[S.active]; if (d && D.validate(d.cards).ok) return d; const ok = S.decks.find(x => D.validate(x.cards).ok); return ok || null; };
D.newId = () => 'd' + Math.floor(SK.now()).toString(36) + Math.floor(Math.random() * 1e4).toString(36);
})();

</script>

(function () {

let shown = {};

const coach = (key, html) => { if (shown[key]) return; shown[key] = 1; let c = SK.$('coach'); if (!c) { c = SK.el('div', 'coach'); c.id = 'coach'; SK.$('bt').appendChild(c); }
  c.innerHTML = '<div class="cAv"><img src="' + SK.portraitURL('tumble', SK.TUTOR.art) + '"></div><div class="cTx">' + html + '<button class="btn sm ghost">OK</button></div>'; c.classList.remove('hide');
  c.querySelector('button').onclick = () => c.classList.add('hide'); };
SK.tutStep = () => {
  const G = B.G; if (!G || !B.opts.tut) return; const me = G.p[B.me], mine = B.myTurn();
  if (G.T <= 1 && mine && !me.board.length) return coach('play', 'Hi! I\'m Tumble. Let\'s learn by playing.<br><br>This is your <b>hand</b>. The blue gem on a card is its <b>mana cost</b>, and you have <b>1 mana</b> this turn. <b>Drag Cinderpup up onto the table</b> (or tap it, then press Play).');

  if (mine && me.board.some(m => E.canAttack(G, m))) return coach('attack', 'Your creature is glowing green - it can <b>attack</b>! Drag from it to me (my portrait at the top) or to one of my creatures. Both fighters hit each other at once.');

  if (mine && G.p[1 - B.me].board.some(m => m.kw.guard)) return coach('guard', 'See the metal frame? That creature has <b>Guard</b>, so you must attack it before you can hit me. <b>Flying</b> creatures can ignore Guards.');
  if (mine && G.T >= 7) return coach('mana', 'Every turn you get one more <b>Mana Crystal</b>, up to 10, and you draw a card. Bigger cards come later - plan your curve! Get my Health (bottom-right of my portrait) to <b>0</b> to win.');
};
// hook: tutorial decks keep their order
const nG = E.newGame; E.newGame = opt => { if (!opt.noShuffle && !(B.opts && B.opts.noShuffle)) return nG(opt);
  const keep = opt.decks.map(d => d.slice()); const G = nG(Object.assign({}, opt, { noStart: true }));
  G.p.forEach((P, i) => { const n = P.hand.filter(c => c.id !== 'tk_pebble').length; P.hand = P.hand.filter(c => c.id === 'tk_pebble'); P.deck = keep[i].slice(); for (let k = 0; k < n; k++) E.draw(G, i, true);

  G.ev = []; if (!opt.noStart) E.startTurn(G); return G; };
})();

    dir('l', b(BTN.left) || ax < -0.55, () => move(-1, 0)); dir('r', b(BTN.right) || ax > 0.55, () => move(1, 0)); dir('u', b(BTN.up) || ay < -0.55, () => move(0, -1)); dir('d', b(BTN.down) || ay > 0.55, () => move(0, 1));
    const once = (name, i, fn) => { if (b(i)) { if (!held[name]) { held[name] = 1; padOn = true; SK.audioUnlock && SK.audioUnlock(); fn(); } } else held[name] = 0; };
    once('A', BTN.a, press); once('B', BTN.b, back); once('Y', BTN.y, () => { if (SK.scr === 'battle' && SK.B.endTurn) SK.B.endTurn(); });
    once('X', BTN.x, () => { if (cur && cur.dataset.id) SK.zoomCard(cur.dataset.id); else if (cur && cur.closest('.mn')) { const m = SK.E.find(SK.B.G, +cur.closest('.mn').dataset.u); if (m) SK.zoomCard(m.id); } });
    once('S', BTN.start, () => { if (SK.scr === 'battle') SK.$('btMenuB').click(); else SK.show('title'); }); lastPad = now; }
  requestAnimationFrame(poll);
}
requestAnimationFrame(poll);
})();

</script>
<script>
"use strict";
// ===== sim.js =====
// sim.js - self-test harness: random legal decks, instant AI-vs-AI games, invariant checks and per-card ability coverage.
// Used by the Playwright suite (SK.sim.run) and handy from the console.
(function () {
const E = SK.E, CD = id => SK.CARDS[id];
SK.randomDeck = (facs, rnd, pool) => {
  rnd = rnd || Math.random; const ids = (pool || SK.COLLECTIBLE).filter(id => facs.includes(CD(id).fac));
  const sh = SK.shuffle(rnd, ids.slice()); const curveW = c => c <= 2 ? 1.2 : c <= 4 ? 1.1 : c <= 6 ? 0.8 : 0.5;
  sh.sort((a, b) => (curveW(CD(b).cost) + rnd() * 0.8) - (curveW(CD(a).cost) + rnd() * 0.8));
  return sh.slice(0, SK.R.DECK);
};
const invariants = (G, errs, tag) => {
  G.p.forEach((P, i) => {
    if (P.board.length > SK.R.BOARD) errs.push(tag + ' board overflow'); if (P.hand.length > SK.R.HAND) errs.push(tag + ' hand overflow');
    if (!(P.hp <= P.max)) errs.push(tag + ' hero hp > max'); if (P.mana < 0) errs.push(tag + ' negative mana ' + P.mana);
    if (P.cap > SK.R.MAX_MANA) errs.push(tag + ' cap > 10');
    P.board.forEach(m => { if (m.hp <= 0 || m.dead) errs.push(tag + ' dead minion on board ' + m.id); if (!(m.hp <= m.max)) errs.push(tag + ' minion hp>max ' + m.id);
      if ([m.atk, m.hp, m.max].some(v => typeof v !== 'number' || isNaN(v))) errs.push(tag + ' NaN stat ' + m.id); if (m.o !== i) errs.push(tag + ' wrong owner'); });
  });
};
SK.sim = {};
SK.sim.run = (n, level, opt) => {
  opt = opt || {}; const res = { games: 0, turns: 0, errs: [], wins: {}, games_by: {}, played: {}, ops: {}, draws: 0, maxT: 0, ms: 0 };
  const t0 = performance.now(); const origDo = SK.doOp;
  SK.doOp = (c, f) => { const k = c.card ? c.card.id : '?'; res.ops[k] = (res.ops[k] || 0) + 1; return origDo(c, f); };
  try {
    for (let g = 0; g < n; g++) {
      const r = SK.rng(1000 + g + (opt.seed || 0)); const facs = SK.shuffle(r, SK.FAC_ORDER.slice());
      const fa = [facs[0], facs[1]], fb = [facs[2], facs[3]];
      const decks = opt.decks ? opt.decks(g, r) : [SK.randomDeck(fa, r), SK.randomDeck(fb, r)];
      const G = E.newGame({ decks, seed: 77 + g, names: ['A', 'B'] }); let steps = 0;
      try {
        while (!G.over && steps < 3000) { const lv = Array.isArray(level) ? level[G.cur] : level; const a = SK.AI.choose(G, lv);
          if (a.a === 'play') { const c = G.p[G.cur].hand.find(h => h.u === a.u); if (c) res.played[c.id] = (res.played[c.id] || 0) + 1; }
          if (!E.apply(G, a)) E.apply(G, { a: 'end' }); steps++; invariants(G, res.errs, 'g' + g); if (G.T > 90) break; }
      } catch (e) { res.errs.push('g' + g + ' EXC ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e)); }
      res.games++; res.turns += G.T; res.maxT = Math.max(res.maxT, G.T); if (G.winner < 0) res.draws++;
      const key = w => (w === 0 ? fa : fb).join('+'); [0, 1].forEach(i => { const k = (i === 0 ? fa : fb).join('+'); res.games_by[k] = (res.games_by[k] || 0) + 1; });
      if (G.winner >= 0) res.wins[key(G.winner)] = (res.wins[key(G.winner)] || 0) + 1;
      if (res.errs.length > 40) break;
    }
  } finally { SK.doOp = origDo; }
  res.ms = Math.round(performance.now() - t0);
  res.neverPlayed = SK.COLLECTIBLE.filter(id => !res.played[id]);
  res.noOps = SK.COLLECTIBLE.filter(id => CD(id).fx.some(f => f.on !== 'aura') && !res.ops[id]);
  return res;
};
// faction-level win rates from a run (each game has two pairs)
SK.sim.facRates = res => { const w = {}, g = {}; Object.keys(res.games_by).forEach(k => k.split('+').forEach(f => { g[f] = (g[f] || 0) + res.games_by[k]; w[f] = (w[f] || 0) + (res.wins[k] || 0); }));
  const out = {}; Object.keys(g).forEach(f => out[f] = Math.round(100 * w[f] / g[f])); return out; };
})();

</script>

<script>

// ?tile (render the home-page tile), ?room=CODE (join an online duel).
(function () {

SK.boot = () => {

  SK.speed = SK.S.set.speed || 1; document.body.classList.toggle('noanim', SK.S.set.motion === 0);
  SK.refreshTop();
  if (q.has('tile')) { SK.show('tile'); return; }
  const room = q.get('room');
  if (room && SK.S.starter && SK.openOnline) { SK.show('online'); SK.openOnline(room); return; }
  SK.show('title');
  SK.warmArt();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && SK.S && SK.Packs.refresh() && SK.scr === 'title') SK.show('title'); });
};
SK.ready = true;
if (!q.has('dev')) { try { SK.boot(); } catch (e) { console.error(e); } }
else { SK.load(); }
})();
