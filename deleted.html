<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deleted.Fun</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#d9d2c3;color:#3b3629;min-height:100vh;padding:20px 12px 80px;
    font-family:"Trebuchet MS",system-ui,sans-serif;
    background-image:
      radial-gradient(ellipse at 20% 10%, #00000010, transparent 50%),
      radial-gradient(ellipse at 80% 90%, #00000014, transparent 50%),
      repeating-linear-gradient(0deg,transparent 0 3px,#0000000a 3px 4px);
    overflow-x:hidden;
  }
  /* dust floating */
  .dust{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff8;pointer-events:none;animation:drift linear infinite;}
  @keyframes drift{0%{transform:translateY(-10px) translateX(0);opacity:0;}20%{opacity:.8;}100%{transform:translateY(110vh) translateX(40px);opacity:0;}}
  /* cobwebs */
  .web{position:fixed;width:170px;height:170px;pointer-events:none;opacity:.35;}
  .web.tl{left:-4px;top:-4px;} .web.br{right:-4px;bottom:-4px;transform:rotate(180deg);}
  .wrap{max-width:820px;margin:0 auto;position:relative;}
  .back{text-decoration:none;color:#7a7160;font-size:14px;}
  .back:hover{color:#3b3629;}
  header{text-align:center;margin:18px 0 8px;}
  .wordmark{
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;font-weight:900;
    font-size:clamp(40px,10vw,84px);line-height:.95;color:#5a5243;
    transform:rotate(-2deg);display:inline-block;position:relative;
    text-shadow:2px 2px 0 #b9b19f;filter:grayscale(.6) contrast(.85);
    animation:flicker 7s infinite;
  }
  .wordmark .dead{text-decoration:line-through;text-decoration-color:#a33;}
  .wordmark .dot{display:inline-block;transform:translateY(-6px) rotate(15deg);opacity:.6;}
  @keyframes flicker{0%,91%,93%,95%,100%{opacity:1;}92%,94%{opacity:.35;}}
  .sub{color:#7a7160;font-size:14px;margin-top:8px;font-style:italic;}
  .sub b{color:#a33;}
  #count{font-size:12px;color:#8a8170;margin-top:4px;}
  .grave{
    display:block;text-decoration:none;color:inherit;margin:18px auto 0;max-width:640px;
    background:#e9e3d5;border:2px solid #8e8570;border-radius:12px 12px 4px 4px;
    padding:14px 16px 12px;position:relative;
    box-shadow:4px 4px 0 #a39a85, inset 0 0 40px #0000000d;
    transition:transform .15s;
  }
  .grave:nth-child(odd){transform:rotate(-.6deg);} .grave:nth-child(even){transform:rotate(.5deg);}
  .grave:hover{transform:rotate(0) translate(-2px,-2px);box-shadow:6px 6px 0 #a39a85;}
  .grave::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 12px,#0000000a 12px 13px);border-radius:inherit;pointer-events:none;}
  .grave .file{font-family:"Courier New",monospace;font-size:13px;color:#a33;text-decoration:line-through;text-decoration-color:#a33;}
  .grave .file::after{content:"  ← still here, actually";text-decoration:none;color:#8a8170;font-size:11px;font-style:italic;}
  .grave h2{font-size:22px;margin:4px 0 2px;color:#4a4335;}
  .grave .rip{font-size:12.5px;color:#6f6656;line-height:1.5;}
  .grave .cause{font-size:11.5px;color:#8a8170;margin-top:6px;font-style:italic;}
  .grave .tag{position:absolute;right:12px;top:10px;font-size:10px;font-weight:900;color:#a33;border:1.5px solid #a33;border-radius:3px;padding:1px 6px;transform:rotate(8deg);opacity:.8;}
  .crack{position:absolute;pointer-events:none;stroke:#8e8570;fill:none;opacity:.5;}
  footer{margin-top:40px;text-align:center;font-size:12px;color:#8a8170;line-height:1.7;}
  footer a{color:#7a7160;}
  .glitch{display:inline-block;animation:gl 4s infinite;}
  @keyframes gl{0%,96%,100%{transform:none;}97%{transform:translate(2px,-1px) skew(-8deg);}98%{transform:translate(-2px,1px);}}
</style>
</head>
<body>
<svg class="web tl" viewBox="0 0 100 100"><g fill="none" stroke="#5a5243" stroke-width=".8">
  <path d="M0 0 L100 0 M0 0 L0 100 M0 0 L100 100 M0 0 L100 45 M0 0 L45 100"/>
  <path d="M0 22 Q11 11 22 0 M0 45 Q22 22 45 0 M0 70 Q35 35 70 0 M0 95 Q47 47 95 0"/></g></svg>
<svg class="web br" viewBox="0 0 100 100"><g fill="none" stroke="#5a5243" stroke-width=".8">
  <path d="M0 0 L100 0 M0 0 L0 100 M0 0 L100 100 M0 0 L100 45 M0 0 L45 100"/>
  <path d="M0 22 Q11 11 22 0 M0 45 Q22 22 45 0 M0 70 Q35 35 70 0 M0 95 Q47 47 95 0"/></g></svg>

<div class="wrap">
  <a class="back" href="index.html">&larr; back to the living</a>
  <header>
    <div class="wordmark"><span class="dead">Deleted</span><span class="dot">🪦</span>Fun</div>
    <div class="sub">games that got <b>removed</b> from kai.fun. the files never left. nobody dusted.</div>
    <div id="count"></div>
  </header>
  <div id="graves"></div>
  <footer>
    <span class="glitch">everything here still runs. probably. some of it was never finished.</span><br>
    <a href="index.html">leave the cemetery</a>
  </footer>
</div>

<script>
const DEAD=[
  {f:"jobsim.html",n:"Job Simulator",rip:"apply to procedurally generated jobs, get rejection letters, get ghosted in real time, occasionally get hired.",cause:"replaced by frame perfects. which was also deleted."},
  {f:"frameperfects.html",n:"Frame Perfects",rip:"one frame-perfect click at every framerate from 1fps to 480fps. the window kept shrinking.",cause:"replaced by devicability."},
  {f:"scanify.html",n:"Scanify",rip:"photograph an object from 16 angles, cut it out, carve a real 3D model, download it.",cause:"lived for one message."},
  {f:"chess2.html",n:"chess²",rip:"chess, but more. an early experiment before hand chess existed.",cause:"hand chess ate it."},
  {f:"eyechess.html",n:"Eye Chess",rip:"chess controlled by looking at it. the eyes had other plans.",cause:"the webcam said no."},
  {f:"dig.html",n:"DIG",rip:"dig. keep digging. that's the game.",cause:"hit bedrock."},
  {f:"aiolympics.html",n:"AI Olympics",rip:"AIs competing in events nobody asked for.",cause:"the medals were never awarded."},
  {f:"internet-art-gallery.html",n:"Internet Art Gallery",rip:"a gallery of things from the internet, framed.",cause:"the curator left."},
  {f:"playground.html",n:"things i made",rip:"the page before there was a homepage. a list of experiments.",cause:"the homepage happened."},
  {f:"kai-fun.html",n:"Kai.fun (old)",rip:"an earlier version of the front page. same name, older dust.",cause:"superseded by index.html."},
];
const box=document.getElementById("graves");
DEAD.forEach((d,i)=>{
  const a=document.createElement("a"); a.className="grave"; a.href=d.f;
  a.innerHTML='<span class="tag">DELETED</span><div class="file">'+d.f+'</div><h2>'+d.n+'</h2>'+
    '<div class="rip">'+d.rip+'</div><div class="cause">cause of death: '+d.cause+'</div>'+
    '<svg class="crack" width="120" height="40" style="left:'+(10+ (i*37)%60)+'%;top:-6px"><path d="M0 0 L18 14 L12 26 L34 30 L28 40" stroke-width="1.5"/></svg>';
  box.appendChild(a);
});
document.getElementById("count").textContent=DEAD.length+" graves · last swept: never";
// dust
for(let i=0;i<28;i++){
  const d=document.createElement("div"); d.className="dust";
  d.style.left=Math.random()*100+"vw"; d.style.animationDuration=(9+Math.random()*14)+"s";
  d.style.animationDelay=(-Math.random()*20)+"s"; d.style.width=d.style.height=(2+Math.random()*3)+"px";
  document.body.appendChild(d);
}
</script>
</body>
</html>
