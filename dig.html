<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIG · Kai.fun</title>
<style>
  :root{
    --ink:#141414; --paper:#fff; --muted:#8a8a8a; --line:#e2e2e2;
    --coral:#ff6b5e; --sky:#4aa9d8; --moss:#6fb85c; --grape:#9b7fd4; --sun:#f5b829;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Trebuchet MS",system-ui,sans-serif;
    min-height:100vh;padding:16px 12px 40px;
  }
  .wrap{max-width:1060px;margin:0 auto;}
  .back{display:inline-block;text-decoration:none;color:var(--muted);font-size:14px;margin-bottom:6px;}
  .back:hover{color:var(--ink);}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
  .wordmark{
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
    font-weight:900;font-size:44px;transform:rotate(-1.5deg);line-height:.9;
  }
  .wordmark .d{color:#8a6f4d;} .wordmark .i{color:var(--sun);} .wordmark .g{color:var(--moss);}
  .tag{color:var(--muted);font-size:13px;}
  .cols{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  #left{flex:1 1 480px;min-width:320px;}
  #right{flex:1 1 340px;min-width:300px;}
  .card{
    border:2px solid var(--ink);border-radius:14px;background:#fff;
    box-shadow:4px 4px 0 var(--ink);padding:12px;margin-bottom:12px;

  canvas#shaft{width:100%;display:block;border:2px solid var(--ink);border-radius:12px;cursor:pointer;}
  #digBtn{
    width:100%;margin-top:10px;border:2px solid var(--ink);border-radius:12px;

  #digBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  #stats{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700;margin-top:8px;}
  #stats span b{color:var(--moss);}
  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tab{
    flex:1;border:2px solid var(--ink);border-radius:10px;background:#fff;
    font-family:inherit;font-weight:900;font-size:13px;padding:8px;cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);

  .tab.on{background:var(--sun);}
  .up{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;
    font-size:13px;
  }
  .up button{
    border:2px solid var(--ink);border-radius:9px;background:var(--moss);color:#fff;
    font-family:inherit;font-weight:900;font-size:12px;padding:6px 11px;cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);white-space:nowrap;

  .up button:disabled{opacity:.4;cursor:default;box-shadow:none;}
  .up .nm{font-weight:900;}
  .up .sub{color:var(--muted);font-size:11px;}
  #feed{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;}

    border-radius:9px;padding:5px 8px;font-size:12px;
  }
  .find canvas{flex:none;}
  .find .val{margin-left:auto;color:var(--moss);font-weight:900;white-space:nowrap;}
  .r5{border-color:#f5b829;background:#fffaf0;}
  .r6{border-color:#9b7fd4;background:#f8f4ff;}

    display:flex;align-items:center;gap:8px;border:2px solid var(--line);
    border-radius:9px;padding:6px 9px;margin-bottom:5px;font-size:12.5px;
  }
  .mat .sw{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);flex:none;}
  .mat .cnt{margin-left:auto;color:var(--muted);font-weight:700;white-space:nowrap;}
  .mat.locked{opacity:.42;}
  #toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;
    display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
  .toast{
    background:#141414;color:#fff;border-radius:10px;padding:9px 16px;
    font-size:13px;font-weight:700;box-shadow:3px 3px 0 rgba(0,0,0,.25);
    animation:tst 4s forwards;max-width:90vw;text-align:center;
  }
  @keyframes tst{0%{opacity:0;transform:translateY(-8px)}8%{opacity:1;transform:none}
    85%{opacity:1}100%{opacity:0}}
  .statRow{display:flex;justify-content:space-between;font-size:13px;padding:5px 2px;border-bottom:1px dashed var(--line);}
</style>

<script>
// ================= GEM CATALOG: 36 × 7 × 12 = 3,024 kinds =================
const MATS = [
["Quartz",0,"#cfc8e8",2],["Agate",0,"#c9a06b",3],["Jasper",0,"#b0503c",3],
["Amethyst",15,"#9b5fd0",6],["Citrine",15,"#e8b83a",6],["Onyx",25,"#3a3a44",7],
["Malachite",40,"#1f9e5f",9],["Turquoise",40,"#35c4c8",9],["Lapis Lazuli",60,"#2b4bd8",11],
["Moonstone",80,"#cfd8ea",12],["Garnet",100,"#a02440",14],["Peridot",130,"#9ac832",15],
["Topaz",170,"#e89a3a",17],["Aquamarine",220,"#6fd0e0",20],["Tourmaline",280,"#d05fa0",23],
["Opal",350,"#e0cff0",27],["Jade",430,"#3f9e6f",30],["Spinel",520,"#d04f6f",34],
["Zircon",620,"#8fb0e0",38],["Tanzanite",750,"#6f5fd0",45],["Morganite",900,"#f0a8b8",52],
["Kunzite",1100,"#e0a0e0",60],["Iolite",1300,"#5f6fd0",68],["Sunstone",1600,"#f08a4a",78],
["Fire Opal",2000,"#ff7a3a",92],["Sapphire",2500,"#2456d8",110],["Ruby",3000,"#d81f3f",130],
["Emerald",3600,"#14a85f",155],["Diamond",4300,"#dceafc",190],["Black Diamond",5200,"#23252d",240],
["Magmaglass",12262,"#ff5a2a",320],["Deepshard",20000,"#7a3af0",430],
["Voidstone",35000,"#2a2038",560],["Starlite",100000,"#baf0ff",760],
["Corestone",2891000,"#ffd23a",1100],["Heart of the World",5150000,"#ff3a8a",1700],
];
const QUALS = [
["Cracked",0.45,30],["Rough",0.75,26],["Polished",1.0,20],["Gleaming",1.6,12],
["Flawless",2.8,7],["Radiant",5,3.4],["Celestial",9,0.9],
];
const SHAPES = [
["Pebble",0.8,18],["Round",1.0,15],["Oval",1.0,14],["Teardrop",1.15,11],
["Hexagon",1.2,10],["Cushion",1.25,9],["Marquise",1.35,7],["Trillion",1.45,6],
["Shard",1.1,5],["Cluster",1.7,3],["Geode",2.2,1.6],["Star",3.0,0.4],
];
const TOTAL_KINDS = MATS.length*QUALS.length*SHAPES.length;
function kindId(m,q,sh){ return m*QUALS.length*SHAPES.length + q*SHAPES.length + sh; }
function gemName(m,q,sh){ return QUALS[q][0]+" "+MATS[m][0]+" "+SHAPES[sh][0]; }
function rarityTier(q,sh){  // 1..6 for feed styling
  const r = QUALS[q][2]*SHAPES[sh][2];
  if(r>300) return 1; if(r>100) return 2; if(r>30) return 3;
  if(r>7) return 4; if(r>1.5) return 5; return 6;
}
function pickWeighted(list, wIdx){
  let tot=0; for(const it of list) tot+=it[wIdx];
  let r=Math.random()*tot;
  for(let i=0;i<list.length;i++){ r-=list[i][wIdx]; if(r<=0) return i; }
  return list.length-1;
}

// ================= STATE =================
const S = {
  depth:0, money:0, gems:0, dug:0,
  tool:0, speedLv:0, clickLv:0, chanceLv:0, luckLv:0,
  disc:{},                // kindId -> [count, bestValue]
  bestFind:null,          // {name, val}
  ms:{},                  // milestones hit
  last:Date.now(), t0:Date.now(),
};
const TOOLS = [
["Rusty Trowel",0,0.4,0.3],["Shovel",25,1.2,0.8],["Pickaxe",140,3,1.8],
["Jackhammer",800,8,4],["Mini Excavator",4500,22,10],["Tunnel Borer",26000,60,25],
["Laser Drill",150000,170,70],["Plasma Bore",900000,500,200],["Quantum Auger",5500000,1500,600],
];
function digRate(){ return TOOLS[S.tool][2] * Math.pow(1.15, S.speedLv); }
function clickPow(){ return TOOLS[S.tool][3] * Math.pow(1.25, S.clickLv); }
function gemChance(){ return Math.min(0.9, 0.30 + S.chanceLv*0.04); }
function luck(){ return 1 + S.luckLv*0.25; }

const SAVE="dig_save_v1";
try{
  const d = JSON.parse(localStorage.getItem(SAVE));
  if(d) Object.assign(S, d);
}catch(e){}
function save(){ S.last=Date.now(); try{ localStorage.setItem(SAVE, JSON.stringify(S)); }catch(e){} }
setInterval(save, 5000);

// ================= MILESTONES (real-ish depths) =================
const MILES = [
[1.8,"deep enough for a grave 💀 (+$15)",15],
[6,"basement level (+$25)",25],
[12,"sewer mains (+$40)",40],
[20,"metro tunnel depth (+$70)",70],
[60,"Coober Pedy's underground homes (+$150)",150],
[105,"deepest metro station on Earth (+$300)",300],
[240,"deepest road tunnel (+$600)",600],
[1000,"ONE KILOMETER (+$2,000)",2000],
[1642,"the bottom of Lake Baikal (+$3,500)",3500],
[2200,"deepest cave ever explored (+$5,000)",5000],
[3900,"the Titanic rests here 🚢 (+$9,000)",9000],
[4000,"deepest gold mine (+$10,000)",10000],
[10935,"Mariana Trench depth (+$30,000)",30000],
[12262,"THE KOLA BOREHOLE — deepest hole humans ever made. you passed it. (+$100,000)",100000],
[35000,"the crust ends here (Moho) (+$300,000)",300000],
[100000,"asthenosphere — rock flows like taffy (+$1M)",1000000],
[660000,"lower mantle (+$5M)",5000000],
[2891000,"OUTER CORE — liquid iron ocean (+$40M)",40000000],
[5150000,"INNER CORE — solid metal ball (+$200M)",200000000],
[6371000,"🎉 THE CENTER OF THE EARTH 🎉 you did it. (+$1B)",1000000000],
];

// ================= GEM DRAWING =================
function drawGem(c, m, q, sh, px){
  const ctx2 = c.getContext("2d");
  ctx2.clearRect(0,0,px,px);
  const col = MATS[m][2];
  const bright = 0.35 + q*0.11;
  ctx2.save();
  ctx2.translate(px/2, px/2);
  const r = px*0.4;
  ctx2.fillStyle = col;
  ctx2.strokeStyle = "#141414";
  ctx2.lineWidth = 1.6;
  const shape = SHAPES[sh][0];
  ctx2.beginPath();
  if(shape==="Round"||shape==="Geode"){ ctx2.arc(0,0,r,0,Math.PI*2); }
  else if(shape==="Pebble"){ ctx2.ellipse(0,0,r,r*0.75,0.4,0,Math.PI*2); }
  else if(shape==="Oval"){ ctx2.ellipse(0,0,r*0.8,r,0,0,Math.PI*2); }
  else if(shape==="Teardrop"){
    ctx2.moveTo(0,-r); ctx2.quadraticCurveTo(r,0.2*r,0,r);
    ctx2.quadraticCurveTo(-r,0.2*r,0,-r);
  }
  else if(shape==="Hexagon"){ poly(ctx2,6,r,0); }
  else if(shape==="Cushion"){ rr(ctx2,-r*0.85,-r*0.85,r*1.7,r*1.7,r*0.4); }
  else if(shape==="Marquise"){
    ctx2.moveTo(0,-r); ctx2.quadraticCurveTo(r*0.95,0,0,r);
    ctx2.quadraticCurveTo(-r*0.95,0,0,-r);
  }
  else if(shape==="Trillion"){ poly(ctx2,3,r,-Math.PI/2); }
  else if(shape==="Shard"){
    ctx2.moveTo(-r*0.2,-r); ctx2.lineTo(r*0.7,-r*0.3); ctx2.lineTo(r*0.3,r*0.5);
    ctx2.lineTo(0,r); ctx2.lineTo(-r*0.6,r*0.2); ctx2.closePath();
  }
  else if(shape==="Cluster"){
    for(const [ox,oy,rr2] of [[-r*0.4,-r*0.2,r*0.5],[r*0.4,-r*0.25,r*0.45],[0,r*0.35,r*0.55]]){
      ctx2.moveTo(ox+rr2,oy); ctx2.arc(ox,oy,rr2,0,Math.PI*2);
    }
  }
  else if(shape==="Star"){
    for(let i=0;i<10;i++){
      const rr2 = i%2? r*0.45 : r;
      const a = i*Math.PI/5 - Math.PI/2;
      if(i===0) ctx2.moveTo(Math.cos(a)*rr2, Math.sin(a)*rr2);
      else ctx2.lineTo(Math.cos(a)*rr2, Math.sin(a)*rr2);
    }
    ctx2.closePath();
  }
  ctx2.fill(); ctx2.stroke();
  // facets & glint
  ctx2.globalAlpha = bright;
  ctx2.strokeStyle = "#ffffff";
  ctx2.lineWidth = 1;
  ctx2.beginPath();
  ctx2.moveTo(-r*0.5,-r*0.15); ctx2.lineTo(r*0.5,-r*0.35);
  ctx2.moveTo(-r*0.3,r*0.35); ctx2.lineTo(r*0.35,r*0.2);
  ctx2.stroke();
  ctx2.fillStyle="#fff";
  ctx2.beginPath(); ctx2.arc(-r*0.3,-r*0.35, r*0.14, 0, Math.PI*2); ctx2.fill();
  if(shape==="Geode"){
    ctx2.globalAlpha=0.9;
    ctx2.fillStyle="#fff";
    for(let i=0;i<6;i++){
      const a=Math.random()*Math.PI*2, rr2=Math.random()*r*0.5;
      ctx2.fillRect(Math.cos(a)*rr2, Math.sin(a)*rr2, 2, 2);
    }
  }
  ctx2.restore();
}
function poly(c2,n,r,rot){ for(let i=0;i<n;i++){ const a=rot+i*Math.PI*2/n;
  if(i===0)c2.moveTo(Math.cos(a)*r,Math.sin(a)*r); else c2.lineTo(Math.cos(a)*r,Math.sin(a)*r);} c2.closePath(); }
function rr(c2,x,y,w,h,r2){ c2.moveTo(x+r2,y); c2.arcTo(x+w,y,x+w,y+h,r2); c2.arcTo(x+w,y+h,x,y+h,r2);
  c2.arcTo(x,y+h,x,y,r2); c2.arcTo(x,y,x+w,y,r2); c2.closePath(); }

// ================= FINDING GEMS =================
function fmt(n){
  if(n>=1e9) return "$"+(n/1e9).toFixed(2)+"B";
  if(n>=1e6) return "$"+(n/1e6).toFixed(2)+"M";
  if(n>=1e4) return "$"+Math.round(n/1000)+"k";
  return "$"+Math.round(n).toLocaleString();
}
function fmtD(m){
  if(m>=1000) return (m/1000>=100? Math.round(m/1000).toLocaleString() : (m/1000).toFixed(2))+" km";
  return m.toFixed(m<10?1:0)+" m";
}
function findGem(depth, silent){
  // material: unlocked by depth, deeper = rarer
  const elig = [];
  MATS.forEach((mt,i)=>{ if(depth>=mt[1]) elig.push([i, 100/(i+2)+ (depth>=mt[1]*3?2:6)]); });
  const m = elig[pickWeighted(elig,1)][0];
  let q = pickWeighted(QUALS,2);
  // luck upgrades re-roll quality upward
  for(let i=1;i<luck();i++){ const q2=pickWeighted(QUALS,2); if(q2>q) q=q2; }
  const sh = pickWeighted(SHAPES,2);
  const sizeMM = Math.max(2, Math.round(3 + Math.pow(Math.random(),2.2)*(8+QUALS[q][1]*9)));
  const val = Math.max(1, Math.round(MATS[m][3] * QUALS[q][1] * SHAPES[sh][1]
    * Math.pow(sizeMM,1.5) * 0.35 * (1+depth/8000)));
  const id = kindId(m,q,sh);
  const isNew = !S.disc[id];
  if(!S.disc[id]) S.disc[id]=[0,0];
  S.disc[id][0]++; S.disc[id][1]=Math.max(S.disc[id][1], val);
  S.gems++; S.money += val;
  if(!S.bestFind || val > S.bestFind.val) S.bestFind = {name:sizeMM+"mm "+gemName(m,q,sh), val};
  if(!silent) feedAdd(m,q,sh,sizeMM,val,isNew);
  return val;
}
const feed = document.getElementById("feed");
function feedAdd(m,q,sh,sizeMM,val,isNew){
  const d = document.createElement("div");
  const tier = rarityTier(q,sh);
  d.className = "find"+(tier>=6?" r6":tier===5?" r5":"");
  const c = document.createElement("canvas");
  c.width=c.height=26;
  drawGem(c,m,q,sh,26);
  d.appendChild(c);
  const t = document.createElement("span");
  t.innerHTML = (isNew?"✨<b>NEW</b> ":"")+sizeMM+"mm "+gemName(m,q,sh);
  d.appendChild(t);
  const v = document.createElement("span");
  v.className="val"; v.textContent = fmt(val);
  d.appendChild(v);
  feed.prepend(d);
  while(feed.children.length>30) feed.removeChild(feed.lastChild);
}
function toast(msg){
  const t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}

// ================= DIGGING =================
let gemDebt = 0;
function advance(meters, silent){
  const before = S.depth;
  S.depth += meters; S.dug += meters;
  // gem rolls: expected finds accumulate with distance
  gemDebt += meters * gemChance() * 0.5;
  let rolls = 0;
  while(gemDebt >= 1 && rolls < (silent?400:6)){
    gemDebt -= 1; rolls++;
    findGem(S.depth, silent && rolls>3);
  }
  // milestones
  for(const [d, msg, cash] of MILES){
    if(before < d && S.depth >= d && !S.ms[d]){
      S.ms[d]=1; S.money += cash;
      toast("⬇️ "+fmtD(d)+" — "+msg);
    }
  }
  // new material unlocks
  for(const mt of MATS){
    if(before < mt[1] && S.depth >= mt[1] && mt[1]>0){
      toast("💎 new gem type below: "+mt[0].toUpperCase());
    }
  }
}

// offline progress
(function(){
  const away = Math.min(8*3600, (Date.now()-(S.last||Date.now()))/1000);
  if(away > 60){
    const m = digRate()*away;
    const before = S.money;
    advance(m, true);
    toast("⛏️ while you were gone: dug "+fmtD(m)+", earned "+fmt(S.money-before));
  }
})();

// ================= SHAFT VIEW =================
const cv = document.getElementById("shaft");
const ctx = cv.getContext("2d");
let anim = 0;
const ZONES = [
[0,"#7ec3e8","#8a6f4d"],[12,"#6fb0d8","#7a5f42"],[105,"#5a95c0","#6b5238"],
[1000,"#3a6a92","#5d4630"],[4300,"#22405c","#4f3c2a"],[12262,"#141e30","#43281f"],
[35000,"#0e1016","#552c1e"],[660000,"#0e1016","#7a2f16"],
[2891000,"#0e1016","#a83a10"],[5150000,"#0e1016","#d8641f"],
];
function zone(d){ let z=ZONES[0]; for(const zz of ZONES){ if(d>=zz[0]) z=zz; } return z; }
function drawShaft(dt){
  anim += dt;
  const Wc=520, Hc=430;
  const z = zone(S.depth);
  // sky/backdrop shifts with depth
  ctx.fillStyle = z[1]; ctx.fillRect(0,0,Wc,Hc);
  // dirt walls
  ctx.fillStyle = z[2];
  ctx.fillRect(0,0,185,Hc); ctx.fillRect(335,0,185,Hc);
  // strata lines scroll as you dig
  ctx.strokeStyle = "rgba(0,0,0,.18)"; ctx.lineWidth=2;
  const off = (S.depth*8)%46;
  for(let y=-off; y<Hc; y+=46){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(185,y+6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(335,y+3); ctx.lineTo(520,y-4); ctx.stroke();
  }
  // decorative wall gems
  ctx.globalAlpha=0.75;
  for(let i=0;i<7;i++){
    const gy = ((i*163 + S.depth*8)%(Hc+40))-20;
    const gx = i%2? 40+ (i*53)%120 : 350+(i*71)%140;
    const mi = Math.floor((i*7 + Math.floor(S.depth/50))% Math.min(MATS.length, 3+S.depth/40));
    ctx.fillStyle = MATS[Math.max(0,mi)][2];
    ctx.beginPath(); ctx.arc(gx, gy, 4, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  // shaft borders
  ctx.strokeStyle="#141414"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(185,0); ctx.lineTo(185,Hc); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(335,0); ctx.lineTo(335,Hc); ctx.stroke();
  // digger dude
  const bob = Math.sin(anim*9)*3;
  const dx=260, dy=200;
  ctx.fillStyle="#e8b98a";
  ctx.beginPath(); ctx.arc(dx, dy-26+bob*0.4, 9, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle="#141414"; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle="#f5b829";                       // helmet
  ctx.beginPath(); ctx.arc(dx, dy-29+bob*0.4, 9, Math.PI, 0); ctx.fill(); ctx.stroke();
  ctx.fillStyle="#4aa9d8";                       // body
  ctx.fillRect(dx-9, dy-16+bob*0.3, 18, 22); ctx.strokeRect(dx-9, dy-16+bob*0.3, 18, 22);
  // pick arm
  ctx.save();
  ctx.translate(dx+9, dy-10);
  ctx.rotate(Math.sin(anim*9)*0.9 - 0.5);
  ctx.strokeStyle="#8a6f4d"; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(22,-8); ctx.stroke();
  ctx.strokeStyle="#666"; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(18,-14); ctx.lineTo(28,-2); ctx.stroke();
  ctx.restore();
  // rubble
  ctx.fillStyle="#3a2f24";
  for(let i=0;i<5;i++){
    const ry=(anim*120 + i*77)%180;
    ctx.fillRect(215+(i*37)%90, 240+ry*0.9, 5, 5);
  }
  // depth counter
  ctx.fillStyle="rgba(255,255,255,.92)";
  ctx.fillRect(12,12,190,54);
  ctx.strokeStyle="#141414"; ctx.lineWidth=2; ctx.strokeRect(12,12,190,54);
  ctx.fillStyle="#141414"; ctx.font="900 24px Trebuchet MS";
  ctx.fillText(fmtD(S.depth), 22, 38);
  ctx.font="600 11px Trebuchet MS"; ctx.fillStyle="#666";
  const next = MILES.find(mm=>!S.ms[mm[0]] && mm[0]>S.depth);
  ctx.fillText(next? "next: "+fmtD(next[0]) : "you reached the center 🎉", 22, 56);
}
cv.addEventListener("pointerdown", manualDig);
document.getElementById("digBtn").addEventListener("click", manualDig);
function manualDig(){ advance(clickPow()); render(); }

// ================= SIDEBAR =================
let tab="shop";
document.querySelectorAll(".tab").forEach(b=>{
  b.onclick=()=>{ tab=b.dataset.t;
    document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
    renderPane(); };
});
const pane = document.getElementById("pane");
function upRow(name, sub, cost, can, fn){
  const d=document.createElement("div");
  d.className="up";
  d.innerHTML='<span><span class="nm">'+name+'</span><br><span class="sub">'+sub+'</span></span>';
  const b=document.createElement("button");
  b.textContent = cost===null? "MAX" : fmt(cost);
  b.disabled = cost===null || !can;
  b.onclick=fn;
  d.appendChild(b);
  return d;
}
function renderPane(){
  pane.innerHTML="";
  if(tab==="shop"){
    // tool
    if(S.tool < TOOLS.length-1){
      const nt=TOOLS[S.tool+1];
      pane.appendChild(upRow("⛏️ "+nt[0], nt[2]+" m/s auto · "+nt[3]+" m per click",
        nt[1], S.money>=nt[1], ()=>{ S.money-=nt[1]; S.tool++; toast("⛏️ upgraded to "+nt[0]+"!"); render(); }));
    }else pane.appendChild(upRow("⛏️ "+TOOLS[S.tool][0], "the final tool", null, false, null));
    const sc=Math.round(20*Math.pow(1.7,S.speedLv));
    pane.appendChild(upRow("⚡ Speed +15%","auto dig rate · lv "+S.speedLv, sc, S.money>=sc,
      ()=>{S.money-=sc;S.speedLv++;render();}));
    const cc=Math.round(15*Math.pow(1.8,S.clickLv));
    pane.appendChild(upRow("💪 Click power +25%","manual digs · lv "+S.clickLv, cc, S.money>=cc,
      ()=>{S.money-=cc;S.clickLv++;render();}));
    const gc=Math.round(40*Math.pow(2,S.chanceLv));
    pane.appendChild(upRow("🔍 Gem detector","+finds per meter · lv "+S.chanceLv+(gemChance()>=0.9?" (max)":""),
      gemChance()>=0.9?null:gc, S.money>=gc, ()=>{S.money-=gc;S.chanceLv++;render();}));
    const lc=Math.round(120*Math.pow(2.1,S.luckLv));
    pane.appendChild(upRow("🍀 Luck","re-rolls quality upward · lv "+S.luckLv, lc, S.money>=lc,
      ()=>{S.money-=lc;S.luckLv++;render();}));
  }else if(tab==="coll"){
    const perMat = QUALS.length*SHAPES.length;
    let discovered = Object.keys(S.disc).length;
    const hd=document.createElement("div");
    hd.style.cssText="font-weight:900;margin-bottom:8px;";
    hd.textContent="💎 "+discovered.toLocaleString()+" / "+TOTAL_KINDS.toLocaleString()+" kinds discovered";
    pane.appendChild(hd);
    const list=document.createElement("div"); list.id="collList";
    MATS.forEach((mt,mi)=>{
      const row=document.createElement("div");
      const unlocked = S.depth>=mt[1];
      row.className="mat"+(unlocked?"":" locked");
      let cnt=0, best=0;
      for(let q=0;q<QUALS.length;q++)for(let sh=0;sh<SHAPES.length;sh++){
        const d2=S.disc[kindId(mi,q,sh)];
        if(d2){ cnt++; best=Math.max(best,d2[1]); }
      }
      row.innerHTML='<span class="sw" style="background:'+mt[2]+'"></span>'
        +'<span>'+(unlocked? mt[0] : "??? ("+fmtD(mt[1])+")")+'</span>'
        +'<span class="cnt">'+(unlocked? cnt+"/"+perMat+(best?" · best "+fmt(best):"") : "🔒")+'</span>';
      list.appendChild(row);
    });
    pane.appendChild(list);
  }else{
    const rows=[
      ["deepest point", fmtD(S.depth)],
      ["total dug", fmtD(S.dug)],
      ["gems found", S.gems.toLocaleString()],
      ["kinds discovered", Object.keys(S.disc).length.toLocaleString()+" / "+TOTAL_KINDS.toLocaleString()],
      ["best find", S.bestFind? S.bestFind.name+" ("+fmt(S.bestFind.val)+")" : "—"],
      ["money", fmt(S.money)],
    ];
    rows.forEach(([a,b])=>{
      const d=document.createElement("div");
      d.className="statRow";
      d.innerHTML="<span>"+a+"</span><b>"+b+"</b>";
      pane.appendChild(d);
    });
    const rb=document.createElement("button");
    rb.className="tab"; rb.style.cssText="margin-top:10px;width:100%;color:#c62828;";
    rb.textContent="🗑 reset save";
    rb.onclick=()=>{ if(confirm("really wipe everything?")){ localStorage.removeItem(SAVE); location.reload(); } };
    pane.appendChild(rb);
  }
}
function render(){
  document.getElementById("sMoney").textContent = fmt(S.money);
  document.getElementById("sDepth").textContent = fmtD(S.depth);
  document.getElementById("sRate").textContent = digRate().toFixed(1)+" m/s";
  document.getElementById("sGems").textContent = S.gems.toLocaleString();
  renderPane();
}

// ================= MAIN LOOP =================
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.1,(now-last)/1000);
  last=now;
  advance(digRate()*dt);
  drawShaft(dt);
  // light HUD refresh
  document.getElementById("sMoney").textContent = fmt(S.money);
  document.getElementById("sDepth").textContent = fmtD(S.depth);
  document.getElementById("sGems").textContent = S.gems.toLocaleString();
}
render();
requestAnimationFrame(loop);
// refresh shop button states periodically
setInterval(()=>{ if(tab==="shop") renderPane(); }, 1200);
</script>
</body>
</html>
