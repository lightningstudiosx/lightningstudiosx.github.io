<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Service Hell</title>
<meta name="description" content="A deckbuilding roguelite set in the Underworld's call center. Calm furious customers with canned responses before their patience runs out, climb three floors of tickets to The Founder on his yacht, and collect 90+ cards, desk relics and your worst call transcripts.">
<meta name="theme-color" content="#2b0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Customer Service Hell: "Infernal Office '98". A late-90s desktop OS, recolored in blood, ember and ash.
   Beveled windows, gradient title bars, balloon tooltips; CRT scanlines, fluorescent flicker, red-ink stamps.
   Pixelify Sans for UI, Silkscreen for title bars, VT323 for readouts, Metal Mania for the infernal bits. */
:root {
  --desk: #2b0b0a; --desk2: #461410;
  --face: #c9bab1; --face2: #b6a49b; --well: #efe5dc;
  --hi: #fff6ee; --lt: #e6d7ce; --sh: #806a62; --dk: #1e110d;
  --ink: #1b0e0b; --ink2: #4a3530;
  --blood: #6d0909; --brim: #c8240f; --ember: #ff6f17; --sulfur: #ffd23f; --bone: #f6eadb; --ash: #3b2c28;
  --tip: #fff1bd; --calm: #3fb8ff; --stress: #ff3b2b; --san: #49d3bd; --comp: #7fa6ff; --phos: #7dff6a; --cash: #ffd23f;
  --talk: #b8170c; --action: #3e5a78; --policy: #6b2a8c; --junk: #6d625d; --curse: #2a1a28;
  --title: "Silkscreen", "Pixelify Sans", monospace;
  --ui: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --mono: "VT323", "Courier New", monospace;
  --hell: "Metal Mania", "Pixelify Sans", serif;
  --tb: linear-gradient(90deg, #5e0707, #b41f0c 55%, #ff7a1c);
  --tb-off: linear-gradient(90deg, #5b4a45, #9a8780);
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--desk); color: var(--ink); font-family: var(--ui); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none }
button { font: inherit; color: inherit; cursor: pointer }
img { image-rendering: pixelated }
canvas { image-rendering: pixelated }
b, strong { font-weight: 700 }

/* ---------- desktop ---------- */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); overflow: hidden;
  background:
    radial-gradient(ellipse 90% 55% at 50% 115%, rgba(255,96,24,.45), transparent 70%),
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(255,226,190,.10), transparent 70%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px),
    conic-gradient(from 45deg at 50% 50%, #2e0c0b, #3a100d, #2e0c0b, #3a100d, #2e0c0b);
}
#wall { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; opacity: .14 }
#wall svg { width: min(62vmin, 520px); height: auto }
#hud, #screen, #taskbar { min-width: 0 } #hud { grid-row: 1 } #screen { grid-row: 2; position: relative; min-height: 0; overflow: hidden } #taskbar { grid-row: 3 }
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden }
.scroll { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch }

/* fluorescent tube */
#tube { position: absolute; z-index: 1; top: 0; left: 50%; width: min(520px, 70vw); height: 6px; transform: translateX(-50%); border-radius: 0 0 4px 4px;
  background: #fff8ea; box-shadow: 0 0 18px 4px rgba(255,240,215,.55), 0 0 90px 30px rgba(255,220,180,.12); pointer-events: none }
#tube.flick { animation: tubeflick .5s steps(2) 1 }
@keyframes tubeflick { 0%,100% { opacity: 1 } 20% { opacity: .15 } 40% { opacity: .9 } 60% { opacity: .05 } 80% { opacity: .7 } }
#flicker { position: fixed; inset: 0; pointer-events: none; z-index: 80; background: rgba(255,244,226,.06); opacity: 0 }
#flicker.on { animation: roomflick .55s steps(2) 1 }
@keyframes roomflick { 0% { opacity: 0 } 15% { opacity: 1; background: rgba(0,0,0,.28) } 30% { opacity: 0 } 50% { opacity: 1; background: rgba(0,0,0,.18) } 70% { opacity: .4 } 100% { opacity: 0 } }
#crt { position: fixed; inset: 0; pointer-events: none; z-index: 90;
  background: radial-gradient(ellipse at center, transparent 58%, rgba(10,0,0,.55) 100%),
              repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply }
#crt::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(255,120,60,.06), transparent 65%) }

/* ---------- 98 chrome ---------- */
.win { position: relative; background: var(--face); border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi);
  box-shadow: inset -1px -1px var(--sh), inset 1px 1px var(--lt), 5px 7px 0 rgba(0,0,0,.38); color: var(--ink) }
.tb { display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 5px; background: var(--tb); color: #fff; font: 700 11px/1.15 var(--title); letter-spacing: .3px; min-height: 22px; text-shadow: 1px 1px 0 rgba(0,0,0,.45) }
.tb .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tb img { width: 16px; height: 16px; flex: none }
.tbx { display: flex; gap: 2px; flex: none }
.tbx i, .tbx button { width: 16px; height: 14px; display: grid; place-items: center; background: var(--face); color: var(--ink); font: 700 9px/1 var(--title); font-style: normal; border: 1px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); box-shadow: inset -1px -1px var(--sh); padding: 0; text-shadow: none }
.wb { padding: 10px }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; padding: 5px 14px; background: var(--face); color: var(--ink); font: 600 14px var(--ui);
  border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); box-shadow: inset -1px -1px var(--sh), inset 1px 1px var(--lt); outline: none; text-align: center }
.btn:focus-visible { outline: 1px dotted var(--ink); outline-offset: -5px }
.btn:active:not(:disabled), .btn.down { border-color: var(--dk) var(--hi) var(--hi) var(--dk); box-shadow: inset 1px 1px var(--sh); padding-top: 6px; padding-bottom: 4px }
.btn:disabled { color: var(--sh); text-shadow: 1px 1px 0 var(--hi); cursor: default }
.btn.hot { background: linear-gradient(#ffcf8a, #ff8a2a); }
.btn.big { min-height: 44px; font-size: 17px; padding: 8px 22px }
@media (hover: hover) { .btn:hover:not(:disabled) { background: #d8cbc2 } .btn.hot:hover:not(:disabled) { background: linear-gradient(#ffe0a8, #ff9a40) } }
.sunk { background: var(--well); border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); box-shadow: inset 1px 1px var(--dk) }
.bal { position: relative; background: var(--tip); color: var(--ink); border: 1px solid var(--ink); border-radius: 6px; padding: 5px 8px; box-shadow: 2px 2px 0 rgba(0,0,0,.35) }
.sep { height: 2px; border-top: 1px solid var(--sh); border-bottom: 1px solid var(--hi); margin: 8px 0 }
.k { color: var(--blood); font-weight: 700 }
.dim { color: var(--ink2) }
.hellf { font-family: var(--hell); font-weight: 400 }
.mono { font-family: var(--mono) }

/* ---------- taskbar ---------- */
#taskbar { position: relative; z-index: 60; display: flex; align-items: center; gap: 4px; height: calc(34px + env(safe-area-inset-bottom, 0px)); padding: 3px 4px calc(3px + env(safe-area-inset-bottom, 0px));
  background: var(--face); border-top: 2px solid var(--hi); box-shadow: inset 0 1px var(--lt) }
#startb { flex: none; height: 26px; padding: 0 8px 0 5px; font: 700 13px var(--title); display: flex; gap: 5px; align-items: center; min-height: 0 }
#startb img { width: 18px; height: 18px }
#tasks { flex: 1; min-width: 0; display: flex; gap: 4px; overflow: hidden }
#tasks .task { height: 26px; min-width: 0; max-width: 200px; flex: 0 1 200px; padding: 0 8px; font: 12px var(--ui); display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 0; justify-content: flex-start }
#tasks .task img { width: 14px; height: 14px }
#tray { flex: none; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px; border: 1px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); font: 15px var(--mono) }
.home { font: 600 12px var(--ui); color: var(--blood); text-decoration: none; padding: 1px 6px; border: 1px solid transparent; white-space: nowrap }
.home:hover, .home:focus-visible { border-color: var(--ink); background: var(--tip) }
#mute { width: 22px; height: 20px; padding: 0; background: none; border: 0; display: grid; place-items: center }
#mute img { width: 16px; height: 16px }
#clock { min-width: 54px; text-align: right }
#startmenu { position: absolute; z-index: 70; left: 4px; bottom: calc(36px + env(safe-area-inset-bottom, 0px)); width: 230px; display: flex }
#startmenu .side { width: 26px; background: linear-gradient(0deg, #ff7a1c, #6d0909); color: #fff; writing-mode: vertical-rl; transform: rotate(180deg); font: 400 18px var(--hell); padding: 8px 2px; letter-spacing: 1px }
#startmenu .items { flex: 1; padding: 3px }
#startmenu button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 7px 8px; border: 0; background: none; font: 14px var(--ui); text-align: left }
#startmenu button img { width: 20px; height: 20px }
#startmenu button:hover, #startmenu button:focus-visible { background: var(--blood); color: #fff; outline: none }

/* ---------- HUD ---------- */
#hud { position: relative; z-index: 20; display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; padding: 5px 8px; background: var(--face); border-bottom: 2px solid var(--dk); box-shadow: inset 0 -1px var(--sh), inset 0 1px var(--hi); font-size: 13px }
.hs { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 7px; white-space: nowrap }
.hs img { width: 16px; height: 16px }
.hs .num { font: 20px/1 var(--mono) }
#h-floor { font: 700 10px var(--title); color: var(--blood); max-width: 210px; white-space: normal; line-height: 1.1 }
#h-relics { display: flex; gap: 2px; flex: 1 1 120px; min-width: 60px; flex-wrap: wrap; align-items: center }
.relic { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; background: var(--face); border: 1px solid; border-color: var(--hi) var(--sh) var(--sh) var(--hi); position: relative }
.relic img { width: 24px; height: 24px }
.relic.used { filter: grayscale(1) brightness(.8) }
.relic .rc { position: absolute; right: -2px; bottom: -3px; font: 12px/1 var(--mono); background: var(--ink); color: var(--sulfur); padding: 0 2px }
.relic.pulse { animation: rpulse .6s ease-out }
@keyframes rpulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,210,63,.9) } 40% { transform: scale(1.35) } 100% { transform: scale(1); box-shadow: 0 0 0 12px rgba(255,210,63,0) } }
#h-snacks { display: flex; gap: 2px }
.snack { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; background: var(--well); border: 1px dashed var(--sh) }
.snack img { width: 22px; height: 22px }
.snack.full { border: 1px solid; border-color: var(--hi) var(--sh) var(--sh) var(--hi); background: var(--face) }
.hbtns { display: flex; gap: 4px; margin-left: auto }
.hbtns .btn { min-height: 26px; padding: 2px 8px; font-size: 12px }
.hbtns .btn img { width: 16px; height: 16px }

/* tooltip */
#tip { position: fixed; z-index: 120; max-width: 260px; pointer-events: none; font: 13px/1.3 var(--ui) }
#tip b { display: block; font: 700 11px var(--title); margin-bottom: 2px; color: var(--blood) }
#tip .tk { margin-top: 5px; padding-top: 4px; border-top: 1px dotted var(--sh); font-size: 12px }

/* ---------- title ---------- */
#s-title { justify-content: center; padding: 16px }
.icons { position: absolute; left: 10px; top: 12px; display: flex; flex-direction: column; gap: 10px; z-index: 2 }
.dico { width: 78px; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; color: #fff; font: 12px/1.15 var(--ui); text-shadow: 1px 1px 0 #000; padding: 4px 2px }
.dico img { width: 32px; height: 32px }
.dico:focus-visible span, .dico:hover span { background: var(--blood); outline: 1px dotted #fff }
.login { width: min(560px, 100%); z-index: 3 }
.login .hero { display: flex; gap: 14px; align-items: center; padding: 14px 14px 6px; background: linear-gradient(180deg, #1a0605, #3b0d0a); border-bottom: 2px solid var(--dk); position: relative; overflow: hidden }
.login .hero::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px); pointer-events: none }
.logo { flex: 1; min-width: 0; color: #ffcf6a }
.logo .l1 { font: 700 10px var(--title); letter-spacing: 2px; color: #ff9c5a }
.logo h1 { margin: 2px 0 0; font: 400 clamp(36px, 9vw, 62px)/.92 var(--hell); color: #ffdf8a; text-shadow: 0 0 6px #ff5a1a, 0 0 22px rgba(255,80,20,.8), 3px 3px 0 #5e0707; letter-spacing: 1px }
.logo h1 span { display: block; color: #ff5a2a; font-size: 1.08em; text-shadow: 0 0 8px #ff2a0a, 0 0 28px rgba(255,40,10,.9), 3px 3px 0 #2a0303 }
.logo .l3 { margin-top: 8px; font: 18px var(--mono); color: #ffb98a; letter-spacing: 1px }
.hero canvas { width: 120px; height: 120px; flex: none; z-index: 1; filter: drop-shadow(0 0 12px rgba(255,90,30,.5)) }
.login .wb { display: grid; gap: 8px }
.login .row { display: flex; gap: 8px; flex-wrap: wrap }
.login .row .btn { flex: 1 1 140px }
.motd { font: 18px/1.15 var(--mono); padding: 6px 8px; color: #7dff6a; background: #0d0806; border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); min-height: 48px }
.motd .cur { animation: blink 1s steps(2) infinite }
@keyframes blink { 50% { opacity: 0 } }
.fine { font-size: 11px; color: var(--ink2); text-align: center }

/* ---------- generic dialog screen windows ---------- */
.dlg { width: min(760px, calc(100% - 20px)); margin: auto; max-height: calc(100% - 20px); display: flex; flex-direction: column }
.dlg > .wb { overflow-y: auto; overflow-x: hidden; min-height: 0 }
.dlg h2 { margin: 0 0 6px; font: 400 28px/1 var(--hell); color: var(--blood) }
.dlg p { margin: 6px 0; font-size: 15px; line-height: 1.35 }
.choices { display: grid; gap: 7px; margin-top: 10px }
.choice { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 7px 12px; gap: 2px }
.choice .ce { font-size: 12px; color: var(--ink2) }
.choice:disabled .ce { color: var(--sh) }

/* ---------- character select ---------- */
.chars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.dossier { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; text-align: center; min-height: 0 }
.dossier canvas { width: 96px; height: 96px; background: #24100c; border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh) }
.dossier .dn { font: 700 12px var(--title); color: var(--blood) }
.dossier .dd { font-size: 12px; line-height: 1.25; color: var(--ink2) }
.dossier .ds { font: 16px var(--mono) }
.dossier.sel { background: #f1d9b8; outline: 2px dotted var(--blood); outline-offset: -6px }
.dossier.locked canvas { filter: brightness(.2) }
.dossier .stamp { position: absolute; top: 44px; left: 50%; transform: translateX(-50%) rotate(-14deg); font-size: 16px }
.cs-detail { margin-top: 10px; padding: 8px 10px; font-size: 14px; line-height: 1.35 }
.quota { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap }
.quota .btn { min-height: 28px; padding: 2px 10px }
.quota .qn { font: 22px var(--mono); min-width: 42px; text-align: center }
.quota .qd { flex: 1 1 200px; font-size: 12px; color: var(--ink2) }

/* ---------- stamp ---------- */
.stamp { display: inline-block; padding: 3px 10px; border: 4px double currentColor; color: #b3140a; font: 400 30px/1 var(--hell); letter-spacing: 2px; text-transform: uppercase; background: rgba(255,255,255,.04); border-radius: 4px; mix-blend-mode: multiply; text-shadow: none }
.stamp.big { position: fixed; z-index: 100; left: 50%; top: 42%; font-size: clamp(38px, 9vw, 86px); pointer-events: none; transform: translate(-50%, -50%) rotate(-12deg); animation: stampin .42s cubic-bezier(.2, 1.6, .4, 1) both; mix-blend-mode: normal; background: rgba(246,234,219,.82); box-shadow: 0 0 0 3px rgba(179,20,10,.4) }
.stamp.blue { color: #1f4f9a }
.stamp.ink { color: #1b0e0b }
.stamp.gold { color: #a86a00 }
@keyframes stampin { 0% { transform: translate(-50%, -50%) rotate(-4deg) scale(3); opacity: 0 } 60% { opacity: 1 } 100% { transform: translate(-50%, -50%) rotate(-12deg) scale(1) } }
.stamp.big.out { animation: stampout .4s ease-in both }
@keyframes stampout { to { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(.9) } }

/* ---------- cards ---------- */
.card { --w: 150px; --h: 206px; position: relative; width: var(--w); height: var(--h); flex: none; display: flex; flex-direction: column; background: var(--face); color: var(--ink);
  border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); box-shadow: inset -1px -1px var(--sh), inset 1px 1px var(--lt), 3px 4px 0 rgba(0,0,0,.4); font-size: 12.5px; cursor: pointer; transform-origin: 50% 85% }
.card .ctb { display: flex; align-items: center; min-height: 34px; padding: 2px 4px 2px 26px; background: var(--ct, var(--tb)); color: #fff; font: 700 10.5px/1.1 var(--title); text-shadow: 1px 1px 0 rgba(0,0,0,.5); letter-spacing: .2px }
.card .ctb .cn { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden }
.card .cost { position: absolute; z-index: 2; left: -8px; top: -9px; width: 30px; height: 30px; display: grid; place-items: center; font: 26px/1 var(--mono); color: #fff;
  background: radial-gradient(circle at 35% 30%, #8a4a2a, #3a1a0e 70%); border: 2px solid var(--sulfur); border-radius: 50% 50% 46% 46%; text-shadow: 0 0 4px #ff8a2a, 1px 1px 0 #000; box-shadow: 0 0 0 1px var(--ink), 2px 2px 0 rgba(0,0,0,.4) }
.card .cost.up { color: var(--phos) } .card .cost.dn { color: #ffd23f }
.card .cost.x { font-size: 22px }
.card .cbody { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 6px 6px 4px; min-height: 0 }
.card .art { display: flex; gap: 6px; align-items: center }
.card .art img { width: 36px; height: 36px; flex: none; background: var(--well); border: 1px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); padding: 1px }
.card .art .tag { font: 700 9px/1.1 var(--title); color: var(--ink2); text-transform: uppercase }
.card .art .tag i { display: block; font-style: normal; color: var(--blood); font-size: 8.5px; margin-top: 2px }
.card .ctx { flex: 1; font: 500 12.5px/1.2 var(--ui); padding: 4px 5px; background: var(--well); border: 1px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); overflow: hidden }
.card .ctx .v { font-weight: 700 } .card .ctx .v.up { color: #0b7a2a } .card .ctx .v.dn { color: #b3140a }
.card .ctx .kw { color: var(--blood); font-weight: 700 }
.card .cft { display: flex; align-items: center; justify-content: space-between; padding: 0 5px 5px; gap: 4px }
.card .cbtn { font: 600 10.5px var(--ui); padding: 1px 10px; border: 1px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); box-shadow: inset -1px -1px var(--sh); background: var(--face) }
.card .gem { width: 10px; height: 10px; transform: rotate(45deg); border: 1px solid var(--ink); background: #8a7d77 }
.card.r-uncommon .gem { background: #3fb8ff } .card.r-rare .gem { background: var(--sulfur); box-shadow: 0 0 6px var(--sulfur) } .card.r-basic .gem { background: var(--face2) } .card.r-token .gem { background: var(--phos) }
.card.t-talk { --ct: linear-gradient(90deg, #6d0909, #c8240f 60%, #ff6a1a) }
.card.t-action { --ct: linear-gradient(90deg, #1f2d40, #3e5a78 60%, #7d97b3) }
.card.t-policy { --ct: linear-gradient(90deg, #2d0d3d, #6b2a8c 60%, #c45ad6) }
.card.t-junk { --ct: linear-gradient(90deg, #3e3532, #6d625d 60%, #9a8f89); background: #b9b0aa }
.card.t-curse { --ct: linear-gradient(90deg, #000, #2a1a28 60%, #5a1a3a); background: #9a8a92 }
.card.t-junk .ctx, .card.t-curse .ctx { background: #ddd5cf }
.card.up .ctb .cn::after { content: " +"; color: var(--phos) }
.card.unplayable { cursor: default }
.card.dis { filter: saturate(.35) brightness(.88) }
.card.r-rare { box-shadow: inset -1px -1px var(--sh), inset 1px 1px var(--lt), 3px 4px 0 rgba(0,0,0,.4), 0 0 0 1px #ffd23f88 }
.card.unseen { filter: grayscale(1) brightness(.35) contrast(.8); cursor: default }
.card.unseen .ctx, .card.unseen .cn { visibility: hidden }
.card.unseen::after { content: "???"; position: absolute; inset: 0; display: grid; place-items: center; font: 400 36px var(--hell); color: #fff }

.card.mini { --w: 122px; --h: 168px; font-size: 11px }
.card.mini .ctb { font-size: 9px; min-height: 29px; padding-left: 22px }
.card.mini .cost { width: 25px; height: 25px; font-size: 21px; left: -6px; top: -7px }
.card.mini .art img { width: 28px; height: 28px }
.card.mini .ctx { font-size: 11px }
.card.mini .art .tag { font-size: 8px }

/* ---------- map ---------- */
#s-map { padding: 8px }
.mapwin { width: min(820px, 100%); flex: 1; min-height: 0; display: flex; flex-direction: column }
.mapwin .menubar { display: flex; gap: 12px; padding: 3px 8px; font-size: 13px; border-bottom: 1px solid var(--sh) }
.mapwin .menubar span:first-letter { text-decoration: underline }
.mapbody { flex: 1; min-height: 0; display: flex; gap: 0 }
.mapscroll { flex: 1; min-width: 0; position: relative; margin: 4px; background: #f3e6d8; background-image: linear-gradient(rgba(109,9,9,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(109,9,9,.07) 1px, transparent 1px); background-size: 24px 24px }
.mapscroll svg { display: block; margin: 0 auto }
.legend { width: 150px; flex: none; margin: 4px 4px 4px 0; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 6px }
.legend div { display: flex; align-items: center; gap: 6px }
.legend img { width: 20px; height: 20px }
.legend h4 { margin: 0; font: 700 10px var(--title); color: var(--blood) }
.mapnode { cursor: default }
.mapnode.avail { cursor: pointer }
.mapnode.avail .ring { animation: ring 1.1s linear infinite; stroke-dasharray: 5 4 }
@keyframes ring { 0% { stroke-dashoffset: 0; fill-opacity: .25 } 50% { fill-opacity: .55 } 100% { stroke-dashoffset: -18; fill-opacity: .25 } }
.mapnode text { font: 11px var(--ui); fill: var(--ink) }
.statusbar { display: flex; gap: 4px; padding: 2px }
.statusbar > div { flex: 1; padding: 2px 6px; font-size: 12px; border: 1px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

/* ---------- call (combat) ---------- */
#s-call { display: flex; flex-direction: column; align-items: stretch }
.arena { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px 8px 4px }
.lines { display: flex; justify-content: center; align-items: flex-end; gap: 14px; width: 100%; max-width: 980px }
.cust { width: 220px; flex: 0 1 220px; min-width: 0; transition: transform .15s, opacity .4s; cursor: default }
.cust .tb { font-size: 10px; min-height: 20px }
.cust .tb .tm { font: 15px/1 var(--mono); font-weight: 400 }
.cust .cb { padding: 6px; display: flex; flex-direction: column; gap: 5px; align-items: stretch }
.cust .intent { min-height: 44px; display: flex; align-items: center; gap: 6px; font: 600 12px/1.15 var(--ui); padding: 4px 7px; cursor: help }
.cust .intent::after { content: ""; position: absolute; left: 22px; bottom: -8px; border: 8px solid transparent; border-top-color: var(--ink); border-bottom: 0 }
.cust .intent::before { content: ""; position: absolute; left: 23px; bottom: -6px; border: 7px solid transparent; border-top-color: var(--tip); border-bottom: 0; z-index: 1 }
.cust .intent img { width: 24px; height: 24px; flex: none }
.cust .intent .iv { font: 24px/1 var(--mono); color: var(--brim); white-space: nowrap }
.cust .intent .il { flex: 1; min-width: 0 }
.cust .intent.hold { opacity: .6; text-decoration: line-through }
.cust .row1 { display: flex; gap: 7px; align-items: center }
.cust .face { position: relative; width: 96px; height: 96px; flex: none; background: #1a0807; border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); overflow: hidden }
.cust .face canvas { width: 100%; height: 100%; display: block }
.cust .face .static { position: absolute; inset: 0; opacity: 0; pointer-events: none }
.cust .face .static.on { opacity: .85 }
.cust .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px }
.cust .cname { font: 700 13px/1.1 var(--ui) }
.cust .role { font: 700 9px var(--title); color: var(--blood) }
.cust .quirk { font-size: 11px; line-height: 1.15; color: var(--ink2); padding: 2px 4px; border: 1px dotted var(--sh); background: rgba(255,255,255,.25); cursor: help }
.bar { position: relative; height: 18px; padding: 2px; background: var(--well); border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); overflow: hidden }
.bar .fill, .bar .ghost { position: absolute; left: 2px; top: 2px; bottom: 2px; transition: width .35s ease-out }
.bar .ghost { background: #fff; transition: width .6s .35s ease-in; opacity: .9 }
.bar .fill { --seg: #c8240f; background: repeating-linear-gradient(90deg, var(--seg) 0 7px, transparent 7px 9px) }
.bar .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4px; font: 16px/1 var(--mono); color: var(--ink); text-shadow: 0 0 2px var(--well), 0 0 3px var(--well) }
.bar.anger .fill { --seg: #d52a10 }
.bar.anger.hi .fill { --seg: #ff3d00; animation: hotbar .5s steps(2) infinite }
@keyframes hotbar { 50% { filter: brightness(1.3) } }
.pat { display: flex; align-items: center; gap: 4px; font: 700 9px var(--title) }
.pat .pips { flex: 1; display: flex; gap: 2px; flex-wrap: wrap }
.pat .pips i { width: 8px; height: 12px; background: var(--sulfur); border: 1px solid var(--ink); flex: none }
.pat .pips i.off { background: transparent; border-color: var(--sh) }
.pat .pn { font: 18px/1 var(--mono); min-width: 18px; text-align: right }
.pat.low .pips i:not(.off) { background: var(--stress); animation: blink .6s steps(2) infinite }
.pat.low .pn { color: var(--stress) }
.sts { display: flex; gap: 3px; flex-wrap: wrap; min-height: 18px }
.st { display: inline-flex; align-items: center; gap: 2px; height: 18px; padding: 0 4px; font: 700 8.5px/1 var(--title); color: #fff; background: var(--ash); border: 1px solid var(--ink); cursor: help; white-space: nowrap }
.st b { font: 15px/1 var(--mono); font-weight: 400 }
.st.placated { background: #1f6f8a } .st.confused { background: #6b2a8c } .st.furious { background: #c8240f } .st.onhold { background: #b88a00 } .st.stubborn { background: #5b5450 } .st.signal { background: #000; color: #9f9 }
.st.rapport { background: #a8540a } .st.thick { background: #3e5a78 } .st.frazzled { background: #7a4a8a } .st.rattled { background: #8a1a1a } .st.muted { background: #222 } .st.power { background: #4a2a5a }
.cust.targetable { cursor: pointer }
.cust.targetable .face { outline: 3px solid var(--sulfur); outline-offset: 1px; animation: tglow 0.9s ease-in-out infinite }
@keyframes tglow { 50% { outline-color: var(--ember) } }
.cust.dead { opacity: .0; transform: translateY(40px) scale(.6); pointer-events: none }
.cust.shake { animation: shake .38s }
.cust.lunge { animation: lunge .4s }
@keyframes shake { 0%,100% { transform: translateX(0) } 15% { transform: translateX(-7px) rotate(-1deg) } 35% { transform: translateX(6px) rotate(1deg) } 55% { transform: translateX(-4px) } 75% { transform: translateX(3px) } }
@keyframes lunge { 0%,100% { transform: translateY(0) scale(1) } 40% { transform: translateY(16px) scale(1.06) } }
.cust.minion { width: 176px; flex-basis: 176px }
.cust.minion .face { width: 72px; height: 72px }
.cust.boss { width: 280px; flex-basis: 280px }
.cust.boss .face { width: 128px; height: 128px }
.cust.boss .tb { background: linear-gradient(90deg, #000, #6d0909 50%, #ff3d00) }
.cust.boss .cname { font: 400 20px/1 var(--hell); color: var(--blood) }

.ticker { position: relative; width: min(980px, 100%); margin-top: 8px; height: 26px; padding: 3px 8px; font: 17px/18px var(--mono); color: var(--phos); background: #0d0806; border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer }
.ticker .who { color: #ffb98a }
.logwin { position: absolute; z-index: 50; right: 8px; bottom: 8px; width: min(420px, calc(100% - 16px)); max-height: 60%; display: flex; flex-direction: column }
.logwin .lb { overflow-y: auto; padding: 6px 8px; font: 17px/1.15 var(--mono); background: #0d0806; color: var(--phos); flex: 1; min-height: 80px }
.logwin .lb .who { color: #ffb98a }
.logwin .lb .sys { color: #ff6f6f }
.logwin.dock { top: 10px; bottom: auto; right: 10px; width: 300px; height: calc(100% - 20px); max-height: none; z-index: 4 }
.logwin.dock .lb { font-size: 16px }
.arena.docked { padding-right: 320px }
.arena.docked .ticker { display: none }
@media (min-width: 1100px) { .cust { width: 250px; flex-basis: 250px } .cust .face { width: 112px; height: 112px } .cust.boss { width: 320px; flex-basis: 320px } .cust.boss .face { width: 150px; height: 150px } .cust.minion { width: 190px; flex-basis: 190px } .cust.minion .face { width: 80px; height: 80px } }

.saybub { position: absolute; z-index: 30; left: 50%; bottom: 6px; transform: translateX(-50%); max-width: min(520px, 92%); padding: 6px 10px; font: 600 14px/1.25 var(--ui); pointer-events: none; animation: sayin .25s ease-out both }
.saybub::after { content: ""; position: absolute; left: 30px; bottom: -9px; border: 9px solid transparent; border-top-color: var(--ink); border-bottom: 0 }
.saybub::before { content: ""; position: absolute; left: 31px; bottom: -7px; border: 8px solid transparent; border-top-color: var(--tip); border-bottom: 0; z-index: 1 }
.saybub.cust-say { bottom: auto; top: 4px; background: #ffe0d0 }
.saybub.cust-say::after, .saybub.cust-say::before { display: none }
@keyframes sayin { from { opacity: 0; transform: translateX(-50%) translateY(8px) } }

.desk { position: relative; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: linear-gradient(#5a3a2e, #3d2620); border-top: 2px solid #8a5a44; box-shadow: inset 0 2px 0 rgba(255,255,255,.12); color: var(--bone) }
.mugbox { position: relative; width: 58px; height: 52px; flex: none; display: grid; place-items: center; cursor: help }
.mugbox canvas { position: absolute; inset: 0; width: 58px; height: 52px }
.mugbox .cn { position: relative; z-index: 1; font: 30px/1 var(--mono); color: #fff; text-shadow: 0 0 4px #ff8a2a, 2px 2px 0 #000; margin: 6px 8px 0 0 }
.mugbox.empty .cn { color: #ff8a7a }
.mugbox.pulse { animation: rpulse .5s }
.agent { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0 }
.agent canvas { width: 46px; height: 46px; flex: none; border: 2px solid; border-color: #2a1a14 #a87a60 #a87a60 #2a1a14; background: #1a0807 }
.agent .av { flex: 1; min-width: 0; max-width: 340px; display: flex; flex-direction: column; gap: 3px }
.agent .bar { height: 18px; border-color: #2a1a14 #a87a60 #a87a60 #2a1a14 }
.agent .bar.san .fill { --seg: var(--san) }
.agent .bar.san.lowsan .fill { --seg: #ff6a4a }
.comp { position: relative; width: 42px; height: 44px; flex: none; display: grid; place-items: center; cursor: help; transition: transform .15s }
.comp canvas { position: absolute; inset: 0; width: 42px; height: 44px }
.comp .cn { position: relative; font: 24px/1 var(--mono); color: #fff; text-shadow: 1px 1px 0 #000, 0 0 4px #000 }
.comp.zero { opacity: .35 }
.comp.pulse { animation: rpulse .45s }
.piles { display: flex; gap: 6px; flex: none }
.pile { width: 46px; height: 46px; padding: 0; position: relative; display: grid; place-items: center; min-height: 0 }
.pile img { width: 26px; height: 26px }
.pile .pn { position: absolute; right: 1px; bottom: 0; font: 16px/1 var(--mono); color: var(--ink) }
.endturn { min-width: 112px; min-height: 46px; font: 700 13px var(--title); }
.endturn.ready { animation: endpulse 1.2s ease-in-out infinite }
@keyframes endpulse { 50% { background: #ffd9a0 } }

.handzone { position: relative; z-index: 6; height: 178px; flex: none; background: linear-gradient(#3d2620, #24140f); }
.hand { position: absolute; left: 0; right: 0; bottom: 0; height: 100% }
.hand .card { position: absolute; left: 50%; bottom: -26px; margin-left: calc(var(--w) / -2); transform: translate(var(--x, 0px), var(--y, 0px)) rotate(var(--r, 0deg)); transition: transform .22s cubic-bezier(.2,.8,.3,1.1), filter .2s; will-change: transform }
.hand .card.fresh { transition: none }
@media (hover: hover) { .hand .card:not(.sel):hover { transform: translate(var(--x), calc(var(--y) - 46px)) rotate(0deg) scale(1.12); z-index: 40 !important } }
.hand .card.sel { transform: translate(var(--x), calc(var(--y) - 64px)) rotate(0deg) scale(1.16); z-index: 45 !important; box-shadow: 0 0 0 3px var(--sulfur), 0 0 22px 6px rgba(255,140,40,.7) }
.hand .card.playable .cost { box-shadow: 0 0 0 1px var(--ink), 0 0 10px 2px rgba(255,210,63,.75) }
.hand .card.dragging { transition: none; z-index: 60 !important; pointer-events: none }
.handhint { position: absolute; z-index: 70; left: 50%; top: -28px; transform: translateX(-50%); padding: 3px 10px; font: 13px var(--ui); white-space: nowrap; pointer-events: none }
.flycard { position: fixed; z-index: 95; pointer-events: none; left: 0; top: 0; margin: 0 !important }

.glossary { position: fixed; z-index: 110; width: 220px; display: flex; flex-direction: column; gap: 4px; pointer-events: none }
.glossary .bal { font-size: 12px; line-height: 1.25 }
.glossary .bal b { color: var(--blood); font: 700 10px var(--title); display: block }

/* floaters + fx */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 96; pointer-events: none }
#floaters { position: fixed; inset: 0; z-index: 97; pointer-events: none; overflow: hidden }
.flt { position: absolute; transform: translate(-50%, -50%); font: 38px/1 var(--mono); color: #fff; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 0 0 8px currentColor; white-space: nowrap; animation: fltup 1.1s ease-out forwards }
.flt.calm { color: #7fd8ff } .flt.stress { color: #ff4a3a; font-size: 44px } .flt.block { color: #b8c8ff; font-size: 30px } .flt.heal { color: #7dff6a } .flt.anger { color: #ff8a2a } .flt.info { font: 700 14px var(--title); color: var(--sulfur) } .flt.cash { color: var(--cash) } .flt.pat { color: var(--sulfur); font-size: 30px }
@keyframes fltup { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6) } 12% { opacity: 1; transform: translate(-50%, -60%) scale(1.25) } 30% { transform: translate(-50%, -80%) scale(1) } 100% { opacity: 0; transform: translate(-50%, -190%) } }
#app.shake { animation: scrshake .42s }
#app.shake2 { animation: scrshake2 .6s }
@keyframes scrshake { 0%,100% { transform: none } 20% { transform: translate(-6px, 3px) } 40% { transform: translate(5px, -4px) } 60% { transform: translate(-3px, 2px) } 80% { transform: translate(2px, -1px) } }
@keyframes scrshake2 { 0%,100% { transform: none } 10% { transform: translate(-12px, 6px) rotate(-.5deg) } 30% { transform: translate(10px, -8px) rotate(.5deg) } 50% { transform: translate(-8px, 4px) } 70% { transform: translate(5px, -3px) } 90% { transform: translate(-2px, 1px) } }
.hurtflash { position: fixed; inset: 0; z-index: 94; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,20,0,.5)); animation: hurt .5s ease-out forwards }
@keyframes hurt { from { opacity: 1 } to { opacity: 0 } }
.staticfull { position: fixed; inset: 0; z-index: 93; pointer-events: none; opacity: .5 }

/* ---------- reward inbox ---------- */
.inbox .mail { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; text-align: left; border: 0; border-bottom: 1px solid var(--lt); background: var(--well); font-size: 14px; min-height: 0; justify-content: flex-start; box-shadow: none }
.inbox .mail:hover:not(:disabled) { background: #fbe3c6 }
.inbox .mail img { width: 28px; height: 28px; flex: none }
.inbox .mail .ms { flex: 1; min-width: 0 }
.inbox .mail .ms b { display: block; font-size: 14px }
.inbox .mail .ms span { font-size: 12px; color: var(--ink2) }
.inbox .mail.read { opacity: .45; font-weight: 400 }
.inbox .mail.read b::before { content: "✓ "; color: #0b7a2a }
.inbox .hdr { display: flex; font: 700 10px var(--title); color: var(--ink2); padding: 3px 10px; background: var(--face2); border-bottom: 1px solid var(--sh) }
.cardrow { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; padding: 8px 0 }
.cardrow .card { cursor: pointer }
@media (hover: hover) { .cardrow .card:hover, .grid .card.pick:hover { transform: translateY(-6px) scale(1.04) } }
.cardrow .card, .grid .card { transition: transform .15s }
.ticket { font: 17px var(--mono); color: var(--ink2) }

/* ---------- grid modal ---------- */
#modal { position: fixed; inset: 0; z-index: 85; display: flex; align-items: center; justify-content: center; padding: 10px; background: rgba(20,4,2,.55) }
#modal > .win { width: min(980px, 100%); max-height: 100%; display: flex; flex-direction: column }
#modal .wb { overflow-y: auto; overflow-x: hidden; min-height: 0 }
.grid { display: flex; flex-wrap: wrap; gap: 14px 10px; justify-content: center; padding: 6px 2px }
.grid .card.pick { cursor: pointer }
.grid .card.chosen { outline: 3px solid var(--sulfur); outline-offset: 2px }
.tabs { display: flex; gap: 0; padding: 6px 8px 0; flex-wrap: wrap }
.tabs button { padding: 4px 12px; border: 2px solid; border-bottom: 0; border-color: var(--hi) var(--dk) transparent var(--hi); background: var(--face); font: 13px var(--ui); margin-right: -2px; position: relative; top: 2px }
.tabs button.on { top: 0; padding-bottom: 6px; z-index: 1; font-weight: 700 }
.tabpane { border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); margin: 0 8px 8px; padding: 8px; min-height: 0; overflow-y: auto; overflow-x: hidden; flex: 1 }
.filters { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; align-items: center }
.filters .btn { min-height: 26px; padding: 2px 9px; font-size: 12px }
.filters .btn.on { border-color: var(--dk) var(--hi) var(--hi) var(--dk); background: var(--face2); font-weight: 700 }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px }
.shelf .ri { display: flex; gap: 8px; align-items: flex-start; padding: 6px; font-size: 12px; line-height: 1.2; background: var(--well); border: 1px solid var(--sh) }
.shelf .ri img { width: 32px; height: 32px; flex: none }
.shelf .ri b { display: block; font-size: 12.5px }
.shelf .ri.unseen { opacity: .5 } .shelf .ri.unseen img { filter: brightness(0) }
.shelf .ri .tier { font: 700 8px var(--title); color: var(--blood) }
.trlist { display: grid; gap: 6px }
.trlist button { text-align: left; justify-content: flex-start; font-size: 13px; padding: 6px 10px }
.trlist button img { width: 20px; height: 20px }
.notepad { font: 18px/1.2 var(--mono); background: #fff; color: #111; padding: 8px 10px; white-space: pre-wrap; border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); max-height: 52vh; overflow-y: auto; user-select: text; -webkit-user-select: text }
.records { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px }
.records > div { padding: 8px; background: var(--well); border: 1px solid var(--sh); font-size: 13px }
.records b { display: block; font: 26px var(--mono); color: var(--blood) }

/* ---------- shop / rest / event ---------- */
.vend { width: min(900px, calc(100% - 16px)); margin: auto; max-height: calc(100% - 16px); display: flex; flex-direction: column }
.vend .wb { overflow-y: auto; overflow-x: hidden }
.vendbody { display: flex; gap: 10px }
.glass { flex: 1; min-width: 0; padding: 10px; background: linear-gradient(135deg, rgba(255,255,255,.12), transparent 40%), #1b0a08; border: 3px solid; border-color: #555 #999 #999 #555; box-shadow: inset 0 0 30px rgba(255,100,40,.25) }
.glass h4 { margin: 4px 0 8px; font: 700 10px var(--title); color: #ffb98a }
.slots { display: flex; flex-wrap: wrap; gap: 14px 10px; justify-content: center; margin-bottom: 12px }
.slot { display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative }
.slot .tagp { font: 18px/1 var(--mono); color: var(--cash); background: #000; padding: 1px 6px; border: 1px solid #555 }
.slot .tagp.no { color: #888; text-decoration: line-through }
.slot .code { position: absolute; top: -8px; right: -6px; z-index: 3; font: 700 9px var(--title); background: var(--sulfur); padding: 1px 3px; border: 1px solid var(--ink) }
.slot.sold { opacity: .25; pointer-events: none }
.slot .sale { position: absolute; top: 40px; left: 50%; transform: translateX(-50%) rotate(-12deg); z-index: 3; font-size: 15px; background: rgba(255,255,255,.9) }
.slot .ritem { width: 86px; height: 86px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; background: var(--well); border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi); font-size: 10.5px; line-height: 1.05; text-align: center; cursor: pointer }
.slot .ritem img { width: 36px; height: 36px }
.keypad { width: 150px; flex: none; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: linear-gradient(#a8a09a, #8a807a); border: 2px solid; border-color: var(--hi) var(--dk) var(--dk) var(--hi) }
.keypad .lcd { font: 20px/1.05 var(--mono); color: #7dff6a; background: #0a1a08; padding: 6px; min-height: 96px; border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh); word-break: break-word }
.keypad .slotdoor { height: 46px; background: #111; border: 3px solid #555; border-radius: 3px; box-shadow: inset 0 6px 10px #000 }
.restopts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px }
.restopt { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px; text-align: center; min-height: 0 }
.restopt img { width: 48px; height: 48px }
.restopt b { font: 700 12px var(--title) }
.restopt span { font-size: 13px; color: var(--ink2) }
.scene { width: 220px; max-width: 100%; height: 170px; margin: 0 auto; display: block; background: #1a0807; border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh) }
.evtop { display: flex; gap: 12px; align-items: flex-start }
.evtop .scene { width: 220px; height: 170px; flex: none }
.evres { margin-top: 10px; padding: 8px 10px; font-size: 14px }

/* ---------- misc ---------- */
.cardpick-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap }
.preview2 { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 10px; flex-wrap: wrap }
.arrow { font: 40px var(--mono); color: var(--blood) }
.endscr .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; margin: 10px 0 }
.endscr .stats div { background: var(--well); border: 1px solid var(--sh); padding: 6px 8px; font-size: 13px }
.endscr .stats b { display: block; font: 24px var(--mono) }
.unlock { margin-top: 8px; padding: 8px 10px; background: #fff1bd; border: 2px dashed var(--blood); font-size: 14px }
.toast { position: fixed; z-index: 105; right: 10px; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100% - 20px)); animation: toastin .3s ease-out both }
.toast .wb { display: flex; gap: 10px; align-items: center; font-size: 13px; padding: 8px }
.toast img { width: 32px; height: 32px }
@keyframes toastin { from { transform: translateY(30px); opacity: 0 } }

/* reduced motion / no flicker */
body.calm #tube.flick, body.calm #flicker.on { animation: none }
body.calm #app.shake, body.calm #app.shake2 { animation: none }

/* ===================== ART: icons, portraits, particles ===================== */
const ART = (() => {
  const cache = {};
  const hex2 = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
  const rgb = (a) => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const mix = (a, b, t) => { const A = hex2(a), B = hex2(b); return rgb(A.map((v, i) => v + (B[i] - v) * t)); };
  const dark = (a, t) => mix(a, '#000000', t);
  const lite = (a, t) => mix(a, '#ffffff', t);
  const OUT = '#1a0f0d';

  function parseIcon(name) {
    const src = ICONS[name] || ICONS.help;
    return src.split('\n').map(r => r.trim()).filter(r => r.length).map(r => (r + '................').slice(0, 16)).slice(0, 16);
  }
  function iconCanvas(name, sw, outline = true) {
    const rows = parseIcon(name);
    const cv = document.createElement('canvas'); cv.width = 16; cv.height = 16;
    const x = cv.getContext('2d');
    const grid = rows.map(r => r.split('').map(ch => { if (ch === '.') return null; const k = (sw && sw[ch]) || ch; return PAL[k] || PAL.k; }));
    for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) if (grid[j] && grid[j][i]) { x.fillStyle = grid[j][i]; x.fillRect(i, j, 1, 1); }
    if (outline) {
      x.fillStyle = OUT;
      for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) {
        if (grid[j] && grid[j][i]) continue;
        const n = (a, b) => grid[b] && grid[b][a];
        if (n(i - 1, j) || n(i + 1, j) || n(i, j - 1) || n(i, j + 1)) x.fillRect(i, j, 1, 1);
      }
    }
    return cv;
  }
  function icon(name, sw) {
    const key = name + JSON.stringify(sw || 0);
    if (!cache[key]) { try { cache[key] = iconCanvas(name, sw).toDataURL(); } catch (e) { cache[key] = ''; } }
    return cache[key];
  }
  function relicIcon(id) { const r = RELICS[id]; return r ? icon(r.icon, r.sw) : icon('help'); }
  function snackIcon(id) { const s = SNACKS[id]; return s ? icon(s.i, s.sw) : ''; }
  function cardIcon(id) { const c = CARDS[id]; return icon(c ? c.i : 'help'); }

  /* ---------- portraits (32x32 pixel faces) ---------- */
  function painter(ctx) {
    const P = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
    const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
    const E = (cx, cy, rx, ry, c, test) => {
      ctx.fillStyle = c;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const d = ((x + .5 - cx) / rx) ** 2 + ((y + .5 - cy) / ry) ** 2;
        if (d <= 1 && (!test || test(x, y))) ctx.fillRect(x, y, 1, 1);

    } else {
      const s = META.st;
      body = `<div class="records"><div>Shifts started<b>${s.runs}</b></div><div>Promotions (wins)<b>${s.wins}</b></div><div>Calls taken<b>${s.calls}</b></div><div>Resolved<b>${s.resolved}</b></div><div>Escalated<b>${s.escalated}</b></div><div>Cards played<b>${s.played}</b></div><div>Anger calmed<b>${s.calmed}</b></div><div>Best level<b>${s.best || 0}</b></div><div>Highest Quota<b>${META.qmax}</b></div>
        <div>Manager's Manager<b>${s.kills.mgrmgr || 0}</b></div><div>The Auditor<b>${s.kills.auditor || 0}</b></div><div>The Founder<b>${s.kills.founder || 0}</b></div></div>
        <div class="sep"></div><div class="unlock" style="background:var(--well)"><b>Hiring:</b> Veteran — ${META.unlocked.vet ? 'hired ✓' : 'resolve The Manager\'s Manager'} · Chat-Bot — ${META.unlocked.bot ? 'hired ✓' : 'resolve The Auditor'} · Quotas — ${META.qmax ? 'up to ' + META.qmax : 'win a shift'}</div>
        <div style="margin-top:10px;text-align:right"><button class="btn" data-act="wipe">Shred all records</button></div>`;
    }
    openModal(`<div class="win" style="height:min(86vh,100%)"><div class="tb"><img src="${IC('book')}" alt=""><span class="tt">Compendium.exe</span><span class="tbx"><button data-act="closemodal" aria-label="Close">×</button></span></div>
      <div class="tabs">${tabs.map(([k, n]) => `<button class="${compTab === k ? 'on' : ''}" data-act="ctab" data-t="${k}">${n}</button>`).join('')}</div><div class="tabpane" id="cpane">${body}</div></div>`);
  }
  function transcriptText(t) { return `TICKET TRANSCRIPT — ${t.when}\nAgent: ${CHARS[t.char] ? CHARS[t.char].n : '?'} · ${FLOORS[t.floor] ? FLOORS[t.floor].n : ''}\nCaller: ${t.who}\nOutcome: ${t.outcome} (${t.turns} turns)\n----------------------------------------\n` + t.lines.map(l => `${l.w === 'agent' ? 'AGENT' : l.w === 'sys' ? '***' : l.w.toUpperCase()}: ${l.s}`).join('\n'); }
  function settingsModal() {
    const s = META.set;
    openModal(`<div class="win" style="width:min(460px,100%)"><div class="tb"><img src="${IC('gear')}" alt=""><span class="tt">Control Panel</span><span class="tbx"><button data-act="closemodal">×</button></span></div>
      <div class="wb" style="display:grid;gap:10px">
        <label><input type="checkbox" data-set="mute" ${s.mute ? 'checked' : ''}> Mute all sound (M)</label>
        <label><input type="checkbox" data-set="fast" ${s.fast ? 'checked' : ''}> Fast animations</label>
        <label><input type="checkbox" data-set="calm" ${s.calm ? 'checked' : ''}> Reduce flicker and screen shake</label>
        <div class="sep"></div><div class="dim" style="font-size:12px">Keys: 1–9 pick a card · Enter play · E end turn · Esc cancel · M mute</div>
        ${RUN ? '<button class="btn" data-act="abandon">Abandon shift (ends the run)</button>' : ''}
        <div style="text-align:right"><button class="btn hot" data-act="closemodal">OK</button></div></div></div>`);
  }
  function applySettings() { document.body.classList.toggle('calm', !!META.set.calm); AU.setMuted(!!META.set.mute); $('#muteico').src = IC(META.set.mute ? 'speakeroff' : 'speaker'); }

  /* ---------- actions (event delegation) ---------- */
  const ACT = {
    newshift() { charScreen(); },
    continue() { const r = loadRun(); if (!r) return titleScreen(); RUN = r; CB = null; G.result = null; route(); },
    title() { titleScreen(); }, totitle() { G.result = null; titleScreen(); },
    pickchar(el) { pickChar = el.dataset.c; sfx('click'); charScreen(); },
    'q-'() { pickQ = Math.max(0, pickQ - 1); charScreen(); }, 'q+'() { pickQ = Math.min(META.qmax, pickQ + 1); charScreen(); },
    start() { if (!META.unlocked[pickChar]) return; const seed = new URLSearchParams(location.search).get('seed'); newRun(pickChar, pickQ, seed ? +seed : undefined); G.result = null; sfx('stamp'); ART.stamp('CLOCKED IN', 'blue', 800); route(); },
    node(el) { if (G.busy) return; const r = +el.dataset.r, c = +el.dataset.c; sfx('click'); const room = enterNode(r, c); if (room) route(); },
    endturn() { if (!CB || G.busy || CB.over) return; sel = -1; hint(null); hideGlossary(); endTurn().then(() => { if (screenName === 'call') renderCall(); }); renderCall(); },
    pile(el) { if (!CB) return; const p = el.dataset.p; deckModal(p === 'draw' ? CB.draw : CB.discard, p === 'draw' ? 'Draw pile (shown sorted, not in order)' : 'Discard pile'); },
    deck() { if (!RUN) return; deckModal(RUN.deck, 'Your deck'); },
    viewmap() { if (!RUN) return; openModal(`<div class="win" style="width:min(640px,100%);height:min(86vh,100%);display:flex;flex-direction:column"><div class="tb"><img src="${IC('folder')}" alt=""><span class="tt">Floor plan (view only)</span><span class="tbx"><button data-act="closemodal">×</button></span></div><div class="mapscroll sunk scroll" id="mapview" style="flex:1;min-height:0"></div></div>`); drawMap($('#mapview'), true); },
    log() { const a = $('#arena'); if (!a) return; const w = $('#logwin'); if (w) { w.remove(); a.classList.remove('docked'); return; } a.insertAdjacentHTML('beforeend', `<div class="win logwin" id="logwin"><div class="tb"><img src="${IC('notepad')}" alt=""><span class="tt">Live transcript</span><span class="tbx"><button data-act="log">×</button></span></div><div class="lb">${CB.log.map(logLine).join('')}</div></div>`); const lb = $('#logwin .lb'); lb.scrollTop = lb.scrollHeight; if (innerWidth >= 1100) { $('#logwin').classList.add('dock'); a.classList.add('docked'); } },
    claim(el) {
      const i = +el.dataset.i; const rw = RUN.room.rewards[i];
      if (rw.t === 'card') { const opts = rw.opts; cardPickModal(opts, 'New canned response: pick one', (ci) => { claimReward(i, ci); closeModal(); rewardScreen(); }); modalCb = (ci) => { claimReward(i, ci); closeModal(); rewardScreen(); }; return; }
      if (rw.t === 'boss') { relicPickModal(rw.opts, 'Executive perk: pick one', (ci) => { claimReward(i, ci); closeModal(); rewardScreen(); }); return; }
      if (rw.t === 'snack' && RUN.snacks.indexOf(null) < 0) { toast('Snack slots full. Eat or toss one first (tap it in the top bar).', ART.snackIcon(rw.id)); sfx('error'); return; }
      if (claimReward(i)) { sfx(rw.t === 'cash' ? 'cash' : 'click'); rewardScreen(); }
    },
    mpick(el) { const i = +el.dataset.i; if (modalCb) { const cb = modalCb; cb(i); } },
    dpick(el) { const u = isNaN(+el.dataset.u) ? el.dataset.u : +el.dataset.u; if (modalCb) modalCb(u); },
    mconfirm() { if (modalCb) { const cb = modalCb; cb(); } },
    closemodal() {
      const pend = RUN && RUN.room && RUN.room.pending; closeModal();
      if (pend && screenName === 'event') { eventPicked(null); route(); }
      if (screenName === 'reward') { const rw = RUN.room.rewards.find(r => r.t === 'card' && !r.done); }
    },
    savetr() { const tr = RUN.room && RUN.room.tr; if (!tr) return; autoSaveTranscript(tr); sfx('stamp'); toast('Transcript saved to <b>Compendium › Transcripts</b>.', IC('notepad')); const b = $('#savetr'); if (b) { b.disabled = true; b.textContent = 'Saved ✓'; } },
    savetr2() { const tr = G.result && G.result.tr; if (!tr) return; autoSaveTranscript(tr); sfx('stamp'); const b = $('#savetr'); if (b) { b.disabled = true; b.textContent = 'Saved ✓'; } },
    tomap() {
      const room = RUN.room;
      if (room && room.t === 'call' && room.state === 'reward' && room.rewards.some(r => !r.done && r.t === 'card')) {
        if (!ACT._warned) { ACT._warned = true; toast('You still have an unread card offer in your Inbox. Click again to leave anyway.', IC('mail')); return; }
      }
      ACT._warned = false; leaveRoom(); sfx('open'); route();
    },
    nextfloor() { const room = RUN.room; if (room.rewards.some(r => !r.done && (r.t === 'card' || r.t === 'boss')) && !ACT._warned) { ACT._warned = true; toast('Unclaimed perks in your Inbox. Click again to go anyway.', IC('mail')); return; } ACT._warned = false; nextFloor(); if (RUN) { ART.stamp(FLOORS[RUN.floor].n.toUpperCase(), 'ink', 1000); sfx('stamp'); } route(); },
    shopsel(el) { shopSelect(el.dataset.k, +el.dataset.i); },
    buy() { if (!shopSel) return; if (buy(shopSel.k, shopSel.i)) { sfx('buy'); ART.burst(innerWidth / 2, innerHeight / 2, 'coin', 1); shopScreen(); } else sfx('error'); },
    shopremove() { deckModal(RUN.deck, 'Shredder: choose a card to destroy', { pick: true, note: `Costs $${priceMod(RUN.removeCost)}. Permanent.` }); modalCb = uid => { closeModal(); if (shopRemove(uid)) { ART.burst(innerWidth / 2, innerHeight / 2, 'shred', 2); } shopScreen(); }; },
    rest(el) {
      const o = el.dataset.o; const room = RUN.room;
      if (o === 'nap') { heal(restHeal()); room.done = true; room.res = 'You nap under your desk. You dream of a quiet phone. It\'s a nightmare, somehow.'; sfx('happy'); saveRun(); restScreen(); }
      if (o === 'train') { deckModal(upgradable(), 'Training Seminar: upgrade a card', { pick: true }); modalCb = uid => { const c = RUN.deck.find(x => x.u === uid); confirmPick(c, 'upgrade', () => { closeModal(); deckOp('upgrade', uid); room.done = true; room.res = `You sit through a 6-hour seminar on "${CARDS[c.id].n}". It's better now. You are worse.`; saveRun(); restScreen(); }); }; }
      if (o === 'vent') { deckModal(RUN.deck, 'Vent to a coworker: shred a card', { pick: true, note: 'Talk it out. The card is gone forever.' }); modalCb = uid => { const c = RUN.deck.find(x => x.u === uid); closeModal(); deckOp('remove', uid); room.done = true; room.res = `You vent about "${CARDS[c.id].n}" until Derek slowly backs away. You feel lighter.`; saveRun(); restScreen(); }; }
    },
    evc(el) { const r = eventChoose(+el.dataset.i); sfx('click'); if (!RUN) return; if (RUN.room.pending) { eventScreen(); return; } eventScreen(); },
    evoffer(el) { const i = +el.dataset.i; const room = RUN.room; if (i >= 0 && room.offer[i]) { const o = room.offer[i]; RUN.deck.push(newCard(o.id, o.up)); fx('gotcard', { id: o.id }); } room.offer = null; saveRun(); eventScreen(); },
    openchest() { const room = RUN.room; room.opened = true; if (room.relic) addRelic(room.relic); else gainCash(40); sfx('relic'); ART.burst(innerWidth / 2, innerHeight / 2, 'star', 2); saveRun(); chestScreen(); },
    snack(el) {
      const i = +el.dataset.i; const id = RUN.snacks[i]; if (!id) return; const s = SNACKS[id]; const usable = !s.call || (CB && !CB.over && screenName === 'call');
      openModal(`<div class="win" style="width:min(380px,100%)"><div class="tb"><span class="tt">${esc(s.n)}</span><span class="tbx"><button data-act="closemodal">×</button></span></div><div class="wb"><div style="display:flex;gap:10px;align-items:center"><img src="${ART.snackIcon(id)}" alt="" style="width:48px;height:48px"><div>${esc(s.d)}${usable ? '' : '<br><span class="dim">Can only be used during a call.</span>'}</div></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" data-act="tosssnack" data-i="${i}">Toss it</button><button class="btn hot" data-act="eatsnack" data-i="${i}" ${usable ? '' : 'disabled'}>Use</button></div></div></div>`);
    },
    eatsnack(el) { closeModal(); useSnack(+el.dataset.i); renderHUD(); if (screenName === 'call') renderCall(); },
    tosssnack(el) { RUN.snacks[+el.dataset.i] = null; saveRun(); closeModal(); renderHUD(); },
    tiptap(el) { const t = tipFor(el); if (t) { showTip(el, ...t); setTimeout(hideTip, 2600); } },
    compendium() { compendium('cards'); }, shelf() { compendium('relics'); }, transcripts() { compendium('tr'); }, records() { compendium('rec'); },
    ctab(el) { compendium(el.dataset.t); }, cfilter(el) { compFilter = el.dataset.f; compendium('cards'); },
    cardzoom(el) { const id = el.dataset.id; if (!(META.seenC[id] || CARDS[id].p === 'base')) return; const c = { id, up: 0 }; const back = () => compendium('cards'); openModal(`<div class="win" style="width:min(460px,100%)"><div class="tb"><span class="tt">${esc(CARDS[id].n)}</span><span class="tbx"><button data-act="cback">×</button></span></div><div class="wb"><div class="preview2">${cardHTML(c)}${CARDS[id].u ? '<span class="arrow">→</span>' + cardHTML({ id, up: 1 }) : ''}</div>${CARDS[id].q ? `<p style="text-align:center;font-style:italic">“${esc(CARDS[id].q)}”</p>` : ''}<div style="text-align:center"><button class="btn" data-act="cback">Back</button></div></div></div>`); },
    cback() { compendium('cards'); },
    tropen(el) { const t = META.tr[+el.dataset.i]; const v = $('#trview'); if (v && t) v.innerHTML = `<div class="notepad">${esc(transcriptText(t))}</div><div style="text-align:right;margin-top:6px"><button class="btn" data-act="trdel" data-i="${el.dataset.i}">Delete</button></div>`; },
    trdel(el) { META.tr.splice(+el.dataset.i, 1); saveMeta(); compendium('tr'); },
    wipe() { if (!ACT._wipe) { ACT._wipe = true; toast('Click "Shred all records" again to confirm. This deletes unlocks too.', IC('trash')); return; } ACT._wipe = false; META = defMeta(); saveMeta(); store.del(SAVE_RUN); RUN = null; CB = null; closeModal(); titleScreen(); },
    settings() { settingsModal(); },
    abandon() { if (!ACT._ab) { ACT._ab = true; toast('Click "Abandon shift" again to confirm.', IC('warn')); return; } ACT._ab = false; closeModal(); abandonRun(); route(); },
    menu() { toggleStart(); },
  };
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    // card clicks inside hand
    const hc = e.target.closest('#hand .card');
    if (hc && !hc.dataset.dragged) { if (!hc.dataset.gone) selectCard(+hc.dataset.i); return; }
    const cu = e.target.closest('#lines .cust');
    if (cu && !a && CB && sel >= 0) { const c = CB.hand[sel]; if (c && CARDS[c.id].tg === 'one') { tryPlay(sel, cu.dataset.uid); return; } }
    if (a) { const fn = ACT[a.dataset.act]; if (fn && !a.disabled) { if (['claim', 'node', 'tomap', 'start', 'buy', 'rest', 'evc', 'openchest'].indexOf(a.dataset.act) < 0) sfx('click'); fn(a, e); } return; }
    if (e.target.id === 'modal') { ACT.closemodal(); return; }
    if (screenName === 'call' && sel >= 0 && !e.target.closest('.handzone') && !e.target.closest('.cust')) deselect();
    if (!e.target.closest('#startmenu') && !e.target.closest('#startb')) $('#startmenu').hidden = true;
  });
  document.addEventListener('change', e => { const s = e.target.dataset && e.target.dataset.set; if (s) { META.set[s] = e.target.checked; saveMeta(); applySettings(); } });
  document.addEventListener('mouseover', e => { if (screenName !== 'call' || !CB) return; const cu = e.target.closest('#lines .cust'); const nt = cu ? cu.dataset.uid : null; if (nt !== hoverT && sel >= 0) { hoverT = nt; renderHand(); } });
  document.addEventListener('keydown', e => {
    AU.unlock();
    if (e.key === 'm' || e.key === 'M') { META.set.mute = !META.set.mute; saveMeta(); applySettings(); return; }
    if (!$('#modal').hidden) { if (e.key === 'Escape') ACT.closemodal(); return; }
    if (e.key === 'Enter' && document.activeElement && document.activeElement.matches('[data-act]')) { document.activeElement.click(); e.preventDefault(); return; }
    if (screenName !== 'call' || !CB) return;
    if (/^[1-9]$/.test(e.key)) { selectCard(+e.key - 1); return; }
    if (e.key === '0') { selectCard(9); return; }
    if (e.key === 'Escape') { deselect(); return; }
    if (e.key === 'e' || e.key === 'E') { ACT.endturn(); return; }
    if (e.key === 'Enter' && sel >= 0) { const c = CB.hand[sel]; const t = needsTarget(c) ? (hoverT || aliveFoes()[0].uid) : null; tryPlay(sel, t); }
  });

  /* ---------- start menu / clock / mute ---------- */
  function toggleStart() {
    const m = $('#startmenu'); if (!m.hidden) { m.hidden = true; return; }
    m.innerHTML = `<div class="side">Brimstone 98</div><div class="items">
      ${RUN ? `<button data-act="smmap"><img src="${IC('folder')}" alt="">Back to my desk</button>` : `<button data-act="newshift"><img src="${IC('phone')}" alt="">Clock in</button>`}
      <button data-act="compendium"><img src="${IC('book')}" alt="">Compendium</button><button data-act="transcripts"><img src="${IC('notepad')}" alt="">Transcripts</button>
      <button data-act="settings"><img src="${IC('gear')}" alt="">Control Panel</button><button data-act="smtitle"><img src="${IC('start')}" alt="">Agent Portal</button>
      <div class="sep"></div><button data-act="smhome"><img src="${IC('xbox')}" alt="">Shut down (← Kai.fun)</button></div>`;
    m.hidden = false;
  }
  ACT.smmap = () => { $('#startmenu').hidden = true; route(); };
  ACT.smtitle = () => { $('#startmenu').hidden = true; if (screenName === 'call') { toast('Finish the call first. The customer can hear you leaving.', IC('phone')); return; } titleScreen(); };
  ACT.smhome = () => { location.href = 'index.html'; };
  $('#startb').addEventListener('click', e => { e.stopPropagation(); sfx('click'); toggleStart(); });
  $('#mute').addEventListener('click', e => { e.stopPropagation(); AU.unlock(); META.set.mute = !META.set.mute; saveMeta(); applySettings(); });
  function tick() {
    const d = new Date(); const h = d.getHours(), m = d.getMinutes(); $('#clock').textContent = ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM');
    if (screenName === 'call' && CB) { const s = Math.floor((Date.now() - CB.t0) / 1000); $$('.cust .tm').forEach(x => x.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')); }
  }
  setInterval(tick, 1000);
  // face animation loop
  setInterval(() => {
    if (screenName === 'title') { if (Math.random() < .02) titleFaceI++; drawTitleFace(); }
    if (screenName !== 'call' || !CB || document.hidden) return;
    CB.enemies.forEach(e => { if (!e.alive) return; const el = custEl(e); if (el) updCust(e, el); });
    const mug = $('#mug canvas'); if (mug) ART.drawMug(mug, CB.coffee / Math.max(1, CB.maxCoffee));
  }, 120);
  // fluorescent flicker
  (function flick() { setTimeout(() => { if (!META.set.calm) { const t = $('#tube'); t.classList.remove('flick'); void t.offsetWidth; t.classList.add('flick'); if (Math.random() < .35) { const f = $('#flicker'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); } } flick(); }, 4000 + Math.random() * 9000); })();
  window.addEventListener('resize', () => { clearTimeout(UI._rs); UI._rs = setTimeout(() => { if (screenName === 'call') { const w = $('#logwin'); if (w && w.classList.contains('dock') && innerWidth < 1100) ACT.log(); layoutHand(); } if (screenName === 'map') drawMap($('#mapscroll')); }, 80); });

  function boot() {
    G.ui.fx = fx;
    ART.fxInit();
    $('#wall').innerHTML = ART.wallpaper();
    $('#startico').src = IC('start');
    applySettings(); tick();
    titleScreen();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (screenName === 'call') layoutHand(); }).catch(() => {});
  }
  return { boot, route, renderCall, get screen() { return screenName; }, select: selectCard, tryPlay, compendium, toast };
})();
UI.boot();

</script>
<script src="bdp.js" defer></script>
</body>
