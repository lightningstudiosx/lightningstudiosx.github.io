<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--ink:#3b3550;--ink2:#7a7290;--card:rgba(255,250,242,.92);--card2:#fffaf2;--sh:0 3px 0 rgba(40,30,70,.12),0 8px 24px rgba(10,10,40,.28);
--acc:#ff8a5b;--acc2:#ffd166;--f:"Fredoka","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1026}
body{font-family:var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#cv:active{cursor:grabbing}
button{font-family:var(--f);color:var(--ink)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#kai{position:fixed;left:12px;top:12px;z-index:30;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;background:var(--card);padding:9px 14px 9px 12px;border-radius:999px;box-shadow:var(--sh);line-height:1}
#kai:hover{background:#fff}
#hud{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#pname{font-weight:700;font-size:22px;color:#fff;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,30,.6)}
#chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:5px;background:var(--card);padding:5px 11px 5px 8px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--sh);white-space:nowrap}
.chip svg.i{width:17px;height:17px}
#topR{position:fixed;right:12px;top:12px;z-index:30;display:flex;gap:7px;align-items:center}
.rb{appearance:none;border:0;background:var(--card);width:42px;height:42px;border-radius:50%;box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.rb:hover{transform:translateY(-1px);background:#fff}.rb:active{transform:scale(.94)}
.rb.off{opacity:.6}
.seg{display:flex;background:var(--card);border-radius:999px;box-shadow:var(--sh);padding:3px}
.seg button{appearance:none;border:0;background:transparent;height:36px;min-width:38px;padding:0 9px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.seg button.on{background:var(--ink);color:#fff}
.seg svg.i{width:18px;height:18px}
#toasts{position:fixed;left:50%;top:86px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(92vw,520px)}
.toast{display:flex;align-items:center;gap:8px;background:var(--card2);padding:8px 16px 8px 10px;border-radius:16px;box-shadow:var(--sh);font-size:15px;opacity:0;transform:translateY(-8px) scale(.96);transition:all .35s cubic-bezier(.3,1.5,.5,1)}
.toast.in{opacity:1;transform:none}
.toast svg.i{color:var(--acc);width:20px;height:20px}
#dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100vw - 16px)}
#tools{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:26px;box-shadow:var(--sh)}
.tb{appearance:none;border:0;background:transparent;width:66px;height:62px;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:12.5px;transition:background .2s,transform .15s}
.tb svg.i{width:27px;height:27px}
.tb:hover{background:rgba(59,53,80,.07)}
.tb.on{background:var(--ink);color:#fff;transform:translateY(-3px)}
#palette{display:flex;gap:5px;background:var(--card);padding:6px 8px;border-radius:22px;box-shadow:var(--sh);overflow-x:auto;max-width:calc(100vw - 16px);scrollbar-width:none;transition:opacity .2s,transform .25s}
#palette::-webkit-scrollbar{display:none}
#palette.hide{opacity:0;transform:translateY(10px);pointer-events:none}
.pb{appearance:none;border:0;background:transparent;min-width:58px;height:56px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;flex:none;padding:0 4px}
.pb:hover{background:rgba(59,53,80,.07)}
.pb.on{background:#ffe6a8;box-shadow:inset 0 0 0 2px #f2b84b}
.pb .sw{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.2)}
.pb svg.i{width:24px;height:24px}
.sep{width:1px;background:rgba(59,53,80,.15);margin:6px 3px;flex:none}
.bs{display:flex;align-items:center;gap:3px;flex:none}
.bs button{appearance:none;border:0;background:transparent;border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bs button span{display:block;border-radius:50%;background:var(--ink2)}
.bs button.on{background:#ffe6a8}.bs button.on span{background:var(--ink)}
#card{position:fixed;left:14px;bottom:110px;z-index:35;width:290px;background:var(--card2);border-radius:20px;box-shadow:var(--sh);padding:14px 16px;transition:opacity .25s,transform .3s cubic-bezier(.3,1.4,.5,1)}
#card.hide{opacity:0;transform:translateY(14px) scale(.96);pointer-events:none}
#card h3{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
#card .av{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
#card .sub{color:var(--ink2);font-size:13.5px;margin:2px 0 8px}
#card .th{background:#fff;border-radius:14px;padding:9px 12px;font-size:15px;position:relative;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
#card .th:before{content:"";position:absolute;left:18px;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:#fff}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}.bar b{width:62px;font-weight:600}
.bar i{flex:1;height:8px;border-radius:5px;background:#ece5da;overflow:hidden}.bar i em{display:block;height:100%;border-radius:5px}
#card .x,.panel .x{position:absolute;right:10px;top:8px;appearance:none;border:0;background:transparent;font-size:16px;cursor:pointer;color:var(--ink2);width:30px;height:30px}
#card .acts{display:flex;gap:6px;margin-top:9px}
.pill{appearance:none;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.pill.lite{background:#efe7da;color:var(--ink)}.pill.wide{width:100%;margin:8px 0}
.panel{position:fixed;right:12px;top:64px;z-index:36;width:300px;max-height:calc(100vh - 170px);overflow:auto;background:var(--card2);border-radius:20px;box-shadow:var(--sh);padding:14px 16px;transition:opacity .25s,transform .3s}
.panel.hide{opacity:0;transform:translateX(20px);pointer-events:none}
.ph{font-size:18px;margin-bottom:8px;position:relative}
.ms{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed rgba(59,53,80,.14)}
.ms .mi{width:30px;height:30px;border-radius:50%;background:#ece5da;display:flex;align-items:center;justify-content:center;flex:none;color:#b3aab9}
.ms.done .mi{background:#ffd166;color:#6b4a00}
.ms .mt{font-weight:600;font-size:15px}.ms .md{font-size:12.5px;color:var(--ink2)}
.ms:not(.done) .mt{color:var(--ink2)}
.mrow{display:flex;gap:8px;align-items:center;margin:6px 0}.mrow label{font-weight:600;width:40px}
.mrow input{flex:1;min-width:0;border:2px solid #e6ddcf;border-radius:12px;padding:8px 10px;font:600 15px var(--f);color:var(--ink);background:#fff}
.mrow2{display:flex;gap:8px}.mrow2 .pill{flex:1}
.tog{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0}
.help{font-size:13.5px;line-height:1.55;color:var(--ink2);background:#f6efe4;border-radius:14px;padding:10px 12px;margin-top:6px}
.help b{color:var(--ink)}.small{font-size:12px;color:var(--ink2);margin-top:8px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.tl{position:absolute;transform:translate(-50%,-100%);background:rgba(255,250,242,.85);padding:3px 10px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:opacity .3s}
.tl small{color:var(--ink2);font-weight:500}
#intro{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:25;text-align:center;color:#fff;pointer-events:none;transition:opacity 1.6s}
#intro .it{font-size:54px;font-weight:700;letter-spacing:.02em;text-shadow:0 4px 30px rgba(0,0,40,.7)}
#intro .is{font-size:19px;opacity:.85;margin-top:4px;text-shadow:0 2px 10px rgba(0,0,40,.7)}
#intro.gone{opacity:0}
#fade{position:fixed;inset:0;z-index:60;background:#0b1026;display:flex;align-items:center;justify-content:center;transition:opacity 1s;color:#fff;font-size:30px;font-weight:700}
#fade.gone{opacity:0;pointer-events:none}
#err{position:fixed;left:12px;right:12px;bottom:12px;z-index:70;display:none;background:#fff;padding:12px;border-radius:12px;font-size:14px}
@media (max-width:700px){
  #pname{font-size:16px}#hud{top:60px}.chip{font-size:12.5px;padding:4px 9px 4px 6px}#chips{gap:4px}
  #kai{font-size:13px;padding:8px 10px;top:10px;left:8px}
  #topR{right:8px;top:8px;gap:5px}.rb{width:38px;height:38px}.seg button{height:32px;min-width:32px;padding:0 6px;font-size:13px}
  #toasts{top:118px}.toast{font-size:13px;padding:6px 12px 6px 8px}.toast:nth-last-child(n+3){display:none}
  .tb{width:54px;height:58px;font-size:11px}.tb svg.i{width:25px;height:25px}#tools{gap:2px;padding:5px}
  .pb{min-width:52px;height:52px;font-size:10.5px}
  #card{left:8px;right:8px;width:auto;bottom:calc(150px + env(safe-area-inset-bottom))}
  .panel{left:8px;right:8px;width:auto;top:104px}
  #intro .it{font-size:38px}#intro .is{font-size:16px}
}
@media (max-width:420px){ #b-snap{display:none} .seg button[data-s="3"]{display:none} }
</style>
</head>

<canvas id="cv" tabindex="0"></canvas>
<div id="labels"></div>
<a id="kai" href="index.html">← Kai.fun</a>
<div id="hud">
  <div id="pname">Pocket Planet</div>
  <div id="chips">
    <span class="chip" id="c-day" title="Day and season"></span>
    <span class="chip" id="c-pop" title="Villagers"></span>
    <span class="chip" id="c-wood" title="Wood in the village store"></span>
    <span class="chip" id="c-food" title="Food in the village pantry"></span>
  </div>
</div>
<div id="topR">
  <div class="seg" id="speed">
    <button data-s="0" title="Pause (Space)"></button><button data-s="1" title="Normal speed">1×</button><button data-s="3" title="Fast">3×</button><button data-s="10" title="Super fast">10×</button>
  </div>
  <button class="rb" id="b-goals" title="Milestones"></button>
  <button class="rb" id="b-snap" title="Save a picture"></button>
  <button class="rb" id="b-snd" title="Sound on / off"></button>
  <button class="rb" id="b-menu" title="Planet menu"></button>
</div>
<div id="toasts"></div>
<div id="dock">
  <div id="palette"></div>
  <div id="tools"></div>
</div>
<div id="card" class="hide"></div>
<div id="goals" class="panel hide"><div class="ph"><b>Milestones</b><button class="x" data-close="goals">✕</button></div><div id="glist"></div></div>
<div id="menu" class="panel hide"><div class="ph"><b>Your planet</b><button class="x" data-close="menu">✕</button></div>
  <div class="mrow"><label>Seed</label><input id="seed" inputmode="numeric" maxlength="9"><button class="pill" id="b-dice" title="Random seed"></button></div>
  <button class="pill wide" id="b-new">Make a new planet</button>
  <div class="mrow2"><button class="pill" id="b-save">Save now</button><button class="pill" id="b-load">Load save</button></div>
  <label class="tog"><input type="checkbox" id="t-events" checked> Surprise events (whales, meteors…)</label>
  <div class="help"><b>How to play</b><br>Drag to spin · scroll or pinch to zoom<br>Pick a tool below, then drag or tap on the planet<br>Right-drag (or two fingers) spins while a tool is active<br>Tap a villager to read their thoughts</div>
  <div class="small" id="saveinfo"></div>
</div>
<div id="intro"><div class="it">Pocket Planet</div><div class="is">a tiny world in your hand</div></div>
<div id="fade"><div class="ld">Pocket Planet</div></div>
<div id="err"></div>
<script>
"use strict";
// ===== util.js =====
// util.js - constants, rng, noise, math helpers, shared state
const QS = new URLSearchParams(location.search);
const TILE = QS.has('tile');
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || ('ontouchstart' in window);
const DPR = Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 2 : 1.75);
const R = 10;            // planet radius (sea level)
const SUBDIV = 6;        // geosphere subdivision -> 40962 vertices
const DAY = 150;         // seconds per day at 1x
const YEAR_DAYS = 8;     // days per year (4 seasons of 2 days)
const CLOUD_R = R + 1.9;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RNG = mulberry(Date.now() & 0xffffffff);
const rnd = (a = 1, b) => b === undefined ? RNG() * a : a + RNG() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b));
const pick = arr => arr[Math.floor(RNG() * arr.length)];
const chance = p => RNG() < p;
function hash32(n) { n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }

// seeded 3D gradient noise (improved Perlin)
const NOISE = { p: new Uint8Array(512) };
function noiseSeed(seed) {
  const r = mulberry(seed * 7919 + 17), p = [];
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) NOISE.p[i] = p[i & 255];
}
function grad3(h, x, y, z) { const u = (h & 15) < 8 ? x : y, v = (h & 15) < 4 ? y : ((h & 15) === 12 || (h & 15) === 14 ? x : z); return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); }
function noise3(x, y, z) {
  const p = NOISE.p, X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = x * x * x * (x * (x * 6 - 15) + 10), v = y * y * y * (y * (y * 6 - 15) + 10), w = z * z * z * (z * (z * 6 - 15) + 10);
  const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
  return lerp(lerp(lerp(grad3(p[AA], x, y, z), grad3(p[BA], x - 1, y, z), u), lerp(grad3(p[AB], x, y - 1, z), grad3(p[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad3(p[AA + 1], x, y, z - 1), grad3(p[BA + 1], x - 1, y, z - 1), u), lerp(grad3(p[AB + 1], x, y - 1, z - 1), grad3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}
function fbm(x, y, z, oct = 5) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * noise3(x * f, y * f, z * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }

// small vector helpers on THREE
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const _t1 = new THREE.Vector3(), _t2 = new THREE.Vector3(), _t3 = new THREE.Vector3(), _q1 = new THREE.Quaternion(), _m1 = new THREE.Matrix4();
const UPZ = new THREE.Vector3(0, 0, 1), UPY = new THREE.Vector3(0, 1, 0);
// rotate unit vector d toward unit vector t by angle a (great-circle step), in place
function stepToward(d, t, a) {
  const dot = clamp(d.dot(t), -1, 1), ang = Math.acos(dot);
  if (ang < 1e-6) return 0;
  const k = Math.min(1, a / ang), s = Math.sin(ang);
  const w1 = Math.sin((1 - k) * ang) / s, w2 = Math.sin(k * ang) / s;
  d.set(d.x * w1 + t.x * w2, d.y * w1 + t.y * w2, d.z * w1 + t.z * w2).normalize();
  return ang - a;
}
// orientation quaternion: object +Y along surface normal n, facing heading angle
function surfQuat(q, n, yaw) {
  q.setFromUnitVectors(UPY, n);
  if (yaw) { _q1.setFromAxisAngle(UPY, yaw); q.multiply(_q1); }
  return q;
}
function angDist(a, b) { return Math.acos(clamp(a.dot(b), -1, 1)); }
const fmt = n => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : '' + Math.round(n);

// shared uniforms + state
const U = {
  uTime: { value: 0 }, uSun: { value: new THREE.Vector3(1, 0, 0) }, uMoon: { value: new THREE.Vector3(-1, 0, 0) },
  uDec: { value: 0 }, uAutumn: { value: 0 }, uFlash: { value: 0 }, uCam: { value: new THREE.Vector3() }, uHover: { value: new THREE.Vector4(0, 0, 0, 0) }
};
const STATE = {
  ready: false, seed: 1, name: 'Pocket Planet', time: DAY * 0.3, speed: 1, paused: false,
  tool: 'hand', sub: { terra: 'raise', plant: 'oak', build: 'house', weather: 'rain', events: 'rainbow' }, brush: 1,
  wood: 0, food: 6, milestones: {}, stats: { born: 0, boats: 0, built: 0, rain: 0 }, randomEvents: true, rocket: null
};
const MS_LIST = [
  ['villager', 'First villager', 'Someone has arrived!'], ['home', 'First home', 'A roof over their heads'],
  ['farm', 'First farm', 'Little rows of crops'], ['town', 'First town', 'Four homes make a town'],
  ['pop25', '25 villagers', 'A busy little world'], ['boat', 'First boat', 'Sailing to new shores'],
  ['snowman', 'A snowman', 'Built by tiny hands'], ['forest', 'Forest of 800', 'Trees everywhere'],
  ['rainbow', 'A rainbow', 'After the rain'], ['whale', 'Whale sighting', 'Something big in the sea'],
  ['lighthouse', 'Lighthouse lit', 'Guiding the boats home'], ['towns3', 'Three towns', 'A whole country'],
  ['pop100', '100 villagers', 'A planet full of friends'], ['rocket', 'Rocket launch', 'Up, up and away'], ['moon', 'Moon landing', 'A tiny flag on the moon']
];
function showErr(m) { const e = document.getElementById('err'); if (e) { e.style.display = 'block'; e.textContent = 'Sorry, something went wrong: ' + m; } }

// ===== geo.js =====
// geo.js - subdivided icosphere: unit directions, faces, adjacency, height sampling, surface ray hits
const GEO = { n: 0, P: null, F: null, nbr: null, vf: null, H: null, B: null, M: null, lastV: 0, edge: 0 };
function buildGeo(level) {
  const t = (1 + Math.sqrt(5)) / 2, v = [];
  const base = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]];
  for (const p of base) { const l = Math.hypot(...p); v.push(p[0] / l, p[1] / l, p[2] / l); }
  let f = [0, 11, 5, 0, 5, 1, 0, 1, 7, 0, 7, 10, 0, 10, 11, 1, 5, 9, 5, 11, 4, 11, 10, 2, 10, 7, 6, 7, 1, 8, 3, 9, 4, 3, 4, 2, 3, 2, 6, 3, 6, 8, 3, 8, 9, 4, 9, 5, 2, 4, 11, 6, 2, 10, 8, 6, 7, 9, 8, 1];
  for (let l = 0; l < level; l++) {

  if (!AUD.started || !AUD.on) return;
  const now = performance.now(); if (now - sfxReset > 200) { sfxReset = now; sfxCount = 0; } if (++sfxCount > 6) return;
  const v = d ? listenNear(d) : 1; if (v < 0.03) return;
  switch (name) {
    case 'tick': tone('sine', 900, 1200, 0.05, 0.05); break;
    case 'pop': tone('sine', 500, 1100, 0.09, 0.08); break;
    case 'place': tone('triangle', 330, 660, 0.12, 0.1 * v); tone('sine', 990, 990, 0.15, 0.04 * v, 0.07); noiseHit(300, 1, 0.12, 0.08 * v); break;
    case 'build': [72, 76, 79].forEach((n, i) => tone('triangle', midi(n), midi(n), 0.25, 0.05 * v, i * 0.08)); break;
    case 'hammer': noiseHit(1800, 3, 0.05, 0.12 * v); tone('square', 220, 180, 0.04, 0.02 * v); break;
    case 'chop': noiseHit(900, 2, 0.08, 0.2 * v); tone('triangle', 160, 120, 0.06, 0.05 * v); break;
    case 'dig': noiseHit(rnd(250, 500), 0.8, 0.09, 0.07 * v, 0, 'lowpass'); break;
    case 'splash': noiseHit(rnd(700, 1200), 0.6, 0.18, 0.06 * v); break;
    case 'plant': tone('sine', rnd(600, 800), rnd(900, 1300), 0.08, 0.05 * v); break;
    case 'nope': tone('square', 220, 170, 0.15, 0.03); break;
    case 'chime': [79, 84, 88].forEach((n, i) => tone('sine', midi(n), midi(n), 0.6, 0.05, i * 0.1)); break;
    case 'fanfare': [67, 72, 76, 79, 84].forEach((n, i) => { tone('triangle', midi(n), midi(n), 0.45, 0.07, i * 0.11); tone('sine', midi(n + 12), midi(n + 12), 0.4, 0.02, i * 0.11); }); break;
    case 'thunder': noiseHit(120, 0.5, 2.8, 0.5 * Math.max(0.3, v), 0, 'lowpass'); noiseHit(60, 0.7, 3.5, 0.4 * Math.max(0.3, v), 0.15, 'lowpass'); break;
    case 'whoosh': noiseHit(800, 0.7, 1.2, 0.12); break;
    case 'boom': noiseHit(90, 0.6, 2, 0.6, 0, 'lowpass'); tone('sine', 90, 30, 1.2, 0.3); break;
    case 'rumble': noiseHit(60, 0.5, 4, 0.4, 0, 'lowpass'); break;
    case 'whale': tone('sine', 300, 180, 2.2, 0.06); tone('sine', 220, 320, 2.5, 0.04, 1.6); break;
    case 'beep': tone('square', 880, 880, 0.12, 0.04); break;
    case 'launch': noiseHit(200, 0.4, 5, 0.5, 0, 'lowpass'); tone('sawtooth', 70, 140, 4, 0.06); break;
    case 'shutter': noiseHit(3000, 1, 0.05, 0.15); noiseHit(2000, 1, 0.06, 0.12, 0.08); break;
  }
}

// ===== main.js =====
// main.js - boot, simulation step, render loop, autosave, test hooks
let fpsAvg = 60, lastT = performance.now(), saveT = 0, waterT = 0, simT = 0;
function render() { renderer.render(scene, camera); }
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (fxPts) fxPts.material.uniforms.uScale.value = innerHeight * DPR * 1.37;
}
function simStep(sdt, dt) {
  STATE.time += sdt; updateClock();
  let rem = sdt; while (rem > 1e-6) { const s = Math.min(rem, 0.25); aiUpdate(s); rem -= s; }
  updateFlora(sdt); updateProgress(sdt); updateSnowCover(sdt);
  updateClouds(dt, sdt); updateStructs(dt, sdt); updateBoats(dt, sdt); updateEvents(dt, sdt);
}
function frame(dt) {
  const sdt = STATE.paused ? 0 : dt * STATE.speed;
  U.uTime.value += dt;
  camAnim(dt); camUpdate(dt);
  simStep(sdt, dt);
  updateSky(dt); updateBolts(dt); renderPeople(dt); updateFX(dt);
  waterT -= dt; if (waterIdxDirty && waterT <= 0) { waterIndex(); waterT = 0.15; }
  floraFlush(); structFlush();
  updateHUD(dt); updateLabels(); updateAudio(dt); updateMusic(dt);
  render();
}
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  fpsAvg = lerp(fpsAvg, 1 / Math.max(dt, 1e-3), 0.05);
  try { frame(dt); } catch (e) { console.error(e); showErr(e.message); throw e; }
  saveT += dt; if (saveT > 30 && STATE.ready && !TILE) { saveT = 0; saveGame(); }
}
function boot() {
  initRenderer(); buildGeo(SUBDIV); aiInit(); buildModels(); buildSky();
  const qs = parseInt(QS.get('seed'), 10);
  genPlanet(qs || 1); buildTerrain(); buildWater();
  buildFlora(); buildStructGfx(); buildPeopleGfx(); buildBoatGfx(); buildWeather(); buildFX(); buildEvents();
  buildUI(); initInput(); camInit(); resize(); addEventListener('resize', resize);
  const fresh = QS.has('new') || TILE || qs;
  if (fresh || !loadGame()) newPlanet(qs || (TILE ? 2024 : 1 + Math.floor(Math.random() * 999999)));
  STATE.ready = true; uiMilestones();
  if (QS.get('speed')) { STATE.speed = clamp(+QS.get('speed'), 1, 50); uiSpeed(); }
  frame(0.016);
  $('fade').classList.add('gone');
  setTimeout(() => $('intro').classList.add('gone'), TILE ? 0 : 3800);
  if (!TILE) setTimeout(() => hintOnce('start', IS_TOUCH ? 'Drag to spin · pinch to zoom · pick a tool below' : 'Drag to spin · scroll to zoom · pick a tool below'), 1800);
  addEventListener('visibilitychange', () => { if (document.hidden && STATE.ready && !TILE) saveGame(); });
  lastT = performance.now(); requestAnimationFrame(loop);
}
// test + tile hooks
window.PP = {
  STATE, PEOPLE, STRUCTS, TREES, TOWNS, CLOUDS, BOATS, GEO, CAM, CLOCK, EV, U,
  fps: () => Math.round(fpsAvg), stepSim(sec, step = 0.25) { for (let t = 0; t < sec; t += step) simStep(step, step); FX.life.fill(0); floraFlush(); structFlush(); },
  toScreen(d, lift = 0) { const p = surfPoint(d, V3(), -1).addScaledVector(d, lift).project(camera); return [(p.x + 1) / 2 * innerWidth, (1 - p.y) / 2 * innerHeight]; },
  landDir() { let best = 0, bh = -9; for (let i = 0; i < GEO.n; i += 7) { const h = GEO.H[i]; if (GEO.B[i] === B_GRASS && h > 0.1 && h < 0.5) { let g = 0; for (const u of footprint(i, 3)) if (GEO.B[u] === B_GRASS && GEO.H[u] > 0.05) g++; if (g > bh) { bh = g; best = i; } } } return vdir(best, V3()); },
  oceanDir() { for (let i = 0; i < GEO.n; i += 11) if (GEO.H[i] < -0.6) return vdir(i, V3()); return V3(1, 0, 0); },
  noonAt(d, off = 0) { const dt = ((Math.atan2(d.z, d.x) / 6.2832 + off) % 1 + 1) % 1; let t = Math.floor(STATE.time / DAY) * DAY + dt * DAY; if (t < STATE.time) t += DAY; STATE.time = t; updateClock(); },
  look(d, z) { camLookAt(d, z); CAM.anim.t = 1; CAM.q.copy(CAM.anim.to); CAM.anim = null; CAM.z = CAM.tz; camUpdate(0.016); },
  newPlanet, saveGame, loadGame, selectTool, addCloud, spawnWhale, spawnMeteor, spawnVolcano, addRainbow, launchRocket, nextSeason, addStruct, addPerson, frame, render, heightAt: d => hAtV(d), camUpdate
};
try { boot(); } catch (e) { console.error(e); showErr(e.message); }
