<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pencil Pusher: build a pencil factory by hand</title>
<meta name="description" content="Start with a pencil stand by the road. Chop cedar, mine graphite, make pencils by hand, then hammer together your own factory: conveyor belts, saws, kilns, glue presses, paint dippers, sharpeners, billboards and a shop that grows into a pencil mall.">
<meta name="theme-color" content="#7ccf5a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Pencil Pusher — "MS Paint Industrial": flat colors, fat black outlines, round-headed dudes with big oval eyes. */
:root { --ink:#151515; --paper:#fffdf4; --yellow:#ffd23a; --red:#e8262b; --blue:#3f4fd0; --green:#5cbf3c; --muted:#6b6b75 }
* { box-sizing:border-box }

  -webkit-tap-highlight-color:transparent; user-select:none; overscroll-behavior:none; touch-action:none }

#cv { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:none }

.hb.on { background:var(--yellow) }

#buildbar button { flex:none; width:74px; border:2px solid var(--ink); background:#fff; border-radius:10px; padding:3px 2px; font-size:12px; line-height:1.1; text-align:center }

#stick { left:16px; bottom:calc(max(16px, env(safe-area-inset-bottom)) + 40px); width:120px; height:120px; border-radius:50%; border:3px solid rgba(21,21,21,.5); background:rgba(255,255,255,.25) }
#knob { position:absolute; left:35px; top:35px; width:50px; height:50px; border-radius:50%; background:#fff; border:3px solid var(--ink) }
body:not(.touch) #touch, body:not(.touch) #stick { display:none }
body.touch #bag { bottom:auto; top:calc(max(8px, env(safe-area-inset-top)) + 150px) }
#modal { position:fixed; inset:0; background:rgba(21,21,21,.45); display:grid; place-items:center; z-index:40; padding:10px }

@media (max-width:600px) { #money { font-size:22px } .hb { font-size:13px; padding:2px 7px } #goal { font-size:12px } }

<body>
<canvas id="cv"></canvas>
<div class="hud" id="tl">
  <a class="home" href="index.html">← Kai.fun</a>

</div>

</div>
<div class="hud" id="bag"></div>
<div class="hud box" id="prompt" hidden></div>
<div class="hud box" id="buildbar" hidden></div>
<div class="hud" id="stick"><div id="knob"></div></div>
<div class="hud" id="touch"><button id="trot" hidden>↻</button><button id="tbuild">🔨</button><button id="tact">USE</button></div>
<div id="modal" hidden><div id="mbox"><div id="mhead"><div id="mtitle"></div><button id="mclose" aria-label="close">✕</button></div>
  <div id="mtabs"></div><canvas id="mcv" hidden></canvas><div id="mctl"></div><div id="mhint"></div><div id="mbody"></div></div></div>
<div id="toast"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const INK = '#151515';
const cv = $('#cv'), cx = cv.getContext('2d'), mcv = $('#mcv'), mx = mcv.getContext('2d');

let DT = 1 / 60;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
function fmt(n) {

}
const fi = n => n < 1000 ? Math.floor(n).toString() : fmt(n);
const money = n => '$' + (n < 100 ? n.toFixed(2) : fmt(n));
const GRADES = ['4H', '2H', 'H', 'HB', 'B', '2B', '4B', '6B', '8B'];
const COLORS = [['yellow', '#f5c400'], ['red', '#e2463a'], ['blue', '#3a6fd8'], ['green', '#3c9a4a'], ['black', '#2b2b30'], ['pink', '#ff8fa3'], ['purple', '#8a4fd0'], ['natural', '#e8c08a']];

// ------------------------------------------------------------------ the map and the save
const TS = 48, MAPW = 48, MAPH = 36, WALK = 31;             // tile size, map size, the sidewalk row
const KEY = 'pencilpusher_v3';
const SHOP = [
  { name: 'Pencil Stand', cap: 20, bulk: 1, mult: 1 },
  { name: 'Kiosk', cap: 150, bulk: 2, mult: 1.7, cost: 250, sold: 30, time: 6 },
  { name: 'Corner Shop', cap: 1000, bulk: 5, mult: 3.2, cost: 4000, sold: 400, time: 10 },
  { name: 'Superstore', cap: 8000, bulk: 15, mult: 6, cost: 120000, sold: 6000, time: 14 },
  { name: 'Pencil Mall', cap: 60000, bulk: 40, mult: 12, cost: 5e6, sold: 80000, time: 20 }];
function freshRun() {
  return { money: 0, logs: 0, graphite: 0, clay: 0, slats: 0, leads: 0, blanks: 0, painted: 0, pencils: 0, pval: 0, shavings: 0, dust: 0, golden: 0,
    stock: 0, stockVal: 0, priceMult: 1, shopLvl: 0, shopBuild: 0, shopProg: 0, sold: 0, run: 0, research: {}, ads: {}, adsRun: {}, mascot: 0, builders: 0,
    buildings: null, nextId: 1, goal: 0, grade: 3, color: 0, leadGrade: 3, paintedColor: 0, px: 19.5 * TS, py: 29.3 * TS, lost: 0, trees: null };
}
function fresh() { return Object.assign(freshRun(), { shares: 0, cat: {}, nov: {}, hat: 'none', life: { sold: 0, earned: 0, handmade: 0, snaps: 0, streak: 0, bedding: 0, ads: 0, ipos: 0, machineMade: 0, hats: {} }, last: Date.now() }); }
let S = fresh();
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) { S = Object.assign(fresh(), s); S.life = Object.assign(fresh().life, s.life || {}); } } catch (e) {}
const has = id => !!S.research[id];
const shareMult = () => 1 + .03 * S.shares;
const quality = () => (has('q1') ? 1.5 : 1) * (has('q2') ? 2 : 1) * (has('q3') ? 3 : 1) * shareMult();
const basePrice = () => quality();
const gradeMult = gr => 1 + .06 * Math.abs(gr - 3);

// =================================================================== sound
let AC = null, muted = false;
try { muted = localStorage.getItem(KEY + '_mute') === '1'; } catch (e) {}
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .1, type = 'square', v = .05, slide = 0, when = 0) {
  if (muted || !ac()) return; const t = AC.currentTime + when, o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
let NB = null;
function noise(d = .1, v = .08, f = 1200, q = .8, when = 0) {
  if (muted || !ac()) return;
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const a = NB.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + when, s = AC.createBufferSource(), b = AC.createBiquadFilter(), gn = AC.createGain();
  s.buffer = NB; b.type = 'bandpass'; b.frequency.value = f; b.Q.value = q; gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(b).connect(gn).connect(AC.destination); s.start(t, Math.random() * .5); s.stop(t + d + .02);
}
const sfx = {
  chop: () => { noise(.12, .25, 300, 1.2); tone(90, .1, 'triangle', .12, -40); }, pick: () => { tone(1400, .06, 'square', .04, -300); noise(.08, .15, 2500, 2); },
  saw: () => noise(.09, .07, rnd(1500, 2600), 3), crank: () => noise(.04, .05, rnd(3000, 4200), 5), curl: () => tone(rnd(700, 900), .05, 'sine', .03, 300),
  snap: () => { noise(.18, .35, 3000, .7); tone(500, .2, 'sawtooth', .05, -400); }, coin: () => { tone(988, .07, 'square', .035); tone(1319, .15, 'square', .035, 0, .06); },
  thunk: () => { tone(140, .12, 'triangle', .15, -60); noise(.06, .1, 600, 1); }, bake: () => { tone(300, .4, 'sine', .04, 200); noise(.4, .05, 800, .5); },
  done: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .14, 'triangle', .06, 0, i * .08)), fall: () => { noise(.5, .3, 200, .6); tone(120, .5, 'triangle', .12, -80); },
  nope: () => tone(160, .15, 'square', .04, -40), step: () => noise(.03, .025, 900, 2), bell: () => { tone(1760, .4, 'sine', .05); tone(2637, .3, 'sine', .02); },
  sad: () => tone(330, .25, 'triangle', .04, -120), buy: () => { tone(660, .06, 'square', .04); tone(990, .1, 'square', .04, 0, .05); tone(1320, .14, 'square', .04, 0, .1); },
  jingle: () => [[523, .2], [659, .2], [784, .2], [1047, .4], [988, .2], [784, .2], [880, .5]].reduce((t, [f, d]) => { tone(f, d * .9, 'square', .05, 0, t); tone(f / 2, d * .9, 'triangle', .05, 0, t); return t + d; }, 0),
};
let beat = 0;
setInterval(() => {
  if (muted || !AC || AC.state !== 'running') return;
  const prog = [[220, 277, 330], [196, 247, 294], [175, 220, 262], [196, 247, 294]], ch = prog[Math.floor(beat / 8) % 4];
  if (beat % 8 === 0) ch.forEach(f => tone(f, 1.6, 'triangle', .011));
  if (beat % 2 === 0) tone(ch[0] / 2, .25, 'sine', .028);
  if (beat % 4 === 2) noise(.05, .018, 5000, 1);
  if (Math.random() < .22) tone(ch[Math.floor(Math.random() * 3)] * 2, .2, 'sine', .014);
  beat++;
}, 230);
function setMute(m) { muted = m; $('#mute').textContent = m ? '🔇' : '🔊'; try { localStorage.setItem(KEY + '_mute', m ? '1' : '0'); } catch (e) {} }
$('#mute').onclick = () => { setMute(!muted); if (!muted) ac(); };
setMute(muted);
addEventListener('pointerdown', () => ac(), { once: true });

// =================================================================== toast, particles, sketch helpers
let toastT = 0;
function toast(msg, ms = 1900) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
const PW = [], PM = [];                                   // world particles, minigame particles
function burst(arr, x, y, n, col, o = {}) {
  for (let i = 0; i < n; i++) arr.push({ x, y, vx: rnd(-1, 1) * (o.sp || 3), vy: rnd(-1, .3) * (o.sp || 3) - (o.up || 1), life: 1, col: Array.isArray(col) ? col[i % col.length] : col, s: rnd(2, o.size || 5), gr: o.gr ?? .18, rot: rnd(0, 6), vr: rnd(-.3, .3), kind: o.kind || 'chip', floor: o.floor ?? 9999 });
}
function floatText(arr, x, y, txt, col = INK) { arr.push({ x, y, vx: 0, vy: -1, life: 1.3, col, txt, kind: 'txt', gr: 0, s: 0, rot: 0, vr: 0, floor: 9999 }); }
function drawParticles(arr) {
  for (let i = arr.length - 1; i >= 0; i--) {
    const p = arr[i]; p.x += p.vx; p.y += p.vy; p.vy += p.gr; p.rot += p.vr; p.life -= p.kind === 'curl' ? .008 : .02;
    if (p.y > p.floor) { p.y = p.floor; p.vy = 0; p.vx *= .8; p.vr *= .8; }
    if (p.life <= 0) { arr.splice(i, 1); continue; }
    g.save(); g.globalAlpha = clamp(p.life, 0, 1); g.translate(p.x, p.y); g.rotate(p.rot);
    if (p.kind === 'txt') { g.rotate(-p.rot); g.fillStyle = p.col; g.font = '22px "Permanent Marker"'; g.textAlign = 'center'; g.lineWidth = 4; g.strokeStyle = '#fff'; g.strokeText(p.txt, 0, 0); g.fillText(p.txt, 0, 0); }
    else if (p.kind === 'curl') {
      for (let k = 0; k < 2; k++) { g.beginPath(); for (let a = 0; a < 10; a += .2) { const r = 3 + a * 2.2, px = Math.cos(a) * r, py = Math.sin(a) * r * .7; a ? g.lineTo(px, py) : g.moveTo(px, py); } g.strokeStyle = k ? p.col : '#e8c08a'; g.lineWidth = k ? 1.6 : 5; g.stroke(); }
    } else if (p.kind === 'heart') { g.font = '20px serif'; g.fillText(p.col, 0, 0); }

}
const wob = s => Math.sin(s * 12.9898) * 43758.5453 % 1;
function sk(x, y, w, h, fill, line = INK, lw = 2.5) {
  if (fill) { g.fillStyle = fill; g.fillRect(x, y, w, h); }
  g.strokeStyle = line; g.lineWidth = lw; g.lineCap = 'round';
  for (let k = 0; k < 2; k++) {
    const j = (k + 1) * 1.2; g.beginPath();
    g.moveTo(x + wob(x + k) * j, y + wob(y + k) * j); g.lineTo(x + w + wob(w + k) * j, y + wob(x * 2 + k) * j);
    g.lineTo(x + w + wob(y + k * 3) * j, y + h + wob(h + k) * j); g.lineTo(x + wob(h * 2 + k) * j, y + h + wob(w * 3 + k) * j); g.closePath(); g.stroke(); g.globalAlpha = .45;
  }
  g.globalAlpha = 1;
}
function txt(t, x, y, size = 20, col = INK, align = 'center', font = 'Patrick Hand') { g.fillStyle = col; g.font = `${size}px "${font}"`; g.textAlign = align; g.fillText(t, x, y); }
function circ(x, y, r, fill, line = INK, lw = 2.5) { g.beginPath(); g.arc(x, y, r, 0, 7); if (fill) { g.fillStyle = fill; g.fill(); } if (line) { g.strokeStyle = line; g.lineWidth = lw; g.stroke(); } }
function hatch(x, y, w, h, col = 'rgba(43,43,48,.12)', step = 7) {
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.strokeStyle = col; g.lineWidth = 1.5;
  for (let i = -h; i < w; i += step) { g.beginPath(); g.moveTo(x + i, y + h); g.lineTo(x + i + h, y); g.stroke(); } g.restore();
}
function drawPencil(x, y, len, col, o = {}) {      // horizontal pencil, eraser at x, tip to the right
  const h = o.h || 26, ph = o.phase || 0, cone = o.cone ?? 34, lead = o.lead ?? 1, sharp = o.sharp ?? 1;
  g.save();
  sk(x, y - h / 2, h * .85, h, '#ff8fa3', INK, h > 15 ? 2.5 : 1.5); sk(x + h * .85, y - h / 2, h * .7, h, '#c9ccd3', INK, h > 15 ? 2.5 : 1.5);

    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
const adminCheck = text => sha256hex(String(text).trim().toLowerCase()) === ADMIN_HASH;

const adminCss = document.createElement('style');
adminCss.textContent = `
#admin { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; background:rgba(20,20,20,.45) }
#admin .ap { width:min(560px, 94vw); max-height:88vh; overflow:auto; background:#fffdf4; border:4px solid var(--ink); border-radius:16px; box-shadow:6px 6px 0 var(--ink); padding:14px 16px 16px; user-select:none }
#admin h2 { margin:0 0 4px; font:30px/1 "Lilita One", Impact, sans-serif; display:flex; align-items:center; gap:10px }
#admin h2 span { background:var(--red); color:#fff; font:13px Fredoka; padding:3px 8px; border-radius:999px; border:2px solid var(--ink) }
#admin h3 { margin:12px 0 6px; font:17px "Lilita One", Impact, sans-serif; color:var(--muted) }
#admin .row { display:flex; flex-wrap:wrap; gap:6px }
#admin button { background:#fff; border:3px solid var(--ink); border-radius:10px; box-shadow:2px 2px 0 var(--ink); padding:5px 10px; font-size:15px }
#admin button:active { transform:translate(2px,2px); box-shadow:none }
#admin button.y { background:var(--yellow) } #admin button.g { background:var(--green); color:#fff } #admin button.r { background:var(--red); color:#fff } #admin button.b { background:var(--blue); color:#fff }
#admin button.on { background:var(--ink); color:#fff }
#admin input { font:inherit; width:150px; padding:5px 8px; border:3px solid var(--ink); border-radius:10px; user-select:text }
#admin .x { margin-left:auto; background:var(--red); color:#fff }
#admin .note { font-size:13px; color:var(--muted); margin-top:10px }
#adminCode .ap { width:min(380px, 92vw) }`;
document.head.appendChild(adminCss);

function adminDo(msg, fn) {
  fn();
  refresh(); save(); sfx.done(); toast('Admin: ' + msg);
}

function openAdmin() {
  if (adminOpen) return;
  adminOpen = true;
  const el = document.createElement('div');
  el.id = 'admin';
  el.innerHTML = `<div class="ap">
    <h2>ADMIN PANEL <span>shh</span><button class="x" data-a="close">✕</button></h2>
    <h3>MONEY</h3>
    <div class="row">
      <button class="y" data-m="1000">+$1K</button><button class="y" data-m="1000000">+$1M</button>
      <button class="y" data-m="1000000000">+$1B</button><button class="y" data-m="1000000000000">+$1T</button>
      <input id="adminMoney" inputmode="decimal" placeholder="set money to..."><button data-a="setmoney">Set</button>
    </div>
    <h3>STUFF</h3>
    <div class="row">
      <button data-a="mat100">+100 of every material</button><button data-a="mat10k">+10K of every material</button>
      <button data-a="pencils">Fill the shop shelf</button><button data-a="golden">+5 golden logs</button>
    </div>
    <h3>PROGRESS</h3>
    <div class="row">
      <button class="g" data-a="research">Unlock all research</button><button class="g" data-a="shop">Max shop (Pencil Mall)</button>
      <button class="g" data-a="hats">Unlock all hats</button><button class="g" data-a="build">Finish all construction</button>
      <button class="g" data-a="shares">+10 shares</button><button class="g" data-a="goals">Skip all goals</button>
    </div>
    <h3>FACTORY SPEED</h3>
    <div class="row">${[1, 2, 5, 10].map(s => `<button data-s="${s}" class="${s === adminSpeed() ? 'on' : ''}">×${s}</button>`).join('')}</div>
    <h3>SAVE</h3>
    <div class="row"><button class="b" data-a="save">Save now</button><button class="r" data-a="wipe">Wipe save</button></div>
    <div class="note">Esc or ✕ closes this. Type the code again any time to come back.</div>
  </div>`;
  document.body.appendChild(el);
  el.addEventListener('pointerdown', e => { if (e.target === el) closeAdmin(); });
  el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => adminDo('+' + money(+b.dataset.m), () => { S.money += +b.dataset.m; }));
  el.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    window.pencilSpeed = +b.dataset.s;
    el.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b));
    toast(`Admin: factory runs ×${adminSpeed()}`);
  });
  const MATS = ['logs', 'graphite', 'clay', 'slats', 'leads', 'blanks', 'painted', 'shavings', 'dust'];
  const addMats = n => { for (const k of MATS) S[k] += n; S.pencils += n; S.pval += n * basePrice(); };
  const actions = {
    close: () => closeAdmin(),
    setmoney: () => {
      const v = Number(String($('#adminMoney').value).replace(/[$,\s]/g, ''));
      if (!isFinite(v) || v < 0) { toast('Admin: that isn\'t a number'); return; }
      adminDo('money set to ' + money(v), () => { S.money = v; });
    },
    mat100: () => adminDo('+100 of everything', () => addMats(100)),
    mat10k: () => adminDo('+10K of everything', () => addMats(10000)),
    pencils: () => adminDo('shelf filled', () => { const n = Math.max(0, standCap() - Math.floor(S.stock)); S.stock += n; S.stockVal += n * basePrice(); }),
    golden: () => adminDo('+5 golden logs', () => { S.golden += 5; }),
    research: () => adminDo('all research unlocked', () => { for (const r of RESEARCH) S.research[r.id] = true; }),
    shop: () => adminDo(SHOP[SHOP.length - 1].name + '!', () => { S.shopLvl = SHOP.length - 1; S.shopBuild = 0; S.shopProg = 0; }),
    hats: () => adminDo('every hat unlocked', () => { for (const h of HATS) S.life.hats[h[0]] = true; }),
    build: () => adminDo('everything is built', () => { for (const b of B) { b.built = true; b.prog = 1; } }),
    shares: () => adminDo('+10 shares', () => { S.shares += 10; }),
    goals: () => adminDo('all goals skipped', () => { S.goal = GOALS.length; }),
    save: () => { save(); sfx.done(); toast('Admin: saved'); },
    wipe: () => { if (confirm('Erase EVERYTHING in this save?')) { localStorage.removeItem(KEY); location.reload(); } },
  };
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => actions[b.dataset.a] && actions[b.dataset.a]());
  sfx.done();
}
function closeAdmin() {
  adminOpen = false;
  const el = $('#admin'); if (el) el.remove();
  for (const k in keys) keys[k] = false;
}

// a small code box (for phones, or anyone who'd rather type it in a box)
function openCodeBox() {
  if (adminOpen || $('#adminCode')) return;
  const el = document.createElement('div');
  el.id = 'admin'; el.className = 'code';
  el.innerHTML = `<div class="ap" id="adminCode"><h2>CODE? <button class="x" data-a="close">✕</button></h2>
    <div class="row"><input id="adminIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the code"><button class="g" data-a="go">OK</button></div></div>`;
  document.body.appendChild(el);
  const inp = $('#adminIn'); setTimeout(() => inp.focus(), 50);
  const done = () => el.remove();
  const go = () => { const ok = adminCheck(inp.value); done(); if (ok) openAdmin(); else toast('Nope.'); };
  el.querySelector('[data-a="go"]').onclick = go;
  el.querySelector('[data-a="close"]').onclick = done;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); if (e.key === 'Escape') done(); });
  el.addEventListener('pointerdown', e => { if (e.target === el) done(); });
}

// typing the code anywhere opens it; while the panel is open, keys don't reach the game
addEventListener('keydown', e => {
  if (adminOpen || $('#adminCode')) {
    if (e.key === 'Escape') { if (adminOpen) closeAdmin(); else { const c = $('#admin'); if (c) c.remove(); } }
    if (e.target.tagName !== 'INPUT') { e.stopImmediatePropagation(); if (e.code === 'Space') e.preventDefault(); }
    return;
  }
  if (e.key && e.key.length === 1) {
    adminBuf = (adminBuf + e.key.toLowerCase()).slice(-ADMIN_LEN);
    if (adminBuf.length === ADMIN_LEN && adminCheck(adminBuf)) { adminBuf = ''; openAdmin(); }
  }
}, true);
// 7 quick taps on the money counter opens the code box
let adminTaps = [];
$('#money').addEventListener('pointerdown', () => {
  const now = performance.now();
  adminTaps = adminTaps.filter(t => now - t < 3000); adminTaps.push(now);
  if (adminTaps.length >= 7) { adminTaps = []; openCodeBox(); }
});

</script>
