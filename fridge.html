<style>
:root{--cream:#fff6e4;--ink:#2b1d16;--cherry:#e2483b;--cherryD:#c23529;--mint:#a7dccb;--wood:#c98c55;--woodD:#a96d3c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e7cfa6;color:var(--ink);font-family:Rubik,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#c.hov{cursor:pointer}#c.drag{cursor:grabbing}
.back{position:fixed;top:12px;left:12px;z-index:6;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:999px;background:var(--cream);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none;letter-spacing:.01em}

.back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#hdr{position:fixed;top:8px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:4;white-space:nowrap}
#hdr .sign{display:inline-block;background:var(--cream);border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:4px 22px 7px}
#hdr h1{margin:0;font-family:Shrikhand,"Cooper Black",Georgia,serif;font-weight:400;font-size:clamp(30px,3.6vw,44px);line-height:1.1;color:var(--cherry);letter-spacing:.01em}
#hdr p{margin:1px 0 0;font-weight:800;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#7a4f33}
#tr{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:6}
.rb{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.rb svg{width:20px;height:20px}
#bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:var(--cream);border:2px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);z-index:5;transition:transform .3s,opacity .3s}
#bar.hide{transform:translate(-50%,140%);opacity:0;pointer-events:none}
.tb{min-width:64px;height:54px;border:0;border-radius:14px;background:transparent;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0 6px;letter-spacing:.01em}
.tb:hover{background:#f4e3c3}
.tb:active{transform:translateY(2px)}
.tb svg{width:24px;height:24px;flex:none}
.tb.main{background:var(--cherry);color:#fff}
.tb.main:hover{background:var(--cherryD)}
.tb.on{background:var(--mint)}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-12px);background:var(--ink);color:var(--cream);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:9;max-width:calc(100% - 24px);text-align:center;white-space:normal}
#toast.on{opacity:1;transform:translate(-50%,0)}
#beep{position:fixed;left:0;top:0;z-index:4;pointer-events:none;font-family:Shrikhand,Georgia,serif;font-size:22px;color:#fff;background:var(--cherry);border:2px solid var(--ink);border-radius:12px;padding:2px 10px 4px;box-shadow:0 3px 0 var(--ink);transform:translate(-50%,-140%) rotate(-6deg);opacity:0;transition:opacity .12s}
#beep.on{opacity:1}
/* drawer */
#bin{position:fixed;left:50%;bottom:0;width:min(780px,calc(100% - 16px));max-height:360px;transform:translate(-50%,108%);transition:transform .34s cubic-bezier(.2,.9,.3,1.08);z-index:8;background:var(--wood);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 3px,transparent 3px 11px),linear-gradient(#d39b63,#b97a45);border:2px solid var(--ink);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -5px 0 rgba(43,29,22,.22);padding:10px 10px 0;display:flex;flex-direction:column;height:min(46dvh,430px)}
#bin.on{transform:translate(-50%,0)}
.binhead{display:flex;align-items:center;gap:6px}
.binhead h2{font-family:Shrikhand,Georgia,serif;font-weight:400;color:var(--cream);margin:0 auto 0 4px;font-size:22px;text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.pill{min-height:40px;padding:0 13px;border-radius:999px;border:2px solid var(--ink);background:var(--cream);font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.pill:active{transform:translateY(2px);box-shadow:none}
.pill.warn{background:#ffd9d2}
.sm{display:none}
.x{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--cream);font-size:20px;font-weight:900;cursor:pointer;line-height:1;padding:0;box-shadow:0 2px 0 var(--ink);flex:none}
.tabs{display:flex;gap:4px;margin-top:9px}
.tab{flex:1;min-height:40px;border:2px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0;background:#ecc196;font-weight:800;font-size:13px;cursor:pointer;padding:0 4px;white-space:nowrap}
.tab.on{background:var(--cream)}
.binbody{background:var(--cream);border:2px solid var(--ink);border-bottom:0;flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px 18px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:0;-webkit-overflow-scrolling:touch}
.chip{font-family:"Libre Caslon Text",Georgia,"Times New Roman",serif;font-size:17px;background:#fffefb;border:1px solid #ddd5c4;box-shadow:0 2px 0 #b9ae98,1px 1px 0 #fff inset;padding:0 10px;min-height:40px;min-width:40px;cursor:pointer;color:#141414;border-radius:2px;transition:transform .1s}
.chip:hover{transform:rotate(-2deg) translateY(-1px)}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.let{font-family:Rubik,sans-serif;font-weight:900;font-size:27px;border:0;background:none;box-shadow:none;color:var(--c);text-shadow:0 3px 0 rgba(0,0,0,.28);min-width:44px;padding:0 4px}
.chip.pic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 6px 8px;font:800 12px Rubik,sans-serif;width:96px;border-radius:8px}
.chip.pic img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.chip.flash{animation:fl .35s}
@keyframes fl{0%{background:#ffe27a}100%{background:#fffefb}}
.sec{width:100%;font:800 11px Rubik,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#9a7253;margin:4px 0 -2px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(43,29,22,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
.card{background:var(--cream);border:2px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);max-width:440px;width:100%;padding:20px 20px 18px;position:relative;max-height:calc(100dvh - 32px);overflow:auto}
.card h3{font-family:Shrikhand,Georgia,serif;font-weight:400;font-size:28px;margin:0 0 10px;color:var(--cherry)}
.card .x{position:absolute;top:12px;right:12px}
.poem{font-family:"Libre Caslon Text",Georgia,serif;font-size:19px;line-height:1.55;background:#fff;border:1px solid #e1d8c5;border-radius:6px;padding:14px 16px;white-space:pre-wrap;margin:0 0 12px;max-height:46dvh;overflow:auto;user-select:text;-webkit-user-select:text}
.card ul{margin:0;padding:0 0 0 2px;list-style:none;display:grid;gap:9px;font-size:15px;line-height:1.35}
.card li b{display:inline-block;min-width:0;background:var(--mint);border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;margin-right:6px;font-size:13px}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.status{font-weight:700;font-size:14px;color:#3d7a5f;min-height:20px}
/* loader */
#load{position:fixed;inset:0;z-index:30;background:#e7cfa6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#load.gone{opacity:0;pointer-events:none}
#load .t{font-family:Shrikhand,Georgia,serif;font-size:26px;color:var(--cherry);text-shadow:2px 2px 0 var(--ink)}
#load .s{font-weight:700;color:#7a4f33;font-size:14px;max-width:320px;text-align:center}
#load svg{animation:hum .18s infinite alternate}
@keyframes hum{from{transform:translateX(-1px)}to{transform:translateX(1px)}}
@media (max-width:560px){
  #hdr{top:12px}#hdr .sign{padding:2px 12px 4px;border-radius:13px;box-shadow:0 3px 0 var(--ink)}#hdr h1{font-size:25px}#hdr p{display:none}
  .back{padding:0 12px;font-size:13px}
  .tb{min-width:52px;padding:0 3px;font-size:11px;height:52px}
  .tb svg{width:22px;height:22px}
  #bar{gap:2px;padding:5px}
  #toast{top:66px;font-size:13px}
  .binhead h2{font-size:18px} .lg{display:none} .sm{display:inline}
  .tab{font-size:12px}
  .pill{padding:0 10px;font-size:12px}
}
@media (max-width:360px){ #hdr h1{font-size:21px} .tb{min-width:47px} }

function findPaperSpot(d,e,px,py){ const R=doorRect(d), Hz=handleZone(d); let best=null, bs=1e9;

    let ov=0; for(const o of ENTS){ if(o.state!=='stuck'||o.door!==d||o===e) continue; const [ox,oy]=o.cat==='paper'?[o.hw,o.hh]:ext2(o); const ix=Math.min(x+e.hw,o.x+ox)-Math.max(x-e.hw,o.x-ox), iy=Math.min(y+e.hh,o.y+oy)-Math.max(y-e.hh,o.y-oy); if(ix>0&&iy>0) ov+=ix*iy*(o.cat==='paper'?3:1); }
    const sc=ov*100+Math.hypot(x-px,y-py)*0.02; if(sc<bs){ bs=sc; best=[x,y]; } if(ov===0&&i>40) break; }
  return best; }
function findSpot(d,e,px,py){ const R=doorRect(d); const [ex,ey]=ext2(e); for(const avoid of [true,false]) for(let r=0;r<0.9;r+=0.011){ const n=Math.max(1,Math.round(r*90)); const a0=Math.random()*6.28; for(let i=0;i<n;i++){ const a=a0+i/n*Math.PI*2; const x=px+Math.cos(a)*r, y=py+Math.sin(a)*r*0.85; if(x-ex<R.x0||x+ex>R.x1||y-ey<R.y0||y+ey>R.y1) continue; if(!overlapsAny(e,x,y,d)&&!(avoid&&coversPaper(e,x,y,d))) return [x,y]; } } return null; }

// a spot for a magnet that has to land ON a given paper (to hold it up)
function findSpotOn(d,e,p,px,py){ for(let r=0;r<0.2;r+=0.006){ const n=Math.max(1,Math.round(r*120)); const a0=Math.random()*6.28; for(let i=0;i<n;i++){ const a=a0+i/n*Math.PI*2; const x=px+Math.cos(a)*r, y=py+Math.sin(a)*r; if(inPaper(p,x,y,0.012)&&!overlapsAny(e,x,y,d)) return [x,y]; } } return [p.x,p.y+p.hh*0.6]; }
/* ---------- flying in from the drawer ---------- */
// aim new magnets at the part of the door you can actually see (above the open drawer)
function visiblePref(){ const top=bin.classList.contains('on')?bin.getBoundingClientRect().top:innerHeight-80; const y0=SMALL?70:100;
  for(let i=0;i<6;i++){ const sx=innerWidth/2+rand(-0.12,0.12)*Math.min(innerWidth,700), sy=y0+(top-y0)*rand(0.35,0.75); setRay({clientX:sx,clientY:sy}); const h=doorFrontHit(); if(h&&inRect(h.d,h.lp.x,h.lp.y,0.03,0.03)) return {d:h.d,x:h.lp.x,y:h.lp.y}; }
  return null; }
const flying=[];
function launch(e,opt={}){
  e.rot=e.kind==='word'?rand(-0.035,0.035):rand(-0.18,0.18);
  if(e.cat==='paper') e.rot=rand(-0.06,0.06);
  let d=opt.door||DOOR.F, spot=null;
  const vis=opt.door?null:visiblePref();
  const tries=opt.door?[opt.door]:(vis&&vis.d===DOOR.Z?[DOOR.Z,DOOR.F]:[DOOR.F,DOOR.Z]);
  for(const dd of tries){ const pr=vis&&vis.d===dd?[vis.x,vis.y]:dd===DOOR.F?[-0.38+rand(-0.08,0.08),0.78+rand(-0.12,0.18)]:[-0.36+rand(-0.08,0.08),1.52]; if(opt.at&&dd===opt.door) pr.splice(0,2,opt.at[0],opt.at[1]); spot=e.cat==='paper'?findPaperSpot(dd,e,pr[0],pr[1]):opt.onto?findSpotOn(dd,e,opt.onto,pr[0],pr[1]):findSpot(dd,e,pr[0],pr[1]); if(spot){ d=dd; break; } }
  // start in front of the camera, low
  const start=V3(rand(-0.15,0.15),-0.35,-0.7).applyMatrix4(camera.matrixWorld);
  dyn.add(e.obj); e.obj.position.copy(start); e.obj.rotation.set(rand(-1,1),rand(-1,1),rand(-1,1));
  if(!spot){ // fridge is full: drop it on the floor
    e.state='loose'; addBody(e,start,e.obj.quaternion); e.body.velocity.set(rand(-0.3,0.3),1,-1.2); toast('The fridge is full! It fell on the floor.'); dirty=true; return; }
  e.state='fly'; e.fly={d,x:spot[0],y:spot[1],t:0,from:start.clone(),q0:e.obj.quaternion.clone(),hold:opt.hold||null,onto:opt.onto||null};
  flying.push(e); sfx('whoosh',0.35);
}
function updateFlying(dt){
  for(let i=flying.length-1;i>=0;i--){ const e=flying[i], f=e.fly; f.t+=dt/0.5; const t=Math.min(1,f.t), k=1-Math.pow(1-t,3);
    const target=f.d.g.localToWorld(V3(f.x,f.y,DOOR_T+0.03));
    e.obj.position.lerpVectors(f.from,target,k); e.obj.position.y+=Math.sin(t*Math.PI)*0.18;
    const tq=f.d.g.getWorldQuaternion(new THREE.Quaternion()).multiply(new THREE.Quaternion().setFromAxisAngle(V3(0,0,1),e.rot));
    e.obj.quaternion.slerpQuaternions(f.q0,tq,k);
    if(t>=1){ flying.splice(i,1); attach(e,f.d,f.x,f.y,e.rot); if(f.onto) f.onto.pending=false; if(e.cat==='mag'){ snapWord(e); resolveSpot(e); }
      if(f.hold){ e.pending=true; launch(f.hold,{door:f.d,onto:e,at:[f.x+rand(-0.02,0.02),f.y+e.hh*0.55]}); } } }
}

/* =====================================================================
   save / load
   ===================================================================== */
const SAVE_KEY='fridge_door_v1';
let dirty=false;
function serialize(){ const items=[]; for(const e of ENTS){ if(e.cat==='food') continue; if(e.state==='fly') continue;
  const it={c:e.cat,k:e.kind,key:e.key}; if(e.color) it.col=e.color;
  if(e.state==='stuck'){ it.s='d'; it.d=e.door.name; it.x=+e.x.toFixed(4); it.y=+e.y.toFixed(4); it.r=+e.rot.toFixed(3); }
  else if(e.body){ it.s='f'; const p=e.body.position, q=e.body.quaternion; it.p=[+p.x.toFixed(3),+p.y.toFixed(3),+p.z.toFixed(3)]; it.q=[q.x,q.y,q.z,q.w].map(v=>+v.toFixed(3)); }
  else continue; items.push(it); }
  return {v:1,items}; }
function save(){ dirty=false; lsSet(SAVE_KEY,JSON.stringify(serialize())); }
function load(){ let data=null; try{ data=JSON.parse(lsGet(SAVE_KEY)||'null'); }catch(e){}
  if(!data||!Array.isArray(data.items)||!data.items.length) return false;
  let ok=0;
  for(const it of data.items){ try{
    let e=null; if(it.c==='paper'){ if(it.key!=='mom'&&!PICS[it.key]) continue; if(it.key==='mom'&&momEnt) continue; e=makePaper(it.key); }
    else if(it.k==='word') e=makeWord(String(it.key).slice(0,40)); else if(it.k==='letter') e=makeLetter(String(it.key).slice(0,1),it.col); else if(it.k==='shape'&&SH[it.key]) e=makeShape(it.key,it.col); else continue;
    if(it.s==='d'&&DOOR[it.d]){ placeStuck(e,DOOR[it.d],+it.x||-0.3,+it.y||0.6,+it.r||0); clampRect(e); }
    else if(it.s==='f'&&it.p){ dyn.add(e.obj); e.state='loose'; const p=V3(clamp(+it.p[0],-2.5,1.0),Math.max(0.03,+it.p[1]),clamp(+it.p[2],-0.38,2.5)); const q=it.q?new THREE.Quaternion(+it.q[0],+it.q[1],+it.q[2],+it.q[3]).normalize():new THREE.Quaternion(); e.obj.position.copy(p); e.obj.quaternion.copy(q); addBody(e,p,q); }
    else { destroy(e); continue; }
    ok++; }catch(err){} }
  if(!momEnt){ const mom=makePaper('mom'); const sp=findPaperSpot(DOOR.F,mom,-0.19,0.99); placeStuck(mom,DOOR.F,sp[0],sp[1],0.03); const h=makeShape('button','#e63946'); placeStuck(h,DOOR.F,sp[0],sp[1]+mom.hh-0.02,0); }
  return ok>0; }

/* =====================================================================
   audio (all synthesized)
   ===================================================================== */
const AU={ctx:null,on:lsGet('fridge_sound')!=='0',n:0};
function audioInit(){ if(AU.ctx){ if(AU.ctx.state==='suspended') AU.ctx.resume(); return; }
  try{ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; const c=new C(); AU.ctx=c;
    AU.master=c.createGain(); AU.master.gain.value=AU.on?0.85:0; AU.master.connect(c.destination);
    AU.sfx=c.createGain(); AU.sfx.gain.value=1; AU.sfx.connect(AU.master);
    const len=c.sampleRate; const buf=c.createBuffer(1,len,c.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=buf;
    // fridge hum: mains buzz + compressor + fan hiss
    const hum=c.createGain(); hum.gain.value=0; hum.connect(AU.master); AU.hum=hum;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; lp.connect(hum);
    const o1=c.createOscillator(); o1.type='sawtooth'; o1.frequency.value=60; const g1=c.createGain(); g1.gain.value=0.5; o1.connect(g1); g1.connect(lp); o1.start();
    const o2=c.createOscillator(); o2.type='sine'; o2.frequency.value=120; const g2=c.createGain(); g2.gain.value=0.7; o2.connect(g2); g2.connect(lp); o2.start();
    const lfo=c.createOscillator(); lfo.frequency.value=0.13; const lg=c.createGain(); lg.gain.value=1.2; lfo.connect(lg); lg.connect(o1.frequency); lfo.start();
    const fan=c.createBufferSource(); fan.buffer=buf; fan.loop=true; const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=0.6; const fg=c.createGain(); fg.gain.value=0; fan.connect(bp); bp.connect(fg); fg.connect(AU.master); fan.start(); AU.fan=fg;
  }catch(e){ AU.ctx=null; } }
function nb(t0,dur,type,f,q,gain,f2){ const c=AU.ctx; const s=c.createBufferSource(); s.buffer=AU.noise; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.setValueAtTime(f,t0); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t0+dur); fl.Q.value=q; const g=c.createGain(); g.gain.setValueAtTime(gain,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); s.connect(fl); fl.connect(g); g.connect(AU.sfx); s.start(t0,Math.random()*0.8); s.stop(t0+dur+0.03); }
function tn(t0,type,f0,f1,dur,gain){ const c=AU.ctx; const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(f0,t0); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(f1,t0+dur); const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(gain,t0+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); o.connect(g); g.connect(AU.sfx); o.start(t0); o.stop(t0+dur+0.03); return o; }
function sfx(type,v=1){ if(!AU.ctx||!AU.on||AU.n>9) return; AU.n++; const t=AU.ctx.currentTime+0.005; v=clamp(v,0.05,1.4);
  switch(type){
    case 'slap': nb(t,0.05,'bandpass',2200,1.5,0.55*v); tn(t,'sine',260,110,0.07,0.32*v); break;
    case 'clack': nb(t,0.035,'bandpass',3200,2,0.4*v); tn(t,'sine',900,380,0.03,0.12*v); break;
    case 'tick': nb(t,0.025,'bandpass',3800+Math.random()*1500,3,0.35*v); break;
    case 'thud': tn(t,'sine',150,60,0.13,0.45*v); nb(t,0.07,'lowpass',600,0.7,0.25*v); break;
    case 'box': nb(t,0.08,'lowpass',900,0.8,0.35*v); tn(t,'sine',120,80,0.08,0.2*v); break;
    case 'clink': tn(t,'sine',1700+Math.random()*500,1650,0.16,0.12*v); tn(t,'sine',2600+Math.random()*400,2500,0.1,0.07*v); nb(t,0.02,'highpass',3000,1,0.15*v); break;
    case 'paper': nb(t,0.06,'highpass',2500,0.6,0.08*v); break;
    case 'egg': for(let i=0;i<4;i++) nb(t+i*0.013,0.02,'highpass',2400,1,0.4*v); nb(t+0.05,0.22,'lowpass',500,0.8,0.5*v,200); break;
    case 'jelly': { const o=tn(t,'sine',240,130,0.38,0.3*v); const l=AU.ctx.createOscillator(); l.frequency.value=17; const lg=AU.ctx.createGain(); lg.gain.value=40; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t+0.4); break; }
    case 'thunk': tn(t,'sine',95,42,0.22,0.7*v); nb(t,0.16,'lowpass',320,0.7,0.5*v); nb(t+0.02,0.09,'bandpass',700,1,0.15*v); break;
    case 'whoosh': nb(t,0.4,'bandpass',350,0.9,0.22*v,1600); break;
    case 'suck': tn(t,'sine',320,170,0.06,0.25*v); nb(t,0.35,'bandpass',500,0.8,0.18*v,1400); break;
    case 'beep': tn(t,'square',2150,2150,0.1,0.07*v); tn(t+0.17,'square',2150,2150,0.1,0.07*v); break;
    case 'rattle': for(let i=0;i<12;i++) nb(t+i*0.06+Math.random()*0.03,0.03,'bandpass',1500+Math.random()*2500,2,0.3*v); tn(t,'sine',70,50,0.8,0.35*v); break;
    case 'quack': for(const d of [0,0.18]){ const o=tn(t+d,'sawtooth',560,360,0.14,0.12*v); } nb(t,0.3,'bandpass',1100,4,0.1*v); break;
    case 'ding': tn(t,'sine',1320,1320,0.5,0.15*v); tn(t+0.08,'sine',1760,1760,0.6,0.12*v); break;
    case 'pop': tn(t,'sine',500,900,0.07,0.18*v); break;
  } }
function setSound(on){ AU.on=on; lsSet('fridge_sound',on?'1':'0'); if(AU.master) AU.master.gain.value=on?0.85:0; $('#sndWave').style.display=on?'':'none'; $('#sndX').style.display=on?'none':''; }

/* =====================================================================
   collisions → sounds, eggs, jelly
   ===================================================================== */
const crackQ=[]; const splats=[];
function onCollide(e,ev){ const c=ev.contact; const v=Math.abs(c.getImpactVelocityAlongNormal()); const now=performance.now();
  if(e.fragile&&v>2.0&&now>crackOK&&!e.cracked){ e.cracked=true; const bi=c.bi; const pt=V3(bi.position.x+c.ri.x,bi.position.y+c.ri.y,bi.position.z+c.ri.z); const n=V3(c.ni.x,c.ni.y,c.ni.z); if(bi===e.body) n.negate(); const other=ev.body; crackQ.push({e,pt,n,other}); return; }
  if(v>0.55&&(!e.lastSnd||now-e.lastSnd>90)){ e.lastSnd=now; sndQ.push([e.snd||'thud',clamp(v/3,0.15,1.2)]); }
  if(e.jelly&&v>0.9&&e.wob){ e.wob.vx+=rand(-1,1)*v*0.8; e.wob.vz+=rand(-1,1)*v*0.8; e.wob.vy+=v*0.5; } }
const sndQ=[];
const splatWhite=new THREE.MeshPhysicalMaterial({color:'#fbfbf4',transparent:true,opacity:0.88,roughness:0.08,clearcoat:1,polygonOffset:true,polygonOffsetFactor:-2,depthWrite:false});
const yolkMat=phys('#ffb21a',{roughness:0.1,clearcoat:1});
let crackedOnce=false;
function crack(q){ const e=q.e; if(!ENTS.includes(e)) return; const pos=e.obj.position.clone();
  destroy(e); sfx('egg',1);
  if(!crackedOnce){ crackedOnce=true; toast('CRACK! That was an egg.'); }
  if(q.other&&(q.other.type===CANNON.Body.STATIC||q.other.type===CANNON.Body.KINEMATIC)){
    const g=new THREE.Group(); const s=new THREE.Shape(); const r=srand(Math.random()*1e6|0); const N=11; for(let i=0;i<=N;i++){ const a=i/N*Math.PI*2, rr=0.03+r()*0.018; const x=Math.cos(a)*rr, y=Math.sin(a)*rr; i?s.lineTo(x,y):s.moveTo(x,y); }
    const w=new THREE.Mesh(new THREE.ShapeGeometry(s,4),splatWhite); w.renderOrder=1; g.add(w);
    const y=new THREE.Mesh(new THREE.SphereGeometry(0.013,16,10),yolkMat); y.scale.z=0.42; y.position.set(rand(-0.006,0.006),rand(-0.006,0.006),0.003); g.add(y);
    g.position.copy(q.pt).addScaledVector(q.n,0.002); g.quaternion.setFromUnitVectors(V3(0,0,1),q.n); g.userData.noPick=true; g.traverse(o=>o.userData.noPick=true);
    const door=doors.find(d=>d.body===q.other); if(door) door.g.attach(g); else scene.add(g);
    splats.push(g); if(splats.length>14){ const o=splats.shift(); o.parent&&o.parent.remove(o); } }
  for(let i=0;i<2;i++){ const sh=spawnFood('shell',null,pos.x+rand(-0.01,0.01),pos.y+0.02,pos.z+rand(-0.01,0.01),rand(-3,3),0,rand(-3,3)); sh.body.velocity.set(rand(-0.6,0.6),rand(0.6,1.4),rand(-0.6,0.6)); }
  const shells=ENTS.filter(x=>x.kind==='shell'); while(shells.length>12) destroy(shells.shift());
}

function chip(cls,label,fn,style){ const b=document.createElement('button'); b.className='chip '+cls; if(style) b.setAttribute('style',style); b.innerHTML=label; b.onclick=()=>{ audioInit(); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); fn(); }; return b; }
function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function magCount(){ return ENTS.filter(e=>e.cat!=='food').length; }
function canAdd(){ if(magCount()>=170){ toast('Whoa, that is a LOT of magnets. Clear some words first!'); return false; } return true; }
function fillBin(){ const body=$('#binBody'); body.innerHTML=''; body.scrollTop=0;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===binTab));
  if(binTab==='words'||binTab==='silly'){ for(const w of (binTab==='words'?WORDS:SILLY)) body.appendChild(chip('',esc(w),()=>{ if(canAdd()) launch(makeWord(w)); })); }
  else if(binTab==='letters'){ LETTERS.forEach((L,i)=>{ const col=LCOL[i%LCOL.length]; body.appendChild(chip('let',esc(L),()=>{ if(canAdd()) launch(makeLetter(L,col)); },'--c:'+col)); }); }
  else if(binTab==='magnets'){ for(const [k,name] of SHAPE_LIST){ if(!thumbs[k]) thumbs[k]=shapeThumb(k); body.appendChild(chip('pic',`<img alt="" src="${thumbs[k]}">${esc(name)}`,()=>{ if(!canAdd()) return; launch(makeShape(k)); if(k==='duck') setTimeout(()=>sfx('quack',0.8),450); })); } }
  else if(binTab==='pics'){ for(const [k,name] of PIC_LIST){ if(!thumbs['p_'+k]) thumbs['p_'+k]=picThumb(k); body.appendChild(chip('pic',`<img alt="" src="${thumbs['p_'+k]}">${esc(name)}`,()=>{ if(!canAdd()) return; const p=makePaper(k); const m=makeShape('button'); launch(p,{hold:m}); })); } }
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ binTab=t.dataset.t; fillBin(); });
$('#binX').onclick=()=>openBin(false);
$('#bWords').onclick=()=>{ audioInit(); openBin(true); };
$('#handful').onclick=()=>{ audioInit(); const pool=WORDS.filter(w=>w.length>1&&w[0]!=='-').concat(SILLY.filter(w=>w.length<9)); for(let i=0;i<8;i++){ if(!canAdd()) break; const w=pick(pool); setTimeout(()=>launch(makeWord(w)),i*90); } };
let clearArm=0;
$('#clearWords').onclick=()=>{ const b=$('#clearWords'); if(Date.now()-clearArm>2500){ clearArm=Date.now(); const old=b.innerHTML; b.textContent=innerWidth<560?'Sure?':'Tap again to clear'; setTimeout(()=>b.innerHTML=old,2500); return; } clearArm=0; let n=0; for(const e of ENTS.slice()) if(e.kind==='word'||e.kind==='letter'){ if(e.state==='fly') { const i=flying.indexOf(e); if(i>=0) flying.splice(i,1); } destroy(e); n++; } dirty=true; toast(n?`Swept ${n} word${n>1?'s':''} back into the drawer.`:'No words to clear.'); sfx('rattle',0.5); };
let thumbRT=null;
function shapeThumb(k){ try{ const s=SH[k](k==='button'?'#e63946':undefined); const sc=new THREE.Scene(); sc.environment=scene.environment; sc.add(new THREE.HemisphereLight('#ffffff','#8a6a50',1.4)); const dl=new THREE.DirectionalLight('#ffffff',2.4); dl.position.set(1,2,3); sc.add(dl); sc.add(s.g);
    const cam=new THREE.PerspectiveCamera(28,1,0.01,10); const r=Math.max(s.hw,s.hh)*1.2; cam.position.set(0,0,r/Math.tan(THREE.MathUtils.degToRad(14))); cam.lookAt(0,0,0); s.g.rotation.set(0.12,-0.3,0);
    const N=192; if(!thumbRT) thumbRT=new THREE.WebGLRenderTarget(N,N); const tm=renderer.toneMapping; renderer.setRenderTarget(thumbRT); renderer.setClearColor(0x000000,0); renderer.clear(); renderer.render(sc,cam); const px=new Uint8Array(N*N*4); renderer.readRenderTargetPixels(thumbRT,0,0,N,N,px); renderer.setRenderTarget(null); renderer.setClearColor(0x000000,1); renderer.toneMapping=tm;
    const c=document.createElement('canvas'); c.width=c.height=N; const g=c.getContext('2d'); const id=g.createImageData(N,N); const L=v=>{ v/=255; v=v<=0.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-0.055; return Math.round(clamp(v,0,1)*255); };
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const si=((N-1-y)*N+x)*4, di=(y*N+x)*4; id.data[di]=L(px[si]); id.data[di+1]=L(px[si+1]); id.data[di+2]=L(px[si+2]); id.data[di+3]=px[si+3]; }
    g.putImageData(id,0,0); s.g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); return c.toDataURL(); }catch(err){ return ''; } }
function picThumb(k){ const d=PICS[k]; const c=document.createElement('canvas'); c.width=d.cw; c.height=d.ch; const g=c.getContext('2d'); d.draw(g,d.cw,d.ch); const o=document.createElement('canvas'); const s=120/Math.max(d.cw,d.ch); o.width=Math.round(d.cw*s); o.height=Math.round(d.ch*s); o.getContext('2d').drawImage(c,0,0,o.width,o.height); return o.toDataURL(); }

/* ---------- poem ---------- */
function poemText(){ const lines=[];
  for(const d of [DOOR.Z,DOOR.F]){ const tiles=ENTS.filter(e=>e.state==='stuck'&&e.door===d&&(e.kind==='word'||e.kind==='letter')).sort((a,b)=>b.y-a.y);
    const rows=[]; for(const t of tiles){ let r=rows.find(r=>Math.abs(r.y-t.y)<0.022); if(!r){ r={y:t.y,items:[]}; rows.push(r); } r.items.push(t); r.y=(r.y*(r.items.length-1)+t.y)/r.items.length; }
    rows.sort((a,b)=>b.y-a.y);
    for(const r of rows){ r.items.sort((a,b)=>a.x-b.x); let s='', prev=null;
      for(const t of r.items){ let tok=t.key; let glue=false;
        if(prev){ const gap=(t.x-t.hw)-(prev.x+prev.hw); if(t.kind==='letter'&&prev.kind==='letter'&&gap<0.012) glue=true; if(t.kind==='word'&&/^-/.test(tok)) glue=true; if(/^[!?.,]$/.test(tok)) glue=true; }
        if(t.kind==='word'&&/^-./.test(tok)) tok=tok.slice(1);
        s+=(prev&&!glue?' ':'')+tok; prev=t; }
      lines.push(s); }
    if(rows.length&&d===DOOR.Z) lines.push(''); }
  while(lines.length&&lines[lines.length-1]==='') lines.pop(); while(lines.length&&lines[0]==='') lines.shift();
  return lines.join('\n'); }
async function sharePoem(){ const p=poemText();
  if(!p.trim()){ modal('<h3>No poem yet</h3><p>Open the <b>Words</b> drawer and stick some words on the fridge. Then come back here to copy your poem.</p><div class="row"><button class="pill" id="pw">Open the drawer</button></div>'); $('#pw').onclick=()=>{ closeModal(); openBin(true); }; return; }
  const full=p+'\n\n— written on The Fridge at kaifun.fun';
  modal(`<h3>Your fridge poem</h3><div class="poem" id="poemTxt">${esc(p)}</div><div class="status" id="pst">Copying…</div><div class="row"><button class="pill" id="pcopy">Copy again</button><button class="pill" id="pclose">Done</button></div>`);
  const st=$('#pst'); const doCopy=async()=>{ let ok=false; try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(full); ok=true; } }catch(e){}
    if(!ok){ try{ const ta=document.createElement('textarea'); ta.value=full; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(e){} }
    st.textContent=ok?'Copied! Paste it anywhere.':'Could not copy automatically — select the poem above and copy it.'; st.style.color=ok?'#3d7a5f':'#c23529'; window.__fridgeLastCopy=ok?full:null; };
  $('#pcopy').onclick=doCopy; $('#pclose').onclick=closeModal; await doCopy(); }

/* =====================================================================
   camera + orbit controls
   ===================================================================== */
function fitDist(){ const tv=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)); const a=innerWidth/innerHeight; const hv=1.0/tv*(a<0.8?1.12:1.08); const hwid=a<0.8?0.5:0.95; const hh=hwid/(tv*a); return clamp(Math.max(hv,hh),1.8,4.6); }
const VIEWS=[{n:'Fridge',t:[-0.02,0.93,0.28],az:-0.3,pol:1.4,f:1},{n:'Magnets',t:[-0.04,0.9,0.36],az:-0.08,pol:1.5,f:0.52},{n:'Inside',t:[0.0,0.82,0.05],az:-0.14,pol:1.32,f:0.72}];
let viewI=0, camTween=null;
function viewPose(v){ const d=fitDist()*v.f; const t=V3(...v.t); const a=innerWidth/innerHeight; if(v.n==='Fridge'&&a>1.15) t.x-=Math.min(0.32,(a-1.15)*0.6); const p=V3(Math.sin(v.az)*Math.sin(v.pol),Math.cos(v.pol),Math.cos(v.az)*Math.sin(v.pol)).multiplyScalar(d).add(t); return {p,t}; }
function goView(i,instant){ viewI=i; const v=VIEWS[i]; const {p,t}=viewPose(v); $('#bView span').textContent=i===0?'View':v.n;
  if(i===2&&DOOR.F.theta<1.2) swingDoor(DOOR.F,true);
  if(instant){ camera.position.copy(p); controls.target.copy(t); controls.update(); return; }
  camTween={p0:camera.position.clone(),t0:controls.target.clone(),p,t,k:0}; controls.enabled=false; }
let controls;
function setupControls(){ controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.dampingFactor=0.08; controls.enablePan=false; controls.rotateSpeed=0.6; controls.zoomSpeed=0.9;
  controls.minDistance=0.55; controls.maxDistance=fitDist()*1.32; controls.minPolarAngle=0.5; controls.maxPolarAngle=1.53; controls.minAzimuthAngle=-0.95; controls.maxAzimuthAngle=0.72;
  controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN}; }

/* =====================================================================
   pointer interaction
   ===================================================================== */
const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2();
let P=null;
function setRay(ev){ const r=canvas.getBoundingClientRect(); ndc.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera); }
function pickAt(ev){ setRay(ev); const hits=ray.intersectObjects([fridge,dyn,kitchen],true);
  for(const h of hits){ let o=h.object; if(o.userData.noPick||o.type==='Sprite'||!o.visible) continue; while(o&&!o.userData.pick) o=o.parent; if(o) return {h,pk:o.userData.pick}; return null; } return null; }
function doorFrontHit(){ const hits=ray.intersectObjects(doors.map(d=>d.panel),false); for(const h of hits){ const d=doors.find(dd=>dd.panel===h.object); const lp=d.g.worldToLocal(h.point.clone()); if(lp.z>DOOR_T-0.006) return {d,lp}; } return null; }
function grabStart(e,point){ const b=e.body; b.wakeUp(); const lp=CV(); b.pointToLocalFrame(CV(point.x,point.y,point.z),lp);
  hand.position.set(point.x,point.y,point.z);
  P.cons=new CANNON.PointToPointConstraint(b,lp,hand,CV(0,0,0),Math.max(3,b.mass*140)); world.addConstraint(P.cons);
  P.plane=new THREE.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(V3()).negate(),point);
  P.damp=[b.linearDamping,b.angularDamping]; b.linearDamping=0.45; b.angularDamping=0.92; e.held=true; P.mode='grab'; P.horiz=false; canvas.classList.add('drag'); }
function grabEnd(pp=P){ if(!pp||!pp.cons) return; world.removeConstraint(pp.cons); const e=pp.ent; pp.cons=null; if(e&&e.body){ const b=e.body; b.linearDamping=pp.damp[0]; b.angularDamping=pp.damp[1]; const v=b.velocity, s=v.length(); if(s>7) v.scale(7/s,v); b.wakeUp(); } if(e) e.held=false; }
function slideStart(e,lp){ P.mode='slide'; e.held=true; P.off=[lp.x-e.x,lp.y-e.y]; sfx('clack',0.6); canvas.classList.add('drag'); if(e.cat==='paper') e.layer=7; }
canvas.addEventListener('pointerdown',ev=>{
  audioInit(); if(P||camTween) return; if(ev.button&&ev.button!==0) return;
  const r=pickAt(ev); if(!r) return;
  P={id:ev.pointerId,x0:ev.clientX,y0:ev.clientY,t0:performance.now(),moved:0,pk:r.pk,ent:r.pk.ent||null};
  controls.enabled=false; try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
  const pk=r.pk;
  if(pk.type==='ent'){ const e=pk.ent;
    if(e.state==='stuck'){ const lp=e.door.g.worldToLocal(r.h.point.clone()); slideStart(e,lp); }
    else if(e.state==='door'){ const wp=e.obj.getWorldPosition(V3()), wq=e.obj.getWorldQuaternion(new THREE.Quaternion()); dyn.add(e.obj); e.obj.position.copy(wp); e.obj.quaternion.copy(wq); e.state='loose'; e.door=null; addBody(e,wp,wq); grabStart(e,r.h.point); }
    else if(e.state==='loose'&&e.body){ e.cool=Math.min(e.cool||0,0.25); grabStart(e,r.h.point); }
    else { P=null; controls.enabled=true; return; } }
  else if(pk.type==='door'||pk.type==='handle'){ P.mode='door'; P.door=pk.door; P.local=pk.door.g.worldToLocal(r.h.point.clone()); P.th0=pk.door.theta; pk.door.drag=false; P.door.hist=[]; }
});
canvas.addEventListener('pointermove',ev=>{
  if(!P){ if(!COARSE){ const r=pickAt(ev); canvas.classList.toggle('hov',!!r); } return; }
  if(ev.pointerId!==P.id) return;
  P.moved=Math.max(P.moved,Math.hypot(ev.clientX-P.x0,ev.clientY-P.y0)); P.lx=ev.clientX; P.ly=ev.clientY;
  setRay(ev);
  if(P.mode==='slide') slideMove(); else if(P.mode==='grab') grabMove(); else if(P.mode==='door') doorMove(ev);
});
function slideMove(){ const e=P.ent; if(!e||e.state!=='stuck') return;
  const hit=doorFrontHit();
  if(hit&&hit.d!==e.door&&inRect(hit.d,hit.lp.x,hit.lp.y)){ e.door=hit.d; hit.d.g.add(e.obj); }
  let lp=null; if(hit&&hit.d===e.door) lp=hit.lp; else { const d=e.door; const pl=new THREE.Plane().setFromNormalAndCoplanarPoint(doorNormal(d),d.g.localToWorld(V3(0,0,DOOR_T))); const pt=ray.ray.intersectPlane(pl,V3()); if(pt) lp=d.g.worldToLocal(pt); }
  const R=doorRect(e.door);
  if(!lp||lp.x<R.x0-0.035||lp.x>R.x1+0.035||lp.y<R.y0-0.035||lp.y>R.y1+0.035){ // pulled off the edge
    const off=P.off; detach(e,V3(0,0,0),0.2); e.cool=0.35; const wp=e.obj.position.clone(); grabStart(e,wp); sfx('clack',0.8); return; }
  e.x=lp.x-P.off[0]; e.y=lp.y-P.off[1]; clampRect(e); }
function grabMove(){ const e=P.ent; if(!e||!e.body) return;
  if(e.cat!=='food'){ const hit=doorFrontHit(); if(hit&&inRect(hit.d,hit.lp.x,hit.lp.y,0.004,0.004)&&e.cool<=0.25){ grabEnd(); P.mode='slide'; attach(e,hit.d,hit.lp.x,hit.lp.y,rotFromBody(e,hit.d)); clampRect(e); e.held=true; e.lift=1; e.zc=DOOR_T+0.03; P.off=[0,0]; if(e.cat==='paper') e.layer=7; return; } }
  // inside the fridge (or heading back in) the hand slides on a flat shelf-height plane so things can be pulled out / pushed in;
  // out in the room it moves on a camera-facing plane so things can be lifted and thrown
  const bp=e.body.position, hp=hand.position;
  const inside=bp.x>-0.36&&bp.x<0.36&&bp.z<DF+0.02&&bp.y>0.1&&bp.y<1.72;
  let toward=false; if(!inside&&bp.z<DF+0.35&&bp.x>-0.5&&bp.x<0.5){ for(const [d,bx] of CAV){ if(d.theta>0.6&&ray.ray.intersectsBox(bx)&&bp.y>bx.min.y-0.12&&bp.y<bx.max.y+0.05){ toward=true; break; } } }
  const wantH=inside||toward;
  if(wantH!==P.horiz){ P.horiz=wantH; P.plane=wantH?new THREE.Plane(V3(0,1,0),-hp.y):new THREE.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(V3()).negate(),V3(hp.x,hp.y,hp.z)); }
  let pt=ray.ray.intersectPlane(P.plane,V3()); if(!pt) return;
  const cur=V3(hp.x,hp.y,hp.z); if(pt.distanceTo(cur)>0.45) pt=cur.add(pt.sub(cur).setLength(0.45));
  pt.x=clamp(pt.x,-2.5,1.0); pt.y=clamp(pt.y,0.02,2.6); pt.z=clamp(pt.z,-0.4,2.5); hand.position.set(pt.x,pt.y,pt.z); e.body.wakeUp(); }
const CAV=[];
function doorScreenErr(d,lp,th,px,py){ const c=Math.cos(th), s=Math.sin(th); const v=V3(lp.x*c+lp.z*s, lp.y, -lp.x*s+lp.z*c).add(d.g.position); fridge.localToWorld(v); v.project(camera); const sx=(v.x+1)/2*innerWidth, sy=(1-v.y)/2*innerHeight; return (sx-px)*(sx-px)+(sy-py)*(sy-py); }
function doorMove(ev){ const d=P.door; if(P.moved<6&&!d.drag) return; if(!d.drag){ d.drag=true; canvas.classList.add('drag'); }
  let best=d.theta, be=1e18; for(let i=0;i<=64;i++){ const th=i/64*MAXA; const er=doorScreenErr(d,P.local,th,ev.clientX,ev.clientY); if(er<be){ be=er; best=th; } }
  const st=MAXA/64; for(let i=-8;i<=8;i++){ const th=clamp(best+i*st/8,0,MAXA); const er=doorScreenErr(d,P.local,th,ev.clientX,ev.clientY); if(er<be){ be=er; best=th; } }
  // ease toward the target so it feels heavy
  const nt=d.theta+(best-d.theta)*0.6; d.hist.push([performance.now(),nt]); if(d.hist.length>6) d.hist.shift(); d.theta=nt; }
function endPointer(ev,silent){ if(!P) return; const p=P; P=null; canvas.classList.remove('drag');
  const tap=p.moved<8&&performance.now()-p.t0<500;
  if(p.mode==='slide'&&p.ent){ const e=p.ent; e.held=false;
    if(e.state==='stuck'){ if(e.cat==='paper'){ e.layer=paperLayer(e); clampRect(e); } else { if(!snapWord(e)) resolveSpot(e); else resolveSpot(e); }
      if(!silent){ e.sqv=tap?5:7; sfx(tap?'clack':'slap',tap?0.7:0.9); if(tap){ e.wig=1; poke(e); } } dirty=true; } }
  else if(p.mode==='grab'){ grabEnd(p); if(tap&&p.ent&&!silent) poke(p.ent); }
  else if(p.mode==='door'){ const d=p.door; if(d.drag){ d.drag=false; const h=d.hist; if(h.length>=2){ const a=h[0], b=h[h.length-1]; const dt=(b[0]-a[0])/1000; d.omega=dt>0.005?clamp((b[1]-a[1])/dt,-9,9):0; } else d.omega=0; }
    else if(p.moved<8) swingDoor(d,d.theta<0.35); }
  if(!camTween) controls.enabled=true; }
canvas.addEventListener('pointerup',ev=>{ if(P&&ev.pointerId===P.id) endPointer(ev); });
canvas.addEventListener('pointercancel',ev=>{ if(P&&ev.pointerId===P.id) endPointer(ev,true); });
canvas.addEventListener('lostpointercapture',ev=>{ if(P&&ev.pointerId===P.id) endPointer(ev,true); });

function poke(e){
  if(e.cat==='food'&&e.body){ const b=e.body; b.wakeUp(); b.velocity.y+=1.1; b.velocity.x+=rand(-0.25,0.25); b.velocity.z+=rand(-0.25,0.25); b.angularVelocity.set(rand(-4,4),rand(-4,4),rand(-4,4)); if(e.jelly){ e.wob.vx+=rand(-6,6); e.wob.vz+=rand(-6,6); e.wob.vy+=2; sfx('jelly',1); } else sfx(e.snd||'thud',0.6); return; }
  if(e.state==='stuck'){ if(e.key==='duck'){ sfx('quack',1); toast('Quack.'); } else if(e.key==='kai1'){ sfx('ding',1); toast('Kai is #1. It is official. It is on the fridge.'); } else if(e.key==='mom'){ toast('Mom says: "'+momText+'"',3200); } else if(e.key==='pickle'){ toast('Mr. Pickle says hi.'); } else if(e.key==='star'){ sfx('ding',0.6); } }
}
function swingDoor(d,open){ d.drag=false; d.omega=open?5.2:-5.6; if(open&&d.theta<0.05) d.theta=0.051; }
$('#bOpen').onclick=()=>{ audioInit(); const anyOpen=DOOR.F.theta>0.3||DOOR.Z.theta>0.3; if(anyOpen){ for(const d of doors) if(d.theta>0.02) swingDoor(d,false); } else swingDoor(DOOR.F,true); };
$('#bView').onclick=()=>{ audioInit(); goView((viewI+1)%VIEWS.length); };
$('#bRestock').onclick=()=>{ audioInit(); stockFridge(); sfx('box',1); toast('Fresh groceries! The fridge is full again.'); };
$('#bShake').onclick=()=>{ audioInit(); shake(); };
$('#bPoem').onclick=()=>{ audioInit(); sharePoem(); };
$('#sndBtn').onclick=()=>{ audioInit(); setSound(!AU.on); toast(AU.on?'Sound on. Hmmmmmm.':'Sound off. The fridge hums silently.'); };
$('#helpBtn').onclick=()=>{ audioInit(); showHelp(); };
addEventListener('keydown',ev=>{ if(ev.target&&/INPUT|TEXTAREA/.test(ev.target.tagName)) return; if(ev.key==='Escape'){ closeModal(); openBin(false); } });

/* =====================================================================
   shaking + door slam knocks
   ===================================================================== */
let shakeT=0;
function knockLoose(power){ const now=performance.now()/1000;
  for(const e of ENTS){ if(e.state!=='stuck'||e.held) continue; let p=0; if(e.cat==='mag'){ p=e.kind==='word'?0.22:e.kind==='letter'?0.3:e.key==='button'?0.16:0.32; } p*=power; if(Math.random()<p) e.knock=now+rand(0.05,0.6); } }
function shake(){ if(shakeT>0) return; shakeT=1.0; sfx('rattle',1); sfx('thunk',0.4);
  for(const e of ENTS){ if(!e.body) continue; const p=e.body.position; if(p.x>-0.5&&p.x<0.5&&p.z<0.45&&p.y<2.1){ e.body.wakeUp(); const open=(p.y>SPLIT?DOOR.Z:DOOR.F).theta>0.3; e.body.velocity.x+=rand(-0.45,0.45); e.body.velocity.y+=rand(0.6,1.5); e.body.velocity.z+=rand(-0.2,0.4)+(open&&p.z>-0.1?rand(0.3,0.9):0); e.body.angularVelocity.set(rand(-5,5),rand(-5,5),rand(-5,5)); if(e.jelly){ e.wob.vx+=rand(-9,9); e.wob.vz+=rand(-9,9); } } }
  knockLoose(1); }

/* =====================================================================
   mom note, beeping, fog
   ===================================================================== */
let openFor=0, closedFor=0, momStage=0, nextMom=0, beepAt=0, beepOn=0;
function setMom(text,mad){ momText=text; momMad=mad; if(momEnt) momEnt.tex.userData.redraw(drawMom); }
const fogTex=ctex(64,64,(g)=>{ const r=g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(0.5,'rgba(240,250,255,.45)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=r; g.fillRect(0,0,64,64); });
const fogPool=[]; const fogG=new THREE.Group(); scene.add(fogG);
for(let i=0;i<60;i++){ const s=new THREE.Sprite(new THREE.SpriteMaterial({map:fogTex,transparent:true,opacity:0,depthWrite:false,color:'#e4f2ff',fog:false})); s.renderOrder=5; s.visible=false; s.userData.noPick=true; fogG.add(s); fogPool.push({s,life:0,max:1,v:V3(),sz:0.1}); }
function puff(d,n,strength=1){ const y0=d===DOOR.Z?1.31:0.16, y1=d===DOOR.Z?1.68:1.18;
  for(let i=0;i<n;i++){ const p=fogPool.find(q=>q.life<=0); if(!p) return; p.life=p.max=rand(1.4,2.6); p.s.position.set(rand(-0.3,0.3),rand(y0,y1),DF+rand(-0.02,0.06)); p.v.set(rand(-0.06,0.14),rand(-0.16,-0.04),rand(0.18,0.42)*strength); p.sz=rand(0.1,0.2); p.s.visible=true; } }
function updateFog(dt){ for(const p of fogPool){ if(p.life<=0) continue; p.life-=dt; const t=1-p.life/p.max; p.s.position.addScaledVector(p.v,dt); p.v.multiplyScalar(1-dt*0.9); p.v.y-=dt*0.05; const sc=p.sz+t*0.5; p.s.scale.set(sc,sc,sc); p.s.material.opacity=Math.sin(Math.min(1,t)*Math.PI)*0.5; if(p.life<=0){ p.s.visible=false; p.s.material.opacity=0; } } }

/* =====================================================================
   per-frame updates
   ===================================================================== */
let slipToast=0;
function updateDoors(dt){
  for(const d of doors){
    if(!d.drag){ let a=-2.4*d.omega; if(d.theta<0.13&&d.omega<1.2) a-=26*(0.13-d.theta)+6; d.omega+=a*dt; d.theta+=d.omega*dt;
      if(d.theta<=0){ if(d.omega<-0.5){ sfx('thunk',clamp(-d.omega/4,0.2,1.2)); fridgeKick=Math.min(1,-d.omega/5); if(d.omega<-5.2){ knockLoose(0.45); } } d.theta=0; d.omega=0; }
      if(d.theta>=MAXA){ d.theta=MAXA; if(d.omega>1) sfx('thud',0.25); d.omega=-d.omega*0.25; } }
    else { d.theta=clamp(d.theta,0,MAXA); const h=d.hist; d.omega=h.length>=2?(h[h.length-1][1]-h[0][1])/Math.max(0.016,(h[h.length-1][0]-h[0][0])/1000):0; }
    d.g.rotation.y=d.theta;
    const isOpen=d.theta>0.04;
    if(isOpen&&!d.wasOpen){ sfx('suck',0.8); puff(d,d===DOOR.Z?28:20,1); }
    if(!isOpen&&d.wasOpen){ /* closed */ }
    d.wasOpen=isOpen;
    if(isOpen&&Math.random()<dt*(d===DOOR.Z?5:3)) puff(d,1,0.5);
    d.body.quaternion.setFromAxisAngle(CV(0,1,0),d.theta); d.body.angularVelocity.set(0,d.drag?d.omega:d.omega,0);
  }
  const fo=DOOR.F.theta; bulb.material.emissiveIntensity=fo>0.03?Math.min(1,fo*3)*2.2:0; interiorLight.intensity=fo>0.03?Math.min(1,fo*2.5)*1.6:0;
  $('#bOpen span').textContent=(DOOR.F.theta>0.3||DOOR.Z.theta>0.3)?'Close':'Open';
}
let fridgeKick=0;
function doorContacts(){ for(const c of world.contacts){ const d=doors.find(dd=>dd.body===c.bi||dd.body===c.bj); if(!d) continue; const ob=c.bi===d.body?c.bj:c.bi; if(ob.type!==CANNON.Body.DYNAMIC||!ob.ent) continue; const e=ob.ent;
    if(d.omega<-0.2&&d.theta<0.32&&!d.drag){ const p=ob.position; const inside=p.z<DF-0.02&&p.x>-0.36&&p.x<0.36;
      // things inside just get shoved back onto the shelf; only something sticking out of the fridge stops the door
      if(inside){ ob.velocity.z=Math.min(ob.velocity.z,-0.7); if(d.theta<0.12) ob.position.z=Math.min(ob.position.z,DF-0.07); ob.wakeUp(); continue; }
      if(d.theta<0.12){ d.omega=2.4; sfx('thud',0.6); if(performance.now()-slipToast>1500){ slipToast=performance.now(); toast('Something is blocking the door!'); } } } } }
function updateStuck(dt){
  const now=performance.now()/1000;
  for(const e of ENTS){ if(e.state!=='stuck') continue;
    if(e.knock&&now>e.knock){ e.knock=0; const n=doorNormal(e.door); detach(e,V3(n.x*rand(0.4,0.9)+rand(-0.2,0.2),rand(0.2,0.8),n.z*rand(0.4,0.9))); continue; }
    if(e.cat==='mag'){ let top=0; for(const p of ENTS) if(p.cat==='paper'&&p.state==='stuck'&&p.door===e.door&&p.layer<7&&inPaper(p,e.x,e.y,0)) top=Math.max(top,p.layer); e.under=top; }
    e.lift+=((e.held?1:0)-e.lift)*Math.min(1,dt*14);
    const base=e.cat==='paper'?DOOR_T+0.0011+(Math.min(e.layer,7)-1)*0.0013:DOOR_T+0.0011+(e.under||0)*0.0013+0.0004+e.hd;
    const tz=base+e.lift*(e.cat==='paper'?0.004:0.014);
    e.zc+=(tz-e.zc)*Math.min(1,dt*22);

    if(e.wig>0) e.wig=Math.max(0,e.wig-dt*2.2);
    const s=clamp(e.sq,-0.6,0.6);
    e.obj.position.set(e.x,e.y,e.zc); e.obj.rotation.set(e.lift*0.1,-e.lift*0.06,e.rot+Math.sin(e.wig*20)*e.wig*0.18);

    for(const m of ENTS) if(m.cat==='mag'&&m.state==='stuck'&&m.door===p.door&&!m.held&&inPaper(p,m.x,m.y)){ hs.push(m); w+=m.weight; }
    const R=doorRect(p.door);
    if(!hs.length&&p.pending&&p.state==='stuck'){ p.unheld=0; }
    else if(!hs.length){ p.unheld=(p.unheld||0)+dt; p.y-=dt*0.025*(1+p.unheld*3); p.rot+=dt*0.06*(p.rot>=0?1:-1);
      if(p.unheld>0.85||p.y-p.hh<R.y0){ p.unheld=0; const n=doorNormal(p.door); detach(p,V3(n.x*0.25,0,n.z*0.25),0.4); sfx('paper',1); if(performance.now()-slipToast>3000){ slipToast=performance.now(); toast('Pictures need a magnet to hold them up!'); } } }
    else { p.unheld=0; if(w>4.3){ p.slip=(p.slip||0)+dt; if(p.slip>0.25){ const dy=dt*0.018; p.y-=dy; for(const m of hs) m.y-=dy; if(performance.now()-slipToast>4000){ slipToast=performance.now(); toast('Too many magnets! The paper is slipping…'); }
        if(p.y-p.hh<R.y0+0.003){ const n=doorNormal(p.door); for(const m of hs) detach(m,V3(n.x*rand(0.2,0.6),rand(0,0.4),n.z*rand(0.2,0.6))); detach(p,V3(n.x*0.2,0,n.z*0.2),0.4); sfx('rattle',0.7); toast('Whoops. Way too heavy!'); } } } else p.slip=0; } }
}
function updateLoose(dt){
  for(const e of ENTS){ if(!e.body) continue; const b=e.body;
    e.obj.position.set(b.position.x,b.position.y,b.position.z); e.obj.quaternion.set(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w);
    if(b.position.y<-0.5||!isFinite(b.position.y)){ b.position.set(rand(-0.6,0.2),0.4,rand(0.7,1.1)); b.velocity.set(0,0,0); b.angularVelocity.set(0,0,0); }
    if(e.cool>0) e.cool-=dt;
    // magnets jump onto the door when they get close enough
    if(e.cat==='mag'&&!e.held&&e.cool<=0&&b.sleepState!==CANNON.Body.SLEEPING){
      for(const d of doors){ const lp=d.g.worldToLocal(TMP.set(b.position.x,b.position.y,b.position.z)); if(lp.z>DOOR_T-0.008&&lp.z<DOOR_T+e.hd+0.024&&inRect(d,lp.x,lp.y,0.004,0.004)){ attach(e,d,lp.x,lp.y,rotFromBody(e,d)); clampRect(e); resolveSpot(e); break; } } }
    if(e.cat==='paper'&&b.sleepState!==CANNON.Body.SLEEPING&&!e.held&&b.position.y>0.05){ b.applyForce(CV(rand(-0.04,0.04),0,rand(-0.04,0.04)),b.position); }

      w.x=clamp(w.x+w.vx*dt,-0.5,0.5); w.z=clamp(w.z+w.vz*dt,-0.5,0.5); w.y=clamp(w.y+w.vy*dt,-0.25,0.35); e.jelly.value.set(w.x,w.y,w.z); }

function updateMom(dt){

  const t=performance.now()/1000;
  if(open&&openFor>7&&t>nextMom){ setMom(momStage===0?MOM_MAD[0]:pick(MOM_MAD.filter(x=>x!==momText)),true); momStage++; nextMom=t+6.5; toast('Mom’s note now says: “'+momText+'”',3600); }
  if(!open&&momMad&&closedFor>1.6){ setMom(pick(MOM_THANKS),false); momStage=0; nextMom=t+999; }
  if(!open&&!momMad&&closedFor>14&&MOM_THANKS.includes(momText)) setMom(pick(MOM_CALM),false);
  if(open&&openFor<0.1) nextMom=Math.max(nextMom,t+7);
  // door alarm beeps
  const beeping=open&&openFor>15;
  if(beeping&&t>beepAt){ beepAt=t+2.4; beepOn=t; sfx('beep',1); }
  const lit=beeping&&(t-beepOn)<0.45;
  ledMat.emissiveIntensity=lit?3.2:(beeping?0.6:0.05);
  const bp=$('#beep'); bp.classList.toggle('on',lit);
  if(lit){ const v=DOOR.Z.g.localToWorld(V3(-0.055,1.72,DOOR_T)); v.project(camera); const on=v.z<1&&Math.abs(v.x)<0.95&&Math.abs(v.y)<0.9; bp.style.left=(on?(v.x+1)/2*innerWidth:innerWidth/2)+'px'; bp.style.top=(on?Math.max(110,(1-v.y)/2*innerHeight):150)+'px'; }
  if(AU.hum){ const comp=0.5+0.5*Math.sin(t*0.05); const target=0.022+0.012*comp+(open?0.014:0); AU.hum.gain.value+=(target-AU.hum.gain.value)*0.05; AU.fan.gain.value+=((open?0.035:0.006)-AU.fan.gain.value)*0.05; }
}

/* =====================================================================
   main loop
   ===================================================================== */
const clock=new THREE.Clock(); let fpsAcc=0,fpsN=0,fps=60;
// adaptive quality: if frames are slow, drop pixel ratio, then soft shadows, then shadows
let quality=LITE?0:2, qT0=0, qN=0, qSum=0, lastNow=0;
function applyQuality(q){ quality=q; const dpr=window.devicePixelRatio||1;
  renderer.setPixelRatio(LITE?0.25:q>=2?Math.min(dpr,COARSE||SMALL?1.5:1.75):q===1?Math.min(dpr,1):0.75);
  const sh=q>=1; if(renderer.shadowMap.enabled!==sh){ renderer.shadowMap.enabled=sh; scene.traverse(o=>{ if(o.material) [].concat(o.material).forEach(m=>m.needsUpdate=true); }); }
  if(q===1){ renderer.shadowMap.type=THREE.PCFShadowMap; if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; } sun.shadow.mapSize.set(1024,1024); }
  renderer.setSize(innerWidth,innerHeight,false); }
function watchPerf(now){ const ft=now-lastNow; lastNow=now; if(LITE||HQ||quality===0||ft>600||now<qT0) return; qN++; qSum+=ft; if(qN>=50){ const avg=qSum/qN; qN=0; qSum=0; if(avg>40){ applyQuality(quality-1); qT0=now+2500; } } }
function frame(){
  requestAnimationFrame(frame);
  watchPerf(performance.now());
  const dt=Math.min(clock.getDelta(),LITE||QS.has('rt')?0.3:1/20); AU.n=0;
  fpsAcc+=dt; fpsN++; if(fpsAcc>1){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }
  const nsub=Math.ceil(dt/0.02-1e-6)||1, sdt=dt/nsub;
  const T0=performance.now(); for(let i=0;i<nsub;i++) updateDoors(sdt);
  world.step(1/120,dt,LITE||QS.has('rt')?40:6); const T1=performance.now();
  for(const d of doors){ d.body.quaternion.setFromAxisAngle(CV(0,1,0),d.theta); }
  doorContacts();
  while(crackQ.length) crack(crackQ.shift());
  while(sndQ.length){ const [s,v]=sndQ.shift(); sfx(s,v); }
  for(let i=0;i<nsub;i++){ updateLoose(sdt); updateStuck(sdt); } updateFlying(dt); updateFog(dt); updateMom(dt);
  // shake + slam wobble (visual only)
  if(shakeT>0){ shakeT=Math.max(0,shakeT-dt); const k=shakeT; fridge.position.x=Math.sin(performance.now()*0.06)*0.012*k; fridge.rotation.z=Math.sin(performance.now()*0.045)*0.012*k; fridge.position.y=Math.abs(Math.sin(performance.now()*0.05))*0.006*k; }
  else if(fridgeKick>0){ fridgeKick=Math.max(0,fridgeKick-dt*4); fridge.position.z=Math.sin(fridgeKick*30)*0.004*fridgeKick; }
  else { fridge.position.set(0,0,0); fridge.rotation.z=0; }
  // camera
  if(camTween){ camTween.k=Math.min(1,camTween.k+dt/0.7); const k=camTween.k<0.5?2*camTween.k*camTween.k:1-Math.pow(-2*camTween.k+2,2)/2; camera.position.lerpVectors(camTween.p0,camTween.p,k); controls.target.lerpVectors(camTween.t0,camTween.t,k); camera.lookAt(controls.target); if(camTween.k>=1){ camTween=null; if(!P) controls.enabled=true; controls.update(); } }
  else controls.update();
  const d=new Date(); if(CLOCK.h){ CLOCK.s.rotation.z=-d.getSeconds()/60*Math.PI*2; CLOCK.m.rotation.z=-(d.getMinutes()+d.getSeconds()/60)/60*Math.PI*2; CLOCK.h.rotation.z=-((d.getHours()%12)+d.getMinutes()/60)/12*Math.PI*2; }
  const T2=performance.now(); renderer.render(scene,camera); const T3=performance.now(); TIM.phys=T1-T0; TIM.upd=T2-T1; TIM.render=T3-T2;
}
const TIM={};
function onResize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight,false); if(controls){ controls.maxDistance=fitDist()*1.32; } }
addEventListener('resize',onResize);
setInterval(()=>{ if(dirty) save(); },1500);
addEventListener('pagehide',()=>{ if(dirty) save(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&dirty) save(); });

/* =====================================================================
   boot
   ===================================================================== */
async function waitFonts(){ try{ await Promise.race([Promise.all(['400 40px "Libre Caslon Text"','40px "Gochi Hand"','40px Shrikhand','900 40px Rubik','800 40px Rubik'].map(f=>document.fonts.load(f).catch(()=>null))),new Promise(r=>setTimeout(r,2500))]); }catch(e){} }
async function boot(){
  await waitFonts();
  buildKitchen(); buildFridge();
  setupControls();
  const loaded=load(); if(!loaded) defaultDoor();
  stockFridge();
  for(const e of ENTS) if(e.state==='stuck'&&e.cat==='paper') e.layer=paperLayer(e);
  setSound(AU.on);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  goView(0,true);
  qT0=performance.now()+3000; lastNow=performance.now();
  frame();
  window.__fridgeReady=true;
  setTimeout(()=>{ $('#load').classList.add('gone'); },60);
  setTimeout(()=>{ if(!lsGet('fridge_help')) toast(COARSE?'Drag magnets · tap the door · throw the snacks':'Drag magnets · pull the handle · throw the snacks',4200); },700);
}
// test hooks (harmless for players)
window.__fridge={
  ents:()=>ENTS.map(e=>({id:e.id,cat:e.cat,kind:e.kind,key:e.key,state:e.state,door:e.door?e.door.name:null,x:e.x,y:e.y,held:!!e.held,layer:e.layer,py:e.body?e.body.position.y:null,pz:e.body?e.body.position.z:null,sleeping:e.body?e.body.sleepState===CANNON.Body.SLEEPING:null})),
  screenOf:(id)=>{ const e=ENTS.find(x=>x.id===id); if(!e) return null; const v=e.obj.getWorldPosition(V3()).project(camera); return {x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight,z:v.z}; },
  doorPoint:(n,x,y)=>{ const d=DOOR[n]; const v=d.g.localToWorld(V3(x,y,DOOR_T+0.002)).project(camera); return {x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight}; },
  worldPoint:(x,y,z)=>{ const v=V3(x,y,z).project(camera); return {x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight}; },
  door:(n)=>({theta:DOOR[n].theta,omega:DOOR[n].omega}),
  handlePoint:(n)=>{ const d=DOOR[n]; const v=d.g.localToWorld(V3(-W+0.048,(d.hy0+d.hy1)/2,DOOR_T+0.05)).project(camera); return {x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight}; },

  poem:()=>poemText(), mom:()=>({text:momText,mad:momMad,openFor}), fps:()=>fps,
  meshes:()=>{ const c={}; const add=(k,n)=>c[k]=(c[k]||0)+n; let km=0; kitchen.traverse(o=>{ if(o.isMesh) km++; }); add('kitchen',km); let fm=0; fridge.traverse(o=>{ if(o.isMesh&&!o.parent.userData.pick&&!(o.parent.parent&&o.parent.parent.userData&&o.parent.parent.userData.pick)) fm++; }); add('fridgeish',fm); for(const e of ENTS){ let n=0; e.obj.traverse(o=>{ if(o.isMesh) n++; }); add(e.cat+':'+e.kind,n); } let fg=0; fogG.traverse(o=>{ if(o.visible&&o.isSprite) fg++; }); add('fog',fg); return c; },

  pickXY:(x,y)=>{ const r=pickAt({clientX:x,clientY:y}); const hits=ray.intersectObjects([fridge,dyn,kitchen],true).slice(0,4).map(h=>{ let o=h.object, n=o.userData.noPick?'noPick':''; while(o&&!o.userData.pick) o=o.parent; return (o?(o.userData.pick.type+':'+(o.userData.pick.ent?o.userData.pick.ent.key:'')):'none')+n+'@'+h.distance.toFixed(2); }); return {pick:r?(r.pk.type+':'+(r.pk.ent?r.pk.ent.key:'')):null,hits}; },
  info:()=>({q:quality,bodies:world.bodies.length,awake:world.bodies.filter(b=>b.type===CANNON.Body.DYNAMIC&&b.sleepState!==CANNON.Body.SLEEPING).length,calls:renderer.info.render.calls,tris:renderer.info.render.triangles,pr:renderer.getPixelRatio(),gl:renderer.getContext().getParameter(renderer.getContext().VERSION)}),
  setOpenFor:(s)=>{ openFor=s; }, vel:()=>world.bodies.filter(b=>b.ent&&b.sleepState!==CANNON.Body.SLEEPING).map(b=>[b.ent.key,+b.velocity.length().toFixed(4),+b.angularVelocity.length().toFixed(4),b.sleepState]), splats:()=>splats.length, view:()=>viewI,
