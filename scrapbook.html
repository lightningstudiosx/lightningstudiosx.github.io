<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Kai.fun Scrapbook · Kai.fun</title>
<meta name="description" content="A handmade scrapbook of kai.fun's whole history: every update from the first upload on, every game on the home page, the tiles that got redrawn, the games that never shipped and every idea list that never got built.">
<meta name="theme-color" content="#3a2a1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&family=Permanent+Marker&family=Abril+Fatface&family=Bungee&display=swap" rel="stylesheet">
<script src="bdp.js" defer></script>
<style>
/* base: desk, header, the pages themselves */
:root {
--desk: #3a2a1f; --desk2: #2b1f17; --kraft: #c9a47c; --kraft2: #b48d63; --paper: #fbf6e9; --paper2: #f3ead4;
--ink: #2a2420; --ink2: #5d5148; --pencil: #6f655c; --red: #c3313a; --blue: #2e5ea8; --green: #2f8a4b;
--line: rgba(70, 120, 190, .22); --margin: rgba(210, 70, 70, .35); --grid: rgba(60, 120, 170, .13);
--hand: 'Caveat', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
--type: 'Special Elite', 'Courier New', ui-monospace, monospace;
--mark: 'Permanent Marker', 'Segoe Print', 'Comic Sans MS', cursive;
--body: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
--grain: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 118px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
margin: 0; color: var(--ink); font: 16px/1.5 var(--body); overflow-wrap: anywhere;
background: var(--desk);
background-image: repeating-linear-gradient(92deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 9px),
repeating-linear-gradient(88deg, rgba(0, 0, 0, .12) 0 1px, transparent 1px 23px),
radial-gradient(ellipse at 30% 10%, #4a3628, var(--desk2) 70%);
background-attachment: fixed;
}
a { color: var(--blue); }
:focus-visible { outline: 3px solid #ffcc33; outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 6px; z-index: 50; background: #fff; padding: 8px 12px; }
.skip:focus { left: 8px; }
img { max-width: 100%; height: auto; }
/* header bar: a strip of masking tape across the top */
#top {
position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
padding: 8px max(12px, env(safe-area-inset-left)); background: #efe3c8;
background-image: linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(0, 0, 0, .04)), var(--grain);
border-bottom: 2px dashed rgba(90, 60, 30, .35); box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
}
#kai { font: 700 15px var(--body); color: var(--ink); text-decoration: none; background: #fff; border: 2px solid var(--ink);
border-radius: 999px; padding: 4px 12px; box-shadow: 2px 2px 0 var(--ink); white-space: nowrap; }
#kai:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
#topT { font: 400 20px var(--mark); letter-spacing: 1px; color: var(--red); transform: rotate(-2deg); white-space: nowrap; }
#find { position: relative; flex: 1 1 240px; display: flex; align-items: center; min-width: 0; }
#q { width: 100%; font: 16px var(--type); padding: 7px 100px 7px 10px; border: 2px solid var(--ink); border-radius: 6px;
background: #fffdf6 repeating-linear-gradient(transparent 0 22px, var(--line) 22px 23px); color: var(--ink); min-width: 0; }
#qx { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 18px; cursor: pointer; color: var(--ink2); }
#qn { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); font: 700 13px var(--hand); color: var(--red); pointer-events: none; }
#tabs { display: flex; gap: 4px; flex-basis: 100%; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
#tabs::-webkit-scrollbar { display: none; }
#tabs a { flex: none; font: 700 17px var(--hand); color: var(--ink); text-decoration: none; padding: 1px 12px 2px; border-radius: 8px 8px 0 0;
background: var(--tabc, #ffd36b); border: 1.5px solid rgba(0, 0, 0, .35); border-bottom: 0; }
#tabs a:nth-child(2) { --tabc: #9fd5f2; } #tabs a:nth-child(3) { --tabc: #f7a8b8; } #tabs a:nth-child(4) { --tabc: #b9e39a; }
#tabs a:nth-child(5) { --tabc: #f6b07a; } #tabs a:nth-child(6) { --tabc: #cdb7f2; } #tabs a:nth-child(7) { --tabc: #f2e27a; }
#tabs a[aria-current="true"] { transform: translateY(-2px); box-shadow: 0 -2px 0 rgba(0, 0, 0, .25) inset; }
/* the book */
#book { max-width: 1120px; margin: 0 auto; padding: 22px 14px 40px; outline: none; }
.page {
position: relative; margin: 0 0 34px; padding: 40px 34px 44px 58px; border-radius: 3px 10px 10px 3px; overflow: hidden;
background-color: var(--paper); background-image: var(--grain); box-shadow: 0 2px 0 #e7dcc3, 0 4px 0 #d9ccb0, 0 14px 30px rgba(0, 0, 0, .5);
}
.page::before { /* binder holes down the left edge */
content: ''; position: absolute; left: 14px; top: 0; bottom: 0; width: 18px; pointer-events: none;
background: radial-gradient(circle at 9px 30px, #2b1f17 0 7px, rgba(0, 0, 0, .25) 7.5px 8.5px, transparent 9px) 0 0 / 18px 96px repeat-y;
}
.page.lined { background-image: linear-gradient(90deg, transparent 46px, var(--margin) 46px 48px, transparent 48px),
repeating-linear-gradient(transparent 0 31px, var(--line) 31px 32px), var(--grain); }
.page.graph { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px), var(--grain);
background-size: 22px 22px, 22px 22px, auto; }
.page.dotted { background-image: radial-gradient(rgba(60, 60, 80, .22) 1.2px, transparent 1.6px), var(--grain); background-size: 20px 20px, auto; }
.page.kraft { background-color: var(--kraft); color: #241a12; }
.page.cover { background-color: #b88b5e; }
.page > * { position: relative; z-index: 1; }
.page > .deco { z-index: 0; }
.pageT { font: 400 clamp(30px, 6vw, 54px)/1.05 var(--mark); margin: 0 0 16px; color: var(--ink); transform: rotate(-1.2deg); }
.pageT .hl { background: linear-gradient(transparent 55%, rgba(255, 214, 80, .75) 55% 88%, transparent 88%); padding: 0 6px; }
.sub { font: 700 22px/1.3 var(--hand); color: var(--ink2); margin: 0 0 18px; }
.typed { font: 15px/1.6 var(--type); }
.empty { display: none; font: 700 22px var(--hand); color: var(--red); margin: 10px 0; }
.page.noMatch .empty { display: block; }
#theEnd { text-align: center; font: 700 24px var(--hand); color: #f3e3c4; }
#theEnd a { color: #ffd36b; }
@media (max-width: 700px) {
html { scroll-padding-top: 150px; }
.page { padding: 30px 14px 32px 34px; margin-bottom: 26px; }
.page::before { left: 6px; transform: scale(.8); transform-origin: left top; }
.page.lined { background-image: linear-gradient(90deg, transparent 26px, var(--margin) 26px 27px, transparent 27px),
repeating-linear-gradient(transparent 0 31px, var(--line) 31px 32px), var(--grain); }
#book { padding: 14px 8px 30px; }
#topT { display: none; }
}
/* scrapbook bits: polaroids, washi tape, date stamps, ticket stubs, stickers, clips, notes */
.pol {
position: relative; display: inline-block; background: #fffefa; padding: 9px 9px 0; margin: 0; border-radius: 2px;
box-shadow: 0 1px 1px rgba(0, 0, 0, .2), 0 6px 14px rgba(0, 0, 0, .28); transform: rotate(var(--r, 0deg));
transition: transform .15s ease;
}
.pol img { display: block; width: 100%; height: auto; background: #ddd; border: 1px solid rgba(0, 0, 0, .12); }
.pol figcaption { font: 700 19px/1.15 var(--hand); color: #2b2a6e; padding: 6px 2px 10px; text-align: center; min-height: 34px; }
button.polBtn { all: unset; display: block; cursor: zoom-in; border-radius: 2px; }
button.polBtn:focus-visible { outline: 3px solid #ffcc33; outline-offset: 2px; }
.pol:hover { transform: rotate(0deg) scale(1.02); z-index: 3; }
.pol .ba { position: absolute; top: 14px; left: 14px; font: 400 13px/1 var(--mark); padding: 4px 7px 3px; border: 2.5px solid currentColor;
border-radius: 5px; transform: rotate(-8deg); background: rgba(255, 255, 255, .82); letter-spacing: 1px; }
.pol .ba.b { color: var(--red); } .pol .ba.a { color: var(--green); }
.tape {
position: absolute; z-index: 4; width: var(--w, 96px); height: 26px; transform: rotate(var(--r, -4deg)); pointer-events: none;
background: var(--tp, repeating-linear-gradient(45deg, rgba(255, 170, 190, .78) 0 7px, rgba(255, 220, 228, .78) 7px 14px));
-webkit-mask: linear-gradient(90deg, transparent 0 2px, #000 2px calc(100% - 2px), transparent calc(100% - 2px)),
radial-gradient(circle at 50% 50%, #000 60%, transparent 61%) 0 0 / 4px 5px;
-webkit-mask-composite: source-over; opacity: .92; box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
}
.tape.t1 { --tp: repeating-linear-gradient(90deg, rgba(120, 200, 230, .8) 0 8px, rgba(200, 238, 250, .8) 8px 16px); }
.tape.t2 { --tp: radial-gradient(circle, rgba(255, 255, 255, .9) 2px, transparent 2.5px) 0 0 / 10px 10px, rgba(250, 205, 90, .82); }
.tape.t3 { --tp: repeating-linear-gradient(-45deg, rgba(150, 210, 140, .82) 0 6px, rgba(235, 250, 220, .82) 6px 12px); }
.tape.t4 { --tp: linear-gradient(rgba(240, 232, 205, .88), rgba(225, 214, 180, .88)); }
.tape.t5 { --tp: repeating-linear-gradient(0deg, rgba(190, 160, 240, .8) 0 4px, rgba(235, 225, 255, .8) 4px 9px); }
/* rubber date stamp */
.stamp {
display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font: 400 15px/1 var(--type);
color: var(--sc, var(--red)); border: 3px double currentColor; border-radius: 8px; padding: 5px 10px 4px; letter-spacing: 2px;
transform: rotate(var(--r, -3deg)); text-transform: uppercase; opacity: .95; mix-blend-mode: multiply; white-space: nowrap;
-webkit-mask: radial-gradient(circle at 30% 40%, #000 60%, rgba(0, 0, 0, .82) 72%, #000 86%) 0 0 / 7px 6px; font-weight: 700;
}
.stamp b { font: 400 26px/1 var(--type); letter-spacing: 1px; }
.stamp small { font-size: 11px; letter-spacing: 3px; }
.stamp.round { border-radius: 50%; width: 92px; height: 92px; padding: 0; border-width: 3px; border-style: solid; box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 6px currentColor; }
/* ticket stub */
.stub {
position: relative; display: inline-flex; align-items: center; gap: 6px; font: 13px/1 var(--type); color: #5a2b12;
background: #f6d38c; padding: 5px 12px 5px 14px; border-radius: 3px; white-space: nowrap;
-webkit-mask: radial-gradient(circle at 0 50%, transparent 5px, #000 5.5px) left / 51% 100% no-repeat,
radial-gradient(circle at 100% 50%, transparent 5px, #000 5.5px) right / 51% 100% no-repeat;
}
.stub::after { content: ''; position: absolute; left: 7px; top: 3px; bottom: 3px; border-left: 1.5px dashed rgba(90, 43, 18, .45); }
.sticker { position: absolute; z-index: 5; display: grid; place-items: center; text-align: center; width: var(--s, 74px); height: var(--s, 74px);
border-radius: 50%; font: 400 15px/1 var(--mark); color: #fff; background: var(--bg, #e2483d); transform: rotate(var(--r, 10deg));
box-shadow: 0 0 0 4px #fff, 0 4px 10px rgba(0, 0, 0, .3); pointer-events: none; padding: 6px; }
.sticker.star { border-radius: 0; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); box-shadow: none; }
.clip { position: absolute; z-index: 6; width: 26px; height: 64px; pointer-events: none; }
.deco { position: absolute; pointer-events: none; }
.ring { opacity: .55; mix-blend-mode: multiply; }
/* paper notes and cards */
.note { position: relative; background: #fff7a8; padding: 18px 18px 16px; box-shadow: 0 8px 14px rgba(0, 0, 0, .22); transform: rotate(var(--r, -1deg)); }
.note.pink { background: #ffd1dc; } .note.blue { background: #cfe8fb; } .note.green { background: #d8f1c4; } .note.white { background: #fffdf5; }
.card { position: relative; background: #fffdf6; padding: 20px 20px 18px; border-radius: 3px; box-shadow: 0 6px 16px rgba(0, 0, 0, .22); }
.card.lined { background-image: repeating-linear-gradient(transparent 0 27px, var(--line) 27px 28px); background-position: 0 6px; }
.hand { font: 700 21px/1.25 var(--hand); }
.tag { display: inline-block; font: 700 15px/1 var(--hand); padding: 4px 10px; border-radius: 999px; background: #222; color: #fff; transform: rotate(-2deg); }
.arrow { font: 400 30px/1 var(--mark); color: var(--red); align-self: center; }
mark { background: #ffe066; color: inherit; padding: 0 1px; border-radius: 2px; }
/* the "look closer" dialog */
#look { border: 0; padding: 14px 14px 6px; background: #fffefa; max-width: min(94vw, 1000px); box-shadow: 0 20px 60px rgba(0, 0, 0, .6); border-radius: 3px; }
#look::backdrop { background: rgba(20, 12, 6, .78); }
#look figure { margin: 0; } #look img { display: block; max-height: 78vh; width: auto; max-width: 100%; margin: 0 auto; }
#look figcaption { font: 700 24px var(--hand); text-align: center; color: #2b2a6e; padding: 8px; }
#lookX { position: absolute; top: 4px; right: 6px; border: 0; background: #fff; border-radius: 50%; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }
/* cover */
.cover { min-height: 640px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.cover .label { position: relative; background: #fbf3df; padding: 26px 22px 20px; width: 100%; max-width: 760px; margin: 34px auto 0;
box-shadow: 0 10px 24px rgba(0, 0, 0, .35); transform: rotate(-1deg); border-radius: 2px; }
.cut { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 4px; margin: 0; line-height: 1; }
.cut .w { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin: 0 8px; max-width: 100%; }
.cut .l { display: inline-block; font-size: clamp(34px, 8vw, 78px); padding: .06em .12em .02em; transform: rotate(var(--r)) translateY(var(--y));
background: var(--bg); color: var(--fg); font-family: var(--ff); box-shadow: 1px 2px 3px rgba(0, 0, 0, .35); clip-path: var(--cp); }
.cover .tagline { font: 700 clamp(20px, 3vw, 27px)/1.3 var(--hand); color: var(--ink); margin: 14px 0 6px; }
.cover .dates { margin: 16px 0 4px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; align-items: center; }
.cover .collage { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; width: 100%; max-width: 940px; margin: 34px auto 6px; }
.cover .collage .pol:nth-child(2n) { margin-top: 18px; }
.cover .vol { position: absolute; top: 18px; right: 22px; font: 400 18px var(--type); background: #f4ead1; padding: 6px 12px; transform: rotate(4deg); box-shadow: 0 3px 6px rgba(0, 0, 0, .3); }
/* how it started */
.story { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 26px 34px; align-items: start; }
.story p { font: 700 22px/32px var(--hand); margin: 0 0 32px; }
.story .shots { display: grid; gap: 22px; }
.firsts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; }
.firsts a { font: 700 18px var(--hand); background: #fff; padding: 2px 10px; border-radius: 4px; text-decoration: none; color: var(--ink); box-shadow: 1px 2px 0 rgba(0, 0, 0, .25); transform: rotate(var(--r)); }
/* timeline */
.month { margin: 36px 0 10px; }
.monthH { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin: 0 0 14px; }
.monthH h3 { margin: 0; }
.day { position: relative; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px 18px; padding: 14px 0 16px; border-top: 2px dashed rgba(60, 60, 90, .2); }
.day .stamp { justify-self: start; align-self: start; position: sticky; top: 128px; }
.entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tl-entry { position: relative; background: rgba(255, 253, 246, .93); padding: 10px 14px 10px; border-radius: 3px; box-shadow: 0 2px 6px rgba(0, 0, 0, .14); }
.tl-entry .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.tl-entry .subj { font: 700 17px/1.35 var(--body); }
.tl-entry .subj.up { font: 15px var(--type); color: var(--ink2); }
.tl-entry .note2 { font: 700 20px/1.3 var(--hand); color: #2b2a6e; margin: 4px 0 0; }
.tl-entry .time { font: 13px var(--type); color: var(--pencil); }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.thumbs a { display: block; width: 92px; background: #fff; padding: 3px 3px 0; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transform: rotate(var(--r)); text-decoration: none; }
.thumbs img { display: block; width: 100%; aspect-ratio: 2/1; object-fit: cover; }
.thumbs span { display: block; font: 700 12px/1.1 var(--hand); color: var(--ink); text-align: center; padding: 2px 1px 3px; }
.thumbs .more { align-self: center; font: 700 17px var(--hand); color: var(--ink2); }
.files { font: 12.5px/1.5 var(--type); color: var(--ink2); margin-top: 6px; }
/* games gallery */
.galleryBar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 4px 0 20px; }
.galleryBar select { font: 700 17px var(--hand); padding: 4px 8px; border: 2px solid #3a2a1f; border-radius: 6px; background: #fff8e6; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px 22px; }
.gcard { position: relative; display: flex; flex-direction: column; text-decoration: none; color: var(--ink); background: #fffefa;
padding: 9px 9px 10px; box-shadow: 0 6px 14px rgba(0, 0, 0, .3); transform: rotate(var(--r)); transition: transform .15s; }
.gcard:hover, .gcard:focus-visible { transform: rotate(0) translateY(-3px); z-index: 2; }
.gcard img, .gcard .fake { display: block; width: 100%; aspect-ratio: 2/1; object-fit: cover; background: #ddd; }
.gcard .fake { display: grid; place-items: center; background: linear-gradient(135deg, #ffe17a, #ff9ec4, #8fd3ff); font: 900 22px 'Comic Sans MS', var(--hand); color: #141414; text-align: center; }
.gcard b { font: 700 22px/1.1 var(--hand); color: #2b2a6e; margin: 7px 0 2px; }
.gcard p { font-size: 13.5px; line-height: 1.35; margin: 0 0 22px; color: var(--ink2); }
.gcard .when { position: absolute; right: 8px; bottom: 6px; font: 12px var(--type); color: var(--red); letter-spacing: 1px; transform: rotate(-2deg); }
.gcard .rare { position: absolute; top: -8px; right: -8px; z-index: 3; }
.extras { margin-top: 30px; max-width: 640px; }
/* scrapped & redone */
.redo { display: grid; gap: 34px; margin: 18px 0 40px; }
.rcard { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.rcard .head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.rcard h4 { margin: 0; font: 400 clamp(22px, 3.5vw, 30px)/1.1 var(--mark); }
.rcard p { margin: 0; max-width: 72ch; }
.pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px 18px; align-items: start; }
.evo { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; margin: 16px 0 10px; }
.evoC { background: rgba(255, 253, 246, .95); padding: 10px 10px 12px; box-shadow: 0 3px 8px rgba(0, 0, 0, .18); transform: rotate(var(--r)); }
.evoC b { font: 700 21px var(--hand); display: block; margin-bottom: 4px; }
.evoRow { display: flex; align-items: center; gap: 4px; }
.evoRow figure { margin: 0; flex: 1 1 0; min-width: 0; }
.evoRow img { display: block; width: 100%; aspect-ratio: 2/1; object-fit: cover; border: 3px solid #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.evoRow figcaption { font: 11px var(--type); text-align: center; color: var(--pencil); margin-top: 2px; }
.evoRow .arr { font: 400 18px var(--mark); color: var(--red); flex: none; }
.subH { font: 400 clamp(26px, 4.5vw, 38px)/1.1 var(--mark); margin: 40px 0 8px; transform: rotate(-1deg); }
/* ideas */
.ideaGrid { columns: 3 300px; column-gap: 22px; }
.ilist { break-inside: avoid; margin: 0 0 24px; display: inline-block; width: 100%; }
.ilist .ask { font: 700 20px/1.2 var(--hand); margin: 8px 0 6px; }
.ilist ol { margin: 0; padding-left: 24px; font-size: 14px; line-height: 1.4; }
.ilist li { margin: 0 0 6px; }
.ilist li b { font-weight: 700; }
.ilist li.built { list-style-type: '✔ '; }
.ilist li.built::marker { color: var(--green); font-weight: 900; }
.ilist .btag { font: 700 15px var(--hand); color: var(--green); white-space: nowrap; }
.ilist .foot { font: 13px var(--type); color: var(--pencil); margin-top: 6px; }
/* stats */
.statGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 22px 18px; margin: 16px 0 30px; }
.stat { position: relative; background: #f6d38c; padding: 14px 16px 12px 22px; transform: rotate(var(--r)); box-shadow: 0 5px 12px rgba(0, 0, 0, .28);
-webkit-mask: radial-gradient(circle at 0 50%, transparent 9px, #000 9.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #000 9.5px) right / 51% 100% no-repeat; }
.stat:nth-child(3n+2) { background: #bfe3f4; } .stat:nth-child(3n) { background: #f7c1cf; }

// ===== util.js =====
/* small helpers shared by every part of the book */
const SB = {};
SB.rng = function (seed) { // mulberry32: the same "random" doodles on every visit
  let a = seed >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
};
SB.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
SB.MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
SB.MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
SB.DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
SB.parts = d => { const [y, m, dd] = d.split('-').map(Number); return { y, m, d: dd, dow: new Date(Date.UTC(y, m - 1, dd)).getUTCDay() }; };
SB.short = d => { if (!d) return ''; const p = SB.parts(d); return p.d + ' ' + SB.MON[p.m - 1]; };
SB.long = d => { const p = SB.parts(d); return p.d + ' ' + SB.MONTH[p.m - 1] + ' ' + p.y; };
SB.rot = (r, max) => ((r() * 2 - 1) * max).toFixed(2) + 'deg';
SB.cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
SB.html = function (str) { const t = document.createElement('template'); t.innerHTML = str.trim(); return t.content; };
SB.stamp = function (d, opts) {
  const p = SB.parts(d), o = opts || {};
  return '<span class="stamp" style="--r:' + (o.r || '-3deg') + (o.c ? ';--sc:' + o.c : '') + '"><small>' + SB.DOW[p.dow].slice(0, 3) + '</small><b>' +
    String(p.d).padStart(2, '0') + ' ' + SB.MON[p.m - 1].toUpperCase() + '</b><small>' + p.y + '</small></span>';
};
SB.tape = function (r, style) {
  const k = 't' + Math.floor(r() * 6);
  return '<span class="tape ' + k + '" aria-hidden="true" style="--r:' + SB.rot(r, 7) + ';--w:' + Math.round(70 + r() * 50) + 'px;' + (style || '') + '"></span>';
};
/* a polaroid; big pictures open in the look-closer dialog */
SB.pol = function (src, cap, r, o) {
  o = o || {};
  const ba = o.ba ? '<span class="ba ' + o.ba + '">' + (o.ba === 'b' ? 'BEFORE' : 'AFTER') + '</span>' : '';
  const tape = o.noTape ? '' : SB.tape(r, 'top:-12px;left:' + Math.round(20 + r() * 40) + '%');
  const img = '<img src="' + SB.esc(src) + '" alt="' + SB.esc(cap) + '" loading="lazy" decoding="async"' + (o.wh ? ' width="' + o.wh[0] + '" height="' + o.wh[1] + '"' : '') + '>';
  return '<figure class="pol srch-img" style="--r:' + SB.rot(r, o.tilt == null ? 3 : o.tilt) + '">' + tape + ba +
    '<button class="polBtn" type="button" data-big="' + SB.esc(src) + '" data-cap="' + SB.esc(cap) + '" aria-label="Look closer: ' + SB.esc(cap) + '">' + img + '</button>' +
    '<figcaption>' + SB.esc(cap) + '</figcaption></figure>';
};
SB.gameByImg = function (img) { return GAMES.find(g => g.img.split('?')[0].toLowerCase() === img.toLowerCase()); };
SB.gameByHref = function (h) { return GAMES.find(g => g.href === h); };
SB.commit = h => COMMITS.find(c => c.h === h);
SB.kb = kb => kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB';
// ===== deco.js =====
/* procedural decorations: canvas paper grain, wobbly SVG doodles, coffee rings, paper clips, stickers.
   Every one is drawn from a seeded random generator, so the book looks the same on every visit. */
SB.grain = function () {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 220;
    const g = c.getContext('2d'), r = SB.rng(7), im = g.createImageData(220, 220);
    for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 10 + r() * 9; }
    g.putImageData(im, 0, 0);
    g.globalAlpha = .07; g.strokeStyle = '#6b4a2a'; g.lineWidth = .7; // paper fibres
    for (let i = 0; i < 70; i++) { const x = r() * 220, y = r() * 220, a = r() * 6.3, l = 4 + r() * 14; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .6 + r() * 3, y + Math.sin(a) * l * .6 + r() * 3, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
    document.documentElement.style.setProperty('--grain', 'url(' + c.toDataURL('image/png') + ')');
  } catch (e) { /* plain paper is fine too */ }
};
/* turn points into a hand-drawn path: jitter each point, then smooth through midpoints */
SB.wobble = function (pts, r, j) {
  const p = pts.map(([x, y]) => [x + (r() - .5) * j, y + (r() - .5) * j]);

};

SB.tileWall = function () {

/* every idea list from the chats, as a wall of sticky notes; the few that got built are ticked */
SB.renderIdeas = function () {
  const el = document.getElementById('ideas');
  const colors = ['', 'pink', 'blue', 'green', 'white'];
  let total = 0, built = 0;
  const lists = IDEA_LISTS.map((L, i) => {
    const r = SB.rng(4000 + i);
    const items = L.items.map(([t, d]) => {
      total++;
      const b = IDEA_BUILT[t];
      if (b) built++;
      const title = b && b[0] ? '<a href="' + SB.esc(b[0]) + '"><b>' + SB.esc(t) + '</b></a>' : '<b>' + SB.esc(t) + '</b>';
      return '<li class="srch' + (b ? ' built' : '') + '" data-s="' + SB.esc(t + ' ' + d + (b ? ' built ' + b[1] : '')) + '">' + title +
        (d ? ': ' + SB.esc(SB.cap(d)) : '') + (b ? ' <span class="btag">(' + SB.esc(b[1]) + ')</span>' : '') + '</li>';
    }).join('');
    const nb = L.items.filter(([t]) => IDEA_BUILT[t]).length;
    return '<div class="ilist srch-group note ' + colors[i % colors.length] + '" style="--r:' + SB.rot(r, 1.4) + '">' +
      (i % 3 === 0 ? SB.tape(r, 'top:-12px;left:30%') : '') +
      SB.stamp(L.d, { r: SB.rot(r, 5), c: i % 2 ? '#2e5ea8' : '#c3313a' }) +
      '<p class="ask">asked for: ' + SB.esc(L.ask) + '</p><ol>' + items + '</ol>' +
      '<p class="foot">' + L.items.length + ' ideas · ' + (IDEA_LIST_NOTE[i] || (nb ? nb + ' built' : 'none built')) + '</p></div>';
  });
  const seen = {};
  IDEA_LISTS.forEach(L => L.items.forEach(([t]) => { seen[t] = (seen[t] || 0) + 1; }));
  const [rep, times] = Object.entries(seen).sort((a, b) => b[1] - a[1])[0];
  const words = ['', 'once', 'twice', 'three times', 'four times', 'five times'];
  el.innerHTML =
    '<h2 class="pageT" id="ideasT"><span class="hl">Ideas that never got built</span></h2>' +
    '<p class="sub">every idea list from the chats behind the site: ' + IDEA_LISTS.length + ' lists, <span id="ideaTotal">' + total + '</span> ideas, and only ' + built +
    ' ticked off. Some ideas kept coming back: ' + SB.esc(rep) + ' shows up ' + (words[times] || times + ' times') + '.</p>' +
    '<div class="ideaGrid">' + lists.join('') + '</div><p class="empty">no idea matches that</p>';
  SB.ideaCounts = { total, built };
  SB.decorate(el, 81, 16);
};
// ===== render_stats.js =====
/* behind the scenes: numbers on ticket stubs, a receipt of the biggest games, a hand-drawn chart */
SB.fromSubjects = function (rx) {
  let best = 0;
  COMMITS.forEach(c => { const m = c.s.match(rx); if (m) best = Math.max(best, +m[1]); });
  return best;
};
SB.chart = function () {
  const days = STATS.perDay, W = 640, H = 230, pad = 30, bw = (W - pad * 2) / days.length, max = Math.max(...days.map(d => d[1]));
  const r = SB.rng(99);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Updates per day: ' + days.map(d => SB.short(d[0]) + ' ' + d[1]).join(', ') + '">';
  s += '<path d="' + SB.wobble([[pad - 6, H - 40], [W / 2, H - 40], [W - pad + 4, H - 40]], r, 2) + '" stroke="#2a2420" stroke-width="2.5" fill="none"/>';
  days.forEach(([d, n], i) => {
    const x = pad + i * bw + bw * .18, w = bw * .64, h = (H - 80) * n / max, y = H - 40 - h;
    const pts = [[x, H - 40], [x, y], [x + w, y], [x + w, H - 40]];
    s += '<path d="' + SB.wobble(pts, r, 2.2) + '" fill="' + (n >= 6 ? '#e2483d' : n >= 3 ? '#f2a81d' : '#9fd5f2') + '" fill-opacity=".85" stroke="#2a2420" stroke-width="1.6"/>';
    s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="17" fill="#2a2420">' + n + '</text>';
    const p = SB.parts(d);
    s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 22) + '" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#5d5148">' + p.d + '</text>';
    if (i === 0 || SB.parts(days[i - 1][0]).m !== p.m) s += '<text x="' + x.toFixed(1) + '" y="' + (H - 6) + '" font-family="Caveat, cursive" font-weight="700" font-size="15" fill="#c3313a">' + SB.MON[p.m - 1] + '</text>';
  });
  return s + '</svg>';
};

    '<div class="row" style="border:0;margin-top:8px"><b>TOTAL HTML</b><b>' + STATS.htmlMB + ' MB</b></div><p style="text-align:center;margin:12px 0 0">thank you for playing!</p></div>' +

// ===== main.js =====
/* search, tabs, the look-closer dialog, and putting the book together */
SB.search = function (q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  document.querySelectorAll('.srch').forEach(n => {
    const hay = ((n.dataset.s || '') + ' ' + n.textContent).toLowerCase();
    const ok = !words.length || words.every(w => hay.includes(w));
    n.hidden = !ok; if (ok && words.length) shown++;
  });
  document.querySelectorAll('.srch-group').forEach(g => { g.hidden = words.length > 0 && !g.querySelector('.srch:not([hidden])'); });
  document.querySelectorAll('.month').forEach(m => { m.hidden = words.length > 0 && !m.querySelector('.day:not([hidden])'); });
  document.querySelectorAll('.page').forEach(p => {
    const any = p.querySelector('.srch:not([hidden])') || !p.querySelector('.srch');
    p.classList.toggle('noMatch', words.length > 0 && !any);
    p.classList.toggle('searching', words.length > 0);
  });
  const gc = document.getElementById('gCount');
  if (gc) gc.textContent = (words.length ? document.querySelectorAll('.gcard:not([hidden])').length + ' of ' : '') + GAMES.length + ' games';
  document.getElementById('qn').textContent = words.length ? shown + ' found' : '';
  document.getElementById('qx').hidden = !words.length;
  return shown;
};
SB.wire = function () {
  const q = document.getElementById('q');
  let t = 0;
  q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => SB.search(q.value), 120); });
  q.addEventListener('keydown', e => {
    if (e.key === 'Escape') { q.value = ''; SB.search(''); }
    if (e.key === 'Enter') { const first = document.querySelector('.page .srch:not([hidden])'); if (first) first.scrollIntoView({ block: 'center' }); }
  });
  document.getElementById('qx').addEventListener('click', () => { q.value = ''; SB.search(''); q.focus(); });
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.isContentEditable;
    if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey) { e.preventDefault(); q.focus(); q.select(); }
  });
  const dlg = document.getElementById('look');
  document.addEventListener('click', e => {
    const b = e.target.closest('.polBtn');
    if (!b || !dlg.showModal) return;
    document.getElementById('lookImg').src = b.dataset.big; document.getElementById('lookImg').alt = b.dataset.cap;
    document.getElementById('lookCap').textContent = b.dataset.cap; dlg.showModal();
  });
  document.getElementById('lookX').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  const tabs = [...document.querySelectorAll('#tabs a')];
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(en => {
      if (en.isIntersecting) tabs.forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + en.target.id)));
    }), { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('.page').forEach(p => io.observe(p));
  }
};
SB.build = function () {
  SB.grain();
  SB.renderCover(); SB.renderStart(); SB.renderTime(); SB.renderTimeline();
  document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.tm-visit'); if (b) SB.timeGo(b.dataset.v); }); SB.renderGallery(); SB.renderScrapped(); SB.renderIdeas(); SB.renderStats();
  SB.wire();
  try { const t = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); } catch (e) { /* ignore odd hashes */ }
  window.SCRAPBOOK = { ready: true, commits: COMMITS.length, games: GAMES.length, search: SB.search };
};
SB.build();
</script>
