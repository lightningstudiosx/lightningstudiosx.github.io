<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>STARGUESSR &middot; Kai.fun</title>
<meta name="description" content="GeoGuessr in space! You are beamed to a real star near the Sun. Read the real night sky from there, then guess where you are on a 3D map of our stellar neighbourhood.">
<meta name="theme-color" content="#02040a">
<script src="bdp.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root { --bg: #02040a; --panel: rgba(8, 16, 34, 0.82); --panel2: rgba(14, 26, 52, 0.9); --line: rgba(120, 200, 255, 0.28);
--cyan: #6fe3ff; --gold: #ffd36b; --pink: #ff5f93; --text: #e6f2ff; --dim: #93a9c8; --ok: #6dffb0;
--hud: 'Orbitron', 'Exo 2', system-ui, sans-serif; --body: 'Exo 2', system-ui, -apple-system, 'Segoe UI', sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); overflow: hidden; overscroll-behavior: none; }
body { -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.hide { display: none !important; }
button { font-family: var(--body); color: var(--text); cursor: pointer; border: 0; background: none; -webkit-user-select: none; user-select: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
a { color: var(--cyan); }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#kai { position: fixed; top: 12px; left: 14px; z-index: 30; padding: 7px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
color: var(--text); text-decoration: none; font: 600 14px var(--body); }
#kai:hover { border-color: var(--cyan); color: var(--cyan); }
#hud { position: fixed; top: 10px; left: 112px; right: 12px; z-index: 20; display: flex; align-items: center; gap: 8px; pointer-events: none; }
#hud > * { pointer-events: auto; }
.hb { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; display: flex; flex-direction: column; align-items: center; min-width: 64px; }
.hb .k { font: 500 10px var(--hud); letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
.hb b { font: 700 17px var(--hud); color: var(--text); }
.hb.diff { font: 700 12px var(--hud); letter-spacing: 0.1em; text-transform: uppercase; padding: 10px 12px; color: var(--ok); }
.hb.diff[data-d="medium"] { color: var(--gold); }
.hb.diff[data-d="hard"] { color: var(--pink); }
#hTimerBox.warn b { color: var(--pink); animation: pulse 0.5s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: 0.45; } }
.grow { flex: 1; }
.ib { width: 40px; height: 40px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; }
.ib svg { width: 20px; height: 20px; }
.ib:hover { border-color: var(--cyan); color: var(--cyan); }
.ib.off .wave { opacity: 0; }
#tools { position: fixed; left: 14px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 8px; }
.tool { display: flex; align-items: center; gap: 9px; padding: 9px 14px 9px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; font: 600 14px var(--body); text-align: left; }
.tool svg { width: 22px; height: 22px; flex: none; }
.tool:hover { border-color: var(--cyan); }
.tool.on { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 14px rgba(255, 211, 107, 0.25); }
.tool.sm { width: 44px; justify-content: center; padding: 8px; }
#tools .sm + .sm { margin-top: -2px; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
#starCard { position: fixed; top: 66px; right: 14px; z-index: 21; width: 270px; padding: 14px 16px 12px; }
#starCard h3 { margin: 0 24px 8px 0; font: 700 16px var(--hud); color: var(--gold); }
#starCard h3.unk { color: var(--dim); }
#starCard .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px; border-top: 1px solid rgba(120, 200, 255, 0.1); }
#starCard .row span { color: var(--dim); }
#starCard .row b { font-weight: 600; text-align: right; }
#starCard .tip { margin: 8px 0 0; font-size: 12px; color: var(--dim); }
.x { position: absolute; top: 8px; right: 10px; font-size: 22px; line-height: 1; color: var(--dim); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px currentColor; vertical-align: -1px; }
.st5 { color: var(--gold); letter-spacing: 1px; }
#skyLabels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.clab, .slab { position: absolute; left: 0; top: 0; white-space: nowrap; font: 600 12px var(--hud); letter-spacing: 0.08em; text-transform: uppercase; display: none; }
.clab.warp { color: rgba(255, 205, 110, 0.9); text-shadow: 0 0 6px #000; }
.clab.ghost { color: rgba(110, 190, 255, 0.6); font-weight: 500; font-size: 11px; }
.slab { text-transform: none; letter-spacing: 0.02em; font: 600 13px var(--body); color: #fff; text-shadow: 0 0 4px #000, 0 0 8px #000; }
.slab.sun, #sunRing span { color: var(--gold); }
#sunRing { position: absolute; left: 0; top: 0; width: 46px; height: 46px; border: 2px solid var(--gold); border-radius: 50%; display: none; box-shadow: 0 0 16px rgba(255, 211, 107, 0.6); animation: ring 1.6s ease-in-out infinite; }
#sunRing span { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); font: 700 12px var(--hud); letter-spacing: 0.1em; text-shadow: 0 0 6px #000; }
@keyframes ring { 50% { box-shadow: 0 0 28px rgba(255, 211, 107, 0.9); } }
#toasts { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.toast { background: var(--panel2); border: 1px solid var(--cyan); color: var(--text); padding: 8px 16px; border-radius: 999px; font: 600 14px var(--body); transition: opacity 0.4s, transform 0.4s; text-align: center; max-width: 90vw; }
.toast.out { opacity: 0; transform: translateY(-8px); }
#boot { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity 0.6s; }
#boot.out { opacity: 0; pointer-events: none; }
#boot p { color: var(--dim); font-size: 15px; margin: 0; }
.logo { margin: 0; font: 900 64px var(--hud); letter-spacing: 0.06em; color: #fff; text-shadow: 0 0 18px rgba(111, 227, 255, 0.8), 0 0 42px rgba(111, 227, 255, 0.45); line-height: 1; }
.logo span { color: var(--gold); text-shadow: 0 0 18px rgba(255, 211, 107, 0.8), 0 0 42px rgba(255, 170, 60, 0.45); }
#boot .logo { font-size: 44px; }
#mapWrap { position: fixed; right: 14px; bottom: 14px; z-index: 22; width: 360px; display: flex; flex-direction: column; gap: 8px; transition: width 0.22s ease; }
#mapPanel { position: relative; height: 236px; border: 1px solid rgba(120, 200, 255, 0.45); border-radius: 16px; overflow: hidden; touch-action: none; cursor: crosshair;
box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5), 0 0 24px rgba(80, 180, 255, 0.18); transition: height 0.22s ease; }
#mapWrap.wide { width: min(58vw, 880px); }
#mapWrap.wide #mapPanel { height: min(60vh, 620px); }
#mapWrap.reveal { left: 14px; top: 64px; right: 14px; bottom: 14px; width: auto; }
#mapWrap.reveal #mapPanel { height: auto; flex: 1; cursor: grab; }
#mapWrap.reveal #bGuess, #mapWrap.reveal #hBox, #mapWrap.reveal #mapHint { display: none; }
#mapWrap:not(.wide):not(.reveal):not(.open) .mapUi { display: none; }
#mapLabels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.mapUi { position: absolute; z-index: 2; }
#mapBar { top: 8px; left: 8px; display: flex; gap: 6px; }
#mapBar button { min-width: 38px; height: 32px; padding: 0 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font: 700 12px var(--hud); letter-spacing: 0.06em; }
#mapBar button:hover { border-color: var(--cyan); }
#mapBar button.on { color: var(--gold); border-color: rgba(255, 211, 107, 0.6); }
#hBox { left: 8px; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; }
#hBox label { font: 600 12px var(--body); color: var(--dim); white-space: nowrap; min-width: 112px; }
#hBox label b { color: var(--pink); font-family: var(--hud); }
#hBox input { flex: 1; accent-color: var(--pink); }
#mapHint { position: absolute; left: 0; right: 0; bottom: 52px; text-align: center; font: 600 13px var(--body); color: var(--dim); pointer-events: none; text-shadow: 0 0 6px #000; }
#mapWrap:not(.wide):not(.open) #mapHint { bottom: 10px; }
.mlab { position: absolute; left: 0; top: 0; display: none; white-space: nowrap; font: 500 11px var(--body); color: rgba(225, 238, 255, 0.85); text-shadow: 0 0 4px #000, 0 0 6px #000; }
.mlab.sun { color: var(--gold); font: 700 12px var(--hud); letter-spacing: 0.06em; }
.mlab.cluster { color: #8fe9ff; font-style: italic; }
.mlab.ring { color: rgba(111, 200, 255, 0.55); font: 500 10px var(--hud); }
.mlab.dir { color: rgba(150, 200, 255, 0.5); font: 600 10px var(--hud); letter-spacing: 0.1em; text-transform: uppercase; }
.mlab.pin { color: var(--pink); font-weight: 700; font-size: 12px; }
.mlab.target { color: var(--gold); font: 700 14px var(--hud); }
.big { border-radius: 14px; padding: 12px 18px; font: 700 17px var(--hud); letter-spacing: 0.08em; color: #1b1203; background: linear-gradient(180deg, #ffe28f, #ffb340); box-shadow: 0 4px 20px rgba(255, 179, 64, 0.35); }
.big:hover { filter: brightness(1.08); }
.big:disabled { background: rgba(60, 74, 100, 0.85); color: var(--dim); box-shadow: none; cursor: default; font-size: 13px; filter: none; }
.ghostBtn { border-radius: 14px; padding: 11px 16px; font: 600 15px var(--body); background: var(--panel); border: 1px solid var(--line); }
.ghostBtn:hover { border-color: var(--cyan); }
#bMap, #bBackMap { position: fixed; z-index: 22; bottom: 14px; left: 50%; transform: translateX(-50%); }
#revealCard { position: fixed; z-index: 25; bottom: 30px; left: 30px; width: min(470px, calc(100vw - 28px)); padding: 16px 20px; }
#revealCard .pts { display: flex; align-items: baseline; gap: 8px; }
#revealCard .pts b { font: 900 40px var(--hud); color: var(--gold); text-shadow: 0 0 18px rgba(255, 211, 107, 0.5); }
#revealCard .pts span { color: var(--dim); font: 600 14px var(--hud); }
#revealCard .pts em { margin-left: auto; color: var(--pink); font-style: normal; font-size: 13px; }
.bar { height: 8px; border-radius: 99px; background: rgba(120, 200, 255, 0.15); overflow: hidden; margin: 6px 0 10px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff5f93, #ffd36b, #6dffb0); transition: width 1s ease; }
#revealCard .err { margin: 0 0 6px; font-size: 15px; }
#revealCard h3 { margin: 6px 0 2px; font: 600 16px var(--body); color: var(--dim); }
#revealCard h3 span { color: #fff; font: 700 18px var(--hud); }
#revealCard .meta { margin: 0 0 6px; font-size: 13px; color: var(--dim); }
#revealCard .fact { margin: 0 0 12px; font-size: 15px; line-height: 1.4; color: #cfe6ff; }
.btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.screen { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; padding: 72px 16px 24px; overflow-y: auto; }
#home { background: radial-gradient(ellipse at center, rgba(2, 4, 10, 0.25), rgba(2, 4, 10, 0.75)); }
.homeIn { max-width: 820px; width: 100%; text-align: center; margin: auto; }
#home .logo { font-size: clamp(40px, 10.5vw, 104px); }
.tag { font-size: 18px; color: #cfe2ff; max-width: 560px; margin: 16px auto 26px; line-height: 1.4; text-shadow: 0 0 8px #000; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.mode, .daily { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 6px; transition: transform 0.15s, border-color 0.15s; }
.mode:hover, .daily:hover { transform: translateY(-2px); border-color: var(--cyan); }
.mode b, .daily b { font: 700 20px var(--hud); letter-spacing: 0.06em; }
.mode[data-m="easy"] b { color: var(--ok); } .mode[data-m="medium"] b { color: var(--gold); } .mode[data-m="hard"] b { color: var(--pink); }
.mode span, .daily span { font-size: 14px; color: var(--dim); line-height: 1.35; }
.mode .best { font: 600 12px var(--hud); color: var(--gold); font-style: normal; min-height: 14px; }
.daily { width: 100%; margin-top: 12px; align-items: center; text-align: center; border-color: rgba(255, 211, 107, 0.5); background: linear-gradient(90deg, rgba(60, 40, 10, 0.8), rgba(12, 22, 48, 0.85), rgba(60, 40, 10, 0.8)); }
.daily b { color: var(--gold); }
.opts { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 18px; font-size: 14px; }
.chk { display: flex; align-items: center; gap: 6px; color: #cfe2ff; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--gold); }
.lnk { color: var(--cyan); font: 600 14px var(--body); padding: 4px; text-decoration: underline; text-underline-offset: 3px; }
.panel { background: var(--panel2); border: 1px solid var(--line); border-radius: 20px; padding: 22px 24px; max-width: 680px; width: 100%; margin: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
.panel h2 { font: 700 24px var(--hud); margin: 0 0 10px; color: var(--cyan); }
.panel h3 { font: 700 15px var(--hud); color: var(--gold); margin: 16px 0 6px; }
.panel p, .panel li { line-height: 1.5; color: #d6e8ff; }
.panel .small { font-size: 13px; color: var(--dim); }
.how li { margin-bottom: 8px; } .cred { padding-left: 18px; }
.logo.sm { font-size: 34px; text-align: center; }
.sub { text-align: center; color: var(--dim); margin: 6px 0 4px; }
.total { text-align: center; } .total b { font: 900 54px var(--hud); color: var(--gold); text-shadow: 0 0 24px rgba(255, 211, 107, 0.5); } .total span { color: var(--dim); font: 600 16px var(--hud); margin-left: 6px; }
.newBest { text-align: center; color: var(--ok); font: 700 15px var(--hud); letter-spacing: 0.08em; animation: pulse 0.7s ease-in-out infinite alternate; }
.bestLine { text-align: center; color: var(--dim); font-size: 14px; }
.rt { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; }
.rt th { text-align: left; color: var(--dim); font: 600 11px var(--hud); letter-spacing: 0.08em; text-transform: uppercase; padding: 6px; }
.rt td { padding: 8px 6px; border-top: 1px solid rgba(120, 200, 255, 0.12); }
.rt .nm small { display: block; color: var(--dim); font-size: 12px; } .rt .sc { white-space: nowrap; font-weight: 700; text-align: right; }
#shareTxt { background: rgba(0, 0, 0, 0.35); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; font: 500 13px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; color: #cfe6ff; }
.phoneOnly { display: none; }
@media (max-width: 759px) {
#kai { top: 10px; left: 8px; padding: 6px 10px; font-size: 13px; }
#kai.inGame { padding: 6px 8px; }
#hud { left: 92px; right: 8px; gap: 5px; top: 8px; }
.hb { min-width: 0; padding: 3px 8px; } .hb b { font-size: 14px; } .hb .k { font-size: 9px; } .hb.diff { display: none; }
.ib { width: 36px; height: 36px; }
#tools { top: auto; bottom: 80px; left: 8px; transform: none; gap: 6px; }
.tool { padding: 9px; } .tool span { display: none; } .tool.sm { width: 42px; }
#starCard { top: auto; bottom: 80px; right: 8px; left: 64px; width: auto; }
#mapWrap:not(.open):not(.reveal) { display: none; }
#mapWrap.open, #mapWrap.reveal { left: 8px; right: 8px; top: 56px; bottom: 8px; width: auto; }
#mapWrap.open #mapPanel { height: auto; flex: 1; }
.phoneOnly { display: inline-block; }
#bMap, #bBackMap { left: 64px; right: 8px; transform: none; }
#revealCard { bottom: 8px; left: 8px; width: calc(100vw - 16px); max-height: 52vh; overflow-y: auto; padding: 12px 14px; }
#revealCard .pts b { font-size: 30px; } #revealCard .fact { font-size: 14px; }
.modes { grid-template-columns: 1fr; }
.mode { padding: 12px 14px; }
.tag { font-size: 16px; margin: 12px auto 18px; }
.panel { padding: 16px; }
.rt { font-size: 13px; } .total b { font-size: 42px; }
}
body.tile #kai, body.tile #toasts, body.tile #boot { display: none !important; }
#tileArt { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
#tileArt svg { position: absolute; inset: 0; }
.tileTitle { position: absolute; left: 0; right: 0; top: 168px; text-align: center; font: 900 160px var(--hud); letter-spacing: 0.04em; color: #f6fcff;
text-shadow: 0 0 6px #fff, 0 0 26px rgba(111, 227, 255, 0.95), 0 0 70px rgba(60, 170, 255, 0.75), 0 0 140px rgba(60, 120, 255, 0.6), 0 6px 0 rgba(0, 30, 70, 0.6); }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="skyLabels"><div id="sunRing"><span>Sun</span></div></div>
  <a id="kai" href="index.html">&larr; Kai.fun</a>
  <header id="hud" class="hide">
    <div class="hb"><span class="k">Round</span><b id="hRound">1/5</b></div>
    <div class="hb"><span class="k">Score</span><b id="hScore">0</b></div>
    <div class="hb" id="hTimerBox"><span class="k">Time</span><b id="hTimer">1:30</b></div>
    <div class="hb diff" id="hDiff">Easy</div>
    <span class="grow"></span>
    <button class="ib" id="bSnd2" title="Sound on/off" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <button class="ib" id="bQuit" title="Back to menu" aria-label="Quit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>
  <div id="tools" class="hide">
    <button class="tool" id="bGhost" title="Show Earth's constellations, warped and as ghosts"><svg viewBox="0 0 24 24"><path d="M4 18 9 8l6 5 5-9"/><circle cx="4" cy="18" r="1.6"/><circle cx="9" cy="8" r="1.6"/><circle cx="15" cy="13" r="1.6"/><circle cx="20" cy="4" r="1.6"/></svg><span>Constellations</span></button>
    <button class="tool" id="bHint" title="Show the names of the brightest stars (costs 20% of this round)"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Hint</span></button>
    <button class="tool" id="bSun" title="Point the view at the Sun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span>Find the Sun</span></button>
    <button class="tool sm" id="bZin" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tool sm" id="bZout" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  </div>
  <div id="starCard" class="card hide"></div>
  <div id="mapWrap" class="hide">
    <div id="mapPanel">
      <div id="mapLabels"></div>
      <div class="mapUi" id="mapBar">
        <button id="bMode" title="Switch between top-down and 3D">3D</button><button id="bSnap" class="on" title="Snap the pin onto stars">Snap</button><button id="bMzin" aria-label="Zoom map in">+</button><button id="bMzout" aria-label="Zoom map out">&minus;</button><button id="bMapX" class="phoneOnly">Sky</button>
      </div>
      <div class="mapUi" id="hBox"><label for="hSlider">Height <b id="hVal">0 ly</b></label><input type="range" id="hSlider" min="-50" max="50" value="0" step="0.5" aria-label="Pin height above the galactic plane"></div>
      <div id="mapHint">Tap the map to drop your guess pin</div>
    </div>
    <button id="bGuess" class="big" disabled>Place your pin on the map</button>
  </div>
  <button id="bMap" class="big hide">Open map &amp; guess</button>
  <button id="bBackMap" class="big hide">Back to the map</button>
  <div id="revealCard" class="card hide"></div>
  <section id="home" class="screen">
    <div class="homeIn">
      <h1 class="logo" aria-label="STARGUESSR">STAR<span>GUESSR</span></h1>

// ===== data.js =====
{
const C = SG.Cat = { base: 'starguessr/assets/', n: 0, ready: false };
const SPEC = 'OBAFGKMD';
C.parse = (buf, meta) => {
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== 0x31434753) throw new Error('bad star file');

    const q = dv.getUint16(o + 6, true) / 65535, d = DMAX * q * q;

    C.dist[i] = d; C.absMag[i] = dv.getInt16(o + 8, true) / 100;

  }
  C.hip = new Uint32Array(buf.slice(o, o + n * 4)); o += n * 4;
  C.con = new Uint8Array(buf.slice(o, o + n));
  C.cons = meta.cons; C.lines = meta.lines; C.pools = meta.pools; C.source = meta.source;
  C.names = new Map(); C.byName = new Map();
  for (const [i, s] of meta.names) {
    const [name, alt] = s.split('|');
    const nm = name === 'Sol' ? 'the Sun' : name;
    C.names.set(i, { name: nm, alt: alt || '' });
    for (const k of [nm, alt]) if (k && !C.byName.has(k.toLowerCase())) C.byName.set(k.toLowerCase(), i);
  }

};
C.load = async () => {
  const get = (f) => fetch(C.base + f).then((r) => { if (!r.ok) throw new Error(f + ' ' + r.status); return r; });

};

const countUp = (el, to, ms) => {

};

// ===== main.js =====
{
const fail = (msg) => { const b = SG.$('bootMsg'); if (b) b.innerHTML = msg; };
let last = 0, time = 0;
const frame = (now) => {
  requestAnimationFrame(frame);
  const ms = last ? now - last : 16.7; last = now;
  const dt = Math.min(0.05, ms / 1000); time += dt;
  if (!document.hidden) SG.R.mark(ms);
  const c0 = performance.now();
  SG.Game.update(dt); SG.UI.update();
  SG.Sky.update(dt, time);
  SG.R.renderer.setScissorTest(false); SG.R.renderer.setViewport(0, 0, SG.R.w, SG.R.h);
  if (SG.UI.mapCoversSky()) SG.R.renderer.clear(true, true, false); else SG.R.draw(SG.Sky.scene, SG.Sky.cam, null);
  SG.UI.mapRect = null;
  if (SG.UI.mapVisible()) {
    const rect = SG.UI.mapRect = SG.$('mapPanel').getBoundingClientRect();
    if (rect.width > 20 && rect.height > 20) {
      SG.MapCtl.update(dt); SG.Reveal.update(dt); SG.Map.update(dt, time);
      SG.Map.cam.aspect = rect.width / rect.height; SG.Map.cam.updateProjectionMatrix();
      SG.R.draw(SG.Map.scene, SG.Map.cam, rect);
      SG.MapLabels.update(rect);
    }
  }
  SG.Lines.update(); SG.Pick.update();
  SG.R.cpu.push(performance.now() - c0); if (SG.R.cpu.length > 240) SG.R.cpu.shift();
  if (!window.SG_READY) { window.SG_READY = true; const b = SG.$('boot'); if (b) { b.classList.add('out'); setTimeout(() => b.remove(), 700); } SG.emit('ready'); }
};
const boot = async () => {
  if (!window.THREE) return fail('Could not load the 3D engine. Check your connection and refresh.');
  if (!SG.R.init()) return fail('Your browser could not start WebGL (3D graphics). Try another browser.');
  try { await SG.Cat.load(); } catch (e) { console.error(e); return fail('Could not load the star catalogue. Check your connection and refresh.'); }
  SG.MW.bake(SG.R.renderer);
  SG.Sky.init();
  SG.Map.init();
  SG.MapLabels.init();
  SG.UI.init();
  if (SG.TILE && SG.Tile) SG.Tile.setup();
  requestAnimationFrame(frame);
};
const C = SG.Cat;
const idx = (s) => (typeof s === 'number' ? s : C.find(s));
SG.api = {
  count: () => C.n,
  pools: () => ({ easy: C.pools.easy.length, medium: C.pools.medium.length, hard: C.pools.hard.length }),
  find: (s) => idx(s),
  magFrom: (s, from) => C.appMag(idx(s), from == null ? [0, 0, 0] : C.p(idx(from))),
  eqFromSun: (s) => SG.Astro.galToEq(C.p(idx(s))),
  shaderMag: (s) => SG.Stars.mags[idx(s)],
  start: (mode, seed, timer) => { SG.Game.start(mode, { seed, timer }); return SG.api.state(); },
  state: () => { const G = SG.Game; return { phase: G.phase, i: G.i, total: G.total, pin: G.pin, results: G.results.map((r) => ({ name: r.name, err: r.err, score: r.score, diff: r.diff })), rounds: G.rounds.map((r) => r.idx), ui: SG.UI.ph }; },
  target: () => C.p(SG.Game.round().idx),
  pinNear: (dx, dy, dz) => { const t = SG.api.target(); SG.Game.placePin([t[0] + dx, t[1] + dy, t[2] + dz]); return SG.Game.pin; },
  score: (err, diff) => SG.Rules.score(err, diff),
  rounds: (mode, seed) => SG.Rules.makeRounds(mode, seed).map((r) => r.idx),
  daily: (date) => SG.Rules.makeRounds('daily', SG.Rules.dailySeed(date)).map((r) => C.label(r.idx)),
  stats: () => SG.R.stats(),
  lookAt: (s, fov) => { const d = SG.Stars.dirTo(idx(s)); const e = SG.Astro.galToEq(d); SG.Sky.look(e.ra, e.dec, fov || SG.Sky.fov); SG.Sky.drift = 0; },
  project: (s) => SG.Sky.project(SG.Stars.dirTo(idx(s))),
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
}
