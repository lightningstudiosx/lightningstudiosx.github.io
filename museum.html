<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Museum of Everything</title>
<meta name="description" content="A museum that holds every possible painting up to 100×100 pixels. Wander room after room. Please do not touch.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%221%22 width=%2214%22 height=%2214%22 fill=%22%23b48a3c%22/%3E%3Crect x=%224%22 y=%224%22 width=%228%22 height=%228%22 fill=%22%23ccc%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  --ink:#2a2118;
  --ink-soft:#5a4a39;
  --paper:#f3ecdc;
  --paper-2:#e8dec7;
  --brass:#b48a3c;
  --brass-hi:#e9c979;
  --brass-lo:#6e5120;
  --night:#1b1612;
  --night-2:#2a221b;
  --serif:"Cormorant Garamond","EB Garamond",Garamond,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--serif);overflow-x:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}

/* ---------- top bar ---------- */
.top{position:relative;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 16px 10px 122px;min-height:58px;background:linear-gradient(#231c16,#1b1612);border-bottom:1px solid #3d3227}
.where{flex:1;min-width:0}
.wing{font-size:21px;font-weight:600;line-height:1.1;letter-spacing:.01em;color:#f1e3c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomline{font-size:14px;font-style:italic;color:#bfae8e;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:14px;font-variant:small-caps;letter-spacing:.06em;font-size:14px;color:#cdb78f;white-space:nowrap}
.stats b{font-variant:normal;font-size:18px;color:#f1e3c2;font-weight:600;margin-right:3px}

/* ---------- scene ---------- */
.stage{position:relative;height:calc(100vh - 58px - 74px);height:calc(100dvh - 58px - 74px);min-height:340px;overflow:hidden;background:#000;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.view{position:absolute;inset:0;will-change:transform,opacity}
.wall{position:absolute;left:0;right:0;top:0}
.wall::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(120% 70% at 50% 0%,rgba(255,240,210,.20),transparent 60%),
   linear-gradient(90deg,rgba(0,0,0,.38),transparent 9%,transparent 91%,rgba(0,0,0,.38)),
   linear-gradient(rgba(0,0,0,.28),transparent 14%)}
.cornice{position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(#f2ead8,#cfc3a8 45%,#9d907a 55%,#e6dcc5 75%,#8b7f6a);box-shadow:0 3px 6px rgba(0,0,0,.25);z-index:1}
.rail{position:absolute;left:0;right:0;height:9px;background:linear-gradient(#e9dfc9,#b5a88f 50%,#7d725f);box-shadow:0 2px 4px rgba(0,0,0,.25);z-index:1}
.dado{position:absolute;left:0;right:0;bottom:0}
.base{position:absolute;left:0;right:0;height:14px;background:linear-gradient(#3b2f25,#1d1611);z-index:2}
.floor{position:absolute;left:0;right:0;bottom:0;overflow:hidden}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 40%,rgba(0,0,0,.3));pointer-events:none}

/* paintings */
.art{position:absolute;padding:0;border:0;background:none;cursor:zoom-in;transform:translate(-50%,-50%);z-index:3;display:block}
.art:focus-visible{outline:3px solid #ffe7a3;outline-offset:6px}
.art .frame{display:block;position:relative;box-shadow:0 14px 22px -6px rgba(0,0,0,.55),0 3px 6px rgba(0,0,0,.35)}
.frame,.mat{display:block}
.frame{position:relative}
canvas.px{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.art .glow{position:absolute;left:50%;top:-60%;width:180%;height:220%;transform:translateX(-50%);pointer-events:none;background:radial-gradient(closest-side,rgba(255,236,190,.22),transparent);z-index:-1}
.art.hl .frame{animation:hl 1.4s ease-in-out 3}
@keyframes hl{50%{box-shadow:0 0 0 6px rgba(255,225,140,.9),0 0 40px 10px rgba(255,220,130,.6)}}

/* frame styles */
.f-gilt{background:
  radial-gradient(circle,#fff3c4 0 1.2px,transparent 1.6px) 0 0/7px 7px,
  linear-gradient(135deg,#6c4c14,#e8c56a 22%,#9b7426 45%,#f6dc8e 62%,#a17a2b 80%,#5e420f)}
.f-gilt .mat{box-shadow:inset 0 0 0 2px #4a330b,inset 0 0 0 4px #f0d48a;padding:4px}
.f-walnut{background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 7px),linear-gradient(135deg,#3a2414,#6b4426 40%,#4a2e19 70%,#2b190d)}
.f-walnut .mat{background:#efe7d6;box-shadow:inset 0 0 0 1px #b9ac93}
.f-black{background:#141210}
.f-black .mat{background:#f6f2ea;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.f-silver{background:
  radial-gradient(circle,#fff 0 1.1px,transparent 1.5px) 0 0/6px 6px,
  linear-gradient(135deg,#6d7076,#e6e8ec 25%,#8d9097 50%,#f4f5f7 70%,#696c72)}
.f-silver .mat{box-shadow:inset 0 0 0 2px #3c3f44;padding:3px;background:#2a2b2e}
.f-baroque{background:
  conic-gradient(from 45deg,#f8e29b,#7a5716,#f8e29b,#7a5716,#f8e29b) 0 0/12px 12px,
  linear-gradient(#b48a3c,#b48a3c)}
.f-baroque .mat{background:linear-gradient(135deg,#5a1e1e,#3b1212);box-shadow:inset 0 0 0 3px #e9c979}
.f-oak{background:linear-gradient(135deg,#b88e5c,#d9b582 40%,#a97f4e)}
.f-oak .mat{background:#fbf8f1}
.f-none{background:transparent;box-shadow:none!important}
.f-none canvas{box-shadow:6px 8px 12px rgba(0,0,0,.45)}

/* labels next to paintings */
.lbl{position:absolute;transform:translateX(-50%);z-index:3;background:linear-gradient(#f6f0e2,#e6dcc6);color:var(--ink);padding:4px 8px 5px;font-size:12.5px;line-height:1.15;text-align:center;box-shadow:0 2px 4px rgba(0,0,0,.35);max-width:180px;pointer-events:none}
.lbl i{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl span{color:var(--ink-soft);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lbl .rar{display:block;font-variant:small-caps;letter-spacing:.06em;font-size:10.5px;color:#8a2b1c}

/* doorway */
.door{position:absolute;bottom:0;transform:translateX(-50%);border:0;padding:0;cursor:pointer;z-index:2;background:none}
.door .arch{position:absolute;inset:0;border-radius:999px 999px 0 0;overflow:hidden;box-shadow:inset 0 0 0 7px #e6dcc5,inset 0 0 0 9px #8b7f6a,inset 0 18px 30px rgba(0,0,0,.6)}
.door .beyond{position:absolute;inset:0}
.door .beyond .bfloor{position:absolute;left:0;right:0;bottom:0;height:22%}
.door .beyond .bart{position:absolute;background:linear-gradient(135deg,#7a5a1c,#e9c66b,#80601f);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.door .beyond::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,transparent 30%,rgba(0,0,0,.45))}
.door:hover .arch,.door:focus-visible .arch{box-shadow:inset 0 0 0 7px #fff2cc,inset 0 0 0 9px #b48a3c,inset 0 18px 30px rgba(0,0,0,.4)}
.door:focus-visible{outline:none}
.doorsign{position:absolute;transform:translateX(-50%);z-index:3;background:#1f1a15;color:#ead9b5;font-size:12px;letter-spacing:.08em;font-variant:small-caps;padding:3px 9px;white-space:nowrap;border:1px solid #6e5120;box-shadow:0 2px 4px rgba(0,0,0,.4);max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.exit{position:absolute;transform:translateX(-50%);z-index:3;background:#1f6b3a;color:#e9ffef;font:700 10px/1 system-ui,sans-serif;letter-spacing:.12em;padding:4px 7px;border-radius:2px;box-shadow:0 0 10px rgba(80,255,140,.35);pointer-events:none}

/* decor */
.decor{position:absolute;z-index:4;pointer-events:none}
.decor svg{display:block;width:100%;height:100%}
.guard{pointer-events:auto;cursor:pointer;border:0;background:none;padding:0}
.bubble{position:absolute;z-index:8;background:#fffaf0;color:var(--ink);font-size:15px;font-style:italic;padding:7px 11px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.35);max-width:210px;line-height:1.2;transform:translateX(-50%);pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fffaf0;transform:translateX(-50%)}
.wallplaque{position:absolute;transform:translateX(-50%);z-index:3;background:linear-gradient(#e8c977,#a57c2e);color:#2b1d07;padding:6px 12px;font-size:13px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,.45);border:1px solid #6e5120;pointer-events:none;line-height:1.15;max-width:240px}
.wallplaque b{display:block;font-variant:small-caps;letter-spacing:.1em;font-size:11px}

/* hud on stage */
.compass{position:absolute;right:14px;top:12px;z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.mm{width:132px;height:132px;background:rgba(27,22,18,.82);border:1px solid #6e5120;box-shadow:0 4px 14px rgba(0,0,0,.4);border-radius:4px;pointer-events:auto}
.facing{background:rgba(27,22,18,.82);border:1px solid #6e5120;color:#ead9b5;font-size:13px;padding:3px 9px;letter-spacing:.08em;font-variant:small-caps;border-radius:3px}
.toast{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);z-index:12;background:rgba(27,22,18,.92);color:#f1e3c2;border:1px solid #6e5120;padding:9px 16px;font-size:16px;font-style:italic;border-radius:4px;max-width:min(560px,90%);text-align:center;pointer-events:none;transition:opacity .5s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.hide{opacity:0}

/* controls */
.controls{height:74px;display:flex;align-items:center;gap:10px;padding:0 16px;background:linear-gradient(#1b1612,#140f0b);border-top:1px solid #3d3227}
.btn{appearance:none;border:1px solid #6e5120;background:linear-gradient(#2e251c,#211a14);color:#f1e3c2;font-size:16px;font-weight:600;padding:9px 14px;border-radius:3px;cursor:pointer;white-space:nowrap;letter-spacing:.02em}
.btn:hover{background:linear-gradient(#3a2f23,#2a2119);border-color:#b48a3c}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:default}
.btn.gold{background:linear-gradient(#e7c873,#a8802f);color:#24180a;border-color:#5e420f}
.btn.gold:hover{background:linear-gradient(#f2d687,#b88f3a)}
.nav{display:flex;gap:6px}
.spacer{flex:1}
.search{display:flex;gap:0;align-items:stretch}
.search input{width:190px;font:inherit;font-size:16px;background:#f3ecdc;color:var(--ink);border:1px solid #6e5120;border-right:0;padding:7px 10px;border-radius:3px 0 0 3px;min-width:0}
.search input::placeholder{color:#8f7e63;font-style:italic}
.search .btn{border-radius:0 3px 3px 0}

/* detail modal */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(14,11,8,.86);padding:16px;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.card{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;max-width:1080px;width:100%;max-height:100%;overflow:auto;padding:28px;background:
   radial-gradient(90% 80% at 30% 40%,rgba(255,240,210,.12),transparent 70%),var(--wallc,#5d4b3a);border:1px solid #6e5120;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.bigwrap{display:flex;align-items:center;justify-content:center;min-height:200px}
.bigwrap .frame{display:block;box-shadow:0 20px 40px -10px rgba(0,0,0,.7)}
.plaque{background:linear-gradient(#f7f1e3,#e9dfc9);color:var(--ink);padding:22px 24px 20px;box-shadow:0 8px 24px rgba(0,0,0,.4);border:1px solid #c9b993}
.plaque .cat{font-variant:small-caps;letter-spacing:.12em;font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plaque h2{font-size:30px;line-height:1.05;margin:8px 0 6px;font-style:italic;font-weight:600}
.plaque .artist{font-size:18px;font-weight:600}
.plaque .artist small{font-weight:400;color:var(--ink-soft);font-size:16px}
.plaque dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:12px 0;font-size:15.5px}
.plaque dt{font-variant:small-caps;letter-spacing:.06em;color:var(--ink-soft)}
.plaque dd{margin:0}
.plaque .desc{font-size:17px;line-height:1.35;margin:12px 0;border-top:1px solid #cdbf9f;padding-top:12px}
.rarity{display:inline-block;font-variant:small-caps;letter-spacing:.08em;font-size:13px;padding:1px 8px;border:1px solid currentColor;border-radius:999px}
.r-common{color:#6d6253}.r-uncommon{color:#2f6b45}.r-rare{color:#1f4f8a}.r-very{color:#6b2d8a}.r-legend{color:#a2321c;background:#fbe9c8}
.odds{background:#2a2118;color:#f1e3c2;padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.3}
.odds .big{font-size:26px;font-weight:600;display:block;word-break:break-all;line-height:1.1;margin:2px 0 4px}
.odds sup{font-size:.62em}
.modal .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal .btn{font-size:15px;padding:7px 12px}
.close{position:absolute;right:10px;top:8px;background:none;border:0;color:#f1e3c2;font-size:30px;cursor:pointer;line-height:1;padding:4px 8px;z-index:2}


/* gallery directory */
.gmodal{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:rgba(14,11,8,.86);padding:16px;backdrop-filter:blur(3px)}
.gmodal.open{display:flex}
.gbox{position:relative;width:100%;max-width:1080px;max-height:100%;overflow:auto;background:linear-gradient(#f7f1e3,#e9dfc9);color:var(--ink);border:1px solid #6e5120;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:24px 26px 26px}
.gbox .close{color:var(--ink)}
.gbox h2{font-size:34px;font-weight:600;font-variant:small-caps;letter-spacing:.06em;margin:0;text-wrap:balance}
.gsub{font-style:italic;font-size:17px;margin:4px 0 16px;color:var(--ink-soft)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gcard{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;text-align:left;font:inherit;color:inherit;background:#fbf7ec;border:1px solid #cdbf9f;padding:10px;cursor:pointer;min-width:0}
.gcard:hover,.gcard:focus-visible{border-color:#6e5120;box-shadow:0 4px 14px rgba(42,33,24,.18);outline:none}
.gthumb{display:grid;place-items:center;width:86px;height:72px;border:4px solid #b48a3c;box-shadow:inset 0 0 0 1px #5d4718}
.gthumb canvas{image-rendering:pixelated;max-width:64px;max-height:52px;width:auto;height:auto;min-width:20px;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.gtx{display:flex;flex-direction:column;gap:2px;min-width:0}
.gtx b{font-size:19px;font-weight:600;line-height:1.1}
.gtx i{font-size:14.5px;line-height:1.25;color:#4a3d2c}
.gtx small{font-variant:small-caps;letter-spacing:.06em;font-size:12.5px;color:#8f7e63;margin-top:3px}
.gcard.found small{color:#2f6b45}
.gcard.here{border-color:#b48a3c;background:#fff6dc}
.gcard:not(.found) .gthumb canvas{filter:grayscale(1) brightness(.55)}
@media (max-width:720px){.ph-hide{display:none}.gbox{padding:18px 14px}.gbox h2{font-size:26px}.ggrid{grid-template-columns:1fr}}

/* ---------- phone ---------- */
@media (max-width:720px){
  .top{padding:8px 12px 8px 112px;min-height:54px;gap:8px}
  .wing{font-size:16.5px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .roomline{font-size:12.5px}
  .stats{flex-direction:column;gap:0;font-size:11.5px;text-align:right;line-height:1.15}
  .stats b{font-size:14px}
  .stage{height:calc(100vh - 64px - 112px);height:calc(100dvh - 64px - 112px)}
  .controls{height:112px;flex-wrap:wrap;align-content:center;gap:8px;padding:8px 12px}
  .nav{flex:1 1 100%;display:grid;grid-template-columns:1fr 1.3fr 1fr}
  .spacer{display:none}
  .search{flex:1}
  .search input{width:100%}
  .btn{font-size:15px;padding:8px 10px}
  .mm{width:80px;height:80px;opacity:.9}
  .compass{right:8px;top:8px;gap:5px}
  .facing{display:none}
  .wallplaque{max-width:190px;font-size:11.5px;padding:4px 8px}
  .lbl{font-size:10px;padding:2px 5px 3px;max-width:110px}
  .lbl span{display:none}
  .lbl .rar{font-size:9px}
  .card{grid-template-columns:1fr;gap:16px;padding:18px 14px}
  .plaque{padding:16px}
  .plaque h2{font-size:24px}
  .doorsign{font-size:10px}
}
@media (prefers-reduced-motion:reduce){.art.hl .frame{animation:none;box-shadow:0 0 0 6px rgba(255,225,140,.9)}}
</style>
</head>
<body>
<a class="kf-home" href="index.html" aria-label="Back to Kai.fun">← Kai.fun</a>
<style>.kf-home{position:fixed;top:12px;left:12px;z-index:9999;font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#111;background:#fff;border:1.5px solid #111;border-radius:999px;padding:7px 12px;text-decoration:none;box-shadow:2px 2px 0 #111}.kf-home:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 #111}</style>

<header class="top">
  <div class="where">
    <div class="wing" id="wingName">Museum of Everything</div>
    <div class="roomline" id="roomLine">Holdings: every possible painting</div>
  </div>
  <div class="stats" aria-live="polite">
    <span><b id="statRooms">0</b>rooms</span>
    <span><b id="statSeen">0</b>paintings seen</span>
  </div>
</header>

<main class="stage" id="stage" aria-label="Museum room">
  <div class="compass">
    <canvas class="mm" id="minimap" width="132" height="132" aria-label="Map of rooms visited"></canvas>
    <div class="facing" id="facing">North wall</div>
  </div>
  <div class="toast" id="toast">This museum holds every possible painting. Please do not touch.</div>
</main>

<nav class="controls" aria-label="Museum controls">
  <div class="nav">
    <button class="btn" id="btnLeft" title="Turn left (←)">◀ Turn</button>
    <button class="btn gold" id="btnWalk" title="Walk through doorway (↑)">▲ Walk through</button>
    <button class="btn" id="btnRight" title="Turn right (→)">Turn ▶</button>
  </div>
  <div class="spacer"></div>
  <form class="search" id="searchForm" autocomplete="off">
    <input id="searchIn" placeholder="Catalogue no., e.g. 12.-4.E2" aria-label="Catalogue number" enterkeyhint="go">
    <button class="btn" type="submit">Find</button>
  </form>
  <button class="btn" id="btnGal" title="Directory of themed galleries (G)">Galleries</button>
  <button class="btn" id="btnRandom" title="Teleport to a random room">Random<span class="ph-hide"> room</span></button>
</nav>

<div class="gmodal" id="galModal" role="dialog" aria-modal="true" aria-labelledby="galH">
  <div class="gbox">
    <button class="close" id="galClose" aria-label="Close">×</button>
    <h2 id="galH">Gallery Directory</h2>
    <p class="gsub"><span id="galCount"></span>. Pick one and a guard will escort you to the nearest.</p>
    <div class="ggrid" id="galGrid"></div>
  </div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="card" id="card">
    <button class="close" id="mClose" aria-label="Close">×</button>
    <div class="bigwrap" id="bigWrap"></div>
    <div class="plaque">
      <div class="cat"><span id="mCat">MoE</span><span id="mRarity"></span></div>
      <h2 id="mTitle"></h2>
      <div class="artist" id="mArtist"></div>
      <dl>
        <dt>Date</dt><dd id="mYear"></dd>
        <dt>Medium</dt><dd id="mMedium"></dd>
        <dt>Dimensions</dt><dd id="mDims"></dd>
        <dt>Est. value</dt><dd id="mValue"></dd>
      </dl>
      <div class="desc" id="mDesc"></div>
      <div class="odds" id="mOdds"></div>
      <div class="row">
        <button class="btn" id="mPrev">◀ Previous</button>
        <button class="btn" id="mNext">Next ▶</button>
        <button class="btn" id="mCopy">Copy catalogue no.</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){

/* ================= seeded randomness ================= */

  const [tname,,rarity]=type;

  else if(tname==='portrait'){w=ri(r,12,66);h=Math.min(100,Math.round(w*(1.2+r()*.2)));}
  else if(tname==='rothko'){w=ri(r,14,70);h=Math.min(100,Math.round(w*(1.2+r()*.3)));}
  else if(tname==='flag'){w=ri(r,15,90);h=Math.max(8,Math.round(w*(.55+r()*.15)));}

/* ================= odds ================= */
const LOG2_24=24*Math.log10(2);
function oddsHTML(w,h){
  const n=w*h,N=n*LOG2_24;let big;
  if(N<16){big='1 in '+(16777216n**BigInt(n)).toLocaleString('en-US');}
  else{const ip=Math.floor(N),mant=Math.pow(10,N-ip);big=`1 in ${mant.toFixed(2)} × 10<sup>${ip.toLocaleString('en-US')}</sup>`;}
  let quip;
  if(N<8)quip='Honestly, you could have guessed it.';
  else if(N<20)quip='Roughly the odds of finding one particular grain of sand on every beach on Earth.';
  else if(N<80)quip='There are about 10<sup>80</sup> atoms in the observable universe. We are getting close.';
  else if(N<1000)quip='More paintings of this size than atoms in the universe. Each one is on a wall here somewhere.';
  else quip=`Writing this number out would take ${Math.ceil(N).toLocaleString('en-US')} digits. The museum has a painting for each.`;
  return `That is the chance of getting exactly this ${w} × ${h} painting at random, in 24-bit colour:<span class="big">${big}</span>${quip}`;
}

function buildView(x,y,d){
  const room=roomOf(x,y),wing=room.wing;
  const W=stage.clientWidth,H=stage.clientHeight;
  const phone=W<720;
  const wallH=Math.round(H*(phone?.82:.8)),floorH=H-wallH;
  const v=document.createElement('div');v.className='view';
  const wall=document.createElement('div');wall.className='wall';wall.style.height=wallH+'px';
  wall.style.background=wallBg(room.color,wing.pattern);
  const railY=Math.round(wallH*.78);
  wall.innerHTML=`<div class="cornice"></div><div class="dado" style="height:${wallH-railY}px;background:linear-gradient(${shade(room.color,-.2)},${shade(room.color,-.28)})"></div><div class="rail" style="top:${railY-4}px"></div>`;
  v.appendChild(wall);
  const fl=document.createElement('div');fl.className='floor';fl.style.height=floorH+'px';fl.style.background=floorBg(wing.floor);v.appendChild(fl);
  const base=document.createElement('div');base.className='base';base.style.top=(wallH-14)+'px';v.appendChild(base);

  const door=room.doors[d];const n=slotsOf(x,y,d);
  const units=door?n+1.25:n;const unitW=W/units;
  const positions=[];
  if(door){positions.push(unitW*.5+W*.02,null,W-unitW*.5-W*.02);}else for(let i=0;i<n;i++)positions.push(unitW*(i+.5));
  const paintCY=wallH*.42;
  const maxH=wallH*(phone?.46:.5),maxW=unitW*(phone?.78:.68);
  let slot=0;const decorR=rng(`decor|${x},${y},${d}`);
  const arts=[];
  positions.forEach((cx,i)=>{
    if(cx===null){ // doorway
      const dw=Math.min(W/units*1.25*.78,wallH*.46),dh=wallH*.74,dcx=W/2;
      const nx=x+DX[d],ny=y+DY[d],nroom=roomOf(nx,ny);
      const b=document.createElement('button');b.className='door';b.style.left=dcx+'px';b.style.width=dw+'px';b.style.height=dh+'px';b.style.bottom=(floorH)+'px';
      b.setAttribute('aria-label',`Walk ${DIRNAME[d].toLowerCase()} into gallery ${nx}, ${ny}`);
      b.innerHTML=`<div class="arch"><div class="beyond" style="background:${shade(nroom.color,-.25)}"><div class="bart" style="left:22%;top:34%;width:16%;height:18%"></div><div class="bart" style="left:58%;top:30%;width:20%;height:24%"></div><div class="bfloor" style="background:${floorBg(nroom.wing.floor)};filter:brightness(.6)"></div></div></div>`;
      b.addEventListener('click',e=>{e.stopPropagation();if(!suppressClick)walk();});
      // door doesn't sit on dado – raise so bottom meets floor: set bottom relative to view
      b.style.bottom=floorH+'px';
      v.appendChild(b);
      const sign=document.createElement('div');sign.className='doorsign';sign.style.left=dcx+'px';sign.style.top=(wallH-dh-30)+'px';
      sign.textContent=nroom.wing.name!==wing.name?`→ ${nroom.wing.name}`:`Gallery ${fmtXY(nx,ny)}`;
      v.appendChild(sign);
      if(decorR()<.3){const ex=document.createElement('div');ex.className='exit';ex.textContent='EXIT?';ex.style.left=dcx+'px';ex.style.top=(wallH-dh-56)+'px';v.appendChild(ex);}
      return;
    }
    slot++;
    const p=painting(x,y,d,slot);
    const base=Math.min(maxW/p.w,maxH/p.h);
    const sc=wing.theme&&wing.theme.size==='tiny'?Math.min(base,phone?5:8):base*(.58+.42*Math.max(p.w,p.h)/100);
    const cw=Math.max(2,Math.round(p.w*sc)),ch=Math.max(2,Math.round(p.h*sc));
    const pad=p.frame==='f-none'?0:Math.round(Math.max(6,Math.min(22,Math.max(cw,ch)*.075)));
    const matPad=(p.frame==='f-walnut'||p.frame==='f-black'||p.frame==='f-oak')?Math.round(Math.max(4,Math.min(18,Math.max(cw,ch)*.08))):(p.frame==='f-baroque'?6:p.frame==='f-none'?0:4);
    const btn=document.createElement('button');btn.className='art';btn.style.left=cx+'px';btn.style.top=paintCY+'px';
    btn.setAttribute('aria-label',`${p.title} by ${p.artist.name}. Open details.`);btn.dataset.slot=slot;
    const fr=document.createElement('span');fr.className='frame '+p.frame;fr.style.padding=pad+'px';
    const mat=document.createElement('span');mat.className='mat';mat.style.padding=matPad+'px';
    const c=toCanvas(p);c.style.width=cw+'px';c.style.height=ch+'px';
    mat.appendChild(c);fr.appendChild(mat);
    const glow=document.createElement('span');glow.className='glow';btn.appendChild(glow);
    btn.appendChild(fr);
    btn.addEventListener('click',e=>{e.stopPropagation();if(!suppressClick)openDetail(p);});
    v.appendChild(btn);arts.push(btn);
    const fh=ch+2*(pad+matPad);
    const lbl=document.createElement('div');lbl.className='lbl';lbl.style.left=cx+'px';lbl.style.top=(paintCY+fh/2+12)+'px';
    lbl.innerHTML=`<i></i><span></span>${p.rarity!=='Common'?`<b class="rar">${p.rarity==='Common Here'?'common here':p.rarity}</b>`:''}`;
    lbl.querySelector('i').textContent=p.title;lbl.querySelector('span').textContent=`${p.artist.name}, ${p.year}`;
    v.appendChild(lbl);
    if(['Rare','Very Rare','Legendary'].includes(p.rarity)){
      const rw=Math.min(unitW*.85,Math.max(cw+2*pad+60,120)),rh=Math.min(floorH*.9+wallH*.12,90);
      const rope=document.createElement('div');rope.className='decor';rope.style.left=(cx-rw/2)+'px';rope.style.width=rw+'px';rope.style.height=rh+'px';rope.style.top=(wallH-rh*.62)+'px';
      rope.innerHTML=ropeSVG();v.appendChild(rope);
    }
  });
  // decor
  const fy=wallH; // floor line
  const sideFree=door?[]:['left','right'];
  if(!door&&decorR()<.38){
    const bw=Math.min(W*.42,340),bh=bw*.23;
    const b=document.createElement('div');b.className='decor';b.style.width=bw+'px';b.style.height=bh+'px';b.style.left=(W/2-bw/2)+'px';b.style.top=(fy+floorH*.45-bh*.5)+'px';b.style.zIndex=6;b.innerHTML=BENCH_SVG;v.appendChild(b);
  }
  const extras=[];
  if(decorR()<.16)extras.push('guard');
  if(decorR()<.15)extras.push('sign');
  if(decorR()<.08)extras.push('plant');
  if(decorR()<.05)extras.push('wet');
  if(x===0&&y===0&&d===0&&!extras.includes('guard'))extras.push('guard');
  let side=decorR()<.5?0:1;
  extras.slice(0,2).forEach(kind=>{
    const sx=side?W-Math.max(26,W*.045):Math.max(26,W*.045);side=1-side;
    const hgt=kind==='guard'?Math.min(H*.5,240):kind==='wet'?Math.min(H*.2,90):Math.min(H*.28,130);
    const wid=hgt*(kind==='guard'?60/150:kind==='wet'?60/90:60/120);
    const el=document.createElement(kind==='guard'?'button':'div');el.className='decor'+(kind==='guard'?' guard':'');
    el.style.width=wid+'px';el.style.height=hgt+'px';el.style.left=(sx-wid/2)+'px';el.style.top=(fy+floorH*.7-hgt)+'px';el.style.zIndex=7;
    if(kind==='guard'){const asleep=decorR()<.35;el.innerHTML=guardSVG(asleep);el.setAttribute('aria-label','Museum guard');
      el.addEventListener('click',e=>{e.stopPropagation();if(suppressClick)return;sayGuard(v,sx,fy+floorH*.7-hgt-8,asleep);});}
    else el.innerHTML=kind==='sign'?SIGN_SVG:kind==='plant'?PLANT_SVG:WET_SVG;
    v.appendChild(el);
  });
  if(x===0&&y===0&&d===0){
    const pl=document.createElement('div');pl.className='wallplaque';pl.style.left=(W/2)+'px';pl.style.top=(wallH*.08+18)+'px';
    pl.innerHTML='<b>Museum of Everything</b>Holdings: every possible painting up to 100 × 100 pixels (approx. 10<sup>72,248</sup>). Gift shop closed.';
    pl.style.top='auto';pl.style.bottom=(H-(wallH-wallH*.74)+8)+'px';v.querySelectorAll('.doorsign,.exit').forEach(e=>e.remove());v.appendChild(pl);
  }else if(!door&&wing.theme&&decorR()<.3){
    const pl=document.createElement('div');pl.className='wallplaque';pl.style.left=(W/2)+'px';pl.style.top=(18+wallH*.04)+'px';
    pl.innerHTML='<b></b>';pl.querySelector('b').textContent=wing.name;pl.append(wing.theme.blurb);
    v.appendChild(pl);
  }else if(!door&&decorR()<.12){
    const pl=document.createElement('div');pl.className='wallplaque';pl.style.left=(W/2)+'px';pl.style.top=(18+wallH*.04)+'px';
    pl.innerHTML=`<b>${pick(decorR,['A Note From the Curator','Gallery Notice','In Memoriam','Did You Know?'])}</b>${pick(decorR,['Every painting in this room is also in every other room, just not on this wall.','Paintings are hung in strict order of nobody choosing them.','This room was sponsored by the letter Q.','Mona Lisa sightings should be reported to the front desk.','The museum is infinite. Please pace yourself.','Light levels kept low to protect the noise.'])}`;
    v.appendChild(pl);
  }
  v._arts=arts;
  return v;
}
function fmtXY(x,y){return `${x}, ${y}`.replace(/-/g,'−');}
function sayGuard(v,x,y,asleep){
  v.querySelectorAll('.bubble').forEach(b=>b.remove());
  const b=document.createElement('div');b.className='bubble';
  b.textContent=asleep?pick(Math.random,['Zzz… do not… touch… zzz','*snores in a refined manner*','Mmh? Yes, very nice, very random. Zzz']):pick(Math.random,GUARD_QUIPS);
  b.style.left=Math.min(Math.max(x,120),stage.clientWidth-120)+'px';b.style.top=Math.max(8,y-60)+'px';v.appendChild(b);
  setTimeout(()=>b.remove(),3600);
}
function updateHud(){
  const room=roomOf(S.x,S.y);
  $('wingName').textContent=room.wing.name;
  $('roomLine').textContent=`Gallery ${fmtXY(S.x,S.y)}${innerWidth<720?' · '+DIRNAME[S.d]+' wall':''}${room.nick?' · '+room.nick:''}`;
  $('facing').textContent=`${DIRNAME[S.d]} wall${room.doors[S.d]?' · doorway':''}`;
  $('btnWalk').disabled=!room.doors[S.d];
  document.title='Museum of Everything';
  drawMap();
}
function render(anim){
  const nv=buildView(S.x,S.y,S.d);const old=current;current=nv;
  stage.insertBefore(nv,stage.firstChild);
  updateHud();markSeen();
  if(!old)return Promise.resolve();
  if(reduce||!anim){old.remove();return Promise.resolve();}
  busy=true;
  const W=stage.clientWidth;
  let k1,k2;
  if(anim==='left'||anim==='right'){const s=anim==='left'?1:-1;k1=[{transform:`translateX(${-s*W*.35}px)`,opacity:.0},{transform:'none',opacity:1}];k2=[{transform:'none',opacity:1},{transform:`translateX(${s*W*.35}px)`,opacity:0}];}
  else if(anim==='walk'){k1=[{transform:'scale(.82)',opacity:0},{transform:'none',opacity:1}];k2=[{transform:'none',opacity:1},{transform:'scale(1.5)',opacity:0}];}
  else{k1=[{opacity:0},{opacity:1}];k2=[{opacity:1},{opacity:0}];}
  stage.appendChild(old); // old on top while it leaves
  const a=nv.animate(k1,{duration:anim==='walk'?520:340,easing:'cubic-bezier(.2,.7,.2,1)'});
  const b=old.animate(k2,{duration:anim==='walk'?420:300,easing:'ease-in',fill:'forwards'});
  return Promise.all([a.finished,b.finished]).catch(()=>{}).then(()=>{old.remove();busy=false;});
}
function turn(dir){if(busy||modalOpen())return;S.d=mod(S.d+(dir==='left'?-1:1),4);render(dir);}
function walk(){if(busy||modalOpen())return;const room=roomOf(S.x,S.y);if(!room.doors[S.d]){toast('That is a wall. A very nice wall, but a wall.');return;}
  const prevWing=room.wing.name;S.x+=DX[S.d];S.y+=DY[S.d];render('walk');
  const nwg=roomOf(S.x,S.y).wing,nw=nwg.name;if(nw!==prevWing)toast(`You enter ${nw}.`+(nwg.theme?' '+nwg.theme.blurb:''));}
function teleport(x,y,d,msg){S.x=x;S.y=y;S.d=mod(d,4);const p=render('fade');if(msg)toast(msg);return p;}

/* ================= minimap ================= */
function drawMap(){
  const cv=$('minimap');const dpr=Math.min(2,window.devicePixelRatio||1);const sz=cv.clientWidth||132;
  if(cv.width!==Math.round(sz*dpr)){cv.width=Math.round(sz*dpr);cv.height=Math.round(sz*dpr);}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,sz,sz);
  const R=4,cell=sz/(2*R+1);
  for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){
    const x=S.x+i,y=S.y+j,px=(i+R)*cell,py=(j+R)*cell;
    const vis=S.visited.has(`${x},${y}`);
    if(!vis){g.fillStyle='rgba(233,201,121,.06)';g.fillRect(px+1,py+1,cell-2,cell-2);continue;}
    const room=roomOf(x,y);
    g.fillStyle=room.color;g.fillRect(px+1,py+1,cell-2,cell-2);
    g.strokeStyle='#e9c979';g.lineWidth=1.2;g.beginPath();
    const dr=room.doors,gap=cell*.32;
    // N
    if(dr[0]){g.moveTo(px+1,py+1);g.lineTo(px+cell/2-gap/2,py+1);g.moveTo(px+cell/2+gap/2,py+1);g.lineTo(px+cell-1,py+1);}else{g.moveTo(px+1,py+1);g.lineTo(px+cell-1,py+1);}
    if(dr[2]){g.moveTo(px+1,py+cell-1);g.lineTo(px+cell/2-gap/2,py+cell-1);g.moveTo(px+cell/2+gap/2,py+cell-1);g.lineTo(px+cell-1,py+cell-1);}else{g.moveTo(px+1,py+cell-1);g.lineTo(px+cell-1,py+cell-1);}
    if(dr[3]){g.moveTo(px+1,py+1);g.lineTo(px+1,py+cell/2-gap/2);g.moveTo(px+1,py+cell/2+gap/2);g.lineTo(px+1,py+cell-1);}else{g.moveTo(px+1,py+1);g.lineTo(px+1,py+cell-1);}
    if(dr[1]){g.moveTo(px+cell-1,py+1);g.lineTo(px+cell-1,py+cell/2-gap/2);g.moveTo(px+cell-1,py+cell/2+gap/2);g.lineTo(px+cell-1,py+cell-1);}else{g.moveTo(px+cell-1,py+1);g.lineTo(px+cell-1,py+cell-1);}
    g.stroke();
  }
  // you
  const cx=R*cell+cell/2,cy=R*cell+cell/2;g.save();g.translate(cx,cy);g.rotate(S.d*Math.PI/2);
  g.fillStyle='#fff3c4';g.strokeStyle='#1b1612';g.lineWidth=1.2;g.beginPath();g.moveTo(0,-cell*.36);g.lineTo(cell*.26,cell*.26);g.lineTo(0,cell*.12);g.lineTo(-cell*.26,cell*.26);g.closePath();g.fill();g.stroke();g.restore();
  g.fillStyle='#cdb78f';g.font='italic 10px Georgia,serif';g.textAlign='center';g.fillText('N',sz/2,9);
}

const modal=$('modal');let mP=null;
function modalOpen(){return modal.classList.contains('open')||$('galModal').classList.contains('open');}
function openDetail(p){
  mP=p;
  const wrap=$('bigWrap');wrap.innerHTML='';
  const phone=innerWidth<720;
  const maxW=phone?Math.min(innerWidth-80,360):Math.min(innerWidth*.42,480),maxH=phone?Math.min(innerHeight*.36,320):Math.min(innerHeight*.62,520);
  const sc=Math.min(maxW/p.w,maxH/p.h);const cw=Math.max(3,Math.round(p.w*sc)),ch=Math.max(3,Math.round(p.h*sc));
  const pad=p.frame==='f-none'?0:Math.round(Math.max(10,Math.min(30,Math.max(cw,ch)*.07)));
  const matPad=(p.frame==='f-walnut'||p.frame==='f-black'||p.frame==='f-oak')?Math.round(Math.max(8,Math.max(cw,ch)*.07)):(p.frame==='f-baroque'?8:p.frame==='f-none'?0:5);
  const fr=document.createElement('span');fr.className='frame '+p.frame;fr.style.padding=pad+'px';
  const mat=document.createElement('span');mat.className='mat';mat.style.padding=matPad+'px';
  const c=toCanvas(p);c.style.width=cw+'px';c.style.height=ch+'px';c.id='bigCanvas';mat.appendChild(c);fr.appendChild(mat);wrap.appendChild(fr);
  $('card').style.setProperty('--wallc',shade(roomOf(p.x,p.y).color,-.35));
  $('mCat').textContent=`Cat. № MoE ${p.cat}`;
  $('mRarity').innerHTML=`<span class="rarity ${RCLASS[p.rarity]}">${p.rarity}${p.type!=='noise'&&p.type!=='palette'?' · suspiciously meaningful':''}</span>`;
  $('mTitle').textContent=p.title;
  $('mArtist').innerHTML='';$('mArtist').append(p.artist.name+' ');const sm=document.createElement('small');sm.textContent=p.artist.years;$('mArtist').append(sm);
  $('mYear').textContent=p.year;$('mMedium').textContent=p.medium.charAt(0).toUpperCase()+p.medium.slice(1);
  $('mDims').textContent=`${p.w} × ${p.h} pixels (${(p.w*p.h).toLocaleString('en-US')} px)`;
  $('mValue').textContent=p.value;$('mDesc').textContent=p.desc;$('mOdds').innerHTML=oddsHTML(p.w,p.h);
  const n=slotsOf(p.x,p.y,p.d);$('mPrev').disabled=p.s<=1;$('mNext').disabled=p.s>=n;
  modal.classList.add('open');$('card').scrollTop=0;$('mClose').focus({preventScroll:true});
}
function closeDetail(){modal.classList.remove('open');const a=current&&current._arts&&mP?current._arts[mP.s-1]:null;if(a)a.focus({preventScroll:true});}
$('mClose').onclick=closeDetail;
modal.addEventListener('click',e=>{if(e.target===modal)closeDetail();});
$('mPrev').onclick=()=>{if(mP&&mP.s>1)openDetail(painting(mP.x,mP.y,mP.d,mP.s-1));};
$('mNext').onclick=()=>{if(mP&&mP.s<slotsOf(mP.x,mP.y,mP.d))openDetail(painting(mP.x,mP.y,mP.d,mP.s+1));};
$('mCopy').onclick=()=>{const t=`MoE ${mP.cat}`;try{navigator.clipboard.writeText(t).then(()=>flashBtn('Copied!'),()=>flashBtn(t));}catch(e){flashBtn(t);}};
function flashBtn(t){const b=$('mCopy');const o='Copy catalogue no.';b.textContent=t;setTimeout(()=>b.textContent=o,1600);}

/* ================= toast ================= */
let toastT=0;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hide'),2800);}

/* ================= search ================= */
function parseCat(str){
  const s=str.trim().replace(/[−–—]/g,'-');
  let m=s.match(/^(?:moe)?\s*[#№.:]*\s*(-?\d+)\s*[.,/\s]\s*(-?\d+)\s*(?:[.,/\s-]\s*)?([nesw])?\s*(\d+)?\s*$/i);
  if(m)return {x:+m[1],y:+m[2],d:m[3]?DIRS.indexOf(m[3].toUpperCase()):null,s:m[4]?+m[4]:null};
  return null;
}
function search(str){
  if(!str.trim()){toast('The catalogue requires a number. Or at least a word.');return;}
  const q=parseCat(str);
  if(!q){ // file anything under some room
    const r=rng('search|'+str.toLowerCase());const x=ri(r,-5000,5000),y=ri(r,-5000,5000),d=ri(r,0,3);
    teleport(x,y,d,`No such number. The archivist filed “${str.slice(0,40)}” in Gallery ${fmtXY(x,y)}.`);return;
  }
  if(Math.abs(q.x)>1e9||Math.abs(q.y)>1e9){toast('That gallery is past the fire exit. Try a smaller number.');return;}
  const d=q.d==null?S.d:q.d;
  teleport(q.x,q.y,d).then(()=>{
    if(q.s==null){toast(`Gallery ${fmtXY(q.x,q.y)}, ${DIRNAME[d]} wall.`);return;}
    const n=slotsOf(q.x,q.y,d);
    if(q.s<1||q.s>n){toast(`That wall only holds ${n} painting${n>1?'s':''}. No. ${q.s} was stolen in 1911.`);return;}
    const a=current._arts[q.s-1];if(a){a.classList.add('hl');setTimeout(()=>openDetail(painting(q.x,q.y,d,q.s)),reduce?50:700);}
  });
}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();search($('searchIn').value);$('searchIn').blur();});
$('btnRandom').onclick=()=>{const x=Math.floor(Math.random()*20001)-10000,y=Math.floor(Math.random()*20001)-10000;teleport(x,y,Math.floor(Math.random()*4),`Whisked away to ${roomOf(x,y).wing.name}.`);};
$('btnLeft').onclick=()=>turn('left');$('btnRight').onclick=()=>turn('right');$('btnWalk').onclick=()=>walk();


/* ================= gallery directory ================= */
function nearestTheme(k){
  const wx0=Math.floor(S.x/4),wy0=Math.floor(S.y/4);
  for(let R=0;R<=80;R++){let best=null;
    for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){if(Math.max(Math.abs(i),Math.abs(j))!==R)continue;
      const w=wingOf((wx0+i)*4,(wy0+j)*4);if(w.theme&&w.theme.k===k){const dd=i*i+j*j;if(!best||dd<best[2])best=[wx0+i,wy0+j,dd];}}
    if(best)return best;}
  return null;
}
const sampleCache=new Map();
function sampleCanvas(t){
  if(sampleCache.has(t.k))return sampleCache.get(t.k);
  const r=rng('sample|'+t.k),type=t.show||'noise';let w,h;
  if(t.size==='tiny'){w=5;h=4;}else if(type==='portrait'||type==='rothko'){w=34;h=44;}else if(type==='invader'){w=h=24;}else if(type==='heart'||type==='cat'){w=h=30;}else{w=56;h=40;}
  const px=makePx(w,h);GEN[type](r,w,h,px,{});
  if(t.gray)for(let i=0;i<px.length;i+=4){const l=px[i]*.3+px[i+1]*.59+px[i+2]*.11;px[i]=px[i+1]=px[i+2]=l;}
  const c=toCanvas({w,h,px});sampleCache.set(t.k,c);return c;
}
function openGalleries(){
  const g=$('galGrid');g.innerHTML='';
  $('galCount').textContent=`You have found ${S.themes.size} of ${THEMES.length}`;
  const here=roomOf(S.x,S.y).wing.theme;
  THEMES.forEach(t=>{
    const b=document.createElement('button');b.type='button';b.className='gcard'+(S.themes.has(t.k)?' found':'')+(here&&here.k===t.k?' here':'');
    const fr=document.createElement('span');fr.className='gthumb';fr.style.background=THEME_COLORS[t.color]||COLORS[t.color];
    const c=sampleCanvas(t).cloneNode();c.getContext('2d').drawImage(sampleCanvas(t),0,0);fr.appendChild(c);b.appendChild(fr);
    const tx=document.createElement('span');tx.className='gtx';
    tx.innerHTML='<b></b><i></i><small></small>';tx.querySelector('b').textContent=t.title;tx.querySelector('i').textContent=t.blurb;
    tx.querySelector('small').textContent=here&&here.k===t.k?'you are here':S.themes.has(t.k)?'✓ found · take me to the nearest':'not found yet · take me there';
    b.appendChild(tx);
    b.addEventListener('click',()=>{const n=nearestTheme(t.k);closeGalleries();
      if(!n){toast('That gallery is closed for cleaning. Try again later.');return;}
      teleport(n[0]*4+1,n[1]*4+1,0,`Whisked away to ${wingOf(n[0]*4,n[1]*4).name}.`);});
    g.appendChild(b);
  });
  $('galModal').classList.add('open');$('galClose').focus({preventScroll:true});
}
function closeGalleries(){$('galModal').classList.remove('open');}
$('btnGal').onclick=openGalleries;$('galClose').onclick=closeGalleries;
$('galModal').addEventListener('click',e=>{if(e.target===$('galModal'))closeGalleries();});

/* ================= input ================= */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if($('galModal').classList.contains('open')){if(e.key==='Escape')closeGalleries();return;}
  if(modalOpen()){if(e.key==='Escape')closeDetail();else if(e.key==='ArrowLeft')$('mPrev').click();else if(e.key==='ArrowRight')$('mNext').click();return;}
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();turn('left');}
  else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();turn('right');}
  else if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();walk();}
  else if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();turn('right');setTimeout(()=>turn('right'),reduce?0:360);}
  else if(k==='r'||k==='R'){$('btnRandom').click();}
  else if(k==='g'||k==='G'){openGalleries();}
});
let sx0=0,sy0=0,sdown=false,suppressClick=false;
stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;sdown=true;sx0=e.clientX;sy0=e.clientY;suppressClick=false;});
stage.addEventListener('pointermove',e=>{if(!sdown)return;if(Math.hypot(e.clientX-sx0,e.clientY-sy0)>12)suppressClick=true;});
stage.addEventListener('pointerup',e=>{if(!sdown)return;sdown=false;const dx=e.clientX-sx0,dy=e.clientY-sy0;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)turn(dx>0?'left':'right');
  else if(dy<-55&&Math.abs(dy)>Math.abs(dx)*1.2)walk();
  setTimeout(()=>{suppressClick=false;},0);});
stage.addEventListener('pointercancel',()=>{sdown=false;});
let rt=0;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(current){const nv=buildView(S.x,S.y,S.d);current.replaceWith(nv);current=nv;drawMap();}},120);});

/* ================= boot ================= */
load();render(null);
setTimeout(()=>$('toast').classList.add('hide'),4200);
if(innerWidth<720)$('toast').textContent='Swipe to turn · swipe up or tap a doorway to walk · tap a painting';
else $('toast').textContent='← → to turn · ↑ to walk through doorways · click a painting. Please do not touch.';
window.__moe={THEMES,wingOf,nearestTheme,openGalleries,state:S,painting,pixelHash,roomOf,slotsOf,teleport,turn,walk,openDetail,closeDetail,oddsHTML,parseCat};
})();
</script>
