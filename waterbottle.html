/* condensation droplets normal map (tileable) */
function makeDroplets(count, rmin, rmax, seed = 1) {
  const S = 1024;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(S, S), d = img.data;
  for (let i = 0; i < d.length; i += 4) { d[i] = 128; d[i + 1] = 128; d[i + 2] = 255; d[i + 3] = 255; }
  let s = seed * 9301 + 49297;
  const R = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const drop = (cx, cy, rx, ry) => {
    const x0 = Math.floor(cx - rx), x1 = Math.ceil(cx + rx), y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry, q = dx * dx + dy * dy;
      if (q > 1) continue;
      const z = Math.sqrt(1 - q) + 0.25;
      const l = Math.hypot(dx, dy, z);
      const px = ((x % S) + S) % S, py = ((y % S) + S) % S, k = (py * S + px) * 4;
      d[k] = (dx / l * 0.5 + 0.5) * 255; d[k + 1] = (-dy / l * 0.5 + 0.5) * 255; d[k + 2] = (z / l * 0.5 + 0.5) * 255;
    }
  };
  for (let i = 0; i < count; i++) {
    const r = rmin + Math.pow(R(), 3.2) * (rmax - rmin);
    drop(R() * S, R() * S, r, r * (0.92 + R() * 0.16));
  }
  for (let t = 0; t < 7; t++) { // running streaks
    let x = R() * S, y = R() * S * 0.4; const len = 150 + R() * 380;
    for (let k = 0; k < len; k += 3) { x += (R() - 0.5) * 1.6; drop(x, y + k, 3.2 + R() * 1.2, 4); }

  t.wrapS = t.wrapT = THREE.RepeatWrapping;

}

  SP.length = 0; BU.length = 0; DR.length = 0; GB.length = 0; BD.length = 0;
  P.mode = null; B.held = false; B.tilt = 0; B.vt = 0; B.lift = 16; B.vl = 0; B.first = true; FL.first = true; FL.drips = 0;
  S.so.set(0, 0); S.sv.set(0, 0);
  GLASS.vol = 0;
  PD_.fill(0); PWET.fill(0); PWH.fill(0); PWV.fill(0); PUD.dirty = true; PUD.active = false;
  initAudio(); SND.grab();
}
$('bReset').onclick = resetBottle;
const autoQ = { t: 0, n: 0, done: false };
function autoQuality(dt) {
  if (autoQ.done || document.hidden) return;
  if (dt > 0.25) return;
  autoQ.w = (autoQ.w || 0) + dt; if (autoQ.w < 2) return;
  autoQ.t += dt; autoQ.n++;
  if (autoQ.t > 5) { autoQ.done = true; if (autoQ.t / autoQ.n > 0.05 && HQ) { HQ = false; applyQuality(); } }
}
let mlT = 0;
function uiUpdate(dt) {
  mlT -= dt; if (mlT > 0) return; mlT = 0.2;
  let s = Math.round(Math.max(0, S.vol)) + ' mL';
  if (GLASS.vol > 1) s += ' · glass ' + Math.round(GLASS.vol) + ' mL';
  $('ml').textContent = s;
}

/*@@FEATURES@@*/

/* ---------------- main loop ---------------- */
const STEP = 1 / 120;
let acc = 0, lastT = performance.now();
function simStep(dt) {
  S.t += dt;
  inputStep();
  bottleStep(dt);
  capStep(dt);
  sealWatch();
  crushStep(dt);
  pourStep(dt);
  glassStep(dt);
  beadStep(dt);
  PUD.acc += dt;
  if (PUD.acc >= 1 / 60) { PUD.acc -= 1 / 60; if (PUD.any !== false || PUD.active) pudStep(1 / 60); }
}
function visualUpdate(dt) {
  cam.yaw += (cam.tyaw - cam.yaw) * Math.min(1, dt * 10);
  cam.pitch += (cam.tpitch - cam.pitch) * Math.min(1, dt * 10);
  placeCamera();
  updateWater();
  updateGlassWater();
  updateCaustic();
  updateStreamMesh();
  pudUpload();
  sndUpdate(dt);
  uiUpdate(dt);
}
function advance(sec) {
  acc += sec; let n = 0;
  while (acc >= STEP && n < 14) { simStep(STEP); acc -= STEP; n++; }
  if (n >= 14) acc = 0;
  visualUpdate(sec);
}
function frame(now) {
  requestAnimationFrame(frame);
  const raw = Math.max(0, (now - lastT) / 1000), dt = Math.min(0.1, raw); lastT = now;
  autoQuality(raw);
  advance(dt);
  renderer.render(scene, camera);
}
closeBottle();
poseBottle();
applyQuality();
advance(0.016);
renderer.render(scene, camera);
$('load').classList.add('gone');
requestAnimationFrame(frame);

/* debug / testing hooks */
window.WB = {
  THREE, scene, camera, renderer, bottle, cap, S, G, B, CAPS, CR, FL, GLASS, PUD, P, SP, DR, BU, cam, camTarget,
  advance, render: () => renderer.render(scene, camera),
  run(sec) { const n = Math.round(sec / 0.02); for (let i = 0; i < n; i++) advance(0.02); renderer.render(scene, camera); },
  hold(tilt, lift) { B.held = true; B.tt = tilt; B.tl = lift; }, release() { B.held = false; },
  popCap() { CAPS.A = CAPS.AOFF - 0.01; twistCap(0.05); if (CAPS.state === 'held') { CAPS.state = 'fall'; CAPS.vel.set(-40, 80, 30); } },
  squeeze(x, y, z) { P.mode = 'squeeze'; crushStart(new V3(x, y, z)); }, unsqueeze() { P.mode = null; crushEnd(); },
  reset: resetBottle,
};
</script>
