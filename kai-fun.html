<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kai.fun</title>
<style>
  :root{
    --ink:#141414;
    --paper:#ffffff;
    --muted:#8a8a8a;
    --line:#e2e2e2;
    --coral:#ff6b5e;
    --sky:#4aa9d8;
    --moss:#6fb85c;
    --grape:#9b7fd4;
    --sun:#f5b829;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Trebuchet MS",system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:48px 20px 40px;
  }
  .wrap{width:100%;max-width:880px;margin:0 auto;flex:1;}

  /* ===== HEADER WORDMARK ===== */
  header{text-align:center;margin:20px 0 56px;}
  .wordmark{
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
    font-weight:900;
    font-size:clamp(52px,12vw,116px);
    line-height:.85;
    letter-spacing:1px;
    display:inline-flex;
    align-items:center;
    gap:.06em;
    transform:rotate(-1.5deg);
  }
  .subtitle{
    margin-top:18px;
    font-size:clamp(16px,2.4vw,20px);
    color:var(--muted);
  }

  /* ===== FOOTER ===== */
  /* single game tile */
  .games{
    display:flex;justify-content:center;
    margin-bottom:56px;
  }
  .game-tile{
    position:relative;
    display:flex;flex-direction:column;justify-content:flex-end;
    width:280px;min-height:150px;
    padding:18px;
    border:2px solid var(--moss);
    border-radius:14px;
    background:#fff;
    text-decoration:none;color:var(--ink);
    box-shadow:5px 5px 0 var(--moss);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .game-tile:hover,.game-tile:focus-visible{
    transform:translate(-2px,-2px);
    box-shadow:7px 7px 0 var(--moss);
    outline:none;
  }
  .game-tile .emoji{position:absolute;top:14px;left:16px;font-size:42px;}
  .game-tile h2{font-size:22px;line-height:1.05;}
  .game-tile p{font-size:13px;color:var(--muted);margin-top:4px;}

  footer{text-align:center;padding-top:8px;}
  .intro{
    font-size:clamp(18px,3vw,24px);
    margin-bottom:26px;
  }
  .links{
    display:flex;flex-wrap:wrap;gap:12px;
    justify-content:center;margin-bottom:28px;
  }
  .link-btn{
    display:inline-flex;align-items:center;gap:9px;
    padding:11px 20px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:#fff;
    text-decoration:none;color:var(--ink);
    font-size:17px;
    transition:border-color .12s ease, transform .12s ease;
  }
  .link-btn:hover,.link-btn:focus-visible{
    border-color:var(--ink);
    transform:translateY(-2px);
    outline:none;
  }
  .link-btn .ic{font-size:20px;}
  .contact{font-size:19px;margin-bottom:8px;}
  .contact a{color:var(--ink);text-decoration:none;font-weight:600;}
  .contact a:hover{text-decoration:underline;}
  .fine{font-size:14px;color:var(--muted);margin-top:14px;}
  .fine a{color:var(--muted);}

  @media (prefers-reduced-motion:reduce){
    .link-btn{transition:none;}
    .link-btn:hover{transform:none;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="wordmark">Kai.fun</div>
      <p class="subtitle">games and stuff by Kai</p>
    </header>

    <main class="games">
      <a class="game-tile" href="internet-art-gallery.html">
        <span class="emoji">🖼️</span>
        <h2>Internet Art Gallery</h2>
        <p>wander endless museums of images pulled from Wikipedia</p>
      </a>
    </main>

    <footer>
      <p class="intro">Hey, I'm Kai. This is where I put the things I make. Say hi:</p>
      <div class="links">
        <a class="link-btn" href="#"><span class="ic">✉️</span> Newsletter</a>
        <a class="link-btn" href="#"><span class="ic">🐦</span> Twitter</a>
        <a class="link-btn" href="#"><span class="ic">☕</span> Buy me a coffee</a>
        <a class="link-btn" href="#"><span class="ic">📸</span> Instagram</a>
      </div>
      <p class="contact">Contact - <a href="mailto:checkmatedbusiness@gmail.com">checkmatedbusiness@gmail.com</a></p>
      <p class="fine"><a href="#">Privacy policy</a></p>
    </footer>
  </div>
</body>
</html>
