<style>
  :root{
    --ink:#141414;
    --paper:#ffffff;
    --muted:#8a8a8a;
    --line:#e2e2e2;
    --coral:#ff6b5e;
    --sky:#4aa9d8;
    --moss:#6fb85c;
    --grape:#9b7fd4;
    --sun:#f5b829;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Trebuchet MS",system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:48px 20px 40px;
  }
  .wrap{width:100%;max-width:1320px;margin:0 auto;flex:1;}

  /* ===== HEADER WORDMARK ===== */
  header{text-align:center;margin:20px 0 56px;}
  .wordmark{
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
    font-weight:900;
    font-size:clamp(52px,12vw,116px);
    line-height:.85;
    letter-spacing:1px;
    display:inline-flex;
    align-items:center;
    gap:.06em;
    transform:rotate(-1.5deg);
  }
  .wordmark .face{
    width:.62em;height:.68em;flex:0 0 auto;align-self:flex-end;margin-bottom:.02em;overflow:visible;
    filter:drop-shadow(3px 3px 0 var(--ink));
  }
  .game-tile img{border-radius:12px;}
  .wordmark .face{cursor:pointer;transition:transform .15s;}
  .wordmark .face.pop{animation:moodpop .5s cubic-bezier(.3,1.6,.5,1);}
  @keyframes moodpop{0%{transform:scale(1) rotate(0);}40%{transform:scale(1.35) rotate(-12deg);}100%{transform:scale(1) rotate(0);}}
  #quote .mood{display:inline-block;margin-top:6px;font-size:12px;font-weight:900;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;}
  .wordmark .face:hover{transform:scale(1.06);}
  header{position:relative;}
  #quote{
    display:none;position:relative;margin:14px auto 0;max-width:520px;
    background:#fff;border:2px solid var(--ink);border-radius:14px;
    box-shadow:4px 4px 0 var(--ink);padding:12px 18px;
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;font-size:16px;line-height:1.5;
  }
  #quote::before{
    content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);
    border:10px solid transparent;border-bottom-color:var(--ink);border-top:0;
  }
  #quote::after{
    content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    border:9px solid transparent;border-bottom-color:#fff;border-top:0;
  }
  #quote small{display:block;color:var(--muted);font-size:11px;margin-top:6px;font-family:"Trebuchet MS",sans-serif;}  .subtitle{
    margin-top:18px;
    font-size:clamp(16px,2.4vw,20px);
    color:var(--muted);
  }

  /* ===== FOOTER ===== */
  /* single game tile */
  .games{
    display:grid;
    grid-template-columns:repeat(3, 410px);
    gap:20px;justify-content:center;
    margin-bottom:56px;
  }
  @media (max-width:1340px){
    .games{grid-template-columns:repeat(auto-fit, minmax(280px, 410px));}
  }
  .game-tile{
    position:relative;
    display:flex;flex-direction:column;justify-content:flex-end;
    width:100%;max-width:410px;min-height:210px;
    padding:18px;
    border:2px solid var(--moss);
    border-radius:14px;
    background:#fff;
    text-decoration:none;color:var(--ink);
    box-shadow:5px 5px 0 var(--moss);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .game-tile:hover,.game-tile:focus-visible{
    transform:translate(-2px,-2px);
    box-shadow:7px 7px 0 var(--moss);
    outline:none;
  }
  .game-tile .emoji{position:absolute;top:14px;left:16px;font-size:42px;}
  .game-tile.tile-img{padding:0;overflow:hidden;}
  .game-tile.tile-img img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block;
  }
  .game-tile h2{font-size:22px;line-height:1.05;}
  .game-tile p{font-size:13px;color:var(--muted);margin-top:4px;}

  footer{text-align:center;padding-top:8px;}
  .intro{
    font-size:clamp(18px,3vw,24px);
    margin-bottom:26px;
  }
  .links{
    display:flex;flex-wrap:wrap;gap:12px;
    justify-content:center;margin-bottom:28px;
  }
  .link-btn{
    display:inline-flex;align-items:center;gap:11px;
    padding:15px 28px;
    border:2px solid var(--line);
    border-radius:14px;
    background:#fff;
    text-decoration:none;color:var(--ink);
    font-size:20px;
    transition:border-color .12s ease, transform .12s ease;
  }
  .link-btn:hover,.link-btn:focus-visible{
    border-color:var(--ink);
    transform:translateY(-2px);
    outline:none;
  }
  .link-btn .ic{font-size:25px;}
  .contact{font-size:19px;margin-bottom:8px;}
  .contact a{color:var(--ink);text-decoration:none;font-weight:600;}
  .contact a:hover{text-decoration:underline;}
  .fine{font-size:14px;color:var(--muted);margin-top:14px;}
  .fine a{color:var(--muted);}

  @media (max-width:860px){html,body{overflow-x:hidden;}}
  @media (prefers-reduced-motion:reduce){
    .link-btn{transition:none;}
    .link-btn:hover{transform:none;}
  }
</style>
<style>
  /* the sandwich at the very bottom */
  .sandwich-link{display:flex;flex-direction:column;align-items:center;width:max-content;max-width:100%;margin:30px auto 0;text-decoration:none;color:var(--ink)}
  .sandwich-link .stage{position:relative;width:340px;max-width:86vw;aspect-ratio:17/11}
  .sandwich-link canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .sandwich-link .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:84px;transition:opacity .4s}
  .sandwich-link.ready .ph{opacity:0}
  .sandwich-link .cap{font-family:"Comic Sans MS","Trebuchet MS",sans-serif;font-weight:900;font-size:19px;margin-top:2px;transform:rotate(-1.5deg)}
  .sandwich-link .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .sandwich-link:hover .cap,.sandwich-link:focus-visible .cap{text-decoration:underline}
</style>

(function(){
  // eye tracking for every face on the page
  let rigs=[];
  function rebuild(){
    const faces=[...document.querySelectorAll("svg")].filter(sv=>sv.querySelector(".pupil"));
    rigs=faces.map(sv=>{
      const eyes=[...sv.querySelectorAll(".eyeW")], pupils=[...sv.querySelectorAll(".pupil")];
      return pupils.map((p,i)=>({eye:eyes[i], p, cx:+p.getAttribute("cx"), cy:+p.getAttribute("cy"),
        max: +eyes[i].getAttribute("r")*0.45}));
    }).flat();
  }
  rebuild();
  addEventListener("moodchange",rebuild);
  let mx=null,my=null,lastMove=0;
  function look(){
    rigs.forEach(r=>{
      const b=r.eye.getBoundingClientRect();
      const ex=b.left+b.width/2, ey=b.top+b.height/2;
      let dx=0,dy=0;
      if(mx!==null){
        const ax=mx-ex, ay=my-ey, d=Math.hypot(ax,ay)||1;
        const k=Math.min(1,d/90);
        dx=ax/d*k; dy=ay/d*k;
      }
      r.p.setAttribute("cx",r.cx+dx*r.max);
      r.p.setAttribute("cy",r.cy+dy*r.max);
    });
  }
  addEventListener("mousemove",(e)=>{ mx=e.clientX; my=e.clientY; lastMove=Date.now(); look(); });
  addEventListener("scroll",()=>{ if(mx!==null) look(); });
  // no mouse (touch devices)? glance around idly
  setInterval(()=>{
    if(Date.now()-lastMove<3000) return;
    mx=Math.random()*innerWidth; my=Math.random()*innerHeight; look();
  },2200);
})();
</script>

    if(rollable.every(x=>st.seen[x.id])) award("completionist");
    if(["doorkeeper","overclocked","binge"].every(id=>st.seen[id])) award("trinity");
    if((st.clicks||0)>=100) award("century");
    if((st.clicks||0)>=1000) award("sisyphus");
  }
  // date-based
  const now=new Date();
  if(now.getMonth()===9 && now.getDate()===31) award("pumpkin");
  if(now.getMonth()===11 && now.getDate()===25) award("festive");
  if(now.getDay()===5 && now.getDate()===13) award("unlucky");
  checkMeta();
  // keyboard: konami, reverse konami, typed words
  const KONAMI=["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
  const REVERSE=[...KONAMI].reverse();
  let kbuf=[], tbuf="";
  addEventListener("keydown",(e)=>{
    kbuf.push(e.key); if(kbuf.length>10) kbuf.shift();
    if(kbuf.join(",")===KONAMI.join(",")){ kbuf=[]; if(S.getState().seen.robot){ q.innerHTML=""; q.style.display="block"; setMood(S.byId.robot,false);} else award("robot"); }
    if(kbuf.join(",")===REVERSE.join(",")){ kbuf=[]; award("antirobot"); }
    if(e.key.length===1 && !(window.KaiPuzzle&&window.KaiPuzzle.isOpen())){
      tbuf=(tbuf+e.key.toLowerCase()).slice(-12);
      if(tbuf.endsWith("kaikai")){
        tbuf="";
        if(kaiReady()){ kaiArmed=true; q.innerHTML=""; q.style.display="block"; const t=document.createElement("span"); t.textContent="you found the door. now click me exactly when a new minute is born."; q.appendChild(t); }
        return;
      }
      const words={pizza:"pizza",kai:"creator",joe:"joe",rocky:"rocky",uwu:"uwu",yalp:"mirror",dark:"shadow"};
      for(const w in words){ if(tbuf.endsWith(w)){ award(words[w]); tbuf=tbuf.slice(0,-w.length); } }
    }
  });
  // speedrun: 10 clicks within 3 seconds
  const clickTimes=[];
  face.addEventListener("click",()=>{
    const t=Date.now(); clickTimes.push(t);
    while(clickTimes.length && t-clickTimes[0]>3000) clickTimes.shift();
    if(clickTimes.length>=10) award("speedrun");
    checkMeta();
  });
  // right-click him
  face.addEventListener("contextmenu",(e)=>{ e.preventDefault(); award("contextual"); });
  // patience: stay on the page for 20 minutes
  let kaiArmed=false;
  setTimeout(()=>award("patience"), 20*60*1000);
  function kaiReady(){ const st=S.getState(); return ["smilend","trinity","antirobot","patience"].every(id=>st.seen[id]); }
  face.addEventListener("click",()=>{
    if(kaiArmed){
      if(new Date().getSeconds()===0){ kaiArmed=false; award("kai"); }
      else { q.innerHTML=""; q.style.display="block"; const t=document.createElement("span"); t.textContent="not that moment."; q.appendChild(t); }
    }
  });
  // ---- reloads break things ----
  const loads=(+localStorage.getItem("kaifun_loads")||0)+1;
  localStorage.setItem("kaifun_loads",loads);
  if(loads%10===0){
    if(S.getState().seen.error){ setMood(S.byId.error,true); q.innerHTML=""; q.style.display="block"; const t=document.createElement("span"); t.textContent="ERR: the page can only take so much."; q.appendChild(t); }
    else award("error");
  }
  // ---- more triggers ----
  if(now.getHours()===5) award("earlybird");
  if(location.hash && location.hash.length>1) award("urlist");
  let wheelN=0; face.addEventListener("wheel",(e)=>{ e.preventDefault(); if(++wheelN>=30) award("dizzier"); },{passive:false});
  const keyTimes=[];
  addEventListener("keydown",(e)=>{
    const t=Date.now(); keyTimes.push(t); while(keyTimes.length&&t-keyTimes[0]>2000) keyTimes.shift();
    if(keyTimes.length>=30) award("smasher");
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="a") award("selective");
  });
  addEventListener("beforeprint",()=>award("printable"));
  q.addEventListener("copy",()=>award("copycat"));
  document.addEventListener("fullscreenchange",()=>{ if(document.fullscreenElement) award("immersive"); });
  let flips=0; addEventListener("orientationchange",()=>{ if(++flips>=3) award("flipped"); });
  let bottoms=0, atBottom=false;
  addEventListener("scroll",()=>{
    const b=innerHeight+scrollY>=document.body.offsetHeight-4;
    if(b&&!atBottom){ atBottom=true; if(++bottoms>=5) award("bottomfeeder"); }
    if(!b) atBottom=false;
  });
  // shake the phone
  let lastShake=0;
  addEventListener("devicemotion",(e)=>{
    const a=e.accelerationIncludingGravity; if(!a) return;
    const mag=Math.hypot(a.x||0,a.y||0,a.z||0);
    if(mag>28 && Date.now()-lastShake>1500){ lastShake=Date.now(); award("shaken"); }
  });
  // squish the window
  const squish=()=>{ if(innerWidth<400) award("squished"); };
  addEventListener("resize",squish); squish();
  // leave for 5 minutes, come back
  let hiddenAt=0;
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden) hiddenAt=Date.now();
    else if(hiddenAt && Date.now()-hiddenAt>5*60*1000) award("missedyou");
  });
  // read the privacy policy
  const pp=[...document.querySelectorAll("footer a")].find(a=>/privacy/i.test(a.textContent));
  if(pp) pp.addEventListener("click",(e)=>{ e.preventDefault(); award("lawyer"); });
  // hover 10 different games without clicking
  const hovered=new Set();
  document.querySelectorAll(".game-tile").forEach(t=>t.addEventListener("mouseenter",()=>{
    hovered.add(t.getAttribute("href")); if(hovered.size>=10) award("windowshopper");
  }));
})();

</script>

<script type="module">
// a real 3D sandwich, built from code, spinning at the bottom of the page (only loads when you scroll down to it)
const link = document.getElementById('sandwichLink'), cv = document.getElementById('sandwichMini');
let started = false;
const near = new IntersectionObserver(es => { if (!started && es.some(e => e.isIntersecting)) { started = true; near.disconnect(); start(); } }, { rootMargin: '400px' });
near.observe(link);
async function start() {
  try {
    const THREE = await import('three');
    const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
    const { buildSandwich } = await import('./sandwich-model.js?v=2');
    const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
    const size = () => { r.setSize(cv.clientWidth, cv.clientHeight, false); cam.aspect = cv.clientWidth / cv.clientHeight; cam.updateProjectionMatrix(); };
    r.setPixelRatio(Math.min(2, devicePixelRatio || 1));
    r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.95;
    r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(r), 0.04).texture;
    const cam = new THREE.PerspectiveCamera(30, 1, 0.5, 200); cam.position.set(0, 12.5, 26); cam.lookAt(0, 1.8, 0);
    const key = new THREE.DirectionalLight(0xfff3e4, 3.0); key.position.set(8, 19, 9); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
    Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 2, far: 50 }); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
    scene.add(key, new THREE.HemisphereLight(0xffffff, 0xe2dccf, 0.28));
    const S = buildSandwich(THREE, { quality: 'low' }); scene.add(S.root);
    size(); addEventListener('resize', size);
    let visible = true, hover = false, spin = 0.6, lift = 0, last = performance.now();
    link.addEventListener('mouseenter', () => hover = true); link.addEventListener('mouseleave', () => hover = false);
    link.addEventListener('focus', () => hover = true); link.addEventListener('blur', () => hover = false);
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function loop(t) {
      if (!visible) return;
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (!still) spin += dt * (hover ? 1.4 : 0.35);
      lift += ((hover ? 0.8 : 0) - lift) * Math.min(1, dt * 8);
      S.root.rotation.y = spin; S.root.position.y = lift;
      r.render(scene, cam); requestAnimationFrame(loop);
    }
    new IntersectionObserver(es => { const v = es[0].isIntersecting; if (v && !visible) { visible = true; last = performance.now(); requestAnimationFrame(loop); } visible = v; }).observe(cv);
    requestAnimationFrame(loop);
    link.classList.add('ready');
  } catch (e) { console.warn('sandwich could not be made here', e); }
}
</script>
