<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hi, this page is dedicated to infinity, so ... · Kai.fun</title>
<meta name="description" content="Hi, this page is dedicated to infinity, so it never ends. The text keeps going, smaller and smaller, forever.">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,800;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a1a;--ink:#f4efe2;--dim:#a49fc4;--gold:#ffd36b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Space Mono",ui-monospace,monospace;overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
a.back{position:fixed;top:12px;left:12px;z-index:5;color:var(--ink);text-decoration:none;font:700 13px "Space Mono",monospace;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);padding:7px 11px;border-radius:999px;backdrop-filter:blur(6px)}
a.back:hover{background:rgba(255,255,255,.16)}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(11,10,26,.92) 40%);font-size:12px;color:var(--dim)}
#hud b{color:var(--ink)}
#bar{position:relative;width:min(260px,60vw);height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#barIn{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7b6bff,#ff7ad9,var(--gold));border-radius:99px}
#hud button{font:700 12px "Space Mono",monospace;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 11px;cursor:pointer}
#hud button:hover{background:rgba(255,255,255,.16)}
#hud button.on{background:var(--gold);color:#1b1630;border-color:var(--gold)}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-30px);opacity:0;z-index:6;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(8px);padding:8px 14px;border-radius:12px;font:700 13px "Space Mono",monospace;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:fixed;right:14px;top:14px;z-index:5;font-size:11px;color:var(--dim);text-align:right;transition:opacity 1s}
@media (max-width:560px){#hint{display:none}#hud{font-size:11px}}
</style>
</head><body>
<canvas id="c"></canvas>
<a class="back" href="index.html">← Kai.fun</a>
<div id="hint">scroll down ↓ forever<br>(it never ends)</div>
<div id="toast"></div>
<div id="hud">
  <span>line <b id="hLine">0</b> of <b>∞</b></span>
  <span>lines left: <b>∞</b></span>
  <span style="display:flex;align-items:center;gap:6px"><span id="bar"><span id="barIn"></span></span><b id="hPct">0%</b></span>
  <button id="bAuto">∞ autoscroll</button>
  <button id="bEnd">skip to the end</button>
  <button id="bTop">↑ top</button>
</div>
<script>
'use strict';
// ── the infinite page ──
// Line j is r^j as tall as line 0, so infinitely many lines fit above a finite point
// (Zeno would be proud). Scrolling moves the camera "depth" d forward; line d sits at
// the anchor and everything is drawn relative to it, so it works at any depth.
let R = 0.88;                         // each line is ~88% the size of the one above (set in fit() so the text fills the screen)
const cv = document.getElementById('c'), x = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, H0 = 60, ANCHOR = 120;
function fit() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  H0 = Math.max(34, Math.min(92, Math.min(W * 0.085, H * 0.11)));
  ANCHOR = Math.max(64, H * 0.14);
  R = Math.min(0.95, Math.max(0.84, 1 - H0 / ((H - ANCHOR) * 0.85)));
}
addEventListener('resize', fit); fit();

// ── what each line says (the same line always says the same thing) ──
const OPEN = [
  'Hi, this page is dedicated to infinity, so ...',
  'it never ends, so ...',
  'the text just keeps going, so ...',
  'and it keeps getting smaller, so ...',
  'and smaller, so ...',
  'and smaller, so ...',
  'and smaller, but it never stops, so ...',
  'you can scroll forever, so ...',
  'everything on this page is infinite, so ...',
  'even the progress bar never finishes, so ...',
  'and there is no bottom, so ...',
];
const T = [
  'and it keeps going, so ...',
  'and going, so ...',
  'still going, so ...',
  'this is line {i} of ∞, so ...',
  'you have read {i} lines and there are still ∞ left, so ...',
  'there are exactly as many even numbers as numbers, so ...',
  'Hilbert\'s Hotel is full, but room {i} just opened up, so ...',
  '0.999… is exactly 1, so ...',
  '∞ + 1 = ∞, so ...',
  '∞ − {i} = ∞, so ...',
  '∞ × 2 = ∞, which is a bit of a rip-off, so ...',
  'a monkey somewhere just typed this line by accident, so ...',
  'the next line is smaller than this one, so ...',
  'the line after that is even smaller, so ...',
  'if you can read this, you are pretty deep, so ...',
  'π goes 3.14159265358979… forever, so ...',
  'ℵ₀ says hi, so ...',
  'the end is coming soon (it is not), so ...',
  'you can stop scrolling whenever you like (you can\'t), so ...',
  'between any two numbers there are infinitely many more, so ...',
  'there are more real numbers than whole numbers, somehow, so ...',
  'a line this small could fit on an atom eventually, so ...',
  'the bottom of this page is in another castle, so ...',
  'this sentence is longer than the one above it but in smaller writing, which evens it out, so ...',
  'somebody, somewhere, is also on line {i}, so ...',
  'a turtle is still racing Achilles down here, so ...',
  '1 + 1/2 + 1/4 + 1/8 + … = 2, and this page is built like that, so ...',
  'every line is {r}% of the size of the one above it, so ...',
  'counting: {i}, {i1}, {i2}, … , so ...',
  'the scroll bar gave up a long time ago, so ...',
  'this page has more words than every book ever written, so ...',
  'and still more than that, so ...',
  'no, really, it does not end, so ...',
  'it is ∞ o\'clock, so ...',
  'the universe might be infinite too, so ...',
  'your mouse wheel is doing great, so ...',
  'turtles all the way down, so ...',
  'infinity has no favourite number, but it has all of them, so ...',
  'mirror facing a mirror facing a mirror facing a mirror, so ...',
  'this page was dedicated to infinity and it meant it, so ...',
];
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = Math.imul(n, 9); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return n >>> 0; }
const fmt = n => n.toLocaleString('en-US');
function lineText(i) {
  if (i < 0) return '';
  if (i < OPEN.length) return OPEN[i];
  if (i % 1000 === 0) return `🎉 line ${fmt(i)}! you are no closer to the end, so ...`;
  if (i % 100 === 0) return `line ${fmt(i)}. ∞ lines to go, so ...`;
  const t = T[hash(i) % T.length];
  return t.replace('{i}', fmt(i)).replace('{i1}', fmt(i + 1)).replace('{i2}', fmt(i + 2)).replace('{r}', Math.round(R * 100));
}

// ── camera ──
let d = 0, vel = 0, auto = false, target = null, maxD = 0;
const save = () => { try { localStorage.setItem('infinity_best', String(Math.floor(maxD))); } catch (e) {} };
try { maxD = +localStorage.getItem('infinity_best') || 0; } catch (e) {}
const SEEN_START = maxD;
// line j's height and top, in screen pixels, relative to the anchor line at depth d
const hOf = j => H0 * Math.pow(R, j - d);
const topOf = j => ANCHOR + H0 * (1 - Math.pow(R, j - d)) / (1 - R);

function draw(t) {
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
  // background: deep space that shifts colour as you go deeper
  const hue = (d * 2.3) % 360;
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${(hue + 250) % 360},40%,7%)`); g.addColorStop(1, `hsl(${(hue + 290) % 360},45%,11%)`);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // the vanishing point: where the infinite text is heading
  const vy = ANCHOR + H0 / (1 - R);
  const vg = x.createRadialGradient(W * 0.08, vy, 0, W * 0.08, vy, Math.max(W, H) * 0.6);
  vg.addColorStop(0, `hsla(${(hue + 40) % 360},90%,70%,.18)`); vg.addColorStop(1, 'hsla(0,0%,0%,0)');
  x.fillStyle = vg; x.fillRect(0, 0, W, H);
  // a big faint infinity sign, breathing
  x.save(); x.translate(W * 0.72, H * 0.45); x.rotate(Math.sin(t / 4000) * .05);
  const s = Math.min(W, H) * 0.24 * (1 + Math.sin(t / 2000) * .03);
  x.strokeStyle = 'rgba(255,255,255,.045)'; x.lineWidth = s * 0.16; x.beginPath();
  for (let k = 0; k <= 200; k++) { const a = k / 200 * Math.PI * 2, den = 1 + Math.sin(a) ** 2; const px = s * Math.cos(a) / den * 1.6, py = s * Math.sin(a) * Math.cos(a) / den * 1.6; k ? x.lineTo(px, py) : x.moveTo(px, py); }
  x.stroke(); x.restore();
  // the text
  const marginX = Math.max(18, W * 0.05), maxW = W - marginX * 1.5;
  x.textBaseline = 'alphabetic';
  // go up from the anchor until lines are above the screen
  let j0 = Math.floor(d);
  while (j0 > 0 && topOf(j0) > -hOf(j0) * 1.2) j0--;
  for (let j = j0; ; j++) {
    const h = hOf(j), top = topOf(j);
    if (h < 0.25 || top > H) break;
    if (top + h < -2 || j < 0) continue;
    const fs = h * 0.6, txt = lineText(j);
    x.font = `${j === 0 ? 800 : 500} ${fs}px Fraunces, Georgia, serif`;
    const lum = Math.max(0.35, Math.min(1, h / 8));
    x.fillStyle = j === 0 ? `rgba(255,211,107,${lum})` : `hsla(${(j * 7 + hue) % 360},60%,${88 - Math.min(25, j % 9 * 2)}%,${lum})`;
    // very long lines get squeezed to fit rather than run off the side
    const w = x.measureText(txt).width;
    if (w > maxW) { x.save(); x.translate(marginX, top + h * 0.78); x.scale(maxW / w, 1); x.fillText(txt, 0, 0); x.restore(); }
    else x.fillText(txt, marginX, top + h * 0.78);
  }
  // below what text can show: a trail of ever-tinier dots heading for the vanishing point
  for (let k = 0; k < 40; k++) {
    const yy = vy - H0 * Math.pow(R, 40 - k + (d % 1)) * 3;
    x.fillStyle = `rgba(255,255,255,${0.15 + k / 80})`;
    x.fillRect(Math.max(18, W * 0.05), yy, 1.2, 1.2);
  }
}

// ── HUD ──
const $ = id => document.getElementById(id);
function hud() {
  const n = Math.max(0, Math.floor(d));
  $('hLine').textContent = fmt(n);
  // the progress bar: always closer to 100%, never there
  const p = 1 - 1 / (1 + d / 20);
  $('barIn').style.width = (p * 100) + '%';
  let pct = (p * 100);
  $('hPct').textContent = pct < 99 ? pct.toFixed(1) + '%' : '99.' + '9'.repeat(Math.min(14, Math.floor(Math.log10(1 + d / 20)) - 1)) + '…%';
}
let toastT = 0;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }

// ── input ──
addEventListener('wheel', e => { e.preventDefault(); target = null; vel += (e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) / H0 * 0.08; }, { passive: false });
let touchY = null;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; target = null; }, { passive: true });
addEventListener('touchmove', e => { if (touchY == null) return; const y = e.touches[0].clientY; vel += (touchY - y) / H0 * 0.1; touchY = y; }, { passive: true });
addEventListener('touchend', () => { touchY = null; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === ' ') { vel += e.key === 'ArrowDown' ? .25 : 1.2; target = null; e.preventDefault(); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { vel -= e.key === 'ArrowUp' ? .25 : 1.2; target = null; e.preventDefault(); }
  if (e.key === 'Home') goTop();
  if (e.key === 'End') skipEnd();
});
$('bAuto').onclick = () => { auto = !auto; $('bAuto').classList.toggle('on', auto); toast(auto ? 'Autoscroll on. See you at the end (there is no end).' : 'Autoscroll off.'); };
let skips = 0;
const SKIPMSG = ['Skipping to the end…', 'Nope. Still not the end.', 'Further!', 'This is taking a while…', 'Are we there yet?', 'Infinity is really big, huh.', 'OK, a really big jump this time.', 'Still infinite lines left. Sorry.'];
function skipEnd() { const jump = Math.pow(10, 2 + Math.min(skips, 5)); target = d + jump; toast(SKIPMSG[Math.min(skips, SKIPMSG.length - 1)] + `  (+${fmt(jump)} lines)`); skips++; }
function goTop() { target = 0; toast('Back to the top. The only end this page has.'); }
$('bEnd').onclick = skipEnd; $('bTop').onclick = goTop;

// ── loop ──
let last = performance.now(), hinted = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (target != null) {
    const diff = target - d; d += diff * Math.min(1, dt * 3); if (Math.abs(diff) < 0.01) { d = target; target = null; if (skips && d > 50) toast(`Line ${fmt(Math.floor(d))}. Lines left: ∞`); }
  } else {
    if (auto) vel += dt * 0.9;
    d += vel; vel *= Math.pow(0.0015, dt);
    if (Math.abs(vel) < 1e-4) vel = 0;
  }
  if (d < 0) { d = 0; vel = Math.max(0, vel); }
  if (d > maxD) { maxD = d; if (Math.floor(maxD) % 25 === 0) save(); }
  if (!hinted && d > 3) { hinted = true; $('hint').style.opacity = 0; }
  const n = Math.floor(d);
  if (n && n % 1000 === 0 && n !== frame.lastM) { frame.lastM = n; toast(`🎉 ${fmt(n)} lines! Only ∞ to go.`); }
  draw(now); hud();
}
addEventListener('visibilitychange', () => { last = performance.now(); save(); });
addEventListener('pagehide', save);
if (SEEN_START > 20) setTimeout(() => toast(`Welcome back. Last time you got to line ${fmt(Math.floor(SEEN_START))}. It still doesn't end.`), 700);
// ?tile renders a still for the home-page tile
if (location.search.includes('tile')) { document.querySelectorAll('a.back,#hud,#hint').forEach(e => e.style.display = 'none'); }
requestAnimationFrame(frame);
// infinite tab title
const TITLES = ['Hi, this page is dedicated to infinity, so ...', 'so ...', 'and so ...', 'and so on ...', '∞'];
let ti = 0; setInterval(() => { if (!document.hidden) document.title = TITLES[ti++ % TITLES.length] + ' · Kai.fun'; }, 2500);
</script>
</body></html>
