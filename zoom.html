<style>

<script>
"use strict";
// ===== util.js =====
{
const HZ = window.HZ = {};
HZ.$ = (s, r) => (r || document).querySelector(s);
HZ.$$ = (s, r) => [...(r || document).querySelectorAll(s)];
HZ.q = new URLSearchParams(location.search);
HZ.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
HZ.esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
HZ.clamp = (x, a, b) => x < a ? a : x > b ? b : x;
HZ.lerp = (a, b, k) => a + (b - a) * k;
HZ.smooth = k => { k = HZ.clamp(k, 0, 1); return k * k * (3 - 2 * k); };
HZ.mobile = () => window.innerWidth < 760;
const PFX = 'zoom.';
let mem = {};
HZ.store = {
get(k, d) {
try { const v = localStorage.getItem(PFX + k); return v == null ? (k in mem ? mem[k] : d) : JSON.parse(v); }
catch (e) { return k in mem ? mem[k] : d; }
},
set(k, v) { mem[k] = v; try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) { } },
wipe() { mem = {}; try { Object.keys(localStorage).filter(k => k.startsWith(PFX)).forEach(k => localStorage.removeItem(k)); } catch (e) { } }
};
if (HZ.q.has('reset')) HZ.store.wipe();
const bus = {};
HZ.on = (n, f) => (bus[n] = bus[n] || []).push(f);
HZ.emit = (n, d) => (bus[n] || []).forEach(f => { try { f(d); } catch (e) { console.error(e); } });
HZ.rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
HZ.hash = (a, b, c) => { let h = (a * 374761393 + (b | 0) * 668265263 + (c | 0) * 2147483647) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
HZ.toast = (html, cls, key, ms) => {
const box = HZ.$('#toasts');
if (key) box.querySelectorAll('.toast[data-key="' + key + '"]').forEach(o => o.remove());
while (box.children.length >= 3) box.firstElementChild.remove();
const t = HZ.el('div', 'toast ' + (cls || ''), html); if (key) t.dataset.key = key; box.appendChild(t);
ms = ms || 3600; setTimeout(() => t.classList.add('out'), ms); setTimeout(() => t.remove(), ms + 600);
return t;
};
}
// ===== fmt.js =====
{
const LY = 9.4607e15, AU = 1.495979e11;
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const sup = n => String(n).split('').map(c => SUP[c] || c).join('');
const num = v => {
if (v >= 100) return Math.round(Number(v.toPrecision(2))).toLocaleString('en-US');
if (v >= 10) return String(Math.round(v));
const r = Math.round(v * 10) / 10; return r >= 10 ? '10' : String(r);
};
const WORDS = [[1e12, 'trillion'], [1e9, 'billion'], [1e6, 'million'], [1e3, 'thousand']];
const words = v => { for (const [k, w] of WORDS) if (v >= k && k >= 1e6) return num(v / k) + ' ' + w; return num(v); };
const sci = m => {
if (!(m > 0)) return '0 m';
let e = Math.floor(Math.log10(m)), c = m / Math.pow(10, e);
let cs = (Math.round(c * 10) / 10); if (cs >= 10) { cs = 1; e++; }
if (e === 0) return num(m) + ' m';
if (e >= -3 && e < 5) return Number(m.toPrecision(2)).toLocaleString('en-US', { maximumFractionDigits: 6 }) + ' m';
return (cs === 1 ? '' : cs + ' × ') + '10' + sup(e) + ' m';
};
const SMALL = [[1e-2, 100, 'cm', 'centimetres'], [1e-4, 1e3, 'mm', 'millimetres'], [1e-7, 1e6, 'µm', 'micrometres'], [1e-10, 1e9, 'nm', 'nanometres'],
[1e-13, 1e12, 'pm', 'picometres'], [1e-16, 1e15, 'fm', 'femtometres'], [1e-19, 1e18, 'am', 'attometres']];
HZ.fmt = {
LY, AU, sup, sci, num, words,
len(m) {
let big, unit;
if (m >= LY) { const v = m / LY; big = words(v) + (v < 1.05 ? ' light-year' : ' light-years'); unit = 'light-years'; }
else if (m >= 1e9) { big = words(m / 1000) + ' km'; unit = 'kilometres'; }
else if (m >= 1000) { big = num(m / 1000) + ' km'; unit = 'kilometres'; }
else if (m >= 1) { big = num(m) + ' m'; unit = 'metres'; }
else {
const s = SMALL.find(s => m >= s[0]);
if (s) { big = num(m * s[1]) + ' ' + s[2]; unit = s[3]; }
else { big = sci(m); unit = 'metres'; }
}
let ex = '= ' + sci(m);
if (m >= 1e10 && m < 3e17) ex += ' · ' + num(m / AU) + ' AU';
return { big, unit, sci: ex };
},
pow: e => '10' + sup(e),
ratio(r) { return r >= 1e15 ? '10' + sup(Math.round(Math.log10(r))) : words(r); }
};
}
// ===== font.js =====
{
const G = {
A: [14, 17, 17, 31, 17, 17, 17], B: [30, 17, 17, 30, 17, 17, 30], C: [14, 17, 16, 16, 16, 17, 14], D: [30, 17, 17, 17, 17, 17, 30],
E: [31, 16, 16, 30, 16, 16, 31], F: [31, 16, 16, 30, 16, 16, 16], G: [14, 17, 16, 23, 17, 17, 15], H: [17, 17, 17, 31, 17, 17, 17],
I: [14, 4, 4, 4, 4, 4, 14], J: [7, 2, 2, 2, 2, 18, 12], K: [17, 18, 20, 24, 20, 18, 17], L: [16, 16, 16, 16, 16, 16, 31],
M: [17, 27, 21, 21, 17, 17, 17], N: [17, 17, 25, 21, 19, 17, 17], O: [14, 17, 17, 17, 17, 17, 14], P: [30, 17, 17, 30, 16, 16, 16],
Q: [14, 17, 17, 17, 21, 18, 13], R: [30, 17, 17, 30, 20, 18, 17], S: [15, 16, 16, 14, 1, 1, 30], T: [31, 4, 4, 4, 4, 4, 4],
U: [17, 17, 17, 17, 17, 17, 14], V: [17, 17, 17, 17, 17, 10, 4], W: [17, 17, 17, 21, 21, 21, 10], X: [17, 17, 10, 4, 10, 17, 17],
Y: [17, 17, 10, 4, 4, 4, 4], Z: [31, 1, 2, 4, 8, 16, 31],
a: [0, 0, 14, 1, 15, 17, 15], b: [16, 16, 30, 17, 17, 17, 30], c: [0, 0, 14, 16, 16, 17, 14], d: [1, 1, 15, 17, 17, 17, 15], e: [0, 0, 14, 17, 31, 16, 14],
f: [6, 9, 8, 28, 8, 8, 8], g: [0, 15, 17, 17, 15, 1, 14], h: [16, 16, 22, 25, 17, 17, 17], i: [4, 0, 12, 4, 4, 4, 14], j: [2, 0, 6, 2, 2, 18, 12],
