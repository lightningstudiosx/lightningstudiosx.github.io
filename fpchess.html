<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.png" sizes="64x64"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>FPCHESS · Kai.fun</title>
<meta name="description" content="A first-person shooter where everybody is a chess piece. Start as a Pawn, take pieces to promote up the ladder to Knight, Bishop, Rook, Queen and King, then land a King kill to win. Teams, free-for-all, endless waves, an aim trainer and peer-to-peer online play.">
<meta name="theme-color" content="#0d0b09">
<script src="bdp.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* style1.css - "TOURNAMENT NOIR": ivory, ebony, brass and felt under a single spotlight. base, header, home screen */
:root{--bg:#0d0b09;--ebony:#16120f;--ebony2:#211b16;--ivory:#f1e7d0;--ivory2:#d9ccb0;--paper:#efe4c8;--ink:#2a211a;--brass:#c9a24a;--brass2:#e8c873;
--felt:#2f5d4a;--red:#d8453a;--blue:#8fd0ff;--dim:#a8997e;--dim2:#6f6452;--line:rgba(201,162,74,.28);
--disp:"Cinzel","Trajan Pro","Georgia",serif;--mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ivory);overflow:hidden}
body{font-family:var(--mono);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.hide{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
#vign{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
body.ingame #vign{background:radial-gradient(ellipse at 50% 50%,transparent 68%,rgba(0,0,0,.4) 100%)}
#top{position:fixed;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:40;pointer-events:none}
#top>*{pointer-events:auto}
#kai{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ivory);text-decoration:none;background:rgba(22,18,15,.82);border:1px solid var(--line);padding:8px 13px 8px 11px;border-radius:999px;line-height:1;backdrop-filter:blur(6px)}
#kai:hover{border-color:var(--brass);color:#fff}
body.ingame #kai{display:none}
#topR{display:flex;gap:8px}
.ib{border:1px solid var(--line);background:rgba(22,18,15,.82);height:36px;min-width:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.ib svg{width:19px;height:19px;fill:none;stroke:var(--ivory);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib .x{display:none}.ib.off .x{display:inline}.ib.off .wave{display:none}
body.ingame #top{top:auto;bottom:auto;height:0}body.ingame #snd{display:none}
.screen{position:fixed;inset:0;z-index:10}
/* ---------- home ---------- */
#home{display:flex;flex-direction:column;align-items:center;padding:58px 16px 18px;overflow-y:auto;overflow-x:hidden}
#logo{font-family:var(--disp);font-weight:900;font-size:clamp(46px,10.5vw,132px);letter-spacing:.06em;line-height:.95;display:flex;gap:.02em;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.7));margin-top:2vh;white-space:nowrap}
#logo span{position:relative;display:inline-block;padding:0 .04em}
#logo .lw{color:var(--ivory);background:linear-gradient(180deg,#fffaf0 0%,#efe3c6 48%,#bfa77c 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1px rgba(80,60,30,.35)}
#logo .lb{color:#1a1512;-webkit-text-fill-color:#1c1714;-webkit-text-stroke:2px var(--brass);text-shadow:0 0 18px rgba(201,162,74,.25)}
#logo .ch::after{content:"";position:absolute;left:50%;top:52%;width:.5em;height:.5em;transform:translate(-50%,-50%);border:3px solid var(--red);border-radius:50%;
  background:linear-gradient(var(--red),var(--red)) center/3px 100% no-repeat,linear-gradient(var(--red),var(--red)) center/100% 3px no-repeat;opacity:.9;
  -webkit-mask:radial-gradient(circle,transparent 0 22%,#000 23%);mask:radial-gradient(circle,transparent 0 22%,#000 23%);animation:aim 3.2s ease-in-out infinite}
@keyframes aim{0%,100%{transform:translate(-50%,-50%) rotate(0)}50%{transform:translate(-46%,-56%) rotate(45deg)}}
#tag{font-family:var(--disp);font-weight:500;color:var(--brass2);letter-spacing:.22em;font-size:clamp(10px,1.5vw,14px);text-transform:uppercase;margin:12px 0 2vh;text-align:center;text-shadow:0 2px 8px #000}
#homeMain{display:flex;gap:22px;align-items:flex-end;justify-content:space-between;width:100%;max-width:1320px;margin-top:auto;flex-wrap:wrap}
#sheet{flex:0 1 500px;max-width:520px;background:var(--paper);color:var(--ink);border-radius:4px;padding:14px 16px 10px 46px;position:relative;
  box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 40px rgba(120,90,40,.18);
  background-image:linear-gradient(90deg,transparent 34px,rgba(216,69,58,.45) 34px,rgba(216,69,58,.45) 36px,transparent 36px),repeating-linear-gradient(180deg,transparent 0 33px,rgba(42,33,26,.14) 33px 34px)}
#sheet::before{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;background:radial-gradient(ellipse at 80% 0%,rgba(255,255,255,.5),transparent 60%)}
#sheetHead{display:flex;justify-content:space-between;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.18em;color:#6b5636;border-bottom:2px solid #2a211a;padding-bottom:6px;margin-bottom:2px}
.mv{display:grid;grid-template-columns:28px 52px 1fr;align-items:baseline;width:100%;text-align:left;padding:7px 4px 6px;border-radius:3px;position:relative;column-gap:6px}
.mv .no{font-weight:700;color:#8a7350;margin-left:-38px;width:28px;text-align:right}
.mv .w{font-family:var(--disp);font-weight:700;font-size:17px;color:#3b2e22;font-style:italic}
.mv .mn{font-family:var(--disp);font-weight:900;font-size:21px;letter-spacing:.06em;color:#1c1612}
.mv .md{grid-column:3;font-size:11.5px;color:#6b5a44;margin-top:1px}
.mv:hover,.mv:focus-visible{background:rgba(201,162,74,.22);outline:none}
.mv:hover .mn{color:#7a1e16}.mv:hover::after{content:"!";position:absolute;right:10px;top:8px;font-family:var(--disp);font-weight:900;font-size:22px;color:var(--red)}
.mv.main{background:rgba(47,93,74,.14)}.mv.main .mn{font-size:24px}
#profile{flex:0 1 360px;display:flex;flex-direction:column;gap:12px;background:rgba(22,18,15,.8);border:1px solid var(--line);border-radius:6px;padding:14px;backdrop-filter:blur(8px)}
#rankLine{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
#rankLine .rt{font-family:var(--disp);font-weight:700;font-size:19px;color:var(--brass2)}
#rankLine .rr{font-size:12px;color:var(--dim)}
#ladderMini{display:flex;justify-content:space-between;font-size:34px;line-height:1;padding:6px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#ladderMini span{color:var(--ivory2);text-shadow:0 2px 6px #000;cursor:default;transition:transform .2s}
#ladderMini span:hover{transform:translateY(-4px);color:var(--brass2)}
#homeBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mb{font-family:var(--disp);font-weight:700;letter-spacing:.1em;font-size:13px;border:1px solid var(--line);background:linear-gradient(180deg,#2a221b,#1a1512);color:var(--ivory);padding:10px 12px;border-radius:4px;transition:border-color .15s,transform .1s}
.mb:hover{border-color:var(--brass);color:#fff}.mb:active{transform:translateY(1px)}
.mb.big{font-size:17px;padding:13px 16px}.mb.gold{background:linear-gradient(180deg,#e8c873,#b08a3a);color:#1a130b;border-color:#f3d98d}
.mb:disabled{opacity:.45;cursor:default}
#boot{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:var(--disp);letter-spacing:.3em;color:var(--brass);font-size:14px;transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}

/* style2.css - match HUD: crosshairs, hit markers, piece card, ladder, ability dials, feed, announcements, tags */
#hud{position:fixed;inset:0;z-index:20;pointer-events:none;font-family:var(--mono)}
#xhair{position:absolute;left:50%;top:50%;width:64px;height:64px;transform:translate(-50%,-50%)}
#xhair svg{width:100%;height:100%;stroke:#fff8e6;stroke-width:2;fill:#fff8e6;filter:drop-shadow(0 0 2px rgba(0,0,0,.9))}
#xhair svg path{fill:none}
#hitm{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%) rotate(45deg);opacity:0}
#hitm::before,#hitm::after{content:"";position:absolute;background:#fff;left:50%;top:0;width:3px;height:100%;margin-left:-1.5px;
  -webkit-mask:linear-gradient(#000 0 35%,transparent 35% 65%,#000 65%);mask:linear-gradient(#000 0 35%,transparent 35% 65%,#000 65%)}
#hitm::after{transform:rotate(90deg)}
#hitm.on{animation:hm .18s ease-out}#hitm.on.head::before,#hitm.on.head::after{background:var(--brass2)}
#hitm.on.kill{animation:hmk .42s ease-out}#hitm.on.kill::before,#hitm.on.kill::after{background:var(--red);width:4px}
@keyframes hm{0%{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) rotate(45deg) scale(1)}}
@keyframes hmk{0%{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(1.8)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(45deg) scale(1.1)}}
#dmgLayer,#tagLayer{position:absolute;inset:0;overflow:hidden}
.dn{position:absolute;left:0;top:0;font-family:var(--disp);font-weight:900;font-size:20px;color:#fff6dc;text-shadow:0 2px 0 #000,0 0 8px rgba(0,0,0,.8);white-space:nowrap}
.dn.head{color:var(--brass2);font-size:25px}.dn.kill{color:#ff8a7a;font-size:28px}.dn i{font-style:normal;color:var(--red);margin-left:2px}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;white-space:nowrap}
.tag .tn{padding:1px 6px;border-radius:3px;background:rgba(0,0,0,.55);color:#fff}
.tag.foe .tn{color:#ffb0a8}.tag.ally .tn{color:var(--blue)}.tag.king .tn{color:var(--brass2);border:1px solid var(--brass)}
.tag.wall .tn{opacity:.75;border:1px dashed currentColor}
.tag .th{width:46px;height:4px;background:rgba(0,0,0,.6);border-radius:2px;overflow:hidden}.tag .th i{display:block;height:100%;background:#ffb0a8}
.tag.ally .th i{background:var(--blue)}
#hTop{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:rgba(14,11,9,.78);backdrop-filter:blur(4px)}
#hTop>div{padding:6px 14px;font-weight:700;letter-spacing:.06em;white-space:nowrap;display:flex;align-items:center}
#hMode{font-family:var(--disp);font-size:12px;color:var(--brass2)}
#hClock{font-size:22px;background:#f1e7d0;color:#1a130e;font-variant-numeric:tabular-nums;min-width:86px;justify-content:center}
#hClock.low{background:var(--red);color:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
#hScore{font-size:13px;gap:8px}.tmw{color:#fff7e4}.tmb{color:#d7b56a}
#hScore .tmw{color:#1a130e;background:#f1e7d0;padding:1px 6px;border-radius:2px}#hScore .tmb{color:#f1e7d0;background:#14100d;border:1px solid var(--brass);padding:0 6px;border-radius:2px}
#feed{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;max-width:min(46vw,440px)}
.fr{background:rgba(14,11,9,.78);border:1px solid rgba(201,162,74,.2);border-radius:4px;padding:4px 9px;font-size:12.5px;text-align:right;transition:opacity .6s}
.fr.old{opacity:0}.fr.mine{border-color:var(--brass);background:rgba(40,30,18,.88)}.fr.mate{border-color:var(--red);background:rgba(90,20,16,.85)}
.fr b{font-weight:700}.fr b.me{color:var(--brass2)}.fr b.tmw{color:#fff}.fr b.tmb{color:#d7b56a}
.fr .fg{font-size:17px;vertical-align:-1px}.fr .nt{font-family:var(--mono);font-weight:700;color:#fff;margin:0 3px;font-style:italic;font-size:14px}
.fr .fx{font-size:10.5px;color:var(--dim);margin-top:1px}
#mini{position:absolute;top:12px;left:12px;width:132px;height:132px;border:2px solid var(--brass);border-radius:3px;background:rgba(0,0,0,.35)}
#hBL{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;width:min(330px,44vw)}
#hPiece{display:flex;align-items:center;gap:10px}
#hGlyph{font-size:54px;line-height:.9;color:var(--ivory);text-shadow:0 0 14px rgba(201,162,74,.5),0 3px 0 #000;width:52px;text-align:center}
#hName{font-family:var(--disp);font-weight:900;font-size:24px;letter-spacing:.08em;line-height:1;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.8)}
#hWeap{font-size:11.5px;color:var(--brass2);margin-top:3px;text-shadow:0 1px 2px #000,0 0 6px #000}
#hHp{position:relative;height:16px;background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:2px;overflow:hidden}
#hHpFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#efe3c6,#fff8e8);transition:width .12s}
#hHpFill.low{background:linear-gradient(90deg,#b8332a,#ff6a5a);animation:pulse .35s infinite alternate}
#hHpTxt{position:absolute;inset:0;font-size:11px;font-weight:700;color:#1a130e;display:flex;align-items:center;padding-left:6px;mix-blend-mode:difference;filter:invert(1)}
#ladder{display:flex;gap:3px}
.rung{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.5);border:1px solid rgba(201,162,74,.18);border-radius:3px;padding:2px 0 3px;opacity:.55}
.rung .g{font-size:20px;line-height:1}.rung .pips{display:flex;gap:2px;height:5px}
.rung .pips i{width:9px;height:5px;border-radius:1px;background:rgba(255,255,255,.2)}.rung .pips i.on{background:var(--brass2)}
.rung.done{opacity:.85;background:rgba(201,162,74,.22)}.rung.cur{opacity:1;border-color:var(--brass2);background:rgba(201,162,74,.12);transform:translateY(-3px)}
#hBR{position:absolute;right:14px;bottom:14px;display:flex;gap:10px;align-items:flex-end}
.abil{position:relative;width:92px;height:72px;border:1px solid var(--line);background:rgba(14,11,9,.8);border-radius:5px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:5px 6px}
.abK{position:absolute;top:4px;left:6px;font-weight:700;font-size:11px;color:var(--brass2);border:1px solid var(--brass);border-radius:3px;padding:0 4px}
.abN{font-family:var(--disp);font-weight:700;font-size:10.5px;line-height:1.1;letter-spacing:.04em;position:relative;z-index:2}
.abF{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom;z-index:1}
.abil::after{content:attr(data-cd);position:absolute;top:2px;right:7px;font-size:22px;font-weight:700;z-index:3;color:#fff}
.abil.ready{border-color:var(--brass2);box-shadow:0 0 14px rgba(232,200,115,.35)}.abil.special{border-color:var(--red);animation:pulse .4s infinite alternate}
#announce{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);text-align:center;opacity:0;white-space:nowrap}
#announce.on{animation:ann 2.3s ease-out forwards}#announce.on.count{animation:ann .9s ease-out forwards}
#announce .ab{font-family:var(--disp);font-weight:900;font-size:clamp(40px,7vw,86px);letter-spacing:.08em;color:var(--ivory);text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.8)}
#announce.gold .ab{color:var(--brass2);text-shadow:0 4px 0 #3a2a0c,0 0 40px rgba(232,200,115,.5)}
#announce .as{font-size:14px;color:#efe3c6;text-shadow:0 2px 4px #000;letter-spacing:.06em}
@keyframes ann{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}10%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#sub{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:rgba(14,11,9,.8);border:1px solid var(--line);padding:5px 12px;border-radius:4px;font-size:13px;opacity:0;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#sub.on{animation:subA 2.6s ease-out forwards}#sub b{font-family:var(--mono);font-style:italic;color:var(--brass2)}
@keyframes subA{0%{opacity:0;transform:translate(-50%,8px)}8%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
#dead{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse,rgba(60,10,8,.25),rgba(0,0,0,.55));gap:8px;text-align:center}
#deadT{font-family:var(--disp);font-weight:900;font-size:clamp(40px,8vw,80px);color:var(--red);letter-spacing:.12em;text-shadow:0 4px 0 #000}
#deadS{font-size:15px;line-height:1.5}#deadS b{color:var(--brass2)}#deadC{font-size:13px;color:var(--dim)}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(14,11,9,.92);border:1px solid var(--brass);border-radius:6px;padding:14px 18px;min-width:min(560px,94vw);max-height:80vh;overflow:auto}
#board .bt{font-family:var(--disp);font-weight:700;letter-spacing:.14em;color:var(--brass2);margin-bottom:6px}#board .bs{margin-bottom:6px;font-weight:700}
#board table{width:100%;border-collapse:collapse;font-size:13px}#board th{text-align:left;color:var(--dim);font-weight:600;padding:3px 6px;border-bottom:1px solid var(--line)}
#board td{padding:3px 6px}#board td.g{font-size:18px}#board tr.me td{color:var(--brass2);font-weight:700}#board i{color:var(--dim2);font-size:10px}
#lockHint{position:absolute;left:50%;top:60%;transform:translateX(-50%);font-family:var(--disp);font-weight:700;letter-spacing:.2em;background:rgba(0,0,0,.6);padding:8px 16px;border:1px solid var(--brass);border-radius:4px;animation:pulse .8s infinite alternate}
#scope{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0 28vmin,rgba(0,0,0,.82) 28.4vmin);}
#scope::before{content:"";position:absolute;left:50%;top:50%;width:56vmin;height:56vmin;transform:translate(-50%,-50%) rotate(45deg);
  background:linear-gradient(var(--red),var(--red)) center/1px 100% no-repeat,linear-gradient(var(--red),var(--red)) center/100% 1px no-repeat;opacity:.8}
#scope::after{content:"♝ DIAGONAL SIGHT";position:absolute;left:50%;top:calc(50% + 30vmin);transform:translateX(-50%);color:#b48cff;font-family:var(--disp);font-weight:700;letter-spacing:.2em;font-size:12px}
#hurt{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(190,20,10,.55) 100%)}
#fpsT{position:absolute;left:12px;top:12px;font-size:11px;color:var(--dim)}

/* style3.css - menus as tournament paperwork: setup, the study, online club, collection, stats, settings, results, promotion */
.panel{display:flex;flex-direction:column;align-items:center;padding:60px 16px 16px;background:rgba(10,8,6,.72);backdrop-filter:blur(3px);overflow-y:auto;overflow-x:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:980px;margin-bottom:12px}
.ph h2{font-family:var(--disp);font-weight:900;letter-spacing:.12em;font-size:clamp(17px,3vw,26px);text-align:center;color:var(--ivory)}
.ph span{min-width:80px;text-align:right;color:var(--brass2);font-weight:700}
.pb{width:100%;max-width:980px}
.card2{background:rgba(22,18,15,.9);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.card2 h3{font-family:var(--disp);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--brass2);margin-bottom:9px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:#1d1814;border-radius:4px;padding:9px 12px;text-align:left;min-width:120px;flex:1 1 140px}
.opt b{display:block;font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.05em}
.opt small{display:block;color:var(--dim);font-size:11px;margin-top:2px;line-height:1.35}

<script>
"use strict";
// ===== util.js =====
{
// util.js - FPCHESS namespace, small math helpers, seeded randomness, safe storage, chess notation helpers
const FC = window.FC = {};
FC.Q = new URLSearchParams(location.search);
FC.$ = id => document.getElementById(id);
FC.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
FC.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
FC.lerp = (a, b, t) => a + (b - a) * t;
FC.damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
FC.rand = (a, b) => a + Math.random() * (b - a);
FC.ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
FC.pick = arr => arr[Math.floor(Math.random() * arr.length)];
FC.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
FC.angWrap = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
FC.now = () => performance.now() / 1000;
FC.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
FC.fmtTime = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
FC.hex = n => '#' + n.toString(16).padStart(6, '0');

// mulberry32 seeded PRNG -> [0,1)
FC.rng = seed => {
  let a = seed >>> 0;
  const f = () => {
    a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.range = (lo, hi) => lo + f() * (hi - lo);
  f.int = n => Math.floor(f() * n);
  return f;
};

// localStorage, always wrapped: private windows and blocked storage just fall back to defaults
FC.store = {
  get(k, d) { try { const v = localStorage.getItem('fpchess.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fpchess.' + k, JSON.stringify(v)); } catch (e) { } },
  wipe() { try { Object.keys(localStorage).filter(k => k.startsWith('fpchess.')).forEach(k => localStorage.removeItem(k)); } catch (e) { } }
};

// tiny event bus
const subs = {};
FC.on = (n, f) => { (subs[n] = subs[n] || []).push(f); };
FC.fire = (n, a, b, c) => { (subs[n] || []).forEach(f => { try { f(a, b, c); } catch (e) { console.warn(e); } }); };

// board notation: maps a world position to a square on the current arena's 8x8 board
FC.FILES = 'abcdefgh';
FC.square = (x, z) => {
  const B = (FC.G && FC.G.map && FC.G.map.board) || { cx: 0, cz: 0, sq: 5 };
  const f = FC.clamp(Math.floor((x - B.cx) / B.sq + 4), 0, 7), r = FC.clamp(Math.floor((B.cz - z) / B.sq + 4), 0, 7);
  return FC.FILES[f] + (r + 1);
};

// reusable vectors (never hold on to them across calls)
FC.tmp = { v1: null, v2: null, v3: null };
FC.isTouch = () => matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
FC.toast = (msg, ms) => {
  const t = FC.$('toast'); if (!t) return; t.innerHTML = msg; t.classList.add('show');
  clearTimeout(FC._toastT); FC._toastT = setTimeout(() => t.classList.remove('show'), ms || 2200);
};

}

{

// h = height (m), r = body radius, eye = camera height, speed = run speed (m/s), need = kills to promote
FC.TIERS = [
  { id: 'pawn', name: 'Pawn', L: '', glyph: '♟', hp: 100, speed: 7.6, jump: 7.6, h: 1.5, r: 0.42, eye: 1.3, need: 2,

  { id: 'knight', name: 'Knight', L: 'N', glyph: '♞', hp: 120, speed: 8.4, jump: 8.4, h: 1.75, r: 0.46, eye: 1.5, need: 2,
    weapon: 'kick', ab: 'leap', ab2: null, accent: 0xe8a05a,
    blurb: 'The only piece that jumps. Horseshoe blunderbuss up close; L-LEAP hops two forward, one sideways, and stomps the landing.' },
  { id: 'bishop', name: 'Bishop', L: 'B', glyph: '♝', hp: 100, speed: 7.7, jump: 7.8, h: 1.95, r: 0.42, eye: 1.72, need: 2,
    weapon: 'rail', ab: 'sight', ab2: null, accent: 0xb48cff,
    blurb: 'Long diagonals. The Diagonal Lance pierces everything in a line; DIAGONAL SIGHT scopes in and sees through walls along your two diagonals.' },
  { id: 'rook', name: 'Rook', L: 'R', glyph: '♜', hp: 170, speed: 6.5, jump: 7.0, h: 1.85, r: 0.56, eye: 1.58, need: 2,
    weapon: 'cannon', ab: 'castle', ab2: null, accent: 0xff8a4a,
    blurb: 'A walking castle. Battlement Cannon fires splash shells; CASTLE drops a stone wall, press again to CASTLE: swap places with it.' },

    byTier: [0, 0, 0, 0, 0, 0] },

  unl: { classic: 1 }, seen: {},

FC.S = DEF();
FC.load = () => {
  if (FC.Q.has('reset')) FC.store.wipe();
  const d = FC.store.get('save', null), S = DEF();

    for (const k of ['name', 'skin', 'side']) if (d[k] != null) S[k] = d[k];

};

FC.checkUnlocks = () => {

// audio.js - WebAudio core: context, master/music/sfx buses, synth helpers and cheap positional panning

    A.musBus = c.createGain(); A.musBus.connect(A.master);

    A.verb = c.createConvolver(); const len = c.sampleRate * 1.6, ir = c.createBuffer(2, len, c.sampleRate);

    const nb = A.noiseBuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), nd = nb.getChannelData(0);

{
// net1.js - ONLINE CLUB over WebRTC (PeerJS 1.5.4 from cdnjs, loaded only when you open it, so offline play never needs it).
// The PeerJS broker only introduces browsers; then it is peer-to-peer. HOST-AUTHORITATIVE: guests simulate their own
// piece and send its state + shots; the host runs bots, hits, captures and promotions and streams snapshots ~20x a second.
// Rooms: 5-char codes, invite link ?room=CODE, peer ids prefixed kaifun-fpchess-. Only the chosen name is sent.
const PEERJS = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
const PEERSRI = 'sha512-iFU+yF1keEaLDC9HEwPfLMSRaS0unBHE14GEgx6pQKJXjp5v0tvX8xpfp2lgJ62XEjbYp/M5C3CAmej/PWXMyA==';
const PREFIX = 'kaifun-fpchess-', ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', MAXP = 8;
const N = FC.Net = { peer: null, conn: null, conns: [], host: false, live: false, code: '', phase: 'idle', myId: 0, H: {}, last: 0, rtt: 0, cfg: null };
const $ = FC.$, pnow = () => performance.now();

    : t === 'browser-incompatible' ? 'This browser can\'t do peer-to-peer play.' : t === 'unavailable-id' ? 'That room code is taken — try again.' : 'Connection problem: ' + (t || (e && e.message) || 'unknown'); };

{
// net3.js - in-match sync: guest state + shots + actions up, host snapshots + events + others' shots down, smoothing
const N = FC.Net, H = N.H;

// a shot by a local piece: guests tell the host; the host tells everyone (except whoever fired it)
N.shot = (p, o, d, seed, w) => {
  const m = { t: 'f', id: p.id, o: [r2(o.x), r2(o.y), r2(o.z)], d: [r3(d.x), r3(d.y), r3(d.z)], s: seed, w };
  if (N.host) N.all(m, connOf(p.id)); else if (p === FC.G.me) N.send(m);
};
N.act = (p, ev) => { const m = { t: 'act', id: p.id, ev }; if (N.host) N.all(m, connOf(p.id)); else if (p === FC.G.me) N.send(m); };
N.event = (ev) => N.all({ t: 'ev', e: ev });

  const G = FC.G; if (!G || N.phase !== 'game') return; const p = G.byId[m.id]; if (!p || (g && g.id !== p.id) || p === G.me) return;

};
H.act = (m, g) => {

{
// tile.js - renders the 1640x820 home-page tile (used by make_tile.py via ?tile): the word FPCHESS built from
// marble chessboard blocks, the promotion ladder standing on top of the letters, and a crosshair over the C. No other text.
const Tl = FC.Tile = {};
const FONT = {
  F: ['####', '#...', '#...', '###.', '#...', '#...', '#...', '#...'], P: ['###.', '#..#', '#..#', '###.', '#...', '#...', '#...', '#...'],

  s.add(key); s.add(key.target);

{
// main.js - boot: load the save, start WebGL, wire the menus, then run either the home diorama or the match each frame
FC.frame = (dt) => {
  const G = FC.G, UI = FC.UI, R = FC.R;
  if (G && (UI.screen === 'game' || UI.screen === 'settings')) {
    const online = FC.Net && FC.Net.live;
    if (!UI.paused || online) FC.Game.update(dt);
    else FC.FX.updateDom(0);
    if (!FC.G) return;
    FC.HUD.update(dt);
    R.draw(R.scene);
    if (FC.G.me && FC.G.me.alive && !FC.G.spec) FC.VM.render(R.renderer);
  } else {
    FC.Title.update(dt); FC.Title.render();
  }
};
function fatal(msg) {
  const b = FC.$('boot'); b.classList.remove('gone'); b.style.flexDirection = 'column'; b.style.gap = '14px'; b.style.padding = '20px'; b.style.textAlign = 'center';
  b.innerHTML = '<div>' + msg + '</div><a href="index.html" style="color:#e8c873">← Kai.fun</a>';
}
function boot() {
  FC.load();
  if (!window.THREE) return fatal('FPCHESS needs Three.js from cdnjs, which did not load.<br>Check your connection and refresh.');
  if (!FC.R.init()) return fatal('Your browser could not start WebGL, which FPCHESS needs for its 3D board.');
  FC.checkUnlocks();
  if (FC.Q.has('tile')) { window.FPCHESS = true; FC.$('boot').classList.add('gone'); FC.$('home').classList.add('hide'); FC.$('top').classList.add('hide'); return; }
  FC.Title.build(); FC.Touch.init(); FC.UI.wire();
  FC.UI.show('home');
  document.body.classList.toggle('touch', FC.isTouch());
  const unlockOnce = () => { FC.A.unlock(); if (FC.A.ok && !FC.M.cur) FC.M.play(FC.UI.screen === 'game' ? 'battle' : 'menu'); };
  addEventListener('pointerdown', unlockOnce); addEventListener('keydown', unlockOnce);
  requestAnimationFrame(FC.R.loop);
  setTimeout(() => FC.$('boot').classList.add('gone'), 150);
  const room = FC.Q.get('room'); if (room) setTimeout(() => FC.Net.open(room), 300);
  addEventListener('beforeunload', () => { if (FC.Net && FC.Net.live) FC.Net.leave(); });
  window.FPCHESS = true;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

}
</script>
