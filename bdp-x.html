<!doctype html>
<html lang="en" data-bdp-off>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locked · Kai.fun</title>
<meta name="theme-color" content="#03080a">
<script src="bdp.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#03080a;--ink:#e8f1ee;--mut:#86a6a3;--dim:#4f6e6c;
  --steel:#0d262b;--steel2:#153a41;--edge:#22545c;
  --brass:#c9a04a;--brass2:#f2d283;--gold:#ffcd45;--red:#ff3b4f;--cyan:#58e6ff;--green:#5dffa0;
  --disp:'Bebas Neue',Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Bold',sans-serif;
  --ui:'Chakra Petch',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--ui);overflow-x:hidden;
  background:radial-gradient(130% 75% at 50% -5%,#0f2b30 0%,#071518 45%,#03080a 100%) fixed}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.home{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:40;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;color:var(--mut);text-decoration:none;font:600 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;background:rgba(4,14,16,.72);border:1px solid rgba(201,160,74,.2)}
.home:hover,.home:focus-visible{color:var(--brass2);border-color:rgba(242,210,131,.6);outline:none}

/* ================= the gate ================= */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:72px 16px 36px;text-align:center;overflow:hidden}
.vault{position:relative;width:min(80vw,50vh,430px);aspect-ratio:1;perspective:1500px;flex:none}
.vault>svg,.door>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.door{position:absolute;inset:0;transform-origin:7% 50%;transition:transform 1.3s cubic-bezier(.6,.02,.3,1),filter 1.3s}
.vault.swing .door{transform:rotateY(-116deg);filter:brightness(.55)}
.wheel,.dial{transform-box:fill-box;transform-origin:50% 50%}
.vault.spin .wheel{animation:wheel 1.35s cubic-bezier(.65,0,.3,1) forwards}
.vault.spin .dial{animation:dial 1.35s cubic-bezier(.65,0,.3,1) forwards}
@keyframes wheel{to{transform:rotate(540deg)}}
@keyframes dial{to{transform:rotate(-900deg)}}
.bolt{transition:transform .38s cubic-bezier(.7,0,.4,1)}
.vault.unbolt .bolt{transform:translateY(30px)}
.vault .inner{opacity:.0;transition:opacity .9s}
.vault.swing .inner{opacity:1}
.vault.enter{animation:enter .9s cubic-bezier(.6,0,.5,1) forwards}
@keyframes enter{to{transform:scale(3.4);opacity:0;filter:brightness(1.8)}}
.vault .lampc{animation:lamp 1.4s steps(1) infinite}
@keyframes lamp{50%{opacity:.35}}
.gt h1{margin:0;font:400 clamp(66px,13vw,124px)/.82 var(--disp);letter-spacing:.07em;color:#d6e2df;text-shadow:0 3px 0 #000,0 0 50px rgba(255,59,79,.22)}
.gt .sub{margin:12px 0 0;font:700 clamp(14px,2.4vw,18px)/1.3 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--brass2)}
.gt .cnt{margin:8px 0 0;color:var(--mut);font-size:14px;letter-spacing:.04em}
.gt .back{display:inline-flex;align-items:center;min-height:46px;margin-top:20px;padding:0 22px;border:1px solid rgba(242,210,131,.38);border-radius:999px;color:var(--brass2);text-decoration:none;font-weight:600;letter-spacing:.08em;background:rgba(201,160,74,.06)}
.gt .back:hover,.gt .back:focus-visible{background:rgba(201,160,74,.16);outline:none}
.gate.unl h1{color:#f6e4ae;text-shadow:0 3px 0 #000,0 0 60px rgba(255,205,69,.35)}
.gate .gopen{display:none;margin-top:18px}
.gate.unl .gopen{display:inline-flex}
.gate.unl .back{display:none}
.gate.going .gt{opacity:0;transform:translateY(16px);transition:.5s}

/* ================= shared buttons ================= */
.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border:0;border-radius:14px;font:400 26px/1 var(--disp);letter-spacing:.12em;color:#1d1405;
  background:linear-gradient(180deg,#ffe596 0%,#f4c34c 48%,#c98f1f 100%);box-shadow:0 1px 0 #fff4c9 inset,0 -3px 0 #8c5e10 inset,0 10px 30px rgba(255,190,60,.25),0 2px 0 #000;transition:transform .12s,filter .12s}
.big:hover{filter:brightness(1.07);transform:translateY(-1px)}
.big:active{transform:translateY(1px)}
.big:focus-visible{outline:3px solid #fff3c4;outline-offset:3px}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;font:400 21px/1 var(--disp);letter-spacing:.12em;color:var(--brass2);background:rgba(201,160,74,.07);border:1px solid rgba(242,210,131,.35)}
.ghost:hover,.ghost:focus-visible{background:rgba(201,160,74,.18);outline:none}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 1px 0 #fff4c9 inset,0 -3px 0 #8c5e10 inset,0 0 46px rgba(255,205,69,.6),0 2px 0 #000}}

/* ================= app ================= */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;animation:appin .7s ease both}
@keyframes appin{from{opacity:0}}
.tools{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:40;display:flex;gap:8px}
.tbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid rgba(201,160,74,.22);background:rgba(4,14,16,.72);color:var(--mut);padding:0}
.tbtn:hover,.tbtn:focus-visible{color:var(--brass2);border-color:rgba(242,210,131,.6);outline:none}
.tbtn svg{width:20px;height:20px}
.tbtn[hidden]{display:none}
.scr{display:none;width:100%;flex:1;flex-direction:column;align-items:center}
.scr.on{display:flex}

/* title */
.title{justify-content:center;text-align:center;padding:70px 16px 28px;gap:0}
.kick{font:700 12px/1.2 var(--ui);letter-spacing:.32em;color:var(--brass);text-transform:uppercase}
.logo{margin:6px 0 0;font:400 clamp(84px,17vw,176px)/.8 var(--disp);letter-spacing:.04em;
  background:linear-gradient(180deg,#fff6cf 0%,#ffd768 38%,#e09b25 62%,#8e5a12 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #1a0f02) drop-shadow(0 0 40px rgba(255,190,60,.25))}
.tag{max-width:520px;margin:14px auto 0;color:#bcd0cd;font-size:clamp(15px,2vw,17px);line-height:1.5}
#hero{display:block;width:min(420px,86vw);height:auto;aspect-ratio:21/8;margin:12px auto 4px}
.acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.bestl{margin-top:16px;min-height:20px;color:var(--mut);font-size:14px;letter-spacing:.04em}
.bestl b{color:var(--brass2);font-weight:600}
.ctl{margin-top:8px;color:var(--dim);font-size:13px;letter-spacing:.05em}
.bdl{margin-top:14px;display:inline-flex;align-items:center;min-height:40px;color:var(--mut);font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid transparent}
.bdl:hover{color:var(--brass2)}

/* select */
.sel{padding:74px 16px 30px;gap:18px;justify-content:center}
.sel h2{margin:0;font:400 clamp(40px,7vw,60px)/.9 var(--disp);letter-spacing:.08em;color:#f3dfa6}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(880px,100%)}
.card{position:relative;text-align:left;min-height:118px;padding:14px 14px 12px;border-radius:14px;border:1px solid rgba(88,160,170,.22);background:linear-gradient(180deg,rgba(22,58,65,.75),rgba(9,27,31,.85));display:flex;flex-direction:column;gap:4px;overflow:hidden}
.card:hover:not(:disabled),.card:focus-visible{border-color:rgba(242,210,131,.7);outline:none;transform:translateY(-2px)}
.card .n{font:400 40px/.8 var(--disp);color:rgba(242,210,131,.9)}
.card .nm{font:400 21px/1 var(--disp);letter-spacing:.06em;color:#e6efec}
.card .tg{font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.card .gd{margin-top:auto;font-size:13px;color:var(--gold);font-weight:600}
.card:disabled{cursor:not-allowed;opacity:.5;background:repeating-linear-gradient(135deg,rgba(255,255,255,.02) 0 10px,transparent 10px 20px),rgba(7,18,21,.9)}
.card:disabled .nm{color:var(--dim)}
.card .lk{position:absolute;right:12px;top:12px;width:22px;height:22px;color:var(--dim)}
.card .th{position:absolute;right:10px;top:10px;width:75px;height:55px;border-radius:5px;opacity:.85;box-shadow:0 0 0 1px rgba(201,160,74,.3)}
.card .nm,.card .tg,.card .gd{position:relative;max-width:100%}
.card .n{margin-bottom:8px}

/* play */
.play{padding:62px 8px 8px;gap:6px;height:100vh;height:100dvh;min-height:0}
.hud{width:100%;max-width:var(--fw,820px);display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 2px}
.rm{display:flex;flex-direction:column;min-width:0}
.rm span{font:700 11px/1.2 var(--ui);letter-spacing:.3em;color:var(--brass)}
.rm b{font:400 clamp(22px,3.4vw,34px)/.95 var(--disp);letter-spacing:.06em;color:#f2e6c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;gap:6px;flex:none}
.pill{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:9px;background:rgba(5,16,19,.8);border:1px solid rgba(88,160,170,.2);font:600 14px/1 var(--ui);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{font-size:10px;letter-spacing:.2em;color:var(--mut)}
.pill.g{color:var(--gold)}
.ingot{width:16px;height:9px;background:linear-gradient(180deg,#fff0b0,#f5bf3c 55%,#a8700f);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.tip{width:100%;max-width:var(--fw,820px);min-height:20px;color:#a9c3c0;font-size:14px;line-height:1.35;padding:0 2px}
.tip b{color:#fff;font-weight:600}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.frame{position:relative;border-radius:10px;padding:5px;background:linear-gradient(180deg,#d8b25c,#7d5a1c 50%,#c39a44);box-shadow:0 0 0 1px #000,0 18px 60px rgba(0,0,0,.6),0 0 80px rgba(80,200,210,.07)}
.frame canvas{display:block;border-radius:6px;background:#061316}
.ov{position:absolute;inset:5px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
.ov.on{opacity:1}
.splash .k{font:700 13px/1 var(--ui);letter-spacing:.4em;color:var(--brass2);text-shadow:0 2px 6px #000}
.splash .h{font:400 clamp(38px,8vw,78px)/.9 var(--disp);letter-spacing:.05em;color:#fff;text-shadow:0 4px 0 #000,0 0 30px rgba(0,0,0,.8);margin-top:6px}
.splash.on .h{animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
.splash.red .h{color:#ff5466}
.splash.grn .h{color:var(--green)}
@keyframes slam{from{transform:scale(1.8);opacity:0}}
.bust{background:radial-gradient(closest-side,rgba(0,0,0,.25),rgba(120,0,20,.55));}
.bust.on{animation:police .5s steps(1) 4}
@keyframes police{0%{box-shadow:inset 0 0 0 6px var(--red),inset 0 0 80px rgba(255,40,60,.6)}50%{box-shadow:inset 0 0 0 6px #3d7bff,inset 0 0 80px rgba(60,120,255,.6)}}
.bust .stamp{font:400 clamp(56px,12vw,120px)/.85 var(--disp);letter-spacing:.06em;color:#ff4258;padding:6px 18px 0;border:6px solid #ff4258;border-radius:12px;transform:rotate(-8deg);text-shadow:0 0 24px rgba(255,40,60,.5);background:rgba(20,0,4,.45)}
.bust.on .stamp{animation:stamp .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}}
.bust .why{margin-top:18px;font:400 clamp(24px,4vw,36px)/1 var(--disp);letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 #000}
.bust .joke{margin-top:6px;max-width:80%;font-size:clamp(13px,2vw,16px);color:#ffd9dd;text-shadow:0 1px 3px #000}
.clear{background:rgba(2,8,10,.72);pointer-events:none}
.clear.on{pointer-events:auto}
.clear .box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 26px;border-radius:16px;background:linear-gradient(180deg,#123137,#08191c);border:1px solid rgba(242,210,131,.45);box-shadow:0 20px 50px rgba(0,0,0,.6);max-width:92%}
.clear .k{font:700 12px/1 var(--ui);letter-spacing:.36em;color:var(--green);text-transform:uppercase}
.clear .h{font:400 clamp(34px,6vw,54px)/.9 var(--disp);letter-spacing:.05em;color:#fff}
.clear .row{display:flex;gap:18px;margin:6px 0 10px;color:#cfe0dd;font-size:15px;font-variant-numeric:tabular-nums}
.clear .row b{color:var(--gold)}
.clear .big{min-height:50px;font-size:23px}
.esc{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:6px 16px 4px;border-radius:999px;background:rgba(40,0,6,.82);border:2px solid var(--red);color:#fff;font:400 26px/1 var(--disp);letter-spacing:.1em;pointer-events:none;box-shadow:0 0 30px rgba(255,40,60,.5);font-variant-numeric:tabular-nums}
.esc.on{display:flex;animation:escp .5s steps(1) infinite}
.esc b{color:#ffd0d6;font-weight:400}
.esc.hurry b{color:#fff}
@keyframes escp{50%{border-color:#ffd0d6}}
.dpad{display:none;flex:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:4px;margin:2px 0 max(4px,env(safe-area-inset-bottom));touch-action:none;user-select:none;-webkit-user-select:none}
.touch .dpad{display:grid}
.dpad button{border:1px solid rgba(201,160,74,.35);background:linear-gradient(180deg,#173b42,#0b2226);border-radius:12px;display:grid;place-items:center;padding:0;color:var(--brass2);touch-action:none;box-shadow:0 3px 0 #000}
.dpad button:active,.dpad button.on{background:linear-gradient(180deg,#2c5a62,#143a41);transform:translateY(2px);box-shadow:0 1px 0 #000}
.dpad svg{width:24px;height:24px}
.dpad .up{grid-column:2;grid-row:1}.dpad .lf{grid-column:1;grid-row:2}.dpad .rt{grid-column:3;grid-row:2}.dpad .dn{grid-column:2;grid-row:3}
.dpad .mid{grid-column:2;grid-row:2;border-radius:50%;margin:8px;background:radial-gradient(circle at 40% 35%,#2a2010,#0b0905);border-color:rgba(201,160,74,.25);box-shadow:none}
.keys{flex:none;color:var(--dim);font-size:12px;letter-spacing:.08em;padding:2px 0 4px}
.touch .keys{display:none}

/* end */
.end{padding:58px 16px 24px;text-align:center;justify-content:center;gap:0;overflow:hidden;position:relative}
.end .logo{font-size:clamp(46px,8vw,78px)}
.billw{position:relative;width:min(600px,94vw,calc((100vh - 430px) * 2.36));min-width:min(300px,94vw);margin:14px auto 0;filter:drop-shadow(0 22px 40px rgba(0,0,0,.6)) drop-shadow(0 0 60px rgba(255,205,69,.25));animation:billin 1.1s cubic-bezier(.2,1.3,.4,1) both .2s}
@keyframes billin{from{transform:translateY(40px) rotate(-6deg) scale(.7);opacity:0}}
.billw svg{display:block;width:100%;height:auto}
.billw:after{content:'';position:absolute;inset:0;border-radius:8px;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 48%,transparent 60%);background-size:250% 100%;mix-blend-mode:soft-light;animation:sheen 3.2s ease-in-out infinite 1.2s;pointer-events:none}
@keyframes sheen{from{background-position:130% 0}to{background-position:-60% 0}}
.stats{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);margin-top:16px;flex-wrap:wrap}
.stat{min-width:96px;padding:8px 14px 6px;border-radius:12px;background:#061417;border:1px solid rgba(88,160,170,.22)}
.stat small{display:block;font:700 11px/1 var(--ui);letter-spacing:.3em;color:var(--mut)}
.stat b{display:block;margin-top:5px;font:400 30px/1 var(--disp);letter-spacing:.05em;color:#fff;font-variant-numeric:tabular-nums}
.stat.g b{color:var(--gold)}
.rank{margin-top:12px;display:flex;flex-direction:column;align-items:center}
.rank small{font:700 11px/1 var(--ui);letter-spacing:.4em;color:var(--brass)}
.rank b{margin-top:2px;font:400 clamp(44px,7vw,64px)/.9 var(--disp);letter-spacing:.06em;color:var(--gold);text-shadow:0 3px 0 #3a2400,0 0 34px rgba(255,205,69,.4)}
.rank em{margin-top:6px;font:700 12px/1 var(--ui);font-style:normal;letter-spacing:.3em;color:#1d1405;background:var(--green);padding:5px 10px;border-radius:999px;display:none}
.rank em.on{display:inline-block}
.ladder{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px auto 14px;max-width:600px}
.ladder span{font-size:12px;letter-spacing:.08em;padding:5px 9px;border-radius:999px;border:1px solid rgba(88,160,170,.22);color:var(--dim);background:#050f11}
.ladder span.me{color:#1d1405;background:var(--gold);border-color:var(--gold);font-weight:700}
.ladder span.got{color:var(--mut)}
.ebest{margin-top:10px;color:var(--mut);font-size:13px}
.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.end>*:not(.rain){position:relative;z-index:1}
.rain i{position:absolute;top:-40px;width:26px;height:12px;border-radius:2px;background:linear-gradient(180deg,#e9efd2,#b9d0a3);box-shadow:inset 0 0 0 1.5px #2d6a44;opacity:.85;animation:fall linear forwards}
.rain i.au{width:18px;height:10px;border-radius:1px;background:linear-gradient(180deg,#fff0b0,#f5bf3c 55%,#a8700f);box-shadow:none;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

@media (max-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{min-height:104px}
  .card .th{width:54px;height:40px;right:8px;top:8px}
  .play{padding-top:58px}
  .pill{height:30px;padding:0 8px;font-size:13px}
  .pill small{display:none}
  .tip{font-size:13px}
}
.sir{display:none;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}
@media (max-width:760px){.sir{display:block}}
@media (max-width:360px){.st .bs{display:none}}
@media (prefers-reduced-motion:reduce){
  .billw:after,.pulse,.esc.on{animation:none}
}
</style>
</head>
<body>
<a class="home" href="index.html">← Kai.fun</a>

<main class="gate" id="gate">
  <div class="vault" id="vault" aria-hidden="true">
    <svg viewBox="0 0 400 400">
      <defs>
        <radialGradient id="gFrame" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#1d4148"/><stop offset=".7" stop-color="#0d262b"/><stop offset="1" stop-color="#061214"/></radialGradient>
        <radialGradient id="gHole" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff2b8"/><stop offset=".35" stop-color="#f3b844"/><stop offset=".75" stop-color="#6d430b"/><stop offset="1" stop-color="#140c03"/></radialGradient>
        <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c0"/><stop offset=".5" stop-color="#f2bd3e"/><stop offset="1" stop-color="#9a650d"/></linearGradient>
      </defs>
      <circle cx="200" cy="200" r="198" fill="#020607"/>
      <circle cx="200" cy="200" r="194" fill="url(#gFrame)" stroke="#2b5a61" stroke-width="2"/>
      <g fill="#0a1d21" stroke="#2f646c" stroke-width="1.5">
        <circle cx="200" cy="22" r="5"/><circle cx="378" cy="200" r="5"/><circle cx="200" cy="378" r="5"/><circle cx="22" cy="200" r="5"/>
        <circle cx="326" cy="74" r="5"/><circle cx="326" cy="326" r="5"/><circle cx="74" cy="326" r="5"/><circle cx="74" cy="74" r="5"/>
      </g>
      <circle cx="200" cy="200" r="176" fill="#020506"/>
      <g class="inner">
        <circle cx="200" cy="200" r="172" fill="url(#gHole)"/>

  /* ---------- main loop ---------- */
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(.1, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
    if (mode === 'title') { drawHero(now); return; }
    if (mode !== 'play') return;
    if (!manual && phase === 'play' && S.st === 0) {
      acc += dt; let n = 0;
      while (acc >= 1 / TPS && n < 8) { acc -= 1 / TPS; n++; gameTick(); if (phase !== 'play') { acc = 0; break; } }
      if (n >= 8) acc = 0;
    } else acc = 0;
    if (mode === 'play') { render(now, dt); if (phase === 'play') hud(); }
  }

  /* ---------- test hooks (deterministic stepping) ---------- */
  window.__vault = {
    get state() { return { mode, phase, li, rot: view.rot, T: view.T, s: Object.assign({}, S, { cause: S.cause }), run: run && Object.assign({}, run), best, prog }; },
    manual(on) { manual = !!on; acc = 0; },
    tick(n) { for (let i = 0; i < n; i++) { if (mode !== 'play' || phase !== 'play' || S.st) break; gameTick(); } hud(); return { t: S.t, x: S.x, y: S.y, st: S.st, phase }; },
    render() { render(performance.now(), 0); },
    start(i) { if (!run) run = newRun(); run.room = i; startRoom(i); },
    toMap, toScr
  };

  show('title');
  requestAnimationFrame(t => { lastNow = t; frame(t); });
}
